title: "SETTLED: Architecting Payments and Revenue Infrastructure"
description: "How payment and revenue infrastructure is actually built: how a payment is authorized, cleared, settled, recorded, paid out and disputed; how the APIs, ledgers, vaults, risk systems and billing engines behind it work; and where Stripe and Adyen made different architectural bets, and why. Written for engineers and architects new to payments, with a fictional running example and dated public evidence. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."

ai_credit: "AI-assisted: researched and written with Claude Code; illustrations generated with Gemini. [How this works](https://zeljkoobrenovic.github.io/book-factory/foundations/ai-mediated-authoring.html)"

