title: "Architecting Product & Tech Organizations"
description: "How CTOs, CPOs and engineering and product leaders design, build, scale and change a product and technology organization, applying system design and product thinking to the organization itself. As a system it has teams as components, contracts and rituals as interfaces, work, information and decisions as flows, and attention, judgment and verification as the scarce capacities; as a product it has users, owes them outcomes and is changed through discovery and a roadmap. The book also shows how AI moves the constraint. Built on Will Larson's engineering leadership models and on Build What Matters, with one fictional company followed from 12 to 1,100 people. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."

ai_credit: "AI-assisted: written with Claude Code. [How this works](https://zeljkoobrenovic.github.io/book-factory/foundations/ai-mediated-authoring.html)"

