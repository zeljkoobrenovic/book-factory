<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookshelf</title>
    <style>
        body {
            font-family: Vollkorn, Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
        }

        .group {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: #f8f8f8;
        }

        a {
            text-decoration: none;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

        body {
            margin: 40px;
            text-align: center;
        }

        ::placeholder {
            color: lightgrey;
            opacity: 1;
        }

        :-ms-input-placeholder {
            color: lightgrey;
        }

        ::-ms-input-placeholder {
            color: lightgrey;
        }
    </style>
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Lato">
</head>
<body>

<div id="content"></div>

<script>
    const data = {"bookshelf": [{"category": "IT Architecture", "books": [{"title": "The Software Architect Elevator: Redefining the Architect's Role", "authors": ["Gregor Hohpe"], "description": "Defines architects as people who bridge the gap in large enterprises: they work with technical staff and convey technical topics to upper management, while translating business strategy into supporting technical decisions.", "cover": "covers/software-architecture-elevator.webp", "resources": [{"label": "summary", "url": "https://obren.io/tools/catalogs/index.html?id=it-37-things"}, {"label": "reading notes", "url": "https://obren.io/tools/reading-notes-pro/notes/The%20Software%20Architect%20Elevator_%20Redefining%20the%20Architect's%20Role%20in%20the%20Digital%20Enterprise-Notebook.pdf"}]}, {"title": "Software Architecture for Developers", "authors": ["Simon Brown"], "description": "A practical, pragmatic, and lightweight software architecture guide specifically aimed at software developers.", "cover": "covers/for-developers.png", "resources": [{"label": "website", "url": "https://softwarearchitecturefordevelopers.com/"}]}, {"title": "Software Architecture: The Hard Parts", "authors": [], "description": "A narrative about a team breaking down an old monolithic application into microservices, with practical trade-off analysis for refactoring a large monolith.", "cover": "covers/hard-parts.jpg", "resources": []}, {"title": "Just Enough Software Architecture", "authors": ["George Fairbanks"], "description": "An approachable and comprehensive book on software architecture.", "cover": "covers/just-enough-software-architecture.jpeg", "resources": []}, {"title": "Software Systems Architecture", "authors": ["Nick", "E\u00f3in"], "description": "A practitioner-oriented guide to designing and implementing effective architectures for information systems.", "cover": "covers/ssa.jpeg", "resources": []}, {"title": "Fundamentals of Software Architecture", "authors": ["Neal", "Mark"], "description": "Covers people skills, modularity, component-based thinking, and architectural styles.", "cover": "covers/fundamentals-of-software-architecture.jpeg", "resources": [{"label": "website", "url": "http://fundamentalsofsoftwarearchitecture.com/images.html"}]}, {"title": "Enterprise Integration Patterns", "authors": [], "description": "Guidance for connecting systems without coupling them too tightly.", "cover": "covers/eip.webp", "resources": [{"label": "website", "url": "https://www.enterpriseintegrationpatterns.com/patterns/messaging/index.html"}]}, {"title": "Pattern-Oriented Software Architecture", "authors": [], "description": "One of the most comprehensive references for distributed system design.", "cover": "covers/pattern-oriented-software-architecture.jpeg", "resources": []}, {"title": "Building Evolutionary Architectures", "authors": [], "description": "Explains how fitness functions can guide architectural change over time.", "cover": "covers/evolutionary-achitectures.jpeg", "resources": []}, {"title": "Domain-Driven Design", "authors": ["Eric Evans"], "description": "Promotes building a Ubiquitous Language that embeds domain terminology into software, with models defined and evolved over a product's life.", "cover": "covers/ddd.png", "resources": []}, {"title": "Thinking in Systems", "authors": ["Donella Meadows"], "description": "A system is more than the sum of its parts and may exhibit adaptive, dynamic, goal-seeking, self-preserving, and evolutionary behavior.", "cover": "covers/thinking-in-systems.png", "resources": [{"label": "reading notes", "url": "https://obren.io/tools/reading-notes-pro/notes/Thinking%20in%20Systems_%20International%20%20Bestseller-Notebook.pdf"}]}]}, {"category": "Foundations", "books": [{"title": "Design Patterns", "authors": ["Gamma", "Helm", "Johnson", "Vlissides"], "description": "Design patterns help make balanced decisions on code design.", "cover": "covers/design-patterns.webp", "resources": [{"label": "summary", "url": "https://refactoring.guru/design-patterns/catalog"}]}, {"title": "Clean Code", "authors": ["Bob Martin"], "description": "Good software starts with good code, emphasizing naming, single-purpose functions, and formatting.", "cover": "covers/clean-code.jpeg", "resources": [{"label": "summary", "url": "https://gist.github.com/wojteklu/73c6914cc446146b8b533c0988cf8d29"}]}, {"title": "Refactoring: Improving the Design of Existing Code", "authors": ["Martin Fowler"], "description": "A disciplined technique for restructuring existing code by altering its internal structure without changing external behavior.", "cover": "covers/refactoring.jpeg", "resources": [{"label": "website", "url": "https://refactoring.com/"}]}]}, {"category": "Special", "books": [{"title": "Building Microservices (2nd Edition)", "authors": ["Sam Newman"], "description": "Architectural trade-offs and considerations in distributed system design.", "cover": "covers/building-microservices.webp", "resources": []}, {"title": "Release It! (2nd Edition)", "authors": ["Mike Nygard"], "description": "Architecture stability decisions and building 'cynical' software; stability patterns and foundational production knowledge.", "cover": "covers/release-it.jpg", "resources": []}, {"title": "Designing Data Intensive Systems", "authors": ["Martin Kleppmann"], "description": "A mini-encyclopedia of modern data engineering: replication, partitioning, transactions, event logs, and more.", "cover": "covers/data-intensive.png", "resources": []}, {"title": "Don't make me think, revisited: a common sense approach to Web usability", "authors": ["Steve Krug"], "description": "A practical guide for understanding web usability and user experience.", "cover": "covers/do-not-make-me-think.webp", "resources": [{"label": "review", "url": "https://www.smallbizgeek.co.uk/dont-make-me-think-revisited-steve-krug-book-review/"}]}]}, {"category": "System Design Interviews", "books": [{"title": "System Design Interview (Volume 1 & 2)", "authors": ["Alex Xu"], "description": "Strengthen your systems design muscle for day-to-day architectural work, not just interview prep.", "cover": "covers/system-design-1.jpeg", "resources": [{"label": "summary", "url": "https://blog.pragmaticengineer.com/system-design-interview-an-insiders-guide-review/"}]}]}, {"category": "Organization and Processes", "books": [{"title": "Accelerate", "authors": [], "description": "If you want to move faster, you need to accelerate\u2014the second derivative of position.", "cover": "covers/accelerate.jpeg", "resources": [{"label": "summary", "url": "https://obren.io/tools/catalogs/?id=design-tactics-high-performing-technology-organizations"}]}, {"title": "The Phoenix Project (and The Unicorn Project)", "authors": ["Gene Kim"], "description": "A best-selling novel about DevOps; emphasizes security-first thinking and breaking down silos between development and operations.", "cover": "covers/the-phoenix-project.jpeg", "resources": []}, {"title": "Continuous Delivery", "authors": [], "description": "Through automation of build, deployment, and testing, and improved collaboration, teams can release changes in hours or minutes.", "cover": "covers/cd.jpeg", "resources": []}]}]};

    function update() {
        let html = '';

        const filteredData = data.bookshelf; // data.filter(item => !filter || item.title.toLowerCase().includes(filter))

        filteredData.forEach(section => {
            html += '<div class="group">';
            html += '<div>' + section.category + '</div>';
            section.books.forEach(item => {
                const description = item.title + '\n\n' + (item.description ? item.description : '');

                html += '<div class="group" title="' + description + '">';
                html += '<table>';
                html += '<tr>';
                html += '<td>';
                if (item.link) {
                    html += '<a target="_blank" href="' + item.link + '">';
                }
                html += '<div><img src="' + item.cover + '" style="height: 200px; width: 130px; object-fit: cover; border: 1px dashed lightgrey"></div>';
                html += '<div style="max-width: 120px; font-size: 80%; padding: 3px; overflow: hidden; white-space: nowrap">' + item.title + '</div>';
                if (item.link) {
                    html += '</a>';
                }
                html += '</td>';
                html += '<td style="vertical-align: top">';
                if (item.resources) {
                    html += '<div style="margin-left: 0px">';
                    item.resources.forEach(res => {
                        html += '<div title="' + res.label + '">';
                        html += '<a target="_blank" href="' + res.url + '">';
                        if (res.label.includes('notes')) {
                            html += '<img src="assets/icons/quotes.png" style="height: 30px;">';
                        } else if (res.label.includes('slides')) {
                            html += '<img src="assets/icons/slides.png" style="height: 30px;">';
                        } else if (res.label.includes('checklist')) {
                            html += '<img src="assets/icons/checklist.png" style="height: 30px;">';
                        } else {
                            html += '<img src="assets/icons/notes.png" style="height: 30px;">';
                        }
                        html += '</a>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
                html += '</td>';
                html += '</tr>';
                html += '</table>';
                html += '</div>';
            });
            html += '</div>';
        });

        document.getElementById('content').innerHTML = html;
    }

    update();
</script>
</body>
</html>
