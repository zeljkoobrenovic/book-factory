he world at, and what drives your economic engine.\n\nCulture of Discipline: Requires people who take disciplined action within a framework of freedom and responsibility. It requires a culture that is not bureaucratic.\n\nTechnology Accelerators: Avoid technology fads and bandwagons, yet they become pioneers in the application of carefully selected technologies.\n\nThe Flywheel And The Doom Loop: Often look like dramatic, revolutionary events to those observing from the outside, but they feel like organic, cumulative processes to people on the inside. The confusion of end outcomes (dramatic results) with process (organic and cumulative) skews our perception of what really works over the long haul.", "cover": "covers/good-to-great.jpg", "resources": [{"label": "reading notes", "url": "notes/good-to-great.pdf"}]}, {"title": "Infinite Game", "link": "https://www.amazon.com/Infinite-Game-Businesses-Achieve-Long-lasting-ebook/dp/B07CV4YHWQ", "authors": [], "description": "Five essential practices: Just Cause, Trusting Teams, Worthy Rival, Existential Flexibility, and Courage to Lead.\n\nA Just Cause is a specific vision of a future state that does not yet exist. It is a cause so just that people are willing to sacrifice to see it come to fruition.\n\nTrusting Teams are teams that feel safe to express vulnerability, take risks, and be themselves. They are teams that trust each other and their leaders.", "cover": "covers/infinite-game.jpg", "resources": [{"label": "reading notes", "url": "notes/infinite-game.pdf"}]}, {"title": "The Personal MBA 10th Anniversary Edition", "link": "https://www.amazon.com/dp/B08H5PKGGG", "authors": ["Josh Kaufman"], "description": "Overview of essentials across major business topics: entrepreneurship, product, marketing, sales, negotiation, accounting, finance, productivity, communication, psychology, leadership, systems design, analysis, operations.", "cover": "covers/personal-mba.webp", "resources": [{"label": "website", "url": "https://personalmba.com/"}]}, {"title": "The Diary of a CEO: The 33 Laws of Business and Life", "link": "https://www.amazon.com/dp/B09VRXYMW5", "authors": ["Steven Bartlett"], "description": "At the very heart of all the success and failure I've been exposed to - both my own entrepreneurial journey and through the thousands of interviews I've conducted on my podcast - are a set of principles that can stand the test of time, apply to any industry, and be used by anyone who is search of building something great or becoming someone great.", "cover": "covers/ceo-diary.jpg", "resources": [{"label": "reading notes", "url": "notes/ceo-diary.pdf"}, {"label": "website", "url": "https://stevenbartlett.com/doac/"}]}]}, {"category": "Product Strategy", "books": [{"title": "Escaping the Build Trap", "link": "https://www.amazon.com/Escaping-Build-Trap-Effective-Management-ebook/dp/B07K3QBWG1", "authors": ["Melissa Perri"], "description": "A practical guide to product management, product strategy, and ensuring product success.", "cover": "covers/build-trap.jpg", "resources": [{"label": "reading notes", "url": "notes/build-trap.pdf"}, {"label": "my reflections", "url": "https://grounded-architecture.io/product"}, {"label": "playlist", "url": "https://produxlabs.com/product-thinking"}]}, {"title": "Build What Matters", "link": "https://www.amazon.com/Build-What-Matters-Delivering-Vision-Led-ebook/dp/B08GQMCP19", "authors": ["Ben Foster", "Rajesh Nerlikar"], "description": null, "cover": "covers/build-what-matters.jpeg", "resources": [{"label": "reading notes", "url": "notes/build-what-matters.pdf"}, {"label": "action checklist and resources", "url": "https://docs.google.com/document/d/11iwcZVIvQVYjr4rZnmMdE0sEWKpBrvSDGCzIBLwcORA/edit?usp=sharing"}]}, {"title": "Product Operations: How to Build, Scale, and Sustain Product-Led Organizations", "link": "https://www.amazon.com/Product-Operations-successful-companies-products-ebook/dp/B0CKFKX94Z", "authors": ["Melissa Perri", "Ben Foster"], "description": null, "cover": "covers/prodops.jpg", "resources": [{"label": "reading notes", "url": "notes/prodops.pdf"}, {"label": "my reflections", "url": "https://grounded-architecture.io/product"}]}, {"title": "The Art of Business Value", "link": "https://www.amazon.com/Art-Business-Value-Mark-Schwartz-ebook/dp/B09JWSSKJP", "authors": ["Mark Schwartz"], "description": "No \u201cIT vs. the business.\u201d IT is part of the business; the CIO is a business leader. Treat technology work as strategy execution, not a service queue.\n\nValue is contextual. Beyond revenue/NPV, it includes risk reduction, compliance, resilience, optionality, customer satisfaction, learning, brand, and capability building.\n\nValue decisions are political, not purely analytical. Different stakeholders value different outcomes; leadership must reconcile them explicitly.\n\nFrom projects to products. Fund enduring product teams and outcomes, not one-off project scopes.\n\nGovernance by intent, not gates. Set guardrails (risk posture, compliance, architectural principles) and let empowered teams make local decisions with short feedback loops.\n\nDevOps/Agile are value engines. Small batches, continuous delivery, and rapid feedback de-risk bets and surface value sooner.\n\nMeasurement with purpose. Favor a few leading indicators tied to strategy (lead time, deployment frequency, change fail rate, availability) plus outcome measures (e.g., customer behavior). Avoid proxy metrics like story points.\n\nAccounting pitfalls. Traditional cost accounting and capital vs. expense debates can obscure value; avoid treating sunk costs or budget categories as value.\n\nProduct Owner isn\u2019t an oracle. They steward an explicit value model, balancing stakeholders and testing value hypotheses, not just reordering backlogs.\n\nStrategy \u2194 value model. Translate mission and strategy into a simple, shared rubric (the \u201cvalue model\u201d) that guides prioritization and trade-offs.", "cover": "covers/business-value.jpg", "resources": []}, {"title": "Inspired: How to Create Tech Products Customers Love (Silicon Valley Product Group)", "link": "https://www.amazon.com/INSPIRED-Create-Tech-Products-Customers-ebook/dp/B077NRB36N", "authors": ["Marty Cagan"], "description": "", "cover": "covers/inspired.jpg", "resources": []}, {"title": "Empowered: Ordinary People, Extraordinary Products (Silicon Valley Product Group)", "link": "https://www.amazon.com/dp/B08LPKRD5L", "authors": ["Marty Cagan"], "description": "", "cover": "covers/empowered.jpg", "resources": []}, {"title": "Transformed: Moving to the Product Operating Model (Silicon Valley Product Group) ", "link": "https://www.amazon.com/dp/B0CXG97J55", "authors": ["Marty Cagan", "Lea Hickman", "Chris Jones", "Christian Idiodi", "John Moore"], "description": "", "cover": "covers/transformed.jpg", "resources": []}]}, {"category": "Tech Strategy", "books": [{"title": "Crafting Engineering Strategy: How Thoughtful Decisions Solve Complex Problems", "link": "https://www.amazon.com/dp/B0FW6PX4JB", "authors": ["Mark Schwartz"], "description": "", "cover": "covers/engineering-strategy.jpg", "resources": []}, {"title": "A Seat at the Table: IT Leadership in the Age of Agility", "link": "https://www.amazon.nl/-/en/Mark-Schwartz-ebook/dp/B09JWT1VX9", "authors": ["Mark Schwartz"], "description": "", "cover": "covers/seat-at-table.jpg", "resources": []}, {"title": "Enterprise Architecture as Strategy: Creating a Foundation for Business Execution", "link": "https://www.amazon.nl/-/en/Jeanne-W-Ross-ebook/dp/B004OC07EE", "authors": [], "description": null, "cover": "covers/ea-strategy.jpg", "resources": [{"label": "reading notes", "url": "notes/ea-as-strategy.pdf"}, {"label": "my reflections", "url": "https://grounded-architecture.io/ea-as-strategy"}]}, {"title": "Technology Strategy Patterns", "link": "https://www.amazon.nl/-/en/Eben-Hewitt-ebook/dp/B07JJNSP92", "authors": ["Eben Hewitt"], "description": "Provides a shared language\u2014repeatable, practical patterns and templates\u2014to produce great technology strategies.", "cover": "covers/tsp.jpg", "resources": []}, {"title": "Cloud Strategy: A Decision-Based Approach to a Cloud Operating Model", "link": "https://leanpub.com/cloudstrategy", "authors": ["Gregor Hohpe"], "description": "", "cover": "covers/cloud-strategy.jpg", "resources": [{"label": "summary", "url": "https://obren.io/tools/catalogs/index.html?id=it-hybrid-cloud"}]}, {"title": "Platform Strategy: Innovation Through Harmonization", "link": "https://leanpub.com/platformstrategy", "authors": ["Gregor Hophe"], "description": "", "cover": "covers/platform-strategy.jpg", "resources": []}, {"title": "Designing Machine Learning Systems: An Iterative Process for Production-Ready Applications", "link": "https://www.amazon.com/Designing-Machine-Learning-Systems-Huyen-ebook/dp/B0B1LGL2SR", "authors": ["Chip Huye"], "description": "", "cover": "covers/designing-ml-systems.jpg", "resources": []}, {"title": "AI Engineering: Building Applications with Foundation Models", "link": "https://www.amazon.com/AI-Engineering-Building-Applications-Foundation-ebook/dp/B0DPLNK9GN", "authors": ["Chip Huye"], "description": "", "cover": "covers/ai-engineering.jpg", "resources": [{"label": "reading notes", "url": "notes/ai-engineering.pdf"}, {"label": "slides", "url": "https://docs.google.com/presentation/d/1cG1LK0hFOYFcWY5J0um1kHuCHoijRULRQSgbWljMfZk/edit?usp=sharing"}]}, {"title": "Accelerate", "link": "https://www.amazon.com/Accelerate-Software-Performing-Technology-Organizations-ebook/dp/B09JWS32W1/", "authors": [], "description": "If you want to move faster, you need to accelerate\u2014the second derivative of position.", "cover": "covers/accelerate.jpeg", "resources": [{"label": "summary", "url": "https://obren.io/tools/catalogs/?id=design-tactics-high-performing-technology-organizations"}, {"label": "summary", "url": "https://grounded-architecture.io/high-performing-organizations"}]}, {"title": "The Phoenix Project (and The Unicorn Project)", "link": "https://www.amazon.com/Phoenix-Project-DevOps-Helping-Business-ebook/dp/B0DPNL8863", "authors": ["Gene Kim"], "description": "A best-selling novel about DevOps; emphasizes security-first thinking and breaking down silos between development and operations.", "cover": "covers/the-phoenix-project.jpeg", "resources": []}]}, {"category": "Dealing With Negativity At Work", "books": [{"title": "No Asshole Rule: Building a Civilized Workplace and Surviving One That Isn't", "link": "https://www.amazon.com/Asshole-Rule-Civilized-Workplace-Surviving-ebook/dp/B00FOTRBOK", "authors": [], "description": "Test One: After talking to the alleged asshole, does the \u201ctarget\u201d feel oppressed, humiliated, deenergized, or belittled by the person? In particular, does the target feel worse about him or herself?\nTest Two: Does the alleged asshole aim his or her venom at people who are less powerful rather than at those people who are more powerful?", "cover": "covers/no-asshole.png", "resources": [{"label": "reading notes", "url": "notes/no-asshole.pdf"}, {"label": "my summary", "url": "https://grounded-architecture.io/toxic-colleagues"}]}, {"title": "Scapegoats at Work: How to Cope with Blame, Shame, and Guilt in the Workplace", "link": "https://www.amazon.com/Scapegoats-Work-Taking-Bulls-Eye-Your-ebook/dp/B000QCQTH0", "authors": [], "description": null, "cover": "covers/scapegoats.jpg", "resources": [{"label": "my reflection", "url": "https://grounded-architecture.io/scapegoating"}]}, {"title": "Emotional Blackmail: When the People in Your Life Use Fear, Obligation, and Guilt to Manipulate You", "link": "https://www.amazon.com/Emotional-Blackmail-People-Obligation-Manipulate-ebook/dp/B07DHLCKY1", "authors": [], "description": "FOG is a shorthand way of referring to Fear, Obligation and Guilt, the tools of the blackmailer\u2019s trade.\n\nEmotional blackmail is a powerful form of manipulation in which people close to us threaten, either directly or indirectly, to punish us if we don\u2019t do what they want. At the heart of any kind of blackmail is one basic threat, which can be expressed in many different ways: If you don\u2019t behave the way I want you to, you will suffer. A criminal blackmailer might threaten to use knowledge about a person\u2019s past to ruin her reputation, or ask to be paid off in cash to hide a secret. Emotional blackmail hits closer to home. Emotional blackmailers know how much we value our relationship with them. They know our vulnerabilities. Often they know our deepest secrets. And no matter how much they care about us, when they fear they won\u2019t get their way, they use this intimate knowledge to shape the threats that give them the payoff they want: our compliance.", "cover": "covers/emotional-blackmail.jpg", "resources": [{"label": "reading notes", "url": "notes/emotional-blackmail.pdf"}]}, {"title": "The Dictator's Handbook: Why Bad Behavior is Almost Always Good Politics", "link": "https://www.amazon.com/Dictators-Handbook-Behavior-Almost-Politics-ebook/dp/B06XBY3XJV", "authors": [], "description": null, "cover": "covers/dictators-handbook.jpg", "resources": []}]}, {"category": "Philosophy and Mindfulness", "books": [{"title": "History of Western Philosophy", "link": "https://www.amazon.com/History-Western-Philosophy-Routledge-Classics-ebook/dp/B000P0JNBM", "authors": ["Russell Bertrand"], "description": null, "cover": "covers/history-western-philosophy.jpg", "resources": [{"label": "reading notes", "url": "notes/history-western-philosophy.pdf"}, {"label": "my visual summary", "url": "https://obren.io/tools/catalogs/?id=philosophers"}]}, {"title": "Zen and the Art of Motorcycle Maintenance: An Inquiry into Values", "link": "https://www.amazon.com/Zen-Art-Motorcycle-Maintenance-Inquiry-ebook/dp/B0026772N8", "authors": ["Robert M. Pirsig"], "description": "He divided the human understanding into two kinds - romantic understanding and classical understanding. Romantic understanding is inspirational, imaginative creative, and intuitive. Classical understanding proceeds by reasons and laws. Although motorcycle riding is romantic, motorcycle maintenance is purely classical.", "cover": "covers/zen-art-motorcycle-maintenance.jpg", "resources": [{"label": "reading notes", "url": "notes/zen-art-motorcycle-maintenance.pdf"}]}, {"title": "44 Poems on Being with Each Other", "link": "https://www.amazon.com/-/en/P%C3%A1draig-%C3%93-Tuama-ebook/dp/B0CW1FQXHV", "authors": [], "description": "", "cover": "covers/poetry-unbound-44.jpg", "resources": []}, {"title": "Poetry Unbound: 50 Poems to Open Your World", "link": "https://www.amazon.com/-/en/P%C3%A1draig-%C3%93-Tuama-ebook/dp/B09WN6TV6S", "authors": [], "description": "", "cover": "covers/poetry-unbound-50.jpg", "resources": []}]}]};

    function update() {
        let html = '';

        const filteredData = data.bookshelf; // data.filter(item => !filter || item.title.toLowerCase().includes(filter))

        filteredData.forEach(section => {
            html += '<div class="group">';
            html += '<div>' + section.category + '</div>';
            section.books.forEach(item => {
                const description = item.title + '\n\n' + (item.description ? item.description : '');

                html += '<div class="group" title="' + description + '">';
                html += '<table>';
                html += '<tr>';
                html += '<td>';
                if (item.link) {
                    html += '<a target="_blank" href="' + item.link + '">';
                }
                html += '<div><img src="' + item.cover + '" style="height: 200px; width: 130px; object-fit: cover; border: 1px dashed lightgrey"></div>';
                html += '<div style="max-width: 120px; font-size: 80%; padding: 3px; overflow: hidden; white-space: nowrap">' + item.title + '</div>';
                if (item.link) {
                    html += '</a>';
                }
                html += '</td>';
                html += '<td style="vertical-align: top">';
                if (item.resources) {
                    html += '<div style="margin-left: 0px">';
                    item.resources.forEach(res => {
                        html += '<div title="' + res.label + '">';
                        html += '<a target="_blank" href="' + res.url + '">';
                        if (res.label.includes('notes')) {
                            html += '<img src="assets/icons/quotes.png" style="height: 30px;">';
                        } else if (res.label.includes('slides')) {
                            html += '<img src="assets/icons/slides.png" style="height: 30px;">';
                        } else if (res.label.includes('checklist')) {
                            html += '<img src="assets/icons/checklist.png" style="height: 30px;">';
                        } else {
                            html += '<img src="assets/icons/notes.png" style="height: 30px;">';
                        }
                        html += '</a>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
                html += '</td>';
                html += '</tr>';
                html += '</table>';
                html += '</div>';
            });
            html += '</div>';
        });

        document.getElementById('content').innerHTML = html;
    }

    update();
</script>
