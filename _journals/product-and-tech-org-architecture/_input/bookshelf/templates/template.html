<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookshelf</title>
    <style>
        body {
            font-family: Vollkorn, Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
        }

        .group {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: #f8f8f8;
        }

        a {
            text-decoration: none;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

        body {
            margin: 40px;
            text-align: center;
        }

        ::placeholder {
            color: lightgrey;
            opacity: 1;
        }

        :-ms-input-placeholder {
            color: lightgrey;
        }

        ::-ms-input-placeholder {
            color: lightgrey;
        }
    </style>
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Lato">
</head>
<body>

<div id="content"></div>

<script>
    const data = ${data};

    function update() {
        let html = '';

        const filteredData = data.bookshelf; // data.filter(item => !filter || item.title.toLowerCase().includes(filter))

        filteredData.forEach(section => {
            html += '<div class="group">';
            html += '<div>' + section.category + '</div>';
            section.books.forEach(item => {
                const description = item.title + '\n\n' + (item.description ? item.description : '');

                html += '<div class="group" title="' + description + '">';
                html += '<table>';
                html += '<tr>';
                html += '<td>';
                if (item.link) {
                    html += '<a target="_blank" href="' + item.link + '">';
                }
                html += '<div><img src="' + item.cover + '" style="height: 200px; width: 130px; object-fit: cover; border: 1px dashed lightgrey"></div>';
                html += '<div style="max-width: 120px; font-size: 80%; padding: 3px; overflow: hidden; white-space: nowrap">' + item.title + '</div>';
                if (item.link) {
                    html += '</a>';
                }
                html += '</td>';
                html += '<td style="vertical-align: top">';
                if (item.resources) {
                    html += '<div style="margin-left: 0px">';
                    item.resources.forEach(res => {
                        html += '<div title="' + res.label + '">';
                        html += '<a target="_blank" href="' + res.url + '">';
                        if (res.label.includes('notes')) {
                            html += '<img src="assets/icons/quotes.png" style="height: 30px;">';
                        } else if (res.label.includes('slides')) {
                            html += '<img src="assets/icons/slides.png" style="height: 30px;">';
                        } else if (res.label.includes('checklist')) {
                            html += '<img src="assets/icons/checklist.png" style="height: 30px;">';
                        } else {
                            html += '<img src="assets/icons/notes.png" style="height: 30px;">';
                        }
                        html += '</a>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
                html += '</td>';
                html += '</tr>';
                html += '</table>';
                html += '</div>';
            });
            html += '</div>';
        });

        document.getElementById('content').innerHTML = html;
    }

    update();
</script>
</body>
</html>
