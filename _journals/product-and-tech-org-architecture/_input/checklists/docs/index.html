<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checklists</title>
    <style>
        body {
            font-family: Vollkorn, Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
        }

        .section {
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: #f8f8f8;
        }

        .group {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: #f8f8f8;
        }

        .doc {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 11px;
            background-color: white;
            width: 220px;
            vertical-align: top;
        }

        a {
            text-decoration: none;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

        body {
            margin: 40px;
        }

        ::placeholder {
            color: lightgrey;
            opacity: 1;
        }

        :-ms-input-placeholder {
            color: lightgrey;
        }

        ::-ms-input-placeholder {
            color: lightgrey;
        }


        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 14px;
        }

        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }

        .tabcontent {
            display: none;
            padding: 0;
            border: 1px solid #ccc;
            border-top: none;
        }
    </style>
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Lato">
    <script>
        function openTab(evt, cityName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(cityName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>
</head>

<script>
    const data = [{"tab": "Managing Self", "resources": [{"title": "Lead Yourself First (Self-Mastery)", "items": [{"type": "Exercise", "title": "Self Awareness", "icon": "self-awareness.png", "link": "https://docs.google.com/document/d/11JU94o3lxJDN9AJ1cmzSXtYaLm-zhR0G2SM8fGHmWzk/edit?usp=sharing", "summary": "Defining your personal values requires identifying what drives you, explaining their underlying importance, and grounding them in real-world experiences to illustrate their impact on your life and career."}, {"type": "Exercise", "title": "Identify Your Strengths", "icon": "your-strengths.png", "link": "https://docs.google.com/document/d/10yN2K6JbxmcntZW-N19WPB6p3-e_mGExNTNRERRZFpA/edit?usp=sharing", "summary": "Categorizing your strengths into innate and acquired skills and capabilities helps distinguish between natural talents and learned expertise, providing a clear roadmap for personal development and professional growth."}, {"type": "Exercise", "title": "Understand Your Values", "icon": "your-values.png", "link": "https://docs.google.com/document/d/1L_dcmLnjwSvMrd_HepsUnpPG9504lHT398zPGYJpp48/edit?usp=sharing", "summary": "Uncovering core values involves a selective process of narrowing down life priorities, identifying the specific behaviors that embody them, and weighing the positive outcomes against the inevitable trade-offs they require in a professional setting."}, {"type": "Template", "title": "Working With Me", "icon": "me.png", "link": "https://docs.google.com/document/d/1TQHPjAPfLoAu6ohva9rXO2JMyxrHgLr9F-poLJz9G1I/edit?usp=sharing", "summary": "A template that clarifies your role and priorities, how you communicate and operate day-to-day, your management style, and how you\u2019ll support and grow your team so everyone knows what to expect and how to work with you effectively."}, {"type": "Example", "title": "Working With Me Example", "icon": "me-example.png", "link": "https://docs.google.com/document/d/1zgpqDtUhH0xnKHZVtnBWqBxwgL5WbEU1QSDmmt_hrr0/edit?usp=sharing", "summary": "The person runs a results-driven, people-first team with clear ownership, regular structured communication, data-informed decisions, and high accountability\u2014all while keeping work collaborative, transparent, and genuinely fun."}]}, {"title": "Daring Leadership", "items": [{"type": "Exercise", "title": "Rumbling Tools", "icon": "rumble.png", "link": "https://docs.google.com/document/d/1XJEst3MQq9MovPz1qwX2l872C6tbSYbbFUEp9FJMKaU/edit?usp=sharing", "summary": "This exercise provides conversation starters and reflective tools designed to support constructive \u201crumbling\u201d by encouraging curiosity, shared understanding, accountability, and problem-focused dialogue."}, {"type": "Checklist", "title": "Braving Trust", "icon": "trust.png", "link": "https://docs.google.com/document/d/1h2_P2sVkkiCFdFH-2nkOA4Oc5pcE3YqohfSVEu8tPi4/edit?usp=sharing", "summary": "This checklist defines trust through the BRAVING framework\u2014boundaries, reliability, accountability, vault, integrity, nonjudgment, and generosity\u2014and presents it as a practical tool for fostering open, values-driven conversations and stronger trust at work."}, {"type": "Exercise", "title": "Atlas of Emotions", "icon": "emotions.png", "link": "https://docs.google.com/presentation/d/1kuuWhKTDsDnr3vXHqV_pHfsEhLlXElb2ZwvTmJVd8W8/edit?usp=sharing", "summary": "Explores thirteen categories of human emotions and experiences, mapping the internal \"places we go\" when dealing with uncertainty, comparison, disappointment, connection, hurt, and self-assessment."}]}, {"title": "Speed of Trust", "link": "https://www.amazon.com/dp/B000MGATWG", "items": [{"type": "Evaluation", "title": "Speed of Trust: Self-Trust", "icon": "self-trust.png", "link": "https://docs.google.com/document/d/1GO8OkwWtg2KH-6k4bWqqXrEumOyvbRZJi_bGFhVNAUU/edit?usp=sharing", "summary": "An evaluation tool that breaks down personal trust into four core components\u2014Integrity, Intent, Capabilities, and Results\u2014each assessed through a series of statements ranging from low to high-end."}, {"type": "Checklist", "title": "13 Behaviors That Increase Trust", "icon": "trust-heart.png", "link": "https://docs.google.com/document/d/1PI_J6iVIP6EpDsevBcgYyFl362Dje8FvWGpdCLBRfz8/edit?usp=sharing", "summary": "Outlines 13 key behaviors, such as \"Talk Straight,\" \"Keep Commitments,\" and \"Extend Trust,\" that are essential for building and increasing trust."}]}, {"title": "Connect", "link": "https://www.amazon.com/dp/B087Z7JVT7", "items": [{"type": "Evaluation", "title": "Exceptional Relationships", "icon": "exceptional.png", "link": "https://docs.google.com/document/d/1XITlkZWMMkXzeymHwGQAb0MeCh-jVy4ywNqplf8bYaA/edit?usp=sharing", "summary": "Provides a structured framework for deepening personal and professional relationships by evaluating them against key hallmarks like vulnerability, honesty, and trust, while encouraging self-reflection and proactive communication."}, {"type": "Checklist", "title": "To Share, or Not to Share", "icon": "sharing.png", "link": "https://docs.google.com/document/d/1QG8ozrKQWDADJYyw-Qzu9RMbGDljzT5StjWpme6gYsk/edit?usp=sharing", "summary": "Provides a structured approach for thoughtful self-disclosure in relationships, guiding you through the preparation, execution, and reflection needed to share personal information effectively and safely."}, {"type": "Checklist", "title": "Helping Others Be Known", "icon": "helping.png", "link": "https://docs.google.com/document/d/18x5kGGk7ml3y-nontDe02eRWIYoSvmvBj54zAOnIQHE/edit?usp=sharing", "summary": "A reflective guide for deepening connections with others by emphasizing active listening, empathy, respectful boundaries, and thoughtful communication rather than offering unsolicited advice."}, {"type": "Checklist", "title": "Influence in Balance", "icon": "balance.png", "link": "https://docs.google.com/document/d/1M_C7Sin9vmcKVy2IFEYYyh2--UxRHIROnTTx90r6VNc/edit?usp=sharing", "summary": "A structured framework for assessing and improving the balance of relationship satisfaction, mutual influence, and communication between partners."}, {"type": "Checklist", "title": "Pinches and Crunches", "icon": "pinches.png", "link": "https://docs.google.com/document/d/14j3hvXwd09_2bqvWSiZ63f0TgzzHzWyyMDroBIY87C4/edit?usp=sharing", "summary": "A structured approach for managing interpersonal conflicts by identifying minor frustrations, or \"pinches,\" early and addressing them constructively before they escalate into significant issues, or \"crunches\"."}, {"type": "Checklist", "title": "Behaviorally Specific Feedback", "icon": "behavior-feedback.png", "link": "https://docs.google.com/document/d/1Pawnyr9_z6xOXDC24cXdIlDM5kvbo5H5APsgU9Kbq-Q/edit?usp=sharing", "summary": "A structured approach to delivering constructive, behaviorally specific feedback by focusing on objective observations, personal impact, and collaborative problem-solving to strengthen professional relationships."}, {"type": "Checklist", "title": "Using Feedback Effectively", "icon": "using-feedback.png", "link": "https://docs.google.com/document/d/1hpb3KvA4ERR0c5rW39yGGUDhFz8T61aJTKJaDoX3x5w/edit?usp=sharing", "summary": "A practical framework for navigating feedback conversations effectively by managing emotions, avoiding assumptions, fostering constructive dialogue, resolving conflicts, and maintaining a growth mindset."}, {"type": "Checklist", "title": "Can People Really Change?", "icon": "people-change.png", "link": "https://docs.google.com/document/d/1-5XGkj3HrYKc5U1iI8z37Qj-4tT2tLbYOHCugs4XA3E/edit?usp=sharing", "summary": "A practical checklist for navigating interpersonal feedback by focusing on specific behaviors, fostering empathy, using a clear change framework, and reflecting on both the conversation and one's own role in the relationship."}, {"type": "Checklist", "title": "Emotional Ownership", "icon": "owning-emotions.png", "link": "https://docs.google.com/document/d/19YBKkVnI9W6BEFPTECuVZILbJA2b6wKQYfHQ2XyhIwU/edit?usp=sharing", "summary": "A comprehensive checklist to help individuals practice emotional ownership and navigate difficult conversations effectively through self-reflection, honest communication, active listening, and conflict repair."}, {"type": "Checklist", "title": "Breaking the Logjam: Relationship Conflict", "icon": "logjam.png", "link": "https://docs.google.com/document/d/1XZcNMNaN5cVAhSYwszd6mhd8wLfqfJGAOrqT44I9oAI/edit?usp=sharing", "summary": "A structured approach for navigating and resolving relationship conflicts by emphasizing self-reflection, open communication, mutual understanding, and personal accountability."}, {"type": "Checklist", "title": "Productive Conflict", "icon": "productive-conflict.png", "link": "https://docs.google.com/document/d/1ysMRp2crdBvqPx5mVvBvkN34yVvqatU861txNJ6cMGI/edit?usp=sharing", "summary": "A structured approach for navigating conflict productively by outlining key steps to take before, during, and after a conversation, focusing on mutual understanding, shared problem-solving, and maintaining the relationship."}, {"type": "Checklist", "title": "Resolving Controversial Issues", "icon": "contraversial.png", "link": "https://docs.google.com/document/d/1a9aBs9QiDA71JLi2HwAYHDrSZGp6W3aFqSZP3sp_4xU/edit?usp=sharing", "summary": "A comprehensive framework for navigating conflict by guiding individuals through a structured process that emphasizes preparation, understanding underlying issues, avoiding common pitfalls, and collaboratively arriving at sustainable resolutions."}, {"type": "Checklist", "title": "Boundaries and Expectations", "icon": "personal-boundaries.png", "link": "https://docs.google.com/document/d/1_Qa1wqh5nf568aBiYEUPI0BQaztt9BPa6oV1UBt81R8/edit?usp=sharing", "summary": "A structured guide to maintaining healthy relationships by offering actionable steps for establishing boundaries, clarifying expectations, and navigating difficult interpersonal communications."}, {"type": "Checklist", "title": "Navigating Entangled Issues", "icon": "entangled.png", "link": "https://docs.google.com/document/d/12qCzq8iYJ40IYqFHB9FRsGvNvulpBiroe0oI7AiNu8M/edit?usp=sharing", "summary": "A structured approach for navigating complex conversations in close relationships, emphasizing intentional preparation, honest communication, mutual respect, and thoughtful post-conversation reflection."}, {"type": "Checklist", "title": "When an Exceptional Relationship Is Not Possible", "icon": "not-exceptional.png", "link": "https://docs.google.com/document/d/1EooV0V6zX7J8esS1Mr2nJVmXJhP2hAvAfrmtg118agY/edit?usp=sharing", "summary": "Actionable strategies for managing and evaluating relationships that fall short of being exceptional, focusing on acceptance, effective communication, mutuality, and realistic assessment."}, {"type": "Checklist", "title": "Repairing Relationships", "icon": "relationship-repair.png", "link": "https://docs.google.com/document/d/1EooV0V6zX7J8esS1Mr2nJVmXJhP2hAvAfrmtg118agY/edit?usp=sharing", "summary": "Actionable strategies for managing and evaluating relationships that fall short of being exceptional, focusing on acceptance, effective communication, mutuality, and realistic assessment."}]}, {"title": "Distancing", "link": "https://www.amazon.com/Distancing-Leaders-Reframe-Better-Decisions-ebook/dp/B0CZTHGNFZ", "items": [{"type": "Exercise", "title": "Distancing / Becoming Your Own Coach", "icon": "coach.png", "link": "https://docs.google.com/document/d/1KjWkQ3uCr894ZHTbZ8nm5YVWEtaCqKru6XHSlhml6lA/edit?usp=sharing", "summary": "Becoming Coach isn\u2019t about replacing mentors or external advice. It\u2019s about recognizing that you often already have the answers\u2014but can\u2019t see them because you\u2019re too immersed."}, {"type": "Exercise", "title": "Distancing / See the Big Picture", "icon": "big-picture.png", "link": "https://docs.google.com/document/d/1v_ldpmsDAT1BupMGfyoWqNgh7nXNIyVZY5WGDlEFmaw/edit?usp=sharing", "summary": "Spatial distancing helps us see problems more clearly by shifting perspective. Because cognition, emotion, and vision are closely linked, mental imagery allows us to view situations from a neutral, balanced perspective."}, {"type": "Exercise", "title": "Distancing / Be Your Future Self", "icon": "future.png", "link": "https://docs.google.com/document/d/1mSPvUhake25yUOy9FGyK8lJT_LGtwff6kd78EUVms8k/edit?usp=sharing", "summary": "Time-traveling to your future self (1) places you on the far side of decisions, triggering a healthy regret framework; (2) clarifies what truly matters\u2014your ideal self over what\u2019s merely practical; (3) mitigates failures of self-control."}, {"type": "Exercise", "title": "Distancing / Stop Time", "icon": "distancing.png", "link": "https://docs.google.com/document/d/10Fqy6oIJ47in2B-zh5fFyAOUUjs8x2FpgPyxI2pb85s/edit?usp=sharing", "summary": "Whether it\u2019s a $50 million text message or a difficult conversation with a team member, sometimes the best move is to pause. Blow the whistle for a time-out and become Coach."}]}, {"title": "Hidden Blockers", "link": "https://www.amazon.com/Leadership-Unblocked-Through-Beliefs-Potential-ebook/dp/B0DRZ2GMVZ/", "items": [{"type": "Exercise", "title": "Hidden Blocker: I Need to Be Involved", "icon": "control.png", "link": "https://docs.google.com/document/d/1fsmrClrhM17S7LrmUdYS207RYQ6Xl_HKK3nzDuxBFlc/edit?usp=sharing", "summary": "It can be tempting to become overly involved. It can feel like you\u2019re doing the right thing by ensuring everything stays on course. Despite the best intentions, however, this hidden blocker can leave you too busy and scattered\u2014and prevent teams from owning their roles and growing."}, {"type": "Exercise", "title": "Hidden Blocker: I Need It Done Now", "icon": "immediate.png", "link": "https://docs.google.com/document/d/1rLOsAd9MqoTzACD7didiN1dqzUEuqFoUfwjmyxNji0w/edit?usp=sharing", "summary": "Moving on from the hidden blocker \u201cI need it done now\u201d requires letting go of a definition of success that ties self-worth solely to output and accomplishment. This shift means adopting a more balanced view\u2014one that supports well-being both inside and outside of work."}, {"type": "Exercise", "title": "Hidden Blocker: I Know I'm Right", "icon": "right.png", "link": "https://docs.google.com/document/d/1IBv5c3exntYuFq7QcAzAucoVjIcjpN81qcztSTut_CA/edit?usp=sharing", "summary": "You may be blocked by the belief that you have all the answers\u2014or that you are the only one with the right answers. If \u201cI know I\u2019m right\u201d feels like the hidden blocker holding you back, the first step is to identify how this belief shows up for you and name it."}, {"type": "Exercise", "title": "Hidden Blocker: I Can't Make a Mistake", "icon": "mistake.png", "link": "https://docs.google.com/document/d/157WEHG6WK-kEkd6UrLehCBYWrKPq6m56p8XA4RdsRjM/edit?usp=sharing", "summary": "Failure itself was not the catastrophe we believed it to be\u2014we all fall short from time to time. What makes the difference is how we respond to failures, large and small. Rather than using mistakes as reasons to beat ourselves up, give up, or despair, we can treat them as powerful opportunities for learning and growth."}, {"type": "Exercise", "title": "Hidden Blocker: If I Can Do It, So Can You", "icon": "easy.png", "link": "https://docs.google.com/document/d/196yZ0RS-FYR14O0w6kKfQQoFj1yvaj-2EDts4W-PPDQ/edit?usp=sharing", "summary": "Many successful people come to believe that what worked for them should work for everyone else\u2014that if others simply follow the same path, they\u2019ll achieve the same results. While this belief can be motivating, it does not hold up as a universal rule."}, {"type": "Exercise", "title": "Hidden Blocker: I Can't Say No", "icon": "agree.png", "link": "https://docs.google.com/document/d/1GaDoFVz5DUlSCpdSmV-RDcg3AMb_EWTKBv_pHN-zlKU/edit?usp=sharing", "summary": "Saying no is about setting boundaries and advocating for yourself. As writer and therapist Prentis Hemphill says, \u201cBoundaries are the distance at which I can love you and me simultaneously.\u201d In other words, boundaries can serve both you and others\u2014even when it means not doing what\u2019s asked."}, {"type": "Exercise", "title": "Hidden Blocker: I Don't Belong Here", "icon": "not-belonging.png", "link": "https://docs.google.com/document/d/1gJBmw7tJh79U-9zD8kx0qVixQolVzpY6NkOTmcZuqhE/edit?usp=sharing", "summary": "Have you ever struggled with the feeling that you don\u2019t fit in at work, don\u2019t belong among your peers or colleagues, or don\u2019t deserve to be where you are?"}]}, {"title": "The Diary Of A CEO", "link": "https://www.amazon.com/dp/B09VRXYMW5", "items": [{"type": "Checklist", "title": "The Self", "icon": "self.png", "link": "https://docs.google.com/document/d/1PAzZ23H4MKI-wbtGwI8cimRKj6vQyn883VDSOD79Ybc/edit?usp=sharing", "summary": "A structured, habit-based framework for personal and professional development, focusing on actionable principles like prioritizing health, continuous learning, and strategic decision-making."}, {"type": "Checklist", "title": "The Story", "icon": "story.png", "link": "https://docs.google.com/document/d/1rBKXqOwTa-FepLgnP-F_npBe_adQVcsfRpE0zIFmTdo/edit?usp=sharing", "summary": "Marketing and brand psychology provide actionable principles for building memorable, emotionally engaging, and strategically positioned brand experiences that capture attention and drive value."}, {"type": "Checklist", "title": "The Philosophy", "icon": "philosophy.png", "link": "https://docs.google.com/document/d/109_A8jR82DIbsj7_Q-Z04arZ5XqWYIBa3Fly7BAOlUU/edit?usp=sharing", "summary": "A leadership philosophy focused on maintaining strategic clarity, fostering continuous improvement, optimizing decision-making, and ensuring disciplined execution."}, {"type": "Checklist", "title": "The Team", "icon": "team-reaching.png", "link": "https://docs.google.com/document/d/1x22pqQU5G98LWBHHz3gV_3vFeHuSxHVyc41nOEg495w/edit?usp=s ", "resources": [{"title": "Defensive Security Handbook", "link": "https://www.amazon.com/dp/B0D86S4BVY", "items": [{"type": "Checklist", "title": "Creating a Security Program", "icon": "security-program.png", "link": "https://docs.google.com/document/d/1A9IneSnKDsCYl7L-NSBSKTnJaVCVjnQmvbEiOqoQsw0/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Covers foundational cybersecurity program setup, framework alignment with NIST CSF 2.0, governance roles across teams, baseline posture evaluation, and threat scoping."}, {"type": "Checklist", "title": "Asset Management and Documentation", "icon": "assets-inventory.png", "link": "https://docs.google.com/document/d/1q-OT5PbVnN4lldsc_jErKQp5R6IJqQ5XdEEzxQgdH1A/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Covers inventory schemas, establishing a single source of truth, data classification, lifecycle phases from procurement to disposal, and asset risk prioritization."}, {"type": "Checklist", "title": "Policies", "icon": "security-policy.png", "link": "https://docs.google.com/document/d/1AaYR5vqkTinwIrUlW1wi0dtubzUHDCwEP_2NKbgCQE0/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Details the construction, mandatory language, organizational domain coverage, revision controls, and executive management sign-offs for information security policies."}, {"type": "Checklist", "title": "Standards", "icon": "security-standards.png", "link": "https://docs.google.com/document/d/1rUhwLTvVfxnMzRKVkdx2oDbtoo0XE5tCkHvyFDb4gAQ/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Outlines the hierarchy between policies, standards, and procedures, establishing unambiguous technology-specific requirements and standard operating procedures."}, {"type": "Checklist", "title": "Education", "icon": "security-education.png", "link": "https://docs.google.com/document/d/12L0TP4_YnQEyzhz1GeTxzcmhJPWTBOn6MhMN15duoOI/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Focuses on designing security awareness programs, running realistic phishing simulations, reinforcing positive security behavior, and tracking employee awareness metrics."}, {"type": "Checklist", "title": "Incident Response", "icon": "emergency.png", "link": "https://docs.google.com/document/d/1BW-UWSscBoV7whMbcVxN3dSPSdy1VbDQimBFjzEvRwk/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Provides response procedures including pre-incident escalation paths, war room activation, evidence preservation, chain of custody, and forensic triage."}, {"type": "Checklist", "title": "Disaster Recovery", "icon": "restore.png", "link": "https://docs.google.com/document/d/1AXfmL5zVRkgtL24HkD_rSz9Yw_PYC67w8mbTR_CWB0U/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Covers RTO/RPO definition, multi-region cloud replication, dependency mapping, scenario simulations, failover orchestration, and verified failback procedures."}, {"type": "Checklist", "title": "Industry Compliance Standards and Frameworks", "icon": "compliance.png", "link": "https://docs.google.com/document/d/1t4gPiB9mCNeaPWThq0dLGQLZEf1UoEeJVhvrZI8ADmY/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Breaks down regulatory mandates including FERPA, GLBA, HIPAA, PCI DSS, and SOX, mapping administrative, physical, and technical compliance controls."}, {"type": "Checklist", "title": "Physical Security", "icon": "physical-security.png", "link": "https://docs.google.com/document/d/1XcUp2F43S8UqEZn6NLN-2QryyyIrsnITRjGmASPz9Os/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Details physical access perimeters, CCTV placement, clean-desk and media safeguards, server rack controls, and visitor/contractor badge management."}, {"type": "Checklist", "title": "Windows", "icon": "ms-windows.png", "link": "https://docs.google.com/document/d/1I_on-naR_KneyidkI4B4HYzGGjaqyWu5NzVtyJ6_1HY/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Guides Windows environment hygiene, Active Directory forest and domain hardening, FSMO role placement, ork Security", "icon": "network-security.png", "link": "https://docs.google.com/document/d/1T9G0gcZgUi2q0KntDWpN7NX7Dr3N_OYJiQmX_0dRESI/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Covers network device hardening, firmware lifecycle management, port and service filtering, SNMPv3 configuration, encrypted administrative protocols, and bastion hosts."}, {"type": "Checklist", "title": "Network Segmentation", "icon": "network-segmentation.png", "link": "https://docs.google.com/document/d/1CiQ3ClR34kXYPMh-GR-T1nUdMlEIqygT1wAYXANPlZU/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Details physical boundaries, DMZ placement, VLAN grouping, ACL rules, Network Access Control (802.1X), VPN isolation, and microsegmentation."}, {"type": "Checklist", "title": "Vulnerability Management", "icon": "vulnerability-management.png", "link": "https://docs.google.com/document/d/1ftTxSoH0wYKiqJsUHHk2k92dA-NNIXV4Ivw45Jy13hE/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Outlines scanning approaches (authenticated vs unauthenticated), scanner tooling selection, vulnerability remediation lifecycles, and context-based risk prioritization."}, {"type": "Checklist", "title": "Secure Software Development", "icon": "secure-code.png", "link": "https://docs.google.com/document/d/172lrf_q3nJGFR9oeXnkcESZH9E81yxk5pS8A9hTExPE/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Covers secure language choice, rigorous input validation rules, SAST/DAST testing integration, peer reviews, and full SSDLC stages."}, {"type": "Checklist", "title": "OSINT and Purple Teaming", "icon": "security-drill.png", "link": "https://docs.google.com/document/d/1Uh3mmN9bs0-7m9igbkWtIVyYyJEOGW9a-q1ffueHLCo/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Provides exercises for public footprint discovery, metadata stripping, credential breach exposure scanning, OSINT frameworks, and purple-team collaborative exercises."}, {"type": "Checklist", "title": "Understanding IDSs and IPSs", "icon": "intrusion-detection.png", "link": "https://docs.google.com/document/d/1Rt8CQXMHYtKHBd_fa9NmGyjhx9YczYL9NlTBC-1komE/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Covers network and host intrusion detection/prevention differences, tooling (Snort, Suricata, Zeek, OSSEC), honeypots, NGFWs, and cloud-native detection."}, {"type": "Checklist", "title": "Logging and Monitoring", "icon": "monitoring.png", "link": "https://docs.google.com/document/d/1p3HEBqN2cZ2vWboER0TWooyBF9ROwdGGZZ9bZq61VGs/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Focuses on SIEM architecture, log ingestion scope, Windows Sysmon event configurations, audit policies, authentication anomaly detection, and cloud logs."}, {"type": "Checklist", "title": "Extra Mile", "icon": "secure-upgrade.png", "link": "https://docs.google.com/document/d/1P9uWeTkniQgHLSllGBwenRNAOPSld7rzPIwvsSUzwZI/edit?usp=drivesdk&ouid=106420046363714651268", "summary": "Provides advanced practices for mail server hardening, DNS recursion and sinkhole protection, DNSSEC considerations, and defense-in-depth guidance."}]}]}, {"tab": "Miscellaneous", "resources": [{"title": "Framing", "link": "https://www.amazon.com/dp/B00NP9LHFA", "items": [{"type": "Checklist", "title": "Framing Basics", "icon": "framing.png", "link": "https://docs.google.com/document/d/15TCW33OqJ2wmlgUzT0ewKLKvGqqd_XjPzZRgAIQVZDw/edit?usp=sharing", "summary": "A strategic guide for effective public discourse by emphasizing the importance of leading with core moral values, understanding opposing viewpoints, and proactively reframing issues to build more persuasive and consistent messages."}, {"type": "Checklist", "title": "Framing the Unframed, Systemic Causation", "icon": "framing-causation.png", "link": "https://docs.google.com/document/d/1zy6udh0iOQswxui9jnmTdLQEWp4KysesjPcTa7OdlPo/edit?usp=sharing", "summary": "A practical checklist for effectively communicating complex societal issues by strategically framing arguments around systemic causation, reflexivity, shared public values, and clear moral narratives."}, {"type": "Checklist", "title": "Framing Freedom Issues", "icon": "framing-freedom.png", "link": "https://docs.google.com/document/d/1xqVkRV19ENwOxSQUlnbaTQhXHDI6Eqnk2coCmn2NJ80/edit?usp=sharing", "summary": "Reclaim the political narrative by reframing diverse social and economic issues\u2014such as health care, education, poverty, and discrimination\u2014as fundamental issues of freedom."}, {"type": "Checklist", "title": "Framing the Accelerated Wealth Gap", "icon": "framing-wealth-gap.png", "link": "https://docs.google.com/document/d/1mmK449NNyoaSQYmZVWJ0U3frhxyN5W2LoYjX-XHAfwU/edit?usp=sharing", "summary": "A framework for understanding the accelerating wealth gap by connecting systemic wealth concentration to broader issues like political influence, labor devaluation, public resource degradation, and climate change."}, {"type": "Checklist", "title": "Government by Corporation Framing", "icon": "framing-corporation.png", "link": "https://docs.google.com/document/d/11ASDBqLHZrgW9tMtBg5FOAhlFBMYrsIeF_lY70_kMoI/edit?usp=sharing", "summary": "Outlines how corporate power is expanded through legal mechanisms like corporate personhood and the \"money is speech\" doctrine, arguing that corporations increasingly govern public life for profit at the expense of democracy and public resources."}, {"type": "Checklist", "title": "Political Framing & Metaphors from the Early 2000s", "icon": "framing-terror.png", "link": "https://docs.google.com/document/d/1Sr3DZ0GxfI2-9Sdui5v2rrb53FaTBuUa1i6z4rg1stA/edit?usp=sharing", "summary": "A framework for analyzing and reframing political discourse from the early 2000s by identifying the underlying moral models, metaphors, and values used in topics ranging from marriage equality to foreign policy and terrorism."}, {"type": "Checklist", "title": "Values-Based Political Conversations ", "icon": "framing-values.png", "link": "https://docs.google.com/document/d/1qDMRRqgixzoFoAsbcwkaSlWbqIaofGF5M2zfvLsgXoQ/edit?usp=sharing", "summary": "Outlines strategies for engaging in constructive, values-based political conversations by emphasizing respectful communication, personal storytelling, and the consistent use of shared moral frames."}]}, {"title": "Thinking and Talking Guides", "link": "https://www.amazon.com/dp/B007WT31BM", "items": [{"type": "Checklist", "title": "Moral Framing & Political Language", "icon": "framing-moral.png", "link": "https://docs.google.com/document/d/1odTgVO03Pb0RdGv789nAhq95eKZnCaH6DVd_r8Apvfc/edit?usp=sharing", "summary": "Guidelines for effective political communication, emphasizing the importance of grounding policy proposals in moral values, establishing positive frames, and connecting issues directly to people's daily lives using clear, authentic, and concrete language."}, {"type": "Checklist", "title": "Ideas We Need: Democracy, Public Good, Corporate Power", "icon": "democracy.png", "link": "https://docs.google.com/document/d/1adBEtcVIUJnamZgCZBwqgWr9g1YZYYgb_5XqjYua_O4/edit?usp=sharing", "summary": "Actionable steps to strengthen democracy and public systems while advocating for the necessary regulation and limitation of unchecked corporate power across various societal sectors."}, {"type": "Checklist", "title": "Understanding Extreme Conservatism", "icon": "framing-strict-father.png", "link": "https://docs.google.com/document/d/17RVoJTJOnlXUQLKkLjQWL2OC-3j2lHgimvy1PkSXOkQ/edit?usp=sharing", "summary": "An ideology as one that employs a \"strict father\" model to enforce top-down authority, thereby undermining democratic processes, public infrastructure, and shared human empathy."}, {"type": "Checklist", "title": "The Economy and the Public Framing", "icon": "framing-economy.png", "link": "https://docs.google.com/document/d/1hxar9-4Xcod67lBcYOvRUqHWFJgTs16SgHiK55Ia1bE/edit?usp=sharing", "summary": "Reframing economic and public policy language to emphasize shared responsibility, public investment, and civic participation over market-oriented or conservative terminology."}, {"type": "Checklist", "title": "Social Darwinism Framing", "icon": "framing-social-darwinism.png", "link": "https://docs.google.com/document/d/1NX_n5v-Dl4ZwBOk9PB9G_qloWH1-l3_318E6REg4Xrw/edit?usp=sharing", "summary": "\"Social Darwinism\" is a distorted interpretation of Darwin's actual theories and advocates for reclaiming authentic Darwinian values like empathy, cooperation, and social responsibility to challenge the excessive focus on competition in political and cultural life."}, {"type": "Checklist", "title": "Family Freedom Framing", "icon": "framing-family-freedom.png", "link": "https://docs.google.com/document/d/1b7dBvWx1VkZ40nqTsth-Gak8q3MEmpR9cxJOrsecIIY/edit?usp=sharing", "summary": "Strategic guidance for framing pregnancy prevention through a \"family freedom\" lens by emphasizing shared responsibility, pro-liberty values, and carefully selected terminology to communicate dignity and autonomy."}]}]}];

    function update() {
        const criteria = document.getElementById('filter').value.toLowerCase().split(';').map(c => c.trim()).filter(c => c);
        const groupCriteria = criteria.filter(c => c.startsWith('group:')).map(c => c.substring('group:'.length).trim()).filter(c => c);
        const textCriteria = criteria.filter(c => !c.startsWith('group:'));
        let count = 0;

        function capitalize(val) {
            return String(val).charAt(0).toUpperCase() + String(val).slice(1);
        }

        function addDoc(item, highlight) {
            let docHtml = '';

            docHtml += '<div class="doc">';
            docHtml += '<table>';
            docHtml += '<tr>';
            docHtml += '<td style="width: 80px">';
            docHtml += '<img src="icons/' + item.icon + '" style="vertical-align: middle; height: 80px">';
            docHtml += '</td>';
            docHtml += '<td>';
            docHtml += '<a target="_blank" href="' + item.link + '">';
            docHtml += '<div style="font-size: 95%; color: grey">' + item.type + '</div>';
            if (highlight) {
                docHtml += '<div style="color: blue; font-size: 110%">' + item.title.replace(new RegExp(highlight, 'i'), '<span style="background-color: yellow">' + capitalize(highlight) + '</span>') + '</div>';
            } else {
                docHtml += '<div style="color: blue; font-size: 110%">' + item.title + '</div>';
            }
            docHtml += '</a>';
            docHtml += '</td>';
            docHtml += '</tr>';
            docHtml += '<tr>';
            docHtml += '<tr>';
            if (highlight) {
                docHtml += '<td colspan="2" style="font-size: 80%; color: grey; border-top: 1px dashed black; padding-top: 10px">' + item.summary.replace(highlight, '<span style="background-color: yellow">' + highlight + '</span>') + '</td>';
            } else {
                docHtml += '<td colspan="2" style="font-size: 80%; color: grey; border-top: 1px dashed black; padding-top: 10px">' + item.summary + '</td>';
            }
            docHtml += '</table>';
            docHtml += '</div>';

            return docHtml;
        }

        document.getElementById('filtered_content').innerHTML = '';
        document.getElementById('tabs').innerHTML = '';
        document.getElementById('tab_content').innerHTML = '';

        if (criteria.length) {
            let html = '';
            data.forEach(tab => {
                tab.resources.forEach(group => {
                    const groupMatch = groupCriteria.some(g => group.title.toLowerCase().trim().includes(g));
                    group.items.forEach(item => {
                        const textMatch = textCriteria.find(t => (item.type + ' ' + item.title + ' ' + item.summary).toLowerCase().includes(t));
                        if (groupMatch || textMatch) {
                            count += 1;
                            html += addDoc(item, textMatch || null);
                        }
                    });
                });
            });
            document.getElementById('filtered_content').innerHTML = html;
        } else {
            let tabCount = 0;
            let tabHtml = ' ';
            let contentHtml = ' ';
            data.forEach(tab => {
                tabCount += 1;
                let tabItemCount = 0;
                const tabId = 'tab_' + tabCount;
                contentHtml += '<div id="' + tabId + '" class="tabcontent" style="' + (tabCount === 1 ? 'display: block; ' : '') + 'margin: 0; padding: 6px">';
                tab.resources.forEach(group => {
                    contentHtml += '<div class="section">';
                    contentHtml += '<div style="margin-top: 5px; margin-bottom: 5px">&nbsp;&nbsp;&nbsp;';
                    if (group.link) {
                        contentHtml += '<a target="_blank" href="' + group.link + '">';
                    }
                    contentHtml += group.title;
                    if (group.link) {
                        contentHtml += '<img src="icons/open-in-new-window.png" style="margin-left: 6px; margin-bottom: 2px; height: 14px; vertical-align: bottom"></a>';
                    }
                    contentHtml += '</div>';
                    group.items.forEach(item => {
                        contentHtml += addDoc(item);
                        count += 1;
                        tabItemCount += 1
                    });
                    contentHtml += '</div>';
                });
                contentHtml += '</div>';
                tabHtml += '<button id="tab_' + tabId + '" class="tablinks' + (tabCount === 1 ? ' active' : '') + '" onclick="openTab(event, \'' + tabId + '\')">' + tab.tab + ' (' + tabItemCount + ')</button>\n';
            });
            document.getElementById('tabs').innerHTML = tabHtml;
            document.getElementById('tab_content').innerHTML = contentHtml;
        }
        document.getElementById('search-summary').innerHTML = ' = ' + count + ' ' + (count === 1 ? 'item' : 'items');
    }

    const filterParam = new URLSearchParams(window.location.search).get('filter');
    if (filterParam) {
        document.getElementById('filter').value = filterParam;
    }

    update();
</script>
