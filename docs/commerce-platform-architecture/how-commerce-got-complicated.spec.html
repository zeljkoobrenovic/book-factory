<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The steps by which selling moved from a market stall, where goods, price and money are on one table, to today's commerce platform, and the concept each step introduced: the promise and the record of it, the difference between what is on the shelf and what can still be sold, the order and the delivery at a distance, the price list copied to many shops, the product number and stock as a number in a computer, the page that promises in seconds, the listing on someone else's site, and one order record across every channel.\n- **Know:** For each step, both sides of it: what it made possible that could not happen before (a sale to a customer who comes back on Saturday, to a buyer far from any shop, in every town at one price, at a till that knows what was sold, at home at any hour, on a site the seller does not own, online with collection or return in a store), and what it cost (a new record, a new party, a new delay or a new way for two records to disagree).\n- **Believe:** Each step was a good bargain for seller and buyer alike: it opened trade that the earlier way of selling could not carry, and its cost was accepted for that reason. No step was ever removed, so today's complexity is the sum of those bargains, not a design.\n- **Believe:** Given those steps, the failure patterns of the next page are what one should expect, not signs of careless engineering.\n- **Be able to:** Given a term from a later chapter (promise, reservation, order, price list, system of record, SKU, POS, checkout, listing, click-and-collect), say which step of the walk introduced it and what limit it answered.\n- **Be able to:** Given a failure pattern's name, say which step makes it possible.\n\n**Audience:** A reader new to commerce architecture who has just read the introduction: they have the claim that a commerce platform makes promises in one place and keeps them in another, and no commerce vocabulary yet.\n\n**Already knows:**\n\n- Roughly what an API, a database and a web page are.\n- From the introduction: the book's claim, that Kestrel & Pine is a fictional merchant, Eva's order and its five promises in outline, and the names of the sixteen patterns.\n- Everyday buying: a market, a shop, a catalog, a supermarket till, an online shop, a marketplace, collecting a parcel in a store.\n\n**Does not yet know:**\n\n- Commerce terms: promise and handoff in the book's sense, reservation and available stock, order as a record, price list, system of record, SKU, GTIN, POS, EDI, cart, checkout, listing, connector, click-and-collect.\n- Why one order needs so many systems, and that each keeps its own copy of the facts.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader new to commerce can say, for a concept the page introduces, which step brought it in and what limit of the earlier way of selling it answered. *Probe:* Using only this page: when a shop holds a pair of boots for a customer until Saturday, why can it no longer tell from the shelf what it has to sell, and which earlier way of selling did not have that problem? | `custom` | cold_reader | major |\n| AC-2 | A reader can connect a failure pattern to the step that makes it possible. *Probe:* Using only this page: selling the same last jacket to two customers cannot happen at a market stall. Which later steps made it possible, and why? | `custom` | cold_reader | major |\n| AC-3 | Every dated fact on the page has a source the style guide accepts, the page says once that it is a simplified account that follows the ideas, and it attributes no motives to companies. | `custom` | rubric | blocker |\n| AC-4 | Every term is given in plain words before it is named, and no step uses a concept a later step introduces. | `known_before_new` | rubric | major |\n| AC-5 | A reader can say, for a step of the walk, what it made possible for the seller and for the buyer as well as what it cost. *Probe:* Using only this page: when a seller sends out a printed catalog and takes orders by post, who gains what, and who risks what? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** How did selling, which once happened at one table with the goods, the price and the money all in view, come to need so many systems, records and promises?\n\n> **Claim:** Selling became complicated one good bargain at a time: each new way of selling (the item held for a customer, the catalog, the chain of shops, the scanned till, the online shop, the marketplace, every channel at once) let someone buy or sell who could not before, and paid for it by moving the promise further from the goods, with one more record that someone must keep true; none was ever retired, so one order today rests on all of them.\n\n**Disputed by:** The view that commerce platforms are complicated because of old software, careless integration or vendors who profit from complexity, so that a clean modern platform, or a rebuild from scratch, would make selling simple again.\n\n**So what:** A reader who sees each step as a bargain that both sides wanted stops looking for the platform that removes the records, expects a failure wherever a promise is made from one record and kept from another, and reads the sixteen patterns of the next page as the price of what the steps made possible.\n\n**How and why:** At a market stall the goods, the price and the money are on one table and the seller's own eyes are the only record, but only people who are present can trade and only what lies on the table can be sold. Every later step lets more people trade (the customer who comes back on Saturday, the buyer far from any shop, the buyer in another town, the buyer at home at night, the buyer on someone else's site, the buyer who collects in a store) by letting the seller promise something that is not in front of both of them. Each such promise is made from a record (a notebook, a printed catalog, a price list, a stock number, a page, a listing) and kept later by other hands; a record can be out of date, copied wrongly or changed by two writers at once, and each step added its own way for that to happen. The dates on the page are a small set of sourced anchors, and the account is a simplification that follows the ideas.\n\n**Supporting claims**\n\n- **S1** — At a market stall the goods, the price and the money are on one table and nothing is promised; the first step away from it, a shop that holds an item for a customer, already has what every later system has: a sale both sides gain from, a promise, a record of it, a second record it can disagree with, and a judgment about whom to promise what.\n- **S2** — Each later way of selling (the catalog, the chain, the scanned till, the online shop, the marketplace, every channel at once) made possible a sale that could not happen before, to the gain of seller and buyer alike, by letting the seller promise something that is not in front of both of them.\n- **S3** — Each addition brought its own way to go wrong: a new record that can be out of date or disagree with another, a new party to depend on, or a new delay between the promise and its keeping.\n- **S4** — No step was ever removed, so one order today carries all of them at once, joined by connections that somebody has to own, and the failures the next page names are the price of what the steps made possible.\n\n## Role in the part\n\nExplains, before the failure patterns are named, where the promises, records and parties behind an order came from, what each of them made possible and what it cost, and introduces in plain words the vocabulary Part I then teaches properly. Supports PF-1 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in market stall to today: the steps are in the order the ideas accumulated, which is roughly the order of the dates; the stall and the shop are undated common practice and come first because the later steps build on them; `problem_solution` in inside each step: the limit, the addition and its name, what it made possible, what it cost, the answer to the running question)\n\nEach step uses only concepts that earlier steps introduced: the promise and its record before the order that carries a promise by post, the order and the return before the online shop that creates one and owes the other by law, the price list and its copies before the stock number that software keeps, the stock number before the page that shows a copy of it, the page before the listing that copies it to another company's site, and all of these before the step that joins the channels. The catalog comes before the chain because it gives the first copy of a price, a printed one that ages, which the chain's price list then multiplies and for which it needs the idea of an original; the page's dated anchors also fall in that order. Moving the scanned till after the online shop would leave 'a copy of the stock number' unexplained; moving the marketplace before the online shop would describe a listing before the reader knows a page can take an order. The stall and the shop come first because they set the baseline and plant the idea of a recorded promise before any technology appears, and today's order comes last because it is the sum the conclusion counts.\n\n## Introduction\n\n**Hook** (`intriguing_example`): At a market stall you pick up the pears, hear the price, pay and walk away with them, and the sale is over. When Eva Janssen taps 'Buy' for a €199 jacket and two pairs of socks in the introduction, the shop confirms her order in seconds while the jacket is still on a shelf in another town; it arrives two days later, and for two weeks after that she can send it back.\n\n**Bridge:** Everyone has bought at a market, in a shop and online, and has received an order confirmation within seconds. → The two acts look alike and are not: between the stall and the tap lie other ways of selling, each of which let someone buy or sell who could not before, and the page walks through them in the order they were added.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 and 2, in concrete words: the notebook, the catalog, the price list, the stock number, the page) and paragraph p02): Every new way of selling let someone buy or sell who could not before (the customer who comes back on Saturday, the family far from any shop, the buyer at home at night), and the price each time was a promise about goods that are not on the table and one more record that has to be right; none was ever retired, so one order today rests on all of them.\n\n**Roadmap** (Paragraph p03, with the IN THIS SECTION and KEY POINTS callouts):\n\n- The walk starts at a market stall and with the first complication of it, a shop that holds an item for a customer. *Kept in:* stall, shop.\n- It continues through the mail-order catalog, the chain of shops and the scanned till. *Kept in:* catalog, chain, scanned-till.\n- Then the online shop, the marketplace and selling through every channel at once. *Kept in:* online-shop, marketplace, every-channel.\n- It ends on today's order, shown in the book's fictional case, with one question answered at every step: what has the seller promised, and which record says so? *Kept in:* today.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At a market stall a sale is over in a moment, with the goods in the buyer's hands, while Eva's order from the introduction is confirmed in seconds although the jacket is still on a shelf in another town, arrives two days later and can be sent back for two weeks. | scenario: Pears bought at a stall (illustration); Eva's €235 order of 13 April 2027 from the introduction (fictional; scenario ledger) three conditions that hold for it and fail in every later step, then the first answer to the running question. The conditions cannot come before the sale they describe, and the later steps cannot be announced before the conditions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | At a market stall the buyer sees and handles the goods, hears the price and pays, and goods and money change hands in the same moment. | scenario: An illustration of common practice: a grower's stall on market day, a basket of pears, a price called out, coins for fruit. |  |\n| p05 | explanation | Nothing is promised and nothing is written down at the stall: the buyer has inspected the goods, and the seller knows the price and sees on the table what is left. |  | `cause_effect`: Goods and money changing hands in one moment. → Why that needs no promise, no record and no trust. |\n| p06 | analysis | The stall is that simple only under three conditions (both people are present, only what lies on the table is sold, and one person knows the goods, the price and what is left), and each later step begins where one of them did not hold. | figure: Figure: buyer and seller at one table with pears, a price sign and coins. | `contrast`: A sale with no promise and no record. → The three conditions that make it possible, and the announcement that the later steps start where they fail. |\n| p07 | synthesis | At the stall the seller has promised nothing beyond the moment, and no record says anything, because the table itself shows what there is. |  | `conclusion_summary`: The stall and its conditions. → The first answer to the running question. |\n\n### The Shop: A Pair of Boots Held Until Saturday\n\n**Controlling idea** (`example`, id `shop`): Even between neighbors selling was never quite simple: a shop that holds an item for a customer has made a promise, needs a record of it, has a shelf that no longer says what can be sold, and has to decide whom to promise what.\n\n**Advances the thesis** (S1): Shows that the first promise, with no technology at all, already needs a record, a second record to compare it with and a judgment about whom to promise what.\n\n**Transition in:** `contrast`: The stall sells only what is on the table, to whoever is present with the money. → The oldest way around that: goods kept back today for a customer who returns on Saturday.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | context | A customer finds boots that fit but is paid on Saturday, so the shopkeeper agrees to keep the pair for her; that statement, which the seller will later have to make true, is what the book calls a promise. | scenario: An illustration, labeled as one and as common practice: a shoe shop with shelves and a back room, a regular customer, 'I will keep them for you until Saturday'. The term promise is owned by journey-of-an-order. |  |\n| p09 | definition | The shopkeeper writes the hold in a notebook, and from then on the shelf shows one pair more than can be sold: the hold is a reservation, and what is on the shelf minus what is promised is what the book calls available. | example: The notebook line: who, which pair, until when, at what price. The terms reservation and available are owned by inventory-and-availability. | `cause_effect`: A promise to keep the boots. → What the promise requires: a written record, and a difference between what is on the shelf and what can be sold. |\n| p10 | analysis | The hold is a good bargain for both sides: the customer gets boots that would otherwise be sold before her payday, and the shopkeeper makes a sale that would have walked out of the door and keeps a regular customer. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p11 | cause_effect | The price is that two things now have to agree, the shelf and the notebook: an assistant who has not read the notebook sells the held pair, or the year-end count differs from the stock book, and comparing two records of one thing until they agree is what the book calls reconciliation. | reasoning: The Thursday assistant and the held pair; the count of the shelves against the stock book. The term reconciliation is owned by events-consistency-and-reconciliation. | `contrast`: What the hold made possible for both sides. → Its price: a record that someone can fail to read, and a count that can disagree with the book. |\n| p12 | analysis | A shopkeeper who makes promises also has to decide whom to hold for, for how long, at what price and whether the goods may come back, and those decisions are the plainest form of the promises every later step makes again, which by the online shop have grown into the five the introduction counted on Eva's order. | reasoning: The regular and the stranger; until Saturday, not until spring; the price on the tag on the day she asked; boots that do not fit after all. Tied to the promises the introduction counts on Eva's order.; figure: Figure: the shopkeeper sets a pair of boots aside and writes in a notebook; Saturday is circled on a calendar; an assistant reaches for the same pair. | `elaboration`: A promise and its record. → The standing concerns of selling in their plainest form (whom, how long, what price, whether it can be returned), as the seed of the five promises the walk arrives at. |\n| p13 | synthesis | In the shop the seller has promised these boots, at this price, until Saturday, and the only record is a notebook that only the shopkeeper reads. |  | `conclusion_summary`: The hold, the notebook and the decisions behind them. → The second answer to the running question, longer than the first. |\n\n### The Catalog: A Promise Sent by Post\n\n**Controlling idea** (`example`, id `catalog`): The mail-order catalog let a seller promise goods to buyers who never enter a shop, and paid for it with a printed promise that ages, an order that travels through several hands, a carrier, and goods the buyer must be allowed to send back.\n\n**Advances the thesis** (S2, S3): Shows the promise made at a distance: the description stands in for the goods, the order becomes a document, and delivery and return become promises of their own.\n\n**Transition in:** `contrast`: The shop promises only to customers who can walk in. → A way to sell to people far from any shop: a printed list sent by post.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | context | A shop serves only people who can reach it, so a seller prints a list of goods with descriptions and prices and posts it to buyers far away; on that page the printed description has to do what the buyer's eyes did at the stall, and the book calls it product information. | fact: Chicago History Museum (2022): Montgomery Ward 'issued its first mail order catalog on August 18, 1872. It was printed on a single sheet of paper, offering 163 distinct items', for 'consumers in rural and farming communities'. The term product information is owned by product-information. |  |\n| p15 | definition | The buyer typically writes down what she wants and posts it with her payment, and that letter is an order: a written record of what was asked for, at what price and where to send it, which exists before the goods move and passes through the hands of a clerk, a packer and a carrier. | example: The order letter and its path: clerk, packer, carrier (a company paid to transport the parcel). The term order is owned by order-management; the carrier by shipping-and-delivery. | `cause_effect`: A catalog in the buyer's hands. → What the buyer sends back: the order, a document that travels, and the carrier who brings the goods. |\n| p16 | analysis | The catalog is a good bargain for both sides: a buyer far from any shop gets a choice and a printed price that were out of reach, and the seller sells to a whole country from one building. | reasoning: Stated as common practice, for the buyer and for the seller in turn. | `cause_effect`: The catalog, the order and the carrier. → What they made possible for the buyer and for the seller. |\n| p17 | cause_effect | The price is a promise that can be printed months before it is kept, because the catalog is a copy of the seller's prices and shelves and a copy ages: the item may be sold out or its price changed when the letter arrives, the parcel is days in the hands of a carrier the seller does not control, and because the buyer pays for goods she has not seen sellers commonly promise to take them back, which the book calls a return. | fact: Chicago History Museum (2022): Ward's offerings were 'backed by the company slogan, \"satisfaction guaranteed or your money back\"'. The term return is owned by returns-and-exchanges.; figure: Figure: a buyer at a farmhouse table with a catalog posts an order letter; a clerk in a distant building reads it beside a shelf with an empty place; a parcel travels back by cart. | `contrast`: What the catalog made possible. → Its price: a printed copy that ages, a delivery someone else carries out, and the return. |\n| p18 | synthesis | With the catalog the seller has promised the item as described, at the printed price, delivered, with the money back if the buyer is not satisfied, and three records in three places say so: the catalog in the buyer's kitchen, the order letter and the seller's stock book. |  | `conclusion_summary`: The catalog, the order, the carrier and the return. → The third answer to the running question: four promises and three records. |\n\n### The Chain: One Price List, Many Shops\n\n**Controlling idea** (`example`, id `chain`): A chain of shops lets one seller offer the same goods at the same price in many towns, and pays for it with copies: a price list and a stock book decided in one place and copied to every shop, where a copy can be late or wrong.\n\n**Advances the thesis** (S2, S3): Shows the first copies of a fact: the original at head office and a copy in each shop, which is the root of the book's question of who owns a fact.\n\n**Transition in:** `contrast`: The catalog seller works from one building. → A seller with shops in many towns, which no one owner can stand in.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | context | One owner can stand in one shop, so a seller with shops in many towns has a head office decide what every shop sells and at what price, and send each shop the list. | fact: Chicago History Museum (2022): Ward 'expanded into the retail sector in 1926 with the opening of its flagship store in Chicago' and 'by the start of the 1930s, Ward operated more than 500 stores in the United States'. |  |\n| p20 | definition | The list that says what each item costs is a price list, and in a chain it exists once at head office and once more in every shop. | example: The price list on paper at head office and in each shop's drawer. The term price list is owned by pricing-architecture. | `elaboration`: Head office decides and sends the list. → The name of that list and the fact that it now exists in many places. |\n| p21 | definition | Head office's list is the original and each shop's list is a copy; the book calls the place where a fact is decided its system of record, and everything else a copy of it. | example: Original and copies of one price list. The terms system of record and copy are owned by boundaries-and-systems-of-record. | `elaboration`: One list in many places. → Which of them counts: the original, named the system of record, against its copies. |\n| p22 | analysis | The chain is a good bargain for both sides: the buyer finds the same goods at the same price in every town and can trust a shop she has never entered, and the seller buys in bulk and grows beyond what one owner can watch. | reasoning: Stated as common practice, for the buyer and for the seller in turn. | `cause_effect`: One list, decided once and copied. → What that made possible for the buyer and for the seller. |\n| p23 | cause_effect | The price is that a copy can be late or wrong: a price changed at head office on Monday is still the old price in one shop on Thursday, and head office knows each shop's shelves, and the central warehouse's, only from reports that are days old. | reasoning: The Monday price change and the Thursday shop; stock in a central warehouse and in every shop, known at head office from reports. The warehouse is owned by warehouse-and-fulfillment.; figure: Figure: a head office sends the same price list to three shops; two show the new price and one still shows the old one. | `contrast`: What the chain made possible. → Its price: copies of the price list and of the stock book that lag behind the original. |\n| p24 | synthesis | In the chain the seller has promised the same goods at the same price in every shop, and the records are head office's price list and stock book plus a copy of each in every shop. |  | `conclusion_summary`: The price list, its copies and the reports. → The fourth answer to the running question: one promise, many copies. |\n\n### The Scanned Till: Stock Becomes a Number\n\n**Controlling idea** (`example`, id `scanned-till`): The barcode and the scanning till gave every product a number and turned stock into a number in a computer that each sale changes, which lets the seller know what was sold everywhere and lets everyone stop looking at the shelf.\n\n**Advances the thesis** (S2, S3): Shows the moment the record of stock moves into software: the number is now what people and programs trust, and it can differ from the shelf.\n\n**Transition in:** `cause_effect`: A chain with thousands of products learns what was sold only by counting and reporting. → A way for a machine to read which product is being sold: a pattern of bars that stands for a number.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | context | In a chain with thousands of products a clerk reads each price from a sticker and head office learns what was sold by counting, so a pattern of bars that a machine reads as a number is printed on each product: the barcode. | fact: GS1's history timeline: 'On 3 April 1973, industry leaders in the U.S. retail grocery sector created the barcode'; on 26 June 1974 'in a Marsh supermarket located in Ohio' a 'pack of Wrigley's gum becomes the first product in the world to be scanned with a barcode'; in 1977 the European Article Numbering Association 'is established ... in Brussels, Belgium'. |  |\n| p26 | definition | The number names one product exactly, down to its size and color: the seller's own code for one sellable variant is a SKU, and the worldwide number under the bars is a GTIN. | example: One jacket in one size and one color has one number. The terms SKU and GTIN are owned by product-information. | `elaboration`: A number a machine can read from the product. → What the number identifies, and the book's two names for it. |\n| p27 | definition | The till that scans the bars looks the price up in a computer and subtracts one from that product's stock number, so stock is now a number that software keeps and every sale changes; such a till is a point of sale, or POS. | example: A scan: price looked up, stock number minus one. The term POS is owned by stores-and-omnichannel. | `cause_effect`: A product number at the till. → What the till does with it: looks up the price and changes a stock number, and the name of such a till. |\n| p28 | analysis | The scanned till is a good bargain for both sides: the buyer gets a faster queue, an itemized receipt and fewer empty shelves, and the seller knows each evening what was sold in every shop and can let the computer reorder from the supplier by a structured message between the two companies, which is called EDI. | fact: GS1's history timeline dates its 'first international standard for electronic data interchange (EDI)' to 1989. The term EDI is owned by edi-and-e-invoicing. | `cause_effect`: Stock as a number in a computer. → What that made possible for the buyer and for the seller, including orders sent between companies by message. |\n| p29 | cause_effect | The price is that the number is not the shelf: theft, breakage, a mis-scan or a delivery booked but not unpacked leave them apart, and because the number is there the shelf is commonly checked less often. | statistic: DeHoratius and Raman, Management Science, 2008: 'Examining nearly 370,000 inventory records from 37 stores of one retailer, we find 65% to be inaccurate'; an old study of one retailer, as inventory-and-availability says.; figure: Figure: a clerk scans a product at a till; a screen shows a stock number of 12 while the shelf behind holds fewer items; an order message leaves for a supplier's truck. | `contrast`: What the scanned till made possible. → Its price: a number that people and programs trust and that can be wrong. |\n| p30 | synthesis | At the scanned till the seller promises what the chain promised, but the price is now whatever the computer says, and the record is a price and a stock number in a computer that almost nobody compares with the shelf. |  | `conclusion_summary`: The product number, the till and the stock number. → The fifth answer to the running question: the record has moved into software. |\n\n### The Online Shop: A Page That Promises in Seconds\n\n**Controlling idea** (`example`, id `online-shop`): The online shop shows the computer's prices and stock numbers to any buyer at any hour and confirms an order without a person reading it, so the promise is made in seconds from copies and kept over days by other hands.\n\n**Advances the thesis** (S2, S3): Shows the promise and its keeping coming fully apart in time: software promises at once, from copies, and the warehouse and the carrier keep the promise later.\n\n**Transition in:** `cause_effect`: Prices and stock are numbers in a computer. → A page that shows those numbers to buyers directly, at any hour, and takes their orders.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | context | A printed catalog ages and a shop closes in the evening, but once prices and stock are in a computer a web page can show them to anyone at any hour; the pages a buyer sees are the storefront. | fact: Amazon's annual report for 1997 (Form 10-K, filed 30 March 1998): the company 'commenced offering products for sale on its Web site in July 1995'. The storefront is owned by storefront-architecture. |  |\n| p32 | definition | The buyer collects items in a cart, which is a draft that promises nothing, and at checkout gives an address and pays, after which software creates the order and confirms it without any person having read it. | example: Cart, checkout, payment through a payment provider, confirmation. The terms cart and checkout are owned by cart-and-checkout; taking the money by commerce-payments. | `sequence`: A page that shows goods, prices and stock. → How the buyer orders on it: the cart, the checkout, and an order created by software. |\n| p33 | analysis | The online shop is a good bargain for both sides: the buyer shops from home at any hour and sees today's price and stock, and the seller reaches a whole country without a shop or a printing press, with shop software that even a small seller can rent. | reasoning: Stated as common practice; shop software rented as a service is the hosted platform of commerce-platform-landscape. | `cause_effect`: The page, the cart and the checkout. → What they made possible for the buyer and for the seller. |\n| p34 | cause_effect | The first part of the price is that the page promises from copies and nobody checks: 'in stock' is a copy of the stock number that may be an hour old, the delivery date comes from a fixed rule, the order goes to the warehouse as a message that can arrive late, twice or not at all, and the passing of the order from one system to the next is what the book calls a handoff. | reasoning: The clerk who read the order letter could write back 'sold out'; software confirms at once. The term handoff is owned by journey-of-an-order; messages between systems by integration-styles. | `contrast`: What the online shop made possible. → The first part of its price: promises made from copies, and an order passed on by message. |\n| p35 | cause_effect | The second part of the price is that the buyer cannot try the goods, so the return becomes a right in law, that on the busiest day of the year every buyer arrives at once, and that a rented shop changed deeply to fit one seller can no longer take its vendor's updates. | fact: Directive 2011/83/EU, Article 9(1): 'a period of 14 days to withdraw from a distance or off-premises contract, without giving any reason'; Article 28(2): it applies 'to contracts concluded after 13 June 2014'. Reused from commerce-regulation.; figure: Figure: a buyer at home at night taps Buy on a laptop that shows an in-stock mark; in a dark warehouse the shelf place for that item is empty; an order message flies between them. | `additional_support`: Promises made from copies. → Three further costs: the legal right of return, the peak day, and the customized rented shop. |\n| p36 | synthesis | In the online shop the seller has promised this item, at this price, in stock, delivered by a date and returnable within 14 days, all within seconds, and the records are a page built from copies of the stock number, the price list and a delivery rule, and an order that software wrote. |  | `conclusion_summary`: The page, the order created by software and the legal return. → The sixth answer to the running question: five promises in seconds, from copies. |\n\n### The Marketplace: Selling in Someone Else's Shop Window\n\n**Controlling idea** (`example`, id `marketplace`): A marketplace lets a seller offer its goods on a large site that buyers already use, and pays for it by letting another company make the promise in the seller's name, from one more copy of the seller's products, prices and stock.\n\n**Advances the thesis** (S2, S3): Shows a promise-maker the seller does not control, and the first connections between systems of different companies that somebody has to own.\n\n**Transition in:** `cause_effect`: A seller's own online shop is one site among very many. → A way to be found where buyers already are: offering goods on another company's site.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | context | Many buyers begin their search on a few very large sites, so a seller's own online shop may never be found; such a site can let other sellers offer their goods on its pages, and is then a marketplace. | fact: Amazon's annual report for 2000 (Form 10-K, filed 23 March 2001): 'Through our Amazon Marketplace, Auctions and zShops services, any business or individual can sell virtually anything' to its customers. |  |\n| p38 | definition | The seller describes each product in the marketplace's own format, with a price and a stock number, and that entry is a listing; the marketplace takes the order and the money and tells the seller, who ships, and the software that copies listings and stock out and brings orders back is a connector; each place where a seller sells (its shops, its online shop, a marketplace) is a channel. | example: A listing, a marketplace order, a connector, a channel. The terms listing and marketplace order are owned by marketplaces-and-channel-integration; connectors by integration-styles. | `elaboration`: A site that lets other sellers offer goods. → What the seller puts there (a listing), who takes the order, and the software that links the two companies. |\n| p39 | analysis | The marketplace is a good bargain for both sides: the buyer searches many sellers at once and pays through a site she already trusts, and the seller reaches buyers who would never have found its own shop, without building anything. | reasoning: Stated as common practice, for the buyer and for the seller in turn. | `cause_effect`: Listings on someone else's site. → What they made possible for the buyer and for the seller. |\n| p40 | cause_effect | The price is that another company now makes the promise in the seller's name and by its own rules, each marketplace sells from its own copy of the stock number, and every channel needs a connector that someone built, that depends on a format the marketplace may change, and that often only one person understands. | reasoning: The last unit sold on two sites in the same hour; penalties for late or canceled orders; a connector per channel; a format changed on the marketplace's schedule.; figure: Figure: a large marketplace building with many small sellers' windows; the buyer shops at one window; behind it a thin cable runs to the seller's own small shop and its shelf. | `contrast`: What the marketplace made possible. → Its price: a promise-maker the seller does not control, more copies of stock, and connectors that need an owner. |\n| p41 | synthesis | On a marketplace the same five things are promised, but by the marketplace, on its terms, in the seller's name, and the records are a listing on each marketplace, each a copy of the seller's product, price and stock, and an order that begins in the marketplace's records. |  | `conclusion_summary`: The listing, the marketplace's order and the connector. → The seventh answer to the running question: the promise is made by someone else. |\n\n### Every Channel at Once: Stores as Warehouses\n\n**Controlling idea** (`example`, id `every-channel`): Selling through shops, an online shop and marketplaces as one business lets a buyer order in one place and collect or return in another, and pays for it by making every shelf promise to every channel and by giving one order, one customer and one return several records.\n\n**Advances the thesis** (S2, S3): Shows the steps so far combined in one seller, where the copies of stock, order and customer multiply across channels.\n\n**Transition in:** `additional_support`: A seller that has shops, an online shop and marketplace listings, each with its own stock, orders and customers. → The buyer who sees one brand and wants to cross from one channel to another.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of selling comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | context | A seller by now has shops, an online shop and marketplace listings, each with its own stock, orders and customers, while the buyer sees one brand and wants to buy online and collect in a shop today, or hand a parcel back over a counter. | fact: GS1's history timeline, 2014: 'GS1 builds a new global strategy to respond to the demands of digital, omni-channel commerce'. |  |\n| p43 | definition | Buying online and collecting in a store is click-and-collect, a store can also pack online orders from its own shelf, and for both the store's shelf has to be promised on the web page and one order has to be visible to the store, the online shop and the warehouse alike, which is the job of one order record for all channels. | example: Click-and-collect and a store that packs online orders from its own shelf; one order record kept in an order management system. The terms are owned by stores-and-omnichannel and order-management. | `elaboration`: A buyer who crosses channels. → The name of the commonest crossing, and what it requires: store stock on the page and one order record. |\n| p44 | analysis | Selling across channels is a good bargain for both sides: the buyer has the item today from a store nearby and returns it wherever suits her, and the seller sells stock that would have sat in a store and keeps a sale when the warehouse is empty. | reasoning: Stated as common practice, for the buyer and for the seller in turn. | `cause_effect`: Store stock on the page and one order record. → What they made possible for the buyer and for the seller. |\n| p45 | cause_effect | The price is that every shelf now promises to every channel while one order, one customer and one return each have several records: an order has a different status in each system, the same person is an online account, a loyalty card and an e-mail address, and a return handed in at a store has to reach the people who refund, restock and correct the invoice, each exactly once. | reasoning: A store shelf that shoppers empty while the page still offers it; three statuses for one order; one person in three lists; a return refunded twice. Customer records are owned by identity-and-master-data, returns by returns-and-exchanges.; figure: Figure: one buyer with a phone stands between a store, a warehouse and a parcel locker; an order ticket is copied to each; a returned parcel on the store counter. | `contrast`: What selling across channels made possible. → Its price: several records of the same order, customer and return. |\n| p46 | synthesis | Across every channel the seller has promised any item, from any shelf, collected or delivered, returnable anywhere, and there is a stock number for each location, an order record in each system and a customer record in each channel, unless one of them has been named as the one that counts. |  | `conclusion_summary`: Store stock on the page, one order in many systems. → The eighth answer to the running question: many records of each fact. |\n\n### Today: Every Step at Once, and the Connections Between Them\n\n**Controlling idea** (`synthesis`, id `today`): No earlier way of selling was retired, so one order today rests on all of them at once, and what the present adds is the connections between systems from different vendors and software that acts on its own, which is where the failures of the next page live.\n\n**Advances the thesis** (S4): Shows the accumulation in one present-day order from the book's fictional case and names what today adds: connections that somebody has to own.\n\n**Transition in:** `conclusion_summary`: Eight ways of selling, each with its promise and its record. → The present, in which all of them are in use at once.\n\n**Order of paragraphs** (`problem_solution`): The last step adds no new way of selling, so it opens with the claim that nothing was retired, then names what the present itself adds (the connections), then counts all of it in one order, then gives what the whole makes possible, what it costs and the last answer. The count of 34 connections cannot come before connections are named, and the cost of the whole cannot be weighed before its gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | claim | None of these ways of selling was retired when the next arrived, so an order today rests on all of them, each still present because the limit it answered is still present. | reasoning: The list: a promise and a reservation, an order and a carrier, a price list and its copies, a product number and a stock number, a page, a listing, shelves in several places. |  |\n| p49 | explanation | What the present adds is not another way of selling: the connections, added one at a time since the online shop, have become the main thing, because each system comes from a different vendor and was connected when the need arose, and software now acts on its own, as apps, scripts and lately AI agents that change prices, stock and orders. | example: A connection between two systems is an integration (integration-styles); apps are owned by extensibility-and-app-ecosystems, agents by ai-and-agentic-commerce. | `elaboration`: Every step still in use. → What the present makes of the connections added since the online shop, and software that acts on its own. |\n| p48 | example | Eva's order from the book's fictional merchant shows them together: five promises made in seconds, thirteen steps, seven systems of which six keep their own record of the order, at a company with four channels, thirteen systems and 34 connections, and a parcel that arrived a day later than the page promised. | scenario: Scenario ledger and journey-of-an-order: Eva Janssen, Tuesday 13 April 2027 at 21:14, a €199 jacket and two €18 pairs of socks, €235; promised for Wednesday under a static rule written for an earlier warehouse, delivered Thursday 15 April; thirteen steps, seven systems, six with their own record; Kestrel & Pine's four channels, thirteen systems and 34 integrations. | `example`: All the steps, and the connections between them. → One present-day order in which all of them can be counted. |\n| p50 | analysis | Together the steps make it possible for almost anyone to buy almost anything from almost anywhere at any hour and send it back: a brand with six stores sells a jacket at 21:14 to a customer in another city with nobody at a desk. | scenario: Eva's order again: six stores, 21:14, Nijmegen. | `cause_effect`: Eva's order and what stands behind it. → What the steps make possible together. |\n| p51 | cause_effect | The price is that every promise rests on a copy made by a connection someone has to own, and that the whole can be changed carelessly: by copying the design of a far larger company, by moving everything to a new platform on one date, by forcing several brands onto one set of systems, by missing a legal deadline, or by a script or agent that changes stock with no owner. | reasoning: Each clause is the seed of a pattern the next page names (The Giant's Boots, The Burned Bridge, One Size Fits None, The Long Fuse, The Secret Agent); legal deadlines are owned by commerce-regulation.; figure: Figure: a buyer taps Buy on a phone; behind the tap, in a row, stand a notebook, a catalog, a price list, a scanning till, a web page, a marketplace window and a store shelf, joined by cables, one of which hangs loose. | `contrast`: What the steps make possible together. → The price of the whole: unowned connections, and five ways of changing the landscape badly. |\n| p52 | synthesis | Today the seller promises five things in seconds and seven systems keep them over days, and there is one record in each system, each right about its own part, so the question becomes which record counts. |  | `conclusion_summary`: Eva's order, the connections and their price. → The last and longest answer to the running question. |\n\n## Conclusion: What the Steps Add Up To\n\n**Synthesis:** Read together, the steps show one movement that no single step shows: each moved the promise further from the goods, in distance, in time and in the number of records and hands between them, and the answer to 'what has been promised, and which record says so?' grew from 'nothing, and none' to five promises resting on a record in every system.\n\n**So what:** The steps answer limits that still exist, and each bought trade that both sides wanted (the buyer who comes back, the buyer far away, the buyer at home at night, the buyer on another site or in a store), so no new platform removes the records; a builder should expect a failure wherever a promise is made from one record and kept from another, and decide which record counts.\n\n**Callback:** The pears bought at the stall, and Eva's tap. The reader can now count what stands behind the tap that did not stand behind the stall: five promises, thirteen steps, seven systems, six records of one order and fourteen days in which the goods can come back.\n\n**Takeaway** (`broader_implications`): The failure patterns of the next page are the price of what these steps made possible, not signs of careless engineering: each is a promise that one of these records made and another could not keep.\n\n**Hand-off** to [Out of Stock, Out of Sync: Sixteen Ways Commerce Platforms Go Wrong](where-commerce-platforms-go-wrong.html): `cause_effect`: The steps of the previous page: each way of selling moved the promise further from the goods and added a record that someone must keep true, and none was removed; together with the introduction's claim that a failure is a promise one system made and another could not keep, its four scale stages, and its list of the sixteen pattern names grouped by family. → What those steps make possible: each pattern unpacked, with its warning sign, why it happens, what it costs, one fictional and one public example, a remedy direction and the chapters that address it; then the stages at which patterns strike and the chains they form.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | synthesis | Set side by side, the nine steps each made a kind of sale possible and each added a concept, a party or a record and a way to go wrong, and the last column of the table is the vocabulary of the next page. | table: Nine rows (market stall, shop, catalog, chain, scanned till, online shop, marketplace, every channel, today) with columns: Step, What it made possible, What it added, New record or party, What can now go wrong; the last column uses the sixteen pattern names exactly, each once, and plain words where none applies. |  |\n| p54 | synthesis | The few dates the walk used, set in order of time, show how recent most of the steps are: the mail-order catalog is about 150 years old, the scanned barcode about 50 and selling on the web about 30, while the stall and the shop have no date because they are common practice and not events. | table: A timeline of the page's dated anchors only, each with the step it belongs to: 1872 (Montgomery Ward's first mail-order catalog), 1926 (its flagship store; more than 500 by the start of the 1930s), 1973 and 1974 (the barcode and its first scan), 1977 (the European numbering association), 1989 (GS1's first international EDI standard), 1995 (Amazon begins selling on its website), 2000 (Amazon's annual report describes its Marketplace), 2008 (the study of inventory records), 2014 (the EU's 14-day withdrawal right applies; GS1's omni-channel strategy). No date is added that the steps did not give. | `additional_support`: The table of steps, which is in the order of the ideas. → The same steps placed in time by the dates the page has given. |\n| p55 | synthesis | Behind the act that began as pears for coins there now stand five promises, thirteen steps, seven systems and six records of one order, because every step moved the promise further from the goods. | scenario: Eva's order as told in the introduction and journey-of-an-order: five promises, thirteen steps, seven systems, six with their own record, a 14-day return. | `elaboration`: The steps side by side and in time. → The count behind one present-day order, and the single movement the steps share. |\n| p56 | refutation | The complexity is the price of all the trade these steps opened, not a mistake: each step answers a limit that still exists, so no new platform or rebuild makes selling simple again, and a failure should be expected wherever a promise is made from one record and kept from another. | reasoning: Buyers are still far away, still shop at night, still start on other companies' sites and still want to collect and return in a store; a new platform has to keep the same records or hand them to someone else. | `cause_effect`: Five promises, seven systems to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html), [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- The four scale stages, a scene at Kestrel & Pine, the three tiers of take-away and questions to ask: the page follows the field-evolution shape, not the chapter format.\n- What is changing now (AI shopping agents, new protocols) beyond one clause at the last step. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Why any company did what it did: no motives are attributed.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No source was fetched for when chains of shops with one price list first appeared; the chain step is dated only by one company's flagship store (1926) and its store count by the start of the 1930s, from the Chicago History Museum's page.\n- No date is given for the first online shop, the first marketplace, the first hosted shop platform or the first click-and-collect service: no primary source for a 'first' was readable, and the page needs none.\n- The mail-order and chain anchors are from the United States and the legal return from the European Union; the author may prefer a European mail-order anchor if a primary source is found.\n\n## Decision log\n\n- **2026-11-17** — Nine steps: market stall, shop (an item held), catalog, chain, scanned till, online shop, marketplace, every channel at once, today. The shop's complication is a hold, not credit, because the sibling book SETTLED tells credit and this book's subject is the promise about goods. Rejected: Shop credit as the complication (it is the payments story).; A separate step for the department store or for self-service (no concept the tally needs).; A separate step for the hosted shop platform (its need is the online shop's; it is one clause there).; A separate step for wholesale and orders between companies (one clause in the scanned-till step; Part V teaches rm (not stated on the company page fetched).; Wikipedia or secondary histories for any date.\n\n## Sources\n\n- **Internal**\n  - .claude/skills/field-evolution/SKILL.md — The page's purpose, shape (need, concept, gain, cost), evidence rules and checks.\n  - _journals/payments-platform-architecture/posts/how-payments-got-complicated — The model page and spec: voice, length, how each step closes, the two tables and the figure series.\n  - _journals/commerce-platform-architecture/PLAN.md — The page contract and the chapters that own each concept.\n  - _journals/commerce-platform-architecture/journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged; the transition into the next page.\n  - _research/style-guide.md — Voice, evidence discipline, the sixteen pattern names, valid permalinks, the figure format and the book suffix for prompts.\n  - _research/scenario-ledger.md — Eva's order: amounts, dates and systems; Kestrel & Pine's channels, systems and integrations.\n  - journey-of-an-order — Thirteen steps, seven systems, six records; the static delivery rule behind the one-day miss.\n- **External**\n  - Chicago History Museum, 'Montgomery Ward's First Catalog', Jojo Galvan, 17 August 2022 — 1872 and the single-sheet catalog; the money-back slogan; 1926 and more than 500 stores by the start of the 1930s.\n  - GS1, '50 years of transforming tomorrow' (history timeline), n.d., accessed 2026-11 — 1973, 1974, 1977, 1989 and 2014.\n  - Amazon.com, Inc., Form 10-K for 1997 (filed 30 March 1998) and for 2000 (filed 23 March 2001), SEC EDGAR — July 1995; the Marketplace service as described for 2000.\n  - DeHoratius and Raman, 'Inventory Record Inaccuracy: An Empirical Analysis', Management Science 54(4), 2008 — 65% of nearly 370,000 records inaccurate at one retailer.\n  - Directive 2011/83/EU on consumer rights, Official Journal, 22 November 2011 — The 14-day right of withdrawal (Article 9) and its application to contracts concluded after 13 June 2014 (Article 28).\n\n## Changelog\n\n- **2026-11-17** — First draft of the spec, written with the field-evolution and spec-creator skills from the PLAN contract; intent, thesis and role copied from the journal spec.\n- **2026-11-17** — Thesis rubric by a fresh agent: pass (note: 'good' in 'good bargain' is made specific by the rest of the sentence).\n- **2026-11-17** — First flow rubric by a fresh agent (sound with notes), acted on: in the last step the paragraph on what the present adds moved before Eva's order, so the 34 connections are counted after connections are named; 'channel' named in the marketplace step, packing online orders in a store named beside click-and-collect, the delivery rule named in the online-shop step; the stall and the last step have their own flow reasons; the page's reason says why the catalog precedes the chain.\n- **2026-11-17** — Second flow rubric by a fresh agent, after the reorder (sound with notes), acted on without changing the order: the shop step no longer lists the five promises but says the shopkeeper's decisions grow into them by the online shop; the catalog's cost says the catalog is a copy that ages; the last step says the connections were added since the online shop and are now the main thing. Notes not acted on, for the author: the last step's cost lists five careless changes that only the next page explains (kept, because the tally's last row needs a seed for each pattern name); the timeline stands between the tally and the count (the field-evolution shape); the marketplace paragraph names listing, connector and channel together; EDI is named inside a gain paragraph; the online shop's second cost paragraph holds three unrelated costs; no break case is declared for the marketplace before every channel.\n- **2026-11-17** — Accepted under the author's delegation of spec acceptance for these pages (17 November 2026): validates, thesis rubric passed, flow rubric sound with notes.\n- **2026-11-17** — Article written from the accepted spec (4,090 words by check_draft.py structure; structure check passes). Visual layer: 10 figures generated and inspected (one per step and one overview; article-illustrator); icon generated. Written and not yet checked by the draft-check skill.\n- **2026-11-17** — Independent verification pass: 27 dated, quoted or sourced claims checked against the six listed sources, all re-fetched (24 confirmed; 2 corrected: Ward's 1926 store is the 'flagship store' of the source, not its 'first store', and the 'rural and farming communities' quotation is now attributed as the company's mission in the museum's wording; 1 qualified: the directive replaced an earlier one); 18 generalizations about common practice hedged ('typically', 'commonly', 'can'), among them 'nobody looks at the shelf', which contradicted inventory-and-availability; 16 pattern names, 33 links and the Kestrel & Pine facts checked without change. Matching wording in four controlling ideas, the timeline evidence and one open question. No unit added, dropped or moved.\n"}]}]}</script>

                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
