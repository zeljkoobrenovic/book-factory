custom` | rubric | major |\n\n## Thesis\n\n**Question:** How large should a team be and who should be in it, derived from load, on-call and coordination cost?\n\n> **Claim:** A team should be as large as three things require and no larger: enough people to understand and change what it owns without depending on one of them, enough to sustain its on-call rotation, and few enough that it can coordinate without splitting into sub-teams — which for teams that write and operate their own services gives Larson's six to eight engineers with one manager, and which gives a different number when the scope, the on-call duty or the cost of producing a change is different; the team's composition follows the same logic, bringing product, design and engineering together wherever a decision would otherwise wait for another team.\n\n**Disputed by:** The view that smaller teams are faster, so teams should be kept as small as possible (the two-pizza rule), and the opposite planning habit of sizing teams by the budget available.\n\n**So what:** A leader states the assumptions behind a team's size, grows, shrinks or merges a team when one of them changes, and stops creating teams of two or three that cannot survive a holiday or a resignation.\n\n**How and why:** Below about four people a team has no redundancy: one absence removes a skill or breaks the rotation. Above about eight, the number of relations inside the team makes it split informally into sub-teams. Larson's rules of thumb are the results of that reasoning for teams that write and operate their own services; the reasoning is what carries over to other situations, the numbers do not. Composition follows from the same concern with waiting: a decision about what to build or how it should work that needs a role the team lacks waits for another team, so the roles such decisions need sit inside the team.\n\n**Supporting claims**\n\n- **S1** — A team's size is the result of three requirements and not an input: two floors, enough people to understand and change what the team owns without depending on one of them and enough to sustain its on-call rotation, and one ceiling, few enough to coordinate without splitting into sub-teams.\n- **S2** — For teams that write and operate their own services the three requirements give Larson's six to eight engineers with one manager; each of his rules of thumb has a stated reason and assumptions, and a different scope, on-call duty or cost of producing a change gives a different number.\n- **S3** — A team below one of its floors should grow, shed or share scope and on-call, or merge; headcount added elsewhere does not help, and teams of two or three should not be created because they cannot survive a holiday or a resignation.\n- **S4** — Composition follows the same concern with waiting: the roles that decisions about what to build and how it should work need, product, design and engineering and where needed data, sit inside the team, because a decision that needs a role the team lacks waits for another team.\n\n## Role in the part\n\nDerives team size and composition, and closes Part II by reading one team as a type, a mode and a size. Supports P2-3 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in floors-and-ceiling, derive-the-size, grow-shed-merge: the requirements come before the steps that apply them, and the derivation before the remedies for a team that fails it)\n\nThe reader meets two sizes nobody can explain before any rule. The requirements come next because they answer that puzzle, then the two patterns that use them. Composition follows size because it applies the same reasoning to roles, and it must precede the section on where the sources disagree, which compares Larson's numbers with the Build What Matters ratio that composition introduces. The disagreement among sources and the anti-patterns come only after the reader has the derivation to judge them with. The worked example uses only the requirements and the two patterns; it is placed late, as the page format asks, so that one input of a derivation the reader has just seen run, and the closing of Part II comes last because it needs this chapter's result. Sources first would be numbers with nothing to derive them from.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 every engineer on Corvane's platform team was on call two weeks in every five, and in August, with one colleague on holiday, every second week. The team had five engineers, and nobody at Corvane could say why five.\n\n**Bridge:** Most readers lead or work in teams whose size came from a budget line, a division of headcount or a number that was simply never revisited, and have heard six to eight, or two pizzas, quoted as the right answer. → A size that was never derived cannot be defended or corrected; the question is what a team's size should be derived from.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A team should be as large as three things require and no larger: enough people to understand and change what it owns without depending on one of them, enough to sustain its on-call rotation, and few enough to coordinate without splitting into sub-teams. For teams that write and operate their own services that gives Will Larson's six to eight engineers with one manager, and it gives a different number when the scope, the on-call duty or the cost of producing a change is different. Composition follows the same logic: product, design and engineering sit together wherever a decision would otherwise wait for another team.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See two team sizes at Corvane that nobody derived. *Kept in:* two-sizes-scene.\n- Understand the two floors and the ceiling that set a team's size, and where Larson's numbers come from. *Kept in:* floors-and-ceiling.\n- Derive a size from a team's scope and on-call duty. *Kept in:* derive-the-size.\n- Choose among growing, shedding and merging for a team that is too small. *Kept in:* grow-shed-merge.\n- Decide which roles belong inside the team. *Kept in:* composition.\n- Know where the sources disagree and what a smaller team gives up, and recognize the two usual ways sizing goes wrong. *Kept in:* sources-disagree, anti-patterns.\n- Size Corvane's platform team, and see which input AI changes. *Kept in:* worked-example, what-ai-changes-here.\n- Close Part II by reading the platform team as a type, a mode and a size. *Kept in:* closing-part-two.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 each of the five engineers on Corvane's platform team was on call two weeks in five, and nobody could say why the team had five engineers or why the product teams had eight. | scenario: Corvane, 2024, 180 people: platform team of five engineers on a two-tier on-call rotation, two weeks in five each, every second week in August with one engineer on holiday; five had been the team's size since 2022; the eleven product teams had about eight because about ninety engineers were divided by eleven. |  |\n| p02 | claim | A team should be as large as understanding its scope, sustaining its on-call rotation and coordinating without sub-teams require, which gives six to eight under stated assumptions, and its composition follows the same concern with waiting. |  | `problem_solution`: Two sizes with no reason behind them, and the previous chapters' team types and interaction modes, which decide what a team owns and how much of its time others consume. → How many people and which roles that requires, as one claim, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Two Team Sizes Nobody Derived\n\n**Controlling idea** (`example`, id `two-sizes-scene`): Corvane gave its twelve teams two sizes in 2023, eight by division and five by history; the eight held up and the five did not, and the company could explain neither.\n\n**Advances the thesis** (S1): Gives the case the chapter explains: sizes used as inputs, one of which failed.\n\n**Transition in:** `elaboration`: The lead's two numbers, five and eight. → Where each number came from and what five cost.\n\n**Order of paragraphs** (`chronological`): The reader sees where each number came from, then what the smaller one cost in 2024, before the question of what a size should come from is put.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2023 Corvane formed eleven product teams of about eight engineers by dividing people evenly and kept its platform team at the five it had had since 2022. | scenario: Ledger, stage 3: 95 engineers; eleven product teams of about eight formed in 2023 by dividing people evenly; platform team of five, led by Lena Brandt, formed in 2022 when Corvane had about 45 engineers. New fact: the five was never revisited when the number of engineers it served doubled. |  |\n| p04 | example | Five engineers on a two-tier rotation meant each was on call two weeks in five, and the same five also did the launch checks every other team waited for. | scenario: New ledger facts: the platform team ran a two-tier rotation (primary and secondary) around the clock for the shared infrastructure and the release tooling; each engineer on call two weeks in five; in August 2024 one engineer was on holiday for three weeks and the other four were on call every second week. Ledger: 14 open launch requests at the peak in 2024. | `cause_effect`: A team of five that was never re-sized. → What five meant week by week in 2024. |\n| p05 | analysis | The eight held up and the five did not, and Corvane could explain neither, because both numbers had been inputs to the design and not results of it. | scenario: New ledger fact: product teams of about eight ran two-tier rotations for their own services, two weeks in eight each. Ledger: a size from division (ninety by eleven) and a size from history. | `contrast`: The platform team's five. → The product teams' eight, which worked, and the fact that nobody could say why either. |\n\n### Two Floors and a Ceiling: What Sets a Team's Size\n\n**Controlling idea** (`explanation`, id `floors-and-ceiling`): A team's size lies between two floors, understanding and on-call, and one ceiling, coordination; for teams that write and operate their own services these meet at Larson's six to eight, and the reasoning carries to other situations where the numbers do not.\n\n**Advances the thesis** (S1, S2): States the derivation and shows Larson's rules of thumb as its results under stated assumptions.\n\n**Transition in:** `problem_solution`: Two sizes nobody could explain. → The three requirements a size is derived from.\n\n**Order of paragraphs** (`prerequisite_order`): The frame of two floors and a ceiling comes first; each requirement is then taken in turn because the result needs all three; Larson's rules are tabled only after the reasons that produce them, and the limit of the numbers is drawn last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | claim (figure) | A team's size is a result of three requirements: two floors, set by what the team must understand and by the rotation it must sustain, and one ceiling, set by what it can coordinate; between them, the number depends on how much work the scope demands at the current cost of producing a change. | figure: Mermaid flowchart LR: \"Scope: what the team owns\" -> \"Understanding floor: every part changeable by at least two people\"; \"On-call duty\" -> \"Rotation floor: enough trained people for every tier\"; both floors -> \"Floor: the higher of the two\"; \"Coordination inside the team\" -> \"Ceiling: the size at which sub-teams form\"; floor and ceiling -> \"Team size: between floor and ceiling\"; \"Work the scope demands, at the current cost of producing a change\" -> team size; edge labeled \"floor above ceiling\" -> \"Too much for one team: shed, share or split\". Caption states that size is derived from scope, on-call and coordination, and that a floor above the ceiling means the scope is too large for one team. |  |\n| p07 | explanation | The first floor is understanding: a team needs enough people that every part it owns can be changed without depending on one of them, and below about four it has no redundancy at all. | source: Chapter 4's ownership test (a team owns a thing only when its members can change and operate it without relying on one particular person) and cognitive load as the measure of what a team must understand.; quotation: Larson: \"Teams with fewer than four individuals are a sufficiently leaky abstraction that they function indistinguishably from individuals.\" He adds that to reason about such a team's delivery you have to know about each on-call shift, vacation and interruption, and that he has regretted every team of one or two he sponsored. | `elaboration`: Two floors and a ceiling. → The first floor and Larson's reason for a minimum of four. |\n| p08 | explanation | The second floor is the on-call rotation: a team that operates its services around the clock needs enough trained people per tier that being on call stays an occasional duty; the author puts the least at six for two tiers (one week in three), and Larson's rule of thumb is eight. | quotation: Larson: \"My rule of thumb is that it takes eight engineers on a team to support a two-tier on-call rotation\". He also notes that only trained engineers can go on call.; reasoning: The author's arithmetic, not Larson's: with two tiers and n engineers each is on call 2 weeks in n; eight gives one week in four, six one in three, five two in five. The threshold of one week in three, six engineers, is the author's judgement; Larson's eight leaves room for holidays and for engineers still in training. | `additional_support`: The floor set by understanding. → A second floor, set by on-call, with on-call and two-tier rotation defined. |\n| p09 | explanation | The ceiling is coordination: the relations inside a team grow much faster than its headcount, so above about eight a team splits informally into sub-teams and its manager can no longer invest in each person. | reasoning: Arithmetic: n people have n(n-1)/2 pairs: 5 have 10, 8 have 28, 12 have 66.; source: Larson on managers: managers supporting more than eight or nine engineers typically act as coaches and safety nets, too busy to invest actively in their team or its area of responsibility; managers supporting fewer than four tend to function as tech lead managers who take on a share of design and implementation. | `contrast`: Two floors that push the size up. → The ceiling that holds it down. |\n| p10 | evidence (table) | For teams that write and operate their own services an understanding floor of four, a rotation floor of six at the least and eight to be safe, and a ceiling of about eight give six to eight engineers with one manager, which is Larson's steady-state size, and each of his rules of thumb has a reason and an assumption. | table: Table of Larson's rules of thumb. Columns: Rule of thumb / His reason / What it assumes. Rows: managers support six to eight engineers (below four the manager becomes a tech lead manager, above eight or nine a coach and safety net; assumes a full-time people manager); three to five engineers when the manager does hands-on technical work (the manager's time is shared; assumes the manager is expected to do hands-on work); about eight engineers for a two-tier on-call rotation (rule of thumb for the rotation; assumes the team operates its own services around the clock in two tiers, with trained engineers); fewer than four is not a team (it functions like individuals; assumes the team is meant to be planned as a unit). The steady-state six to eight is given in the lead-in; growing and budding is in p13.; quotation: Larson: \"Teams should be six to eight during steady state.\" | `cause_effect`: Two floors and a ceiling, each with a reason. → Where they meet for a team that writes and operates its own services, and Larson's rules as the results. |\n| p11 | analysis | The reasoning carries over to other teams and the numbers do not: change the scope, the on-call duty or the cost of producing a change and the size that comes out is different. | reasoning: Three variations: a team with no around-the-clock duty has only the understanding floor, so four or five can be right; a team whose manager does hands-on work is three to five by Larson's own rule; a team whose rotation floor is above its coordination ceiling owns too much for one team. | `contrast`: Six to eight as the result for one kind of team. → What happens to the number when an input changes. |\n\n### Pattern: Derive the Size from Scope and On-Call\n\n**Controlling idea** (`process`, id `derive-the-size`): A size is derived in five steps from the team's scope, its on-call duty, its ceiling and the work the scope demands, and a team reaches that size by growing and splitting, never by being created empty.\n\n**Advances the thesis** (S1, S2): Turns the derivation into steps a reader can run, with its user and its outcome measure.\n\n**Transition in:** `sequence`: The three requirements and their reasons. → The steps that apply them to one team.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | process (list) | The pattern's user is the manager of a team and the leader who approves its headcount; its outcome measures are the share of weeks each engineer is on call and the number of parts only one person can change; and it has five steps. | reasoning: Steps: 1 list what the team owns and operates, part by part; 2 for each part count who can change it safely, and set the understanding floor so that every part has at least two; 3 write down the on-call duty (hours, tiers) and set the rotation floor, using Larson's eight for two tiers around the clock as the starting point; 4 take the higher floor and compare it with the ceiling of about eight engineers with one manager, and between the two add engineers only for the work the scope demands at the current cost of producing a change; 5 if the floor is above the ceiling or above what you can staff, change the scope or the duty, not the arithmetic. Record the assumptions with the result. |  |\n| p13 | recommendation | A team reaches its derived size by growing from a working team and splitting, never by being assembled empty. | source: Larson: to create a new team, grow an existing team to eight to ten and then bud into two teams of four or five; never create empty teams. The ten and the four are passing states, briefly above the ceiling and briefly at the understanding floor (the author's gloss). | `sequence`: A derived size. → How a team gets to that size without being assembled from nothing. |\n\n### Pattern: Grow, Shed or Merge a Team That Is Too Small\n\n**Controlling idea** (`recommendation`, id `grow-shed-merge`): A team below one of its floors has three remedies, growing, shedding or sharing scope and on-call, and merging, and the choice depends on which floor is broken and on who else could carry the work.\n\n**Advances the thesis** (S3): Gives the remedies for a team below its floors and rules out the remedy that does not work.\n\n**Transition in:** `problem_solution`: A derivation that can show a team is below its floor. → The three remedies and how to choose among them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | comparison (table) | The pattern's user is the leader responsible for a team below one of its floors, its outcome measure is that the team passes both floors again by a date set with the remedy, and it offers three remedies whose fit depends on which floor is broken. | table: Table. Columns: Remedy / What it changes / What it costs / Fits when. Rows: Grow (raises the team to its floor; months of hiring and training, since only trained engineers go on call; fits when nobody else can understand or operate the scope and the scope will stay). Shed or share scope and on-call (lowers the floor: a service moves to a team that can own it, or the rotation is shared with a team that knows the systems; the receiving team carries more and must learn the systems; fits when part of the scope belongs elsewhere or a neighbouring team already understands it). Merge (two teams below the floor become one above it; one combined scope to understand, one team identity lost; fits when the two scopes are adjacent and neither team can reach its floor alone). |  |\n| p15 | refutation | What does not help is headcount that never reaches the team: people added to other teams, a part-time share of someone who cannot join the rotation, or a person borrowed from a team that then suffers; Larson moves scope instead. | reasoning: A floor is a property of one team's scope and duty; engineers elsewhere neither understand its parts nor carry its pager. Larson: only trained engineers can go on call.; quotation: Larson: \"I've found it most fruitful to move scope between teams, preserving the teams themselves.\"; source: Larson, on moving people between teams: teams have high fixed costs, so moving one person out can set a healthy team back. | `contrast`: Three remedies that work. → The remedies that look similar and do not. |\n\n### Composition: The Roles a Decision Would Otherwise Wait For\n\n**Controlling idea** (`explanation`, id `composition`): A team's composition follows from waiting: the roles its decisions about what to build and how it should work need sit inside the team, in the proportions the work requires, because a decision that needs an absent role waits for another team.\n\n**Advances the thesis** (S4): Applies the chapter's reasoning to who is in the team.\n\n**Transition in:** `similarity`: Size derived from what the team must do. → Composition derived the same way, from the decisions the team must make.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The rule is stated, the roles and the published ratios are tabled as evidence, and Corvane shows what a shared role costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | claim | A decision about what to build or how it should work that needs a role the team lacks waits for another team, so the roles such decisions need, product, design and engineering, belong inside the team. | source: Cagan and Jones, Empowered, as recorded in the author's summary: product managers, designers and engineers work as one team, and design treated as an internal service outside the teams starves discovery. Foster and Nerlikar, Build What Matters, as recorded in the author's summary: design works with product as a peer. |  |\n| p17 | evidence (table) | Which roles a team needs full-time depends on how often its decisions need them, and the published ratio from Build What Matters is a starting point with the same standing as Larson's numbers. | table: Table. Columns: Role / The decisions it brings / Sign that it is missing / Full-time or shared. Rows: Engineering (how to build, change and operate it; nothing ships; the core, sized by the derivation). Product management (which problem is next and what counts as done; engineers guess priorities or wait for an answer; one per team). Design (how it should work for the user; screens wait for a designer or ship undesigned; in the team where the product has a user interface that changes often; shared where it rarely does). Data, where needed (whether a change produced its outcome; nobody can say if a release worked; in the team when its decisions rest on usage data it cannot read itself). Quality assurance appears only in the quoted ratio; where quality engineering sits is left to chapter 16.; quotation: Build What Matters: \"5 to 7 Developers (your base value) 1 Product Manager 0.5 UX Designer (variable depending on the nature of the product) 0.3 UI Designer (variable depending on the nature of the product) 1 or 2 Quality Assurance Engineers\". | `elaboration`: The roles belong in the team. → Which roles, how much of each, and one published ratio. |\n| p18 | example | At Corvane in 2024 every product team had its own product manager and eight of the eleven shared a designer, so in those eight a decision about how a screen should work waited for the designer's days with the team. | scenario: Ledger, stage 3: 11 product managers and 7 designers for eleven product teams. New fact: three teams had a designer of their own and four designers each worked for two teams. | `example`: Roles in the proportions the work requires. → What a shared role cost at Corvane. |\n\n### Where the Sources Disagree: Six to Eight of What, and Why Not Fewer\n\n**Controlling idea** (`comparison`, id `sources-disagree`): The sources give different numbers because they count different things and guard different bounds, and the widely quoted case for the smallest possible team guards only the ceiling; a smaller team gains coordination and gives up redundancy.\n\n**Advances the thesis** (S2, S3): Answers the thesis's opponent, that smaller is faster, and states what the familiar numbers count.\n\n**Transition in:** `contrast`: One published ratio and one set of rules of thumb, both used so far as if they agreed. → Where they and the two-pizza rule pull apart.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The disagreement is stated, resolved by showing what each source counts, and then the trade the small-team view leaves out is tabled.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | counterargument | Larson, Build What Matters and the two-pizza rule give three different answers to how large a team should be. | source: Larson: six to eight engineers per manager. Build What Matters: five to seven developers plus a product manager, parts of two designers and one or two quality assurance engineers, about eight to eleven people. The two-pizza rule, widely attributed to Amazon: a team should be small enough to be fed by two pizzas; cited only as the widely known rule, as a supplement to the author's sources. |  |\n| p20 | refutation | The three count different things and guard different bounds: Larson counts the engineers one manager supports, Build What Matters counts the whole product team around a similar number of engineers, and the two-pizza rule guards only the ceiling. | reasoning: The book's resolution: the floors and the ceiling of this chapter count engineers, as Larson does, and on that count the ratio's five to seven developers agrees with him; the product manager and designers come on top; a rule that names only a maximum is silent about the floors. | `problem_solution`: Three numbers that disagree. → What each one counts, and the book's way of using them together. |\n| p21 | comparison (table) | A smaller team gains easier coordination and gives up redundancy, so smaller is faster only for a team with a narrow scope and no rotation to sustain. | table: Table. Columns: Engineers / What the team gains / What it gives up / Right when. Rows: two or three (almost no coordination; any redundancy: one absence stops a skill or the rotation; a temporary group with an end date, not a standing team). Four or five (little coordination, a hands-on manager; an around-the-clock two-tier rotation, room for a resignation; narrow scope, no such rotation, or a team that has just budded and will grow). Six to eight (redundancy in every part and a sustainable rotation; some coordination cost, a full-time manager; a team that writes and operates its own services). | `elaboration`: A rule that guards only the ceiling. → What each size gains and gives up. |\n\n### Anti-Patterns: Sized by Budget, Small on Principle\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Sizing goes wrong in two usual ways: the size is taken from the budget or from division, or teams are kept or created small on principle.\n\n**Advances the thesis** (S1, S3): Names the two habits the thesis disputes with the book's failure patterns.\n\n**Transition in:** `example`: What each size gains and gives up. → The two habits that ignore that trade.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | analysis | A size taken from the budget or from dividing headcount gives every team the same number whatever it owns, which leaves the team with the widest scope or the heaviest duty below its floor. | scenario: Corvane 2023: eleven teams of about eight by division and a platform team left at five, below its rotation floor; teams cut to fit a number have boundaries that follow the headcount; failure patterns The Org Chart as Architecture and The Overloaded Team. |  |\n| p23 | analysis | Teams of two or three arise in two ways, created for a new initiative on the belief that small is fast or left behind by a reorganization, and both ways produce a standing team that depends on particular people. | source: Larson regretted every team of one or two he sponsored. Failure pattern: The Hero Culture. | `contrast`: One number for every team. → The opposite habit: the smallest possible team. |\n\n### Worked Example: Sizing Corvane's Platform Team\n\n**Controlling idea** (`example`, id `worked-example`): Derived at the end of 2024, the platform team's size comes out at eight: its understanding floor is met at five, its rotation floor is not, growing is the only remedy that fits, and the product teams' eight passes the same test.\n\n**Advances the thesis** (S1, S2, S3): Runs the derivation and the choice of remedy on the team the chapter opened with.\n\n**Transition in:** `example`: The derivation, the remedies and the two anti-patterns. → All of them applied to the platform team of the opening.\n\n**Order of paragraphs** (`chronological`): The reader follows the derivation in the order of the pattern's steps: scope, floors and ceiling, remedy, and then the same test on a team whose size was right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | description | At the end of 2024 the platform team owned three parts, each of which at least two of its five engineers could change, and it was on call for two of them around the clock in two tiers. | table: Table. Columns: Part / Engineers who can change it safely / On-call duty. Rows: release path (automated readiness checks and deployment tooling): 3, two tiers around the clock; shared infrastructure (hosting, databases, monitoring): 3, two tiers around the clock; shared data model for customers and jobs: 2, working hours. New ledger facts; the launch checks themselves had left the team with the 2024 release path. |  |\n| p25 | analysis | The derivation gives eight: the understanding floor is met at five, the rotation floor is not (five is below the least of six; six leaves nothing for a holiday or an engineer in training, so the floor taken for this team is Larson's eight), the ceiling is about eight, and the work the scope demands calls for no more. | reasoning: Understanding floor: every part has at least two people, so five passes. Rotation floor: two tiers around the clock; six at the least, and Larson's eight taken for this team because of holidays and training (August 2024). Ceiling: about eight engineers with one manager. Floor and ceiling meet at eight. | `cause_effect`: The team's scope and duty. → The size they require. |\n| p26 | analysis | Of the three remedies only growing fitted, so Corvane hired three platform engineers in the first half of 2025, and each joined the rotation only after training. | scenario: New ledger facts: Lena Brandt proposed and Dario Vance approved growing the platform team from five to eight in the plan for 2025; shedding the rotation was rejected because no product team understood the shared infrastructure; merging was rejected because no team had an adjacent scope; a single tier was rejected because a missed alert would stop every team's releases; three engineers joined in the first half of 2025 and joined the rotation after a quarter each; by the end of 2025 each engineer was on call two weeks in eight. Scope had already been shed once, in 2024, when the launch checks moved to the product teams. | `problem_solution`: A floor of eight and a team of five. → The remedy chosen and why the other two did not fit. |\n| p27 | analysis | The same test explains why the product teams' eight had worked: Scheduling, with eight engineers and a two-tier rotation for its own services, met both floors and sat at the ceiling. | scenario: Ledger: Scheduling, eight engineers; after the 2025 re-cut four engineers could change the job-status rules (one before). New facts: two-tier rotation for its own services, two weeks in eight; after the re-cut no part that only one engineer could change. | `similarity`: The platform team derived. → A product team put through the same derivation. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI changes one input of the derivation, the cost of producing a change, and leaves the two floors and the ceiling to be applied again; which way the number moves is not yet known.\n\n**Advances the thesis** (S2): Names the input the journal thesis says AI changes and labels every claim about it.\n\n**Transition in:** `additional_support`: A derivation with stated inputs, run for Corvane in 2024. → The one input coding agents change.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | analysis | Coding agents lower the cost of producing a change, which is the input that decided how many engineers a given scope needed, and they leave the understanding floor and the rotation floor where they were. | reasoning: Labeled Emerging, the author's observation as of November 2026: agents add capacity for writing changes. The floors do not count hands that write: one counts people who understand each part, the other trained people on a rotation. |  |\n| p29 | analysis | What follows is speculative: a team may own a wider scope at the same size, or teams may settle nearer the floors, and the limit is then what the team can understand and verify. | reasoning: Labeled Speculative; would be confirmed where organizations with agents in every team report stable teams of four or five that sustain their rotations (for example through shared rotations), or teams of six to eight owning measurably more without more parts known to one person. Full argument in team-shape-and-roles-with-ai. | `cause_effect`: One input changed and two floors unchanged. → What may happen to team size, and what would confirm it. |\n\n### Closing Part II: One Team Read as a Type, a Mode and a Size\n\n**Controlling idea** (`synthesis`, id `closing-part-two`): Type, mode and size are one decision made three times, and Corvane's platform team was the right type with the wrong mode and too few people for its scope, none of which the org chart showed.\n\n**Advances the thesis** (S1, S3): Carries the closing the journal spec assigns to this chapter for Part II: synthesis, so-what and callback to the part's opening.\n\n**Transition in:** `conclusion_summary`: This chapter's derivation, applied to Corvane and to AI. → The same team read with all three chapters of Part II.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | synthesis (table) | Read with the three chapters of Part II, Corvane's platform team of 2024 was the right type, in the wrong mode, with too few people for its scope. | table: Table. Columns: Reading / What the team should have been / What it was in 2024 / Shown on the org chart? Rows: Type (chapter 6): a platform team, which exists to take mechanics off the teams that deliver to users / a platform team / only the name. Mode (chapter 7): X-as-a-Service, the product teams releasing without asking / a request for a launch, a collaboration nobody chose that had become a queue / no. Size (this chapter): eight for its rotation, or a smaller duty / five / the number, not the reason. |  |\n| p31 | synthesis | The three readings are one decision made three times: what a team is for decides how others should reach it, and both decide how many people it needs. | reasoning: Part II's closing synthesis. A platform team that serves through a service needs people to build and operate the service; one that serves through requests needs people in proportion to the requests; Corvane changed the mode in 2024 and only then could the size be derived. Callback to the part's opening: the team of five created to help eleven teams release faster. | `conclusion_summary`: Three readings of one team. → Why they are one decision, and the part's opening team seen again. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** A team size is an answer with its working shown: the floors come from what the team owns and must sustain, the ceiling from what it can coordinate, and the roles from the decisions it must make. The same reasoning that sizes a team says what to do when the size is wrong, and Part II as a whole says that type, mode and size are one decision made three times.\n\n**So what:** The reader can state the assumptions behind a team's size, tell whether a team that is too small should grow, shed scope or merge, stop creating teams of two or three, and re-derive the number when scope, on-call duty or the cost of producing a change moves.\n\n**Callback:** The platform team of five, on call two weeks in five, whose size nobody could explain; and Part II's opening, the team created to help eleven teams release faster. The reader can now say why five was wrong (the rotation floor), why eight was right for the product teams, and can read the same team as a type, a mode and a size.\n\n**Takeaway** (`course_of_action`): List your teams with a type, the mode of each of their main interactions, and the reason for each team's size; where the reason is missing, derive it. The checklist gives the steps.\n\n**Hand-off** to [Part III — PRODUCT: The Product Operating Model](part-3.html): `sequence`: Teams, their interfaces and their sizes. → What those teams are asked to achieve, and who decides it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | synthesis (list) | Established: Larson's rules of thumb and their reasons, the arithmetic of pairs with his rules for growing teams and moving scope, and the product sources' placing of product, design and engineering in one team. |  |  |\n| p33 | synthesis (list) | Depends on context: the number itself, which remedy fits a team that is too small, and which roles a team needs full-time. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p34 | synthesis (list) | The author's synthesis: the frame of two floors and a ceiling, the arithmetic of on-call weeks with its one-week-in-three threshold, composition derived from waiting, and the reading of one team as a type, a mode and a size. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p35 | recommendation (list) | Seven checks let the reader list their teams with a type, a mode and a reason for each size, and derive the sizes that have no reason. |  | `sequence`: What to take away. → What to do with it. |\n| p36 | transition | With teams, their interfaces and their sizes settled, the next question is what those teams are asked to achieve and who decides it, which Part III takes up. |  | `sequence`: The team of five, now explained, and Part II's three chapters. → What the teams are asked to achieve, and who decides it. |\n\n## Non-goals\n\n- Spans of control above the team and layers of managers, including Larson's four to six managers per manager of managers See [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html).\n- The four team types and when each is justified See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- Interaction modes and team APIs See [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html).\n- Assessing cognitive load and placing boundaries See [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html).\n- Team states and where headcount should go See [Flow and the Constraint](flow-and-the-constraint.html).\n- The product, engineering and design triad and who decides what See [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html), [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- On-call practice, incident ownership and where quality engineering sits See [Quality and Reliability as Operating Model](quality-and-reliability.html).\n- How a platform team is run and judged See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- The full argument about team shape and roles with AI See [[team-shape-and-roles-with-ai]].\n- Hiring plans and onboarding See [[hiring-and-onboarding]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The threshold of one week in three for a two-tier rotation (six engineers at the least) is the author's judgement, introduced so that Larson's six to eight follows from the derivation; confirm or replace it.\n- The journal spec's Part II closing says the platform team had too few people for its scope; the chapter shows it was too few for its rotation and words the closing as scope that includes a rotation around the clock. Consider the same wording in the journal spec.\n- New Corvane facts to confirm: the platform team's two-tier rotation and on-call weeks, its three parts and who could change each at the end of 2024, its growth from five to eight in the first half of 2025, the product teams' two-tier rotations, and the split of seven designers across eleven teams (three dedicated, four shared between two teams each).\n- The arithmetic of on-call weeks (two weeks in n for two tiers) is the author's reading; the notes give Larson's number for a two-tier rotation without his arithmetic. Confirm against the book.\n- A shared rotation is offered as a remedy in the author's voice and is not attributed to Larson, because the passage is not in the Kindle notes.\n- Part II's closing is a last body section before What to Take Away, as in chapter 5, because the conclusion's five fixed units have no room for it.\n- The readings of the platform team's type and mode rest on the journal-spec entries of chapters 6 and 7, which were being written in parallel; check the wording against those chapters once they exist.\n- The AI section makes no Proven claim; published evidence is left to Part XI.\n- The org-design record team-size-and-composition has the same permalink as this page, so it is linked by path and not with [[...]].\n\n## Decision log\n\n- **2026-11-19** — After round 2 of the draft check: the Tuesday Reorg example is removed from the small-teams anti-pattern, since the ledger does not say the two teams were remnants of two or three; the worked example states that six is the least and eight is taken because of holidays and training. Rejected: Inventing a new Corvane fact about the Tuesday Reorg, which belongs to the chapter on reorganizations\n- **2026-11-19** — After round 1 of the draft check: the rotation floor gets a stated threshold, one week in three or six engineers for two tiers, marked as the author's judgement, with Larson's eight as the safe number; and the ceiling counts engineers only, with product manager and designers on top. Both were local faults in the spec's numbers that two flow readers found independently. Rejected: Leaving a floor of eight and a ceiling of eight to produce six to eight; Counting every role against a ceiling stated in engineers\n- **2026-11-19** — After the flow rubric (sound with notes): the cost of producing a change is an explicit input of the derivation (p06, figure, step 4 of p12) so that the AI section changes something the reader has seen operate; Larson on moving scope moved to the remedies (p15); p23 carries only how small teams arise. Not acted on: moving the worked example directly after the two patterns, because the page format places it late and the AI section relies on a derivation just seen run. Rejected: Worked example directly after the patterns\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — The chapter frames the three requirements of the thesis as two floors (understanding, on-call) and one ceiling (coordination); the frame is the author's, the numbers Larson's. Rejected: Presenting Larson's rules as a list of numbers first and reasons second\n- **2026-11-19** — The platform team is the chapter's single running case (scene, worked example, part closing), with one product team as the contrast, because the part's closing reads that team as a type, a mode and a size. Rejected: A separate invented small team for the too-small pattern\n- **2026-11-19** — Spans above the team and layers are left to chapter 20; Larson's four to six managers per manager of managers is not treated here.\n- **2026-11-19** — The two-pizza rule is cited only as the widely known rule attributed to Amazon, with no detail, as a supplement to the author's sources.\n- **2026-11-19** — Trade-offs of smaller teams are placed inside the section on where the sources disagree, because the small-team rule is the disagreement. Rejected: A separate trade-offs section\n\n## Sources\n\n- **Internal**\n  - <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
