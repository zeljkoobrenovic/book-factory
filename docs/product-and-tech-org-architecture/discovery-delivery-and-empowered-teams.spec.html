<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What an empowered product team is, in Cagan's sense, and what it is accountable for.\n- **Know:** Discovery and delivery as two kinds of work done by the same team.\n- **Know:** Product operations as the support system: data, customer access, process.\n- **Believe:** Leaders own the problem space and its order; teams own the solution space.\n- **Believe:** Empowerment without a stated outcome and strategic context is abandonment.\n- **Be able to:** Sort a list of decisions into those that belong to leaders and those that belong to the team.\n- **Be able to:** Recognize a feature team that is called empowered.\n- **Be able to:** Say what product operations should take off product managers.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given six decisions, the reader assigns each to leaders or to the team and justifies the two hardest. *Probe:* Who decides each, leaders or the product team: (1) which customer segment to serve; (2) whether to solve double-booking with a warning or a hard block; (3) the order of this year's three outcomes; (4) which experiment to run first; (5) the measure of success for an outcome; (6) whether to build or buy the notification service? | `custom` | cold_reader | major |\n| AC-2 | The chapter states the tension between vision-led and empowered product work and resolves it explicitly. | `custom` | rubric | major |\n| AC-3 | The chapter's closing synthesizes Part III. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n| AC-4 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-5 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What may a product team decide for itself, and how does that fit with a vision set at the top?\n\n> **Claim:** A product team may decide the solution — what to build, how it should work and the order of its experiments — and is accountable for the outcome; leaders decide which problems matter, the order of those problems and how success is measured. That fits with a vision set at the top because the vision bounds the problem space and leaves the solution space open, and it works only when the team has the context, the access to customers and the data to discover solutions, which is what discovery practice and product operations provide.\n\n**Disputed by:** The bottom-up reading of empowerment, that any direction from the top turns teams into feature teams; and the opposite management instinct that teams cannot be trusted with solutions that matter.\n\n**So what:** A leader hands a team a problem, a measure and the context, then judges the result; and funds the customer access and data without which the handing over is empty.\n\n**How and why:** The people closest to the customer and the technology see solutions the leaders cannot, while the leaders see across teams and time, which the team cannot. Each level deciding in the space where it has the information is the decision-right lever of chapter 1 applied to product work.\n\n**Supporting claims**\n\n- **S1** — The line between what leaders and a product team decide is a decision right: leaders decide which customers and problems matter, the order of the problems and what counts as success; the team decides what to build, how it works and the order of its experiments, and answers for the outcome.\n- **S2** — The line sits there because of where the information is: the team is closest to the customer and the technology, and the leaders see across teams and across time; a vision set at the top bounds the problem space and leaves the solution space open.\n- **S3** — A team can use its share only if it does discovery as well as delivery: it finds out which solution is worth building before paying to build it.\n- **S4** — Discovery needs access to customers, data and a shared way of working, which stop reaching teams as a company grows and which product operations exists to supply.\n- **S5** — Without the line stated, empowerment fails in two opposite ways, the feature team under a new name and the team left alone, and the apparent conflict between vision-led and empowered product work is a conflict between two readings, not between the sources.\n\n## Role in the part\n\nDraws the line between what leaders and teams decide, resolving the main tension inside the product model, and closes Part III. Supports P3-4 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in two-spaces, the-handover, discovery-and-delivery, product-operations: the line is defined before the handover that carries it, the handover before the discovery it makes necessary, and discovery before the support it needs)\n\nAfter the page-format callouts the reader meets two teams that failed in opposite ways under one announcement, then the line that both lacked, then the three patterns in the order each makes the next necessary. The failures are named only after the patterns because each is the absence of one half of them; the comparison of sources follows because the two failures are the one-sided readings of the two schools; the worked example comes after the conditions it has to respect, and the AI coda last because it tests the finished model. Putting the sources first would ask the reader to weigh two books before knowing what decision is in dispute.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2025 Corvane's new CPO told about thirty teams that they were empowered. Two quarters later one team was still building a list that came from sales, and another had spent a quarter on a problem nobody had chosen.\n\n**Bridge:** Most readers have heard a leader announce that teams are empowered and have watched little change, or watched a team drift. → Both outcomes follow from the same omission: nobody said which decisions were now the team's and which stayed with the leaders.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A product team decides the solution and the order of its experiments and answers for the outcome; leaders decide which problems matter, their order and how success is measured. A vision set at the top fits with that because it bounds the problem space and leaves the solution space open, and the arrangement works only when the team has the context, the customer access and the data to discover solutions.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See two Corvane teams that were both called empowered go wrong in opposite ways. *Kept in:* two-teams-called-empowered.\n- Learn the line between the problem space and the solution space, and sort decisions by it. *Kept in:* two-spaces.\n- Learn three patterns that let a team use its share: the handover, with the conditions that move the line; discovery and delivery in one team; and product operations. *Kept in:* the-handover, discovery-and-delivery, product-operations.\n- Recognize the two ways empowerment fails when the line is missing. *Kept in:* anti-patterns.\n- See how the vision-led and the empowered schools fit together. *Kept in:* where-the-sources-disagree.\n- Follow one Corvane team through a problem handed over with the line stated. *Kept in:* worked-example.\n- Know what AI changes about the line. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane's teams were told in 2025 that they were empowered, and two quarters later one was still building a list from sales and another had spent a quarter on a problem nobody had chosen, because nobody had said what a team now decides. | scenario: Corvane, 2025, about 500 people, about thirty teams: Priya Nambiar, CPO, replaces the list of promised features with a roadmap of outcomes and tells the teams they are empowered; the Customer Portal team keeps receiving features from sales; the Reporting team rebuilds its report builder unasked. |  |\n| p02 | claim | A product team decides the solution and answers for the outcome while leaders decide the problems, their order and the measure of success, and the chapter shows the line, the three patterns that make it usable, how it fails, how the sources fit, one worked case and what AI changes. |  | `problem_solution`: Two teams that did not know what they were allowed to decide. → The line that tells them, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Two Teams Called Empowered\n\n**Controlling idea** (`example`, id `two-teams-called-empowered`): At Corvane in 2025 the same announcement left one team taking orders and another without direction, which shows that the word empowered decides nothing until someone states who decides what.\n\n**Advances the thesis** (S5): Gives the two failures the rest of the chapter explains and that the anti-patterns section names.\n\n**Transition in:** `elaboration`: The lead's short account of two teams. → The situation in full: what was announced and what each team did.\n\n**Order of paragraphs** (`chronological`): The announcement comes first because both teams' behavior is a response to it; the two teams follow as its two results.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2025 Corvane, which had shipped forty-one customer-promised features in 2024 while its renewal rate fell, replaced that list with a roadmap of outcomes and gave every team a goal that named a measure, and its new CPO, Priya Nambiar, told the teams that they were empowered without saying what a team now decided. | scenario: Ledger (chapters 9 and 11): in 2024, at 180 people, Corvane shipped forty-one features, each promised to a named customer, and the renewal rate fell; in mid-2025 Priya Nambiar as CPO rewrote the roadmap as outcomes, each team's 2025 goal named a driver, and the contractual promises were kept. New for this chapter: at the same time she announces that teams are empowered. |  |\n| p04 | description | The Customer Portal team's goal named a measure, but it went on receiving features from the sales director through its product manager, filed them under the goal, and kept only the decision of how to build them. | scenario: Customer Portal, 2025: the sales director sends the product manager the requests of the three largest accounts each month; the product manager turns them into the team's backlog and files each under the team's goal; the quarter's plan reads as three features with dates from sales. | `example`: An announcement that did not say who decides what. → The first team, for which nothing changed. |\n| p05 | description | The Reporting team's goal named a measure it could do little to move and nobody stated a problem, so it chose its own and after a quarter nobody could say what the work had been for; both teams lacked the same thing, a stated line between the leaders' decisions and the team's. | scenario: Reporting, 2025: its goal names a measure that reports can do little to move; no problem or customer is stated; it spends a quarter rebuilding its report builder; at the quarter's outcome review the measure has not moved, nobody can say what the rebuilding was for, and no leader asked in between. | `contrast`: A team that still received orders. → A team that received nothing, and what the two have in common. |\n\n### Two Spaces: The Problem and the Solution\n\n**Controlling idea** (`definition`, id `two-spaces`): Decisions about product work fall into a problem space that leaders own and a solution space that the team owns, and the line between them is a decision right placed where the information is.\n\n**Advances the thesis** (S1, S2): States the chapter's model: what each side decides, why, and how the two hardest decisions are assigned.\n\n**Transition in:** `problem_solution`: Two teams with no stated line. → The line, with its terms defined.\n\n**Order of paragraphs** (`prerequisite_order`): The team is defined before the spaces, the spaces before the picture and the reason, and the reason before the sorted table, whose two hardest rows are explained last because they need both the line and the reason.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | An empowered product team, in Cagan's sense, is given a problem to solve and answers for the outcome, where a feature team is given features to build and answers for delivering them. | source: Empowered distinguishes empowered product teams, assigned problems to solve with the strategic context to decide, from feature teams, assigned features and dates; the author's record team-objectives states it as 'assign problems, not features'. |  |\n| p07 | definition | The problem space is which customers to serve, which of their problems matter, in what order and how success is measured; the solution space is what to build, how it should work and in what order to try things; and the line between them is a decision right in the sense of chapter 1. | reasoning: Chapter 1 defines a decision right as the agreed answer to who may make a named kind of decision, whose input they must take and where it is recorded; this chapter applies it to two named kinds of decision. | `elaboration`: A team that is given a problem. → What counts as the problem and what counts as the solution, and what kind of thing the line is. |\n| p08 | description (figure) | A vision set at the top bounds the problem space, and each step from vision to team says less about the solution, until the team holds a problem, a measure and the context. | figure: Mermaid flowchart: vision (the customer's future journey) -> strategy (the problems in order) -> roadmap (an outcome and its measure) -> the line -> team: discovery <-> delivery -> measured outcome -> back to the leaders, who judge the result. | `elaboration`: The two spaces. → How the vision, the strategy and the roadmap of the previous chapters lead up to the line. |\n| p09 | explanation | The line sits there because each side decides where it has the information: the team is close to the customer and the technology, and the leaders see across teams and across time. | source: Perri, drawing on Stephen Bungay's The Art of Action: when results disappoint, organizations give more detailed instruction, where they should let each level define how it will achieve the intent of the level above; leaders limit direction to the intent. | `cause_effect`: Where the line is. → Why it is there and not higher or lower. |\n| p10 | comparison (table) | Sorted by the line, eight common decisions fall to the leaders, to the team or to both. | table: Decision \\| Who decides \\| Why. Which customer segment to serve \\| leaders \\| problem space; needs the view across the market and the company. Which problems matter this year \\| leaders \\| problem space. The order of the outcomes \\| leaders \\| problem space; a choice across teams and time. The measure of success for an outcome \\| leaders, with the team \\| leaders say what counts as success; the team proposes the target it will answer for. What to build for the outcome (a warning or a hard block) \\| team \\| solution space. Which experiment to run first \\| team \\| solution space. Build or buy a component \\| team, inside engineering guardrails \\| solution space; a rule set once for all teams bounds it. When to stop and try another solution \\| team, reported to the leaders \\| solution space; the leaders judge the result. | `example`: The reason for the line. → The line applied to decisions a reader will recognize; two rows are explained in the paragraphs that follow. |\n| p11 | explanation | The measure of success is decided jointly: leaders say what counts as success for the outcome, and the team proposes the result it will answer for. | source: Empowered: leadership supplies the objective and the context, and the team proposes its key results; in the author's record, 'context flows down, key results flow up', and a proposal that does not meet the business need is negotiated. | `elaboration`: The table's fourth row. → Why the measure has two owners. |\n| p12 | explanation | Build or buy is a solution decision and so the team's, made inside guardrails that engineering sets once for all teams, which is different from a leader choosing this team's solution. | reasoning: A guardrail (an approved-vendor rule, a data-protection review, a policy on new technology) settles a recurring decision once; it constrains every team's solution space equally and leaves the choice inside it to the team. Engineering strategy and governance are treated in Part IV. | `additional_support`: A decision with two owners. → A decision with one owner and a boundary set elsewhere. |\n\n### Pattern: Hand Over a Problem, a Measure and the Context\n\n**Controlling idea** (`process`, id `the-handover`): A leader uses the line by handing a team a problem, a measure and the context in writing, and then judging the result without choosing the solution; a new team or a fixed date moves the line, at a price.\n\n**Advances the thesis** (S1, S2): Turns the line into the act a leader performs, with its user and outcome measure.\n\n**Transition in:** `sequence`: The line and the reason for it. → The first of three patterns that put it to work: what a leader hands over.\n\n**Order of paragraphs** (`prerequisite_order`): What is handed over comes before what the leader does afterwards; the exceptions follow the default they qualify, and the user and measure close the pattern. Putting the exceptions first would qualify a default the reader has not yet seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | process | What is handed over, in writing, has three parts: the problem, the measure of success, and the context a team needs to decide well, which is the vision, the strategy, the reason for the order and the constraints. | source: Empowered: objectives are problems to solve, assigned with strategic context (vision, strategy, topology); the author's record empowered-product-strategy adds the test of asking a team to explain why its objective matters. |  |\n| p14 | explanation | After the handover the leader manages progress and obstacles closely and judges the result, and does not choose the solution. | source: Empowered as read in the author's record: active management (weekly review of progress, blockers and dependencies) is neither micromanagement nor absence. Perri: the more leaders can see where teams are, the more they step back. | `sequence`: What is handed over. → What the leader does next. |\n| p27 | comparison (table) | The handover of a problem, a measure and the context is the default, and two conditions move the line, the team's skill and a date that truly cannot move, each at a price. | table: Setting \\| What you gain \\| What you lose \\| Fits when. Leaders name the solution \\| a date or a deliverable that can be promised \\| the team's knowledge of the customer; accountability for the outcome \\| a commitment that truly cannot move (a contract, a regulation), investigated first and kept rare. Leaders hand over a problem, a measure and the context \\| solutions the leaders could not have seen; a team that answers for the result \\| predictability of what will ship \\| the team has the skill and the access to discover. Leaders hand over the problem and coach the solution \\| a team that learns to decide \\| leader time; speed \\| a new team or one new to discovery, for a stated period. | `contrast`: The handover and the leader's conduct after it, as the default. → The two conditions under which the line is set elsewhere, and what each setting costs. |\n| p15 | recommendation | The pattern is for the product team and the leader who hands over, and it has worked when any member of the team can say what problem the team is solving, how success will be measured and what the team may decide. | reasoning: Author's recommendation: ask three team members separately; count how many items on the team's board arrived as a named feature from outside the team. | `conclusion_summary`: The handover, what follows it and when the line moves. → Whom the pattern is for and how to tell that it worked. |\n\n### Pattern: Discovery and Delivery in One Team\n\n**Controlling idea** (`definition`, id `discovery-and-delivery`): A team that owns the solution does two kinds of work, discovery and delivery, and has to do both itself.\n\n**Advances the thesis** (S3): Supplies the practice by which a team uses its ownership of the solution space.\n\n**Transition in:** `cause_effect`: A team that has been handed a problem and not a solution. → The work of finding the solution, which now falls to the team.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | definition | Discovery is the work of finding out which solution is worth building before paying to build it, and delivery is building that solution so that it runs reliably for every customer. | source: Perri: known unknowns are assumptions to test and problems to explore, which discovery and experimentation turn into facts; she separates building to learn from building to earn. Cagan's four risks (value, usability, feasibility, viability) name what discovery tests; the terms discovery and delivery are his, from Inspired, cited for the widely known distinction as a supplement to the author's notes. |  |\n| p17 | explanation | Discovery and delivery are two kinds of work done continuously by the same team, not two phases and not two teams, because what is learned about the customer does not survive being handed over. | source: Build What Matters: research used only to test an initiative that is already prioritized is reactive; customer research belongs at every stage, including the decision about what to build. | `elaboration`: The two kinds of work. → Who does them and when. |\n| p18 | recommendation | The pattern is for the product team, it needs protected time and small experiments, and it has worked when the team drops ideas before building them and can show which shipped changes moved the measure. | reasoning: Author's working rule, drawn from Build What Matters in the record right-processes: at least four hours a week of customer research per product manager, whether or not a project needs it. Outcome measures: ideas tested and dropped per quarter; share of shipped changes with evidence that the measure moved. | `conclusion_summary`: What discovery and delivery are and who does them. → What the practice needs and how to tell it worked. |\n\n### Pattern: Product Operations as the Support System\n\n**Controlling idea** (`definition`, id `product-operations`): Product operations is the support system that keeps customers, data and a shared way of working within a team's reach as the company grows, and it decides nothing.\n\n**Advances the thesis** (S4): Supplies the last condition in the thesis: the access and data without which the handover is empty.\n\n**Transition in:** `cause_effect`: Discovery, which needs customers and data. → What stops them reaching a team as a company grows, and the function that restores them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | cause_effect | As a company grows, the people who talk to customers and the people who hold the data move away from the product team, and a handed-over problem cannot be solved by a team that can reach neither. | source: Build What Matters: in the enterprise the separation between product managers and customers grows as sales and customer success become the voice of the customer, and a game of telephone forms. Perri and Tilles: sales and customer success often act as gatekeepers to clients. |  |\n| p20 | definition | Product operations, as Perri and Tilles define it, is an enablement function with three parts, business data, customer and market insight, and process, which takes the assembling of inputs off product managers and makes none of their decisions. | source: Product Operations: 'At its core, product operations is an enablement function'; three pillars (business data and insights; customer and market insights; process and practices); it does not make the decisions; it is not a replacement for unskilled product managers. | `problem_solution`: Teams cut off from customers and data. → The function that reconnects them. |\n| p21 | recommendation | Product operations is for product managers and their teams, it should be run as a service that is dropped when unused, it has worked when a team gets from a question to the data or to a customer in days, and at small size it is a part-time duty before it is a team. | source: Product Operations quotes a practitioner who runs operations like an API product whose unused methods are deprecated, and warns against becoming 'process people' who standardize everything. Author's recommendation on size: a part-time duty before it is a team. | `conclusion_summary`: What the function is. → Whom it serves, how it is judged and how it fails. |\n\n### Anti-Patterns: The Feature Team Called Empowered and the Team Left Alone\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Without the line, empowerment fails in two opposite ways: leaders keep deciding solutions under a new vocabulary, which keeps their direction and drops the team's freedom, or they hand over nothing and call it trust, which keeps the freedom and drops the direction.\n\n**Advances the thesis** (S5): Names the two failures of the opening scene and gives the signs by which to recognize each.\n\n**Transition in:** `contrast`: Three patterns that make the line usable. → What happens when the word is used without the line: the two teams of the opening.\n\n**Order of paragraphs** (`grouping`): The feature team comes first because it is the failure the reader already knows from the failure patterns; the abandoned team follows as its reverse, and reversing them would present the less familiar failure with nothing to contrast it to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | analysis | A feature team called empowered is the Feature Factory of the book's failure patterns under a new name, as Corvane's Customer Portal team was, and it can be recognized by objectives that are deliverables with dates or have deliverables filed under them, dates and targets that arrive from outside and a product manager who takes orders. | source: Perri's waiter: a product manager who asks stakeholders and customers what they want and turns the wants into a list, with no goal to trade off against, so that the most important requester wins. The author's record team-objectives lists 'the feature list in OKR costume' and 'dictated key results'. |  |\n| p23 | analysis | A team left alone, as Corvane's Reporting team was, has been abandoned, not empowered: it has freedom over solutions and no stated problem or context to use the freedom for, and a measure with no problem attached is not an outcome handed over. | source: The author's record empowered-product-strategy names 'management by absence': calling it empowerment when there are no progress reviews, no obstacle removal and no help. Corvane's Reporting team is the case. | `contrast`: Leaders who still decide the solution. → Leaders who decide nothing. |\n\n### Where the Sources Disagree: Vision From the Top or Solutions From the Edge\n\n**Controlling idea** (`comparison`, id `where-the-sources-disagree`): The vision-led and the empowered schools appear to disagree about where product direction comes from; read closely they divide the decisions the same way, and the real dispute is with two readings that each keep one side of the arrangement.\n\n**Advances the thesis** (S2, S5): States the main tension inside the product model and resolves it, as the chapter's role requires.\n\n**Transition in:** `cause_effect`: Two failures, one keeping the leaders' direction and one keeping the team's freedom. → The two schools those sides are taken from, and whether the schools themselves conflict.\n\n**Order of paragraphs** (`comparison`): The apparent opposition is stated first, then corrected from each source, then resolved; the section ends on the resolution because the acceptance criteria ask for it to be explicit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | comparison | Build What Matters puts direction at the top, in a vision and a top-down allocation that come before the smaller decisions, while Empowered puts the best solutions at the edge, with the people closest to the customer and the technology. | source: Build What Matters: vision-led product management; a top-down allocation across innovation, iteration and operation; 'big decisions need to come before small ones'. Empowered: teams are given problems to solve because those closest to the technology and the users find the best solutions. |  |\n| p25 | analysis | Neither book holds the position its name suggests: Cagan asks leaders for a vision, a strategy and the assignment of problems, and Foster and Nerlikar ask leaders to delegate decisions and put product managers in front of customers; the conflict is between a bottom-up reading of empowerment and the instinct that teams cannot be trusted with solutions that matter. | source: Empowered (author's records): leadership provides vision, principles, strategy and explicitly decides which teams work on which problems. Build What Matters: its culture section lists 'delegate decision-making' and dedicated time for customer discovery; its vision mock-ups are concept wireframes, not deliverables handed to engineering. | `contrast`: The two books as their titles are usually read. → What each book also says. |\n| p26 | claim | This book's resolution is that leaders own the problem space, the order of problems and the measure of success (with the team proposing its target), and teams own the solution space and the order of their experiments, with the line written down; what remains a matter of degree is how concrete the vision is, which depends on how well the customer's future journey is known. | reasoning: A vision described as the customer's future journey states a result and may sketch it; the more of the sketch a team is required to build as drawn, the more of the solution space the vision has taken. | `conclusion_summary`: Two books that divide decisions the same way. → The book's position and the difference that remains. |\n\n### Worked Example: Double-Booking at Corvane\n\n**Controlling idea** (`example`, id `worked-example`): In 2026 Corvane's Scheduling team was handed a problem with the line stated, found a cause and a solution its leaders had not expected, and took over the rule decision the CPO had held since 2022.\n\n**Advances the thesis** (S1, S2, S3, S4): Applies the line and the three patterns to one team and shows the result with ledger numbers.\n\n**Transition in:** `example`: The line, the patterns and the conditions. → One Corvane team for which the line was written down.\n\n**Order of paragraphs** (`chronological`): The record of who decides comes first because the team's work is read against it; the discovery, the handing over of the rule decision that the solution needed, and the result follow in the order they happened.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | example (table) | In 2026 the outcome handed to the Scheduling team was that planners no longer keep a second schedule in a spreadsheet, and the decisions about it were divided on one page, one of which, the scheduling rules, was still the CPO's. | table: Decision \\| Who decided \\| What was decided. Whose problem \\| Priya Nambiar (CPO) and the group's director \\| planners at existing customers. Which problem and its place in the order \\| the same two \\| planners keeping a second schedule in a spreadsheet (an outcome on the roadmap's middle horizon); first of the group's three outcomes for 2026. Measure of success \\| the leaders named it, the team proposed the target \\| share of planners who keep a second schedule, by quarterly survey: from 60% to under 30% in two quarters, with the time to book a job not rising. What to build \\| Scheduling team \\| left open. Order of experiments \\| Scheduling team \\| left open. The scheduling rules themselves \\| Priya Nambiar, as since 2022 \\| not yet handed over. |  |\n| p29 | description | The team's discovery found that planners kept the spreadsheet for emergency jobs that the product's rule blocked, so the team proposed to replace the block with a warning, not the spreadsheet import its leaders had expected. | scenario: Scheduling, 2026: the product manager, the designer and two engineers sat with planners at five customers over three weeks, visits arranged by Corvane's first product operations hire and no longer through account managers. New: since the 2022 fix the rule engine has blocked a second job for a technician inside the travel-time window after the first; planners squeeze emergency call-outs in deliberately and, blocked, record them in a spreadsheet. The warning shows the later jobs affected and offers to move them; it was tried as a prototype with three planners, then with one customer's office. | `sequence`: A problem handed over with the solution left open. → What the team found and chose. |\n| p31 | analysis | Replacing the block was a change to a scheduling rule, a decision Priya Nambiar had held since 2022 and that had become an Escalation Ladder, so she handed the right to decide scheduling rules to the Scheduling team and kept only the changes that alter what the product promises a customer. | scenario: Ledger: since the 2022 fix Priya Nambiar, then Corvane's product manager, decided scheduling rules with Web, Mobile and Integrations consulted, when Corvane had about 45 engineers. New: by 2025, as CPO of about 500 people, rule questions waited for her; in 2026 the right passes to the Scheduling team, which has owned the whole rule engine since the 2025 re-cut, with Dispatch and Technician App consulted and decisions still recorded. | `cause_effect`: A solution that changes a scheduling rule. → Who could decide that rule, and why the right was handed over. |\n| p30 | description | After two quarters the share of planners keeping a second schedule had fallen from 60% to 35%, short of the target of under 30%, and the team reported the gap and its next experiment. | scenario: Scheduling, end of the second quarter of the work: 35% against a target of under 30%; time to book a job unchanged; the team reports the result to Priya Nambiar and the director and names the next experiment. | `sequence`: The team now holding both the solution and the rule. → What the solution achieved and how the result was reported. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI makes solutions cheaper to try, which helps discovery and makes it easier to skip the problem, so the line matters more and not less.\n\n**Advances the thesis** (S2, S3): Tests the line against cheaper building, with labeled claims.\n\n**Transition in:** `additional_support`: The line applied to a case from 2026. → Whether cheaper building moves it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | analysis | Emerging: with coding agents a team can put several working prototypes in front of customers in the time one used to take, which makes discovery cheaper for a team that already does it. | reasoning: Author's observation as of November 2026, labeled Emerging; no published measurement of the effect on discovery is known to the author, and the paragraph says so. |  |\n| p33 | claim | Speculative: if building costs less, an organization without the line ships more unrequested or unexamined features faster, and the scarce work becomes choosing the problem and verifying the outcome. | reasoning: Labeled Speculative; it would be confirmed where teams report shipping more while their outcome measures stay flat. The evidence is weighed in the chapter Where the Constraint Moves. | `contrast`: What cheaper building gives a team that discovers. → What it gives an organization that does not. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The line, the handover, discovery and product operations are one arrangement seen from four sides: the line says who decides, the handover carries the leaders' half to the team, discovery is how the team uses its half, and product operations keeps discovery supplied. For Part III as a whole: outcome, vision, roadmap and empowerment are one chain in which each link says less about the solution and more about the reason, until the team is left with a problem, a measure and the freedom to solve it.\n\n**So what:** The argument between top-down and bottom-up product work dissolves once each level knows which space it owns; a leader hands over a problem, a measure and the context, funds the access and data, and judges the result.\n\n**Callback:** The two Corvane teams called empowered in 2025, and the forty-one features that opened Part III. The reader can now say what each team was missing, and reads the forty-one features as output with no outcome above it: forty-one solutions chosen outside the teams that built them.\n\n**Takeaway** (`course_of_action`): List the decisions made about one team's work last quarter and mark who made each; on your own roadmap mark each item as an outcome or a solution, and for each solution name the outcome it serves or remove it. The checklist carries both.\n\n**Hand-off** to [Part IV — ENGINEERING: The Engineering Operating Model](part-4.html): `similarity`: The product model: vision, strategy, roadmap, empowered teams. → The matching engineering model: strategy, governance, platforms, quality, migrations.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis (list) | Established: the sources agree that teams given problems outperform teams given features, that leaders supply vision, strategy and context, that research belongs before the decision to build, and that product operations enables and does not decide. |  |  |\n| p35 | synthesis (list) | Depends on context: where the line is set depends on the team's skill and on fixed commitments, how concrete the vision is depends on how well the future journey is known, and whether product operations is a team depends on size. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p36 | synthesis (list) | The author's synthesis: the two spaces as a decision right, the three-part handover and the reading that the two schools conflict only in their one-sided readings are this book's position. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p37 | recommendation (list) | Eight checks let the reader find the line in their own organization and mark their own roadmap. |  | `sequence`: What to take away. → What to do with it. |\n| p38 | transition | Part III is one chain from outcome to empowered team; Corvane's two teams of 2025 each lacked one side of it and the forty-one features were output with no outcome above it; and the engineering model of Part IV matches the product model link for link. |  | `similarity`: The product model, now complete. → The part's synthesis and the matching engineering model that Part IV opens. |\n\n## Non-goals\n\n- The product, engineering and design triad: who in the team decides what See [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html).\n- Outcomes, vision, strategy and the roadmap themselves See [Outcomes Over Output](outcomes-over-output.html), [Vision and Product Strategy](vision-and-product-strategy.html), [Roadmaps and Horizons](roadmaps-and-horizons.html).\n- Methods for allocating and recording decision rights in general See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Team objectives inside the planning cycle (OKRs, capacity, cadence) See [Planning](../grounded-engineering-executive/planning.html).\n- Engineering strategy and technical guardrails See [Engineering Strategy](engineering-strategy.html), [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- Discovery techniques (interview methods, prototype types, experiment design)\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts introduced here (the 2025 announcement by Priya Nambiar, the Customer Portal and Reporting teams' quarters, the 2026 double-booking outcome with 14% to 9% against a target under 8%, the first product operations hire, the 2026 handover of the scheduling-rule decision right) should be checked against chapters 9 to 11, which were written in parallel.\n- Cagan's Inspired is cited only for the terms discovery and delivery, as a supplement; the author may want to add it to the bookshelf or drop the citation.\n- The Part III closing is carried by the checklist's last item and the closing paragraph; the author may prefer a separate closing section.\n\n## Decision log\n\n- **2026-11-19** — Open with two teams that fail in opposite ways under one announcement, so that the line is introduced as what both lacked and the two anti-patterns are already in the reader's mind. Rejected: Opening with the forty-one features, which the Part III introduction and chapter 9 use and which this chapter keeps for the part's closing callback; Opening with the disagreement between the two books\n- **2026-11-19** — Attribute the opposing view to 'the bottom-up reading of empowerment' and show from Empowered itself that Cagan asks leaders for vision, strategy and the assignment of problems. Rejected: Presenting Build What Matters versus Cagan as a disagreement between the authors\n- **2026-11-19** — Use the 2021 double-booking rule as the worked example's problem, because the acceptance probe names it and the ledger already holds the hard block and the 2022 decision right. Rejected: A new product problem with no history in the ledger\n- **2026-11-19** — Cite Cagan's Inspired only for the widely known terms discovery and delivery, marked as a supplement; the phrase 'dual-track' is not used because it is not in the author's notes. Rejected: Treating dual-track agile at length from memory\n- **2026-11-19** — Flow rubric (one run): sound with notes. Applied: the joint ownership of the measure is repeated where the resolution is stated; the handover is said to be written; the conditions listed under 'Depends on context' are introduced in the body; the anti-patterns name the two opening teams; the rule handover is placed later in 2026. Not applied: trimming the resolution paragraph to its one new point, because acceptance criterion AC-2 requires the resolution to be stated explicitly in that section.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (REVISE): (1) the paragraph and table on when the line moves (p27) moved from 'Where the Sources Disagree' to the handover pattern, because both flow readers found it out of place after a section about two books; the sources section now ends on the resolution. (2) The worked example re-based on facts that chapters 9 to 11 appended to the ledger while this chapter was drafted: the outcome is the roadmap's middle-horizon item 'planners no longer keeping a second schedule in a spreadsheet', with a survey measure (60% to 35%, target under 30%); the rule-decision handover (p31) now precedes the result (p30) because the team's solution required it. Rejected: Leaving p27 in the sources section and rewording only; Keeping the invented outcome 'a schedule holds through the day', which was not on chapter 11's roadmap\n\n## Sources\n\n- **Internal**\n  - grounded-product-management records: team-objectives, empowered-product-strategy, team-topology, coaching, business-collaboration, staffing (Empowered); right-team, right-processes (Build What Matters); lanes, working-small, routines, shapes-of-work, goals-and-questions (Cutler's Operating Takes) — The author's reading of Empowered: problems not features, context down and key results up, active management, high-integrity commitments, management by absence; the four-hour research floor; the front-line team as the one place work happens.\n  - _research/scenario-ledger.md — Corvane's forty-one features, the Two Calendars, the 2022 fix and the 2025 re-cut; this chapter appends the 2025 announcement, the two teams and the 2026 double-booking outcome.\n- **External**\n  - Marty Cagan with Chris Jones, Empowered: Ordinary People, Extraordinary Products (2020); the 'Empowered' checklists in _input/checklists/data/data.json — Empowered product team and feature team; strategic context; team objectives; the four risks.\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020); author's Kindle notes, _input/bookshelf/docs/notes/build-what-matters.pdf — Vision-led product management; top-down allocation; research before the decision to build; separation of product managers from customers; delegating decisions; vision mock-ups as concept.\n  - Melissa Perri, Escaping the Build Trap (2018); author's Kindle notes, _input/bookshelf/docs/notes/build-trap.pdf — The waiter archetype; known unknowns and discovery; building to learn; the knowledge and alignment gaps (after Bungay); visibility and autonomy.\n  - Melissa Perri and Denise Tilles, Product Operations (2023); author's Kindle notes, _input/bookshelf/docs/notes/prodops.pdf — Product operations as an enablement function; three pillars; what it does not do; gatekeepers; the 'process people' warning.\n\n## Changelog\n\n- **2026-11-19** — Spec created from the journal-spec entry.\n- **2026-11-19** — Flow-rubric notes applied to seven controlling ideas; status set to accepted in auto mode.\n- **2026-11-19** — After check round 1: p27 moved to the-handover; worked-example paragraphs reordered (p28, p29, p31, p30) and re-based on the ledger lines of chapters 9 to 11; controlling ideas of anti-patterns, where-the-sources-disagree and p38 reworded to name the two sides. Units to redraft: p03, p04, p08, p09, p22, p23, p24, p26, p27, p28 to p31, p33, p37, p38.\n- **2026-11-19** — Before round 2: the opening scene (p01, p03, p04, p05) and the anti-patterns (p22, p23) made to agree with chapter 9's ledger line that every team's 2025 goal named a driver and had a dated outcome review.\n"}]}]}</script>

                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
