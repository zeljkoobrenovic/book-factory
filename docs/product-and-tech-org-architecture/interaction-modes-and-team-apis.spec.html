<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The three interaction modes: collaboration, X-as-a-Service and facilitating, with the cost of each.\n- **Know:** What a team API contains: what the team owns, how to ask it for something, what it promises, how it communicates.\n- **Believe:** An interaction nobody chose becomes a queue or a standing meeting.\n- **Believe:** Collaboration is expensive and should have an end date.\n- **Be able to:** Choose a mode for a pair of teams and say when it should change.\n- **Be able to:** Write a one-page team API.\n- **Be able to:** Read dependency queues and recurring meetings as signs of a wrong or unchosen mode.\n\n**Audience:** Executives (CTO, CPO, VP, Director) who must choose how two teams work together, and individual contributors who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work: tickets, stand-ups, releases, APIs, on-call\n- Chapter 1's four levers and its definition of an interface as an agreed way for work or knowledge to cross between teams\n\n**Does not yet know:**\n\n- interaction mode\n- collaboration as a named mode\n- X-as-a-Service\n- facilitating\n- team API\n- team interface\n- stream-aligned team\n- platform team\n- enabling team\n- complicated-subsystem team\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a described relation between two teams, the reader names the mode it is in, the mode it should be in and what would have to exist for the change. *Probe:* A payments team and a fraud team have had a joint stand-up every day for fourteen months, and neither can release without the other. Which mode are they in, which should they be in, and what would have to exist first? | `custom` | cold_reader | major |\n| AC-2 | The chapter contains a filled-in team API a reader could copy. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How should two teams work together, and how is that agreement made explicit?\n\n> **Claim:** Two teams should work together in one of three modes — collaboration for a limited time when a boundary is still being discovered, X-as-a-Service when one can consume what the other provides without talking, and facilitating when one helps the other learn — and the choice should be written down in a team API that says what the team owns, how to ask it for something and what it promises; a mode that was never chosen shows up as a dependency queue or a meeting that never ends.\n\n**Disputed by:** The belief that teams should collaborate closely by default, and that writing down how teams interact is bureaucracy that good relationships make unnecessary.\n\n**So what:** A leader reads every recurring cross-team meeting and every dependency ticket queue as a question — which mode is this, and did anyone choose it — and gives each collaboration an end date.\n\n**How and why:** Collaboration costs both teams attention for as long as it lasts, which is why it is worth paying only while something is being discovered; a service costs the provider up front and the consumer almost nothing afterwards; facilitating costs the helping team time now so that the helped team needs neither afterwards. Unwritten interactions default to whatever the two managers' relationship allows and change when either of them leaves.\n\n**Supporting claims**\n\n- **S1** — An interaction between two teams that nobody chose defaults to asking people, and it shows up as a dependency queue when one team needs the other and as a meeting that never ends when both need each other.\n- **S2** — Three modes cover the ways two teams can work together, and they differ in who pays and when: collaboration costs both teams attention for as long as it lasts, X-as-a-Service costs the provider up front and the consumer almost nothing afterwards, and facilitating costs the helping team time now so that the helped team needs no help later.\n- **S3** — The chosen mode is made explicit in a team API, one page that says what the team owns, how to ask it for something, what it promises and how it communicates, so that the agreement does not depend on two managers' relationship.\n- **S4** — A mode is chosen per pair of teams and for a period, and changing it requires something to exist first: a defined interface with an owner before collaboration can become a service, and an end date before a collaboration or a facilitation starts.\n- **S5** — Writing the interaction down does not replace cooperation: the team API states how to reach a team and what it promises, it is kept to one page, and collaboration remains the right mode while a boundary is still being discovered.\n\n## Role in the part\n\nTurns the interface lever of chapter 1 into three concrete modes and one written artefact. Supports P2-2 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in three-modes, unchosen-mode, team-api, choose-a-mode, end-date: each supplies the terms the next uses)\n\nThe reader meets a queue nobody decided on before any vocabulary, so the modes arrive as the answer to a question already asked. The modes come before the explanation of the default, because the default can only be named as collaboration without limits once collaboration is defined. The team API follows the explanation, because the reason for writing the choice down is that unwritten choices do not last. The two patterns come after the page because both end by writing a line into it; choosing first and writing afterwards would give the procedure a last step whose object the reader has not seen. Misuses and the disagreement between sources follow the patterns they qualify. The worked example comes after all of them so that it can use every term, and the AI section is a coda that tests the written page against a new kind of reader. Putting the team API first would present a template with no reason to fill it in.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Corvane's platform team of five was created in 2022 to help the product teams release faster. By 2024 every launch of eleven product teams waited on it, and nobody had ever decided how a product team was supposed to use it.\n\n**Bridge:** Most readers know a team that everyone waits on, or a weekly cross-team meeting that nobody remembers starting and nobody dares to cancel. → Both are what an interaction between two teams looks like when nobody chose how the two should work together.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Two teams should work together in one of three modes, collaboration for a limited time, X-as-a-Service or facilitating, and the choice should be written down in a team API; a mode nobody chose shows up as a dependency queue or a meeting that never ends.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a helping team become a queue because nobody defined what it offered. *Kept in:* a-service-nobody-defined.\n- Learn the three interaction modes and what each costs. *Kept in:* three-modes.\n- Understand why an unchosen mode turns into a queue or a standing meeting. *Kept in:* unchosen-mode.\n- Write the agreement down as a one-page team API, with a filled-in example to copy. *Kept in:* team-api.\n- Choose a mode for a pair of teams and give every collaboration an end date and an exit. *Kept in:* choose-a-mode, end-date.\n- Recognize the common misuses of the modes. *Kept in:* anti-patterns.\n- Know where the sources disagree about writing interactions down. *Kept in:* sources-disagree.\n- Follow Corvane's platform team as it changes mode. *Kept in:* worked-example.\n- See what AI changes about interactions between teams. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane's platform team was created to help product teams release faster and became the place every launch waited, because nobody had decided how a product team should use it. | scenario: Stage 3 in the ledger: a platform team of five formed in 2022; eleven product teams from 2023; in 2024, at 180 people, 14 open launch requests and a median lead time of 19 days, up from 4. |  |\n| p02 | claim | Two teams should work in one of three modes, written down in a team API, and a mode nobody chose shows up as a queue or a meeting that never ends; the chapter goes from the case to the modes, the default, the team API, two patterns, the misuses, the disagreement, the worked example and AI. |  | `problem_solution`: A helping team that became a queue, and the reader's own versions of it. → The claim that the mode was never chosen, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: A Service Nobody Defined\n\n**Controlling idea** (`example`, id `a-service-nobody-defined`): Corvane's platform team became a queue because what it offered, how to ask for it and what it promised were never stated, so every launch was a ticket worked through jointly with a platform engineer.\n\n**Advances the thesis** (S1): Gives the case of an unchosen interaction and its cost, which the rest of the chapter names and repairs.\n\n**Transition in:** `elaboration`: The lead's short account of the platform team that became a queue. → The case in full: how a launch worked and what had never been decided.\n\n**Order of paragraphs** (`chronological`): The reader needs what the team was for, what was left undecided and what followed, in that order, to see that the queue was a default and not a decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2023 and 2024 a product team at Corvane, the fictional company this book follows, released a change by filing a launch request and waiting for one of five platform engineers to check and release it by hand. | scenario: The platform team, led by Lena Brandt, held the deployment scripts from 2023; a launch was a hand check of migrations, configuration and the way back, then a release in a slot; all eleven product teams needed it for some launches and three for every launch. |  |\n| p04 | analysis | Three things had never been decided: what the platform team offered, how a product team should ask for it, and what the platform team promised in return. |  | `contrast`: How a launch worked in practice. → What nobody had decided about it. |\n| p05 | cause_effect | With nothing decided, the default was to ask a person, so each launch became joint work between a platform engineer and a product team, and five engineers doing joint work with eleven teams produced a queue. | scenario: 14 open launch requests at the peak in 2024; of 19 days of median lead time about 17 were waiting for a launch slot. | `cause_effect`: Three undecided things. → What filled the gap, and what it cost. |\n\n### Three Interaction Modes and What Each Costs\n\n**Controlling idea** (`definition`, id `three-modes`): Two teams can work together in three modes, collaboration, X-as-a-Service and facilitating, and the modes differ in who pays and for how long.\n\n**Advances the thesis** (S2): Supplies the three modes and the cost of each, which is the first half of the thesis.\n\n**Transition in:** `problem_solution`: A joint way of working that nobody chose. → The small set of ways two teams can choose to work together.\n\n**Order of paragraphs** (`prerequisite_order`): The definition of a mode comes first, then the three side by side, then one paragraph per row of the table in the table's order: the two modes that get work done, contrasted by who pays, and then the mode that moves a skill. Choosing between modes before each one's cost is explained would be choosing by name.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | An interaction mode is the way two teams have agreed to work together for the time being, and Team Topologies names three, which apply between the four team types of the previous chapter. | source: Skelton and Pais's three core interaction modes: collaboration, X-as-a-Service and facilitating; their note that not all communication and collaboration is good and that team interfaces should set expectations. |  |\n| p07 | comparison (table) | The three modes differ in what the two teams do, who pays, when the mode is right and when it should end. | table: Mode \\| What the two teams do \\| Who pays, and when \\| Right when \\| Ends when. Rows: collaboration, X-as-a-Service, facilitating. | `elaboration`: Three named modes. → The three side by side. |\n| p08 | explanation | Collaboration, two teams working on one problem as if they were one team, is the fastest way to discover something and costs both teams attention for as long as it lasts, so it is worth paying only while a boundary or an interface is still unknown. | quotation: Team Topologies: \"Collaboration is good for rapid discovery and avoiding hand-offs and delays, but the downside is a higher level of cognitive load.\" The authors' rule of thumb, in the author's checklist: collaborate with at most one other team at a time. | `sequence`: The table's first row. → Why collaboration is expensive and when it is worth it. |\n| p09 | explanation | In X-as-a-Service one team provides something another team uses without talking to it, which costs the provider work up front and the consumer almost nothing afterwards, and works only if the service is defined well enough to be used without help. | quotation: Team Topologies: \"The X-as-a-Service model works well only if the service boundary is well chosen and well implemented, with a good service-management practice from the team providing the service.\" | `contrast`: A mode both teams pay for continuously. → A mode one team pays for once. |\n| p10 | explanation | In facilitating one team helps another learn to do something itself, which costs the helping team time now and is finished when the helped team no longer needs the help. | source: Team Topologies' facilitating mode, as distilled in the author's checklist: the goal is the helped team's self-sufficiency, the helper does not take over the helped team's work, and both understand the help is temporary. | `sequence`: Two modes for getting work done. → The mode for moving a skill. |\n\n### Why an Unchosen Mode Becomes a Queue or a Standing Meeting\n\n**Controlling idea** (`cause_effect`, id `unchosen-mode`): When nobody chooses a mode, the two teams fall into collaboration without its limits, which appears as a queue when one team needs the other and as a recurring meeting when both need each other.\n\n**Advances the thesis** (S1): Explains the mechanism behind the opening case and gives the reader the two symptoms to read.\n\n**Transition in:** `cause_effect`: Three modes, each with a cost and an end. → What happens when none of them is chosen.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim about the default comes first, then the symptoms that let a reader test it, then the case that limits the symptoms, placed directly after them so that the reader does not conclude every meeting is a fault. The reason unwritten agreements do not last comes last because it is the reason for the next section; placed earlier it would separate the limiting case from the symptoms it limits.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | claim | When no mode is chosen, people ask each other, and asking is collaboration without an end date or a limit on the number of teams; it queues when the need runs one way and becomes a standing meeting when it runs both ways. |  |  |\n| p12 | comparison (table) | A dependency queue, a recurring cross-team meeting, a service that needs constant help and a helper who never leaves each point to a mode in practice that differs from the mode the work needs. | table: What you see \\| Mode in practice \\| Mode the work probably needs \\| What is missing. Four rows: ticket queue at one team; recurring meeting of two teams that cannot release alone; consumers who keep asking for help with a service; a helping team still doing the work after a year. | `example`: The two default shapes. → Four symptoms, each read as a mode. |\n| p14 | counterargument | A recurring meeting is not a symptom when it has an owner, a purpose and an output, as Corvane's weekly rules session of 2022 had. | scenario: The 2022 fix: rule changes published as a versioned schema and reviewed in a weekly rules session owned by Core, with Priya Nambiar deciding and the decisions recorded. | `contrast`: Meetings and queues read as symptoms. → A recurring meeting that is a designed interface, and the test that tells the two apart. |\n| p13 | explanation | An unwritten way of working lasts only as long as the relationship between the two people who hold it, and changes when either of them leaves. | reasoning: Chapter 1's two engineers who talk every Thursday: an interface agreed between two people leaves the company with either of them; the same holds for two managers who have an understanding. | `additional_support`: A meeting that lasted because it had an owner and a written output. → Why a chosen mode that is only spoken does not last. |\n\n### The Team API: The Agreement Written Down\n\n**Controlling idea** (`definition`, id `team-api`): A team API is one page that says what a team owns, how to ask it for something, what it promises and how it communicates, and it is what makes a chosen mode readable by people who were not in the room.\n\n**Advances the thesis** (S3): Supplies the written artefact of the thesis and the filled-in example the reader can copy.\n\n**Transition in:** `problem_solution`: Agreements that live in two people's heads. → The page that holds them.\n\n**Order of paragraphs** (`large_to_small`): The definition and its parts lead straight to the example, and the example comes before the comment on it, so that the reader can check the example against the parts and is not told what to think of it before seeing it. The comparison with the team charter comes last: between the parts and the example it would interrupt them, and it is only useful to a reader who already knows what a team API holds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | A team API, Team Topologies' term, is the written description of how to work with a team; it describes the team's team interfaces in chapter 3's sense and lists its software interfaces as one item among several. | source: Team Topologies' team API, as distilled in the author's record team-first-thinking: code and endpoints, versioning, documentation, working practices and communication channels, priorities and roadmap. |  |\n| p16 | explanation (table) | The contents of a team API reduce to four questions, to which this book adds a fifth part: the team's current interactions, each with its mode and end date. | table: Part \\| The question it answers \\| What goes in it. Rows: what we own; how to ask us; what we promise; how we communicate; current interactions (the author's addition). | `elaboration`: The source's list of contents. → The same contents as four questions and one addition. |\n| p18 | example (table) | Corvane's platform team wrote its team API at the end of the 2024 pilot, the quarter in which it rebuilt its release path so that a product team could run it, and the page fits on one sheet. | table: The filled-in team API of Corvane's platform team: what we own (the release path, the deployment scripts, the shared infrastructure and the shared data model), what we do not do, how to ask us, what we promise (including alerts answered at any hour by the platform engineer on call), how we communicate, current interactions with modes and end dates. | `example`: The five parts in the abstract. → One team's page, filled in. |\n| p19 | analysis | Four things make that page usable as a pattern: it says what the team does not do, its promises carry numbers, each interaction has a mode and an end date, and it has a named user and a measure. | reasoning: User: an engineer in a product team who has never spoken to the platform team. Outcome measure: the share of that team's needs met without a person on the platform team being involved, and whether a consumer can say what the team promises. | `elaboration`: The filled-in page. → What to notice in it before copying it. |\n| p17 | comparison | A team API is the outward-facing part of a team charter: the charter of Scaling People also says why the team exists and what it is measured on, and its sections on provided and dependent interfaces are the part other teams read. | source: The eight-section team charter from the Scaling People workbooks (mission, vision, customers, metrics, strategic importance, risks, provided interfaces, dependent interfaces), as described in the author's record team-charter. | `similarity`: A team API and what makes it usable. → The neighbouring document many organizations already have, and how the two relate. |\n\n### Pattern: Choose a Mode for Each Pair of Teams\n\n**Controlling idea** (`process`, id `choose-a-mode`): The mode is chosen for one pair of teams at a time, by asking whether something between them is still unknown, whether one can use what the other provides without talking, and whether one lacks a skill the other has.\n\n**Advances the thesis** (S4): Turns the modes into a procedure a leader can run on a pair of teams.\n\n**Transition in:** `sequence`: A page that records a mode. → How the mode on it is chosen.\n\n**Order of paragraphs** (`large_to_small`): The procedure with its user and measure comes first, then its second step as a figure, then the defaults that team types supply. The defaults come last because they shorten a procedure the reader must first have seen whole; given first, they would read as a rule that replaces the three questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | process (list) | Choosing a mode is a short procedure for the leads of two teams and the manager they share, and it worked when both teams give the same answer to which mode they are in and until when. | reasoning: Steps: name the pair and what crosses between them; ask the three questions in order; write the mode and its end date into both team APIs; set the date on which it is read again. User: the two team leads and their shared manager. Outcome measure: both teams name the same mode and end date; no team is in collaboration with more than one other team; the wait at the dependency falls. |  |\n| p21 | process (figure) | The three questions are asked in a fixed order, and each answer leads to one mode or to the next question. | figure: Mermaid decision flow: is something between the two teams still unknown (collaboration, with an end date); can one team use what the other provides without talking to it (X-as-a-Service); does one lack a skill the other can teach (facilitating); otherwise the two teams need no interaction. | `elaboration`: The procedure's second step. → The three questions drawn as a flow. |\n| p22 | explanation | The team types of the previous chapter supply a default mode for most pairs, and a pair whose mode contradicts its types is a signal that a team is misdescribed. | source: Team Topologies' typical pairings, as distilled in the author's record team-interaction-modes: platform and complicated-subsystem teams mostly provide a service, enabling teams mostly facilitate, stream-aligned teams collaborate only for discovery. | `additional_support`: A choice made from three questions. → The defaults that team types give. |\n\n### Pattern: Give Every Collaboration an End Date and an Exit\n\n**Controlling idea** (`recommendation`, id `end-date`): A collaboration starts with an end date, and at that date it leaves by one of three exits: a service with a defined interface and an owner, a changed boundary, or one renewal with a stated reason.\n\n**Advances the thesis** (S4): States what has to exist for a mode to change, which is the part of the thesis a leader acts on.\n\n**Transition in:** `elaboration`: Collaboration as one outcome of the choice. → The rule that keeps collaboration from becoming permanent.\n\n**Order of paragraphs** (`prerequisite_order`): The rule comes before the exits because the exits are what the end date forces the two teams to choose between; exits without a date would describe a decision nobody is made to take.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | recommendation | Every collaboration, and every facilitation, gets an end date on the day it starts, for the two teams' leads, and the measure is the number of collaborations past their date. | source: Team Topologies: \"Collaborate on potentially ambiguous interfaces until the interfaces are proven stable and functional.\" The time box in weeks is the author's recommendation, not the source's. |  |\n| p24 | explanation (list) | At the end date a collaboration leaves by one of three exits: it becomes a service if a defined interface with an owner exists that the consumer can use without talking; if no interface can be drawn, the boundary is wrong and the teams are merged or re-cut; and if the unknown is still unknown for a stated reason, it is renewed once. | reasoning: Three exits: a service (needs a defined interface, an owner, and a consumer who can use it without help); a boundary change (merge the teams or move what both keep changing to one of them, chapter 4's subject); one renewal with a new date and a written reason. | `sequence`: An end date. → What is decided when it arrives. |\n\n### Anti-Patterns: Collaboration Everywhere, the Service That Is Not One, the Page Nobody Reads\n\n**Controlling idea** (`analysis`, id `anti-patterns`): The modes fail in three recognizable ways: collaboration as the default for every pair, a service or a facilitation in name only, and a team API written as a wall or left to go stale.\n\n**Advances the thesis** (S1, S3): Shows how each part of the thesis is misused, in the book's failure-pattern names.\n\n**Transition in:** `contrast`: What to do. → How it goes wrong.\n\n**Order of paragraphs** (`grouping`): One paragraph per misuse, in the order in which the chapter introduced what is misused: collaboration, then the two modes that are faked, then the page. The page's misuse comes last because it is the objection the next section answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | analysis | Collaboration as the default for every pair of teams spreads each team's attention over all its neighbours and hides what a platform or a boundary fails to provide. | quotation: Team Topologies: \"Unnecessary collaboration is particularly expensive, especially as it can mask or hide deficiencies in underlying platforms or capabilities.\" |  |\n| p26 | analysis | A service whose consumers must ask for help each time is a queue with a service's name, and a facilitating team that does the work is a permanent dependency. | scenario: Corvane's Launch Queue of 2024, which the failure-patterns page files under The Review Bottleneck. | `additional_support`: One mode overused. → The other two modes faked. |\n| p27 | analysis | A team API fails when it is written as a list of refusals, or written once and left, because then a crossing between teams again has no owner. |  | `additional_support`: Misused modes. → A misused page. |\n\n### Where the Sources Disagree: Written Contracts or Cooperation\n\n**Controlling idea** (`counterargument`, id `sources-disagree`): Team Topologies wants interactions limited and defined, Six Simple Rules warns that too much clarity lets people comply with their box, and the book's resolution is to write down the way in to a team and keep it to one page.\n\n**Advances the thesis** (S5): Answers the objection that writing interactions down is bureaucracy, and states the conditions under which it is.\n\n**Transition in:** `contrast`: A page that can become a wall. → A source that says such pages usually do.\n\n**Order of paragraphs** (`comparison`): The two positions first, then the resolution with its conditions; the reader needs both positions to judge the resolution.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison | Team Topologies holds that communication between teams should be limited and defined, while Morieux and Tollman advise leaders to resist clarifying roles and processes because clarity past a threshold produces compliance in place of cooperation. | quotation: Team Topologies: \"What we need is focused communication between specific teams.\" Six Simple Rules: \"Resist the pressure to clarify roles, decision rights, and processes.\" |  |\n| p29 | refutation (table) | Both are right about different things, and a team API respects both when it describes how to reach the team and what it promises, says nothing about what its members may refuse to care about, and is skipped where everyone still knows whom to ask. | table: Choice \\| What you gain \\| What you lose \\| Fits when. Rows: unwritten, by relationship; a one-page team API; a detailed service contract. | `problem_solution`: Two opposed pieces of advice. → The resolution and when each amount of writing fits. |\n\n### Worked Example: Corvane's Platform Team Changes Mode\n\n**Controlling idea** (`example`, id `worked-example`): Between 2023 and 2025 the same five platform engineers went from ticket-driven collaboration with eleven teams to a service, by way of six weeks inside one team, and a second pair of Corvane teams left an unchosen collaboration by the boundary exit.\n\n**Advances the thesis** (S2, S3, S4): Applies the modes, the end date and the exits to the opening case, with the ledger's numbers.\n\n**Transition in:** `example`: The modes, the page and the disagreement about it. → The opening case read with them.\n\n**Order of paragraphs** (`chronological`): The periods in order, then what the sequence shows and what it cost, then the second case. The second case comes last because it uses the exit the first did not; before the first it would show a boundary change to a reader who has not yet seen a change of mode without one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | example (table) | Read by period, the relation between Corvane's platform team and its product teams passed through three modes, and only the first was unchosen. | table: Period \\| Mode in practice \\| Chosen? \\| What existed \\| Result. Rows: 2023 to 2024 launch requests; pilot weeks 1 to 2 with Scheduling; pilot weeks 3 to 6; from week 7; the following two quarters. |  |\n| p31 | analysis | Nobody was added to the platform team and no team was redrawn; what changed was that a mode was chosen, and three things existed that had not: a defined service, an owner for it and an end date for the engineer's stay. |  | `cause_effect`: The sequence of modes. → What made the change of mode possible. |\n| p32 | analysis | The change had a price: the platform team built the checks before anyone benefited, and for six weeks four engineers handled the launch requests of the other ten teams. | scenario: One of five platform engineers worked inside Scheduling for six weeks of the pilot quarter. | `contrast`: What the change gained. → What it cost and who paid. |\n| p33 | example | Scheduling and Dispatch were in a collaboration nobody chose from 2023, and left it in 2025 by the boundary exit: the boundary was moved first, and only then could a versioned schema serve as the interface. | scenario: First half of 2024: 23 of 31 rule changes needed both teams. After the 2025 re-cut, with the versioned rule schema as the interface: 3 of 28. | `similarity`: One pair that left collaboration for a service directly. → A pair that had to change its boundary first. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents can use what is written and cannot use what lives in a relationship, so a written team API matters more with them, and an interaction that passes through people may degrade faster as changes become cheaper to produce.\n\n**Advances the thesis** (S3): Tests the written artefact against agents doing part of the work, with labeled claims.\n\n**Transition in:** `additional_support`: Corvane's teams in 2024, without agents. → The same modes when agents do part of the work.\n\n**Order of paragraphs** (`order_of_importance`): The observed claim first and the speculative one second, so that the reader meets the better-supported claim before the less supported one and does not weigh them equally.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | analysis | As of November 2026, teams that use coding agents write down for the agent what a colleague would have asked in person, which makes the written part of an interaction the only part an agent can use. | reasoning: Emerging, the author's observation and not a measured result: repositories carry instruction files that tell an agent how to build, test and follow the team's conventions; an agent reads them and has no hallway to ask in. |  |\n| p35 | analysis | If agents make changes cheaper to produce, requests reach provider teams faster, and an interaction handled by people falls behind sooner than a self-service one. | scenario: Speculative. Illustration: Corvane's Review Wall of 2027 to 2028, merged changes per week up 2.4 times while review capacity stayed flat, median review wait from 5 hours to 31. Would be confirmed where queues at provider teams grow in step with consumers' change volume and self-service interfaces do not. | `cause_effect`: Agents as readers of what is written. → What more changes do to interactions that pass through people. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** A mode and a team API are the same decision at two moments: the mode is what two teams agree, and the team API is what remains of the agreement when the people who made it are not there. A queue or a standing meeting is what remains when nothing was agreed.\n\n**So what:** A leader reads every recurring cross-team meeting and every dependency queue as a question, which mode is this and did anyone choose it, and gives each collaboration an end date.\n\n**Callback:** The platform team of five on which every launch waited. The reader can now say what was missing in 2023: not people, but a defined service, a way to ask and a promise, which is one page.\n\n**Takeaway** (`course_of_action`): List your team's interactions, name the mode of each, give each collaboration an end date and write one page that says how to work with your team. The checklist gives the steps.\n\n**Hand-off** to [Team Size and Composition](team-size-and-composition.html): `cause_effect`: Team types and the modes between them, which decide what a team owns and how much of its time others consume. → How many people, and which roles, that requires.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis (list) | Established: the three modes and their costs, the condition for a service, and the team API are Team Topologies' concepts. |  |  |\n| p37 | synthesis (list) | Depends on context: how long a collaboration should last, how much to write down, and which exit a collaboration takes depend on what is still unknown, on the organization's size and on whether an interface can be drawn. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p38 | synthesis (list) | The author's synthesis: reading queues and standing meetings as unchosen modes, the fifth part of the team API and the end date with three exits are this book's own. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p39 | recommendation (list) | A mode and a team API are one decision at two moments, and the checklist restates the chapter's two patterns and its team API as eight checks the reader runs on their own team. |  | `sequence`: What to take away. → What to do with it. |\n| p40 | transition | The platform team of the opening lacked a page before it lacked people, and how much of a team's time its modes consume also decides how many people it needs, which the next chapter derives. |  | `cause_effect`: Team types and the modes between them, which decide what a team owns and how much of its time others consume. → How many people, and which roles, that requires. |\n\n## Non-goals\n\n- The four team types and the test for creating each See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- How much a team can own and where to place or move a boundary See [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html).\n- Finding the constraint in a flow from wait times See [Flow and the Constraint](flow-and-the-constraint.html).\n- Team size, on-call rotations and composition See [Team Size and Composition](team-size-and-composition.html).\n- Running a platform as a product: developer experience, adoption, platform roadmap See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- Who decides what between teams, and decision records See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Agents in the delivery flow and the evidence on what AI changes See [[agentic-delivery]], [[where-the-constraint-moves]].\n- Techniques for finding service boundaries (event storming, context mapping) See Skelton and Pais, Team Topologies.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The filled-in team API's details (channels, response times, notice periods) are new Corvane illustration; the author should confirm they suit the platform chapter (15) and the size chapter (8). No on-call rotation for the platform team is asserted here.\n- The six pilot weeks are read as two weeks of collaboration and four of facilitating; the ledger gave only six weeks. Confirm or reduce to one mode.\n- Team Topologies' team API and its typical mode pairings are cited through the author's own records, because the Kindle highlights do not include those passages.\n- [Team Size and Composition](team-size-and-composition.html) also exists as a permalink in the org-design journal; check that the hand-off link resolves in-journal once chapter 8 is built.\n\n## Decision log\n\n- **2026-11-19** — Open with the Launch Queue read as an interaction nobody chose, although chapters 2 to 5 have already used the case, because the part's opening and its acceptance criterion AC-3 are built on it and this chapter owes the reading by mode. Rejected: Opening with the Scheduling and Dispatch collaboration; Opening with the reader's own standing meeting as a question\n- **2026-11-19** — The filled-in team API is the Corvane platform team's, dated to the end of the 2024 pilot, so that the example the reader copies is also the repair of the opening case. Its details are new illustration and are appended to the ledger. Rejected: A generic template with placeholders only; A stream-aligned team's API\n- **2026-11-19** — The team API is given a fifth part, current interactions with mode and end date, marked as the author's addition to Team Topologies' list. Rejected: Keeping interactions in a separate document\n- **2026-11-19** — The six weeks of the 2024 pilot are read as two weeks of collaboration on the readiness checks followed by four weeks of facilitating; the ledger gave only the six weeks and their purpose. Rejected: Reading all six weeks as facilitating\n- **2026-11-19** — Six Simple Rules' warning against over-clarifying is used as the chapter's 'Where the Sources Disagree', because it is the strongest form of the view the thesis is disputed by. Rejected: A caveat paragraph only\n- **2026-11-19** — Team Topologies' team API and its typical mode pairings are not in the author's Kindle highlights; they are cited through the author's own records (team-first-thinking, team-interaction-modes), which distill the book. Verbatim quotations come only from the highlights.\n- **2026-11-19** — One Mermaid figure (the decision flow). The mode comparison and the worked example are tables.\n- **2026-11-19** — Flow rubric (one run): sound with notes. Applied: the limiting case of the rules session now follows the symptom table and the paragraph on unwritten agreements closes the section; the team-charter comparison moved to the end of the team API section; the third exit (one renewal) stated in the exits paragraph; the pilot introduced where the filled-in team API first mentions it; several declared reasons rewritten to say what would break. Not applied: cutting the symptom table to two rows (its last two rows are needed for reading a faked service or facilitation before the anti-patterns section explains them).\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n\n## Sources\n\n- **Internal**\n  - grounded-engineering-executive/posts/team-interaction-modes, team-first-thinking, evolve-team-structures (article and checklist tabs); org-design/posts/team-topologies-operating-model — The author's distillation of the modes, the team API contents, the typical pairings by team type and the reading of friction as a signal.\n  - _input/checklists/data/data.json: Team Interaction Modes, Evolve Team Structures, Team Charter example — Checklist items for each mode and the charter example's shape.\n  - _research/scenario-ledger.md — The Launch Queue, the 2024 pilot and its six weeks, the 2022 rules session, the Scheduling and Dispatch numbers, the Review Wall.\n  - journal-spec.json, entry interaction-modes-and-team-apis — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Matthew Skelton and Manuel Pais, Team Topologies (2019); author's Kindle notes, _input/bookshelf/docs/notes/team-topologies.pdf — The three interaction modes and their costs; the condition for X-as-a-Service; collaboration on ambiguous interfaces until stable; the cost of unnecessary collaboration; team interfaces and focused communication; the team API.\n  - Yves Morieux and Peter Tollman, Six Simple Rules (2014); author's Kindle notes, _input/bookshelf/docs/notes/six-simple-rules.pdf — The warning against clarifying roles, decision rights and processes beyond a threshold.\n  - Claire Hughes Johnson, Scaling People (2023), through the author's record grounded-people-management-tools/posts/team-charter — The eight-section team charter with provided and dependent interfaces.\n\n## Changelog\n\n- **2026-11-19** — Revised after the flow rubric (order inside the unchosen-mode and team-API sections, third exit, declared reasons) and accepted in auto mode.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</scri <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
