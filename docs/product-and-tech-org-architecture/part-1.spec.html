<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part I answers five questions in order: what kind of system an organization is, whom it serves and how changing it is run, why software mirrors teams, how much one team can own, and where capacity is lost.\n- **Be able to:** Pick the Part I chapter that answers the question in front of them.\n\n**Audience:** Executives and individual contributors in product and tech who have read the preface and are about to start Part I, or who arrive with one question and want the chapter that answers it.\n\n**Already knows:**\n\n- How software teams work day to day.\n- The preface's claim that an organization is a designed system with three scarce capacities (attention, judgment, verification).\n- The twelve failure patterns by name.\n- Corvane in outline: a fictional field-service scheduling company, its five stages and its named incidents, among them the Two Calendars, the hiring wave and the Launch Queue.\n\n**Does not yet know:**\n\n- Lead time, as the book measures it (glossed here).\n- Interface, decision right, constraint, cognitive load, fracture plane, team state, Conway's Law, discovery and outcome as working terms: each is owned by a Part I chapter and is only glossed in a clause here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** What kind of thing is a product and tech organization, and what decides how well it works?\n\n> **Claim:** A product and tech organization is a system: it behaves as its team boundaries, interfaces and decision rights make it behave, and its output is limited by one scarce capacity at a time, so designing it means finding that constraint and drawing boundaries that keep each team's cognitive load within what it can carry; and because the system exists for its users, the work of changing it is product work, begun with discovery and judged by outcome.\n\n**Disputed by:** The view that performance is a matter of hiring strong people and getting out of their way, and that attention to structure is bureaucracy.\n\n**So what:** A leader diagnoses boundaries, interfaces and the constraint before replacing people or adding headcount, and treats a team change as a change to the architecture of the product.\n\n**How and why:** Design decisions need communication, so systems take the shape of the teams that build them; a team can change safely only what it understands; and a flow moves at the speed of its slowest step. Strong people placed in a structure that overloads them or makes them wait produce what the structure allows.\n\n**Supporting claims**\n\n- **P1-1** — An organization can be described as components, interfaces, flows and constrained capacities, and a leader can design four things directly: boundaries, interfaces, decision rights and incentives.\n- **P1-2** — Systems take the shape of the communication between the teams that build them, so team structure is an architecture decision, and reshaping teams changes the architecture only when the teams hold the skills and ownership the new boundaries need.\n- **P1-3** — What a team can own is limited by what it can understand well enough to change and operate, so boundaries belong where the domain, the rate of change or the risk differs.\n- **P1-4** — Output is limited by one constraint at a time, and the right intervention depends on the state of the team at that constraint.\n- **P1-5** — An organization has users and owes them outcomes, so a change to it is run as product work: discovery before design, a stated outcome, a place on a roadmap toward a vision of the organization, and the smallest change that tests the diagnosis.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in the chapter list in the closing: the five chapters in the part's reading order)\n\nThe page opens on one question about Corvane, answers it in a sentence and then narrows: the part's claim about structure, the second lens that says whom the structure is for, the reason for the two placements in the chapter order that are not obvious, and last the chapters one by one with the question each answers. The claim stands before the second lens because the product lens is about changing the system the claim describes; put the lens first and the reader is told how to run a change to something not yet described. The reason for the order stands directly before the chapter list because it is the principle that orders the list; put the list first and it reads as five separate topics. The list comes last because a reader can choose a chapter only after seeing what the part argues as a whole.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): If Corvane replaced every manager tomorrow and kept its teams, interfaces and planning exactly as they are, what would change?\n\n**Bridge:** The reader's habit of explaining an organization's results by the people involved, and the experience of seeing a person replaced and the problem return. → Looking at what the structure asks of anyone placed in it, which turns the question about managers into the part's question: what kind of thing an organization is and what decides how well it works.\n\n**Thesis statement** (KEY POINTS bullet 1 and paragraph p03): Part I argues that a product and tech organization is a system: it behaves as its team boundaries, interfaces and decision rights make it behave, and its output is limited by one scarce capacity at a time. Because the system exists for its users, changing it is product work.\n\n**Roadmap** (paragraph p03):\n\n- The part's claim about structure and what follows from it for design. *Kept in:* the-claim.\n- The second lens: whom the system is for and how changing it is run. *Kept in:* the-second-lens.\n- Five chapters answer five questions in order: what kind of system an organization is and what can be changed in it, whom it is for and how changing it is run, why software mirrors teams, how much one team can own, and where capacity is lost; and why they stand in that order. *Kept in:* reading-order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | If Corvane had replaced every manager in 2024 and kept its teams, interfaces and planning as they were, little would have changed, because the nineteen-day lead time came from a queue that did not depend on who managed it. | scenario: Corvane (fictional) in 2024: 180 people, 95 engineers in eleven product teams and a platform team of five; median lead time for a change up from 4 days to 19; 14 launch requests open at the platform team. |  |\n| p02 | example | Explaining a result by the people involved is the habit this part replaces, and Corvane had already tested it once: it replaced a team lead after the Two Calendars and met the same failure eight months later. | scenario: The Two Calendars (2021, 50 people): Web and Mobile each implemented the rule for overlapping jobs; the Mobile lead was replaced; eight months later Mobile and Integrations diverged on job-status rules in the same way. | `example`: The question about replacing every manager, and the answer that little would change. → The reader's habit of explaining results by people, and one case in which Corvane acted on it. |\n| p03 | claim | Part I argues that an organization is a system that behaves as its boundaries, interfaces and decision rights make it behave and is limited by one scarce capacity at a time, that changing it is product work, and it makes the argument in five chapters that answer five questions in order. |  | `elaboration`: Something that stayed in place produced the failure. → The part's claim, which names what stays in place, and the five questions its chapters answer. |\n\n## Sections\n\n### The Claim: The Structure Produces the Result\n\n**Controlling idea** (`claim`, id `the-claim`): An organization's results come from its structure, for three reasons the chapters argue one by one, so designing it means finding the constraint and keeping each team's load within what it can carry.\n\n**Advances the thesis** (P1-1, P1-2, P1-3, P1-4): States the system half of the part thesis and names the mechanism behind each of the four supporting claims the system chapters argue.\n\n**Transition in:** `elaboration`: The claim as stated in the lead. → The claim's terms in plain words, the reasons behind it and its consequence for design.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim is stated in the part's vocabulary, then the three mechanisms that make it true, then what a leader does differently because of it. The consequence comes last because it uses 'constraint' and 'cognitive load', which the mechanisms paragraph introduces.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | The structure of an organization is where its team boundaries sit, what the interfaces between teams are and who holds which decision, and capable people placed in a structure that overloads them or makes them wait produce what the structure allows. |  |  |\n| p05 | explanation (list) | Three mechanisms make structure decide the result: software takes the shape of the communication between teams, a team can safely change only what it understands, and a flow moves at the pace of its slowest step. | reasoning: Design decisions need communication (Conway's Law); understanding limits ownership (cognitive load); output is set by one constraint at a time. | `cause_effect`: Structure as boundaries, interfaces and decision rights. → The three mechanisms through which that structure decides the result. |\n| p06 | recommendation | Designing an organization therefore means finding the constraint and drawing boundaries that keep each team's cognitive load within what it can carry, before replacing people or adding headcount. | scenario: Corvane's hiring wave (2022 to 2024, fictional): engineers doubled from 45 to 95, every one of them joining a team that wrote changes, while changes waited at the platform team. | `cause_effect`: The three mechanisms. → What a leader does because of them: diagnose the constraint and the load first. |\n\n### The Second Lens: The System Has Users\n\n**Controlling idea** (`claim`, id `the-second-lens`): Because an organization exists for its users, a change to it is product work: begun with discovery and judged by an outcome stated in advance.\n\n**Advances the thesis** (P1-5): States the product half of the part thesis.\n\n**Transition in:** `additional_support`: The system and the rule for designing it. → Whom the system is for and how the work of changing it is run.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | claim | An organization has users (the people and teams who work in it and the teams and customers who depend on each team) and owes them outcomes, so a change to it starts with discovery and is judged by a stated outcome, which Corvane's hiring wave lacked. | scenario: Corvane's hiring wave (fictional) was finished on schedule; when the board asked in 2024 whether it had worked, the leadership team could not answer, because no outcome had been stated. |  |\n\n### Why the Chapters Come in This Order\n\n**Controlling idea** (`explanation`, id `reading-order`): The five chapters stand in prerequisite order, and the two placements in it that are not obvious each have a reason: the product lens comes second so that every later rule is read as a means to an outcome, and flow comes last because it needs the boundaries explained.\n\n**Advances the thesis** (P1-1, P1-2, P1-3, P1-4, P1-5): Shows the five supporting claims as one line of reasoning in which each depends on the one before.\n\n**Transition in:** `sequence`: The two lenses. → The order in which five chapters build them, and the reason for it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | explanation | The chapters are in prerequisite order, and its two deliberate placements each have a reason: the chapter on users comes second so that every later rule is read as a means to an outcome, and flow comes last because work can be followed across team boundaries only after the boundaries have been explained. | reasoning: Starting with flow would ask the reader to find a constraint between teams whose boundaries have not been explained; placing the product lens last would let four chapters of structure be read as ends in themselves. |  |\n\n## Conclusion: Chapters in this part\n\n**Synthesis:** Read in order, the five answers are one line of reasoning and not five topics: the structure produces the result, the result is judged by what it does for the users, the arrangement of teams shapes the product, the size of what a team owns limits what it can do well, and the slowest step sets the pace of all of them.\n\n**So what:** A reader finishes the part able to explain Corvane's slowdown without blaming a person or a team, and diagnoses boundaries, interfaces and the constraint before replacing people or adding headcount.\n\n**Callback:** The opening question about replacing every Corvane manager (p01). By the last chapter the reader can give the reasons for the answer in the part's own vocabulary.\n\n**Takeaway** (`course_of_action`): Read the chapters in order; with one question in hand, open the chapter that answers it.\n\n**Hand-off** to [The Organization as a System That Can Be Architected](the-organization-as-a-system.html): `elaboration`: The part's claim that an organization behaves as its structure makes it behave. → What that structure consists of: four elements, four designable things, three scarce capacities.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | description (list) | Each of the five chapters answers one question, in this order: what kind of system an organization is, whom it is for, why software mirrors teams, how much one team can own, and where capacity is lost. |  |  |\n| p10 | synthesis | The five answers are one line of reasoning that explains Corvane's slowdown without blaming anyone, and it starts with what the structure consists of, which the first chapter sets out. |  | `conclusion_summary`: The five chapters and their questions. → What they add up to, the opening question answered with reasons, and the first chapter. |\n\n## Non-goals\n\n- Teaching any chapter's content; the page states the part's claim and does not argue it. See [The Organization as a System That Can Be Architected](the-organization-as-a-system.html), [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html), [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html), [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html), [Flow and the Constraint](flow-and-the-constraint.html).\n- Corvane's stages and incidents in full. See [Meet Corvane: One Company at Five Sizes](corvane-at-five-sizes.html).\n- The failure patterns' definitions. See [Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html).\n- What AI changes; part introductions carry no AI section.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
