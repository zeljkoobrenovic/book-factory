<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The part answers four questions in order, one per chapter: Why do organizations that ship a great deal still fail their customers, and what should they aim at instead?; How does a product vision become a strategy that teams can act on?; What should a roadmap commit to, and how far ahead can it honestly look?; What may a product team decide for itself, and how does that fit with a vision set at the top?\n- **Be able to:** Pick the chapter of this part that answers the question in front of them.\n\n**Audience:** Executives and individual contributors in product and tech who have read Parts I and II and are about to start Part III, or who arrive with one question about product work and want the chapter that answers it.\n\n**Already knows:**\n\n- How software teams work day to day, and what a roadmap and a feature request are.\n- Parts I and II in outline: the organization as a system with decision rights among its levers, and as a product whose changes are judged by outcomes (chapter 2).\n- Corvane in outline.\n\n**Does not yet know:**\n\n- Output and outcome as the book defines them for the product (chapter 9); glossed here.\n- Key customer outcome and key business outcome (chapter 9); glossed here.\n- The customer-journey vision and a strategy that works backward from it (chapter 10); glossed here.\n- Roadmap horizons and the balance of innovation, iteration and operation (chapter 11); glossed here.\n- Problem space and solution space, discovery, delivery and product operations (chapter 12); glossed here.\n- Renewal rate; glossed here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** How does an organization decide what to build so that its teams deliver outcomes and not output?\n\n> **Claim:** An organization delivers outcomes when a customer-journey vision bounds the problems worth solving, strategy sequences them, the roadmap states outcomes over horizons no longer than it has evidence for, and teams own the solutions; vision set at the top and empowerment at the edge do not conflict once the boundary between problem space and solution space is explicit.\n\n**Disputed by:** The view that customers and the market decide what gets built, so that product work is collecting requests and delivering them on time; and the opposite view that teams should discover everything bottom-up and a vision from the top only constrains them.\n\n**So what:** A leader stops approving feature lists and starts stating outcomes and their order, and a team stops asking what to build and starts answering for a result.\n\n**How and why:** A request names a solution, and a list of solutions carries no reason to prefer one to another or to stop. An outcome with a vision behind it gives teams a reason to choose and leaders a way to judge, and it leaves the choice of solution with the people closest to the customer and the code.\n\n**Supporting claims**\n\n- **P3-1** — Organizations that measure themselves by what they ship fail their customers in recognizable ways, and the remedy is to make a customer outcome and a business outcome the unit of progress.\n- **P3-2** — A vision described as the customer's future journey, with a strategy that works backward from it, is what turns outcomes from a slogan into an order of work.\n- **P3-3** — A roadmap should commit to outcomes over horizons that shrink in certainty, and balance innovation, iteration and operation deliberately.\n- **P3-4** — Leaders own the problem space and its order; teams own the solution space; and discovery, delivery and product operations are the machinery that lets a team use that ownership.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in four-steps and the chapter list in the closing: outcome, then vision and strategy, then roadmap, then who decides)\n\nThe page opens on a roadmap that was delivered and changed nothing, and on the question of what the roadmap was for. The first section says why a list of requests cannot answer that question; the second gives the four steps that replace the list, says why they come in that order, resolves the apparent conflict between direction from the top and decisions in teams, and places the steps in the book's two lenses; the chapter list closes the page. The reason stands before the four steps because each step supplies something the list lacks; put the steps first and outcome, vision, roadmap and decision rights arrive as product vocabulary with no problem behind it. The list comes last because a reader can choose a chapter only after seeing what each decides.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Corvane shipped forty-one features in a year, every one promised to a customer by name, and its renewal rate fell.\n\n**Bridge:** The reader's experience of a roadmap that was delivered in full and changed nothing. → The question that experience raises and that the usual explanations (wrong features, late delivery, sales promising too much) skip: what the roadmap was for.\n\n**Thesis statement** (KEY POINTS and paragraph p03): Part III argues that an organization delivers outcomes when a vision of the customer's future journey bounds the problems worth solving, a strategy puts them in order, the roadmap states outcomes only as far ahead as it has evidence for, and teams own the solutions; and that direction from the top and decisions in teams do not conflict once the line between problem and solution is explicit.\n\n**Roadmap** (paragraph p03):\n\n- Why a list of requests cannot steer an organization. *Kept in:* why-a-list-cannot-steer.\n- The four steps that replace the list, and why they come in that order; four chapters answer four questions in order: what to aim at, how a vision becomes a strategy, what a roadmap commits to, and what a team decides for itself. *Kept in:* four-steps.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In one year Corvane shipped forty-one features, each promised to a named customer, and its renewal rate fell. | scenario: Corvane (fictional): in one year between 2022 and 2024, while growing to 180 people, it shipped forty-one features, each promised to a named customer; its roadmap was a list of such promises with dates; the renewal rate fell. Customers pay per technician per month. |  |\n| p02 | context | A roadmap that is delivered and changes nothing is usually explained by the choice of features or the speed of delivery, and the question that explains it is what the roadmap was for, which Corvane's list did not say. | scenario: Corvane's roadmap (fictional) gave each feature, the customer it was promised to and a date; nothing on it said what should be different for a customer once a feature shipped. | `problem_solution`: The forty-one features and the falling renewal rate. → The reader's own version of that roadmap, and the question that explains it. |\n| p03 | claim | Part III argues that an organization delivers outcomes when a vision bounds the problems, a strategy orders them, the roadmap states outcomes as far as its evidence reaches and teams own the solutions, and that direction from the top and decisions in teams do not conflict once the line between problem and solution is explicit; it makes the argument in four chapters that answer four questions in order. |  | `elaboration`: The question of what a roadmap is for. → The part's claim, which answers it, and the four questions its chapters take in turn. |\n\n## Sections\n\n### Why a List of Requests Cannot Steer\n\n**Controlling idea** (`claim`, id `why-a-list-cannot-steer`): A request names a solution, and a list of solutions carries no reason to prefer one item to another or to stop; an outcome with a vision behind it supplies that reason and leaves the choice of solution with the people closest to the customer and the code.\n\n**Advances the thesis** (P3-1, P3-2, P3-3, P3-4): States the reasoning from which the part derives its four steps.\n\n**Transition in:** `cause_effect`: The part's claim as stated in the lead. → The reasoning that produces it: what a list of requests lacks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | Output is what an organization ships and an outcome is a change the customer can observe; a request names a solution, so a list of requests is a list of outputs with no reason in it to prefer one item to another or to stop. | reasoning: A request names a solution; a list of solutions carries no reason to prefer one to another or to stop. |  |\n| p05 | claim | An outcome with a vision behind it, a vision being a description of the customer's future experience, gives teams a reason to choose and leaders a way to judge, and it leaves the choice of solution with the people closest to the customer and the code. | reasoning: An outcome with a vision behind it gives teams a reason to choose and leaders a way to judge, and leaves the solution with those closest to the customer and the code. | `problem_solution`: A list with no reason to prefer or to stop. → What supplies the reason: an outcome with a vision behind it. |\n\n### Four Steps from Outcome to Decision\n\n**Controlling idea** (`explanation`, id `four-steps`): Four steps replace the list (an outcome as the unit of progress, a vision and a strategy that order the outcomes, a roadmap that lays them out in time, and a stated division of decisions between leaders and teams), and each step needs the one before it.\n\n**Advances the thesis** (P3-1, P3-2, P3-3, P3-4): One list item per supporting claim, then the order, then the resolution of the thesis's apparent conflict, then the book's two lenses.\n\n**Transition in:** `example`: An outcome with a vision behind it as what a list lacks. → The four steps that supply it, one per chapter.\n\n**Order of paragraphs** (`prerequisite_order`): Outcomes come first because vision and strategy are defined in terms of them; the roadmap follows because it is the strategy laid out in time; the division of decisions comes last because it needs all three to say who decides what. The paragraph on the order follows the list directly because it explains the list's sequence while the list is in front of the reader; the paragraph on the conflict follows because the conflict belongs to the last step and can be resolved only once that step has named the two spaces; the paragraph on the two lenses closes the section because it reads all four steps, and the resolution just given, as instances of the book's two disciplines. Put the division of decisions first and teams are handed decisions with no outcome to decide for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition (list) | Four steps replace the list: a customer outcome and a business outcome as the unit of progress; a vision of the customer's future journey with a strategy that works backward from it; a roadmap that commits to outcomes over horizons of shrinking certainty and balances innovation, iteration and operation; and a division of decisions in which leaders own the problem space and its order while teams own the solution space. | source: Key customer outcome and key business outcome, the customer journey vision, product strategy working backward from it, and the balanced roadmap of innovation, iteration and operation, as defined in Build What Matters (Foster and Nerlikar, 2020). |  |\n| p07 | explanation | The four steps come in prerequisite order: outcomes first because a vision and a strategy are stated in terms of them, the roadmap third because it is the strategy laid out in time, and the division of decisions last because a team handed the choice of solution before any outcome is stated has nothing to decide for. | reasoning: Vision and strategy are defined in terms of outcomes; the roadmap is the strategy laid out in time; the division of decisions needs all three; a division made first hands teams decisions with no outcome to decide for. | `cause_effect`: The four steps as listed. → The one direction in which they depend on each other. |\n| p08 | claim | Direction set at the top and decisions made in teams, the conflict the lead said the part resolves, do not conflict once the line between the problem space and the solution space is explicit, which answers both the view that product work is collecting requests and the view that any direction from the top constrains teams. | reasoning: The vision bounds the problem space and leaves the solution space open; each level decides where it has the information. | `contrast`: The division of decisions as the last step. → The conflict that step is usually thought to contain, and why it does not. |\n| p09 | explanation | The four steps carry the book's two lenses: they are the product thinking that chapter 2 applied to the organization, shown here on the product built for customers, and the fourth step is the decision-right lever of system design applied to product work. | reasoning: Chapter 2 took outcome, discovery and roadmap from product work and applied them to the organization; the division of decisions between leaders and teams is the decision-right lever of chapter 1 applied to product work. | `additional_support`: Each level deciding where it has the information. → The two lenses of the book as they appear in the four steps. |\n\n## Conclusion: Chapters in this part\n\n**Synthesis:** The four chapters put four things in the place of one list, and each answers something the list could not: what to aim at, in which order, by when and with how much certainty, and who chooses the solution.\n\n**So what:** A leader stops approving feature lists and starts stating outcomes and their order, and a team stops asking what to build and starts answering for a result.\n\n**Callback:** Corvane's forty-one features and its roadmap of promises from the opening (p01, p02). The closing reads the list against the four questions: it said what would ship, for whom and when, and answered none of the four.\n\n**Takeaway** (`course_of_action`): Read the chapters in order; with one question about product work in hand, open the chapter that answers it.\n\n**Hand-off** to [Outcomes Over Output](outcomes-over-output.html): `example`: The part's claim that an organization should deliver outcomes and not output. → What output-driven organizations look like, and what an outcome is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | description (list) | Each of the four chapters answers one question, in this order: what to aim at instead of output, how a vision becomes a strategy, what a roadmap commits to, and what a team decides for itself. |  |  |\n| p11 | synthesis | The four chapters put four answers in the place of one list, none of which Corvane's list of promises gave; a leader who has them stops approving feature lists and states outcomes and their order, and the first chapter starts with what output-driven organizations look like and what an outcome is. |  | `conclusion_summary`: The four chapters and their questions. → What they add up to for Corvane's list and for the reader, and the first chapter. |\n\n## Non-goals\n\n- Teaching any chapter's content: the dysfunctions, the vision, the roadmap and the division of decisions are named and glossed, not argued. See [Outcomes Over Output](outcomes-over-output.html), [Vision and Product Strategy](vision-and-product-strategy.html), [Roadmaps and Horizons](roadmaps-and-horizons.html), [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- The reading of the forty-one features as output with no outcome above it; that is the part's closing. See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- The outcome of an organizational change, as distinct from a product outcome. See [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- Engineering strategy and its relation to product strategy. See [Engineering Strategy](engineering-strategy.html).\n- What AI changes; part introductions carry no AI section.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The page adds one Corvane fact: nothing on the roadmap of promises said what should be different for a customer once a feature shipped. Chapters 9 to 12, written in parallel, should agree.\n- The page does not say that the forty-one features shipped on their dates (the ledger does not); the journal spec's bridge says 'delivered in full', which the page uses only of the reader's own roadmap.\n- Round 2 left two minor findings that are the spec's: the thesis sentence names four things that are not the four steps (outcome is missing from the part thesis's list and added as the first step), and the two disputing views sit in the conflict paragraph although the first belongs with the argument about lists of requests.\n\n## Decision log\n\n- **2026-11-19** — The post entry in the journal spec has a question and no thesis. A part introduction performs the part's opening, so this spec uses the part's thesis and its four supporting claims P3-1 to P3-4 unchanged; they are the part's, not the page's own. Intent e reading-order paragraph.; Merging the chapter list into the closing paragraph: AC-1 and the brief's page format need one line per chapter with its question.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — Spec change after draft-check round 1 (pass: 24 pass, 8 minor flow findings, none corroborated). Both flow readers, and the flow rubric before them, found that the reason for the order read more easily directly after the list of steps, and that the two lenses did not belong in the order paragraph. The section 'Four Steps from Outcome to Decision' now runs: list (p06), order (p07), conflict (p08), two lenses (p09, a new short paragraph); the conclusion's units are renumbered p10 and p11. Ids p07 and p08 in earlier log entries refer to the previous numbering (p07 conflict, p08 order and lenses). The argument is unchanged. Draft wording fixes for the other minor findings: the lead no longer counts 'four things' beside the four steps; the vision is said to choose the problems and the strategy to order them; the two missing reasons are matched to what an outcome supplies; 'the lead' is replaced by a reader's word. Rejected: Leaving the round-1 pass as it stood: three independent readers pointed at the same placement.\n- **2026-11-19** — Draft-check round 2 (fresh readers): revise, 12 pass, 6 fail (three corroborated, all in the draft's wording; three minor). Per the author's two-round rule the named units were revised once more and no third round was run, so check-report.json reads REVISE and is stale against the revised draft. Revised: p09 no longer counts discovery among 'the first three' steps; the three kinds of work in p06 are each glossed and tied to the roadmap, and distinguished from product operations; p08 points to the introduction and not to 'the opening'. Not changed (spec-level, one reader each, left for the author): the thesis sentence in p03 names four things (vision, strategy, roadmap, teams own the solutions) that are not the four steps of p06; the first of the 'two common views' in p08 belongs to the first section's argument.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-3, its post entry part-3, and the entries of outcomes-over-output, vision-and-product-strategy, roadmaps-and-horizons and discovery-delivery-and-empowered-teams) — Intent, AC-1 and role (post entry); thesis, supporting claims, flow rationale and opening (part); what each chapter argues; outcomes-over-output's transition_in for the hand-off.\n  - _research/scenario-ledger.md — The Corvane facts: the forty-one features, the roadmap of promises, the renewal rate, the pricing per technician.\n- **External**\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020); author's notes under _input/bookshelf/docs/notes/ — Key customer and business outcomes, the customer journey vision, product strategy and the balanced roadmap, named only.\n\n## Changelog\n\n- **2026-11-19** — Initial spec for the Part III introduction. (AI-mediated session)\n- **2026-11-19** — Flow rubric notes applied (conflict announced in the lead; two spaces named in the fourth step); status accepted in auto mode. (AI-mediated session)\n- **2026-11-19** — Draft-check round 1: pass with 8 minor flow findings. Order paragraph moved before the conflict paragraph and the two lenses given a paragraph of their own (p07 to p09); conclusion renumbered. (AI-mediated session)\n- **2026-11-19** — Draft-check round 2: revise. Draft units p06, p08 and p09 revised afterwards; no third round, report stale. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
