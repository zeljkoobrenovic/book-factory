<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Larson's structure for an engineering strategy: exploration, diagnosis, refinement, policy and operations.\n- **Know:** The three policy areas he says settle most conflicts: resource allocation, fundamental rules and decision rights.\n- **Know:** Rumelt's kernel and bad-strategy signs as the test.\n- **Believe:** Every engineering organization has a strategy in its actions; writing it down is the first step to changing it.\n- **Be able to:** Write a diagnosis and three policies for a given situation.\n- **Be able to:** Test a policy: is it a real choice, does it apply to a decision this quarter, is it true of how the organization behaves?\n- **Be able to:** Say what the engineering strategy takes from the product strategy.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given three candidate policies, the reader says which are policies and which are slogans, using the chapter's test. *Probe:* Which of these is an engineering policy and which a slogan? (a) 'We value quality.' (b) 'New services use the standard deployment path; a team that needs another one writes a decision record and owns its operation.' (c) 'We will be world-class at reliability.' | `custom` | cold_reader | major |\n| AC-2 | The chapter states what the engineering strategy takes as input from the product strategy of chapter 10 and what it gives back. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What is an engineering strategy, and how does it relate to the product strategy?\n\n> **Claim:** An engineering strategy is a written diagnosis of the engineering organization's situation and a small set of policies — on how capacity is allocated, which rules are fixed and who decides what — that settle decisions which would otherwise be argued again each time; it takes the product strategy as an input, because the diagnosis is of the engineering organization's ability to deliver that product, and it gives back constraints the product strategy has to respect.\n\n**Disputed by:** The view that an engineering organization needs good judgment case by case and that a written strategy is either obvious or obsolete by the time it is approved.\n\n**So what:** A leader writes down the policies already implied by past decisions, tests each against a recent decision it should have settled, and reviews the document on a rhythm.\n\n**How and why:** Decisions made case by case are made by whoever is in the room and differ from team to team; a policy makes one decision serve many cases and lets people act without asking. Larson's observation is that the strategy already exists in the organization's behaviour and writing it makes it discussable.\n\n**Supporting claims**\n\n- **S1** — Recurring technical decisions that are made case by case are made by whoever is in the room and come out differently each time, and the pattern they leave is already the organization's strategy, unwritten.\n- **S2** — An engineering strategy is a written diagnosis and a small set of policies; a policy differs from a decision and from a slogan because it settles a kind of case in advance, and the strategy is produced in five steps from exploration to operations.\n- **S3** — The engineering strategy takes from the product strategy the things that must become true and their order, and gives back constraints the product strategy has to respect.\n- **S4** — The diagnosis describes the engineering organization as it behaves today and names a cause; it is found by reading past decisions.\n- **S5** — Policies in three areas (how capacity is allocated, which rules are fixed, who decides what) settle most recurring conflicts, and each must pass a test: it is a real choice, it applies to a decision this quarter, and it is true of how the organization behaves.\n- **S6** — A strategy holds only while it is operated: it has mechanisms for exceptions, escalation and transition, it is written by the executive who will enforce it, and it is reviewed on a rhythm.\n- **S7** — The objections that judgment case by case is enough, and that a written strategy is obvious, obsolete or an attack on autonomy, are answered by the test and the review; where the sources differ on vision and on who writes, the strategy describes today and the accountable executive writes it.\n\n## Role in the part\n\nSupplies the direction the other four chapters of the part enforce, embody, apply and change. Supports P4-1 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in what-a-strategy-is through operate-and-review: the definition before the input it takes, the input before the diagnosis that reads it, the diagnosis before the policies that answer it, the policies before the mechanisms that keep them in force)\n\nThe reader first meets a decision argued from scratch for the eleventh time, so the strategy arrives as the missing thing. The definition comes before the product strategy's input because the reader has to know what a diagnosis is before being told what it is a diagnosis of. The input comes before the first pattern because the exploration reads the product strategy's prerequisites; without it the diagnosis would have nothing to be a diagnosis of. The diagnosis comes before the policies because a policy is judged by whether it answers the diagnosis, and the policies before the mechanisms because a mechanism keeps a named policy in force. Corvane's strategy is built step by step inside the patterns, and the constraint it returns to the product strategy is stated only after the policy that produces it. The disagreements and the objection come after the whole strategy exists, because the answer to the objection uses the test and the review; placed earlier they would be answered with terms not yet defined. AI comes last because its two claims apply the finished argument.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2026 three teams at Corvane asked for a fourth message broker. The architecture forum discussed the request in three sessions over six weeks and did not decide, and every argument made in the room was reasonable.\n\n**Bridge:** A reader who has sat in a technical review where the same kind of question came back with different people and a different answer. → What is missing is a written answer to the kind of question: an engineering strategy made of a diagnosis and a few policies.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): An engineering strategy is a written diagnosis of the engineering organization's situation and a small set of policies — on how capacity is allocated, which rules are fixed and who decides what — that settle decisions which would otherwise be argued again each time; it takes the product strategy as an input, because the diagnosis is of the engineering organization's ability to deliver that product, and it gives back constraints the product strategy has to respect.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a recurring technical decision argued again from the beginning at Corvane. *Kept in:* the-fourth-broker.\n- Know what an engineering strategy is and how a policy differs from a decision and from a slogan. *Kept in:* what-a-strategy-is.\n- Say what the engineering strategy takes from the product strategy and what it gives back. *Kept in:* product-strategy-in-and-out.\n- Write a diagnosis, write three policies and test them, and operate and review the result, each shown on Corvane's own strategy. *Kept in:* diagnose-from-behavior, three-policies-each-tested, operate-and-review.\n- Know where the sources disagree and how the main objection is answered. *Kept in:* where-the-sources-disagree.\n- Know what AI changes. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2026 three Corvane teams asked for a fourth message broker and the architecture forum argued the request for six weeks without deciding, because nothing written said how such a request is answered. | scenario: Illustration: Corvane in 2026, about 500 people, about thirty teams, three message brokers in use; three teams ask the architecture forum for a fourth; three sessions in six weeks, no decision. |  |\n| p02 | claim | An engineering strategy is a written diagnosis and a small set of policies that settle such decisions once, and it takes the product strategy as its input; the chapter goes from Corvane's request to the definition, the input, three patterns, the disagreements and AI. |  | `problem_solution`: A request nobody could settle. → The thing that settles requests of that kind, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: The Fourth Broker\n\n**Controlling idea** (`example`, id `the-fourth-broker`): Corvane's request for a fourth broker was the eleventh question of its kind in two years, each answered by whoever attended, and the pattern of those answers was Corvane's unwritten strategy.\n\n**Advances the thesis** (S1): Shows decisions made case by case and the implicit strategy they add up to.\n\n**Transition in:** `elaboration`: The lead's short account of the request. → The request in detail and the ten earlier ones.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Both sides of the broker request were reasonable: the three teams had a technical case, and the engineers who objected could point at three brokers already in use and one of them never retired. | scenario: Illustration: the three teams want a broker that can replay past messages to a service that was offline; three brokers already run at Corvane, the oldest still used by two teams; each session of the forum had different attendees and reopened the question. |  |\n| p04 | analysis | The forum had faced the same kind of question eleven times in two years and answered it differently depending on who attended, and the sum of those answers was a strategy nobody had written: each team chooses, and nothing is retired. | scenario: Illustration: in 2025 and 2026 the forum's notes show eleven requests for a new way of deploying, messaging or checking identity; most were granted, one after a single meeting; the result is four ways of deploying, three brokers, two identity libraries. | `cause_effect`: One request nobody could settle. → Why: the same kind of request had always been settled by attendance, and what that added up to. |\n\n### A Strategy Is a Diagnosis and a Few Policies\n\n**Controlling idea** (`definition`, id `what-a-strategy-is`): An engineering strategy, in Larson's sense, is a written diagnosis of the organization's situation and a small set of policies; a policy settles a kind of case in advance, every organization already has an unwritten one, and writing it follows five steps.\n\n**Advances the thesis** (S2, S1): Defines the strategy, the diagnosis and the policy, and says the strategy exists before it is written.\n\n**Transition in:** `problem_solution`: An unwritten strategy nobody chose. → What a written one consists of.\n\n**Order of paragraphs** (`prerequisite_order`): The definition of the whole comes first, then the policy told apart from its two look-alikes, then the claim that a strategy exists unwritten, which needs both terms, then the steps for writing it down.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Larson defines an engineering strategy as a document that states how engineering allocates its resources, which rules all teams follow and how decisions are made, and he builds it on Rumelt's kernel of diagnosis, guiding policies and coherent actions. | source: An engineering strategy is a document that defines the what and the why of engineering's resource allocation against its priorities, the fundamental rules that engineering's teams must abide by, and how decisions are made within engineering. Following Rumelt, it has a diagnosis (a theory describing the nature of the challenge, identifying root causes), guiding policies (the approaches applied to the challenge, involving trade-offs) and coherent actions.; source: The kernel of a strategy contains a diagnosis, a guiding policy and coherent action. |  |\n| p06 | comparison (table) | A policy differs from a decision, which settles one case, and from a slogan, which settles none: it settles every case of a kind in advance. | table: Statement \\| Example \\| What it settles. A decision \\| 'The three teams may use the new broker' \\| one case. A slogan \\| 'We hold a high bar for engineering excellence' \\| none; nobody would say the opposite. A policy \\| 'A new technology enters a shared area only as a replacement for one it retires' \\| every case of that kind, before it arises. | `contrast`: The policy as one part of the strategy. → The two things it is confused with. |\n| p07 | explanation | Every engineering organization already has a strategy in its behavior, and a written strategy is useful only if it starts from that behavior; writing it down makes it something people can discuss and change. | quotation: 'The reason most written strategies don't apply is that they're actually visions of how things could ideally work, rather than accurate descriptions of how things work today.'; example: Larson's example: Uber in 2014 had an implicit technology strategy of letting teams select their own tools, enforced by the absence of a counter-policy and by tooling that ran any container. | `additional_support`: Policies as written statements. → The same policies exist unwritten, in what the organization does. |\n| p08 | process (figure) | Larson's later book describes writing a strategy as five steps (exploration, diagnosis, refinement, policy and operations), and the three patterns of this chapter follow them, with refinement done in two places: the independent diagnoses of the first pattern and the test of the second. | source: The five steps as named and summarized in the author's checklists of Crafting Engineering Strategy: Exploration, Diagnosis, Refining, Policy Setting, Operations. The book is cited only through those checklists.; figure: Mermaid flowchart, left to right: 'Exploration: read what exists' --> 'Diagnosis: name the cause' --> 'Refinement: test it' --> 'Policy: three areas' --> 'Operations: keep it in force' --'review'--> back to 'Diagnosis'. Caption: a strategy is written in five steps and the review returns to the diagnosis. | `sequence`: A strategy that has to be written down from behavior. → The steps by which it is written. |\n\n### What It Takes from the Product Strategy, and What It Gives Back\n\n**Controlling idea** (`explanation`, id `product-strategy-in-and-out`): The engineering strategy takes from the product strategy what must become true and in what order, because its diagnosis is of the ability to deliver that product, and it gives back constraints that can change the order of the product's steps.\n\n**Advances the thesis** (S3): States the relation to the product strategy of chapter 10 in both directions, as acceptance criterion AC-2 requires.\n\n**Transition in:** `elaboration`: Exploration as the first step. → The first thing exploration reads: the product strategy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | explanation | The engineering strategy takes from the product strategy the things each step needs to be true first and the order of the steps, because a diagnosis has to be a diagnosis of the ability to deliver something. | source: Chapter 10: each step of a product strategy states what must be true first. Larson: the diagnosis draws on the business and product context, and where the company's strategy is not written the engineering executive writes down their best understanding of it, with questions such as who the products' users are and how work is prioritized for them. |  |\n| p10 | explanation | It gives back constraints: what has to be converged or built before a step can start, and the capacity reserved for work no product step asks for, either of which can change the order or the dates of the product's steps. | source: Larson: the engineering executive has to think about the priorities no one else is asking for, especially security, reliability, compliance and developer productivity. How the capacity is fixed in a plan is chapter 23's subject. | `contrast`: What engineering takes. → What it returns. |\n| p11 | example (table) | At Corvane the first two steps of the product strategy each name something that must be true first, and each puts a question to engineering; what the engineering strategy gives back is shown in a table at the end of the policies pattern. | table: Product strategy step (2025) \\| What must be true first \\| The question it puts to engineering. Step 1, every schedule change reaches customer and technician \\| every change published in one way; in 2026 three brokers carry them \\| why are there three, and what would bring them to one? Step 2, the product proposes a repaired plan \\| parts data in one form from Stock Integrations \\| who fixes the form of the stock data, and when? | `example`: Input and constraint in general. → What Corvane's engineering strategy takes from its product strategy. |\n\n### Pattern: Diagnose from Behavior\n\n**Controlling idea** (`process`, id `diagnose-from-behavior`): The first pattern is to explore what the organization has actually decided and to write a diagnosis that names the cause; Corvane's diagnosis is that shared technical choices have no owner and no rule, so each new team adds one.\n\n**Advances the thesis** (S4): Gives the pattern for the diagnosis, with its user and measure, and writes Corvane's.\n\n**Transition in:** `sequence`: The product strategy as input. → The first pattern, which reads that input beside the organization's own record.\n\n**Order of paragraphs** (`prerequisite_order`): The pattern and its rules first, then what Corvane's exploration found, then the diagnosis written from the findings, then what makes it a diagnosis; the judgement comes after the thing judged.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | process | The pattern is to read what the organization has decided before saying what is wrong, and to write a diagnosis that names a cause and not a symptom; its author is the engineering executive, its users are the people who will write and judge the policies, and it worked if those people state the same cause. | source: Larson: do not skip the diagnosis, because without it you cannot evaluate whether a solution is appropriate; when possible have two or three leaders diagnose independently; diagnose with the skeptics; be wary when the diagnosis resembles that of your previous roles. Rumelt: underperformance is a result, and the true challenges are the reasons for it. |  |\n| p13 | example | Corvane's exploration in 2026 read three things: the forum's notes of two years, which team used which way of deploying, messaging and identity, and the product strategy's prerequisites. | scenario: Illustration: Dario Vance, VP Engineering, reads the notes (eleven requests, most granted), the inventory (the eleven older product teams on the 2024 release path, the teams formed in 2025 and 2026 on three other ways of deploying; three brokers; two identity libraries) and the product strategy steps; Samir Haddad and Lena Brandt each write their own diagnosis before the three compare. | `example`: The pattern. → Corvane's exploration. |\n| p14 | example (table) | Corvane's diagnosis has four lines: what is happening, why, what it costs and what it is not. | table: Line \\| Corvane, 2026. What is happening \\| every team formed since 2025 chose its own way of deploying, messaging and identity. Why \\| shared technical choices have no owner and no rule; the 2024 release path was built for eleven teams and nothing told a new team to use it. What it costs \\| the product strategy's step 1 needs one way of publishing schedule changes; engineers who change teams relearn the basics; Platform's eight engineers support one way of four. What it is not \\| a lack of skill or a wrong technology; each choice was reasonable. | `sequence`: What the exploration found. → The diagnosis written from it. |\n| p15 | analysis | What makes this a diagnosis is that it names a cause somebody can act on (no owner and no rule for shared choices) and so marks out where the policies must work. | quotation: 'A good strategic diagnosis does more than explain a situation—it also defines a domain of action.' | `elaboration`: The four lines. → Why they count as a diagnosis. |\n\n### Pattern: Three Policies, Each Tested\n\n**Controlling idea** (`process`, id `three-policies-each-tested`): The second pattern is to write one policy in each of Larson's three areas and to test each with three questions; Corvane's three policies pass, and a policy that fails is a slogan that leaves decisions where they were.\n\n**Advances the thesis** (S5): Gives the three areas, the test, Corvane's policies and the way the pattern fails.\n\n**Transition in:** `problem_solution`: A diagnosis that names a missing owner and a missing rule. → The policies that answer it.\n\n**Order of paragraphs** (`prerequisite_order`): The areas come before the test because the test is applied to policies in those areas; the test is stated before Corvane's policies so that the reader can apply it to them while reading; the policies are shown before the test is run on them; what the rule does to the opening request follows the test table; the constraints returned to the product strategy follow, because each comes from one of the policies; the failure comes last because it is defined as failing the test.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | definition | Larson writes guiding policies in three areas (resource allocation, fundamental rules and how decisions are made), which are the three things teams otherwise argue about each time; the pattern's users are team leads and senior engineers facing a decision, and its measure is how many recurring questions still reach the forum or the executive. | source: Larson structures guiding policies as three questions: what is the organization's resource allocation against its priorities, and why; what are the fundamental rules all teams must abide by, and why do they matter; how are decisions made within engineering. He advises explaining why each rule matters, and wants teams to know what they can decide themselves. |  |\n| p17 | explanation | A policy passes the chapter's test if it is a real choice, applies to a decision someone faces this quarter, and is true of how the organization behaves or will be because someone enforces it. | source: Larson's properties of a useful guiding policy: applicable, enforced, creates leverage; 'If a guiding policy doesn't imply a trade-off, you should be suspicious of it'; ask yourself whether you are willing to enforce the policy. Rumelt: strategy involves focus and therefore choice.; reasoning: The wording of the first question as an inversion (could a sensible organization choose the opposite?) and of the third as truth of behavior is the author's; Larson's third property, leverage, is kept as a check against the diagnosis. | `sequence`: Three areas in which to write. → The test each written policy must pass. |\n| p18 | example (table) | Corvane's strategy has three policies, one per area, each with its reason. | table: Area \\| Policy \\| Why. Resource allocation \\| until each shared area has one standard in use, the operation share of every group's roadmap (25 percent) goes first to convergence, in the order the product strategy's steps need: messaging first \\| convergence that competes with features every quarter does not happen. Fundamental rule \\| one standard per shared area (deploying, messaging, identity); new services use it; a team that needs something else writes a decision record and operates it itself; a new technology enters a shared area only as a replacement, with what it retires, who moves the existing users and by when \\| the cost of a further way falls on other teams. Decision rights \\| a team decides what stays inside its own services; a choice in a shared area is decided by the Director of Platform after written advice from the teams affected and the forum, and recorded; the forum advises and does not vote; one escalation, to the VP Engineering \\| a decision made by attendance differs every time. | `example`: The areas and the test. → Corvane's three policies. |\n| p19 | analysis (table) | Run against the test, each of Corvane's policies has an opposite a sensible organization could hold, a decision of this quarter it settles and a way to check that it is true. | table: Policy \\| The opposite a sensible organization could hold \\| Decision it settles this quarter \\| How you check it is true. Allocation \\| every team spends its whole capacity on its own roadmap \\| whether messaging convergence or a feature gets the next engineers \\| the share spent, reported per group each quarter. Rule \\| each team picks the best tool for its job \\| the fourth-broker request \\| new services not on the standard, and exceptions without a record. Decision rights \\| an architecture board approves every design \\| who answers the three teams, and by when \\| time a shared choice waits; decisions recorded. | `sequence`: The three policies. → The test run on them. |\n| p19b | analysis | Under the rule the opening request changes from whether a fourth broker may be added beside the three to whether the new one replaces them, who moves the users and by when. | source: Larson's rule of thumb on standards: mostly standardize, make sure explorations drive an order-of-magnitude improvement, and limit concurrent explorations. | `elaboration`: The test table's middle row. → What the rule does to the opening request. |\n| p19c | analysis (table) | The three policies are also what the engineering strategy gives back to the product strategy: each returns one constraint, and together they answer the two questions the product strategy's steps put to engineering. | table: Policy \\| Question it answers \\| Constraint returned \\| What it means for the product strategy. Rule \\| step 1: what would bring three brokers to one? \\| messaging comes down to one broker \\| step 1's milestone cannot be reached before that; a fourth broker moves the other way. Decision rights \\| step 2: who fixes the form of the stock data, and when? \\| parts data is treated as a shared area; the Director of Platform fixes its form after advice from Stock Integrations and the teams building step 2 \\| step 2's proposal work starts when the form is fixed. Allocation \\| none \\| the operation share goes first to convergence \\| product steps can count on the rest of the capacity and not on that share. | `additional_support`: A policy answering the opening request. → The same policies answering the product strategy's two questions. |\n| p20 | analysis | A policy that fails the test is a slogan, and a strategy made of slogans leaves every decision where it was, which shows up as three of this book's failure patterns. | source: Rumelt's hallmarks of bad strategy: fluff, failure to face the challenge, mistaking goals for strategy, bad strategic objectives; 'Bad strategy is long on goals and short on policy or action.'; reasoning: Mapping to the book's failure patterns (the author's): with no rule the forum argues each case again (the Consensus Stall); with no decision rights each case climbs to the executive (the Escalation Ladder); with a rule enforced only by approving every design the approver becomes a queue (the Review Bottleneck). | `contrast`: Policies that pass. → What a policy that fails looks like and costs. |\n\n### Pattern: Operate It and Review It\n\n**Controlling idea** (`process`, id `operate-and-review`): The third pattern is to give each policy a mechanism, to have the accountable executive write and launch the strategy with a small working group, and to review it on a rhythm; at Corvane the first review found one policy untrue and changed it.\n\n**Advances the thesis** (S6): Gives operations, authorship, launch and review, and shows a review correcting a policy.\n\n**Transition in:** `cause_effect`: Policies that pass a test on paper. → What keeps them true afterwards.\n\n**Order of paragraphs** (`prerequisite_order`): The mechanisms and the pattern's measure come first because the launch commits to a review that uses that measure; the writing and launch process comes before Corvane's launch and review, which follow it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | explanation | A policy stays in force only through mechanisms, which Larson lists as enforcement, escalation and transition, each treated in its own chapter; the third pattern supplies them, its users are the teams bound by the policies, and its measure is, at each review, how many decisions cited a policy and how many exceptions were recorded. | source: Larson's coherent actions: enforcements (the process that maintains policies and evaluates exceptions), escalations (how to argue that a policy does not work or does not apply), transitions (how to move from the current state to the new one); long-lasting policies need fewer one-off actions and more enduring ones. The Operations checklist of Crafting Engineering Strategy covers the same ground. |  |\n| p22 | process | The executive who will enforce the strategy writes it, with a working group of three to five, shares it with the people who will object before launching it, and commits to a review two months later. | source: Larson: 'Commit to writing this yourself!'; identify three to five people for early, rapid feedback as a strategy working group; share diagnosis and policies with the full set of stakeholders; find those most likely to disagree; finalize, announce and commit to reviewing the strategy's impact in two months. Larson's alternative for people without authority: write five design documents and pull the similarities out.; example: Author's practice, from the author's own strategy records: the diagnosis, the policy and the operating model are separate documents; exceptions are kept in a register; live decisions are reviewed monthly and the fit of the policies quarterly. | `sequence`: Mechanisms. → Who writes the strategy, how it is launched and when it is reviewed. |\n| p23 | example | At Corvane the review two months after launch found two policies working and one untrue: four requests had been answered in one session each, with the forum advising by the rule and the Director of Platform deciding, and two of the four product groups had spent the convergence share on features, so the allocation policy was rewritten to say who reports the share. | scenario: Illustration: Dario Vance writes the strategy in 2026 with Samir Haddad, Lena Brandt and one product group's engineering director as working group; Priya Nambiar reads the diagnosis against the product strategy; two-month review: four requests answered in one session each, two exceptions recorded with owners, two of four groups below the share; the policy now names each group's director as reporting the share quarterly. | `example`: The process and its review. → Corvane's launch and first review. |\n\n### Where the Sources Disagree\n\n**Controlling idea** (`counterargument`, id `where-the-sources-disagree`): The sources differ on whether a strategy starts from a vision and on who writes it, and the strongest objection denies the need for a written strategy at all; in each case the book keeps a strategy that describes today, written by the executive who enforces it, and checked against recent decisions.\n\n**Advances the thesis** (S7): States two tensions among the sources and the disputing view, with the book's resolution of each.\n\n**Transition in:** `contrast`: A strategy written, tested and reviewed. → Where the sources pull apart and what is said against writing one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | comparison | Chapter 10's product strategy works backward from a vision, and Larson's engineering strategy starts from today and treats the vision as something derived later; they fit because the engineering strategy's destination is supplied by the product strategy. | source: Larson: to write an engineering vision, write five engineering strategies and forecast their implications two years into the future. Foster and Nerlikar, as chapter 10 presents them: the product strategy works backward from the customer journey vision. |  |\n| p25 | comparison | Larson gives two routes to a strategy, extraction from design documents by people who need consensus and direct writing by the executive, and for an organization with an engineering executive I take the second for the writing and keep the first as the method of exploration. | source: Larson: an executive does not need to rely on consensus to drive enforcement and can take a more direct path; the biggest risks are then a weak diagnosis or ineffective guiding policies. Rumelt: a statement reached by people forced to a consensus who could not agree what to forgo is not a strategy. | `additional_support`: A difference between two books. → A difference inside one book. |\n| p26 | refutation | The objection that good judgment case by case is enough, and that a written strategy is obvious, obsolete or a loss of autonomy, fails on each count: case by case means by attendance, obvious can be tested against last quarter's decisions, obsolete is what the review is for, and written decision rights tell a team what it may decide alone. | source: Larson on the objection that strategies are top-down and remove autonomy: the concern is usually about how the strategy was set or about one specific strategy, and there is usually something to learn from it.; reasoning: Corvane's eleven requests as the test of 'obvious': had the strategy been obvious, the eleven answers would have agreed. | `contrast`: Disagreements among sources that want a strategy. → The view that none is needed. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI gives written policies a second reader, the coding agent, and makes divergence cheaper to create, and both raise the value of a strategy written as policies.\n\n**Advances the thesis** (S5, S1): Applies the chapter's argument to AI with labeled claims.\n\n**Transition in:** `additional_support`: A written strategy defended against the objection. → What changes when agents write code.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | analysis | Emerging: teams put their engineering rules into the instruction files that coding agents read, so a fundamental rule written as a policy is applied on each change, and a slogan gives an agent nothing to apply. | reasoning: Author's observation as of November 2026, labeled Emerging; not a measured result. The first sentence of the section announces the label scheme. |  |\n| p28 | claim | Speculative: when an agent can stand up another broker or deployment script in an afternoon, a further way of doing something costs less to create and as much as before to operate, so the decisions a strategy settles arrive more often. | reasoning: Labeled Speculative; follows from the argument of Part XI (where-the-constraint-moves). It would be confirmed where organizations using agents report a rising number of distinct technologies per team without a written rule. | `cause_effect`: Agents as readers of policy. → Agents as cheap producers of divergence. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The strategy was there before anyone wrote it: Corvane's eleven answers were a policy of letting each team choose. Writing did not add a strategy; it replaced one nobody had chosen with one that names its cause, can be tested against a decision and can be found untrue at a review.\n\n**So what:** The reader can write down the policies their own past decisions imply, test each against a recent decision it should have settled, and review the document on a rhythm.\n\n**Callback:** The three teams' request for a fourth broker that the forum could not settle in six weeks. The reader can now say why it could not be settled and what the request becomes under the three policies.\n\n**Takeaway** (`course_of_action`): List the last ten technical questions your review forum handled, write the policy each answer implies, and test the three that recur most with the three questions.\n\n**Hand-off** to [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html): `problem_solution`: Policies that settle recurring decisions, which leaves open how they are applied across many teams. → The instruments of governance, from advice to mandate, and the record that holds each decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | synthesis (list) | Established: a strategy has a diagnosis, policies and actions; a policy implies a trade-off; a strategy that describes an ideal and not today is not applied. |  |  |\n| p30 | synthesis (list) | Depends on context: who writes the strategy, how many rules are fixed and how often it is reviewed depend on whether there is an executive who can enforce, on the number of teams and on how fast the product strategy moves. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p31 | synthesis (list) | The author's synthesis: the strategy exists before it is written and writing replaces an unchosen one; the three-question test; the exchange with the product strategy in both directions. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p32 | recommendation (list) | The checklist turns the three patterns and the test into eight questions to ask of an engineering strategy. |  | `sequence`: What to take away. → What to do with it. |\n| p33 | transition | The fourth-broker request now has an answer in kind, and policies that settle recurring decisions leave open how they are applied across thirty teams; the next chapter gives the instruments. |  | `problem_solution`: Policies that settle recurring decisions, which leaves open how they are applied across many teams. → The instruments of governance, from advice to mandate, and the record that holds each decision. |\n\n## Non-goals\n\n- Governance instruments: advice, nudges, paved paths, guardrails, taxes, mandates, and decision records in detail See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- Planning: budget, allocation and how a capacity share is fixed and defended See [Planning](../grounded-engineering-executive/planning.html).\n- How a migration is run and finished See [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- The platform as a product and the paved path See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- Decision rights as a general subject, RFCs and decision styles See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Product vision and product strategy See [Vision and Product Strategy](vision-and-product-strategy.html).\n- Which broker Corvane chooses and with which instrument; the chapter stops at what the request becomes under the policies\n- Rumelt's sources of advantage and company strategy\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Corvane's engineering strategy (diagnosis, three policies, working group, two-month review figures) is invented by this chapter and appended to the ledger; the author may want different policies or figures.\n- The strategy is written by Dario Vance as VP Engineering; Tomas Rell (co-founder and CTO) is not mentioned. Chapter 18 on executive roles may need to say which of the two is Corvane's engineering executive in Larson's sense.\n- Crafting Engineering Strategy is cited only through the titles and summaries of the author's seven checklists in data.json (the linked documents were not opened); the five steps are named and not described beyond those summaries.\n- The author's tech-strategy journal is used only for the shape of the author's practice (separate diagnosis, policy and operating-model records; exception register; monthly and quarterly reviews) and linked by plain relative links, because its permalinks (strategy, policy, diagnosis) are generic. The author's record engineering-strategy in grounded-engineering-executive has the same permalink as this page, so it is linked by a plain relative link too.\n- Chapter 14 is written in parallel; the policy on decision rights gives choices in shared areas to the Director of Platform after advice. Check that chapter 14's treatment of the broker request agrees.\n- The three-question test is the author's rewording of Larson's applicable and enforced and of Rumelt's choice; Larson's third property (creates leverage) is mentioned and not made a question, to match the journal spec's test.\n\n## Decision log\n\n- **2026-11-19** — Intent, acceptance criteria, thesis and role copied unchanged from the journal spec; supporting claims S1 to S7 are this spec's.\n- **2026-11-19** — Corvane's strategy is built through the three patterns (exploration and diagnosis, policies and test, launch and review) as one example read through one lens: does a written policy settle the fourth-broker request. Rejected: A separate worked example at the end, which would tell the case twice\n- **2026-11-19** — Anti-patterns are one paragraph inside the policies pattern, defined as failing the test. Rejected: A separate anti-patterns section\n- **2026-11-19** — The slogans used as examples differ from those in acceptance criterion AC-1's probe, so that the cold reader applies the test and does not recall an answer. Rejected: Using the probe's own statements in the chapter\n- **2026-11-19** — The outcome of the broker request (which broker, which instrument) is left to chapter 14; this chapter shows what the request becomes under the policies.\n- **2026-11-19** — Flow rubric (one fresh agent, once): sound with notes. Acted on: the give-back half of the Corvane exchange moved from p11 to a new paragraph p19b after the test table, so the constraint follows the policy that produces it; refinement assigned to the independent diagnoses and the test (p08); the third pattern's users and measure moved from p22 to p21; section flow declared for operate-and-review; the post-level reason extended. Not acted on: merging the failure paragraph p20 into p06 and p19 (the style guide wants the failure patterns named in a unit of their own); the note that p17's third question leans on enforcement, defined in p21 (mild). Rejected: Merging p20 into the test table's paragraph\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (ESCALATE; two failures on p19b, both at fault in the spec, one corroborated by both flow readers): local fix to the spec in auto mode, argument and section order unchanged. p19b carried two ideas and paid off the product-strategy section's deferred give-back in one sentence, for step 1 only. p19b now holds only what the rule does to the opening request; a new table paragraph p19c gives the constraint each policy returns to the product strategy, answering both questions of p11's table and both kinds of constraint of p10. p23's wording corrected so that the forum advises and the Director of Platform decides, as the decision-rights policy says. Rejected: Moving the give-back back into the product-strategy section, which the flow rubric had found to precede the policies that produce it\n- **2026-11-19** — After round 2 (REVISE; one corroborated flow failure on p19c, fault in the draft, eleven minor): the last permitted revision. p19c's table no longer rests on the term 'shared data model': parts data is said to be treated as a shared area, the table restates the two questions and the lead-in maps the three constraints to the two kinds of p10. The spec's evidence entry for p19c was aligned with the table; no controlling idea or order changed. No third round was run and no waiver recorded; the round-2 report is stale against this draft.\n\n## Sources\n\n- **Internal**\n  - _input/checklists/data/data.json (Engineering Strategy Basics, Exploration, Diagnosis, Refining, Policy Setting, Operations, Style Guide) — The five steps of Larson's Crafting Engineering Strategy, as the author's checklists name and summarize them.\n  - grounded-engineering-executive: engineering-strategy; tech-strategy: strategy, diagnosis, policy, operate — The author's own practice: writing it personally, the quality bar for policies, separate diagnosis, policy and operating-model records, exception register and review rhythm.\n  - posts/10-vision-and-product-strategy/index.md — Corvane's product strategy steps and what they need to be true first.\n  - _research/scenario-ledger.md — Corvane in 2026: size, cast, teams, four ways of deploying, three brokers, two identity libraries, the 2024 release path, the roadmap's shares.\n  - journal-spec.json, entry engineering-strategy — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Will Larson, The Engineering Executive's Primer (2024); author's notes, _input/bookshelf/docs/notes/engineering-executive.pdf — Definition of an engineering strategy; diagnosis, guiding policies, coherent actions; the three policy areas; applicable, enforced, creates leverage; writing it yourself, working group, launch and two-month review; implicit strategy (Uber 2014); standardize or explore rule of thumb.\n  - Richard Rumelt, Good Strategy Bad Strategy (2011); author's notes, _input/bookshelf/docs/notes/good-strategy-bad-strategy.pdf — The kernel; what a diagnosis does; the four hallmarks of bad strategy; choice.\n\n## Changelog\n\n- **2026-11-19** — First version of the spec, written before any prose.\n- **2026-11-19** — Revised after the flow rubric (sound with notes): p11 narrowed to what engineering takes; p19 split into p19 (table) and p19b (what the rule does to the request and what it gives back); p08, p21, p22 and two flow rationales adjusted.\n- **2026-11-19** — After round 1 (ESCALATE, spec fault): p19b narrowed; p19c added (table of constraints returned to the product strategy); p11 and p23 controlling ideas adjusted. Draft units p04, p08, p11, p13, p15, p17, p18, p19b, p19c, p21, p22, p23 revised.\n- **2026-11-19** — After round 2 (REVISE): p19c's table evidence aligned with the revised draft table (question column added; 'shared data model' replaced). Draft units p08, p19c, p23 revised.\n"}]}]}</script>

                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
