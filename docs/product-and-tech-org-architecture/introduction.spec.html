<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written before any prose from the page's entry in journal-spec.json, the journal's opening (which this page carries), _research/style-guide.md, _research/scenario-ledger.md and PLAN.md. Intent (outcome and acceptance criteria) and role are copied unchanged from the journal spec. The journal spec gives a front-matter page no thesis of its own: the thesis and the seven supporting claims J1 to J7 here are the journal's, copied unchanged, because this page performs the journal's opening and states the journal's claim. They are the journal's claims, not claims this page argues in full; each section says which of them it states or prepares.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The book's claim and the three scarce capacities: attention, judgment and verification.\n- **Know:** The eleven parts in order and what each is for.\n- **Know:** The evidence labels (source, research finding, documented practice, author's experience, recommendation, illustration) and the three AI labels (proven, emerging, speculative).\n- **Know:** How the anchor books are used: Larson for engineering and organization, Build What Matters for product, and where other sources lead.\n- **Believe:** An organization can be designed like a system, and most of its failures are structural.\n- **Be able to:** Go from the decision in front of them to the chapter to start with.\n- **Be able to:** Tell a sourced claim from a recommendation and from an illustration when a chapter states one.\n\n**Audience:** The book's two readers on its first page: an executive (CTO, CPO, VP or Director of Engineering or Product) who must define, grow or restructure a product and tech organization, and an individual contributor or engineering manager who works inside one and wants to understand why it is shaped as it is. Neither has read anything of the book yet.\n\n**Already knows:**\n\n- How software is built and shipped by teams: sprints or continuous delivery, code review, on-call, roadmaps.\n- The common role names: engineer, product manager, designer, engineering manager, tech lead.\n- What an org chart, a reorganization, a hiring wave and a quarterly plan are, from having lived through them.\n\n**Does not yet know:**\n\n- The vocabulary of organization design used in the book: constraint, interface, decision right, cognitive load, team type, interaction mode, span and layer. The page defines the first three in a clause and gives the others only with a plain-words gloss.\n- Corvane, the fictional company the book follows.\n- The anchor books' models, and which claims about AI and organizations are established, emerging or speculation.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the book's argument and list the subjects of its parts in order. *Probe:* After reading only this page: what does this book argue, and what will its parts cover, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given a decision the routing table lists, the reader names the chapter to start with. *Probe:* You must decide whether to create a platform team. Using only this page: which chapter do you open first? | `custom` | cold_reader | major |\n| AC-3 | The page does not open with a definition of 'organization', a history of management, or a restatement of the title. | `no_weak_introduction_pattern` | rubric | major |\n\n## Thesis\n\n**Question:** How should a product and tech organization be designed, scaled and changed, by which disciplines, and what does AI do to the answers?\n\n> **Claim:** A product and tech organization should be architected with the two disciplines its own people already practise on their products. System design says what it is and what can be changed: a system whose behaviour is set by its team boundaries, interfaces, decision rights and incentives, built to place three scarce capacities — attention, judgment and verification — where the work needs them. Product thinking says how the changing is done: the organization has users and owes them outcomes, so its design is discovered, sequenced toward a vision and judged by outcome. A structure is therefore right only for the constraint it was built around, which growth moves at recognizable sizes and which AI moves at every size, because implementation effort was what kept attention the limit, and with it cheap the limit becomes judgment and verification and sizes, roles, ratios and cadences have to be derived again.\n\n**Disputed by:** The view that organizations succeed through people and culture, so that structure is a secondary, mostly political matter; the view that organization design is an executive prerogative, decided at the top and announced, to which product methods such as discovery and outcome measures do not apply; and the view that AI is a productivity tool that speeds up the existing organization without changing its shape.\n\n**So what:** A leader who accepts the claim looks for the scarce capacity before reorganizing, hiring or buying tools; treats team and interface changes as architecture decisions with costs and expiry signals; runs each change as product work, with discovery before it and an outcome to judge it by; and re-examines inherited ratios instead of applying them.\n\n**How and why:** People respond rationally to the boundaries, interfaces and incentives around them, so behaviour follows structure (Conway, Meadows, Morieux and Tollman). Output is limited by one constraint at a time, so capacity added elsewhere only lengthens a queue. The inherited rules of thumb for team size, spans and planning were derived when implementation was the scarce step; where that is no longer true the derivation, not the rule, is what carries over. The same leaders who would not ship a product change without knowing its user and its outcome routinely ship reorganizations with neither; their view of distant parts of the organization is as bounded as anyone's, which is why discovery and outcome measures are needed there too.\n\n**Supporting claims**\n\n- **J1** — An organization's behaviour comes from its team boundaries, interfaces, decision rights and incentives, which can be designed, and not from its org chart or from individuals alone.\n- **J2** — Team boundaries, sizes and interaction modes must be set by the scarce capacity — attention first — so that no team owns more than it can understand and the cost of coordination stays below its value.\n- **J3** — The product operating model and the engineering operating model are two halves of one flow from vision to verified outcome, and they are joined by planning and explicit decision rights.\n- **J4** — Leadership structure, talent systems, metrics and culture are the control and feedback mechanisms of the design, and they work only when they are designed to fit it.\n- **J5** — Every structure expires: growth moves the constraint at recognizable stages, and changing the organization is a migration with its own risks.\n- **J6** — AI moves the constraint from producing to deciding and verifying, so team shape, roles, review capacity, governance and measurement must be derived again, with proven, emerging and speculative claims kept apart.\n- **J7** — An organization has users — the teams and people who work in it and the customers of each team — and owes them outcomes, so changes to it are run as product work: discovered before they are designed, sequenced toward a stated vision, and judged by the outcome they move.\n\n## Role in the part\n\nPerforms the journal's opening: states the claim, the reader, the route through the parts and the rules of evidence. Supports PF-1 of part `preface`.\n\n## Flow\n\n**Pattern:** `grouping` (also `prerequisite_order` in who to corvane: the readers, then the claim's two disciplines, then the capacities the disciplines serve, then the company in which the book shows them; `large_to_small` in parts to routing: the whole book in order, then one decision and its chapter; `prerequisite_order` in evidence to anchors: the kinds of statement, of which a source is one, then the sources that carry most of the book)\n\nThree groups, in the order of the three things the page's question asks. First what the book argues and to whom (who, disciplines, capacities, corvane): the reader is named first so that each can take the argument as addressed to them; the disciplines come before the capacities because the capacities are the fourth element of the system-design description; Corvane's own paragraph comes after the capacities because the reader has by then seen its hiring wave explained and can be told what the company is for. Second how the book is laid out (parts, routing): the order of the parts before the table that lets a reader leave that order. Third how to weigh what it says (evidence, anchors): the labels before the sources, because 'source' is one of the labels. Moving the layout ahead of the argument would give a list of parts whose terms had not been introduced; moving the evidence rules ahead of the layout would explain labels on chapters the reader had not yet been shown.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Corvane, a fictional 180-person software company, doubles its engineering headcount in eighteen months and ships less: lead time for a change goes from four days to nineteen, three product teams wait on one platform team for every launch, and nobody can say who decides whether a feature is ready.\n\n**Bridge:** The reader has lived through a hiring wave or a reorganization that did not deliver what was promised, and has heard it explained by the people involved: the new hires were slow, the managers were weak, the teams did not communicate. → The organization was a system with a constraint, and the change did not touch the constraint; who was in the roles mattered less than what the structure asked of them.\n\n**Thesis statement** (KEY POINTS callout (first and second bullets) and the third lead paragraph (p03)): A product and tech organization is a system you design, with the two disciplines its own people already practise on their products: system design says what the organization is and what can be changed, product thinking says whom it is for and how changing it is run, and both serve to place three scarce capacities, attention, judgment and verification, where the work needs them; a structure is right only for the constraint it was built around, which growth moves and AI moves.\n\n**Roadmap** (the fourth lead paragraph (p04), in the order of the sections; KEY POINTS third bullet):\n\n- Who the book is for, and how an executive and an individual contributor read it differently. *Kept in:* who.\n- The two disciplines the book applies: system design and product thinking. *Kept in:* disciplines.\n- The three scarce capacities, and what they explain about Corvane's hiring wave. *Kept in:* capacities.\n- The fictional company the book follows. *Kept in:* corvane.\n- The eleven parts in order, from foundations to AI. *Kept in:* parts.\n- A routing table from the decision in front of the reader to the chapters that answer it. *Kept in:* routing.\n- The labels the book puts on its evidence. *Kept in:* evidence.\n- How the anchor books are used. *Kept in:* anchors.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Corvane, a fictional software company of 180 people, went from 45 to 95 engineers in eighteen months and shipped less: lead time for a change went from 4 days to 19, three product teams waited on one platform team for every launch, and nobody could say who decided that a feature was ready. | scenario: Corvane's hiring wave, stage 3 of the ledger: 95 engineers from 45 in eighteen months; median lead time 4 days before and 19 after; three product teams wait on the platform team for every launch; nobody can say who decides a feature is ready. |  |\n| p02 | explanation | The reader has probably lived through a hiring wave or a reorganization that did not deliver and heard it explained by the people involved; the book's explanation is that the organization was a system with a constraint, and the change did not touch it. |  | `similarity`: Corvane's hiring wave, which added engineers and made delivery slower. → The reader's own experience of such a change, and the explanation the book will give for it. |\n| p03 | claim | The book's claim is that a product and tech organization is a system that can be designed with two disciplines its people already practise on their products, system design and product thinking, in order to place three scarce capacities, attention, judgment and verification, and that a structure is right only for the constraint it was built around, which growth and AI both move. |  | `elaboration`: An organization as a system with a constraint. → The whole claim: the two disciplines, the three capacities, and what moves the constraint. |\n| p04 | transition | This page says who the book is for, sets out the two disciplines and the three capacities, introduces Corvane, lays out the eleven parts, gives a table that routes a decision to its chapters, explains the labels on the book's evidence and says how its main sources are used. |  | `sequence`: The claim. → The order in which this page prepares the reader for the book. |\n\n## Sections\n\n### Who This Book Is For, and Two Ways to Read It\n\n**Controlling idea** (`description`, id `who`): The book is written for the executive who must design or change a product and tech organization and for the individual contributor who works inside one; it assumes they know how software teams work and not the vocabulary of organization design, and each of the two reads a chapter for something different.\n\n**Advances the thesis** (J1): Names the two readers the claim addresses: those who can change the designable elements, and those whose daily work the elements shape and who can explain an organization once they see them.\n\n**Transition in:** `elaboration`: The roadmap's first promise. → The two readers by role.\n\n**Order of paragraphs** (`prerequisite_order`): Who the readers are, then what is assumed of them, then how each of the two uses a chapter, then what neither should expect to find; the comparison needs the two readers named first, and the list of what is left out is read against what was promised.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | The first reader is the CTO, CPO, VP or Director of Engineering or Product who must define, grow or restructure an organization, and the second is the engineer, product manager, designer, data or platform specialist or engineering manager who works inside one and wants to know why it is shaped as it is. |  |  |\n| p06 | context | The book assumes the reader knows how software teams work and does not know the vocabulary of organization design, so each chapter defines a term in one plain clause where it first uses it and links the chapter that owns it. |  | `elaboration`: The two readers. → What the book assumes they know and how it supplies what they do not. |\n| p07 | comparison (table) | An executive reads a chapter for the decision and an individual contributor reads it for the explanation, and a table shows the question each brings, what each reads for, which sections of a chapter serve them most (named in plain words) and where to start. | table: Two columns, executive and individual contributor, by four rows: the question you bring; what you read for; the sections of a chapter that serve you most; where to start. | `contrast`: What both readers share. → How their readings differ. |\n| p08 | description | The book leaves out managing yourself as a leader, step-by-step people management, the technical architecture of AI systems, how to build a platform, and organization design outside product and technology. |  | `contrast`: What the two readers get from the book. → What neither will find in it. |\n\n### Two Disciplines: System Design and Product Thinking\n\n**Controlling idea** (`explanation`, id `disciplines`): The book applies two disciplines to the organization itself: system design, which says what the organization is and what a leader can change in it, and product thinking, which says whom it is for and how the work of changing it is run.\n\n**Advances the thesis** (J1, J7): States the journal's claims that behaviour comes from designable boundaries, interfaces, decision rights and incentives (J1) and that changes to an organization are run as product work for its users (J7).\n\n**Transition in:** `sequence`: The two readers and what the book assumes of them. → The first part of the claim: the two disciplines.\n\n**Order of paragraphs** (`prerequisite_order`): The claim that failures are structural comes first because it is what makes a design discipline applicable at all; system design comes before product thinking because the reader must know what can be changed before asking how changing it should be run; the table sets the two side by side only after each has been explained; and Corvane is read with both last, because the reading uses both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | claim | Most organizational failures are structural, a boundary in the wrong place, an interface nobody owns, a decision made far from its information or a structure kept after its constraint moved, which is disputed by the view that organizations succeed or fail through people and culture. | source: Morieux and Tollman, Six Simple Rules (2014): behaviour in organizations is a rational response to goals, resources and constraints. As used in chapter 1. |  |\n| p10 | explanation | System design says what the organization is and what can be changed: it is described by teams as components, contracts and rituals as interfaces, work, information and decisions as flows and three capacities that run out, and a leader can redesign four things, boundaries, interfaces, decision rights and incentives. |  | `elaboration`: Failures that are structural. → The discipline that describes the structure and what can be changed in it. |\n| p11 | explanation | Product thinking says whom the organization is for and how changing it is run: it has users and owes them outcomes, so a change is discovered before it is designed, given a stated outcome, placed on a roadmap toward a vision of the organization, tried as the smallest change that tests the diagnosis and judged by the outcome it moves. |  | `additional_support`: What can be changed. → For whom, and how the changing is run. |\n| p12 | comparison (table) | The two disciplines answer different questions and neither replaces the other, as a table of the question each answers, what it gives a leader and the mistake it prevents shows. | table: Two rows, system design and product thinking, by three columns: the question it answers; what it gives you; the mistake it prevents (changing what is not the cause; shipping a change nobody can judge). | `contrast`: Each discipline on its own. → The two side by side. |\n| p13 | example | Read with both disciplines, Corvane's hiring wave changed the number of people and almost none of the structure, and it was carried out with no discovery and no stated outcome, so that when the board asked in 2024 whether it had worked nobody could answer. | scenario: The 2022 plan was to hire to 95 engineers and form eleven product teams and a platform team of five; the teams were formed in 2023 by dividing people evenly; no outcome was stated; in 2024 the board asked whether the reorganization had worked and the leadership team could not answer. | `example`: The two disciplines and the mistake each prevents. → Both mistakes in the opening case. |\n\n### Three Scarce Capacities: Attention, Judgment and Verification\n\n**Controlling idea** (`explanation`, id `capacities`): An organization's design exists to place three capacities that run out, attention, judgment and verification; one of them is the constraint at any time, growth and AI move it, and a structure is right only for the constraint it was built around.\n\n**Advances the thesis** (J2, J5, J6): Defines the capacities that set boundaries and sizes (J2), says that growth moves the constraint so every structure expires (J5), and states the claim that AI moves it from producing to deciding and verifying, with its label (J6).\n\n**Transition in:** `elaboration`: The capacities that the system-design description named as its fourth element. → What the three capacities are and why the design is built around them.\n\n**Order of paragraphs** (`prerequisite_order`): The three definitions come first because everything after uses them; Corvane's slowdown is then explained with them, which pays off the opening puzzle; the general rule that the constraint moves with growth is drawn from that one case; and the claim about AI comes last because it is the same rule applied to a second force and is the least certain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition (list) | Three capacities run out in an organization: attention, how much a team can hold in mind well enough to change it safely; judgment, deciding with the relevant information at hand; and verification, knowing that what was built is correct and was worth building. | source: The one-clause definitions of the three capacities in chapter 1 of this book; the full treatment is in the chapter on flow and the constraint. |  |\n| p15 | example | The capacities explain Corvane's slowdown: about two of the nineteen days went into writing a change and the rest into waiting for a platform engineer to check and release it, so verification was the constraint, and every engineer hired to write changes lengthened that queue. | scenario: Of the 19 days of lead time about two went into writing the change and about 17 into waiting for a launch slot at the platform team: five engineers serving eleven product teams, 14 open launch requests at the peak, each launch a readiness check by hand. In 2024 the hand check was replaced by automated readiness checks a product team runs on its own change; nobody was added to the platform team; company-wide median lead time fell from 19 days to under 7 in three quarters. | `example`: The three capacities. → The opening puzzle, explained by the one that had run out. |\n| p16 | claim | A structure is built around whichever capacity is scarce when it is built, growth changes which one that is at recognizable sizes near 10, 50, 150, 500 and 1,000 people, and so every structure has an expiry signal. |  | `cause_effect`: One company, one moment, one capacity that had run out. → The general rule: the constraint moves as the organization grows, and the structure built for the old one stays. |\n| p17 | claim | AI moves the constraint at every size, because cheap implementation shifts the limit from attention toward judgment and verification, so inherited rules for team size, spans and planning cadence have to be derived again; the book marks the claim as a whole Speculative, meaning reasoning about what may follow and not yet a measured result, and says what would confirm it. |  | `additional_support`: Growth as the force that moves the constraint. → AI as a second force that moves it, and how sure the book is of that. |\n\n### Corvane, the Company the Book Follows\n\n**Controlling idea** (`description`, id `corvane`): Corvane is fictional: one invented company followed from 12 to about 1,100 people in five stages, so that each structure is seen working and then expiring, with every number an illustration.\n\n**Advances the thesis** (J5): Introduces the running example through which the book shows each structure being right for one constraint and wrong once growth has moved it.\n\n**Transition in:** `example`: Structures that expire as the constraint moves. → The one company in which the book shows this at five sizes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Corvane is a fictional maker of scheduling software for field-service companies, followed from 12 people in 2018 to about 1,100 in 2028 in five stages; every figure about it is an illustration kept consistent across chapters, and its page gives the stages, the people and the named incidents. | scenario: Corvane makes scheduling and dispatch software for field-service companies; five stages at 12, 50, 180, 500 and about 1,100 people, 2018 to 2028; the hiring wave is the third stage. |  |\n\n### Eleven Parts in One Order\n\n**Controlling idea** (`description`, id `parts`): The book has a four-page preface, eleven parts and a reference section; the parts run in the order in which each supplies what the next needs, from the idea of a system to what AI does to its assumptions, and every chapter has the same shape.\n\n**Advances the thesis** (J1, J2, J3, J4, J5, J6, J7): Shows where each of the journal's seven supporting claims is argued: Part I (J1, J7), Parts I and II (J2), Parts III, IV and VI (J3), Parts V to IX (J4), Part X (J5) and Part XI (J6).\n\n**Transition in:** `sequence`: The claim, its terms and its running example. → How the book is laid out to argue the claim.\n\n**Order of paragraphs** (`large_to_small`): The whole layout first (preface, parts, reference), then the reason for the order of the parts, then the parts one by one, then the inside of a single chapter; the reader gets the reason for the order before the list so that the list reads as a sequence and not as a table of contents.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | description | The book has three layers: a preface of four pages (this introduction, a short account of how organizations got complicated, the twelve failure patterns and Corvane), eleven parts with forty-one chapters, and a reference section with a toolkit, a glossary and a bibliography. |  |  |\n| p20 | explanation | The parts are ordered so that each supplies the vocabulary and the decisions the next one needs: Parts I to V build the design from one idea to the leadership over all teams, Parts VI to IX are the four mechanisms that keep the design true, and Parts X and XI are the two forces that move the constraint, growth first because its stages are the baseline AI is compared against. |  | `elaboration`: Eleven parts. → Why they come in this order. |\n| p21 | description (list) | The eleven parts in order, each with the question it answers and the chapters it holds: foundations, topology, product, engineering, leadership, alignment, talent, health, culture, evolution and AI. | source: The thesis and chapter list of each part in journal-spec.json (Parts I to IX in full, Parts X and XI at outline) and PLAN.md section 5. | `elaboration`: The reason for the order. → The parts one by one. |\n| p22 | description | Every chapter has the same shape: it opens with the problem as it shows at Corvane, gives the model with its terms defined, gives patterns that each name their user and their outcome measure, says how they fail and what they trade off, and ends with a section on what AI changes, a three-tier take-away and a checklist. |  | `elaboration`: The parts and their chapters. → The inside of one chapter. |\n\n### Start From the Decision in Front of You\n\n**Controlling idea** (`recommendation`, id `routing`): A reader with a decision to make can enter the book at the chapter that answers it: a table routes fifteen common decisions to the chapter to open first and to its prerequisite or follow-up, and a decision the table does not list is routed by the designable element it concerns.\n\n**Advances the thesis** (J1, J3, J4): Applies the claim as a reading method: a decision is located in a boundary, an interface, a decision right or an incentive (J1), and the table spans the operating models (J3) and the control mechanisms (J4).\n\n**Transition in:** `contrast`: Reading the parts in order. → Entering from one decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | recommendation (table) | A table lists fifteen decisions a leader faces, and for each the chapter to open first and the chapter to read before or after it; the decision whether to create a platform team, for example, starts at the team-types chapter, which decides whether one is justified, and continues to the platforms chapter. | table: Fifteen rows: decision; open first; prerequisite or follow-up. Rows cover a hiring wave that did not deliver, a team boundary, a platform team, team size and layers, two teams waiting on each other, a roadmap of promised features, what teams may decide, engineering strategy and technology sprawl, technical debt, executive roles, planning that takes too long, ladders and promotions, what to measure, whether to reorganize, and what AI changes. |  |\n| p24 | recommendation | For a decision the table does not list, name the element it concerns, a boundary, an interface, a decision right or an incentive, and start from the failure-patterns page, which sorts twelve recurring failures by those four elements and names the chapters for each. |  | `additional_support`: Decisions the table lists. → What to do with one it does not. |\n\n### How to Read the Evidence\n\n**Controlling idea** (`explanation`, id `evidence`): The book keeps apart six kinds of statement, puts one of three labels on every claim about AI and sorts each chapter's conclusions into three tiers, so that a reader can tell what is sourced, what is the author's judgement and what is illustration.\n\n**Advances the thesis** (J6): Explains the proven, emerging and speculative labels that J6 requires the book to keep apart, and the other labels a reader needs in order to weigh any claim in the book.\n\n**Transition in:** `sequence`: Where to find the answer to a decision. → How far to trust what the chapter says.\n\n**Order of paragraphs** (`grouping`): Three sets of labels, each for a different thing: the kind of each statement, shown once in a worked example; the certainty of a claim about AI; and the standing of a chapter's conclusions. The six kinds come first because they apply to every sentence and the other two apply only to some; the paragraph that tells the three sets apart must follow all three; and the paragraph on dates and revision comes last because it applies to every labelled statement.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | definition (table) | Every statement in the book is one of six kinds, a source, a research finding, a documented practice, the author's experience, a recommendation or an illustration, and the wording shows which, as a table of the six with how each is recognized sets out; where the evidence runs out the book says so. | table: Six rows: kind; what it is; how you recognize it in the text. Source (a book or paper named with its concept); research finding (a study with its year and what it measured); documented practice (what a named company published about itself, with the year); author's experience (marked as such, no employers named); recommendation (first person, with reasons and the conditions under which it does not hold); illustration (Corvane or any invented number). |  |\n| p26 | example | Three sentences about team size show the difference: Larson's six to eight engineers per manager is a source, the author's advice to derive the number again is a recommendation, and Corvane's eleven teams of about eight are an illustration. | example: (a) Larson's rule of thumb in An Elegant Puzzle of six to eight engineers per manager; (b) 'I recommend deriving team size from load, on-call and coordination cost'; (c) 'Corvane formed eleven product teams of about eight'. | `example`: The six kinds. → Three of them in sentences a chapter could contain. |\n| p27 | definition (list) | Claims about AI, and only those, carry one of three labels: Proven, measured and published with a citation; Emerging, practised and reported by some organizations or observed by the author; Speculative, reasoning about what may follow, with what would confirm it; the claim that AI moves the constraint, met earlier on the page, is the example. |  | `additional_support`: The six kinds of statement. → A second set of labels, only for claims about AI. |\n| p28 | comparison | The three tiers under What to Take Away, Established, Depends on context and The author's synthesis, sort a chapter's conclusions and are a different set from the AI labels: the six kinds classify a sentence, the AI labels grade one claim about AI, and the tiers say how far a chapter's conclusions travel. |  | `contrast`: Labels on single claims. → Tiers on a chapter's conclusions, and how the three sets differ. |\n| p29 | context | The text is current only as of a date and it changes: anything that can change is dated, and the book is a living one, revised as the author learns and written with AI assistance under the author's direction. | fact: config.yaml: the journal is a living journal and work in progress; ai_credit: AI-assisted, written with Claude Code. | `additional_support`: The labels. → What qualifies all of them: the date of each claim and the fact that the text is revised. |\n\n### How the Anchor Books Are Used\n\n**Controlling idea** (`explanation`, id `anchors`): The book is anchored on Will Larson's two books for engineering and organization and on Build What Matters for product, follows Team Topologies and the author's Grounded Architecture as further leads, takes a position where the anchors meet, and links to the author's working records for checklists.\n\n**Advances the thesis** (J3, J4): Shows that the product and engineering operating models come from different sources that meet in planning and decision rights (J3) and in measurement (J4), which is where the book has to join them.\n\n**Transition in:** `elaboration`: Sources as one of the six kinds of statement. → Which sources carry most of the book, and how they are used.\n\n**Order of paragraphs** (`prerequisite_order`): The anchors and the further leads are named before the places where the anchors meet, because the table of meeting points compares two sources the reader must already have been given; the working records come last because they are defined by contrast with what the book adds: placed first, they would read as the book's sources and not as its companions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | explanation | An anchor is the source a chapter starts from: Larson's An Elegant Puzzle and The Engineering Executive's Primer anchor the chapters on engineering and organization, and Foster and Nerlikar's Build What Matters anchors the chapters on product and, as the author's extension, the idea of running organizational change as product work. | source: Will Larson, An Elegant Puzzle (2019): team sizing, team states, organizational design, migrations, reorganizations, careers. Will Larson, The Engineering Executive's Primer (2024): engineering strategy, planning, measurement, values, executive roles. Ben Foster and Rajesh Nerlikar, Build What Matters (2020): vision-led product management, key outcomes, product strategy, the balanced roadmap. |  |\n| p31 | description | Two further leads carry specific subjects, Team Topologies for team types, interaction modes and cognitive load and the author's own Grounded Architecture for technical governance, and other sources are named in the chapters that use them and collected in the bibliography. | source: Matthew Skelton and Manuel Pais, Team Topologies (2019; 2nd ed. 2025): team types, interaction modes, cognitive load. Željko Obrenović, Grounded Architecture: governance by nudges, taxes and mandates, the architecture operating model, lightweight analytics. | `additional_support`: The three anchors. → The further leads, and where other sources are named. |\n| p32 | comparison (table) | The anchors were written separately about engineering and about product, and they meet in three places, planning, decision rights and metrics, where the book states the tension and takes a position, as a table of the three with the chapter that resolves each shows. | table: Three rows: where they meet; what Larson gives; what Build What Matters gives; resolved in. Planning: how much capacity goes where / what the capacity is for (chapter 23). Decision rights: how decisions are made and recorded / leaders own the problems, teams the solutions (chapters 12 and 22). Metrics: measures of the engineering organization by purpose / key customer and business outcomes (chapters 28 and 29). | `contrast`: Each source in its own subject. → The places where two of them address the same decision. |\n| p33 | description | The author's working records, the Grounded journals and the org-design decision records, each restate one source as a checklist; the book connects the sources and links to those records for working detail it does not repeat. |  | `additional_support`: What the book adds to its sources. → Where the per-source working detail lives. |\n\n## Conclusion: Where to Go Next\n\n**Synthesis:** Everything on the page is one habit seen from several sides: before changing an organization, ask which capacity is scarce and for whom the change is made; the parts, the routing table and the labels are ways of keeping that question honest.\n\n**So what:** A reader who takes the habit from this page alone already asks a different first question of the next hiring plan or reorganization: what is scarce, and how would we know the change worked.\n\n**Callback:** Corvane's hiring wave in the opening paragraph: engineers doubled, lead time from 4 days to 19. Corvane asked how many engineers to hire when the useful question was what had run out; the book ends with the same company in 2028 asking whether to hire engineers at all, and answers with the same question.\n\n**Takeaway** (`course_of_action`): With a decision in hand, go to the routing table and open the chapter it names; otherwise read on in order.\n\n**Hand-off** to [How Organizations Got Complicated: From Three People at One Table to a Thousand](how-organizations-got-complicated.html): `time`: The introduction's claim that an organization is a designed system with three scarce capacities. → How that system came to have so many parts: one structure added per limit reached.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis | The page's parts are one habit: before changing an organization, ask which capacity is scarce and for whom the change is made; Corvane asked how many engineers to hire when the question was what had run out, and the book ends with the same company in 2028 asking whether to hire at all. |  |  |\n| p35 | recommendation | A reader with a decision in hand should go to the routing table and open the chapter it names; a reader without one should read on in order. |  | `sequence`: The habit the book teaches. → The two ways to continue. |\n| p36 | transition | The next page goes back to the beginning: taking the claim that an organization is a designed system with three scarce capacities, it shows how that system came to have so many parts, one structure added each time a limit was reached. |  | `time`: The introduction's claim that an organization is a designed system with three scarce capacities. → How that system came to have so many parts: one structure added per limit reached. |\n\n## Non-goals\n\n- Arguing the claim: why behaviour follows structure, with its sources See [The Organization as a System That Can Be Architected](the-organization-as-a-system.html), [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- The full treatment of the three capacities and how to find the constraint See [Flow and the Constraint](flow-and-the-constraint.html).\n- The twelve failure patterns See [Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html).\n- Corvane's stages, cast and incidents in full See [Meet Corvane: One Company at Five Sizes](corvane-at-five-sizes.html).\n- How organizations came to have their structures See [How Organizations Got Complicated: From Three People at One Table to a Thousand](how-organizations-got-complicated.html).\n- The evidence on what AI changes See [[where-the-constraint-moves]], [[the-assumptions-ledger]].\n- A FAILURE PATTERNS callout, a 'What AI Changes Here' section, the three-tier take-away and a Checklist: this is a front-matter page\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The thesis and supporting claims are the journal's (J1 to J7); the author may prefer a thesis written for this page.\n- Parts X and XI are at outline in the journal spec; their lines in the parts list and their rows in the routing table should be revisited when those parts are specified.\n- The flow rubric suggested merging Corvane's one-paragraph section into the capacities section.\n\n## Decision log\n\n- **2026-11-19** — The post thesis is the journal's thesis with its seven supporting claims J1 to J7, by the lead session's instruction; the spec says they are the journal's. Rejected: A thesis written for this page alone, as on the Corvane page\n- **2026-11-19** — Section order follows the journal's opening roadmap (reader, disciplines, capacities, parts, routing table, evidence labels, anchors), with Corvane's paragraph placed after the capacities. PLAN.md and the preface roadmap list the claim before the reader; the claim is stated in the lead paragraphs, so both orders are served. Rejected: The argument sections before the reader section\n- **2026-11-19** — The platform-team row of the routing table names the platforms chapter as the one to open first and the team-types chapter as its prerequisite, as the page's acceptance criterion AC-2 expects, and says in the row that the team-types chapter decides whether a platform team is justified at all (the journal's decision log on chapters 6 and 15). Rejected: Team types as the chapter to open first\n- **2026-11-19** — The claim that AI moves the constraint is stated once, in the capacities section, with the label Speculative for the claim as a whole and a pointer to Part XI, where its measured, emerging and speculative parts are separated; the labels are explained two sections later and the paragraph says so. Rejected: Stating the AI claim unlabelled on the first page; Moving the evidence section ahead of the argument\n- **2026-11-19** — The living-book and AI-assistance note is one sentence in the last paragraph of the evidence section, not a section of its own. Rejected: A 'Living Journal' section as in the commerce book\n- **2026-11-19** — The page opens with KEY POINTS only, as a front-matter page; the conclusion is a 'Where to Go Next' section of three paragraphs with no tiers and no checklist.\n- **2026-11-19** — After the flow rubric (verdict: sound with notes): 'Speculative' is glossed in one clause where the AI claim is made (p17) and the AI-label paragraph (p27) points back to that claim as its example; the reader-comparison table (p07) names chapter sections in plain words; the citation rule for other sources was taken out of p31 and 'where the evidence runs out' moved to p25, so p29 holds one idea (the text is dated and revised); the anchors section's flow is declared as prerequisite order. Not acted on, for the author to decide: merging Corvane's one-paragraph section into the capacities section (kept separate because the lead session asked for one paragraph introducing Corvane and the roadmap promises it), and moving the living-book note out of the evidence section.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — Supersedes the earlier entry on the platform-team row: after AC-2's expected answer was corrected, the row names the team-types chapter as the one to open first (it decides whether a platform team is justified) and the platforms chapter as the follow-up. p23's controlling idea was changed to say the same. Rejected: Platforms as the chapter to open first\n- **2026-11-19** — The author's working records are linked as whole journals with relative links to their index pages, because the page refers to the journals and not to single records.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json: the journal's intent, thesis, flow, opening and closing; the introduction's entry; every part's thesis and chapter list; how-organizations-got-complicated (transition_in) — Intent, acceptance criteria and role, copied unchanged; the thesis and supporting claims; the hook; the part descriptions; the hand-off.\n  - PLAN.md sections 2 to 6 — The two disciplines in the author's words, the anchor codes, the chapters of Parts X and XI, where the sources meet.\n  - _research/style-guide.md — The six kinds of statement, the three AI labels, the three take-away tiers, the chapter format.\n  - _research/scenario-ledger.md, including its append log as of 2026-11-19 — Every Corvane fact on the page.\n  - posts/01 to 05, how-organizations-got-complicated, where-product-and-tech-organizations-go-wrong, corvane-at-five-sizes (index.md) — The definitions of the three capacities as the chapters give them; what the written pages rely on the introduction for.\n- **External**\n  - Will Larson, An Elegant Puzzle: Systems of Engineering Management (2019) — Named as anchor; the six-to-eight rule of thumb used as the example of a sourced claim.\n  - Will Larson, The Engineering Executive's Primer (2024) — Named as anchor.\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020) — Named as anchor.\n  - Matthew Skelton and Manuel Pais, Team Topologies (2019; 2nd ed. 2025) — Named as a further lead.\n  - Željko Obrenović, Grounded Architecture (grounded-architecture.io) — Named as a further lead.\n\n## Changelog\n\n- **2026-11-19** — p23's controlling idea brought in line with the corrected AC-2 (team-types first, then platforms) during the round-2 draft check; the routing-table row in the draft was changed to match.\n- **2026-11-19** — Introduction criterion AC-2's expected answer corrected: the decision 'whether to create a platform team' starts at team-types (which owns the justification) and continues to platforms-and-developer-experience, in line with the journal's own decision log.\n- **2026-11-19** — Revised after the flow rubric (p07, p17, p25, p27, p29, p31, anchors flow) and accepted in auto mode.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>

                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
