<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Larson's argument that migrations are the only scalable fix for technical debt, and his three phases: derisk, enable, finish.\n- **Know:** Why half-finished migrations are worse than none.\n- **Know:** How debt work is funded in planning.\n- **Believe:** An organization's ability to finish migrations sets how fast it can change its own decisions.\n- **Be able to:** Plan a migration in three phases with an owner and an end.\n- **Be able to:** Count the unfinished migrations in a landscape and decide which to finish, which to reverse.\n- **Be able to:** Argue for migration capacity in planning.\n\n**Audience:** Executives (CTO, VP Engineering, Director) who decide how debt work is funded and which migrations run, and engineers who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work: services, deployment, on-call, backlogs and quarterly planning.\n- From the Part IV introduction and chapters 13 to 16: an engineering strategy as policies, governance instruments from advice to mandate, the platform as a paved path run as a product, quality owned by the teams that ship.\n- The book's failure-pattern names and Corvane's story up to 2026.\n\n**Does not yet know:**\n\n- technical debt, local and shared\n- migration (the book's sense, as distinct from a data migration)\n- derisk, enable, finish\n- stop the bleeding\n- switch-off\n- migrations in flight\n- Larson's four team states (recalled in a clause)\n- operation share (recalled in a clause)\n- paved path and mandate (each recalled in a clause)\n- message broker and identity library (each defined in a clause)\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a stalled migration, the reader diagnoses the phase that was skipped and proposes how to finish. *Probe:* A migration to a new deployment system was announced a year ago. Six of fourteen teams have moved; the migration team has moved on; both systems are run. What went wrong and what would you do? | `custom` | cold_reader | major |\n| AC-2 | The chapter's closing synthesizes Part IV. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How does an organization retire technical debt at scale without stopping delivery?\n\n> **Claim:** An organization retires technical debt at scale by migrations, each run in three phases — derisk it on the hardest cases first, enable the rest with tooling that makes moving cheap, and finish it by moving the stragglers and switching the old system off — with a fixed share of capacity reserved for it in planning and a limit on the number of migrations in flight, so that delivery continues; without the last phase the organization runs two systems and has added debt.\n\n**Disputed by:** The view that technical debt is paid down by each team in its own backlog as it sees fit, or in periodic clean-up sprints.\n\n**So what:** A leader limits the number of migrations in flight, gives each an owner accountable for the last team, and treats an unfinished migration as an open cost.\n\n**How and why:** Debt that matters at scale is in what many teams share, which no single team's backlog can retire. A migration moves everyone; its cost falls as tooling improves and its benefit arrives only when the old way is gone, which is why the finish decides the return.\n\n**Supporting claims**\n\n- **S1** — Debt that matters at scale sits in what many teams share, which no single team's backlog can retire; a migration, which moves every team, is the remedy.\n- **S2** — A migration's costs arrive while it runs and its benefit only when the old way is switched off, so a half-finished migration is added debt, and the ability to finish sets how fast an organization can change its own decisions.\n- **S3** — A migration is run in three phases under one owner accountable for the last team: derisk it on the hardest cases, enable the rest with tooling that makes moving cheap, and finish it by moving the stragglers and switching the old system off.\n- **S4** — Delivery continues when migration capacity is a fixed share reserved in planning and the number of migrations in flight is limited.\n- **S5** — A leader treats every unfinished migration as an open cost: counts them, finds the phase each one skipped, and finishes, reverses or holds each.\n\n## Role in the part\n\nExplains how a landscape is changed once strategy, governance, platform and practice exist, and closes Part IV. Supports P4-5 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in why-shared-debt-needs-a-migration, half-finished, derisk-enable-finish, reserve-and-limit, count-and-decide: the migration is defined before its cost shape, the cost shape before the phases built to reach the finish, the phases before their funding, and all of these before the count that applies them to a whole landscape)\n\nThe reader first meets one company that finished a migration and then left three areas open, then learns why shared debt needs a migration and why stopping partway is worse than not starting, and only then the pattern that reaches the finish, its funding and limit, and the count that applies the diagnosis to every open move. The anti-patterns follow the patterns they negate, the worked example applies everything to the opening case, the AI section tests the phases, and the loop of Part IV comes last because it needs the migration to be understood. Putting the count before the phases would ask the reader to diagnose a skipped phase before knowing the phases. Funding and the limit come before the count because the count's owner, end date and the choice to wait all presuppose them.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 Corvane moved all eleven of its product teams onto a new release path in three quarters and closed the old launch-request form; at the end of 2026, with about thirty teams, it ran four ways of deploying, three message brokers and two identity libraries, and since 2024 not one of the older ways had been switched off.\n\n**Bridge:** Most readers have lived with a migration announced long ago, with both systems still running and the team that began it gone elsewhere. → The old way was never switched off; the question is how an organization retires what its teams share without stopping delivery.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): An organization retires technical debt at scale by migrations, each run in three phases — derisk it on the hardest cases first, enable the rest with tooling that makes moving cheap, and finish it by moving the stragglers and switching the old system off — with a fixed share of capacity reserved for it in planning and a limit on the number of migrations in flight, so that delivery continues; without the last phase the organization runs two systems and has added debt.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See the one migration Corvane finished and the three areas it did not. *Kept in:* one-finished-three-not.\n- Understand why shared debt needs a migration and why a half-finished one is worse than none. *Kept in:* why-shared-debt-needs-a-migration, half-finished.\n- Learn the three phases and the owner they need. *Kept in:* derisk-enable-finish.\n- Learn how migration capacity is reserved and the number in flight limited. *Kept in:* reserve-and-limit.\n- Learn to count unfinished migrations, find the phase each skipped and decide to finish, reverse or wait. *Kept in:* count-and-decide.\n- Recognize three ways migrations fail. *Kept in:* anti-patterns.\n- Follow Corvane's count at the end of 2026. *Kept in:* worked-example.\n- Know what AI changes. *Kept in:* what-ai-changes-here.\n- See Part IV as one loop. *Kept in:* part-iv-as-one-loop.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane finished one migration in 2024 in three quarters, and in 2026, with about thirty teams, it ran four ways of deploying, three brokers and two identity libraries, and not one of the older ways had been switched off since 2024. | scenario: Corvane, the fictional company this book follows. 2024, 180 people, eleven product teams: the release path replaces the launch request at the platform team; all eleven teams on it within three quarters; the launch-request form closed (new for the ledger). End of 2026, about 500 people, about thirty teams: four ways of deploying, three message brokers, two identity libraries; no move begun since 2024 has ended. |  |\n| p02 | claim | Following Larson's argument, an organization retires shared debt by migrations run in three phases, with capacity reserved in planning and a limit on the number in flight, and a migration that is not finished has added debt. |  | `problem_solution`: The landscape that is not yet as strategy, governance, platform and practice say it should be; one move finished and the others not. → The migration as the way to move the landscape, how one is finished, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: One Migration Finished, Three Areas Left Open\n\n**Controlling idea** (`example`, id `one-finished-three-not`): Corvane finished its 2024 move to the release path and then, as it grew to thirty teams, let three shared areas spread without moving anyone off the older ways, at a measurable cost.\n\n**Advances the thesis** (S2, S5): Gives the case the chapter explains: one finished migration and three open ones in the same company.\n\n**Transition in:** `elaboration`: The lead's short account of one finished move and three open areas. → The two periods in full and what the second one cost.\n\n**Order of paragraphs** (`chronological`): The finished move of 2024 comes first, then the two years in which the landscape spread, then what the spread cost by the end of 2026; the cost only reads as a cost of not finishing once both periods are known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2024 Corvane moved all eleven product teams from launch requests at the platform team to a release path each team runs itself, and closed the launch-request form three quarters after the pilot began. | scenario: Corvane 2024, 180 people. Dario Vance, VP Engineering; Lena Brandt, lead of the platform team (five engineers). Pilot with the Scheduling team for one quarter, one of the three teams that needed Platform for every launch (new for the ledger); the other ten teams over the following two quarters; median lead time 19 days to under 7; the launch-request form closed when the eleventh team moved (new). |  |\n| p04 | description | In 2025 and 2026 nineteen new teams brought three other ways of deploying, the brokers grew to three with the oldest never retired, and a second identity library appeared, and nobody was moving any team off an older way until the engineering strategy of mid-2026 made the platform team owner of the move to the release path. | scenario: Corvane 2025-2026, growing to about 500 people and about thirty teams. Nothing told a new team to use the 2024 release path (chapter 13's diagnosis). A message broker is the software that carries messages between services; an identity library is the shared code that checks who a user is. Two teams still on the oldest broker. | `time`: The finished move of 2024. → The two years after it, in which nothing was finished. |\n| p05 | evidence | By 2026 the open state had a price: the teams off the release path failed more than three times as often on release, the platform team supported one way of four, twelve of the nineteen newer teams were still off the path at the end of the year, and the new standard broker meant four brokers until the oldest was switched off. | scenario: Ledger, first half of 2026: change failure rate 6% for the eleven older teams against 21% for the nineteen newer; median time to restore 40 minutes against 5 hours; Platform's eight engineers support one way of the four; the 2026 broker decision leaves four brokers until the oldest is switched off; twelve teams still release in three other ways at the end of 2026. | `cause_effect`: Three areas with old ways still running. → What running them cost. |\n\n### Why Shared Debt Needs a Migration\n\n**Controlling idea** (`explanation`, id `why-shared-debt-needs-a-migration`): Technical debt inside one team's services can be repaid from that team's backlog, but debt in what many teams share can only be retired by moving every team, which is a migration.\n\n**Advances the thesis** (S1): Argues the first supporting claim, after granting the opposing view its ground.\n\n**Transition in:** `cause_effect`: Three shared areas with a weekly cost. → Why no team's own effort was ever going to remove that cost.\n\n**Order of paragraphs** (`prerequisite_order`): Debt and its two kinds are defined first, because Larson's argument is about the shared kind, and the migration is defined last because it is the answer his argument arrives at.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Technical debt is the cost of past choices that now slow change, and it comes in two kinds: local debt inside one team's own services, which that team's backlog can repay, and shared debt in what many teams use, which it cannot. | reasoning: The opposing view (each team pays debt down in its own backlog, or in clean-up sprints) is right for local debt. Martin Fowler's Refactoring is named only as the widely known book on improving code inside a team's own boundary. The local/shared distinction is the author's wording. |  |\n| p07 | evidence | Larson argues in An Elegant Puzzle that migrations are usually the only way to make real progress on technical debt as a company grows, because the cheap fixes are gone and what remains needs many teams. | source: Larson, An Elegant Puzzle: the section titled \"Migrations: the sole scalable fix to tech debt\"; tools and processes support about one order of magnitude of growth before becoming ineffective (his rule of thumb); little low-hanging fruit remains and most options require many teams working together.; quotation: \"Migrations matter because they are usually the only available avenue to make meaningful progress on technical debt.\" | `additional_support`: Shared debt that a team's backlog cannot repay. → Larson's argument for what can. |\n| p08 | definition | In this book a migration is the move of every user of a shared system from an old way to a new one, ending when the old way is switched off, and it trades contribution today for capacity later. | reasoning: The book's sense is distinguished from a data migration (a change to a database's structure, as in Corvane's readiness checks). Larson describes migrations as reduced immediate contribution in exchange for more capacity tomorrow. | `elaboration`: Larson's argument that migrations are the remedy. → What exactly counts as a migration, and what it trades. |\n\n### Why a Half-Finished Migration Is Worse Than None\n\n**Controlling idea** (`explanation`, id `half-finished`): The costs of a migration come while it runs and the benefit only at the switch-off, so stopping partway leaves the organization worse off than before, and the ability to finish is what lets it change its decisions.\n\n**Advances the thesis** (S2): Explains why the finish decides the return, which is the how-and-why of the thesis.\n\n**Transition in:** `cause_effect`: A migration as a trade of contribution today for capacity later. → When the capacity actually arrives, and what happens if the trade is stopped partway.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The three states are set side by side first, the stalled state is then read from the table, and the general consequence for changing decisions comes last because it depends on both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | comparison (table) | Before a migration the organization runs one system, during it two, and only after the switch-off one again, so every benefit that comes from retiring the old system arrives at the end. | table: Three columns (before, during, after the switch-off) by four rows: systems to operate and secure; what an engineer changing teams must learn; where a fix or a new check must be applied; what the teams have paid. The table is the author's arrangement. |  |\n| p10 | analysis | A migration that stalls partway is therefore added debt: the organization has paid most of the cost and keeps two systems. | source: The author's record systems-and-tools (grounded-engineering-executive), restating Larson: value arrives almost entirely at completion; \"the 80% migration graveyard\". The author's record rearchitecting-platforms (grounded-platforms), restating Fournier and Nowland's Platform Engineering: the separate v2 that never absorbs the old system leaves two platforms to operate.; scenario: Corvane 2026: each newer way of deploying was added beside the 2024 release path; the broker decision adds a fourth broker until the oldest is switched off. | `cause_effect`: A middle state that costs more than either end. → What stopping in the middle state means. |\n| p11 | claim | Because every changed decision about a shared system reaches the landscape only through a finished migration, an organization's ability to finish migrations sets how fast it can change its own decisions. | quotation: Larson names \"two managerial skills that have a disproportionate impact on your organization's success: making technical migrations cheap, and running clean reorganizations.\"; reasoning: Reorganizations as migrations of people are treated in chapter 33 (reorganizations). Building Evolutionary Architectures is named only as the widely known title on designing systems so that such change stays cheap. | `cause_effect`: A stalled migration as added debt. → What the ability to finish is worth to the organization. |\n\n### Pattern: Derisk, Enable, Finish\n\n**Controlling idea** (`process`, id `derisk-enable-finish`): A migration is run in Larson's three phases, derisk, enable and finish, under one owner who is accountable for the last team and the switch-off.\n\n**Advances the thesis** (S3): Sets out the three phases of the thesis with Corvane's finished migration as the running case.\n\n**Transition in:** `problem_solution`: The finish decides the return. → A way of running a migration that is built to reach the finish.\n\n**Order of paragraphs** (`chronological`): The phases are given in the order they are run; the owner comes last because what the owner is accountable for, the last team and the switch-off, is defined by the finish phase.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | process (figure) | Larson's playbook has three phases, each with its own question, and the pattern's users are the teams that must move and its outcome measure is the old system switched off by the planned date. | figure: Mermaid flowchart: Derisk (hardest cases first) -> Enable (tooling for the rest) -> Finish (move the stragglers) -> old system switched off; from each phase a failed gate leads to \"stop or reverse\".; quotation: Larson: \"there is a pretty standard playbook that works remarkably well: de-risk, enable, then finish.\" |  |\n| p13 | process | Derisking proves the new way on the hardest cases before anyone else is asked to move, because an easy first case gives false confidence. | source: Larson: de-risk as quickly and cheaply as possible; \"Don't start with the easiest migrations, which can lead to a false sense of security.\" The author's checklist of the chapter (systems-and-tools): a design document, tested with the teams likely to have the hardest move, embedding with one or two of them.; scenario: Corvane 2024: the pilot was the Scheduling team, one of the three that needed Platform for every launch; a platform engineer worked inside the team for six weeks; failure criterion: lead time still above 10 days after a quarter. | `sequence`: Three phases. → The first. |\n| p14 | process | Enabling makes the move cheap for every other team with tooling and documentation, and its measure is the effort one team needs to move. | source: Larson: build tooling to migrate \"the easy 90 percent\" programmatically; self-service tooling and documentation; \"The best migration tools are incremental and reversible\".; scenario: Corvane 2024: the platform engineer's hand check was replaced by automated readiness checks a team runs itself; each joining team got one platform engineer for at most six weeks. | `sequence`: A new way proven on a hard case. → Making the move cheap for the rest. |\n| p15 | process | Finishing means stopping new work from landing on the old way, pushing status to the teams and their managers, moving the last teams yourself, and switching the old system off. | source: Larson: the last phase is deprecating the legacy system, which requires 100 percent adoption; start by \"stopping the bleeding\"; push migration status to teams and to management; \"Your tool now is: finish it yourself.\"; scenario: Corvane: at the two-quarter review four teams were not yet on the path; they moved in the following quarter with a platform engineer each and the form was closed. In 2025-2026 nothing told the nineteen new teams to use the path. | `sequence`: Tooling that makes the move cheap. → The phase that reaches the last team. |\n| p16 | recommendation | The three phases need one owner, a team accountable for the last team moved and the switch-off, and recognition belongs to completion. | reasoning: The owner is normally the team that owns the new system. The author's checklist of Larson's chapter (systems-and-tools): reserve recognition for completion. User: the executive who sponsors the migration; outcome measure: every open migration has a named owner and an end date. Failure pattern: The Output Scoreboard judges the launch. | `additional_support`: A finish that someone has to carry out. → Who that someone is. |\n\n### Pattern: Reserve Capacity and Limit Migrations in Flight\n\n**Controlling idea** (`process`, id `reserve-and-limit`): Delivery continues through migrations when the moving teams' time is a fixed share reserved in planning and only a few migrations run at once.\n\n**Advances the thesis** (S4): Supplies the two planning instruments of the thesis: the reserved share and the limit.\n\n**Transition in:** `additional_support`: Phases and an owner. → The capacity the phases need, and where it comes from.\n\n**Order of paragraphs** (`prerequisite_order`): The two bills come first because the reserved share pays one of them; the limit comes last because it is what keeps the share from being spent on many half-done moves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | explanation | A migration has two bills, the owning team's work to build and finish it and the moving teams' work to move, and the second is usually the larger and is paid by people who did not choose the migration. | source: The author's record rearchitecting-platforms, restating Fournier and Nowland, Platform Engineering (2024): migration is usually the largest cost and is paid by the consumer teams; count every user group, their effort and the cost of running old and new together before committing. |  |\n| p18 | recommendation | The moving teams' bill is paid from a fixed share of capacity reserved in planning, because, of Larson's four team states (falling behind, treading water, repaying debt, innovating), a team repaying debt needs time. | source: Larson's four team states, An Elegant Puzzle: \"When the team is repaying debt, the system fix is to add time.\"; scenario: Corvane: at the 2024 review the Identity team, halfway through replacing its permission model, was given two more quarters without new roadmap commitments; the 2026 engineering strategy sends the operation share of every group's roadmap (25 percent) first to convergence. Full treatment of allocation in chapter 23 (planning). | `problem_solution`: A bill paid by the moving teams. → Where the capacity to pay it comes from. |\n| p19 | recommendation | A limit on migrations in flight, the author's application of Larson's remedy for a team that is treading water, keeps the reserved share from being spread over many half-done moves and lets delivery continue: no team is asked to move twice in one quarter, an owner finishes one migration before starting the next, and the migration that can be switched off soonest goes first. | reasoning: Larson's fix for a team that is treading water is to limit work in progress and finish more things; applying it to an organization's migrations is the author's extension. User: product teams and their directors; outcome measure: migrations in flight, and the reserved share actually spent on them. Where it does not hold: a security fault may force a move outside the limit. Order within the limit: the migration whose old system can be switched off soonest goes first, because the benefit arrives at the switch-off (the author's recommendation). | `additional_support`: A reserved share. → The limit that protects it. |\n\n### Pattern: Count the Unfinished, Then Finish, Reverse or Wait\n\n**Controlling idea** (`process`, id `count-and-decide`): A leader counts every old system still running as an open migration, finds the phase each one skipped, and decides for each whether to finish it, reverse it or hold it.\n\n**Advances the thesis** (S5): Turns \"an unfinished migration is an open cost\" into a count, a diagnosis and a decision.\n\n**Transition in:** `cause_effect`: A limit on migrations in flight. → The need to know how many are in flight already, including the ones nobody calls a migration.\n\n**Order of paragraphs** (`prerequisite_order`): The count comes first because diagnosis needs the list; the diagnosis comes before the decision because whether to finish or reverse depends on which phase was skipped.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | process | The count lists, for each shared area, every old system still running, with the teams left on it, its owner and its end date, and a missing owner or date is itself a finding. | reasoning: Counting by old systems still running (not by projects announced) is the author's recommendation. User: the VP Engineering or the director who plans capacity; outcome measure: the number of old systems still running, quarter by quarter. |  |\n| p21 | analysis (table) | A stalled migration is diagnosed by the phase it skipped: hard teams that cannot move point to derisking, teams that can move at weeks of cost each point to enabling, and a remainder left to itself points to an unowned finish. | table: Three rows: what you see; the phase that was skipped; what to do. (1) The easy teams moved and the hard ones found the new way does not fit them: derisk; go back to the hardest team and change the design or stop. (2) Every team can move but each move costs weeks and help is queued: enable; build the tooling before asking anyone else. (3) Most moved, the rest are left to move themselves, the owner has other work, new work still lands on the old way: finish; name an owner, stop new use, move the rest, set the switch-off date. The mapping of symptoms to Larson's phases is the author's. | `sequence`: A list of open migrations. → What stopped each one. |\n| p22 | comparison (table) | Each open migration is finished when the new way passed the hard cases and the remaining moves cost less than running two systems, reversed when it did not pass them or so few teams moved that moving them off is cheaper, and held when the limit is reached; running both systems with no decision is the only wrong answer. | table: Three rows: Finish (the new way works on the hard cases and the remaining moves cost less than keeping two systems); Reverse (the new way never passed the hard cases, or few have moved and moving them back is cheaper; the new system is switched off); Wait (worth doing but the limit is reached; stop new use of the old way now and start when another ends).; source: The author's records: systems-and-tools (\"Killing a bad one early is also finishing\"); rearchitecting-platforms (an annual review with a stop option, from Fournier and Nowland). | `sequence`: The skipped phase. → The decision that follows from it. |\n\n### Anti-Patterns: The Graveyard, the Clean-Up Sprint and the Announcement\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Migrations fail in three recognizable ways, each of which skips a phase or the funding: the graveyard of 80 percent migrations, the clean-up sprint for shared debt, and the migration by announcement.\n\n**Advances the thesis** (S1, S3): Lets the reader recognize the failures the patterns prevent, with the book's failure-pattern names.\n\n**Transition in:** `contrast`: What to do. → How it goes wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | analysis (table) | Three anti-patterns account for most failed migrations, and each maps to something the patterns supply. | table: Three rows: anti-pattern; what you see; what is missing; failure pattern. The 80 percent graveyard (the author's name in systems-and-tools): launched with fanfare, left when the interesting part ends; missing an owned finish; The Overloaded Team (the team that keeps both systems running). The clean-up sprint: every team spends a week on debt and the shared systems are untouched; missing a migration; The Output Scoreboard (debt work counted in tickets closed). The migration by announcement: a date and a mandate with no tooling and no owner; missing derisk and enable; The Platform Nobody Asked For. |  |\n\n### Worked Example: Corvane Counts Its Migrations\n\n**Controlling idea** (`example`, id `worked-example`): At the end of 2026 Corvane counted its open migrations, found that two of six had an owned finish with an end date and that one owner held five, and decided for each whether to finish, reverse or wait within a limit and a reserved share.\n\n**Advances the thesis** (S4, S5): Applies the count, the diagnosis, the decision and the limit to the landscape of the opening.\n\n**Transition in:** `example`: The patterns and their failures. → The patterns applied to Corvane's landscape.\n\n**Order of paragraphs** (`chronological`): The count is shown first, then what it showed, then the decisions, then their cost; the decisions cannot be judged before the count is seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | example (table) | At the end of 2026 Lena Brandt and Dario Vance listed every old system still running at Corvane, with its teams, owner and end date. | table: Corvane, end of 2026, about 500 people, about thirty teams (illustrative; rows partly new for the ledger). Deploying: copied deployment scripts, 7 teams, owner the platform team since mid-2026, no end date; the group pipeline (a hosted pipeline one product group began moving its teams to in 2025; its lead changed groups), 3 teams, owner the platform team since mid-2026, no date; hand-written scripts, 2 teams, owner the platform team, no date. Messaging: the oldest broker, 2 teams (Billing Integrations, Stock Integrations), owner the platform team, switch-off date in the decision record; the two other older brokers, teams not counted, owner the platform team, each with a date after the oldest (chapter 14's ledger line). Identity: the second library, 5 teams, a company rule with a date, each team to move itself. |  |\n| p25 | analysis | Read by whether the finish is owned and dated and by the phase each move skipped, the list of six rows had two rows, both in messaging, with an owner and a date, one owner named in five rows, a stalled migration with an unowned finish and a migration by announcement. | reasoning: Reading the table by the diagnosis of the previous section: the group pipeline is a half-finished migration of its own (finish unowned); the identity move is a migration by announcement (date without owner or tooling); the platform team owns the deploy moves and the broker move at once. | `cause_effect`: The list. → What the list showed. |\n| p26 | example | They decided, with the platform team finishing one migration before starting the next and the moving teams' weeks paid from the operation share, to finish the oldest broker and the deploy moves in the order in which a system can be switched off soonest, to reverse the group pipeline, to give the identity move to the Identity team, and to let the remaining brokers wait for their dates. | scenario: Decisions for the 2027 plan (new for the ledger): the platform team finishes one migration before it starts the next and no product team is moved twice in a quarter; first the oldest broker (two teams, date in the record), then the group pipeline's three teams, moved to the release path and the pipeline switched off (the reversal: its target is given up); then the hand-written scripts, then the copied scripts; the Identity team owns moving the five teams and removing the second library; the two other brokers wait for their dates, with new use stopped by the strategy's rule; moving teams' weeks come from the operation share. No results are claimed. | `sequence`: What the count showed. → What was decided. |\n| p27 | analysis | The plan has costs the count makes visible: each moving team ships little for about six weeks, Corvane runs four brokers until the switch-off, and the brokers that wait stay a cost on the list. | scenario: Ledger: each team that moved to the release path in 2026 shipped little for about six weeks; four brokers until the switch-off date. Planning these weeks against the roadmap is chapter 23's subject. | `contrast`: The decisions. → What they cost and leave open. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI lowers the cost of the enable phase and leaves the hard cases, the ownership and the switch-off where they were, while making new divergence cheaper to create.\n\n**Advances the thesis** (S3, S5): Tests the three phases against cheaper code change, with labeled claims.\n\n**Transition in:** `additional_support`: A plan whose largest cost is the moving teams' weeks. → What coding agents do to that cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence | Coding agents are being used for the mechanical part of migrations, the easy 90 percent of the enable phase, and one large company has reported that this reduces migration time. | source: Emerging: Nikolov and others, \"How is Google using AI for internal code migrations?\" (arXiv 2501.06972, January 2025; abstract page fetched and read 2026-11-19): an experience report on applying large language models to code migrations at Google; the authors report evidence that this reduces migration time significantly and lowers the barriers to starting and finishing migration programs; they state that it is an experience report with no comparison against other approaches. A gap source supplementing the author's bookshelf. |  |\n| p29 | analysis | If moving becomes cheap, the finish still depends on the hard cases, an owner and the decision to switch off, and cheaper change also makes new old ways cheaper to create, so the count matters more. | reasoning: Speculative. Illustration: Corvane 2027-2028, fourteen teams had each chosen their own coding agent, model provider and prompt conventions. Confirmed if organizations that use agents for migrations report shorter enable phases and an unchanged number of old systems still running. Link: agentic-delivery. | `contrast`: What agents make cheaper. → What they leave unchanged and what they make worse. |\n\n### Part IV as One Loop\n\n**Controlling idea** (`synthesis`, id `part-iv-as-one-loop`): The five chapters of Part IV are one loop, policy, instrument, platform, checks and migration, and Corvane's landscape is what the loop looks like with parts missing.\n\n**Advances the thesis** (S2, S5): Places the migration as the step that closes the loop of Part IV, which is the chapter's role in the part.\n\n**Transition in:** `conclusion_summary`: The migration, with and without AI. → The place of the migration among the four other parts of the engineering model.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | synthesis (figure) | Strategy, governance, platform, quality and migration form one loop: a policy decides, an instrument applies it, a platform makes the decided way the easy way, the teams' own checks keep it true, and a migration moves the rest of the landscape when the policy changes, which is why the ability to finish sets how fast decisions can change. | figure: Mermaid flowchart, five nodes in a cycle: Policy decides (chapter 13) -> Instrument applies it (14) -> Platform makes it the easy way (15) -> Teams' checks keep it true (16) -> Migration moves the landscape (17) -> back to Policy, edge \"what running it teaches\". |  |\n| p31 | analysis | Read through the loop, Corvane's four ways of deploying are a missing policy, a missing paved path and three unfinished migrations, each choice reasonable when it was made. | scenario: Corvane 2026: nothing told a new team to use the release path (no policy, chapter 13); the path was not offered to new teams in a form they could adopt in their first weeks (no paved path for them; a paved path is the supported default way); three other ways nobody was moving teams off. The landscape of reasonable local choices from the Part IV opening. | `example`: The loop. → Corvane's landscape read through it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Debt in what teams share is not repaid, it is moved away from: the phases, the owner, the reserved share, the limit and the count are five means to one end, the old system switched off, and that end is also what closes the loop of Part IV, because a changed policy reaches the landscape only through a finished migration.\n\n**So what:** A leader limits the number of migrations in flight, gives each an owner accountable for the last team, and treats an unfinished migration as an open cost; for Part IV, Corvane's four deployment paths are a missing policy, a missing paved path and three unfinished migrations.\n\n**Callback:** Corvane's one finished migration of 2024 and its 2026 landscape of four ways of deploying, three brokers and two identity libraries, which is also the opening of Part IV. The reader can now say why the 2024 move ended and the later ones did not, and reads the landscape of reasonable local choices as the loop with parts missing.\n\n**Takeaway** (`course_of_action`): Count the old systems still running in your landscape and give each an owner, an end date and a decision; and, for Part IV, list the three technical decisions most often made differently across your teams and for each write the policy, the instrument and the migration it implies.\n\n**Hand-off** to [Part V — LEADERSHIP: Roles, Spans and Layers](part-5.html): `cause_effect`: Two operating models that must be joined. → The leadership structure that joins them at each level.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | synthesis (list) | Established: Larson's argument that migrations are the scalable remedy for technical debt, his three phases, his finding that a team repaying debt needs time, and Fournier and Nowland's point that the moving teams pay the larger bill. |  |  |\n| p33 | synthesis (list) | Depends on context: the size of the reserved share, the limit on migrations in flight, and whether to finish or reverse depend on how many teams share the system, what running two costs, and how far the move has gone. |  | `contrast`: What the sources say. → What changes with the situation. |\n| p34 | synthesis (list) | The author's synthesis: the split into local and shared debt, counting by old systems still running, diagnosis by skipped phase, the limit as an application of Larson's work-in-progress fix, and the loop of Part IV. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p35 | recommendation (list) | Eight checks let the reader count and decide their own open migrations, and the last asks for the policy, instrument and migration behind the three most divergent technical decisions. |  | `sequence`: What to take away. → What to do with it. |\n| p36 | transition | Corvane's landscape was a set of unfinished moves, and with the engineering model complete beside the product model of Part III, the two must be joined, which is the work of the leadership structure in Part V. |  | `cause_effect`: Two operating models that must be joined. → The leadership structure that joins them at each level. |\n\n## Non-goals\n\n- How capacity is allocated across budget, roadmap and objectives, and how migration weeks are planned against the roadmap See [Planning](../grounded-engineering-executive/planning.html).\n- Reorganizations as migrations of people See [[reorganizations]].\n- Choosing the standard and the governance instrument for a shared area See [Engineering Strategy](engineering-strategy.html), [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- Building and funding the paved path See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- Agentic delivery and the verification pipeline See [[agentic-delivery]].\n- Refactoring techniques, evolutionary architecture methods and data migration techniques\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts introduced here: the Scheduling team was one of the three that needed Platform for every launch; the launch-request form was closed when the eleventh team moved; the split of the twelve teams off the release path at the end of 2026 (seven on copied scripts, three on a group pipeline begun in 2025 and stalled, two on hand-written scripts); five teams on the second identity library with a dated rule and no owner of the move; the decisions for the 2027 plan. The author should confirm them.\n- The chapter follows the ledger line of chapter 16 (twelve teams still off the release path at the end of 2026). Chapter 15's spec gives a different count (about fourteen); the lead session should reconcile the two.\n- The part closing's \"three unfinished migrations\" is read as the three other ways of deploying, each an old system nobody was moving teams off.\n- Chapter 14 gives the identity library a mandate with a date; this chapter reads a date without an owner or tooling as a migration by announcement and gives the move to the Identity team. The author may prefer a different owner.\n- The Google experience report (arXiv 2501.06972) is a gap source; only its abstract page was read, and the claim is labeled Emerging.\n- Refactoring and Building Evolutionary Architectures are named as widely known titles only, without claims.\n\n## Decision log\n\n- **2026-11-19** — Open with the contrast between the migration Corvane finished in 2024 and the three areas it left open by 2026, so that finishing is the puzzle. Rejected: Opening with the landscape alone, which the Part IV introduction and chapters 13 and 14 already use; Opening with Larson's claim\n- **2026-11-19** — Distinguish local from shared debt in the author's own words, to grant the opposing view its ground and to mark where Larson's argument applies. Rejected: Treating all technical debt as shared\n- **2026-11-19** — Carry the Part IV closing in a body section (Part IV as One Loop) placed directly before the conclusion, and recall it in the conclusion's synthesis list, checklist and closing paragraph. Rejected: A sixth conclusion unit; Putting the whole part synthesis into the closing paragraph\n- **2026-11-19** — Count migrations by old systems still running; in the worked example each row is checked against one idea only: is the finish owned and dated. Rejected: Counting one migration per shared area; Classifying rows by several lenses\n- **2026-11-19** — Planning of migration capacity is given as a reserved share and a limit only, with the allocation model left to chapter 23; reorganizations are linked to chapter 33 and not treated. Rejected: A section on planning cadences\n- **2026-11-19** — Label the AI claim about migrations Emerging on the basis of one company's published experience report, not Proven. Rejected: Proven, which would need a measured comparison\n- **2026-11-19** — Flow rubric (one run): sound with notes. Applied: the decision conditions are stated in p22's controlling idea; the ordering rule (switch-off soonest first) is introduced with the limit in p19, where the limit is also attributed to Larson's remedy; the worked example's summary says one of six rows had an owner and a date, and p25 and p26 name the diagnosis by skipped phase and the operation share; p30 calls back to p11; broker counts dated (three in 2026, four once the approved replacement runs beside the oldest). Not applied: splitting the anti-pattern table into three paragraphs (kept as one table for length); the author may ask for it.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — Draft check round 1 found one fault in the spec: p26 gave the platform team two finishes at a time against p19's rule that an owner finishes one migration before starting the next. Fixed locally: p26 now applies p19's rule (one at a time; the oldest broker, then the group pipeline). Also brought p24 to p26 into agreement with chapter 14's ledger line (the new broker is the one standard; the platform team owns all broker moves; the other two brokers have dates after the oldest), named Larson in the lead (p02), told the mid-2026 change in the scene (p04, p05) and named the four team states (p18). Rejected: Changing p19 to allow two finishes for a larger owner, which would add a condition the chapter does not argue\n\n## Sources\n\n- **Internal**\n  - grounded-engineering-executive/posts/systems-and-tools (index.md and checklist.md, section 6) — The author's summary and checklist of Larson's migration chapter: value at completion, the 80% migration graveyard, recognition for completion, killing a bad migration early.\n  - grounded-platforms/posts/rearchitecting-platforms — The author's summary of Fournier and Nowland, Platform Engineering (2024), 'Rearchitecting Platforms': migration cost paid by consumer teams, the v2 island, the annual review with a stop option.\n  - _input/checklists/data/data.json (Systems & Tools; Rearchitecting Platforms) — The two checklists named as inputs in PLAN.md; their content is in the two records above.\n  - _research/scenario-ledger.md — Corvane's 2024 release path, the 2026 landscape, the engineering strategy, the broker decision and the 2026 figures; this chapter appends the count of open migrations and the 2027 decisions.\n- **External**\n  - Will Larson, An Elegant Puzzle: Systems of Engineering Management (2019); author's Kindle notes, _input/bookshelf/docs/notes/elegant-puzzle.pdf — Migrations as the sole scalable fix to technical debt; derisk, enable, finish; the two managerial skills; the four team states.\n  - Stoyan Nikolov and others, 'How is Google using AI for internal code migrations?', arXiv 2501.06972, 12 January 2025 (abstract page fetched and read 2026-11-19; a gap source) — A reported practice of using language models for code migrations at one company.\n\n## Changelog\n\n- **2026-11-19** — Spec created from the journal-spec entry.\n- **2026-11-19** — Flow-rubric notes applied (p01, p05, p19, p22, p25, p26, p30 reworded; worked-example summary; flow rationale); the failure pattern for celebrating launches set to The Output Scoreboard; status set to accepted in auto mode.\n- **2026-11-19** — After draft check round 1: p26 limit corrected to agree with p19 (spec fault); p01, p02, p04, p05, p18, p24, p25, p26 and the worked-example summary reworded; hook reworded.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
