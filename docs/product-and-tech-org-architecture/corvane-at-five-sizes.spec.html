<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written before any prose from the page's entry in journal-spec.json and from _research/scenario-ledger.md. Intent, acceptance criteria and role are copied unchanged from the journal spec. The journal spec gives a front-matter page no thesis, so the thesis here was written for this spec; its agreement with the journal spec was not checked by the journal-spec process, and it was written to argue the Preface's supporting claim PF-3.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Corvane is fictional: a field-service scheduling software company followed from 12 to about 1,100 people.\n- **Know:** Its five stages, with the structure, the constraint and the named incident of each.\n- **Know:** The cast of roles the chapters refer to.\n- **Be able to:** Place a Corvane incident on the timeline when a later chapter cites it by name.\n- **Be able to:** Say which failure pattern each incident is an instance of.\n\n**Audience:** The book's two readers, an executive who must design or change a product and tech organization and an individual contributor who works inside one, arriving from the failure-patterns page or landing here from a later chapter that cited a Corvane stage or incident by name.\n\n**Already knows:**\n\n- How software teams work: releases, code review, on-call, roadmaps, planning.\n- The twelve failure-pattern names and their four families, from the previous page, at the level of a name and a one-line meaning.\n- The book's claim that an organization is a designed system with three scarce capacities, from the introduction.\n\n**Does not yet know:**\n\n- Anything about Corvane beyond the hiring-wave figures the introduction opened with.\n- Field-service scheduling as a business.\n- The organization-design vocabulary Part I introduces (component, interface, constraint, cognitive load, fracture plane, team state); the page does not rely on it.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page can list Corvane's five stages in order with the approximate headcount and the main incident of each. *Probe:* Using only this page: list Corvane's five stages, the rough headcount at each, and one thing that broke. | `custom` | cold_reader | major |\n| AC-2 | The page states in its first paragraph that Corvane is fictional, and no figure on it is presented as data about a real company. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** Which company do the book's examples come from, and what happens to it as it grows?\n\n> **Claim:** The book's examples come from Corvane, a fictional field-service scheduling software company followed from 12 to about 1,100 people in five stages. At each stage its structure was a reasonable answer to the problem in front of the company when it was built, and its named incidents happened where growth had since made a different capacity scarce and the structure had stayed as it was, so each incident is an instance of a failure pattern and none of them needed a careless person.\n\n**Disputed by:** The view that a growing company's troubles are growing pains: particular to its people and its moment, to be expected, and explained well enough by who was in charge when they happened.\n\n**So what:** A reader who accepts this reads every Corvane scene in a later chapter by asking what the structure was built for and what had become scarce since, and can place the scene on one timeline instead of meeting it as an anecdote.\n\n**How and why:** Growth changes which of attention, judgment and verification runs out first, while the structure built around the earlier shortage stays in place; what the old structure then produces is a queue, a duplicate or a decision made without its information, whoever holds the roles. One invented company with fixed facts shows the same thing happening five times.\n\n**Supporting claims**\n\n- **S1** — Corvane is fictional and makes one product whose parts are built by different teams and must agree with each other, so a gap between teams reaches customers as a visible fault.\n- **S2** — In each of five stages, from 12 to about 1,100 people, the structure answered the problem in front of the company when it was built, and the stage's named incident came where growth had made a different capacity scarce and the structure had stayed.\n- **S3** — The same small cast of roles is present through the stages, and no incident is explained by the failing of one of them.\n- **S4** — Each named incident is an instance of one of the twelve failure patterns, and between them the cases touch all four families, the incentives family only as a risk.\n- **S5** — Because the stages, people and incidents are fixed in one record, a later chapter can cite any of them in a phrase and the reader can look it up here.\n\n## Role in the part\n\nIntroduces the running example and its timeline, so that later chapters can cite a stage or incident in one phrase. Supports PF-3 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in five-stages: the five stages in the order Corvane lived them, 2018 to 2028)\n\nEach section supplies what the next one refers to. The product comes first because every incident is a fault in that product or in the flow that ships it. The stages come before the cast because a role only means something at a size (a VP Engineering who joins in 2023 joins a company of a known shape). The cast comes before the incident table because the table is free of names only if the reader has already been told that the people are roles and not culprits. The incidents are mapped to patterns only after each has been told in its stage, so the table classifies things the reader has already met. The usage table is last because it is a lookup, used after reading and from later chapters. Putting the pattern table first would classify incidents not yet told; putting the usage table first would list chapters against names that mean nothing yet.\n\n## Introduction\n\n**Hook** (`direct_statement`): The previous page named twelve ways a product and tech organization fails. This page gives one company in which those failures happen in turn as it grows: Corvane, which is fictional.\n\n**Bridge:** The reader has just met twelve failure patterns as names with mechanisms, and has seen Corvane only as the puzzle in the introduction: a company that doubled its engineers and shipped less. → The page gives that company whole and once, an invented company with fixed facts, so that every later chapter can cite a stage or an incident in a phrase.\n\n**Thesis statement** (KEY POINTS callout (second bullet) and the second lead paragraph (p02)): At each of five sizes Corvane's structure was a reasonable answer to the problem in front of the company when it was built, and each named incident happened where growth had since made something else scarce and the structure had stayed; none of the incidents needed a careless person.\n\n**Roadmap** (the second lead paragraph (p02)):\n\n- The company and its product. *Kept in:* company.\n- The five stages, each with its size, its structure, what was scarce and what broke. *Kept in:* five-stages.\n- The people the chapters refer to. *Kept in:* cast.\n- Each incident matched to the failure pattern it is an instance of. *Kept in:* incidents.\n- A table of where the chapters use each stage and incident. *Kept in:* usage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous page named the failure patterns in general; this page gives the one company in which the book shows them, Corvane, which is fictional: every figure, name and incident is invented for the book and kept in one record that every chapter follows. | fact: Corvane is fictional; every figure is an illustration invented for the book, not data about any company. |  |\n| p02 | claim | At each of five sizes Corvane's structure answered the problem in front of the company when it was built and each incident came where growth had since made something else scarce and the structure had stayed, and the page shows this in five steps: the product, the five stages, the cast, the incidents matched to patterns, and where the chapters use them. |  | `elaboration`: An invented company with fixed facts. → What its story shows, and the order in which the page gives it. |\n\n## Sections\n\n### Corvane and Its Product\n\n**Controlling idea** (`description`, id `company`): Corvane makes one product in three parts that must agree with each other, which is why its organizational faults reach customers where they can be seen.\n\n**Advances the thesis** (S1): Describes the company and says why this product makes structural faults visible.\n\n**Transition in:** `elaboration`: The promise to give the company whole. → What the company makes and for whom.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Corvane, founded in Rotterdam in 2018, sells scheduling and dispatch software to field-service companies as an office application for planners, a mobile app for technicians and integrations with customers' billing and stock systems, paid per technician per month. | scenario: The company paragraph of the ledger: product, three parts, customers (heating, lifts, telecom installation), pricing, founding year and city. |  |\n| p04 | explanation | The product suits the book because one scheduling rule has to hold in all three parts, so when the teams that build the parts disagree, a planner and a technician see the disagreement the same day. | reasoning: A job assigned in the office application must appear on the technician's phone and later in the customer's billing export; a rule about overlapping jobs or job status that differs between parts shows up as two schedules or an unbilled job. | `cause_effect`: A product in three parts. → Why that makes gaps between teams visible to customers. |\n\n### Five Stages, 2018 to 2028\n\n**Controlling idea** (`description`, id `five-stages`): Corvane passes through five stages, from 12 to about 1,100 people, and in each the structure answers the problem of its moment and the named incident arrives where a different capacity has become scarce.\n\n**Advances the thesis** (S2): Tells each stage with its size, structure, scarce capacity and incident, then states what the five have in common.\n\n**Transition in:** `time`: The company and its product. → What happens to the company as it grows, stage by stage.\n\n**Order of paragraphs** (`chronological`): The stages are told in the order they happened because each stage's structure is the answer to the stage before it; the summary figure and table come first so the reader has the whole timeline before the detail, and the common shape is stated last because it is a claim about all five.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Each stage is read by which of three capacities is running short: attention (how much a team can hold in mind well enough to change it safely), judgment (deciding with the relevant information at hand) and verification (knowing that what was built is right). | source: The one-clause definitions of the three capacities used in chapter 1 of this book. |  |\n| p06 | description (figure) | The five stages run from one team of 12 people in 2018 to two business units of about 1,100 in 2028, and each ends in an incident Corvane's people gave a name. | figure: Mermaid flowchart, left to right: five nodes, one per stage, each with its name, years and whole-company headcount, joined by arrows. | `sequence`: The three capacities as the reading key. → The five stages at a glance, in a figure. |\n| p07 | description (table) | One table gives, for each stage, the years, the headcount, the structure, the scarce capacity and the named incidents. | table: The ledger's five-stage table: 12, 50, 180, 500 and 1,100 people; product and tech 8, 28, about 113, 260, 520; structure; scarce capacity; named incidents. | `elaboration`: The five stages in order. → The same stages with structure, scarce capacity and incident. |\n| p08 | example | Stage 1, One table (2018–2019, 12 people): one team with no managers works because everyone hears everything, and it fails in the Founder Queue, when every pricing, design and release decision waits for Tomas Rell, the co-founder and CTO, so that judgment is the capacity that runs out. | scenario: Stage 1 in the ledger: 12 people, 8 in product and tech, the two founders decide everything; the Founder Queue. | `time`: The table of five stages. → The first stage in detail. |\n| p09 | example | Stage 2, First teams (2020–2021, 50 people): four teams, two engineering managers and a first product manager take decisions off the founders, and attention runs out instead, which shows in the Two Calendars of 2021 and again in the Second Calendar of 2022. | scenario: Stage 2 and the append log: Web, Mobile, Integrations, Core; planners and technicians see different schedules for three weeks; the Mobile lead is replaced; eight months later a job marked complete on the phone stays open in billing exports for eleven days; the 2022 fix. | `cause_effect`: Decisions queuing at a founder. → The structure that relieved the queue and what it could no longer hold. |\n| p10 | example | Stage 3, The hiring wave (2022–2024, 180 people): to build more than 45 engineers can, Corvane more than doubles its engineers to 95 in eighteen months; two unnamed cases follow, the even split into eleven teams and forty-one promised features shipped while renewals fall, and then every change arrives more slowly, because finished changes wait at a platform team of five, the Launch Queue of 2024, where verification and the platform team's attention have run out; what the stage leaves open is who decides that a feature is ready. | statistic: Median lead time for a change 4 days before the wave and 19 after; of the 19 days about two went into writing the change; 14 open launch requests at the peak; five platform engineers for eleven teams; three teams needed Platform for every launch.; scenario: Forty-one features shipped in one year of the stage, each promised to a named customer, and the renewal rate fell; the eleven teams were formed in 2023 by dividing people evenly, with no outcome stated.; scenario: The 2024 change brief led by Dario Vance: a release path the Scheduling team could run without Platform; company-wide median lead time under 7 days three quarters later. | `time`: Four teams and a repaired rule. → The growth that followed and the queue it produced. |\n| p11 | example | Stage 4, Groups and plans (2025–2026, 500 people): four product groups with directors, a CPO, annual and quarterly planning, a career ladder and an architecture forum supply the deciding that eleven teams lacked (who says a feature is ready, which of four ways of deploying to keep), and judgment runs short again because decisions are now made far from their information, as the Nine-Week Plan and the Tuesday Reorg show. | scenario: In 2025 the eleven teams ran four ways of deploying, three message brokers and two identity libraries; after the launch queue was relieved the longest wait was for someone to say a feature was ready.; scenario: Stage 4 in the ledger: quarterly planning takes nine of the quarter's thirteen weeks; a reorganization is announced without a migration plan and two teams lose their on-call rotation. | `cause_effect`: Eleven teams with no one deciding across them. → The coordinating structures added and what they cost. |\n| p12 | example | Stage 5, Scale and AI (2027–2028, about 1,100 people): after acquiring Routewise, and with coding agents in every team, writing a change becomes cheap and checking it does not, which produces the Review Wall and then the Hiring Question. | statistic: Merged changes per week up 2.4 times from January 2027 to January 2028 with review capacity flat; median review wait from 5 hours to 31; the 2028 plan asks whether to hire engineers at all. | `time`: A company coordinated by groups and plans. → The acquisition, the agents and what ran short next. |\n| p13 | analysis | The five stages share one shape: each structure answered the problem in front of Corvane when it was built (the fifth change, coding agents, arrived from outside), and each then stayed in place while growth made a different capacity scarce in a place the structure was not built to watch. | reasoning: Problem answered, then where the shortage appeared: decisions waiting at a founder, answered by teams and managers, then the rules between teams; more to build than hands, answered by hiring, then the launch; nobody deciding across eleven teams, answered by groups and plans, then the distance between a decision and its facts; cheap writing from agents, then the review. | `conclusion_summary`: Five stages told one by one. → What they have in common. |\n\n### The Cast\n\n**Controlling idea** (`description`, id `cast`): Seven named people hold the roles the chapters refer to, they stay while the structure changes around them, and none of them is the cause of an incident.\n\n**Advances the thesis** (S3): Names the roles and says how the book uses people: as holders of positions in a structure, not as culprits.\n\n**Transition in:** `elaboration`: The stages, in which a few people were named in passing. → Everyone the chapters name, with role and dates.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description (table) | Seven people are named in the book, each with a role and the year it began. | table: The ledger's cast: Ines Okafor, Tomas Rell, Priya Nambiar, Dario Vance, Lena Brandt, Samir Haddad, Noor Achterberg, with roles and years, and one line each on where the chapters meet them. |  |\n| p15 | explanation | The cast are roles and not culprits: most of them are at Corvane through several stages, the incidents happen around them all the same, and the one person replaced for an incident, the Mobile lead of 2021, is left without a name because his successor met the same failure. | scenario: Tomas Rell and Samir Haddad are at Corvane from 2018 and 2019; the Mobile lead was replaced after the Two Calendars and eight months later Mobile and Integrations diverged in the same way. | `emphasis`: Seven names and roles. → How the book uses people in its examples. |\n| p16 | description | Teams are also referred to by name, and the names change with the stage: four teams in stage 2, eleven product teams and Platform from stage 3, and the Routewise teams and AI Enablement from stage 5. | scenario: The ledger's list of teams referred to by name. | `additional_support`: The people the chapters name. → The teams the chapters name. |\n\n### The Incidents and the Patterns Behind Them\n\n**Controlling idea** (`analysis`, id `incidents`): Each of Corvane's incidents is an instance of one of the twelve failure patterns, and between them the cases touch all four families.\n\n**Advances the thesis** (S4): Classifies the incidents already told by the pattern and the designable element behind each.\n\n**Transition in:** `example`: The stages and their incidents, and the previous page's twelve patterns. → Each incident as an instance of a pattern.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | context | The previous page sorted twelve failure patterns into four families, one for each thing a leader can design: boundaries, interfaces, decision rights and incentives; an incident is one of those patterns with a date and a size. | source: The twelve pattern names and four families as fixed by the failure-patterns page and the style guide. |  |\n| p18 | analysis (table) | Ten cases, the eight named incidents and two unnamed ones, each map to a primary pattern and through it to a designable element. | table: Founder Queue: the Escalation Ladder. Two Calendars and Second Calendar: the Unowned Interface. The even split of the hiring wave: the Org Chart as Architecture. Forty-one features: the Feature Factory. Launch Queue: the Overloaded Team. Nine-Week Plan: the Consensus Stall. Tuesday Reorg: the Reorg as Strategy. Review Wall: the Review Bottleneck. Hiring Question: a decision, with the Output Scoreboard as the pattern it risks. | `example`: Twelve patterns in four families. → Corvane's cases, each matched to one. |\n| p19 | analysis | The table gives one pattern per case although most incidents show more than one, it touches all four families (incentives only as a risk), and it leaves three patterns without a case of their own. | example: The Launch Queue is filed under the Overloaded Team and is also a queue for checks, which is the Review Bottleneck; Samir Haddad as the only engineer who understood both the scheduling engine and the mobile sync is a sign of the Hero Culture; the Platform Nobody Asked For, the Ladder as Checklist and the Hero Culture have no named incident. | `elaboration`: The mapping table. → What the table simplifies and what it leaves out. |\n\n### Where the Chapters Use Corvane\n\n**Controlling idea** (`description`, id `usage`): Each chapter draws on a known stage or incident, and the facts it adds are recorded in the same record, so this page stays a valid lookup for the whole book.\n\n**Advances the thesis** (S5): Shows that the fixed record is what lets chapters cite Corvane in a phrase.\n\n**Transition in:** `place`: The incidents, each with its stage and pattern. → Where in the book each stage and incident is used.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | description (table) | A table lists, for the preface, each chapter of Part I and each later part, the stage and the incidents it draws on. | table: Introduction: the hiring wave. Chapter 1: the Two Calendars and the Second Calendar. Chapter 2: the hiring wave and the 2024 change brief. Chapter 3: the Two Calendars and the team changes of 2022 to 2024. Chapter 4: Core in 2022 and the eleven teams cut by headcount. Chapter 5: the Founder Queue and the Launch Queue. Part II: the platform team of five. Part III: the forty-one features. Part IV: the 2025 technology landscape. Parts V to XI by subject, with Part X using all five stages and Part XI stage 5. |  |\n| p21 | explanation | Chapters cite Corvane by a fixed convention: the incident's name or the year, the company's size, and each person's role on first mention; they may add detail to the record and may not change a fact already used. | fact: The ledger is extended only by appending, and no chapter changes a fact a written chapter already uses. | `elaboration`: Which chapters use which material. → The rules by which they use it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The claim, the patterns and the company are one instrument: the claim says what can be designed, the patterns say how the design fails, and Corvane gives each failure a date and a size.\n\n**So what:** The reader starts Part I able to say in plain words what went wrong at Corvane at each size, and ready to learn the vocabulary that explains why.\n\n**Callback:** The hiring wave the book's introduction opened with (engineers doubled, lead time from 4 days to 19), and this page's opening promise to give the company whole. The hiring wave is now stage 3 of five on Corvane's timeline, the stage between about 150 and 300 people, with a stage before it that explains the teams and a stage after it that explains the plans.\n\n**Takeaway** (`questions_for_further_study`): Which of Corvane's incidents has your own organization had, and at what size?\n\n**Hand-off** to [Part I — FOUNDATIONS: The Organization as a System](part-1.html): `elaboration`: The preface's claim that failures are structural, and Corvane's slowdown as the puzzle. → The vocabulary and the reasoning that explain why structure produces behaviour.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | synthesis (list) | Fixed: Corvane is fictional, and its product, five stages, headcounts, cast, named incidents and stated figures do not change between chapters. |  |  |\n| p23 | synthesis (list) | Added by later chapters: each chapter adds the detail its argument needs, such as what was decided, what the fix was and what it cost, and Parts V to XI will settle which cases they use. |  | `contrast`: What is fixed. → What is still to come. |\n| p24 | recommendation (list) | How to use this page: place a cited incident by its stage, read the pattern from the incident table, and treat every Corvane number as an illustration. |  | `sequence`: What the page holds. → What to do with it. |\n| p25 | synthesis | The three parts of the preface are one instrument, the claim saying what can be designed, the patterns how the design fails, and Corvane giving each failure a date and a size; the hiring wave that the book's introduction opened with is now stage 3 on that timeline. |  | `conclusion_summary`: This page as a lookup. → What the page adds up to with the preface's other pages. |\n| p26 | transition | The reader can now say what went wrong at Corvane in plain words and is asked which of its incidents their own organization has had and at what size; Part I supplies the vocabulary and the reasoning that explain why structure produced that behaviour. |  | `elaboration`: The preface's claim that failures are structural, and Corvane's slowdown as the puzzle. → Part I: the vocabulary and the reasoning that explain why structure produces behaviour. |\n\n## Non-goals\n\n- Why each incident happened, in the book's vocabulary (constraint, cognitive load, interface, decision right) See [The Organization as a System That Can Be Architected](the-organization-as-a-system.html), [Flow and the Constraint](flow-and-the-constraint.html).\n- The twelve failure patterns themselves: warning signs, mechanism and cost See [Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html).\n- The scaling stages as a general model of what breaks at each size See [[scaling-stages]].\n- The 2022 fix and the 2024 change brief in full See [The Organization as a System That Can Be Architected](the-organization-as-a-system.html), [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- Evidence on what AI changes; the page states Corvane's stage 5 as illustration only See [[where-the-constraint-moves]].\n- Any claim about a real field-service software company\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The mapping of incidents to failure patterns (p18) is this page's reading, made while the failure-patterns page was being written in parallel. The author should confirm it against that page, in particular: the Founder Queue as the Escalation Ladder (chapter 5 reads it as a sign of the Hero Culture), the Launch Queue as the Overloaded Team and not the Review Bottleneck, the Nine-Week Plan as the Consensus Stall, and the Hiring Question as a decision that risks the Output Scoreboard.\n- Parts V to XI are at outline detail in the journal spec, so the usage table assigns them a stage by subject. The table should be revisited when those parts are written.\n- The journal spec's Preface closing places the hiring wave 'at the 150-to-300 stage'; Corvane has 180 people at the end of stage 3. The page says both.\n- The thesis was written for this spec because the journal spec gives a front-matter page none; the author may want to add it to the journal spec.\n\n## Decision log\n\n- **2026-11-19** — The conclusion's three tiers are Fixed / Added by later chapters / How to use this page, in place of Established / Depends on context / The author's synthesis, because nothing on the page is a sourced claim; no Checklist, because the page gives nothing to run. Rejected: The chapter tiers applied to fiction; A checklist of lookup steps\n- **2026-11-19** — One primary pattern per incident in the table, with the simplification stated in the next paragraph. Rejected: Listing every pattern each incident shows, which would make the table unreadable and pre-empt the chapters\n- **2026-11-19** — Two unnamed cases (the even split of the hiring wave, the forty-one features) are added to the incident table so that the hiring wave itself and the Feature Factory have a row. Rejected: Only the eight named incidents\n- **2026-11-19** — No new dates are invented for the Nine-Week Plan and the Tuesday Reorg; they stay at 2025–2026 so that the planning and reorganization chapters keep their freedom. Rejected: Assigning each a year on this page\n- **2026-11-19** — A Mermaid flowchart, not a Mermaid timeline, for the five stages: the style guide's examples and the renderer's tested path are flowcharts. Rejected: Mermaid timeline diagram\n- **2026-11-19** — After the flow rubric (verdict: sound with notes): the two unnamed cases are told in stage 3 before the incident table classifies them; stages 1 and 3 name their scarce capacity; the conclusion says the hiring wave is from the book's introduction. Not acted on, for the author to decide: merging the figure paragraph into the table paragraph (kept apart because each carries one attachment); shortening the conclusion by merging its first two lists into the usage section (kept because the page format asks for the three tiers); moving the team names to the stages section; the Second Calendar of 2022 is told in the stage 2 paragraph although 2022 is the first year of stage 3, because it is the same failure and the ledger files it with stage 2.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check, decided in auto mode under the brief's rule for local and obvious spec faults: the claim that each structure relieved the previous stage's shortage held only from stage 1 to stage 2 against the ledger, so the thesis and p13 now say that each structure answered the problem in front of the company when it was built, and that coding agents arrived from outside; p10 states what the hiring wave was an answer to; p11 tells the 2025 landscape. The author should confirm the reworded thesis. Rejected: Keeping the chain and bending the stage accounts to fit it; Waiving the three findings\n- **2026-11-19** — The page opens with KEY POINTS only, as a front-matter page: no IN THIS CHAPTER line, no FAILURE PATTERNS callout, no 'What AI Changes Here' section.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md, including its append log as of 2026-11-19 — Every Corvane fact on the page.\n  - journal-spec.json: entries corvane-at-five-sizes, where-product-and-tech-organizations-go-wrong, preface (closing), part-1 (transition_in), and the openings of Parts II to IV — Intent, acceptance criteria and role, copied unchanged; the Preface closing this page carries; the hand-off; the part openings used in the usage table.\n  - _research/style-guide.md — The twelve failure-pattern names and four families; page format.\n  - posts/01 to 05 (the five chapters of Part I), index.md and spec.json — Which stage and incident each written chapter uses; the one-clause definitions of the three capacities.\n\n## Changelog\n\n- **2026-11-19** — Spec changed after round 1 of the draft check (three corroborated flow failures at fault in the spec): thesis claim, S2, the thesis statement, p02, the five-stages section idea, p10, p11 and p13 <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
