<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The users of an organization's design: the people and teams who work in it, the teams that depend on each team, and through them the customers.\n- **Know:** What an outcome of an organizational change is, as distinct from its output (the reorganization, the new role, the new process).\n- **Know:** The steps of running an organizational change as product work: discovery, a stated outcome, a place on a roadmap toward a vision of the organization, the smallest change that tests the diagnosis, and an outcome review.\n- **Believe:** A reorganization that was announced and completed has shipped; whether it worked is a separate question that only an outcome answers.\n- **Believe:** Leaders know distant parts of their own organization as poorly as a product team knows users it has not talked to.\n- **Be able to:** Write a one-page brief for an organizational change: users, problem as discovered, outcome and its measure, smallest change, what would count as failure.\n- **Be able to:** Recognize an organizational change that is output without outcome.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a planned organizational change stated as a solution, the reader restates it as a problem with users and an outcome measure, and proposes a smaller change that would test the diagnosis. *Probe:* A VP announces: 'We will create a central QA team of eight so that quality improves.' Using only this chapter: who are the users of this change, what outcome should it move and how would you measure it, and what smaller change would test the diagnosis first? | `custom` | cold_reader | major |\n| AC-2 | The chapter states the limits of the product analogy: where an organization differs from a product and what must not be carried over. | `custom` | rubric | major |\n| AC-3 | Concepts taken from Build What Matters (key outcomes, vision, balanced roadmap, product dysfunctions) name the book and are paraphrased, and their application to the organization itself is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | User, outcome and discovery each get a working definition that later chapters can use. | `known_before_new` | rubric | major |\n\n## Thesis\n\n**Question:** If an organization is a system that can be architected, whom is it architected for, and how should the work of changing it be run?\n\n> **Claim:** An organization is architected for its users — the people and teams who work in it and the teams and customers who depend on each team — and it owes them outcomes, so changing it should be run as product work: discover the problem before choosing the structure, state the outcome the change must move, place it on a roadmap toward a stated vision of the organization, make the smallest change that tests the diagnosis, and judge each change by its outcome and not by the fact that it was carried out.\n\n**Disputed by:** The view that organization design is an executive decision made by the people with the widest view and then announced, and that treating employees as users and reorganizations as experiments erodes authority and produces change fatigue.\n\n**So what:** A leader writes down the users and the outcome before drawing boxes, talks to the people in the affected flow before deciding, and reviews the outcome some months later; a change that cannot name its outcome is postponed.\n\n**How and why:** Chapter 1 showed that people decide on the information their place gives them; that holds for executives looking at distant teams, so an undiscovered reorganization is a product built without talking to users. And a completed reorganization is output in the sense Build What Matters gives the word: without a stated outcome nobody can say whether it worked, which is how organizations come to reorganize again.\n\n**Supporting claims**\n\n- **S1** — An organization's design has users in three rings — the people and team inside a structure, the teams that depend on it, and the customers — and the business is served through them.\n- **S2** — An organizational change has an output, the change itself, and an outcome, what its users can now do, and only the outcome says whether it worked.\n- **S3** — Organization design fails in the same ways product management does, which is the evidence that it is product work.\n- **S4** — A change run as product work goes through discovery, a stated outcome, a place on a roadmap toward a vision of the organization, the smallest change that tests the diagnosis, and an outcome review, and fits on one page.\n- **S5** — The analogy has limits: users cannot leave cheaply, tests change people's working lives, and some decisions cannot be discovered in the open; within them the leader still decides.\n\n## Role in the part\n\nAdds the second lens: whom the system is for and how changing it is run, so that every later pattern carries a user and an outcome measure. Supports P1-5 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in three-rings-of-users, output-and-outcome, dysfunctions-of-org-design: user before outcome, outcome before the dysfunctions that are defined by its absence)\n\nAfter the opening callouts of the page format, the reader meets a reorganization that was finished and could not be judged, so the product vocabulary arrives as the explanation. Users come before outcomes because an outcome is defined as a change for a user, and the dysfunctions come after both because each is a way of losing sight of one of them. The pattern follows the diagnosis, and the brief follows the pattern because it is the pattern written down; a brief shown first would be a form with no reasons behind its fields. The limits come after the method so that the reader knows what is being limited; placed first they would read as reasons not to try. The worked example follows the limits so that the reader sees the method applied within them, to the case the chapter opened with, and the AI section is a coda after it because it asks what the finished method must expect next.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Between 2022 and 2024 Corvane doubled its engineers from 45 to 95 and reorganized them into eleven product teams. The reorganization was announced, staffed and finished on schedule. Lead time for a change went from 4 days to 19, and when the board asked whether the reorganization had worked, nobody could answer, because nobody had written down what working would mean.\n\n**Bridge:** A reader who builds products would not ship a feature without knowing who it is for and how they would know it worked, and has probably lived through a reorganization that had neither. → The organization is the one product its leaders build without applying their own discipline to it; this chapter applies it.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): An organization is architected for its users — the people and teams who work in it, and the teams and customers who depend on each team — and owes them outcomes. So changing it is product work: discover the problem before choosing the structure, state the outcome, place it on a roadmap toward a vision of the organization, make the smallest change that tests the diagnosis, and judge each change by its outcome.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a reorganization that shipped and could not be judged. *Kept in:* the-hiring-wave.\n- Name the users of an organization's design and what it owes them. *Kept in:* three-rings-of-users.\n- Tell the output of an organizational change from its outcome. *Kept in:* output-and-outcome.\n- Recognize the product dysfunctions when they appear in organization design. *Kept in:* dysfunctions-of-org-design.\n- Run a change as product work in five steps and write it down on one page. *Kept in:* change-as-product-work, the-change-brief.\n- Know where the product analogy stops, and what AI changes. *Kept in:* where-the-analogy-stops, what-ai-changes-here.\n- See Corvane's hiring wave run again as product work. *Kept in:* the-hiring-wave-run-again.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane completed a reorganization on schedule and could not say whether it had worked, because it had never said what it was for. | scenario: Stage 3 in the ledger: engineers from 45 to 95 in eighteen months, eleven product teams cut by headcount, lead time from a median of 4 days to 19. |  |\n| p02 | claim | The organization is a product with users and outcomes, so changing it is product work; the chapter goes from the users, through output and outcome and the dysfunctions that follow from ignoring them, to a five-step way of running a change and its one-page brief, then to the limits of the analogy, Corvane's case run again, and AI. |  | `problem_solution`: A reorganization nobody could judge. → The discipline that would have made it judgeable, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: A Reorganization That Shipped\n\n**Controlling idea** (`example`, id `the-hiring-wave`): Corvane's hiring wave was decided, staffed and completed without anyone talking to the teams in the flow or stating an outcome, and so it could only be judged by whether it was finished.\n\n**Advances the thesis** (S2): Gives the case of an organizational change that is all output, which the chapter then takes apart.\n\n**Transition in:** `elaboration`: The lead's short account of the hiring wave. → The decision, its execution and its result in full.\n\n**Order of paragraphs** (`chronological`): Decision, execution and result come in the order they happened; told result-first, the reader would look for a mistake in the execution, and the point is that there was none.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2022 Corvane's leaders saw a backlog growing faster than the teams could ship and decided that the company needed more engineers in more teams. | scenario: Dario Vance joined as VP Engineering in 2023 into a plan already agreed: hire to 95 engineers and split the four teams into eleven product teams, each about eight people. |  |\n| p04 | description | The plan was carried out well: the hires were made, eleven product teams and a platform team were formed by dividing people evenly, and the new structure was announced on the planned date. | scenario: Eleven product teams and one platform team of five, formed in two waves in 2023. | `sequence`: The decision. → Its execution. |\n| p05 | analysis | A year later lead time had gone from 4 days to 19, three teams waited on Platform for every launch, and the leadership team disagreed about whether the reorganization had helped, because no outcome had been stated against which to judge it. | scenario: The Launch Queue: 14 open launch requests at Platform at the peak in 2024. | `contrast`: A change completed as planned. → A result nobody could attribute or judge. |\n\n### Who the Organization Is For: Three Rings of Users\n\n**Controlling idea** (`definition`, id `three-rings-of-users`): An organization's design has three rings of users: the people and teams who work inside a structure, the teams that depend on each team, and through them the customers.\n\n**Advances the thesis** (S1): Defines 'user' for organization design and says what each ring needs from it.\n\n**Transition in:** `problem_solution`: A change designed without asking anyone it affected. → Who should have been asked: the users of the design.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition (table) | A user of an organizational design is anyone whose work the design makes easier or harder, and there are three rings of them. | table: Ring \\| Who \\| What they need from the design \\| How you hear from them. Inner: the people and the team inside a structure \\| work they can understand and finish, decisions they are allowed to make \\| interviews, their own account of a working week. Middle: the teams that depend on that team \\| a way to get what they need without queueing \\| wait times, dependency lists, their complaints. Outer: customers \\| a product that is coherent and improves \\| the product's own outcome measures. |  |\n| p07 | explanation | The inner ring is the one leaders most often speak for without asking, although the people in a team know what their structure costs them better than anyone above it. | source: Morieux and Tollman's first rule, understand what your people do, and their observation that executive teams compete first on the accuracy of their insight into their own organization. | `elaboration`: Three rings. → The first ring and why it is under-heard. |\n| p08 | explanation | The middle and outer rings experience an organization's design through its interfaces: a team's consumers are its users in the same sense that a platform's developers are, and customers meet the design as a product that is coherent or is not. | reasoning: Chapter 1 defined the interface as the agreed way work and knowledge cross between teams; the team on the consuming side is the one who can say whether it works. | `sequence`: The inner ring. → The middle ring. |\n| p09 | explanation | The business that funds the organization is a stakeholder with outcomes of its own, and it is served through the users, not instead of them. | source: Build What Matters separates the key customer outcome from the key business outcome and argues that business results follow when customers get the outcome they care about. | `contrast`: Users in three rings. → The party that pays and is not a user. |\n\n### Output and Outcome of an Organizational Change\n\n**Controlling idea** (`definition`, id `output-and-outcome`): The output of an organizational change is the change itself — the new teams, the new role, the new process — and its outcome is what its users can now do that they could not, measured.\n\n**Advances the thesis** (S2): Carries the output–outcome distinction from product management to organization design.\n\n**Transition in:** `sequence`: Who the users are. → What the organization owes them: outcomes, as distinct from outputs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Product management distinguishes what a team ships from what changes for the customer because of it, and calls being stuck on the first the build trap. | source: Perri: the build trap is when organizations measure success by outputs rather than outcomes. Foster and Nerlikar's first dysfunction, the Hamster Wheel, is a team focused on hitting deadlines with little regard for the outcome. |  |\n| p11 | comparison (table) | An organizational change has the same two sides, and the output side is the only one a completion date measures. | table: Change \\| Output (it shipped) \\| Outcome (it worked) \\| A measure. Split one team into two \\| two teams exist, each with a lead \\| each team changes its area without waiting for the other \\| lead time and cross-team wait. Create a platform team \\| the team is staffed and has a roadmap \\| product teams release without asking anyone \\| share of launches needing a platform ticket. Add a layer of directors \\| directors are appointed \\| decisions are made closer to the teams and faster \\| time a decision waits; how many reach the VP. Introduce quarterly planning \\| the plan is published \\| teams work on what was planned and it mattered \\| share of planned outcomes reached. | `similarity`: Output and outcome in product work. → The same pair for four organizational changes. |\n| p12 | definition | An outcome for an organizational change is a change in what its users can do, stated before the change with a measure and a date; this is the working definition the book uses. | source: Build What Matters calls the key outcome the 'metric of progress': the way to know whether the product is delivering value. | `conclusion_summary`: Examples of outcomes. → The definition they share. |\n\n### The Product Dysfunctions, in Organization Design\n\n**Controlling idea** (`analysis`, id `dysfunctions-of-org-design`): Five of the dysfunctions that Build What Matters names in product management appear unchanged when leaders design organizations.\n\n**Advances the thesis** (S3): Shows that the failure modes of product work recur in organization design, which is the evidence that it is product work.\n\n**Transition in:** `cause_effect`: Organizational changes have outputs and outcomes like products. → They therefore fail in the ways product work fails.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | comparison (table) | Foster and Nerlikar list ten dysfunctions of product management, grouped under themes of which the first is attention turned inward, and five of them — the Hamster Wheel, the Ivory Tower, the Roller Coaster, the Throne Room and the Negotiating Table — describe how organizations are commonly redesigned. | table: Dysfunction (Build What Matters) \\| In product work \\| In organization design. The Hamster Wheel \\| output over outcomes; hitting deadlines \\| the reorganization judged by its completion date. The Ivory Tower \\| lack of customer research \\| a structure drawn by people who have not talked to the teams in it. The Roller Coaster \\| twists from a time horizon that is too short \\| a reorganization every year, each undoing the last. The Throne Room \\| whipsaw decisions from the person in charge \\| the structure follows the newest executive's last company. The Negotiating Table \\| trying to keep everyone happy \\| a structure that gives each leader the scope they asked for.; source: Build What Matters groups its ten dysfunctions under three themes, the first being internal focus that draws attention away from delivering customer value. |  |\n| p14 | analysis | The Reorg as Strategy from this book's own catalogue is the Roller Coaster and the Hamster Wheel together: repeated change, each instance judged only by being done. |  | `example`: Five dysfunctions mapped. → The mapping applied to one of the book's named failure patterns. |\n\n### Pattern: Run the Change as Product Work\n\n**Controlling idea** (`process`, id `change-as-product-work`): An organizational change run as product work has five steps: discovery, a stated outcome, a place on a roadmap toward a vision of the organization, the smallest change that tests the diagnosis, and an outcome review.\n\n**Advances the thesis** (S4): The chapter's main pattern: the procedure that replaces decide-and-announce.\n\n**Transition in:** `problem_solution`: Organization design fails as product work fails. → The way product work is done well, applied to a change.\n\n**Order of paragraphs** (`chronological`): The steps are given in the order they are performed: the outcome is placed against the vision before the first move is chosen, because the smallest change is the smallest toward that outcome; with the roadmap after the test, the test would have nothing to be a step toward. The figure comes first so that each step is read as part of a loop and not as a checklist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | process (figure) | The five steps form a loop, and the loop is the same one a product team runs. | figure: Mermaid flowchart, left to right: 'Discovery' → 'Outcome and measure' → 'Place on the roadmap' → 'Smallest change' → 'Outcome review' → back to 'Discovery'; a side node 'Vision of the organization' feeding 'Place on the roadmap'. |  |\n| p16 | process | Discovery means finding out what the problem is from the people in the flow before choosing a structure, and it starts with whether the problem is structural at all. | source: Larson's first step in planning organizational change is to validate that it is the right tool: is the problem structural, are you working around a broken relationship, are the conditions temporary? He adds that most poor working relationships are the by-product of information gaps.; source: Perri describes the 'waiter' who asks customers what they want instead of discovering their problems; the customer names a solution and gets it. | `sequence`: The loop as a whole. → Its first step. |\n| p17 | process | The outcome is stated before the design, with one measure and a date, so that the design can be chosen for it and judged by it. | reasoning: A structure can be compared with alternatives only against a stated outcome; without one, any structure that is completed counts as success. | `sequence`: Discovery. → What discovery is turned into. |\n| p18 | process | The outcome is placed on a roadmap that works backward from a vision of the organization, described from the users' side — what a week in a team looks like when the design works — so that this change is one step toward something and not an event. | source: Build What Matters: the vision is not a list of features but an expression of how the customer will derive value, and the strategy works backward from it through key steps and measurable milestones. | `sequence`: One outcome. → Where it sits among the others, and what they lead to. |\n| p19 | process | The smallest change that tests the diagnosis is preferred to the full redesign, because the diagnosis is an assumption until something has been tried. | source: Perri: known unknowns are assumptions to test; discovery and experimentation turn them into facts before you build. | `sequence`: The outcome and its place on the roadmap. → The first move toward it. |\n| p20 | process | The outcome review, some months after the change, compares the measure with what was stated and decides whether to keep, extend or reverse the change. | source: Among Larson's questions before committing to a reorganization: what will trigger the reorg after this one? | `sequence`: The smallest change. → The step that closes the loop. |\n\n### The One-Page Change Brief\n\n**Controlling idea** (`example`, id `the-change-brief`): The five steps fit on one page written before any structure is drawn, and a change that cannot fill the page is not ready.\n\n**Advances the thesis** (S4): Turns the pattern into an artefact the reader can write, which is the chapter's can-do outcome.\n\n**Transition in:** `elaboration`: Five steps. → The page they are written on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | description (table) | The brief has six fields — two for discovery (users, problem as discovered), one each for the outcome, the place on the roadmap and the smallest change, and one for failure and review — and each blocks a common shortcut. | table: Field \\| What goes in it \\| The shortcut it blocks. Users \\| which teams and people, in which ring \\| designing for the leaders' convenience. Problem as discovered \\| what the users said and what the data shows, in their terms \\| starting from a solution. Outcome and measure \\| one measure, its value today, the target, the date \\| judging by completion. Place on the roadmap \\| which step toward the vision this is, and what it makes possible next \\| the one-off reorganization. Smallest change \\| the least that would test the diagnosis, for how long, and whether it can be reversed \\| the full redesign as first move. Failure and review \\| the result that would make you reverse it; the review date and who reports \\| keeping a change because it was announced. |  |\n| p22 | recommendation | The brief is written before any structure is drawn, by the leader who owns the change, and a change that cannot fill the page is postponed, because an empty field marks something that has not been found out or decided. | reasoning: Each empty field corresponds to a skipped step: no users means no discovery, no measure means no outcome, no failure criterion means the change cannot be reversed on evidence. | `elaboration`: The fields. → How and when the page is used. |\n\n### Where the Analogy Stops\n\n**Controlling idea** (`counterargument`, id `where-the-analogy-stops`): An organization differs from a product in three ways that limit the analogy: its users cannot leave cheaply, experiments on it change people's working lives, and some decisions about it cannot be discovered in the open.\n\n**Advances the thesis** (S5): States the limits the journal spec requires and answers the objection that this approach erodes authority and stability.\n\n**Transition in:** `contrast`: The pattern and its page. → The objections to treating an organization this way.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | counterargument | The strongest objection is that treating reorganizations as experiments produces change fatigue, and it is right about what repeated change costs. | source: Larson asks, before committing, whether the new structure will last at least six months, and calls accidentally missing someone the cardinal sin of reorganization. |  |\n| p24 | comparison (table) | Three differences from a product limit the analogy — users cannot leave cheaply, a test changes someone's working life and may not be reversible, and some decisions cannot be researched in the open — and each changes how a step is run. | table: A product \\| An organization \\| What changes in the method. Users can stop using it \\| users are employees; leaving is costly and slow \\| their feedback is quieter, so discovery has to go and get it. A test can be shown to a sample and withdrawn \\| a test changes someone's team, manager or on-call, and some changes cannot be undone \\| fewer, longer tests; prefer reversible ones; say in advance that it is a test and what happens after. Research can be open \\| some changes involve people's jobs or pay \\| discovery about the work is open; decisions about individuals are not put to a vote. | `additional_support`: The cost of change to people. → Two further differences alongside it, and what all three do to the method. |\n| p25 | refutation | Running change as product work does not move the decision to the users: the leader still decides, as a product manager does, and deciding by trying to satisfy everyone is itself one of the dysfunctions. | source: Build What Matters' Negotiating Table: the product manager who tries to give everyone what they want. Perri: it is not the customer's job to come up with the solution. | `contrast`: What the objection gets right. → What it gets wrong: discovery is not delegation. |\n\n### Worked Example: The Hiring Wave, Run Again\n\n**Controlling idea** (`example`, id `the-hiring-wave-run-again`): Run as product work in 2024, Corvane's response to its slowdown started from the users in the flow, named lead time as the outcome and tested the diagnosis on one team before touching the other ten.\n\n**Advances the thesis** (S1, S2, S4): Applies the users, the outcome and the five steps to the opening case, with the result and what it did not settle.\n\n**Transition in:** `example`: The method and its limits. → The method applied to the case the chapter opened with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | example (table) | In 2024 Dario Vance, Corvane's VP Engineering, wrote the brief the hiring wave never had. | table: Field \\| Corvane, 2024. Users \\| the Platform team, whose release path is the structure being changed (inner ring), and the eleven product teams that depend on it (middle ring). Problem as discovered \\| from interviews with every team lead and the launch log: a change is written in about two days and then waits; 14 launch requests are open at Platform; five platform engineers serve eleven teams. Outcome and measure \\| median lead time for a change from 19 days to under 7 within two quarters. Smallest change \\| give one team, Scheduling, a release path it can run itself, for one quarter. Failure \\| Scheduling's lead time still above 10 days after the quarter. Review \\| end of the quarter; Lena Brandt reports. |  |\n| p27 | analysis | Discovery changed the diagnosis: the 2022 plan had assumed too few engineers, and the interviews showed finished changes waiting for one team. | scenario: Illustration: of the 19 days, the teams' own account put about two in writing the change and the rest in waiting for a launch slot. | `cause_effect`: The brief. → What writing it revealed. |\n| p28 | explanation | The brief named median lead time as the outcome, from 19 days to under 7 within two quarters, and chose as the smallest change a release path that one team, Scheduling, could run without Platform for one quarter. | scenario: Outcome and smallest change as in the brief; failure criterion: Scheduling's lead time still above 10 days after the quarter. | `cause_effect`: A diagnosis that had moved from too few engineers to changes waiting for one team. → The outcome and the test chosen for that diagnosis. |\n| p29 | analysis | After one quarter Scheduling's median lead time was 6 days, which confirmed the diagnosis, and Corvane extended the release path to the other ten teams instead of re-cutting the eleven teams. | scenario: Illustration: Scheduling 19 days to 6 in one quarter on the self-run release path. | `sequence`: The outcome and the test. → The result and what Corvane did with it. |\n| p30 | analysis | At the two-quarter review the median lead time across all eleven teams was 8 days, short of the target of under 7, and because the brief had stated the target the miss was visible and was closed a quarter later, when the last teams were on the release path. | scenario: Illustration: company-wide median lead time 19 days at the start, 8 days at the two-quarter review, under 7 one quarter after that. | `contrast`: One team's result. → The company-wide outcome the brief had promised, and how far the change fell short of it at the review. |\n| p31 | analysis | The review also showed what the change had not settled — teams still cut by headcount, and nobody deciding when a feature is ready — and those became the next two entries on Corvane's roadmap for its own organization. |  | `additional_support`: The outcome, reached late. → What the review found that the change had not settled. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI does not change who the users are or what an outcome is; it shortens the time for which a leader's picture of the work stays true, which makes discovery more necessary.\n\n**Advances the thesis** (S4): Applies the chapter's method to AI with labeled claims.\n\n**Transition in:** `additional_support`: The method applied to a case from 2024. → Whether the method changes when agents do part of the work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | analysis | Emerging: teams that adopt coding agents change their own way of working faster than a leader's picture of them is refreshed, so a design based on last year's picture is aimed at work that is no longer done that way. | reasoning: Author's observation as of November 2026, labeled Emerging: the division of work inside teams using agents has changed within months, without any organizational change being announced. |  |\n| p33 | claim | Speculative: if producing a change takes less time, the outcome measures of organizational changes will shift from how fast work is produced to how long it waits for a decision or a check. | reasoning: Labeled Speculative; it follows from the argument of Part XI and would be confirmed where review and decision wait, not build time, dominate lead time. | `cause_effect`: Work inside teams changing quickly. → What that may do to the measures a change brief uses. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Chapter 1 said what can be changed and this chapter says for whom and how: the four levers are the means, the users' outcomes are the end, and a change that names a lever without a user and an outcome is output.\n\n**So what:** The reader can refuse to draw boxes until the brief is written, and can tell a board whether a past reorganization worked by asking what outcome it was for.\n\n**Callback:** Corvane's board asking whether the hiring wave had worked. The reader can now say why nobody could answer, and what would have had to be written down in 2022 for the question to have an answer.\n\n**Takeaway** (`course_of_action`): Write the one-page brief for the next organizational change you are planning, before any structure is drawn. The checklist that follows gives the questions.\n\n**Hand-off** to [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html): `cause_effect`: Teams as components and interfaces as the contracts between them, designed for the people who use them. → The consequence for the product: the software takes the shape of those components and interfaces.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis (list) | Established: in product work, success is measured by outcomes and not outputs, and problems are discovered before solutions are chosen; and a reorganization should first be validated as the right tool. |  |  |\n| p35 | synthesis (list) | Depends on context: how small the smallest change can be, and how open discovery can be, depend on whether the change can be reversed and whether it touches people's jobs. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p36 | synthesis (list) | The author's synthesis: treating the organization itself as the product, with three rings of users and a change brief, is this book's extension of those sources. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p37 | recommendation (list) | The checklist is the change brief turned into eight questions to ask of a planned change before it is announced. |  | `sequence`: What to take away. → What to do with it. |\n| p38 | transition | With the system described and the way of changing it set out, the next chapter turns to the first consequence of arranging teams: the software takes their shape. |  | `cause_effect`: Teams as components, designed for the people who use them. → What that arrangement does to the software. |\n\n## Non-goals\n\n- Product management for the product itself: vision, strategy, roadmaps, discovery and delivery See [Outcomes Over Output](outcomes-over-output.html), [Vision and Product Strategy](vision-and-product-strategy.html), [Roadmaps and Horizons](roadmaps-and-horizons.html), [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- How to carry out a reorganization: staffing, communication, rollout See [[reorganizations]].\n- Platform as a product See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- Finding the constraint in a flow See [Flow and the Constraint](flow-and-the-constraint.html).\n- Measures of organizational health in general See [[product-outcomes-and-organizational-health-signals]].\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-19** — Every use of Build What Matters and Escaping the Build Trap is paraphrased from the author's notes, and the application to organization design is marked as the author's extension, as the journal spec's acceptance criterion requires. Rejected: Presenting the sources as if they addressed organization design\n- **2026-11-19** — The users are given as three rings, with the business as a stakeholder served through them, following the customer-outcome and business-outcome split in Build What Matters. Rejected: Employees only as users; The CEO or board as the user\n- **2026-11-19** — The cold-reader probe in the journal spec uses a central QA team, so the chapter's own filled-in brief uses a platform team and the worked example uses Corvane; the probe case does not appear in the chapter. Rejected: Using the QA example in the text\n- **2026-11-19** — Accepted by the author. Corvane's 2024 brief and Scheduling pilot confirmed as ledger fact; the thesis wording reordered to match the five steps as performed.\n- **2026-11-19** — After round 1 (ESCALATE), by the author's decision: in the worked example the rings are counted from the structure being changed, so the Platform team is the inner ring and the eleven product teams the middle ring; the brief's company-wide outcome is closed with a partial miss (8 days at the two-quarter review against a target of under 7, reached a quarter later); 'written in a day' corrected to 'about two days'.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md — Corvane stage 3: the hiring wave, the Launch Queue, lead times, the cast.\n  - journal-spec.json, entry the-organization-as-a-product — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020); author's notes, _input/bookshelf/docs/notes/build-what-matters.pdf — The ten dysfunctions and their three themes; key customer and business outcomes; the vision as the customer's view; strategy working backward from the vision.\n  - Melissa Perri, Escaping the Build Trap (2018); author's notes, _input/bookshelf/docs/notes/build-trap.pdf — The build trap; outputs and outcomes; the waiter archetype; known unknowns and discovery.\n  - Will Larson, An Elegant Puzzle (2019); author's notes, _input/bookshelf/docs/notes/elegant-puzzle.pdf — Validating that a reorganization is the right tool; the questions before committing; the cost of change to people.\n  - Yves Morieux and Peter Tollman, Six Simple Rules (2014); author's notes — Understand what your people do; leaders' insight into their own organization as the first basis of competition.\n\n## Changelog\n\n- **2026-11-19** — Spec changed after round 1 by the author's decision: worked example's users row corrected, a paragraph added that closes the company-wide outcome, one inconsistency in the evidence removed; paragraphs renumbered. Draft revised to match; round 2 follows.\n- **2026-11-19** — Accepted by the author; thesis and thesis statement reworded to the performed order of the steps; open questions closed.\n- **2026-11-19** — First version of the spec, written before any prose; revised after the flow rubric (sound with notes): dysfunctions merged to two paragraphs, roadmap step before the smallest change, brief fields mapped to the steps, the second fictional example removed, the worked example states its outcome and test before the result and ends on the roadmap.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
