<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four elements: teams as components, contracts and rituals as interfaces, work, information and decisions as flows, and attention, judgment and verification as constrained capacities.\n- **Know:** The four things a leader designs directly (boundaries, interfaces, decision rights, incentives) and the three the design must be fitted to (skill, trust, strategy).\n- **Believe:** Behaviour in an organization is a rational response to its structure, so changing boxes without changing interfaces and incentives changes little.\n- **Be able to:** Redescribe a problem stated in terms of people as a problem of one of the four designable things.\n- **Be able to:** Say of a proposed fix whether it changes a designable element or only the org chart.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a complaint phrased about people, the reader restates it as a boundary, interface, decision-right or incentive problem. *Probe:* 'The mobile team never tells anyone what they are changing.' Using only this chapter: restate this as a problem of one of the four designable things, and say what you would look at. | `custom` | cold_reader | major |\n| AC-2 | The three scarce capacities are each defined in one clause, the chapter does not rest any argument on them, and the reader is told that the chapter on flow treats them in full. | `known_before_new` | rubric | major |\n| AC-5 | Decision right and incentive each get a working definition that Parts II to V can use before Part VI and Part VII treat them in depth. | `known_before_new` | rubric | major |\n| AC-3 | The chapter states at least one limit of the architecture metaphor and what it does not explain. | `custom` | rubric | major |\n| AC-4 | Claims taken from Meadows, Larson, and Morieux and Tollman name the book and the concept. | `evidence_is_explained` | rubric | major |\n\n## Thesis\n\n**Question:** What does it mean to treat an organization as a system that can be architected like any other, and which of its properties can a leader actually design?\n\n> **Claim:** Treating an organization as a system that can be architected means describing it, as an architect describes any system, by four elements — teams as components, contracts and rituals as interfaces, work, information and decisions as flows, and attention, judgment and verification as constrained capacities — and accepting that a redesign has only four levers on them: where the boundaries sit, what the interfaces are, who holds which decision right and what the incentives reward; skill, trust and strategy, which leaders also work on, change too slowly to be set by a redesign and are conditions it has to fit.\n\n**Disputed by:** The view that organizations are social systems too particular to be engineered, and that an architectural metaphor produces mechanical reorganizations that ignore people.\n\n**So what:** When something fails, the leader asks which of the four levers — boundary, interface, decision right or incentive — produced the behaviour before changing people, and stops expecting a reorganization to repair missing trust or an absent strategy.\n\n**How and why:** A system's behaviour comes from its structure and feedback loops more than from its parts (Meadows), and people act sensibly given their goals, resources and constraints (Morieux and Tollman); the four designable things are the parts of that context a leader sets. The metaphor is limited: components here have interests and memory, which is why skill, trust and strategy are treated as conditions and not as design choices.\n\n**Supporting claims**\n\n- **S1** — An organization can be described by four elements: teams as components, contracts and rituals as interfaces, work, information and decisions as flows, and attention, judgment and verification as capacities that run out.\n- **S2** — Behaviour follows structure: people act sensibly within the goals, resources and constraints their position gives them, so the same structure produces the same behaviour from different people.\n- **S3** — A redesign has four levers — boundaries, interfaces, decision rights and incentives — and must fit three conditions it cannot set: skill, trust and strategy.\n- **S4** — Used as a diagnosis, the levers turn a complaint about people into a design problem, and the common misuses of structure each change something other than the lever at fault.\n- **S5** — The metaphor has a limit: teams have interests and memory, so the levers shape context and do not determine behaviour, and over-specified structure removes the cooperation it was meant to produce.\n\n## Role in the part\n\nSupplies the elements and the list of designable things that every later chapter sorts its patterns into. Supports P1-1 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in four-elements, behaviour-follows-structure, four-levers: each supplies the terms the next uses)\n\nAfter the three opening callouts that the book's page format puts on every chapter, the reader meets a failure that survived its remedy before any term is defined, so the vocabulary arrives as the explanation of something already puzzling. The four elements are defined together, with the capacities named in one paragraph and left to the chapter on flow, so that nothing stands between the description and the answer to the puzzle (behaviour follows structure); a full section on the capacities was tried in two positions and readers found it in the way in both. The levers follow the explanation because they are the parts of the context the explanation says matter, and the diagnostic procedure comes after both because it uses both. The limits come after the anti-patterns so that the reader has seen structure misused before being told how far to trust it. The worked example closes the argument because it uses every term and reveals the four gaps the scene left open; the AI section is a coda after it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2021 Corvane's planners and technicians saw different schedules for three weeks, because the Web and Mobile teams had each built the rule for overlapping jobs. The review found a communication failure and the Mobile lead was replaced. Eight months later his successor's team and the Integrations team disagreed about job status in exactly the same way.\n\n**Bridge:** Most readers have seen a problem attributed to a person, the person moved or replaced, and the problem return. → If the failure outlived the person, something that stayed in place produced it; naming what stayed in place is what an architect does for any system, and an organization is one.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): An organization is a system that can be architected like other systems — teams as components, contracts and rituals as interfaces, work, information and decisions as flows, and attention, judgment and verification as capacities that run out — and a redesign can change only four things about it: boundaries, interfaces, decision rights and incentives. Skill, trust and strategy are conditions the design has to fit.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See one failure repeat after the person blamed for it was replaced. *Kept in:* the-second-calendar.\n- Describe an organization by four elements, the fourth being three capacities that run out. *Kept in:* four-elements.\n- Understand why behaviour follows structure. *Kept in:* behaviour-follows-structure.\n- Name the four levers a redesign has and the three conditions it must fit. *Kept in:* four-levers.\n- Turn a complaint about people into a design problem, and recognize the common misuses of structure. *Kept in:* reading-a-complaint, anti-patterns.\n- Know where the architecture metaphor stops, and what AI does and does not change about it. *Kept in:* limits-of-the-metaphor, what-ai-changes-here.\n- Apply the four levers to Corvane's repeated failure. *Kept in:* corvane-read-again.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | A team lead at Corvane was replaced for a failure of communication, and eight months later his successor had the same failure with a different team. | scenario: Corvane, 2021: Web and Mobile each implement the rule for overlapping jobs and show different schedules for three weeks; the Mobile lead is replaced; in 2022 Mobile and Integrations diverge on job-status rules in the same way. |  |\n| p02 | claim | Treating the organization as a system that can be architected means describing it by four elements and changing it through four levers, and the chapter builds that vocabulary in the order a diagnosis uses it. |  | `problem_solution`: A failure that survived the replacement of the person blamed for it. → The way of looking that explains it, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: The Same Failure, Twice\n\n**Controlling idea** (`example`, id `the-second-calendar`): At Corvane the same failure happened twice with different people, which shows that its cause was in what stayed the same between the two occasions.\n\n**Advances the thesis** (S2): Gives the concrete case in which a person was replaced and the behaviour was not, which the rest of the chapter explains.\n\n**Transition in:** `elaboration`: The lead's short account of a failure that survived the replacement of a person. → The incident in full: what was built, what was decided and what happened next.\n\n**Order of paragraphs** (`chronological`): The reader needs the first incident, the remedy and the recurrence in the order they happened to see that the remedy was tested and failed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Corvane, the fictional company this book follows through five sizes, had four teams in 2021 — Web, Mobile, Integrations and Core — and each built its own part of the product. | scenario: Stage 2 in the ledger: 50 people, 28 in product and tech; teams Web, Mobile, Integrations and Core; two engineering managers; one product manager. |  |\n| p04 | description | Web and Mobile each implemented the rule for overlapping jobs, and for three weeks planners and technicians worked from different schedules. | scenario: The Two Calendars: the office application let a planner double-book a technician within a travel-time window; the mobile app rejected the second job. | `cause_effect`: Four teams with no shared channel for rule changes. → What that produced. |\n| p05 | description | The review named a communication failure and Corvane replaced the Mobile lead; eight months later Mobile and Integrations diverged on job-status rules. | scenario: The Second Calendar (2022): a job marked complete on the phone stayed open in the customer's billing export for eleven days. | `time`: The first incident and its diagnosis. → The remedy chosen and the second incident. |\n| p06 | analysis | Between the two incidents the people changed and the structure did not, so whatever caused the failure was in the structure. |  | `contrast`: What changed between the incidents: the person. → What did not change, which is where the cause must be. |\n\n### Four Elements: Components, Interfaces, Flows, Capacities\n\n**Controlling idea** (`definition`, id `four-elements`): An organization can be described with the four kinds of thing an architect uses for any system: its components, the interfaces between them, what flows across those interfaces, and the capacities that limit it.\n\n**Advances the thesis** (S1): Supplies the descriptive vocabulary: the first half of the thesis.\n\n**Transition in:** `problem_solution`: Three things that stayed the same and that an org chart does not show. → A way of describing an organization that does show them.\n\n**Order of paragraphs** (`prerequisite_order`): The definition comes first, then the mapping, then each element in the order a flow passes through them, with the capacities named last and deferred, ending on the drawing; the drawing placed first would use terms not yet defined, and a full account of the capacities here would stand between the reader and the answer to the scene's puzzle.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | A system is elements, interconnections and a purpose, and an architect's description of software uses the same three plus the limits the system runs under. | source: Meadows defines a system as an interconnected set of elements coherently organized to achieve something: elements, interconnections, and a function or purpose. |  |\n| p08 | comparison (table) | Each of the four elements has a direct counterpart in an organization. | table: Element \\| In software \\| In an organization \\| At Corvane in 2021. Components: services or modules \\| teams \\| Web, Mobile, Integrations, Core. Interfaces: APIs and contracts \\| agreed contracts, rituals and documents between teams \\| none for scheduling rules. Flows: requests and data \\| work, information and decisions \\| rule changes travelled by chance. Capacities: CPU, memory, latency budgets \\| attention, judgment, verification \\| attention: nobody held the whole product. | `elaboration`: The four kinds of thing. → What each one is in an organization. |\n| p09 | explanation | The component is the team and not the person, because the team is the smallest unit that can own something for longer than one person stays. |  | `elaboration`: The table's first row. → Why the unit is the team. |\n| p10 | definition | An interface is any agreed way in which one team's work or knowledge reaches another, and most trouble in a system sits at these boundaries. | source: Meadows: the greatest complexities arise exactly at boundaries; missing information flows are among the most common causes of system malfunction. | `sequence`: Components. → What connects them. |\n| p11 | explanation | Three things flow across interfaces — work, information and decisions — and decisions are the flow that descriptions of organizations most often leave out. |  | `sequence`: Interfaces. → What moves across them. |\n| p12 | definition | The fourth element is three capacities that run out — attention, how much a team can hold in mind well enough to change it safely; judgment, deciding with the relevant information at hand; and verification, knowing that what was built is correct and was worth building — and this chapter only names them, because the chapter on flow treats them in full. | source: Meadows: any physical, growing system runs into some kind of constraint sooner or later, and growth itself changes what is limiting. | `sequence`: Components, interfaces and flows. → The fourth element, named and deferred. |\n| p13 | evidence (figure) | Drawn with its interfaces and flows, Corvane in 2021 shows the gap an org chart does not: no path for a rule change between Web, Mobile and Integrations. | figure: Mermaid flowchart: four team nodes; solid edges for existing interfaces (Core's API to each team, the weekly product sync); a dashed edge labelled 'scheduling rules: no interface' between Web and Mobile, and between Mobile and Integrations. | `example`: The four elements in the abstract. → Corvane drawn with them. |\n\n### Why Replacing People Changes So Little\n\n**Controlling idea** (`explanation`, id `behaviour-follows-structure`): People act sensibly given the goals, resources and constraints their place in the structure gives them, so the same structure draws the same behaviour from whoever is put in it.\n\n**Advances the thesis** (S2): Gives the reasoning behind the claim that structure produces behaviour, from two sources, and answers the objection that people matter.\n\n**Transition in:** `cause_effect`: An organization described by its four elements. → Why that description predicts behaviour, which answers the puzzle of the scene.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | claim | A system keeps behaving as itself when its elements are replaced, as long as its interconnections and purpose are intact. | source: Meadows: a system generally goes on being itself, changing only slowly if at all, even with complete substitutions of its elements, as long as its interconnections and purposes remain intact; changing interconnections can change it dramatically. |  |\n| p15 | explanation | In organizations the mechanism is that every behaviour is a rational solution to a problem, given the person's goals, resources and constraints. | source: Morieux and Tollman: behaviours are rational solutions in a particular context of goals, resources and constraints; to change behaviour, change the context, not the mind-set. | `elaboration`: The observation that systems persist. → Why they persist when the elements are people. |\n| p16 | analysis | Read that way, both Mobile leads did the sensible thing: their goal was the mobile roadmap, they had no resource for learning of another team's rule change, and the cost of cooperating fell on them alone. | source: Morieux and Tollman call the cost a person bears when cooperating an adjustment cost. | `example`: Goals, resources and constraints as the explanation of behaviour. → The explanation applied to the Mobile lead. |\n| p17 | counterargument | People still differ in skill and experience, and the structure sets the range within which those differences show. | source: Meadows on bounded rationality: people make reasonable decisions on the information they have, and lack information about distant parts of the system. | `contrast`: Structure explains the behaviour. → The objection that people matter, and what is true in it. |\n\n### What a Redesign Can Change: Four Levers and Three Conditions\n\n**Controlling idea** (`definition`, id `four-levers`): A redesign acts on the organization through four levers — boundaries, interfaces, decision rights and incentives — and has to fit three conditions it cannot set: skill, trust and strategy.\n\n**Advances the thesis** (S3): States the second half of the thesis and gives the working definitions later parts rely on.\n\n**Transition in:** `problem_solution`: Behaviour follows context, which leaves open which parts of the context a leader can change. → The four parts a redesign changes, and the three conditions it does not.\n\n**Order of paragraphs** (`grouping`): The four levers are given together in a table and then one by one from the most visible, the boundary, to the least, the incentive; the conditions come last because they are defined by contrast with the levers, and placed first they would read as excuses before the reader knows what can be changed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim (table) | The four levers are the parts of people's context that a leader sets directly. | table: Lever \\| What it sets \\| The question it answers \\| Treated in depth in. Boundary \\| who owns what \\| whose is this? \\| Part I, Part II. Interface \\| how work and knowledge cross between teams \\| how do they find out? \\| Part II. Decision right \\| who may decide which kind of question \\| who says yes? \\| Part VI. Incentive \\| what the organization visibly rewards \\| what gets you promoted here? \\| Part VII. |  |\n| p19 | definition | A boundary is the line that says which team owns a thing, and it is a lever because moving it changes what each side must understand. |  | `elaboration`: The table's first row. → The working definition of boundary. |\n| p20 | definition | An interface becomes a lever when it is agreed and owned; an interface that exists only as a habit between two people leaves with them. |  | `sequence`: Boundaries. → The interfaces across them. |\n| p21 | definition | A decision right is the agreed answer to who may decide a named kind of question, whose input they must take, and where the decision is written down. |  | `sequence`: Interfaces. → Decision rights, in a working definition Parts II to V can use. |\n| p22 | definition | An incentive is whatever the organization visibly rewards — promotion, recognition, headcount, a leader's attention — and it defeats the other three levers when it points elsewhere. | source: Meadows on seeking the wrong goal: a system whose indicators confuse effort with result will produce effort, not result. | `sequence`: Decision rights. → Incentives, in a working definition. |\n| p23 | explanation | Skill, trust and strategy matter as much as the levers, but they change over quarters and years and cannot be set by a redesign, so the design has to be fitted to them as they are. | reasoning: A reorganization takes effect on a date; trust between two teams, the skill to run a service, and a strategy the company believes take longer and are built by other means (Parts III, IV, VII and IX). | `contrast`: Four things a redesign sets. → Three things it cannot set and must fit. |\n\n### Pattern: Read a Complaint About People as a Design Problem\n\n**Controlling idea** (`process`, id `reading-a-complaint`): A complaint about people can be turned into a design problem by describing the behaviour, asking what goals, resources and constraints make it sensible, and naming the lever that sets them.\n\n**Advances the thesis** (S4): Turns the vocabulary into a procedure the reader can use, which is the chapter's main reader outcome.\n\n**Transition in:** `sequence`: The levers and conditions defined. → How to use them on a real complaint.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | process | The procedure has three steps: state the behaviour without a motive, ask what makes it the sensible thing to do, and name the lever that sets that context. | source: Morieux and Tollman's first rule, understand what your people do, and their questions for analysing context: whom do you depend on, and do they take the effect of their actions on you into account? |  |\n| p25 | example (table) | Common complaints map to levers in a repeatable way. | table: Complaint as stated \\| Behaviour without motive \\| Lever \\| What to look at. 'They never tell us what they change' \\| changes reach consumers after release \\| interface \\| is there any agreed channel, and who owns it. 'They escalate everything' \\| decisions travel two levels up \\| decision right \\| which decisions the team is permitted to make. 'They only care about their own roadmap' \\| cross-team work is deprioritized \\| incentive \\| what the last three promotions rewarded. 'That team is a bottleneck' \\| requests queue at one team \\| boundary \\| what the team owns that others need daily. | `example`: The three steps. → The steps applied to four complaints. |\n| p26 | analysis | When no lever explains the behaviour, a condition is missing, and a redesign will not supply it. |  | `contrast`: Complaints that resolve to a lever. → The cases that do not, and what that means. |\n\n### Anti-Patterns: Moving Boxes and Adding Functions\n\n**Controlling idea** (`analysis`, id `anti-patterns`): The common misuses of structure change something other than the lever that produces the behaviour: the reporting line, the number of functions, or the person.\n\n**Advances the thesis** (S4): Shows the failures the diagnostic procedure prevents and ties them to the named failure patterns.\n\n**Transition in:** `contrast`: The procedure used well. → What is commonly done instead.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | analysis | The Org Chart as Architecture and its repeated form, the Reorg as Strategy, move reporting lines and leave interfaces, decision rights and incentives as they were; replacing the person, as Corvane did, is the same error made on a smaller scale. | reasoning: A reporting line changes who writes someone's review; it changes nothing about how a rule change reaches another team.; source: Morieux and Tollman: never explain what people do by an irrational mind-set; doing so says more about the analysis than about the people. |  |\n| p28 | analysis | Adding a function for every new requirement makes the organization more complicated without making anyone cooperate. | source: Morieux and Tollman describe the organization as a machine with one routine: each new performance requirement gets a new dedicated function — a quality department, a coordinator, an interface role. | `additional_support`: Changing boxes. → Adding boxes. |\n\n### Where the Sources Disagree: How Far the Metaphor Goes\n\n**Controlling idea** (`counterargument`, id `limits-of-the-metaphor`): The architecture metaphor holds for describing and diagnosing an organization and fails if it is taken to mean that structure determines behaviour or that more specification is better.\n\n**Advances the thesis** (S5): States the limit of the chapter's own frame and resolves the tension with the two sources that warn against it.\n\n**Transition in:** `contrast`: Structure misused. → The warning from the chapter's own sources about how far design can go.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | counterargument | Two of this chapter's own sources warn about how far the design of an organization can go: Morieux and Tollman reject the belief that structure has a direct and predictable effect on performance, and Meadows holds that such systems can be understood and redesigned but not controlled. | source: The hard approach rests on the assumption that choosing the right structures yields the wanted performance; the authors also advise resisting pressure to clarify roles, decision rights and processes beyond a threshold, because too much clarity lets people avoid cooperating.; source: Meadows: self-organizing, nonlinear feedback systems are inherently unpredictable; all models fall short of the world they represent. |  |\n| p30 | refutation | The book's resolution is that the four levers set people's context and do not specify their actions, so the right amount of structure is the least that makes cooperation the sensible choice: explicit and narrow where the work is separable and the interface stable, deliberately overlapping where the work is interdependent and changing. | reasoning: A component in software has no interests and no memory; a team has both, so a boundary or decision right is an offer people respond to, not an instruction they execute.; table: Choice \\| What you gain \\| What you lose \\| Fits when. Explicit and narrow \\| speed, no duplicated work, clear accountability \\| cooperation across the line, initiative at the edges \\| the work is separable and the interface is stable. Deliberate overlap \\| people notice and cover the gaps \\| some duplicated effort, more negotiation \\| the work is interdependent and changing. | `problem_solution`: Two warnings about the limits of designing organizations. → How the book uses design without ignoring them, and the criteria for how explicit to be. |\n\n### Worked Example: The Two Calendars, Read Again\n\n**Controlling idea** (`example`, id `corvane-read-again`): Read through the four levers, Corvane's repeated failure was an Unowned Interface with three other gaps behind it, none of them the Mobile lead, and the fix worked because the three conditions happened to hold.\n\n**Advances the thesis** (S3, S4): Shows the levers used together on the opening case, including what the fix cost.\n\n**Transition in:** `example`: The model, its misuses and its limits. → The model applied to the case the chapter opened with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | example (table) | Each lever had a gap in 2021, and each got a specific change in 2022. | table: Lever \\| In 2021 \\| Change in 2022. Boundary \\| scheduling rules owned by no team; each client implemented them \\| rules moved into Core as one rule engine. Interface \\| none for rule changes \\| rule changes published as a versioned schema, reviewed in a weekly rules session owned by Core. Decision right \\| nobody decided what the rule was \\| Priya Nambiar decides scheduling and job-status rules with Web, Mobile and Integrations consulted; decisions recorded. Incentive \\| teams praised for shipping their own roadmap \\| a shared objective on schedule consistency across clients. |  |\n| p32 | analysis | The fix depended on conditions the redesign did not create: Core had the skill to build the rule engine, the client teams trusted the product manager enough to accept her decision, and the company's strategy made consistent schedules worth the cost. | scenario: Illustration: Samir Haddad already understood both the scheduling engine and the mobile sync; Priya Nambiar had worked with all three client teams since 2020; schedule consistency was the most frequent reason for customer escalations. | `additional_support`: Four gaps and four changes. → What had to be true already for the changes to work. |\n| p33 | analysis | After the change no third incident of the kind occurred, and the cost was that Core now owned more than it could comfortably understand. | scenario: Illustration: Core took on the rule engine with the same six engineers and its lead time for other work rose. | `cause_effect`: The changes and the conditions under them. → Their result and their cost. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI leaves the four elements and the four levers as they are and changes which of the three capacities is scarce; whether agents become components is not yet known.\n\n**Advances the thesis** (S1): Applies the chapter's vocabulary to AI with labeled claims and defers the evidence to Part XI.\n\n**Transition in:** `additional_support`: The model applied to a case from 2021. → Whether the model still applies when agents do part of the work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | analysis | The elements and levers do not depend on who or what produces the work; Emerging: coding agents take part in the flow of work without becoming components, because they produce changes and do not own outcomes, carry on-call or hold a decision right. | reasoning: Author's observation as of November 2026, labeled Emerging: in teams using agents, a person or team remains the owner of each change the agent produces. |  |\n| p35 | claim | Speculative: if implementation takes less of a team's attention, the scarce capacity moves to judgment and verification, which is the argument of Part XI. | reasoning: Labeled Speculative here; the published evidence for and against is weighed in the chapter Where the Constraint Moves. | `cause_effect`: Agents producing work inside the flow. → What that may do to the constraint. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The description and the levers are one tool used in two directions: the four elements say what is there, and the four levers say what can be changed, so a problem located in an element points to the lever that moves it, or to a condition no lever reaches.\n\n**So what:** Before changing a person, a reporting line or a headcount, the reader can ask which lever produces the behaviour, and can say in advance what a reorganization will leave untouched.\n\n**Callback:** The Mobile lead replaced in 2021 and the same failure eight months later. The reader can now say what stayed in place between the two incidents: an unowned rule, a missing interface, an unassigned decision and an incentive that rewarded each team's own roadmap.\n\n**Takeaway** (`course_of_action`): Take one recurring complaint in your organization, restate it as behaviour, and name the lever. The checklist that follows gives the questions.\n\n**Hand-off** to [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html): `problem_solution`: The organization as a system with four levers a redesign can pull. → Whom the system is for and how the work of pulling the levers should be run: as product work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis (list) | Established: systems keep their behaviour when their elements are replaced and change when their interconnections change, and behaviour in organizations is a rational response to goals, resources and constraints. |  |  |\n| p37 | synthesis (list) | Depends on context: how explicit to make boundaries and decision rights depends on how separable and how stable the work is, as the limits section set out. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p38 | synthesis (list) | The author's synthesis: the four levers and three conditions are this book's own arrangement of those sources, and the claim that attention, judgment and verification are the capacities to design for is the book's thesis, named here and argued from the chapter on flow onward. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p39 | recommendation (list) | Eight checks let the reader run the diagnosis on a problem of their own. |  | `sequence`: What to take away. → What to do with it. |\n| p40 | transition | The four levers say what can be changed and leave open for whom and how the changing should be done, which the next chapter answers by treating the organization as a product. |  | `problem_solution`: The organization described and the levers named. → The open question of whom the design is for and how the work of changing it is run. |\n\n## Non-goals\n\n- The three scarce capacities in full: how each runs out and how to tell which one is the constraint See [Flow and the Constraint](flow-and-the-constraint.html).\n- Who the organization's users are, outcomes of organizational change, and running a change as product work See [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- Conway's Law and how team structure shapes software See [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html).\n- How to size what a team owns and where to place a boundary See [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html).\n- Finding the constraint in a flow and Larson's team states See [Flow and the Constraint](flow-and-the-constraint.html).\n- Methods for allocating decision rights and recording decisions See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Evidence on what AI changes See [[where-the-constraint-moves]].\n- Stocks, flows and feedback-loop modelling as a technique See Meadows, Thinking in Systems, Larson, An Elegant Puzzle, on systems thinking.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-19** — Open with the repeated incident (the Second Calendar) and not with a definition of architecture, so the vocabulary arrives as an explanation. Rejected: Opening with Meadows' definition of a system; Opening with the hiring-wave slowdown, which the introduction and Part I closing already use\n- **2026-11-19** — Use Morieux and Tollman's critique of the hard approach as the chapter's 'Where the Sources Disagree', because it is the strongest argument in the author's own bookshelf against the chapter's frame. Rejected: Leaving the limits as a single caveat paragraph\n- **2026-11-19** — Larson's stocks-and-flows treatment of systems thinking is cited under Sources and left to chapter 5; this chapter uses Meadows directly. Rejected: A stocks-and-flows model of Corvane in this chapter\n- **2026-11-19** — Mermaid for the one figure, as the author's brief asks for Mermaid diagrams of org structures.\n- **2026-11-19** — The author accepted that the AI section rests on labeled observation and reasoning (Emerging, Speculative) with the evidence left to chapter 35, and confirmed Corvane's 2022 fix as ledger fact.\n- **2026-11-19** — After round 1 of the draft check, by the author's decision: the three-capacities section moves to directly after Four Elements (both flow readers found its position between behaviour and the levers unclear); the thesis lists three flows, work, information and decisions. Two wordings corrected: the sources warn about how far design can go, not against design; the verification example is a missing test of readiness, not a missing decision. Rejected: Keeping the capacities after behaviour and tying them forward\n- **2026-11-19** — After round 3 (ESCALATE, fault in the spec's order), by the author's decision: the three-capacities section is removed; the capacities are named and defined in one paragraph of Four Elements; the full treatment moves to flow-and-the-constraint. AC-2 reworded in the journal spec to match. Rejected: Moving the section again; Rewriting the puzzle's answer to use the capacities\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md — Corvane's stages, the Two Calendars, the Founder Queue, the Launch Queue.\n  - journal-spec.json, entry the-organization-as-a-system — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Donella H. Meadows, Thinking in Systems: A Primer (2008); author's Kindle notes, _input/bookshelf/docs/notes/thinking-in-systems.pdf — Definition of a system; persistence under substitution of elements; boundaries; constraints and growth; bounded rationality; seeking the wrong goal; limits of control.\n  - Yves Morieux and Peter Tollman, Six Simple Rules: How to Manage Complexity without Getting Complicated (2014); author's notes, _input/bookshelf/docs/notes/six-simple-rules.pdf — Behaviour as a rational solution in a context of goals, resources and constraints; adjustment costs; the hard approach; a function per requirement; the warning against over-clarifying roles and decision rights.\n  - Will Larson, An Elegant Puzzle: Systems of Engineering Management (2019); author's notes, _input/bookshelf/docs/notes/elegant-puzzle.pdf — Systems thinking as a management tool; cited, with the detail left to chapter 5.\n\n## Changelog\n\n- **2026-11-19** — Spec changed after round 3 by the author's decision: capacities section removed, one defining paragraph added to Four Elements, AC-2 reworded, roadmap promise, flow rationale and transitions updated, paragraphs renumbered. A new check cycle starts against this spec.\n- **2026-11-19** — Spec changed after round 1 (ESCALATE) by the author's decision: capacities section moved after Four Elements with the three affected transitions rewritten; flows wording; two evidence and transition wordings corrected; paragraphs renumbered. Draft revised to match; round 2 follows.\n- **2026-11-19** — Hand-off and closing paragraph now lead to the new chapter 2, the-organization-as-a-product, after the journal thesis gained the product-thinking lens; chapter numbers in text updated. The draft's closing paragraph must be rewritten and the draft re-checked.\n- **2026-11-19** — Retitled by the author from 'The Organization as an Architecture' to 'The Organization as a System That Can Be Architected'; permalink and folder changed to the-organization-as-a-system before first publication; question, claim and thesis statement reworded to say the organization is a system that can be architected like other systems. Sections and paragraphs unchanged.\n- **2026-11-19** — Mechanical fix before drafting: the three opening callouts (IN THIS CHAPTER, KEY POINTS, FAILURE PATTERNS) are page format, not paragraph units, and were removed from introduction.paragraphs so the spec aligns with the draft checker; paragraphs renumbered. No change to the argument.\n- **2026-11-19** — Revised after the flow rubric (behaviour before capacities, AI section as a coda after the worked example, anti-patterns and limits tightened, worked example tests the three conditions). Accepted by the author; open questions closed.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
