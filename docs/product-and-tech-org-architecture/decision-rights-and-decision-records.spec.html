<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The working definition of a decision right from chapter 1 and methods for allocating one.\n- **Know:** Larson's three leadership styles — policy, consensus, conviction — and when each fits.\n- **Know:** RFCs and decision records: what they contain and what makes them usable later.\n- **Believe:** Most stalled decisions are stalled because nobody knows whose they are.\n- **Be able to:** Allocate a decision right for a recurring decision.\n- **Be able to:** Choose a decision style for a given decision.\n- **Be able to:** Write a decision record another team can find, rely on and overturn.\n\n**Audience:** Executives (CTO, CPO, VP, Director) who must say who decides what in their organization, and managers and individual contributors who wait for those decisions and want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work: product managers, engineering managers, releases, on-call\n- From chapter 1 and the Part VI introduction: a decision right is one of four levers of organization design, and alignment needs explicit mechanisms\n- The book's failure-pattern names and Corvane, the fictional company the book follows\n\n**Does not yet know:**\n\n- decision right (the three-part working definition is restated)\n- required advice, as distinct from consent\n- Larson's three leadership styles: policy, consensus, conviction\n- nearest common leader\n- RFC\n- decision record\n- Drucker's generic and exceptional problems and his 'boundary conditions'\n- intent-based leadership\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a stalled decision, the reader says whose it should be, by which style it should be made and what the record must contain. *Probe:* Two groups have argued for four months about which of them owns customer notifications; both have built part of it. Using only this chapter: whose decision is this, how should it be made, and what gets written down? | `custom` | cold_reader | major |\n| AC-2 | The chapter addresses Six Simple Rules' warning against over-clarifying decision rights, raised in chapter 1, and says how much to specify. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** By what method are decision rights allocated, and how is a decision recorded so that it lasts?\n\n> **Claim:** Decision rights are allocated by naming, for each kind of decision that recurs or stalls, the role that has the information to make it, the people whose advice it must take and the place it is recorded — choosing between Larson's three styles, deciding by policy, by consensus or by conviction, according to how often the decision recurs and how much it is contested — and a decision lasts when its record states the options, the reasons and the conditions for revisiting it.\n\n**Disputed by:** The view that decisions should be made by consensus of those affected, and that naming a single decider is hierarchy that capable teams do not need.\n\n**So what:** A leader allocates rights only for decisions that recur or stall, records them briefly, and uses conviction sparingly and openly.\n\n**How and why:** Consensus works while the group is small and the stakes are shared; beyond that it gives a veto to whoever cares least about the cost of delay. A named decider with required advice keeps the information of many and the speed of one, and a record lets a later decision start from this one. Specifying every decision would remove the overlap that Morieux and Tollman show cooperation needs, which is why only recurring and stalled decisions are allocated.\n\n**Supporting claims**\n\n- **S1** — Most stalled decisions are stalled because nobody knows whose they are: a decision with no named decider can end only when everyone agrees or when it travels upward.\n- **S2** — A decision right is allocated by naming three things for a named kind of decision: the role that has the information to make it, the people whose advice it must take and the place it is recorded; and it is allocated only for decisions that recur or stall, because specifying every decision removes the overlap that cooperation needs.\n- **S3** — How the decision is made is chosen among Larson's three styles by how often the decision recurs and how much it is contested: policy for a decision that recurs, consensus for a rare one whose context is spread among people who can agree by a date, and conviction, used sparingly and openly by the nearest common leader after advice, for one that is contested or has stalled.\n- **S4** — A decision lasts when its record states the options, the reasons and the conditions for revisiting it, and when another team can find the record, rely on it and overturn it.\n- **S5** — Allocation fails in three recognizable ways: the right sits too high, the right sits with no one, or every decision is specified.\n\n## Role in the part\n\nMakes the decision-right lever operational and supplies the record on which planning and governance rely. Supports P6-1 of part `part-6`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in three-parts, allocate-what-recurs-or-stalls, three-styles, decision-record: what a right is, which decisions get one, how the decision is then made, how it is kept)\n\nAfter the callouts the reader meets a decision that waits although everyone involved has information and goodwill, so the missing owner is met as a puzzle. The definition follows because it names what was missing. Allocation comes before style because a style is chosen by whoever holds the right, and the warning against over-clarifying is answered inside the allocation pattern, where it decides how much to allocate; placed later it would let the reader allocate everything first. The record comes after the styles because it records a decision made by one of them. The failures follow the method so that each can be named as a part of the method skipped or overdone. The worked example comes last of the argument because its record uses every field and both of the styles that the scene needed; the AI section is a coda.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 a finished feature at Corvane waited a median of nine days to reach customers. Four people could say 'not yet': the product manager, the engineering manager, the head of support and the customer's account manager. Nobody could say yes.\n\n**Bridge:** Most readers have watched a decision go round a table of well-informed people for weeks, or go up to someone senior who knew least about it. → Both happen when the decision belongs to nobody; the question is how a decision comes to belong to someone, and how it is kept once made.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Decision rights are allocated by naming, for each kind of decision that recurs or stalls, the role that has the information to make it, the people whose advice it must take and the place it is recorded; the decision is then made by policy, by consensus or by conviction, Larson's three styles, according to how often it recurs and how much it is contested; and it lasts when its record states the options, the reasons and the conditions for revisiting it.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a decision at Corvane that waited because it was nobody's. *Kept in:* the-readiness-question.\n- Learn the three parts of a decision right. *Kept in:* three-parts.\n- Learn which decisions to allocate and how much to specify, against the warning of Six Simple Rules. *Kept in:* allocate-what-recurs-or-stalls.\n- Choose among Larson's three styles: policy, consensus and conviction. *Kept in:* three-styles.\n- Write a decision record that others can find, rely on and overturn. *Kept in:* decision-record.\n- Recognize three ways allocation fails. *Kept in:* anti-patterns.\n- Follow Corvane's readiness decision to its record. *Kept in:* worked-example.\n- Know what AI changes. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 a finished feature at Corvane waited a median of nine days for a yes that four people could withhold and nobody could give. | scenario: Corvane, the fictional company this book follows, 2024, 180 people: a finished feature waits a median of nine days; the product manager, the engineering manager, the head of support and the account manager can each say 'not yet'. |  |\n| p02 | claim | A decision that recurs or stalls is allocated by naming who decides, whose advice is required and where it is recorded, made by one of Larson's three styles, and kept in a record; the chapter takes these in that order. |  | `problem_solution`: A decision that belonged to nobody; from the Part VI introduction, the claim that alignment needs explicit mechanisms. → The first mechanism, who decides and how the decision is kept, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: A Finished Feature and Nobody to Say Yes\n\n**Controlling idea** (`example`, id `the-readiness-question`): At Corvane in 2024 a finished feature waited for someone to say it was ready, because four people could say 'not yet' and nobody could say yes, so the decision ended only by full agreement or by going up to the co-founder.\n\n**Advances the thesis** (S1): Gives the concrete stalled decision whose cause is a missing owner, which the chapter then repairs.\n\n**Transition in:** `elaboration`: The lead's short account of a feature that waited for a yes. → The situation in full: who had a say, how long it took and where the hard cases went.\n\n**Order of paragraphs** (`chronological`): What happened to a finished feature comes first, then how long it took and where the hard cases went, then what was missing; the diagnosis only reads as one after the wait has been counted.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2024 a finished feature at Corvane was made available to customers only when the team's product manager, its engineering manager, the head of support and the customer's account manager had all stopped objecting. | scenario: Corvane, 2024, 180 people, eleven product teams, after the launch queue was relieved (ledger: 'nobody could say who decides a feature is ready'; the longest wait was for someone to say a feature was ready). New illustrative detail: a feature's changes are in production and switched off for customers; four people have a say; any of them can say 'not yet'. |  |\n| p04 | description | In the last quarter of 2024 a finished feature waited a median of nine days, and five of fourteen features were settled in the weekly leadership meeting by Tomas Rell, the co-founder for whom every decision had waited in 2019. | scenario: New illustrative figures: fourteen features finished in the last quarter of 2024; median nine days from the last change in production to availability; five of the fourteen decided by Tomas Rell, co-founder and CTO, in the weekly leadership meeting. Ledger: the Founder Queue (2019, 12 people): every pricing, design and release decision waits for Tomas. | `cause_effect`: Four people who can each say 'not yet'. → How long that took and where the hard cases went. |\n| p05 | analysis | Nothing was missing at Corvane except the answer to whose decision readiness was, and in my experience that is the usual reason a decision stalls. | reasoning: Each of the four had real information (the customer's problem, whether the team can run it, whether support is briefed, what was promised); they met and talked; the wait remained. The author's experience, marked as such: most stalled decisions are stalled because nobody knows whose they are. | `cause_effect`: The nine days and the five features that went up. → What produced them: no owner, with information and goodwill both present. |\n\n### A Decision Right Has Three Parts\n\n**Controlling idea** (`definition`, id `three-parts`): A decision right answers three questions about a named kind of decision: which role decides, whose advice that role must take, and where the decision is written down; the role is the one that has the information, and advice is not consent.\n\n**Advances the thesis** (S2): Defines the thing to be allocated and the rule for placing it.\n\n**Transition in:** `problem_solution`: A decision that belonged to nobody. → What it means for a decision to belong to someone: the three parts of a decision right.\n\n**Order of paragraphs** (`prerequisite_order`): The definition comes first, then its three parts in the order of the definition, then the three parts applied to the scene; the table needs all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | A decision right, as chapter 1 defined it, is the agreed answer to three questions about a named kind of decision: who may make it, whose input they must take and where it is written down. | source: The working definition in [The Organization as a System That Can Be Architected](the-organization-as-a-system.html); 'a named kind' means the right covers a class of decisions (is this feature ready), not one instance and not a whole role. |  |\n| p07 | explanation | The first part names the role that has the information the decision needs, which usually means the role closest to the work. | source: Morieux and Tollman, Six Simple Rules: decisions 'made as close as possible to where the action takes place and where information is richest'.; source: David Marquet's intent-based leadership (Turn the Ship Around!; Leadership Is Language): the captain gives intent and the crew say 'I intend to' in place of 'request permission to'; the right to decide moves to where the information is. Author's record: [From Prompting to Intent: The Leadership Ladder for Working with AI](../ai-notes/leadership-ladder.html). | `elaboration`: Three questions. → The first: who, and the rule for answering it. |\n| p08 | explanation | The second part names the people whose advice the decider must take before deciding, and advice is neither consent nor a vote, which keeps the information of many with the speed of one. | reasoning: A decider who must ask hears what the affected people know; a decider who must obtain agreement hands each of them a veto. The advice process of [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html) is this second part applied to technical decisions. | `sequence`: Who decides. → Whose advice the decider must take, and what advice is not. |\n| p09 | example (table) | The third part names where the decision is written down, and the three parts together can be asked of any decision, as they are here of Corvane's readiness decision in 2024. | table: Three rows (who decides; whose advice is required; where it is written), columns: the question, what a good answer looks like, the answer at Corvane in 2024 (nobody; four people, each with a veto; a chat thread per feature). | `sequence`: The first two parts. → The third part and all three applied to the scene. |\n\n### Pattern: Allocate Only the Decisions That Recur or Stall\n\n**Controlling idea** (`process`, id `allocate-what-recurs-or-stalls`): Decision rights are allocated only for the decisions that recur or stall, with three things named and nothing said about how the work is done, which answers Morieux and Tollman's warning against over-clarifying.\n\n**Advances the thesis** (S2): Turns the definition into a procedure and says how much to specify.\n\n**Transition in:** `contrast`: A definition that could be applied to every decision in a company. → The warning against doing so, and the rule for which decisions to allocate.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The warning against clarifying comes first because it objects to the whole idea; the answer to it sets the amount to specify; the steps follow from the answer; users and measure close the pattern.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | counterargument | Morieux and Tollman warn against clarifying decision rights, because past a threshold clarity lets people comply with their own box and stop cooperating. | quotation: Six Simple Rules: 'Resist the pressure to clarify roles, decision rights, and processes.' Beyond a certain threshold, they write, clarity only encourages mechanistic compliance; their relay example of a runner who hands off 'at ninety-six meters, just as you said'; a request for clarity is frequently an attempt to avoid having to cooperate. Raised in [The Organization as a System That Can Be Architected](the-organization-as-a-system.html). |  |\n| p11 | recommendation | My answer to how much to specify is: only the decisions that recur or have stalled, and for each only the three parts, with nothing about how the work is done. | reasoning: The warning is about a threshold; a decision that has stalled or keeps being escalated is evidence that the overlap is not working for that decision. Required advice keeps the interdependence visible; everything not listed stays with the people doing the work. Morieux and Tollman also hold that no function should be protected by its decision rights from questioning, so a right stays open to challenge. The author's resolution and rule of thumb: one page per level. | `contrast`: The warning against clarity. → How much to specify, and why that amount stays under the threshold. |\n| p12 | process (list) | Allocating a right takes five steps: collect what stalled or was escalated, name the kind of decision, place it with the role that has the information, name the required advice, and write it down with a date to look again. | example: Five numbered steps; for a dispute about which of two groups owns something, the role that has the information is their nearest common leader, the lowest role above both. | `sequence`: Which decisions to allocate. → The steps for allocating one. |\n| p13 | recommendation | The pattern serves the people who wait for decisions and the people asked to make them, and it has worked when a decision waits less and people asked separately name the same decider. | reasoning: Users: teams that wait, and deciders. Measures: days a decision of that kind waits; how many go up a level; whether three people asked separately name the same decider. | `sequence`: The steps. → Whom the pattern serves and how to tell that it worked. |\n\n### Choosing How to Decide: Larson's Policy, Consensus and Conviction\n\n**Controlling idea** (`comparison`, id `three-styles`): The holder of a decision right still has to choose how to decide, and Larson's three styles, policy, consensus and conviction, are chosen by how often the decision recurs and how much it is contested.\n\n**Advances the thesis** (S3): Supplies the second half of the method: the style, and when each fits.\n\n**Transition in:** `sequence`: Who decides, with whose advice and where it is written. → How the decision is then made: three styles and a way to choose among them.\n\n**Order of paragraphs** (`prerequisite_order`): The three styles are named, then defined one at a time in Larson's order, which runs from the most recurring decision to the most contested; the figure and the table need all three definitions; users and measure close the pattern.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | Will Larson, in The Engineering Executive's Primer, names three leadership styles, which this chapter uses as three ways of making a decision: leading with policy, leading from consensus and leading with conviction. | quotation: Larson, Primer: 'three primary styles: leading with policy, leading from consensus, and leading with conviction'; policy for recurring decisions made consistently by many people, consensus for infrequent decisions with context spread across stakeholders, conviction for decisions with no clear proposal, where people are deeply at odds, or with outsized long-term impact. Author's record: [Leadership Styles](../grounded-engineering-executive/leadership-styles.html). |  |\n| p15 | definition | Policy is a written, predictable way of making a decision that recurs, and it is the style for any decision that will come back. | quotation: Larson: 'Leading with policy is creating a documented, predictable means for making a decision.' Drucker, The Effective Executive: the first question is whether a situation is generic or an exception, and 'All events but the truly unique require a generic solution. They require a rule, a policy, a principle.' His most common mistake: treating a generic situation as a series of unique events. | `elaboration`: Three styles. → The first: policy, for what recurs. |\n| p16 | definition | Consensus fits a rare decision whose context is spread among people who share the stakes, on Larson's two conditions that everyone is heard and a deadline holds, and it is the wrong default because past a small group it gives a veto to whoever cares least about the cost of delay. | quotation: Larson: 'Leading from consensus is pulling together the relevant set of stakeholders to identify a shared approach for a given problem'; make sure all stakeholders feel heard and set a tight timeline and hold to it; a senior, engaged party decides how the group works and the deadline.; reasoning: The author's argument against consensus as the default (the view the thesis disputes): in a small group with shared stakes everyone pays for delay; in a large one the person least affected by delay can hold longest. | `contrast`: A decision that recurs. → A decision that is rare and whose context is spread. |\n| p17 | definition | Conviction is one person taking in the context and deciding, and it fits a decision that is contested or has stalled; between two groups that person is their nearest common leader, who decides after written advice and says openly that this is how it was decided. | quotation: Larson: 'Leading with conviction is pulling all the relevant context into your head, thinking through the trade-offs, and personally making a definitive decision'; most useful where stakeholders have wholly incompatible views or the consequences are long-lasting. His two questions against micromanagement: are you carefully considering the feedback of those closest to the work, and are you adding friction to a team that would have reached a similar decision without you. The working steps (written reasoning, a tentative decision with a short time for objections, then final) are in [Leadership Styles](../grounded-engineering-executive/leadership-styles.html).; example: Chapter 14: in 2026, at about 500 people, Lena Brandt decided Corvane's message broker after written advice; in Larson's terms a decision by conviction made by the holder of the right (the author's reading). | `contrast`: Styles for decisions on which people can agree. → The style for a decision on which they cannot. |\n| p18 | process (figure) | Two questions choose the style: will this kind of decision come back, and can the people who hold the context agree by a set date. | figure: Mermaid flow, Figure 1: a decision that recurs or has stalled; will this kind of decision come back? yes: policy; no: can the people who hold the context agree by a set date? yes: consensus with a closer and a deadline; no, or the date has passed: conviction by the holder of the right, or by the nearest common leader. All three end in a record. | `sequence`: Three styles defined. → How to pick one. |\n| p19 | comparison (table) | Set side by side, the three styles differ in when they fit, in who decides and in what gets written. | table: Three rows (policy, consensus, conviction); columns: fits when, who decides, what is written, how it is misused. | `similarity`: The two questions. → The three styles compared on what each asks of the decider. |\n| p20 | recommendation | Choosing the style serves the decider and the people who must live with the decision, and it has worked when recurring decisions stop reaching the same person and a decision made by conviction is not reopened. | reasoning: Users: the holder of the right and the people affected. Measures: the share of a leader's decisions that are repeats of a kind already decided; decisions made by conviction per quarter (few); decisions reopened. | `sequence`: The styles and their comparison. → Whom the choice serves and how to tell it worked. |\n\n### Pattern: A Decision Record Another Team Can Find, Rely On and Overturn\n\n**Controlling idea** (`process`, id `decision-record`): A decision lasts when its record states the options, the reasons and the conditions for revisiting it, and when people who were not in the room can find it, rely on it and overturn it.\n\n**Advances the thesis** (S4): Supplies the record, the third part of the right, in a form that outlives the people who made the decision.\n\n**Transition in:** `sequence`: A decision made, by one of three styles. → How it is kept so that the next decision can start from it.\n\n**Order of paragraphs** (`prerequisite_order`): What an RFC and a record are comes first, then the record's fields, then the three properties that depend on those fields, then users and measure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | An RFC is the proposal circulated for comment before a decision, and a decision record is the short page that remains after it, and both serve any kind of decision, technical or otherwise. | example: RFC (request for comments): the proposal with its options, sent to the people whose advice is required; in Larson's consensus style the equivalent is the framing document. Decision record: chapter 14 treated the architecture decision record for technical decisions; the author's own records include non-technical decisions (working from home, a four-day week) in the same format: [Markdown Records as the Default Format for Technical Decisions, Strategies, and Discussions](../foundations/markdown-records.html). |  |\n| p22 | definition (table) | A record that lasts has eight short fields, five of which answer the elements Peter Drucker finds in every effective decision. | table: Eight rows: decision and status; kind of problem (recurring or one-off: Drucker's generic or exceptional); what the decision must satisfy (Drucker's 'boundary conditions', which are specifications and not this book's ownership boundaries); options considered and reasons (decide what is right before what is acceptable); advice received; action (Drucker: no decision has been made until carrying it out is someone's work assignment); revisit when (Drucker's feedback); decider and date. | `elaboration`: A short page. → What is on it, and where each field comes from. |\n| p23 | explanation | Three properties make the record usable later: it can be found, it can be relied on and it can be overturned. | reasoning: Find: one searchable place, a title that states the decision as a sentence. Rely on: a status, a date, a named decider and a stated scope. Overturn: a revisit condition, the name of the role that can reopen it, and the rule from chapter 14 that a record is superseded and never edited. | `cause_effect`: The fields. → What the fields make possible for a later reader. |\n| p24 | recommendation | The record serves the people who were not in the room, and it has worked when a later team finds it in minutes and a settled decision is reopened only through its revisit condition. | reasoning: Users: the next decider, new joiners, teams affected. Measures: time to find the record of a decision made last year; decisions re-argued without new evidence; records superseded. | `sequence`: The properties. → Whom the record serves and how to tell it worked. |\n\n### Anti-Patterns: The Ladder, the Stall and the Chart of Everything\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Allocation fails in three ways: the right stays too high, the right belongs to no one, or every decision is charted.\n\n**Advances the thesis** (S5): Lets the reader recognize each failure and connects two of them to the book's failure patterns.\n\n**Transition in:** `contrast`: The method as it should work. → Three ways it fails.\n\n**Order of paragraphs** (`grouping`): One paragraph per failure: the two the scene showed, in the order too high and with no one, then the one that comes from applying this chapter too hard.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | analysis | The Escalation Ladder is a right that sits above its information, and it usually began as the right arrangement and was not moved when the organization grew. | scenario: The Founder Queue (2019, 12 people): every pricing, design and release decision waited for Tomas Rell. Priya Nambiar's 2022 right to decide scheduling rules (about 45 engineers) stayed with her as CPO of about 500 people until she handed it to the Scheduling team in 2026 (told in [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html)). |  |\n| p26 | analysis | The Consensus Stall is a decision with no named decider, or a consensus run without a closer and a deadline. | reasoning: Signs: meetings that end by scheduling another; a settled decision reopened by whoever was absent. The remedy is to name the decider, or to give the consensus Larson's deadline and, when it passes, move to conviction. | `contrast`: A right that sits too high. → A right that sits with no one. |\n| p27 | analysis | The chart of everything assigns several roles to every decision in the company, and it produces the box-checking Morieux and Tollman warn of. | reasoning: A matrix of all decisions against all roles. Named frameworks for assigning decision roles, such as RAPID from Bain and DACI, are widely known; they are not among the author's sources and the chapter does not describe them; the fault is in applying any such scheme to every decision. | `contrast`: Too little allocation. → Too much. |\n\n### Worked Example: Who Says a Feature Is Ready\n\n**Controlling idea** (`example`, id `worked-example`): In 2025 Corvane's CEO settled by conviction, after written advice, whose decision readiness is, the answer was a policy for the recurring decision, and the record of it shows every part of the method.\n\n**Advances the thesis** (S2, S3, S4): Applies allocation, style and record to the decision of the opening and supplies a filled-in record.\n\n**Transition in:** `example`: The method and its failures. → All of it applied to the decision the chapter opened with.\n\n**Order of paragraphs** (`chronological`): The path of the question to the CEO, then how she decided, then the record, then what the record shows, then the result; the record is shown before it is interpreted.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | description | In 2025 the readiness question went from a working group that could not agree to a disagreement between the CPO and the CTO, and the two took it together to Ines Okafor, the CEO and their nearest common leader. | scenario: Corvane, 2025, growing from 180 toward 500 people. Ledger: the question was placed on Corvane's own roadmap after the 2024 brief; the 2025 page of chapter 18 lists who decides what between CPO and CTO and has no row for readiness; a disagreement between the two executives goes to the CEO from both within five working days with one page; four such disagreements reached her in the two quarters after the page. New: a working group of two product managers and two engineering managers met four times in the first half of 2025 without a deadline or a closer and produced two proposals; Priya Nambiar held that the product manager should decide, Tomas Rell and Dario Vance that the engineering manager should; this was one of the four. |  |\n| p29 | description | Ines Okafor decided by conviction in nine working days: she took written advice from the people closest to the work, announced a tentative decision with a week for objections, and then made it final. | scenario: New illustrative detail: written advice from two product managers, two engineering managers, the head of support, the head of sales and Lena Brandt, who owns the readiness checks; tentative decision; one week; final nine working days after the page reached her. The steps are Larson's conviction steps in the author's working version, [Leadership Styles](../grounded-engineering-executive/leadership-styles.html). | `sequence`: The decision arrives at the CEO. → How she made it. |\n| p30 | example (table) | The record of her decision fits on one page and can be copied field by field. | table: The filled-in record, eight fields: decision (readiness is two decisions: ready to run, decided by the team's engineering manager by a written rule; available to customers, decided by the team's product manager after required advice from the engineering manager, the head of support and, for a promised feature, the account manager; advice within two working days, silence does not block; changes to what the product promises a customer go to the CPO); kind of problem; must satisfy; options and reasons; advice received; action; revisit when; decider and date. | `sequence`: The decision made. → The page that records it. |\n| p31 | analysis | The record holds two decisions made in two styles: a one-off decision about whose readiness is, made by conviction, and a policy under which the recurring decision is made close to the work. | reasoning: The CEO did not decide whether any feature is ready; she decided the allocation, which sits above both parties, and the allocation places the recurring decision with the roles that have the information. The three parts of the right are each named in the record. | `elaboration`: The record. → What it shows. |\n| p32 | description | Two quarters later a finished feature waited a median of two days where it had waited nine, one feature had reached the leadership meeting, and one had been made available against support's advice and withdrawn for a week. | scenario: New illustrative figures: median wait nine days to two; one feature in two quarters reached the leadership meeting, under the clause on what the product promises a customer; one feature was made available against the head of support's advice, drew support calls and was withdrawn for a week; at the review the right was kept and a line was added to the record: advice not followed is written down with the reason. | `cause_effect`: The allocation and its record. → What happened in the two quarters after. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents make written decision rights and records more useful, because agents read them, and they may raise the number of decisions that reach each decider, which favors policy.\n\n**Advances the thesis** (S3, S4): Tests the method against work done partly by agents, with labeled claims.\n\n**Transition in:** `additional_support`: The method among people. → The same method when agents do part of the work.\n\n**Order of paragraphs** (`chronological`): What is practised now comes before what may follow from it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | analysis | Emerging: teams give their agents the decision records as context, and an agent holds no decision right, so a written record is how a decision reaches work that no person briefed. | reasoning: The author's observation as of November 2026, not a measurement; the label scheme is announced in the first sentence. |  |\n| p34 | claim | Speculative: if agents produce more changes, more decisions of each kind reach the same deciders, and the share that must be settled by policy rises. | reasoning: Reasoning from the constraint argument of Part XI; would be confirmed where teams report decision queues growing with change volume; evidence weighed in [[where-the-constraint-moves]]. | `cause_effect`: Agents that read records. → What a larger volume of work does to the deciders. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Allocation, style and record are one method seen at three moments: before the decision (whose it is and whose advice it needs), during it (policy, consensus or conviction) and after it (a page that lets the next decision start from this one); a decision is slow or reopened when one of the three moments was skipped.\n\n**So what:** A leader allocates rights only for decisions that recur or stall, records them briefly, and uses conviction sparingly and openly.\n\n**Callback:** Corvane's finished feature that waited nine days because four people could say 'not yet' and nobody could say yes. The reader can now say what was missing (an owner), who should have supplied it (the nearest common leader, by conviction) and what turned the answer into something that lasts (a policy and a one-page record).\n\n**Takeaway** (`course_of_action`): List last quarter's escalations and reopened decisions, allocate a right for the kinds that recur, choose the style for each stalled one, and write one record you can find again.\n\n**Hand-off** to [Planning](../grounded-engineering-executive/planning.html): `example`: Decision rights in general. → Planning as the largest recurring set of decisions, and how its rights are divided.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | synthesis (list) | Established: the sources agree that recurring decisions need a rule, that decisions belong near their information, that a decision is not made until action is assigned and feedback is built in, and that too much clarity harms cooperation. |  |  |\n| p36 | synthesis (list) | Depends on context: which style fits, how much to write down and who the decider is depend on recurrence, contest, size and trust. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p37 | synthesis (list) | The author's synthesis: allocating only what recurs or stalls, reading Larson's styles as ways of deciding chosen by recurrence and contest, the nearest common leader, and the eight-field record are this book's own arrangement. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p38 | recommendation (list) | Eight checks let the reader allocate, decide and record in their own organization. |  | `sequence`: What to take away. → What to do with it. |\n| p39 | transition | Corvane's feature waited because the decision was nobody's, and planning is the largest recurring set of decisions in a company, with rights that have to be divided in the same way. |  | `example`: Decision rights in general. → Planning as the largest recurring set of decisions, and how its rights are divided. |\n\n## Non-goals\n\n- The advice process and architecture decision records for technical decisions; governance instruments See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- The division of product decisions between leaders and teams See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- Who decides what among product, engineering and design; the executives' list of decisions See [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html), [Executive Roles and Reporting Lines](executive-roles-and-reporting-lines.html).\n- Planning as a set of decisions; the Nine-Week Plan See [Planning](../grounded-engineering-executive/planning.html).\n- The forums and written artefacts in which decisions are made and carried See [[operating-cadence]].\n- Trust and conflict as conditions for commitment See [[trust-conflict-and-psychological-safety]].\n- A description of RAPID, DACI or other named decision-role frameworks\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts (the 2024 readiness wait of nine days and five of fourteen features decided by Tomas Rell; the 2025 working group; Ines Okafor's decision in nine working days and its record; the result two quarters later) are appended to the ledger; the author should confirm them.\n- RAPID and DACI are named only as widely known frameworks and not described (gap sources). The author may want a primary description read and a comparison added.\n- The reading of chapter 14's broker decision as conviction in Larson's sense is the author's-voice interpretation; confirm.\n- Marquet's intent-based leadership is used through Leadership Is Language (Kindle notes) and the author's record leadership-ladder; Turn the Ship Around! is named but its notes are not in the inputs.\n\n## Decision log\n\n- **2026-11-19** — Use Corvane's open question 'who decides a feature is ready' (2024, resolved 2025) as the one case that opens the chapter and is the worked example. Rejected: The journal spec's probe case (customer notifications), which the cold reader must meet fresh; The CTO and CPO drawings, which chapter 18 tells; The Founder Queue as the main case, which is at a size where the founder deciding is right\n- **2026-11-19** — Answer the Six Simple Rules warning inside the allocation pattern, with no separate 'Where the Sources Disagree' section. Rejected: A separate section after the patterns, which would let the reader allocate everything before being told not to\n- **2026-11-19** — Treat Larson's leadership styles as ways of making a decision and say so; treat chapter 14's advice process as the second part of the right, valid under every style. Rejected: Presenting the advice process as a fourth style\n- **2026-11-19** — Name RAPID and DACI only as widely known names. Rejected: Describing their roles from memory\n- **2026-11-19** — Rename Drucker's 'boundary conditions' as 'what the decision must satisfy' in the record, noting his term once, because 'boundary' has one sense in this book. Rejected: Using 'boundary conditions' as a field name\n\n## Sources\n\n- **Internal**\n  - grounded-engineering-executive/leadership-styles; foundations/markdown-records and architecture-advisory-forum; ai-notes/leadership-ladder; decisions-log — The author's working versions: steps for each style, the record format, examples of recorded non-technical decisions.\n  - _research/scenario-ledger.md — The Founder Queue, the open readiness question, Priya Nambiar's rule right, the 2025 page and the broker decision; this chapter appends the readiness decision.\n- **External**\n  - Will Larson, The Engineering Executive's Primer (2024); author's Kindle notes, _input/bookshelf/docs/notes/engineering-executive.pdf — The three leadership styles and when each fits; the two questions against micromanagement; structured escalation.\n  - Peter F. Drucker, The Effective Executive (first published 1967); author's Kindle notes, _input/bookshelf/docs/notes/effective-executive.pdf; the author's checklists 'Decision-Making Process' and 'Effective Decisions' in _input/checklists/data/data.json — Generic and exceptional problems; boundary conditions; what is right before what is acceptable; action built into the decision; feedback.\n  - Yves Morieux and Peter Tollman, Six Simple Rules (2014); author's Kindle notes, six-simple-rules.pdf — The warning against clarifying roles, decision rights and processes; decisions made close to the action; contestable functions.\n  - L. David Marquet, Leadership Is Language (2020) and Turn the Ship Around! (2012); author's Kindle notes, leadership-language.pdf — Intent-based leadership: 'I intend to' in place of 'request permission to'.\n\n## Changelog\n\n- **2026-11-19** — Spec created from the journal-spec entry.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';

        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
