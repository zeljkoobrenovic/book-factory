<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The triad and the risk each member is accountable for: value and viability, feasibility, usability.\n- **Know:** How the triad repeats at team, group and executive level.\n- **Know:** Its three failure forms: product as order-giver, engineering as veto, design as decoration.\n- **Believe:** The triad is a decision-right arrangement, and it fails when it is treated as a meeting.\n- **Be able to:** Say who decides what in a triad and what the other two must be asked.\n- **Be able to:** Diagnose which failure form a described triad shows.\n- **Be able to:** Set up the triad at group level.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a described product team, the reader names the triad's failure form and what would correct it. *Probe:* In a team, the product manager writes detailed tickets from customer requests, engineers estimate and build them, and the designer is asked to 'make it look good' at the end. Which failure form is this, and what would you change? | `custom` | cold_reader | major |\n| AC-2 | The chapter states how this division of decisions fits with chapter 12's line between leaders and teams. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How should product, engineering and design share decisions at each level?\n\n> **Claim:** Product, engineering and design should share decisions as a triad at each level — team, group and executive — in which product is accountable for whether the thing is worth building, engineering for whether it can be built and run, and design for whether people can use it; each decides in its own area after hearing the other two, and the arrangement fails in three recognizable ways, when product gives orders, when engineering only vetoes, or when design is brought in to decorate.\n\n**Disputed by:** The single-owner view, in which one role, usually the product manager, owns the product and the others execute, because shared accountability is no accountability.\n\n**So what:** A leader appoints the three together at every level, tells each which risk is theirs, and treats a level with one of the three missing as an incomplete structure.\n\n**How and why:** Each of these risks, which follow Cagan's product risks with value and viability taken together under product, can sink a product and each needs different knowledge to judge, so one person deciding all three decides two of them without the information. Naming one accountable role per risk keeps accountability single while the decision is shared.\n\n**Supporting claims**\n\n- **S1** — A product can fail on any of three risks, whether it is worth building, whether it can be built and run, and whether people can use it, and judging each takes knowledge that only one of the three roles has.\n- **S2** — The triad is a decision-right arrangement: one role is accountable for each risk and decides in its own area after asking the other two, which keeps accountability single while the decision is shared; it divides the team's side of chapter 12's line and is not a meeting.\n- **S3** — The same three risks recur wherever product decisions are made, so the triad repeats at team, group and executive level, and a level with one of the three missing is an incomplete structure.\n- **S4** — A leader sets the triad up by appointing the three together, telling each which risk is theirs, writing down who decides what and agreeing how a disagreement is escalated; the group level is where this is most often missing.\n- **S5** — The triad fails in three recognizable forms, product as order-giver, engineering as veto and design as decoration, each of which leaves a risk unjudged, and the single-owner view that produces the first confuses answering for the outcome with deciding every risk.\n\n## Role in the part\n\nShows the joining of product and engineering, with design, repeated at every level below the top. Supports P5-2 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in three-levels: the same triad is shown from the executive level down to the team)\n\nThe reader first sees one feature pass through three roles with nobody judging whether it was worth building, then the three risks and the arrangement that assigns them, then where the arrangement repeats, then the two acts by which a leader sets it up. The failure forms are named after the patterns because each is one member leaving its risk unjudged, which cannot be said before the risks are assigned; the single-owner objection follows the failure it produces; the worked example applies the group pattern and the rule that a no carries its condition, and it comes after the objection so that the reader meets the case with the single-owner view already answered; the AI section tests the finished model. Starting with the failure forms would name three symptoms before the reader knows what each role is for.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 Corvane's Dispatch team shipped a technician skills matrix on the promised date. A product manager, eight engineers and a designer had all worked on it, and none of them had been asked whether it was worth building, whether its important half could be built, or whether a planner could use it.\n\n**Bridge:** Most readers have worked in a team where the product manager writes the tickets, the engineers estimate them and the designer is asked to make the result look good. → All three roles are present in such a team and none of the three risks is judged by the person who could judge it; the question is how the three should share decisions.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Product, engineering and design share decisions as a triad at team, group and executive level: product is accountable for whether the thing is worth building, engineering for whether it can be built and run, design for whether people can use it; each decides in its own area after asking the other two, and the arrangement fails when product gives orders, engineering only vetoes, or design is brought in to decorate.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See one Corvane feature pass through three roles without any of its risks being judged. *Kept in:* one-feature-three-roles.\n- Learn the three risks, the role accountable for each, what each decides and what it must ask the other two, and how this fits chapter 12's line. *Kept in:* three-risks.\n- See the triad repeat at team, group and executive level. *Kept in:* three-levels.\n- Learn two patterns: appointing the three together in a team, and setting up the triad at group level. *Kept in:* pattern-appoint, pattern-group.\n- Recognize the three failure forms. *Kept in:* anti-patterns.\n- Weigh the single-owner view against the triad. *Kept in:* where-the-sources-disagree.\n- Follow one Corvane product group through setting up its triad. *Kept in:* worked-example.\n- Know what AI changes about the three roles. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 a Corvane team with a product manager, engineers and a designer shipped a promised feature on its date, and each of the three had done a job without anyone judging whether the feature was worth building, could be built where it mattered, or could be used. | scenario: Corvane, 2024, 180 people: the Dispatch team ships the technician skills matrix promised to a telecom installer for September; the product manager wrote the tickets, the engineers estimated and cut scope, the designer saw the screens at the end; at the end of the year only the customer that asked uses it. |  |\n| p02 | claim | Product, engineering and design should share decisions as a triad at every level, each accountable for one risk and deciding in its own area after asking the other two, and the chapter shows the risks, the levels, two patterns, the three failure forms, the single-owner objection, one worked case and what AI changes. |  | `problem_solution`: Three roles that each did a job and judged nothing. → The arrangement that gives each a risk to judge, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: One Feature, Three Roles\n\n**Controlling idea** (`example`, id `one-feature-three-roles`): At Corvane in 2024 one promised feature passed from a product manager who wrote orders to engineers who could only say no and a designer who came last, and the result shows that having the three roles in a team is not the same as having the three decide.\n\n**Advances the thesis** (S5): Gives the case that the failure-forms section later names form by form.\n\n**Transition in:** `elaboration`: The lead's short account of the skills matrix. → The feature in full: where it came from, what each role did and what came of it.\n\n**Order of paragraphs** (`chronological`): The promise comes first because everything the team did answered it; the three roles follow in the order they touched the feature, and the result last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | The skills matrix was one of forty-one features Corvane promised to named customers in 2024, and it reached the Dispatch team as a row on the roadmap with a customer and a month. | scenario: Ledger: 2024, 180 people, eleven product teams; the roadmap is a list of forty-one promised features, rows added by sales and account managers; one row is 'technician skills matrix (a telecom installer, September)'. New: the row went to Dispatch (eight engineers, its own product manager, a designer shared with Scheduling). |  |\n| p04 | description | Each of the three roles then did its work in turn: the product manager turned the account manager's notes into tickets for a skills grid and a dispatch board that uses it, the engineers estimated them and cut the board to keep the date, and the designer was shown the built grid three weeks before release. | scenario: New, Dispatch 2024: the product manager wrote 23 tickets from the account manager's notes (a grid of technicians against skills, edited by a planner; the dispatch board to offer only technicians with the skill a job needs). The engineering manager's estimate ran to November; in one meeting the board part, which needed a change to the assignment logic, was cut to keep September. The shared designer saw the built grid three weeks before release and changed labels, spacing and colors. | `sequence`: A feature decided before it reached the team. → What each of the three roles did with it. |\n| p05 | cause_effect | The feature shipped in September and by the end of 2024 only the customer that had asked used it, and there planners still assigned jobs from memory, because nobody in the team had judged whether the grid without the board was worth building. | scenario: Ledger: 38 of 41 features shipped by the promised date; 26 were used only by the customer that asked. New: the skills matrix is one of the 26; the telecom installer's planners filled in the grid and went on assigning from memory, because the board did not use it. | `cause_effect`: Three roles working in sequence. → What that produced, and what was missing. |\n\n### Three Risks, Three Accountable Roles\n\n**Controlling idea** (`definition`, id `three-risks`): A product can fail on three risks, each needs different knowledge to judge, and the triad makes one role accountable for each and has it decide in its own area after asking the other two, which is a decision right and not a meeting.\n\n**Advances the thesis** (S1, S2): States the chapter's model: the risks, who is accountable for each, what deciding after asking means, and how the arrangement fits chapter 12's line.\n\n**Transition in:** `problem_solution`: A feature whose risks nobody judged. → What those risks are and who should judge each.\n\n**Order of paragraphs** (`prerequisite_order`): The risks are defined before the roles that answer for them, the roles before the table of who decides and asks what, the reason before the claim that the arrangement is a decision right, and the fit with chapter 12 last because it needs the whole arrangement.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Marty Cagan names four risks a product idea carries, value, usability, feasibility and business viability, and this book takes the first and the last together as one question, whether the thing is worth building. | source: Cagan's article lists value risk (whether customers will buy it or users will choose to use it), usability risk (whether users can figure out how to use it), feasibility risk (whether engineers can build it with the time, skills and technology they have) and business viability risk (whether the solution works for the various aspects of the business). The book adds 'and run' to feasibility as the author's extension. |  |\n| p07 | definition | The triad is the product manager, the engineering lead (a tech lead or an engineering manager, whoever answers for feasibility) and the designer of one team, each accountable for one risk: product for whether the thing is worth building, engineering for whether it can be built and run, design for whether people can use it. | source: Cagan assigns value and viability to the product manager, usability to the product designer and feasibility to the lead engineer. The word triad is common usage and is the one the author's record right-team uses. Who the engineering member is (tech lead or engineering manager) varies; it is whoever answers for feasibility. | `elaboration`: The risks. → The role accountable for each, and the name of the arrangement. |\n| p08 | comparison (table) | For each member the table gives the risk, what the member decides, and what it must ask the other two before deciding. | table: Member \\| Risk \\| Decides \\| Must ask first. Product manager \\| worth building (value, viability) \\| which problem inside the team's outcome comes next; whether a solution is worth building; when to drop it \\| engineering: what it costs and what has become possible; design: what users did when they tried it. Engineering lead \\| can be built and run (feasibility) \\| how it is built; whether it can be built with the time and skills; whether it is ready to run \\| product: which part matters most to the customer; design: which parts of the flow cannot change. Designer \\| can be used (usability) \\| how it works for the user: the flow, the words, the screens \\| product: who the user is and what they must get done; engineering: what is cheap, what is costly, what the technology allows. | `elaboration`: Three roles with one risk each. → What each decides and must ask. |\n| p09 | explanation | One role is accountable for each risk because each risk takes different knowledge to judge, so one person deciding all three decides two of them without the information. | reasoning: The product manager knows the customers and the business; the engineers know what the technology allows and what running it costs; the designer has watched users try it. In the scene one document, the 23 tickets, fixed all three risks; only value was the product manager's to judge, and she had taken even that from an account manager's notes. The author's record product-engineering-partnership (org-design) makes the same point: a perspective that arrives only at the end has already weakened the decision. | `cause_effect`: Who decides what. → Why the decisions are divided this way. |\n| p10 | explanation | A solution goes ahead only when each of the three has judged its own risk acceptable, and a member who says no owes the other two the condition under which it would say yes, which keeps accountability single while the decision is shared. | reasoning: Author's synthesis: each risk has exactly one accountable role, so nobody can say afterwards that the risk was everyone's; the decision to build is shared because it needs three judgments. The condition attached to a no is what separates a judgment from a veto. | `elaboration`: One accountable role per risk. → How three separate judgments make one decision. |\n| p11 | claim | The triad is therefore a decision right in the sense of chapter 1, and a weekly meeting of the three is only where the right is exercised. | reasoning: Chapter 1 defines a decision right as the agreed answer to who may make a named kind of decision, whose input they must take and where it is recorded. The author's rituals catalogue has a 'Product Triad Sync': weekly, sixty minutes, product manager, engineering lead and design lead, with resolved decisions and explicit ownership as outputs. A team can hold that meeting every week while the product manager still writes all the tickets. | `conclusion_summary`: Three judgments and one decision. → What kind of thing the arrangement is, and what it is not. |\n| p12 | explanation | Chapter 12 drew a line between what leaders decide and what the team decides, and the triad divides the team's side of that line among three roles, so the two divisions cross and do not compete. | reasoning: Chapter 12: leaders decide which customers and problems matter, their order and the measure; the team decides the solution and answers for the outcome, and that chapter treated the three roles as one unit. Chapter 12's line runs between levels; the triad's lines run between functions at one level. Above the team the same three functions divide the leaders' side. | `additional_support`: The triad as a decision right. → How it fits with the other decision right the book has drawn for product work. |\n\n### The Same Triad at Three Levels\n\n**Controlling idea** (`description`, id `three-levels`): The three risks recur wherever product decisions are made, so the triad repeats at team, group and executive level with the same accountabilities and larger objects of decision, and a level with one of the three missing is an incomplete structure.\n\n**Advances the thesis** (S3): Extends the arrangement from the team to every level and states the test of completeness.\n\n**Transition in:** `elaboration`: The triad in one team, on the team's side of chapter 12's line. → The same three functions on the leaders' side, at group and executive level.\n\n**Order of paragraphs** (`large_to_small`): The figure and the table both run from the executives down to the team, the direction in which problems are handed over; the sources follow the table they qualify, and the cost of a missing member comes last because it presupposes the full grid. Stating the missing-member test first would apply a grid the reader has not seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | description (figure) | The same three accountabilities appear at the executive level, at the level of a group of teams and in the team, and each function keeps its own line from level to level. | figure: Mermaid flowchart, three rows: executive (CPO; CTO or VP Engineering; head of design), group (group product lead; engineering director; design lead), team (product manager; engineering lead; designer). Horizontal links inside each row; vertical links down each function. |  |\n| p14 | comparison (table) | What changes from level to level is the thing decided: the outcomes, the capacity and the shape of the organization at the top, the division of an outcome among teams in the group, and a solution in the team. | table: Level \\| Product is accountable for \\| Engineering for \\| Design for \\| Decided together. Executive \\| which outcomes are worth the company's capacity \\| whether the organization and its technology can deliver and run them \\| whether the product as a whole can be used and holds together \\| outcomes and their order, capacity shares, which teams exist. Group \\| how the group's outcome is divided into problems for its teams \\| which team builds what and in what sequence, within engineering strategy \\| how a task that crosses the group's teams works for the user \\| the group's plan, cross-team solutions. Team \\| whether a solution is worth building \\| whether it can be built and run \\| whether people can use it \\| the solution. | `elaboration`: The same roles at three levels. → What each level decides. |\n| p15 | evidence | The sources support the upper levels in part: Empowered has product, design and engineering leaders shape the team topology together, and Larson names product and design among the peer functions an engineering executive works with, while the three risks applied above the team are my extension. | source: Empowered, in the author's record team-topology: topology is shaped jointly by product, design and engineering leaders. Larson, The Engineering Executive's Primer: Product, Design and Sales are named as functions positioned for strategic partnership with Engineering. Neither source assigns the risks at group or executive level. | `additional_support`: The table of levels. → Which of it the sources say and which is the author's. |\n| p16 | cause_effect | A level with one of the three missing is an incomplete structure, because the missing risk is then judged by one of the other two without the knowledge, or it travels up to the level that has all three. | reasoning: Typical case: a product group drawn in the engineering line has a director and no product or design lead (where its questions then go is told once, in the group pattern). Chapter 8's Corvane count (seven designers for eleven teams in 2024) is the team-level form. | `cause_effect`: Three functions at every level. → What happens at a level where one is absent. |\n\n### Pattern: Appoint the Three Together and Name Each Risk\n\n**Controlling idea** (`process`, id `pattern-appoint`): A leader sets up a team's triad by appointing the three at the same time, telling each which risk is theirs, writing down who decides what, and agreeing in advance how the three escalate a disagreement together.\n\n**Advances the thesis** (S4): Turns the arrangement into the act a leader performs for one team, with its user and outcome measure.\n\n**Transition in:** `sequence`: The arrangement and where it repeats. → The first of two patterns that put it in place: one team.\n\n**Order of paragraphs** (`prerequisite_order`): The appointment and the page come before the escalation rule, which is for the cases the page does not settle; the user and the measure close the pattern.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | process (list) | The setup has four steps: appoint the three at the same time, tell each one which risk is theirs, have them write the table of who decides and who is asked for their own team, and have them take part together in discovery before any solution is fixed. | reasoning: Author's recommendation. Appointing together matters because a product manager who arrives first writes the plan the others inherit; the record right-team has new teams start with a product manager in place and design as a peer with its own reporting line; Empowered (record team-topology) wants designers in the team and not ticketed in from a pool. |  |\n| p18 | process | For the disagreements the page does not settle, the three agree beforehand to escalate together, a rule Larson describes for executives and I apply at every level. | source: Larson describes a structured escalation he credits to LinkedIn: agree to resolve the disagreement within five days; if that fails, escalate together with one shared document, and commit to the direction given. Larson writes about peer executives; using it for a team's or a group's triad is the author's extension. | `additional_support`: The page of who decides. → The rule for what the page leaves open. |\n| p19 | recommendation | The pattern is for the team's three leads and the managers who appoint them, and it has worked when each of the three can say whose risk a current question is, and when fewer solutions are changed late for a reason one of the three could have given at the start. | reasoning: Author's measures: ask the three separately who decides a current open question; count the pieces of work in a quarter that were cut, redesigned or rebuilt after building began, and for each, which member's question would have caught it. | `conclusion_summary`: The steps and the escalation rule. → Whom the pattern is for and how to tell that it worked. |\n\n### Pattern: Set Up the Triad at Group Level\n\n**Controlling idea** (`process`, id `pattern-group`): At group level the triad is usually missing because a group is drawn in one function's line, and it is set up by naming a product lead and a design lead beside the engineering director and giving the three a written list of the decisions that cross the group's teams.\n\n**Advances the thesis** (S3, S4): Applies the setup to the level where it is most often absent, which the reader is asked to be able to do.\n\n**Transition in:** `similarity`: The setup for one team. → The same setup one level up, where one or two of the three usually do not exist yet.\n\n**Order of paragraphs** (`problem_solution`): Why the level is usually incomplete comes first, because the steps answer it; the steps follow, then the user and the measure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | cause_effect | A group of teams is usually created in one function's reporting line, most often engineering's, so it gets a director and the questions that cross its teams in product and design have no one at that level to decide them. | reasoning: Author's observation of how groups form: the group appears when one manager has too many teams, so the new role is a manager of managers in that function. Product managers and designers keep reporting to their own heads. Cross-team product questions climb to the head of product; cross-team design questions are settled team by team. |  |\n| p21 | process (list) | The setup has five steps: list the decisions of the last quarter that crossed the group's teams, name a product lead and a design lead for the group, appoint them with the director as three, write who decides each kind of listed decision and who is asked, and agree the joint escalation to the executives. | reasoning: Author's recommendation. The list comes first because it shows whether the group has enough cross-team decisions to need the roles; in a small group the lead roles are part-time duties of a senior product manager and a senior designer. The lead roles are decision roles and need not be reporting lines. | `problem_solution`: A level with only one of the three. → The steps that complete it. |\n| p22 | recommendation | The pattern is for the head of product, the head of engineering and the head of design, who make the appointments, and for the group's teams, and it has worked when cross-team questions are settled inside the group and reach the executives only as joint escalations. | reasoning: Author's measures: the number of product and design questions from the group's teams that reach an executive per quarter, and how long each waited; whether a user's task that crosses the group's teams works one way. | `conclusion_summary`: The steps. → Whom the pattern is for and how to tell that it worked. |\n\n### Anti-Patterns: Order-Giver, Veto, Decoration\n\n**Controlling idea** (`analysis`, id `anti-patterns`): The triad fails in three forms, product as order-giver, engineering as veto and design as decoration, and in each a member does a job without judging its risk, so the correction is the same: the three find the solution together from a stated problem, before the solution is fixed.\n\n**Advances the thesis** (S5): Names the three failures, gives the signs of each and the correction, and reads the opening scene by them.\n\n**Transition in:** `contrast`: Two patterns that put the triad in place. → What it looks like when the three roles are present and the arrangement is not.\n\n**Order of paragraphs** (`grouping`): Product as order-giver comes first because engineering as veto follows from it; design as decoration comes third because it has a second cause of its own, design staffed as a shared service; the table comes last because it sets the three side by side and states the one correction they share, which cannot be read before each form has been described.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | analysis | Product as order-giver is the Feature Factory seen from inside the team: the product manager passes on a solution chosen elsewhere, or chooses it alone, and the other two receive it as a specification. | source: The Feature Factory is one of the book's twelve failure patterns and is named by Build What Matters. The author's record right-team calls the two versions of the role the backlog clerk and the mini-CEO; the org-design record product-engineering-partnership calls it product as ticket writer. In the opening scene the Dispatch product manager wrote 23 tickets from an account manager's notes. |  |\n| p25 | analysis | Engineering as veto follows from an order: engineers who see a solution only when it is specified can answer only with an estimate or a refusal, and what they know about what is possible never reaches the decision. | source: The org-design record product-engineering-partnership names 'technical veto theatre': engineering rejects ideas late because feasibility was not discussed early. In the opening scene the engineers' one decision was to cut the dispatch-board part to keep the date, and that part was the one the planners needed. | `cause_effect`: A solution that arrives as an order. → What that leaves engineering able to do. |\n| p26 | analysis | Design as decoration is the designer consulted after the flow is fixed, and it is made likely by treating design as a shared service that teams call on by request. | source: Empowered, in the author's record team-topology: design treated as an internal service, pooled and ticketed in per request, starves discovery. Build What Matters (record right-team): designers who report to individual product managers produce design that serves the roadmap. Corvane 2024 (chapter 8's ledger line): seven designers for eleven teams; four designers each worked for two teams, the Dispatch designer among them. | `additional_support`: Engineering reduced to a refusal. → Design reduced to a polish, and what makes that likely. |\n| p23 | synthesis (table) | Each failure form can be recognized by what the member does in place of judging its risk, and all three have one correction: the three find the solution together from a stated problem, before the solution is fixed. | table: Form \\| What you see \\| Risk left unjudged \\| Correction. Product as order-giver \\| the product manager writes detailed tickets from requests; the others first see the work as a finished specification \\| value and viability (the request stands in for the judgment), and with them the other two \\| the product manager brings a problem and a measure, not a solution. Engineering as veto \\| engineers are asked only for an estimate; their contribution is yes, no or a later date \\| feasibility as a possibility (what the technology would allow), and often value, since the cut falls on whatever does not fit \\| engineers take part in discovery, and a no carries its condition. Design as decoration \\| the designer is brought in when the flow is built and asked to make it look good \\| usability \\| the designer watches users with the problem and tests the flow before it is built. | `conclusion_summary`: The three forms, each described. → The three side by side, with the sign, the unjudged risk and the correction of each. |\n\n### Where the Sources Disagree: One Owner or Three\n\n**Controlling idea** (`counterargument`, id `where-the-sources-disagree`): The single-owner view holds that one role must own the product because shared accountability is no accountability, the sources themselves give the product manager overall accountability for the outcome, and the triad answers by separating answering for the outcome from deciding each risk.\n\n**Advances the thesis** (S2, S5): States the strongest objection to the thesis and answers it.\n\n**Transition in:** `cause_effect`: Product as order-giver, the first failure form. → The respectable view that produces it: one role should own the product.\n\n**Order of paragraphs** (`comparison`): The objection is stated first in its strongest form, with the sources that seem to support it, and the resolution follows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | counterargument | The single-owner view says that one role, usually the product manager, should own the product and the others execute, and both of my main sources give it some ground. | source: Cagan's article makes the product manager responsible for value and viability 'and overall accountable for the product's outcomes'. The author's record of Build What Matters states that one person holds real accountability for product outcomes. The argument behind the view: when three people share a decision, each can point at the other two. |  |\n| p28 | refutation | The triad keeps what is right in that view and refuses the conclusion: the product manager answers for the outcome, and that does not make the product manager the judge of feasibility or usability, because each risk still has exactly one accountable role. | source: The same article that makes the product manager accountable for outcomes gives usability to the designer and feasibility to the lead engineer. The author's record right-team puts it as: one person holds real accountability for product outcomes, which does not say the product manager decides alone. The opening scene is what the single-owner arrangement produces: one specification fixed all three risks, and its author could have judged at most one of them. | `contrast`: One owner for the product. → What the owner owns and what stays with the other two. |\n\n### Worked Example: A Group Triad at Corvane\n\n**Controlling idea** (`example`, id `worked-example`): In 2026 one Corvane product group had a director and no product or design lead, so its cross-team questions waited for the chief product officer or were answered three ways; naming the two leads and writing who decides what settled most of them inside the group, at a stated cost.\n\n**Advances the thesis** (S3, S4): Applies the group pattern to one group and shows the result with illustrative numbers.\n\n**Transition in:** `example`: The arrangement, the two patterns and the objection answered. → One Corvane product group that set up its triad.\n\n**Order of paragraphs** (`chronological`): The incomplete level comes first, then the appointments and the page, then one decision made under it, then the result and its cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | description | At the start of 2026 the group that holds Scheduling, Dispatch and Technician App had an engineering director and nobody at its level for product or design, so in one quarter fourteen product questions that crossed its teams waited for Priya Nambiar, the chief product officer, and design questions that crossed them were answered team by team. | scenario: New, 2026, about 500 people, about thirty teams in four product groups: the group has eight teams; its eight product managers report to Priya Nambiar (CPO); its five designers report to Noor Achterberg (Head of Design from 2025, who reports to Priya Nambiar); the director is in Dario Vance's line. First quarter of 2026: fourteen product questions from the group's teams waited for the CPO, median nine working days; a moved job was shown in three different ways on the dispatch board, the planner calendar and the technician's phone. |  |\n| p30 | example (table) | In the second quarter Priya Nambiar and Noor Achterberg named a product lead and a design lead for the group, appointed them with the director on the same day, and the three wrote one page of who decides what. | table: Decision \\| Who decides \\| Who must be asked first. Which problems the group's teams take, and in what order, inside the outcomes the CPO hands the group \\| group product lead \\| director: cost and which teams; design lead: where it sits in the planner's and the technician's day. Which team builds what, the sequence across teams, technical choices inside the group within the engineering strategy \\| director \\| product lead: what is needed first; design lead: what the flow needs. How a task that crosses the group's applications works for the user \\| design lead \\| product lead: what the customer must get done; director: what each option costs. Whether a cross-team solution goes ahead \\| each of the three for its own risk; a no carries its condition \\| the teams' own triads. A disagreement not settled in five working days \\| the three go together, with one page, to Priya Nambiar and Dario Vance, with Noor Achterberg present \\| nobody. | `sequence`: A group with only a director. → The appointments and the page. |\n| p31 | example | The first decision under the page was the proposed repair of a sick technician's day, and each of the three judged its own risk: the director said no to parts data in the first version and gave the condition, the design lead decided that a proposed change looks the same in all three applications, and the product lead judged a version without parts worth trying. | scenario: Ledger: product strategy step 2 (for a sick technician the product proposes a repaired plan and the planner decides) needs skills, parts on hand and time windows as data; under the 2026 engineering strategy the form of the parts data is fixed by the Director of Platform before work on proposals that use it starts. New: the group triad's decision in the second quarter of 2026: first version with skills and time windows, tried with two customers; parts added when the form is fixed; one pattern for a proposed change across the board, the calendar and the phone. No result of step 2 is stated. | `example`: The page. → One decision made under it. |\n| p32 | description | Two quarters later three questions from the group reached the chief product officer in a quarter where fourteen had, each brought by all three, and the cost was a product manager's team left without her, two days of a designer and the three leads' time. | scenario: New, fourth quarter of 2026: three questions from the group's teams reached Priya Nambiar (fourteen in the first quarter), each as a joint escalation with one page; a moved job is shown one way in the three applications. Cost: the Dispatch team had no product manager of its own for a quarter until a replacement was hired; the design lead has two days a week less in a team; the three spend about half a day a week together. At the end of 2026 the other three groups still have only a director. | `sequence`: A decision made by three judgments. → What changed over two quarters and what it cost. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI lets each of the three roles do part of the others' work, which may reduce the number of people holding the roles, while the three risks and the need for one accountable judge of each remain.\n\n**Advances the thesis** (S1, S2): Tests the arrangement against cheaper building and blurring roles, with labeled claims.\n\n**Transition in:** `additional_support`: The triad at work in 2026. → Whether AI tools change who holds the three roles.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | analysis | Emerging: with coding agents a product manager or a designer can build a working prototype and an engineer can produce a passable screen, so each role now does part of the others' work. | reasoning: Author's observation as of November 2026, labeled Emerging; the author knows of no published measurement of how this changes the division of decisions, so no Proven claim is made. |  |\n| p34 | claim | Speculative: if fewer people hold the three roles, the risks do not merge with them, and a person who holds two roles judges two risks and needs the knowledge for both; the order-giver form becomes easier, because whoever can build alone can skip asking. | reasoning: Labeled Speculative. It would be confirmed where teams that merge roles report more work changed or withdrawn after release for reasons of usability or operability. The chapter Team Shape and Roles weighs the evidence. | `contrast`: What the tools let each role do. → What they do not change, and the new risk. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The risks, the levels, the two patterns and the three failure forms are one idea: a product decision needs three judgments, each made by the one role that has the knowledge, wherever such decisions are made; the patterns put a judge at each place and the failure forms are what a place looks like when a role is present and its judgment is not.\n\n**So what:** A leader appoints the three together at every level, tells each which risk is theirs, and reads a level with one of the three missing as an incomplete structure and not as a saving.\n\n**Callback:** The skills matrix that Corvane's Dispatch team shipped on its date in 2024. The reader can now say what was missing: three roles were present and no risk had a judge; the product manager's tickets, the engineers' cut and the designer's polish are the three failure forms in one feature.\n\n**Takeaway** (`course_of_action`): Take one team and one group of your own; for each, name the three people and the risk each answers for, and take one recent piece of work and ask who judged each risk and when. The checklist carries it.\n\n**Hand-off** to [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html): `cause_effect`: The triad that must exist at each level. → How many levels there are, and how many people each manager leads.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | synthesis (list) | Established: the sources agree on the four risks and the role responsible for each, on product, design and engineering working on the solution together, on design as a peer inside the team, and on peers escalating together. |  |  |\n| p36 | synthesis (list) | Depends on context: who the engineering member is, whether a group's leads are full roles or part-time duties, where design reports, and how much of a designer a team needs all change with the situation. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p37 | synthesis (list) | The author's synthesis: the triad as a decision right, the three risks applied at group and executive level, the rule that a no carries its condition, and the three named failure forms are this book's position. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p38 | recommendation (list) | Eight checks let the reader find the triad, or its absence, in one team and one group of their own. |  | `sequence`: What to take away. → What to do with it. |\n| p39 | transition | A product decision needs three judgments at every level where such decisions are made, the skills matrix of 2024 had three roles and none of the judgments, and because the triad must exist at each level the next question is how many levels there are and how many people each manager leads. |  | `cause_effect`: The triad that must exist at each level. → The chapter's synthesis and the question of how many levels and what spans, which the next chapter answers. |\n\n## Non-goals\n\n- The line between what leaders and teams decide See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- Executive configurations and where the head of design reports See [Executive Roles and Reporting Lines](executive-roles-and-reporting-lines.html).\n- How many designers and product managers a team needs See [Team Size and Composition](team-size-and-composition.html).\n- Methods for allocating and recording decision rights in general See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Spans, layers and what a manager of managers does See [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html).\n- Discovery techniques and design methods\n- How to organize a design function internally (Merholz and Skinner), which is not on the author's bookshelf\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts introduced here (the Dispatch team's skills matrix of 2024; the 2026 group triad with its counts) should be checked against chapter 18, written in parallel: this chapter assumes product managers report to the CPO, designers to the Head of Design, the Head of Design to the CPO, and group directors sit in the engineering line.\n- The chapter calls the group 'the group that holds Scheduling, Dispatch and Technician App' and gives it eight teams; the ledger does not name the four groups or their teams.\n- Cagan's 'The Four Big Risks' (svpg.com, 2017) is cited directly as a primary source after being fetched and read; the author may prefer to cite Inspired or Empowered.\n- The engineering member of a team's triad is left as 'tech lead or engineering manager, whoever answers for feasibility'; chapter 18's decision page names the engineering manager. The author may want one answer for the book.\n\n## Decision log\n\n- **2026-11-19** — Open with one feature of the forty-one, the technician skills matrix, followed through the three roles of one team, so that all three failure forms are in the reader's mind before they are named. Rejected: Opening with the forty-one features as a whole, which Part III already used; Opening with the 2025 disagreement of the CTO's and CPO's drawings, which belongs to the part introduction and chapter 18\n- **2026-11-19** — State the four risks from Cagan's own article, fetched and read, and present the grouping of value with viability under product as his assignment of roles; mark 'and run' in feasibility and the use of the risks above the team as the author's extension. Rejected: Citing the risks only through the author's records, which name them without defining them\n- **2026-11-19** — Treat the single-owner view in a 'Where the Sources Disagree' section, because both main sources give the product manager overall accountability for the outcome. Rejected: Treating it only as an anti-pattern\n- **2026-11-19** — Use the group level for the worked example, because the reader outcome asks for setting up the triad there and the opening scene already shows the team level. Rejected: A second team-level example; An executive-level example, which chapter 18 owns\n- **2026-11-19** — Flow rubric (one run): sound with notes. Applied: the table of failure forms moved to the end of the anti-patterns section as its synthesis; the levels table reads top-down like the figure; the opening scene names the dispatch board where it is cut; the worked example's first paragraph carries the baseline of fourteen questions and Priya Nambiar's role; the engineering member is named in the definition of the triad; the flow rationales say what would break. Not applied: reversing the levels section to team-first, because problems are handed from the top down and the part runs large to small.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (ESCALATE; one failure at fault in the spec, fixed locally): the spec's evidence gave two accounts of the Dispatch product manager (p09 and p28: she decided all three risks; p05, p24, p23: value was judged by nobody). One reading now holds throughout: one document, the tickets, fixed all three risks, and its author could have judged at most one and had taken even that from an account manager's notes. Also: the 2026 group product lead is the product manager who took over the Dispatch team in 2025, not the ticket-writer of 2024; coaching dropped from p13; the fate of a director-only group's questions is told once, in the group pattern. Rejected: Making the 2024 product manager the single owner who chose the feature, which contradicts the forty-one features as promises made by sales\n\n## Sources\n\n- **Internal**\n  - grounded-product-management records: right-team (Build What Matters); team-topology, coaching, staffing, team-objectives, business-collaboration (Empowered) — The triad as peers; design as a peer function; design as a service desk; topology shaped jointly by the three leaders; the backlog clerk and the mini-CEO.\n  - org-design record product-engineering-partnership — Role boun <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
