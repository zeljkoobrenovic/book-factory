<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The part answers three questions in order, one per chapter: By what method are decision rights allocated, and how is a decision recorded so that it lasts?; How do capacity planning and outcome planning fit into one process?; Which recurring forums and written artefacts does an organization need at each size?\n- **Be able to:** Pick the chapter of this part that answers the question in front of them.\n\n**Audience:** Executives and individual contributors in product and tech who have read Parts I to V and are about to start Part VI, or who arrive with one question about decisions, planning or recurring meetings and want the chapter that answers it.\n\n**Already knows:**\n\n- Quarterly planning, budgets, roadmaps, team goals and recurring meetings as they are usually run.\n- Parts I to V in outline: work, information and decisions as the flows of an organization and the working definition of a decision right (chapter 1), the vision-led roadmap of Part III, the engineering strategy and decision record of Part IV, and the leadership structure of Part V.\n- Corvane in outline.\n\n**Does not yet know:**\n\n- Alignment as the result of mechanisms and not of culture; defined here.\n- Allocating a decision right and the content of a decision record (chapter 22); glossed here.\n- The financial plan, allocation and team objectives as separate planning steps (chapter 23); glossed here.\n- Forum, written artefact and operating cadence (chapter 24); glossed here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the three chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next three chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** How do many teams decide and plan so that their work adds up?\n\n> **Claim:** Alignment is produced by three explicit mechanisms: decision rights that put each decision next to its information and record it, a planning process in which capacity allocation and outcome selection are separate steps joined by team objectives, and a small set of recurring forums and written artefacts that carry information along designed paths.\n\n**Disputed by:** The view that alignment comes from a shared culture and frequent communication, so that process is a substitute for trust and should be kept to a minimum.\n\n**So what:** A leader who finds teams pulling apart looks for the missing decision right, the tangled planning step or the absent forum before calling for better communication.\n\n**How and why:** Information and the right to decide are separated by default as an organization grows; a decision right rejoins them, a plan makes many teams' decisions consistent in advance, and a forum moves the information the next decision needs. Each is a designed path for one of the flows of chapter 1, and none arises from goodwill alone.\n\n**Supporting claims**\n\n- **P6-1** — A decision right puts a named kind of decision with the role that has the information, says whose advice is required and where the decision is recorded, and a recorded decision is what lets the next one build on it.\n- **P6-2** — Planning works when the financial plan, the allocation of capacity and the choice of outcomes are decided in that order and separately, with team objectives as the contract between leaders and teams.\n- **P6-3** — An organization needs a small, sized set of recurring forums and written artefacts, each with an owner and a decision or information flow it exists for.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in three-mechanisms and the chapter list in the closing: decision rights, then planning, then the operating cadence)\n\nThe page opens on a planning cycle that took nine of the quarter's thirteen weeks and still left three teams building the same integration, and on the question of which decisions planning is made of. The first section says why alignment does not arise by itself as an organization grows, and why asking for it does not produce it; the second gives the three mechanisms that produce it and says why they come in that order; the chapter list closes the page. The cause stands before the mechanisms because each mechanism is justified by the separation it repairs; put the mechanisms first and decision rights, planning steps and forums arrive as process for its own sake, which is the objection the part disputes. The list comes last because a reader can choose a chapter only after seeing what each mechanism does.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2026 Corvane's quarterly planning took nine of the quarter's thirteen weeks, and at the end of it three teams were building the same integration.\n\n**Bridge:** The reader's experience of planning that consumes the time it plans. → The question that experience raises and that the usual answers (communicate more, or cut the process and trust people) skip: which decisions planning is made of.\n\n**Thesis statement** (KEY POINTS and paragraph p03): Part VI argues that alignment is produced by three explicit mechanisms: decision rights that put each decision next to its information and record it, a planning process in which capacity allocation and outcome selection are separate steps joined by team objectives, and a small set of recurring forums and written artefacts that carry information along designed paths.\n\n**Roadmap** (paragraph p03):\n\n- Why alignment does not arise by itself as an organization grows. *Kept in:* why-alignment-is-designed.\n- The three mechanisms that produce alignment and why they come in that order; three chapters answer three questions in order: who decides what and how the decision is recorded, how capacity and outcomes are planned in one process, and which forums and documents an organization needs at each size. *Kept in:* three-mechanisms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2026 Corvane's quarterly planning took nine of the quarter's thirteen weeks, and at the end of it three teams were building the same integration. | scenario: Corvane (fictional): in 2026, at about 500 people and about thirty teams in four product groups, quarterly planning took nine of the quarter's thirteen weeks, negotiated across budget, headcount, roadmap and team goals in meetings with every director; at the end three teams were building the same integration. |  |\n| p02 | context | Planning that consumes the time it plans is usually answered with more communication or with less process and more trust, and the question both answers skip is which decisions planning is made of; at Corvane nobody could list them, because budget, headcount, roadmap and team goals were negotiated together. | reasoning: Nine weeks of meetings is already a great deal of communication, so more of it is not the missing thing; and with less process the three teams would still not have known of each other. What nobody could say is which decisions the nine weeks were for, who made each and where it was written down. | `problem_solution`: Corvane's nine weeks and the three teams. → The reader's own version of that planning, the two usual answers, and the question that both skip. |\n| p03 | claim | Part VI argues that alignment is produced by three explicit mechanisms (decision rights, a planning process of separate steps, and a small set of forums and written artefacts), and it makes the argument in three chapters that answer three questions in order. |  | `elaboration`: The question of which decisions planning is made of. → The part's claim, which answers it and widens it from planning to alignment, and the three questions its chapters take in turn. |\n\n## Sections\n\n### Why Asking for Alignment Does Not Produce It\n\n**Controlling idea** (`claim`, id `why-alignment-is-designed`): As an organization grows, information and the right to decide are separated by default, which leaves three things missing (a decider with the information, consistency between many teams' decisions, and a path for the information the next decision needs), and goodwill and communication do not supply them.\n\n**Advances the thesis** (P6-1, P6-2, P6-3): States the reasoning from which the part derives its three mechanisms.\n\n**Transition in:** `cause_effect`: The part's claim as stated in the lead. → The reasoning that produces it: what growth separates, and what is then missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | claim | As an organization grows, the information a decision needs and the right to make it are separated by default, and three things are then missing: a decider who has the information, consistency between the decisions of many teams, and a path by which the information the next decision needs reaches the person deciding. | reasoning: Information and the right to decide are separated by default as an organization grows; a decision right rejoins them, a plan makes many teams' decisions consistent in advance, and a forum moves the information the next decision needs. |  |\n| p05 | explanation | Shared culture and frequent communication do not supply the three missing things by themselves, because informal coordination covers only the paths between people who already talk and leaves out the paths the organization needs and nobody walks; so the paths have to be designed. | reasoning: Informal coordination covers the paths between people who already talk and leaves out the paths the design needs and nobody walks. None of the three missing things arises from goodwill alone. | `contrast`: The three missing things. → The common view that culture and communication supply them unaided, and where it falls short. |\n\n### Three Mechanisms of Alignment\n\n**Controlling idea** (`explanation`, id `three-mechanisms`): The part builds alignment from three mechanisms (decision rights with records, planning in separate steps joined by team objectives, and an operating cadence of forums and written artefacts), and they come in the order in which each needs the one before.\n\n**Advances the thesis** (P6-1, P6-2, P6-3): One list item per supporting claim, then the order.\n\n**Transition in:** `problem_solution`: The three missing things, which goodwill does not supply. → The three mechanisms that supply them, one per chapter.\n\n**Order of paragraphs** (`prerequisite_order`): Decision rights come first because planning is a set of decisions that needs them, and the cadence comes last because its forums exist to make the decisions and carry the plans the first two chapters define. The paragraph on the order closes the section because the dependency can be stated only once all three mechanisms have been met; cadence first would be a calendar of meetings with nothing to decide.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition (list) | Three mechanisms supply the three missing things, each a designed path for one of the flows of chapter 1: a decision right, which puts a named kind of decision with the role that has the information, says whose advice is required and where the decision is recorded; planning, in which the financial plan, the allocation of capacity and the choice of outcomes are decided in that order and separately, with team objectives as the contract between leaders and teams; and an operating cadence, a small set of recurring forums and written artefacts, each with an owner and a decision or information flow it exists for, which moves the information the next decision needs; the plan is what makes many teams' decisions consistent in advance. | source: Planning as a financial plan, an allocation and a roadmap (Will Larson, The Engineering Executive's Primer, 2024); the roadmap derived from a vision and outcomes (Ben Foster and Rajesh Nerlikar, Build What Matters, 2020). |  |\n| p07 | explanation | The three mechanisms come in prerequisite order, decision rights first because planning is a set of decisions that needs them and the cadence last because its forums exist to make those decisions and carry those plans; each mechanism is a designed path, which is the book's system-design lens, and has users by whom it is judged, which is its product-thinking lens, and planning is where the product model of Part III and the engineering model of Part IV meet. | reasoning: Planning is a set of decisions that needs decision rights; the cadence's forums exist to make the decisions and carry the plans; cadence first would be a calendar of meetings with nothing to decide. Larson's model answers how much capacity goes where and Build What Matters answers what it is for, so planning is where Parts III and IV meet. Each mechanism has users, the people who decide and the teams that wait for a decision, and is kept only while it serves them. | `cause_effect`: The three mechanisms. → The one direction in which they depend on each other, and where the book's two lenses and the two earlier operating models appear in them. |\n\n## Conclusion: Chapters in this part\n\n**Synthesis:** Read in order, the three chapters follow a decision from who makes it, through the plan that many such decisions add up to, to the rhythm of meetings and documents in which decisions and plans are made and carried.\n\n**So what:** A leader who finds teams pulling apart looks for the missing decision right, the tangled planning step or the absent forum before calling for better communication.\n\n**Callback:** Corvane's nine weeks of quarterly planning and the three teams building the same integration from the opening (p01). The closing reads the nine weeks against the lead's question: nobody at Corvane had said which decisions the nine weeks were for, so the planning could run long and still leave three teams on the same integration.\n\n**Takeaway** (`course_of_action`): Read the chapters in order; with one question about decisions, planning or meetings in hand, open the chapter that answers it.\n\n**Hand-off** to [Decision Rights and Decision Records](decision-rights-and-decision-records.html): `elaboration`: The part's claim that alignment needs explicit mechanisms. → The first mechanism: who decides, and how the decision is kept.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | description (list) | Each of the three chapters answers one question, in this order: by what method decision rights are allocated and how a decision is recorded so that it lasts, how capacity planning and outcome planning fit into one process, and which recurring forums and written artefacts an organization needs at each size. |  |  |\n| p09 | synthesis | The three chapters follow a decision from who makes it, through the plan, to the rhythm that carries both; at Corvane nobody had said which decisions the nine weeks were for; a leader who has the three answers looks for the missing decision right, the tangled planning step or the absent forum before calling for better communication, and the first chapter starts with the first mechanism, who decides and how the decision is kept. |  | `conclusion_summary`: The three chapters and their questions. → What they add up to for Corvane's nine weeks and for the reader, and the first chapter. |\n\n## Non-goals\n\n- Teaching any chapter's content: the method for allocating decision rights, the planning steps and the forums at each size are named and glossed, not argued. See [Decision Rights and Decision Records](decision-rights-and-decision-records.html), [Planning](../grounded-engineering-executive/planning.html), [[operating-cadence]].\n- The part's closing verdict on the nine-week plan (one undivided negotiation that fits in three weeks once divided into three decisions with owners). See [[operating-cadence]].\n- The roadmap and its horizons, which planning takes as an input. See [Roadmaps and Horizons](roadmaps-and-horizons.html).\n- The decision record as an instrument of technical governance. See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- What AI changes; part introductions carry no AI section.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The page does not say which integration the three teams were building, nor which teams; the ledger does not name them. Chapter 23 or 24 should.\n- The page says that budget, headcount, roadmap and team goals were negotiated together with every director (ledger), and stops short of the part's closing reading of it; check that chapter 24's closing still lands.\n- The post entry phrases the third question as 'Which recurring forums and written artefacts does an organization need at each size?', while the chapter's own question now begins 'By what rule does an organization decide which…'; the page's chapter list uses the chapter's question and the lead keeps the shorter form.\n\n## Decision log\n\n- **2026-11-19** — The post entry in the journal spec has a question and no thesis. A part introduction performs the part's opening, so this spec uses the part's thesis and its three supporting claims P6-1 to P6-3 unchanged; they are the part's, not the page's own. Intent outcome, AC-1 and role are copied from the post entry; the hook from the part's opening. Rejected: Writing a separate thesis from the page's question.\n- **2026-11-19** — Same shape as the Part IV introduction, which passed its check: three lead paragraphs, two sections of two units each, and 'Chapters in this part' as the headed conclusion with two units (the chapter list, and one closing paragraph holding the synthesis, the callback, the so-what and the hand-off to chapter 22). Rejected: A separate reading-order section after the list.\n- **2026-11-19** — The three chapters of Part VI are not written yet, so the page describes them from their journal-spec entries only and names no worked example of theirs.\n- **2026-11-19** — The page does not give the part's closing verdict on the nine-week plan (one undivided negotiation; three weeks once divided) or the closing's formula of who, what and when, and rhythm; it says only that nobody had said which decisions the nine weeks were for. Rejected: Stating the verdict in the introduction: it would spend the part's closing callback.\n- **2026-11-19** — Flow rubric (one fresh reader, order of ideas only): sound with notes. Taken: the first section now holds only the cause (what growth separates and the three things then missing) and why goodwill does not supply them; the three mechanisms are first presented in the second section, each as the repair of one gap; the two lenses are stated once, in the paragraph on the order (p07). Rejected: Merging the chapter list into the paragraph on the order, or cutting the closing's recap of the sequence: the page format ends with the chapter list and one closing paragraph, and AC-1 needs the list.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — Lessons from the earlier part introductions applied in the spec: the two lenses are carried into the paragraph on the order (p07); only the chapters' questions are counted as 'three questions', the lead's question is called 'the question of which decisions planning is made of'; every term a later chapter owns is glossed in one clause; the closing paragraph states the part's so-what.\n- **2026-11-19** <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
