<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The part answers four questions in order, one per chapter: Which executive roles does a product and tech organization need, and who should report to whom?; How should product, engineering and design share decisions at each level?; Given the team sizes of chapter 8, how many people should a manager have, how many layers follow, and what does each layer cost?; What do senior technical leaders own that managers do not?\n- **Be able to:** Pick the chapter of this part that answers the question in front of them.\n\n**Audience:** Executives and individual contributors in product and tech who have read Parts I to IV and are about to start Part V, or who arrive with one question about leadership roles, managers or senior technical roles and want the chapter that answers it.\n\n**Already knows:**\n\n- What a CTO, a CPO, a VP Engineering, an engineering manager and a staff engineer are, as job titles.\n- Parts I to IV in outline: judgment as one of the three capacities that run out, decision rights as one of the four levers, team size (chapter 8), the product model in which leaders own problems and teams own solutions, and the engineering model of policies, governance and platforms.\n- Corvane in outline.\n\n**Does not yet know:**\n\n- Joining decisions as the work that defines a leader; defined here.\n- Executive configurations (peers, one combined executive, CTO with VP Engineering) (chapter 18); named and glossed here.\n- The triad of product, engineering and design with one accountable role per risk (chapter 19); glossed here.\n- Span, layer and manager of managers (chapter 20); glossed here.\n- Staff-plus and the technical leadership track (chapter 21); glossed here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Who leads a product and tech organization, how are leaders arranged, and what is each layer for?\n\n> **Claim:** Leadership structure is derived, not chosen from a template: executive roles follow from which decisions must be joined at the top, the product–engineering–design triad repeats at every level where those decisions recur, spans and layers follow from team size, each layer existing to join decisions that the units below it cannot join themselves, and a technical leadership track carries the decisions that management structure cannot.\n\n**Disputed by:** The view that leadership structure is a matter of the people available — give strong leaders scope and titles that keep them — and the template view that every company of a given size should have the same roles.\n\n**So what:** A leader can explain each role and layer by the decisions it joins, and can remove or decline one that joins none.\n\n**How and why:** A leader's distinctive work is joining decisions that would otherwise be made separately: product with engineering, one group with another, this quarter with next year. Where decisions need joining is set by the architecture of Parts II to IV, so the leadership structure follows from it; and judgment, the capacity leaders hold, is scarce, so each layer must earn the delay it adds.\n\n**Supporting claims**\n\n- **P5-1** — Executive roles and reporting lines follow from which decisions must be joined at the top, and each common configuration trades one kind of joining for another.\n- **P5-2** — Product, engineering and design decide together at every level where their decisions recur, with each accountable for one risk, and the triad fails when one of the three becomes order-giver, veto or decoration.\n- **P5-3** — Spans and layers are derived from team size, and each layer costs delay and distance from information that must be justified by decisions only it can join.\n- **P5-4** — A technical leadership track holds the cross-team technical decisions that the management line is not placed to make, and it works when its accountability is explicit.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in four-places and the chapter list in the closing: the executive level, then the triad at every level, then spans and layers between the top and the teams, then the technical track across teams)\n\nThe page opens on two leaders whose drawings of the same organization disagree, and on the question of what each role is for. The first section says what a leader's distinctive work is, joining decisions, why that makes the structure something to derive, and what limits it; the second gives the four places where decisions are joined and says why they are read from the top down; the chapter list closes the page. The work of joining stands before the four places because each place is justified by decisions that need joining there; put the places first and executive roles, triads, layers and a technical track arrive as a template, which is the view the part disputes. The list comes last because a reader can choose a chapter only after seeing what each one derives.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2025, when Corvane appointed its first CPO, the CTO and the CPO each drew the organization they needed, and the two drawings disagreed about who led eleven of the teams.\n\n**Bridge:** The reader's experience of a leadership structure shaped by who was available and who had to be kept. → The question that experience raises and that the usual answers (fit the chart to the people, or copy the roles of a company the same size) skip: what each role is for.\n\n**Thesis statement** (KEY POINTS and paragraph p03): Part V argues that leadership structure is derived, not chosen from a template: executive roles follow from which decisions must be joined at the top, the product, engineering and design triad repeats at every level where those decisions recur, spans and layers follow from team size, and a technical leadership track carries the decisions that the management structure cannot.\n\n**Roadmap** (paragraph p03):\n\n- What a leader's distinctive work is, and why it makes the structure something to derive. *Kept in:* joining-decisions.\n- The four places where decisions are joined and why they are read from the top down; four chapters answer four questions in order: which executive roles and who reports to whom, how product, engineering and design decide together, how many people a manager leads and how many layers follow, and what senior technical leaders own. *Kept in:* four-places.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2025, when Priya Nambiar became Corvane's first CPO, she and the CTO, Tomas Rell, each drew the organization they needed, and the two drawings disagreed about who led eleven of the teams. | scenario: Corvane (fictional): in 2025, as the company grew from 180 people toward 500, Priya Nambiar was appointed its first CPO; she and Tomas Rell, co-founder and CTO, each drew the organization they needed; the drawings disagreed about who led eleven of the teams. |  |\n| p02 | context | A leadership structure is usually settled by the people available and the people who must be kept, or copied from a template for a company of that size, and the question both skip is what each role is for; without an answer two drawings can only be compared by who drew them. | reasoning: Each drawing can be defended by the strengths of the people on it; neither says what a leader of those teams would decide that nobody else can, so there is nothing to test either drawing against. | `problem_solution`: Corvane's two drawings. → The reader's own version of a structure shaped by people, the two usual views, and the question that both skip. |\n| p03 | claim | Part V argues that leadership structure is derived from the decisions that must be joined and is not chosen from a template, and it makes the argument in four chapters that answer four questions in order. |  | `elaboration`: The question of what each role is for. → The part's claim, which answers it, and the four questions its chapters take in turn. |\n\n## Sections\n\n### What a Leader Is For\n\n**Controlling idea** (`claim`, id `joining-decisions`): A leader's distinctive work is joining decisions that would otherwise be made separately; where decisions need joining is set by the architecture of Parts II to IV, so the leadership structure follows from it, and because judgment is scarce and every layer adds delay, each role and layer must earn its place by the decisions it joins.\n\n**Advances the thesis** (P5-1, P5-2, P5-3, P5-4): States the reasoning from which the part derives every role and layer.\n\n**Transition in:** `cause_effect`: The part's claim as stated in the lead. → The reasoning that produces it: what a leader does that nobody else is placed to do.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | claim | A leader's distinctive work is joining decisions that would otherwise be made separately (product with engineering, one group with another, this quarter with next year); where that joining is needed is set by the teams, product model and engineering model of Parts II to IV, so the leadership structure can be derived from them. | reasoning: To join two decisions is to make them in one place, so that each takes account of the other. A leader's distinctive work is joining decisions that would otherwise be made separately: product with engineering, one group with another, this quarter with next year. Where decisions need joining is set by the architecture of Parts II to IV. |  |\n| p05 | explanation | Joining has a cost: judgment, the capacity leaders hold, is scarce and every layer adds delay and distance from information, so each role and layer must earn its place; the test corresponds to the two lenses through which the book looks at organizations, named here before they are used: saying where a decision is joined is system design, and judging a role or layer by what it does for the teams below it is product thinking. | reasoning: Judgment, deciding with the relevant information at hand (chapter 1), is scarce; each layer adds a step of delay and of distance from the information, so each layer must earn the delay it adds by joining decisions the units below it cannot join themselves. | `contrast`: Joining decisions as the work that justifies a leader. → What the joining costs, and the test each role and layer has to pass. |\n\n### Four Places Where Decisions Are Joined\n\n**Controlling idea** (`explanation`, id `four-places`): Decisions are joined in four places (at the top, across the three functions at every level, down the management line, and across teams on technical questions), and the part reads them from the top down because each is defined by the one before.\n\n**Advances the thesis** (P5-1, P5-2, P5-3, P5-4): One list item per supporting claim, then the order.\n\n**Transition in:** `example`: Joining decisions, and the test each role and layer must pass. → The four places where the part applies that test, one per chapter.\n\n**Order of paragraphs** (`large_to_small`): The executive level comes first because its configuration decides where product and engineering meet; the triad then shows the same meeting at every level below; spans and layers say how many levels there are between the top and the teams; the technical track comes last because it is defined by what that management structure leaves unowned. The paragraph on the order closes the section because the dependency can be stated only once all four places have been met; start with spans and the layers are counted before anyone knows what the top layer is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition (list) | Decisions are joined in four places: at the top, where executive roles and reporting lines follow from which decisions must be joined there; across functions, where product, engineering and design decide together as a triad at every level, each accountable for one risk; down the line, where spans and layers follow from team size and each layer must join decisions the units below it cannot; and across teams, where a technical leadership track holds the technical decisions the management line is not placed to make. | source: The rule of thumb that a manager of managers leads about four to six managers (Will Larson, An Elegant Puzzle, 2019), presented as Larson's rule of thumb; the rest is the part's own claims. |  |\n| p07 | explanation | The four places are read from the top down, the executive level first because its configuration decides where product and engineering meet, the triad next because it is the same meeting repeated below, spans and layers third because they say how many levels there are, and the technical track last because it is defined by what the management line leaves unowned; every chapter carries both lenses, and the part draws on two earlier ones: spans start from the team sizes of Part II, and the technical track holds the roles on which the governance of Part IV already relied. | reasoning: The executive configuration decides where product and engineering meet; the triad is that meeting at every level; spans and layers give the structure between the top and the teams, from the team sizes of chapter 8; the technical track is defined by what that structure leaves unowned; the governance of chapter 14 relies on its roles, so the dependency on Part IV runs the same way as in p04 (Part IV is the input). Starting with spans would count layers before knowing what the top layer is. | `cause_effect`: The four places. → The order in which each depends on the one before, and where the book's two lenses and the earlier parts appear in them. |\n\n## Conclusion: Chapters in this part\n\n**Synthesis:** Read in order, the four chapters build a leadership structure from the top down and then across: the roles at the top, the three functions deciding together at each level, the number of levels and managers, and the technical roles that cross them.\n\n**So what:** A leader can explain each role and layer by the decisions it joins, and can remove or decline one that joins none.\n\n**Callback:** The two drawings of Corvane's organization from the opening (p01). The closing reads the drawings against the lead's question: the CTO and the CPO argued about who should lead the eleven teams and nobody had asked what each role was for, which is why both drawings could be defended and neither could be shown to be right.\n\n**Takeaway** (`course_of_action`): Read the chapters in order; with one question about leadership structure in hand, open the chapter that answers it.\n\n**Hand-off** to [Executive Roles and Reporting Lines](executive-roles-and-reporting-lines.html): `example`: The part's claim that leadership structure is derived from the decisions that must be joined. → The executive level, where the first such joining is made or missed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | description (list) | Each of the four chapters answers one question, in this order: which executive roles are needed and who reports to whom, how product, engineering and design share decisions at each level, how many people a manager should have and how many layers follow, and what senior technical leaders own that managers do not. |  |  |\n| p09 | synthesis | The four chapters build a leadership structure from the top down and then across; at Corvane the two leaders argued about who should lead the eleven teams and nobody had asked what each role was for; a leader who has the four answers can explain each role and layer by the decisions it joins and can remove or decline one that joins none, and the first chapter starts at the executive level, where the first joining is made or missed. |  | `conclusion_summary`: The four chapters and their questions. → What they add up to for Corvane's two drawings and for the reader, and the first chapter. |\n\n## Non-goals\n\n- Teaching any chapter's content: executive configurations, the triad's division of decisions, the arithmetic of spans and layers and the staff-plus archetypes are named and glossed, not argued. See [Executive Roles and Reporting Lines](executive-roles-and-reporting-lines.html), [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html), [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html), [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html).\n- The part's closing verdict on the two drawings (that nobody had said which decisions the CTO and the CPO make together). See [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html).\n- Team sizes, from which spans are derived. See [Team Size and Composition](team-size-and-composition.html).\n- The instruments of technical governance that the technical track uses. See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- What AI changes; part introductions carry no AI section.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The hook follows the ledger's correction line: the drawings disagreed about who led eleven of the teams. The page does not say how many teams the drawings showed in total, nor which eleven; chapter 18 should.\n- The ledger's stage table says 'CPO hired' and the cast says Priya Nambiar was 'CPO from 2025'; the page says she was appointed Corvane's first CPO, as the ledger's Part V line instructs.\n- The page names Larson's rule of thumb for a manager of managers (four to six managers) from the journal-spec entry of chapter 20 and cites An Elegant Puzzle for it; chapter 20 should confirm the wording against the author's notes.\n\n## Decision log\n\n- **2026-11-19** — The post entry in the journal spec has a question and no thesis. A part introduction performs the part's opening, so this spec uses the part's thesis and its four supporting claims P5-1 to P5-4 unchanged; they are the part's, not the page's own. Intent outcome, AC-1 and role are copied from the post entry; the hook from the part's opening, with the ledger's correction (eleven of the teams). Rejected: Writing a separate thesis from the page's question.\n- **2026-11-19** — Same shape as the Part IV introduction, which passed its check: three lead paragraphs, two sections of two units each, and 'Chapters in this part' as the headed conclusion with two units (the chapter list, and one closing paragraph holding the synthesis, the callback, the so-what and the hand-off to chapter 18). Rejected: A separate reading-order section after the list.\n- **2026-11-19** — The four chapters of Part V are not written yet, so the page describes them from their journal-spec entries only and names no worked example of theirs.\n- **2026-11-19** — The page does not give the part's closing verdict on the two drawings (which decisions the CTO and the CPO make together) or the closing's 'four answers to one question'; it says only that nobody had asked what each role was for. Rejected: Stating the verdict in the introduction: it would spend the part's closing callback.\n- **2026-11-19** — Flow rubric (one fresh reader, order of ideas only): sound with notes. Taken: p05 introduces the two lenses as the book's before using them; p07 states the tie to Part IV in the same direction as p04 (Part IV is an input: its governance relies on the roles the technical track holds), where the first wording read as a hand-off to Part IV. Rejected: Merging the chapter list into the list of the four places: the page format ends with 'Chapters in this part', and AC-1 and the brief require the list of links with their questions.; Moving the lenses and the ties to Parts II and IV out of the paragraph on the order (p07) into p05: the earlier part introductions were asked to carry the lenses into the reading-order paragraph, and p05 already names them.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — Lessons from the earlier part introductions applied in the spec: the two lenses are named in p05 and carried into the paragraph on the order (p07); only the chapters' questions are counted as 'four questions', the lead's question is called 'the question of what each role is for'; every term a later chapter owns is glossed in one clause; the closing paragraph states the part's so-what.\n- **2026-11-19** — After draft-check round 1 (revise: 25 pass, 7 fail, all flow; two corroborated) and round 2 (revise: 24 pass, 10 fail; one corroborated point counted under two checks). Draft fixes only, no change to order or argument: the credit to Larson moved from the section opening into the spans item; each of the three executive configurations now states its trade; the reason for the test stands next to the test; the technical-track item says why a manager is not placed to make a decision that crosses reporting lines. After round 2 the named unit (p06) was revised once and the check was not run again, by the two-round rule; the round-2 report is stale and its findings are left for the author to waive.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-5, its post entry part-5, and the entries of executive-role <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
