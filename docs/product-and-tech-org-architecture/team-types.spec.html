<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four team types: stream-aligned, platform, enabling and complicated-subsystem, and what each owns.\n- **Know:** How the product-team topology in Empowered (platform and experience teams) and the 'right team' of Build What Matters map onto them.\n- **Believe:** Stream-aligned teams are the default, and every other team has to justify itself by what it does for them.\n- **Be able to:** Classify a described team by type, or say that it fits none and what that usually means.\n- **Be able to:** Decide whether a proposed platform, enabling or complicated-subsystem team is justified.\n\n**Audience:** Executives (CTO, CPO, VP, Director) who approve or refuse new teams, and individual contributors who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work day to day.\n- From earlier chapters: Conway's Law, cognitive load and its limit, fracture planes, the constraint of a flow and why work waits in queues between teams.\n\n**Does not yet know:**\n\n- stream and stream-aligned team\n- platform team\n- enabling team\n- complicated-subsystem team\n- functional team\n- component team\n- experience team (Empowered)\n- self-service\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given short descriptions of four teams, the reader assigns each a type or says it fits none, with the reason. *Probe:* Classify these and justify each: (1) a team that owns checkout end to end; (2) a team of six QA engineers who test every team's releases; (3) two senior engineers who spend a quarter with each team teaching it to run its own load tests; (4) a team that maintains the route-optimization solver that needs operations-research PhDs. | `custom` | cold_reader | major |\n| AC-2 | The chapter states when each of the three non-stream types should not be created. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Which kinds of teams does an organization need, and when is each one justified?\n\n> **Claim:** An organization needs four kinds of team: stream-aligned teams that own a flow of user value end to end, and three kinds that exist for them — platform teams that remove mechanics they would otherwise each carry, enabling teams that close a skill gap and then leave, and complicated-subsystem teams that hold knowledge too specialized to spread; each of the three is justified only when it lowers the load or the waiting of stream-aligned teams, and a team that fits none of the four, such as a functional QA or release team, adds a hand-off inside the stream.\n\n**Disputed by:** The functional organization, in which teams are formed around a skill or a layer because specialists work best together and are cheaper to manage that way.\n\n**So what:** A leader asked for a new team first names its type and the stream-aligned teams it serves, and declines the request when no stream-aligned team's load or waiting would fall; an existing team that fails the test is folded into the streams it serves or turned into one of the three serving types.\n\n**How and why:** A hand-off between teams is where work waits and where no one holds the whole outcome; a team aligned to a stream has no hand-off inside the stream. But one team cannot also carry infrastructure mechanics, every specialty and rare specialist knowledge, so those are taken off it by teams whose only purpose is to take them off.\n\n**Supporting claims**\n\n- **S1** — A stream-aligned team owns one flow of user value end to end and is the default type, because a hand-off between teams is where work waits and where no one holds the whole outcome.\n- **S2** — A platform team is justified when several stream-aligned teams carry the same mechanics and can be given them as a self-service; without both it is a queue or a platform nobody asked for.\n- **S3** — An enabling team is justified when several stream-aligned teams lack a skill they can learn, and only while it leaves each team able to do the work without it.\n- **S4** — A complicated-subsystem team is justified when a part needs knowledge that is rare and slow to grow and that part changes mostly apart from the streams that use it.\n- **S5** — A team that fits none of the four types, such as a functional QA or release team, puts a hand-off and a queue inside the stream, and is folded into the streams or turned into one of the three serving types.\n- **S6** — The four types work as one test a leader can apply to any proposed or existing team: name the type, name the stream-aligned teams it serves, and say whose load or waiting falls and how that will be measured.\n\n## Role in the part\n\nSupplies the vocabulary of team types and the justification test that the rest of the part and Part IV's platform chapter rely on. Supports P2-1 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in stream-aligned, platform-teams, enabling-teams, complicated-subsystem-teams, fits-no-type, sources-differ, name-the-type: each uses only types defined before it)\n\nThe reader first meets three requests for a new team that all sound reasonable, so that the types arrive as the means of deciding them. The stream-aligned team comes first because the three serving types are defined by what they take off it; defined earlier they would have nothing to serve. The three serving types follow in the order in which a growing company usually meets them, shared mechanics, then missing skills, then rare knowledge; that order is a convention and nothing breaks if two of them swap. Teams that fit no type come after all four, because 'fits none' can only be said once the four are known, and that section gives the reply to the functional organization. The comparison with the two product books comes next: its terms, experience team and platform team, can be mapped only onto types already defined, and its reading of the layer structure refers back to the functional team just defined. The pattern comes after it because the procedure uses every type, the fits-none case and the names under which a request may arrive; within it the steps for a proposed team and the questions for an existing team stand together, and the ratio follows as a check on the result of both. The worked example applies the procedure to the opening requests, and the AI section is a coda that applies the same test to a new kind of team.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In one month of 2024 Corvane's VP Engineering received three requests for a new team: six testers to check every release, three specialists for travel-time estimation, and a second platform team for test environments. Each came with a good reason, and Corvane had no way of telling a team that would help from one that would become the next queue.\n\n**Bridge:** Most leaders have approved a team that sounded sensible (a QA group, a tools team, an architecture team) and later found other teams waiting on it. → Whether a new team helps depends on what kind of team it is and on what it does for the teams that deliver to users, and there are only four kinds worth having.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): An organization needs four kinds of team: stream-aligned teams that own a flow of user value end to end, and three kinds that exist for them: platform teams that remove mechanics they would otherwise each carry, enabling teams that close a skill gap and then leave, and complicated-subsystem teams that hold knowledge too specialized to spread. Each of the three is justified only when it lowers the load or the waiting of stream-aligned teams, and a team that fits none of the four adds a hand-off inside the stream.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See three reasonable requests for a new team arrive at once. *Kept in:* three-requests.\n- Define the stream-aligned team and say why it is the default. *Kept in:* stream-aligned.\n- Take the three serving types one by one, each with the test for when it is justified and when it should not be created. *Kept in:* platform-teams, enabling-teams, complicated-subsystem-teams.\n- Recognize teams that fit no type and what they do to a stream. *Kept in:* fits-no-type.\n- Map the team types of Empowered and Build What Matters onto the four. *Kept in:* sources-differ.\n- Turn the types into a procedure for a proposed or an existing team. *Kept in:* name-the-type.\n- Decide Corvane's three requests, and see what AI changes. *Kept in:* worked-example, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In one month of 2024 three requests for a new team reached Corvane's VP Engineering, each with a good reason, and Corvane had no way to tell a team that would help from one that would become the next queue. | scenario: Corvane, the fictional company this book follows, 2024, 180 people, eleven product teams and a platform team of five. New ledger facts: three requests to Dario Vance in the quarter after the release-path pilot: a QA team of six, a travel-time team of three, a second platform team of four for test environments. |  |\n| p02 | claim | An organization needs four kinds of team, one that owns a flow of user value and three that exist for it, each of the three justified only by lower load or less waiting for the first; the chapter takes them one by one and ends by deciding the three requests. |  | `problem_solution`: Three reasonable requests and no test. → The test in one claim, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Three Requests in One Month\n\n**Controlling idea** (`example`, id `three-requests`): Each of Corvane's three requests answered a real problem, and without a test for what a new team does to the teams that deliver to users, the natural answer to all three was yes.\n\n**Advances the thesis** (S6): Gives the case the chapter decides: three proposed teams that cannot be told apart by how reasonable they sound.\n\n**Transition in:** `elaboration`: The three requests named in the lead. → Who asked, for what and why.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description (table) | The three requests came from different people, each with a stated reason that was true. | table: Request \\| Asked by \\| Reason given. A QA team of six testers who test every release before it goes out \\| two engineering managers \\| product teams were starting to release without a platform engineer's check, and someone independent should test. A travel-time team of three \\| the manager of the Scheduling team \\| travel-time estimation is hard, built on map data and a routing library, and distracts the team from scheduling rules. A second platform team of four for test environments \\| Lena Brandt, who leads the platform team \\| seven of the eleven product teams maintain their own scripts for setting up a test environment. |  |\n| p04 | analysis | Corvane had said yes to a reasonable request once before, the platform team of 2023, and had spent 2024 removing the launch queue that followed, so Dario Vance wanted a test before three more teams. | scenario: Ledger: the platform team of five was created to help eleven product teams release faster, and by 2024 launches waited at it (three product teams needed it for every launch, all eleven for some; 14 open requests at the peak); lead time 4 days to 19; the 2024 release path let a team run its own release. Dario Vance, VP Engineering, joined 2023. | `contrast`: Three true reasons. → Why true reasons were not enough, given what Corvane had just lived through. |\n\n### Stream-Aligned Teams: The Default\n\n**Controlling idea** (`definition`, id `stream-aligned`): The stream-aligned team, which owns one flow of user value from idea to production, is the default type because it has no hand-off inside the stream, and the other three types exist because one team cannot carry everything a stream needs.\n\n**Advances the thesis** (S1): Defines the type the other three are measured against and gives the reason it is the default.\n\n**Transition in:** `problem_solution`: The need for a test. → The source of the test, Team Topologies, and the first of its four types.\n\n**Order of paragraphs** (`prerequisite_order`): The definition comes first, then the reason it is the default, then its limit, which is what the serving types answer, and last the test and the picture of all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Team Topologies names four team types, and the first, the stream-aligned team, owns one stream, a continuous flow of work for a user or a business capability, from idea to production and for the long term. | quotation: Skelton and Pais, Team Topologies (2019): \"A “stream” is the continuous flow of work aligned to a business domain or organizational capability.\" The four types named in the book: stream-aligned, platform, enabling, complicated-subsystem. |  |\n| p06 | explanation | The stream-aligned team is the default because a hand-off between teams is where work waits and where no one holds the whole outcome, and a team that owns the stream end to end has no hand-off inside it. | reasoning: Chapter 5: most lead time is waiting between teams. Chapter 1: the Two Calendars fault sat between teams. Team Topologies asks how to reduce or avoid handovers between teams in the main flow of change. | `cause_effect`: End-to-end ownership of a stream. → Why that ownership makes this type the default. |\n| p07 | explanation | Owning a stream end to end means holding every capability the stream needs, and one team cannot hold its domain plus infrastructure mechanics, every specialty and rare specialist knowledge, which is the Overloaded Team and the reason three other types exist. | source: The capabilities a stream-aligned team needs, from Team Topologies as recorded in the author's checklist: product management, design, development, testing, user experience, security, infrastructure and operability, monitoring; with the check that a capability does not have to be a separate specialist role. Chapter 4: cognitive load has a limit. | `contrast`: No hand-off inside the stream. → The price of that: everything the stream needs has to fit in one team. |\n| p08 | claim (figure) | The three other types each take one kind of load off stream-aligned teams, and all three answer to the same two questions: whose load falls, and whose waiting falls. | figure: Mermaid flowchart: 'Stream-aligned teams: each owns one flow of user value' -> 'Users'; 'Platform team' -> streams, edge 'takes off: mechanics every team repeats'; 'Enabling team' -> streams, edge 'takes off: a skill gap, then leaves'; 'Complicated-subsystem team' -> streams, edge 'takes off: rare specialist knowledge'.; reasoning: The two questions are the book's wording of the Team Topologies position that the three types exist to reduce the cognitive load of stream-aligned teams; adding 'waiting' is the author's extension from chapter 5. | `problem_solution`: A team that cannot hold everything. → Three types that take load off it, and the test all three face. |\n\n### Platform Teams: Mechanics Carried Once\n\n**Controlling idea** (`definition`, id `platform-teams`): A platform team carries once the mechanics that every stream-aligned team would otherwise carry itself, and is justified only when several teams repeat those mechanics and can use the platform without asking.\n\n**Advances the thesis** (S2): Defines the first serving type and states when it is and is not justified.\n\n**Transition in:** `example`: Three serving types under one test. → The first of them, the one most companies create first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A platform team owns internal services and tools, such as release pipelines, environments and monitoring, that stream-aligned teams use to do their own work, so that the mechanics are built and maintained once. | quotation: Team Topologies: \"The platform team’s knowledge is best made available via self-service capabilities via a web portal and/or programmable API\". Self-service defined: a team can use it without filing a request and waiting. Corvane: the platform team holds the deployment scripts and the shared data model since 2023. |  |\n| p10 | recommendation | A platform team is justified when several stream-aligned teams repeat the same mechanics and the platform can offer them self-service; it should not be created for one or two teams, ahead of any team's stated need, or when it can only work by request. | reasoning: Do not create when: fewer than about three teams carry the mechanics (author's rule of thumb); no team has asked (The Platform Nobody Asked For); the team can only serve by ticket, which trades load for a queue (chapter 4). User: the stream-aligned teams. Outcome measures: the share of uses completed without a request to the platform team, and the stream teams' lead time. How a platform is run and judged is chapter 15's. | `elaboration`: What a platform team owns and how it is consumed. → When that is worth a team and when it is not. |\n\n### Enabling Teams: A Skill Gap Closed, Then an Exit\n\n**Controlling idea** (`definition`, id `enabling-teams`): An enabling team closes a skill gap in stream-aligned teams by teaching and then leaves, and is justified only when several teams lack a skill they can learn and the team's success is measured by its exit.\n\n**Advances the thesis** (S3): Defines the second serving type and states when it is and is not justified.\n\n**Transition in:** `contrast`: Mechanics that can be handed to a platform. → A load that cannot be handed over because the team has to hold it itself: a skill.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | An enabling team is a few specialists in one area who work with a stream-aligned team for a limited time so that the team can afterwards do the work itself, and it owns no part of the product. | source: Team Topologies, as recorded in the author's checklist: the enabling team helps teams learn rather than taking over the work, aims at the autonomy of the teams it helps, works for a limited period, avoids becoming a permanent dependency. Corvane 2024: a platform engineer worked inside Scheduling for the first six weeks of the release-path pilot (enabling work done without an enabling team). |  |\n| p12 | recommendation | An enabling team is justified when several stream-aligned teams lack the same learnable skill; it should not be created to do the work for the teams, for a single team's gap, or without an end date for each engagement. | reasoning: Do not create when: the specialists would do the work permanently (that is a functional team under another name); only one team has the gap (hire or train inside it); engagements have no end. User: the stream-aligned team being helped. Outcome measure: whether the team does the work without the enabling team a quarter after the engagement ends; the enabling team's count of completed exits. An enabling team that teams still depend on has failed (author's record). | `elaboration`: A team defined by leaving. → When such a team is worth creating and when it is not. |\n\n### Complicated-Subsystem Teams: Knowledge Too Rare to Spread\n\n**Controlling idea** (`definition`, id `complicated-subsystem-teams`): A complicated-subsystem team owns a part that needs knowledge too rare and too slow to grow for stream-aligned teams to hold, and is justified only when that is true and the part changes mostly apart from the streams that use it.\n\n**Advances the thesis** (S4): Defines the third serving type and states when it is and is not justified.\n\n**Transition in:** `contrast`: A skill that teams can learn in weeks. → Knowledge that they cannot, and the type that holds it for them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | A complicated-subsystem team owns one bounded part of the system whose safe change needs specialist knowledge that is hard to find or grow, so that the stream-aligned teams using that part do not have to hold it. | quotation: Team Topologies: \"The goal of this team is to reduce the cognitive load of stream-aligned teams working on systems that include or use the complicated subsystem.\" The notes add that the expertise is typically hard to find or grow. Examples recorded in the author's checklist: a video processing engine, a mathematical model, a financial reconciliation engine. |  |\n| p14 | recommendation | A complicated-subsystem team is justified when the knowledge is rare and slow to grow and most changes to the part do not need a stream team; it should not be created for code that is merely unfamiliar, for knowledge an engineer learns on the job, or where most changes would cross the new line. | reasoning: Rarity is the source's condition. The second condition, counting how many changes would need both teams, is the author's extension, using the count of crossing changes from chapter 4. Every such team adds a hand-off, so the number stays small. User: the stream-aligned teams that use the subsystem. Outcome measures: the share of their changes that need the subsystem team, and how long those wait. | `elaboration`: Rare knowledge held by one team. → When that is worth a hand-off and when it is not. |\n| p15 | comparison (table) | Side by side, the three serving types differ in what they take off the stream-aligned teams, and share the form of their test: a condition, a refusal and a measure. | table: Type \\| Takes off the stream-aligned teams \\| Justified when \\| Do not create it when \\| Outcome measure. Platform \\| mechanics every team repeats \\| several teams repeat them and can be served self-service \\| one or two teams need it, no team asked, or it can only work by request \\| uses without a request; stream teams' lead time. Enabling \\| a skill gap \\| several teams lack a skill they can learn \\| it would do the work for them, one team has the gap, or engagements have no end \\| teams doing the work alone a quarter after the exit. Complicated-subsystem \\| rare specialist knowledge \\| the knowledge is rare and slow to grow, and the part changes mostly by itself \\| the code is only unfamiliar, the knowledge is learned on the job, or most changes cross the line \\| share of stream changes that need the team, and their wait. | `conclusion_summary`: Three types, each with its own section. → The three tests in one table. |\n\n### Anti-Patterns: Teams That Fit No Type\n\n**Controlling idea** (`analysis`, id `fits-no-type`): A team that fits none of the four types, most often a functional team formed around one skill, puts a hand-off and a queue inside every stream it touches, and its usual remedy is to fold it into the streams or turn it into a serving type.\n\n**Advances the thesis** (S5): Shows what fitting no type means and answers the functional organization, the position the thesis is disputed by.\n\n**Transition in:** `contrast`: Four types, each with a purpose. → Teams that are none of them, and what they do to a stream.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | analysis | A functional team, such as a QA team that tests every release or a release team that ships every change, does part of every stream's work, so each stream gets a hand-off and all of them share one queue: the Review Bottleneck. | reasoning: Definition: a functional team is formed around one skill or one step (testing, releasing, operations, database). Unlike a platform it does the work itself each time; unlike an enabling team it never leaves; unlike a complicated-subsystem team its knowledge is not rare. The author's checklist of Team Topologies: testing, QA, database, architecture and operations work are not isolated as mandatory hand-off stages. Failure pattern: The Review Bottleneck. |  |\n| p17 | refutation | The functional organization's case, that specialists work best together and are cheaper to manage that way, is right about the craft and wrong about where its cost falls: the saving shows in the function's budget and the waiting shows in every stream. | source: Larson, An Elegant Puzzle: centralized groups either become rigid gatekeepers or become advisory, with a focus on educating; the advisory kind is an enabling team in this chapter's terms (author's reading). The craft's home can be a community of practice across stream teams (author's record communities-of-practice-and-chapters). Condition where the functional form holds (author's judgement): a specialty needed so seldom, such as a yearly security audit, that no stream could keep a specialist busy and little work waits. | `contrast`: The hand-off a functional team adds. → The best argument for such teams, and the reply. |\n| p18 | comparison (table) | Other teams that fit no type are usually one of five kinds, and each has a usual fate: fold into the streams or convert to a serving type. | table: Team as found \\| What it usually means \\| What to do. QA or release team \\| a step of every stream done elsewhere \\| fold testers and release work into the streams; keep a few as an enabling team. Operations or support team for all systems \\| production responsibility moved away from the builders \\| align support to streams; move shared mechanics to a platform. Infrastructure team working by ticket \\| a platform team by what it owns, reached through a queue \\| replace the tickets with self-service. Component team (defined: owns a technical part because the architecture diagram has a box there) \\| a boundary drawn by technology \\| dissolve into streams, or convert to platform or complicated-subsystem if it passes that test. Architecture team that approves designs \\| a gate \\| part-time enabling. Source: the conversions in Team Topologies as recorded in the author's checklist. | `additional_support`: The functional team as the main case. → The other common cases and the usual remedy for each. |\n\n### Where the Sources Differ: Two Types, Four Types, Six Structures\n\n**Controlling idea** (`comparison`, id `sources-differ`): Empowered and Build What Matters describe the same teams under other names and from the product side, and where they differ from Team Topologies the four types are the finer instrument.\n\n**Advances the thesis** (S1, S5): Shows that two product-management sources arrive at the same default and the same placement of testers, and maps their names onto the four types.\n\n**Transition in:** `similarity`: Four types and the teams outside them, all from one engineering source. → Two product books that name the same teams differently.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | comparison | Empowered has two team types: the experience team, which is a stream-aligned team, and the platform team, which covers what Team Topologies divides into platform and complicated-subsystem teams; it has no enabling type. | source: Cagan and Jones, Empowered (2020), the product-team topology, as summarized in the author's record team-topology: experience teams own user- and customer-facing outcomes, aligned by the most natural customer dimension, with as much end-to-end ownership as possible; platform teams provide leverage through shared services, tooling and abstraction and reduce cognitive load; platform teams are not a dumping ground. The mapping onto four types is the author's reading. |  |\n| p20 | comparison | Build What Matters offers six ways of structuring product teams, five of which are choices of stream and one of which, by technical layer, is the functional organization, and its 'right team' puts testers inside the product team. | source: Foster and Nerlikar, Build What Matters (2020), paraphrased from the author's notes: six general ways of structuring teams: by product, by feature, by technical layer, by customer segment or persona, by customer-journey stage, by performance metric. Their considerations: maximize autonomy (minimize dependencies) between teams, minimize the impact of Conway's Law on the customer experience, clear jurisdictions for product managers, the product's life-cycle stage. Their staffing rule of thumb per product team, from the author's record right-team: 5–7 developers, 1 product manager, 0.5 UX designer, 0.3 UI designer, 1–2 QA engineers. | `similarity`: One product book mapped onto the four types. → A second, which starts from structures and from who is in the team, and which lists the functional organization of the previous section among its options. |\n| p21 | synthesis | The real difference is what each source optimizes, flow in Team Topologies and ownership of an outcome in the product books, and the book uses the four types to decide whether a team should exist and the product books to say what a stream-aligned team should own. | reasoning: From the author's record team-topology: Skelton and Pais optimize for flow, Cagan for empowerment, and the two agree far more than they differ. Resolution (author's): two types cannot tell an enabling team from a functional one or a complicated subsystem from a platform, so the four types are used for the existence test; what a stream is and what its team owns is treated in Part III. | `contrast`: Two mappings that mostly agree. → Where the sources really differ, and which the book uses for what. |\n\n### Pattern: Name the Type Before You Approve the Team\n\n**Controlling idea** (`process`, id `name-the-type`): The four types become a procedure: for any proposed team, name its type, the stream-aligned teams it serves, the load or waiting that will fall and the measure; for any existing team, classify it, and fold or convert the ones that fit none.\n\n**Advances the thesis** (S6): Turns the vocabulary into the decision the thesis's so-what describes.\n\n**Transition in:** `sequence`: Four types under several sources' names, and the teams that fit none. → The steps that apply them to a request.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | process (list) | A request for a new team is answered in four steps, and the request is declined when the third has no answer. | reasoning: Steps: (1) name the type the team claims; (2) name the stream-aligned teams it would serve; (3) say what load or what waiting falls for them, and how it will be measured; (4) say what would end the team or shrink it (the exit for an enabling team, the review date for the other two). The user of the pattern is the leader who approves teams; its outcome measures are the share of non-stream teams that can name the teams they serve and a measure, and the ratio of stream-aligned teams to others. |  |\n| p23 | process (figure) | Four questions, one for the defining feature of each type, classify a team that already exists, and a team that answers no to all four is folded into the streams it serves or converted. | figure: Mermaid decision flow, top down: 'Does it own a flow of user value end to end?' yes -> 'Stream-aligned'; no -> 'Does it own tools or services that other teams use in their own work?' yes -> 'Platform'; no -> 'Does it teach teams and then leave?' yes -> 'Enabling'; no -> 'Does it hold rare knowledge of one bounded part?' yes -> 'Complicated-subsystem'; no -> 'Fits none: fold into the streams or convert'. | `similarity`: The steps for a proposed team. → The same test run on a team that already exists. |\n| p24 | evidence | For the ratio that results from both uses of the test, Team Topologies gives a rule of thumb, between six and nine stream-aligned teams for every other team, which shifts the burden of proof and is not a target. | source: Team Topologies' ratio of stream-aligned teams to other team types, roughly 6:1 to 9:1, as recorded in the author's checklist and the record four-fundamental-team-topologies ('the ratio shifts the burden of proof, nothing more'). | `additional_support`: The test for proposed and for existing teams, and the ratio named as its outcome measure. → The source's rule of thumb for that ratio and how to hold it. |\n\n### Worked Example: Corvane's Three Requests, Decided\n\n**Controlling idea** (`example`, id `worked-example`): Run through the four steps, Corvane's three requests produced no new standing team as proposed: the QA team became an enabling pair, the travel-time team and the second platform team were declined, and the existing twelve teams turned out to be of the right types.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): Applies each serving type's test and the fits-none case to one company's requests, with ledger numbers.\n\n**Transition in:** `example`: The four steps and the classification questions. → The three requests of the opening, decided with them.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The table of decisions comes first; the paragraphs after it give the reasoning for each decision and then classify the teams Corvane already had.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | example (table) | Dario Vance put each request through the four steps in 2024, and each got a different answer. | table: Request \\| Type claimed \\| Whose load or waiting falls \\| Decision. QA team of six \\| none of the four: a functional team \\| nobody's; every release would wait for a tester \\| declined as proposed; two quality engineers hired as an enabling team. Travel-time team of three \\| complicated-subsystem \\| Scheduling's load falls a little; 9 of 11 travel-time changes also change a scheduling rule, so most changes would need both teams \\| declined. Second platform team of four for test environments \\| platform \\| seven teams' load would fall, if self-service \\| declined for now; revisit when all eleven teams release without a request to the platform team. |  |\n| p26 | analysis | The QA team was the launch queue again under a new name, and what the two managers needed, confidence in releases that teams run themselves, was a skill the teams could learn. | scenario: New ledger facts: two quality engineers hired in 2024 as an enabling team; they work with one product team at a time for about six weeks, until the team writes and changes its own automated tests in the readiness checks; exit test: the team adds a check without them. After three quarters they had worked with five teams, and all five maintain their own checks. | `elaboration`: The first row of the table. → Why it was declined and what replaced it. |\n| p27 | analysis | The travel-time request named a real type and failed both of its conditions: the knowledge was learnable on the job, and most travel-time changes crossed the proposed line. | scenario: Ledger: travel-time estimation is a separate service built on map data and a routing library; 9 of 11 travel-time changes also changed a scheduling rule in the first half of 2024; in the 2025 re-cut (about 500 people) it was deliberately kept in Scheduling. A part that would pass: a route-optimization solver of the kind Routewise builds (ledger stage 5), stated as a candidate and not as a Corvane fact. | `contrast`: A request that fitted no type. → One that fitted a type and failed its conditions. |\n| p28 | analysis | The test-environments request passed the first platform condition and failed the second: a second platform product would have opened a second queue while the first was not yet self-service for every team. | scenario: New ledger fact: seven of eleven product teams kept their own scripts for test environments. Ledger: at the two-quarter review of the 2024 brief four teams were not yet on the new release path. Decision: not yet; asked again when all eleven teams release without a request to the platform team. | `similarity`: A request that named a real type and failed its conditions. → A second such request, which failed only one. |\n| p29 | analysis | Classified the same way, Corvane's twelve existing teams were eleven stream-aligned teams and one platform team, so the launch queue had not been a fault of type: the platform team was the right type, reached in the wrong way. | scenario: Ledger: eleven product teams (Scheduling, Dispatch, Technician App and eight others) and Platform; the hand-run launch check was a functional step inside a platform team; the 2024 release path made it self-service. How teams reach the platform team is the subject of the next chapter. | `similarity`: The test applied to proposed teams. → The test applied to the teams Corvane already had. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI adds a new candidate for each serving type and leaves the test unchanged; it may raise the bar a serving team has to clear.\n\n**Advances the thesis** (S3, S6): Applies the justification test to AI enablement teams and states, as speculation, how agents could change what a stream-aligned team can carry.\n\n**Transition in:** `additional_support`: The test applied to Corvane's teams of 2024. → The same test applied to the teams AI adds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | analysis | Emerging: organizations are creating AI enablement teams, and by this chapter's test such a team is an enabling team with an exit, or it becomes a functional team that every use of AI waits on. | reasoning: Author's observation as of November 2026, labeled Emerging. Illustration: Corvane's AI Enablement team of stage 5 (2027, 1,100 people), named in the ledger. The shared tooling for agents is a platform question and belongs to chapter 15 and to the AI platform chapter. |  |\n| p31 | claim | Speculative: if coding agents let a stream-aligned team handle unfamiliar mechanics and neighboring specialties at lower load, fewer proposed serving teams will pass the test, while rare knowledge and shared platforms stay justified. | reasoning: Labeled Speculative. It would be confirmed where stream-aligned teams report dropping a dependency on a specialist team after adopting agents, with no rise in incidents. Treated in team-shape-and-roles-with-ai. | `cause_effect`: A new team judged by the old test. → What agents may do to the load side of that test. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The four types are less a catalog than one question asked four ways: a stream-aligned team answers it by delivering to users, and each of the other three by what it removes from the teams that do. A team's name settles nothing; Corvane's platform team was a platform by type and a functional gate by behavior, and its QA request was a gate that became an enabling team.\n\n**So what:** The reader can answer a request for a new team with four steps instead of a judgment of how reasonable it sounds, can classify the teams they already have, and can say of each non-stream team whose load or waiting it lowers.\n\n**Callback:** The three requests that reached Dario Vance in one month of 2024. All three are decided, none as proposed, and the reader can say why each got the answer it did.\n\n**Takeaway** (`course_of_action`): List your teams, give each a type, and for each team that is not stream-aligned write down the teams it serves and the measure by which you would know. The checklist gives the steps.\n\n**Hand-off** to [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html): `sequence`: Four team types and what each is for. → How teams of those types should work with one another, and how that is written down.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | synthesis (list) | Established: four team types, with stream-aligned teams as the majority and the other three existing to reduce their load; a platform consumed self-service; an enabling team that leaves; product-side sources that reach the same default. |  |  |\n| p33 | synthesis (list) | Depends on context: how many teams must share a need before a serving team pays, how rare knowledge has to be, and whether a small company needs any serving team at all. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p34 | synthesis (list) | The author's synthesis: the two-question test with waiting added to load, the crossing-changes condition for a complicated-subsystem team, the mapping of the product books onto the four types, and the four steps for a request are this book's own. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p35 | recommendation (list) | Eight checks let the reader type their own teams and test each team that is not stream-aligned. |  | `sequence`: What to take away. → What to do with it. |\n| p36 | transition | With four team types and what each is for in hand, the next step is how teams of those types should work with one another and how that is written down, which the next chapter takes up. |  | `sequence`: The three requests, decided, and a platform team of the right type. → The question the types leave open: how teams reach each other. |\n\n## Non-goals\n\n- Conway's Law, cognitive load and fracture planes See [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html), [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html).\n- Interaction modes and team APIs: how teams of each type reach each other See [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html).\n- Team size, on-call rotations and the size the platform team needs See [Team Size and Composition](team-size-and-composition.html).\n- How a platform is run and judged: platform as a product, golden paths, developer experience See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- What a stream-aligned product team owns: outcomes, discovery and empowerment See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html), [Outcomes Over Output](outcomes-over-output.html).\n- Quality engineering practice See [Quality and Reliability as Operating Model](quality-and-reliability.html).\n- Team shape with AI and the AI platform See [[team-shape-and-roles-with-ai]], [[ai-platform-governance-and-risk]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts to confirm: the three 2024 requests (QA team of six, travel-time team of three, second platform team of four for test environments; seven of eleven teams keeping their own environment scripts), and the enabling pair of two quality engineers with its six-week engagements and five teams after three quarters.\n- The chapter classifies all eleven product teams as stream-aligned, as the Part II acceptance criterion expects. Identity and Notifications mostly serve other teams and could be read as platform teams; the chapter does not raise this. Should it?\n- The 6:1 to 9:1 ratio is cited from the author's checklist of Team Topologies, not from a highlighted passage in the Kindle notes. Confirm the wording against the book.\n- Empowered is not among the Kindle notes; its topology is cited through the author's record team-topology.\n- The AI section makes no Proven claim; published evidence is left to Part XI.\n\n## Decision log\n\n- **2026-11-19** — The opening scene is three requests for a new team in 2024, not the platform team's launch queue, because the Part II introduction opens with the launch queue and chapters 2 to 5 have told it; the queue is referred to in one paragraph. Rejected: Opening on the platform team of five again\n- **2026-11-19** — Each serving type has its own short section with a definition paragraph and a justified/not-justified paragraph, and one table collects the three tests. Rejected: One long section for all three types; A table only, which would leave the reasons unstated\n- **2026-11-19** — The mapping of Empowered and Build What Matters is placed under 'Where the Sources Differ', after the anti-patterns and before the pattern, and is used by the argument: both product books support the default and Build What Matters places testers in the team. Rejected: A mapping section directly after the stream-aligned definition, before platform is defined\n- **2026-11-19** — Platform operation (product management of a platform, golden paths, developer experience) is left to chapter 15; this chapter states only when a platform team is justified. The size of the platform team is left to chapter 8 and the way teams reach it to chapter 7.\n- **2026-11-19** — A justified complicated-subsystem team is shown only as a candidate (a route-optimization solver of the kind Routewise builds), without adding a stage 5 fact to the ledger. Rejected: Stating that Corvane keeps the Routewise solver as a complicated-subsystem team, which the acquisitions chapter h both flow readers called a detour without losing the thread, is left as decided and reported to the author.\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-engineering-executive/posts/four-fundamental-team-topologies (index.md and checklist.md), static-team-topologies, team-first-thinking — The author's summary and checklist of the four types, the ratio, the conversions of existing team types.\n  - _journals/org-design/posts/team-topologies-operating-model, stream-aligned-product-teams, platform-and-devops-operating-model, quality-engineering-enablement, communities-of-practice-and-chapters — The author's operating-model records for each type and for quality engineering as enablement.\n  - _journals/grounded-product-management/posts/team-topology and right-team — The author's summaries of Empowered and Build What Matters on team topology and team composition.\n  - _research/scenario-ledger.md — Stage 3 structure, the launch queue and the 2024 release path, the six weeks of a platform engineer inside Scheduling, the travel-time counts, the stage 5 AI Enablement team.\n  - journal-spec.json, entries team-types, part-2 (opening) and interaction-modes-and-team-apis (transition_in) — Intent, acceptance criteria, thesis and role, copied unchanged; the hand-off.\n- **External**\n  - Matthew Skelton and Manuel Pais, Team Topologies: Organizing Business and Technology Teams for Fast Flow (2019); author's notes, _input/bookshelf/docs/notes/team-topologies.pdf — The four team types; the definition of a stream; the goal of a complicated-subsystem team; self-service as the way a platform is consumed; avoiding handovers in the main flow of change.\n  - Marty Cagan with Chris Jones, Empowered: Ordinary People, Extraordinary Products (2020), through the author's record team-topology — Experience teams and platform teams; platform teams as leverage and not a dumping ground.\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020); author's notes, _input/bookshelf/doc <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
