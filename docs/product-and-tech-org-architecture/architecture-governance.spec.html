<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The author's three instruments from Grounded Architecture: nudges, taxes and mandates, with advice as the default.\n- **Know:** The advice process and architecture decision records.\n- **Know:** How the right instrument changes with scale and with the cost of divergence.\n- **Believe:** A mandate is the most expensive instrument and should be the rarest.\n- **Believe:** An architect's job is to connect levels and inform decisions, more than to make them.\n- **Be able to:** Choose an instrument for a given technical decision and justify it by the cost of divergence.\n- **Be able to:** Write a decision record others can find and overturn.\n- **Be able to:** Recognize governance that has become a review bottleneck.\n\n**Audience:** Executives (CTO, VP Engineering, Director) who must decide how technical direction is governed, and engineers and architects who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work: services, deployment, code review, on-call\n- From the Part IV introduction and chapter 13: an engineering strategy is a diagnosis and a small set of policies that settle recurring decisions\n- The book's failure-pattern names and its three scarce capacities (attention, judgment, verification)\n\n**Does not yet know:**\n\n- architecture governance\n- advice process\n- decision record (ADR)\n- nudge\n- paved path\n- tax (as a governance instrument)\n- mandate\n- guardrail\n- cost of divergence\n- staff-plus roles (defined in chapter 21)\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given four technical decisions, the reader assigns each an instrument and gives the reason. *Probe:* Assign advice, nudge, tax or mandate to each and say why: (1) which test framework a team uses; (2) whether services may store customer data outside the approved regions; (3) adopting a second programming language; (4) using the shared logging format. | `custom` | cold_reader | major |\n| AC-2 | The chapter says how governance relies on the staff-plus roles defined in chapter 21 and links to it. | `known_before_new` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Who decides technical direction, and with how much force?\n\n> **Claim:** Technical direction should be decided as close to the work as the cost of divergence allows: by default the team decides after seeking advice and records the decision; where consistency pays, the organization nudges with a paved path or taxes the divergent choice with the cost it imposes on others; and it mandates only where divergence creates risk the team cannot carry, such as legal exposure or security.\n\n**Disputed by:** The architecture-board model, in which a central group approves designs before work starts because consistency and risk control require it.\n\n**So what:** A leader replaces most approvals with advice and records, keeps a short written list of mandates with reasons, and measures governance by how long a decision waits.\n\n**How and why:** A central approver is a queue at the point where verification is scarcest, and it sees each decision with less information than the team. Instruments that change the cost of a choice leave the decision with the team and still move the landscape, and they scale with the number of teams where a board does not.\n\n**Supporting claims**\n\n- **S1** — A central board that approves designs is the wrong default: it is a queue at the point where verification is scarcest, and it decides with less information than the team.\n- **S2** — The default is advice and a record: the team decides after seeking advice from the people affected and the people with expertise, and writes a decision record that others can find and overturn.\n- **S3** — Where a team's choice puts cost on others, the organization changes the cost of the choice with a nudge or a tax and leaves the decision with the team; it mandates only where divergence creates risk the team cannot carry, and a mandate is the most expensive of the instruments.\n- **S4** — The instrument is chosen by the cost of divergence, is raised only on evidence, and the mix of instruments changes as the organization grows.\n- **S5** — Governance of this kind is carried by senior technical leaders who connect levels and inform decisions more than they make them, and it is judged by how long a decision waits.\n\n## Role in the part\n\nSays how the strategy's policies are enforced without creating a review bottleneck. Supports P4-2 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `small_to_large` in advice-and-record, three-instruments: the instruments are introduced from the least force to the most; `prerequisite_order` in three-instruments, choosing-the-instrument, who-carries-governance: the instruments are defined before the procedure that chooses among them, and the procedure before the roles that run it)\n\nThe reader first meets a board that is slow and still fails to produce consistency, then the reason a board behaves so, then the default that replaces it, then the stronger instruments for the cases the default does not cover, then how to choose among them, then who carries the work. Failures come after the model because two of the three are failures of the replacement. The worked example comes after everything it uses and returns to the opening case. Choosing before defining would be choosing by name; the roles before the instruments would be a job description with no work in it. The reason a board fails comes before the default because the default is derived from the two faults; put after it, advice would read as a preference. The failures come after the roles because the veto without a record and the growing rulebook are failures of the people who carry governance.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In the first half of 2026 Corvane's architecture forum approved 33 of the 36 designs put to it, after a median wait of 23 days, and the company still ran four ways of deploying, three message brokers and two identity libraries.\n\n**Bridge:** Most readers have waited for an architecture review, or sat on one, and have seen a landscape that the reviews did not keep consistent. → Both the wait and the divergence come from asking one group to approve; the question is who should decide technical direction, and with how much force.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Technical direction should be decided as close to the work as the cost of divergence allows: by default the team decides after seeking advice and records the decision; where consistency pays the organization nudges or taxes; it mandates only where divergence creates risk the team cannot carry.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See Corvane's forum and the broker request it could not decide well. *Kept in:* the-forum-and-the-broker.\n- Understand why a central approving board is the wrong default. *Kept in:* why-a-board-is-the-wrong-default.\n- Learn the default: the advice process and the decision record. *Kept in:* advice-and-record.\n- Learn the three stronger instruments, nudge, tax and mandate, and how to choose among them by the cost of divergence. *Kept in:* three-instruments, choosing-the-instrument.\n- See who carries governance. *Kept in:* who-carries-governance.\n- Recognize three ways governance fails. *Kept in:* anti-patterns.\n- Follow the broker decision at Corvane. *Kept in:* worked-example.\n- Know what AI changes. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane's architecture forum approved nearly every design after weeks of waiting and the landscape diverged anyway, and now three teams want a new message broker. | scenario: Corvane, 2026, about 500 people, about thirty teams: 33 of 36 designs approved, median wait 23 days; four ways of deploying, three message brokers, two identity libraries; three teams ask for a new broker. |  |\n| p02 | claim | Technical direction should be decided as close to the work as the cost of divergence allows, through advice and a record by default, a nudge or a tax where consistency pays, and a mandate only for risk a team cannot carry; the chapter takes these in order. |  | `problem_solution`: A forum that is slow and a landscape that still diverged; from the previous chapter, policies that settle recurring decisions and the open question of how they are applied across many teams. → The instruments of governance, from advice to mandate, the record that holds each decision, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: A Forum That Approves and a Landscape Nobody Chose\n\n**Controlling idea** (`example`, id `the-forum-and-the-broker`): At Corvane in 2026 an architecture forum approved nearly every design, late, while the landscape diverged anyway, and a request for a new message broker showed that the forum had neither the speed nor the information to decide it.\n\n**Advances the thesis** (S1): Gives the case the chapter's opposing view produces: a board that is a queue and still does not produce consistency.\n\n**Transition in:** `elaboration`: The lead's short account of the forum and the broker. → The situation in full: the rule, its results and the request.\n\n**Order of paragraphs** (`chronological`): The forum's rule comes first, then what a year of it produced, then the request that arrives into it; the request only reads as a problem once the queue is known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Corvane's architecture forum, set up in 2025, was a meeting of senior engineers that had to approve any design that added a technology or changed an interface between teams before work started. | scenario: Corvane, 2025–2026, about 500 people, about thirty teams. Dario Vance, VP Engineering, sets up the forum in 2025; a meeting of senior engineers (ledger, chapter 13) chaired by Samir Haddad, attended by whoever else could come; meets every second week and hears three designs a meeting. |  |\n| p04 | description | In the first half of 2026 the forum approved 33 of 36 designs, 27 of them unchanged, after a median wait of 23 days, and the landscape still held four ways of deploying, three message brokers and two identity libraries. | scenario: Illustrative figures: 36 designs submitted in the first half of 2026, 33 approved, 27 unchanged, median wait 23 days from submission to hearing. Ledger (chapter 13): eleven requests in 2025–2026 for a new way of deploying, messaging or checking identity, most granted. Ledger: four ways of deploying, three message brokers, two identity libraries in 2026. | `cause_effect`: The forum's rule. → What a year of the rule produced. |\n| p05 | description | Three teams asked for a new message broker while two others still used the oldest one, and the forum discussed the request in three sessions over six weeks without deciding, with less knowledge of the need than the teams asking. | scenario: Ledger: three teams want a new message broker that can replay messages; two others use the oldest one; the forum discussed it in three sessions over six weeks with different attendees and did not decide (chapter 13). New: the three are Dispatch, Notifications and Technician App; the two are Billing Integrations and Stock Integrations, which receive schedule-change events. | `example`: A queue that approves nearly everything. → The request that the rest of the chapter follows. |\n\n### Why a Central Board Is the Wrong Default\n\n**Controlling idea** (`explanation`, id `why-a-board-is-the-wrong-default`): A central approving board answers a real need for consistency and risk control with the wrong mechanism: it queues decisions where verification is scarcest and makes them with less information than the team has.\n\n**Advances the thesis** (S1): Argues the first supporting claim against the view the thesis disputes, after stating that view's case.\n\n**Transition in:** `cause_effect`: Corvane's forum and its results. → Why a board produces those results wherever it is set up.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The board's case is stated first so that the two objections answer it; the principle that replaces it comes last because it is derived from the two objections.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | counterargument | The board model exists for a good reason: some technical choices should be made once for the whole company, and Enterprise Architecture as Strategy describes the classical mechanisms that enforce such choices, a compliance process, an exception process and a central standards team. | source: Ross, Weill and Robertson, Enterprise Architecture as Strategy: standardization brings efficiency and predictability and limits local innovation; the IT engagement model as 'the system of governance mechanisms' linking company-wide and project decisions; an architecture compliance process, an architecture exception process, a centralized standards team. |  |\n| p07 | cause_effect | A board that must approve is a queue at the point where verification is scarcest, because the designs to check grow with every team and the board does not; the book names this failure the Review Bottleneck, defined here as an interface built as an approval queue. | reasoning: The book's failure pattern The Review Bottleneck (an interface designed as an approval queue); verification as one of the book's three scarce capacities; Corvane's 23 days and five people for thirty teams. | `contrast`: What the board is for. → What the board costs: a wait that grows with the number of teams. |\n| p08 | definition | The board also decides with less information than the team, so the chapter's principle is to decide as close to the work as the cost of divergence allows, where the cost of divergence is what one team's different choice costs other teams and the company. | quotation: Hohpe, The Software Architect Elevator: 'The worst-case scenario materializes when people holding relevant information or expertise aren't empowered to make decisions, whereas the decision makers lack relevant information.' | `additional_support`: The queue. → The second fault, information, and the principle that follows from both. |\n\n### Pattern: The Advice Process and the Decision Record\n\n**Controlling idea** (`process`, id `advice-and-record`): By default the team decides after seeking advice from the people affected and the people with expertise, and writes the decision in a record that anyone can find and a later decision can overturn.\n\n**Advances the thesis** (S2): Supplies the default instrument and the record that holds every decision, whichever instrument is used.\n\n**Transition in:** `problem_solution`: A decision that should sit near the work. → The practice that leaves it there and still brings wider knowledge to it.\n\n**Order of paragraphs** (`prerequisite_order`): The advice process comes first because the record documents it; the record's parts come before the properties that make it findable and overturnable; the forum and the measure come last because they are how an organization runs the first three. The measure is its own unit because the worked example and the conclusion rely on it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | In the advice process anyone may make an architectural decision provided they first seek advice from everyone meaningfully affected and from people with expertise; they must listen and record the advice, and they need not follow it. | source: Andrew Harmel-Law, 'Scaling the Practice of Architecture, Conversationally' (martinfowler.com, 15 December 2021), fetched and read: 'The Rule: anyone can make an architectural decision.'; the qualifier names two groups to consult; decision-takers are not obliged to agree; 'We are not looking for consensus here'. |  |\n| p10 | definition (table) | A decision record is a page or two with a fixed set of parts, five from Michael Nygard's format plus the advice received and a condition for revisiting. | table: Seven rows: title, status, context, decision, consequences (Nygard, 'Documenting Architecture Decisions', 15 November 2011, fetched and read); advice received (Harmel-Law); revisit when (the author's addition). Columns: part, what it holds. | `sequence`: Advice sought and heard. → Where the advice and the decision are written down. |\n| p11 | explanation | A record governs only if others can find it and overturn it: records sit in one searchable place with their status, and a decision is overturned by a new record that supersedes the old one, which is kept. | source: Nygard: records kept in the project repository; 'If a decision is reversed, we will keep the old one around, but mark it as superseded.' The author's records markdown-records and decisions-stay-with-teams. | `elaboration`: The parts of a record. → The two properties that make a record an instrument of governance. |\n| p12 | recommendation | The pattern's users are the deciding team and the teams its decision affects, and a standing advisory forum, weekly and with no power to approve, gives them a place to ask. | source: Harmel-Law's Architecture Advisory Forum: weekly, decisions 'still owned and made by the originators'; the author's record architecture-advisory-forum. | `sequence`: The record. → The forum that feeds it, who the pattern is for and how it is judged. |\n| p12b | recommendation | The pattern is judged by how long a decision waits, the days from a team's question to its recorded decision, kept honest by the share of records that list advice from outside the team. | reasoning: The author's two measures: days from question to recorded decision; share of records listing outside advice. A short wait with no outside advice means teams have stopped asking. | `additional_support`: Who the pattern is for and where they ask. → How one would know it worked. |\n\n### Three Instruments Above Advice: Nudge, Tax and Mandate\n\n**Controlling idea** (`definition`, id `three-instruments`): When a team's choice puts cost on others, Grounded Architecture offers three stronger instruments, of which the nudge and the tax change the cost of a choice and leave it with the team, and the mandate removes the choice and costs the most.\n\n**Advances the thesis** (S3): Defines the three instruments of the thesis and argues that the mandate should be the rarest.\n\n**Transition in:** `contrast`: Advice, which leaves a team free to choose. → The cases where free choice puts cost on others, and three instruments for them.\n\n**Order of paragraphs** (`small_to_large`): The instruments are defined from the least force to the most, because each is used only where the one before it does not suffice; the comparison table needs all four defined; the argument about the mandate's cost comes last because it compares the mandate with the other three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | Advice does not stop a well-advised team from making a choice that is good for it and costly for others, and for that case Grounded Architecture describes governance as a portfolio of three influences: nudges, taxes and mandates. | source: Grounded Architecture, governance page: a hybrid governance model; nudges, taxes and mandates as 'a portfolio of influences rather than a single enforcement style'. |  |\n| p14 | definition | A nudge makes the preferred choice the easy one without forbidding the others, and its main form in engineering is the paved path, a ready-made and supported way of doing a common task. | quotation: Thaler and Sunstein, Nudge: a nudge 'alters people's behavior in a predictable way without forbidding any options or significantly changing their economic incentives'; 'Default options thus act as powerful nudges.' Grounded Architecture applies it to golden paths, dashboards and principles. | `example`: Three influences. → The first and gentlest. |\n| p15 | definition | A tax leaves the choice with the team and makes the team pay the cost its choice puts on others; Grounded Architecture's example is charging cloud cost to the department that incurs it, and the author extends the idea to operating cost. | source: Grounded Architecture: taxation promotes accountability without prohibition; cross-charging public cloud costs. The author's extension: a team that diverges runs, upgrades and is on call for what it chose, and pays for the migration back. | `contrast`: An instrument that changes how easy a choice is. → One that changes what a choice costs the chooser. |\n| p16 | definition | A mandate states what teams must or must not do, and its best form is a guardrail, a limit checked automatically in the delivery path. | source: Grounded Architecture: mandates and bans are 'the most direct forms of governance', reserved for compliance, organizational priorities and strategic constraints. Guardrail as defined in the Part IV introduction; the author's record governance-as-code. | `contrast`: Two instruments that leave the choice with the team. → The one that removes it, and all four compared. |\n| p16b | comparison (table) | Side by side, the four instruments differ in who decides, in how each acts and in what each costs the organization. | table: Four rows (advice, nudge, tax, mandate) by who decides, how it acts, an example and what it costs the organization. | `conclusion_summary`: Three instruments defined, and advice before them. → All four compared. |\n| p17 | analysis | A mandate is the most expensive instrument because it must be enforced and its exceptions handled, it overrides the team's information, and it hides whether the mandated thing is any good, so mandates belong on a short written list with reasons. | reasoning: Grounded Architecture says mandates should be used sparingly and as a last resort; the three costs are the author's argument. The third is the reason chapter 15 gives for platforms earning adoption. | `cause_effect`: The table's last row and last column. → Why the mandate's cost is the highest, and what to do about it. |\n\n### Choosing the Instrument by the Cost of Divergence\n\n**Controlling idea** (`process`, id `choosing-the-instrument`): The instrument for a decision is chosen by asking who bears the cost if a team diverges, it is raised only when evidence shows the weaker one failed, and the mix changes as the organization grows.\n\n**Advances the thesis** (S4): Turns the instruments into a procedure the reader can apply to any technical decision.\n\n**Transition in:** `sequence`: Four instruments and their costs. → How to pick one for a given decision.\n\n**Order of paragraphs** (`prerequisite_order`): The three questions come first, then four decisions sorted by them, then the rule for changing an instrument once chosen, then how the whole mix shifts with size, and last who the instruments serve and how they are judged, which closes the section; each step uses the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | process (figure) | Three questions in order choose the instrument: can the team carry the risk of diverging, does the cost of diverging fall on others, and can a paved path make the common choice the easy one. | figure: Mermaid decision flow, Figure 1: risk the team cannot carry → mandate, as a guardrail where it can be checked; cost stays inside the team → the team decides, advice optional; cost falls on others → advice process and a record, plus a nudge where a paved path exists or is worth building, plus a tax on the divergent choice. |  |\n| p19 | example (table) | Four decisions sorted by the three questions show the range: a date library, personal data in logs, a new database engine and the standard deployment path. | table: Four rows by cost of divergence, instrument and reason: date-handling library (inside the team; team decides); personal data written to logs (legal exposure; mandate as a guardrail); a new database engine (falls on whoever operates and migrates it; advice process, record and tax); the standard deployment path (falls on every engineer who moves and every fix that must reach all paths; nudge by paved path, tax on leaving it). | `example`: The three questions. → Four decisions put through them. |\n| p20 | recommendation | Start with the weakest instrument that could work and raise it only on evidence: when teams leave a paved path, the first question is what is wrong with the path, and a nudge becomes a mandate only when incidents or measured cost show that divergence is doing harm. | reasoning: Thaler and Sunstein in the notes: 'If people know their preferences, and know that they dislike the outcome that is embedded in the default, they will probably change it.' The author's rule: low adoption is information about the path; incidents and measured cost are the evidence for a mandate; a mandate is reviewed and can be lowered. | `elaboration`: Instruments chosen once. → When an instrument should be raised or lowered. |\n| p21 | comparison (table) | The mix of instruments changes with size, shown as what the author would expect at Corvane's five sizes: conversation at twelve people, advice and records at fifty, a paved path at 180, taxes, a mandate list with its first guardrails and an advisory forum at 500, and every checkable mandate as a guardrail at 1,100. | table: Five rows, one per Corvane stage (12, 50, 180, 500, 1,100 people): what changes and the instruments added. Stage sizes from the ledger; the mapping is the author's synthesis and an illustration. | `additional_support`: When to raise or lower an instrument for one decision. → The whole mix as an organization grows. |\n| p20b | recommendation | The users of the three instruments are the teams that choose and the teams that live with the result, and the instruments are working when most teams are on the paved paths by choice, the mandate list stays short and a decision does not wait. | reasoning: The author's measures: share of teams on a paved path by choice; number of mandates on the list; decision wait. | `additional_support`: The mix at each size. → Whom the instruments serve at every size and how to tell they work. |\n\n### Who Carries Governance: Architects as Connectors\n\n**Controlling idea** (`explanation`, id `who-carries-governance`): Advice, paved paths and a mandate list are carried by senior technical leaders, whose job in governance is to connect levels and inform decisions more than to make them.\n\n**Advances the thesis** (S5): Says who does the work the instruments need and links the technical leadership track of chapter 21.\n\n**Transition in:** `cause_effect`: Instruments and a way to choose among them. → The people without whom none of the instruments works.\n\n**Order of paragraphs** (`prerequisite_order`): The dependence on the roles is stated first, then what the two sources say the role is, then the concrete jobs and how they are judged; the jobs are a list without the idea of the connector before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | claim | None of the instruments runs by itself: governance by advice relies on staff and principal engineers and architects, the staff-plus roles that chapter 21 defines. | reasoning: Advice needs someone with cross-team knowledge to give it; a paved path needs someone to notice repeated advice; a mandate list needs an owner. Link to staff-plus-and-architects; the roles are not defined here. |  |\n| p23 | explanation | Hohpe and Grounded Architecture describe the architect as a connector: someone who moves between the level where strategy is set and the level where code is written, and holds architecture, technical detail, business needs and people together. | quotation: Hohpe, The Software Architect Elevator: 'instead of the superhero we need \"super glue\" architects'; the elevator between the penthouse and the engine room as Grounded Architecture's superglue page summarizes it; Grounded Architecture: 'Technical strength is necessary for architects, but it is rarely sufficient.' | `elaboration`: The roles governance relies on. → What the two sources say the role is. |\n| p24 | recommendation | In governance these roles do four jobs, giving advice early, turning repeated advice into paved paths, keeping the mandate list short, and carrying what teams learn back to the strategy, and they are judged by the decisions they improved. | source: Grounded Architecture, general principles of the operating model: 'Architects should help teams make better decisions, not create approval queues.'; on mandates the architecture practice 'serves as a contributor—not the sole authority'. The four jobs and the measures are the author's summary. | `example`: The connector in general. → The connector's four jobs in governance and their measure. |\n\n### Anti-Patterns: The Gate, the Stall and the Growing Rulebook\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Governance fails in three recognizable ways: approval returns under an advisory name, advice is mistaken for agreement, and the mandate list grows after every incident.\n\n**Advances the thesis** (S1, S3): Lets the reader recognize governance that has become a review bottleneck, and the two failures on the way from a board to advice.\n\n**Transition in:** `contrast`: Governance as it should work. → Three ways it fails.\n\n**Order of paragraphs** (`grouping`): One paragraph per failure, ordered from the one the chapter opened with to the two that appear after a board has been replaced.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | analysis | The Review Bottleneck returns whenever teams wait for a forum before they act, whatever the forum is called, and three signs show it: finished designs are presented, nearly all are approved, and work waits for the hearing. | reasoning: The failure pattern The Review Bottleneck; the author's record architecture-as-advice-and-guardrails lists the gate, the invisible veto and the record written afterwards. |  |\n| p26 | analysis | The Consensus Stall is the opposite error: the team treats advice as agreement to be reached and does not decide until every adviser concurs. | source: The failure pattern The Consensus Stall; Harmel-Law: 'We are not looking for consensus here, but we are looking for a broad range of inputs and voices.' | `contrast`: Waiting for a forum's approval. → Waiting for everyone's agreement. |\n| p27 | analysis | The growing rulebook is a mandate added after each incident and never removed, until teams cannot tell the three rules that protect the company from the thirty that record old preferences. | reasoning: The author's observation, marked as such; the remedy is that every mandate names its reason and its owner and is reviewed on a rhythm. | `additional_support`: Two failures of advice. → A failure of mandates. |\n\n### Worked Example: Corvane's New Broker\n\n**Controlling idea** (`example`, id `worked-example`): In 2026 Corvane's engineering strategy made the forum advisory and named shared areas, and the broker request was decided by the owner of the shared area through advice and a record, as a replacement with the migration of existing users planned before adoption.\n\n**Advances the thesis** (S2, S4): Applies the procedure to the case of the opening and gives the answer the Part IV criterion asks for.\n\n**Transition in:** `example`: The instruments, the procedure, the roles and the failures. → All of them applied to the forum and the broker of the opening.\n\n**Order of paragraphs** (`chronological`): The change to the forum comes first because the broker decision runs through the new arrangement; then the advice, then what the record fixed, then the result.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | example (table) | The engineering strategy Dario Vance wrote in 2026 changed the forum's rule from approval to advice and named three shared areas, and Corvane's decisions sorted by the cost of divergence give the mix the size table gave for 500 people. | table: Four rows (what stays inside a team's services; which way of deploying, broker or identity library a service uses; bringing a new technology into a shared area; where customer data is stored) by cost of divergence and instrument. Ledger (chapter 13): the 2026 strategy's rule of one standard per shared area with recorded, self-operated exceptions; a new technology enters a shared area only as a replacement; shared-area choices decided by the Director of Platform after written advice; the forum advises and does not vote. New: the reading of these as nudge, tax and mandate; customer data in approved regions as a mandate checked as a guardrail. |  |\n| p29 | description | Because messaging is a shared area the decision sat with its owner, the Director of Platform, who decided by the advice process, and the advice changed the proposal from a fourth broker to a replacement. | scenario: Ledger (chapter 13): shared-area choices are decided by the Director of Platform after written advice from the teams affected and the forum. New: the three teams wrote the proposal as a decision record; written advice from Billing Integrations and Stock Integrations and from the forum; the need to replay schedule-change events confirmed and tied to step 1 of the product strategy. | `sequence`: The new rule. → The broker request under it. |\n| p30 | analysis | The record fixed what is planned before anyone starts, as the strategy's rule on new technology demands: the new broker is the one standard, the default for new services, and the platform team owns the migration, with the two teams on the oldest broker first and a switch-off date. | scenario: Ledger (chapter 13): a new technology enters a shared area only as a replacement, naming what it retires, who moves the existing users and by when; exceptions are recorded and operated by the team. New: the new broker is named Corvane's one standard for messaging; Platform owns the migration; Billing Integrations and Stock Integrations move first with a switch-off date for the oldest broker; the other two brokers follow with their own dates. Migrations belong to chapter 17. | `cause_effect`: Advice that reshaped the proposal. → The tax and the migration plan the record contains. |\n| p31 | description | The decision was recorded twelve days after the request came under the new rule, against six weeks in the forum without a decision before, and Corvane runs four brokers until the first switch-off date. | scenario: New, illustrative: Lena Brandt recorded the decision 12 days after the request reached her under the new rule; over the following two quarters the median time from question to recorded decision was 6 days. Ledger (chapter 13): six weeks in the forum without a decision. | `cause_effect`: The decision. → What it took and what it left. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents make decision records and automated guardrails more useful and a human approval board less tenable, and the choice of AI tools is itself a governance decision sorted by the same three questions.\n\n**Advances the thesis** (S3, S4): Tests the chapter's argument against cheaper code production, with labeled claims.\n\n**Transition in:** `additional_support`: The governance model at human speed. → The same model when agents write much of the code.\n\n**Order of paragraphs** (`chronological`): What is practised now comes before what may follow from it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | analysis | Emerging: teams that use coding agents give them decision records and paved-path templates as context, so a recorded decision reaches generated code that nobody told about it, and a rule that is an automated check applies to an agent's change as to a person's. | reasoning: The author's observation as of November 2026, marked as such; no published measurement is cited, so no Proven claim is made. |  |\n| p33 | claim | Speculative: when agents multiply the number of changes, a board of people falls further behind and mandates that are not automated checks stop being enforced; Corvane's fourteen teams choosing their own agents in 2027–2028 show the three questions applied to AI tools. | scenario: Ledger: in 2027–2028 fourteen Corvane teams had each chosen their own coding agent, model provider and prompt conventions, and security could not say what data left the company. Reading: what data may leave the company is a mandate; which agent a team uses is a nudge by a supported default. Would be confirmed where review queues lengthen as change volume rises; chapter where-the-constraint-moves weighs the evidence. | `additional_support`: What is practised now. → What is likely to follow, and one Corvane case. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The four instruments are one scale of force with one rule for reading it: the further the cost of a choice travels from the team that makes it, the more force the organization may use, and the record is what makes every point on the scale visible and reversible.\n\n**So what:** A leader replaces most approvals with advice and records, keeps a short written list of mandates with reasons, and measures governance by how long a decision waits.\n\n**Callback:** Corvane's forum that approved 33 of 36 designs after 23 days, and the three teams' broker request. The reader can now say why the forum was slow and the landscape still diverged, and who should decide the broker with which instrument: the owner of the shared area, by advice and a record.\n\n**Takeaway** (`course_of_action`): List the approvals your teams wait for, sort each by the three questions, write the mandates that remain on one page with reasons and owners, and start measuring days from question to recorded decision.\n\n**Hand-off** to [Platforms and Developer Experience](platforms-and-developer-experience.html): `example`: Nudges and paved paths as instruments of governance. → The platform as the paved path made into a product, with its own users and outcome measure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis (list) | Established: the sources agree that some choices should be made once, that a nudge preserves choice and defaults are powerful, that advice is not consensus, and that a superseded decision record is kept. |  |  |\n| p35 | synthesis (list) | Depends on context: which choices are worth consistency, where the line for a mandate falls, and whether a forum is needed depend on the company's size, its regulation and what divergence has already cost. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p36 | synthesis (list) | The author's synthesis: the single scale from advice to mandate ordered by the cost of divergence, the tax paid in operating cost, the rule of raising an instrument only on evidence, and decision wait as the measure of governance are the author's. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p37 | recommendation (list) | Eight checks let the reader sort their own approvals, mandates and records. |  | `sequence`: What to take away. → What to do with it. |\n| p38 | transition | The scale of force explains Corvane's forum and its broker, and its gentlest strong instrument, the paved path, becomes a product in the next chapter. |  | `example`: Nudges and paved paths as instruments of governance. → The platform as the paved path made into a product, with its own users and outcome measure. |\n\n## Non-goals\n\n- Writing the engineering strategy and its policies See [Engineering Strategy](engineering-strategy.html).\n- Running a platform as a product; how a paved path is built and funded See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- Defining the staff-plus roles and their archetypes See [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html).\n- Decision rights and decision records in general (RFCs, decision styles) See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- How a migration is run and finished See [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- Architecture methods, notations and enterprise architecture frameworks\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The worked example was rewritten after round 2 to agree with chapter 13's ledger line (the Director of Platform decides shared-area choices after advice). The thesis says 'by default the team decides'; the chapter reads the owner of a shared area as the team closest to that work. The author should confirm this reading, or ask chapter 13 for a different decision right.\n- The round-2 check report is stale against the final draft (revision after round 2, including the worked example); a further check would be a third round.\n- New Corvane facts (36 designs, 33 approved, 27 unchanged, 23 days; the three and the two teams by name; the broker named the one standard; 12 and 6 days) should be checked against chapters 15 and 17.\n- The tax paid in operating work is presented as the author's extension of Grounded Architecture's taxation (the book's example is cloud cost cross-charging). Confirm the author is content to have it marked as an extension.\n- Harmel-Law's article and Nygard's post are gap sources, fetched and read; the author may want Facilitating Software Architecture on the bookshelf.\n- No edition year is stated on grounded-architecture.io; the chapter cites the online edition as read in November 2026.\n\n## Decision log\n\n- **2026-11-19** — Open with the forum that approves nearly everything late while the landscape diverges, so that the board model is met as a puzzle before it is argued against. Rejected: Opening with the landscape alone, which the Part IV introduction already uses; Opening with the three instruments\n- **2026-11-19** — Treat the guardrail as the automated form of a mandate, agreeing with the Part IV introduction's definition (a limit that is checked automatically), and keep four instruments: advice, nudge, tax, mandate. Rejected: A fifth instrument named guardrail; Using guardrail loosely for any default\n- **2026-11-19** — State the board model's case from Enterprise Architecture as Strategy inside the section that argues against it, and have no separate 'Where the Sources Disagree' section. Rejected: A separate section, which would stand between the instruments and the worked example\n- **2026-11-19** — The examples in the selection table differ from the four de p28, p29, p30, p31, the worked-example section idea and the conclusion callback amended; no units added, dropped or reordered.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
