be:* A platform team of twelve has shipped a new internal deployment system with every feature on its roadmap. Three of fourteen product teams use it; the rest keep their own scripts. Is the platform a success, what would you measure, and what would you do? | `custom` | cold_reader | major |\n| AC-2 | The chapter refers to chapter 6 for when a platform team is justified and does not re-argue it. | `custom` | rubric | minor |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Once a platform team is justified (chapter 6), how is the platform funded, run and judged as a product, and what does developer experience measure?\n\n> **Claim:** Once a platform team is justified, the platform is funded against the measured load it removes from stream-aligned teams, and is run and judged as a product whose users are those teams: it has a roadmap shaped by their problems, it starts as the thinnest thing that removes a load teams have reported or measured, it earns adoption by being the easier path and does not rely on mandate, and its outcome measure is developer experience — how long product teams wait and how much they have to know to ship.\n\n**Disputed by:** The infrastructure-team model, in which a central team builds and operates shared systems to its own roadmap and teams are required to use them.\n\n**So what:** A leader funds the platform against measured load removed from product teams, and treats low adoption as a product failure to investigate.\n\n**How and why:** A platform's value exists only in its users' work. Teams adopt what makes their work easier and route around what does not, so adoption is honest evidence; a mandate hides that evidence and keeps a poor platform alive.\n\n**Supporting claims**\n\n- **S1** — A platform is a product whose users are the stream-aligned teams, and its value exists only in their work, so adoption by choice is evidence of that value and a mandate hides the evidence.\n- **S2** — Developer experience, how long product teams wait and how much they have to know to ship, is the platform's outcome measure, and it is read from adoption by choice together with the adopters' lead time and reported friction.\n- **S3** — A platform is funded against the measured load it removes from stream-aligned teams, stated per roadmap item as which teams, how much load and how it was measured.\n- **S4** — A platform starts as the thinnest thing that removes a load teams have reported or measured, and holds only what one implementation can give many teams as self-service.\n- **S5** — A platform's roadmap is shaped by its users' problems, found by discovery with users and non-users, and getting teams onto the platform is part of the product.\n- **S6** — Low adoption is a product failure to investigate, and a platform judged by features shipped, or kept alive by mandate, fails in ways its own reports do not show.\n\n## Role in the part\n\nShows the shared product that embodies the engineering strategy and how it is judged. Supports P4-3 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in platform-as-product, developer-experience, fund-against-load, thinnest-viable-platform, roadmap-shaped-by-users: each uses only what the sections before it defined)\n\nThe reader first meets a platform team that shipped its whole roadmap while most teams stayed away, so that the product stance arrives as the answer to a question already asked. The stance comes before the measure because developer experience is the outcome of a product and means nothing for a system teams are simply required to use. The measure comes before funding because the funding rule is stated in the measure's terms; funding placed first, as the thesis sentence lists it, would use 'load' before the chapter had said how load is read. Funding comes before the thinnest viable platform because the thin version is defined as the smallest thing that removes a load worth funding, and the roadmap pattern comes after it because it governs every version after the first. The anti-patterns follow the three patterns because each is the absence of something already established: the stance, the measure, or one of the patterns. The place of a mandate is settled there, because only then has the reader seen what the platform is judged by when adoption is no longer evidence. The worked example applies everything to the opening scene in the order of the review itself, and the AI section is a coda that applies the same stance to a new kind of user.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At Corvane's half-year review in mid-2026 the platform team reported that all nine items on its roadmap had shipped. The VP Engineering asked how many of the company's roughly thirty teams released through the platform's release path. The answer was eleven, the same eleven as a year earlier, and nobody had counted until he asked.\n\n**Bridge:** Most leaders have funded a platform team that delivers everything it plans and still cannot say what it has done for the teams it serves. → A platform has users, and whether it works can only be seen in their work: in how long they wait and how much they have to know to ship.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Once a platform team is justified, the platform is funded against the measured load it removes from stream-aligned teams, and is run and judged as a product whose users are those teams: its roadmap is shaped by their problems, it starts as the thinnest thing that removes a load teams have reported or measured, it earns adoption by being the easier path and does not rely on mandate, and its outcome measure is developer experience, how long product teams wait and how much they have to know to ship.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a platform team that shipped its whole roadmap while most teams stayed off its platform. *Kept in:* nine-items-eleven-teams.\n- Say what it means to run a platform as a product and why adoption by choice is evidence. *Kept in:* platform-as-product.\n- Define developer experience and the measures that show it. *Kept in:* developer-experience.\n- Take three patterns: funding against measured load, the thinnest viable platform, and a roadmap shaped by users' problems. *Kept in:* fund-against-load, thinnest-viable-platform, roadmap-shaped-by-users.\n- Recognize how a platform fails and where a mandate still belongs. *Kept in:* anti-patterns.\n- Follow Corvane's platform review of 2026, and see what AI changes. *Kept in:* worked-example, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | At Corvane's half-year review in mid-2026 the platform team had shipped all nine items on its roadmap, and only eleven of about thirty teams released through its release path, a number nobody had counted until the VP Engineering asked. | scenario: Corvane, the fictional company this book follows; mid-2026, about 500 people, about thirty teams, a platform team of eight led by Lena Brandt, Director of Platform; Dario Vance, VP Engineering. New ledger facts: half-year review; nine roadmap items, all shipped; eleven teams on the release path, the same eleven as at the end of the rollout in 2025; thirty teams, eleven older and nineteen formed in 2025 and 2026. |  |\n| p02 | claim | Once a platform team is justified, the platform is funded against the measured load it removes and is run and judged as a product whose users are the stream-aligned teams, with developer experience as its outcome measure; the chapter goes from the scene to the product stance, the measure, three patterns, the failures, Corvane's review and AI. |  | `problem_solution`: A finished roadmap and a number nobody had counted. → The claim that answers it, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Nine Items Shipped, Eleven Teams On\n\n**Controlling idea** (`example`, id `nine-items-eleven-teams`): Corvane's platform team reported what it had built, nobody had counted who used it, and a requirement that every team use the release path, which Corvane had stopped short of, would raise the count without showing the reason it was low.\n\n**Advances the thesis** (S6): Gives the case the chapter judges: a platform reported by output, with low adoption nobody had looked at.\n\n**Transition in:** `elaboration`: The nine items and the eleven teams of the lead. → What the report contained and what a count showed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description (table) | The platform team's report and a count made in the review week described the same half-year in two ways: the report listed what was built, and the count showed who used it. | table: Two columns, 'What the report said' and 'What a count showed'. Rows: nine of nine roadmap items shipped (faster readiness checks, a release dashboard and seven more) \\| eleven of about thirty teams release through the release path; the release path is 'available to all teams' \\| the teams formed in 2025 and 2026 release in three other ways; the roadmap was 'reviewed each quarter with team leads' \\| the review invited the leads of the eleven teams of 2024 and no one else. Context: the release path is the set of automated readiness checks and release tooling a product team runs on its own change, built in 2024 (told in the-organization-as-a-product). |  |\n| p04 | analysis | The report counted output, which  doing a common task, with the stream-aligned teams as its users, a team that owns it and a roadmap. | source: Paved path defined (a ready-made way of doing a common task; a nudge in architecture-governance). Stream-aligned team defined in one clause, with team-types named as the chapter that decides when a platform team is justified; the question is not re-argued here. Fournier and Nowland, Platform Engineering: the platform as an internal product with identified customers, the application teams; cited through the author's records what-is-platform-engineering and platform-as-a-product, and the text says so, also for Hohpe's Platform Strategy. |  |\n| p06 | cause_effect | A platform's value exists only in its users' work, so a platform earns adoption by being the easier path, whether teams choose it is honest evidence of that value, and a mandate removes the evidence without improving the platform. | source: Fournier and Nowland's warning not to read mandatory usage as proof of success, and their distinction between voluntary and mandated adoption (author's records platform-as-a-product, platform-success). Reasoning: teams adopt what makes their work easier and route around what does not. 'The easier path' stated: a team takes the platform when using it costs less waiting and less to know than doing without it. 'Adoption by choice' defined: a team uses the platform although it could do otherwise. | `cause_effect`: Teams as users of a product. → What follows for how the product is judged. |\n| p07 | comparison (table) | The infrastructure-team model and the platform as a product differ in where the roadmap comes from, how teams reach the platform, what is reported and what low adoption means; the first is right about consistency and wrong about how to get it. | table: Rows: Roadmap comes from \\| Teams reach it by \\| Success is reported as \\| Low adoption means. Infrastructure team: the team's own view of what is needed \\| requirement, often a ticket \\| systems built and uptime \\| teams are not complying. Platform as a product: problems its users have reported or that were measured \\| choice, as self-service \\| adoption by choice and what changed for the adopters \\| the product has a fault to find. One sentence grants the model its point: shared systems do need one owner and consistency does pay. | `contrast`: Adoption as evidence. → The model that does without that evidence, and where the two differ. |\n\n### Developer Experience: The Outcome Measure\n\n**Controlling idea** (`definition`, id `developer-experience`): Developer experience, how long product teams wait and how much they have to know to ship, is the platform's outcome measure, read from adoption by choice together with the adopters' lead time and reported friction.\n\n**Advances the thesis** (S2): Defines the measure the rest of the chapter funds and judges by, and says what each reading tells a platform team.\n\n**Transition in:** `elaboration`: A product judged by what changes for its users. → What exactly changes for them, and how it is read.\n\n**Order of paragraphs** (`prerequisite_order`): Definition, then the measures, then outside support for measuring this way, then the limit of the most tempting single measure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Developer experience, in this book's sense, is how long a product team waits and how much it has to know to ship a change, and those two together are the load a platform exists to remove. | reasoning: The two halves are the two costs earlier chapters measured: waiting (flow-and-the-constraint) and what a team must hold in mind (cognitive-load-and-team-boundaries). 'Load' is fixed here as the sum of the two, so that the funding pattern can use the word. The definition is the author's; it is narrower than the general use of the term, which also covers tools, culture and satisfaction at large. |  |\n| p09 | explanation (table) | Five measures show developer experience, and each tells a platform team something different. | table: Measure \\| What it tells the platform team \\| How it is collected. Adoption by choice (share of teams using a product they could avoid) \\| whether teams find it the easier path \\| counted from usage, per product. Time to a first release for a new team or service \\| how steep the way in is \\| timed, or watched with an engineer new to the platform. Adopters' lead time for a change \\| whether teams that use it wait less \\| from the delivery tooling; lead time as defined in chapter 5. Share of uses that need no request to the platform team \\| whether it is self-service in fact \\| counted from requests and questions. Reported friction: the steps where a team was stuck or had to learn the platform's internals \\| what a team still has to know \\| a short regular survey and watching teams work. | `elaboration`: Waiting and what a team has to know. → Five measures that make the two visible. |\n| p10 | evidence | Published research on developer productivity supports reading several measures together and pairing counted data with what developers report; it supplements the author's sources. | source: Forsgren, Storey and others, 'The SPACE of Developer Productivity' (ACM Queue, 2021): productivity cannot be measured by a single metric or dimension and is more than activity. Noda, Storey, Forsgren and Greiler, 'DevEx: What Actually Drives Productivity' (ACM Queue, 2023): a measurement framework that combines feedback from developers with data about the engineering systems they use. Both are gap sources: the abstracts were read on 2026-11-19, the full texts could not be fetched, and the text says they supplement the author's sources. The author's record devex-evaluation (from the Platform Engineer's Handbook): a developer unfamiliar with the platform runs the whole journey while the team records where help was needed. | `additional_support`: Five measures chosen by the author. → What published research and the author's own record say about measuring this way. |\n| p11 | counterargument | Adoption is necessary evidence and not sufficient: Fournier and Nowland warn that adoption alone proves nothing, so it is read with the adopters' lead time and reported friction. | source: Fournier and Nowland's warning that adoption figures alone prove nothing, because a mandated migration inflates them; Hohpe's point that existing users are a biased sample (author's records platform-success, growing-platforms). The book's resolution: adoption by choice shows that teams prefer the platform, the adopters' lead time and friction show whether it helps them, and neither stands alone. | `contrast`: Measures that agree with the research. → The source's objection to the first of them, and how the book answers it. |\n\n### Pattern: Fund the Platform Against Measured Load\n\n**Controlling idea** (`recommendation`, id `fund-against-load`): A platform is an investment in other teams' attention, so it is funded against the measured load it removes, stated per roadmap item as which teams, how much load and how it was measured.\n\n**Advances the thesis** (S3): Turns the measure into a funding rule a leader can apply to a platform budget or a single roadmap item.\n\n**Transition in:** `cause_effect`: A measure of what the platform does for teams. → Funding decided by that measure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | A platform is an investment in other teams' attention, and the case for it is a load statement: which teams carry a load today, how much, how that was measured, and what the platform costs to remove it. | source: Fournier and Nowland's test of leverage: a small platform team must make a much larger engineering organization more productive (author's record what-is-platform-engineering). Writing the test as a load statement per roadmap item is the author's extension. Illustration of the form: 'nineteen teams each spend about twelve engineer-days a quarter keeping their own deployment scripts working'. |  |\n| p14 | recommendation | The pattern serves the leader who funds the platform and the teams whose load is named; it worked if the named load, measured the same way a quarter or two later, has fallen by more than the platform costs, and it does not fit work whose value is lower risk. | reasoning: User: the executive who approves the budget and the stream-aligned teams named in the statement. Outcome measure: the stated load re-measured; the platform team's cost against it. Conditions under which it does not hold: security and compliance work, whose return is risk avoided, and the standing work of operating what already exists, which is funded as what it is; and a company too small for the measurement to cost less than the script (team-types gives three teams as the author's rule of thumb). | `sequence`: The load statement and its source. → Who uses the pattern, how they know it worked, and where it stops. |\n\n### Pattern: Start with the Thinnest Viable Platform\n\n**Controlling idea** (`recommendation`, id `thinnest-viable-platform`): A platform starts as the thinnest thing that removes a load teams have reported or measured, and it holds only what one implementation can give many teams as self-service; the rest stays with the teams.\n\n**Advances the thesis** (S4): Says how large the first version should be and gives the test for what belongs in a platform.\n\n**Transition in:** `sequence`: A load worth removing. → How little to build first in order to remove it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | The thinnest viable platform is the smallest set of interfaces, documentation and tools that removes a load teams have reported or measured. | source: Skelton and Pais's 'thinnest viable platform' in Team Topologies, cited through the author's records four-fundamental-team-topologies and next-gen-operating-model because the author's Kindle notes do not contain the passage: just big enough to speed up the stream-aligned teams, since platforms tend to grow and start dictating. Hohpe lists it among the questions to ask before building a platform at all (author's record organizing-for-platforms). 'Reported or measured' is the author's addition. |  |\n| p16 | process (figure) | Three questions decide whether a piece of work belongs in the platform or stays with product teams: whether several teams carry it, whether one implementation fits them without per-team tailoring, and whether it can be offered as self-service. | figure: Mermaid flowchart (Figure 1): 'Have several teams reported or shown this load?' no -> 'Stays with the team'. yes -> 'Does one implementation fit them without tailoring for each?' no -> 'Stays with the teams; share an example or a guide'. yes -> 'Can teams use it without asking the platform team?' no -> 'Not yet: it would be a queue'. yes -> 'Build the thinnest version with one team that has the load'. Sources of the questions: the three-team rule of thumb and self-service from team-types; Fournier and Nowland's centralization test (one implementation serves many teams without extensive per-team customization; author's record getting-started). Corvane example: the release path runs the readiness checks; what a team's own check asserts about its service stays with that team. | `elaboration`: The smallest thing that removes a load. → How to tell what goes into it at all. |\n| p17 | recommendation | The pattern serves the first team that has the load; it worked if that team keeps using the thin version after the platform engineers leave and a second team takes it up without help, as Corvane's release path of 2024 did. | case: Corvane 2024, 180 people: the release path was built with the Scheduling team for one quarter, a set of automated readiness checks and release tooling and nothing else; Scheduling kept using it from week 7 without a platform engineer, and the other ten teams joined over the next two quarters (the-organization-as-a-product, interaction-modes-and-team-apis). User: the partner team. Outcome measures: the partner team still uses it once help ends; the next team adopts without help. Does not hold when the load cannot be removed in pieces. | `example`: The test for what belongs. → Who the pattern is for, how to know it worked, and Corvane's own thin version. |\n\n### Pattern: A Roadmap Shaped by Users' Problems\n\n**Controlling idea** (`recommendation`, id `roadmap-shaped-by-users`): A platform's roadmap is shaped by its users' problems, found by discovery with users and non-users, and the work of getting teams onto the platform is part of the product.\n\n**Advances the thesis** (S5): Says how a platform team plans so that its users shape the plan.\n\n**Transition in:** `sequence`: A thin first version with one team. → How the versions after it are chosen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | explanation | A platform team finds its users' problems the way a product team does, by watching how teams work, and it treats a request as a clue to a problem and not as an order. | source: Fournier and Nowland: observe customers' real workflows and workarounds; separate the customer's problem from the solution they propose; the 'feature shop' (defined: a platform team that builds each request as specified for whoever asks loudest) as the failure (author's record platform-as-a-product). Discovery as defined in discovery-delivery-and-empowered-teams. Hohpe: existing users are a biased sample, so the teams that stayed away are asked too (author's record growing-platforms). |  |\n| p19 | process (list) | Four planning habits let users shape the roadmap: items written as a team's problem with a measure, a quarterly review that includes teams not yet on the platform, requests sorted by impact and fit, and the work of getting teams on counted in the plan. | source: List of four. (1) Each roadmap item names the teams, their problem and the measure that should move (author's extension of the load statement). (2) The roadmap is reviewed each quarter with team leads, as the team API of chapter 7 promises, including leads of teams that do not use the platform. (3) Hohpe's triage of requests by business impact and fit with the roadmap, with a reason given for a refusal (author's record growing-platforms). (4) Fournier and Nowland: migration and adoption are project work inside the plan, and the platform team carries the cost of moving teams (author's records planning-and-delivery, getting-started). | `sequence`: How problems are found. → How they get into the plan. |\n| p20 | recommendation | The pattern serves the platform team that plans and the teams that are asked; it worked if every roadmap item can name the teams and the measure behind it, and if the measure moved after the item shipped. | reasoning: User: the platform lead and the stream-aligned teams, users and non-users. Outcome measures: share of roadmap items that name teams and a measure; share whose measure moved. Limit: users cannot be asked what security or the hosting provider will require, so that part of the roadmap comes from the platform team and is labeled as such. | `sequence`: Four habits. → Who they are for and how to tell they work. |\n\n### Anti-Patterns and the Place of a Mandate\n\n**Controlling idea** (`analysis`, id `anti-patterns`): A platform fails in four recognizable ways that its own reports do not show, and a mandate, though sometimes right as governance, is never evidence that the platform works.\n\n**Advances the thesis** (S6, S1): Names the failures the patterns prevent and settles when a mandate belongs.\n\n**Transition in:** `contrast`: Three patterns for running a platform as a product. → What happens without them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | comparison (table) | Four anti-patterns each leave out the product stance, the measure or one of the patterns, and each has a sign that is visible from outside the platform team. | table: Anti-pattern \\| What you see \\| What to do. The Platform Nobody Asked For (built ahead of any team's stated need) \\| the builders cannot name the teams they spoke to; teams keep their own scripts beside it \\| go back to a reported load and a thin version with one team. Adoption by mandate \\| usage is high and so are the workarounds; a team builds its own 'shadow platform' (defined: a team's own replacement for something the platform offers) \\| measure friction and lead time; treat the shadow platform as a finding. The feature shop \\| a backlog of single-team requests only the platform team can do \\| find the problem several teams share. The Output Scoreboard at the platform \\| reviews list features shipped \\| report adoption by choice and the adopters' lead time. Sources: the failure-patterns page; Fournier and Nowland on mandated usage, feature shops and shadow platforms (author's records platform-as-a-product, managing-stakeholders). |  |\n| p22 | analysis | A mandate is right where divergence creates a risk a team cannot carry, and a platform under a mandate is judged by its users' friction and lead time alone. | reasoning: architecture-governance: a mandate is reserved for risk the team cannot carry, such as legal exposure or security. The author's record platform-as-a-product: mandates are sometimes legitimate and are not evidence of product success. Trade-off: earning adoption is slower and leaves several ways of working alive for a time, whose cost is the subject of migrations-and-technical-debt; mandating is fast and blinds the platform team. | `contrast`: A mandate as a way of hiding failure. → When a mandate is nevertheless right, and what it costs. |\n\n### Worked Example: Corvane's Platform Review of 2026\n\n**Controlling idea** (`example`, id `worked-example`): The release path had been made the standard and not a mandate, and Corvane treated its stalled adoption as a product failure to investigate: it measured, asked the teams that stayed away, built a thin fix with two of them and funded the next year's roadmap by load removed.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): Applies the measure and the three patterns to the opening scene.\n\n**Transition in:** `example`: The patterns and the failures. → The opening scene worked through with them.\n\n**Order of paragraphs** (`chronological`): The review as it happened: measure, find the cause, fix the smallest thing, fund the next year, and say what is left.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | evidence (table) | In the weeks after the half-year review Lena Brandt's team took the five measures for the release path for the first time. | table: Measure \\| Mid-2026. Adoption by choice \\| 11 of about 30 teams. Time to a first release of a new service on the path \\| about three weeks of the team's work, after a wait of about two months for a platform engineer; with a copied script, two days. Adopters' median lead time \\| under 7 days; teams off the path, 11 days. Uses without a request \\| releases on the path, all; joining the path, none. Reported friction \\| 4 of the 11 steps to join need a platform engineer. Collected by Lena Brandt and two platform engineers, who interviewed the leads of six teams off the path and watched an engineer from one of them try to join. |  |\n| p24 | analysis | The measures and the interviews gave one finding: the release path was the easier path for a team already on it and the harder path for a new team, because joining still depended on a help offer designed in 2024 for eleven teams. | scenario: The 2024 team API promised each joining team one platform engineer for at most six weeks (interaction-modes-and-team-apis). In 2025 and 2026 about nineteen teams were formed; eight platform engineers could not staff that offer; a new team that needed to release in its first weeks copied a script or wrote one. The six leads' own estimate of keeping such scripts working: about twelve engineer-days a quarter per team, about 230 across the roughly nineteen teams. | `cause_effect`: Five measures taken once. → What they showed, and why. |\n| p25 | example | In the third quarter of 2026 two platform engineers built a thin fix with two of the newer teams, and by the end of the year seven newer teams were on the release path, moved first by the platform team for their change failure rates, so the platform team reads the other measures for them. | scenario: A service template and one setup command that put a new service on the release path with working defaults; six weeks of work with two teams off the path; steps needing a platform engineer from 4 to none; a first release of a new service on the path within two days; moving a team's existing services took about six weeks in which the team shipped little (ledger, chapter 16). By the end of 2026: 18 of 30 teams on the path, eleven older and seven newer; the seven were moved first by the platform team (chosen by their change failure rates, quality-and-reliability), so the count is not adoption by choice. Twelve teams remain on three other ways of deploying. | `problem_solution`: A way in that was too steep. → The smallest change that made it level, and what followed. |\n| p26 | evidence (table) | For 2027 Lena Brandt's draft roadmap held three items and a request for four more engineers, and Dario Vance decided each item by its load statement. | table: Item \\| Load statement \\| Decision. Moving the remaining twelve teams onto the release path, each by an agreed date \\| about twelve engineer-days a quarter in each of the twelve teams; 11 days of lead time against under 7 \\| first, within the team of eight. Self-service test environments \\| seven of the eleven teams of 2024 kept their own environment scripts, and the newer teams copied them (the request of 2024 told in team-types) \\| a thin version with two teams in the first half of 2027, reviewed after one quarter. A developer portal \\| no team had reported a problem it would remove \\| not built; asked again when a team reports one. The four engineers were not approved; no second platform team was formed. | `sequence`: Adoption moving again. → The next year's plan, decided by the same evidence. |\n| p27 | analysis | The review changed what Corvane's platform team reports, and it left twelve teams on three other ways of deploying, whose move is a migration and belongs to a later chapter. | reasoning: From 2027 the platform team's quarterly report leads with the measures and not with items shipped: for the release path, now the standard that teams are moved onto, the adopters' lead time, time to a first release and friction; adoption by choice for products teams can still avoid, beginning with test environments. Unfinished: moving the twelve teams is a migration (migrations-and-technical-debt). | `conclusion_summary`: Measures, a finding, a fix and a funded plan. → What stayed changed and what is left open. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents become users of the platform and make a team's own script cheaper to write, which raises the bar for 'the easier path' and moves the platform's value toward what makes a change verifiable.\n\n**Advances the thesis** (S1, S2): Applies the product stance to a new kind of user and says which part of the thesis AI strains.\n\n**Transition in:** `additional_support`: A platform judged by its users' experience. → What changes when some of the users are agents.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | claim | Emerging: as of November 2026, coding agents are becoming users of internal platforms alongside people, and a paved path with documented interfaces and safe defaults is what an agent can follow and be held to. | reasoning: Opening sentence announces the label scheme. Emerging, the author's observation and not a measured result: teams that use coding agents point them at the platform's templates and checks. The author's record ai-augmented-platform-engineering (from the Platform Engineer's Handbook): AI acts on a platform within guardrails enforced in code, because a prompt is a request and not a control. Consequence for measurement: time to a first release and the share of uses without a request apply to an agent's use too. |  |\n| p29 | claim | Speculative: if agents make a team's own deployment script nearly free to write, a platform will earn adoption less by saving building effort and more by making changes verifiable, which the script does not do. | reasoning: Speculative. Reasoning: 'the easier path' has compared the platform with the effort of building one's own; that effort falls; the cost that remains is verification (flow-and-the-constraint), which a shared path with checks lowers and thirty private scripts raise. Would be confirmed by: teams with agents reporting that they stay on, or return to, a shared path for its checks and not for its convenience. Pointers: ai-platform-governance-and-risk, agentic-delivery. | `contrast`: Agents as users of the path. → Agents as a cheaper way of avoiding it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Funding, running and judging a platform are one question asked three times, namely what a named set of teams no longer has to wait for or know: the load statement asks it before the work, the thin version with one team asks it during, and adoption by choice with the adopters' lead time asks it after. A platform team that can answer it needs no mandate, and one that cannot is not helped by one.\n\n**So what:** The reader can judge a platform team by its users' outcomes instead of its output, fund it item by item against named load, and treat low adoption as a product failure to investigate.\n\n**Callback:** The nine items shipped and the eleven teams of Corvane's half-year review in mid-2026. The reader can now say what was missing from the report and what Dario Vance's count was for.\n\n**Takeaway** (`course_of_action`): For each product of your platform team, count the teams that use it by choice, time a new team's first use, and ask three teams that stayed away why. The checklist gives the steps.\n\n**Hand-off** to [Quality and Reliability as Operating Model](quality-and-reliability.html): `sequence`: A platform that carries the shared mechanics. → What teams do every day on top of it to keep what they ship correct and running.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | synthesis (list) | Established: a platform is an internal product whose customers are the application teams, mandatory usage is not proof of success, a platform should start as the thinnest viable one, and productivity is not read from a single measure. |  |  |\n| p31 | synthesis (list) | Depends on context: when a mandate is right, how much measurement a small company needs, and how long several ways of working may live side by side while adoption is earned. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p32 | synthesis (list) | The author's synthesis: the definition of developer experience as waiting and what a team has to know, the load statement as the unit of funding, the pairing of adoption by choice with adopters' lead time and friction, and the three questions for what belongs in a platform are this book's own. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p33 | recommendation (list) | Eight checks let the reader judge a platform by its users' outcomes and set up its funding and planning. |  | `sequence`: What to take away. → What to do with it. |\n| p34 | transition | With a platform that carries the shared mechanics, the next question is what teams do every day on top of it to keep what they ship correct and running, which the next chapter takes up. |  | `sequence`: The count Dario Vance asked for, and a platform judged by its users. → What the platform does not do for a team: keep its software correct and running. |\n\n## Non-goals\n\n- When a platform team is justified, and the four team types See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- X-as-a-Service, the other interaction modes and the platform team's team API See [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html).\n- The size of the platform team and its on-call rotation See [Team Size and Composition](team-size-and-composition.html).\n- The change brief and the 2024 pilot of the release path See [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- The instruments of governance and when a mandate is justified See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- Delivery capabilities, the four key measures, on-call and incident practice See [Quality and Reliability as Operating Model](quality-and-reliability.html).\n- Moving the remaining teams onto one path; finishing migrations See [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- Measuring an engineering organization as a whole See [[measuring-engineering]].\n- The AI platform and its governance; delivery with agents See [[ai-platform-governance-and-risk]], [[agentic-delivery]].\n- Platform technology: pipelines, portals, infrastructure tooling\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts to confirm (all illustrative): the half-year review of mid-2026 with nine roadmap items shipped and eleven of thirty teams on the release path; the five measures taken then (about three weeks and a two-month wait to join, two days with a copied script; 11 days of lead time off the path; 4 of 11 joining steps needing a platform engineer); about twelve engineer-days a quarter per team for own deployment scripts; the service template built with two teams in the third quarter of 2026; the 2027 roadmap decision (the remaining twelve teams first, a thin test-environment service, no developer portal, four engineers not approved, no second platform team).\n- Platform Engineering (Fournier and Nowland) and Platform Strategy (Hohpe) are cited through the author's grounded-platforms records, not from Kindle notes; the chapter says so. Confirm the attributions against the books.\n- 'Thinnest viable platform' is not in the author's Kindle notes of Team Topologies; it is cited through the author's records.\n- The DevEx (2023) and SPACE (2021) papers are gap sources. Only their abstracts could be fetched on 2026-11-19 (the ACM pages refused automated access); the chapter cites only what the abstracts say and states that the papers supplement the author's sources. The author may want to check the wording against the full texts.\n- The Platform Engineer's Handbook is cited through the author's records devex-evaluation and ai-augmented-platform-engineering; its author and year are not given in those records.\n- Funding against measured load is the author's rule; the sources support it only through the leverage test and capacity accounting. Chargeback and other funding mechanisms are not treated because the author's sources do not cover them.\n- The AI section makes no Proven claim.\n\n## Decision log\n\n- **2026-11-19** — The opening scene is a new one, Corvane's half-year review of mid-2026, where the release path built in 2024 is used by eleven of about thirty teams. The Launch Queue and the 2024 pilot are referred to with links and not retold. Rejected: Opening on the Launch Queue again; Using the journal spec's acceptance-probe case (a platform team of twelve, three of fourteen teams), which the probe needs unseen\n- **2026-11-19** — The body order is stance, measure, funding, thinnest viable platform, roadmap, although the thesis sentence names funding first: the funding rule is stated in terms of load, and the chapter has to say how load is read before it can be funded against. Rejected: Funding first, in the order of the thesis sentence\n- **2026-11-19** — One worked example with one lens: the 2026 review, read only as 'low adoption is a product failure to investigate'. The 2024 release path appears once, in two sentences, as Corvane's thin first version. Rejected: A second worked example on the 2024 pilot; A separate case for the Platform Nobody Asked For\n- **2026-11-19** — Funding mechanisms such as chargeback are left out; the author's sources do not cover them and no evidence would stand behind the paragraph. Rejected: A comparison table of central budget, chargeback and project funding\n- **2026-11-19** — After the flow rubric (sound with notes): 'load' is tied to the measure where developer experience is defined; 'the easier path' is stated in the paragraph on adoption as evidence; the anti-patterns are described as leaving out the stance, the measure or a pattern (four against three patterns); the paragraph on the mandate keeps only what is new (when it is right, and how the platform is then judged). Rejected: Folding the research paragraph into the paragraph with the five measures: the table would then carry two ideas\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — Before the first check the draft stood at 4,830 words against a target of 4,200. A secondary thread was cut instead of compressing sentences: the paragraph on the four consumers of a platform team's capacity and the rule of thumb for keep-the-lights-on work (Fournier and Nowland). The funding pattern now names operating work in one clause as outside the load statement. Rejected: Compressing every paragraph by a few words\n- **2026-11-19** — After round 2 of the draft check (PASS), and before the ledger append, the ledger showed lines added in parallel by chapters 13 and 16 that the worked example contradicted: in 2026 the release path was made the one required way of deploying for all thirty teams, seven newer teams (chosen by change failure rate) were on it at the end of 2026, eighteen of thirty in all, and twelve remained with a date. The scene and the worked example were changed to agree: the requirement exists and is not declined; Dario Vance's point is that it does not say why teams stayed away; the seven teams' move is not adoption by choice and is read by the other measures; the 2027 item moves twelve teams by date. The argument, order and units are unchanged. The round-2 report is stale against this revision and no third round was run (the author's rule of two rounds). Rejected: Keeping 'five teams by choice, sixteen of about thirty', which contradicts the ledger; A third check round\n- **2026-11-19** — The request of 2024 for a second platform team (chapter 6, 'what happened to it later is not stated') is given an outcome: no second team; a thin test-environment service inside the team of eight in 2027.\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-platforms/posts/devex-evaluation and ai-augmented-platform-engineering (from the Platform Engineer's Handbook) — A developer new to the platform runs the whole journey; AI on a platform acts within guardrails enforced in code.\n  - _journals/org-design/posts/platform-and-devops-operating-model — The author's operating-model record: platform product teams, paved roads and self-service.\n  - _input/checklists/data/data.json, tab Platforms — The index of the author's platform checklists that the grounded-platforms records distill.\n  - _research/scenario-ledger.md — The platform team from 2022 to 2026, the release path <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
