<script id="data" type="application/json">{"meta": {"title": "Meet Corvane: One Company at Five Sizes", "date": "2026-11-19", "author": "Željko Obrenović", "excerpt": "Which company do the book's examples come from, and what happens to it as it grows? Corvane is a fictional maker of field-service scheduling software, followed from 12 to about 1,100 people in five stages, each with a structure that made sense when it was built and an incident that came when growth moved on without it.", "permalink": "corvane-at-five-sizes", "timetoread": "14 min read"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **Corvane is fictional.** It is an invented company that makes scheduling software for field-service firms. Every figure, name and incident on this page was made up for the book and is kept in one record, so no number here is data about a real company.\n> * **Five stages, and each structure was a reasonable answer.** Corvane grows from 12 people to 50, 180, 500 and about 1,100. At each size its structure answers the problem in front of the company when it was built, and the incident of that stage comes where growth has since made something else scarce and the structure has stayed.\n> * **Each incident is matched to a failure pattern.** The eight named incidents, from the Founder Queue to the Hiring Question, each get a date, a size and a pattern from the previous page: the one that best explains the incident or, for the Hiring Question, the one it risks. Use this page as the lookup when a chapter cites one.\n\n<br>\n\nThe previous page named twelve ways in which a product and tech organization fails ([Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html)). This page gives the one company in which the book shows those failures happening: Corvane. **Corvane is fictional.** It is not a disguised portrait of a real company. Every figure, name and incident here was invented for the book, and every number is an illustration, never a measurement. All of it is kept in one record, a ledger of Corvane's facts that is maintained alongside the book. Each chapter follows the ledger and may only add to it, and this page is the ledger in readable form. That is what lets a chapter refer to \"the Launch Queue\" or \"Corvane at 500 people\" in a phrase and mean the same thing as every other chapter.\n\nCorvane is followed through five sizes, from 12 people to about 1,100. The page's claim is about what those five sizes have in common. **At each size the structure was a reasonable answer to the problem in front of the company when it was built.** Each named incident happened where growth had since made something else scarce and the structure had stayed as it was. None of the incidents needed a careless person. The page gives the company in five steps: the product, the five stages, the cast, the incidents matched to failure patterns, and a table of where the chapters use each stage and incident.\n\n## Corvane and Its Product\n\nCorvane was founded in Rotterdam in 2018. It sells scheduling and dispatch software to field-service companies: firms whose technicians install and repair heating systems, maintain lifts or install telecom lines at customers' sites. The product has three parts. Planners in the customer's office use a **web application** to assign jobs to technicians. Technicians use a **mobile app** to see their day, travel to each job and mark it done. **Integrations** pass finished jobs to the customer's billing system and parts used to its stock system. Customers pay per technician per month.\n\nThis product suits the book for one reason. A single scheduling rule has to hold in all three parts. A job assigned in the office must appear on the technician's phone, and a job finished on the phone must reach the billing system. If the teams that build the three parts understand a rule differently, nobody needs a report to find out. A planner and a technician look at two different schedules the same morning. At Corvane a gap between two teams becomes **a fault that a customer can see**, and that makes the organization's structure visible in a way it rarely is in real life.\n\n## Five Stages, 2018 to 2028\n\nEach stage below is read by asking which of three capacities was running short. The introduction named them, and they are the book's own terms. **Attention** is how much a team can hold in mind well enough to change it safely. **Judgment** is deciding with the relevant information at hand. **Verification** is knowing that what was built is right. A company always has a limited amount of each, and growth changes which one runs out first.\n\nCorvane's ten years run from one team of 12 people in 2018 to two business units of about 1,100 people in 2028. They divide into five stages, and each stage ends in at least one incident that Corvane's people later gave a name.\n\n"}, {"type": "mermaid", "content": "flowchart LR\n    S1[\"1. One table<br/>2018–2019<br/>12 people<br/>The Founder Queue\"] --> S2[\"2. First teams<br/>2020–2021<br/>50 people<br/>The Two Calendars<br/>The Second Calendar, 2022\"]\n    S2 --> S3[\"3. The hiring wave<br/>2022–2024<br/>180 people<br/>The Launch Queue\"]\n    S3 --> S4[\"4. Groups and plans<br/>2025–2026<br/>500 people<br/>The Nine-Week Plan<br/>The Tuesday Reorg\"]\n    S4 --> S5[\"5. Scale and AI<br/>2027–2028<br/>1,100 people<br/>The Review Wall<br/>The Hiring Question\"]"}, {"type": "markdown", "content": "\n**Figure 1:** *Corvane's five stages in order, each with its years, the size of the whole company and the incidents it is remembered for.*\n\nThe table gives the same five stages in full. \"Product and tech\" counts the engineers, product managers and designers, the part of the company this book is about. The last two columns are the ones later chapters cite most.\n\n| Stage | Years | Whole company | Product and tech | Structure | What ran short | Named incidents |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1. One table | 2018–2019 | 12 | 8 | One team, no managers; the two founders decide everything | Nothing at first; at the end, the founders' judgment | The Founder Queue |\n| 2. First teams | 2020–2021 | 50 | 28 | Four teams; two engineering managers; the first product manager | Attention | The Two Calendars; the Second Calendar (2022) |\n| 3. The hiring wave | 2022–2024 | 180 | 95 engineers, 11 product managers, 7 designers | Eleven product teams cut by headcount; one platform team of five; a VP Engineering | Verification, and the platform team's attention | The Launch Queue |\n| 4. Groups and plans | 2025–2026 | 500 | 260 | Four product groups with directors; a CPO; annual and quarterly planning; a career ladder; an architecture forum | Judgment | The Nine-Week Plan; the Tuesday Reorg |\n| 5. Scale and AI | 2027–2028 | about 1,100 | 520 | Two business units after an acquisition; coding agents in every team; an AI enablement team | Verification and judgment | The Review Wall; the Hiring Question |\n\n**Stage 1, One table (2018–2019, 12 people).** Eight of the twelve work on the product, as one team with no managers. Ines Okafor, co-founder and CEO, sells and looks after the first customers. Tomas Rell, co-founder and CTO, builds. The two founders decide everything, and the decisions about the product fall to Tomas. The arrangement works because everyone sits within earshot: nobody has to be told what a customer said or what changed yesterday. It stops working at one point only. By 2019 every pricing, design and release decision waits for Tomas, and engineers start a second piece of work while the first waits for his answer. Corvane calls this **the Founder Queue**. Tomas decides well. There is one of him, and judgment has run out at his desk.\n\n**Stage 2, First teams (2020–2021, 50 people).** Corvane's answer to the queue is to stop routing everything through the founders. The 28 people in product and tech form four teams, Web, Mobile, Integrations and Core, under the first two engineering managers. Priya Nambiar joins in 2020 as the first product manager and Noor Achterberg as the first designer. Decisions now get made where the work is. What nobody has any longer is the whole product in their head, so the shortage moves from judgment to attention. In 2021 Web and Mobile each build the rule for overlapping jobs, and for three weeks planners and technicians see different schedules: **the Two Calendars**. The review blames communication and the Mobile lead is replaced. Eight months later, in 2022, Mobile and Integrations diverge on job status in the same way, and a job marked complete on the phone stays open in customers' billing exports for eleven days: **the Second Calendar**. Only then does Corvane give the rules one home and one decider: they move into a single rule engine owned by the Core team, and Priya Nambiar decides what the rules are. The failure does not come back. The Second Calendar falls in the first year of the next stage, and it is told here because it is the same failure.\n\n**Stage 3, The hiring wave (2022–2024, 180 people).** This is the stage the book's introduction opened with. By 2022 Corvane has 45 engineers and customers who ask for more than 45 can build. The answer looks obvious: hire. In eighteen months the engineers more than double, from 45 to 95. In 2023 they are divided evenly into eleven product teams of about eight, and the platform team, five engineers led by Lena Brandt since it was formed in 2022, handles releases for all of them. Dario Vance joins as VP Engineering that year, after the hiring plan is agreed. Two things about this stage have no name at Corvane, and later chapters use both. One is **the even split**: the eleven teams are cut by headcount, and nobody states what the new structure is meant to achieve. The other is **the forty-one features**: in one year Corvane ships forty-one features, each promised to a customer by name, and its renewal rate falls, so the added hands are busy and customers are no better served. Then comes the incident that has a name. The median lead time for a change, measured from starting work on it to its release, goes from 4 days to 19. About two of the 19 days go into writing the change. The rest is waiting: all eleven teams need the platform team for some launches, three need it for every launch, and at the peak 14 launch requests are open. This is **the Launch Queue** of 2024. Corvane had added people to the step that writes changes. The shortage was in the step that checks and releases them: verification had run out, and with it the attention of five platform engineers serving eleven teams. In 2024 Dario Vance tests a release path that one team can run without Platform, and three quarters later the company-wide median is under 7 days. One problem is left open. With the queue gone, the longest wait at Corvane is for someone to say that a feature is ready, and nobody has that decision.\n\n**Stage 4, Groups and plans (2025–2026, 500 people).** The problem stage 3 left open is the one this stage sets out to solve: eleven teams, and nobody to decide what no single team can. Who says a feature is ready is one such question. Another is technical. By 2025 the eleven teams run four ways of deploying, three message brokers and two identity libraries, each a reasonable choice for the team that made it. Corvane's answer is a set of structures for deciding across teams. It forms four product groups, each under a director. Priya Nambiar becomes Chief Product Officer. Annual and quarterly planning, a career ladder and an architecture forum follow. The cost is distance. The people who now decide are two or three levels away from the information the decision needs, and judgment runs short again, this time because the people deciding lack the information, where in stage 1 the one person deciding lacked the time. Both incidents of the stage show it. A quarterly plan has to be agreed across the four groups before any of it is fixed, and that takes nine of the quarter's thirteen weeks: **the Nine-Week Plan**. And a reorganization is drawn up by people who do not know what each team runs. It is announced without a plan for moving that work, and two teams lose their on-call rotation: **the Tuesday Reorg**, named for the day of the announcement.\n\n**Stage 5, Scale and AI (2027–2028, about 1,100 people).** Corvane acquires Routewise, a route-optimization company of 140 people, and becomes two business units. Coding agents are in use in every team, and an AI enablement team supports them. Writing a change becomes cheap. Checking one does not. From January 2027 to January 2028 the number of merged changes per week rises 2.4 times while review capacity stays flat, and the median wait for a review goes from 5 hours to 31: **the Review Wall**. The shortage is verification once more, as in stage 3, and it sits at a different step. The Review Wall then raises a question of judgment that no earlier stage had to ask. If writing is cheap and review is the limit, more engineers who write would only lengthen the wait. So the 2028 plan asks whether Corvane should hire engineers at all: **the Hiring Question**.\n\nRead together, the five stages have one shape. Each structure answered the problem in front of Corvane when it was built. Teams and managers ended the queue at the founder. Hiring added hands when there was more to build than people to build it. Groups and plans gave eleven teams someone to decide across them. The last change, coding agents, was not an answer to anything at Corvane; it arrived from outside and made writing cheap. And each time, growth then made something else scarce, in a place the structure had not been built to watch: in the rules between teams, at the launch, in the distance between a decision and its facts, at the review. **Each structure was right for the problem it was built for and wrong once the shortage had moved.** The book's chapters explain why. On this page it is enough to see it happen at every size.\n\n## The Cast\n\nSeven people are named in the book. The table gives each one's role, with the year it began where that matters, and where the chapters most often meet them.\n\n| Person | Role | Where the chapters meet them |\n| --- | --- | --- |\n| Ines Okafor | Co-founder and CEO | With Tomas Rell, decides everything in stage 1 |\n| Tomas Rell | Co-founder and CTO | The Founder Queue, 2019 |\n| Priya Nambiar | First product manager (2020); Chief Product Officer from 2025 | Decides what the scheduling rules are, from 2022 |\n| Dario Vance | VP Engineering, joined 2023 | Leads the 2024 response to the Launch Queue |\n| Lena Brandt | Leads the platform team from 2022; Director of Platform from 2025 | The platform team in the Launch Queue |\n| Samir Haddad | Staff engineer, at Corvane since 2019 | In stage 2, the only engineer who understands both the engine that computes schedules and the code that keeps the mobile app in step with the office |\n| Noor Achterberg | First designer (2020); Head of Design from 2025 | Design, from stage 2 onward |\n\nThe cast are roles. They are not culprits. Most of the seven are at Corvane through several stages, and the incidents happen around them all the same. Tomas Rell is there for the Founder Queue and for the Review Wall. Samir Haddad has been at Corvane since 2019, through every named incident. **No incident in this book is explained by one of them failing at the job.** One person does lose a job over an incident: the lead of the Mobile team, replaced after the Two Calendars in 2021. The book leaves him without a name on purpose, because his successor met the same failure eight months later. A change of person did not change the result.\n\nTeams are also referred to by name, and the names tell you the stage. Web, Mobile, Integrations and Core are the four teams of stage 2. Core is dissolved when the eleven teams are formed in 2023, and its work is divided among them; the rule engine goes to the Scheduling and Dispatch teams. From stage 3 the eleven product teams are Scheduling, Dispatch, Technician App, Customer Portal, Billing Integrations, Stock Integrations, Reporting, Onboarding, Identity, Notifications and Growth, and the twelfth team is Platform. From stage 5 the chapters also mention the Routewise teams and AI Enablement.\n\n## The Incidents and the Patterns Behind Them\n\nThe previous page sorted its twelve failure patterns into four families, one for each thing a leader can design directly. **Boundaries** are what each team owns. **Interfaces** are the agreed ways in which work and knowledge cross between teams. **Decision rights** say who may decide which kind of question. **Incentives** are what gets measured and rewarded. A pattern is a way of getting one of the four wrong. An incident is a dated event at Corvane. Most of the cases in the table below are one of those patterns with a date and a size. The last, the Hiring Question, is a decision still to be made.\n\nThe table matches ten of Corvane's cases to patterns: the eight named incidents and the two unnamed cases of stage 3, the even split and the forty-one features. Where a case shows more than one pattern, the table gives the one that best explains it.\n\n| Case | Stage, year and size | What happened | Primary pattern | Family |\n| --- | --- | --- | --- | --- |\n| The Founder Queue | 1; 2019; 12 people | Every pricing, design and release decision waits for one founder | The Escalation Ladder | Decision rights |\n| The Two Calendars | 2; 2021; 50 people | Two teams each build the rule for overlapping jobs; planners and technicians see different schedules for three weeks | The Unowned Interface | Interfaces |\n| The Second Calendar | 2 into 3; 2022 | The same failure between two other teams, after the person blamed was replaced; finished jobs stay open in billing for eleven days | The Unowned Interface | Interfaces |\n| The even split | 3; 2023 | Eleven product teams are formed by dividing people evenly, with no outcome stated | The Org Chart as Architecture | Boundaries |\n| The forty-one features | 3; one year of the stage | Forty-one features ship, each promised to a named customer, and the renewal rate falls | The Feature Factory | Decision rights |\n| The Launch Queue | 3; 2024; 180 people | Launches wait at a platform team of five; median lead time goes from 4 days to 19 | The Review Bottleneck, with the Overloaded Team behind it | Interfaces |\n| The Nine-Week Plan | 4; 2025–2026; 500 people | Quarterly planning takes nine of the quarter's thirteen weeks | The Consensus Stall | Decision rights |\n| The Tuesday Reorg | 4; 2025–2026; 500 people | A reorganization is announced without a migration plan; two teams lose their on-call rotation | The Reorg as Strategy | Boundaries |\n| The Review Wall | 5; 2027–2028; about 1,100 people | Merged changes rise 2.4 times, review capacity stays flat, and the median review wait goes from 5 hours to 31 | The Review Bottleneck | Interfaces |\n| The Hiring Question | 5; 2028; about 1,100 people | The 2028 plan asks whether to hire engineers at all | A decision, not a failure; the pattern it risks is the Output Scoreboard | Incentives |\n\nThree things about this table need saying. First, one pattern per case is a simplification. The Launch Queue is filed under the Overloaded Team, because five engineers owned the release of eleven teams' work, and it is also a queue for checks, which is the Review Bottleneck. Later chapters name the second pattern where their argument needs it. Second, the cases touch all four families, and the incentives family only as a risk: the Hiring Question goes wrong if it is answered by counting merged changes. Third, three patterns have no case in the table: the Platform Nobody Asked For, the Ladder as Checklist and the Hero Culture. The last of these has a sign at Corvane without an incident, in Samir Haddad as the only engineer who understood two systems in stage 2. I have not invented incidents to fill the gaps.\n\n## Where the Chapters Use Corvane\n\nThe last table runs the other way, from a place in the book to the stage and the cases it draws on. The first row is the introduction and the five rows after it are the chapters of Part I; these six describe pages already written. For Parts II to IV the row gives the scene the part opens with. For Parts V to XI the row gives the stage the part's subject belongs to, and the chapters there settle which cases they use.\n\n| Where in the book | Stage | What it uses |\n| --- | --- | --- |\n| [Introduction](introduction.html) | 3 | The hiring wave, as the book's opening puzzle |\n| [The Organization as a System That Can Be Architected](the-organization-as-a-system.html) | 2 | The Two Calendars and the Second Calendar; the 2022 fix |\n| [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html) | 3 | The hiring wave as a reorganization with no stated outcome; the 2024 response |\n| [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html) | 2 and 3 | The Two Calendars; the rule engine of 2022; the eleven teams of 2023 |\n| [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html) | 2 and 3 | The Core team in 2022; the eleven teams cut by headcount |\n| [Flow and the Constraint](flow-and-the-constraint.html) | 1 to 3 | The Founder Queue; the Launch Queue, measured by its waits |\n| Part II, teams and their interfaces | 3 | The platform team of five and the eleven teams it served |\n| Part III, the product operating model | 3 | The forty-one features |\n| Part IV, the engineering operating model | 4 | The 2025 landscape: four ways of deploying, three message brokers, two identity libraries |\n| Part V, leadership | 3 and 4 | The VP Engineering of 2023; the CPO and the directors of 2025 |\n| Part VI, decisions and planning | 1 and 4 | The Founder Queue; the Nine-Week Plan |\n| Parts VII to IX, talent, health and culture | 3 to 5 | The career ladder of stage 4; the lead-time and review-wait figures |\n| Part X, scaling and reorganizing | All five | The stages themselves; the Tuesday Reorg; the Routewise acquisition |\n| Part XI, AI and the organization | 5 | The Review Wall; the Hiring Question |\n\nChapters cite Corvane by a fixed convention, so that a scene can be placed without turning back to this page. A scene gives the incident's name or the year, and the size of the company at the time. A person gets their role the first time they appear in a chapter. A chapter may add detail to the record: what was decided, what the fix was, what it cost. It may not change a fact that another chapter has used. That rule is why a figure on this page means the same thing wherever you meet it.\n\n## What to Take Away\n\n**Fixed.** What does not change between chapters:\n\n- Corvane is fictional, and so is every person, figure and incident attached to it.\n- The product, the five stages with their years and headcounts, the seven people and their roles, and the eight named incidents.\n- The stated figures: lead time from 4 days to 19 in stage 3; five platform engineers for eleven teams; merged changes up 2.4 times and review wait from 5 hours to 31 in stage 5.\n\n**Added by later chapters.** What is still to come:\n\n- The detail each argument needs: what Corvane decided after an incident, what the change cost and how it was judged.\n- Further cases for the three patterns that have none here, where a chapter needs one.\n- The choice of cases in Parts V to XI, which the last table gives only by stage.\n\n**How to use this page.** When a chapter cites Corvane:\n\n- Place the incident by its stage in the first table, and read the size and the shortage from the same row.\n- Read its pattern and family from the incident table, and expect the chapter to name a second pattern where it matters.\n- Treat every Corvane number as an illustration. Evidence about real organizations is cited separately in each chapter, with its source.\n\nThree pages of this preface work as one instrument: the introduction, the failure patterns and this page. The introduction's claim says what can be designed: boundaries, interfaces, decision rights and incentives, arranged around attention, judgment and verification. The patterns say how that design fails. Corvane gives each failure a date and a size. The hiring wave that the introduction opened with is no longer a puzzle standing alone. It is stage 3 of five, at 180 people. The book's chapter on scaling treats it as the stage between about 150 and 300 people. The stage before it explains where the teams came from, and the stage after it explains why the plans arrived.\n\nYou can now say in plain words what went wrong at Corvane at each size: a queue at a founder, a rule with two versions, a wait at the launch, a plan that took most of its quarter, a wall of reviews. Before going on, ask which of these your own organization has had, and at what size. What plain words do not yet give is the reason. Why did capable people, in a structure that had worked, produce each of these results? Part I answers with the vocabulary and the reasoning that explain why structure produces behavior: [Part I — FOUNDATIONS: The Organization as a System](part-1.html).\n\n## Sources and Evidence\n\nCorvane, Routewise and every person named on this page are fictional. Every figure is an illustration invented for the book and is not data about any company. The facts are kept in one record that all chapters follow.\n\n- The twelve failure patterns and their four families: [Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html).\n- Attention, judgment and verification are named in the [introduction](introduction.html) and treated in full in [Flow and the Constraint](flow-and-the-constraint.html).\n- The matching of incidents to patterns is the author's reading.\n\nCorvane is fictional; recommendations and labeled assumptions are the author's judgement.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
