s a new role, boundary or routine; the relief works, so it stays, and the next limit is met with the next addition on top of it.\n\n**Supporting claims**\n\n- **S1** — Three people at one table share attention, judgment and verification without any structure, and that holds only while everyone hears everything, knows the whole product and can check any work.\n- **S2** — Each structure (the manager, the product manager, the split into teams, the platform team, the managers of managers, the plan, the ladder and the metric) was added when growth made one of the three capacities run out, and each relieved it, to the gain of the people doing the work and of those leading it.\n- **S3** — Each structure brought a new party or a new wait, and moved deciding, knowing and checking further apart; those costs are what the failure patterns name.\n- **S4** — Almost none was removed when the limit it answered moved, so today all of them stand at once, including where AI-assisted work has made writing cheap and checking scarce, and the complexity is the sum of reasonable answers and not of empire-building.\n\n## Role in the part\n\nShows the structures the book analyses being added one at a time, each for a reason, so the failure patterns read as consequences. Supports PF-2 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `small_to_large` in one table to today: the steps follow one generic organization as it grows from three people to about a thousand; the sizes are rough and the order is the order in which the ideas depend on one another; `problem_solution` in inside each step: the limit, the addition and its name, what it made possible, what it cost, the answer to the running question)\n\nEach step uses only what earlier steps introduced: the decision right before the product manager who holds one; teams before the platform team that serves them; teams and their managers before the layer above them; groups before the plan that aligns them; layers and the plan before the ladder and the metric that judge across them; all eight before today. The platform team comes before the managers of managers only because a dozen teams are fewer than twenty; neither depends on the other. Moving a step earlier would use a structure the reader has not met; telling the costs before the gains would make each structure look like a mistake, which is the view the page argues against.\n\n## Introduction\n\n**Hook** (`intriguing_example`): At a table of three, one person says a customer wants to export the schedule, another builds it that afternoon, the third tries it and it ships before dinner. In an organization of a thousand the same small change needs a place on a roadmap, a team that owns that part, a release path another team runs, a review and a number that says whether it helped.\n\n**Bridge:** Every reader has worked both ways, or has heard the older colleagues describe the first; everyone has waited for a plan, a review or another team. → The two are the same act with eight structures between them, and the page walks through those structures in the order they were added.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 and 2, in concrete words) and paragraph p02): Each structure was added to relieve a real limit on attention, judgment or verification that the arrangement before it had reached; each brought a new party or a new wait; and almost none was removed when its limit moved.\n\n**Roadmap** (Paragraph p03, with the KEY POINTS callout):\n\n- The walk starts with three people at one table, and with one week's absence that complicates it. *Kept in:* one-table.\n- It continues with the manager, the product manager and the split into teams. *Kept in:* manager, product-role, teams.\n- Then the platform team, the managers of managers and the plan. *Kept in:* platform, layers, plan.\n- Then the ladder and the metric, and today, shown at the book's fictional company, with one question answered at every step: who decides, who knows and who checks, and what does each of them wait for? *Kept in:* ladder-and-metric, today.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At a table of three a change to the product is said, built and checked in an afternoon by people who all heard the same sentence, while in an organization of a thousand the same small change passes a product manager, a plan, a team, a platform, a review and a number on a dashboard. | scenario: An illustration of common practice, labeled as one: three people at one table and a customer's request built by evening; the same request in a thousand-person organization, named only by things the reader already knows (a roadmap, a team, a review, a dashboard). |  |\n| p02 | claim | What lies between is eight structures, each added to relieve a real limit on attention, judgment or verification, each bringing a new party or a new wait, and almost none removed; the page tells them as a simplified account ordered by ideas, not as dated history. |  | `cause_effect`: The table and the thousand, which do the same thing so differently. → The claim that explains the difference, and the one declaration that the account is simplified, describes one generic organization, and uses few, sourced dates. |\n| p03 | transition (figure) | The walk has nine steps, from the table of three to today, each told as a limit, an addition with its name, what it made possible and what it cost, and each ends by answering one question: who decides, who knows and who checks, and what does each of them wait for? | figure: Mermaid figure: the same act (say it, build it, check it) at the bottom and one band per later step stacked on it, up to today. | `sequence`: The claim and the simplification. → The route, the shape of each step and the question asked at each. |\n\n## Sections\n\n### Three People at One Table: Nothing to Wait For\n\n**Controlling idea** (`example`, id `one-table`): Three people at r to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | context | At about ten people everyone still sits together, but every decision about priorities, pay, hiring and quarrels waits for the founder who used to settle such things over lunch. | scenario: An illustration of common practice: ten people, one founder who decides everything, a queue at her desk. |  |\n| p10 | definition | A manager is added, a person whose work is the team and not the product, and with the role comes the agreement about who may decide what, which the book calls a decision right. |  | `problem_solution`: The limit just described. → What was added and the term decision right, owned by decision-rights-and-decision-records. |\n| p11 | analysis | The people get decisions in a day and someone who has time for them, and the founders get their attention back for customers and the product. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the manager made possible for the team and for the founders. |\n| p12 | cause_effect | The price is that the person who decides is no longer a person who does the work: the manager knows it second-hand, and questions wait for the manager's calendar. | reasoning: The manager hears about the work in a weekly conversation; a question raised on Tuesday is answered on Friday. | `contrast`: What the structure made possible. → Its price: a decision made from a report, and a wait for one person's time. |\n| p13 | synthesis | With a manager, the manager decides the team's priorities, the people doing the work know it, colleagues still check one another, and questions wait for the manager's time. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### The Product Manager: Someone Who Speaks for the Customer\n\n**Controlling idea** (`example`, id `product-role`): When the builders can no longer all talk to customers, a product manager is added to know the customer and decide what to build, which gives the builders one answer and separates the person who knows the customer from the people who know the product.\n\n**Advances the thesis** (S2, S3): Shows a structure answering a limit on judgment about what is worth building, and bringing a hand-off between knowing the customer and building.\n\n**Transition in:** `sequence`: A manager who decides for the team. → The next thing nobody has time for: listening to customers and deciding what to build.\n\n**Order of paragraphs** (`problem_solution`): The limit the earlier arrangement reached comes first, then what was added and its name, then what it made possible, then what it cost, then the answer to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | context | With more customers than builders can visit, requests arrive from sales, support and the founders at once, and nobody has the time to find out which of them matter. | scenario: An illustration of common practice: conflicting requests from several directions; engineers who have not spoken to a customer in months. |  |\n| p15 | definition | A product manager is added, a person whose work is to know the customers and decide what is built next, working with the engineers and a designer. |  | `problem_solution`: The limit just described. → What was added and its name; the three roles together are owned by the-product-engineering-design-triad. |\n| p16 | analysis | Customers get someone who listens before anything is built, and the builders get one ordered answer in place of five competing requests. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the product role made possible for customers and for builders. |\n| p17 | cause_effect | The price is that the person who knows the customer is no longer the person who builds, so the reason for a feature can be lost in the hand-off and the team can end up shipping a list. | source: Foster and Nerlikar, Build What Matters (2020): the Feature Factory among ten dysfunctions of product management, 'an assembly line of features' (author's Kindle notes). The difference between a shipped feature (output) and a changed customer result (outcome) is owned by outcomes-over-output. | `contrast`: What the structure made possible. → Its price: a hand-off between knowing why and building what, and the risk of building a list. |\n| p18 | synthesis | With a product manager, the product manager decides what is built and the engineers decide how; one knows the customer and the others know the code; the engineers check that it works and often nobody checks that the customer is better off; each side waits for the other. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### The Split into Teams: More Than One Conversation\n\n**Controlling idea** (`example`, id `teams`): When no one can keep the whole product in mind, the group splits into teams that each own a part, which makes each part understandable again and creates joints between teams that nobody owns by default.\n\n**Advances the thesis** (S2, S3): Shows a structure answering a limit on attention and bringing boundaries, across which work, knowledge and decisions must now travel.\n\n**Transition in:** `cause_effect`: One manager, one product manager and one growing group. → The group outgrowing one conversation and one head.\n\n**Order of paragraphs** (`problem_solution`): The limit the earlier arrangement reached comes first, then what was added and its name, then what it made possible, then what it cost, then the answer to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | context | At about thirty people nobody can follow every conversation or know every part of the product, because the number of pairs who might need to talk grows much faster than the number of people. | fact: Arithmetic: 3 people make 3 pairs, 12 make 66, 30 make 435. Brooks made the point about communication effort in The Mythical Man-Month (essays first set out in 1975); it supplements the author's sources and is cited only for the widely known claim. |  |\n| p20 | definition | The group is split into teams, each with its own manager and product manager and each owning a part of the product small enough for its members to understand; the amount a team can hold in mind is what the book calls its cognitive load, and a team given more than that is overloaded whatever its headcount. |  | `problem_solution`: The limit just described. → What was added and the term cognitive load, owned by cognitive-load-and-team-boundaries (the concept is from Skelton and Pais, Team Topologies). |\n| p21 | analysis | Inside a team it is the table again: a handful of people who know their part and can change it safely, while the company can grow by adding teams. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the split made possible for a team and for the company. |\n| p22 | cause_effect | The price is the boundary: a rule that concerns two teams has to cross between them, the agreed way for it to cross is what the book calls an interface, and where there is none each team builds its own version and the product takes the shape of the teams. | source: Conway, 'How Do Committees Invent?', Datamation, April 1968: organizations that design systems produce designs that copy their communication structures (paraphrased). Owned by conways-law-and-the-inverse-conway-maneuver; interfaces by interaction-modes-and-team-apis. | `contrast`: What the structure made possible. → Its price: joints between teams, with a name for the agreed way across them. |\n| p23 | synthesis | With teams, each team decides inside its boundary and nobody decides what crosses it; each knows its part and nobody knows the whole; each checks its own work, one colleague reviewing another's change, and nobody checks the joints; a team waits for another team. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### The Platform Team: Build It Once for Everyone\n\n**Controlling idea** (`example`, id `platform`): When every team builds and runs the same underlying things, a platform team is added to build them once, which gives product teams their attention back and makes every team depend on one team's queue.\n\n**Advances the thesis** (S2, S3): Shows a structure answering a limit on attention across teams and bringing a shared party that others must wait for.\n\n**Transition in:** `cause_effect`: Many teams, each owning a part. → What they all need and each builds separately.\n\n**Order of paragraphs** (`problem_solution`): The limit the earlier arrangement reached comes first, then what was added and its name, then what it made possible, then what it cost, then the answer to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | context | With a dozen teams, each one sets up its own way to release, monitor and store data, so the same work is done a dozen times and done differently each time. | scenario: An illustration of common practice: twelve teams, twelve release scripts. |  |\n| p25 | definition | One team is given the things all the others need and builds them once; the book calls it a platform team. | source: Skelton and Pais, Team Topologies (2019): platform is one of four team types, and its knowledge is best made available as self-service (author's Kindle notes). | `problem_solution`: The limit just described. → What was added and its name, owned by team-types and platforms-and-developer-experience. |\n| p26 | analysis | Product teams get back the attention they spent on plumbing, and the company gets one way of releasing and one place to fix a fault for everyone. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the platform made possible for product teams and for the company. |\n| p27 | cause_effect | The price is a team that every other team depends on: when its help comes as a request and not as something teams can use by themselves, every launch joins one queue, and it can build what nobody asked for. |  | `contrast`: What the structure made possible. → Its price: one shared queue, and a team whose customers are inside the company and are seldom asked. |\n| p28 | synthesis | With a platform team, the platform team decides the shared tools, the product teams know what they need from them, the platform team often checks each launch, and every team waits in the platform's queue. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### Managers of Managers: Decisions Climb\n\n**Controlling idea** (`example`, id `layers`): When there are more managers than one person can support, a layer of managers of managers is added, which keeps every manager supported and puts every decision that crosses groups several levels away from the people who know.\n\n**Advances the thesis** (S2, S3): Shows a structure answering a limit on the top's attention and bringing distance between a decision and its information.\n\n**Transition in:** `sequence`: A dozen product teams and a platform team, each with a manager. → Who those managers report to.\n\n**Order of paragraphs** (`problem_solution`): The limit the earlier arrangement reached comes first, then what was added and its name, then what it made possible, then what it cost, then the answer to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | context | With fifteen or twenty teams the person at the top has as many managers reporting to her as the first manager once had engineers, and the queue at her desk is back. | scenario: An illustration of common practice: twenty managers, one head of engineering. |  |\n| p30 | definition | Teams are gathered into groups, each under a manager of managers; the number of people one manager supports is a span, and each level between the work and the top is a layer. | source: Larson, An Elegant Puzzle (2019), as his rule of thumb: managers should support six to eight engineers, and managers of managers four to six managers (author's Kindle notes). | `problem_solution`: The limit just described. → What was added and the terms span and layer, owned by spans-layers-and-managers-of-managers. |\n| p31 | analysis | Every manager again has someone with time for them, and the top can hold four groups in mind where it could not hold twenty teams. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the layer made possible for managers and for the top. |\n| p32 | cause_effect | The price is distance: a question between two groups goes up to the person both report to and the answer comes down again, that person knows the work only from summaries, and redrawing the chart becomes the tool nearest to hand. |  | `contrast`: What the structure made possible. → Its price: decisions made far from what is known, and a chart that can be mistaken for the organization. |\n| p33 | synthesis | With layers, whoever sits above both sides decides, the people at the bottom know and the top knows a summary, managers check managers by report, and the question waits to go up and come down. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### The Plan: Agreeing Once a Quarter\n\n**Controlling idea** (`example`, id `plan`): When the groups can no longer agree on priorities by talking, a plan is added that fixes for a quarter or a year who works on what, which lets hundreds of people pull the same way and makes every new idea wait for the next round.\n\n**Advances the thesis** (S2, S3): Shows a structure answering a limit on judgment across groups and bringing a calendar that decisions must wait for.\n\n**Transition in:** `cause_effect`: Groups under directors, each with its own priorities. → How several groups come to want the same thing at the same time.\n\n**Order of paragraphs** (`problem_solution`): The limit the earlier arrangement reached comes first, then what was added and its name, then what it made possible, then what it cost, then the answer to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | context | With several groups, one group's most important project needs work from two others that have their own, and nobody below the top can settle whose comes first. | scenario: An illustration of common practice: a project that needs three groups, each with a different first priority. |  |\n| p35 | definition | The priorities are written down for everyone at once, for a fixed period, with the people and money that go to each; the book calls the document and the routine that produces it the plan. |  | `problem_solution`: The limit just described. → What was added and its name, owned by planning; the rhythm of meetings around it by operating-cadence. |\n| p36 | analysis | A team can count on the help it was promised, and the leaders can tell customers and the board what will come and what it will cost. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the plan made possible for teams and for leaders. |\n| p37 | cause_effect | The price is time: the plan knows only what was known when it was written, something learned in week three waits for the next round, and the round itself needs every group to agree. |  | `contrast`: What the structure made possible. → Its price: a wait for the calendar, and an agreement so wide that it can stall. |\n| p38 | synthesis | With a plan, the planning round decides, once a quarter, from what was known when it was written; progress is checked against the plan and not against the customer; a new idea waits for the next round. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### The Ladder and the Metric: Judging Work You Cannot See\n\n**Controlling idea** (`example`, id `ladder-and-metric`): When the people who decide pay, promotion and funding can no longer watch the work, written levels for people and numbers for teams are added, which makes judgment at a distance possible and consistent and makes the description and the number the things people work toward.\n\n**Advances the thesis** (S2, S3): Shows two structures answering one limit on verification at a distance and bringing the risk that the stand-in is served in place of the work.\n\n**Transition in:** `cause_effect`: Several layers and a plan between the top and the work. → What the top can still see of a person's or a team's work: almost nothing directly.\n\n**Order of paragraphs** (`problem_solution`): The limit the earlier arrangement reached comes first, then what was added and its name, then what it made possible, then what it cost, then the answer to the running question. The name cannot come before the need, and the cost cannot come before the gain without making the structure look like a mistake.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | context | At several hundred people those who decide on pay, promotion and funding have never seen most of the work they are judging, and two managers reward the same work differently. | scenario: An illustration of common practice: a promotion decided by people who have not worked with the candidate; two teams whose results nobody at the top can compare. |  |\n| p40 | definition | For people, the company writes down what is expected at each level, which the book calls a career ladder; for teams, it picks numbers to watch, which the book calls metrics. | source: Forsgren, Humble and Kim, Accelerate (2018), as an example: the source of the delivery measures commonly called the DORA metrics (publisher's page). | `problem_solution`: The limit just described. → What was added, two stand-ins for watching the work, each named after its plain description; owned by career-ladders-and-leveling and measuring-engineering. |\n| p41 | analysis | People learn what it takes to move up and are judged by one standard, and leaders can see from a distance whether a team is getting faster or slower. | reasoning: Stated as common practice for the people doing the work and for the people leading it, in turn; no dated fact. | `cause_effect`: What this step added. → What the ladder and the metric made possible for people and for leaders. |\n| p42 | cause_effect | The price is that a description and a number are not the work: people do what the ladder lists, teams move the number that is counted, and the visible rescue is rewarded over the quiet prevention. |  | `contrast`: What the structure made possible. → Its price: the stand-in becomes the goal. |\n| p43 | synthesis | With a ladder and metrics, a committee decides from a written case and a dashboard, the people nearest the work still know it, the number checks only what it counts, and people wait for the next review cycle. |  | `conclusion_summary`: The step's gain and cost. → The answer to the running question at this step, longer than the one before. |\n\n### Today: Every Structure at Once, and Software That Writes\n\n**Controlling idea** (`example`, id `today`): Today all eight structures stand at once, because almost none was removed when its limit moved, and AI-assisted work has made writing a change cheap while every decision and check around it still passes through them.\n\n**Advances the thesis** (S4, S3): Shows the present as the sum of the steps, in the book's fictional case, and the newest moved limit (writing is cheap, checking is not) met by structures built for the old one.\n\n**Transition in:** `time`: Eight structures, added one at a time. → The present, in which they all stand together.\n\n**Order of paragraphs** (`large_to_small`): First that nothing was removed, then what the present adds, then the fictional case with its numbers, then the last answer to the running question. The case comes after the general statement so that its numbers are read as an illustration of it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | None of the eight structures was taken away when the next arrived, and few are removed even when the limit they answered has moved, because each still relieves someone and removing it has no owner. | reasoning: Each structure has people whose work it now is, and each still answers a need for somebody; the reasoning is the thesis's how_why, stated as the author's. |  |\n| p45 | explanation | What the present adds is software that writes: coding agents now draft changes that people wrote by hand, so writing a change takes less time while deciding whether it is right and worth shipping does not. | reasoning: Labeled Emerging, the author's observation as of November 2026; full treatment in where-the-constraint-moves and agentic-delivery. | `time`: Eight structures still in place. → What is new today: AI-assisted work, as an Emerging claim (the author's observation, as of November 2026), with no forecast. |\n| p46 | example | Corvane, the fictional company this book follows, shows all of it together at 1,100 people in 2028: every earlier structure is in place, coding agents work in every team, merged changes rose 2.4 times in a year, and the median wait for a review went from 5 hours to 31. | scenario: Scenario ledger, stage 5 (2027–2028): 1,100 people, 520 in product and tech, two business units, coding agents in every team, an AI enablement team; merged changes per week up 2.4 times from January 2027 to January 2028; median review wait 5 hours to 31 (the Review Wall). Fictional. | `example`: Structures that stay and writing that got cheap. → Today's case, an illustration with the ledger's numbers. |\n| p47 | synthesis | Today the answer to the running question is the sum of all the earlier answers, and the longest wait is for a person to check what software wrote in minutes. |  | `conclusion_summary`: Corvane in 2028. → The last and longest answer to the running question. |\n\n## Conclusion: What the Steps Add Up To\n\n**Synthesis:** Read together, the steps show one movement no single step shows: at the table the people who decide, know and check are the same people, and every structure moved those three a little further apart, so each answer to the running question is longer than the last and contains it.\n\n**So what:** Each structure answers a limit that returns if the structure is removed, so complexity cannot be stripped away wholesale; but a limit can move, and a structure whose limit has moved is the one to change. The reader asks of any structure what it was added for and whether that need still exists.\n\n**Callback:** The three people at one table and the change that shipped before dinner. The reader can now count what stands behind the same change at a thousand people: eight structures, and the waits they brought with them.\n\n**Takeaway** (`broader_implications`): The failure patterns of the next page are the costs of reasonable choices, not signs of weak leaders or bureaucracy: each is one of these structures doing what it was added to do after the need behind it moved.\n\n**Hand-off** to [Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html): `cause_effect`: The structures added step by step, each with the cost it brought. → Those costs as twelve named failure patterns, each tied to a designable element.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | synthesis (table) | Set side by side, the nine steps each made something possible, and each step after the first added a structure or a party, a wait and a way to go wrong, and the last column of the table is the vocabulary of the next page. | table: Nine rows (one table, manager, product manager, teams, platform team, managers of managers, plan, ladder and metric, today) with columns: Step, What it made possible, What it added, New party or wait, What can now go wrong; the last column uses the twelve failure-pattern names of the style guide exactly, each once, and plain words where none applies. |  |\n| p49 | synthesis | Behind the act that began as say it, build it, check it there now stand eight structures and the waits they brought, and the answer to the running question grew from 'all three of us, and nothing' to a chain of people and routines in which each waits for another. |  | `elaboration`: The steps side by side. → The count behind one present-day change, and the single movement the steps share: deciding, knowing and checking moved apart. |\n| p50 | refutation | The complexity is not bureaucracy that a determined leader could strip away without loss: each structure answers a limit that returns the day it is removed, so the useful question about any structure is what it was added for and whether that need still exists. | reasoning: Remove the manager and the founder's queue returns; remove the plan and the groups' priorities collide again; but a structure whose limit has moved (a review step sized for hand-written changes) is a candidate for change. Stated as the author's judgement. | `contrast`: Eight structures and a long chain of waits. → The opposing view (empire-building, strip it away), the answer to it, and the question the reader can now ask of their own organization. |\n| p51 | transition | The next page names the costs: twelve recurring failure patterns, each the price of one of these reasonable additions, each tied to something a leader can design. |  | `cause_effect`: Structures as answers, each with a cost. → The twelve named patterns of the next page, as those costs. |\n\n## Non-goals\n\n- A history of management or of the software industry: events, founders and firsts are left out; the walk follows one generic organization.\n- Teaching any structure properly: each gets plain words, its name and a link. See [Decision Rights and Decision Records](decision-rights-and-decision-records.html), [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html), [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html), [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html), [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html), [Platforms and Developer Experience](platforms-and-developer-experience.html), [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html), [Planning](../grounded-engineering-executive/planning.html), [[career-ladders-and-leveling]], [[measuring-engineering]].\n- The failure patterns themselves: the page uses their names in the tally and plants their causes in the costs, and explains none. See [Where Product & Tech Organizations Go Wrong: The Failure Patterns](where-product-and-tech-organizations-go-wrong.html).\n- Corvane as a company and its five stages; it appears only in the last step as today's case. See [Meet Corvane: One Company at Five Sizes](corvane-at-five-sizes.html).\n- What breaks at each size and what to do about it. See [[scaling-stages]].\n- What AI changes, beyond one labeled observation and the fictional case in the last step; no forecast. See [[where-the-constraint-moves]], [[agentic-delivery]].\n- The chapter format: no failure-pattern callout, no 'What AI Changes Here' section, no three-tier take-away and no checklist; the page follows the field-evolution shape.\n- Other structures a growing organization adds (design leadership, staff engineers and architects, architecture forums, hiring pipelines, values): they introduce no step the thesis names. See [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html), [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html), [[hiring-and-onboarding]], [[values-operating-principles-and-rituals]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Nine steps were reached by telling the ladder and the metric as one step (one need: judging work you cannot see). The author may prefer them as two steps, which would make ten.\n- The sizes at which each step is placed (about ten, thirty, a dozen teams, several hundred) are rough illustrations of common practice, not sourced thresholds; scaling-stages owns the sourced version.\n- The per-step illustrations the field-evolution skill asks for were not generated; the page has one Mermaid figure for the accumulation. An illustration pass is left for later.\n- Brooks's The Mythical Man-Month is not on the author's bookshelf; it is cited only for the widely known point about communication effort, and its year rests on the publisher's page for the anniversary edition, whose preface refers to 'the 1975 Preface'.\n- Each failure-pattern name is placed once in the tally at the step whose cost plants it; the failure-patterns page, written in parallel, may place a pattern's origin differently.\n\n## Decision log\n\n- **2026-11-19** — Nine steps in the order of the journal-spec thesis: one table, manager, product manager, split into teams, platform team, managers of managers, plan, ladder and metric (one step), today. Rejected: Ten steps with the ladder and the metric apart (the skill asks for six to nine, and both answer one need).; The split into teams before the manager (the journal-spec thesis lists the manager and the product role first, and the walk needs the decision right before the product manager).\n- **2026-11-19** — The walk follows one generic organization, with rough sizes as illustrations; Corvane appears only in the last step, with ledger numbers for 2028. Rejected: Telling the walk as Corvane's history (the skill and AC-3 keep the fictional case out of the past; corvane-at-five-sizes tells that story).\n- **2026-11-19** — The running question is 'Who decides, who knows and who checks, and what does each of them wait for?', answered in a closing paragraph of every step. Rejected: Naming attention, judgment and verification in every answer (the plain verbs are easier for a newcomer; the capacities are named at the table and in each need).\n- **2026-11-19** — Six anchor dates, each the year a source put an idea in writing, each checked on 19 November 2026: 1968 (Conway's own site), 1975 (publisher's page of the anniversary edition), 2018 (IT Revolution's page for Accelerate), 2019 (Team Topologies' own book page; Open Library for An Elegant Puzzle), 2020 (Open Library for Build What Matters). Rejected: The Agile Manifesto (2001): no step needs it.; Any date for when a practice began: common practice, not an event.; Stripe Press's page for An Elegant Puzzle (it states no publication date).\n- **2026-11-19** — Each of the twelve failure-pattern names appears once in the tally: product manager (The Feature Factory); teams (The Unowned Interface, The Overloaded Team); platform (The Platform Nobody Asked For); managers of managers (The Escalation Ladder, The Org Chart as Architecture, The Reorg as Strategy); plan (The Consensus Stall); ladder and metric (The Ladder as Checklist, The Output Scoreboard, The Hero Culture); today (The Review Bottleneck). Rejected: Listing a pattern at every step that can produce it (the table would stop being an index).\n- **2026-11-19** — One Mermaid figure for the accumulation and no generated illustrations, by instruction for this book. Rejected: Generated per-step scenes (left for a later illustration pass).\n- **2026-11-19** — Flow rubric notes not acted on: the anchor timeline stays in the conclusion after the tally (the field-evolution skill places it there; its dates are given in the steps as evidence, which the order printout does not show), and the tally lead-in keeps its sentence about the last column (the table uses the pattern names before the next page explains them). Rejected: Folding the timeline into the tally lead-in.; Moving the sentence about the last column to the hand-off paragraph.\n- **2026-11-19** — After round 1 of the draft check: the anchor timeline is moved out of the conclusion into for the widely known point about communication effort.\n  - IT Revolution, product page for Accelerate (Forsgren, Humble, Kim), accessed 2026-11-19 — Publication date 27 March 2018; the DORA metrics.\n  - teamtopologies.com/book and Open Library records, accessed 2026-11-19 — Team Topologies first edition 2019; An Elegant Puzzle 2019; Build What Matters 2020.\n\n## Changelog\n\n- **2026-11-19** — First draft of the spec, written with the field-evolution and spec-creator skills; intent, acceptance criteria, thesis and role copied from the journal spec.\n- **2026-11-19** — Flow rubric by a fresh agent, once: sound with notes. Acted on: each team gets its own manager and product manager in the split step, so the managers of managers have managers to gather; review by a colleague is named in the split step before the last step counts the wait for it; the first answer admits the week away; the tally idea no longer says the first step added a structure; section flows for the first and last step relabeled or justified; the post-level reason says the platform precedes the layers by size only.\n- **2026-11-19** — Status set to accepted in auto mode.\n- **2026-11-19** — Round 1 of the draft check found a fault of order in the spec (uncorroborated flow finding, agreeing with the flow rubric): the anchor timeline paragraph was removed from the conclusion and the table moved to Sources and Evidence; the callback no longer says a wait at each structure; the overloaded team is named with cognitive load in the split step. Paragraph ids after p48 shift by one.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
