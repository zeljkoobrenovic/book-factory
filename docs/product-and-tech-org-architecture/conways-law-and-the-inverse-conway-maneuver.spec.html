<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Conway's Law as Conway stated it, and the reasoning behind it.\n- **Know:** The inverse Conway maneuver and the conditions under which it works or fails.\n- **Believe:** A change to teams is a change to the product's architecture, and the reverse.\n- **Be able to:** Predict where a system's awkward interfaces are from its team structure.\n- **Be able to:** Judge whether a planned team reshaping will produce the intended architecture, by checking skills and ownership.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a team structure, the reader predicts where the system's weakest interfaces will be and why. *Probe:* A company has one iOS team, one Android team and four backend teams split by database. Where would you expect its product to be inconsistent, and why? | `custom` | cold_reader | major |\n| AC-2 | The chapter gives at least one case in which the inverse maneuver fails and names the missing condition. | `custom` | rubric | major |\n| AC-3 | Conway (1968) and Team Topologies are cited for what each contributes; evidence beyond those is labelled as research finding or as the author's experience. | `evidence_is_explained` | rubric | major |\n\n## Thesis\n\n**Question:** Why do systems end up shaped like the organizations that build them, and when can a leader use that deliberately?\n\n> **Claim:** Systems mirror organizations because every design decision needs communication between the people who make it, so interfaces form where teams talk least; a leader can use this by shaping teams to match the wanted architecture, but the maneuver works only when the new teams hold the skills and the ownership the target boundaries require, and otherwise the old architecture reappears inside the new chart.\n\n**Disputed by:** Two opposite views: that architecture is a technical matter architects decide and teams implement, and that redrawing the teams is enough to make the new architecture follow.\n\n**So what:** A leader reviews a team change as an architecture change and an architecture change as a team change, and checks skills and ownership before announcing either.\n\n**How and why:** Conway's argument is about the cost of communication: two parts designed by people who do not talk get a narrow, slow-changing interface. The inverse maneuver changes who talks, but code, knowledge and operational duty stay where they were unless they are moved too.\n\n**Supporting claims**\n\n- **S1** — Conway's argument holds: organizing a design effort is already a design decision, and two parts of a system get an interface only where their designers negotiate one, so the system's structure copies the organization's communication structure.\n- **S2** — Because a design decision across a team line costs more than one inside a team, software interfaces on team lines come out narrow, duplicated or queued, which makes a system's weak interfaces predictable from its team structure.\n- **S3** — A leader can use the law deliberately by shaping teams to match the wanted architecture, the inverse Conway maneuver, which makes every team design an architecture decision and every architecture decision a request to the organization.\n- **S4** — The maneuver works only when each new team holds the skills and the ownership its boundary requires; when either is missing, the old architecture reappears inside the new chart.\n- **S5** — Both opposite views fail: architecture decided apart from the teams is overruled by the communication structure, and teams redrawn without moving skills and ownership change the chart and not the system.\n\n## Role in the part\n\nShows why the arrangement of teams, and not only their quality, decides the shape of what is built. Supports P1-2 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in what-conway-argued, where-teams-talk-least, predict-weak-interfaces: the law before its mechanism, the mechanism before the prediction that uses it; the-inverse-maneuver before skills-and-ownership)\n\nAfter the opening callouts of the page format, the reader meets a product whose faults sit on team lines, so the law arrives as the explanation of something already seen. Conway's argument comes before the cost mechanism because the mechanism is a reading of it, and the prediction pattern comes after both because it is the mechanism run forward on a structure; placed first it would be a rule of thumb without a reason. The inverse maneuver follows the prediction because it is the same law used to choose a structure where the prediction only read one, and its two conditions follow it at once so that the reader never holds the maneuver without its limits. The two mistakes come after the maneuver and its conditions because the first ignores the law the maneuver uses and the second ignores the conditions; shown earlier, the second could not be told from the maneuver itself. The trade-offs come after the mistakes because each mistake moves only one side of a mismatch, and a table of choices shown before them would present those one-sided moves as options without their failure. The worked example comes after all of it because it needs the conditions to tell Corvane's working change from its failing one, and the AI section is a coda that asks whether the mechanism survives a change in who writes the code.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2021 a customer of Corvane could have drawn Corvane's team structure without ever seeing it. The office application and the mobile app each behaved consistently, and they disagreed with each other about whether a technician could take a second job inside a travel-time window. The product was sound inside each team's part and broken exactly on the line between two teams.\n\n**Bridge:** A reader who builds software has used a product in which the web and mobile versions of one feature behave differently, and has probably guessed that two teams built them. → That guess is Conway's Law, and this chapter shows why it holds and what a leader can do with it.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Systems mirror organizations because every design decision needs communication between the people who make it, so interfaces form where teams talk least. A leader can use this by shaping teams to match the wanted architecture, but the maneuver works only when the new teams hold the skills and the ownership the target boundaries require; otherwise the old architecture reappears inside the new chart.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a product whose faults sit on its team lines. *Kept in:* faults-on-team-lines.\n- Learn Conway's Law as Conway argued it, and the evidence for it. *Kept in:* what-conway-argued.\n- Understand the cost of communication that makes interfaces form where teams talk least. *Kept in:* where-teams-talk-least.\n- Predict a system's weak interfaces from its team structure. *Kept in:* predict-weak-interfaces.\n- Use the inverse Conway maneuver, and check the two conditions it depends on. *Kept in:* the-inverse-maneuver, skills-and-ownership.\n- Recognize the two opposite mistakes and weigh the alternatives to the maneuver. *Kept in:* two-opposite-mistakes, trade-offs.\n- See three team changes at Corvane checked against the conditions, and what AI changes. *Kept in:* three-team-changes, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2021 a customer of Corvane could have drawn Corvane's team structure from its product alone, because the product was consistent inside each application and inconsistent exactly where one team's work met another's. | scenario: The Two Calendars, 2021, at 50 people: the office application built by Web and the mobile app built by Mobile gave different answers to whether a technician could take a second job inside a travel-time window; each application agreed with itself. |  |\n| p02 | claim | Systems mirror organizations because every design decision needs communication between the people who make it, so a leader can shape teams to get a wanted architecture, but only when skills and ownership move with them; the chapter goes from the case, through Conway's argument and the mechanism behind it, to predicting weak interfaces, then to the inverse Conway maneuver and its two conditions, the two opposite mistakes, the trade-offs, Corvane's three team changes, and AI. |  | `cause_effect`: A product whose faults sat on team lines. → The law that explains it, the use a leader can make of it, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Faults on the Team Lines\n\n**Controlling idea** (`example`, id `faults-on-team-lines`): Corvane's product in 2021 and 2022 was inconsistent only where two teams' work met, and the people who built it were not careless.\n\n**Advances the thesis** (S2): Gives the case the law has to explain: faults located on team lines.\n\n**Transition in:** `elaboration`: The lead's short account of a product that showed its team structure. → The structure, the two faults and where each one sat.\n\n**Order of paragraphs** (`chronological`): Structure first, then the two faults in the order they happened, then the question; with the question first the reader would not yet see that the faults share a location.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2021 Corvane had four teams, each of which owned one part of the product and built it well. | scenario: 50 people, 28 in product and tech; Web (office application), Mobile (technicians' app), Integrations (billing and stock connections), Core (shared services), under two engineering managers. |  |\n| p04 | example | Both faults Corvane's customers saw in 2021 and 2022 sat on a line between two teams: the overlapping-jobs rule between Web and Mobile, and the job-status rule between Mobile and Integrations. | scenario: Two Calendars (2021): planners and technicians saw different schedules for three weeks. Second Calendar (2022): a job marked complete on the phone stayed open in billing exports for eleven days. | `contrast`: Four teams that each built their part well. → Where the product nevertheless failed. |\n| p05 | analysis | The pattern is too regular to be carelessness: each team's code was correct by that team's reading of the rule, so the question is why the product was weak exactly where the teams met. | reasoning: If the cause were individual error, faults would be spread through the product; they were confined to the places where two teams' work met. | `cause_effect`: Two faults on two team lines. → What that regularity rules out, and the question it leaves. |\n\n### Conway's Law: What Conway Argued in 1968\n\n**Controlling idea** (`explanation`, id `what-conway-argued`): Conway argued that an organization that designs a system produces a design whose structure copies the organization's communication structure, because organizing the work is already a design decision and because two parts get an interface only where their designers negotiate one.\n\n**Advances the thesis** (S1): States the law in its author's terms and gives his two-step reasoning, his examples and the evidence since.\n\n**Transition in:** `problem_solution`: The question why a product is weak where teams meet. → The answer Melvin Conway gave in 1968.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The law is stated first so the reader knows what is being argued for; the two steps of reasoning follow in the order in which one depends on the other; the example and the study come last because they are read as confirmations of an argument already understood.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Conway's Law, as Conway stated it in 1968, is that organizations which design systems are constrained to produce designs that are copies of their communication structures. | quotation: Conway's conclusion: \"organizations which design systems (in the broad sense used here) are constrained to produce designs which are copies of the communication structures of these organizations.\" Published in Datamation, April 1968. The paper supplements the author's own sources; it was read for this chapter. |  |\n| p07 | explanation | The first step of Conway's reasoning is that organizing a design effort is itself a design decision: once the work is divided among groups, the designs that would need other communication paths can no longer be pursued. | source: Conway: the act of organizing a design team means certain design decisions have already been made, explicitly or otherwise; each delegation narrows the class of design alternatives that can be effectively pursued. Team Topologies highlights the same passage. | `elaboration`: The law as stated. → The first of the two steps that lead to it. |\n| p08 | explanation | The second step is that two parts of a system can work together only through an interface, and an interface exists only where the designers of the two parts have negotiated and agreed one, so the map of the system's parts and the map of who talks to whom have the same shape. | source: Conway: where two nodes of the system are connected, the two design groups must have negotiated and agreed upon an interface specification; he calls the structure-preserving relationship a homomorphism. Team Topologies calls its pull the \"homomorphic force\". | `sequence`: The division of work as a design decision. → What the division does to the connections between parts. |\n| p09 | example | Conway's own examples show the copying in miniature: eight people asked to write two compilers, split five and three, produced a five-phase compiler and a three-phase compiler. | example: A contract research organization assigned five people to a COBOL compiler and three to an ALGOL compiler; the COBOL compiler ran in five phases and the ALGOL compiler in three. | `example`: The argument in the abstract. → Conway's concrete case. |\n| p10 | evidence | Since 1968 the law has been tested at least once with measurement: a study of matched software products found the product of the loosely coupled organization more modular in every pair, with the limits its authors state. | statistic: Research finding: MacCormack, Rusnak and Baldwin compared five matched pairs of software products, one open source and one commercial each, by propagation cost (the share of the system a change to one element can affect, on average); in all five pairs the open-source product was more modular, by up to a factor of eight. Stated limits: five pairs, software only, and two rival causal explanations (designs evolve to reflect their environment, or designers choose modularity on purpose). | `additional_support`: Conway's argument and examples, which are reasoning and anecdote. → A measured test and what it does and does not establish. |\n\n### Why Interfaces Form Where Teams Talk Least\n\n**Controlling idea** (`cause_effect`, id `where-teams-talk-least`): The force behind the law is the cost of communication: a design decision inside a team is cheap to make and to revisit, one across a team line is expensive, so software interfaces on team lines are narrow, slow to change, duplicated or queued.\n\n**Advances the thesis** (S2): Turns Conway's argument into a mechanism a leader can reason with.\n\n**Transition in:** `cause_effect`: Conway's claim that the system copies the communication structure. → The cost that makes it do so, and the forms the copy takes.\n\n**Order of paragraphs** (`prerequisite_order`): The software interface is defined before the cost argument that uses it; the three outcomes follow the cost argument directly because each is a result of the cost, and they answer the opening question about Corvane's two faults; the warning about which lines count comes last because it qualifies everything before it and is the first thing the prediction pattern of the next section needs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Two kinds of interface have to be kept apart, the software interface between two parts of a system and the team interface of chapter 1, and Conway's claim is that they coincide. | reasoning: The introduction defines interface as the software kind; chapter 1's kind, the agreed way work and knowledge cross between teams, is called a team interface in this chapter; a software interface whose sides disagree or that changes too slowly is called weak. |  |\n| p12 | cause_effect | A design decision made inside a team costs a conversation at a desk and can be revisited the next day, while the same decision across a team line costs a meeting, a document and a wait, so teams make as few of those as they can. | reasoning: The author's reading of Conway's argument as a cost of communication: decisions that are cheap get made often and corrected; decisions that are expensive get made once, narrowly, or not at all. | `cause_effect`: Two kinds of interface that coincide. → Why they coincide: what a decision costs on each side of a team line. |\n| p13 | analysis (table) | An expensive decision at a team line ends in one of three ways: a narrow contract that rarely changes, the same logic built twice, or a queue at the team that owns what others need; both of Corvane's faults were the second. | table: Outcome \\| What you see in the software \\| What you see in the organization \\| Corvane. Narrow contract: a small, stable API \\| little cross-team talk, and it is enough \\| Core's service API in 2021. Duplicate: the same rule implemented in two places \\| each team decides alone \\| the overlapping-jobs rule in Web and Mobile, 2021. Queue: one path every change must take \\| requests wait at one team \\| none in 2021; the worked example shows one from 2023. The lead-in names the narrow contract as the good outcome and Chapter 1's failure pattern The Unowned Interface for the duplicate. | `elaboration`: Decisions across a team line are expensive. → The three results of that expense. |\n| p14 | explanation | What counts is who actually talks, not who reports to whom: Conway wrote of communication structure, and Team Topologies warns that the org chart does not show it. | source: Conway's law names the communication structure; Team Topologies treats the org chart as a poor picture of how teams communicate. The author's working record is [The Problem with Org Charts](../grounded-engineering-executive/org-chart-problems.html). | `contrast`: Three outcomes at a team line. → Which lines count as team lines: those of real communication, not of reporting. |\n\n### Pattern: Predict the Weak Interfaces from the Team Structure\n\n**Controlling idea** (`process`, id `predict-weak-interfaces`): Given a team structure, a leader can predict where the product will be inconsistent or slow by listing the things users experience as one and marking every team line each of them crosses.\n\n**Advances the thesis** (S2): Makes the law a diagnostic the reader can run on a structure.\n\n**Transition in:** `problem_solution`: Three outcomes at a team line. → A way to find the lines that matter before the incidents do.\n\n**Order of paragraphs** (`chronological`): Procedure, then its results on common cases, then its limit; the limit comes last because it qualifies results the reader has to have seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | process | The prediction has three steps: list what users experience as one thing, mark each team line it crosses, and ask at each line whether a contract exists and who owns it. | reasoning: User of the pattern: the leader or architect reviewing a team structure. Outcome measure: the share of cross-team incidents and delays in the following two quarters that fall on lines the review marked. |  |\n| p16 | comparison (table) | Common team structures have predictable weak interfaces, because each puts its lines across a different thing that users experience as one. | table: Teams cut by \\| Line runs across \\| Expect. Client platform (web, each mobile platform) \\| every feature that exists on more than one client \\| the same feature behaving differently per client. Technical layer or data store (front end, back end, one team per database) \\| every feature that needs more than one layer or store \\| slow features, and data that disagrees between stores. Product area with one shared release or infrastructure team \\| every launch \\| a queue at the shared team. Site or time zone \\| whatever is split between sites \\| an interface at the site line, however the code is organized. | `example`: The three steps. → What they yield for four common structures. |\n| p17 | explanation | The prediction says where to look and not that something is broken: a line with an owned contract and little need for change is a good interface, and the law is why it is good. | source: Team Topologies: not all communication is good; if two teams should not need to communicate according to the software design and do, something is wrong. The author's working record is [Conway's Law](../grounded-engineering-executive/conways-law.html). | `contrast`: Predicted weak interfaces. → The limit of the prediction: lines that are fine. |\n\n### Pattern: The Inverse Conway Maneuver\n\n**Controlling idea** (`definition`, id `the-inverse-maneuver`): The inverse Conway maneuver uses the law on purpose: decide the architecture you want, then shape the teams so that the cheap conversations happen inside each wanted part and the expensive ones only across the wanted interfaces.\n\n**Advances the thesis** (S3): Introduces the deliberate use of the law and what it makes of team design.\n\n**Transition in:** `problem_solution`: A law that predicts where a structure will hurt. → The same law used to choose the structure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | The inverse Conway maneuver is to choose the architecture first and then shape the teams to match it, so that the structure the organization naturally produces is the one you want. | source: Team Topologies describes the maneuver under the name reverse Conway maneuver and carries the line that team assignments are the first draft of the architecture. User of the pattern: the leaders who decide team boundaries, with the architects. Outcome measure: whether a change inside one wanted part can be made and released by one team without waiting for another. |  |\n| p19 | explanation | The maneuver makes team design an architecture decision, so the people who draw teams are deciding architecture whether or not they know it, and technical leaders belong in the room. | source: Team Topologies argues that managers who decide which teams build which services are implicitly deciding the system architecture, and that deciding the shape and boundaries of teams without input from technical leaders is very ineffective. | `cause_effect`: Teams shaped to produce an architecture. → Who therefore has to take part in shaping them. |\n| p20 | explanation | The reverse holds too: an architecture decision is a request to the organization, and Team Topologies turns Conway's law into a standing question about which better designs the current teams cannot reach. | quotation: Team Topologies: the law \"creates an imperative to keep asking: 'Is there a better design that is not available to us because of our organization?'\" | `similarity`: A team change is an architecture change. → An architecture change is a team change. |\n\n### The Two Conditions: Skills and Ownership\n\n**Controlling idea** (`analysis`, id `skills-and-ownership`): The maneuver changes who talks to whom, but code, knowledge and operational duty stay where they were unless they are moved too, so it works only when each new team holds the skills and the ownership its boundary requires.\n\n**Advances the thesis** (S4): States the conditions and gives a failing case with the missing condition named.\n\n**Transition in:** `contrast`: The maneuver as designed. → What it does not move, and the two conditions that follow.\n\n**Order of paragraphs** (`prerequisite_order`): What the maneuver leaves in place comes first because both conditions are derived from it; skills before ownership because a team cannot own what it cannot change; the failure case last because it needs both conditions to be diagnosed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | explanation (figure) | Redrawing teams changes who sits and plans together, and it leaves three things where they were: the code, the knowledge of how it works, and the duty to run it. | figure: Mermaid decision flow, top to bottom: 'Wanted architecture' → 'Teams redrawn to match' → 'Does each team hold the skills its boundary needs?' → (no) 'Old architecture reappears inside the new chart'; (yes) → 'Does each team own its code, its decisions and its operation?' → (no) the same failure node; (yes) → 'Architecture follows the teams'. |  |\n| p22 | explanation | The skills condition is that each new team can design, change, release and operate its part without borrowing a person from another team; where it cannot, the team that holds the missing skill becomes a party to every change. | reasoning: The author's reading of Conway's argument: a dependency on someone else's skill is a communication path, so the old interface is still there. Team Topologies makes skills an input to team design ('Given our skills, constraints, cultural and engineering maturity, desired software architecture, and business goals, which team topology...'). | `elaboration`: Three things a redrawn chart leaves in place. → The first condition, about knowledge. |\n| p23 | explanation | The ownership condition is that every part of the system is owned by exactly one team, which holds its code, the decisions about it and the duty to operate it. | quotation: Team Topologies: \"Every part of the software system needs to be owned by exactly one team.\" Other teams may propose changes; they do not make them. | `sequence`: The skills condition. → The second condition, about code, decisions and operation. |\n| p24 | example (table) | When either condition is missing the old architecture reappears inside the new chart, as when a system is split into services by team and every service still shares one database. | table: Condition \\| What has to move with the team \\| Sign that it did not \\| What reappears. Skills \\| knowledge of the domain, the code, releasing and running it \\| changes wait for one person in another team \\| the old team, as a queue. Ownership \\| code, decision rights, on-call \\| several teams change the same code or schema; nobody is paged \\| the old system, with more meetings.; source: Team Topologies' joined-at-the-database monolith: several applications or services all coupled to the same database schema; and the distributed monolith, where almost every change requires other services to change. Missing condition: ownership of the data. | `cause_effect`: Two conditions. → What happens without them, with a case. |\n\n### Anti-Patterns: Two Opposite Mistakes\n\n**Controlling idea** (`counterargument`, id `two-opposite-mistakes`): The law is ignored in two opposite ways: architecture designed apart from the teams, and teams redrawn in the belief that the architecture will follow.\n\n**Advances the thesis** (S5): Answers the two views the thesis is disputed by.\n\n**Transition in:** `contrast`: The maneuver done with its conditions. → The two common ways of doing without them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | counterargument | The first mistake treats architecture as a technical matter that architects decide and teams implement, and the design that results is the one the communication structure allows, not the one drawn. | quotation: Team Topologies: \"thinking of software architecture as a standalone concept that can be designed in isolation and then implemented by any group of teams is fundamentally wrong.\" |  |\n| p26 | counterargument | The second mistake, The Org Chart as Architecture, is the belief that redrawing the teams is enough, and one form of it splits teams ever finer in Conway's name, drawing new team lines across knowledge that is not split with them. | reasoning: The book's failure pattern The Org Chart as Architecture, and from the author's record [Conway's Law](../grounded-engineering-executive/conways-law.html): many small component teams that multiply handoffs. | `contrast`: Architecture without teams. → Teams without architecture. |\n\n### Trade-Offs: Move the Teams, Move the Architecture, or Keep the Mismatch\n\n**Controlling idea** (`comparison`, id `trade-offs`): When teams and architecture disagree there are three choices, and which is right depends on which side is closer to what the product needs and on what moving it costs people.\n\n**Advances the thesis** (S3, S5): Gives the conditions under which the maneuver is and is not the right move.\n\n**Transition in:** `elaboration`: Two mistakes that each move only one side. → The honest choice among moving one, the other, or neither.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | comparison (table) | A mismatch between teams and architecture can be closed from either side or kept on purpose, and each choice has a price. | table: Choice \\| Right when \\| Price. Move the teams to the wanted architecture \\| the architecture is what the product needs and the skills and ownership can move \\| a reorganization, with its cost to people. Move the architecture to the teams \\| the teams are well formed around users and the software cuts across them \\| a migration. Keep the mismatch and own the interface \\| the area changes rarely, or a change is already planned \\| a standing contract and a named owner for it. |  |\n| p28 | explanation | None of the three is permanent, because the first design is rarely the best one and the organization has to be able to change when a better one is found. | quotation: Conway: \"flexibility of organization is important to effective design\", because the design that occurs first is almost never the best possible. | `additional_support`: Three choices for one mismatch. → Why the choice will have to be made again. |\n\n### Worked Example: Three Team Changes at Corvane\n\n**Controlling idea** (`example`, id `three-team-changes`): Corvane changed its teams three times between 2022 and 2024, and each change did to the architecture what its skills and ownership allowed: one maneuver worked, one failed, and the repair supplied what the failure lacked.\n\n**Advances the thesis** (S4, S2): Applies the two conditions to three changes, one that worked and one that failed.\n\n**Transition in:** `example`: The conditions and trade-offs in general. → Three changes at one company, checked against them.\n\n**Order of paragraphs** (`chronological`): The table first so that no change is judged before it is shown; then the three changes in the order they happened, which is also success, failure and repair.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | comparison (table) | Set side by side, Corvane's three changes to what its teams were or owned differ in what moved with the teams: the skills and the ownership. | table: Change \\| Architecture it implied \\| Skills \\| Ownership \\| Result. 2022, 45 engineers in four teams: rules moved into Core \\| one rule engine, three client applications \\| Samir Haddad, in Core, understood the scheduling engine and the mobile sync \\| code in Core; Priya Nambiar decides the rules; Core owns the versioned schema and the weekly rules session \\| no third incident; Core overloaded. 2023, growing from 45 engineers to 95: eleven product teams and Platform \\| eleven product areas that change and release separately \\| launch knowledge stayed with five platform engineers \\| launches owned by Platform \\| changes queue for launches; lead time from 4 days to 19. 2024, 95 engineers: a release path a product team runs itself \\| the same eleven areas \\| a platform engineer worked inside Scheduling for the first six weeks \\| Scheduling owns its releases \\| Scheduling at 6 days; under 7 company-wide three quarters after the brief. |  |\n| p30 | analysis | The 2022 change was an inverse maneuver in its smallest form, one boundary moved and no person, and it worked because the team that received the rules already held the skill and was given the code, the decision and the contract. | scenario: The 2022 fix: one rule engine in Core; Priya Nambiar, the product manager, decides scheduling and job-status rules; changes published as a versioned schema. No third incident of the kind; Core's six engineers now owned more than they could comfortably understand. | `elaboration`: The table as a whole. → Its first row, and why it worked. |\n| p31 | analysis | The 2023 change failed as a maneuver: the chart drew eleven separately releasable product areas, and because the skill and the ownership of launching stayed in Platform, the architecture did not follow the chart, a team's change still reached customers through another team, and the teams queued for launches. | scenario: The Launch Queue, 2024: all eleven product teams needed Platform for some launches and three for every launch; 14 open launch requests; five platform engineers; median lead time from 4 days to 19. Nobody at Corvane had called the 2023 change a maneuver; the chart implied the architecture all the same. | `contrast`: A change in which skills and ownership moved. → A change in which neither did. |\n| p32 | analysis | The 2024 repair did not redraw a single team: it supplied the two missing conditions by rebuilding the release path so that a product team could run it and by moving the skill with a platform engineer, at the price of a migration, and the architecture the 2023 chart had drawn began to exist. | scenario: Dario Vance, VP Engineering, and Lena Brandt, who led the platform team: a release path the Scheduling team could run without Platform; a platform engineer worked inside Scheduling for the first six weeks. Scheduling's median lead time 6 days after one quarter; company-wide under 7 three quarters after the brief; the eleven teams were not re-cut. | `problem_solution`: A chart without its conditions. → The conditions supplied, and the result. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents lower the cost of writing code on the far side of a team line but not the cost of agreeing what the interface should be, so the mirroring should persist where ownership and review sit.\n\n**Advances the thesis** (S2): Tests the chapter's mechanism against agents, with labeled claims.\n\n**Transition in:** `additional_support`: A mechanism shown on cases from 2021 to 2024. → Whether it holds when agents write part of the code.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | analysis | Emerging: in the teams the author has observed, agents write changes in code their team does not own more easily than people did, and those changes still wait for the owning team's review. | reasoning: Author's observation as of November 2026, labeled Emerging and not a measured result: the writing got cheaper, the agreement did not. |  |\n| p34 | claim | Speculative: if that holds widely, Conway's Law will describe the structure of ownership and review more than the structure of who writes the code, and weak interfaces will show as review queues at team lines. | reasoning: Labeled Speculative; it would be confirmed where organizations report that cross-team changes written by agents wait longer for the owner's review than changes written inside the owning team. The argument is taken up in [[where-the-constraint-moves]]. | `cause_effect`: Cheaper writing across a team line, unchanged agreement. → What that may do to where the law shows. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Chapter 1 said teams are components and chapter 2 said whom they are designed for; this chapter adds that the software takes the components' shape, so the two designs are one design, and that the link runs through skills and ownership and not through the chart.\n\n**So what:** The reader reviews a team change as an architecture change and an architecture change as a team change, and checks skills and ownership before announcing either.\n\n**Callback:** The customer who could have drawn Corvane's teams from its product. The reader can now say why the faults sat on the team lines, and what would have to move for a new chart to change the product.\n\n**Takeaway** (`course_of_action`): Before the next team change or architecture change, mark the team lines that the things users experience as one have to cross, and check skills and ownership for each new boundary. The checklist gives the questions.\n\n**Hand-off** to [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html): `problem_solution`: Team structure decides architecture, which leaves open how to choose the structure. → The rule for choosing: size ownership by cognitive load and cut along fracture planes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | synthesis (list) | Established: systems copy the communication structure of the organizations that design them, the argument for it is Conway's, a measured study supports it within stated limits, and every part of a system needs exactly one owning team. |  |  |\n| p36 | synthesis (list) | Depends on context: whether to move the teams, move the architecture or keep the mismatch depends on which side fits the product and on what can move; and how much a prediction of weak interfaces is worth depends on how often the thing crossing the line changes. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p37 | synthesis (list) | The author's synthesis: the sources supply the parts, and the claim that the maneuver fails when skills or ownership stay behind, like the reading of the law as a cost of communication, is the author's. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p38 | recommendation (list) | The checklist turns the chapter into eight checks to run on a planned team change or architecture change before it is announced. |  | `sequence`: What to take away. → What to do with it. |\n| p39 | transition | A customer could read Corvane's teams from its product, and the reader can now say why and can check whether a new chart will change that; what the law leaves open is how to choose the structure, which the next chapter answers with cognitive load and fracture planes. |  | `problem_solution`: Team structure decides architecture. → The open question of how to choose the structure. |\n\n## Non-goals\n\n- How much one team can own and where to draw a boundary: cognitive load and fracture planes See [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html).\n- The four team types and when each is justified See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- Interaction modes and the team API as a contract See [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html).\n- How to carry out a reorganization: staffing, communication, rollout See [[reorganizations]].\n- Who decides technical direction: architecture governance See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- Trust as a condition of a redesign See [The Organization as a System That Can Be Architected](the-organization-as-a-system.html), [[trust-conflict-and-psychological-safety]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The flow rubric noted that the trade-offs section carries three choices in one table paragraph and could give each choice its own paragraph; not done, to stay within the length. The author may want it expanded.\n- After round 2 the worked example no longer says that an old architecture reappeared at Corvane in 2023, because the ledger has no earlier release arrangement; if the author wants the thesis phrase shown at Corvane, the ledger needs a line on how releases worked before 2023.\n- The draft is about 4,950 words, above the 4,500 target and under the 5,000 cap; most of the excess came from clarifications asked for by the two check rounds.\n- The chapter reads Corvane's 2023 team change as an inverse maneuver that nobody named; the author should confirm that reading of the ledger.\n- The mirroring study is cited from the Harvard Business School working paper (08-039, revised 2011), which was read; the journal version (Research Policy) was not fetched and is not cited.\n\n## Decision log\n\n- **2026-11-19** — Conway (1968) was fetched and read at melconway.com for this chapter; it is a gap source and the text says it supplements the author's sources. Quotations are one sentence or less. Rejected: Citing the law only through Team Topologies\n- **2026-11-19** — One research finding beyond the two main sources is used, the mirroring study of MacCormack, Rusnak and Baldwin, read as Harvard Business School Working Paper 08-039 and labelled as a research finding with its stated limits. Rejected: Presenting the law as proven; Leaving the evidence out\n- **2026-11-19** — The chapter uses the journal spec's name, inverse Conway maneuver, and notes that Team Topologies calls it the reverse Conway maneuver; no claim is made about who coined either name. Rejected: Attributing the term to a source not read\n- **2026-11-19** — The conditions are skills and ownership, as the journal spec's thesis states; trust, which PLAN.md also mentions, is left to chapter 1's three conditions and named only as a non-goal. Rejected: A third condition in this chapter\n- **2026-11-19** — The failing case required by AC-2 is given twice: from Team Topologies (the joined-at-the-database monolith, missing ownership) and at Corvane (the 2023 teams, missing release skill and release ownership). Corvane's 2023 change is read as a maneuver nobody named, which the ledger allows: the teams were cut by headcount and no outcome was stated. Rejected: Inventing a new Corvane incident\n- **2026-11-19** — The cold-reader probe (mobile teams and backend teams split by database) is not used as an example in the text; the prediction table gives the general structures. Rejected: Using the probe case in the chapter\n- **2026-11-19** — Flow rubric run once (verdict: sound with notes). Applied: the paragraph on communication structure versus org chart moved to the end of its section, next to the prediction pattern; the three-outcomes paragraph now classifies Corvane's two faults; the flow rationale corrected for the first mistake and the trade-offs; the take-away separates what Team Topologies says about ownership from the author's claim. Not applied: one paragraph per trade-off choice. Rejected: A second run of the rubric\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 2 (REVISE), two local changes to the argument of the spec: (1) Corvane's 2023 change is no longer said to make an 'old architecture reappear', because the ledger records no release arrangement before 2023 for it to return to; the chapter says the architecture did not follow the chart, and the thesis wording 'the old architecture reappears' rests on the Team Topologies case of the shared database. (2) The second mistake keeps one form, ever finer splitting, tied to the skills condition; the relabelled reorganization was dropped because no honest link to the two conditions could be written. Units revised after round 2 were not re-checked by fresh readers (the author's rule of at most two rounds). Rejected: Appending a pre-2023 release arrangement to the ledger to save the wording; A third round\n- **2026-11-19** — After round 1 (REVISE; both flow readers went back at the definition of interface): 'interface' unqualified means the software interface in this chapter and is defined in the introduction; chapter 1's kind is called a team interface here. This reverses the first version's rule, which the thesis wording itself did not follow. Also after round 1: the queue example in the three-outcomes table no longer points forward to 2024; sizes in the worked example are given in engineers; the 2022 change is described as a maneuver that moved a boundary and no people; each Corvane change is tied to a trade-off choice. Rejected: Keeping chapter 1's sense for the unqualified word; Introducing 'seam' as a further term\n- **2026-11-19** — After round 3 (ESCALATE; one corroborated finding at fault in the spec): the worked example no longer classifies Corvane's three changes as choices from the trade-off table. Both round-3 readers could not tell whether 2024 was the second choice or the first completed late, because the conditions attach to the first choice and 2024 supplies them. The worked example now checks only the two conditions for each change; the trade-off section stands on its own. Local fix by the lead session in auto mode. Rejected: Keeping the classification with more explanation\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-engineering-executive/posts/conways-law and org-chart-problems — The author's working records of the Team Topologies material: the anti-patterns and the reading of the org chart.\n  - _research/scenario-ledger.md — Corvane stages 2 and 3: the Two Calendars, the Second Calendar, the 2022 fix, the hiring wave, the Launch Queue, the 2024 change brief.\n  - journal-spec.json, entry conways-law-and-the-inverse-conway-maneuver — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Melvin E. Conway, \"How Do Committees Invent?\", Datamation, April 1968 (read at melconway.com) — The law as stated; organizing as a design decision; the interface negotiated between design groups and the homomorphism; the compiler example; flexibility of organization. Gap source, fetched and read.\n  - Matthew Skelton and Manuel Pais, Team Topologies (2019); author's notes, _input/bookshelf/docs/notes/team-topologies.pdf — The reverse Conway maneuver; team assignments as the first draft of the architecture; organization design needs technical expertise; not all communication is good; exactly one owning team; the monolith kinds; skills as an input to team design.\n  - Alan MacCormack, John Rusnak and Carliss Baldwin, \"Exploring the Duality between Product and Organizational Architectures: A Test of the Mirroring Hypothesis\", Harvard Business School Working Paper 08-039 (revised 2011) — A measured test of mirroring on five matched pairs of software products, with the authors' stated limits. Gap source, fetched and read.\n\n## Changelog\n\n- **2026-11-19** — Worked example's p29 and p32 reworded to drop the trade-off classification after round 3; draft revised to match. Remaining round-3 findings recorded as waived under the author's 'waive by rule' decision.\n- **2026-11-19** — Changed after round 2 of the draft check: controlling ideas and evidence of the second anti-pattern paragraph and of the 2023 and 2024 worked-example paragraphs (decision log); no unit added, dropped or moved.\n- **2026-11-19** — Changed after round 1 of the draft check: the sense of interface (decision log), the evidence of the three-outcomes table and of the worked-example table, and the controlling ideas of the four worked-example paragraphs reworded; no unit added, dropped or moved.\n- **2026-11-19** — Accepted in auto mode after the flow rubric (sound with notes); one paragraph moved within where-teams-talk-least and four controlling ideas or rationales reworded.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>

        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
