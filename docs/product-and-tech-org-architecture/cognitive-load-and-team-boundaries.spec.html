<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Cognitive load and its kinds as Team Topologies uses them, and how to assess a team's load.\n- **Know:** Fracture planes: the differences in domain, rate of change, risk or technology along which a boundary can be drawn.\n- **Believe:** An overloaded team is helped by owning less or carrying less, not by more people.\n- **Be able to:** Assess whether a team owns too much or too little, with stated signals.\n- **Be able to:** Propose where to split a team's scope and say which fracture plane justifies it.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a description of a team and its scope, the reader says whether it is overloaded, names the signals, and proposes a split along a fracture plane. *Probe:* A team of seven owns checkout, the tax engine, fraud rules and the invoicing batch jobs; it has had four incidents this quarter, all in areas only one person understands. What would you do, and why not add two engineers? | `custom` | cold_reader | major |\n| AC-2 | The chapter states when a boundary should not be drawn although a fracture plane exists. | `custom` | rubric | major |\n| AC-3 | Cognitive load and fracture plane are defined before use and credited to Team Topologies; bounded context is credited to Evans. | `known_before_new` | rubric | major |\n\n## Thesis\n\n**Question:** How much can one team own, and where should the boundary between two teams go?\n\n> **Claim:** A team can own only what its members can change and operate without relying on one particular person's knowledge, so ownership is sized by cognitive load — the complexity of the domain plus the mechanics the team must also carry — and a boundary belongs on a fracture plane where the domain, the rate of change or the risk differs, and not where the headcount divides evenly.\n\n**Disputed by:** The practice of sizing teams by budget and assigning scope by the current backlog, on the assumption that capable engineers can own whatever they are given.\n\n**So what:** An overloaded team is relieved by removing scope or by moving mechanics to a platform, and a request for headcount is tested first against what the team already has to understand.\n\n**How and why:** Attention is the first scarce capacity: beyond a certain load a team stops understanding parts of what it owns, and those parts are changed slowly, by one person, or not at all. Two areas that use different domain language, change at different rates or carry different risk need little shared knowledge to cooperate, so the interface between them can stay narrow; a cut through an area that changes together forces both sides to understand both halves.\n\n**Supporting claims**\n\n- **S1** — A team owns a thing only when its members can change and operate it without relying on one particular person, and cognitive load — the complexity of the domain plus the mechanics the team must also carry — limits how much it can own in that sense.\n- **S2** — Whether a team owns too much or too little can be assessed from stated signals: single-person knowledge, rising lead time for the team's other work, areas nobody changes, and the team's own answer.\n- **S3** — An overloaded team is relieved by removing scope or by moving mechanics to a platform; adding people leaves what each member must understand unchanged and raises coordination.\n- **S4** — A boundary belongs on a fracture plane, where the domain, the rate of change or the risk differs, because areas that differ in those ways need little shared knowledge to cooperate; a cut by headcount runs through areas that change together.\n- **S5** — A fracture plane permits a boundary and does not require one: the cut is not made when most changes would cross it, when a resulting team could not operate its part, or when nobody's load would fall.\n\n## Role in the part\n\nGives the sizing rule for a component and the rule for placing boundaries, which Part II turns into team types and sizes. Supports P1-3 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in cognitive-load before assess-the-load and relieve-the-load; fracture-planes before test-the-cut: each supplies the terms the next uses)\n\nThe scene shows two decisions that used headcount as the measure and leaves two questions, how much and where. The chapter answers them in that order because the second arises from the first: the remedy for too much is to remove scope, and removing scope requires a place to cut. Within each answer the concept comes before the pattern that uses it. If fracture planes came first the reader would learn where to cut before knowing why any cut was needed, and the planes' justification, which rests on what each side must understand, would have no term to rest on. The anti-patterns follow both answers because each misuses one of them, the worked example uses every term and closes the 2023 cut on which the scene ended, and the AI section is a coda after it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Late in 2022 the manager of Corvane's Core team asked for two more engineers. Core had six, and earlier that year it had taken on the rule engine on top of the shared services it already ran. The request was granted. A quarter after the two engineers joined, Core's lead time for its other work was a day longer than before.\n\n**Bridge:** Most readers have approved or asked for headcount for a struggling team and seen the team struggle on. → If more people did not help, the shortage was not of people; it was of what the team could understand, and that has its own sizing rule and its own rule for where to cut.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A team can own only what its members can change and operate without relying on one particular person. Ownership is therefore sized by cognitive load, the complexity of the domain plus the mechanics the team must also carry, and a boundary belongs on a fracture plane, where the domain, the rate of change or the risk differs, and not where the headcount divides evenly.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a team given more people for a problem of scope, and a company cut into teams by headcount. *Kept in:* core-and-the-request.\n- Define cognitive load and its three kinds, and the test for what a team owns. *Kept in:* cognitive-load.\n- Assess whether a team owns too much or too little from stated signals. *Kept in:* assess-the-load.\n- Relieve an overloaded team by removing scope or mechanics, and see why people do not relieve it. *Kept in:* relieve-the-load.\n- Define fracture planes and place a boundary on one. *Kept in:* fracture-planes.\n- Test a cut before making it, and know when not to make it. *Kept in:* test-the-cut.\n- Recognize the usual ways sizing and cutting go wrong. *Kept in:* anti-patterns.\n- Follow Corvane re-cutting two of its teams, and see what AI changes about the sizing rule. *Kept in:* recutting-scheduling-and-dispatch, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane's Core team asked for two more engineers after taking on the rule engine, got them, and was no faster a quarter later. | scenario: Corvane, late 2022, about 45 engineers: Core has six engineers and owns the rule engine since the 2022 fix on top of its shared services; its manager asks for two engineers; they join in January 2023; a quarter later Core's median lead time for work outside the rule engine is 12 days, against 11 before they joined. |  |\n| p02 | claim | What a team can own is sized by cognitive load and not by headcount, and a boundary between two teams belongs on a fracture plane; the chapter takes the two questions in that order. |  | `problem_solution`: A team that got more people and did not get faster. → The sizing rule and the placing rule that explain it, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Six Engineers and a Request for Two More\n\n**Controlling idea** (`example`, id `core-and-the-request`): Twice in two years Corvane used headcount as the measure of what a team could own, once to relieve a team and once to cut eleven, and both times the measure missed what the teams had to understand.\n\n**Advances the thesis** (S3, S4): Gives the two cases the chapter explains: people added to an overloaded team, and a boundary placed by dividing people evenly.\n\n**Transition in:** `elaboration`: The lead's short account of the request for two engineers. → What Core owned, what was observed, and what Corvane did next.\n\n**Order of paragraphs** (`chronological`): The request, the remedy and the later cut are told in the order they happened so the reader sees the same assumption applied twice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In late 2022 Core, six engineers, owned three shared services and their deployment scripts, and since that year's fix the rule engine as well. | scenario: Corvane, the fictional company this book follows, late 2022, about 45 engineers at the start of its hiring wave. Core owns accounts and sign-in, notification delivery, the shared data model for customers and jobs, its own deployment scripts, and the rule engine for scheduling and job-status rules that the 2022 fix moved into it. |  |\n| p04 | description | The signs were that one engineer alone could change part of the rule engine and that Core's lead time for everything else had nearly tripled. | scenario: Samir Haddad, a staff engineer, was the only person who could safely change the rule engine's overlap logic (whether two jobs for one technician conflict); Core's median lead time for work outside the rule engine rose from 4 days to 11. | `cause_effect`: The scope Core owned. → What that scope did to the team's work. |\n| p05 | description | Corvane gave Core two more engineers, and a quarter later the lead time was 12 days, because the new engineers had to learn the scope from the person who was already the constraint. | scenario: Two engineers joined Core in January 2023; a quarter later the median lead time for other work was 12 days; Samir Haddad spent much of that quarter explaining the rule engine. | `time`: The signs of trouble. → The remedy chosen and its result. |\n| p06 | description | In 2023 Corvane cut itself into eleven product teams by dividing people evenly; Core's shared services went to new teams, and the cut ran through the middle of the rule engine. | scenario: 2023: eleven product teams of about eight. Core was dissolved: accounts and sign-in went to Identity, notification delivery to Notifications, the shared data model and the deployment scripts to the platform team formed in 2022. The rule engine was divided: Scheduling got the scheduling rules, the planner calendar screens and travel-time estimation (a separate service built on map data and a routing library); Dispatch got the job-status rules and the live dispatch board. In the first half of 2024, 23 of 31 rule changes needed both teams. | `time`: Core in early 2023. → The reorganization of 2023 and where its lines fell. |\n| p07 | analysis | Both decisions measured ownership in people, and neither asked what a team would have to understand, which leaves two questions: how much one team can own, and where the line between two teams should go. |  | `similarity`: Two decisions a year apart. → What they have in common and the two questions they leave open. |\n\n### Cognitive Load: What One Team Can Hold\n\n**Controlling idea** (`definition`, id `cognitive-load`): What a team can own is limited by its cognitive load, the mental effort of understanding the domain plus the mechanics it carries, and the test of ownership is that the team can change and operate a thing without relying on one particular person.\n\n**Advances the thesis** (S1): Defines the sizing rule: the term, its kinds, the ownership test and the limit of the concept.\n\n**Transition in:** `problem_solution`: The first open question: how much one team can own. → The concept that answers it.\n\n**Order of paragraphs** (`prerequisite_order`): The term is defined before its kinds, the kinds before the ownership test, which applies to the sum of the first two kinds, and the test before the account of what happens when a team fails it; the rule of thumb and the limit of the concept come last because they qualify a rule the reader must already hold, and placed earlier they would qualify a term not yet defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Cognitive load, as Team Topologies uses the term, is the total mental effort a team needs to understand, change and operate what it owns; the book treats it as the thing to restrict when sizing a team's responsibilities, and in this book's terms it is how the scarce capacity of attention shows up for one team. | source: Skelton and Pais argue for putting the team first and restricting its cognitive load, and say that thinking explicitly about cognitive load is a tool for deciding team size, assigning responsibilities and setting boundaries with other teams. The term comes from John Sweller's research on learning; Sweller is cited only for the origin and supplements the author's sources. |  |\n| p09 | definition (table) | Team Topologies distinguishes three kinds of load — intrinsic, extraneous and germane — and this book reads them as the complexity of the domain, the mechanics the team must also carry, and the learning that makes the team better at its domain. | table: Kind \\| What it is \\| At Core in 2022 \\| What to do with it. Intrinsic \\| the complexity of the domain itself \\| the scheduling and job-status rules \\| accept it and size the scope to it. Extraneous \\| mechanics around the work: release steps, tooling, process, hand-offs \\| Core's own deployment scripts \\| remove it or move it to a platform. Germane \\| learning the domain and solving its problems \\| understanding why planners double-book \\| protect it. | `elaboration`: Cognitive load as one quantity. → Its three kinds and what to do with each. |\n| p10 | claim | A team owns a thing only when its members can change it and operate it without relying on one particular person. | source: Team Topologies: every part of the system is owned by exactly one team, with no shared ownership.; reasoning: A thing only one person can change is owned by that person and not by the team: it cannot be changed when that person is away and is not operated by the people on call. | `cause_effect`: Load as domain complexity plus mechanics, with a limit. → The test of ownership that follows from the limit. |\n| p11 | explanation | Past its limit a team stops understanding parts of what it owns, and those parts are changed slowly, by one person, or not at all. | quotation: \"If we stress the team by giving it responsibility for part of the system that is beyond its cognitive load capacity, it ceases to act like a high-performing unit and starts to behave like a loosely associated group of individuals, each trying to accomplish their individual tasks without the space to consider if those are in the team's best interest.\" | `cause_effect`: The ownership test. → What happens when a team is given more than passes it. |\n| p12 | explanation | Team Topologies offers a rule of thumb for how much is too much: classify each domain as simple, complicated or complex, and give a team at most one complex domain and not several complicated ones. | source: The authors' heuristic, as the author's Team-First Thinking checklist records it: classify domains as simple, complicated or complex; do not assign a complex domain plus additional domains to one team; avoid giving one team several complicated domains. | `additional_support`: What overload does. → A rule of thumb for staying short of it. |\n| p13 | counterargument | Cognitive load cannot be measured, only assessed: the source's own method is to ask the team, and applying a concept from individual learning to a whole team is a working idea and not an established measure. | quotation: \"A simple and quick way to assess cognitive load is to ask the team, in a non-judgmental way: 'Do you feel like you're effective and able to respond in a timely fashion to the work you are asked to do?'\" | `contrast`: A rule of thumb that sounds like a calculation. → The limit: there is no number, and where the evidence runs out. |\n\n### Pattern: Assess a Team's Load from What It Owns\n\n**Controlling idea** (`process`, id `assess-the-load`): A team's load is assessed by listing what it owns, asking of each area who can change it and who can operate it, and reading four signals of too much and three of too little.\n\n**Advances the thesis** (S2): Turns the ownership test into a procedure with stated signals, for overload and for underload.\n\n**Transition in:** `problem_solution`: A load that can only be assessed. → A way to assess it that does not depend on opinion alone.\n\n**Order of paragraphs** (`prerequisite_order`): The procedure comes first because the signals are read from the list it produces; the signals come before Core's list so the reader can read that list without help, and the list comes before its reading so the example is shown before it is judged; underload comes last because it is read from the same list by the opposite signs, and placed first it would describe the rarer case before the common one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | process | The assessment is an ownership list with a count: for each area the team owns, how many members can change it safely and how many can operate it; its user is the team's lead and the leader who assigns its scope, and its outcome measure is the number of areas where either count is below two. | reasoning: The author's procedure, built on the ownership test: an area with a count of one is owned by a person; a count of zero is owned by nobody. |  |\n| p15 | evidence (table) | Four signals say that a team owns too much. | table: Signal \\| What you see \\| What it tells you. Single-person knowledge \\| an area only one member can change or operate \\| the team does not own it; the person does. Lead time rising for the team's other work \\| older areas wait while the newest takes the attention \\| scope was added without anything being removed. Areas nobody changes \\| requests in one area are postponed or worked around \\| the team has stopped understanding it. The team's own answer \\| the team says it cannot respond in time \\| the source's direct question, answered. | `elaboration`: The count. → The signals that go with it, and what each one means. |\n| p16 | example (table) | The ownership list for Core in late 2022 has five areas, each with its kind and its two counts. | table: Area \\| Kind \\| Can change it \\| Can operate it. Rule engine \\| complex \\| 1 (overlap logic), 3 (the rest) \\| 3. Accounts and sign-in \\| complicated \\| 2 \\| 4. Notification delivery \\| complicated \\| 3 \\| 4. Shared data model \\| complicated \\| 2 \\| 3. Deployment scripts \\| mechanics \\| 1 \\| 2. | `example`: The signals in general. → The signals read off one team. |\n| p16a | analysis | Core's list shows one complex domain, three complicated ones and a set of mechanics, with two areas that one person alone could change, so Core broke the rule of thumb and failed the ownership test twice. |  | `cause_effect`: The list. → What it shows. |\n| p17 | explanation | A team can also own too little, and the signs are the reverse: most of its changes need another team, it cannot staff its own on-call rotation, or it fills its time with work nobody asked for. | reasoning: The author's experience, marked as such: Team Topologies' checklists warn about overload; the three signs of underload are not from the source. | `contrast`: Too much. → Too little, by the opposite signs. |\n\n### Pattern: Relieve the Load by Removing Scope or Mechanics\n\n**Controlling idea** (`recommendation`, id `relieve-the-load`): An overloaded team is relieved by owning less or carrying less, and a request for headcount is first tested against what the new people would have to understand.\n\n**Advances the thesis** (S3): Argues the chapter's belief: people do not relieve overload, removing scope or mechanics does, and states when adding people is right.\n\n**Transition in:** `problem_solution`: A team assessed as overloaded. → What relieves it, starting with why the usual remedy does not.\n\n**Order of paragraphs** (`problem_solution`): Why the obvious remedy fails comes first, so that the pattern arrives as the alternative; the comparison of the three remedies follows the pattern, and the caveat about platforms comes last because it qualifies one of the remedies.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | explanation | Adding people to an overloaded team does not lower what each member must understand, and it adds teaching and coordination to the people who are already the constraint. | reasoning: Scope is not divided by headcount: on call, in review and in design each member still meets the whole of it. New members learn from those who know, as Core's two engineers did from Samir Haddad.; source: Team Topologies treats a team as small, about five to nine people by the authors' rule of thumb, so a team cannot grow its way out of a scope that is too large. |  |\n| p19 | recommendation | The pattern is to take something away: move a domain to another team, or move mechanics to a platform; its user is the overloaded team, and its outcome measures are the count of single-person areas and the lead time for the team's other work. |  | `problem_solution`: A remedy that does not work. → The two that do, with user and measure. |\n| p20 | comparison (table) | The three remedies change different things, and adding people is the right one only when the team understands all it owns and has more work than hands. | table: Remedy \\| What it changes \\| What it costs \\| Right when. Remove scope \\| what the team must understand \\| a new boundary and an interface to own \\| the team holds a complex domain plus others, or unrelated domains. Move mechanics to a platform \\| what the team must carry besides its domain \\| a dependency on the platform \\| the load is release steps, tooling or infrastructure that several teams repeat. Add people \\| hands, not understanding \\| onboarding, more coordination \\| every area passes the ownership test and the work still exceeds the team. | `elaboration`: Two remedies recommended and one rejected. → What each changes, what it costs and when it fits. |\n| p21 | counterargument | Moving mechanics to a platform relieves a team only when the platform is self-service; otherwise the team exchanges load for a queue, as Corvane found in 2024. | scenario: Corvane formed a platform team in 2022, and Core's deployment scripts went to it in 2023. 2024, 180 people: five platform engineers for eleven product teams, 14 open launch requests at the peak, lead time for a change 19 days. | `contrast`: The platform as a remedy. → The condition under which it is one. |\n\n### Fracture Planes: Where a Boundary Can Go\n\n**Controlling idea** (`definition`, id `fracture-planes`): A boundary belongs on a fracture plane, a seam where the domain, the rate of change or the risk differs (technology is a fourth and weaker plane), because two areas that differ in those ways need little shared knowledge and the interface between them can stay narrow.\n\n**Advances the thesis** (S4): Defines the placing rule, gives its reasoning, and contrasts it with Corvane's cut by headcount.\n\n**Transition in:** `problem_solution`: Removing scope means cutting it somewhere, the second open question. → The rule for where.\n\n**Order of paragraphs** (`prerequisite_order`): The definition comes before the reasoning, the reasoning before the first plane and its origin in bounded contexts, the four planes together after one has been understood, and the headcount cut last so the reader can judge it with the planes in hand.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | Removing scope means cutting it somewhere, and Team Topologies names the place: a fracture plane, a natural seam along which a system can be split easily, which this chapter applies to the scope a team owns. | quotation: \"A fracture plane is a natural seam in the software system that allows the system to be split easily into two or more parts.\" |  |\n| p23 | explanation | A seam is natural where the two sides need little knowledge of each other, so that the interface between them stays narrow and each side's load stays low; a cut through an area that changes together forces both sides to understand both halves. |  | `cause_effect`: The definition. → Why some lines split easily and others do not. |\n| p24 | definition | The first plane to look for is the business domain, and Evans's bounded context names it: the part of the business within which one model and one vocabulary apply. | source: Eric Evans, Domain-Driven Design (2003): a bounded context is the boundary within which a particular domain model, and the language that goes with it, applies consistently. Cited as the widely known concept; it supplements the author's sources. Team Topologies puts the bounded context first among its fracture planes. | `example`: Seams in general. → The strongest kind, with its source. |\n| p25 | comparison (table) | Four planes do most of the work: domain, rate of change, risk and technology, and technology is the weakest. | table: Plane \\| What differs \\| Question to ask \\| At Corvane. Domain \\| vocabulary, model and rules \\| do the two sides use the same words for the same things? \\| scheduling rules and billing exports. Rate of change \\| how often each side changes \\| does one side wait for the other's pace? \\| planner screens several times a week; each rule change waits for a weekly review. Risk \\| what an error costs \\| would a mistake on one side be contained? \\| a wrong rule alters every customer's schedule. Technology \\| skills and tools \\| is the difference a real constraint? \\| the technicians' mobile app and the office web application. Team Topologies also lists regulatory compliance, performance isolation, team location and user personas. | `additional_support`: One plane. → The four the chapter uses, each with its question. |\n| p26 | example (figure) | Headcount is not a plane: Corvane's 2023 cut put half of the rule engine in each of two teams, and most rule changes then needed both. | figure: Mermaid flowchart: Scheduling (scheduling rules, planner calendar, travel-time estimation) and Dispatch (job-status rules, live dispatch board), with an edge between the two rule sets labelled '23 of 31 rule changes need both teams'. | `contrast`: Lines placed where the work differs. → A line placed where the people divided evenly. |\n\n### Pattern: Test a Cut, and Know When Not to Make It\n\n**Controlling idea** (`process`, id `test-the-cut`): A proposed boundary is tested against the record of past changes before it is made, and it is not made, even on a real fracture plane, when most changes would cross it, when a resulting team could not operate its part, when nobody's load would fall, or when the two sides would stay coupled underneath.\n\n**Advances the thesis** (S5): Gives the test for a cut and the conditions under which a fracture plane is not enough.\n\n**Transition in:** `sequence`: Planes on which a boundary can go. → How to check a particular boundary before making it, and when to leave it undrawn.\n\n**Order of paragraphs** (`prerequisite_order`): The test comes first because it supplies the count the later paragraphs use; the cost of a boundary comes before the four cases so that they read as instances of one rule and not as a list explained afterwards.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | process | The test is to take the last quarter's changes and count how many would have needed both sides of the proposed line; its user is the two teams the line would create and the teams that depend on them, and its outcome measure is that share, before and after. | quotation: \"Does the resulting architecture support more autonomous teams (less dependent teams) with reduced cognitive load (less disparate responsibilities)?\" |  |\n| p29 | explanation | Every boundary replaces shared understanding with an interface that someone has to own, so a cut is worth making only when the load it removes is larger than the interface it adds. | reasoning: From the chapter on the organization as a system: an interface is a lever only when it has an owner; an unowned one is a failure pattern. | `contrast`: A cut that passes the test. → What every cut costs, even one that passes. |\n| p28 | analysis (list) | A fracture plane therefore says where a boundary may go, not that it must, and there are four cases in which the boundary should not be drawn. | reasoning: Four cases, as a list: most changes would cross the line; a resulting team would be too small or lack the skills to run and be on call for its part; no team is overloaded, so the cut buys nothing; the two sides would still share a database, a build or a release, which Team Topologies calls hidden monoliths. | `cause_effect`: The cost of a boundary. → The four cases in which the cost is not repaid, even on a real plane. |\n\n### Anti-Patterns: The Capable Team and the Even Split\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Sizing and cutting fail in three recognizable ways: scope is added to a team because it copes, lines are drawn by budget and backlog, and the one person who knows everything is treated as a strength.\n\n**Advances the thesis** (S3, S4): Names the failures the sizing rule and the placing rule prevent, and answers the view the thesis disputes.\n\n**Transition in:** `contrast`: The patterns used well. → What is commonly done instead.\n\n**Order of paragraphs** (`grouping`): The first two anti-patterns misuse the sizing rule and the placing rule in the order the chapter gave the rules; the third comes last because it is the habit that hides the other two, and would mean nothing before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | analysis | The Overloaded Team is made by a compliment: scope is given to the team that copes, on the assumption that capable engineers can own whatever they are given. | reasoning: Capability raises how fast a team learns a domain; it does not remove the limit on how many domains its members can hold at once. Core was given the rule engine in 2022 because it was Corvane's most capable team. |  |\n| p31 | analysis | The Org Chart as Architecture, in this chapter's form, is the even split: the budget sets the size of the teams and the current backlog sets their scope. | reasoning: A backlog describes the next two quarters; a domain outlasts them. Teams drawn around the backlog of 2023 own whatever that backlog happened to contain. Layer teams, one per technology, are the same error with a different divider. | `additional_support`: Scope added to one team. → Scope divided among many. |\n| p32 | analysis | The Hero Culture hides both: the engineer who is the only one able to change something is praised, when that engineer is the clearest sign that the team owns more than it can hold. |  | `additional_support`: Two errors in assigning scope. → The habit that keeps them from being seen. |\n\n### Worked Example: Re-Cutting Scheduling and Dispatch\n\n**Controlling idea** (`example`, id `recutting-scheduling-and-dispatch`): In 2025 Corvane assessed its Scheduling and Dispatch teams, moved one boundary onto a fracture plane, removed scope from one team and left one possible boundary undrawn, and the share of rule changes that needed two teams fell without any added headcount.\n\n**Advances the thesis** (S2, S4, S5): Applies the assessment, the planes and the test, including a boundary not drawn, to the case the scene opened.\n\n**Transition in:** `example`: The rules, the patterns and their failures. → All of them applied to the two teams from the scene.\n\n**Order of paragraphs** (`chronological`): Assessment, decisions, the new boundary and the result are given in the order they happened; the table of findings comes before any judgement of them, and the result comes last so the section ends on what the change achieved and what it cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | description (table) | In 2025 Dario Vance, Corvane's VP Engineering, asked Samir Haddad to run the assessment on Scheduling and Dispatch, the two teams of eight that shared the rule engine. | table: Area \\| Owned by since 2023 \\| Kind \\| Can change it \\| Finding. Scheduling rules \\| Scheduling \\| complex \\| 2 \\| 23 of 31 rule changes in the first half of 2024 needed both teams. Job-status rules \\| Dispatch \\| complex \\| 1 \\| the same 23 of 31. Travel-time estimation \\| Scheduling \\| complicated \\| 2 \\| 9 of its 11 changes also changed a scheduling rule. Planner calendar screens \\| Scheduling \\| complicated \\| 4 \\| changed several times a week; 3 of 120 changes needed a rule change. Live dispatch board \\| Dispatch \\| complicated \\| 5 \\| changed several times a week. |  |\n| p34 | analysis | The list showed one domain held by two teams and one team holding a complex domain plus two others. |  | `cause_effect`: The findings. → What they say in the chapter's terms. |\n| p35 | example (table) | Corvane made three decisions: the whole rule engine went to Scheduling, the planner calendar screens went from Scheduling to Dispatch, and travel-time estimation was not split off although a technology plane ran around it. | table: Decision \\| Plane or reason \\| Measure. Job-status rules move to Scheduling, which owns the whole rule engine \\| domain: one vocabulary, changing together \\| share of rule changes needing two teams. Planner calendar screens move to Dispatch \\| rate of change and risk: screens change several times a week and an error is visible and reversible; a rule change waits for the weekly review, and a rule error alters every customer's schedule \\| Scheduling's median lead time for a rule change. Travel-time estimation stays inside Scheduling \\| no boundary, although its technology differs (map data and a routing library): 9 of 11 changes cross the line, and two engineers cannot carry an on-call rotation \\| none; revisit when either count changes. | `problem_solution`: Two faults. → Three decisions, each with its reason and its measure. |\n| p37 | evidence (figure) | Drawn after the change, the boundary runs between the rules and the planner's screens, with the versioned rule schema as the interface across it. | figure: Mermaid flowchart: Scheduling (rule engine: scheduling and job-status rules; travel-time estimation) and Dispatch (planner calendar screens; live dispatch board), joined by an edge labelled 'versioned rule schema'. | `elaboration`: Three decisions in a table. → The resulting boundary as a picture. |\n| p36 | analysis | Two quarters later 3 of 28 rule changes needed two teams, against 23 of 31 before, four engineers could change the job-status rules where one could before, and Scheduling's lead time for a rule change had fallen from 9 days to 5, with no engineer added; the cost was a quarter in which both teams shipped less. | scenario: Corvane, 2025: 3 of 28 rule changes needed both teams, against 23 of 31; four engineers able to change the job-status rules, against one; Scheduling's median lead time for a rule change from 9 days to 5; no headcount added; both teams' output fell for one quarter while Dispatch learned the calendar screens; the other nine product teams were not re-cut. | `cause_effect`: The new boundary. → Its measured result and its cost. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents lower the effort of writing a change in an unfamiliar area and leave the ownership test as it is, and whether they let a team own more is not yet known.\n\n**Advances the thesis** (S1): Tests the sizing rule against AI with labeled claims and defers the evidence to Part XI.\n\n**Transition in:** `additional_support`: A sizing rule shown at work in 2025. → Whether the rule holds when agents write part of the code.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The observation about what agents do today comes before the reasoning about what may follow, because the speculative claim is about a change to the test the first paragraph says is unchanged.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | analysis | Emerging: agents make it cheaper to produce a change in code a team does not know well, but the team still has to understand what it owns well enough to review the change, operate it and answer for it, so the ownership test is unchanged. | reasoning: The author's observation as of November 2026, labeled Emerging, not a measured result; the paragraph opens by announcing the book's three AI labels. |  |\n| p39 | claim | Speculative: agents may pull a team's load in two directions, down by explaining unfamiliar code and absorbing mechanics, and up by producing more change than the team can understand, and which pull is stronger would show in the count of single-person areas as scope grows. | reasoning: Labeled Speculative; the evidence is weighed in the chapters Where the Constraint Moves and Team Shape and Roles with AI. | `cause_effect`: An unchanged test. → What may change about how much passes it, and what would confirm it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The sizing rule and the placing rule are one rule seen from two sides: a team's scope is right when the team passes the ownership test, and a boundary is right when it lets the teams on both sides pass it with a narrow interface between them; headcount enters only after both are settled.\n\n**So what:** A leader who receives a request for headcount, or a proposal for a reorganization, can ask first what the team would have to understand and what share of changes would cross the proposed lines, and can decline both people and boundaries that the answers do not support.\n\n**Callback:** Core's request for two more engineers in late 2022. The reader can now say what the request left out: two areas only one person could change, a complex domain added on top of three complicated ones, and nothing taken away.\n\n**Takeaway** (`course_of_action`): Take one team that has asked for people, write its ownership list with the two counts, and decide what to remove before deciding whom to hire. The checklist gives the steps.\n\n**Hand-off** to [Flow and the Constraint](flow-and-the-constraint.html): `sequence`: Components with a sizing rule and boundaries with a placing rule. → Work moving across those boundaries, and the one place where it waits longest.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | synthesis (list) | Established: a team has a limit on what it can understand, exceeding it turns the team into individuals, every part of a system needs exactly one owning team, and systems split most easily along natural seams, the business domain first. |  |  |\n| p41 | synthesis (list) | Depends on context: which remedy fits an overloaded team, which plane to cut on, and whether to cut at all depend on what the load consists of, on how the changes fall and on whether the resulting teams can operate what they get. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p42 | synthesis (list) | The author's synthesis: the ownership test with its two counts, the count of changes that cross a proposed line, the signs of underload, and the reading of cognitive load as the capacity of attention seen in one team are this book's own. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p43 | recommendation (list) | Eight checks let the reader size one team's scope and test one boundary; the sizing rule and the placing rule, which the chapter joined at the fracture plane where each side's load stays low, are one rule seen from two sides. |  | `sequence`: What to take away. → What to do with it. |\n| p44 | transition | Components now have a sizing rule and boundaries a placing rule, which leaves the work that moves across those boundaries and the one place where it waits longest, the subject of the next chapter. |  | `sequence`: Core's request, read again with the two rules. → Work moving across the boundaries, and where it waits. |\n\n## Non-goals\n\n- The three scarce capacities in full, and finding the constraint in a flow See [Flow and the Constraint](flow-and-the-constraint.html).\n- Conway's Law and why team structure shapes the software See [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html).\n- The four team types, including platform and complicated-subsystem teams See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- Team size, composition and Dunbar-style limits See [Team Size and Composition](team-size-and-composition.html).\n- Interaction modes and team APIs across a boundary See [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html).\n- How to build and run a self-service platform See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- Strategic design in Domain-Driven Design beyond the bounded context (context maps, subdomain types) See Evans, Domain-Driven Design.\n- Evidence on AI and team scope See [[where-the-constraint-moves]], [[team-shape-and-roles-with-ai]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The chapter invents Corvane facts beyond the ledger (Core's scope and lead times in 2022–2023, the division of the rule engine in 2023, the 2025 re-cut and its counts). They are appended to the ledger; the author should confirm they suit the chapters on team types and reorganizations.\n- The 2025 re-cut makes Scheduling the owner of a rule engine that three applications consume, which Part II may want to name a complicated-subsystem team; this chapter does not name the type.\n- Sweller (1988) and Evans (2003) are cited from general knowledge for the origin of a term and a widely known concept; neither is in the author's Kindle notes.\n- The definitions of simple, complicated and complex domains are paraphrased from Team Topologies as the author's checklist records the classification; the Kindle notes do not contain the passage.\n- Round 2 ended REVISE with one blocking finding (the capacities used as known terms in the first paragraph of the cognitive-load section) and five minor ones. All six units were revised afterwards and not re-checked; no waiver is recorded. The author decides whether to waive them or run a third check.\n\n## Decision log\n\n- **2026-11-19** — Open with Core's request for two engineers (late 2022) and not with <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
