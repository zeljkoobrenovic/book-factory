not used as an example on the page, the reader names a pattern from the catalogue and the element it traces to. *Probe:* Every launch at a company needs sign-off from a security team of four, and launches wait a median of three weeks. Which pattern is this, and which designable element is at fault? | `custom` | cold_reader | major |\n| AC-2 | Every pattern entry names at least one chapter that addresses it, and no pattern is presented as a failing of individuals. | `custom` | rubric | major |\n| AC-3 | Patterns drawn from a named source (Build What Matters' dysfunctions, Lencioni's dysfunctions, Larson's team states) credit that source. | `evidence_is_explained` | rubric | major |\n\n## Thesis\n\n**Question:** Why do the same failures recur across product and tech organizations, and what does each one trace back to?\n\n> **Claim:** The same failures recur because the same structural situation draws the same behaviour from different people: the twelve patterns fall into four families, one for each designable element — boundaries, interfaces, decision rights and incentives — and each began as a choice about that element that made sense locally and was then left in place.\n\n**Disputed by:** The view that organizational failure comes from weak leaders or poor hires, and that the remedy is to replace them.\n\n**So what:** A leader who can name the pattern looks at the element that produces it and changes that, instead of changing the people caught in it and meeting the same failure with their successors.\n\n**How and why:** The same structural situation produces the same behaviour in different people: a team asked to approve every change becomes a queue, a team measured on output ships features nobody uses. Because the starting choice was reasonable, nobody revisits it until the cost is large.\n\n**Supporting claims**\n\n- **S1** — A failure recurs because a reasonable choice about a lever, left in place, draws the same sensible behavior from whoever holds the role, so every pattern is described as a situation and not as a failing of people.\n- **S2** — Three patterns trace to boundaries drawn by something other than the work: the Org Chart as Architecture, the Overloaded Team and the Reorg as Strategy.\n- **S3** — Three patterns trace to interfaces: one built as a gate (the Review Bottleneck), one built without its users (the Platform Nobody Asked For) and one never built (the Unowned Interface).\n- **S4** — Three patterns trace to decision rights that put a decision away from its information: the Feature Factory, the Escalation Ladder and the Consensus Stall.\n- **S5** — Three patterns trace to incentives that reward something easier to see than the result: the Output Scoreboard, the Ladder as Checklist and the Hero Culture.\n- **S6** — Naming the pattern points to the lever to change, and changing the lever works where changing the people does not.\n\n## Role in the part\n\nGives the reader a diagnostic vocabulary and shows, pattern by pattern, that failures have structural causes. Supports PF-2 of part `preface`.\n\n## Flow\n\n**Pattern:** `grouping` (also `prerequisite_order` in how-to-read before the four families: it defines the levers and capacities every entry uses; `assertion_evidence_reasoning` in at-a-glance after the four families: the table and its use come after the entries they summarize)\n\nThe catalogue is grouped by the four levers, in the order the book always lists them: boundaries, interfaces, decision rights, incentives. That order is also a dependency: a boundary decides what teams exist, an interface connects teams that exist, a decision right says who decides about what crosses, and an incentive decides whether people have reason to use any of the three. The reading guide comes before the families because every entry uses 'lever' and the three capacities; the single table comes after them because its rows are names the reader has to have met. Putting the table first would make it a list of unexplained names, and ordering the patterns by how common they are would separate patterns that share a lever and hide the thesis that there are four roots, not twelve.\n\n## Introduction\n\n**Hook** (`provocative_quotation`): \"Happy families are all alike; every unhappy family is unhappy in its own way.\" Build What Matters quotes Tolstoy's sentence before its list of product dysfunctions, and then describes the same ten in company after company. Organizations, unlike Tolstoy's families, are unhappy in a few shared ways.\n\n**Bridge:** Most readers have watched a struggling team get a new leader, or a slow organization get a new chart, and then watched the same trouble return. → If the same trouble appears in different companies and under different people, its cause is something those companies have in common, and what they have in common is structure.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): The same failures recur because the same structural situation draws the same behavior from different people: the twelve patterns fall into four families, one for each lever a leader can design — boundaries, interfaces, decision rights and incentives — and each began as a choice about that lever that made sense locally and was then left in place.\n\n**Roadmap** (IN THIS CHAPTER callout and the third lead paragraph (p03)):\n\n- Learn how to read an entry: the four levers, the three capacities and the mechanism every pattern shares. *Kept in:* how-to-read.\n- Meet the three boundary patterns. *Kept in:* boundary-patterns.\n- Meet the three interface patterns. *Kept in:* interface-patterns.\n- Meet the three decision-right patterns. *Kept in:* decision-right-patterns.\n- Meet the three incentive patterns. *Kept in:* incentive-patterns.\n- Get all twelve in one table and see it used on one incident. *Kept in:* at-a-glance.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Tolstoy's claim that every unhappy family is unhappy in its own way does not hold for organizations: the authors who quote it before their list of product dysfunctions go on to describe the same ten in company after company. | quotation: \"Happy families are all alike; every unhappy family is unhappy in its own way.\" (Tolstoy, Anna Karenina), quoted in Build What Matters at the head of its ten dysfunctions of product management. |  |\n| p02 | claim | The same failures recur because the same structural situation draws the same behavior from different people: each of the twelve patterns began as a sensible choice about a boundary, an interface, a decision right or an incentive, and was then left in place. |  | `cause_effect`: A short list of failures shared across companies, and the previous page's structures added one at a time, each with a cost. → Why the list is short, for this page's twelve patterns as for that source's ten: the costs are produced by structure, and the structure is the same everywhere. |\n| p03 | transition | The page first says how to read an entry, then gives the twelve patterns in four families in the order boundaries, interfaces, decision rights, incentives, and ends with one table of all twelve. |  | `sequence`: The claim that twelve patterns trace to four designable elements. → The route through the catalogue. |\n\n## Sections\n\n### How to Read the Catalogue\n\n**Controlling idea** (`definition`, id `how-to-read`): Every entry traces a recurring failure to one of four levers and shows the reasonable choice that created it, which is why the entries describe situations and not people.\n\n**Advances the thesis** (S1): Defines the four levers the families are named after and states the mechanism every entry repeats: a reasonable choice, left in place, draws the same behavior from whoever holds the role.\n\n**Transition in:** `elaboration`: The lead's claim that the patterns trace to four designable elements. → What those elements are and how an entry is built.\n\n**Order of paragraphs** (`prerequisite_order`): The levers come first because the families are named after them; the three capacities next because every cost is stated as one of them running out; the mechanism after both because it uses them; the entry format last because it refers to all three. Starting with the format would use 'lever' and 'capacity' before either is defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition (table) | A redesign can change four things about an organization — boundaries, interfaces, decision rights and incentives — and each family of patterns is the set of ways one of those four is commonly set wrong. | table: Lever \\| What it sets \\| The question it answers \\| Its three patterns. Boundary: which team owns what \\| Whose is this? \\| The Org Chart as Architecture, The Overloaded Team, The Reorg as Strategy. Interface: the agreed way work and knowledge cross between teams \\| How do they find out? \\| The Review Bottleneck, The Platform Nobody Asked For, The Unowned Interface. Decision right: who may decide a named kind of question, with whose input \\| Who says yes? \\| The Feature Factory, The Escalation Ladder, The Consensus Stall. Incentive: what the organization visibly rewards \\| What gets you promoted here? \\| The Output Scoreboard, The Ladder as Checklist, The Hero Culture. |  |\n| p05 | definition | Each pattern's cost is one of three capacities running out: attention, judgment or verification. |  | `additional_support`: The four levers a leader can set. → The three capacities no lever creates, in which every cost is counted. |\n| p06 | explanation (figure) | A pattern recurs because the choice that created it was reasonable and the behavior it draws is sensible, so replacing the people returns the same behavior and only changing the lever removes it. | source: Morieux and Tollman: every behavior at work is a rational solution to a problem, given a person's goals, resources and constraints.; figure: Mermaid flow: a locally reasonable choice about a lever -> a structural situation left in place -> the same sensible behavior from whoever holds the role -> a cost that grows until it is noticed; 'replace the people' leads back to the same behavior; 'change the lever' acts on the situation. | `cause_effect`: Levers that set a situation and capacities that run out. → The chain from a reasonable choice to a recurring cost, and where replacing people acts on it. |\n| p07 | description | Every entry has the same four parts — what you hear and see, why capable people create it, what it costs, where the book treats it — and says where its material comes from. |  | `sequence`: The mechanism all twelve share. → The form in which each one is presented, and which parts are sourced, invented or the author's. |\n\n### Boundary Patterns: Who Owns What\n\n**Controlling idea** (`analysis`, id `boundary-patterns`): The three boundary patterns are ownership lines drawn by something other than the work: by the reporting chart, by a team's reputation for coping, and by the last disappointing result.\n\n**Advances the thesis** (S2): Shows three recurring failures whose origin is a reasonable choice about where an ownership line sits.\n\n**Transition in:** `sequence`: The four levers and the form of an entry. → The first family: the patterns that trace to boundaries.\n\n**Order of paragraphs** (`grouping`): The chart redrawn once comes first because the other two are defined against it: the Overloaded Team is the line that is never redrawn while scope arrives, and the Reorg as Strategy is the first pattern repeated as a habit, so it has to follow the single case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | claim | A boundary says which team owns a thing, and the three boundary patterns are boundaries set by the reporting chart, by a team's reputation and by the calendar of disappointing results. |  |  |\n| p09 | description | The Org Chart as Architecture is a reorganization that changes who reports to whom, or how many people each team has, and leaves what teams own and how they reach each other as it was. | example: Invented line someone in the organization would say: \"We've moved Mobile under the new director. That should fix the handoffs.\"; fact: Warning signs: after the reorganization the same teams wait on the same teams; one visible feature needs changes from several teams; the announcement says who reports to whom and nothing about ownership or how teams reach each other. | `example`: Boundaries set by something other than the work. → The first case: boundaries set by the reporting chart. |\n| p10 | cause_effect | Capable leaders create it because the chart is the one part of the structure they can change by a date, and because the belief that structure acts directly on results is widely held. | source: Morieux and Tollman's 'hard approach': the belief that structures, processes and systems have a direct and predictable effect on performance.; reasoning: An even split by headcount is fast, looks fair and needs no argument about what each team should own. | `cause_effect`: What The Org Chart as Architecture looks like from outside. → The locally reasonable choice that creates it. |\n| p11 | evidence | It costs attention and the price of a reorganization: boundaries that follow headcount leave each team needing to understand parts of what other teams own, so ordinary changes become handoffs that wait. | scenario: Corvane, 2023, growing toward 180 people: four teams split into eleven product teams of about eight by dividing people evenly, plus a platform team of five. By 2024 the median lead time for a change had gone from 4 days to 19, of which about two days were spent writing the change. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p12 | recommendation | The chapters named address it by starting from the work instead of the chart. | reasoning: Chapters, as [[links]]: [The Organization as a System That Can Be Architected](the-organization-as-a-system.html) (what a reporting line does not change), [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html) (when redrawing teams changes the software), [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html) (drawing boundaries around what a team can hold), [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html) (what each kind of team should own). | `problem_solution`: The cost of The Org Chart as Architecture. → The chapters that address it. |\n| p13 | description | The Overloaded Team is the team that is given each new responsibility because it coped with the last one, until it owns more than its members can hold in mind. | example: Invented line someone in the organization would say: \"Give it to Core. They always manage.\"; fact: Warning signs: its backlog is longer every week; most other teams have a request waiting on it; one or two members are the only ones able to change parts of what it owns; it is described as the best team and the slowest. | `contrast`: Lines redrawn too easily. → A line that is never redrawn while scope keeps arriving on one side of it. |\n| p14 | cause_effect | It is created one reasonable assignment at a time, because giving new scope to the team that has proved itself is the safe choice for whoever assigns it, and nobody adds up the total. | source: Larson's four team states: a team is 'falling behind' when its backlog is longer each week than the week before; and his remark that bottlenecked groups tend to be very helpful but are trying to do more than they are able to. | `cause_effect`: What The Overloaded Team looks like from outside. → The locally reasonable choice that creates it. |\n| p15 | evidence | It costs attention: the team's lead time rises, and every team that depends on it waits. | scenario: Corvane, 2022, as it began to grow from 50 people toward 180: Core, with six engineers, took on the rule engine for scheduling and job status, got no additional engineers, owned more than it could comfortably understand, and its lead time for other work rose. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p16 | recommendation | The chapters named address it with a test for overload and a rule for where added capacity goes. | reasoning: Chapters, as [[links]]: [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html) (the test for when a team owns too much), [Flow and the Constraint](flow-and-the-constraint.html) (Larson's four states and what to add in each), [Team Size and Composition](team-size-and-composition.html) (how large a team can be). | `problem_solution`: The cost of The Overloaded Team. → The chapters that address it. |\n| p17 | description | The Reorg as Strategy is the first pattern made into a habit: the organization is redrawn each time results disappoint, and no redrawing is ever checked against an outcome. | example: Invented line someone in the organization would say: \"The structure isn't working. Let's reorganize again in Q3.\"; fact: Warning signs: more than one reorganization a year; none had a stated outcome or a review; the announcement comes before the plan for on-call duty, ownership and work in flight; nobody can say what would trigger the next one. | `elaboration`: The chart redrawn once. → The chart redrawn as the standing answer to disappointing results. |\n| p18 | cause_effect | Leaders reach for it because a reorganization is visible, fast and within their own authority, and because a change with no stated outcome cannot be shown to have failed. | source: Build What Matters: the Roller Coaster (whiplashing changes of direction, from a time horizon that is too short) and the Hamster Wheel (output over outcomes); applying them to reorganizations is the author's extension, made in the-organization-as-a-product.; quotation: \"There is only one worst kind of reorg: the one you do because you're avoiding a people management issue.\"; source: Meadows's trap of shifting the burden: a remedy that relieves the symptom and does nothing about the underlying problem, so more of the remedy is needed. | `cause_effect`: What The Reorg as Strategy looks like from outside. → The locally reasonable choice that creates it. |\n| p19 | evidence | It costs attention: every reorganization resets the working knowledge of who owns what, which people must then rebuild, and sometimes the new chart forgets a duty. | scenario: Corvane's 2023 reorganization had no stated outcome, and when the board asked in 2024 (180 people) whether it had worked, the leadership team could not answer. The Tuesday Reorg (2025–2026, 500 people) was announced without a migration plan and two teams lost their on-call rotation. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p20 | recommendation | The chapters named address it by giving an organizational change an outcome, a plan and a trigger. | reasoning: Chapters, as [[links]]: [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html) (a stated outcome and the smallest change that tests the diagnosis), [[reorganizations]] (when to reorganize and how to run it as a migration), [[scaling-stages]] (the signals that a structure has expired). | `problem_solution`: The cost of The Reorg as Strategy. → The chapters that address it. |\n\n### Interface Patterns: How Work Crosses Between Teams\n\n**Controlling idea** (`analysis`, id `interface-patterns`): The three interface patterns are an interface built as a gate, an interface built without its users, and an interface never built.\n\n**Advances the thesis** (S3): Shows three recurring failures whose origin is a reasonable choice about how work and knowledge cross between teams.\n\n**Transition in:** `sequence`: Boundaries, which decide what each team owns. → Interfaces, which decide how teams reach across those boundaries.\n\n**Order of paragraphs** (`grouping`): From too much interface to none: the gate every team is forced through, then the platform no team comes to, then the crossing with no interface at all. The gate comes first because the acceptance probe and most readers' experience start there, and each later pattern is introduced as the contrast to the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | An interface is the agreed way work or knowledge crosses from one team to another, and it fails in three ways: as a gate, as a product without users, and by not existing. |  |  |\n| p22 | description | The Review Bottleneck is an interface designed as an approval queue: every change of some kind must pass one team or board, which holds the organization's capacity to verify that kind of change. | example: Invented line someone in the organization would say: \"It's done. It's just waiting for review.\"; fact: Warning signs: finished work waits longer for approval than it took to make; one team must approve every change of a kind; nearly everything is approved in the end, late; the approving team is praised for rigor and blamed for speed. | `example`: Three ways an interface fails. → The first: the interface built as an approval that everything must pass. |\n| p23 | cause_effect | It is created by adding a check after each incident and giving it to the people who know most, which is the cheapest safe response each time, while the work to be checked grows with every team and the checkers do not. | quotation: Larson on the gatekeeper pattern: \"treat gatekeeping as a significant implementation bug rather than as a stability feature to be emulated.\" | `cause_effect`: What The Review Bottleneck looks like from outside. → The locally reasonable choice that creates it. |\n| p24 | evidence | It costs verification, the capacity it concentrates: work ages in the queue, and each increase in what is produced lengthens the wait. | scenario: The Launch Queue, Corvane, 2024, 180 people: five platform engineers, eleven product teams, three of which needed Platform for every launch; 14 open launch requests at the peak; of 19 days of lead time about two went into writing the change.; scenario: The Review Wall, Corvane, 2027–2028, 1,100 people, coding agents in every team: merged changes per week up 2.4 times in a year, review capacity flat, median review wait from 5 hours to 31. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p25 | recommendation | The chapters named address it by moving the check out of the queue. | reasoning: Chapters, as [[links]]: [Flow and the Constraint](flow-and-the-constraint.html) (finding the step that limits the whole), [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html) (a service others use without asking), [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html) (advice and guardrails in place of approval), [Quality and Reliability as Operating Model](quality-and-reliability.html) (checks built into the work), [[agentic-delivery]] (verification when agents write the changes). | `problem_solution`: The cost of The Review Bottleneck. → The chapters that address it. |\n| p26 | description | The Platform Nobody Asked For is an internal platform, tool or standard built ahead of any team's stated need and then pushed to teams that have to be made to adopt it. | example: Invented line someone in the organization would say: \"The platform is ready. Now we need the teams to migrate.\"; fact: Warning signs: adoption needs a mandate; product teams keep their own scripts beside it; its roadmap lists capabilities and no team's problem; its builders cannot name the teams they talked to before building; its success is reported as features shipped. | `contrast`: An interface every team is forced through. → An interface no team comes to. |\n| p27 | cause_effect | Capable engineers create it because they see the same problem solved several times over and build the general solution in advance, which is what good engineers are praised for, and because colleagues do not seem to need the research customers get. | source: Build What Matters: the Bridge to Nowhere ('overengineering for future unknowns') and the Ivory Tower ('lack of customer research'); applying both to an internal platform, whose customers are the company's own teams, is the author's extension. | `cause_effect`: What The Platform Nobody Asked For looks like from outside. → The locally reasonable choice that creates it. |\n| p28 | evidence | It costs a team's attention spent on a product without users, and every other team a migration it did not choose. | scenario: Corvane's ledger records no instance. Its platform team had the opposite history: created to help eleven product teams release faster, within a year every launch waited on it. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p29 | recommendation | The chapters named address it by treating a platform as a product whose users are teams. | reasoning: Chapters, as [[links]]: [Platforms and Developer Experience](platforms-and-developer-experience.html) (the platform's users and its adoption measure), [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html) (when a platform team is justified), [Migrations and Technical Debt](migrations-and-technical-debt.html) (what a migration costs the teams asked to make it); the author's record [Platform as a Product](../grounded-platforms/platform-as-a-product.html). | `problem_solution`: The cost of The Platform Nobody Asked For. → The chapters that address it. |\n| p30 | description | The Unowned Interface is a place where work or knowledge has to cross between teams and no agreed, owned way exists for it to do so. | example: Invented line someone in the organization would say: \"I assumed they knew we had changed it.\"; fact: Warning signs: the same rule is implemented in two teams with different results; changes reach other teams after release, through incidents or customers; incident reviews end with the word 'communication'. | `contrast`: Interfaces that were built wrongly. → The crossing for which no interface was built. |\n| p31 | cause_effect | It is created by every team doing its own part well, because the effort of finding out what another team is changing falls on the person who asks and benefits someone else. | source: Morieux and Tollman's adjustment cost: the price a person pays for cooperating, which they count among that person's constraints.; source: Meadows: missing information flows are among the most common causes of a system's malfunction. | `cause_effect`: What The Unowned Interface looks like from outside. → The locally reasonable choice that creates it. |\n| p32 | evidence | It costs attention nobody is able to give, since no one holds the whole of what crosses, and so the same failure returns, each time blamed on a person. | scenario: The Two Calendars, Corvane, 2021, 50 people: Web and Mobile each implemented the rule for overlapping jobs, and planners and technicians saw different schedules for three weeks; the Mobile lead was replaced. In 2022 Mobile and Integrations diverged on job-status rules the same way: a job marked complete on the phone stayed open in customers' billing exports for eleven days. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p33 | recommendation | The chapters named address it by saying which crossings need a contract and who owns each. | reasoning: Chapters, as [[links]]: [The Organization as a System That Can Be Architected](the-organization-as-a-system.html) (this case in full), [Conway's Law and the Inverse Conway Maneuver](conways-law-and-the-inverse-conway-maneuver.html) (which lines between teams need a contract), [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html) (the team API), [[operating-cadence]] (the rituals and written paths that carry information). | `problem_solution`: The cost of The Unowned Interface. → The chapters that address it. |\n\n### Decision-Right Patterns: Who Decides\n\n**Controlling idea** (`analysis`, id `decision-right-patterns`): The three decision-right patterns each put a decision away from the people who hold the information for it: taken from the team, sent up by the team, or given to everyone at once.\n\n**Advances the thesis** (S4): Shows three recurring failures whose origin is a reasonable choice, or a missing one, about who may decide what.\n\n**Transition in:** `sequence`: Interfaces, which carry work and information. → Decision rights, which carry decisions.\n\n**Order of paragraphs** (`grouping`): Ordered by where the decision goes: outside the team (the Feature Factory), above the team (the Escalation Ladder), and nowhere in particular (the Consensus Stall). The Feature Factory comes first because it is the best known and the source's own name; the stall comes last because it is the case with no decider at all, which the first two prepare by showing a decider in the wrong place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | claim | A decision right is the agreed answer to who may decide a named kind of question, and the three decision-right patterns put that decision outside the team, above the team, or with everyone at once. |  |  |\n| p35 | description | The Feature Factory is a product team that receives a list of features to build, decided by whoever asked for them, and keeps only the decision of how. | example: Invented line someone in the organization would say: \"Sales needs it for the renewal. Just tell us when it ships.\"; fact: Warning signs: the roadmap is a list of features with dates and a requester beside each; the team cannot say which customer outcome a feature is meant to change; nothing shipped is reviewed or removed. | `example`: Decisions placed away from their information. → The first case: what to build is decided outside the team that builds it. |\n| p36 | cause_effect | It is created one reasonable yes at a time, because every request comes from a real customer or colleague with revenue attached, and refusing any single one looks worse than building it. | source: Build What Matters, dysfunction 5, the Feature Factory ('an assembly line of features'): teams are led to believe by customers or internal stakeholders that one more feature will close a deal or keep a customer. The name is theirs. | `cause_effect`: What The Feature Factory looks like from outside. → The locally reasonable choice that creates it. |\n| p37 | evidence | It costs judgment: the people who know the product best decide nothing about what it becomes, and nobody learns whether what shipped worked. | scenario: Corvane, in one year of the hiring-wave stage (2022–2024, 180 people): forty-one features shipped, each promised to a named customer, and the renewal rate fell. The roadmap was a list of features promised to large customers, with dates. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p38 | recommendation | The chapters named address it by moving the decision to outcomes and to the team. | reasoning: Chapters, as [[links]]: [Outcomes Over Output](outcomes-over-output.html) (the dysfunctions and key outcomes), [Vision and Product Strategy](vision-and-product-strategy.html) (what the team's choices are checked against), [Roadmaps and Horizons](roadmaps-and-horizons.html) (a roadmap of outcomes), [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html) (what a team is empowered to decide). | `problem_solution`: The cost of The Feature Factory. → The chapters that address it. |\n| p39 | description | The Escalation Ladder is an organization in which decisions travel upward until they reach someone senior enough to be safe, who has less information than the people who sent them. | example: Invented line someone in the organization would say: \"Let's take it to the leadership meeting.\"; fact: Warning signs: routine decisions are made two levels above the work; teams wait days for answers they could give themselves; the same kind of question comes up the ladder again and again. | `contrast`: A decision taken from the team. → A decision the team itself sends upward. |\n| p40 | cause_effect | It begins as the right arrangement for a company of twelve, where the founder decides everything, and it persists because escalating is the safe choice wherever it is unwritten what a team may decide. | source: Build What Matters, dysfunction 10, the Throne Room: the founder or CEO who cannot let go; in the authors' words, 'at a certain point, instinct doesn't scale.'; source: Morieux and Tollman: decisions should be made as close as possible to where the action takes place and where information is richest.; source: Larson: collect each escalation as a test case for the policy, and use escalations as inputs for an updated policy instead of handling them one by one. | `cause_effect`: What The Escalation Ladder looks like from outside. → The locally reasonable choice that creates it. |\n| p41 | evidence | It costs judgment: each decision is made late, by the person with the least information about it. | scenario: The Founder Queue, Corvane, 2018–2019, 12 people: every pricing, design and release decision waited for Tomas Rell, co-founder and CTO. By 2025–2026, at 500 people, the ledger names judgment as the scarce capacity: decisions made far from their information. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p42 | recommendation | The chapters named address it by writing down who decides what. | reasoning: Chapters, as [[links]]: [Decision Rights and Decision Records](decision-rights-and-decision-records.html) (allocating and recording decisions), [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html) (what each layer decides), [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html) (the team's own decisions), [Executive Roles and Reporting Lines](executive-roles-and-reporting-lines.html) (what the executives keep). | `problem_solution`: The cost of The Escalation Ladder. → The chapters that address it. |\n| p43 | description | The Consensus Stall is a decision that has no named decider, so that it can be finished only when everyone with a stake agrees. | example: Invented line someone in the organization would say: \"Let's get everyone aligned before we commit.\"; fact: Warning signs: meetings end by scheduling another meeting; a settled decision is reopened by whoever was absent; people agree in the room and act otherwise afterwards. | `contrast`: Decisions that go to one person too far away. → Decisions that go to no one person at all. |\n| p44 | cause_effect | It is created by a decent impulse, since asking everyone is respectful and protects each person from being wrong alone, and where no decider is named, agreement is the only way a decision can end. | source: Build What Matters, dysfunction 9, the Negotiating Table ('trying to keep everyone happy').; quotation: Lencioni, on what people need in place of consensus: \"They just need to be heard, and to know that their input was considered and responded to.\" His third dysfunction, lack of commitment, follows from fear of conflict. Lencioni writes about trust inside one team, which is a condition a decision right does not create. | `cause_effect`: What The Consensus Stall looks like from outside. → The locally reasonable choice that creates it. |\n| p45 | evidence | It costs judgment, spread so thin that nobody exercises it: the decision arrives late and is the option nobody objected to. | scenario: Corvane, 2024, 180 people: nobody could say who decides that a feature is ready, and the question was still open after that year's change brief. The Nine-Week Plan (2025–2026, 500 people): quarterly planning took nine of the quarter's thirteen weeks; the ledger records its length and the planning chapter examines its causes. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p46 | recommendation | The chapters named address it by naming a decider and separating being consulted from deciding. | reasoning: Chapters, as [[links]]: [Decision Rights and Decision Records](decision-rights-and-decision-records.html) (decider, consulted, record), [Planning](../grounded-engineering-executive/planning.html) (the Nine-Week Plan), [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html) (three functions deciding together). | `problem_solution`: The cost of The Consensus Stall. → The chapters that address it. |\n\n### Incentive Patterns: What Gets Rewarded\n\n**Controlling idea** (`analysis`, id `incentive-patterns`): The three incentive patterns each reward something easier to see than the result: output, the items on a career ladder, and rescue.\n\n**Advances the thesis** (S5): Shows three recurring failures whose origin is a reasonable choice about what to count, promote and praise.\n\n**Transition in:** `sequence`: Three levers that set what people can do. → The lever that sets what people have reason to do.\n\n**Order of paragraphs** (`large_to_small`): From the organization's scoreboard to the individual's promotion to the single act of praise. The scoreboard comes first because the other two are the same substitution, something visible rewarded in place of the result, at a smaller scale, and the reader needs the general form before its two special cases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | claim | An incentive is whatever the organization visibly rewards, and the three incentive patterns reward what is easy to see in place of the result: output, the items on a ladder and rescue. | source: Meadows's trap of seeking the wrong goal: a system works obediently toward the indicator it was given, wanted or not. |  |\n| p48 | description | The Output Scoreboard is an organization that counts and praises what was produced — features, story points, hires, a finished reorganization — and does not ask what changed for a customer. | example: Invented line someone in the organization would say: \"Velocity is up twelve percent this quarter.\"; fact: Warning signs: reviews report counts of things shipped; a project is called done on its launch day; dashboards show internal numbers only; nobody is asked what a release changed. | `example`: Rewarding the visible in place of the result. → The first case, at the scale of the organization: counting output. |\n| p49 | cause_effect | It is created because output can be counted this week by one team, while an outcome arrives months later and is shared among several, and a leader needs something to report now. | source: Build What Matters: the Hamster Wheel ('output over outcomes') and the Counting House ('obsession with internal metrics').; quotation: Meadows, on a system given the wrong goal: it \"may obediently work to produce a result that is not really intended or wanted.\" | `cause_effect`: What The Output Scoreboard looks like from outside. → The locally reasonable choice that creates it. |\n| p50 | evidence | It costs verification in its second sense, knowing that what was built was worth building: the organization cannot tell being busy from being effective. | scenario: Corvane's hiring wave, 2022–2024: the plan was judged by its completion, 95 engineers hired and eleven teams formed; no outcome was stated; in 2024, at 180 people, the leadership team could not tell the board whether it had worked, and the median lead time had gone from 4 days to 19. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p51 | recommendation | The chapters named address it by choosing what is measured. | reasoning: Chapters, as [[links]]: [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html) (outcome and output of an organizational change), [Outcomes Over Output](outcomes-over-output.html) (key outcomes), [[measuring-engineering]], [[product-outcomes-and-organizational-health-signals]], [[measuring-productivity-with-ai]] (when output becomes cheap). | `problem_solution`: The cost of The Output Scoreboard. → The chapters that address it. |\n| p52 | description | The Ladder as Checklist is a career ladder read as a list of items to collect, so that people choose work for the evidence it gives a promotion case. | example: Invented line someone in the organization would say: \"I need a cross-team project for my promotion case.\"; fact: Warning signs: new systems are launched and then left without an owner; managers ask for headcount as the way to the next level; reviewing, maintaining and mentoring fall to people who do not expect promotion. | `similarity`: An organization that counts output. → The same substitution in one person's career: a ladder read as a list of items to collect. |\n| p53 | cause_effect | It is created by a good decision, writing down what each level requires so that promotion is fair, because written criteria favor what can be shown as evidence, and people then sensibly produce that evidence. | quotation: Meadows on rule beating: \"Notice that rule beating produces the appearance of rules being followed.\"; source: Morieux and Tollman: it is extremely difficult to measure who contributes what to cooperation, which is why they advise relying on judgment over metrics. | `cause_effect`: What The Ladder as Checklist looks like from outside. → The locally reasonable choice that creates it. |\n| p54 | evidence | It costs the work that protects attention and supplies verification, which an organization needs most and can evidence least: cooperation, upkeep and checking other people's work. | scenario: Corvane introduced a career ladder in 2025–2026, at 500 people; the ledger records no incident from it. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p55 | recommendation | The chapters named address it by saying what a ladder is for and who judges a case. | reasoning: Chapters, as [[links]]: [[career-ladders-and-leveling]] (what a ladder should and should not specify), [[performance-calibration-and-growing-managers]] (judgment in promotion decisions), [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html) (senior work that does not look like a project). | `problem_solution`: The cost of The Ladder as Checklist. → The chapters that address it. |\n| p56 | description | The Hero Culture is an organization that thanks and promotes the people who rescue it, and so keeps needing rescue. | example: Invented line someone in the organization would say: \"Thank goodness she was online on Sunday.\"; fact: Warning signs: the same few names appear in every incident and every thank-you; what the heroes own is not written down; the same system is rescued repeatedly; long hours are praised in public. | `similarity`: A promotion system that rewards evidence. → The smallest scale: praise that rewards rescue. |\n| p57 | cause_effect | It is created by gratitude that is deserved, because a rescue is visible and the work that would have made it unnecessary is not, so recognition goes to the first and nobody has a reason to do the second. | quotation: Larson, under 'Kill your heroes, stop doing it harder': \"Unless your problem is that people aren't trying hard, the 'work harder' mantra only breeds hero programmers whose heroic ways make it difficult for nonheroes to contribute meaningfully.\"; source: Lencioni's fifth dysfunction, inattention to results: individual recognition put above the collective result. | `cause_effect`: What The Hero Culture looks like from outside. → The locally reasonable choice that creates it. |\n| p58 | evidence | It costs attention concentrated in one person, who becomes a constraint and a single point of failure for a team that cannot work without them. | scenario: Corvane, 2021, 50 people: Samir Haddad, a staff engineer, was the only engineer who understood both the scheduling engine and the mobile sync. | `cause_effect`: The choice and why it is kept. → What it costs, with Corvane's instance where the ledger has one. |\n| p59 | recommendation | The chapters named address it by treating the hero as a signal about the system. | reasoning: Chapters, as [[links]]: [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html) (the hero as a sign of an overloaded team), [Flow and the Constraint](flow-and-the-constraint.html) (a person as the constraint), [Quality and Reliability as Operating Model](quality-and-reliability.html) (on-call and incident practice that does not depend on one person), [[values-operating-principles-and-rituals]] (what the organization praises in public). | `problem_solution`: The cost of The Hero Culture. → The chapters that address it. |\n\n### The Twelve Patterns at a Glance\n\n**Controlling idea** (`synthesis`, id `at-a-glance`): Read as one table, the catalogue is a way from a warning sign to a lever, and a real incident usually needs it more than once.\n\n**Advances the thesis** (S1, S6): Turns the catalogue into the diagnostic use the thesis promises: from a sign to a pattern to the lever to change, shown on one Corvane incident whose repair changed a lever and no person.\n\n**Transition in:** `conclusion_summary`: Twelve entries in four families. → All twelve in one table, for use.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The table first, because the reader has now met every name in it; then one incident read with it, which shows that patterns arrive together and that the repair acted on a lever. The example before the table would use the table's rows before the reader has them in one place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | synthesis (table) | The twelve patterns, each with its family, one warning sign and the chapters that address it, fit in one table that is read from the warning sign to the lever. | table: Pattern \\| Family \\| Warning sign \\| Chapters, twelve rows in the order of the entries. |  |\n| p61 | example | A real incident usually shows several patterns at once, and naming each separates the levers, so that one lever can be changed and its effect measured before the next. | scenario: The Launch Queue, Corvane, 2024, 180 people: a Review Bottleneck at Platform, with teams cut by headcount (the Org Chart as Architecture) and an unassigned decision on readiness behind it. Dario Vance, VP Engineering, changed the interface first: a release path the Scheduling team could run without Platform. Scheduling's median lead time was 6 days after one quarter; company-wide it went from 19 days to 8 at the two-quarter review and under 7 a quarter later. The eleven teams were not re-cut and nobody was replaced. | `example`: The table of twelve. → One Corvane incident read with it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The twelve patterns are four questions that were answered once and never asked again: whose is this, how do they find out, who says yes, and what gets rewarded. Each pattern is the look of an organization in which one of those answers has outlived the situation it was given for.\n\n**So what:** A leader who can name the pattern asks the lever's question again and changes that answer, instead of changing the people caught in it and meeting the same failure with their successors.\n\n**Callback:** Tolstoy's sentence that every unhappy family is unhappy in its own way. Organizations are unhappy in a small number of shared ways, and the reader can now name twelve of them and the lever behind each.\n\n**Takeaway** (`course_of_action`): Take one recurring problem, find its warning sign in the table, name the pattern and its lever, and ask which reasonable choice put it there. The checklist gives the steps.\n\n**Hand-off** to [Meet Corvane: One Company at Five Sizes](corvane-at-five-sizes.html): `example`: The failure patterns and the elements they trace to. → One fictional company in which the patterns appear in turn as it grows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis (list) | Established: the sources agree that behavior at work is a rational response to its context, that systems given the wrong goal produce it obediently, and that product organizations share a short list of named dysfunctions. |  |  |\n| p63 | synthesis (list) | Depends on context: a warning sign is a prompt to look and not a verdict, and whether a pattern is present depends on size and on whether a condition such as trust or skill is what is missing. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p64 | synthesis (list) | The author's synthesis: the twelve names where no source is credited, the four families and the assignment of each pattern to one lever are this book's arrangement, and so is the claim that each pattern begins as a reasonable choice. |  | `contrast`: What depends on the situation. → What is the author's own arrangement. |\n| p65 | recommendation (list) | Eight steps take a reader from one recurring problem to the lever behind it. |  | `sequence`: What to take away. → What to do with it. |\n| p66 | transition | The patterns have so far been shown one at a time, and the next page shows them arriving in turn in one fictional company as it grows from 12 people to about 1,100. |  | `example`: The patterns and the levers they trace to. → One company in which they appear in turn. |\n\n## Non-goals\n\n- Remedies in detail: each entry names the chapters that hold them and gives no procedure of its own See [Flow and the Constraint](flow-and-the-constraint.html), [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html), [Decision Rights and Decision Records](decision-rights-and-decision-records.html), [[career-ladders-and-leveling]].\n- The four levers and three conditions argued in full See [The Organization as a System That Can Be Architected](the-organization-as-a-system.html).\n- The three scarce capacities in full See [Flow and the Constraint](flow-and-the-constraint.html).\n- Corvane's timeline, cast and incidents in order See [Meet Corvane: One Company at Five Sizes](corvane-at-five-sizes.html).\n- The ten dysfunctions of Build What Matters one by one See [Outcomes Over Output](outcomes-over-output.html).\n- Trust and conflict inside a team (Lencioni's ground), which is a condition and not a lever See [[trust-conflict-and-psychological-safety]].\n- What AI changes: the page has no 'What AI Changes Here' section; the one AI-era instance (the Review Wall) is given as a Corvane illustration See [[where-the-constraint-moves]], [[agentic-delivery]].\n- Failures of individuals: poor hires, weak managers, misconduct\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Three patterns have no Corvane incident in the ledger under their own name: the Platform Nobody Asked For (Corvane's platform failed as a gate instead), the Ladder as Checklist, and, for the Tuesday Reorg, a year. The author may want corvane-at-five-sizes or the owning chapters to add instances; this page says the ledger records none.\n- The Nine-Week Plan is listed under the Consensus Stall with its cause left to the planning chapter. If that chapter finds a different cause, this entry's Corvane sentence should be revisited.\n- The Launch Queue is used under the Review Bottleneck although it was a queue for launch slots at Platform, not a review in the narrow sense; the entry defines the pattern as any approval queue that one team holds.\n- The style guide asks every pattern to name its user and outcome measure; that rule is read as applying to the patterns chapters recommend, not to failure patterns. Confirm.\n- [Planning](../grounded-engineering-executive/planning.html) and [Team Size and Composition](team-size-and-composition.html) also exist as permalinks in other journals and will resolve there until this book's chapters are written.\n\n## Decision log\n\n- **2026-11-19** — The page carries the IN THIS CHAPTER and KEY POINTS callouts and omits the FAILURE PATTERNS THIS CHAPTER ADDRESSES callout, because the page is the catalogue that callout links to. Rejected: A third callout listing all four families, which would repeat the first table\n- **2026-11-19** — One section per family, in the order boundaries, interfaces, decision rights, incentives, preceded by a short reading guide and followed by the summary table. Rejected: Ordering the twelve by how common they are; The summary table first, as in the commerce book's failure-patterns page: here the names would arrive unexplained\n- **2026-11-19** — Each entry is four paragraphs with fixed bold labels (What you hear and see / Why capable people create it / What it costs / Where the book treats it); the invented quotation opens the first paragraph and the Corvane instance sits in the cost paragraph. Rejected: Six or seven labeled lines per entry as in the commerce book, which would give more than a hundred units for twelve patterns; A remedy paragraph per entry: remedies belong to the chapters\n- **2026-11-19** — Where the ledger has no Corvane instance of a pattern, the entry says so and no instance is invented. Rejected: Appending new Corvane incidents from this page, while corvane-at-five-sizes is being written in parallel\n- **2026-11-19** — The Feature Factory is placed under decision rights (who decides what is built) and the Output Scoreboard under incentives (what is counted afterwards); the entry for the second states the difference. The Hero Culture is placed under incentives because recognition is the lever, although chapters 4 and 5 meet it as a sign of overload and as a constraint. Rejected: Merging the Feature Factory and the Output Scoreboard; Placing the Hero Culture under boundaries\n- **2026-11-19** — The hook is the Tolstoy sentence as quoted in Build What Matters, not a Corvane scene, because the introduction, chapter 1 and chapter 2 each open on a Corvane incident and the next page tells them all in order. Rejected: Opening on the Two Calendars (chapter 1's opening); Opening on the hiring wave (the introduction's and chapter 2's)\n- **2026-11-19** — No 'What AI Changes Here' section: the style guide requires it for Parts I to X and this page is in the Preface. The Review Wall is cited as a Corvane illustration without an AI claim. Rejected: A short AI section with Speculative claims and no evidence on this page\n- **2026-11-19** — Length: target 5,300 words, cap 6,500, by the author's instruction for this page (the style guide's chapter range is 3,500 to 5,000).\n- **2026-11-19** — Flow rubric (one fresh agent, run once): sound with notes. Taken: every cost paragraph now names the capacity that runs out, as the reading guide promises; the at-a-glance example no longer says to change first the lever that can be changed soonest (it collided with the mechanism of two boundary patterns) and says instead that naming the patterns separates the levers so one can be changed and measured at a time; the lead bridges the source's ten dysfunctions to this page's twelve patterns; 'the commonest' removed from the boundary section's flow rationale. Not taken: moving the checklist and the 'Depends on context' list into the at-a-glance section, because the book's page format fixes both inside What to Take Away. Rejected: Softening the reading guide to 'most costs'; Moving the checklist out of the conclusion\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-product-management/posts/dysfunctions/index.md — The author's summary of the Build What Matters dysfunctions; cross-linked.\n  - posts/01-the-organization-as-a-system, 02-the-organization-as-a-product, 03, 04, 05 (index.md) — How the finished chapters describe the Org Chart as Architecture, the Unowned Interface, the Reorg as Strategy, the Output Scoreboard, the Overloaded Team, the Review Bottleneck and the Hero Culture; this page stays consistent with them.\n  - _research/scenario-ledger.md — Every Corvane fact on the page.\n  - journal-spec.json, entry where-product-and-tech-organizations-go-wrong — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Ben Foster and Rajesh Nerlikar, Build What Matters: Delivering Key Outcomes with Vision-Led Product Management (2020); author's notes, _input/bookshelf/docs/notes/build-what-matters.pdf — The ten dysfunctions of product management: the Feature Factory (name and mechanism), the Hamster Wheel, the Counting House, the Ivory Tower, the Roller Coaster, the Bridge to Nowhere, the Negotiating Table, the Throne Room; the Tolstoy epigraph.\n  - Will Larson, An Elegant Puzzle: Systems of Engineering Management (2019); author's notes, elegant-puzzle.pdf — The four team states; bottlenecked groups; the gatekeeper pattern; the worst kind of reorg and the question of what triggers the next one; escalations as inputs to policy; 'Kill your heroes'.\n  - Donella H. Meadows, Thinking in Systems: A Primer (2008); author's notes, thinking-in-systems.pdf — The system traps: seeking the wrong goal, rule beating, shifting the burden; missing information flows.\n  - Yves Morieux and Peter Tollman, Six Simple Rules (2014); author's notes, six-simple-rules.pdf — Behavior as a rational solution in a context; adjustment costs; the hard approach; decisions close to the information; judgment over metrics for cooperation.\n  - Patrick Lencioni, The Five Dysfunctions of a Team (2002); author's notes, five-dysfunctions.pdf — Fear of conflict and lack of commitment (the Consensus Stall); inattention to results (the Hero Culture); the limit that his subject is trust within one team.\n\n## Changelog\n\n- **2026-11-19** — Flow rubric notes applied (cost paragraphs name a capacity; at-a-glance example reworded; lead bridge; one flow rationale); status set to accepted in auto mode.\n- **2026-11-19** — Spec created from the journal-spec entry, the style guide's pattern names and the author's notes on the five sources.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
