<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The ten dysfunctions of product management in Build What Matters and their three themes.\n- **Know:** Key customer outcome and key business outcome, and why the first comes before the second.\n- **Know:** What separates an outcome metric from a vanity metric.\n- **Believe:** A busy product organization can be moving its customers nowhere.\n- **Be able to:** Name the dysfunction a described product organization has.\n- **Be able to:** Rewrite an output goal as an outcome with a measure.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a described product organization, the reader names its dysfunction and rewrites its main goal as a customer outcome with a measure. *Probe:* A team's quarterly goal is 'ship the new reporting module by June'. The team hits the date; usage of reports does not change. Which dysfunction is this, and how would you restate the goal? | `custom` | cold_reader | major |\n| AC-2 | The chapter says how its outcome differs from the outcome of an organizational change defined in chapter 2, and links to it. | `known_before_new` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Why do organizations that ship a great deal still fail their customers, and what should they aim at instead?\n\n> **Claim:** Organizations that ship a great deal still fail their customers when they measure themselves by what they ship, which Build What Matters catalogues as recurring dysfunctions; what they should aim at instead is a key customer outcome, the result the customer wants in the customer's own terms, paired with a key business outcome that follows from it.\n\n**Disputed by:** The view that shipping what customers ask for, on time, is what a product organization is for, and that outcomes are too slow and too indirect to manage by.\n\n**So what:** A leader reviews work against the outcome it was meant to move and treats a shipped feature that moved nothing as a cost.\n\n**How and why:** Output is easy to count and under the team's control, so it becomes the measure, and then the goal. Customers pay and stay for a result, so business results trail customer outcomes; aiming at the trailing number first produces extraction without value.\n\n**Supporting claims**\n\n- **S1** — An organization that measures itself by what it ships can deliver everything it promised and leave its customers no better off, because output is easy to count and under the organization's control, so it becomes first the measure and then the goal.\n- **S2** — Build What Matters catalogues the resulting failures as ten dysfunctions under three themes, and a described organization can be diagnosed by asking what decides what gets built and what counts there as success.\n- **S3** — What to aim at instead is a key customer outcome, the result the customer wants in the customer's own terms with a measure of the customer's success, paired with a key business outcome that follows from it; aiming at the business number first produces extraction without value.\n- **S4** — An outcome can be managed by, not only stated: each output goal is rewritten as an outcome with a measure, the key outcome is broken into drivers that move within a quarter, and shipped work is reviewed against the outcome it was meant to move, so that a shipped feature that moved nothing is counted as a cost.\n\n## Role in the part\n\nEstablishes outcome as the unit of progress for the product, the base for the three chapters that follow. Supports P3-1 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in why-output, ten-dysfunctions, key-outcomes, pattern-rewrite, pattern-drivers, pattern-review: each supplies the terms the next uses)\n\nThe reader meets a company that delivered its roadmap and lost customers before any term is defined. The mechanism comes before the catalogue because the catalogue's ten entries are forms of that one mechanism and would otherwise read as ten unrelated complaints. The two outcomes then say what to aim at; if they came before the dysfunctions, the reader would get a remedy for a problem not yet diagnosed. The three patterns are in a forced order: the review is defined against a driver, and a driver is defined for a goal already rewritten as an outcome. Corvane's next year follows the patterns directly; before them, its table would use drivers and reviews that had not been defined. The disagreement between sources and the anti-patterns come after the example because both qualify the remedy without changing it: placed before the example they would stand between the patterns and the case that uses them.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 Corvane shipped forty-one features, thirty-eight of them on the promised date and every one promised to a customer by name, and its renewal rate fell from 93 percent to 87.\n\n**Bridge:** Most readers have worked through a roadmap that was delivered in full, been thanked for it, and seen nothing change for the customers it was built for. → The roadmap was measured by what shipped; the question is what should have been measured instead.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Organizations that ship a great deal still fail their customers when they measure themselves by what they ship. What they should aim at instead is a key customer outcome, the result the customer wants in the customer's own terms, paired with a key business outcome that follows from it.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a company deliver its whole roadmap and lose customers. *Kept in:* scene.\n- Understand why output becomes the goal. *Kept in:* why-output.\n- Know the ten dysfunctions and their three themes, and name the one an organization has. *Kept in:* ten-dysfunctions.\n- Define a key customer outcome and a key business outcome, and tell an outcome metric from a vanity metric. *Kept in:* key-outcomes.\n- Apply three patterns: rewrite the goal, break the outcome into drivers, review shipped work. *Kept in:* pattern-rewrite, pattern-drivers, pattern-review.\n- Follow Corvane's next year, planned by outcome. *Kept in:* worked-example.\n- Know where the sources disagree and how the remedy fails. *Kept in:* sources-disagree, anti-patterns.\n- See what AI changes. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 Corvane shipped forty-one features, nearly all on time and each promised to a named customer, and its renewal rate fell. | scenario: Ledger: forty-one features in one year of stage 3, each promised to a named customer; the renewal rate fell. New facts: 2024, 180 people; 38 of 41 on time; renewal rate 93 to 87 percent. Corvane is introduced as the fictional company this book follows, with what it sells and how customers pay. |  |\n| p02 | claim | A product organization that measures itself by what it ships can be busy and move its customers nowhere; it should aim at a key customer outcome paired with a key business outcome, and the chapter shows why, how to diagnose the failure and three patterns for the remedy. |  | `problem_solution`: Delivery up, renewals down. → The chapter's claim and its route. |\n\n## Sections\n\n### Setting the Scene: Forty-One Features and a Falling Renewal Rate\n\n**Controlling idea** (`example`, id `scene`): In 2024 Corvane delivered almost every feature it had promised to named customers, on time, and its renewal rate fell; a count at the end of the year showed that most of the features were used by one customer only.\n\n**Advances the thesis** (S1): Gives the case the chapter explains: a full year of delivered output with no customer result behind it.\n\n**Transition in:** `elaboration`: The lead's forty-one features and the falling renewal rate. → How the features got onto the roadmap, how they were delivered and what was found afterwards.\n\n**Order of paragraphs** (`chronological`): The reader sees the roadmap, then the delivery, then the result, then the count made afterwards, in the order Corvane met them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Corvane's 2024 roadmap was a list of features, each with the customer it was promised to and a date, and by the list's own measure the year went well: thirty-eight of forty-one shipped on time. | scenario: Ledger: one year of stage 3, forty-one features each promised to a named customer; the roadmap was a list of features promised to large customers with dates. New facts: the year is 2024, at 180 people with 95 engineers in eleven product teams; the forty-one features were promised to 23 customers; 38 of 41 shipped by the promised date; each row was added by sales or account management during a deal or a renewal conversation. |  |\n| p04 | description | Over the same year the renewal rate fell from 93 percent to 87, and the explanation offered inside Corvane was that customers needed more features, faster. | scenario: New facts: renewal rate (share of customers due for renewal who renewed) 93 percent in 2023, 87 percent in 2024; six of the 23 customers who had been promised a feature and received it did not renew. | `contrast`: A year of promises kept. → The result that the list did not predict, and how the company read it. |\n| p05 | evidence (table) | At the end of 2024 Priya Nambiar counted who used each of the forty-one features: twenty-six were used only by the customer that had asked, eleven by two to ten customers, and four by more than ten. | table: Table, three rows: used only by the customer that asked, 26; used by two to ten customers, 11; used by more than ten customers, 4. Counted by Priya Nambiar, Corvane's first product manager and in 2024 the most senior of its eleven, at the end of 2024. | `sequence`: A falling renewal rate with a full delivery record. → The count made afterwards of who used what was shipped. |\n\n### Why Output Becomes the Goal\n\n**Controlling idea** (`explanation`, id `why-output`): Output becomes the goal because it can be counted and controlled by the people who produce it, and in a company led by its sales contracts every single promise is reasonable when it is made.\n\n**Advances the thesis** (S1): Explains the mechanism behind the scene and defines output and outcome for the product, set apart from chapter 2's use.\n\n**Transition in:** `cause_effect`: A year of delivered features, most used by one customer. → Why capable people run a company that way.\n\n**Order of paragraphs** (`prerequisite_order`): The two words are defined first, then the general mechanism that uses them, then the special form the mechanism took at Corvane.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | For a product, output is what the organization ships and an outcome is a change in what the customer gets done; chapter 2 used the same two words for a change to the organization, where the user was a team and the output a finished reorganization. | source: Chapter 2, The Organization as a Product: output and outcome of an organizational change, defined there with teams as users. Here the object is the product and the user is the customer. Linked as [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html). |  |\n| p07 | explanation | Output becomes the measure because it is easy to count and under the team's control, and a measure that is reviewed every week becomes the goal; Perri calls the result the build trap. | quotation: Melissa Perri, Escaping the Build Trap: 'The build trap is when organizations become stuck measuring their success by outputs rather than outcomes.'; reasoning: A team can promise a ship date and keep it by its own effort; whether a customer's work changes depends on the customer and shows up later. Reviews ask for what can be answered on the day. | `cause_effect`: The two terms. → Why the first replaces the second as the thing people aim at. |\n| p08 | explanation | Corvane's form of the trap is the sales-led company: Build What Matters contrasts a product-driven company, which builds one solution for a market, with a sales- or services-driven one, which says yes to one customer at a time, and each yes is rational for the person who gives it. | source: Foster and Nerlikar, Build What Matters: the product-driven company addresses a customer's need through a solution applicable to the broader market; 'While a sales- or services-driven company succeeds by saying yes to a specific customer, a product-driven company often succeeds by saying no.'; quotation: Perri: 'Sales-led companies let their contracts define their product strategy.' | `example`: Output as the goal in general. → The specific form it took at Corvane, and why each promise was reasonable. |\n\n### Ten Dysfunctions, Three Themes\n\n**Controlling idea** (`explanation`, id `ten-dysfunctions`): Build What Matters lists ten recurring dysfunctions of product management under three themes, and two questions, what decides what gets built and what counts as success, are enough to name the one a described organization has.\n\n**Advances the thesis** (S2): Supplies the catalogue the thesis refers to and a way to diagnose with it.\n\n**Transition in:** `elaboration`: The build trap and the sales-led company as two names for one failure. → The fuller catalogue of ten, of which those are two entries.\n\n**Order of paragraphs** (`large_to_small`): The whole list first, then its grouping into three themes, then the two questions that pick one entry for one organization.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | description (table) | The ten dysfunctions each have a name, the authors' one-line description and a sign you can observe from outside the team. | table: Table of the ten: Hamster Wheel (output over outcomes), Counting House (obsession with internal metrics), Ivory Tower (lack of customer research), Science Lab (optimization to the exclusion of everything else), Feature Factory (an assembly line of features), Business School (overdependence on data and spreadsheets), Roller Coaster (fast-paced twists and turns), Bridge to Nowhere (overengineering for future unknowns), Negotiating Table (trying to keep everyone happy), Throne Room (whipsaw decision-making from the person in charge). Names and descriptions are the authors' self-assessment list; the column of observable signs and the theme column are the author's. |  |\n| p10 | explanation | The authors reduce the ten to three themes: internal focus that draws attention from customer value, a team too busy playing defense (answering requests and complaints) or with too little authority to innovate, and a wish for short-term measurable business results that lets only superficial changes through; which dysfunction falls under which theme is this book's assignment. | source: Build What Matters, the three themes, paraphrased from the authors' statement. The author's notes do not record a mapping of each dysfunction to a theme, so the assignment in the table's last column is marked as the author's. | `elaboration`: Ten names. → The three themes behind them and who assigned which. |\n| p11 | analysis | Two questions name the dysfunction of a described organization: what decides what gets built, and what counts there as success; at Corvane the answers are a customer's request and the ship date, which is the Feature Factory run on a Hamster Wheel. | reasoning: Requests decide and shipping counts: Feature Factory. Dates count regardless of who decided: Hamster Wheel. An internal number counts: Counting House. The person in charge decides: Throne Room. Whoever objects decides: Negotiating Table. The two failure patterns of this book that the chapter addresses, the Feature Factory and the Output Scoreboard, are the first two seen as a decision right and as an incentive. | `example`: Three themes. → A way to pick the entry for one organization, applied to Corvane. |\n\n### What to Aim At: A Key Customer Outcome, Then a Key Business Outcome\n\n**Controlling idea** (`definition`, id `key-outcomes`): The alternative to counting output is a key customer outcome, stated in the customer's terms and measured by the customer's success, paired with a key business outcome that follows from it.\n\n**Advances the thesis** (S3): Defines the two outcomes, argues their order and separates an outcome metric from a vanity metric.\n\n**Transition in:** `problem_solution`: Ten ways of aiming at the wrong thing. → The thing to aim at.\n\n**Order of paragraphs** (`prerequisite_order`): The customer outcome is defined first because the business outcome is defined as following from it, and the test for a metric needs both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | A key customer outcome is the result the customer wants, in the customer's own words, which the authors call the metric of progress; Corvane's customers wanted jobs finished on the first visit inside the promised time window. | source: Build What Matters: key customer outcome, 'metric of progress' for knowing whether the product is delivering value.; scenario: New facts: Priya Nambiar asked planners at customers that had left what they had bought Corvane for; none named a feature; they wanted the technician to arrive in the promised window and finish the job on the first visit. Corvane's key customer outcome: jobs completed on the first visit inside the promised window; measure: share of a customer's jobs that meet both conditions, computed from job data Corvane already holds; median customer at the end of 2024: 71 percent. |  |\n| p13 | explanation | The key business outcome is the one business result the leadership agrees to optimize for, at Corvane the renewal rate, and it comes second because customers give value back only for value received: work that delivers value creates the opportunity, and work that only extracts value uses it up. | source: Build What Matters: product work either delivers value to customers or extracts value based on value delivered; 'providing customer value is what creates the opportunity to produce sustainable financial outcomes for the company, not the other way around.' Two reasons the authors give for aiming at the business number first: internal results are easier to measure than customer value, and companies do not notice the trade-off.; scenario: New facts: Corvane's key business outcome is the renewal rate. In its 2024 data, customers above 80 percent first-visit completion renewed at 97 percent and customers below 60 percent at 72 percent. | `sequence`: The customer's outcome. → The business outcome that follows from it, and why it comes second. |\n| p14 | comparison (table) | An outcome metric measures the customer's success and a vanity metric measures the company's activity, and three questions tell them apart. | table: Table, three tests with a metric that passes and one that fails: whose result does it measure (first-visit completion / monthly active users); would it still matter if the product were redesigned (jobs done in the window / clicks on the schedule board); would a customer pay, renew or switch for it (fewer second visits / features adopted). The tests come from the author's working checklist on the key-outcomes chapter of Build What Matters; the Counting House names the failure. | `contrast`: Two outcomes with a measure each. → What separates such a measure from a number that only looks like one. |\n\n### Pattern: Rewrite the Goal as an Outcome\n\n**Controlling idea** (`process`, id `pattern-rewrite`): An output goal is rewritten as an outcome by stating who can do what afterwards, with a measure, its value today, a target and a date.\n\n**Advances the thesis** (S4): First of three patterns that make an outcome something a team can be given and judged by.\n\n**Transition in:** `sequence`: A key outcome and a test for its metric. → How a single team's goal is restated in those terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | process | The pattern is for the leader who sets a team's goal and the team that receives it; the goal names a customer, what that customer can do afterwards, one measure, its value today, a target and a date, and the measure of the pattern is the share of goals written that way. | reasoning: Method: ask of the output goal 'so that who can do what?' and repeat until the answer is in the customer's terms and no longer names the feature. User: the leader setting the goal and the team receiving it. Outcome measure: share of a quarter's team goals that carry customer, result, measure, baseline, target and date. The author's method, built on the key outcome of Build What Matters. |  |\n| p16 | example (table) | Three rows of Corvane's roadmap show the rewrite: each feature with a date becomes a result for planners, technicians or end customers, with a number. | table: Table, three rows, columns: output goal as it stood on the roadmap, the goal rewritten, the measure. (1) Bulk reassignment of jobs for a telecom installer by 30 April -> planners replan a disrupted day inside Corvane: disrupted jobs reassigned in the product within 15 minutes, from 34 to 70 percent by the end of 2025. (2) Stock connector for a heating company by June -> technicians arrive with the part: jobs needing a second visit for a missing part, from 14 to 7 percent. (3) SMS notification to end customers by the second quarter -> the end customer is at home when the technician arrives: visits with nobody home, from 9 to 5 percent. | `example`: The form. → Three goals from Corvane's roadmap, before and after. |\n| p17 | analysis | A rewritten goal no longer names the feature, so the feature becomes one candidate solution among several and can be judged; who chooses among them is the subject of a later chapter. | reasoning: The bulk-reassignment feature may or may not be the best way to get disrupted jobs replanned in fifteen minutes; under the output goal the question could not be asked. Link to [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html) for who decides the solution. | `cause_effect`: Goals without a named feature. → What becomes possible once the feature is not the goal. |\n\n### Pattern: Break the Outcome into Drivers\n\n**Controlling idea** (`refutation`, id `pattern-drivers`): The objection that outcomes are too slow and too indirect to manage by is answered by breaking the key outcome into drivers and leading indicators that a team can move within a quarter.\n\n**Advances the thesis** (S4): Meets the view the thesis is disputed by and gives the second pattern.\n\n**Transition in:** `contrast`: Goals rewritten as outcomes. → The strongest objection to managing by them: a renewal rate moves once a year.\n\n**Order of paragraphs** (`problem_solution`): The objection is stated at full strength first, the pyramid answers it, and the comparison of measures then shows what each kind is good for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | counterargument | The objection is that outcomes are too slow and too indirect to manage by, and it is right about the top-level numbers: a renewal rate moves once a year and for many reasons. | reasoning: A team cannot be steered by a number that arrives after the work is done and that sales, pricing and the market also move. The thesis's disputed_by view, stated fairly. |  |\n| p19 | process (figure) | For the product leaders who set team goals, an outcome pyramid puts the key outcome at the top and under it the drivers that produce it, each with a leading indicator a team can move in weeks and each naming the business outcome expected to follow; it works when every team goal names a driver. | figure: Mermaid flowchart BT: three driver nodes ('The plan survives the day: disrupted jobs replanned within 15 minutes', 'The technician has the part: second visits for a missing part', 'Someone is home: visits with nobody home') -> 'Key customer outcome: jobs done on the first visit, inside the promised window' -> 'Key business outcome: renewal rate'. Caption states that teams move the drivers, the drivers move the customer outcome, and the business outcome follows.; source: The outcome pyramid (key outcome, drivers, leading and lagging indicators), from the author's working checklist on the key-outcomes chapter of Build What Matters; the authors speak of breaking the key outcome down into specific areas of value creation. User: product leaders setting team goals. Outcome measure: share of team goals and roadmap items that name the driver they are meant to move. | `problem_solution`: Top-level outcomes that move too slowly to steer by. → The pyramid of drivers that move within a quarter. |\n| p20 | comparison (table) | Four kinds of measure differ in how soon they move, who controls them and what they can tell you, and the driver is the one a team can be managed by. | table: Table, four rows (output count, driver or leading indicator, key customer outcome, key business outcome), columns: how soon it moves, who controls it, what it tells you. Output: days, the team, that work was done. Driver: weeks, mostly the team, whether the work changed what customers do. Key customer outcome: quarters, the product organization, whether customers get the result. Key business outcome: a year, the whole company and the market, whether the result was worth paying for. The author's comparison. | `elaboration`: The pyramid's levels. → The levels compared with output on speed, control and meaning. |\n\n### Pattern: Review Shipped Work Against Its Outcome\n\n**Controlling idea** (`process`, id `pattern-review`): Shipped work is reviewed against the driver it was meant to move, and work that moved nothing is treated as a cost to be changed or removed.\n\n**Advances the thesis** (S4): Third pattern; carries the thesis's so-what, that a shipped feature which moved nothing is a cost.\n\n**Transition in:** `sequence`: Drivers a team can move within a quarter. → What happens to shipped work that did not move its driver, and the review that checks.\n\n**Order of paragraphs** (`problem_solution`): The cost of unmoved output is the reason the review exists, so it comes first, as the objection comes first in the previous pattern.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | A shipped feature that moved nothing is a cost: it has to be tested, supported and explained at every release, and it makes the product harder to use for everyone it was not built for. | reasoning: The author's judgement, stated as such: each feature in a product is carried by every later change. The claim is not from a named source. |  |\n| p22 | process | The outcome review is for the leader who reviews a team's work: a fixed time after release it asks what the driver did, and it ends in one of three decisions, keep, change or remove; its measure is the share of shipped items that got such a review. | reasoning: The review is dated when the goal is set, typically one to two quarters after release; it asks for the driver's value before and after, and who uses the feature. User: the leader who reviews a team's work. Outcome measure: share of shipped items reviewed against their driver on the date set, and the number changed or removed as a result. The author's recommendation; the review of whether shipped work created customer value is an item in the author's checklist on Build What Matters. | `problem_solution`: Unmoved output as a cost that a feature count records as an achievement. → The review that finds it and decides what to do with it. |\n\n### Worked Example: Corvane's 2025, Planned by Outcome\n\n**Controlling idea** (`example`, id `worked-example`): In 2025 Corvane replaced its list of promises with one key customer outcome and three drivers, shipped fewer than half as many features, and saw the customer outcome and the renewal rate rise, with one driver that did not move.\n\n**Advances the thesis** (S3, S4): Runs the three patterns on the scene's case and reports the result against stated targets, including a miss.\n\n**Transition in:** `example`: Three patterns. → The same company's next year, run on them.\n\n**Order of paragraphs** (`chronological`): The plan for 2025, then the result at the end of the year, then what the result left open.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | description | For 2025 Priya Nambiar put one key customer outcome, three drivers and a review date in place of the list as the teams' goals, and Corvane kept only the five open promises that were written into contracts. | scenario: New facts: 2025, Corvane growing from 180 toward 500 people. Seventeen promises were open at the end of 2024; the five written into contracts were kept; for the other twelve, Corvane went back to the customer with the driver it would work on instead. Each product team's goal named a driver (the three in the figure). Review dates were set with the goals. |  |\n| p24 | evidence (table) | At the end of 2025 two drivers and the key customer outcome had moved toward their targets without reaching them, the renewal rate had risen, and one driver had not moved. | table: Table, columns: measure, end of 2024, end of 2025, target. Features shipped: 41, 19, no target. Disrupted jobs replanned in the product within 15 minutes: 34, 61, 70 percent. Second visits for a missing part: 14, 9, 7 percent. Visits with nobody home: 9, 8, 5 percent. First-visit completion in window, median customer: 71, 78, 85 percent by the end of 2026. Renewal rate: 87, 91 percent, no target stated in the chapter. | `sequence`: The plan. → The numbers a year later. |\n| p25 | analysis | The driver that did not move was the review's most useful finding: the SMS notification had shipped on time, visits with nobody home stayed at about one in twelve, and the review changed the approach instead of counting the feature as done. | scenario: New facts: the SMS notification to end customers shipped in the second quarter of 2025; visits with nobody home went from 9 to 8 percent; at the review the Notifications team's goal was kept and the solution reopened. Nine of the twenty-six single-customer features of 2024 were removed in 2025 with their customers' agreement. | `emphasis`: A table with one flat row. → What the flat row was worth. |\n| p26 | analysis | The result left one question open at Corvane: it had chosen three drivers out of many, from one round of conversations with customers who had left, and nothing yet said why these three or in what order. | reasoning: The drivers were chosen from exit conversations at the end of a bad year. A different set of conversations would have produced a different set. An outcome says what progress is measured in; it does not order the problems. | `contrast`: A year that went better. → What it did not settle. |\n\n### Where the Sources Disagree: Which Outcome Leads\n\n**Controlling idea** (`comparison`, id `sources-disagree`): Perri ties every initiative back to business value and Foster and Nerlikar put the customer outcome first; the two answer different questions, and this book aims at the customer outcome and accounts in the business outcome.\n\n**Advances the thesis** (S3): Tests the claim that the customer outcome comes first against a source that starts from the business side.\n\n**Transition in:** `contrast`: Corvane's choice to lead with a customer outcome. → A source that starts from the business outcome.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | comparison | In the passages the author marked, Perri starts from the business: a product-led company optimizes for its business outcomes and every feature should result in an outcome tied back to business value, while Foster and Nerlikar warn against exactly that focus as the Counting House. | source: Perri: 'Product-led companies optimize for their business outcomes, align their product strategy to these goals'; every feature and initiative should result in some outcome tied back to business value. Build What Matters: most internal metrics are trailing indicators of a product's success and should not be the primary focus; the Counting House. The author's notes on Perri are partial, and the text says so. |  |\n| p28 | synthesis | The two are answering different questions, what work must connect to and what to aim at first, which is why the pyramid aims at the customer outcome and has each driver name the business outcome expected to follow. | reasoning: Perri's rule guards against customer outcomes nobody will pay for; Foster and Nerlikar's order guards against extracting value that was never delivered. The author's resolution, with its condition: where a customer outcome has no path to a business outcome, the work is a gift and should be chosen as one. | `conclusion_summary`: Two starting points. → The book's resolution and its condition. |\n\n### Anti-Patterns: The Relabeled Feature and the Counted Click\n\n**Controlling idea** (`analysis`, id `anti-patterns`): The remedy fails in two ways: features are relabeled as outcomes, and a number of the company's own activity is adopted as the outcome.\n\n**Advances the thesis** (S1, S3): Shows how output-counting survives the adoption of outcome vocabulary.\n\n**Transition in:** `additional_support`: A resolved disagreement about which outcome leads. → Two ways the practice fails even when the order is right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | example | The relabeled feature is an output goal with the word outcome on it: 'launch the customer portal' moved to a column headed Outcomes, with a date as its only measure, which keeps the Feature Factory and the Output Scoreboard in place under a new name. | reasoning: Test: an outcome goal that would be met by shipping, whether or not anyone's work changed, is an output goal. The author's observation, without named employers. Failure patterns: the Feature Factory and the Output Scoreboard. |  |\n| p30 | example | The counted click is a vanity metric adopted as the key outcome, the Counting House again: the number rises, the team is praised, and no customer is better off; pursued hard enough it becomes extraction. | source: Build What Matters: the Counting House; delivering versus extracting value. Applies the three tests of the key-outcomes section. | `additional_support`: A feature called an outcome. → An activity number called an outcome. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI makes output cheaper, which strengthens the pull toward counting it and moves the scarce step from building a feature to knowing whether it moved an outcome.\n\n**Advances the thesis** (S1, S4): Applies the chapter's mechanism to cheaper production, with labeled claims.\n\n**Transition in:** `additional_support`: Ways of counting output under another name. → A force that makes output cheaper to produce: AI.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | analysis | Emerging: where coding agents shorten the time to build a feature, the engineering cost that used to limit a feature factory weakens, so a promise to one customer is easier to make and the list grows faster. | reasoning: Opens with the label scheme sentence. Author's observation as of November 2026, labeled Emerging, not a measured result. No Proven claim is made in this section; published evidence is weighed in Part XI. |  |\n| p32 | claim | Speculative: when building is cheap the scarce step becomes verifying that a shipped feature moved its driver, so the outcome review and not delivery sets the pace of a product organization. | reasoning: Labeled Speculative; follows from the argument of [[where-the-constraint-moves]]. It would be confirmed where organizations using agents report features shipped per quarter rising while their customer outcome measures stay flat, and where the wait for an outcome review exceeds the time to build. | `cause_effect`: More features, sooner. → Where the scarce step goes when building is cheap. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The dysfunctions and the key outcomes are one argument seen from two sides: every dysfunction is a way of letting something other than the customer's result decide what gets built or count as success, and the three patterns put that result back into the goal, the plan and the review.\n\n**So what:** A leader reviews work against the outcome it was meant to move, asks of every goal who can do what afterwards, and treats a shipped feature that moved nothing as a cost.\n\n**Callback:** The forty-one features shipped in 2024 while the renewal rate fell. The reader can now say what the forty-one were: output with no outcome above it, twenty-six of them used by one customer each.\n\n**Takeaway** (`course_of_action`): Take the list of what your organization shipped last quarter and write next to each item the outcome it was meant to move and what that measure did. The checklist gives the steps.\n\n**Hand-off** to [Vision and Product Strategy](vision-and-product-strategy.html): `problem_solution`: Outcomes as the unit of progress, which leaves open which outcomes and in what order. → A vision of the customer's future and a strategy that works backward from it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | synthesis (list) | Established: success in product work is measured by outcomes and not outputs, customer value precedes business value, and output-driven organizations fail in recurring, nameable ways. |  |  |\n| p34 | synthesis (list) | Depends on context: how far a company can refuse single-customer work depends on its market and its contracts, and how soon a driver can show movement depends on how often customers use the product. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p35 | synthesis (list) | The author's synthesis: every dysfunction lets something other than the customer's result decide what gets built or count as success, and the three patterns put that result back into the goal, the plan and the review; the two diagnostic questions, the assignment of dysfunctions to themes, the six-part goal and the outcome review are this book's own. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p36 | recommendation (list) | Eight checks let the reader test their own roadmap and goals for output dressed as outcome. |  | `sequence`: What to take away. → What to do with it. |\n| p37 | transition | Outcomes as the unit of progress leave open which outcomes to pursue and in what order, and the answer is a vision of the customer's future with a strategy that works backward from it. |  | `problem_solution`: The forty-one features, now readable as output with no outcome above it, and outcomes as the unit of progress. → The open problem of which outcomes and in what order, which a vision and a strategy solve. |\n\n## Non-goals\n\n- Output and outcome of an organizational change, and the five Build What Matters dysfunctions read as organization-design failures See [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- The customer journey vision, the 10x outcome as an ambition for the vision, and product strategy See [Vision and Product Strategy](vision-and-product-strategy.html).\n- What a roadmap commits to, and the balance of innovation, iteration and operation See [Roadmaps and Horizons](roadmaps-and-horizons.html).\n- Who decides the solution; discovery methods; product operations See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- Team objectives and OKRs as a planning instrument See [Planning](../grounded-engineering-executive/planning.html).\n- Engineering delivery metrics See [[measuring-engineering]].\n- Evidence on what AI does to the constraint See [[where-the-constraint-moves]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts to confirm: the year of the forty-one features (2024); 23 named customers; 38 of 41 on time; renewal rate 93 to 87 to 91 percent; the usage count 26/11/4; the key customer outcome (first-visit completion inside the promised window) and its numbers; the three drivers; seventeen open promises of which five contractual; nineteen features in 2025; nine single-customer features removed. Chapters 10 to 12 have to agree with these.\n- The assignment of each dysfunction to one of the three themes is the author's: the Kindle notes record the three themes but not a mapping. Check against the book.\n- The outcome pyramid and the vanity-metric tests are taken from the author's checklist on the key-outcomes chapter, not from the Kindle notes, which do not contain the words pyramid or vanity. Confirm the attribution to Build What Matters.\n- The section on where the sources disagree rests on a partial set of notes on Perri and says so; confirm that the reading is fair to the book.\n- The 10x outcome is left to chapter 10. The AI section makes no Proven claim.\n- Priya Nambiar is described as the most senior of eleven product managers in 2024; the ledger gives her as first product manager (2020) and CPO from 2025.\n\n## Decision log\n\n- **2026-11-19** — The count of who used the forty-one features is shown in the scene, as a table without commentary, and the worked example is Corvane's following year. The patterns can then use Corvane's outcome and drivers as running examples without judging a case not yet shown. Rejected: A single worked example at the end holding both the count and the remedy, which would have made the pattern sections abstract\n- **2026-11-19** — The worked example comes directly after the three patterns and before the sources' disagreement, the anti-patterns and the AI section, so that nothing stands between the patterns and the case that uses them. Rejected: The style guide's default order with the worked example after What AI Changes Here\n- **2026-11-19** — The objection that outcomes are too slow and indirect is placed inside the pattern that answers it (drivers), not in a separate trade-offs section; the comparison table of four measures is the chapter's trade-off table.\n- **2026-11-19** — Chapter 2's table of five dysfunctions in organization design is not repeated; the chapter gives all ten for the product and states the difference of object in one paragraph. Rejected: A column mapping each dysfunction to its organization-design form\n- **2026-11-19** — One Corvane case and one lens: the forty-one features read as output against one key customer outcome. The Launch Queue and lead time are left out although they fall in the same year.\n- **2026-11-19** — No Proven AI claim: the section rests on a labeled observation and a labeled speculation and leaves published evidence to Part XI. Rejected: Citing a survey not fetched and read for this chapter\n- **2026-11-19** — After the flow rubric (sound with notes): the rule that each driver names the business outcome expected to follow moved from the sources' disagreement into the drivers pattern, so the worked example shows the whole remedy; in the review pattern the cost of unmoved output now comes before the review; Corvane's business outcome is named where the business outcome is defined; the worked example's open question is kept specific to Corvane; the flow rationale states what breaks under each alternative order. Rejected: Leaving the rule in the section on the sources, which amended the remedy after the example\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-product-management/posts/dysfunctions and outcomes (index.md and checklist.md); _input/checklists/data/data.json (Build What Matters: Product Dysfunctions, Key Outcomes) — The author's working checklists: the outcome pyramid, the tests for an outcome metric, the review of shipped work, the dysfunction self-assessment.\n  - _research/scenario-ledger.md — The forty-one features, the roadmap of promises, Corvane's stage 3 and cast.\n  - journal-spec.json, entries outcomes-over-output, part-3 and vision-and-product-strategy (transition_in) — Intent, acceptance criteria, thesis and role, copied unchanged; the hand-off.\n- **External**\n  - Ben Foster and Rajesh Nerlikar, Build What Matters: Delivering Key Outcomes with Vision-Led Product Management (2020); author's notes, _input/bookshelf/docs/notes/build-what-matters.pdf — The ten dysfunctions and three themes; product-driven versus sales- or services-driven; key customer outcome and key business outcome; delivering versus extracting value; internal metrics as trailing indicators.\n  - Melissa Perri, Escaping the Build Trap (2018); author's notes, _input/bookshelf/docs/notes/build-trap.pdf — The build trap; sales-led companies; business value as what every initiative ties back to.\n\n## Changelog\n\n- **2026-11-19** — Revised after the flow rubric: review pattern reordered (cost, then review) with its transitions rewritten; driver rule moved into the drivers pattern; four controlling ideas and the flow rationale sharpened. Status set to accepted in auto mode.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>

            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
