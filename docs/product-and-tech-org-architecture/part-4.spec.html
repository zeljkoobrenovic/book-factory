criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** How does an engineering organization decide how to build, and keep what it builds changeable and reliable?\n\n> **Claim:** Engineering stays changeable and reliable when recurring decisions are settled once and shared load is removed once: its strategy is written as policies that settle recurring decisions, technical governance acts through advice and nudges, with few mandates and those enforced as guardrails, platforms are funded as products that remove load from stream-aligned teams, quality is owned by the teams that ship, and debt is retired through finished migrations.\n\n**Disputed by:** The view that engineering quality comes from strong engineers and a strong architect deciding centrally, and that strategy documents, governance instruments and platform products are overhead a good team does not need.\n\n**So what:** A leader spends effort on the decisions that recur and on the load every team carries, and can show the business what each engineering investment takes off product teams.\n\n**How and why:** Most engineering waste is the same decision made differently in ten places, and the same mechanics rebuilt by ten teams. A policy settles the first once; a platform removes the second; and both work only if they are judged by the teams they serve and enforced no harder than the cost of divergence warrants.\n\n**Supporting claims**\n\n- **P4-1** — An engineering strategy is a diagnosis and a small set of policies that settle recurring decisions, and it takes the product strategy as an input.\n- **P4-2** — Technical direction is best governed by advice and nudges, with taxes for choices that put costs on other teams and mandates reserved for the few risks a team cannot carry, enforced as automated guardrails where they can be checked, and with decisions recorded.\n- **P4-3** — A platform is funded and judged as a product whose users are the stream-aligned teams, and developer experience is its outcome measure.\n- **P4-4** — Quality and reliability are owned by the teams that ship and operate, with checks placed in the delivery path and specialists enabling, not gating.\n- **P4-5** — Technical debt at scale is retired by migrations that are derisked, enabled and finished, and their cost belongs in planning.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in five-parts and the chapter list in the closing: strategy, then governance, then platform, then quality, then migrations)\n\nThe page opens on a landscape of reasonable local choices that nobody would have designed, and on the question of which decisions should be made once. The first section names the two repeated costs behind such a landscape and the one remedy for each, with the limits on both; the second gives the five parts of the engineering model that apply those remedies and says why they come in that order; the chapter list closes the page. The two costs stand before the five parts because each part is justified by a cost it removes; put the parts first and strategy, governance and platform arrive as overhead with no stated reason. The list comes last because a reader can choose a chapter only after seeing what each decides.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At Corvane in 2026, about thirty teams ran four ways of deploying, three message brokers and two identity libraries, and each of those choices had been reasonable when it was made.\n\n**Bridge:** The reader's experience of reasonable local choices that add up to a landscape nobody would have designed. → The question that experience raises and that the usual answers (standardize by decree, or accept the variety as the price of autonomy) skip: which decisions should be made once.\n\n**Thesis statement** (KEY POINTS and paragraph p03): Part IV argues that engineering stays changeable and reliable when recurring decisions are settled once and shared load is removed once: a strategy written as policies, governance that works through advice and guardrails with few mandates, platforms funded as products, quality owned by the teams that ship, and debt retired through finished migrations.\n\n**Roadmap** (paragraph p03):\n\n- The two repeated costs behind such a landscape, and the remedy for each. *Kept in:* decide-once-remove-once.\n- The five parts of the engineering model and why they come in that order; five chapters answer five questions in order: what an engineering strategy is, who decides technical direction and with how much force, how a platform is funded, run and judged as a product, who owns quality and reliability, and how technical debt is retired. *Kept in:* five-parts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2026 Corvane's thirty or so teams ran four ways of deploying, three message brokers and two identity libraries, and each of those choices had been reasonable when it was made. | scenario: Corvane (fictional): in 2026, at about 500 people, its thirty or so teams ran four ways of deploying, three message brokers and two identity libraries, each choice reasonable when made. |  |\n| p02 | context | A landscape of reasonable local choices is usually met by standardizing by decree or by accepting the variety as the price of autonomy, and the question both answers skip is which decisions should be made once; the cost, in differences to learn and in mechanics built and maintained several times over, appears only across teams. | reasoning: Each choice was right for the team that made it; the cost appears only across teams, as differences every engineer has to learn and as mechanics (four ways of deploying) built and maintained several times, where no team's decision could see it. | `problem_solution`: Corvane's four ways of deploying, three brokers and two libraries. → The reader's own version of that landscape, and the question that explains it. |\n| p03 | claim | Part IV argues that engineering stays changeable and reliable when recurring decisions are settled once and shared load is removed once, and it makes the argument in five chapters that answer five questions in order. |  | `elaboration`: The question of which decisions should be made once. → The part's claim, which answers it, and the five questions its chapters take in turn. |\n\n## Sections\n\n### Decide Once, Remove Once\n\n**Controlling idea** (`claim`, id `decide-once-remove-once`): Most engineering waste is the same decision made differently in many places and the same mechanics rebuilt by many teams; a policy settles the first once and a platform removes the second once, and both work only if they are judged by the teams they serve and enforced no harder than the cost of divergence warrants.\n\n**Advances the thesis** (P4-1, P4-2, P4-3, P4-4, P4-5): States the reasoning from which the part derives its five parts.\n\n**Transition in:** `cause_effect`: The part's claim as stated in the lead. → The reasoning that produces it: two repeated costs, each with one remedy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | claim | Most engineering waste is one of two repeated costs, the same decision made differently in many places and the same mechanics rebuilt by many teams; a policy settles the first once and a platform removes the second once. | reasoning: Most engineering waste is the same decision made differently in ten places, and the same mechanics rebuilt by ten teams. A policy settles the first once; a platform removes the second. |  |\n| p05 | explanation | A policy and a platform work only if they are judged by the teams they serve and enforced no harder than the cost of divergence warrants; deciding where a decision sits is the book's system-design lens and judging by the users is its product-thinking lens. | reasoning: Both remedies exist for the teams that deliver; a rule enforced harder than the divergence costs, or a platform nobody chose to use, adds a cost of its own. | `contrast`: A policy and a platform as the two remedies. → The limits within which either one works. |\n\n### Five Parts of One Engineering Model\n\n**Controlling idea** (`explanation`, id `five-parts`): The engineering model has five parts (a strategy of policies, governance that applies them, a platform that embodies them, quality owned by the teams, and migrations that change the landscape), and they come in the order in which each depends on the one before.\n\n**Advances the thesis** (P4-1, P4-2, P4-3, P4-4, P4-5): One list item per supporting claim, then the order.\n\n**Transition in:** `example`: Deciding once and removing once, within their limits. → The five parts of the model that do the deciding and the removing, one per chapter.\n\n**Order of paragraphs** (`prerequisite_order`): Strategy comes first because governance enforces its policies, platforms embody them and quality practices apply them; migrations come last because they are how any of the four is changed once it exists. The paragraph on the order closes the section because the dependency can be stated only once all five parts have been met; put platforms before strategy and the platform is a product with no stated reason to exist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition (list) | The model has five parts, of which the first two decide once, the third removes once and the fourth keeps what was decided in force in daily work and the fifth changes it: a strategy that is a diagnosis and a few policies; governance by advice, nudges and guardrails with few mandates and recorded decisions; a platform funded and judged as a product whose users are the stream-aligned teams; quality and reliability owned by the teams that ship; and technical debt retired by migrations that are finished. | source: Engineering strategy as diagnosis and policies (Will Larson, The Engineering Executive's Primer, 2024); migrations as the scalable fix for technical debt, in three phases (Will Larson, An Elegant Puzzle, 2019); nudges, taxes and mandates (the author's Grounded Architecture). |  |\n| p07 | explanation | The five parts come in prerequisite order, strategy first because the next three apply, build in and use its policies and migrations last because they change any of the four; every chapter carries both lenses, and the first is where the engineering model takes the product strategy of Part III as its input. | reasoning: Governance enforces the strategy's policies, platforms embody them and quality practices apply them; migrations are how any of the four is changed; a platform before a strategy is a product with no stated reason to exist. The strategy takes the product strategy of Part III as an input. | `cause_effect`: The five parts of the model. → The one direction in which they depend on each other, and where the book's two lenses appear in them. |\n\n## Conclusion: Chapters in this part\n\n**Synthesis:** Read in order, the five chapters follow a technical decision through its life in the same order in which the parts depend on each other: where it is made, how it is applied across teams, how it is built in as the easy way, how it is kept in force in daily work, and how it is changed.\n\n**So what:** A leader spends effort on the decisions that recur and on the load every team carries, and can show the business what each engineering investment takes off product teams.\n\n**Callback:** Corvane's four ways of deploying, three message brokers and two identity libraries from the opening (p01). The closing reads the landscape against the lead's question: nobody at Corvane had asked which of those choices should be made once, so each team answered for itself, which is why every choice could be reasonable and the sum could not.\n\n**Takeaway** (`course_of_action`): Read the chapters in order; with one question about how engineering is run in hand, open the chapter that answers it.\n\n**Hand-off** to [Engineering Strategy](engineering-strategy.html): `example`: The part's claim that recurring decisions should be settled as policy. → What a strategy made of such policies looks like and how it is written.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | description (list) | Each of the five chapters answers one question, in this order: what an engineering strategy is, who decides technical direction and with how much force, how a platform is funded, run and judged as a product, who owns quality and reliability, and how technical debt is retired. |  |  |\n| p09 | synthesis | The five chapters follow a technical decision from where it is made to how it is changed; at Corvane nobody had asked which choices should be made once, so each team answered for itself; a leader who has the five answers spends effort on the decisions that recur and the load every team carries and can show the business what each engineering investment takes off product teams, and the first chapter starts with what a strategy made of policies looks like. |  | `conclusion_summary`: The five chapters and their questions. → What they add up to for Corvane's landscape and for the reader, and the first chapter. |\n\n## Non-goals\n\n- Teaching any chapter's content: strategy, governance instruments, platform practice, quality ownership and migration phases are named and glossed, not argued. See [Engineering Strategy](engineering-strategy.html), [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html), [Platforms and Developer Experience](platforms-and-developer-experience.html), [Quality and Reliability as Operating Model](quality-and-reliability.html), [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- The reading of Corvane's four deployment paths as a missing policy, a missing paved path and three unfinished migrations; that is the part's closing. See [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- When a platform team is justified. See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- The staff-plus roles on which governance relies. See [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html).\n- What AI changes; part introductions carry no AI section.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The ledger gives 'eleven teams' for 2025 (Part IV opening, and the 2025 re-cut 'at about 500 people' with 'the other nine product teams'), and elsewhere 'about thirty teams' at 500 people. The page says 'eleven product teams' and 'about 500 people' and leaves the reconciliation (for example: eleven product teams early in 2025, about thirty teams once the four groups are formed) to the author.\n- The ledger says the 2024 release path was extended to all product teams, and the Part IV opening has four ways of deploying in 2025. The page states the hook and does not explain how the four arose; chapters 13 to 17 should.\n- The journal spec's opening roadmap phrases the third question as 'when a platform earns its cost'; the chapter's question (how a justified platform is funded, run and judged as a product) is the one the page uses, as the post entry's intent does.\n\n## Decision log\n\n- **2026-11-19** — The post entry in the journal spec has a question and no thesis. A part introduction performs the part's opening, so this spec uses the part's thesis and its five supporting claims P4-1 to P4-5 unchanged; they are the part's, not the page's own. Intent outcome, AC-1 and role are copied from the post entry; the hook from the part's opening. Rejected: Writing a separate thesis from the page's question.\n- **2026-11-19** — The page ends with 'Chapters in this part' as its headed conclusion, with two units: the chapter list and one closing paragraph that holds the synthesis, the callback, the so-what and the hand-off to chapter 13. Rejected: A separate reading-order section after the list.\n- **2026-11-19** — The five chapters of Part IV are not written yet, so the page describes them from their journal-spec entries only and names no worked example of theirs. Rejected: Waiting for the chapters: the brief says to rely on the journal spec.\n- **2026-11-19** — The page does not give the part's closing verdict on Corvane's four deployment paths or the closing's 'one loop'; it says only that none of the five questions had been asked when the choices were made. Rejected: Stating the verdict in the introduction: it would spend the part's closing callback.\n- **2026-11-19** — Lessons from the Part I and II introductions applied in the spec: the book's two lenses are carried into the paragraph on the order (p07); only the chapters' questions are counted as 'five questions', the lead's question is called 'the question of which decisions should be made once', and the section's pair is called 'two repeated costs'; the closing paragraph states the part's so-what. The five parts are given as one list (one item per supporting claim) to keep the page near 1,100 words.\n- **2026-11-19** — Flow rubric (one fresh reader, order of ideas only): sound with notes. Taken: the bridge paragraph (p02) now names both costs of the landscape, differences to learn and mechanics maintained several times, so that the lead's 'shared load removed once' has ground before p04; the two lenses are named in p05, where 'judged by the teams they serve' is established, and p07 keeps one sentence saying every chapter carries both; the lead-in to the five parts (p06) says which parts decide once, which removes once and which keep and change the result, so that governance, quality and migrations are tied to the two costs; the closing's 'life of a decision' is stated as the same order as p07's. Rejected: Splitting the closing paragraph (p09) into several units: the page format is one closing paragraph after the chapter list, as in the Part I and II introductions.; Reducing the chapter list further: it already holds only the links and the questions, which AC-1 and the brief require.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After draft-check round 1 (revise: 22 pass, 6 fail, all flow; one corroborated). Spec wording only: 'keep the result true' in p06 and in the conclusion's synthesis becomes 'keeps what was decided in force in daily work', because both flow readers could not say what 'true' meant. Draft fixes: the chapter list and the lead say that chapter 6 (team-types) decides when a platform team is justified (corroborated finding); the two lenses are named before they are used in p05 and each limit is tied to its lens; the section opens by naming what 'those two' are; the sourcing sentence no longer stands between the grouping sentence and the list; the gloss of 'tax' is rewritten; 'paved path', which the audience list promised to gloss, is glossed with the nudge. No change to order or argument.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-4, its post entry part-4, and the entries of engineering-strategy, architecture-governance, platforms-and-developer-experience, quality-and-reliability and migrations-and-technical-debt) — Intent, AC-1 and role (post entry); thesis, supporting claims, flow rationale and opening (part); what each chapter argues; engineering-strategy's transition_in for the hand-off.\n  - _research/scenario-ledger.md — The Corvane facts: the 2025 landscape of four ways of deploying, three message brokers and two identity libraries.\n- **External**\n  - Will Larson, The Engineering Executive's Primer (2024) and An Elegant Puzzle (2019); author's notes under _input/bookshelf/docs/notes/ — Engineering strategy as diagnosis and policies; migrations in three phases; named only.\n\n## Changelog\n\n- **2026-11-19** — Initial spec for the Part IV introduction. (AI-mediated session)\n- **2026-11-19** — Flow rubric notes applied (both costs in the bridge; lenses moved to p05; parts tied to the two costs); status accepted in auto mode. (AI-mediated session)\n- **2026-11-19** — Draft-check round 1: revise (one corroborated flow finding). Wording of p06 and the synthesis clarified; draft revised for round 2. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
