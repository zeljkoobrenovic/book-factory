<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Where quality ownership can sit and what each placement costs.\n- **Know:** The delivery capabilities that Accelerate associates with performance, and the four key measures.\n- **Know:** On-call, incident review and launch readiness as operating practices.\n- **Believe:** A separate team that tests or approves other teams' work becomes a queue and removes ownership from the team that ships.\n- **Believe:** Reliability is a property of how teams own and operate what they build.\n- **Be able to:** Place quality ownership for a given organization and say what specialists should do.\n- **Be able to:** Design an incident review that changes the system.\n- **Be able to:** Recognize a launch gate that has become a bottleneck.\n\n**Audience:** Executives (CTO, CPO, VP, Director) who decide where testers, on-call and release approval sit, and individual contributors who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work day to day: code review, automated tests, deployments, being on call.\n- From earlier chapters: verification as a scarce capacity and the Launch Queue (chapter 5), the four team types including the enabling team (chapter 6), on-call rotation sizes (chapter 8), the platform as a product (chapter 15).\n\n**Does not yet know:**\n\n- delivery path\n- escaped defect\n- change failure rate\n- time to restore\n- enabling team (recalled in one clause)\n- launch readiness\n- separation of duties\n- incident review\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal to create a central QA team, the reader evaluates it and offers the alternative placement with its conditions. *Probe:* Escaped defects are rising, and a VP proposes a central QA team that signs off every release. Using only this chapter: what will that do, and what would you do instead? | `custom` | cold_reader | major |\n| AC-2 | The chapter says what AI changes about verification with labeled claims and points to the agentic delivery chapter. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Who owns quality and reliability, and where do the checks sit?\n\n> **Claim:** Quality and reliability are owned by the teams that ship and operate the software: the checks sit in the delivery path where they run on every change, the team that builds a service carries its on-call, incidents are reviewed to change the system, and quality and reliability specialists work as enabling teams that raise the teams' own practice and do not act as a gate.\n\n**Disputed by:** The separation-of-duties view: a check made by the author of a change is not independent, so independent testers and a release authority are needed, and in regulated settings auditors require them.\n\n**So what:** A leader moves testers into or alongside teams, invests in automated checks, and judges quality by change failure rate and time to restore.\n\n**How and why:** A gate concentrates verification, the scarcest capacity at scale, in one queue, and teaches the building team that quality is someone else's job. Ownership with fast feedback puts the cost of a defect on the people who can prevent the next one.\n\n**Supporting claims**\n\n- **S1** — A separate team that tests or approves other teams' work concentrates verification in one queue and moves ownership of quality away from the team that ships, so of the places ownership can sit it costs the most.\n- **S2** — The checks belong in the delivery path, where they run on every change of the team that made it, and quality specialists work as an enabling team that raises the teams' own practice.\n- **S3** — The team that builds a service carries its on-call, and incidents are reviewed so that each one changes a check, an alert, a runbook or the path.\n- **S4** — Launch readiness is a list the launching team owns and the path checks where it can; a launch gate held by another team has become a bottleneck when work waits for it longer than the check takes.\n- **S5** — The independence that separation of duties and auditors ask for is a property of a check and can be supplied in the path by a second team member's recorded review, automated checks the author cannot alter and an audit trail, except where a regulator or contract names an independent function.\n\n## Role in the part\n\nPlaces verification in the operating model: in the teams and in the delivery path. Supports P4-4 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in where-ownership-sits, checks-in-the-path, builds-it-runs-it, launch-readiness, opposing-view: the opposing view is answered with elements (review by a second team member, automated checks, the release log) that the three pattern sections define first)\n\nThe reader first meets a night nobody could fix and a proposal for a central QA team that sounds like the answer, so that the placement of ownership arrives as a decision to be made. The principles then compare the placements and say why the gate costs most; three patterns put ownership to work in the order a change travels (checked before release, operated after release, launched as a new service); on-call before the checks would start the reader at the repair without the path the repair feeds, and launch readiness before either would describe a list whose items are the checks and the pager. The opposing view comes after the patterns because its answer is built from their parts; placed before them the reader would be told that independence can be had in the path before knowing what the path contains. The worked example then decides the proposal with all of it, and would be undecidable earlier because its four changes are the three patterns and the answer to the auditor, and the AI section comes last because it changes the volume the path has to carry, not the argument.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): On a Thursday evening in May 2026 a release by one of Corvane's newer teams took the parts service down; the alert reached a platform engineer who did not know the service and could not take the release back, and technicians started the next morning without parts lists. Thirteen hours passed before it was restored. Within a week a director proposed a central QA team of ten to sign off every release.\n\n**Bridge:** Most leaders have sat in the meeting after a bad incident in which someone says that an independent team should check every release from now on. → Whether that helps depends on who owns quality and reliability and where the checks sit.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Quality and reliability are owned by the teams that ship and operate the software: the checks sit in the delivery path where they run on every change, the team that builds a service carries its on-call, incidents are reviewed to change the system, and quality and reliability specialists work as enabling teams that raise the teams' own practice and do not act as a gate.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See the night and the proposal in detail. *Kept in:* setting-the-scene.\n- Compare the places where ownership of quality can sit and what each costs. *Kept in:* where-ownership-sits.\n- Take three patterns: checks in the delivery path, the team that builds a service running it, and launch readiness without a gate. *Kept in:* checks-in-the-path, builds-it-runs-it, launch-readiness.\n- Answer the opposing view, that a check must be independent and that auditors require it. *Kept in:* opposing-view.\n- Decide Corvane's proposal, and see what AI changes about verification. *Kept in:* worked-example, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In May 2026 a release by one of Corvane's newer teams caused an outage that took thirteen hours to restore because the engineer who was paged could neither understand nor reverse it, and within a week a director proposed a central QA team to sign off every release. | scenario: Corvane, the fictional company this book follows, May 2026, about 500 people and about thirty teams. The Parts team (six engineers, formed 2025) releases on a Thursday at 17:40; the parts service returns errors; the alert reaches the platform engineer on call at 18:05; restored 07:10 the next morning. Customer-reported defects had gone from 22 to 47 a month in a year. Proposal: a QA team of ten that signs off every release. |  |\n| p02 | claim | Quality and reliability are owned by the teams that ship and operate the software, with the checks in the delivery path, the pager with the team that builds, incident reviews that change the system and specialists who enable; the chapter argues this in the order of its sections. |  | `problem_solution`: A night nobody could fix and a proposal for a gate. → The chapter's answer in one claim, the link from the previous chapter's platform, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Thirteen Hours and a Proposal\n\n**Controlling idea** (`context`, id `setting-the-scene`): The night showed three absences, an owner for the alert, a way back and a check besides the author's, and the proposal that followed addressed none of them efect away from the people who can prevent the next one.\n\n**Advances the thesis** (S1): Compares the placements and gives the mechanism by which the gate fails.\n\n**Transition in:** `problem_solution`: The question of who owns quality. → The three places ownership can sit.\n\n**Order of paragraphs** (`prerequisite_order`): The three placements are laid out first, then the reason the first costs most, then what published research adds; placed before the mechanism, the research would be a list of findings with nothing to explain why they hold.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | comparison (table) | Ownership of quality can sit in three places, a separate team that tests and approves, a tester inside every team, or the team itself with specialists who enable, and each has a different cost. | table: Three rows (separate QA or release team; tester embedded in each team; team owns quality, specialists enable), with columns: who finds out that a change is wrong, what it costs, when it fits. Escaped defect and enabling team are defined in the lead-in. |  |\n| p06 | cause_effect | The separate team costs most for two reasons: it gathers verification, which is scarce, into one queue, and it teaches the building team that quality is someone else's job. | reasoning: Chapter 5: verification is one of three capacities that run out, and finished work waits where it is concentrated. The author's record names the anti-pattern 'quality as permission'.; quotation: Will Larson, An Elegant Puzzle (2019): \"treat gatekeeping as a significant implementation bug rather than as a stability feature to be emulated.\" | `cause_effect`: Three placements and their costs. → Why the first one costs most. |\n| p07 | evidence | The research published as Accelerate and continued by DORA associates delivery performance with capabilities that sit in the team and its path, among them automated tests maintained by developers. | source: DORA capability catalog and guides (dora.dev, read November 2026): test automation with developers as primary authors and maintainers, continuous integration, deployment automation, monitoring and observability, streamlining change approval. | `additional_support`: The mechanism by which a gate fails. → What published research associates with delivery performance. |\n| p07b | definition | The same research measures delivery with four measures, and the two about stability, change failure rate and time to restore, are the ones this chapter judges quality by. | source: The four measures as the author's record names them: lead time for changes, deployment frequency, change failure rate, time to restore; DORA's guide now words the last two as change fail rate and failed deployment recovery time and has added a fifth, deployment rework rate. Chapter 28 treats them. | `elaboration`: The research and its capabilities. → Its four measures, of which the chapter uses two. |\n\n### Pattern: Checks in the Delivery Path\n\n**Controlling idea** (`recommendation`, id `checks-in-the-path`): The checks sit in the delivery path, where they run on every change of the team that made it, and quality specialists work as an enabling team that helps a team decide which check catches which risk and then leaves.\n\n**Advances the thesis** (S2): States the first pattern with its user and outcome measure, and says what specialists do.\n\n**Transition in:** `problem_solution`: Ownership in the team, as the placement that costs least. → Where the team's checks sit: in the delivery path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition (figure) | The delivery path is the sequence of steps every change passes from its author to production, and a check placed in it runs on every change without anyone asking, which is what lets the team that made a change learn within minutes or hours that it is wrong; the path also records each step in a release log, and its readiness checks can be owned by a platform team while each team runs them. | figure: Mermaid flowchart LR: 'Change by its author' -> 'Author's automated tests' -> 'Review by a second team member' -> 'Automated readiness checks' -> 'Gradual release' -> 'Monitoring and alerts' -> 'Team on call' -> 'Incident review'; an edge from 'Incident review' back to the checks labeled 'adds or changes a check'. |  |\n| p09 | recommendation | Quality specialists work as an enabling team: with one team at a time they work out which check catches which risk, do the exploratory testing automation cannot, and leave when the team maintains its checks alone. | source: The author's record quality-engineering-enablement: a release confidence model (unit and component checks, contract checks, a few end-to-end checks, exploratory testing, observability, a way back). DORA's test automation guide: testers keep an important role, pairing with developers and doing exploratory and usability testing. | `additional_support`: Checks the team runs itself. → What quality specialists do when they do not approve releases. |\n\n### Pattern: The Team That Builds It Runs It\n\n**Controlling idea** (`recommendation`, id `builds-it-runs-it`): The team that builds a service carries its on-call and reviews its incidents, so that what the checks missed comes back to the people who can change the checks.\n\n**Advances the thesis** (S3): States the second pattern in two parts, on-call ownership and incident review, each with user and outcome measure.\n\n**Transition in:** `sequence`: Checks before and during release. → What happens after release: who is paged.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | recommendation | The team that builds a service should carry its on-call, because only then does the cost of a defect fall on the people who can prevent the next one, and the pattern holds only when the engineers are trained, the rotation is large enough and its load is measured. | source: The phrase 'you build it, you run it' is widely known in the industry (used here without attribution; its source could not be fetched). Larson, An Elegant Puzzle: \"Only your trained engineers can go on-call.\"; on-call rotations get smaller as systems specialize so that the engineer on call has enough context. The author's record operational-excellence: on-call pain is measured and minimized. Chapter 8 for rotation sizes. |  |\n| p11 | process | An incident review changes the system when it is anchored to a written account, asks what let the change through and what slowed the repair, ends in changes to a check, an alert, a runbook or the path with an owner and a date, and has its open actions read every week. | source: Larson, The Engineering Executive's Primer (2024): a weekly incident review anchored to a concise written document, with discussion and not presentation; the number of incidents, each connected to an incident review writeup, as a measure to operate; rotating the people who run the review. The author's record operational-excellence: follow-ups tracked to completion with weekly reviews of what is open; 'retrospective theater'. | `sequence`: The pager with the building team. → What the team does with an incident once it is over. |\n\n### Pattern: Launch Readiness Without a Launch Gate\n\n**Controlling idea** (`recommendation`, id `launch-readiness`): Launch readiness is a short list of conditions that the launching team owns and the path checks where it can, and a readiness check held by another team shows by four signs that it has become a bottleneck.\n\n**Advances the thesis** (S4): States the third pattern and gives the reader the signs for recognizing a gate that has become a queue.\n\n**Transition in:** `contrast`: The every-day path of a change. → The rarer event of a launch, where gates most often return.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Launch readiness is a short list of conditions that must hold before a new service takes real traffic, and it works when the launching team owns the list and the path checks the items a machine can check. | source: The author's record operational-excellence, which distills Kate Matsudaira's 'Software Managers' Guide to Operational Excellence' and the Software Managers' Operational Excellence Checklist: working monitoring and dashboards, runbooks a stranger can follow, service-level objectives, recovery tested, behavior when a dependency fails understood, load tested, compliance met. |  |\n| p13 | analysis (list) | Four signs show that a launch gate has become a bottleneck, as Corvane's launch queue of 2024 did: the wait is longer than the check, open requests grow, nearly everything is approved, and the gate checks what the team could check itself. | case: Corvane's Launch Queue of 2024 (180 people): the hand check took hours and the wait for a slot about 17 of 19 days; 14 open launch requests at the peak, growing every month; replaced by automated readiness checks a team runs on its own change (chapter 5). | `contrast`: A readiness list the team owns. → The same list held by another team, and how to tell that it has become a queue. |\n\n### The Opposing View: Independence and the Auditor\n\n**Controlling idea** (`counterargument`, id `opposing-view`): The separation-of-duties view is right that an author's check is not independent, and what it requires can be supplied in the path without a separate approving team, except where a regulator or a contract names one.\n\n**Advances the thesis** (S5): States the opposing view at full strength, answers it with the parts the patterns defined, and marks the answer as a recommendation with conditions.\n\n**Transition in:** `contrast`: Three patterns that put every check with the owning team. → The objection that such checks are not independent.\n\n**Order of paragraphs** (`prerequisite_order`): The view is stated first and granted its point, the answer follows with its evidence, and the conditions under which the answer does not hold come last. The answer before the view would refute an objection the reader has not heard at full strength; the conditions before the answer would limit a recommendation not yet made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | counterargument | The separation-of-duties view holds that a check made by the author of a change is not independent, so independent testers and a release authority are needed, and in regulated settings auditors ask for evidence of it; about independence it is right. | reasoning: An author tests what the author thought of. Separation of duties: no one person can make and approve the same change. DORA's change approval guide calls segregation of duties a common regulatory requirement: changes must be approved by someone other than the author. |  |\n| p15 | refutation (table) | Independence is a property of a check and not of a department, and the path can supply it: review by a second team member, automated checks the author cannot alter, and a log of who changed, reviewed and released what. | table: Three rows: what the requirement asks (someone other than the author approved the change; the checks cannot be skipped or weakened by the author; evidence afterwards) against what supplies it in the path (recorded review by a second team member; checks owned outside the team and changed only with notice; a release log).; statistic: DORA, 2019 State of DevOps Report, as presented in DORA's change approval guide: no evidence that a more formal, external review process is linked to lower change fail rates; heavyweight external approval is associated with slower delivery; peer review is offered as the way to meet segregation of duties. | `contrast`: What the view gets right. → Where independence can come from instead. |\n| p16 | recommendation | This is a recommendation with conditions: where a regulator or a contract names an independent function, where a team is too small for a real second reviewer, or where a change carries unusual risk, an independent check outside the team is kept, and it is kept explicit, narrow and early. | reasoning: The author's record quality-engineering-enablement: compliance, security and regulatory gates are not eliminated where required; they are to be explicit, risk-based and integrated as early as possible. DORA's guide: risk-based scrutiny flags high-risk changes for extra review; the guide does not say peer review satisfies every regulatory framework. | `contrast`: The default answer to the auditor. → The conditions under which the default does not hold. |\n\n### Worked Example: Corvane Answers the Proposal\n\n**Controlling idea** (`example`, id `worked-example`): Corvane's own numbers showed defects and slow repair where the checks and the pager were missing, not where a gate was missing, so the proposal was declined and four changes placed ownership with the teams.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Applies the placement, the three patterns and the answer to the auditor to one decision, with measures before and after.\n\n**Transition in:** `example`: The placement, three patterns and the answer to the objection. → Corvane's decision on the proposal of May 2026.\n\n**Order of paragraphs** (`chronological`): The numbers come before any reading of them, the reading before the decision's four changes, and the results last, because the reader should be able to form the answer from the table before the chapter gives it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | evidence (table) | Before answering, Dario Vance had four numbers set side by side for the eleven older teams and the nineteen newer ones. | table: First half of 2026. Eleven older teams (on the release path, own readiness checks, own on-call rotation) against nineteen newer teams (three other ways of deploying; twelve of them without a rotation): change failure rate 6% against 21%; customer-reported defects per month 9 against 38; median time to restore 40 minutes against 5 hours; teams the two quality engineers had worked with 11 of 11 against 2 of 19. |  |\n| p18 | analysis | The table shows that the teams with the fewest defects had no gate at all, so what the newer teams lacked was the older teams' checks and pager, and a QA team of ten for thirty teams would have rebuilt the launch queue of 2024. | reasoning: The eleven older teams release without any sign-off and fail least; 38 of 47 monthly defects come from teams whose changes pass no check in their path. In 2024 five platform engineers checking launches for eleven teams produced a 17-day wait. | `cause_effect`: The four numbers. → What they show and the answer they give to the proposal. |\n| p19 | process (list) | Vance declined the QA team and, with Lena Brandt, made four changes that put the checks, the pager, the review and the specialists where the chapter's patterns put them. | scenario: 1. The release path with its readiness checks, a way back now among them, becomes the one path; the nineteen teams move to it, with the platform team owning the move; this applies the rule of Corvane's engineering strategy of the same year, one standard per shared area (chapter 13), and the seven teams with the highest change failure rates move first. The path now requires a recorded review by a second engineer of the owning team. 2. Every team carries the on-call for its own services; teams of fewer than eight share a rotation with one neighboring team. 3. A weekly incident review, run by two engineers in rotation, whose actions are changes to a check, an alert, a runbook or the path. 4. The quality engineers go from two to four, in two pairs, still for about six weeks per team, starting with the highest change failure rates. | `sequence`: The reading of the table. → The decision and its four parts. |\n| p20 | evidence | Two quarters later the measures had moved for the teams that had changed and the cost was visible: seven of the nineteen teams had moved, and twelve had not. | scenario: End of 2026: seven of nineteen newer teams on the release path; the change failure rate of these seven, the worst of the nineteen, 27% to 9% (the 21% of the table is the average of all nineteen); customer-reported defects 47 to 31 a month; newer teams' median time to restore 5 hours to 90 minutes; every team has a named rotation. Cost: each moving team shipped little for about six weeks, and engineers in the newer teams were on call for the first time. Twelve teams still release in the three other ways.; scenario: Corvane, late 2026, after the four changes of the worked example: a telecom customer's security questionnaire asks for evidence that every production change is approved by someone other than its author. Corvane's answer: the release path refuses a change without a recorded review by a second engineer of the owning team; the readiness checks are owned by the platform team and change only after two weeks' notice; every release is logged with author, reviewer and check results. This held for the eighteen teams then on the release path, with the 2027 plan given for the rest. The customer's auditor accepted it. | `cause_effect`: Four changes. → What they did to the measures in two quarters, what they cost and what was left. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI raises the volume of change that has to be verified and makes the independence of checks from the author, now often an agent, the design question, which strengthens the case for checks in the path.\n\n**Advances the thesis** (S2, S5): Says what changes about verification when change is produced by agents, with labeled claims, and points to the chapter that argues it in full.\n\n**Transition in:** `additional_support`: The one path Corvane settled on in 2026, built for change that people write. → What happens to that path when coding agents multiply the change.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | Published research and the author's observation agree that AI use raises the amount of change faster than the capacity to verify it, so stability depends more than before on small changes and automated checks. | statistic: Proven: DORA's 2024 report, as DORA summarizes it on its own site, finds that AI adoption increases individual productivity, flow and job satisfaction and negatively impacts software delivery stability and throughput, and that small batch sizes and robust testing remain crucial. Emerging: the author's observation, as of November 2026, that review by people is the first step to fall behind. Illustration: Corvane's Review Wall, 2027-2028, merged changes up 2.4 times, median review wait from 5 hours to 31. |  |\n| p22 | analysis | The opposing view's point about independence applies to agents: an agent that writes a change and its tests is an author checking itself, so the checks in the path have to come from somewhere other than the agent that made the change. | reasoning: Speculative: checks derived from a specification the team wrote, readiness checks owned outside the authoring agent, review by a second reader. Confirmed if teams that keep tests and change independently authored report a lower change failure rate at the same volume. Full argument in agentic-delivery. | `elaboration`: More change than reviewers. → What the checks must be independent of when the author is an agent. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Quality and reliability are one loop and not two functions: a check in the path catches what the team has already learned to catch, the pager brings the team what the checks missed, and the incident review turns that into the next check. A gate or an operations team held by others cuts the loop at the point where the learning would return to the people who write the next change.\n\n**So what:** A leader asked for a QA sign-off or a release board after an incident can ask instead which check, which pager and which review were missing, and can judge the answer by change failure rate, time to restore and escaped defects.\n\n**Callback:** The thirteen hours of May 2026 and the proposal for a QA team of ten. The proposal is declined and the night's three absences are each filled by a pattern; the reader can say why a sign-off would have filled none of them.\n\n**Takeaway** (`course_of_action`): Draw your delivery path, mark who runs each check and how long work waits for it, and for your last incident name the check, alert or runbook that changed because of it.\n\n**Hand-off** to [Migrations and Technical Debt](migrations-and-technical-debt.html): `problem_solution`: Strategy, governance, platform and practice as they should be, against a landscape that is not yet like that. → The migration as the way to move the landscape, and how to finish one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | synthesis (list) | Established: gates held by people are a defect of design, delivery performance is associated with capabilities in the team and its path and is measured by four measures, and external approval has not been found to lower failure. |  |  |\n| p24 | synthesis (list) | Depends on context: whether a regulator names an independent function, whether a team is large enough for a second reviewer and a rotation, and whether a team needs an embedded tester for a time. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p25 | synthesis (list) | The author's synthesis: quality and reliability as one loop of check, pager and review; independence as a property of a check; the four signs of a gate that has become a bottleneck; the application to agents. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p26 | recommendation (list) | Eight checks let the reader draw their own delivery path, find who owns each check and each pager, and test their last incident review. |  | `sequence`: What to take away. → What to do with it. |\n| p27 | transition | Corvane has strategy, governance, a platform and a practice as they should be, and a landscape in which twelve teams are not yet like that; moving them is a migration, which is the next chapter's subject. |  | `problem_solution`: The proposal declined and the night's absences filled, for the teams that have moved. → The landscape that is not yet like that, and the migration as the way to move it. |\n\n## Non-goals\n\n- When an enabling or a functional team is justified; the four team types See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html).\n- Verification as a scarce capacity, the constraint and the Launch Queue in full See [Flow and the Constraint](flow-and-the-constraint.html).\n- On-call rotation sizes and team size See [Team Size and Composition](team-size-and-composition.html).\n- The platform as a product and the paved path See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- The four key measures in depth, SPACE, developer-experience surveys and the gaming of measures See [[measuring-engineering]].\n- Delivery with coding agents: review redesign, accountability for agent-produced change See [[agentic-delivery]].\n- How the nineteen teams are moved to one release path See [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- Testing technique (test pyramid, contract testing), SRE practice in depth (error budgets), incident command during an incident\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts to confirm (appended to the ledger): the Parts team (six engineers, formed 2025) and the thirteen-hour outage of May 2026; customer-reported defects 22 to 47 a month; the proposal for a QA team of ten; the table of the eleven older and nineteen newer teams; the four changes; the results at the end of 2026 (seven of nineteen teams moved, twelve not); the quality engineers going from two to four; the telecom customer's audit question.\n- 'You build it, you run it' is used as a widely known phrase without attribution: the ACM Queue interview with Werner Vogels (2006) answered HTTP 403 and could not be read. The author may add the credit.\n- Accelerate has no Kindle notes. The chapter cites the research through DORA's own guides (fetched 2026-11-19) and the author's records, and says so. DORA's guide now lists five delivery measures; the chapter names the four of the journal spec and mentions the fifth in a clause.\n- The Proven AI claim rests on DORA's own summary page of its 2024 report, not on the full PDF.\n- The worked example states that seven of nineteen teams had moved to the release path by the end of 2026 and twelve had not; chapter 17 (migrations) should build on this or the author should adjust it.\n- Rule for teams of fewer than eight sharing an on-call rotation with one neighboring team is asserted for Corvane in one clause; chapter 8 rejected merging rotations for the platform team in 2024, a different case.\n\n## Decision log\n\n- **2026-11-19** — The opening scene is a new incident of 2026 (about 500 people, about thirty teams) and a renewed proposal for a central QA team, building on the 2024 refusal recorded by chapter 6, because the journal's cold-reader probe is exactly that proposal and the 2024 decision is already told. Rejected: Retelling the 2024 request for a QA team of six; Opening on the Launch Queue again\n- **2026-11-19** — The four key measures are named with one clause each and left to chapter 28; the chapter uses change failure rate, time to restore and escaped defects as its outcome measures. Rejected: A section on the DORA measures\n- **2026-11-19** — The opposing view has its own section after the three patterns, because its answer is assembled from parts the patterns define. Rejected: Answering it inside the principles section, before the path is defined\n- **2026-11-19** — No separate trade-off section: the comparison table of the three placements in the principles section carries the trade-offs. Rejected: A second table late in the chapter\n- **2026-11-19** — After the flow rubric (sound with notes): the two section-level flow labels changed from assertion_evidence_reasoning to prerequisite_order, with what would break stated; the release log is introduced with the delivery path (p08) so that the answer to the auditor only reuses it; the launch queue of 2024 is named in the launch-gate paragraph (p13) so that the worked example can rely on it. Not acted on: moving the paragraph on enabling specialists (p09) into the principles section, because what the specialists do is defined by the checks in the path, which the pattern section introduces; and stating the external-approval finding in the principles section, because it answers the objection and is kept with it (p15). Rejected: Moving p09 next to the comparison of placements; A second run of the flow rubric (the brief allows one)\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (REVISE; two findings with their fault in the spec): the seven teams that moved first get their own starting change failure rate, 27%, because the table's 21% is the average of all nineteen and the seven were chosen as the worst; the auditor's question is dated late 2026, after the four changes, and answered for the eighteen teams then on the release path, because the recorded second review only becomes a requirement with those changes; the AI section no longer carries over 'a path that carried thirty teams' change', since twelve teams were not yet on it. Rejected: Moving the auditor scenario into the worked example, which would add a fifth paragraph and a second lens to it\n- **2026-11-19** — After round 2 of the draft check (REVISE; two findings with their fault in the spec): the Corvane audit scenario moves from the opposing-view section (p15) to the results paragraph of the worked example (p20), because both flow readers found that it told an outcome of the four changes before the changes; this reverses the round-1 choice to keep it in p15. The research paragraph p07 is split into p07 (capabilities) and p07b (the four measures), because its controlling idea joined two ideas. Made in auto mode as local corrections; the round-2 report was not rerun and is stale against this spec. Rejected: Leaving the scenario in p15 with a forward reference; A third check round (the author's rule allows two)\n- **2026-11-19** — Reliability specialists (SRE) are treated in one clause as enabling or platform work; error budgets and SRE practice are a non-goal, since no source on the author's bookshelf treats them. Rejected: A section on SRE team models\n\n## Sources\n\n- **Internal**\n  - _journals/org-design/posts/quality-engineering-enablement and org-health-and-flow-metrics — Quality engineering as enablement, the three team operating patterns, the release confidence model, the scope note on regulatory gates; the delivery and stability measures.\n  - _journals/grounded-engineering-management/posts/operational-excellence; _journals/grounded-engineering-executive/posts/run-engineering-processes and measuring-engineering-organizations — The operational bar in seven areas; processes run by engineers; measuring to operate.\n  - _research/scenario-ledger.md; posts/05-flow-and-the-constraint, 06-team-types, 08-team-size-and-composition — The Launch Queue and the 2024 release path; the engineering strategy of 2026 (chapter 13 ledger line); the 2024 refusal of a QA team and the enabling pair of quality engineers; rotation sizes; stage 4 and 5 facts.\n  - journal-spec.json, entries quality-and-reliability, part-4, platforms-and-developer-experience, migrations-and-technical-debt (transition_in) — Intent, acceptance criteria, thesis and role, copied unchanged; the hand-off.\n- **External**\n  - DORA (dora.dev), capability catalog and guides: Test automation; Streamlining change approval (findings of the 2019 State of DevOps Report); DORA's software delivery performance metrics; summary of the 2024 DORA report. Fetched and read 2026-11-19. — Capabilities associated with delivery performance; developers as primary maintainers of automated tests and the role of testers; no evidence that formal external review lowers change fail rate; segregation of duties met by peer review; the delivery measures; the 2024 finding on AI adoption and delivery stability. Supplements the author's sources.\n  - Nicole Forsgren, Jez Humble and Gene Kim, Accelerate (2018). On the author's bookshelf, no Kindle notes; cited through the author's records and DORA's guides only. — The research program and its four measures, as named in the author's records.\n  - Will Larson, An Elegant Puzzle: Systems of Engineering Management (2019); author's notes, _input/bookshelf/docs/notes/elegant-puzzle.pdf — Gatekeeping as an implementation bug; only trained engineers go on call; on-call rotations need engineers with enough context.\n  - Will Larson, The Engineering Executive's Primer (2024); author's notes, _input/bookshelf/docs/notes/engineering-executive.pdf — The weekly incident review anchored to a written document; incidents connected to review writeups as a measure to operate; rotating who runs the review.\n  - Kate Matsudaira, 'Software Managers' Guide to Operational Excellence', through the author's record operational-excellence and the Software Managers' Operational Excellence Checklist in _input/checklists/data/data.json — The launch readiness list; incident follow-ups tracked to completion; on-call pain measured.\n\n## Changelog\n\n- **2026-11-19** — After round 2 of the draft check: p07 split into p07 and p07b; the audit scenario moved from p15 to p20; p08 says who owns and who runs the readiness checks.\n- **2026-11-19** — After round 1 of the draft check: evidence of p15 and p20 and the transition into the AI section corrected (see decision log).\n- **2026-11-19** — Revised after the flow rubric (flow labels and rationale, release log in p08, launch queue named in p13); worked-example evidence aligned with the chapter 13 ledger line on the engineering strategy; status set to accepted in auto mode.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>

            const bullet = /^(\s*)([-*])\s+(.*)$/;

                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
