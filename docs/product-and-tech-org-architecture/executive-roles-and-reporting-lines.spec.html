<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What the CTO, CPO, VP Engineering and the heads of design, data and security are each for.\n- **Know:** The common configurations — CTO and CPO as peers, a combined CPTO, CTO with a VP Engineering — and what each trades.\n- **Know:** The 'first team' principle as Larson applies it to engineering executives (the term is usually credited to Lencioni; the attribution is not confirmed in the author's notes), and Larson's advice on working with the CEO and peers.\n- **Believe:** An executive's first team is the executive team, not the function they lead.\n- **Be able to:** Choose a configuration for a company's stage and constraints.\n- **Be able to:** Decide where design, data and security report and say what the choice costs.\n- **Be able to:** Recognize a structure built around a person and not a decision.\n\n**Audience:** Executives (CEO, CTO, CPO, VP, Director) who design or sit in the top of a product and tech organization, and individual contributors who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work day to day; what product managers, engineering managers and designers do.\n- From earlier chapters: judgment as a scarce capacity (chapter 5), Corvane's stages and incidents (preface), outcomes and the roadmap's three shares (chapters 9 and 11), the engineering strategy (chapter 13).\n\n**Does not yet know:**\n\n- joined decision\n- configuration (of executive roles)\n- CPO, CTO, VP Engineering as accountabilities\n- CPTO\n- first team\n- structured (joint) escalation\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a company described by stage and people, the reader recommends a configuration and names what it gives up. *Probe:* A 150-person company has a founder CTO who is strong technically and weak on people management, no head of product, and product decisions made by the CEO. Using only this chapter: what leadership configuration would you propose, and what does it give up? | `custom` | cold_reader | major |\n| AC-2 | The chapter gives data, design and security leadership one section each and says where the author's sources are thin. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Which executive roles does a product and tech organization need, and who should report to whom?\n\n> **Claim:** A product and tech organization needs, at the top, someone accountable for what is built, someone accountable for how it is built and run, and a place where those two are joined; as peers, a CTO and a CPO, where the balance between the two matters more than speed, or as one combined executive where speed matters more than balance; and, with either, a VP Engineering beside the CTO where the hardest joining is between technical direction and running the engineering organization; and design, data and security should report where their decisions most often need to be joined with others.\n\n**Disputed by:** The practice of shaping executive roles around the strengths and ambitions of the people in them, on the grounds that the right people matter more than the chart.\n\n**So what:** A leader designing the top of the organization starts from the decisions that must be made jointly, and treats a role created to retain someone as a cost to be stated.\n\n**How and why:** At the top, the scarce capacity is judgment across functions. Two peers join product and engineering by negotiation, which is slow but balanced; one combined executive joins them in one head, which is fast and lopsided; each configuration moves the difficulty and none removes it. The first-team principle, which Larson applies to engineering executives and which is usually credited to Lencioni (the author's notes on neither book show the attribution, so the chapter hedges it), is what makes peers work: each puts the company's outcome before the function's.\n\n**Supporting claims**\n\n- **S1** — At the top, what is built and how it is built and run are two accountabilities whose decisions meet, and a top that does not say where they are joined leaves the join to be discovered below.\n- **S2** — Each of the three common configurations puts that join in a different place and trades one kind of joining for another: peers join by negotiation, which is balanced and slow; one combined executive joins in one head, which is fast and lopsided; a CTO with a VP Engineering adds a join inside engineering.\n- **S3** — The configuration is chosen from the hardest join the company has at its stage, and a role shaped around a person is a cost to be stated.\n- **S4** — Peers work only when each treats the executive team as the first team, and the practice that makes this concrete is a written list of the decisions they make together and a joint way to escalate.\n- **S5** — Design, data and security report where their decisions most often need to be joined with others, and each choice has a cost that can be named.\n- **S6** — AI adds decisions that need joining at the top across product, engineering and security, and the same rule decides whether a new role is warranted.\n\n## Role in the part\n\nSets the top of the structure and the principle — roles follow decisions that must be joined — that the rest of the part applies. Supports P5-1 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in what-the-top-must-hold through first-team: the accountabilities and the join before the configurations that place the join, the configurations before the way to choose one, the choice before the practice that makes a join between peers hold.; `grouping` in where-design-reports, where-data-reports, where-security-reports: three applications of one rule, stated once at the start of the first. Design comes first because its decisions meet product decisions most directly; data second because its jobs divide between product and engineering; security last because its head must sometimes disagree with the executive it reports to, and because the AI section that follows needs security.)\n\nThe reader first meets two executives who cannot agree who leads eleven teams, so the model arrives as the missing thing. The accountabilities and the join must be defined before the configurations, which are arrangements of them; the choice among configurations needs all three described; the first-team practice comes after the choice because it is what a join between two people needs, and because Corvane's 2025 page, which resolves the opening scene, is the last stage of the history that the first pattern's table tells; put before the choice, the page would arrive before the reader knows how Corvane came to have two peers. Design, data and security come after both patterns because they apply the same rule to smaller cases; put earlier they would stand between the scene's question and its answer. AI comes last because it adds decisions to a structure the reader must already have.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): When Corvane appointed its first CPO in 2025, the CTO and the CPO each drew the organization they needed. The two drawings showed the same teams, and for eleven of them they named a different leader.\n\n**Bridge:** A reader who has seen executive roles settled by who was available and who had to be kept, and a reorganization argued as a contest of charts. → The question a chart cannot answer: which decisions must be made together at the top, and where.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A product and tech organization needs, at the top, someone accountable for what is built, someone accountable for how it is built and run, and a place where those two are joined; as peers, a CTO and a CPO, where the balance between the two matters more than speed; as one combined executive where speed matters more than balance; and as a CTO with a VP Engineering where the hardest joining is between technical direction and running the engineering organization; and design, data and security should report where their decisions most often need to be joined with others.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See two executives draw one organization two ways at Corvane. *Kept in:* two-drawings.\n- Know what the top must hold and what each executive role is for. *Kept in:* what-the-top-must-hold.\n- Know the three common configurations and what each trades. *Kept in:* three-configurations.\n- Choose a configuration from the hardest join, and make a join between peers hold with the first-team principle. *Kept in:* choose-from-the-hardest-join, first-team.\n- Decide where design, data and security report, and know where the author's sources are thin. *Kept in:* where-design-reports, where-data-reports, where-security-reports.\n- Know what AI changes. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2025 Corvane's CTO and its newly appointed CPO each drew the organization they needed, and the two drawings named a different leader for eleven teams. | scenario: Illustration: Corvane, 2025, growing toward 500 people; Tomas Rell (co-founder and CTO), Priya Nambiar (CPO from 2025), Ines Okafor (co-founder and CEO); the same teams in both drawings, a different leader for eleven of them. |  |\n| p02 | claim | The top needs someone accountable for what is built, someone accountable for how it is built and run, and a place where the two are joined; three configurations put that place differently and each fits a condition; the chapter goes from the scene through the roles, the configurations, two patterns, three reporting lines and AI. |  | `problem_solution`: Two drawings that could not be reconciled. → What the drawings left out, the chapter's claim, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Two Drawings of One Organization\n\n**Controlling idea** (`example`, id `two-drawings`): Corvane's two drawings each followed from what its author was accountable for, and they could not be reconciled by redrawing because the word 'leads' stood for decisions nobody had listed.\n\n**Advances the thesis** (S1): Shows a top where two accountabilities meet and nobody has said where they are joined.\n\n**Transition in:** `elaboration`: The lead's short account of the two drawings. → What each drawing said and why neither was wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Each drawing was reasonable: the CTO's put each of the eleven teams under its engineering manager and the CPO's put it under its product manager, and each followed from what its author was accountable for. | scenario: Illustration: 2025, Corvane growing toward 500 people; eleven product teams exist and more are being formed. Tomas Rell's drawing (made with Dario Vance): team -> engineering manager -> engineering director -> VP Engineering -> CTO, with product managers assigned to teams. Priya Nambiar's drawing: team -> product manager -> group product lead -> CPO, with engineers staffed to teams. The teams still to be formed are unnamed boxes in both. |  |\n| p04 | analysis | Redrawing could not settle the disagreement, because 'leads' stood for decisions nobody had listed, and the disagreement was already at work inside the teams. | scenario: Illustration: in three of the eleven teams the engineering manager and the product manager had each been told by their own executive that they set the team's plan for the next quarter. | `cause_effect`: Two reasonable drawings. → Why they disagreed and what the disagreement was already doing. |\n\n### What the Top of the Organization Must Hold\n\n**Controlling idea** (`definition`, id `what-the-top-must-hold`): The top of a product and tech organization must hold accountability for what is built, accountability for how it is built and run, and a place where the two are joined; executive titles are names for parts of this and must be read by the decisions they make.\n\n**Advances the thesis** (S1): Defines the two accountabilities, the join and the roles, which the configurations then arrange.\n\n**Transition in:** `problem_solution`: A disagreement about undefined leadership. → What the top has to hold, stated as accountabilities and a join.\n\n**Order of paragraphs** (`prerequisite_order`): The two accountabilities and the join come first, then the titles that carry them, then the warning that a title does not fix the job, which the configurations need.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | The top must hold three things: someone accountable for what is built, someone accountable for how it is built and run, and a place where decisions that need both kinds of knowledge are joined. | reasoning: The author's framing. A joined decision is one that cannot be made well with the knowledge of one side alone; examples: how much capacity goes to new product and how much to keeping the product running; whether a promise to a customer can be kept by its date; which teams exist and what each owns. |  |\n| p06 | comparison (table) | Six executive roles recur, and each is for one part of this: the CPO, the CTO and the VP Engineering for the two accountabilities, and the heads of design, data and security for decisions that cut across them. | table: Role \\| Is for \\| A decision it makes. CPO (chief product officer) \\| what is built: whose problem, which problem, in what order \\| which outcome a product group works on this year. CTO (chief technology officer) \\| how it is built and run: technical direction, and often the engineering organization \\| which technical choices are made once for all teams. VP Engineering \\| running the engineering organization: managers, hiring, delivery \\| how many engineers each group gets. Head of design \\| whether people can use what is built \\| the standard a screen must meet before release. Head of data \\| the data the company decides with and builds on \\| what a metric means across teams. Head of security \\| stating risk and the controls against it \\| which risks are brought to the CEO to accept.; source: Larson defines the Engineering executive as the functional leader for Engineering, responsible for both technical execution and people management within Engineering. | `elaboration`: Two accountabilities and a join. → The titles that usually carry them. |\n| p07 | explanation | The engineering side holds two jobs, technical direction and running the organization, which can sit in one person or in two, so the same title means different things in different companies and a role is read by its decisions. | reasoning: A CTO in one company runs the whole engineering organization; in another the CTO sets technical direction and a VP Engineering runs the organization; the title alone does not say which. | `contrast`: Roles as fixed lines in a table. → The same title covering different jobs. |\n\n### Three Configurations and What Each Trades\n\n**Controlling idea** (`comparison`, id `three-configurations`): Three common configurations put the join of product and engineering in three different places, and each trades one kind of joining for another; none removes the difficulty.\n\n**Advances the thesis** (S2): Describes each configuration by where the join sits and what it costs, and states the author's mapping of configurations to conditions.\n\n**Transition in:** `sequence`: The accountabilities, the join and the roles. → The common ways of arranging them.\n\n**Order of paragraphs** (`comparison`): The figure shows all three first so that each description can point at a place on it; peers and the combined executive are opposites and come as a pair; the CTO with a VP Engineering comes third because it is a division inside the engineering side of either; the table of conditions needs all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | description (figure) | Three configurations are common: the first two are alternatives that join product and engineering between two peers or inside one executive, and the third is a division of the engineering side that adds a second join and combines with either of the first two. | figure: Mermaid flowchart with three small org diagrams side by side. Peers: CEO -> CPO, CEO -> CTO, and a labeled link between CPO and CTO ('joined by agreement'). Combined: CEO -> CPTO ('joined in one head') -> Head of Product, Head of Engineering. CTO with VP Engineering: CEO -> CTO -> VP Engineering, with the link between CTO and VP Engineering labeled ('direction joined with running'), and a product executive beside the CTO. |  |\n| p09 | explanation | As peers, a CTO and a CPO join product and engineering by negotiation, which keeps both accountabilities at full strength and costs time, and it needs the CEO as the place a disagreement goes. | reasoning: Neither peer can overrule the other, so each joined decision is argued by someone accountable for each side; the cost is the time of the argument and a CEO who must decide when the two cannot. | `elaboration`: The first diagram. → What peers give and what they cost. |\n| p10 | explanation | One combined executive joins product and engineering in one head, which is fast, and is lopsided toward the discipline that executive came from, and it becomes a queue as the company grows. | scenario: Illustration: Corvane in 2019, 12 people: Tomas Rell decided product and technology alone; decisions were quick and consistent until every pricing, design and release decision waited for him (the Founder Queue). | `contrast`: Joining by negotiation. → Joining in one person. |\n| p11 | explanation | A CTO with a VP Engineering splits the engineering side into technical direction and running the organization, which gives each a full-time owner and creates a new join between them, and it leaves the join with product where it was. | reasoning: A decision such as whether to pause feature work for a migration needs both the direction and the organization's capacity; with two people it has to be agreed between them. | `contrast`: One person holding everything. → Two people dividing the engineering side. |\n| p12 | comparison (table) | Which configuration fits depends on which joining is hardest for the company: peers where balance matters more than speed, one combined executive where speed matters more, a CTO with a VP Engineering where the hardest joining is between technical direction and running the organization. This mapping is the author's position. | table: Configuration \\| Where product and engineering are joined \\| Fits when \\| Gives up. CTO and CPO as peers \\| between the two, by agreement, with the CEO behind \\| balance matters more than speed: a mistake toward either side is expensive \\| speed; a single point of joining. One combined executive \\| in one head \\| speed matters more than balance: small company, or one product in fast change \\| balance; the executive's time as the company grows. CTO with a VP Engineering \\| wherever it was before (with a product peer, or in the CTO) \\| the hardest joining is between technical direction and running the organization \\| a single voice for engineering; the new join must be written. | `conclusion_summary`: Three configurations described one by one. → The conditions under which each fits, as the author's position. |\n\n### Pattern: Choose the Configuration from the Hardest Join\n\n**Controlling idea** (`recommendation`, id `choose-from-the-hardest-join`): The configuration is chosen by finding the joined decisions that waited or went wrong and putting a person or a written agreement on the hardest of them; Corvane's four stages show each choice answering one join and creating the next, and a role made for a person is a cost to state.\n\n**Advances the thesis** (S3): Turns the mapping into a procedure with a user and an outcome measure, shows it on Corvane, and answers the view that roles should follow people.\n\n**Transition in:** `problem_solution`: Three configurations and their conditions. → How to find which condition a company is in.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The procedure is stated first, Corvane's history is shown as a table before it is interpreted, the interpretation follows, and the objection comes last because it is answered with the case just read.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | process (list) | The user of this pattern is whoever designs the top (a CEO, founders or a board), and the procedure is to list the joined decisions of the last two quarters, mark where each waited or was made by one side alone, find the hardest join, and choose the configuration for it: a CTO with a VP Engineering when the hardest join is inside engineering, and, when it is product with engineering, peers or one combined executive by the balance-against-speed condition of the mapping table; it worked if joined decisions are made faster and fewer are made twice. | reasoning: Steps: list the decisions that needed both kinds of knowledge; for each, who made it, how long it waited, whether it was reopened; group them by what had to meet (product with engineering, or technical direction with running the organization); the group with the longest waits and most reversals is the hardest join; choose the configuration for that join, using the mapping table's condition (balance or speed) to decide between peers and one combined executive. Outcome measure: time from raising a joined decision to making it, and the count of such decisions reopened or made by one side alone. |  |\n| p14 | example (table) | Corvane's top went through all three configurations between 2019 and 2025, each at a different size. | table: Illustration. Years and size \\| Configuration \\| Hardest join at the time \\| What happened. 2019, 12 people \\| one combined executive in practice: Tomas Rell decides product and technology \\| none yet, then everything \\| the Founder Queue. 2020-2022, 50 people \\| still combined: the first product manager, Priya Nambiar, and later product managers report to Tomas Rell \\| product with engineering, inside one busy head \\| the Two Calendars; from 2022 Priya Nambiar decides scheduling rules. 2023-2024, 180 people \\| CTO with a VP Engineering: Dario Vance runs the organization, Tomas Rell keeps technical direction; eleven product managers still report to the CTO \\| technical direction with running a hiring wave \\| the join inside engineering is covered; product has no executive and the roadmap fills with forty-one promised features. 2025-2026, 500 people \\| CTO and CPO as peers, with the VP Engineering under the CTO \\| product with engineering, now between two people \\| the two drawings. | `example`: The procedure. → One company's four answers over seven years. |\n| p15 | analysis | The table shows each change answering the hardest join of its time and exposing the next, and one change that came late: product stayed under a CTO whose attention was on technology until 2025. | source: The author's record of Build What Matters: the first product hire is a senior product manager, and a product executive follows when there are several product managers and a founder ready to hand over strategy.; scenario: Illustration: 2024, eleven product managers reporting to the CTO, roadmap rows added by sales (the forty-one features). | `cause_effect`: Four rows. → What the sequence shows. |\n| p16 | refutation | The opposing practice shapes roles around the people available; people do constrain the choice, but a role made to keep or fit a person adds a join that someone must carry, so it is stated as a cost, and it can be recognized by asking what decisions the role joins once the name is removed. | scenario: Illustration: after 2023 Tomas Rell's role was that of a founder who kept his title while Dario Vance ran engineering; the split between them was not written until 2025, when it was stated as: Tomas Rell holds the technical side of company-level decisions (build or buy, acquisitions, the technology in the company strategy) and is consulted on the engineering strategy; Dario Vance holds everything inside engineering.; source: Build What Matters names the founder or CEO who cannot let go of product decisions the Throne Room, and says that at a certain point instinct does not scale. | `contrast`: Roles derived from joins. → The view that roles should follow the people, and the answer to it. |\n\n### Pattern: Make the Executive Team the First Team\n\n**Controlling idea** (`recommendation`, id `first-team`): Peer executives work when each puts the executive team before the function they lead, and the practice that makes this concrete is a written list of the decisions they make together and an agreed way to escalate jointly; Corvane's 2025 page shows it.\n\n**Advances the thesis** (S4): States the first-team principle with its attribution, gives the practice with user and measure, and resolves the two drawings with it.\n\n**Transition in:** `additional_support`: A configuration chosen, with joins between people. → What makes a join between peers hold.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The principle and its attribution come first, then why peers need it, then the practice, then Corvane's page as a table before the paragraph that says what it changed; the scene's question is answered here because the answer is the practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | definition | An executive's first team is the executive team and not the function they lead; the phrase is usually credited to Lencioni, whose Five Dysfunctions holds the idea as attention to collective results over one's department, and Larson uses the phrase for managers' peers and for the engineering leadership team. | source: Five Dysfunctions, fifth dysfunction (inattention to results): team members put their individual needs or even the needs of their departments above the collective goals of the team. The author's notes on Lencioni's two books do not contain the phrase 'first team'.; source: An Elegant Puzzle: 'make your peers your first team', addressed to managers. The Engineering Executive's Primer: the weekly engineering leadership meeting is the forum for forging direct reports into a 'first team' whose top priority is to support each other.; reasoning: Applying it to the CTO and CPO as members of the CEO's team is the plain reading of Lencioni and the author's extension of Larson's wording. |  |\n| p18 | explanation | Peers need the principle because an executive who puts the function first turns every joined decision into a contest, and the gap between two executives grows as it travels down. | source: Larson: when executives are focused on their function rather than the executive team's shared success, allocating expenses is a zero-sum game.; quotation: 'Like a vortex, small gaps between executives high up in an organization become major discrepancies by the time they reach employees below.' | `cause_effect`: The principle. → Why a join between peers fails without it. |\n| p19 | process | The practice for two peer executives starts from two pieces of Larson's advice: each writes down alone what they expect of the other's role and the two compare, and they agree to escalate jointly (structured escalation); turning the differences into a list of decisions made together is the author's extension. The users are the two peers, and it worked if disagreements reach the CEO from both at once and settled decisions stay settled. | source: Larson on onboarding a peer executive: your job as a peer executive is to help the new executive succeed; the author's record of the chapter: independently write down expectations of each other's roles and compare them. Larson on structured escalation, a process he attributes to LinkedIn: agree to resolve a disagreement within five days; if you cannot, escalate together with a shared document and commit to the answer. | `sequence`: Why the principle is needed. → What two peers do about it. |\n| p20 | example (table) | In 2025 Corvane's CEO asked the CTO and the CPO for a list of decisions in place of a third drawing, and the list they wrote fits on one page. | table: Illustration: Corvane's 2025 page. Decision \\| Who decides \\| Who must be heard first. Which outcomes each product group works on, and their order \\| CPO \\| CTO and VP Engineering, on what each would cost. How it is built, the technical standards, who is hired and how engineers are managed \\| VP Engineering, within the CTO's technical direction \\| CPO, on what the product needs next. The share of capacity for innovation, iteration and operation \\| CPO and CTO together \\| the group directors. Which teams exist, what each owns, and who leads each product group \\| CPO and CTO together \\| VP Engineering and the people affected. What a team does this quarter \\| the team's product manager and engineering manager together, within the outcome it was given \\| the designer. A disagreement between the two executives \\| both go to the CEO within five working days with one page \\| none. | `example`: The practice in general. → The practice at Corvane. |\n| p21 | analysis | The page settled what the drawings could not, since each of the eleven teams kept both an engineering manager and a product manager and the two now had a named shared decision, and it had a visible cost in the time the joint decisions took. | scenario: Illustration: in the quarter before the page nine disagreements between product and engineering reached Ines Okafor, each brought by one side; in the two quarters after it four did, each brought by both with one page. The chart that followed kept two lines (engineering managers to group directors to the VP Engineering; product managers to the CPO). The capacity share (40/35/25) was the first decision made under the joint row. The cost: in 2026 quarterly planning took nine of thirteen weeks (the Nine-Week Plan), which this chapter reads in part as the price of joining by agreement. | `cause_effect`: The page. → What it changed and what it cost. |\n\n### Where Design Reports\n\n**Controlling idea** (`analysis`, id `where-design-reports`): Design reports where its decisions most often need joining, which is usually with product, and each line has a cost; the author's sources say little about the design executive.\n\n**Advances the thesis** (S5): Applies the chapter's rule to the first of three functions and says how far the sources go.\n\n**Transition in:** `similarity`: The rule that a role sits where its decisions are joined, applied to the CTO and CPO. → The same rule applied to design, then data and security.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | comparison | The rule that placed the CTO and the CPO places the other heads too: a function reports where its decisions most often need to be joined with others. A head of design, accountable for whether people can use what is built, reports either to the CPO, where design decisions meet product decisions daily, or to the CEO as a third peer, where design has its own voice and adds a party to every joined decision. | reasoning: The author's judgment. Under the CPO: discovery and roadmap decisions are joined with design in one line; the cost is that design can come to serve the roadmap. As a peer: usability has a voice equal to value and feasibility; the cost is three-way negotiation at the top. The rule: put the line where most of design's decisions need joining, and name what the other line would have given. |  |\n| p23 | context | The author's sources are thin on the design executive: Build What Matters, as the author's record of it has it, says only that design should be a function of its own that works with product as a peer and that designers should not report to individual product managers; a book on the subject exists and is not on the author's bookshelf. | source: The author's record right-team (after Build What Matters): separate design from product management as soon as the company can afford it; avoid designers reporting into individual product managers once the design team grows; product and design are peers.; source: Peter Merholz and Kristin Skinner, Org Design for Design Orgs (2016). In a 2016 O'Reilly interview about the book Merholz describes three ways to organize designers (centralized like an agency, embedded in product teams, and a 'centralized partnership' in which all designers report through one design leader and work in teams that partner with product teams) and says the senior-most designer should be no more than two levels from the CEO. Used only for these two points; it supplements the author's sources.; scenario: Illustration: at Corvane Noor Achterberg, Head of Design from 2025, reports to Priya Nambiar; the stated cost is that design has no voice of its own in the executive team. | `additional_support`: The options as the author's judgment. → How little the sources add, and what Corvane chose. |\n\n### Where Data Reports\n\n**Controlling idea** (`analysis`, id `where-data-reports`): Data leadership holds three different jobs that join with different parts of the organization, so it reports where the job that matters most is joined; the author's sources say almost nothing about it.\n\n**Advances the thesis** (S5): Applies the rule to data and states the gap in the sources.\n\n**Transition in:** `similarity`: Design placed by where its decisions are joined. → Data placed by the same rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | comparison | A head of data may hold three jobs (the data platform, analysis for decisions, and data built into the product) and each joins with a different part of the organization: the platform with engineering, analysis with product and the business, and data in the product with both. | reasoning: The author's judgment. Under engineering: pipelines and the platform are run like other shared services; cost: analysis becomes a ticket queue for product. Under product: analysts sit with the decisions they inform; cost: the platform is under-engineered. A data executive of its own: only where data is itself what the company sells or where a regulator requires it; cost: one more peer at the top. |  |\n| p25 | context | The author's sources do not treat the data executive at all: Larson's Primer, as the author's record of it has it, names data only as a domain to check for in the engineering leadership team; what this section says is the author's judgment. | source: The author's record gelling-your-engineering-leadership-team (after Larson's chapter): check whether key domains such as Data, Security and Infrastructure are represented in the leadership team.; scenario: Illustration: Corvane in 2026 has no head of data; product analysts report into Priya Nambiar's organization and the data pipelines belong to the platform team under Lena Brandt; the cost is that no one person decides what a measure such as first-visit completion means in both places. | `additional_support`: The options as the author's judgment. → What the sources say, and Corvane's choice. |\n\n### Where Security Reports\n\n**Controlling idea** (`analysis`, id `where-security-reports`): Security reports either inside engineering, close to the systems, or outside it, independent of the deadlines it may slow, and whichever line is chosen it needs a direct path to the CEO; the author's sources say little.\n\n**Advances the thesis** (S5): Applies the rule to security and states the gap in the sources.\n\n**Transition in:** `similarity`: Data placed by where its decisions are joined. → Security placed by the same rule, with one difference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | comparison | A head of security is accountable for stating risk and for the controls against it, and the reporting line trades closeness to the systems against independence from the executive whose deadlines a control may slow, so either line needs a direct path to the CEO for a risk only the CEO can accept. | reasoning: The author's judgment. Under the CTO or VP Engineering: security decisions are joined with engineering decisions every day; cost: the head of security reports to the person who may want the risk accepted. To the CEO, a COO or a legal head: independence; cost: distance from the teams, and a function that reviews from outside becomes a queue (the Review Bottleneck). |  |\n| p27 | context | The author's sources mention security only in passing, as a specialized engineering role, as a concern that belongs to the whole company and as a question to ask about an acquisition; none says where its head should report. | source: Larson's Primer: security engineering among specialized roles within engineering; security among things that should be fundamental company concerns; 'Who's responsible for security at the company, and what are they doing?' as a due-diligence question.; scenario: Illustration: at Corvane a security lead has reported to Dario Vance since 2025, with a standing agreement that a risk Dario Vance would accept and the security lead would not goes to Ines Okafor from both. | `additional_support`: The options as the author's judgment. → What the sources say, and Corvane's choice. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI use adds decisions that need product, engineering and security joined at the top, and the chapter's rule, a role for a join and not for a topic, decides whether a new executive role is warranted.\n\n**Advances the thesis** (S6): Extends the rule to the decisions AI adds, with labeled claims.\n\n**Transition in:** `additional_support`: Six roles placed by the decisions they join. → A new set of decisions that needs joining.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | analysis | Decisions about AI use (which agents and providers, what data may leave the company, what the product may do with a model) need product, engineering and security together, and where nobody at the top holds that join each team decides for itself. | reasoning: Emerging: the author's observation as of November 2026, not a measured result. Illustration: Corvane in 2027-2028, fourteen teams each with their own coding agent, model provider and prompt conventions, and security unable to say what data left the company. |  |\n| p29 | analysis | Whether AI calls for a new executive role or a different configuration is open: by this chapter's rule a role for AI is warranted only where there is a join no existing role can make, and shorter distance between deciding and building may favor the combined executive. | reasoning: Speculative. It would be confirmed if companies that appoint a head of AI can name decisions that role joins and others could not, and if the share of companies with one combined product and technology executive rises among companies that build mostly with agents. | `additional_support`: A join that exists today. → What may follow for roles and configurations. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The three configurations are three places to put one join. Corvane used all three and each answered the hardest joining of its size; what failed each time was not the configuration but a join nobody had written down, between Tomas Rell and everyone in 2019, between product and a busy CTO in 2024, between two peers in 2025.\n\n**So what:** A leader designing the top starts from the decisions that must be made jointly, chooses the configuration that puts a person or a written agreement on the hardest of them, and treats a role created to retain someone as a cost to be stated.\n\n**Callback:** The two drawings that disagreed about who led eleven teams. The reader can now say that the drawings answered the wrong question, and what the right question (who decides what, and what is decided together) produced.\n\n**Takeaway** (`course_of_action`): List the decisions of the last two quarters that needed both product and engineering, mark where each waited, and write the short page of who decides what and what is decided together.\n\n**Hand-off** to [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html): `elaboration`: The joining of what is built and how it is built at the executive level. → The same joining, with design, repeated at every level down to the team.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | synthesis (list) | Established: executives who put their function before the executive team make shared decisions a contest; gaps between executives grow below them; the engineering executive role holds both technical execution and people management. |  |  |\n| p31 | synthesis (list) | Depends on context: which configuration fits depends on the hardest join, which changes with size; where design, data and security report depends on which of their decisions are joined most often, and for data on which of its three jobs matters most; when product needs its own executive follows the rule of thumb from Build What Matters given in the first pattern. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p32 | synthesis (list) | The author's synthesis: the top holds two accountabilities and a join; the mapping of three configurations to conditions; functions report where their decisions are joined; a role made for a person is a cost to state. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p33 | recommendation (list) | The checklist turns the two patterns and the reporting rule into eight questions to ask of the top of an organization. |  | `sequence`: What to take away. → What to do with it. |\n| p34 | transition | The two drawings asked who leads a team, and the answer was a list of who decides what; the joining of what is built and how it is built does not stop at the executive level, and the next chapter follows it, with design, down to the team. |  | `elaboration`: The joining of what is built and how it is built at the executive level. → The same joining, with design, repeated at every level down to the team. |\n\n## Non-goals\n\n- The triad of product, engineering and design at team and group level, and who decides what inside it See [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html).\n- Spans of control, the number of layers and managing managers See [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html).\n- Staff-plus engineers and architects See [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html).\n- Decision rights in general, decision records and Larson's policy, consensus and conviction styles See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Planning and the Nine-Week Plan in detail See [Planning](../grounded-engineering-executive/planning.html).\n- Trust and conflict in teams; Lencioni's pyramid as a whole See [[trust-conflict-and-psychological-safety]].\n- Hiring executives and getting an executive job\n- The COO, CFO, sales and other non-product-and-tech executive roles\n- Business-unit structures after the Routewise acquisition\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Attribution of 'first team': the journal spec calls it Lencioni's term. The author's notes on The Five Dysfunctions and The Four Obsessions do not contain the phrase; Larson's essay and notes use it without crediting Lencioni; a web check found only secondary sources crediting Lencioni. The chapter says the phrase is usually credited to Lencioni, gives the idea from his fifth dysfunction, and quotes Larson's own uses. The author may want to confirm the phrase against the primary text of The Five Dysfunctions or The Advantage.\n- Larson's notes use 'first team' for managers' peers (An Elegant Puzzle) and for the executive's direct reports (the Primer), not for the CEO's team as such; the application to CTO and CPO is marked as the plain reading of Lencioni and the author's extension of Larson.\n- New Corvane facts invented here and appended to the ledger: product managers reported to Tomas Rell until 2025; Dario Vance reports to Tomas Rell; the 2025 written split between them; the two drawings in detail (engineering manager against product manager as leader of each of the eleven teams); the 2025 one-page list of decisions; nine and four escalations to Ines Okafor; Noor Achterberg reports to Priya Nambiar; no head of data in 2026; a security lead under Dario Vance from 2025. The author should check them against chapters 19 to 22, which are written in parallel or later.\n- Chapter 13 left Tomas Rell's part in the engineering strategy unstated. This chapter says he is consulted on it and does not write it, and that he holds the technical side of company-level decisions.\n- The ledger says each product group is 'under a director'; this chapter keeps one director per group in the engineering line and adds that product managers report up to the CPO. Chapter 19 (group-level triad) and chapter 20 (layers) must agree.\n- The chapter reads the Nine-Week Plan of 2026 in part as the cost of joining by agreement between peers; chapter 23 owns the incident and may read it differently.\n- The design, data and security sections are the author's judgment almost entirely. Org Design for Design Orgs is cited only through a 2016 O'Reilly interview with Merholz that was fetched and read; the book itself was not read.\n- No 'Where the Sources Disagree' section: the sources do not disagree on this subject, and the opposing view in the thesis (roles follow people) is answered inside the first pattern.\n\n## Decision log\n\n- **2026-11-19** — Intent, acceptance criteria, thesis and role copied unchanged from the journal spec; supporting claims S1 to S6, and the audience, are this spec's.\n- **2026-11-19** — Corvane is read through one lens, where product and engineering are joined, in two places: its history as a table inside the first pattern, and the 2025 page inside the second, which resolves the opening scene. Rejected: A separate worked-example section at the end, which would hold the scene's answer until after the three reporting sections\n- **2026-11-19** — The three-configuration mapping is presented as the author's position in the table's lead-in and in the take-aways, not as a source's claim.\n- **2026-11-19** — The examples in the chapter differ from acceptance criterion AC-1's probe (a 150-person company with a founder CTO and a CEO deciding product), so that the cold reader applies the procedure. Rejected: Working the probe's own case in the chapter\n- **2026-11-19** — No 'Where the Sources Disagree' section; the style guide asks for it only when the sources do. Rejected: A section setting Lencioni against Larson, who do not disagree\n- **2026-11-19** — Flow rubric (one fresh agent, once): sound with notes. Acted on: the reporting rule is stated once at the start of the design section (p22) so that the three sections read as applications; p31 no longer names conditions the body does not establish; the declared reason now says why the first-team pattern follows the choice and why design, data and security come in that order. Not acted on: merging the three paragraphs on thin sources (p23, p25, p27) into one, because each also carries Corvane's choice for that function and acceptance criterion AC-2 asks for the statement in each section. Rejected: One merged caveat paragraph for design, data and security\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (REVISE; six blocking failures, all at fault in the draft, two corroborated by both flow readers): local clarification of the spec in auto mode. p08 now says that the third configuration (CTO with a VP Engineering) is a division of the engineering side that combines with either of the first two, as the section's flow rationale already said; both flow readers could not tell whether it was an alternative or an add-on. p19 marks the list of joint decisions as the author's extension of Larson's advice. The journal spec's thesis lists the three as parallel cases; its wording was not changed. Rejected: Presenting the three configurations as mutually exclusive, which Corvane's own 2025 arrangement contradicts\n- **2026-11-19** — After round 2 of the draft check (ESCALATE; two corroborated flow failures, one at fault in the draft on p18, one at fault in the spec on p13; seven minor): local and obvious fix to the spec in auto mode. p13's procedure stopped at finding the hardest join and did not choose between peers and one combined executive when that join is product with engineering; its last step now refers the choice to the mapping table's condition (balance or speed). No unit added, dropped or moved. The draft's p13 and p18 were revised once more, with the minor findings on p01, p16, p17, p20, p22, p29 and p33; this is the last permitted revision and it has not been checked by readers. Rejected: A new paragraph on choosing between peers and a combined executive, which would repeat the mapping table\n\n## Sources\n\n- **Internal**\n  - grounded-product-management: right-team — The first product hire and when a product executive follows; design as a function of its own, peer of product, not reporting to individual product managers.\n  - grounded-engineering-executive: working-with-your-ceo-peers-and-engineering, gelling-your-engineering-leadership-team, onboarding-peer-executives, leadership-styles — The author's working practice of Larson's chapters: writing expectations of each other's roles and comparing; joint escalation; the domains to check for in a leadership team. leadership-styles was read and left to chapter 22.\n  - _research/scenario-ledger.md — Corvane's cast, stages, the Founder Queue, the forty-one features, the two drawings, the Nine-Week Plan, the 2027 AI landscape.\n  - journal-spec.json, entries executive-roles-and-reporting-lines, part-5 and the-product-engineering-design-triad — Intent, acceptance criteria, thesis and role, copied unchanged; the part's opening; the hand-off.\n- **External**\n  - Will Larson, The Engineering Executive's Primer (2024); author's notes, _input/bookshelf/docs/notes/engineering-executive.pdf — The definition of the engineering executive; executives focused on their function and zero-sum allocation; onboarding a peer executive; structured escalation (LinkedIn's process as Larson reports it); the 'first team' wording <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
