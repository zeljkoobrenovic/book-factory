<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The three scarce capacities in full — attention, judgment and verification — each with how it runs out and what that looks like at Corvane at three sizes.\n- **Know:** Why a flow moves at the pace of its constraint, and why work waiting between teams usually exceeds work being done.\n- **Know:** Larson's four team states — falling behind, treading water, repaying debt, innovating — and the intervention each calls for.\n- **Believe:** Spreading new headcount evenly across teams is a decision to leave the constraint where it is.\n- **Be able to:** Find the constraint in a delivery flow from wait times.\n- **Be able to:** Name a team's state from stated signals and choose the matching intervention.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given four teams with stated symptoms, the reader assigns each a team state and the matching intervention, and says where new hires should go. *Probe:* Team A's backlog grows every week. Team B ships on time but has no time for cleanup. Team C is halfway through paying down debt. Team D has slack and is exploring. You may hire six people. Where do they go, and what do the other teams need instead? | `custom` | cold_reader | major |\n| AC-2 | The chapter's closing synthesizes Part I and explains Corvane's slowdown using elements, Conway's Law, cognitive load and the constraint together. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n| AC-3 | The four team states are credited to An Elegant Puzzle; claims about queues and constraints not drawn from the author's bookshelf name their source (for example Goldratt or Reinertsen) and say it supplements the inputs. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each of the three capacities is defined with its own example and its own sign of running out before the chapter uses it to locate a constraint, and the reader can say which capacity is exhausted at a described queue. *Probe:* Changes are finished in two days and then wait nine days for a security review by a team of three. Using only this chapter: which of the three capacities has run out, and how can you tell it apart from the other two? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which capacities run out in an organization, where is delivery capacity actually lost, and what should a leader add to recover it?\n\n> **Claim:** Three capacities run out in an organization — attention, judgment and verification — and capacity is lost at one constraining step at a time, most often a queue between teams, where one of the three is exhausted; what recovers it depends on the state of the team behind that step: a team falling behind needs people, one treading water needs less work in progress, one repaying debt needs time, and one innovating needs its slack protected; people added to any other team lengthen the queue at the constraint, although those teams' states still say what each needs that is not headcount.\n\n**Disputed by:** The planning habit of sharing headcount in proportion to team size or to stakeholder pressure, and the belief that every team should be fully utilized.\n\n**So what:** The leader stops sharing headcount in proportion to team size, declines people for a team that is treading water, and accepts visible slack away from the constraint as the price of flow.\n\n**How and why:** A flow cannot deliver faster than its slowest step, and work arriving faster than that step can take it only waits. Larson's states describe four different shortages — people, focus, time, room — so one remedy applied to all of them helps one team and harms the others.\n\n**Supporting claims**\n\n- **S1** — Three capacities run out in an organization, judgment, attention and verification, each with its own sign, and asking what the waiting work is waiting for tells them apart.\n- **S2** — A flow delivers at the pace of its constraint and most of its lead time is waiting between teams, so capacity added anywhere but the constraint lengthens the queue there.\n- **S3** — The constraint is found from wait times: the longest wait marks the step, and what the work waits for names the exhausted capacity.\n- **S4** — Larson's four team states name four different shortages, people, focus, time and room, so each has its own intervention and one remedy for all harms most of them.\n- **S5** — What recovers a flow is the intervention that matches the state of the team at its constraint; the other teams' states say what each needs that is not headcount, and even shares and full utilization leave the constraint where it is.\n\n## Role in the part\n\nGives the full treatment of the three scarce capacities and the rule for finding where the system is limited, completing the reasoning the rest of the book applies at every scale and again for AI. Supports P1-4 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in pace-of-the-constraint, three-capacities, find-the-constraint, four-team-states: each supplies the terms the next uses)\n\nThe reader meets a company that added engineers and slowed down before any term is defined. The rule about constraints comes first because it answers that puzzle directly; the three capacities come second because they answer the question the rule leaves open, what the constraint is short of, and placed before the rule they would stand between the puzzle and its answer, which is the fault chapter 1 had to remove. The pattern for finding a constraint uses both, so placed earlier it would use undefined terms. The team states follow because they say what to add once the constraint is found. The disagreement between Larson and Goldratt comes directly after the headcount rule that joins them, because a reader who sees Larson's fix contradict that rule needs the resolution at once; the anti-patterns come after it so that they read as violations of a settled rule. The worked example follows both because its choice of scope over people uses the three ways of relieving a constraint set out in the resolution. The AI section is a coda that applies the rule to a new source of capacity, and the closing of Part I comes last because it uses this chapter together with the four before it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 a change at Corvane took about two days to write and seventeen more to reach customers. Corvane had just doubled the number of people who did the two-day part.\n\n**Bridge:** Most readers have asked for headcount, received it, shared it fairly among their teams and seen delivery get no faster. → Where the people went matters more than how many there were: a flow has one slowest step, and what that step is short of is not always hands.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Three capacities run out in an organization: attention, judgment and verification. Capacity is lost at one constraining step at a time, most often a queue between teams, where one of the three is exhausted, and what recovers it depends on the state of the team behind that step: falling behind needs people, treading water needs less work in progress, repaying debt needs time, innovating needs its slack protected.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a company add engineers and slow down. *Kept in:* launch-queue-scene.\n- Understand why a flow moves at the pace of its constraint. *Kept in:* pace-of-the-constraint.\n- Tell apart the three capacities a constraint can be short of. *Kept in:* three-capacities.\n- Find the constraint from wait times. *Kept in:* find-the-constraint.\n- Name a team's state and the intervention it calls for. *Kept in:* four-team-states.\n- Know where the sources disagree, and recognize the planning habits that keep a constraint in place. *Kept in:* sources-disagree, anti-patterns.\n- Diagnose Corvane's launch queue, and see what AI does to the rule. *Kept in:* worked-example, what-ai-changes-here.\n- Close Part I by explaining Corvane's slowdown with all of its ideas. *Kept in:* closing-part-one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 a change at Corvane took about two days to write and seventeen more to reach customers, and Corvane had just doubled the number of people who did the two-day part. | scenario: Corvane, 2024, 180 people: 95 engineers (from 45), median lead time from 4 days to 19; of the 19 days about two went into writing a change. |  |\n| p02 | claim | Three capacities run out in an organization, capacity is lost at one constraining step at a time where one of them is exhausted, and what recovers it depends on the state of the team behind that step; the chapter builds this from the rule about flows to the remedy. |  | `problem_solution`: More engineers and a slower company. → The explanation in one claim, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Two Days of Work, Seventeen Days of Waiting\n\n**Controlling idea** (`example`, id `launch-queue-scene`): At Corvane in 2024 every product team was busy and the company was slower, because finished changes waited at one team that had not grown.\n\n**Advances the thesis** (S2): Gives the case the chapter explains: capacity added at the fast step and a queue at the slow one.\n\n**Transition in:** `elaboration`: The lead's two numbers: two days of work in nineteen days of lead time. → The path a change took in 2024 and where it waited.\n\n**Order of paragraphs** (`chronological`): The reader follows one change along its path, from being written to being released, before being told how the company explained the delay.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | In 2024 Corvane had 95 engineers in eleven product teams and a platform team of five, and a change passed through both: a product team wrote it and the platform team launched it. | scenario: Stage 3 in the ledger: 180 people; eleven product teams of about eight formed by dividing people evenly; Platform, five engineers, led by Lena Brandt; all eleven teams needed Platform for some launches and three for every launch. |  |\n| p04 | description (figure) | A launch was a check done by hand and a release in a scheduled slot, and by 2024 fourteen launch requests were open at the platform team. | scenario: New ledger fact: a launch slot was a platform engineer checking a change's readiness by hand (database migrations, configuration, the way back if it failed) and releasing it, because Corvane had no agreed test of readiness that a product team could run itself. Ledger: 14 open launch requests at the peak; lead time 4 days to 19.; figure: Mermaid flowchart LR: 'Product team writes the change (about 2 days)' -> 'Launch queue at Platform: 14 requests open (about 17 days)' -> 'Platform engineer checks and releases (hours)' -> 'Customers'. | `elaboration`: The two steps. → What the second step consisted of and how long work waited for it. |\n| p05 | analysis | Each of the two explanations Corvane's leaders gave, too few engineers and a slow platform team, named a team; neither said why a company with twice the engineers delivered more slowly. | scenario: Chapter 2's account: the 2022 plan assumed too few engineers; the leadership team was preparing to re-cut the eleven teams. | `contrast`: A queue of fourteen at one team. → How the company read it, and what that reading could not explain. |\n\n### Why a Flow Moves at the Pace of Its Constraint\n\n**Controlling idea** (`explanation`, id `pace-of-the-constraint`): A flow delivers no faster than its slowest step, most of its lead time is waiting between teams, and capacity added anywhere else makes the wait longer.\n\n**Advances the thesis** (S2): Gives the principle that answers the scene's puzzle and that every later section applies.\n\n**Transition in:** `problem_solution`: A company with twice the engineers and a longer lead time. → The rule about flows that explains it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The terms are defined, the rule is stated with its sources, the reason waiting dominates is given, and the consequence for headcount is drawn last because it depends on all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | A flow is the path a piece of work takes across teams, made of steps where someone works on it and queues where it waits, and its constraint is the step whose capacity is smallest against what arrives. | source: Larson, on systems thinking: problems are often better described as stockpiles that grow and shrink with their incoming and outgoing flows than as chains of events. |  |\n| p07 | claim | The flow as a whole delivers at the pace of its constraint, whatever the capacity of its other steps. | source: Goldratt's theory of constraints, from The Goal (1984): a system's output is set by its constraint, so time lost at the constraint is lost for the whole system and time saved anywhere else changes nothing. Not on the author's bookshelf; cited for its widely known central claim as a supplement to the author's sources.; source: Meadows: any physical, growing system runs into some kind of constraint sooner or later. | `cause_effect`: The constraint defined as the step with the least capacity against demand. → What that step does to the whole flow. |\n| p08 | explanation | Work usually spends more time waiting between teams than being worked on, because a queue grows steeply as the team behind it approaches full use and because a queue of knowledge work is visible to nobody. | quotation: Larson: \"The expected time to complete a new task approaches infinity as a team's utilization approaches 100 percent\".; source: Reinertsen, The Principles of Product Development Flow (2009): queues are the main source of delay in product development and stay unmanaged because, unlike inventory on a factory floor, they are invisible. Not on the author's bookshelf; widely known central claim, cited as a supplement. | `elaboration`: The constraint sets the pace. → Why the time lost there shows up as waiting, and mostly between teams. |\n| p09 | cause_effect | Capacity added to any step but the constraint sends more work to the constraint's queue, which is what Corvane's hiring wave did. | scenario: Corvane 2022 to 2024: fifty more engineers in the product teams finished more changes; the platform team stayed at five; the launch queue reached 14 and lead time 19 days. | `cause_effect`: Queues form at the constraint. → What adding capacity elsewhere does to that queue, which answers the scene. |\n\n### Three Capacities That Run Out: Judgment, Attention, Verification\n\n**Controlling idea** (`definition`, id `three-capacities`): What a constraint is short of is one of three capacities, judgment, attention or verification, and each has its own sign of running out, shown at Corvane at 12, 50 and 180 people.\n\n**Advances the thesis** (S1): Gives the full treatment of the three capacities that chapter 1 only named, before the chapter uses them to locate a constraint.\n\n**Transition in:** `problem_solution`: A queue shows where work waits, and adding people assumes it waits for hands. → The three things work actually waits for.\n\n**Order of paragraphs** (`chronological`): The capacities are taken in the order Corvane ran short of them, at 12, 50 and 180 people, because that order shows growth moving the limit; the test and the table come after the three definitions because they compare them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | claim | A queue says where work waits and not what it waits for; in a product and tech organization it waits for one of three capacities, and Corvane ran short of a different one at each size. | quotation: Meadows: \"growth itself depletes or enhances limits and therefore changes what is limiting.\"; reasoning: Chapter 1: a redesign creates none of the three capacities; it decides where they are spent. |  |\n| p11 | definition | Judgment is deciding with the relevant information at hand; it is a capacity and not a decision right, and it has run out when work waits for an answer from someone who has too many answers to give or too little information to give them. | scenario: The Founder Queue, Corvane 2019, 12 people, 8 in product and tech: every pricing, design and release decision waited for Tomas Rell, co-founder and CTO. New ledger fact: engineers started a second piece of work while the first waited for his answer.; reasoning: Chapter 1 defines a decision right as the agreed answer to who may decide a named kind of question. Moving a decision right moves where judgment is spent; it adds judgment only if the new holder has the information. | `example`: Three capacities, taken in Corvane's order. → The first: judgment, at 12 people. |\n| p12 | definition | Attention is how much a team, not a person and not a manager, can hold in mind well enough to change it safely, and it has run out when parts of what the team owns can be changed by one person only, slowly, or not at all. | scenario: Corvane 2021, 50 people, 28 in product and tech, four teams: nobody could keep the whole product in mind; Samir Haddad, an engineer in Core, was the only one who understood both the scheduling engine and the mobile sync. New ledger fact: changes that touched both waited for him.; source: Chapter 4 measures this capacity as cognitive load, the term Team Topologies uses. | `sequence`: Judgment at 12 people. → Attention at 50. |\n| p13 | definition | Verification is knowing that what was built is correct and was worth building, and it has run out when finished work waits to be checked, or is released without anyone knowing whether it worked. | scenario: The Launch Queue, Corvane 2024, 180 people: no agreed test of readiness, so five platform engineers checked every launch by hand; 14 launch requests open. | `sequence`: Attention at 50 people. → Verification at 180. |\n| p14 | comparison (table) | The three differ in what the waiting work is waiting for, so the test for any queue is to ask what would empty it: an answer, someone who understands the work, or a check. | example: Changes that wait three days for code review: if any of ten engineers could review them and none has time, the shortage is verification; if only one engineer understands the module, it is attention; if author and reviewer disagree about what the feature should do and nobody settles it, it is judgment.; table: Capacity \\| What it is \\| The work is waiting for \\| Sign that it has run out \\| At Corvane. Judgment \\| deciding with the relevant information at hand \\| an answer \\| started work parked behind a question; decisions travel upward or are guessed \\| the Founder Queue, 2019, 12 people. Attention \\| what a team can hold in mind well enough to change it safely \\| someone who understands it \\| one person per area; changes there are slow or avoided \\| 2021, 50 people: changes waiting for Samir Haddad. Verification \\| knowing the work is correct and was worth building \\| a check \\| finished work waits for review, test or launch; or ships unchecked \\| the Launch Queue, 2024, 180 people. | `conclusion_summary`: Three definitions with three examples. → The one question that separates them, and the three side by side. |\n\n### Pattern: Find the Constraint from Wait Times\n\n**Controlling idea** (`process`, id `find-the-constraint`): The constraint is found by following a few real changes through the flow, timing the waits, and asking at the longest wait what the work is waiting for.\n\n**Advances the thesis** (S3): Turns the principle and the three capacities into a procedure, the chapter's first reader skill.\n\n**Transition in:** `sequence`: The rule about flows and the three capacities. → A procedure that uses both to locate the constraint.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | process (list) | The pattern is for the leader accountable for a flow that crosses several teams, its outcome measure is the flow's lead time and the share of it spent waiting, and it has five steps. | reasoning: Steps: pick one flow and ten to twenty recently released changes; for each, record when work started and when it entered and left each team; add up working time and waiting time per step; the longest wait marks the constraint, which is the step behind that queue; ask what the waiting work was waiting for and name the capacity. |  |\n| p16 | explanation | Delivery metrics say whether a flow is slow, and only the waits measured step by step say where. | source: Accelerate (Forsgren, Humble and Kim, 2018) made lead time for changes one of four key delivery metrics, with deployment frequency, change failure rate and time to restore service; it measures lead time from commit to production, while Corvane measures from starting work to release. | `contrast`: Waits measured per step. → The delivery metrics most organizations already have, and what they do not show. |\n| p17 | analysis | The constraint is often not where the complaints or the busiest people are: every step before it looks busy, and it can be one person. | source: The Phoenix Project (Kim, Behr and Spafford, 2013), a novel: the engineer Brent, through whom every important piece of work passes, is the constraint of the whole IT organization.; scenario: Samir Haddad at Corvane in 2021. | `contrast`: Where the measurements point. → Where intuition points instead, and why it misleads. |\n\n### Four Team States and What Each One Needs\n\n**Controlling idea** (`definition`, id `four-team-states`): Larson's four team states name four different shortages, people, focus, time and room, so each has its own intervention, and the state of the team at the constraint decides what recovers the flow.\n\n**Advances the thesis** (S4, S5): Supplies the second half of the thesis: what to add once the constraint is found.\n\n**Transition in:** `problem_solution`: The constraint located and its missing capacity named. → What to give the team behind it, which depends on the state it is in.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | In An Elegant Puzzle, Will Larson places every team in one of four states along a line from falling behind to innovating, each recognized by a signal anyone on the team can report. | quotation: Larson: \"A team is falling behind if each week their backlog is longer than it was the week before.\" Treading water: critical work gets done, with no room for debt or major new projects. Repaying debt: paying debt down and starting to benefit from it. Innovating: debt sustainably low, morale high, most work on new user needs. |  |\n| p19 | comparison (table) | Each state is short of something different, and Larson gives each its own fix. | table: State \\| Signal \\| Short of \\| Larson's fix \\| What does not help. Falling behind \\| backlog longer every week \\| people \\| hire until the team is treading water \\| asking it to prioritize better. Treading water \\| critical work done; no time for debt or new projects \\| focus \\| consolidate effort, limit work in progress \\| more people. Repaying debt \\| debt going down, each repayment freeing time \\| time \\| add time \\| new projects. Innovating \\| debt low, most work on new user needs \\| room \\| keep enough slack \\| filling its schedule. The 'short of' column is the author's reading; signals and fixes are Larson's. | `elaboration`: Four states and their signals. → What each is short of and the fix for each. |\n| p20 | explanation | The fixes cannot be swapped: people given to a team that is treading water add coordination to a team short of focus, and work or people taken from a team with slack push it back down the line. | source: Larson: adding people disrupts a team's gelling; moving one person can shift an innovating team back into falling behind; slack lets a team build quality in and avoid backtracking. | `cause_effect`: Four different shortages. → What happens when one state's fix is applied to another. |\n| p21 | claim | Joined to the constraint, the states give the rule for headcount: people go to the team at the constraint if it is falling behind, to one team at a time; the capacity that ran out there says which people or which scope; and the other teams' states say what each needs that is not people. | quotation: Larson: \"For each constraint, prioritize one team at a time.\" He also prefers moving scope between teams to moving people.; reasoning: Joining the states to the constraint of a flow is the author's extension; Larson applies them team by team.; reasoning: At a verification constraint the relief is people who can check or checks taken off the team; at a judgment constraint, someone with the information who may decide; at an attention constraint, less to understand. | `additional_support`: States and fixes for one team. → The states used across a flow, together with the constraint. |\n\n### Where the Sources Disagree: Fix the Team or Fix the Flow\n\n**Controlling idea** (`counterargument`, id `sources-disagree`): Larson reasons team by team and Goldratt flow by flow, they disagree about a team that is falling behind away from the constraint, and the book puts the constraint first.\n\n**Advances the thesis** (S5): States the tension inside the chapter's own rule and resolves it, with the trade-off between the three ways of relieving a constraint.\n\n**Transition in:** `contrast`: A rule for headcount that joins Larson's states to the constraint. → The point on which the two sources behind the rule pull apart.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | counterargument | Larson would hire into any team that is falling behind and distrusts optimizing from the top; the theory of constraints says only the constraint deserves capacity and everything else should be paced to it. | source: Larson's chapter has a section titled 'A case against top-down global optimization' and treats gelled teams as something not to disassemble. Goldratt's steps, widely known: find the constraint, get the most from it, subordinate everything else to it, then add capacity to it. |  |\n| p23 | refutation | The book's resolution is to relieve the constraint first, by people, by removing scope or by limiting what reaches it, chosen by how long the shortage will last and who else can safely do the work, and to give a falling-behind team away from the constraint less intake and not people until the constraint has moved. | table: Choice \\| What you gain \\| What it costs \\| Fits when. Add people to the team at the constraint \\| capacity that stays \\| months of hiring and onboarding; the team must gel again \\| the work cannot be done by anyone else and the shortage will last. Move scope away from it \\| relief within a quarter; teams stay intact \\| the receiving teams carry more \\| part of its work can be done safely by the teams that wait for it. Limit what reaches it \\| no new cost; the queue stops growing \\| visible slack upstream \\| relief is on the way and the queue only needs to stop growing. | `problem_solution`: Two sources, two answers. → Which the book follows, and the three ways to do it. |\n\n### Anti-Patterns: Even Shares and Full Utilization\n\n**Controlling idea** (`analysis`, id `anti-patterns`): Two planning habits keep the constraint in place: sharing headcount evenly and aiming for every team to be fully used.\n\n**Advances the thesis** (S5): Shows the two beliefs the thesis disputes and ties them to the named failure patterns.\n\n**Transition in:** `contrast`: The rule for headcount, with its disagreement resolved. → What planning usually does instead.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | analysis | Even shares, headcount divided by team size or by who asks loudest, are a decision to leave the constraint where it is: they give it a fraction of what it needs and send the rest upstream of it, which produces the Overloaded Team and the Review Bottleneck. | quotation: Larson calls the urge to spread limited resources evenly indecision framed as fairness: \"it's not a fair outcome if no one gets anything.\" |  |\n| p25 | analysis | Full utilization treats visible slack as waste, although away from the constraint slack is what keeps work from piling up in front of it, and at the constraint a fully used team is one with a long queue. | reasoning: A team upstream of the constraint that works at full pace produces work that waits; the utilization claim from Larson quoted earlier says what full use does to a queue. | `additional_support`: Even shares. → The second habit, which rests on the same error. |\n\n### Worked Example: The Launch Queue, Diagnosed\n\n**Controlling idea** (`example`, id `worked-example`): Measured by its waits, Corvane's 2024 flow had its constraint at the launch, the capacity exhausted there was verification, the platform team was falling behind, and relief came from removing scope while three other teams got what their own states called for.\n\n**Advances the thesis** (S3, S5): Runs the pattern and the states on the opening case with ledger numbers.\n\n**Transition in:** `example`: The pattern, the states, the choice between people, scope and intake, and the habits to avoid. → All of them applied to the queue the chapter opened with.\n\n**Order of paragraphs** (`prerequisite_order`): The measurement comes first and its reading second, so the example is not judged before it is shown; the intervention follows the diagnosis, the other teams follow the constrained one, and the moved constraint comes last because it exists only after the relief.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | example (table) | Followed step by step, a Corvane change in 2024 spent about two of its nineteen days being worked on. | table: Step \\| Team \\| Working \\| Waiting. Write the change \\| product team \\| about 2 days \\| none. Wait for a launch slot \\| Platform \\| none \\| about 17 days. Check by hand and release \\| Platform \\| hours \\| none. |  |\n| p27 | analysis | The table puts the constraint at the launch, the waiting work was waiting for a check, so the exhausted capacity was verification, and the platform team behind it was falling behind. | scenario: New ledger fact: the number of open launch requests had grown every month since the eleven teams were formed in 2023, to 14 at the peak in 2024. Ledger: no agreed test of readiness. | `cause_effect`: The measured waits. → What they say: the constraint, the capacity and the team's state. |\n| p28 | description | A team that is falling behind needs people or less scope, and Dario Vance, the VP Engineering, chose scope: an agreed set of readiness checks that a product team runs itself. | scenario: The 2024 change brief (chapter 2): a release path the Scheduling team could run without Platform for one quarter; Scheduling's median lead time 6 days after it; company-wide 19 days, then 8 at the two-quarter review, then under 7 a quarter later; nobody was added to Platform and the eleven teams were not re-cut. New ledger fact: the release path replaced the hand check with an agreed set of automated readiness checks. | `problem_solution`: Platform falling behind at a verification constraint. → The intervention chosen and its result. |\n| p29 | example (table) | Three product teams that had asked for engineers in the same review were in three other states. | table: New ledger facts, 2024 review. Team \\| Signal \\| State \\| What it got. Platform \\| open launch requests up every month \\| falling behind \\| scope removed. Dispatch \\| shipped its commitments; six projects open for eight engineers; no cleanup for a year \\| treading water \\| projects in progress cut from six to three; no added engineers. Identity \\| halfway through replacing the old permission model; each finished part cut support work \\| repaying debt \\| two more quarters without new roadmap commitments. Growth \\| little debt; one day a week unplanned, used for experiments \\| innovating \\| its unplanned day kept; no engineers taken from it. | `additional_support`: The team at the constraint. → The teams away from it, and what their states called for. |\n| p30 | analysis | Once launches no longer waited, the longest wait at Corvane was for someone to say that a feature was ready, a shortage of judgment. | scenario: Ledger: left open after the 2024 brief, nobody decides when a feature is ready; stage 4 (2025 to 2026, 500 people) has judgment as the scarce capacity. | `time`: The verification constraint relieved. → Where the constraint went next. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI leaves the rule about constraints as it is and changes where the constraint sits: cheaper writing of changes sends more work to the steps that decide and check.\n\n**Advances the thesis** (S1, S2): Applies the chapter's rule to AI with labeled claims and defers the evidence to Part XI.\n\n**Transition in:** `additional_support`: A constraint that moved once it was relieved. → A force that moves it without any relief: AI.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | analysis | Emerging: coding agents add capacity to the writing step, which in most flows is not the constraint, so the queues grow at review and launch. | reasoning: Author's observation as of November 2026, labeled Emerging; the rule itself is the chapter's. Illustration from the ledger's stage 5: the Review Wall, 2027 to 2028, merged changes up 2.4 times in a year, review capacity flat, median review wait from 5 hours to 31. |  |\n| p32 | claim | Speculative: where agents also take over much of the checking, the constraint moves on to judgment, deciding what is worth building. | reasoning: Labeled Speculative; the evidence is weighed in the chapter Where the Constraint Moves. It would be confirmed where teams with automated verification report that their longest wait is for a decision. | `cause_effect`: Queues at verification. → What follows if verification is relieved too. |\n\n### Closing Part I: Corvane's Slowdown Without a Villain\n\n**Controlling idea** (`synthesis`, id `closing-part-one`): The four ideas of Part I, elements and levers, Conway's Law, cognitive load and the constraint, are one line of reasoning, and together they explain Corvane's slowdown without blaming a person or a team.\n\n**Advances the thesis** (S2, S5): Carries the closing the journal spec assigns to this chapter for Part I: synthesis, so-what and callback to the part's opening question.\n\n**Transition in:** `conclusion_summary`: This chapter's rule, applied to Corvane and to AI. → The same case explained with all of Part I.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | synthesis | Read together, the chapters of Part I explain the slowdown in four steps: teams cut by headcount, software and dependencies that followed those cuts, one launch interface every team needed, and capacity added everywhere except there. | reasoning: Elements and levers (chapter 1): the launch was an interface all eleven teams depended on and a boundary that put every release check inside one team. Product work (chapter 2): the hiring wave had no discovery and no stated outcome. Conway's Law (chapter 3): teams divided evenly, not along the product, built software whose parts could not be released apart. Cognitive load (chapter 4): teams cut by headcount and not along fracture planes owned parts they could not change without touching another team's, which is why a release needed a check from outside the team. The constraint (this chapter): the hires went to the step that took two days. |  |\n| p34 | analysis | Part I opened by asking what would change if Corvane replaced every manager and kept its structure, and the answer is that the queue at the platform team would still be there. | reasoning: The queue came from the placement of a check and from where capacity was added, and neither depends on who the managers are. | `conclusion_summary`: The slowdown explained by structure. → The part's opening question, answered. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Finding the constraint and naming a team's state are two halves of one diagnosis: the wait says where capacity is lost, what the work waits for says which capacity, and the state of the team says what to add. With the earlier chapters this completes Part I's line of reasoning: the arrangement of teams shapes the product, the size of what a team owns limits what it can do well, and the slowest step sets the pace of all of them.\n\n**So what:** The reader stops sharing headcount in proportion to team size, can decline people for a team that is treading water, and can explain a slowdown such as Corvane's without a villain: the hiring wave added capacity where the constraint was not.\n\n**Callback:** The change that took two days to write and seventeen more to reach customers, and Part I's opening question about replacing every manager. The reader can now say where the seventeen days went, what they were short of and why new managers would have found the same queue.\n\n**Takeaway** (`course_of_action`): Draw your own delivery flow across teams, mark the longest wait, and name the state of the team behind it. The checklist gives the steps.\n\n**Hand-off** to [Part II — TOPOLOGY: Teams and Their Interfaces](part-2.html): `problem_solution`: The rules for sizing ownership, placing boundaries and finding the constraint. → The team types, interaction modes and sizes that apply those rules.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | synthesis (list) | Established: a flow delivers at the pace of its constraint, queues grow steeply as utilization approaches full, and Larson's four states each have their own fix. |  |  |\n| p36 | synthesis (list) | Depends on context: whether to relieve a constraint with people, by removing scope or by limiting intake depends on how long the shortage will last and on who else can safely do the work. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p37 | synthesis (list) | The author's synthesis: the three capacities, the question that tells them apart, and the joining of Larson's states to the constraint of a flow are this book's own. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p38 | recommendation (list) | Eight checks let the reader draw their own delivery flow, mark the longest wait and name the state of the team behind it. |  | `sequence`: What to take away. → What to do with it. |\n| p39 | transition | With rules for sizing ownership, placing boundaries and finding the constraint in hand, the open problem is which kinds of team and which ways of working together apply them, which Part II supplies. |  | `problem_solution`: The two-day step and the seventeen-day wait, now explained. → The rules of Part I as a problem Part II solves with team types, interaction modes and sizes. |\n\n## Non-goals\n\n- Assessing a team's cognitive load and placing boundaries See [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html).\n- Team types, interaction modes and team sizes that apply the rules See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html), [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html), [Team Size and Composition](team-size-and-composition.html).\n- Methods for allocating decision rights See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Delivery metrics in depth, and measuring with AI See [[measuring-engineering]], [[measuring-productivity-with-ai]].\n- Technical debt and migrations as engineering practice See [Migrations and Technical Debt](migrations-and-technical-debt.html).\n- Evidence on what AI does to the constraint See [[where-the-constraint-moves]], [[agentic-delivery]].\n- Queueing theory and the theory of constraints as techniques See Reinertsen, The Principles of Product Development Flow, Goldratt, The Goal.\n- The change brief and how Corvane ran the release-path test See [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The chapter states the rule about constraints before the three capacities, while the thesis (copied from the journal spec) lists the capacities first. Confirm the order or reword the thesis.\n- The thesis says a team falling behind needs people; the chapter adds 'or less scope' from Larson's advice to shift scope, and Corvane's fix removed scope. Should the journal-spec thesis say so?\n- Part I's closing is a last body section before What to Take Away, because the conclusion's five fixed units have no room for it. The flow rubric suggested placing it after the take-aways; the page format does not allow that.\n- New Corvane facts to confirm: what a launch slot consisted of, monthly growth of launch requests since 2023, automated readiness checks as the release path, and the states of Dispatch, Identity and Growth at the 2024 review.\n- The AI section makes no Proven claim; published evidence is left to Part XI.\n\n## Decision log\n\n- **2026-11-19** — The rule about constraints comes before the three capacities, so that nothing stands between the scene's puzzle and its answer; the capacities are then introduced as what a constraint is short of. Rejected: Capacities first, in the order of the chapter's question, which repeats the ordering fault found in chapter 1\n- **2026-11-19** — The capacities are presented in the order Corvane ran short of them (judgment at 12 people, attention at 50, verification at 180), and the text says that this is not the order of the usual list. Rejected: The list order attention, judgment, verification, which would put the years out of sequence\n- **2026-11-19** — Part I's closing is carried by a last body section (synthesis and the callback to the part's opening question) and repeated in one sentence in the closing paragraph, because the conclusion's five fixed units have no room for an explanation that uses four chapters. Rejected: Putting the whole part synthesis into the closing hand-off paragraph\n- **2026-11-19** — Goldratt and Reinertsen are gap sources: each is used for one widely known claim, named in the text as a supplement to the author's sources. Accelerate and The Phoenix Project are used only for the four key metrics and for Brent.\n- **2026-11-19** — The AI section makes no Proven claim: it rests on a labeled observation and on Corvane's Review Wall as illustration, and leaves the published evidence to Part XI. Rejected: Citing a survey that was not fetched and read for this chapter\n- **2026-11-19** — New Corvane facts are introduced and appended to the ledger: what a launch slot consisted of, the monthly growth of launch requests, the automated readiness checks, the states of Dispatch, Identity and Growth at the 2024 review, and the signs of the 2019 and 2021 shortages.\n- **2026-11-19** — After the flow rubric (sound with notes): the section on where the sources disagree moves directly after the team states and before the anti-patterns; the capacities table and the test are merged into one unit; the even-shares claim moves from the rule section to the anti-patterns; the headcount rule gains the link from capacity to fix; the criteria for choosing people, scope or intake are stated in the resolution. Rejected: Moving the Part I closing after the take-aways, which the page format does not allow\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (ESCALATE, one fault in the spec): the Part I closing no longer says that five platform engineers could not hold eleven teams' changes in mind, which read as an attention shortage at the launch and contradicted the chapter's own diagnosis of verification. Cognitive load now explains why releases needed an outside check: teams not cut along fracture planes. Local fix made in auto mode under the author's standing instruction. Rejected: Describing the launch queue as short of both verification and attention\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-engineering-executive/posts/organizational-design/index.md and systems-and-tools/index.md — The author's summaries of the four team states and of managing by stocks, flows and the constraint.\n  - _research/scenario-ledger.md — The Founder Queue, the 2021 attention shortage, the Launch Queue, the 2024 change brief and its results, the Review Wall.\n  - journal-spec.json, entries flow-and-the-constraint, part-1 (closing) and part-2 (transition_in) — Intent, acceptance criteria, thesis and role, copied unchanged; the part's closing; the hand-off.\n- **External**\n  - Will Larson, An Elegant Puzzle: Systems of Engineering Management (2019); author's notes, _input/bookshelf/docs/notes/elegant-puzzle.pdf — The four team states, their signals and fixes; one team at a time; shifting scope instead of people; utilization and queueing; slack; the case against top-down global optimization; stocks and flows.\n  - Donella H. Meadows, Thinking in Systems: A Primer (2008); author's notes, _input/bookshelf/docs/notes/thinking-in-systems.pdf — Growing systems meet constraints; growth changes what is limiting.\n  - Eliyahu M. Goldratt and Jeff Cox, The Goal (1984). Gap source, not on the author's bookshelf. — The widely known central claim of the theory of constraints and its steps; cited as a supplement.\n  - Donald G. Reinertsen, The Principles of Product Development Flow (2009). Gap source, not on the author's bookshelf. — The widely known claim that queues are the main and least visible source of delay in product development; cited as a supplement.\n  - Nicole Forsgren, Jez Humble and Gene Kim, Accelerate (2018); Gene Kim, Kevin Behr and George Spafford, The Phoenix Project (2013). On the author's bookshelf. — The four key metrics; Brent as a person who is the constraint.\n\n## Changelog\n\n- **2026-11-19** — Evidence of the first Closing Part I paragraph corrected after round 1 of the draft check (conflict with the verification diagnosis); no change to order or units.\n- **2026-11-19** — Revised after the flow rubric: sources-disagree before anti-patterns with the three affected transitions rewritten, capacities table and test merged, paragraphs renumbered (39). Status set to accepted in auto mode.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>

            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
