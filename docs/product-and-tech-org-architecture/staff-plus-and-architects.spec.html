<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Larson's staff engineer archetypes and what each does.\n- **Know:** The architect as connector between levels, in Hohpe's and the author's Grounded Architecture.\n- **Know:** How the technical track connects to the governance of chapter 14.\n- **Believe:** Senior technical leaders are accountable for decisions across teams, and seniority without that accountability is a title.\n- **Be able to:** Write what a staff or principal engineer in a given group is accountable for.\n- **Be able to:** Tell the technical track's decisions from the management line's.\n- **Be able to:** Recognize the failure forms: the ivory-tower architect and the senior engineer with no scope.\n\n**Audience:** Executives (CTO, VP Engineering, Director) who must define what their staff and principal engineers and architects are for, and engineers on or near that track who want to follow the reasoning.\n\n**Already knows:**\n\n- How software teams work: services, code review, on-call, engineering managers and tech leads\n- From the Part V introduction and chapters 18 to 20: a leader's distinctive work is joining decisions; the management line of managers, directors and executives; spans and layers\n- From chapter 14: governance by advice and records relies on senior engineers; the names advice process and decision record\n- The book's failure-pattern names and its three scarce capacities (attention, judgment, verification)\n\n**Does not yet know:**\n\n- staff-plus\n- technical leadership track\n- Larson's four staff archetypes (tech lead, architect, solver, right hand)\n- the architect elevator (penthouse, engine room)\n- superglue architect\n- scope (of a staff-plus role)\n- backer (of a staff-plus role)\n- role charter\n- advice process and decision record (one-clause reminders; owned by chapter 14)\n- shared area (one-clause reminder; owned by chapter 13)\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a described senior engineer, the reader says what is missing from the role and how to fix it. *Probe:* A principal engineer reviews designs when asked, has no stated scope, and is described by teams as 'very smart, not sure what he does'. Using only this chapter: what is wrong, and what would you write down? | `custom` | cold_reader | major |\n| AC-2 | The chapter's closing synthesizes Part V. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What do senior technical leaders own that managers do not?\n\n> **Claim:** Senior technical leaders — staff and principal engineers and architects — own what the management line is not placed to decide: technical direction that crosses teams, the quality of the decisions teams make for themselves, and the connection between what executives intend and what the code can do; the track works when each such role has a stated scope and accountability, and fails as an ivory tower when it decides without the teams or as an honorific when it decides nothing.\n\n**Disputed by:** The view that technical direction belongs to engineering managers, with senior engineers as their strongest individual contributors, and that a parallel leadership track only blurs accountability.\n\n**So what:** A leader gives each staff-plus role a written scope and a way to be engaged, and judges it by the decisions it improved.\n\n**How and why:** Managers are placed along the reporting line, which follows teams; technical decisions cut across it. Someone has to hold the cross-cutting view with enough technical depth to be believed, and Larson's archetypes and Hohpe's architect who rides the elevator are descriptions of how that is done.\n\n**Supporting claims**\n\n- **S1** — The management line follows the reporting structure, so three things fall outside what any one manager is placed to decide: technical direction that crosses teams, the quality of the decisions teams make for themselves, and the connection between what executives intend and what the code can do.\n- **S2** — Larson's four archetypes and Hohpe's architect who rides the elevator, with the superglue architect of Grounded Architecture, describe how senior technical leaders hold those three things: with a scope wider than one team, by connecting levels, and with authority borrowed from a leader.\n- **S3** — The track works when each role has a written scope and accountability, is engaged through advice and not approval, and is judged by the decisions it improved.\n- **S4** — The track fails as an ivory tower when the role decides without the teams, as an honorific when it decides nothing, and as a hero or a gate when the person becomes the constraint the role was meant to remove.\n\n## Role in the part\n\nAdds the technical leadership track that carries cross-team decisions, and closes Part V. Supports P5-4 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in what-the-line-cannot-decide, four-archetypes, the-elevator, role-charter: what is left unowned is named before the two sources that describe how it is held, and both before the pattern that writes a role down)\n\nThe reader first meets nine senior titles of which most cannot be explained, and one engineer who did three jobs nobody had written down. The principle follows: what the management line is not placed to decide. The two sources then say how people hold that work, from the scope of one team up to the whole company. Only then can the pattern say what to write for a role, because the page it asks for is made of the principle's three kinds of work and the sources' scope, backer and connection. The failures come after the pattern because each is a part of the page missing or misused. The worked example comes after everything it uses and returns to the opening case. Putting the archetypes before the principle would give a list of job types with no reason for any; putting the pattern before the sources would ask for a scope and a backer before either word has a meaning. The AI section comes after the worked example because it tests the finished pattern, and the gate among the failures, against a change that has not yet reached most organizations; placed earlier it would test a pattern not yet shown.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2026 Corvane had nine engineers with a staff or principal title. Its VP Engineering asked for one sentence on each: which decisions that cross teams does this person own or advise on? Two sentences were agreed at once, four named a single team, two could not be written, and for the ninth, Samir Haddad, three leaders wrote three different sentences.\n\n**Bridge:** Most readers know a senior engineer whose title everyone respects and whose job nobody can state, and one on whom everything depends. → Both come from a title given without a statement of what it decides; the question is what senior technical leaders own that managers do not.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): Staff and principal engineers and architects own what the management line is not placed to decide: technical direction that crosses teams, the quality of the decisions teams make for themselves, and the connection between what executives intend and what the code can do. The track works when each role has a written scope and accountability, and fails as an ivory tower or an honorific.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See Corvane's nine titles and the one engineer with three unwritten jobs. *Kept in:* nine-titles.\n- Understand what the management line is not placed to decide. *Kept in:* what-the-line-cannot-decide.\n- Learn Larson's four staff archetypes and what staff engineers do. *Kept in:* four-archetypes.\n- Learn the architect as connector between levels, in Hohpe and in Grounded Architecture. *Kept in:* the-elevator.\n- Learn the pattern: a one-page role charter with scope, decisions, engagement and measures. *Kept in:* role-charter.\n- Recognize four ways the track fails. *Kept in:* anti-patterns.\n- Follow the charter written for Samir Haddad. *Kept in:* worked-example.\n- Know what AI changes. *Kept in:* what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Asked which cross-team decisions each of Corvane's nine staff and principal engineers owned or advised on, its leaders could answer plainly for two, and for its most valued staff engineer they gave three different answers. | scenario: Corvane, 2026, about 500 people, about thirty teams: nine engineers above senior (seven staff, two principal); Dario Vance asks the four group directors and Lena Brandt for one sentence each; two agreed, four name one team, two cannot be written, three different sentences for Samir Haddad. |  |\n| p02 | claim | Senior technical leaders own what the management line is not placed to decide, and the track works when each role has a written scope and accountability; the chapter takes the problem, the principle, two sources, the pattern, the failures and a worked example in that order. |  | `contrast`: The management line of the previous chapter, which follows the reporting structure. → The technical leadership track, which cuts across it, with the chapter's claim and its route. |\n\n## Sections\n\n### Setting the Scene: Nine Titles and One Engineer With Three Jobs\n\n**Controlling idea** (`example`, id `nine-titles`): At Corvane in 2026 most senior technical titles had no statable accountability, and the engineer who mattered most held three jobs, the rule-engine expert, the chair of an approving forum and the strategy's diagnostician, each acquired by request and none written down.\n\n**Advances the thesis** (S4, S1): Gives the case of the opposing view in practice: senior engineers treated as the strongest individual contributors, with titles and no stated scope.\n\n**Transition in:** `elaboration`: The lead's short account of the nine sentences. → The count in full, then the history of the ninth engineer.\n\n**Order of paragraphs** (`large_to_small`): The count of all nine comes first because it shows the problem is not one person's; the one engineer's history then shows what an unwritten role turns into over five years, told in time order. Told the other way, the one engineer's story would read as a personal case and the count as an afterthought.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | The nine titles came with the career ladder of 2025, whose line for staff said only that the engineer has impact beyond their own team, and the nine sentences Dario Vance collected a year later showed two engineers with an agreed cross-team scope, four who led the technical work of one team, two with no statable scope (a principal engineer promoted to keep him and a staff engineer whose target architecture no team followed), and Samir Haddad with three different sentences. | scenario: Illustrative: the 2025 ladder's staff line; autumn 2026 count: 2 agreed; 4 naming one team; 2 not writable (a principal engineer promoted in 2025 after an outside offer, working on his own team's hardest tickets; a staff engineer whose target architecture for his product group its teams had not been asked about and did not follow); Samir Haddad with three sentences (Dario Vance: chairs the architecture forum; a group director: the person we call about the rule engine; Lena Brandt: wrote the strategy's diagnosis with her). |  |\n| p04 | example | The first sentence, the person to call about the rule engine, goes back to 2021 and 2022, when Samir Haddad was the only engineer who understood both the scheduling engine and the mobile sync: changes that touched both waited for him, his knowledge made the 2022 rule engine possible, and afterwards he was the only one who could safely change its overlap logic. | scenario: Ledger: 2021, 50 people, 28 in product and tech; changes touching both parts waited for Samir Haddad; the 2022 fix moved scheduling and job-status rules into one rule engine in Core; late 2022 (about 45 engineers) he was the only person who could safely change the overlap logic. In 2025 Dario Vance asked him, as the person who knew the domain, to assess Scheduling and Dispatch; after the re-cut four engineers could change the job-status rules. | `example`: The ninth of the nine. → Where his three sentences came from, starting in 2021. |\n| p05 | example | The other two sentences came in 2025 and 2026, when he was asked to chair a forum that approved designs and to write a diagnosis for the engineering strategy: with the rule engine, three jobs of cross-team work, each given by request, none stated as his role, and one of which had made him a queue. | scenario: Ledger: from 2025 he chaired the architecture forum, which had to approve designs that added a technology or changed an interface between teams (36 designs in the first half of 2026, median wait 23 days); in 2026 he wrote one of two independent diagnoses for the engineering strategy and sat in its working group. New, illustrative: at the end of 2026 two parts of the mobile sync could still be changed safely by one engineer only. | `time`: The engineer on whom two systems depended. → The same engineer four years later, with wider work and still no written role. |\n\n### What the Management Line Cannot Decide\n\n**Controlling idea** (`explanation`, id `what-the-line-cannot-decide`): Managers are placed along the reporting line, which follows teams, so technical direction across teams, the quality of teams' own decisions and the connection between executive intent and the code fall to no manager; the technical track is the set of roles that holds them, and it divides cleanly from the line when the division is written.\n\n**Advances the thesis** (S1): States the principle: what the track owns and why the management line is not placed to own it, and answers the opposing view.\n\n**Transition in:** `cause_effect`: Nine titles without a stated purpose. → The reason such roles exist at all: what the management line leaves unowned.\n\n**Order of paragraphs** (`prerequisite_order`): The placement argument comes first, then the three kinds of work it leaves unowned, then the strongest objection, then the division of decisions that answers it. The objection can be answered only once the three kinds of work are named; put first, it would be an argument about titles.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | explanation (figure) | A manager joins the decisions of the teams that report to them, and a technical decision often crosses teams that report to different managers, so the first manager placed to join it may be two or three levels up and too far from the code to judge it. | figure: Figure 1 (Mermaid): Corvane in 2026: VP Engineering, two group directors, three engineering managers, three teams (Scheduling, Dispatch, Technician App); a staff engineer whose scope, the scheduling domain, crosses the three teams and both directors; the VP backs the role.; reasoning: Carries over from the Part V introduction and chapter 20: a layer joins decisions across the units below it. Defines staff-plus (staff and principal engineers, and architects) and the technical leadership track; the ladder and its levels belong to career-ladders-and-leveling. |  |\n| p07 | definition (table) | Three kinds of work fall outside the line: technical direction that crosses teams, the quality of the decisions teams make for themselves, and the connection between what executives intend and what the code can do. | table: Three rows. Columns: what the track holds; why the line is not placed to hold it; at Corvane. Direction across teams (the first common manager is too far from the code; the 2022 rule engine joining Web, Mobile and Integrations). Quality of teams' own decisions (a manager judges the team's results and people, and advice needs knowledge of several teams' systems; advice on a decision record). Connection between intent and code (executives decide without knowing what the code can do, teams build without knowing the intent; the 2026 strategy's finding that messaging must come down to one broker before product strategy step 1 can reach its milestone). | `elaboration`: Decisions that cross the line. → The three kinds of work this leaves unowned. |\n| p08 | counterargument | The strongest objection is that technical direction belongs to engineering managers and a second track blurs accountability; it holds only where the track's roles are unwritten, because a manager's span is set by people and not by the systems a decision touches. | reasoning: The opposing view from the thesis's disputed_by. Answer: an engineering manager who also set cross-team technical direction would need a say over teams that do not report to them; the blur the objection fears is real when a staff engineer's decisions are unstated (Corvane's nine), and disappears when they are listed.; source: Will Larson, Staff Engineer (2021): managers do not always know how to support their most senior engineers (author's Kindle notes, page 7). | `contrast`: Work the line is not placed to hold. → The view that the line should hold it anyway, and why that fails. |\n| p09 | comparison (table) | Written down, the division is plain: the management line decides who works on what, with which priorities and how people are judged and developed, and the technical track decides or advises on technical choices that reach beyond one team. | table: Five rows. Columns: decision; management line; technical track. Rows: who is on a team and who is hired (decides; advises on the skills needed); a team's priorities for the quarter (decides, with product; states technical constraints and risks early); a technical choice inside one team (not involved; advises if asked, the team decides); a technical choice that crosses teams in the role's scope (hears the cost; decides after advice, or advises the named decider); technical direction of a group or domain (funds it, holds teams to it; writes and maintains it). The author's synthesis, agreeing with the author's record staff-plus-technical-leadership (partnership boundaries). | `problem_solution`: The fear of blurred accountability. → The division of decisions that removes it. |\n\n### Larson's Four Archetypes\n\n**Controlling idea** (`definition`, id `four-archetypes`): Will Larson's four staff archetypes, tech lead, architect, solver and right hand, are four shapes of scope for the same work of setting direction, improving others' decisions and carrying engineering context to leaders, each done with authority borrowed from a manager or executive.\n\n**Advances the thesis** (S2): Supplies the first source's description of how the cross-cutting work is held, and the idea that its authority is borrowed.\n\n**Transition in:** `example`: The technical track as a set of decisions. → Larson's description of the people who hold them.\n\n**Order of paragraphs** (`prerequisite_order`): The four archetypes come first because they say where a staff engineer works; what staff engineers do comes next because it is the same across the four; borrowed authority comes last because it follows from both and leads to the backer in the pattern. Borrowed authority before the archetypes would have nobody to borrow from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition (table) | Larson describes four archetypes of staff engineer, which differ in scope: the tech lead guides one team or a cluster of teams, the architect (his name for one archetype; the book's wider sense of the word comes in the next section) is responsible for a critical technical area, the solver goes deep into one hard problem after another, and the right hand extends an executive's attention. | table: Four rows. Columns: archetype; what it does (Larson); scope. Where each archetype's authority comes from is given in the prose of p12, not in the table: Tech Lead: guides the approach and execution of a team, partners closely with one manager; one team or a cluster; that manager. Architect: responsible for direction, quality and approach within a critical area, which must be complex and enduringly central; one technical area across teams; the leader who needs the area to hold. Solver: digs into arbitrarily complex problems until resolved; one problem at a time, wherever leadership points; the leader who assigns the problem. Right Hand: extends an executive's attention, borrowing their scope and authority; the executive's organization; that executive. Larson's rules of thumb, presented as his: roughly one tech lead for every eight engineers; in the companies he describes the architect and right hand emerged at about one hundred and one thousand engineers. |  |\n| p11 | explanation | Across the archetypes, Larson says, staff engineers keep doing what senior engineers do, but as auxiliary tasks; the core becomes setting and editing technical direction, sponsoring and mentoring, injecting engineering context into organizational decisions, exploring, and what Tanya Reilly calls being glue, which map onto this chapter's three kinds of work. | source: Larson, Staff Engineer, pages 26–30 of the author's notes: the list of what staff engineers do; 'in senior positions, you’re accountable to the business and organization first and yourself second'; injecting engineering context 'while it’s still possible to change the outcome'. The mapping onto the three kinds of work (direction across teams; sponsorship, mentorship and glue as the quality of others' decisions; engineering context as the connection to executives) is the author's extension. | `elaboration`: Four scopes. → The work that is common to all four. |\n| p12 | analysis | A staff engineer's authority is borrowed: Larson says it of the right hand, who must stay deeply aligned with the executive whose authority they borrow, and I extend it to all four archetypes, so every staff-plus role needs a named backer. | quotation: Larson, Staff Engineer (notes, page 23): 'borrowing authority comes with the obligation of remaining deeply aligned with that leader’s approach, beliefs, and values.' Defines backer (Larson uses sponsorship for what a staff engineer gives other engineers, so the book uses a different word): the manager or executive whose authority the role borrows and who answers for it. The generalization from the right hand to all archetypes is the author's extension. | `cause_effect`: Work that crosses teams the engineer does not manage. → Where the authority for it comes from. |\n\n### The Architect Rides the Elevator\n\n**Controlling idea** (`definition`, id `the-elevator`): Hohpe's architect rides an elevator between the penthouse where strategy is set and the engine room where the code is written, and Grounded Architecture's superglue architect holds architecture, technology, business needs and people together; both describe the third kind of work, connection, and both require that the connector stay grounded in the code.\n\n**Advances the thesis** (S2): Supplies the second source's description: the role defined by connecting levels, and the condition that keeps it from becoming an ivory tower.\n\n**Transition in:** `additional_support`: Archetypes that differ by scope. → A second description, by movement between levels.\n\n**Order of paragraphs** (`prerequisite_order`): Hohpe's image comes first because Grounded Architecture builds on it; the second paragraph adds what is connected and settles the word architect. Reversed, the superglue image would arrive without the two floors it joins.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | Hohpe's architect is valuable for riding between the floors of the organization: the worst case, he writes, is that the people with the information cannot decide and the people who decide lack the information, and the architect carries each to the other. | source: Gregor Hohpe, The Software Architect Elevator (2020), author's notes: the engine room and corporate leadership (page 11); 'The worst-case scenario materializes when people holding relevant information or expertise aren’t empowered to make decisions, whereas the decision makers lack relevant information.' (page 8); architects 'make sense and they make decisions' (location 80); translating technical options into meaningful choices for the business (page 75). The penthouse and engine room wording is as Grounded Architecture reports Hohpe. |  |\n| p14 | definition | Grounded Architecture takes the same line with the superglue architect, who holds architecture, technology, business needs and people together through translation and judgment more than formal authority; in this book an architect is anyone on the track whose scope is a technical area or the whole landscape, whatever the title, and the role needs an engineering foundation to be believed. | source: Grounded Architecture (author's online book, grounded-architecture.io, accessed November 2026), 'Thinking Like an Architect: Architects as Superglue': 'Technical strength is necessary for architects, but it is rarely sufficient.'; the four things connected; value from translation, alignment and judgment rather than formal authority. 'Navigating Career Paths in Architecture': tracks of senior, principal and enterprise architect; titles vary; 'In short: real influence starts with real experience.' 'Architect Archetypes' appendix: surveys Larson's four, Hohpe's movie-star architects and Orosz's twelve, among them the ivory tower architect. One sense per term: Larson's Architect is one of four staff archetypes; Hohpe and Grounded Architecture use architect for the connecting role; the book's sense is stated. | `similarity`: The elevator between two floors. → The author's version of the same role, and the book's sense of the word architect. |\n\n### Pattern: The Role Charter\n\n**Controlling idea** (`recommendation`, id `role-charter`): Each staff-plus role gets one written page, a role charter, that states its scope and backer, the decisions it owns and advises on, how teams engage it and how its impact is judged; the page's users are the teams in scope, the backer and the engineer.\n\n**Advances the thesis** (S3): Turns the principle and the sources into what a leader writes down for each role, with the pattern's users and outcome measures.\n\n**Transition in:** `problem_solution`: What the track holds and how the sources say people hold it. → The page that makes one role explicit.\n\n**Order of paragraphs** (`prerequisite_order`): The page's parts and its users come first; scope is then chosen because every other line depends on it; what the role decides and what it only advises on follows, because that line is drawn inside the scope; engagement follows because it is how those decisions are reached; judging comes last because it measures the others. Judging before the decides line would measure a role whose decisions are not yet named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition (table) | A role charter is one page with seven lines, scope, backer, decides, advises on, engaged by, judged by and not this role's, written for three users: the teams in the scope, the backer and the engineer. | table: Seven rows. Columns: line; what it states. Scope; Backer; Decides; Advises on; Engaged by; Judged by; Not this role's. The name role charter and the page are the author's recommendation; the author's records staff-and-principal-engineers (clarify scope, blast radius and level, after Orosz) and staff-plus-technical-leadership (staff-plus roles need clear missions) ask for the same thing. |  |\n| p16 | comparison (table) | Scope is the first choice and a trade-off: one team, one group, one technical area that crosses groups, or the whole company, each fitting a different condition and each with a different backer. | table: Four rows. Columns: scope; backer; fits when; what it risks. One team (Larson's tech lead): the engineering manager; the team's technical work needs a lead; senior work under a staff title. One group: the group's director; the group's teams share systems and their choices collide; becoming the director's deputy. One technical area across groups (Larson's architect): the VP Engineering or the owner of the area; the area is complex and enduringly central, in Larson's words; distance from any one team's code. The whole company (Larson's right hand, an enterprise architect): the CTO; at the size where one executive cannot attend to everything; the ivory tower. Recommendation with its condition: at Corvane's 500 people most staff-plus roles should have a group or an area as scope. | `elaboration`: The parts of the page. → The first part, scope, as a choice among four. |\n| p16b | explanation | The role decides only what crosses teams inside its scope and no team or manager is placed to decide, which is the written direction of the scope and a cross-team choice the teams cannot settle among themselves; everything else it advises on, and the team or the named decider decides. | reasoning: Follows chapter 14's default that the team decides after advice, and the division table of the principle section. A short decides line and a longer advises-on line is the normal shape; a decides line that grows is the gate forming. The author's recommendation. | `elaboration`: A chosen scope. → The line inside it between what the role decides and what it advises on. |\n| p17 | process | The role is engaged through the advice process of chapter 14 and not through sign-off: teams ask early, the advice is written into the decision record, the team or the named decider decides, and the staff-plus engineer stays close enough to the code to be worth asking. | source: Chapter 14 (architecture-governance): the advice process, in which a team decides after seeking advice from those affected and those with expertise, and records it; the staff-plus roles give advice early and turn repeated advice into a paved path. Larson: engineering context injected 'while it’s still possible to change the outcome'. Hohpe: 'Staying grounded in reality and receiving feedback on decisions from real project implementations is vital for architects.' (notes, page 4). The author's records advice-in-public and pragmatic-tech-lead. | `sequence`: What the role decides and advises on. → How teams reach the person who holds them. |\n| p18 | recommendation | The role is judged by the decisions it improved, which can be read from the records that name its advice, from repeated advice turned into something teams no longer need to ask for, and from how many parts of the scope still depend on one person; the charter has worked when any team in the scope can say what the role is for and how to reach it. | source: Hohpe's three legs of an architect, skill, impact and leadership, with impact measured by benefit to the business and leadership by whether others are grown (notes, pages 38–41); Larson: 'You’re far more likely to change your company’s long-term trajectory by growing the engineers around you than through personal heroics.' (notes, page 28). The author's record staff-plus-technical-leadership: work should leave durable output. Measures (the author's recommendation): share of cross-team decision records in scope that name the role's advice and say what it changed; count of parts in scope only one engineer can change; whether every team in scope can say what the role is for. | `sequence`: How the role is engaged. → How its effect is judged, and for whom the page is written. |\n\n### Anti-Patterns: The Ivory Tower, the Honorific, the Hero and the Gate\n\n**Controlling idea** (`analysis`, id `anti-patterns`): The track fails in four recognizable forms, each a part of the charter missing or misused: the ivory tower decides without the teams, the honorific decides nothing, and the hero and the gate make the person the constraint.\n\n**Advances the thesis** (S4): Names the failure forms of the thesis and ties each to the part of the page whose absence produces it.\n\n**Transition in:** `contrast`: The role written down. → What the role becomes when a part of the page is missing.\n\n**Order of paragraphs** (`grouping`): The two failures named in the thesis come first, as opposites; the two in which a working role becomes a constraint follow together, because they share a cause and a measure. The hero and the gate first would hide that the thesis's two named failures are the simple ones: a line of the page left empty.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | analysis | The ivory-tower architect decides without the teams: direction is written at a distance from the code and handed down, so it is wrong in ways only the teams can see, and it is ignored, as the target architecture of Corvane's staff engineer was. | source: Orosz's ivory tower architect, as surveyed in Grounded Architecture's 'Architect Archetypes' appendix and in the author's record staff-and-principal-engineers (theory without practical context, the walk-away advisor); Hohpe: 'leadership without (prior) impact lacks foundation and might be a warning signal that an architect has become an ivory tower resident with a weak link to reality.' (notes, page 40). Missing part of the charter: the engagement line. Corvane: the staff engineer whose target architecture the teams were not asked about. |  |\n| p20 | analysis | The honorific is the opposite: a title with no scope, given to reward or to keep a strong engineer, like Corvane's principal engineer promoted after an outside offer, whose holder goes on doing senior work and decides nothing across teams. | reasoning: The Part V thesis names the view that leadership structure is a matter of giving strong people titles that keep them. Signs: 'very good, not sure what they do'; the role's work is the team's hardest tickets; the author's records call it senior-plus-plus and status without mission. Missing parts: scope and backer. The level and promotion question belongs to career-ladders-and-leveling. Corvane: the principal engineer promoted in 2025 after an outside offer. | `contrast`: A role that decides without the teams. → A role that decides nothing. |\n| p21 | analysis | In the hero and the gate the role does real cross-team work but through one person's hands: the hero holds knowledge or work a team should hold, which is the Hero Culture, and the gate approves what teams should decide, which is the Review Bottleneck; the hero shows in the count of parts only one engineer can change, and the gate in a decides line that has swallowed the advises-on line and in teams that wait. | source: Failure-pattern definitions from the failure-patterns page (The Hero Culture; The Review Bottleneck). Hohpe: scaling vertically 'can lead to a single point of failure (you!)', so scale horizontally (notes, page 41). Larson on personal heroics (page 28). Corvane: Samir Haddad in 2021–2022 (hero) and as chair of the approving forum in 2025–2026 (gate). Misused part: Decides swallows what should be Advises on, or the knowledge is never handed over. | `additional_support`: Two failures of a role that does too little with the teams. → Two failures of a role that does too much in their place. |\n\n### Worked Example: Samir Haddad's Page\n\n**Controlling idea** (`example`, id `worked-example`): In late 2026 Corvane wrote a charter for each of its nine staff-plus engineers, starting with Samir Haddad, whose page turned three unwritten jobs into one scope with stated decisions, a way to be engaged and three measures.\n\n**Advances the thesis** (S3, S4): Applies the pattern to the opening case and shows what it changed and what it cost.\n\n**Transition in:** `example`: The page and its four failure forms. → The page as Corvane wrote it for the engineer of the opening.\n\n**Order of paragraphs** (`chronological`): The page is shown first, then the other eight, then what was measured two quarters later; the result is judged only after the page has been shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | example (table) | Samir Haddad's charter, written with Dario Vance as backer, gave him the scheduling domain across three teams and two directors as scope, and listed what he decides, what he advises on, how he is engaged, how he is judged and what is not his. | table: Corvane, late 2026, about 500 people. Seven rows as in the pattern. Scope: the scheduling domain: the rule engine and its versioned schema (Scheduling), the dispatch board's use of it (Dispatch) and the mobile sync (Technician App); three teams under two directors. Backer: Dario Vance. Decides: the technical direction of the domain, a page revised twice a year; a technical change that crosses the three teams when they cannot agree, after their written advice. Advises on: every decision record that changes the rule schema or the sync; shared-area decisions that touch the domain, which Lena Brandt decides. Engaged by: a question in the decision record, answered in writing within three working days; the weekly forum, which he convenes and which advises; each quarter he works in the code of one of the three teams. Judged by: records in the domain that name his advice and say what it changed; parts of the domain only one engineer can change. Not his: who works on what, priorities, hiring, performance (managers, with product); the scheduling rules (the Scheduling team since 2026); shared-area choices (the Director of Platform). |  |\n| p23 | example | The other eight pages followed the count: the four team leads got a page naming one team and its manager as backer, the two with an agreed scope had theirs written as it stood, the author of the unfollowed target architecture withdrew it and took his group's open decision records as his work, and the principal engineer was given the technical direction of his own group. | scenario: Illustrative, late 2026: all nine have a page; pages are published where teams can find them. | `sequence`: One page. → The other eight. |\n| p24 | evidence | Two quarters later eleven of the fourteen decision records in the scheduling domain named his advice and six said what it had changed, the parts of the mobile sync that only one engineer could change had gone from two to none, and the cost was a quarter in which he wrote less code and two hard conversations among the nine pages. | scenario: Illustrative figures, first half of 2027: 14 decision records touching the domain, 11 naming his advice, 6 stating a change; single-engineer parts in the mobile sync 2 → 0 (Scheduling had none since the 2025 re-cut); the forum no longer hears his name as approver (it advises since the 2026 strategy). Cost stated. | `cause_effect`: Nine written pages. → What the measures on the first of them showed, and what it cost. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): Coding agents make written technical direction more useful, because agents can be given it, and make the staff-plus engineer as personal reviewer untenable, so the role moves from checking changes to writing what is checked.\n\n**Advances the thesis** (S3, S4): Tests the charter and the gate anti-pattern against cheaper code production, with labeled claims.\n\n**Transition in:** `additional_support`: The track among people who write code. → The same track when agents write much of it.\n\n**Order of paragraphs** (`chronological`): What is practised now comes before what may follow from it; the speculative claim reasons from the observed practice, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | analysis | Emerging: staff-plus engineers in teams that use coding agents put their technical direction into the files, templates and checks the agents work from, so written direction reaches code that no person was briefed on; this is the author's observation, with no published measurement. | reasoning: Announces the label scheme. The author's observation as of November 2026, marked as such; agrees with chapter 14's Emerging claim on decision records as agent context. No Proven claim is made. |  |\n| p26 | claim | Speculative: when agents multiply code changes, a senior engineer who reviews every change becomes the gate at a larger scale, as in the book's Corvane story for 2027–2028, and the judgment of staff-plus engineers is better spent on what is checked automatically and on the decisions agents cannot make; it would be confirmed where review waits grow with change volume and fall where senior review is replaced by written checks. | scenario: Ledger: in 2027–2028 two senior engineers reviewed everything while agents opened three times as many pull requests; the Review Wall: merged changes up 2.4 times in a year, review capacity flat, median review wait 5 hours to 31. where-the-constraint-moves weighs the published evidence. | `cause_effect`: Direction that agents can read. → What happens to the senior engineer as reviewer when changes multiply. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** A staff-plus role is a decision-joining role like a manager's, placed across the reporting line where a manager's is placed along it; and with it Part V has four answers to one question, where must decisions be joined: at the top, across functions, down the line and across teams.\n\n**So what:** A leader gives each staff-plus role a written scope and a way to be engaged, and judges it by the decisions it improved; Corvane's two drawings disagreed for the same reason its nine titles could not be explained: nobody had said which decisions each role makes.\n\n**Callback:** Corvane's nine sentences and Samir Haddad's three, and, for the part, the CTO's and the CPO's two drawings of the organization. The reader can now say why three leaders wrote three sentences for one engineer and what the single page says; and why the two drawings disagreed: nobody had said which decisions the CTO and the CPO make together.\n\n**Takeaway** (`course_of_action`): For each staff-plus engineer write the one-page charter; and for each leadership role and layer in your organization, write the decisions it joins that no one else can.\n\n**Hand-off** to [Part VI — ALIGNMENT: Decisions and Planning](part-6.html): `elaboration`: Leaders and the levels at which decisions recur. → The mechanisms by which those decisions are made, recorded and turned into plans.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | synthesis (list) | Established: Larson's four archetypes and his account of staff work, Hohpe's architect who connects levels and stays grounded in implementation, and the two authors' shared point that growing other engineers counts for more than personal heroics. |  |  |\n| p28 | synthesis (list) | Depends on context: which archetypes an organization needs, what scope a role should have, and whether architect is a separate title depend on size, on how far technical choices cross teams and on how many layers the line has. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p29 | synthesis (list) | The author's synthesis: the three kinds of work the line leaves unowned, the role charter with a backer, borrowed authority extended to all archetypes, and judging the role by decisions improved and single-person parts removed are the author's. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p30 | recommendation (list) | Eight checks let the reader test their own staff-plus roles: a staff-plus role joins decisions across the reporting line, and the page is what makes that visible. |  | `sequence`: What to take away. → What to do with it. |\n| p31 | transition | Part V's four chapters are four answers to one question, where must decisions be joined; Corvane's two drawings disagreed because nobody had said which decisions the CTO and the CPO make together; the reader should write, for each role and layer, the decisions it joins that no one else can; and Part VI takes up how those decisions are made, recorded and turned into plans. |  | `elaboration`: Leaders and the levels at which decisions recur. → The mechanisms by which those decisions are made, recorded and turned into plans. |\n\n## Non-goals\n\n- The instruments of governance: advice, nudges, taxes, mandates and the decision record See [Architecture Governance: Advice, Guardrails and Mandates](architecture-governance.html).\n- The career ladder: levels, the dual track, promotion to staff See [[career-ladders-and-leveling]].\n- Performance reviews and calibration of senior engineers See [[performance-calibration-and-growing-managers]].\n- Spans, layers and what a manager of managers decides See [Spans, Layers and Managers of Managers](spans-layers-and-managers-of-managers.html).\n- Decision rights and records beyond technical decisions See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- Architecture methods, notations and enterprise architecture frameworks\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The name role charter and the word backer are the chapter's own; the author may prefer mission (used in org-design/staff-plus-technical-leadership) or sponsor.\n- The bookshelf has no notes on The Staff Engineer's Path (Reilly) or The Software Engineer's Guidebook (Orosz); the chapter uses them only through Larson's citation of glue and the author's records. Confirm that is enough.\n- The notes on Staff Engineer stop at page 33 and hold nothing on sponsorship as a way to reach staff or on 'staying aligned with authority' beyond the right hand; the chapter extends borrowed authority to all archetypes as the author's extension.\n- New Corvane facts (nine titles, the count, Samir Haddad reporting to Dario Vance as backer, three teams under two directors, the charter, the first measures) should be checked against chapters 19, 20 and 25 when they are written.\n- The Part V closing is carried in the final paragraph together with the hand-off to Part VI; the flow rubric would have split it.\n\n## Decision log\n\n- **2026-11-19** — Open with a count of nine senior titles and three sentences for one engineer, so that the unwritten role is met as a puzzle before the principle explains it. Rejected: Opening with Larson's archetypes; Opening with the 2021 hero scene alone, which the failure-patterns page already uses\n- **2026-11-19** — Name the pattern a role charter: one page with scope, backer, decides, advises on, engaged by, judged by, not this role's. The name is the author's recommendation, not a term from the sources. Rejected: Calling it a mission, as the author's org-design record does, which the book has not defined; A job description, which describes a level and not a scope\n- **2026-11-19** — Use the acceptance probe's case (a principal engineer who reviews designs when asked) nowhere in the text; the two unwritable Corvane roles are a promoted-to-keep principal and a staff engineer with an unfollowed target architecture, so that the cold reader has to apply the pattern. Rejected: Using the probe's case as the worked example\n- **2026-11-19** — Treat architects and staff and principal engineers as one track and fix one sense of architect for the book (a role on the track whose scope is a technical area or the landscape), noting Larson's narrower use as one of four archetypes. Rejected: A separate section on architects as a profession; A 'Where the Sources Disagree' section: the sources differ in vocabulary, not in claim\n- **2026-11-19** — Use The Staff Engineer's Path (Reilly) only for the term glue as Larson and Grounded Architecture cite it, and The Software Engineer's Guidebook (Orosz) only through the author's records, because the bookshelf has no notes on either. Rejected: Citing either book's content from memory\n- **2026-11-19** — The trade-off table is the choice of scope (team, group, area, company) inside the pattern section, not a section of its own. Rejected: A separate Trade-offs section on where staff-plus engineers report\n- **2026-11-19** — Carry the Part V closing in the last paragraph (p31) with the hand-off to Part VI, and the chapter's own synthesis in the checklist lead-in (p30), as chapter 14 does. Rejected: A separate closing section for the part, which the house format has no place for\n- **2026-11-19** — Flow rubric (one run): sound with notes. Applied: a paragraph on what the role decides against what it advises on added to the pattern (p16b); the pattern's users moved to its first paragraph (p15); the two engineers without a scope named in the opening count (p03) and used as the cases of the ivory tower and the honorific (p19, p20) ookshelf/docs/notes/staff-engineer.pdf — The four archetypes; what staff engineers do; the rules of thumb on tech leads and on when archetypes emerge; borrowed authority and alignment; growing others over personal heroics.\n  - Gregor Hohpe, The Software Architect Elevator (2020); author's Kindle notes, _input/bookshelf/docs/notes/architect-elevator.pdf — The elevator between levels; decision makers who lack information; staying grounded; the three legs of skill, impact and leadership; the ivory tower warning; the single point of failure.\n  - Željko Obrenović, Grounded Architecture (grounded-architecture.io): 'Thinking Like an Architect: Architects as Superglue', 'Navigating Career Paths in Architecture', 'Architect Archetypes'; fetched and read 2026-11-19 — The superglue architect and what it connects; career tracks for architects and the engineering foundation; the survey of archetypes, among them Orosz's ivory tower architect.\n\n## Changelog\n\n- **2026-11-19** — Spec created from the journal-spec entry.\n- **2026-11-19** — Flow-rubric notes applied (p16b added; p03, p04, p05, p10, p15, p18, p19, p20, p21, p26, p27 reworded; flow labels and reasons); sponsor renamed backer; status set to accepted in auto mode.\n- **2026-11-19** — Evidence notes of p09, p10, p15, p22, p23 and p24 trimmed to what the draft carries after cutting for length (table columns and one measure); no units changed.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
