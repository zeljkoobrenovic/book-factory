<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** How spans follow from team size and how layers follow from spans and headcount.\n- **Know:** Larson's rules of thumb for managers and managers of managers, with their reasons.\n- **Know:** What each layer costs: delay, distance from information, and salary.\n- **Believe:** A layer is justified by the decisions only it can join; otherwise it is delay.\n- **Believe:** Managing managers is a different job from managing a team.\n- **Be able to:** Compute the layers an organization of a given size needs and compare with what it has.\n- **Be able to:** Recognize a span that is too wide or too narrow from its symptoms.\n- **Be able to:** Say what a manager of managers should inspect and decide.\n\n**Audience:** Executives (CTO, CPO, VP, director) who draw or approve the reporting structure, and engineers and managers who live in it.\n\n**Already knows:**\n\n- How software teams work\n- Chapter 8's team sizes: Larson's six to eight engineers per manager, as a result with assumptions\n- What an engineering manager and a director are, loosely\n\n**Does not yet know:**\n\n- span (span of control)\n- layer\n- line manager\n- manager of managers\n- skip-level meeting\n- integrator (Morieux and Tollman)\n- management ratio\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an organization's size, team size and current layers, the reader says whether a layer is missing or surplus and what it costs. *Probe:* An organization of 120 engineers has teams of seven, each with a manager, and all seventeen managers report to one VP. Using only this chapter: what is wrong, and what would you change? | `custom` | cold_reader | major |\n| AC-2 | Every number is presented as a named author's rule of thumb with its reason, and the chapter says what AI may change about it with labeled claims. | `evidence_is_explained` | rubric | major |\n| AC-3 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** Given the team sizes of chapter 8, how many people should a manager have, how many layers follow, and what does each layer cost?\n\n> **Claim:** Given the team sizes of chapter 8, a manager should have as many people as they can know the work of and develop — for a line manager one team, for a manager of managers about four to six managers in Larson's rule of thumb — and the number of layers follows arithmetically from headcount and those spans; each layer adds a step of delay and distance from information, so a layer is kept only if it joins decisions across the units below it that those units cannot join themselves.\n\n**Disputed by:** The delayering view that flatter is always better and managers are overhead, and the opposite habit of adding a layer to give senior people scope.\n\n**So what:** A leader derives the layer count before drawing the chart, states what each layer decides, and removes or merges a layer that only relays.\n\n**How and why:** A manager's attention is finite: too many reports and they stop knowing the work, too few and they do the work themselves or meddle. Layers multiply spans, so the count follows from size; and since every layer delays decisions and filters information, it has to pay for itself in decisions joined.\n\n**Supporting claims**\n\n- **S1** — A manager's span is limited by attention, the people whose work the manager can know and whom the manager can develop: for a line manager that is one team of chapter 8's size, for a manager of managers about four to six managers in Larson's rule of thumb, and a span outside the range shows in recognizable symptoms.\n- **S2** — The number of layers follows arithmetically from headcount, team size and spans, so it can be computed before the chart is drawn and compared with the layers an organization has.\n- **S3** — Each layer costs a step of delay, a step of distance from information and a small share of salary, so a layer is kept only if it joins decisions across the units below it that those units cannot join themselves, and a layer that only relays is removed or merged.\n- **S4** — Managing managers is a different job from managing a team: the manager of managers no longer sees the work, so inspects it deliberately, decides what crosses teams, and leaves each team to its manager.\n- **S5** — Neither the view that flatter is always better nor the habit of adding a layer to give a senior person scope survives the derivation: the answer is the fewest layers the spans allow, each with its decisions written down.\n\n## Role in the part\n\nDerives the management structure between the top and the teams from the team sizes of Part II. Supports P5-3 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in spans, layers, layer-cost: spans come before layers because layers are computed from them, and the count comes before its cost and purpose; the three patterns then apply the count, the purpose and the changed job of the person in the layer, in that order)\n\nThe reader first meets a span of twelve that nobody chose, and a later layer that slowed decisions, so both errors are on the table before any rule. Spans come next because layers are computed from them, and the cost and purpose of a layer after the count, because only then is there something to weigh. The three patterns apply spans and layers, purpose, and the changed job in that order. The disagreement between sources follows the patterns because its resolution, the fewest layers the spans allow, each with its decisions written, is the first two patterns taken together: placed before them it would be a slogan, placed after them it names what the reader has already seen done. The anti-patterns follow the resolution because they are the two disputed views in practice. The worked example comes after everything it uses, and AI last because it changes the inputs of a derivation the reader must already hold. Putting the Corvane arithmetic first would ask the reader to judge spans before knowing the ranges.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 twelve engineering managers at Corvane reported to one VP Engineering, Dario Vance. Nobody had decided that the number should be twelve; in one month three requests for a new team reached him because there was nobody else to send them to. A year later Corvane put directors between him and the managers, and a year after that its engineers complained that decisions were slow.\n\n**Bridge:** Most readers have worked under a manager with too many reports to know their work, or in a chart with a level nobody could explain, and have heard both that managers are overhead and that a growing company needs more of them. → Both complaints are about numbers nobody derived: how many people a manager leads and how many levels follow. The previous chapter put a triad at every level; this one asks how many levels there are.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A manager should have as many people as they can know the work of and develop: for a line manager one team, for a manager of managers about four to six managers in Larson's rule of thumb. The number of layers follows arithmetically from headcount and those spans, and since each layer adds a step of delay and distance from information, a layer is kept only if it joins decisions across the units below it that those units cannot join themselves.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a span of twelve at Corvane that nobody chose, and the layer that later replaced it. *Kept in:* scene.\n- Learn what limits a span and what Larson's rules of thumb say for managers and managers of managers. *Kept in:* spans.\n- Compute the layers an organization needs from its headcount and spans. *Kept in:* layers.\n- Know what a layer costs and what it is for. *Kept in:* layer-cost.\n- Use three patterns: derive the layers, write what each layer decides, and inspect as a manager of managers. *Kept in:* pattern-derive, pattern-decisions, pattern-inspect.\n- See where the sources disagree about adding and cutting layers, and the two usual ways layers go wrong. *Kept in:* sources-disagree, anti-patterns.\n- Run the arithmetic on Corvane at four sizes, and see what AI may change. *Kept in:* worked-example, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 twelve engineering managers reported to Corvane's one VP Engineering, a number nobody had chosen, and the layer of directors that replaced it a year later brought a complaint of its own. | scenario: Corvane, 2024, 180 people: 95 engineers in eleven product teams and a platform team, each team with an engineering manager, all twelve reporting to Dario Vance, VP Engineering. Three requests for a new team reached him in one month. In 2025 directors were added; in 2026 engineers complained of slow decisions. |  |\n| p02 | claim | A span is limited by what a manager can know and develop, layers follow by arithmetic from headcount and spans, and a layer is kept only if it joins decisions the units below it cannot join themselves. |  | `problem_solution`: Two numbers nobody derived, and the previous chapter's triad that must exist at each level. → How many levels there are and how many people each manager leads, as one claim, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Twelve Managers and One VP\n\n**Controlling idea** (`example`, id `scene`): Corvane's span of twelve came from growth, not from a decision, and it cost attention to everything that lay between teams; the layer that replaced it cost delay.\n\n**Advances the thesis** (S1, S3): Shows a span too wide and a layer's cost in one company before any rule is given.\n\n**Transition in:** `example`: The span of twelve. → How it arose and what it cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | example | The span of twelve arose by growth: every new team got a manager, and nobody asked whom the managers would report to. | scenario: 2021, 50 people: about 24 engineers in four teams, two engineering managers with two teams each, reporting to Tomas Rell, the CTO. 2023: eleven product teams formed, each with an engineering manager, plus the platform team under Lena Brandt; Dario Vance joined as VP Engineering and all twelve managers reported to him. |  |\n| p04 | analysis | With twelve managers reporting to him the VP could answer what was brought to him and could not look at what lay between teams, and the directors added in 2025 brought a different cost, so the question is how many layers and what each is for. | scenario: 2024: the three requests for new teams in one month; the platform team's size not revisited while the engineers it served doubled; open launch requests grew every month for about a year before the 2024 change brief. 2026, about 500 people: quarterly planning took nine of thirteen weeks and the people deciding were two or three levels from the information. | `cause_effect`: Twelve managers under one VP. → What that span cost, what the added layer cost, and the question. |\n\n### Spans: How Many People One Manager Can Lead\n\n**Controlling idea** (`explanation`, id `spans`): A span is limited by the manager's attention; for a line manager it is one team, for a manager of managers Larson's four to six, and each end of each range has a symptom.\n\n**Advances the thesis** (S1): Defines span and gives Larson's two rules of thumb with their reasons and the symptoms outside them.\n\n**Transition in:** `problem_solution`: The question of how many layers and what each is for. → The quantity layers are computed from: the span.\n\n**Order of paragraphs** (`prerequisite_order`): The definition and the limit come first, then the two kinds of manager in the order of the reporting line, then the symptoms, which need both ranges.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | A span is the number of people who report directly to one manager, and what limits it is attention: a manager can lead as many people as they can know the work of and develop. | reasoning: Definitions of span, line manager and manager of managers. Scope note: the chapter counts the engineering line, the largest; product managers and designers report in their own lines (chapter 18) and the same arithmetic applies to them. |  |\n| p06 | explanation | For a line manager the span is one team, and chapter 8 already derived its size: six to eight engineers in Larson's rule of thumb, which this chapter takes as given. | source: Larson: a manager supports six to eight engineers; below four the manager becomes a tech lead manager, above eight or nine a coach and safety net. Chapter 8 derived the team size from scope, on-call and coordination, with a least of six that is the author's judgement. Larson: \"Never leave managers supporting more than eight individuals.\" | `elaboration`: A span limited by attention. → The line manager's span, taken from chapter 8. |\n| p07 | explanation | For a manager of managers Larson's rule of thumb is four to six managers, with a reason at each end: below four the manager should still be learning the job or the domain, above six they can only solve problems as they arrive. | quotation: Larson: \"Managers-of-managers should support four to six managers\". Below four they should be in a period of active learning on the problem domain or on moving from supporting engineers to supporting managers. On the upper end: \"supporting a large team of managers leaves you functioning purely as a problem-solving coach.\" | `contrast`: Six to eight engineers for a line manager. → A smaller number for a manager whose reports are managers. |\n| p08 | evidence (table) | A span outside its range can be recognized from what the manager does all week and from what stops happening. | table: Table. Columns: Manager / Span / Larson's description / What you see (the author's reading). Rows: line manager below four (tech lead manager; writes much of the design and code, or meddles); line manager above eight or nine (coach and safety net; one-on-ones lapse, feedback and career talks stop first); manager of managers below four (ramping up; acceptable for a stated time, otherwise does the managers' jobs); manager of managers above six (problem-solving coach; hears only what is brought, nothing between teams gets looked at). | `cause_effect`: Two ranges, each with a reason at both ends. → What it looks like when a span is outside its range. |\n\n### Layers: The Arithmetic from Headcount to Levels\n\n**Controlling idea** (`explanation`, id `layers`): The number of layers is computed from headcount, team size and spans, and comparing the computed number with the real one shows a missing or a surplus layer.\n\n**Advances the thesis** (S2): Gives the computation and the comparison the reader is asked to be able to do.\n\n**Transition in:** `cause_effect`: The two spans. → The number of layers that follows from them.\n\n**Order of paragraphs** (`prerequisite_order`): The definition and the procedure first, then what it gives at each size, then the comparison with a real chart, which needs the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | process (figure) | A layer is one level of managers in the reporting line, and the number of layers is found by dividing: engineers by team size, then managers by four to six, until six or fewer people are left to report to one leader. | figure: Mermaid flowchart LR: \"Engineers\" -> \"Teams: engineers divided by team size (chapter 8)\" -> \"Line managers: one per team\" -> \"More than six?\"; yes -> \"Add a layer: managers divided by four to six\" -> back to the question; no -> \"They report to one leader: stop and count the layers\". |  |\n| p10 | evidence (table) | With Larson's spans, one layer of managers carries up to about eight engineers, two up to about 48, three up to about 288 and four up to about 1,700, so a layer is added roughly every time the organization grows four- to sixfold. | table: Table. Columns: Layers of managers / Who is in them / Engineers, narrowest spans (teams of six, spans of four) / Engineers, widest spans (teams of eight, spans of six). Rows: 1: 6 / 8; 2: 24 / 48; 3: 96 / 288; 4: 384 / 1,728. The arithmetic is the author's, on Larson's numbers.; quotation: Larson: \"For every additional order of magnitude of engineers, you need to design and maintain a new layer of management.\" | `example`: The division. → What it gives at each size. |\n| p11 | analysis | Comparing the computed layers with the real ones gives two findings: a missing layer shows as a span above the range somewhere, a surplus layer as spans below four that nobody is growing into. | reasoning: A generic case: 60 engineers in eight teams of seven or eight with eight managers reporting to one head: two layers where the table gives three, and a span of eight above the four to six. The reverse: 40 engineers in five teams with two directors and a VP: three layers where two would do, and spans of two and three. | `sequence`: The layers a size needs. → The comparison with the layers an organization has. |\n\n### What a Layer Costs, and What It Is For\n\n**Controlling idea** (`explanation`, id `layer-cost`): A layer costs delay, distance from information and some salary, and it earns that cost only by joining decisions across the units below it that they cannot join themselves.\n\n**Advances the thesis** (S3): States the three costs and the one justification, which is the test the patterns and anti-patterns use.\n\n**Transition in:** `contrast`: The arithmetic, which says how many layers the spans require. → What each of those layers costs, which the arithmetic does not show.\n\n**Order of paragraphs** (`order_of_importance`): The three costs run from the one that weighs most in the decision about a layer, delay, to the one that weighs least, salary; the purpose comes after them because it is what the costs are weighed against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | explanation | The first cost is delay: every decision that has to pass through a layer waits there for one more person. | reasoning: A question between two teams in different groups goes up to each manager, to each director, and to the person above both: with two layers two people are asked, with three layers four. Morieux and Tollman count 'waste and fewer mistakes that result from escalating decisions' among what removing layers saves. |  |\n| p13 | explanation | The second cost is distance from information: each layer passes on a summary, so the person deciding at the top knows less than the people who asked. | source: Fournier, The Manager's Path, on managing managers: skip-level meetings exist partly to detect where you are being 'managed up' well to the detriment of the team; managers can make your life easier by hiding problems. The author's record managing-managers: every signal arrives pre-filtered, and a manager under pressure filters optimistically.; source: Morieux and Tollman: decisions should be made as close as possible to where the action takes place and where information is richest. | `additional_support`: Delay. → A second cost: what is lost at each step. |\n| p14 | explanation | The third cost is salary, and it is the smallest: the first layer of managers is most of the management ratio, and each layer above adds about a fifth of the one below. | reasoning: The author's arithmetic with teams of seven and spans of five: one manager per 7 engineers with one layer; 6 managers per 35 engineers with two (one per 5.8); 31 per 175 with three (one per 5.6). Larson makes 'set target ratio of management to individual contributors' a step of planning an organization change. | `contrast`: Two costs paid in time and knowledge. → The cost paid in money, which is the least of the three. |\n| p15 | claim | A layer earns its cost by joining decisions across the units below it that those units cannot join themselves, and a layer with no such decisions only relays. | reasoning: The test: list the decisions the layer made last quarter that involved more than one unit below it and that those units could not have settled between themselves (moving scope or people between teams, the order of work across teams, who manages each team). The idea of a leader joining decisions is Part V's; Morieux and Tollman's integrator, a role with both the interest and the power to make others cooperate, is the nearest concept in the sources. | `problem_solution`: Three costs every layer has. → What a layer gives in return, and the test for it. |\n\n### Pattern: Derive the Layers Before Drawing the Chart\n\n**Controlling idea** (`process`, id `pattern-derive`): The layer count is computed from projected headcount and spans before any names are placed, and a span outside its range is fixed with width before depth.\n\n**Advances the thesis** (S2, S5): Turns the arithmetic into steps a leader runs, with a user and an outcome measure.\n\n**Transition in:** `sequence`: The arithmetic and the test of a layer. → The first of three patterns that use them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | process (list) | The pattern, for the leader who owns the reporting structure, is five steps from projected headcount to a layer count, measured by the number of managers whose span is outside its range. | source: User: the executive who owns the chart and the directors who propose changes to it. Outcome measure: the number of managers whose span is outside its range without a stated reason and end date, and whether the layers equal the computed number. Steps: project the headcount a year out; take team sizes from chapter 8; one line manager per team; divide by four to six until one leader remains; compare with the chart and write a reason and a date for every span outside the range. The first and third of Larson's steps for planning an organization change are 'project head count a year out' and 'set target ratio of management to individual contributors'. Step 4 is the division of the layers section (Figure 1), cited and not repeated; the pattern adds the projected headcount, the comparison and the measure. |  |\n| p17 | recommendation | When a span comes out above its range, add a peer before adding a layer: width costs one more manager, depth costs every decision a step. | reasoning: Eight managers under one director become two groups of four under two directors without a new layer if the level above has room; a new layer is needed only when the top span itself is over the range. This is the author's recommendation; it does not hold when the level above is already at six. | `elaboration`: The comparison in the last step. → What to do when a span is too wide. |\n\n### Pattern: Write What Each Layer Decides\n\n**Controlling idea** (`process`, id `pattern-decisions`): Each layer gets a short written list of the decisions it makes and the ones it leaves below, and a layer for which the list is empty is merged.\n\n**Advances the thesis** (S3): Makes the purpose test a document, with a user and an outcome measure.\n\n**Transition in:** `sequence`: A layer count that the spans justify. → The second pattern: saying what each of those layers decides.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | process (table) | The pattern, for each manager of managers and the leader above, is one page per layer of what it decides and what it leaves to the layer below, found by looking back at where last quarter's decisions between teams were settled, and measured by where such decisions are settled and how long they take. | table: User: every manager of managers and the leader they report to. Outcome measure: the share of decisions between teams settled at the lowest layer that spans the teams involved, and the median days from question to decision. Table. Columns: Layer / Decides / Leaves to the layer below. Rows: line manager (who works on what in the team, hiring and growth of each person, with the product manager the team's quarter / how the work is done); manager of managers (moving scope and people between its teams, the order of work across them within the outcomes given, who manages each team, disputes between two of its teams / anything inside one team); head of engineering (the same between groups, standards and shared areas, how many engineers each group gets / anything inside one group). The rows are the author's; chapter 18's page of decisions is the same instrument at the top. The page is found by looking back: collect last quarter's decisions between teams and note the layer at which each was settled; a layer at which none was settled is a candidate for merging. Allocating decision rights in general is chapter 22's. |  |\n\n### Pattern: Inspect What You No Longer See\n\n**Controlling idea** (`process`, id `pattern-inspect`): A manager of managers has a different job from a line manager: the work is out of sight, so they inspect it on purpose, decide what crosses teams and hold each manager accountable for the team.\n\n**Advances the thesis** (S4): Says what changes when the reports are managers, and what a manager of managers inspects and decides.\n\n**Transition in:** `cause_effect`: A layer that decides only what crosses teams. → The third pattern: how the person in that layer knows enough to decide.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | explanation | Managing managers is a different job because the manager no longer sees the work: what a line manager learns by being in the team, a manager of managers learns only by asking. | quotation: Fournier: \"People who are good at managing a single team, or even a couple of related teams, fall apart when asked to manage managers, or teams that are outside of their skill set.\"; source: Zhuo, The Making of a Manager: as the team grows it matters less how good the manager is at the work and more how much of a multiplier effect she has. Grove's High Output Management is on the author's bookshelf without notes; its description there says it is about maximizing an organization's output through delegation, clear communication and focused management, and nothing more is taken from it. |  |\n| p21 | process (list) | The pattern, for a manager of managers, is a fixed set of things to look at every week and quarter, measured by how many problems reach them by escalation, resignation or incident before their own inspection found them. | source: User: a manager of managers. Outcome measure: problems that reached them by escalation, resignation or incident before inspection (the revisiting test of the author's record managing-managers). List: each team's flow and health measures (release frequency, incident load, lead time); whether each team can state its goals and why (Fournier's first question when debugging a team); hiring, goals and postmortems followed up 'until you figure out what you don't need to follow up on' (Fournier); skip-level meetings, 'perhaps once a quarter' (Fournier); each manager's one-on-ones and feedback, closely for a new manager. Skip-level meeting defined. Inspection as support, from the author's record inspected-trust. | `problem_solution`: Work that is out of sight. → What to look at, for whom, and how to tell it works. |\n| p22 | recommendation | What a manager of managers decides is what crosses teams, and what they must not do is take a team's problem back from its manager. | source: Fournier's three cases (unstable roadmap, errant tech lead, firefighting) end with the same answer: the manager is accountable for the health and productivity of the team. The author's record: accountability that is absorbed upward stops being accountability; a manager who passes requests down and status up without judgement is a relay. | `contrast`: What is inspected. → What is decided, and what is left with the manager. |\n\n### Where the Sources Disagree: Add a Layer or Cut One\n\n**Controlling idea** (`counterargument`, id `sources-disagree`): Larson adds layers as an organization grows and Morieux and Tollman cut them first; both object to a layer that joins nothing, and the resolution is the fewest layers the spans allow.\n\n**Advances the thesis** (S5, S3): Answers the delayering view with the sources, and states the book's resolution.\n\n**Transition in:** `contrast`: Three patterns that all assume layers are needed. → A source that says to cut them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | counterargument | Larson designs a new layer as the organization grows and keeps spans narrow enough to invest in people, while Morieux and Tollman make cutting layers the first step, widening spans on purpose. | quotation: Morieux and Tollman: \"the first step in reinforcing your managers to play the integrator role is to cut the number of hierarchical layers, which simultaneously increases the span of control and shortens hierarchical lines.\" They also advise removing managerial positions that will never have enough power to influence the work. Integrator defined. This is the source behind the delayering view that flatter is always better. |  |\n| p24 | refutation (table) | The two agree on the test, a layer must have decisions that make others cooperate, and differ in where they start, so the resolution is the fewest layers that keep spans inside Larson's ranges, each with its decisions written down, which is what the first two patterns already do. | table: The author's reading: Morieux and Tollman write against layers that cannot add value; Larson writes for growing engineering organizations that have too few. Neither says flatter is always better. Table. Columns: Choice / What you gain / What you give up / Right when. Rows: wide and flat (spans above the range, fewer layers: short lines, decisions near the work / managers who only coach, nothing between teams looked at / experienced managers, stable teams, little that crosses teams); narrow and deep (spans below the range, more layers: time for each person / a step of delay and filtering per layer, managers who do their reports' jobs / briefly, while a manager grows into a span); in range (the fewest layers that keep spans within four to six / some of each cost / the default). | `problem_solution`: Two opposite first moves. → What the two share, and the book's resolution. |\n\n### Anti-Patterns: The Relay Layer and the Layer Made for a Person\n\n**Controlling idea** (`explanation`, id `anti-patterns`): Layers go wrong in two usual ways: a layer that passes things on without deciding, and a layer created to give someone scope.\n\n**Advances the thesis** (S3, S5): Names the two failures the purpose test catches, with the book's failure-pattern names.\n\n**Transition in:** `example`: The test that a layer must have decisions of its own. → Two layers that fail it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | explanation | The relay layer passes requests down and status up and decides nothing, which makes it one more rung of the Escalation Ladder. | source: The failure pattern The Escalation Ladder: decisions travel upward to someone with less information. The author's record managing-managers names the relay manager. Sign: questions between two teams of the same group are settled above the group. |  |\n| p26 | explanation | The layer made for a person exists to give a senior manager scope or a title, and it can be recognized by removing the name and asking which decisions the role joins. | source: Fournier on empire builders, who seek to grow their teams and mandates without concern for what is best for the organization. Chapter 18's test for a role made to fit a person: remove the name and ask which decisions the role joins. When the chart is redrawn for this reason it is also The Reorg as Strategy. Signs: spans of two or three with no end date; a layer added in the same month as a retention conversation. | `additional_support`: A layer that decides nothing. → A layer that was never meant to decide anything. |\n\n### Worked Example: Corvane's Layers at Four Sizes\n\n**Controlling idea** (`example`, id `worked-example`): Run at four sizes, the arithmetic shows Corvane one layer short in 2024, at the right count with wide spans and unwritten decisions in 2026, and due a fourth layer by 2028.\n\n**Advances the thesis** (S2, S3, S1): Applies the computation and the purpose test to ledger numbers.\n\n**Transition in:** `example`: The arithmetic, the test and the patterns. → All of them applied to Corvane's four sizes.\n\n**Order of paragraphs** (`chronological`): The table first, then the stages in the order they happened, so that each reading uses the stage before it; the 2028 projection stays in the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | evidence (table) | The table sets, for Corvane in 2021, 2024 and 2026 and as a projection for 2028, the layers the arithmetic gives beside the layers and spans the company had. | table: Table. Columns: Year and size / Teams and line managers / Layers the arithmetic gives / What Corvane had / Widest span. Rows: 2021, 50 people, about 24 engineers: four teams; two layers; two layers (two engineering managers, the CTO); about twelve engineers per manager. 2024, 180 people, 95 engineers: twelve teams, twelve managers; three layers (two or three managers of managers); two layers; twelve managers under the VP. 2026, 500 people, 260 in product and tech: about thirty product teams and the platform team; three layers (five to eight directors); three layers (four group directors, the Director of Platform, the VP); seven or eight managers per group director; the VP has six. 2028, 1,100 people, 520 in product and tech: about sixty teams if the proportion of 2026 holds; four layers (ten to fifteen directors, two or three leaders above them); not stated beyond two business units. Layers are counted up to the person who runs engineering, Dario Vance; Tomas Rell as CTO holds technical direction above him (chapter 18). |  |\n| p28 | analysis | In 2021 the layer count was right and the spans were double the range, and in 2024 a whole layer was missing, which is the span of twelve the chapter opened with. | scenario: 2021: each manager had two teams and about twelve engineers, Larson's coach and safety net. 2024: twelve managers need two or three managers of managers; Corvane had none, so every decision between two teams went to Dario Vance or was not made: the three requests for new teams, the platform team's size. | `cause_effect`: The table's first two rows. → What they show. |\n| p29 | analysis (figure) | In 2026 Corvane had the three layers the arithmetic gives, with directors' spans above the range, and the cost its engineers felt came from a layer whose decisions had not been written. | figure: Mermaid flowchart TB: \"Dario Vance, VP Engineering\" -> four nodes \"Engineering director, product group N: 7 or 8 managers\", -> \"Lena Brandt, Director of Platform\", -> \"Security lead\"; one director -> \"Engineering managers, one per team\" -> \"Teams of six to eight engineers\".; scenario: 2026, about 500 people: the Nine-Week Plan, agreed across the four groups with every director; the Tuesday Reorg drawn up by people who did not know what each team ran; three senior engineers leaving one group citing slow decisions. Late in 2026 Dario Vance and the directors wrote one page of what a director decides without him (moving scope and people between the group's teams, the order of work within the group's outcomes, who manages each team) and what goes to him (anything that touches two groups or a shared area). No result is recorded. The author's reading: remove nothing; the remedy for spans of seven or eight is a fifth and sixth group when the product allows, not a fourth layer. | `contrast`: A missing layer. → The year after the layer was added: the right count, and its cost. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI may change the inputs of the derivation, team size and the cost of gathering information, and as of November 2026 there is no measurement showing that it widens the span a manager can sustain.\n\n**Advances the thesis** (S1, S2): Says which inputs of the derivation AI may move, with labeled claims, and leaves the full argument to chapter 36.\n\n**Transition in:** `cause_effect`: A derivation with inputs: team size and spans. → What AI may do to those inputs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | analysis | AI already takes over part of a manager's information gathering, and that does not widen the span, because the limit was never the gathering. | reasoning: Label scheme announced. Emerging (the author's observation, as of November 2026): managers use AI tools to summarize status, pull requests and incident reports. The span is limited by knowing the work well enough to judge it and by developing each person, which are conversations. No Proven claim: the author knows of no published measurement of sustainable span with AI. |  |\n| p32 | analysis | What AI does to layers depends on what it does to team size, and both directions are possible. | reasoning: Speculative. If teams settle nearer chapter 8's floors, at four or five engineers, the same headcount means more teams and more line managers, or managers leading two small teams; if teams keep their size and own more, the arithmetic is unchanged. A second speculative claim: an engineer who directs several coding agents is doing a kind of supervision, and whether that counts against the manager's span is open. What would confirm: organizations reporting stable spans above the ranges with unchanged attrition and promotion rates. Full argument in team-shape-and-roles-with-ai. | `contrast`: A span that AI does not widen by itself. → The layer count, which may move through team size. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Spans and layers are one calculation with two prices. The spans come from what one person can know and develop, the layers from dividing headcount by the spans, and the count this gives is a minimum the organization needs and a maximum it should tolerate: one layer fewer and somebody has twelve reports and looks at nothing between teams, one layer more and every decision waits a step for someone who knows less.\n\n**So what:** The reader can compute the layers an organization needs, say whether one is missing or surplus and what it costs, recognize a span that is too wide or too narrow from its symptoms, and say what a manager of managers inspects and decides.\n\n**Callback:** The twelve engineering managers who reported to Dario Vance in 2024, and the directors whose layer slowed decisions in 2026. The reader can now say that twelve was a missing layer by Larson's four to six, and that the layer added in 2025 was the right count with its decisions unwritten.\n\n**Takeaway** (`course_of_action`): Compute the layers your organization needs from its headcount and spans, compare with the chart, and for each layer write the decisions it makes that the layer below cannot. The checklist gives the steps.\n\n**Hand-off** to [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html): `contrast`: The management line, which follows the reporting structure. → The technical leadership track, which cuts across it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | synthesis (list) | Established: Larson's rules of thumb for both kinds of manager with their reasons, Fournier's account of managing managers, and Morieux and Tollman's case against layers that add no value. |  |  |\n| p34 | synthesis (list) | Depends on context: where in the range a span should sit, whether a wide span gets a peer or a layer, and how much inspection a manager needs. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p35 | synthesis (list) | The author's synthesis: the arithmetic of layers and of the management ratio, the test of a layer by the decisions it joins, width before depth, and the reading of Larson against Morieux and Tollman. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p36 | recommendation (list) | Seven checks let the reader compute the layers their organization needs, find the spans outside their ranges and write what each layer decides. |  | `sequence`: What to take away. → What to do with it. |\n| p37 | transition | The management line follows the reporting structure, and the decisions that cut across it belong to the technical leadership track, which the next chapter takes up. |  | `contrast`: The twelve managers, now explained, and the management line. → The technical leadership track, which cuts across the line. |\n\n## Non-goals\n\n- Deriving the size of one team See [Team Size and Composition](team-size-and-composition.html).\n- Executive roles, the CTO and VP Engineering split, and where design, data and security report See [Executive Roles and Reporting Lines](executive-roles-and-reporting-lines.html).\n- How product, engineering and design share decisions at each level See [The Product–Engineering–Design Triad](the-product-engineering-design-triad.html).\n- Staff-plus engineers and architects See [Staff-Plus and Architects: The Technical Leadership Track](staff-plus-and-architects.html).\n- Methods for allocating and recording decision rights See [Decision Rights and Decision Records](decision-rights-and-decision-records.html).\n- The causes of the Nine-Week Plan See [Planning](../grounded-engineering-executive/planning.html).\n- Growing and assessing managers, and manager hiring See [[performance-calibration-and-growing-managers]], [[hiring-and-onboarding]].\n- How to run a reorganization, and business units after an acquisition See [[reorganizations]], [[hypergrowth-downturns-and-acquisitions]].\n- The full argument about team shape, manager ratios and roles with AI See [[team-shape-and-roles-with-ai]].\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- New Corvane facts to confirm: about 24 engineers in four teams in 2021 with each of the two engineering managers leading two teams; in 2024 every one of the twelve teams had an engineering manager and all twelve reported to Dario Vance; in 2026 each of about thirty product teams has an engineering manager, each of the four engineering directors has seven or eight of them, and Dario Vance has six direct reports (four group directors, the Director of Platform, the security lead); late in 2026 Vance and the directors wrote one page of what a director decides.\n- The arithmetic of layers (8, 48, 288, 1,728 engineers) and of the management ratio is the author's, on Larson's spans; the reading of Larson's 'order of magnitude' sentence as an outer bound is the author's. Confirm.\n- Layers are counted up to the person who runs engineering (the VP Engineering at Corvane), with the CTO above holding technical direction, following chapter 18. Part V's acceptance criterion counts 'about three layers below the executives'; the chapter's count for 2026 is three including the VP.\n- At 2026 the directors' spans (seven or eight) are above Larson's range; the chapter says so and recommends more groups before more layers. Confirm that the book wants Corvane shown outside the rule of thumb here.\n- The 2028 row is a projection (about sixty teams if 2026's proportion holds); no stage 5 chart is asserted.\n- High Output Management is mentioned only through the bookshelf description, as instructed.\n- The AI section makes no Proven claim; the two claims are Emerging (author's observation) and Speculative.\n- Chapters 19 and 21 were written in parallel; the opening and hand-off rest on their journal-spec entries only.\n- Flow rubric note not acted on: the reviewer would optionally move 'Where the Sources Disagree' before the three patterns so that the patterns follow from the resolution. Kept in the book's page order.\n\n## Decision log\n\n- **2026-11-19** — Before the first check, to bring the draft from 5,700 words under the cap by cutting secondary threads and not by compressing: p19 (finding the page by looking back) is folded into p18 as one sentence, and p30 (the 2028 projection) is reduced to its table row and one lead-in sentence. Rejected: Keeping both units and shortening every paragraph\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After the flow rubric (sound with notes): the declared flow now says the three patterns apply the count, the purpose and the changed job; the rationale says why the sources' disagreement follows the patterns; p24 points back to the first two patterns; p16 cites the division of the layers section and does not repeat it; the cost section's order is <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
