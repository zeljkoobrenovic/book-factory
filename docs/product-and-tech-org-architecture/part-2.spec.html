<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part II answers three questions in order: which kinds of teams an organization needs, how they should work with each other, and how large they should be.\n- **Be able to:** Pick the Part II chapter that answers the question in front of them.\n\n**Audience:** Executives and individual contributors in product and tech who have read Part I and are about to start Part II, or who arrive with one question about teams and want the chapter that answers it.\n\n**Already knows:**\n\n- How software teams work day to day.\n- Part I's rules: size what a team owns by its cognitive load, place boundaries on fracture planes, find the constraint before adding capacity.\n- Corvane in outline, and the Launch Queue of 2024: eleven product teams, a platform team of five, lead time from 4 days to 19.\n\n**Does not yet know:**\n\n- Stream-aligned, platform, enabling and complicated-subsystem team as defined types (chapter 6); glossed in a clause each here.\n- Collaboration, X-as-a-Service and facilitating as interaction modes, and the team API (chapter 7); glossed here.\n- Where the six-to-eight rule of thumb comes from (chapter 8).\n- On-call rotation, glossed here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the three chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next three chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which kinds of teams does an organization need, how should they work with each other, and how large should they be?\n\n> **Claim:** An organization needs four team types — stream-aligned teams, and the platform, enabling and complicated-subsystem teams that exist to serve them — and three interaction modes — collaboration, X-as-a-Service and facilitating — chosen so that the teams aligned to a flow of user value carry the least load and wait the least; team size follows from the load the team must carry, the on-call rotation it must sustain and the cost of its internal coordination, and each of these choices is written down as a contract others can read.\n\n**Disputed by:** The practice of organizing by function or technology (front end, back end, QA, operations) with teams sized by budget, and the view that naming team types is a consultant's vocabulary laid over the same org chart.\n\n**So what:** A leader can test every team in the organization with two questions — whose load does it lower, and whose waiting does it remove — and can refuse a new team or a new dependency that answers neither.\n\n**How and why:** Part I showed that a team can own only what it understands and that output is set by the slowest step. Teams aligned to a stream of user value are where value is produced, so every other team is justified by what it takes off them; interactions are where waiting arises, so they are limited and made explicit; and size is bounded below by what a rotation and a manager need and above by what a group can coordinate.\n\n**Supporting claims**\n\n- **P2-1** — Four team types are enough, and each of the three that are not stream-aligned is justified by the load it removes from stream-aligned teams or the waiting it prevents; a team that does neither is overhead.\n- **P2-2** — Two teams should work in one of three modes, chosen deliberately and written down as a team API, because an unchosen interaction turns into a queue or a standing meeting.\n- **P2-3** — Team size is derived from the load the team carries, the on-call rotation it must sustain and its internal coordination cost; the familiar six-to-eight is the result of that derivation under stated assumptions, and it changes when the assumptions do.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in three-choices and the chapter list in the closing: type, then mode, then size)\n\nThe page opens on a helping team that became the place where work waited, and on the two questions nobody had answered about it. The first section then gives the test that Part I's rules supply for any team; the second applies the test three times, to the type of a team, to the way two teams work together and to a team's size, and ends by saying why the three come in that order; the chapter list closes the page. The test stands before the three choices because each choice is justified by it; put the choices first and the four types and three modes arrive as a vocabulary with no reason behind it. The list comes last because a reader can choose a chapter only after seeing what each decides.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Corvane's platform team of five was created to help eleven product teams release faster, and within a year it was the place where every launch waited.\n\n**Bridge:** The reader's experience of a team set up to help other teams that became the place where their work waits. → The two questions that experience raises and that the usual explanations (too few people, too slow) skip: what kind of team it was meant to be, and how the other teams were meant to use it.\n\n**Thesis statement** (KEY POINTS and paragraph p03): Part II argues that an organization needs four team types and three ways for two teams to work together, chosen so that the teams that deliver to users carry the least load and wait the least, that team size follows from load, on-call duty and coordination cost, and that each choice is written down where others can read it.\n\n**Roadmap** (paragraph p03):\n\n- The test Part I's rules give for any team: whose load it lowers and whose waiting it removes. *Kept in:* the-test.\n- Three chapters answer three questions in order: which kinds of teams an organization needs, how they should work with each other, and how large they should be; and why the three come in that order. *Kept in:* three-choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Corvane's platform team of five was formed in 2022 so that product teams could release faster, and by 2024 it was the place where their launches waited. | scenario: Corvane (fictional): platform team of five formed in 2022, led by Lena Brandt; eleven product teams formed in 2023; in 2024, at 180 people, 14 launch requests open and a change that took about two days to write waiting about seventeen for a launch slot. |  |\n| p02 | context | A helping team that becomes a bottleneck is usually explained by its staffing or its speed, and the questions that explain it are what kind of team it was meant to be and how the others were meant to use it, neither of which Corvane's 2022 plan answered. | scenario: Corvane's 2022 plan (fictional) gave the platform team a purpose (shared release tooling) and a headcount (five); it did not say what kind of team it was to be or how eleven teams were to use it. | `problem_solution`: The platform team that became the place where launches waited. → The reader's own version of that team, and the two questions that explain it. |\n| p03 | claim | Part II argues that an organization needs four team types and three interaction modes chosen so that the teams delivering to users carry the least load and wait the least, with team size derived and each choice written down, and it makes the argument in three chapters that answer three questions in order. |  | `elaboration`: The two unanswered questions about the platform team. → The part's claim, which answers them for every team, and the three questions its chapters take in turn. |\n\n## Sections\n\n### The Test: Whose Load, Whose Waiting\n\n**Controlling idea** (`claim`, id `the-test`): Teams aligned to a stream of user value are where value is produced, so every other team and every dependency is justified by what it does to their load and their waiting.\n\n**Advances the thesis** (P2-1, P2-2, P2-3): States the principle from which the part derives its types, modes and sizes.\n\n**Transition in:** `cause_effect`: The part's claim as stated in the lead. → The reasoning from Part I's rules that produces it, as a two-question test.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | claim | Part I's rules, that a team can own only what it understands and that output is set by the slowest step, give a test for every team and every dependency: whose load does it lower, and whose waiting does it remove. | reasoning: Value is produced by the teams aligned to a stream of user value; load limits what they can own and waiting limits how fast their work arrives; anything else in the organization is justified by what it takes off them. |  |\n\n### Three Choices: Type, Mode and Size\n\n**Controlling idea** (`explanation`, id `three-choices`): The test is applied three times, to what a team is for, to how two teams work together and to how many people a team has, and the three choices depend on each other in that order.\n\n**Advances the thesis** (P2-1, P2-2, P2-3): One paragraph per supporting claim, each naming the choice and its justification.\n\n**Transition in:** `example`: The two-question test. → The three choices it is applied to.\n\n**Order of paragraphs** (`prerequisite_order`): A mode is chosen between two teams of known types, so types come first; size depends on what the team owns and on how much of its time its interactions take, so it comes third. The paragraph on the order closes the section because the dependency can be stated only once all three choices have been met; put size first, as Corvane's plan did, and it is a number with nothing to derive it from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition (list) | Four team types are enough: stream-aligned teams, and platform, enabling and complicated-subsystem teams that are each justified by what they take off stream-aligned teams. | source: The four fundamental team types of Team Topologies (Skelton and Pais, 2019). |  |\n| p06 | definition | Two teams should work together in one of three modes (collaboration, X-as-a-Service or facilitating), chosen deliberately and written down as a team API, because an interaction nobody chose turns into a queue or a standing meeting. | source: The three interaction modes and the team API of Team Topologies (Skelton and Pais, 2019). | `sequence`: Four team types and what each is for. → How teams of those types work with each other, and how that is written down. |\n| p07 | explanation | Team size is derived from the load the team carries, the on-call rotation it must sustain and the cost of its internal coordination, and the familiar six to eight is the result of that derivation under stated assumptions. | source: Will Larson's rules of thumb in An Elegant Puzzle (2019): six to eight engineers per manager; about eight engineers for a two-tier on-call rotation. | `cause_effect`: Types and modes, which decide what a team owns and how much of its time others take. → How many people that requires. |\n| p08 | explanation | Types come first because a mode is chosen between two teams of known types, and size comes last because it depends on the team's type and on its interactions; a size chosen first is a number with nothing to derive it from. | scenario: Corvane's 2022 plan (fictional) fixed the platform team at five before saying what it would own or how eleven teams would reach it. | `cause_effect`: The three choices: type, mode and size. → The one direction in which they depend on each other, and what happens when size is chosen first. |\n\n## Conclusion: Chapters in this part\n\n**Synthesis:** The three chapters ask one question about a team from three sides: what it is for, how others reach it and how many people that takes. Asked of Corvane's platform team, they turn a staffing complaint into three separate design decisions.\n\n**So what:** A reader can test every team in their organization with two questions, whose load it lowers and whose waiting it removes, and can refuse a new team or a new dependency that answers neither.\n\n**Callback:** Corvane's platform team of five from the opening (p01). The closing reads its 2022 plan against the three questions: the first two left unanswered, the third answered with a bare number.\n\n**Takeaway** (`course_of_action`): Read the chapters in order; with one question about a team in hand, open the chapter that answers it.\n\n**Hand-off** to [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html): `example`: The part's claim that few team types are needed and each is justified by what it does for the teams that deliver to users. → The four types, one by one, with the test for each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | description (list) | Each of the three chapters answers one question, in this order: which kinds of teams an organization needs, how two teams should work together, and how large a team should be. |  |  |\n| p10 | synthesis | The three chapters ask one question about a team from three sides, and Corvane's 2022 plan left the first two unanswered and answered the third with a bare number; the first chapter starts with the types, one by one, each with its test. |  | `conclusion_summary`: The three chapters and their questions. → What they add up to for Corvane's platform team, and the first chapter. |\n\n## Non-goals\n\n- Teaching any chapter's content: the types, modes and sizing rules are named and glossed, not argued. See [Team Types: Stream-Aligned, Platform, Enabling, Complicated-Subsystem](team-types.html), [Interaction Modes and Team APIs](interaction-modes-and-team-apis.html), [Team Size and Composition](team-size-and-composition.html).\n- The reading of Corvane's platform team as a type, a mode and a size; that is the part's closing. See [Team Size and Composition](team-size-and-composition.html).\n- Cognitive load, fracture planes and the constraint. See [Cognitive Load and Team Boundaries](cognitive-load-and-team-boundaries.html), [Flow and the Constraint](flow-and-the-constraint.html).\n- Platforms as products and developer experience. See [Platforms and Developer Experience](platforms-and-developer-experience.html).\n- What AI changes; part introductions carry no AI section.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The journal spec's hook says 'every launch waited' on the platform team; chapter 2's ledger line says all eleven teams needed Platform for some launches and three for every launch. The page says 'the place where their launches waited' and gives the 14 open requests. Reconcile the hook wording in the journal spec if wanted.\n- The page adds one Corvane fact: the 2022 plan did not say what kind of team the platform team was to be or how the eleven teams were to use it. Chapters 6 to 8, written in parallel, should agree.\n\n## Decision log\n\n- **2026-11-19** — The post entry in the journal spec has a question and no thesis. A part introduction performs the part's opening, so this spec uses the part's thesis and its three supporting claims P2-1 to P2-3 unchanged; they are the part's, not the page's own. Intent outcome, AC-1 and role are copied from the post entry; the hook from the part's opening. Rejected: Writing a separate thesis from the page's question.\n- **2026-11-19** — The page ends with 'Chapters in this part' as its headed conclusion, with two units: the chapter list and one closing paragraph that holds the synthesis, the callback and the hand-off to chapter 6. Rejected: A separate 'Where to Begin' section after the list.\n- **2026-11-19** — The three chapters of Part II were being written in parallel, so the page describes them from their journal-spec entries only and names no worked example of theirs. Rejected: Waiting for the chapters: the brief says to rely on the journal spec.\n- **2026-11-19** — The page does not give the part's closing verdict on the platform team (right type, wrong mode, too few people for its scope); it says only that the three decisions were not made. The verdict is chapter 8's to deliver. Rejected: Stating the verdict in the introduction: it would spend the part's closing callback.\n- **2026-11-19** — Flow rubric (one fresh reader, order of ideas only): sound with notes. Taken: the one-paragraph section 'Why Types Come First and Size Last' is merged into 'Three Choices: Type, Mode and Size' as its closing paragraph (p08), because its idea repeated that section's own ordering; the closing no longer says 'none of the three had been answered', since the opening raises two questions and the plan did give a size: it now says the plan left the first two unanswered and answered the third with a bare number. 'Team API' is glossed where it first appears. Rejected: Reducing the chapter list to bare links or dropping the three questions from the lead: AC-1 needs the subjects in the lead, and the brief asks for one line per chapter with its question.\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After draft-check round 1 (revise: 11 pass, 6 fail; three blocking, three minor), draft fixes only, no spec change to order or argument: the test is named 'the load-and-waiting test' so that it is no longer a second pair of 'two questions' beside the lead's (both flow readers); 'Three Choices' opens by carrying over the test; the closing states the so-what the spec's conclusion asks for; the lead-in to the type list no longer refers to stream-aligned teams before the list defines them; the mode paragraph says how the test decides; 'it follows from the first two' is cut from the size paragraph, since the order paragraph after it gives the reason. No second round: the failures were wording, as the task allows for a page this short. Rejected: A second check round.; Moving the order paragraph (p08) before the three choices, as both flow readers suggested as an option (both rated the point b): the flow rubric placed it last.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-2, its post entry part-2, and the entries of team-types, interaction-modes-and-team-apis and team-size-and-composition) — Intent, AC-1 and role (post entry); thesis, supporting claims, flow rationale and opening (part); what each chapter argues; team-types' transition_in for the hand-off.\n  - _research/scenario-ledger.md — The Corvane facts: the platform team, the 2022 plan, the 2023 teams, the 2024 queue.\n- **External**\n  - Matthew Skelton and Manuel Pais, Team Topologies (2019); author's notes, _input/bookshelf/docs/notes/team-topologies.pdf — The four team types, the three interaction modes and the team API, named only.\n  - Will Larson, An Elegant Puzzle (2019); author's notes, _input/bookshelf/docs/notes/elegant-puzzle.pdf — The six-to-eight and on-call rules of thumb, named only.\n\n## Changelog\n\n- **2026-11-19** — Initial spec for the Part II introduction. (AI-mediated session)\n- **2026-11-19** — Flow rubric notes applied (reading-order section merged into three-choices; closing softened); status accepted in auto mode. (AI-mediated session)\n- **2026-11-19** — Draft-check round 1: revise (11 pass, 6 fail). Local fixes in the draft afterwards with no further round, so check-report.json is stale. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
