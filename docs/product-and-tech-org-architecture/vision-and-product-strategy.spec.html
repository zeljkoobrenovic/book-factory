<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The customer journey vision: the customer's future experience from trigger to retention, described from their side.\n- **Know:** Product strategy as working backward from the vision through key steps and measurable milestones.\n- **Know:** How this compares with Rumelt's kernel (diagnosis, guiding policy, coherent action) and Cagan's vision and principles.\n- **Believe:** A vision is a description of the customer's future, and a list of features or a mission statement is not one.\n- **Be able to:** Tell a vision from a feature list.\n- **Be able to:** Draft the first three steps of a strategy working backward from a stated vision.\n- **Be able to:** Check a strategy for a diagnosis and a choice.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given three candidate 'vision' statements, the reader picks the one that is a vision in the chapter's sense and says what the other two are. *Probe:* Which of these is a product vision, and what are the other two? (a) 'Be the leading field-service platform in Europe.' (b) 'A planner starts Monday with the week already scheduled; when a technician calls in sick, the plan repairs itself and the customers affected are told before they ask.' (c) 'AI scheduling, route optimization, customer notifications, mobile offline mode.' | `custom` | cold_reader | major |\n| AC-2 | The chapter states how product strategy relates to the engineering strategy of Part IV and to planning in Part VI, and links to both. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How does a product vision become a strategy that teams can act on?\n\n> **Claim:** A product vision becomes a strategy teams can act on when it is written as the customer's future journey, specific enough to recognize when reached, and the strategy works backward from it: the few steps, in order, that get from today's journey to that one, each with a milestone that can be measured and a statement of what will not be done.\n\n**Disputed by:** The view that strategy emerges from fast iteration and data, so that a long-range vision is guesswork that will be wrong, and the lean answer is to test and follow what works.\n\n**So what:** A leader can give teams a direction that survives the next loud request, and can say no with a reason.\n\n**How and why:** Iteration improves what exists and cannot choose between futures; a vision makes the choice explicit, and working backward from it exposes what has to be true first. Rumelt's test applies: a strategy with no diagnosis and no choice is a goal.\n\n**Supporting claims**\n\n- **S1** — Outcomes leave open which outcomes to pursue and in what order, and neither an ambition statement nor a feature list can settle it.\n- **S2** — A product vision is a description of the customer's future journey with the product, from trigger to retention, specific enough that the organization can recognize when it has been reached.\n- **S3** — A product strategy works backward from the vision: a few ordered steps from today's journey to the future one, each with what must be true first, a milestone that can be measured and a statement of what will not be done.\n- **S4** — A strategy is real only if it contains a diagnosis and a choice, which Rumelt's kernel tests; where the sources disagree about vision, the vision stays the destination and the test is applied to the strategy.\n- **S5** — The product strategy is an input to the engineering strategy and to planning, and neither of them can stand in for it.\n\n## Role in the part\n\nGives outcomes a direction and an order, which the roadmap then lays out in time. Supports P3-2 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in what-a-vision-is through three-steps: the vision before the strategy that works backward from it, each definition before the Corvane artifact written to it)\n\nThe reader first meets three reasonable requests that nothing can rank, so vision and strategy arrive as the two missing pieces. The vision comes before the strategy because the strategy is defined as working backward from it; reversed, the steps would have nothing to lead to. Each definition is followed at once by Corvane's artifact, so the reader sees the form filled in before the next concept depends on it. Rumelt's test comes after Corvane's strategy exists, because a test shown before anything can be tested would be a second definition of strategy competing with the first. The disagreements follow the test, since Rumelt's objection to visions can only be weighed once the reader has seen both a vision and his kernel. The hand-over to engineering strategy and planning comes after the strategy has been defended, because it describes what is done with a finished strategy; and the AI section is a coda that asks what cheaper building does to the whole.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In one month of 2025 three requests reached Priya Nambiar, Corvane's new CPO: a custom approval step for the largest customer, route optimization because a competitor had it, and an offline mode for technicians. Each could be argued to move an outcome. The strategy deck opened with a vision, 'The operating system for field service', and it could not say which came first. All three went on the roadmap.\n\n**Bridge:** A reader who has accepted outcomes as the unit of progress has probably still sat in the meeting where every request moved some outcome and nobody could refuse one with a reason. → What is missing is a direction and an order: a vision of the customer's future and a strategy that works backward from it.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A product vision becomes a strategy teams can act on when it is written as the customer's future journey, specific enough to recognize when reached, and the strategy works backward from it: a few ordered steps from today's journey to that one, each with a measurable milestone and a statement of what will not be done.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See three reasonable requests that outcomes, a vision slide and a feature list could not rank. *Kept in:* three-requests-and-a-slide.\n- Tell a vision from an ambition statement and from a feature list, and write one as a customer journey. *Kept in:* what-a-vision-is, write-the-vision.\n- Work backward from a vision to the first three steps of a strategy, each with a milestone and a no. *Kept in:* strategy-works-backward, three-steps.\n- Test a strategy for a diagnosis and a choice with Rumelt's kernel. *Kept in:* testing-the-strategy.\n- Know where the sources disagree and how the book resolves it. *Kept in:* where-the-sources-disagree.\n- Know what the product strategy hands to the engineering strategy and to planning, and what AI changes. *Kept in:* engineering-strategy-and-planning, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2025 Corvane had three reasonable requests, outcomes that each request could claim to move and a vision slide, and it accepted all three because nothing it had could rank them. | scenario: Illustration: Corvane in 2025, about 500 people; Priya Nambiar in her first quarter as CPO; the three requests; the deck's vision slide 'The operating system for field service'. |  |\n| p02 | claim | A vision written as the customer's future journey and a strategy that works backward from it give outcomes a direction and an order; the chapter goes from Corvane's three requests to the vision, to the strategy and its first three steps, to Rumelt's test, to the disagreements among the sources, to what the strategy hands to engineering strategy and planning, and to AI. |  | `problem_solution`: Requests nobody could rank. → The two things that rank them, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: Three Requests and a Slide\n\n**Controlling idea** (`example`, id `three-requests-and-a-slide`): In 2025 Corvane had outcomes for its product groups, a vision slide and a dated feature list, and none of them could say which of three reasonable requests came first.\n\n**Advances the thesis** (S1): Shows the gap that outcomes leave: which outcomes, in what order.\n\n**Transition in:** `elaboration`: The lead's short account of the three requests. → The requests in detail and why nothing Corvane had could order them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Each of the three requests that reached Priya Nambiar in one month of 2025 came from a real need and could be argued to move an outcome. | scenario: Illustration: (1) sales asks for a custom approval step for Corvane's largest lift-maintenance customer, whose renewal is due; (2) sales asks for route optimization because a competitor showed it in two lost deals; (3) the Technician App team asks for an offline mode, from support tickets about lost job updates in basements and lift shafts. |  |\n| p04 | analysis | Corvane's outcomes, its vision slide and its feature list gave no reason to prefer one request to another, so all three were accepted and the list grew. | scenario: Illustration: the 2025 strategy deck opened with a slide titled Vision, 'The operating system for field service', followed by a list of features with dates. Ledger: in stage 3 the roadmap was a list of features promised to large customers, with dates. | `contrast`: Three defensible requests. → Nothing to rank them by. |\n\n### A Vision Is the Customer's Future Journey\n\n**Controlling idea** (`definition`, id `what-a-vision-is`): A product vision, in the sense of Build What Matters, is a description of the customer's future journey with the product from trigger to retention, and an ambition statement or a feature list is a different thing.\n\n**Advances the thesis** (S2): Defines the vision and separates it from the two things most often given that name.\n\n**Transition in:** `problem_solution`: Requests that nothing could rank. → The first missing piece: a description of where the customer should end up.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Foster and Nerlikar define the vision as an end state seen from the customer's side, and the customer journey vision as the description of the six stages of the journey a customer takes with the product: trigger, discovery, evaluation, trial, engagement and retention. | quotation: 'The vision is not a bulleted list of product features but rather an expression of how the customer will derive value from those features.'; source: The customer journey vision: a description of all aspects of the journey a customer will take with the product to achieve their outcomes, from the initial trigger and discovery to retention; far more detailed than a general-purpose mission statement. It is the second of the three components of vision-led product management: key customer outcome, customer journey vision, product strategy. |  |\n| p06 | comparison (table) | Three different things are called a vision, and they differ in whose point of view they take and in what they can decide. | table: What is called a vision \\| Example \\| Whose point of view \\| What it can decide. Ambition or mission statement \\| 'The operating system for field service' \\| the company's \\| nothing about a single request. Feature list \\| 'Approval workflows, route optimization, offline mode' \\| the product's \\| what is built next, with no reason. Customer journey vision \\| 'A planner starts Monday with the week already scheduled' (given in full in the next section) \\| the customer's \\| whether a request lies on the way to that future. | `contrast`: The definition of a vision. → The two things it is confused with. |\n| p07 | explanation | A journey vision is usable when it is specific enough to recognize when reached, covers all stages with more breadth than depth, and looks about three years ahead, which is Foster and Nerlikar's rule of thumb. | source: Breadth is more important than depth, but each stage needs enough detail to confirm the journey is plausible. As a default they recommend a horizon of about three years. They accept that a vision requires a leap of faith.; reasoning: The test 'specific enough to recognize when reached' is the author's wording of the chapter's thesis: a reader of the vision should be able to say what they would observe at a customer on the day it is true. | `elaboration`: The customer journey vision as one of three things. → What makes one usable. |\n\n### Pattern: Write the Vision as a Journey\n\n**Controlling idea** (`example`, id `write-the-vision`): Written as a journey, Corvane's vision for 2028 can be recognized when reached and shows which requests lie on the way, though not their order.\n\n**Advances the thesis** (S2): Turns the definition into a pattern with a user and a measure, and applies it to Corvane.\n\n**Transition in:** `example`: The definition and its rules of thumb. → The pattern for writing one, and Corvane's.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | recommendation | The pattern is for the head of product, who writes the vision with design and engineering leaders for the teams and colleagues who must answer requests, and it has worked when those people tell the same story and can place a request on it. | source: Build What Matters recommends artifacts that can be read in a couple of minutes: comic strips, vision mock-ups, customer diary entries; the mock-ups are concept wireframes, not deliverables for engineering.; reasoning: User: the people who answer requests (product managers, team leads, sales). Outcome measure: the share of incoming requests that can be answered by pointing to a stage of the journey, without going to the head of product. The measure is the author's. Chapter 2 applied the same idea to the organization itself; this chapter is about the product. |  |\n| p09 | example (table) | Corvane's customer journey vision, written in 2025 for 2028, follows one planner and her operations manager through the six stages. | table: Stage \\| What the customer experiences in 2028. Trigger \\| an operations manager at a heating company with forty technicians sees her planners spend each Monday rebuilding the week by hand, and customers learning of a moved appointment only when they call. Discovery \\| she hears from another service company that its week arrives planned. Evaluation \\| she loads last month's real jobs and sees the week Corvane would have planned beside the one her planners made. Trial \\| one region runs for two weeks on proposed schedules; the planner accepts or changes each proposal. Engagement \\| a planner starts Monday with the week already scheduled; when a technician calls in sick, the plan repairs itself and the customers affected are told before they ask; the technician sees the changed day on the phone. Retention \\| each month the operations manager sees the planning hours saved and the share of appointments kept as first promised, and renews on numbers she can check. | `example`: The pattern. → Corvane's vision written to it. |\n| p10 | analysis | The vision shows which of the three requests lie on the customer's way to that future, and it cannot yet say in what order to act. | reasoning: A custom approval step for one customer appears in no stage; an offline mode touches the engagement stage (the technician sees the changed day); route optimization could serve a planned week. Two of three lie on the journey; the vision gives no order between them. | `cause_effect`: Corvane's vision. → What it settles about the three requests and what it leaves open. |\n\n### Strategy Works Backward from the Vision\n\n**Controlling idea** (`definition`, id `strategy-works-backward`): A product strategy, in Build What Matters, is the way from today's customer journey to the future one, found by working backward from the vision and carried out forward through sequenced steps with measurable milestones.\n\n**Advances the thesis** (S3): Defines strategy as the ordered steps between two journeys.\n\n**Transition in:** `problem_solution`: A vision that gives no order. → The strategy, which supplies the order.\n\n**Order of paragraphs** (`prerequisite_order`): Point A and point B come before the working-backward move that connects them, the sequencing factors come after the steps exist, because they order steps and do not find them, and the refusal comes last because it is added to a step that is already defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Foster and Nerlikar define the product strategy as the way from point A, today's customer journey, to point B, the journey of the vision, and it begins with a gap analysis between the two. | source: The product strategy works backward from the vision and makes it achievable by accounting for business realities and constraints, identifying the key steps along the way and establishing measurable milestones. The first step is a gap analysis comparing the customer journey vision with the customer's actual journey today. |  |\n| p12 | process (figure) | Working backward means asking of the vision what has to be true just before it, and asking the same of each answer until today is reached; the steps are then carried out in the opposite direction. | figure: Mermaid flowchart, right to left: 'Customer journey vision' --'what must be true first?'--> 'Step 3 and its milestone' --'what must be true first?'--> 'Step 2 and its milestone' --'what must be true first?'--> 'Step 1 and its milestone' --'what must be true first?'--> 'Today's journey'. Caption: the steps are found from the vision backward and carried out from today forward. | `elaboration`: Point A, point B and the gap. → How the steps between them are found. |\n| p13 | explanation | The order of the steps is set by constraints, of which Foster and Nerlikar list six, and each step ends in a milestone, an outcome with a measure, at which the strategy is reassessed, so the order of the steps is the order of the outcomes. | source: Six sequencing factors: the financial situation and fundraising; acquiring and extending a competitive advantage; serializing market segments; serializing outcome delivery; resolving technology and data dependencies; creating strategic leverage. Milestones tell you when it is time to move into the next strategic phase and are natural points to reassess. 'It's okay to change your strategy along the way. In fact, it's essential.' | `additional_support`: Steps found by working backward. → What fixes their order and where they are reviewed. |\n| p13b | recommendation | To each step I add a statement of what will not be done while it is under way, because a step that refuses nothing gives no order; this part is the author's addition to Foster and Nerlikar's two. | reasoning: A step states what must be true first and its milestone (the source's parts); without a refusal, any request can be attached to the current step. Marked as the author's addition; an independent source's reason for it (Rumelt on choice) comes with the test two sections later. | `additional_support`: Steps with prerequisites and milestones. → The third part of a step: what will not be done. |\n\n### Pattern: Three Steps, Each with a Milestone and a No\n\n**Controlling idea** (`example`, id `three-steps`): Corvane's first three steps toward its vision each state what must be true first, a measurable milestone and what will not be done, and with them the three requests get three different answers, each with a reason.\n\n**Advances the thesis** (S3): Applies working backward to Corvane and shows the strategy doing the work the thesis claims: saying no with a reason.\n\n**Transition in:** `example`: The definition of strategy. → The pattern for writing its first steps, and Corvane's.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | recommendation | The pattern is for the head of product and the product leaders who must answer requests and brief teams: write the first three steps and no more, each with its three parts, and judge the pattern by milestones reached and by how many requests still have to be escalated. | reasoning: Three steps and no more, because the reassessment at each milestone changes what comes after. User: product leaders and through them the teams. Outcome measure: milestones reached at reassessment, and the number of requests escalated to the head of product per quarter. |  |\n| p14b | description | Corvane's gap in 2025 was that planners built and repaired the week by hand and customers learned of changes by calling, while the product could detect a conflict and could not propose a schedule, because what a planner knows was not held as data and planners had no reason yet to trust a schedule they had not made. | scenario: Illustration: point A for Corvane in 2025, set beside the engagement stage of the vision. | `example`: The pattern. → Corvane's point A and its gap. |\n| p15 | example (table) | Working backward from the 2028 vision, Corvane's strategy of 2025 has three steps: every schedule change is communicated, the product proposes a repair and the planner decides, and the week arrives planned. | table: Lead-in states the principle of the order as the answer to the gap's second obstacle (trust): earn the planner's trust one disruption at a time before planning the whole week. Step \\| What must be true first \\| Milestone \\| What will not be done. 1. Every change to the schedule reaches the customer and the technician without a phone call \\| each schedule change is published in one way, whichever part of the product makes it (in 2025 changes are recorded and carried by three different systems) \\| 80% of appointment changes reach the customer through the product before the customer contacts the office \\| no customer-specific approval workflows. 2. For one disruption (a technician is sick) the product proposes a repaired plan and the planner decides \\| step 1's channel, so that a repaired plan reaches customer and technician; technician skills, parts on hand and customer time windows held as data, not in planners' heads \\| planners accept 60% of proposed repairs unchanged \\| no route optimization beyond today's travel-time estimates. 3. The week arrives planned: on Friday the product proposes the next week \\| planners trust proposals (step 2's milestone) \\| half of customers' weeks start from a proposed schedule \\| no dispatch without a planner's confirmation. | `cause_effect`: The gap. → The three steps that working backward gives. |\n| p16 | analysis | With the three steps written, the three requests of the opening get three different answers, each with a reason: no, not yet, and yes in a narrower form. | reasoning: The custom approval step: no, it is on no stage of the journey and step 1 excludes it. Route optimization: not yet, no step before the third needs more than today's travel-time estimates. Offline mode: yes, narrowed to what step 1 needs, the changed day reaching a phone with poor reception. | `cause_effect`: Three steps with their refusals. → What they do to the three requests. |\n\n### Testing the Strategy: Rumelt's Kernel\n\n**Controlling idea** (`analysis`, id `testing-the-strategy`): Rumelt's kernel of diagnosis, guiding policy and coherent action is a test that a vision-led strategy has to pass, and a strategy with no diagnosis and no choice is a goal.\n\n**Advances the thesis** (S4): Gives the reader the check for a diagnosis and a choice, and names how a strategy without them shows up in the organization.\n\n**Transition in:** `additional_support`: A strategy written from one source's method. → An independent test of whether it is a strategy at all.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | definition | Rumelt holds that a good strategy has a kernel of three elements, a diagnosis, a guiding policy and coherent action, and that most documents called strategies are goals. | source: The kernel: a diagnosis that defines the nature of the challenge; a guiding policy, the overall approach chosen to deal with the obstacles the diagnosis names; coherent actions that carry out the guiding policy. 'Strategy involves focus and, therefore, choice.' |  |\n| p18 | comparison (table) | Each element of the kernel has a counterpart in a vision-led strategy, and the mapping, which is the author's, shows where such a strategy can be empty. | table: Kernel element (Rumelt) \\| The question it answers \\| In a vision-led strategy \\| Corvane, 2025. Diagnosis \\| what is the challenge? \\| the gap analysis: why today's journey is not the future one \\| the product records a schedule and cannot propose one, because what a planner knows is not held as data. Guiding policy \\| what approach, and what is ruled out? \\| the principle behind the order of the steps, with what will not be done \\| earn the planner's trust one disruption at a time before planning the week; nothing built for a single customer. Coherent action \\| what is done, so that the actions support each other? \\| the steps and their milestones \\| the three steps, each making the next possible. | `similarity`: The kernel. → Its counterparts in the strategy of the previous two sections. |\n| p19 | analysis | Rumelt's four hallmarks of bad strategy turn the kernel into a check, which Corvane's old deck fails, having an ambition and a list with no diagnosis and no choice, and which the three steps pass. | source: Four hallmarks: fluff; failure to face the challenge; mistaking goals for strategy; bad strategic objectives.; scenario: Illustration: 'The operating system for field service' followed by features with dates names no obstacle and rules nothing out. | `example`: The kernel as a mapping. → The kernel as a check, applied to the deck of the opening. |\n| p20 | analysis | A strategy with no diagnosis and no choice shows up in the organization as three of this book's failure patterns: the Feature Factory, the Escalation Ladder and the Consensus Stall. | quotation: 'universal buy-in usually signals the absence of choice.'; reasoning: A feature list in place of a vision leaves teams building what was requested (the Feature Factory); with no rule for refusing, each request travels up to the one person who can decide (the Escalation Ladder); a strategy that keeps every option is agreed by everyone and decides nothing (the Consensus Stall). | `cause_effect`: A deck that fails the test. → What that failure looks like in daily work. |\n\n### Where the Sources Disagree\n\n**Controlling idea** (`counterargument`, id `where-the-sources-disagree`): The sources disagree on whether a vision deserves trust, on how far it looks and what a strategy ends in, and on whether a long-range vision is guesswork; in each case the vision stays the destination and the strategy is what gets tested and revised.\n\n**Advances the thesis** (S4): States the tensions among the sources and the main objection, and gives the book's resolution of each.\n\n**Transition in:** `contrast`: Rumelt used as a test of Foster and Nerlikar's method. → The places where Rumelt, Cagan and the lean view pull against it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | counterargument | Rumelt distrusts visions, which he treats as ambition in place of strategy, while Foster and Nerlikar build everything on one; the two fit once the vision is taken as the destination and the kernel is applied to the strategy. | quotation: 'This “vision” communicates an ambition, but it is not a strategy or a guiding policy because there is no information about how this ambition will be accomplished.'; reasoning: Foster and Nerlikar agree that a vision without a plan to reach it is not enough; their vision is a described journey and not a slogan. Rumelt's criticism lands on the ambition statement of the comparison table. |  |\n| p22 | comparison | Cagan gives the vision a longer horizon, pairs it with product principles and ends strategy in problems given to teams, where Foster and Nerlikar end it in sequenced steps; I use the steps for the order and take from Cagan that each step reaches teams as a problem. | source: As the author's records summarize Empowered: one shared product vision, three to ten years out, not a roadmap; product principles that settle trade-offs at team level; strategy as focus on a few critical problems with an explicit statement of what will not be prioritized, insights, action as team objectives that are problems to solve, and active management.; reasoning: Foster and Nerlikar's default horizon is about three years. Which horizon fits depends on how fast the market and the technology change; the resolution on steps versus objectives is the author's and is developed in chapter 12. | `additional_support`: One disagreement about the vision. → A second, about horizon and about what strategy ends in. |\n| p23 | refutation | The strongest objection is that a three-year vision is guesswork and that strategy should emerge from fast iteration and data; it is right that the strategy will change and wrong that iteration can choose the destination. | source: Foster and Nerlikar accept that the vision requires a leap of faith and recommend reassessing roadmap and vision at one third or one quarter of the time horizon.; reasoning: Iteration improves what exists and compares neighbors; it cannot choose between futures, because the alternatives do not exist yet to be measured. The three requests at Corvane could each have been iterated on successfully. | `contrast`: Disagreements between sources that accept a vision. → The view that rejects one. |\n\n### What the Product Strategy Hands On\n\n**Controlling idea** (`explanation`, id `engineering-strategy-and-planning`): The product strategy hands the engineering strategy a set of things that must become true and receives constraints in return, and it hands planning an order of outcomes while leaving the decision about capacity to planning.\n\n**Advances the thesis** (S5): States the relation to the engineering strategy of Part IV and to planning in Part VI, as the acceptance criteria require.\n\n**Transition in:** `sequence`: A strategy that has been tested and defended. → What takes it as input next.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | explanation | The engineering strategy takes the product strategy as an input, because each step's 'what must be true first' is often an engineering matter, and it gives back constraints that can change the order of the steps. | source: Foster and Nerlikar's fifth sequencing factor, resolving technology and data dependencies: the assets necessary to support the future customer journey vision.; scenario: Illustration: Corvane's step 1 needs every schedule change published in one way, and in 2025 Corvane ran three message brokers; step 2 needs parts data from the Stock Integrations team in one form. Chapter 13, engineering-strategy, treats the diagnosis and policies that settle such matters. |  |\n| p25 | explanation | Planning takes the order of outcomes from the product strategy and decides how much capacity each gets; a good strategy does not make planning work, and planning cannot supply a missing strategy. | scenario: Ledger: in 2026, a year after the strategy was written, Corvane's quarterly planning still took nine of thirteen weeks. The strategy said what came first; it did not say who allocates capacity or how. Chapter 20, planning, treats that; the next chapter lays the steps out in time. | `additional_support`: The hand-over to engineering strategy. → The hand-over to planning. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI makes the artifacts of a vision and the features on a list cheaper to produce, which raises the value of the choice a vision and a strategy make and does not make that choice.\n\n**Advances the thesis** (S2, S3): Applies the chapter's argument to AI with labeled claims.\n\n**Transition in:** `additional_support`: The strategy and what it hands on. → What changes when building and drawing get cheaper.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | analysis | Emerging: product leaders use generative tools to produce vision artifacts such as storyboards and mock-ups in hours, which lowers the cost of showing a future journey and leaves the cost of choosing one where it was. | reasoning: Author's observation as of November 2026, labeled Emerging; not a measured result. The first sentence of the section announces the label scheme. |  |\n| p27 | claim | Speculative: when coding agents make a feature cheaper to build, saying yes to a request costs less in engineering time and as much as before in product coherence, so a feature list grows faster unless a vision and a strategy bound it. | reasoning: Labeled Speculative; follows from the argument of Part XI (where-the-constraint-moves). It would be confirmed where organizations using agents report more features shipped per quarter with no movement in retention or in their key customer outcome. | `cause_effect`: Cheaper artifacts. → Cheaper features, and what that does to the need for a no. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The vision and the strategy do different jobs and fail differently: the vision bounds which problems are worth solving and fails by being an ambition or a list; the strategy orders them and fails by having no diagnosis and no refusal. An organization needs both before an outcome can be chosen over another outcome.\n\n**So what:** The reader can answer the next loud request with a stage of the journey and a step of the strategy, and can refuse it with a reason the requester can check.\n\n**Callback:** The three requests that reached Priya Nambiar in one month of 2025. The reader can now say why all three were accepted then, and give the three different answers the strategy gives.\n\n**Takeaway** (`course_of_action`): Write your product's vision as one customer's future journey on one page, then the first three steps toward it with a milestone and a refusal each, and run the checklist on the result.\n\n**Hand-off** to [Roadmaps and Horizons](roadmaps-and-horizons.html): `sequence`: A strategy as ordered steps toward a vision. → Those steps laid out in time, with what each horizon can commit to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | synthesis (list) | Established: a vision is the customer's future seen from the customer's side and not a feature list; a strategy needs a diagnosis and a choice; a strategy is revised as evidence arrives. |  |  |\n| p29 | synthesis (list) | Depends on context: how far ahead the vision looks, how many steps can be fixed in advance and how detailed the journey is depend on how fast the market and the technology change and on how much is known about the customer. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p30 | synthesis (list) | The author's synthesis: adding a statement of what will not be done to every step, mapping Rumelt's kernel onto the vision-led strategy, and the division of work between vision and strategy are this book's position. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p31 | recommendation (list) | The checklist turns the two patterns and the test into eight questions to ask of a vision and a strategy. |  | `sequence`: What to take away. → What to do with it. |\n| p32 | transition | The three requests now have three answers, and the strategy that gives them is a set of ordered steps toward a vision; the next chapter lays those steps out in time and says what each horizon can commit to. |  | `sequence`: A strategy as ordered steps toward a vision. → Those steps laid out in time, with what each horizon can commit to. |\n\n## Non-goals\n\n- Key customer and business outcomes, the product dysfunctions and outcome metrics See [Outcomes Over Output](outcomes-over-output.html).\n- Roadmaps: horizons, what each may commit to, and the balance of innovation, iteration and operation See [Roadmaps and Horizons](roadmaps-and-horizons.html).\n- Who decides what: empowered teams, discovery and delivery, team objectives See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- How an engineering strategy is written and reviewed See [Engineering Strategy](engineering-strategy.html).\n- Budget, allocation and the planning process See [Planning](../grounded-engineering-executive/planning.html).\n- Vision and roadmap for the organization itself See [The Organization as a Product: Who It Serves and What It Owes Them](the-organization-as-a-product.html).\n- Company strategy, competitive positioning and Rumelt's sources of advantage beyond the kernel and the hallmarks of bad strategy\n- Product principles in detail (Cagan); the chapter names them and links the author's record\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Corvane's customer journey vision, its three steps and their milestone figures (80%, 60%, half) are invented by this chapter and appended to the ledger; the author may want different numbers or a different customer.\n- Chapter 9 is written in parallel; if it names Corvane's key customer outcome, check that it agrees with the retention stage of this chapter's vision (planning hours saved; appointments kept as first promised).\n- Cagan's positions are taken from the author's grounded-product-management records, not from Kindle notes; the author may want a direct check against Empowered and Inspired.\n- The 'statement of what will not be done' on each step is presented as the author's addition to Build What Matters, supported by Rumelt and Cagan; confirm that attribution.\n- The lean objection is stated without a named source because none is among the chapter's sources.\n\n## Decision log\n\n- **2026-11-19** — Intent, acceptance criteria, thesis and role copied unchanged from the journal spec; supporting claims S1 to S5 are this spec's.\n- **2026-11-19** — Corvane's vision builds on the vision in the journal spec's acceptance probe (the planner's Monday), as the task brief instructs; the ambition statement and the feature list shown in the chapter are worded differently from the probe's so that the cold-reader probe is not answered by recognition. Rejected: Keeping the probe's case out of the chapter altogether, as chapter 2 did\n- **2026-11-19** — The Corvane case runs through the chapter (requests, vision, steps, test) as one example read through one lens, whether a request can be answered with a reason; there is no separate worked-example section. Rejected: A separate worked example at the end, which would tell the case twice\n- **2026-11-19** — Anti-patterns are one paragraph inside the section on Rumelt's test, since they are what a failed test looks like. Rejected: A separate anti-patterns section\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 of the draft check (auto mode, local fix to the spec's worked example, not to its argument or order): the steps table (p15) gave step 1 the prerequisite 'nothing new' while p24 said step 1 needs one way of publishing schedule changes, and step 2 did not depend on step 1 although p18 says each step makes the next possible. Step 1's prerequisite is now the single way of publishing changes, step 2's prerequisites include step 1's channel, and the principle of the order is stated in p15's lead-in before the kernel table uses it.\n- **2026-11-19** — After round 2 (ESCALATE; two corroborated flow failures with one root, one attributed to the spec): the cause of Corvane's gap (the planner's knowledge is not held as data) and the obstacle the ordering principle answers (planners do not yet trust proposals) were first stated in the steps table and the kernel test. Local fix in auto mode: p14b now states both, so p15's principle and p19's diagnosis refer back to it. No unit added, dropped or reordered. No waiver recorded; the round-2 report is left as written and is stale against the revised draft.\n\n## Sources\n\n- **Internal**\n  - grounded-product-management: customer-journey-vision, product-strategy, product-vision-and-principles, empowered-product-strategy — The author's summaries of Build What Matters and of Cagan's Empowered (vision and principles; strategy as focus, insight, action and management).\n  - _input/checklists/data/data.json (Customer Journey Vision; Product Strategy under Build What Matters and Empowered) — The scope of the two checklists the chapter's checklist draws on.\n  - _research/scenario-ledger.md — Corvane in 2025 and 2026: size, cast, teams, the feature-list roadmap, the three message brokers, the Nine-Week Plan.\n  - journal-spec.json, entry vision-and-product-strategy — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020); author's notes, _input/bookshelf/docs/notes/build-what-matters.pdf — End-state customer vision; customer journey vision and its six stages; product strategy working backward with key steps and measurable milestones; gap analysis; six sequencing factors; the three-year default; reassessment.\n  - Richard Rumelt, Good Strategy Bad Strategy (2011); author's notes, _input/bookshelf/docs/notes/good-strategy-bad-strategy.pdf — The kernel (diagnosis, guiding policy, coherent action); the four hallmarks of bad strategy; strategy as choice; his criticism of vision statements.\n\n## Changelog\n\n- **2026-11-19** — First version of the spec, written before any prose.\n- **2026-11-19** — Revised after the flow rubric (sound with notes): the six stages named where the journey vision is defined; the refusal defined in the strategy section before the pattern uses it (p13b); Corvane's gap made its own paragraph (p14b); milestones tied to outcomes; the kernel check stated for the three steps as well as the old deck. Notes not acted on: the declared rationale does not say what would break for the positions of the hand-over and AI sections.\n- **2026-11-19** — After round 1 (REVISE; one major transition failure in the draft, eight minor flow notes): two cells of the steps table in p15 corrected so that they agree with p18 and p24, and the ordering principle added to p15's lead-in. See decision log. Draft revised to match; round 2 follows.\n- **2026-11-19** — After round 2 (ESCALATE): p14b's controlling idea extended with the cause of the gap and the trust obstacle; p15's lead-in tied to it. Draft units p14b, p15, p21 (opening clause) and p25 revised once; not re-checked, by the two-round limit.\n"}]}]}</script>

    (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

            function inline(s) {

                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
