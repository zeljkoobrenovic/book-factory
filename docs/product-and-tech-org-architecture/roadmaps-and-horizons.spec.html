<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The balanced roadmap of Build What Matters: innovation, iteration and operation, each with a deliberate share.\n- **Know:** Outcome-based roadmap items and horizons of decreasing certainty.\n- **Know:** What a roadmap commits to and to whom.\n- **Believe:** A roadmap is a statement of intended outcomes in order, and treating it as a delivery contract with dates makes it false.\n- **Be able to:** Classify roadmap items into innovation, iteration and operation and judge the balance.\n- **Be able to:** Rewrite a dated feature list as a roadmap with horizons.\n- **Be able to:** Say how far ahead a roadmap can honestly look for a given organization.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a roadmap of dated features, the reader rewrites three items as outcomes at the right horizon and says what the roadmap may promise a customer. *Probe:* A roadmap reads: 'Q1 offline mode; Q2 route optimization v2; Q3 customer portal redesign; Q4 AI dispatch.' Using only this chapter: what is wrong with it as a commitment, and how would the Q3 and Q4 items be stated? | `custom` | cold_reader | major |\n| AC-2 | The chapter says what AI changes about roadmap horizons with labeled claims. | `custom` | rubric | major |\n| AC-3 | Concepts taken from a named source name the book and the concept; rules of thumb are presented as that author's rule of thumb; anything applied beyond the source is marked as the author's extension. | `evidence_is_explained` | rubric | major |\n| AC-4 | Each pattern in the chapter names its user and an outcome measure by which a reader could tell that it worked. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What should a roadmap commit to, and how far ahead can it honestly look?\n\n> **Claim:** A roadmap should commit to outcomes in an order, with a stated share of capacity for each of innovation, iteration and operation; it can honestly name solutions and dates only as far ahead as one learning cycle of the organization, the near horizon, and beyond that it can name only the problems, with decreasing precision; a roadmap that names features and dates a year out is a promise the organization cannot know it will keep.\n\n**Disputed by:** The view of sales, customers and boards that a roadmap is a commitment to deliver named features on dates, and that anything less is evasion.\n\n**So what:** A leader publishes one roadmap with stated horizons, gives customers direction and near-term dates only, and defends a deliberate share of capacity for operation and iteration.\n\n**How and why:** What is known about a solution falls quickly with distance in time, while what is known about the customer's problem holds; so the honest content of a distant item is the problem. Without a stated balance, urgent operational and customer-specific work takes the whole roadmap.\n\n**Supporting claims**\n\n- **S1** — A roadmap of dated features can be delivered in full and still fail, because it states solutions and says nothing about what changes for customers.\n- **S2** — A roadmap exists to connect near-term work to the strategy and the vision, so its items are outcomes in an order, and a feature is one candidate solution to an outcome.\n- **S3** — A roadmap needs a stated share of capacity for each of innovation, iteration and operation, decided before any item is ranked, or urgent and customer-specific work takes all of it.\n- **S4** — Solutions and dates can be named honestly only within one learning cycle of the organization; beyond it the roadmap can name outcomes and then only problems, with decreasing precision.\n- **S5** — One roadmap with stated horizons tells customers, sales and the board what each horizon promises: dates near, direction far.\n- **S6** — The demand for dated features a year out is answered by what can truthfully be planned on, and a date kept that far ahead is kept by not learning.\n\n## Role in the part\n\nLays the strategy out in time and fixes what each horizon may promise. Supports P3-3 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in what-a-roadmap-is-for, the-balanced-roadmap, the-learning-cycle, one-roadmap-stated-horizons: the form of an item before the share among items, both before how far ahead items can be named, and the horizons before what each promises)\n\nThe reader first meets a roadmap that was kept in full and did not help, so that the rest arrives as the explanation. The scene names three things the roadmap never stated, and the next three sections supply them in an order each step of which needs the one before: the form of an item comes first because the balance ranks and divides items, and a share of unstated items divides nothing; how far ahead comes third because the horizons vary the form of an item with distance. The horizons section must follow the balance because it ends by joining the two: the share is the commitment that holds across every horizon. What each horizon promises to each audience needs the horizons, and the objection needs that pattern, since it objects to exactly what the pattern withholds; placed earlier, the objection would be answered before the reader knew what was being offered instead of dates. The worked example applies all of it to the opening case, and the AI section is a coda because it asks what happens to the one quantity, the learning cycle, on which the limit rests.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In 2024 Corvane's roadmap listed forty-one features, each promised to a large customer by name, each with a date. Corvane shipped all forty-one, thirty-eight of them by the promised date. Its renewal rate fell.\n\n**Bridge:** A reader who has defended a roadmap to sales, a customer or a board has been asked for features with dates a year out, and has probably given them. → The question is what a roadmap can commit to without becoming false, and how far ahead it can name a solution.\n\n**Thesis statement** (KEY POINTS callout and the second lead paragraph (p02)): A roadmap should commit to outcomes in an order, with a stated share of capacity for each of innovation, iteration and operation. It can honestly name solutions and dates only as far ahead as one learning cycle of the organization; beyond that it can name only problems, with decreasing precision.\n\n**Roadmap** (IN THIS CHAPTER callout and the second lead paragraph (p02)):\n\n- See a roadmap that was delivered in full and failed. *Kept in:* forty-one-promises-kept.\n- Say what a roadmap is for and state an item as an outcome. *Kept in:* what-a-roadmap-is-for.\n- Balance a roadmap across innovation, iteration and operation. *Kept in:* the-balanced-roadmap.\n- Find how far ahead a roadmap can name solutions, and lay it out in three horizons. *Kept in:* the-learning-cycle.\n- Say what each horizon promises to customers, sales and the board, and answer the demand for dates. *Kept in:* one-roadmap-stated-horizons, customers-and-boards-want-dates.\n- See Corvane's roadmap rewritten, and what AI changes. *Kept in:* corvane-roadmap-rewritten, what-ai-changes-here.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | In 2024 Corvane shipped every one of the forty-one dated features on its roadmap, thirty-eight of them on time and each promised to a named customer, and its renewal rate fell. | scenario: Ledger, stage 3 (2024, 180 people): forty-one features in one year, each promised to a named customer, thirty-eight shipped by the promised date; the roadmap a list of features promised to large customers, with dates; the renewal rate fell. |  |\n| p02 | claim | A roadmap should commit to outcomes in an order and to a stated share of capacity, and can name solutions and dates only one learning cycle ahead (the time the organization takes to find out whether a solution worked); the chapter goes from Corvane's roadmap, through what a roadmap is for, the balance and the learning cycle with its three horizons, to what each horizon promises, the objection that customers want dates, Corvane's roadmap rewritten, and AI. |  | `problem_solution`: A roadmap kept in full that did not help. → What a roadmap should commit to, and the route through the chapter. |\n\n## Sections\n\n### Setting the Scene: A Roadmap Delivered in Full\n\n**Controlling idea** (`example`, id `forty-one-promises-kept`): Corvane's 2024 roadmap was a list of dated features promised to large customers; it was delivered in full, and it said nothing about outcomes, capacity or how its dates could be known.\n\n**Advances the thesis** (S1): Gives the case of a roadmap kept as a delivery contract, whose three faults the following sections take in turn.\n\n**Transition in:** `elaboration`: The lead's short account of the forty-one features. → The roadmap itself and how it was made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description (table) | Corvane's 2024 roadmap was a list of features, each with the customer it was promised to and a date, added by sales or account management during a deal or a renewal up to a year before delivery. | table: Illustrative excerpt of the 2024 roadmap, four of forty-one rows: Feature \\| Promised to \\| Date. Bulk job import from spreadsheets \\| a lift-maintenance company \\| March. Custom billing export format \\| a heating installer \\| June. Technician skills matrix \\| a telecom installer \\| September. Planner dashboard, version 2 \\| three large customers \\| December. |  |\n| p04 | analysis | The roadmap was delivered in full and still failed, because nothing on it said what would change for customers, how capacity was divided, or how a date set a year ahead could be known. | scenario: All forty-one features shipped in 2024, thirty-eight by the promised date, and the renewal rate fell (ledger). | `contrast`: A list of promises with dates. → The list kept in full, and the three things it never stated. |\n\n### What a Roadmap Is For\n\n**Controlling idea** (`definition`, id `what-a-roadmap-is-for`): A roadmap connects near-term work to the strategy and the vision, so its items are outcomes in an order, and a feature is one candidate solution to an outcome.\n\n**Advances the thesis** (S2): Defines the roadmap's job and the form of an item, which the balance and the horizons then act on.\n\n**Transition in:** `problem_solution`: A roadmap that stated solutions and dates only. → What a roadmap is for, and so what an item on it should state.\n\n**Order of paragraphs** (`prerequisite_order`): The roadmap's job comes first, the sales-led version is then recognizable as a departure from it, and the outcome form of an item comes last because it is the remedy to that departure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Build What Matters defines the roadmap's job as connecting near-term product changes to mid-term strategic milestones and the long-term vision so that other teams can plan, which makes its content intended outcomes in an order. | source: Build What Matters: a roadmap connects the near-term product changes to the mid-term strategic milestones and the long-term vision, helps teams such as marketing and sales plan, and communicates the sequencing of priorities. |  |\n| p06 | explanation | A roadmap assembled from promises to customers is the sales-led roadmap Perri describes, and it is the artifact of the failure pattern this book calls the Feature Factory. | quotation: Perri: 'The product roadmap and direction were driven by what was promised to customers, without aligning back to the overall strategy.' She says of sales-led companies that they let their contracts define their product strategy. | `contrast`: The roadmap as a connection to strategy and vision. → The roadmap as a list of contracts. |\n| p07 | comparison (table) | An item on a roadmap is stated as an outcome, a customer's problem solved to a measured degree, and the feature becomes one candidate solution to it; the problem is what the customer cannot do today, and the outcome adds the measure by which it will count as solved. | table: As a feature \\| As an outcome \\| A measure. Bulk job import from spreadsheets \\| a new customer's planners schedule their first real week soon after signing \\| days from signing to the first week scheduled in Corvane. Custom billing export format \\| a completed job reaches the customer's invoice without anyone retyping it \\| share of completed jobs invoiced without manual correction. Technician skills matrix \\| no job is assigned to a technician who is not qualified for it \\| jobs reassigned for a missing qualification. | `problem_solution`: A roadmap of features promised by contract. → The form an item takes instead: an outcome with a measure. |\n\n### Pattern: The Balanced Roadmap\n\n**Controlling idea** (`process`, id `the-balanced-roadmap`): A roadmap states a share of capacity for each of innovation, iteration and operation, decided before any item is ranked, because without it urgent and customer-specific work takes the whole roadmap.\n\n**Advances the thesis** (S3): Supplies the second thing a roadmap commits to, the stated share, from the anchor source.\n\n**Transition in:** `additional_support`: Items stated as outcomes. → The second thing the 2024 roadmap never stated: how capacity is divided among kinds of work.\n\n**Order of paragraphs** (`prerequisite_order`): The three categories are defined before the rule that allocates among them; the reason for the rule follows it, and the condition under which the share changes comes last because it qualifies a rule the reader must first have.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition (table) | Build What Matters sorts all product development into three categories: innovation, which advances toward the vision; iteration, which improves what exists; and operation, which keeps the product and the business running. | table: Category \\| What it is (Build What Matters) \\| Fed by \\| At Corvane in 2024. Innovation \\| progress against strategic milestones toward the vision \\| vision and strategic planning \\| nothing on the roadmap. Iteration \\| better results from what is already built: minor improvements, new features, one-off requests, tests \\| customer feedback and requests \\| the skills matrix, the custom export. Operation \\| maintaining the product and running the business: architecture, performance, security, bug fixes, uptime; 'revenue protection' \\| bugs, internal tools, technical improvements \\| the release path that relieved the Launch Queue, which was not on the roadmap. |  |\n| p09 | process | The pattern is to decide the share of capacity for each category top-down before ranking any item, and then to rank items only within their category; it serves the product leader and the executives who agree the split, and it has worked when the share spent each quarter matches the share stated. | source: Build What Matters recommends starting with a top-down allocation, for example 60 percent to innovation, 30 to iteration and 10 to operation, so that executives understand the trade-offs and big decisions come before small ones. The percentages are the authors' example. | `sequence`: Three categories. → The rule that divides capacity among them, with its user and measure. |\n| p10 | cause_effect | Without a stated share, urgent and customer-specific work takes the whole roadmap, because items of different kinds cannot be compared and the request with the loudest sponsor wins each comparison. | source: Build What Matters: competing stakeholders with varying influence can have an outsized pull on priorities; a top-down allocation creates space for saying no and spares product managers 'comparing apples to oranges to grapes'.; scenario: Corvane 2024: every row had a customer and a date behind it; work on release tooling had neither. | `cause_effect`: The allocation rule. → What happens in its absence. |\n| p11 | explanation | The right share is not fixed: it depends on the product's stage and is revisited, and the operation share in particular is reserved in advance instead of being whatever is left; how the share is set inside budgeting and planning belongs to the planning chapter. | source: Build What Matters: reserve a percentage of product development for the operation category and rank technical debt, security holes and bugs against each other within it. The author's own record, balanced-roadmap, tunes the split to the product's lifecycle stage. | `contrast`: A stated share. → What that share depends on. |\n\n### How Far Ahead: The Learning Cycle and Three Horizons\n\n**Controlling idea** (`claim`, id `the-learning-cycle`): A roadmap can name solutions and dates only within one learning cycle of the organization, and beyond it only outcomes and then problems, in three horizons of decreasing precision.\n\n**Advances the thesis** (S4): Argues the chapter's specific limit, marks it as the author's position, and turns it into three horizons.\n\n**Transition in:** `additional_support`: What a roadmap commits to: outcomes and a share. → The third fault of the 2024 roadmap: how far ahead it named solutions and dates.\n\n**Order of paragraphs** (`prerequisite_order`): The asymmetry between solutions and problems is the premise; the learning cycle is the unit the limit is stated in, so it is defined before the limit; the horizons apply the limit and the figure shows items moving through them. The two qualifications come last, since each corrects a wrong conclusion a reader could draw from the limit: that the roadmap should look only one cycle ahead, and that nothing at all can be committed beyond it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | explanation | What an organization knows about a solution falls quickly with distance in time, while what it knows about the customer's problem holds. | reasoning: A solution depends on what the last release taught, on the technology and on what customers do with the current product, all of which change within months; the customer's problem (a planner whose plan breaks when a technician is sick) is the same next year.; quotation: Build What Matters asks, when setting a vision: 'How do we build the right products based on the customer needs that are unlikely to change?' Perri gives four levels of strategy (vision, strategic intent, product initiatives, options), each on a different time horizon. |  |\n| p13 | definition | A learning cycle is the time an organization takes from deciding to try a solution to knowing whether it moved the outcome, and it is the sum of three parts: building and releasing, reaching enough customers, and the measure moving and being read. | reasoning: Author's definition. Estimated by adding the three parts for a typical roadmap-sized solution; a generic illustration with figures different from Corvane's: four weeks to build and release, two for customers to take it up, two for the measure, about two months. | `sequence`: Knowledge of solutions decays. → The unit in which the decay is measured. |\n| p14 | claim | The author's position is that a roadmap can honestly name solutions and dates only within one learning cycle, because a solution named for later is chosen before the result that should choose it exists. | reasoning: After one cycle the organization knows whether the first solution worked, and that result decides what the next solution should be; a solution written down for the second cycle is decided without it. The sources give the outcome orientation and the balance; neither states this limit. | `cause_effect`: The learning cycle. → The limit it sets on what a roadmap may name. |\n| p15 | comparison (table) | The limit gives a roadmap three horizons of decreasing precision: near, where an item is an outcome with a solution and a date; middle, where it is an outcome with a measure and a place in the order; and far, where it is a problem. | table: Horizon \\| Reaches \\| An item states \\| Example. Near \\| one learning cycle \\| the outcome, the solution, a date \\| 'A customer whose appointment is moved hears it from Corvane first; a message with the new time, released in week 8'. Middle \\| the next two or three cycles \\| the outcome, its measure, its place in the order; no solution, no date \\| 'When a technician is sick, the product proposes a repaired plan and the planner decides; measured by the share of proposals accepted unchanged'. Far \\| from there to the horizon of the vision \\| the problem, and roughly where it comes in the order \\| 'A planner still builds each week's plan by hand'. | `elaboration`: One limit. → Three horizons that follow from it. |\n| p16 | process (figure) | An item moves from far to near as cycles complete: a problem becomes an outcome with a measure, the outcome gets a solution and a date when it enters the near horizon, and the measured result reorders what waits behind it. | figure: Mermaid flowchart, left to right: 'Far: a problem' → 'Middle: an outcome with a measure' → 'Near: a solution with a date' → 'Result measured'; an edge from 'Result measured' back to 'Middle' labeled 'reorders and restates'; a node 'Vision and strategy' feeding 'Far'. | `sequence`: Three horizons as a table. → How an item passes through them over time. |\n| p17 | explanation | The limit shortens what a roadmap promises as solutions and does not shorten how far it looks: Build What Matters names too short a horizon as a dysfunction of its own, the Roller Coaster. | source: Build What Matters: the Roller Coaster 'comes from setting a time horizon that is too short'; the authors recommend three years as the default horizon for a vision, and reassessing roadmap and vision at one-third or one-quarter of the horizon. These are the authors' rules of thumb. | `contrast`: A short near horizon. → The opposite error of looking only that far. |\n| p18 | claim | The three things on a roadmap are three kinds of statement: the share of capacity is a decision and can be committed a year ahead, the order of outcomes is a judgement that holds until a cycle revises it, and a solution with a date is a prediction that holds for one cycle. | reasoning: Author's synthesis of the two halves of the chapter: '25 percent to operation this year' is a choice that can be kept whatever the cycles teach; the order of outcomes rests on the strategy and is revised when a result contradicts it; a date for a solution predicts what will have been learned. | `additional_support`: A roadmap that looks far without naming far solutions. → What it can nevertheless commit to at that distance. |\n\n### Pattern: One Roadmap with Stated Horizons\n\n**Controlling idea** (`recommendation`, id `one-roadmap-stated-horizons`): One roadmap, shown to every audience with each horizon labeled by what it promises, gives customers and sales dates in the near horizon and direction beyond it.\n\n**Advances the thesis** (S5): Says what the roadmap commits to and to whom, which is the leader's action in the thesis.\n\n**Transition in:** `sequence`: Three horizons. → What each one promises, and to which audience.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | recommendation (table) | The pattern is to publish one roadmap to every audience with each horizon labeled by what it promises; it serves sales, customers and the board, and it has worked when near-horizon dates are kept and no dated promise exists beyond the near horizon. | table: Horizon \\| What is promised \\| What a customer or salesperson can do with it \\| What a board can do with it. Near \\| this solution on this date \\| plan a rollout, train staff \\| check delivery against dates. Middle \\| this outcome, in this order, judged by this measure \\| know what is coming next and argue about the order \\| check that the order follows the strategy. Far \\| this problem is on the list \\| know the direction of the product \\| check the direction against the vision. |  |\n| p20 | comparison | Build What Matters warns against letting sales share the internal roadmap, because customers hold the company to it; my recommendation differs in the remedy: a roadmap whose far items are problems can be shown, because it contains no feature to be held to. | source: Build What Matters: do not let salespeople take the internal roadmap and share it to close deals; once customers have seen it they hold you to it, which removes the flexibility a product manager needs. | `contrast`: One roadmap for every audience. → A source that advises keeping the roadmap from customers. |\n\n### The Objection: Customers and Boards Want Dates\n\n**Controlling idea** (`counterargument`, id `customers-and-boards-want-dates`): The demand for dated features a year out rests on a real need to plan, and it is met by what can truthfully be planned on and by a stated way of saying no; a date kept that far ahead is kept by not learning.\n\n**Advances the thesis** (S6): Answers the thesis's disputed_by view and gives the trade-offs among honest answers to a demand for a date.\n\n**Transition in:** `contrast`: A roadmap that gives direction beyond the near horizon. → The view that this is evasion.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | counterargument | The objection from sales, customers and boards is that a roadmap is a commitment to deliver named features on dates and that anything less is evasion, and the need behind it is real: they have plans of their own that depend on the product. | reasoning: A customer signing a multi-year contract, a salesperson closing a deal and a board approving a budget each have to plan on something. |  |\n| p22 | refutation | A date for a named feature beyond the learning cycle can be kept only by fixing the solution before the evidence arrives, as Corvane did; what the objectors need is something true to plan on, and the order, the share, the near dates and the record of dates kept are that. | scenario: Corvane shipped all forty-one promised features in 2024, thirty-eight on the promised date, and its renewal rate fell. | `contrast`: A real need to plan. → Why a far date does not meet it, and what does. |\n| p23 | comparison (table) | When a date beyond the near horizon is still demanded there are three honest answers, and which is right depends on where the date comes from: direction only, a fixed date with open scope, or a dated feature as a priced exception. | table: Answer \\| What is given \\| Right when \\| Cost. Direction only \\| the outcome and its place in the order \\| the date is a wish \\| some deals are harder to close. Fixed date, open scope \\| the date, and the outcome to be reached by it; the solution stays open \\| the date is set by the world: a regulation, a contract end, a customer's own launch \\| scope is cut to keep the date. Priced exception \\| a named feature on a date \\| one customer's need justifies it and someone senior spends limited capacity on it \\| capacity leaves the iteration share, visibly.; source: Build What Matters recounts a company that gave the head of sales a limited number of tokens for one-off requests, after which most such requests stopped reaching product management. | `elaboration`: What can truthfully be planned on. → The cases where a date is demanded anyway. |\n| p24 | process | Most requests are not demands for a date, and a roadmap with a stated share and stated horizons gives the general way of answering them: a request is recorded, competes inside the iteration share, and is declined with the reason when it does not make it. | source: Build What Matters: a hallmark of product-driven companies is being able to say no; keep an idea bank for suggestions not on the roadmap, and be transparent about what did not make it and why; product managers who cannot say no end up playing 'product management Tetris'. | `additional_support`: Answers to a demanded date. → The general answer to any request for something not on the roadmap. |\n\n### Worked Example: Corvane's Roadmap, Rewritten\n\n**Controlling idea** (`example`, id `corvane-roadmap-rewritten`): Rewritten in mid-2025 with a stated share and three horizons, Corvane's roadmap named solutions and dates for one quarter only, and the first cycle's result chose a second solution that no list written in advance could have named.\n\n**Advances the thesis** (S3, S4, S5): Applies the balance, the learning cycle and the horizons to the opening case and shows the limit doing its work.\n\n**Transition in:** `example`: The patterns and the objection. → The patterns applied to the roadmap the chapter opened with.\n\n**Order of paragraphs** (`chronological`): The steps are given in the order Priya Nambiar took them: classify what had been shipped, estimate the cycle, write the roadmap, read the first result. The roadmap table precedes any judgement of it, and the costs come last so that the result is not read as a clean success.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | example | In mid-2025 Priya Nambiar, Corvane's new CPO, first classified the 2024 roadmap: all forty-one rows were iteration, none was innovation, and operation work was not on the roadmap at all. | scenario: Illustration: mid-2025, Corvane growing toward 500 people. Every one of the forty-one rows of 2024 was a customer request (iteration in the Build What Matters sense); no row advanced toward a vision; the release path that relieved the Launch Queue in 2024 was operation work and appeared on no roadmap. |  |\n| p26 | example | She then estimated Corvane's learning cycle at about a quarter: six weeks to build and release a roadmap-sized solution, three for customers to switch it on, four for the measure to move and be read. | scenario: Illustration: 6 + 3 + 4 = 13 weeks, with a median lead time for a single change under 7 days. | `sequence`: The balance of the old roadmap. → The length of the near horizon for the new one. |\n| p27 | example (table) | The roadmap of mid-2025 stated a share of 40 percent innovation, 35 iteration and 25 operation, and laid seven items over three horizons, following the order of Corvane's strategy. | table: Horizon \\| Category \\| The item as stated \\| What Corvane promises. Near (third quarter of 2025) \\| Innovation \\| a customer whose appointment is moved hears it from Corvane before calling the office; a message with the new time and a link to accept it or ask for another, released in week 8; measure: share of appointment changes that reach the customer first, about a third today, target two thirds by the end of the cycle \\| the solution and the date. Near \\| Iteration \\| the features written into customer contracts in 2024 whose contract dates fall in this quarter \\| the solution and the date, promised by contract before the roadmap changed. Near \\| Operation \\| a completed job reaches the customer's billing system the same day; the nightly export's retry rebuilt, week 5 \\| the solution and the date. Middle (to mid-2026) \\| Innovation \\| when a technician is sick, the product proposes a repaired plan and the planner decides; measure: share of proposals accepted unchanged \\| the outcome and its place in the order. Middle \\| Iteration \\| planners stop keeping a second schedule in a spreadsheet; measure: share of planners who still keep one \\| the outcome and its place in the order. Far (to 2028) \\| Innovation \\| a planner still builds each week's plan by hand \\| direction. Far \\| Operation \\| each large customer's billing and stock integration is built separately \\| direction. | `sequence`: The cycle estimate. → The roadmap written with it. |\n| p28 | analysis | The first cycle kept its date and missed its target, and what it taught chose a second solution that a feature list written in advance could not have named. | scenario: Illustration: the message shipped in week 8; four weeks later the share of appointment changes that reached the customer from Corvane before the customer called had risen from about a third to just over half, against the target of two thirds; the rest were changes a planner agreed with a technician by phone and entered only in the evening, so no message could be sent in time; the next solution therefore let the technician record the change on the phone, where a list written in advance would have dated 'notifications, version 2'. | `sequence`: The roadmap as written. → What happened after its first cycle. |\n| p29 | analysis | The change had costs and left two things open: sales lost a list it could sell from, new dated features were granted only as a few priced exceptions, the yearly renewal rate could not show the roadmap's effect by itself, and nobody had settled who chooses the solutions. | scenario: Illustration: the head of sales was given three priced exceptions for the rest of 2025 and used two; the renewal rate is read once a year and cannot separate the roadmap from the other changes of 2025. | `contrast`: A first result in the roadmap's favor. → What the change cost and did not settle. |\n\n### What AI Changes Here\n\n**Controlling idea** (`analysis`, id `what-ai-changes-here`): AI shortens the building part of the learning cycle, so the near horizon may cover less calendar time while more is learned in it, and it also makes the dated feature list cheaper to keep.\n\n**Advances the thesis** (S4): Applies the learning-cycle limit to AI with labeled claims, as the journal spec's AC-2 requires.\n\n**Transition in:** `additional_support`: A near horizon of one quarter, set in 2025. → Whether that length holds when agents do part of the building.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | analysis | Emerging: coding agents shorten the building part of the learning cycle, and building is only one of its three parts, so the cycle shortens by less than the building does. | reasoning: Author's observation as of November 2026, labeled Emerging and not measured: teams using coding agents produce a first version of a solution in less time; customers' take-up and the measure's movement are customers' time and do not shorten with it. |  |\n| p31 | claim | Speculative: if the learning cycle shortens, the near horizon covers less calendar time, more cycles fit in a year, and more is learned inside each stretch of the roadmap, so less of a year's roadmap can be stated as solutions and its outcomes are reached, or dropped, sooner. | reasoning: Labeled Speculative; follows from the limit of this chapter. It would be confirmed where organizations report more solution attempts per outcome per quarter and shorter dated portions of their roadmaps. | `cause_effect`: A shorter building part. → What a shorter cycle does to the horizons. |\n| p32 | claim | Speculative: cheaper building also makes the dated feature list cheaper to keep, so the Feature Factory becomes more tempting, not less. | reasoning: Labeled Speculative; when a requested feature costs days, building it looks cheaper than refusing it. It would be confirmed where organizations with agents ship more customer-requested features per quarter with no change in their outcome measures. | `contrast`: A shorter cycle used to learn more. → The same speed used to promise more. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The two halves of the chapter are one rule about what kind of statement each part of a roadmap is: a share is a decision and can be committed for a year, an order of outcomes is a judgement that holds until a cycle revises it, and a solution with a date is a prediction that holds for one cycle.\n\n**So what:** The reader can publish one roadmap that customers, sales and a board can plan on, defend the capacity for operation and iteration with a number, and decline a far date with a reason.\n\n**Callback:** Corvane's forty-one dated features, all shipped, with a falling renewal rate. The reader can now say what that roadmap committed to (solutions and dates a year out, with no outcome and no stated share) and what it should have committed to.\n\n**Takeaway** (`course_of_action`): Take your current roadmap, estimate your learning cycle, and restate every item beyond it as an outcome or a problem. The checklist that follows gives the steps.\n\n**Hand-off** to [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html): `problem_solution`: A roadmap of outcomes, which leaves open who turns each outcome into a solution. → The division of decisions between leaders and teams, and the machinery a team needs to use its share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | synthesis (list) | Established: a roadmap connects near-term work to milestones and the vision; development divides into innovation, iteration and operation with a share set top-down; a roadmap driven by promises to customers is a known failure. |  |  |\n| p34 | synthesis (list) | Depends on context: the share depends on the product's stage, the length of the near horizon on the organization's learning cycle, and the answer to a demanded date on where the date comes from. |  | `contrast`: What the sources agree on. → What changes with the situation. |\n| p35 | synthesis (list) | The author's synthesis: the one-cycle limit on solutions and dates, the three horizons, and the reading of share, order and dated solution as decision, judgement and prediction are this book's position, not the sources'. |  | `contrast`: Recommendations with conditions. → What is the author's own position. |\n| p36 | recommendation (list) | The checklist turns the chapter into eight steps for rewriting a roadmap. |  | `sequence`: What to take away. → What to do with it. |\n| p37 | transition | A roadmap of outcomes explains why forty-one kept promises did not help Corvane, and it leaves open who turns each outcome into a solution, which the next chapter answers. |  | `problem_solution`: A roadmap of outcomes with no one named to choose the solutions. → The division of decisions between leaders and teams. |\n\n## Non-goals\n\n- Planning cadence, budgeting, allocation of capacity to areas and how the roadmap enters planning See [Planning](../grounded-engineering-executive/planning.html).\n- The vision and the strategy the roadmap lays out in time See [Vision and Product Strategy](vision-and-product-strategy.html).\n- Outcomes and the product dysfunctions in general See [Outcomes Over Output](outcomes-over-output.html).\n- Who chooses the solution for an outcome; discovery practice See [Discovery, Delivery and Empowered Teams](discovery-delivery-and-empowered-teams.html).\n- Prioritization scoring methods such as RICE in detail\n- Roadmap tools and formats\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The one-learning-cycle limit and the three-part definition of the learning cycle are the author's position as written here; the author may want to state them differently.\n- Corvane illustrations invented by this chapter (2024 excerpt rows; all forty-one rows classed as iteration; a quarter-long learning cycle; the 40/35/25 share; the seven roadmap items; the first-cycle result; three priced exceptions) should be confirmed against chapters 9 and 10 once those are final.\n- My recommendation to show customers the roadmap departs from Build What Matters' advice to keep the internal roadmap from them; the author should confirm the departure.\n- No Proven AI claim is made; the author may know a published measurement worth citing.\n\n## Decision log\n\n- **2026-11-19** — The one-learning-cycle limit is argued as the author's position and marked as such in the section that states it and in the take-aways; Build What Matters and Escaping the Build Trap are credited with the balance and the outcome orientation only. Rejected: Presenting the limit as a finding of the sources\n- **2026-11-19** — The learning cycle is defined as three parts (build and release, reach customers, measure and read) so that a reader can estimate it; Corvane's is set at about a quarter as an illustration. Rejected: Defining the near horizon in calendar terms (a quarter) for every organization\n- **2026-11-19** — The balance comes before the horizons, following the order of the chapter's question (what to commit to, then how far ahead), although the thesis sentence could be read either way. Rejected: Horizons first, balance as an addition\n- **2026-11-19** — The cold-reader probe uses offline mode, route optimization, a portal redesign and AI dispatch, so the chapter's own examples use other Corvane features; the probe's items do not appear in the chapter. Rejected: Using the probe's roadmap as the worked example\n- **2026-11-19** — Corvane's case agrees with the parallel chapters 9 and 10 as their specs stood: the forty-one features are 2024 (thirty-eight on time), the contractual promises are kept as dated items, and the rewritten roadmap is dated mid-2025 and follows the order of chapter 10's strategy steps. The excerpt rows, the all-iteration classification, the quarter-long cycle, the 40/35/25 share, the seven items and the first-cycle result are new illustrations appended to the ledger. Rejected: Leaving the year unstated\n- **2026-11-19** — No AI claim is labeled Proven: no measured, published result on roadmap horizons was fetched. The AI section carries one Emerging and two Speculative claims. Rejected: Citing delivery-speed surveys as evidence about learning cycles\n- **2026-11-19** — Flow rubric (one fresh agent): sound with notes. Applied: the problem/outcome distinction is given where the item is defined; the decision/judgement/prediction triad is stated in the horizons section so the conclusion does not introduce it; the paragraph on saying no moved into the objection section before the three honest answers; the pointer to the planning chapter folded into the paragraph on what the share depends on; the count 'forty-one times' removed from the refutation; the flow rationale now says why the item's form precedes the balance. Rejected: Running the rubric a second time\n- **2026-11-19** — Accepted in auto mode by the author's standing instruction of 2026-11-19; not individually reviewed.\n- **2026-11-19** — After round 1 (REVISE): both flow readers read the paragraph on saying no as a detour between the reply to the objection and the three answers to a demanded date, so it moved to the end of the objection section, after the table; the two paragraphs exchanged ids. The contract-features row of the worked example now says it holds only the features whose contract dates fall in the quarter. Rejected: Keeping the position the flow rubric had suggested\n- **2026-11-19** — After round 2 (ESCALATE; two spec-level findings, both local): the near item of the worked example now carries its measure and a target (two thirds of appointment changes reaching the customer first by the end of the cycle), so that 'missed its target' has a target; the contract-features row no longer points to the fixed-date answer, which it did not match; the generic learning-cycle illustration uses figures different from Corvane's. Draft revised once more; no third check round, by the author's two-round rule. Rejected: A third check round; Recording waivers\n\n## Sources\n\n- **Internal**\n  - _journals/grounded-product-management/posts/balanced-roadmap/index.md — The author's record on the balanced roadmap: allocation before ranking, tuning the share to the lifecycle stage.\n  - _input/checklists/data/data.json (Balanced Roadmap checklist; Roadmapping Guide template) — The author's checklist and template entries on balanced, outcome-based roadmaps.\n  - _research/scenario-ledger.md — Corvane: the forty-one features, the roadmap as dated promises, the cast and stage sizes.\n  - journal-spec.json, entry roadmaps-and-horizons — Intent, acceptance criteria, thesis and role, copied unchanged.\n- **External**\n  - Ben Foster and Rajesh Nerlikar, Build What Matters (2020); author's notes, _input/bookshelf/docs/notes/build-what-matters.pdf — The purpose of a roadmap; innovation, iteration and operation; top-down allocation; the Roller Coaster; the default three-year horizon and the reassessment rule; saying no and the idea bank; the warning about sharing the internal roadmap; the sales-token anecdote.\n  - Melissa Perri, Escaping the Build Trap (2018); author's notes, _input/bookshelf/docs/notes/build-trap.pdf — The sales-led roadmap driven by promises to customers; four levels of strategy on different time horizons.\n\n## Changelog\n\n- **2026-11-19** — After round 2: near item given a measure and target; contract row's back-pointer removed; generic cycle figures changed. Draft revised to match; the round-2 report is stale against this revision.\n- **2026-11-19** — After round 1: the saying-no paragraph moved to the end of the objection section (p23 and p24 exchanged); contract-features row clarified. Draft revised to match; round 2 follows.\n- **2026-11-19** — Revised after the flow rubric (sound with notes) and aligned with the Corvane facts of chapters 9 and 10; paragraphs renumbered; accepted in auto mode.\n- **2026-11-19** — First version of the spec, written before any prose.\n"}]}]}</script>

        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
