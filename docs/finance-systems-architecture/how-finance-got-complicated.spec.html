<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: From Cash Box to Cloud: How Keeping the Books Got This Complicated\n\n## Intent\n\nTake a reader who knows nothing about accounting or finance systems from the simplest way of keeping track of money (a trader alone with a cash box and a list) to today's enterprise finance estate, one step at a time, and introduce each concept the book uses at the step that first needed it. Every step answers the same question: **can someone who was not there trust these numbers, and how would they find out?** The answer grows from \"nobody else needs to; he counts the coins\" to a chain of records, systems, controls and outside checkers. The page leaves the reader thinking that the fourteen failure patterns on the next page are natural consequences of that growth.\n\n**Thesis (disputable).** Enterprise finance systems are complex not because vendors oversold or architects overbuilt, but because every new reader of the books who was not there (a partner, a lender, a shareholder, an auditor, a regulator, a group) demanded a new way to prove the numbers, and every new way of producing the numbers faster (machines, the ERP, the spreadsheet, the specialist platforms) added another record that must itself be proven. Each was a bargain both sides wanted, and none was ever retired. The rival view this page argues against: that the complexity is accumulated technical debt that a clean, single modern system would remove.\n\n**Role in the preface.** Sits after [Introduction: Architecture Where Every Number Must Reconcile](introduction.html) and before [Unreconciled: Fourteen Ways Finance Architecture Goes Wrong](where-finance-architecture-goes-wrong.html). The introduction says the estate must be architected so it can always be reconciled; this page shows, in plain words, why so many records exist to be reconciled; the patterns page names what goes wrong between them. Transition in: the introduction's hand-off (\"before the patterns, see how the books got this way\"). Hand-off: the patterns page.\n\n## Audience\n\nThe book's readers (Chief and Enterprise Architects, finance-systems, solution and integration architects, engineering leaders, finance-transformation leaders), and in particular those from engineering who have no accounting training. Written so that a reader new to finance follows every sentence: short sentences, one new term per paragraph at most, plain words before the term.\n\n## Success criteria\n\nReader outcomes, checked as probes:\n\n- [ ] Given a concept from a later chapter (double entry, trial balance, period close, ICFR, consolidation, book of record, subledger, clearing account, satellite platform, end-user computing), the reader can say which step introduced it and what limit of the previous step it answered.\n- [ ] Given a failure pattern's name from the next page, the reader can say which step makes it possible; each of the fourteen names appears exactly once in the tally's last column.\n- [ ] The reader can retell the walk in one sentence per step, and can state for each step what it made possible for both sides (the one who keeps the books and the one who must trust them) before what it cost.\n- [ ] The reader can say how the answer to the running question changed from the first step to the last.\n- [ ] The reader can tell documented fact from illustration on the page: every year, law and first is sourced and listed; generalizations are marked as common practice or illustration; Northmere appears only at the last step and is labeled fictional; the simplification is declared once, early.\n- [ ] The reader leaves expecting a failure wherever two records of the same money are kept by different hands at different times, and opens [Unreconciled: Fourteen Ways Finance Architecture Goes Wrong](where-finance-architecture-goes-wrong.html) with that expectation.\n\nForm: IN THIS SECTION, YOU WILL; exactly three KEY POINTS that name concrete things (the cash box, the ledger, the auditor, the spreadsheet, the payment provider's report), not abstractions; `<br>`; nine `##` steps; a tally table `Step | What it made possible | What it added | New party or delay | What can now go wrong`; an anchor timeline `Year | What its source dates to that year | Step`; closing and hand-off; Sources and Evidence in the book's grouping. One figure per step plus one overview figure (ten). 3,000–4,700 words of prose.\n\n## Structure (one section per step)\n\nEach step: where things stood; what stopped working or what people wanted next; what was added, in plain words, then the book's term in bold with a `[[link]]` to its owning chapter; what it made possible for each side; what it cost; a figure; the running question answered in two bold parts.\n\n1. **The cash box** — a trader alone (illustration). Need: know whether he is ahead. Concept: a list of what came in and went out. Gain: no one else to satisfy. Cost: only he can read it. Answer: nobody else needs to trust it; he counts the coins.\n2. **The partner who was not there: journal, ledger, double entry** — partners, lenders and customers on credit must trust books they did not watch. Concepts: journal entry, ledger accounts, double entry ([Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html)); the second pair of eyes, segregation of duties ([Controls by Design, Not by Audit Season](controls-and-auditability.html)). Anchor: Pacioli's *Summa*, Venice, 1494 (ICAEW). Gain: the merchant raises money and sells on credit; the partner invests without travelling; the customer buys before paying. Cost: the books become a second account of reality; balance proves arithmetic, not truth; error and fraud.\n3. **The year-end: period, close, statements** — a business that never stops needs a regular measure. Concepts: the period, accruals, the trial balance ([Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html)), the period close ([Order-to-Cash, Procure-to-Pay, Record-to-Report](finance-processes.html)). Gain: owners know the year's profit; lenders lend to a going business. Cost: a deadline, cut-off, estimates, the close as work.\n4. **Shareholders who were never there: standards, the auditor, the law** — strangers buy shares. Concepts: published statements under accounting standards; the external auditor and audit evidence ([Controls by Design, Not by Audit Season](controls-and-auditability.html)). Anchors: US Securities Act 1933 and Securities Exchange Act 1934 (SEC). Gain: the company raises money from thousands of strangers; the investor compares companies she never visits. Cost: new parties and deadlines; evidence must be kept; the auditor tests a sample once a year.\n5. **Many companies, one owner: entities, currencies, consolidation** — trade across borders and acquisitions. Concepts: legal entity, intercompany, functional currency and translation ([Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html), [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html)), consolidation and elimination ([OneStream: Consolidating Actuals, Planning the Future](onestream.html)). Anchor: EU Regulation 1606/2002, IFRS for listed groups' consolidated accounts from financial years starting 1 January 2005. Gain: sell and own companies in many countries; the investor sees one group. Cost: many books that must agree; both halves of each intercompany balance; rates; local rules. Pattern: The Permanent Exception.\n6. **The machine keeps the books: from punched cards to the ERP** — volume. Concepts: the accounting system, then the ERP as the accounting core and **book of record** ([Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html)); controls inside the system; ICFR and SOX ([Controls by Design, Not by Audit Season](controls-and-auditability.html)). Anchors: SAP's RF financial accounting system 1973 and R/3 1992 (SAP News); Sarbanes-Oxley Act 2002 (SEC). Gain: thousands of entries a day posted the same way; operations and books share one database; the auditor tests the system's controls rather than every entry. Cost: trust moves to configuration, access and change; customization; one system asked to do everything. Patterns: The Swiss-Army ERP, Customization Concrete, Audit Archaeology.\n7. **Meanwhile, the spreadsheet** — the system changes slowly; the accountant needs an answer today. Concept: end-user computing and information produced by the entity ([Controls by Design, Not by Audit Season](controls-and-auditability.html), [Technical Debt on the Balance Sheet](technical-debt-and-fitness.html)). Anchor: VisiCalc, 1979 (Computer History Museum). Gain: any accountant builds a mapping or a reconciliation in an hour. Cost: logic no one else can see or test. Pattern: Spreadsheet Glue.\n8. **Systems around the ledger** — online selling, cards and payment providers, volume, specialist work. Concepts: subledger and summarized posting ([Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html), [Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html)); PSP settlement and the clearing account ([Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html), [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html)); satellite platforms ([Around the Core: Where Specialist Platforms Earn Their Place](satellite-platforms.html)); interfaces and control totals ([Files, Events and APIs: How Finance Systems Talk](integration-architecture.html)); reconciliation between systems ([Reconciled by Design: Traceability and Audit Across Boundaries](traceability-and-reconciliation.html)). Common practice, no date. Gain: customers pay by card anywhere; each specialist job done by a platform built for it; the ledger stays readable. Cost: each system keeps its own copy and its own timing. Patterns: The Shadow Ledger, The Suspense Swamp, Lost in Aggregation, Point-to-Point Spaghetti.\n9. **Today** — cloud ERP and SaaS platforms on the vendor's release schedule; groups with several ERPs after acquisitions ([Converge or Coexist: Living with More Than One ERP](multiple-erps.html), [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html)); tax authorities that want invoices as data (ViDA in force 14 April 2025, European Commission); continuous accounting and controls by design ([BlackLine: Matching, Certifying and Closing](blackline.html), [Controls by Design, Not by Audit Season](controls-and-auditability.html)); bots and AI agents ([Automate the Work, Not the Accountability](ai-in-finance.html)). Northmere's €600 Lisbon booking as today's case (fictional; facts from the scenario ledger). Patterns: The Doppelgänger Record, Capability Creep, Big-Bang Bravado, The Borrowed Roadmap, Nobody's Bot.\n\n**Conclusion:** the tally (synthesis), the anchor timeline (how old each step is; undated steps are common practice), the count of what stands behind the €600 that did not stand behind the cash box (callback), the claim that the complexity is the price of trust at a distance, not a mistake (so-what), the expectation to carry forward (takeaway), and the hand-off to [Unreconciled: Fourteen Ways Finance Architecture Goes Wrong](where-finance-architecture-goes-wrong.html). [Built to Be Replaced: Evolving the Finance Estate Over a Decade](long-term-evolution.html) is linked for what comes next, not retold.\n\n## Non-goals\n\n- A history of accounting, auditing or the software industry; companies, founders and deals beyond the few anchors.\n- Re-teaching what the chapters own (journal-entry mechanics, ICFR testing, consolidation steps, payment lifecycle): one plain sentence and a link.\n- The future of the estate ([Built to Be Replaced: Evolving the Finance Estate Over a Decade](long-term-evolution.html) owns stressors and the decade ahead).\n- The failure patterns themselves ([Unreconciled: Fourteen Ways Finance Architecture Goes Wrong](where-finance-architecture-goes-wrong.html)) and Northmere's full description ([Meet Northmere: Five Brands, One Set of Books](meet-northmere.html)).\n- Any ranking or recommendation of vendors; product names appear only as dated anchors and as Northmere's systems at the last step.\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\nArticle only.\n\n## Open questions\n\n- None blocking. The author may wish to add a dated anchor for the first payment providers or close tools; none was added because the step is common practice and the book's own chapters already date the vendors.\n\n## Decision log\n\n- **2026-11-18** — Written with the `field-evolution` skill, modeled on the sibling books' pages (payments, commerce, listings). The book has no outcome specs (no `journal-spec.json`, every page has `spec.md`), so this spec follows the book's `spec.md` format and records thesis, role and transition here.\n- **2026-11-18** — Running question chosen as \"can someone who was not there trust these numbers, and how would they find out?\" because it ties the field's standing concerns (a record someone else must trust, error and fraud, who checks) to the book's organizing idea, reconciliation.\n- **2026-11-18** — Sarbanes-Oxley placed in the machine step, not the auditor step, because its concept for this book is control inside systems; the date order is kept honest with \"by then\".\n- **2026-11-18** — The spreadsheet is its own step (\"meanwhile\") although it predates R/3, because it answers a different need (speed of change) and introduces its own pattern.\n- **2026-11-18** — Rejected an early-business-computer anchor (LEO I, 1951): reputable sources disagree on the date of its first routine job.\n\n## Sources\n\n- **Internal**\n  - `PLAN.md`, `_research/style-guide.md`, `_research/scenario-ledger.md` — owners of terms, pattern names, Northmere facts.\n  - [Introduction: Architecture Where Every Number Must Reconcile](introduction.html), [Unreconciled: Fourteen Ways Finance Architecture Goes Wrong](where-finance-architecture-goes-wrong.html), [Meet Northmere: Five Brands, One Set of Books](meet-northmere.html), [Built to Be Replaced: Evolving the Finance Estate Over a Decade](long-term-evolution.html), [Glossary](glossary.html) and Part I chapters.\n- **External** (all read on 18 November 2026; listed in the article's Sources and Evidence)\n  - ICAEW Library, *Summa de arithmetica* — Venice, 1494; double-entry bookkeeping section.\n  - U.S. SEC, \"About the Securities Laws\" — 1933, 1934 and 2002 acts.\n  - EUR-Lex, Regulation (EC) No 1606/2002, Article 4 — IFRS from 2005.\n  - SAP News Center, \"The End of an Era: Hasso Plattner Steps Down\" (2024) — 1972 founding, RF in 1973, R/3 in September 1992.\n  - Computer History Museum, \"Software: Putting PCs to Work\" — VisiCalc, 1979.\n  - European Commission, \"VAT in the Digital Age\" — in force 14 April 2025; digital reporting from 1 July 2030.\n\n## Changelog\n\n- **2026-11-18** — Initial spec and article, at the author's request (\"add history page in finance-systems-architecture\"); status `accepted` under the author's delegation for these pages. *(AI-mediated session)*\n- **2026-11-18** — Independent verification (record in `_research/verification/how-finance-got-complicated.md`): 18 dated or quoted facts re-fetched, 3 wordings corrected, 1 unsourced date removed; Northmere facts and pattern names confirmed; 4,693 words. *(AI-mediated session)*\n"}]}]}</script>

                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
