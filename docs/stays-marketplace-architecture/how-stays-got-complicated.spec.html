<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: From Inn Door to Instant Book: How Stays Got This Complicated\n\n## Intent\n\nGive a reader who knows nothing about travel accommodation the order in which the book's concepts entered the world, so that the sixteen failure patterns on the next page read as natural consequences rather than as a list of mistakes. The page walks, in plain language and nine steps, from a traveller knocking at an inn door at dusk to today's hotel and home marketplaces. Each step names one need, the concept that answered it (in plain words first, then the book's term with a link to the chapter that owns it), what it made possible for **both** the guest and the innkeeper, host or hotel, and what it cost. It is an explanation of today's complexity told in the order it accumulated, not a history of the industry; [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html) tells that history with its companies and deals.\n\n**Thesis (disputable):** stays platforms are complex not because anyone designed them badly, but because **each way of selling a night was a good bargain that let a guest book a room she could not see, and let a hotel or host fill a night that would otherwise perish, at the price of one more copy of the room book and one more party standing behind the promise; none was ever retired**, so one night today is promised from many copies by many parties, and fails wherever a copy learns the truth late or a party stands behind less than the guest believes.\n\n**Running question, answered at every step:** *is the room really free for these nights, and who stands behind the promise?*\n\n**Role in the Preface:** after [Introduction: Architecture for a Perishable Promise](introduction.html) (which states the perishable promise and opens with a family at a reception desk with no booking) and before [Overbooked: Sixteen Ways Stay Platforms Go Wrong](where-stay-platforms-go-wrong.html) (which names the patterns). The page supplies the \"why\" the patterns page assumes.\n\n**Transition in:** the introduction's hand-off now points here: before the patterns, see how one night came to be promised by so many parties.\n\nProductscape domains covered: none as a product brick; the page is a preface that orders concepts across both models (TAM and HSM).\n\n## Audience\n\nThe book's readers (architects and engineering leaders of OTAs, hosted-stays marketplaces, channel managers and PMS vendors), and anyone new to the field they hand the book to. The page assumes no travel vocabulary; every term is introduced in plain words before it is named.\n\n## Success criteria\n\nReader outcomes (each is a probe a reader can be asked after reading):\n\n- [ ] Given a concept from a later chapter (reservation, no-show, room type, rate plan, GDS, channel manager, agency or merchant model, metasearch, rate parity, listing, iCal sync, facilitated payments, STR registration), the reader says which step introduced it and what limit of the step before it answered.\n- [ ] Given a failure-pattern name, the reader says which step makes it possible and why (the tally's last column uses the sixteen names exactly).\n- [ ] The reader can retell the walk in one sentence per step, and can say what each step made possible for the guest and for the hotel or host before saying what it cost.\n- [ ] The reader can answer the running question for the inn door and for the Seville double booking, and explain why the answer grew.\n- [ ] The reader can tell the illustrations (the inn, the letter, the agent's booking, the central office scene) from the dated anchors, and knows the account is simplified.\n\nShape and evidence:\n\n- [ ] IN THIS SECTION callout and exactly three KEY POINTS naming concrete things (the inn door, the innkeeper's book, the letter, the agent, the website, the host's calendar), no \"layers\" abstraction; a lead that declares the simplification and links [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html) for the history.\n- [ ] Nine steps, each in the order: where things stood, what stopped working, what was added and its name (plain words first, one new term per paragraph at most), what it made possible for both sides, what it cost, and the running question answered.\n- [ ] A tally table `Step | What it made possible | What it added | New party or delay | What can now go wrong`, and an anchor timeline `Year | What its source dates to that year | Step` holding only dates the steps already give, with a sentence on why the undated steps are absent.\n- [ ] Every dated or quoted fact fetched from a primary or reputable source (company history pages and filings, official legal texts, an IETF RFC), at most about a dozen; no \"first ever\" claims in the page's own voice; no motives attributed; Corvane appears only in the last step.\n- [ ] Ten figures: one overview of accumulation and one scene per step, the same traveller and host recurring, no brand names, real company names or logos in any image.\n- [ ] 3,000–4,700 words before Sources and Evidence.\n\n## Steps (the contract for the body)\n\n| # | Step | Need | Concept (owning chapter) | Gain: guest / hotel or host | Cost | Failure patterns named |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | The inn door at dusk | A bed tonight, far from home | The night as perishable stock; the room as the unit sold ([Introduction: Architecture for a Perishable Promise](introduction.html), [Hotels and Homes: Modeling What Is Being Sold](property-and-listing-model.html)) | A bed tonight / a room filled that would earn nothing | The inn may be full; the innkeeper takes a stranger in, so payment before the key | — (plain words) |\n| 2 | The letter ahead | Certainty before setting out; knowing who comes | Reservation in the book of rooms, inventory per night, no-show, deposit and cancellation terms ([The Life of a Reservation: State Machines, Delivery and Operations](reservation-lifecycle.html), [Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html), [When Plans Change: Modifications, Cancellations and Policies](changes-and-cancellations.html)) | Sets off knowing there is a bed / fills nights weeks ahead | A room held for nobody; a promise about a room the guest cannot see; two letters for the last room | — (plain words) |\n| 3 | The guidebook and the travel agent | Choosing an inn in a town never seen; inns wanting distant guests | Someone vouches (content, [Describing a Stay: Content, Media and Property Mapping](content-and-media.html)); an intermediary sells someone else's room for a commission ([Who Takes the Money? Merchant, Agency and Facilitator Models](merchant-and-agency-models.html)) | Chooses with someone's word / guests from cities it never advertised in | A third party; a flattering or stale description; a commission; the agent's booking must reach the inn's book | — (plain words) |\n| 4 | The chain and the central reservation office | Booking any hotel of a chain from anywhere, with an answer now | Central reservation system; room types; rate codes (rate plans); deliberate overbooking and the walk ([Plugging Into the Hotel Stack: Connectivity, Channel Managers and Standards](connectivity-and-channel-managers.html), [Hotels and Homes: Modeling What Is Being Sold](property-and-listing-model.html), [Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html), [Never Sell the Same Night Twice: Overbooking, Allotments and Concurrency](inventory-integrity.html)) | Instant answer from one number / rooms filled across cities | Two copies of the count; codes multiply; a walked guest | Rate Plan Sprawl |\n| 5 | Airline systems and the switch | Travel agents everywhere already booking on airline screens | Global distribution system; the switch; look-to-book ([Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html), [Liquidity, Take Rates and Look-to-Book: The Economics of Stays Marketplaces](stays-marketplace-economics.html)) | Hotel and flight from one screen / a worldwide sales force | The same hotel in many systems; a booking acknowledged by an intermediary, not the hotel; load in proportion to shopping | The Same Hotel Twice, Lost at the Front Desk |\n| 6 | The online travel agency | Booking alone, at home, at any hour, with photos and an instant confirmation | OTA; agency and merchant models; channel manager and ARI updates ([Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html), [Who Takes the Money? Merchant, Agency and Facilitator Models](merchant-and-agency-models.html), [Plugging Into the Hotel Stack: Connectivity, Channel Managers and Standards](connectivity-and-channel-managers.html)) | Compares and books in minutes / a small hotel reaches the world without a sales office | Promises from a copy; one mapping per channel; someone else holds the money; cancellation rules copied into many systems | Phantom Availability, Connectivity Roulette, Ledgerless Money, Policy Spaghetti |\n| 7 | Comparing everyone | Too many sites and hotels to check | Guest reviews; metasearch; ranking; rate parity ([Trustworthy Reviews: Collection, Integrity and Quality Operations](reviews-and-reputation.html), [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html), [Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html), [Deals, Members and Programs: Promotions and Loyalty](promotions-and-loyalty.html)) | Every seller's price and other guests' word in one place / a good small hotel found on merit | The price shown is a copy; fees added later; the order can be bought; parity rules and then law | Price Drift, Pay-to-Rank Creep |\n| 8 | Homes as stays | A whole flat, a room with a local; owners with a spare room | Listing and host, one calendar; payment held until check-in and paid out; two-way reviews; instant book and request to book; iCal sync; damage protection ([Hotels and Homes: Modeling What Is Being Sold](property-and-listing-model.html), [Who Takes the Money? Merchant, Agency and Facilitator Models](merchant-and-agency-models.html), [Trustworthy Reviews: Collection, Integrity and Quality Operations](reviews-and-reputation.html), [Turning an Offer Into a Booking: Checkout Orchestration](checkout-orchestration.html), [One Home, Many Calendars: iCal, APIs and Multichannel Hosts](calendar-sync.html), [Damage, Parties and Emergencies: Protection and Incident Response](protection-and-incidents.html)) | A kitchen and a neighborhood / one flat let safely to strangers and paid | One unit with no spare room; calendars that agree only after a poll; trust built incident by incident | The Double-Booked Night, Trust After the Incident |\n| 9 | Today: every step at once | All of the above, on a phone, under law | Prices that change daily; each type selling the other's supply; tourist taxes; STR registration; models ([Setting the Price of a Night: Revenue Management and Smart Pricing](dynamic-pricing.html), [One Platform or Two? Converging Hotels and Homes](converging-two-marketplaces.html), [The Tax Patchwork: VAT, Tourist Taxes and Platform Reporting](taxes-on-stays.html), [Rules of the Stay: Short-Term Rental Regulation, DSA and Consumer Law](stays-regulation.html), [Models in Production: ML Platforms and Use Cases for Stays](stays-ml-platform.html)); Corvane's King's Day and Seville cases ([Meet Corvane: Two Marketplaces, One Group](meet-corvane.html)) | Any night, anywhere, in seconds / any room or home sold on every channel | More copies, more parties, regulators, shocks | The Hotel-Shaped Home, The Tax Patchwork, City-by-City Firefighting, Built for Sunny Days, The Unwatched Model |\n\n**Conclusion:** the tally table; the anchor timeline; a count of what stands behind the Bauers' Feria night that did not stand behind the knock at the inn door; the synthesis (every step moved the promise further from the room and put more copies and more parties behind it; the complexity is the price of all that trade, not a mistake); hand-off to [Overbooked: Sixteen Ways Stay Platforms Go Wrong](where-stay-platforms-go-wrong.html).\n\n## Non-goals\n\n- The industry's history, companies, deals and waves — [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html) (this page links there and reuses its dates, never contradicting them).\n- The failure patterns in depth — [Overbooked: Sixteen Ways Stay Platforms Go Wrong](where-stay-platforms-go-wrong.html); Corvane in full — [Meet Corvane: Two Marketplaces, One Group](meet-corvane.html).\n- Any concept's mechanics: each step names a concept and links its owning chapter.\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html) dates AirBed & Breakfast's launch to 11 August 2008 (from a secondary source); Airbnb's own newsroom dates its first guests to October 2007 and its official launch to March 2008. This page uses only the company's \"born in 2007\" sentence; the chapter's date needs the author's decision.\n- [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html) places Bookings.nl's founding in Enschede; Booking.com's own page says \"Founded in 1996 in Amsterdam\". This page gives only the year.\n- Vacation Rentals by Owner's 1995 founding could not be read on a primary page (the company's site refused automated fetches); the page uses HomeAway's 2011 prospectus instead.\n\n## Decision log\n\n- **2026-11-18** — Modeled on the sibling pages `how-payments-got-complicated`, `how-commerce-got-complicated` and `how-classifieds-got-complicated` (field-evolution skill): nine steps, gain before cost, tally and anchor timeline, ten figures. Written as `spec.md`, because BOOKED has no outcome specs.\n- **2026-11-18** — The lead reuses the introduction's family at the reception desk (generic, not Corvane), so the inn door and the missing booking frame the same question; Corvane enters only at step 9, through two canonical ledger cases (King's Day for hotels, Seville for homes).\n- **2026-11-18** — Overbooking placed at the chain step rather than the letter step, so that step 2 carries only the reservation, the book, the no-show and the deposit, and overbooking arrives where a hotel has enough rooms and records to plan it.\n- **2026-11-18** — Flow rubric by a fresh reader: order sound with fixes; applied \"meanwhile\" and \"from the mid-1990s\" markers at steps 6 and 8 so overlapping steps imply no false chronology; kept reviews in step 7 and damage protection as one clause in step 8 to hold the step count at nine.\n- **2026-11-18** — Pattern names begin at step 4, the first computer; steps 1–3 name their failures in plain words.\n\n## Sources\n\n- **Internal**\n  - `.claude/skills/field-evolution/SKILL.md`; `PLAN.md`; `_research/style-guide.md`; `_research/scenario-ledger.md` (recurring examples 2 and 3 and the King's Day reconstruction).\n  - [Two Marketplaces for a Night's Stay: OTAs, Hosted Stays and How They Grew](two-stay-marketplaces.html) (the six waves), [Introduction: Architecture for a Perishable Promise](introduction.html), [Overbooked: Sixteen Ways Stay Platforms Go Wrong](where-stay-platforms-go-wrong.html), [Glossary: The Language of Stays Marketplaces](glossary.html) (owning chapters).\n- **External**\n  - IHG history page (Holidex 1965, 1977); MICHELIN Guide history article (1900); Booking.com \"About\" (1996); Expedia Group \"About us\" (1996); trivago Form 20-F for 2016 (incorporated 2005); HomeAway Form S-1 (2011); Airbnb newsroom \"About us\" (2007); RFC 5545 (2009); Expedia Group and Airbnb Forms 10-K for fiscal 2025; Regulation (EU) 2022/1925 Article 5(3) and the Commission's gatekeeper page (13 May 2024); Airbnb, \"A message from co-founder and CEO Brian Chesky\" (5 May 2020); Regulation (EU) 2024/1028 (applies from 20 May 2026).\n\n## Changelog\n\n- **2026-11-18** — Initial spec (field-evolution skill). *(AI-mediated session)*\n- **2026-11-18** — Spec accepted (acceptance delegated by the author for these pages); article written; ten figures generated and inspected (compare figure regenerated once for a garbled sign and dollar coins, today figure twice for stray labels and a dollar coin); icon and hero image (hero regenerated once, first attempt was a text-heavy infographic). *(AI-mediated session)*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
