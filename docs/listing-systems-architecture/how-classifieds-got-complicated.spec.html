<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The steps by which advertising a thing for sale moved from a sign on the thing itself to today's listing platform, and the concept each step introduced: the listing as a promise about a thing the reader cannot see; freshness and the race to reach the seller first; the contact; the publisher's rules, its price per line and its categories; the specialist title for one kind of goods, with professional sellers and the same few questions asked of every ad; the free listing the seller publishes alone; search, filters and an order of results that the site decides and can sell; the feed sent by a dealer's or agent's software; the saved search and the alert on a phone, and the message inside the platform; payment, checks on who people are and rules set by law; and groups of marketplaces that share one platform.\n- **Know:** For each step, both sides of it: what it made possible that could not happen before (a buyer who never walks past the house, a buyer in the next town, a buyer comparing every car in the region, a seller who pays nothing, a buyer who finds one item among millions, a dealer who lists two hundred cars without typing, a buyer who hears of a new ad within minutes, a buyer who can pay a stranger in another city), and what it cost (one more copy of the ad that has to be kept true, one more party, one more delay or one more stranger to trust).\n- **Believe:** Each step was a good bargain for seller and buyer alike, and no step was ever removed, so today's complexity is the sum of those bargains, not a design mistake.\n- **Believe:** Given those steps, the failure patterns of the next page are what one should expect, not signs of careless engineering.\n- **Be able to:** Given a term from a later chapter (listing, contact, category, insertion fee, attribute, moderation, ranking, paid visibility, feed, saved search, alert, buyer protection), say which step of the walk introduced it and what limit it answered.\n- **Be able to:** Given a failure pattern's name, say which step makes it possible.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader new to classifieds can say, for a concept the page introduces, which step brought it in and what limit of the earlier way of advertising it answered. *Probe:* Using only this page: why is a newspaper ad already out of date on the morning it appears, and which earlier way of advertising did not have that problem? | `custom` | cold_reader | major |\n| AC-2 | A reader can connect a failure pattern to the step that makes it possible. *Probe:* Using only this page: a bike sold on Monday still appears in an alert on Tuesday morning. Which steps made that possible, and which named pattern is it? | `custom` | cold_reader | major |\n| AC-3 | Every dated fact on the page has a source the style guide accepts, the page says once that it is a simplified account that follows the ideas, generalizations about how people used classifieds are marked as common practice or illustration, and it attributes no motives to companies. | `custom` | rubric | blocker |\n| AC-4 | Every term is given in plain words before it is named, and no step uses a concept a later step introduces. | `known_before_new` | rubric | major |\n| AC-5 | A reader can say, for a step of the walk, what it made possible for the seller and for the buyer as well as what it cost. *Probe:* Using only this page: when a dealer's software sends its whole stock to a portal every night, who gains what, and who risks what? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** How did selling a second-hand thing to a stranger, once done with a sign on the thing itself, come to need so many systems, copies of the ad and checks on the people at either end?\n\n> **Claim:** Classifieds became complicated one good bargain at a time: each new way of advertising (the card in a shop window, the newspaper column, the specialist magazine, the free website, search and a sold order of results, the dealer's feed, the alert on a phone, payment and checks on the platform) let a seller reach buyers who could not see the thing and let a buyer reach it sooner, and paid for it with one more copy of the ad that had to be kept true and one more stranger to trust; none was retired, so a listing today must be true at once in every copy, for buyers and sellers either of whom may be lying.\n\n**Disputed by:** The view that a classifieds site is a simple thing (a table of ads and a search box) made complicated by old code, acquisitions or over-engineering, so that a clean rebuild would make it simple again.\n\n**So what:** A reader who sees each step as a bargain that both sides wanted stops looking for the rebuild that removes the copies and the checks, expects a failure wherever one copy of an ad learns the truth later than another or a stranger can act before anyone checks, and reads the fifteen patterns of the next page as the price of what the steps made possible.\n\n**How and why:** A sign on the thing is true as long as the thing is there, and only passers-by can read it. Every later step lets more buyers find more things (the neighbour, the town that reads the paper, the region that buys the car magazine, anyone online, anyone searching, anyone with an alert on a phone) by moving the ad further from the thing, so the ad becomes a promise that can stop being true before its readers know. Each step added a copy (the card, the printed column, the page, the search index, the feed, the alert) that learns of a sale at its own time, and a reader or a seller the other side has never met; the race to call first, which began at the phone box, is still the race the platform has to make fair and safe. The dates on the page are a small set of sourced anchors, and the account is a simplification that follows the ideas.\n\n**Supporting claims**\n\n- **S1** — A sign on the thing cannot outlive the sale and needs no trust in a description; the first step away from it, a card in a shop window, already has what every later system has: a listing that promises something the reader cannot see, a copy that can outlive the sale, someone who decides which ads may be shown, and strangers on both sides who may be lying.\n- **S2** — Each later way of advertising (the newspaper column, the specialist magazine, the website, search and a sold order, the feed, the alert on a phone) made a sale possible that could not happen before, to the gain of seller and buyer alike, by moving the ad further from the thing or bringing the buyer to it sooner.\n- **S3** — Each addition brought its own way to go wrong: a new copy of the ad that learns of a sale late, a new party whose rules or systems the seller depends on, or a new stranger who can act before anyone checks.\n- **S4** — No step was ever removed, so a listing today lives in all of them at once, with payment, identity checks, law, group platforms and models on top, and the failures the next page names are the price of what the steps made possible.\n\n## Role in the part\n\nExplains, before the failure patterns are named, where the copies of an ad, the race to be first and the strangers on both sides came from, what each step made possible and what it cost, and introduces in plain words the vocabulary Part I and later parts then teach properly. Supports PF-2 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in sign to today: the steps are in the order the ideas accumulated, which is roughly the order of the dates; the sign, the card and the column are undated common practice and come first because the later steps build on them; `problem_solution` in inside each step: the limit, the addition and its name, what it made possible, what it cost, the answer to the running question)\n\nEach step uses only concepts that earlier steps introduced: the listing as a promise apart from the thing before the column that prints it for a town; the column's categories, price per line and race to call before the magazine that adds photos, attributes and professional sellers; the self-published listing and its lifecycle before search, which needs the magazine's attributes as data and copies the listings into an index; the index and the order of results before the feed, whose removals have to reach that index; and the contact, the index and the copy before the alert, which is a copy that races to a buyer. Payment, identity checks and group platforms come last because each rests on the messaging and the scale that the earlier steps created. The magazine comes before the website even though both coexisted for decades, because attributes and professional sellers are needed to explain search and feeds; the page says 'by then' where the dates overlap.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): On a Saturday morning, an illustration of common practice, a reader buys the local paper as early as she can, rings a cheap bike in the small ads and runs to a telephone box with coins; if the line is busy, someone else got there first, and the ad keeps offering the sold bike to the town until the next edition. In 2027 the book's fictional Rotterdam bike gets its first message thirteen minutes after it is listed and is still offered in 214 alert e-mails the morning after it was sold.\n\n**Bridge:** Everyone has seen a card in a shop window, small ads in a paper and an alert on a phone. → The phone box and the push alert are the same race run by different machinery; between and before them lie other ways of advertising, each of which let someone buy or sell who could not before.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 and 2, in concrete words: the card, the column, the magazine, the website, the alert) and paragraph p02): Classifieds became complicated one good bargain at a time: each new way of advertising (the card in a shop window, the newspaper column, the specialist magazine, the free website, search and a sold order of results, the dealer's feed, the alert on a phone, payment and checks on the platform) let a seller reach buyers who could not see the thing and let a buyer reach it sooner, and paid for it with one more copy of the ad that had to be kept true and one more stranger to trust; none was retired, so a listing today must be true at once in every copy, for buyers and sellers either of whom may be lying.\n\n**Roadmap** (Paragraph p03, with the IN THIS SECTION and KEY POINTS callouts):\n\n- The walk starts at a sign on the thing itself and its first complication, a card in a shop window. *Kept in:* sign, card.\n- It continues through the newspaper column and the specialist magazine. *Kept in:* newspaper, magazine.\n- Then the classifieds website, search and the order of results, the dealer's feed and the phone in the pocket. *Kept in:* website, search, feeds, phone.\n- It ends on today's platform, shown in the book's fictional case, with one question answered at every step: is what the ad says still true, and who finds out first? *Kept in:* today.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A reader racing from the morning paper to a telephone box to call about a bike, and the fictional Rotterdam bike that gets its first message thirteen minutes after listing and is still in 214 alert e-mails after its sale, are the same race. | scenario: The phone-box morning (illustration of common practice) and the Rotterdam bike (scenario ledger; fictional). |  |\n| p02 | claim | Between and before them lie seven other ways of advertising, each a bargain that reached buyers who could not see the thing at the price of a copy and a stranger, none retired; the account is simplified, follows the ideas, and leaves the industry's real history to industry-evolution. |  | `cause_effect`: The phone box and the push alert. → The claim that explains them, the declared simplification and the link to chapter 3. |\n| p03 | transition | The page takes nine steps, tells each as a limit, an addition with its name, a gain for both sides and a cost, and answers one question at each: is what the ad says still true, and who finds out first? | figure: Figure: one bike with its sign at the bottom and a band for each later step, up to a phone with an alert. | `sequence`: The claim and the simplification. → The route, the shape of each step and the question. |\n\n## Sections\n\n### The Sign on the Thing: The Ad Cannot Outlive the Sale\n\n**Controlling idea** (`example`, id `sign`): A sign taped to the thing itself is the simplest ad: the ad, the thing and the seller are in one place, so the ad cannot outlive the sale, but only passers-by can read it.\n\n**Advances the thesis** (S1): Sets the baseline in which the ad cannot go stale and needs no trust in a description, and names the three conditions whose failure starts every later step.\n\n**Transition in:** `sequence`: The route and the question announced in the introduction. → The first step: the simplest way to advertise a thing for sale, as the baseline.\n\n**Order of paragraphs** (`small_to_large`): The sign is the baseline, so it has no limit to answer: one sale comes first, then why its ad cannot go stale, then the three conditions that fail in every later step, then the first answer to the running question.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | A bike leaning on a garden fence with a price on a card taped to it is sold to a passer-by who sees it, tries it, knocks and pays. | scenario: An illustration of common practice: a bike by a garden gate with a for-sale card; a passer-by tries it and pays. |  |\n| p05 | explanation | The ad and the thing are in one place: the buyer sees what she buys, the seller is at the door, and when the bike is sold the sign goes with it. |  | `cause_effect`: A sale where the sign is on the thing. → Why that ad cannot go stale and needs no trust in a description. |\n| p06 | analysis | It is that simple only under three conditions (the buyer walks past, the thing is where the sign is, the seller is next to it), and each later step begins where one of them did not hold. | figure: Figure: the bike on the fence with its sign, a passer-by, the seller at the door. | `contrast`: An ad that cannot outlive the sale. → The three conditions that make it possible, and the announcement that later steps start where they fail. |\n| p07 | synthesis | The sign is true as long as it hangs on the thing, and whoever walks past finds out first. |  | `conclusion_summary`: The sign on the thing and its three conditions. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### The Card in the Shop Window: An Ad Away From the Thing\n\n**Controlling idea** (`example`, id `card`): Moving the ad off the thing, onto a card in a shop window, already creates what every later system has: a listing that is a promise about a thing the reader cannot see, a copy that can outlive the sale, someone who decides which ads may be shown, and strangers on both sides who may be lying.\n\n**Advances the thesis** (S1): Shows that the first ad apart from the thing, with no technology at all, already needs trust, rules and a way to take the ad down.\n\n**Transition in:** `contrast`: The sign reaches only those who walk past. → The oldest way around that: the same words on a card where many people look.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A seller pays a corner shop to put a card in its window; the card describes a thing the reader cannot see, at an address nearby, and the book calls such a public, time-bound offer about a thing a listing, a promise that the thing exists, is as described and is still for sale. | scenario: Illustration of common practice: a card for a pram in a shop window among a dozen others. |  |\n| p09 | explanation | The seller reaches everyone who uses the shop, and the buyer sees a dozen offers in one place. |  | `cause_effect`: A listing in a shop window. → What it made possible for each side. |\n| p10 | cause_effect | The card can stay up after the sale, can describe the thing better than it is, and brings a stranger to the seller's door, so the shopkeeper starts to decide which cards go up and turns away those that look like trouble: the plainest form of a marketplace's rules and of moderation, and of the trust each side needs in the other. | figure: Figure: a card still in the window while the pram is wheeled away elsewhere; the shopkeeper sorts cards. | `contrast`: What the card made possible. → What it cost: staleness, a description that can lie, strangers on both sides, rules and moderation. |\n| p11 | synthesis | The card is true until the sale and stays up for days after; whoever reads it first and knocks finds out, the rest at the door. |  | `conclusion_summary`: The card's gain and its cost. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### The Newspaper Column: The Race to the Phone Box\n\n**Controlling idea** (`analysis`, id `newspaper`): The newspaper's classified columns reach a whole town each morning, under the publisher's rules, categories and price per line, and start the race to reach the seller first, in which the printed ad is out of date the moment the first caller gets through.\n\n**Advances the thesis** (S2, S3): Introduces the publisher, categories, the insertion fee, the network effect, the contact and freshness in the scene a newcomer can picture.\n\n**Transition in:** `cause_effect`: A card reaches one street. → A paper that reaches a whole town every morning.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Newspapers commonly sold small ads grouped under headings in narrow columns; a business whose job ends when a reader contacts the seller is what the book calls classifieds, and the headings are categories, chosen by the paper with the order of ads under them. |  | `cause_effect`: A card reaches one street. → The newspaper column, classifieds and categories. |\n| p13 | explanation | The paper is a publisher that sets the rules and charges by the line or by the word; a charge to publish an ad is what the book calls an insertion fee. |  | `elaboration`: Classifieds and categories. → Who runs the column and how it is paid for. |\n| p14 | explanation | The seller reaches a whole town in a day, the buyer sees every offer in the town over breakfast, and the paper with the most ads draws the most readers, which draws more ads: a network effect. |  | `cause_effect`: The column, its rules and its price. → What it made possible for each side, and why one paper wins a town. |\n| p15 | example | Because the best offers go fast, a buyer commonly gets the paper as early as possible, rings an ad and runs to a telephone box with coins to call the seller before anyone else; the call is the contact, and how fast it comes is what the book measures as time to first contact. | scenario: Illustration of common practice: a buyer with an early paper, a ringed ad and coins, at a telephone box.; figure: Figure: a buyer with an open newspaper in a telephone box, coins on the shelf, a ringed ad. | `elaboration`: Every offer in the town on one page. → The race those offers start: the paper, the ringed ad and the phone box. |\n| p16 | cause_effect | The printed ad is out of date the moment the first caller gets through, yet runs until the next edition; how fast a sold thing disappears from where buyers see it is freshness, and the race is unfair to the late reader while caller and seller, strangers at a distance, can each deceive the other. |  | `contrast`: The race to call first. → What the column cost: an ad that cannot be taken back, freshness, and deception at a distance. |\n| p17 | synthesis | The ad is true until the first call gets through but printed as true until the next edition; the reader who got the paper first and reached a phone first finds out first, the rest from an engaged tone. |  | `conclusion_summary`: The race and the stale ad. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### The Specialist Magazine: Photos, Dealers and the Same Few Questions\n\n**Controlling idea** (`analysis`, id `magazine`): A magazine for one kind of goods, such as cars, gathers a region's ads with photos and the same few facts for each, mostly from dealers and agents, so buyers can compare, at the price of ads printed days before they are read and photos that may not show the thing.\n\n**Advances the thesis** (S2, S3): Introduces the vertical, the professional seller, attributes and the photo as the first media.\n\n**Transition in:** `cause_effect`: A line of text in a town paper. → What a buyer of a car needs before she calls: a photo and the same facts for every car.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | context | Specialist titles for one kind of goods gathered a region's ads, commonly with a photo each; Auto Trader's own history dates Thames Valley Trader to 1977, and a marketplace for one kind of goods is what the book calls a vertical. | fact: Auto Trader Group plc, Our history: in 1977 John Madejski 'launched a small regional classified advertising magazine called Thames Valley Trader'; renamed Auto Trader in 1988. | `cause_effect`: A line of text in a town paper. → The specialist magazine and the vertical. |\n| p19 | definition | Every ad answers the same questions (make, model, year, mileage, price), which the book calls attributes, the photo is the first media, and most ads come from professional sellers who advertise every week and pay for it. |  | `elaboration`: The magazine for one kind of goods. → What it added: attributes, photos and professional sellers. |\n| p20 | explanation | The buyer compares every car in the region on one page before she calls, and dealers sell a lot's worth of cars across a region. |  | `cause_effect`: Photos, attributes and dealers. → What it made possible for each side. |\n| p21 | cause_effect | A weekly deadline makes the ad days old before it is read, a photo can show another or a better car, and the same car can appear in two magazines. | figure: Figure: a buyer comparing car ads with photos in a magazine; a dealer's lot behind with an empty space. | `contrast`: What the magazine made possible. → What it cost. |\n| p22 | synthesis | The ad was true when written days before print and its photo may not be of this car; the reader in the region who gets the magazine first finds out first. |  | `conclusion_summary`: The magazine's ads, photos and dealers. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### The Classifieds Website: Free, Instant and Unchecked\n\n**Controlling idea** (`analysis`, id `website`): On a website the seller publishes the ad herself, at once and commonly for free, and can remove it at any time, which lets anyone sell to anyone at any hour, at the price of ads nobody checked first, ads nobody removes, and counts of ads that grow faster than sales.\n\n**Advances the thesis** (S2, S3): Introduces the self-published listing, its lifecycle, moderation after the fact and the difference between counting ads and counting matches.\n\n**Transition in:** `contrast`: Print waits for its deadline and charges by the line. → A page that can be changed at any time and costs almost nothing per ad.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | context | A web page can change at any time and costs almost nothing per ad; craigslist's own history dates its start to e-mailed notices in early 1995 that software later posted to a website, Auto Trader dates its first website to 1996, and eBay's 2004 announcement says Marktplaats, founded in 1999, had more than a million listings at any given time. | fact: craigslist, About: mission and history (early 1995; software that added e-mailed posts to a website).; fact: Auto Trader Group plc, Our history: the first Auto Trader website (1996).; fact: eBay Inc., press release of 10 November 2004 (SEC exhibit): Marktplaats 'Founded in 1999', 'more than one million listings at any given time'. | `contrast`: Print waits for its deadline and charges by the line. → The website, with dated anchors that claim no first. |\n| p24 | definition | The seller types the ad and it appears at once, private listings are commonly free, and the seller alone can change or remove it, so a listing has a life of its own (draft, live, sold, expired), the listing lifecycle. |  | `elaboration`: Web pages that change at any time. → What was added: self-publishing, free listings and the listing lifecycle. |\n| p25 | evidence | The seller pays nothing and reaches anyone at any hour, and the buyer sees every ad in the country without buying a paper; a study found classified-ad rates fell 20.7% at newspapers that relied on them and estimated US classified-ad buyers saved $5 billion from 2000 to 2007. | statistic: NYU Stern (13 August 2013) on Seamans and Zhu: a 20.7% drop in classified-ad rates; $5 billion saved by classified-ad buyers from 2000 to 2007. | `cause_effect`: Free, instant self-publishing. → What it made possible, with one measured gain. |\n| p26 | cause_effect | Nobody reads the ad before it appears, so checking must be rebuilt as moderation by software and people; removal is left to sellers who commonly sell elsewhere and never come back; and free listings make the count of ads and visits grow faster than sales. | figure: Figure: a seller posting from a laptop at night; the page fills with ads, some marked sold in the street but still live. | `contrast`: What the free website made possible. → What it cost. |\n| p27 | synthesis | The ad is true only if the seller comes back to say it is sold, and nobody checked it was true to begin with; the buyer who refreshes the page finds out first, and the site may never. |  | `conclusion_summary`: The free website. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### Search and Filters: The Site Decides the Order\n\n**Controlling idea** (`analysis`, id `search`): When a city has thousands of ads, the site adds a search box and filters, which need categories and attributes as data and a copy of every ad in a search index, and decides the order of results, which it can sell, at the price of a copy that learns of a sale late, a tree and fields fixed in the site, and an order buyers can no longer read.\n\n**Advances the thesis** (S2, S3): Introduces search, the search index, attributes as required data, the category tree, ranking and paid visibility.\n\n**Transition in:** `cause_effect`: Every ad in the country on one site. → Too many ads to read, and the tools that find one.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | definition | Too many ads to read leads to a search box and filters, which work only if every ad has a category from a tree and the same named fields, and which read from a copy of the ads, the search index. |  | `cause_effect`: Every ad in the country on one site. → Search, filters, the category tree and the search index. |\n| p29 | definition | The site decides the order of results (newest, nearest or most relevant), which the book calls ranking, and because the order is the site's it can sell places in it, a bump or a top slot: paid visibility. |  | `elaboration`: Search and filters. → The order of results and its sale. |\n| p30 | explanation | The buyer finds the one bike among thousands in seconds, the seller of a good bike is found by the buyer who wants exactly that, and a seller in a hurry can pay to be seen first. |  | `cause_effect`: Search, filters and an order. → What it made possible for each side. |\n| p31 | cause_effect | The index is a copy that learns of a sale late and can be mistaken for the record, the tree and fields are built into the site so a new kind of thing needs a change to it and sellers type the rest as free text, and every paid place pushes down a free one so buyers cannot tell the best result from the paid one. | figure: Figure: a buyer with filters; a results list where paid items sit above a sold item and a better one is pushed down. | `contrast`: What search and an order made possible. → What it cost. |\n| p32 | synthesis | The ad is true in its own record and in the index only as of the last update; the site's record finds out first, then the index, then the buyer. |  | `conclusion_summary`: Search and the sold order. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### Feeds: The Dealer's Software Writes the Ad\n\n**Controlling idea** (`analysis`, id `feeds`): Dealers and agents commonly let their own software send their stock to the portals as a feed, which lists every car without typing, at the price of a portal that publishes what another company's system says, when it says it.\n\n**Advances the thesis** (S2, S3): Introduces the feed and its contract, and the duplicate that arrives from several professional sellers.\n\n**Transition in:** `cause_effect`: Sellers who type their ads into a site. → A dealer with two hundred cars and four portals.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | definition | A dealer with two hundred cars cannot type each one into several portals, so the stock software commonly sends a file or a stream of changes, a feed, whose agreed content and meaning is the feed contract. |  | `cause_effect`: Sellers who type their ads into a site. → The feed and its contract. |\n| p34 | explanation | The dealer lists every car without typing and keeps every portal in step with the lot, and the buyer sees the dealer's whole stock with the same details for every car. |  | `cause_effect`: The feed. → What it made possible for each side. |\n| p35 | cause_effect | The portal now publishes what another system says when it says it: a cut-short file can remove cars still for sale, a sold car stays until the next file, and one flat sent by three agencies appears three times. | figure: Figure: dealer software sending a file to a portal; one file torn short; one flat appearing three times. | `contrast`: What the feed made possible. → What it cost. |\n| p36 | synthesis | The ad is true as of the dealer's last file; the dealer's software finds out first, then the portal, then the buyer. |  | `conclusion_summary`: The feed. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### The Phone in the Pocket: The Race Becomes a Notification\n\n**Controlling idea** (`analysis`, id `phone`): With the site in the buyer's pocket, a saved search sends an alert within minutes of a new ad and the call moves into the platform as a message, so the race to the phone box becomes a push notification, at the price of alerts built from copies and a channel where fraud closes.\n\n**Advances the thesis** (S2, S3): Introduces the saved search, the alert, in-platform messaging and the lead, and plants the fraud that closes in the conversation.\n\n**Transition in:** `cause_effect`: Buyers who must come to the site to look. → A site that comes to the buyer.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | definition | Once apps sit on phones (Apple's App Store opened on 10 July 2008), a buyer can save a search and be told when a new ad matches, a saved search and its alert, and can message the seller inside the app; for a dealer each message is a lead. | fact: Apple Newsroom, 10 July 2008: 'The App Store will be available beginning today'. | `cause_effect`: Buyers who must come to the site to look. → The saved search, the alert and the message. |\n| p38 | explanation | The buyer hears of the right bike within minutes wherever she is, and the seller gets buyers within minutes without giving her number to strangers. |  | `cause_effect`: Alerts and messages. → What they made possible for each side. |\n| p39 | cause_effect | An alert built from a copy can announce a sold bike, the race is lost in minutes, and a stranger's message arrives as fast as an honest one, so fraud closes in the conversation; UK Finance counts 175,809 purchase-scam cases and GBP 118.1 million lost in 2025, the criminal persuading the victim to pay by bank transfer instead. | statistic: UK Finance, Annual Fraud Report 2026: purchase scams 175,809 cases, GBP 118.1m in 2025; 71% of APP scam cases; 'the criminal will persuade their victim to pay via a bank transfer instead'.; figure: Figure: a buyer's phone buzzing with an alert; the seller's phone with an honest message and a fake payment link. | `contrast`: What alerts and messages made possible. → What they cost. |\n| p40 | synthesis | The ad is true as of the copy the alert was built from; the buyer whose phone buzzes first and who answers first finds out first, and that may be a fraudster. |  | `conclusion_summary`: Alerts and messages. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n### Today: Payment, Proof and One Platform for Many Marketplaces\n\n**Controlling idea** (`analysis`, id `today`): Today's platform adds payment and buyer protection, checks on who people are, rules set by law, groups that share one platform across brands and countries, and models that decide, and Veldmark's Rotterdam bike shows every step at once.\n\n**Advances the thesis** (S4, S3): Shows that the present keeps every earlier step and adds money, identity, law, group platforms and models on top, and brings in the fictional case only here.\n\n**Transition in:** `sequence`: Alerts, messages and fraud in the conversation. → What the present adds, and today's case.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of advertising comes first, then what was added and its name, then what it made possible for both sides, then what it cost, then the answer to the running question. The term cannot be named before the reader has seen the need it answers, and the cost cannot be weighed before the gain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | context | Platforms now take the payment and hold it until the item arrives (Marktplaats launched transactional services in 2017 and shipping in 2019), check who sellers are, and answer to law: the EU's Digital Services Act applies from 17 February 2024 and requires notice-and-action and checks on traders. | fact: Adevinta Annual Report 2023, p. 24: Marktplaats 'successfully launched transactional services in 2017', shipping in 2019.; fact: Regulation (EU) 2022/2065, Articles 16, 30 and 93(2). | `sequence`: Alerts, messages and fraud in the conversation. → Payment, identity checks and regulation. |\n| p42 | context | Many marketplaces belong to groups that run several brands and countries (Adevinta completed its purchase of eBay Classifieds Group on 25 June 2021, with '#1 market positions in 16 countries') and decide what to share beneath the brands, while models now decide order, holds and prices. | fact: Adevinta press release, 25 June 2021. | `elaboration`: Payment, checks and law on one site. → Groups of marketplaces and models that decide. |\n| p43 | example | Veldmark's Rotterdam bike shows all of it: listed at 19:42 on Sunday 7 March 2027, searchable at 19:48, first contact at 19:55, a fake payment link at 20:11, sold on Monday, removed from search at 18:11, and still in 214 alert e-mails at 07:00 on Tuesday. | scenario: Scenario ledger, worked example 1 (fictional). | `example`: What the present adds. → Today's case, from the book's fictional group. |\n| p44 | explanation | The buyer can pay a stranger in another city and get the money back if nothing comes, the seller sells to a whole country without meeting anyone, and a group builds a capability once for many brands. |  | `cause_effect`: Today's platform and the bike. → What it made possible. |\n| p45 | cause_effect | The platform now holds money and risk, must know who people are and answer regulators, runs several copies of everything after deals or forces one platform where it does not fit, checks what sellers paid for in many places, and lets models decide that nobody watches. | figure: Figure: the bike at the bottom and a phone at the top, with every earlier way of advertising between them and one alert e-mail still showing the sold bike. | `contrast`: What today's platform made possible. → What it cost. |\n| p46 | synthesis | The ad is true in one record and late in a dozen copies; the record that holds the sale finds out first, and an alert e-mail thirteen hours later finds out last. |  | `conclusion_summary`: Today's platform and the bike. → The step's answer to the running question: is what the ad says still true, and who finds out first? |\n\n## Conclusion: What the Steps Add Up To\n\n**Synthesis:** Read together, the steps show one movement no single step shows: each moved the ad further from the thing and put more strangers between seller and buyer, and the answer to 'is it still true, and who finds out first?' grew from 'yes, whoever walks past' to one record and a dozen copies that learn at different times.\n\n**So what:** The steps answer limits that still exist and each bought trade both sides wanted, so no rebuild removes the copies and the checks; a builder should expect a failure wherever one copy learns the truth later than another or a stranger can act before anyone checks.\n\n**Callback:** The phone box and the Rotterdam bike. The race to call first is still there: thirteen minutes from listing to first message, and an alert e-mail thirteen hours after the sale.\n\n**Takeaway** (`broader_implications`): The failure patterns of the next page are the price of what these steps made possible, not signs of careless engineering.\n\n**Hand-off** to [Unlisted: Fifteen Ways Listing Systems Go Wrong](where-listing-systems-go-wrong.html): `cause_effect`: The steps of the previous page: each way of advertising moved the ad further from the thing, added a copy that learns of a sale at its own time and a stranger to trust, and none was removed; together with the introduction's liquidity-machine claim and its short list of pattern names. → What those steps make possible: each of the fifteen patterns unpacked, with quote, warning signs, mechanism, cost, a Veldmark illustration, the remedy direction and the chapters that address it; then the chains between them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis | Set side by side, the nine steps each made a kind of sale possible and each added a concept, a party or a copy and a way to go wrong, and the last column of the table is the vocabulary of the next page. | table: Nine rows (sign, card, newspaper, magazine, website, search, feeds, phone, today) with columns Step, What it made possible, What it added, New party or delay, What can now go wrong; the fifteen pattern names each appear exactly once, plain words where none applies. |  |\n| p48 | synthesis | The page's few dates, in order of time, show how recent most steps are: the magazine anchor is about fifty years old, the website about thirty, apps on phones under twenty, while the sign, the card, the column and the feed have no date because they are common practice, not events. | table: Timeline of the page's anchors only: 1977, 1988, early 1995, 1996, 1999, 2000-2007, 2004, 2008, 2017, 2019, 2021, 2024, 2025. | `additional_support`: The table in the order of ideas. → The same steps placed in time. |\n| p49 | synthesis | Behind a bike that once carried its own sign now stand a record, a search index, 312 saved searches, a messaging system with a fraud check, a payment provider and an alert digest, because every step moved the ad further from the thing. | scenario: The Rotterdam bike (scenario ledger; fictional). | `elaboration`: The steps side by side and in time. → The count behind one listing today. |\n| p50 | refutation | The complexity is the price of all the trade these steps opened, not a mistake: each step answers a limit that still exists, so no rebuild makes classifieds simple again, and failures should be expected where a copy learns late or a stranger acts before a check. |  | `cause_effect`: One listing and its copies. → Why the steps stay, against the view that a classifieds site is simple underneath. |\n| p51 | transition | The next page names fifteen ways these copies and strangers fail, and after this walk each reads as the price of a step. |  | `cause_effect`: Failures are to be expected. → The fifteen named patterns of the next page. |\n\n## Non-goals\n\n- The industry's history: companies, founders, deals, consolidation and private-equity break-ups. See [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html).\n- Teaching any mechanism properly: each concept gets plain words, its name and a link. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html), [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html), [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html), [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html), [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- The failure patterns themselves: the page uses their names in the tally and plants their causes in the costs, and explains none. See [Unlisted: Fifteen Ways Listing Systems Go Wrong](where-listing-systems-go-wrong.html).\n- Veldmark as a company; it appears only at the last step as today's case. See [Meet Veldmark: Four Brands, One Platform to Build](meet-veldmark.html).\n- Teletext, telephone ad lines and other channels that existed only in some countries and add no concept the book needs.\n- The chapter format: no WHY callouts, no failure-pattern callout, no scene at Veldmark, no trade-off table, no questions to ask.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No primary source was read for the newspaper step (prices per line, the order of ads, the morning race) or for the card in a shop window; both are written as common practice and illustration, without dates.\n- No date is given for the first dealer or agency feed, the first saved-search alert or the first in-platform messaging; no primary source for a 'first' was read, and the page needs none.\n- The Kleinanzeigen engineering post (2019) that dates saved searches with push notifications to 2015 could not be fetched in this session (HTTP 403), so the alert step is dated only by the App Store (2008).\n\n## Decision log\n\n- **2026-11-18** — Nine steps: sign on the thing, card in a shop window, newspaper column, specialist magazine, classifieds website, search and the order of results, feeds, the phone in the pocket, today. Payment and buyer protection, identity checks, regulation, group platforms and models are joined in the last step, as what the present adds. Rejected: A separate step for payment and buyer protection (ten steps; its concepts are part of today's platform in the book).; Teletext or telephone ad lines (country-specific; no concept the tally needs).; Starting at the newspaper (too complex a first step; the author asked for a simpler start).; A separate step for portfolio groups (chapter 3 owns that history).\n- **2026-11-18** — The running question is 'Is what the ad says still true, and who finds out first?', answered in a closing paragraph of every step that begins with the question in bold. Rejected: 'Who can be trusted?' (trust appears in the costs; truth and timing are what most patterns turn on).\n- **2026-11-18** — Each of the fifteen pattern names appears once in the tally: Moderation as an Afterthought, Ghost Inventory and Vanity Liquidity at the website; The Category Straitjacket, The Attribute Junkyard, Search as System of Record and Multiplier Creep at search; Feed Roulette and Seeing Double at feeds; Fast Mail for Fraudsters at the phone; The Copy-Paste Country, Deal-Shaped Architecture, The Forced Fit, Billing by Guesswork and Set-and-Forget AI at today. Rejected: Listing a pattern at every step that can produce it (Ghost Inventory would appear five times).\n- **2026-11-18** — Anchor dates, each from a page fetched on 18 November 2026: 1977, 1988, 1996 and 2013 (Auto Trader Group's history page), <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
