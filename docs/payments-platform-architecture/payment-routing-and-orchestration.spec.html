<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between routing inside one provider (among acquirers and networks, including least-cost routing of US debit) and routing across providers, and the ways to do the second: an in-house payment service, a dedicated orchestrator, or one provider's orchestration product.\n- **Know:** What Stripe documents for routing to other processors (Orchestration, announced May 2025 and in private preview in November 2026; Vault and Forward) with its stated exclusions, and what Adyen documents (routing among acquirers and networks, a forward endpoint for stored cards, a multi pay-in pilot for platforms) and that no Adyen product for routing payments to other providers was found.\n- **Know:** Why stored cards and network tokens are the hard part of leaving or adding a provider.\n- **Believe:** A routing layer unifies the authorization request; disputes, settlement, balances, method coverage and stored cards remain one set per provider.\n- **Believe:** First-attempt routing needs evidence per segment that a small or mid-sized business does not have, and below that scale a simple rule with a rehearsed switch is the sound design.\n- **Be able to:** For a stated business, decide between one provider, two providers with a rehearsed switch, and rule-based routing, and list what each adds to operations.\n- **Be able to:** Write the exit questions to settle before adding a second provider: who holds the card vault, under whose identifier network tokens are issued, and how cards leave.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a business the chapter does not contain, the reader chooses a multi-provider stage and justifies it by volume per segment and operating cost, not by the number of providers. *Probe:* A language-learning app takes 400,000 card payments a year, 85% of them in two countries, through one provider that had two short outages last year. The CTO proposes buying an orchestration product and routing each payment to whichever of three providers has the best approval rate. Using only this chapter, what do you recommend and why? | `custom` | cold_reader | major |\n| AC-2 | Given a cross-provider retry, the reader says when it is safe. *Probe:* A payment to provider A times out with no answer. Your routing layer is configured to retry failed payments on provider B. Should it retry this one? Answer from this chapter. | `custom` | cold_reader | major |\n| AC-3 | Products in preview or pilot are labeled as such with the date checked, the merchant evidence is attributed to the one public account it comes from, and the chapter says that no audited comparison of multi-provider and single-provider approval rates is public. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** When and how should payments be routed across acquirers or providers, and what does it cost?\n\n> **Claim:** Routing each payment across providers pays for itself only where a business has enough payments in each segment (issuer, country, card type) for a difference in approval rate between routes to be measurable; below that, the use of a second provider is a failover that is triggered deliberately and has been rehearsed. In both cases the routing layer unifies the authorization request and nothing after it: disputes, settlement, balances, method coverage and stored cards stay one set per provider, and running those sets is what a second provider costs.\n\n**Disputed by:** The view that several providers mean higher approval and lower risk, so a business that can afford it should put an orchestration layer in front of several providers and send each payment to the best performer.\n\n**So what:** Before adding a provider, a team decides who holds the card vault and how cards and network tokens leave it, staffs a second back office for disputes and settlement, and keeps the routing rule as simple as its evidence allows. Larkfield's rule, 'the studio's provider' with a rehearsed switch (K8), is the claim applied.\n\n**How and why:** Stripe's documentation for its own Orchestration product lists what routing does not carry: disputes and settlement stay in the other processor's dashboard, non-card methods and several Stripe products are excluded, a routed payment creates no balance movement at Stripe, and a failed payment is not retried on another processor once 3-D Secure has been attempted. The one detailed merchant account found, given by Canva at a Stripe event in 2026, reports that the gain came from where traffic is sent first and that the price was about six months per provider integration, months of warming up each merchant account and close to thirty people. On the two companies: Stripe offers routing to other processors, Adyen among them, in private preview since May 2025, and a forwarding proxy out of its vault; Adyen documents routing among acquirers and networks (a US debit product since September 2024), a forward endpoint and a multi pay-in pilot, and no product for routing payments to other providers was found. That Stripe is willing to be the control layer over competitors and Adyen is not is the author's reading of those documents. Adyen's terms (13 June 2025) describe a service that shares network tokens for use with other payment providers, with the cryptogram still supplied by Adyen; no Stripe statement on whether its tokens can follow a merchant was found, and the scale at which routing pays is not publicly quantified.\n\n**Supporting claims**\n\n- **S1** — Routing inside one provider (among its acquiring routes and networks, including least-cost routing of US debit) changes cost and approval without adding a contract or a back office, and is a different decision from routing across providers.\n- **S2** — A routing layer across providers unifies the authorization request, the rules and the attempt record; disputes, settlement, balances, method coverage and provider-specific features stay one set per provider, as Stripe's documentation of its own Orchestration product states.\n- **S3** — Stored cards and network tokens are the hard part: a provider token works only at its vault, the documented ways out are a per-request forward and a provider-to-provider export, and on whether network tokens survive a move only Adyen's terms describe a sharing service (2025), with the cryptogram still supplied by Adyen.\n- **S4** — Per-payment routing pays only where each segment has enough payments to measure a difference between routes; below that scale the sound design is a fixed assignment with a failover that is triggered deliberately and rehearsed.\n- **S5** — Stripe documents a product for routing to other processors (private preview since May 2025) and a forwarding proxy out of its vault; Adyen documents routing among its own routes, a forward endpoint and a multi pay-in pilot, and no product for routing payments to other providers was found.\n- **S6** — A retry on another provider is safe only when the first attempt is known to have failed, because two providers share no idempotency key and cannot see each other's attempts.\n\n## Role in the part\n\nTests the obvious remedy for dependence on one provider's stack and shows what remains per provider when the request is unified, which is the money and the records that Part III takes up. Supports P2-5 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in two-kinds, what-routing-unifies, vault-and-tokens: each supplies terms the next one uses (routing rule, the layer and its reach, the vault); `comparison` in designs, where-they-differ; `assertion_evidence_reasoning` in when-routing-pays; `chronological` in when-it-goes-wrong)\n\nThe reader arrives with a remedy already in mind, so the chapter opens with it as a proposal at Larkfield and tests it in the order the proposal would be examined in a design review. First what 'routing' means, because much of what the proposer wants exists inside one provider. Then what a layer across providers can share, from the most precise public inventory, and then the stored cards, which are the part of the remainder that is hardest to move; both must precede the designs, which differ mainly in who holds the vault and who runs the layer. Only then does the evidence for when routing pays make sense, because it is evidence about stages. The two companies come after the general argument so that their documented positions are read against it, Larkfield's rule is the claim applied, and the failures close the body because they are what the rule and the rehearsal exist to prevent. Putting the companies first would turn the chapter into a product comparison; putting the evidence before the anatomy would leave the reader unable to say what the thirty people at Canva were doing.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): For forty minutes on a Friday evening your one payment provider approves four card payments in five instead of nine in ten. Nothing is down; one connection in one country is degraded. In the review on Monday everyone proposes the same remedy: add a second provider and a layer that sends each payment to whichever provider is performing best. Why does a remedy that obvious take a team of thirty at the merchant that has given the most detailed public account of it?\n\n**Bridge:** An engineer already removes single points of failure by adding a second instance and a load balancer, and already routes requests by measured health. → A payment provider is not a stateless instance: it holds the stored cards, the money, the disputes and the records of every payment it took, so the question becomes what a routing layer in front of two providers can share and what stays behind each of them.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 and 2) and paragraph p02): Routing each payment across providers pays only where every segment (issuer, country, card type) has enough payments for a difference between routes to be measured; below that, a second provider is a failover you trigger on purpose and have rehearsed. Either way the layer unifies the authorization request and nothing after it: disputes, settlement, balances, method coverage and stored cards stay one set per provider.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from Larkfield's proposal to route every card payment to the better-performing of its two providers, and return to it with the rule Larkfield keeps instead. *Kept in:* scene, in-practice.\n- Separate routing inside one provider, including least-cost routing of US debit, from routing across providers. *Kept in:* two-kinds.\n- Show what a routing layer consists of, and use Stripe's documentation of its own Orchestration product to list what the layer does not carry. *Kept in:* what-routing-unifies.\n- Explain why stored cards and network tokens are the hard part of adding or leaving a provider. *Kept in:* vault-and-tokens.\n- Lay out the three stages of running more than one provider and the three ways to build the layer. *Kept in:* designs.\n- Weigh the one detailed public merchant account against the arithmetic of segments, and say where the evidence stops. *Kept in:* when-routing-pays.\n- Compare what Stripe and Adyen each document. *Kept in:* where-they-differ.\n- Go through the ways multi-provider setups fail, starting with a double charge across two providers. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A degraded provider makes one remedy look obvious: a second provider and a layer that sends each payment to whichever is performing best. | scenario: The hook: forty minutes at four approvals in five instead of nine in ten, with nothing formally down (a hypothetical addressed to the reader, not a report about any provider). |  |\n| p02 | claim | The remedy holds only in part: routing per payment pays where each segment has enough volume to measure a difference, a second provider is otherwise a rehearsed failover, and in both cases the layer unifies the authorization request and nothing after it. |  | `contrast`: The remedy everyone proposes. → The chapter's claim, and the bill for a second provider: a second set of disputes, settlement, balances and stored cards. |\n| p03 | context | In the journey of Mila's class pass, routing is the lookup that happens before authorization, and everything after it stays with the provider the lookup chose. | scenario: Mila's class pass: EUR 120.00, 9 March 2027 at 19:42, Studio Noord on Adyen, payout 11 March. | `place`: The authorization request as the only thing a routing layer unifies. → Where that sits in the recurring payment: at 19:42 on 9 March 2027 the payment service maps Studio Noord to Adyen, and the settlement, the payout of 11 March and any later refund or dispute follow from that one choice. |\n| p04 | transition | The chapter goes from Larkfield's proposal, through the two kinds of routing, the anatomy of a routing layer, the vault, the designs and the evidence for when routing pays, to the two companies, Larkfield's rule and the failures. |  | `sequence`: Where routing sits in the payment's journey. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: The Proposal to Route Every Payment\n\n**Controlling idea** (`example`, id `scene`): Larkfield already has two providers and a one-line routing rule, and the proposal to replace the rule with per-payment routing raises the three questions the chapter answers.\n\n**Advances the thesis** (S4): Poses the choice between a simple rule with a switch and per-payment routing on a business whose numbers the reader knows.\n\n**Transition in:** `example`: The remedy of the introduction, a second provider and a layer that picks the best one. → A company that already has the second provider and is asked to add the layer.\n\n**Order of paragraphs** (`problem_solution`): The proposal, then the rule it would replace, then the questions it raises. Asking the questions first would leave the reader without the two designs they are about; describing the existing rule first would hide why anyone wants to change it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In February 2027 Larkfield's CTO proposes buying an orchestration product and sending each online card payment to whichever of Stripe and Adyen approves more. | scenario: Larkfield, fictional: 6,200 studios; Stripe carried 44% (EUR 493M) and Adyen 56% (EUR 627M) of 2026 member payment volume; the split is by studio. |  |\n| p06 | description | Larkfield's routing rule today is a lookup, 'the studio's provider', with a manual per-studio override, inside a payment service with one adapter per provider. | scenario: Ledger: 'There is no orchestration product: the payment service's routing rule is \"the studio's provider\", with a manual per-studio override'; the payment service was built in 2024 by Tom Hendriks. | `contrast`: The proposal to route each payment by performance. → What exists instead: a rule that never looks at the payment, only at the studio. |\n| p07 | claim | Femke de Graaf answers the proposal with three whiteboard questions (distinct from the exit questions of the vault section): what would the layer unify, where would the stored cards live, and does Larkfield have the evidence to choose a route per payment. |  | `cause_effect`: The proposal set against the existing rule. → The three questions that organize the chapter. |\n\n### Two Kinds of Routing: Inside a Provider and Across Providers\n\n**Controlling idea** (`definition`, id `two-kinds`): Routing inside one provider changes the acquirer, network or connection a payment uses and leaves the merchant with one contract and one back office; routing across providers is a different decision because it multiplies the back office.\n\n**Advances the thesis** (S1): Separates the routing a provider does for the merchant from the routing the thesis is about, so that the cost claim is made about the right thing.\n\n**Transition in:** `elaboration`: Femke's first question, what a layer would unify. → The word 'routing' itself, which covers two decisions with very different costs.\n\n**Order of paragraphs** (`small_to_large`): The reader meets routing first where it is cheap (inside one provider, where the documented example is US debit) and then where it is expensive (across providers). Starting with orchestration would hide that much of what merchants want from routing is available without a second provider.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Routing is the choice of path for one payment, a routing rule is the stated condition that makes the choice, and the choice exists at two levels that differ in what the merchant must operate afterwards. |  |  |\n| p09 | explanation | Inside one provider, routing chooses among the provider's own acquiring routes, networks and connections, and the merchant keeps one contract, one set of reports and one place for disputes. | quotation: Stripe guide 'Optimizing authorization rates' (https://stripe.com/guides/optimizing-authorization-rates, n.d., accessed 2026-11-17): 'If processor downtime does occur, Stripe can dynamically route payments to the best connections. For example, Stripe automatically shifts volume when Visa's US data centres go down for maintenance.'; quotation: Adyen documentation (uplift-enablement, n.d., accessed 2026-11-17): the feature routes 'each transaction to the highest-converting or lowest-cost acquirer or network', is 'off by default' and needs 'at least two available routes'. | `sequence`: The two levels of routing. → The first level, with what each company documents about it. |\n| p10 | definition | Least-cost routing sends a debit payment over whichever of the card's two networks costs the merchant less, and in the United States the merchant's right to choose rests on Regulation II. | quotation: Regulation II 'prohibits all issuers and networks from restricting the number of networks over which debit transactions may be processed to less than two unaffiliated networks, and from inhibiting a merchant's ability to direct the routing of a debit transaction over any network that the issuer has enabled to process it'.; fact: The Federal Reserve's 2022 update says issuers 'should enable at least two payment card networks to process all debit card transactions, including \"card-not-present\" transactions, such as online payments', effective 1 July 2023. | `example`: Routing among networks inside a provider. → The best-documented case: US debit cards, which by rule work on two unaffiliated networks. |\n| p11 | comparison | Adyen sells first-attempt debit routing as a named product with merchant-set objectives and a before-and-after pilot figure, while Stripe documents a US debit network only as a path for retrying a decline. | quotation: Adyen, 9 September 2024: 'In a pilot of over 20 enterprise merchants ... Adyen achieved an average of 26% cost savings with a 0.22% uplift in authorization rates against earlier debit performance.'; fact: Adyen documentation: for the US and Australia the merchant chooses 'balance conversion and cost (recommended), prioritize cost, or prioritize conversion'; routing follows 'Any routing priorities set for your merchant account. For example, 1: PULSE and 2: Visa'.; quotation: Stripe documentation 'Payments optimization' (https://docs.stripe.com/payments/analytics/optimization.md, n.d., accessed 2026-11-17): Adaptive Acceptance 'might automatically retry an eligible transaction on a US debit network (also known as PINless network) after it's declined on an international network'. No Stripe page on first-attempt least-cost routing of US debit was found; Stripe's support site documents it for Australian merchants. | `example`: The legal basis for choosing a debit network. → What each company has built on it, and the limit of what was found for Stripe. |\n| p13 | definition | Routing across providers, which the industry calls payment orchestration, puts a layer in front of two or more providers for three stated motives (redundancy, performance and cost, reach into new countries), and failover is its simplest use. | source: Alex Ginet of Stripe at Stripe Sessions 2026 names the three motives: 'redundancy and reliability', 'performance and cost optimization', 'geo expansion'. | `contrast`: Routing inside one provider, which adds no back office. → The second level, which is the subject of the rest of the chapter. |\n\n### What a Routing Layer Unifies, and What It Leaves Per Provider\n\n**Controlling idea** (`explanation`, id `what-routing-unifies`): A routing layer gives the merchant one request, one rule set and one attempt record, and everything that happens after authorization (disputes, settlement, balances, method coverage, provider-specific features) stays with the provider that took the payment.\n\n**Advances the thesis** (S2): Establishes the second half of the thesis from the most precise public inventory there is: Stripe's documentation of what its own orchestration product does not carry.\n\n**Transition in:** `elaboration`: Orchestration as a layer in front of several providers. → What that layer is made of and where its reach ends.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The layer's parts in general, then one documented product read closely as evidence, then the general table. The table needs the documented exclusions before it, or it would be the author's assertion; the product needs the anatomy before it, or its rule engine and records would have no place to sit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | A routing layer has five parts: one payment API, a rule engine, an adapter per provider, a store of card credentials that every adapter can use, and a record of every attempt. | figure: Illustration placeholder 10-routing-layer-anatomy: the five parts above a line, and below it, per provider, disputes, settlement, balance and reports.; reasoning: Industry practice; the same parts appear in Larkfield's payment service (ledger) and in the vendors' self-descriptions cited in the designs section. |  |\n| p16 | evidence | Stripe's Orchestration, announced in May 2025 and still in private preview in November 2026, routes card payments to Adyen, Braintree or Worldpay by ordered rules with one main and one optional retry processor. | fact: 'Orchestration is in private preview' (checked 17 November 2026); announced 7 May 2025 ('We previewed Stripe Orchestration', Stripe blog, https://stripe.com/blog/top-product-updates-sessions-2025). Feature table lists Adyen, Braintree and Worldpay WPG.; quotation: 'Stripe executes the conditions in order, from left to right, and applies the first action that matches a payment's condition.' Conditions: amount, BIN, card country, card issuer, card type, currency, metadata. 'You can only have one active set of rules in each sandbox and in live mode.' | `example`: The parts of a layer and the line under them. → One product whose documentation states precisely what it does and does not carry. |\n| p17 | evidence | Stripe's documentation says the contract, the fees, the liability, the disputes and the settlement of a routed payment stay with the other processor, and that non-card methods and several Stripe products are outside the feature. | quotation: 'your third-party processor continues to act as the processor for payments routed to it. All related activity (including payment processing fees and liability for transaction losses) remain subject to the terms that you agreed to with that processor.'; quotation: 'Orchestration feature support doesn't include non-card payments or Link, Capital, Connect, Terminal, or Organizations.' 'Orchestration also doesn't support disputes or settlement-related activity. To manage these activities, access your third-party processor's dashboard.' | `contrast`: What Orchestration routes. → What its documentation says it does not carry. |\n| p18 | cause_effect | Because a routed payment moves no money through Stripe, it creates no Charge and no balance movement there, and Stripe's analytics cannot report an authorization rate for it. | quotation: 'Stripe creates Payment Records and Payment Attempt Records instead of Charges for payments routed to other processors.' 'Stripe only creates Balance Transactions for payment volume processed on Stripe ... If your back-end systems assume there's always a Balance Transaction after a successful payment, that's no longer true.'; quotation: 'You can't specify an authorization rate if you set the processor filter to a non-Stripe processor. Stripe doesn't have access to non-Stripe data.' (https://docs.stripe.com/payments/analytics/acceptance.md, n.d., accessed 2026-11-17) | `cause_effect`: Settlement staying with the other processor. → The effect on the records a merchant's own systems read. |\n| p19 | analysis | Set side by side, the layer unifies the request, the rules and the attempt record (and the credential store only if the layer itself holds the vault, which the next section takes up), and leaves per provider the contract, the merchant account, disputes, settlement, the balance, payouts, reports and non-card methods: that second set is what a second provider costs. | table: Table 'Unified by the layer / Stays per provider' with the chapter that owns each per-provider item.; quotation: Joshua Barton of Canva, 2026: 'when you're doing chargebacks or you're doing refunds, your operations team now has to go into a second portal.' | `conclusion_summary`: The documented inclusions and exclusions of one product. → The general line between what any routing layer shares and what stays per provider. |\n\n### The Hard Part: Stored Cards and Network Tokens\n\n**Controlling idea** (`explanation`, id `vault-and-tokens`): Whoever holds the card vault decides where stored cards can be charged, the documented ways out are a per-request forward and a provider-to-provider export, and on network tokens only Adyen's terms describe a sharing service for use with other providers (2025), while no Stripe statement was found.\n\n**Advances the thesis** (S3): Shows why stored cards are the per-provider asset that is hardest to share or move, and so the first thing to decide before a second provider.\n\n**Transition in:** `emphasis`: Stored cards as one of the things that stay per provider. → Why this one is harder than the rest: for a subscription business the stored cards are the revenue.\n\n**Order of paragraphs** (`prerequisite_order`): Provider token before vault location, vault location before the two ways out, card numbers before network tokens, and the limit of the evidence last, because each step uses the term the one before it defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | definition | A provider token is a reference into one provider's card vault, so a card stored at one provider cannot be charged at another, and a merchant that never held the card numbers cannot copy them itself. | scenario: Larkfield, fictional: recurring memberships are 61% of online volume, about 940,000 renewals a month, all charged against stored credentials; K4 keeps card numbers out of Larkfield's systems. |  |\n| p21 | comparison | The vault can live in three places: at one of the providers, at an independent vault or orchestrator in front of them, or at every provider separately. | figure: Illustration placeholder 10-where-the-vault-lives: three small panels, the card safe at one provider, in front of both, and one at each.; quotation: Spreedly homepage (https://www.spreedly.com/, n.d., accessed 2026-11-17), a vendor self-description: 'Hold every credential in your own vault, use it with any provider, and change processors without asking a customer to re-enter a card.' | `cause_effect`: A token that only works where the vault is. → The three places the vault can be, and what each makes easy or hard. |\n| p22 | process | Both companies document a forwarding proxy out of their vault: the merchant sends a request with placeholders, the provider inserts the card details and sends it to a third party, and neither proxy is self-service. | quotation: Stripe: 'The Vault and Forward API allows you to tokenize and store card details in Stripe's PCI-compliant vault and route that data to supported processors or endpoints'; it 'is available only to businesses with a dedicated Stripe account team'; the supported destinations are a published list that includes Adyen, Braintree, Checkout, Worldpay and Spreedly; 'the Vault and Forward API doesn't confirm or capture PaymentIntents'.; quotation: Adyen: 'You can forward payment details that you stored with Adyen to a PCI compliant third party, like a payment service provider (PSP). We support forwarding card details, and network tokens.' Enabling it requires contacting Adyen's support team; no destination list is published on the page. | `example`: The vault held at one provider. → The first documented way to use those cards elsewhere: one request at a time. |\n| p23 | process | The second way out is a bulk transfer of card numbers from one provider to another, which Stripe documents as a policy with conditions and Adyen documents only in the inbound direction. | quotation: Stripe: 'We believe our customers own the sensitive data they entrust to Stripe.' 'we can only transfer your card data to another PCI DSS Level 1-compliant payment processor'; the recipient's PGP key 'must be 4096 bits or greater'; 'Stripe doesn't export your account's payment history, subscriptions, or other objects'; credentials saved through Link are excluded.; fact: Adyen documentation 'Import data from another payment provider' (https://docs.adyen.com/development-resources/migrating-payment-data.md, n.d., accessed 2026-11-17): 'migrating payment data usually takes 10 days or more'. An export article is listed in Adyen's help center, but its link redirects and the procedure could not be read on 17 November 2026. | `contrast`: Forwarding, which borrows a card for one request. → Export, which moves the cards themselves, and how long it takes. |\n| p24 | explanation | A network token is issued to the party that requested it, so a token requested by a provider is that provider's to use, and a merchant that wants tokens it can take anywhere has to be the requestor itself or use a vault that requests them in the merchant's name. | quotation: Adyen: 'Network tokenization is only applicable for payments acquired by Adyen. It cannot be used with external acquirer connections'; the alternative mode is 'Manage network tokens yourself'.; quotation: Spreedly documentation (https://developer.spreedly.com/docs/network-tokenization, n.d., accessed 2026-11-17), a vendor self-description: 'Spreedly has completed integrations with Visa and Mastercard allowing merchants to request network tokens using their merchant-specific TRID.' | `contrast`: Card numbers, which can be exported. → Network tokens, which are bound to whoever asked the network for them. |\n| p25 | analysis | Stripe's export page is silent on network tokens and Adyen's terms describe a sharing service that still needs Adyen's cryptogram (2025), and neither documents under whose identifier it provisions tokens, so the three exit questions (who holds the vault, under whose identifier tokens are issued, how cards leave) have to be put to each provider before the second one is added. | fact: Stripe's export page does not mention network tokens; Adyen's forward page requires an Adyen token for the same card as a fallback 'in case we cannot find a network token'. Adyen's Additional Services Terms (last updated 13 June 2025; owner: network-tokens): a Network Token Sharing Service shares network tokens with customers 'to store and/or use to process payments with other payment providers'; a customer-initiated payment elsewhere needs a one-time cryptogram retrieved from Adyen. No Stripe statement found.; reasoning: INFERENCE block: tokens requested under a provider's identifier probably do not transfer unless a sharing service such as Adyen's was enabled, so the benefits of tokens would have to be rebuilt at the new provider. | `conclusion_summary`: The forward, the export and the requestor rule. → Where the public record stops, and the questions that follow from it. |\n\n### Three Stages, and Three Ways to Build the Layer\n\n**Controlling idea** (`comparison`, id `designs`): Running more than one provider comes in three stages distinguished by what the routing decision looks at, and the layer for the later stages can be built in-house, bought from a dedicated orchestrator or taken from one provider, each with a different owner of the vault and of the risk.\n\n**Advances the thesis** (S4, S2): Names the options the thesis chooses among, so that the evidence in the next section can be applied to a stage and not to 'multi-provider' as one thing.\n\n**Transition in:** `sequence`: The layer's reach and the vault's location. → The realistic designs that combine them.\n\n**Order of paragraphs** (`comparison`): Stages first, because the builders differ only for the later stages; then the three builders in order of who holds the vault: the merchant, a neutral third party, one of the providers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | claim | There are three stages: one provider with its internal routing, two providers with a fixed assignment and a switch, and rules that choose a provider per payment; the number of providers matters less than what the rule looks at. | quotation: Joshua Barton of Canva, 2026: 'we didn't think we had an orchestration system yet because it was just two. It's really when we put the third PSP in that we started to think, hold on, we need some more sophisticated logic here because it's not only just fallback anymore'. |  |\n| p27 | comparison | Built in-house, the layer gives full control of rules and retries and makes the merchant responsible for the adapters, the card data and the separate integrations that keep stored cards usable. | quotation: Jon Krauss of Stripe, 2026: 'If you want maximum conversion, maximum authorization rate, you need to use things like network tokenization, card account updater, and those are independent integrations themselves with the schemes.' | `sequence`: The stages. → The first way to build the layer for stages two and three. |\n| p28 | comparison | A dedicated orchestrator sells the adapters and an independent vault as a service and in exchange becomes a new hop and a new single point of failure whose integrations are only as deep as the vendor made them. | source: Vendor self-descriptions, each n.d., accessed 2026-11-17: Primer (https://primer.io/) 'Route payments to a secondary processor in the event of a failure'; Gr4vy (https://gr4vy.com/) 'Vendor-agnostic data vault'; Hyperswitch (https://github.com/juspay/hyperswitch, Apache 2.0 licensed) routes 'to the PSP with the highest predicted auth rate'; Spreedly as in the vault section.; quotation: Jon Krauss of Stripe, 2026: 'there are added milliseconds to the end-to-end transaction flow' and an orchestrator 'creates concentration risk with the orchestrator themselves'.; quotation: Joshua Barton of Canva, 2026: 'a lot of orchestrators out there will tell you they connect to 400 PSPs ... It's all about the quality of the integration to the PSPs and depth of that integration'; and 'If they don't have the five nines uptime ... you're bringing Stripe's uptime down because the orchestrator's how you get there.' | `contrast`: Building the layer. → Buying it from a company whose only product it is. |\n| p29 | comparison | A provider's own orchestration product removes the extra vendor and keeps the vault where it already is, and its documented defaults send a payment back to the host whenever a rule or a feature does not apply. | quotation: Stripe: 'If you don't have active rules, payments route to Stripe'; 'Link transactions are automatically excluded from your routing rules and always processed on Stripe'; with error protection, on an unsupported feature 'we route the payment to Stripe instead of the originally determined payment processor'. | `contrast`: A neutral orchestrator. → An orchestrator that is also one of the routes. |\n\n### When Routing Pays: One Merchant's Account and the Arithmetic of Segments\n\n**Controlling idea** (`evidence`, id `when-routing-pays`): The one detailed public account says the gain came from first-attempt routing by fine segments at a price of months and about thirty people, and simple statistics show why that gain is out of reach when segments are small.\n\n**Advances the thesis** (S4): Supplies the evidence and the reasoning for the first half of the thesis: routing per payment pays only with measurable volume per segment.\n\n**Transition in:** `problem_solution`: Three stages and three builders to choose among. → The evidence for choosing, which is thin and comes mostly from one merchant.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The merchant's account (motive, gain, price), then the arithmetic that explains why the gain depends on scale, then the limits of the evidence, then the rule and its table. Giving the rule first would present a judgement before the one account it rests on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | evidence | Canva, which built its layer in-house over five providers, says it went multi-provider for redundancy and that the redundancy paid off in partial degradations, not in full outages. | quotation: Joshua Barton, Canva, at Stripe Sessions 2026: 'the real reason why we did this was redundancy. We accept payments in over 190 countries'; 'If a network goes down in Mexico or if a payment method goes down in Indonesia, that's not included in your five-nines uptime.' |  |\n| p31 | evidence | Canva reports that the larger gain came from where the first attempt was sent, and that the useful signal moved from country to issuer to separate merchant accounts. | quotation: 'the real power is where you send the traffic the first time'; 'country is not the real signal. It's going to be BIN and issuer'; 'you had a mid for good traffic, a mid for bad traffic'. | `contrast`: Redundancy as the motive. → The gain Canva did not expect, and how fine the routing had to become to get it. |\n| p32 | evidence | The price Canva names is about six months of engineering per provider, contracts and verification before that, three months or more of warming up each new merchant account, and close to thirty people. | quotation: 'it takes maybe six months or more to integrate a new PSP'; 'you're spending three-plus months warming up'; 'once you start including operational people, it's close to 30 people just working on this'; verdict: 'it's worth it, so do it'. | `contrast`: The gain. → What it cost. |\n| p33 | analysis | To detect a difference of half a percentage point between two routes at a 90% approval rate takes about 57,000 payments on each route in the segment being compared, which is why routing by issuer needs a very large merchant. | reasoning: Standard sample size for comparing two proportions at 5% significance and 80% power: n per group is about 16 x p x (1-p) / d squared; with p = 0.90 and d = 0.005, n is about 57,600. The 90% baseline is an assumption.; quotation: Alex Ginet of Stripe, 2026, an illustration: 'a business running about a hundred million dollar a year' that finds 'half a percent more authorization rate' gains '$500,000 in revenue'. | `cause_effect`: Routing that works per issuer and merchant account. → The arithmetic of how many payments a segment needs before a route can be chosen on evidence. |\n| p34 | claim | The evidence stops at one merchant speaking at a provider's event: no audited comparison of multi-provider and single-provider approval rates is public, and neither provider publishes the scale at which routing pays. | fact: The talk is a session at Stripe's own conference that also presents Stripe Orchestration; no other detailed, verifiable merchant account of multi-provider routing results was found in the research for this chapter. | `contrast`: What one account and some arithmetic establish. → What they do not, and what was looked for and not found. |\n| p35 | recommendation | The rule I draw is staged: stay on one provider until an outage or a missing market forces a second, run two with a fixed assignment and a rehearsed switch, and add per-payment rules only for segments large enough to test. | table: Trade-off table: stage \\| routing decision \\| what it adds to operations \\| right when. | `conclusion_summary`: The account, the arithmetic and their limits. → The author's rule, with what each stage adds to operations and when it is right. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Stripe documents a product for routing payments to other processors, Adyen among them, and Adyen documents routing only among its own routes; both offer a way to forward stored cards out, and both are building ways for platforms to consolidate funds acquired elsewhere.\n\n**Advances the thesis** (S5): States what each anchor company has documented about multi-provider routing, with dates and preview status, and keeps the reading of the difference labeled as the author's.\n\n**Transition in:** `place`: A staged rule that holds on any provider. → The two companies: what each documents about the stages and the layer.\n\n**Order of paragraphs** (`comparison`): The table of documented facts, then the reading of it, then what an integrator does. Giving the reading first would present inference about two real companies before the facts it reads; giving the advice first would leave it without grounds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | comparison | On five aspects (routing to another provider, routing inside the provider, forwarding stored cards, bulk export, consolidating other providers' funds for platforms) the documented positions differ most on the first. | table: The required four-column table; every Stripe and Adyen cell is a fact cited earlier in the chapter or 'not found in public documentation'; the last column is the author's reading.; fact: Adyen Multi pay-in 'is currently in pilot phase' and lets a platform 'combine payments processed by Adyen with third-party acquired volume', with funds to be allocated 'within 24 hours'. Stripe, 29 April 2026: 'We previewed the ability for marketplaces that sell in Europe to continue using multiple payment providers while making unified payouts through Stripe' (https://stripe.com/blog/everything-we-announced-at-sessions-2026). |  |\n| p37 | analysis | Stripe's stated reason for helping merchants use its competitors is an 'open architecture', Adyen's public argument is a single platform, and the reading that Stripe is willing to be the control layer over other processors while Adyen is not is mine. | quotation: Jon Krauss of Stripe, 2026: 'Stripe Orchestration is an investment in a broader strategy of an open architecture. You're not going to have to be locked into Stripe.'; quotation: Adyen product page (https://www.adyen.com/uplift, n.d., accessed 2026-11-17): 'Unlike fragmented legacy architectures, Adyen brings payments onto one single platform'.; reasoning: INFERENCE block: holding the vault, checkout, billing and fraud layers may matter more to Stripe than carrying every authorization; Adyen's economics rest on carrying the payment itself. | `cause_effect`: The documented difference on routing to other providers. → The reasons each company gives, and the author's labeled reading. |\n| p38 | recommendation | An integrator on Stripe should treat Orchestration as a preview with a documented list of exclusions and decide separately about the vault; an integrator on Adyen should expect to build or buy the layer elsewhere and ask early how cards and tokens leave. |  | `cause_effect`: The difference and its reading. → What to do differently on each. |\n\n### In Practice at Larkfield: One Rule and a Rehearsed Switch\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield keeps the rule 'the studio's provider' because a studio's money and verification live at one provider and its segments are too small and too confounded to choose routes on evidence, and it spends its effort on a switch it rehearses every quarter.\n\n**Advances the thesis** (S4, S2, S3): Applies the whole claim to the ledger's numbers: the rule kept simple, the per-provider sets that the switch has to respect, and the stored cards that do not follow.\n\n**Transition in:** `example`: The staged rule and the two companies' documented positions. → Larkfield's answer to the proposal of the opening scene: decision K8.\n\n**Order of paragraphs** (`problem_solution`): Why the rule is per studio, why per-payment routing has no evidence behind it here, what the switch moves and does not, and how the rehearsal answers the exit questions. The rehearsal comes last because it tests the limits the three paragraphs before it establish; placed first, it would read as ceremony, since the reader would not yet know that the balance and the stored cards do not follow the switch.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | explanation | On a platform the routing rule is per studio because each studio's balance, payouts and verified account exist at one provider, so sending one payment elsewhere would need a second account for that studio. | scenario: Ledger: the studio's money sits in the provider's regulated balance until payout; 'The split is by studio, not by payment'; 1,140 studios in NL and DE are on Stripe online while using Adyen terminals at the front desk.; fact: Stripe's Orchestration feature support 'doesn't include ... Connect'. |  |\n| p40 | analysis | Larkfield's card volume cannot support per-payment routing: about 1.2 million online card payments a month spread over five countries, and the provider is tied to the country and the studio, so its own data cannot compare the two providers on like payments. | scenario: Ledger arithmetic: cards are 52% of EUR 910M online volume; applying 52% to 27.6M online payments gives about 14.4M card payments a year, 1.2M a month (assumption: share by count equals share by volume). Stripe carries UK, US and Belgium, Adyen the Netherlands and Germany. | `additional_support`: The structural reason for a per-studio rule. → The statistical reason, from the ledger's numbers. |\n| p41 | example | If the switch were thrown for Studio Noord, Mila's class pass would move to Stripe at once because a wallet payment brings its own credential, and her EUR 49 membership renewal would not, because it rests on a card stored at Adyen. | scenario: Ledger: the pass is paid from a phone wallet on 9 March 2027; the membership was set up on 12 January 2027 by typing the card and renews on the 1st as a merchant-initiated payment. New canonical detail (appended to the ledger): the 50 largest studios keep a verified account on both providers; the switch moves payments that bring their own credential; stored-card renewals stay with the original provider. | `example`: A rule that stays per studio. → What the K8 switch does to the two recurring payments of the book. |\n| p42 | process | The quarterly rehearsal sends real payments for each of the 50 largest studios through the second provider and follows them to payout, refund and reconciliation, and it keeps Larkfield's answers to the three exit questions current. | scenario: Ledger K8: 'the switch is rehearsed quarterly for the 50 largest studios; no orchestration product is added'; K3: the reconciliation job covers both providers.; table: Table: exit question \\| Larkfield's answer in 2027. | `sequence`: What the switch moves. → How Larkfield knows it works, and what the rehearsal checks beyond the authorization. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Multi-provider setups fail in three ways of their own: a retry on a second provider after an unknown outcome, a failover never exercised, and money flowing backward to a provider nobody is watching.\n\n**Advances the thesis** (S6, S2): Shows that the only unified part, the authorization request, is also where a second provider adds a new way to charge twice, and that the per-provider remainder is where the later failures surface.\n\n**Transition in:** `contrast`: A switch that is rehearsed. → What happens to routing layers that are not, or that retry too eagerly.\n\n**Order of paragraphs** (`chronological`): In the order they occur: the retry at the moment of authorization, the failover on the day of an outage, the refunds and disputes weeks later. The order also runs from the failure that costs money at once to the one that surfaces last, so reversing it would open the section with its least urgent case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | cause_effect | A timeout is an unknown outcome, so retrying it on a second provider can charge the customer twice across two providers that cannot see each other, and a cross-provider retry is safe only when the first attempt is known to have failed. | quotation: Stripe: if 3D Secure 'authentication is attempted on the first attempt on your main processor and your customer doesn't authenticate successfully, or authenticates successfully but the payment attempt still fails, Orchestration doesn't retry the transaction on the retry processor.'; quotation: Stripe Vault and Forward: 'you might unintentionally use them to capture a payment on Stripe that was already captured on another processor'; 'Use a different and unique key for Stripe and any idempotency keys you provide on the underlying third-party request.'; scenario: The Double Charge, 1 November 2026: 1,840 members charged twice after a timeout was retried with a new key, EUR 71,300 refunded.; figure: Illustration placeholder 10-cross-provider-retry: a request that times out at Provider A, a retry sent to Provider B, and one customer with two holds. |  |\n| p45 | cause_effect | A failover that has never carried traffic fails on the day it is needed: the second merchant account is cold, a feature the payment uses is missing there, or the authentication was set up for the other acquirer. | quotation: Stripe: an unsupported feature 'fails with a 400 error code orchestration_unsupported'; 'For transactions that involve a 3D Secure request, you're responsible for providing Stripe with the Acquirer BIN that corresponds to the processor you route those transactions to.'; quotation: Joshua Barton of Canva, 2026: 'you're spending three-plus months warming up'. | `time`: A retry at the moment of payment. → The switch on the day of an outage. |\n| p46 | process | After any switch, refunds and disputes go back to the provider that took the original payment, so both back offices and both reconciliations must stay staffed for as long as the dispute window runs. | quotation: Stripe: 'For payments routed to third-party processors, those processors administer the refunds.'; scenario: The refund after payout (Mila's EUR 84.00 on 18 March 2027) and the EUR 120 dispute of 24 February 2027 would each arrive at the provider that took the payment, whichever provider the studio is on by then. | `time`: The day of the switch. → The weeks and months after it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The routing layer, the vault, the stages and the failures are one fact seen four ways: a payment provider is not a stateless route but the holder of the cards, the money and the records of every payment it took. Routing can be shared because it happens before any of that exists; everything created by the payment stays where it was created. The decision to add a provider is therefore a decision to run a second back office and to settle where the cards live, and the routing rule is the smallest part of it.\n\n**So what:** A team that accepts this stops asking 'which provider performs best?' first. It asks who holds the vault and how cards and tokens leave, staffs disputes and reconciliation for two providers, counts its payments per segment, and keeps the rule as simple as that count allows. For most businesses that means a fixed assignment and a switch that has been rehearsed.\n\n**Callback:** The forty minutes at four approvals in five, and the remedy proposed on Monday. The reader can now split the remedy in two: the second provider with a rehearsed switch answers the forty minutes; the layer that picks 'the best' provider per payment answers a different question, one that needs a volume per segment most teams do not have, and the thirty people are the per-provider work the layer never touched.\n\n**Takeaway** (`course_of_action`): Before adding a provider, write down the three exit answers (who holds the vault, under whose identifier network tokens are issued, how cards leave), name the owner of the second provider's disputes, settlement and reconciliation, and choose the stage by payments per segment. Eight questions to take into the review follow.\n\n**Hand-off** to [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html): `contrast`: Every payment so far was made at a distance, with only the provider's software between the merchant and the network, and Larkfield's 1,140 studios show a platform can run one provider online and another at the counter. → The card in the room: a physical device in the payment path, and what it takes to join a counter payment to an online one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis (list) | Established: providers route inside their own networks, US debit routing is a merchant right under Regulation II, a provider token works only at its vault, and Stripe's own documentation lists disputes, settlement and non-card methods as outside its orchestration product. |  |  |\n| p48 | synthesis (list) | Depends on context: whether to add a second provider, who should hold the vault, whether to build or buy the layer, and when per-payment rules are worth having. |  | `contrast`: What is established. → What holds only under stated conditions. |\n| p49 | recommendation (list) | The author's synthesis: a provider is a place where cards, money and records live, so decide the exit before the entry and keep the routing rule as simple as the evidence per segment allows. |  | `contrast`: Conditional recommendations. → The author's own position. |\n| p50 | recommendation (list) | Eight questions let the reader test a multi-provider proposal or a provider's orchestration offer. |  | `cause_effect`: The positions. → The questions that apply them in a design review or a provider evaluation. |\n| p51 | transition | Everything so far assumed a payment made at a distance; the next chapter puts the card in the room. |  | `contrast`: Routing between providers that are both reached over the internet. → A device in the payment path, and Larkfield's studios that already use one provider online and another at the counter. |\n\n## Non-goals\n\n- Why issuers decline and what a provider does inside the authorization call (retries, message formatting, network retry limits). See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html).\n- What an acquirer is licensed to do and which entity acquires in which country. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html).\n- How vaults, provider tokens and PCI scope work; how network tokens and cryptograms work. See [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html), [The Card Number's Replacement: Network Tokens and Credential Lifecycle](network-tokens.html).\n- Balances, settlement reports and reconciliation across providers in detail. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Idempotency keys and the handling of an unknown outcome within one provider. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- Availability engineering, health signals and circuit breakers for provider calls. See [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html).\n- In-person least-cost routing and terminals. See [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n- Interchange and network fees that make one debit network cheaper than another. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- A ranking or review of orchestration vendors; they appear only as contrast, by their own descriptions.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether network tokens provisioned by Stripe survive an export to another processor, and under whose token requestor identifier each company provisions them: not documented. Adyen's terms (13 June 2025) describe a Network Token Sharing Service; whether it covers a full exit is not stated.\n- When Stripe Orchestration leaves private preview, its price, and processors beyond Adyen, Braintree and Worldpay WPG.\n- Adyen's export procedure (an article is listed in its help center but could not be read on 17 November 2026), its timeline and fees, and the destinations its forward endpoint supports: no readable public documentation found.\n- Whether Stripe offers first-attempt least-cost debit routing beyond the documented retry on a US debit network.\n- Whether Visa and Mastercard count a retry through a second acquirer against the same retry limits: network rule texts were not readable.\n- The scale at which per-payment routing pays: no audited or independent figure is public; the chapter gives arithmetic and one merchant account.\n\n## Decision log\n\n- **2026-11-17** — Use Stripe's Orchestration documentation as the main evidence for what a routing layer does not unify, because it is the only primary source that lists the exclusions precisely; say that it is one product in private preview. Rejected: Arguing the line from orchestrator marketing pages; Arguing it from Larkfield alone\n- **2026-11-17** — Give the scale claim as arithmetic (sample size per segment) plus Canva's account, and state plainly that no public figure for the break-even scale exists. Rejected: Quoting a volume threshold; Using Stripe's illustrative $100M example as evidence\n- **2026-11-17** — Place the trade-off table at the end of the evidence section, after the designs, because 'when each design is right' depends on that evidence. Rejected: A trade-off table inside the designs section\n- **2026-11-17** — Treat dedicated orchestrators in one paragraph by their own descriptions and Canva's two buyer tests; no vendor comparison. Rejected: A vendor-by-vendor table\n- **2026-11-17** — Explain K8's switch as moving payments that bring their own credential while stored-card renewals stay with the original provider; record this in the ledger as an addition that explains K8 without changing it. Rejected: Assuming Larkfield duplicated its card vault at both providers\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md, contract 10 — Scope, the Larkfield thread and the terms the chapter owns.\n  - _journals/payments-platform-architecture/journal-spec.json, entry payment-routing-and-orchestration — Intent, acceptance criteria, thesis and role, copied unchanged.\n  - _journals/payments-platform-architecture/_research/brief-optimization-routing-orchestration.md, parts 7 to 9 — The verified claims and their URLs; every load-bearing one was fetched again on 17 November 2026.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — Larkfield's providers, routing rule, K8, volumes and the recurring payments.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md, rulings 8 and 11 — Glosses for 'provider token' and 'balance' with links; the qualification on who acquires.\n- **External**\n  - Stripe documentation: Orchestration (overview, routing, rules, retries, feature support), Vault and Forward, payment data export; n.d., accessed 2026-11-17 — What Stripe's routing product carries and excludes; the forward proxy; the export policy.\n  - Adyen documentation: Forward payment details, Multi pay-in, Network tokenization, Enable Adyen Uplift; n.d., accessed 2026-11-17 — Adyen's forward endpoint, the pilot, the acquired-only limit on network tokens, routing settings.\n  - Stripe Sessions 2026, 'More PSPs, more problems?', Ginet, Krauss (Stripe) and Barton (Canva), April 2026 — The one detailed merchant account and the vendor's statement of trade-offs.\n  - Adyen press release on Intelligent Payment Routing, 2024-09-09; Federal Reserve Regulation II page and press release of 2022-10-03 — Least-cost routing of US debit: the claim and the legal basis.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 96 claims checked (81 confirmed, 8 corrected, 6 hedged, 0 unsupported and removed or relabeled, 0 unreachable, 1 not checked); the page said no Stripe page describes first-attempt least-cost routing and no Adyen export procedure was found: Stripe's support site documents automatic least-cost routing in Australia, and Adyen's help center lists an export article whose link redirects, so it could not be read.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — While drafting, to keep the page under its length limit: the requirements paragraph of what-routing-unifies was dropped (its two vendor quotations moved to the orchestrator paragraph, its unknown-outcome point is made in when-it-goes-wrong) and the older Shopify and Uber posts were dropped as evidence. No unit was reordered.\n- **2026-11-17** — After the flow rubric (sound with notes): pattern labels and reasons corrected for scene, what-routing-unifies, where-they-differ, in-practice and when-it-goes-wrong; the two debit-routing paragraphs merged as the rubric suggested; the stacked-retries paragraph dropped (the rubric found it out of the declared order, and the length limit needed it); the credential store qualified in p19. Not acted on, for the author: moving the three stages into two-kinds, and placing where-they-differ before when-routing-pays (the style guide fixes its position after the trade-offs).\n- **2026-11-17** — First version, written from PLAN contract 10, the journal-spec entry and the optimization brief.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry know[1] (ch9 row 57, ch10 row 73: the guide does not say 'its own'; external acquirer connections are documented) re-synced; journal entry thesis.how_why (same) re-synced; journal entry thesis.how_why (ruling 31a wording, as chapters 22 and 23) re-synced; ruling 28 / K3; ruling 31b; ruling 31a; ch10 verification row 66). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 5 statements of absence re-tested with a wide search (0 overturned, 0 narrowed, 5 hold; table in _research/absence-audit/10-routing-and-orchestration.md). Adyen's export article still redirects to the general tokenization page at a second help-center address; no text changed.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('No Stripe or Adyen page read says whether network tokens sur' -> 'Adyen's terms (13 June 2025) describe a service that shares ').\n- **2026-11-24** — Sweep of rulings 46-48: the statements that neither company says whether network tokens survive a move are replaced by chapter 23's finding (Adyen's Network Token Sharing Service, Additional Services Terms of 13 June 2025; no Stripe statement) in the key point, the exit paragraph, the inference block, the thesis how_why, one supporting claim, one section and one paragraph controlling idea, evidence and the open question (ruling 48d). Source added. No unit added or dropped.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
