<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-2 entry and the part thesis, opening and flow in journal-spec.json, the scenario ledger, and a full reading of the six written chapters of Part II. The page makes no external factual claim of its own: every statement about Stripe, Adyen, a network or a regulation repeats one a chapter of the part makes and cites.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part II answers six questions in order: who acquires the payment, what 'yes' means per payment method, how a payment is modeled as states, why issuers decline and what providers do about it, when to use more than one provider, and what changes at a terminal.\n- **Believe:** An approval is produced in layers around the issuer's decision, and each layer has a different owner.\n- **Be able to:** Pick the Part II chapter that addresses a decline, a late outcome or a provider question in front of them.\n\n**Audience:** Engineers and architects new to payments who have read Part I and are about to start the acceptance chapters, or who arrive with one decline, late outcome or provider question in hand and want the chapter that addresses it.\n\n**Already knows:**\n\n- What an API, a webhook, a retry and a state machine are.\n- Part I: the issuer, the acquirer and the card network; the authorization as the issuer's promise and the first of several; refunds and disputes; who earns what on a payment.\n- Larkfield in outline: a fictional studio-software platform that uses Stripe and Adyen, and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- Acquirer of record, sponsor bank, scheme, mandate, next action, soft decline, orchestration, store-and-forward: each is owned by a Part II chapter and is glossed in a clause here or only named.\n- How Stripe and Adyen differ at each layer; the page states the difference in one clause per chapter and leaves the evidence to the chapter.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the part's claim and name the six chapters' subjects in reading order. *Probe:* After reading only this page: what does Part II claim about approvals, and what will each of the next six chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with the 1,140 Larkfield studios charged through Stripe online and through Adyen at the front desk, with the figures as the scenario ledger gives them. | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** What decides whether a payment gets to 'yes', and what can a provider or a merchant do about it?\n\n> **Claim:** A 'yes' is produced in layers that sit around the issuer's decision: the licensed entity that acquires the payment, the payment method and what its scheme lets 'yes' mean, the provider's model of the payment between request and outcome, the changes and retries the provider makes inside the authorization call, the choice among providers, and, when the card is in the room, the terminal. Each layer changes how often the answer is yes or whether that yes can later be taken back. The provider holds the license and makes the changes inside the call; the merchant chooses the methods it offers, the providers it uses and the devices it deploys; so an approval is an outcome both help produce.\n\n**Disputed by:** The view that approval is the issuer's verdict on the cardholder and the provider is a neutral pipe to the network, so that the approval rate would be the same on any provider and a 'yes' means the same thing for every payment method.\n\n**So what:** A team that accepts the claim stops reading its approval rate as a fact about its customers. It asks which layer produced a decline before changing anything, and it does not compare two providers' rates or published uplift figures without first lining up the acquirer, the method mix and the metric.\n\n**How and why:** The issuer decides on what reaches it: a payment that arrives as domestic or cross-border, on one network or another, with a card number or a network token, formatted one way or another, once or after a retry. Every one of those inputs is set before the issuer sees the message, by the license the provider holds or borrows, by the method chosen at checkout, and by code the provider runs inside the call. For methods that are not cards there may be no issuer answer at all, only a scheme rule about when the money is final. Stripe and Adyen document different arrangements at most of these layers, and neither publishes a list of its network memberships by network and country, volume per acquirer or an audited approval lift; the part's argument rests on what they do publish.\n\n**Supporting claims**\n\n- **P2-1** — Reaching a card network takes a membership held by a licensed entity, so the acquirer of record is a legal fact that differs by country and decides how a payment arrives at the issuer and how many parties stand between the merchant and the network.\n- **P2-2** — What 'yes' promises is fixed by each payment method's scheme, so one API can unify how a payment is started and reported and cannot unify what its success means.\n- **P2-3** — The outcome of a payment is a state reached over time, so a payment must be modeled as a record with explicit states in which the synchronous response is one transition and not the result.\n- **P2-4** — Providers now reformat, retry, reroute and block inside the authorization call, so the approval rate is partly the provider's product, and the uplift figures published for it cannot be compared or verified from public data.\n- **P2-5** — Routing across providers unifies the authorization request and nothing after it, so a second provider is paid for in per-provider disputes, settlement, records and stored cards.\n- **P2-6** — When the card is present, approval and fraud liability depend on a managed device and the chip data it passes on, and treating store and online payments as one has to be built from shared identifiers, refunds and reports.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis, links it to the authorization of Part I and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the six chapter paragraphs, in the part's reading order)\n\nThe page opens on one card at one studio that reaches its bank through two providers, widens that case into the part's claim, and then narrows: from the claim (a 'yes' is produced in layers), to who holds each layer and what follows for an approval rate, to how far the public evidence carries the claim, to the six questions in order, to one paragraph per chapter. The claim has to precede the chapter list because each chapter paragraph names its layer, and a reader who has not been told there are layers reads the list as six unrelated topics. The evidence paragraph has to precede the list because the chapter paragraphs state what Stripe and Adyen document, and the reader should know first that these are documented arrangements with stated gaps. The chapter paragraphs keep the part's own reading order, which the journal spec justifies as the order in which a 'yes' is constrained; reordering them here would contradict the roadmap.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At 1,140 Larkfield studios in the Netherlands and Germany, a member who renews her membership online is charged through Stripe, and the same member tapping the same card at the front desk is charged through Adyen. One card, one studio, one bank deciding; two providers, two routes to that bank, and two records of what 'approved' meant.\n\n**Bridge:** Part I's view of the authorization as a message that goes to the issuer and comes back with an answer. → The provider's side of that message: who is allowed to send it, in what form, how many times, and what the answer is recorded as.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraphs p03 and p04; bullet 3 (an approval rate belongs to a setup and cannot be compared until the setup is held equal) is the so-what stated in p04 and qualified by p05.): A 'yes' is produced in layers around the issuer's decision (the acquirer and its license, the payment method, the provider's model of the payment, the provider's actions inside the authorization call, the choice among providers and, at a counter, the terminal), and both the provider and the merchant help produce it.\n\n**Roadmap** (paragraph p06):\n\n- Six chapters in the order a 'yes' is constrained: who acquires the payment and under which license; what 'yes' means for methods that are not cards; how a payment is modeled as states; why issuers decline and what providers do inside the call; when a second provider helps and what it costs; and what changes when the card is in the room. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | At 1,140 Larkfield studios one member's card reaches the same bank through two providers, Stripe online and Adyen at the front desk, so one card produces two routes and two records of what 'approved' meant. | scenario: Larkfield (fictional): 1,140 studios in the Netherlands and Germany, onboarded before 2024, are on Stripe for online payments and use Adyen terminals at the front desk.; scenario: Per Larkfield's acquirer inventory in chapter 6: online at these studios the acquirer is Stripe Technology Europe, an Irish e-money institution; at the front desk it is Adyen N.V., a Dutch bank (both as the providers' public pages name them, November 2026).; figure: Figure 1: one member and one card; two paths to one issuing bank, one from a phone through 'Provider A', one from a counter terminal through 'Provider B'; each path ends in its own record. |  |\n| p02 | context | Part I took the authorization as a message that goes to the issuer and returns with an answer; Part II looks at the provider's side of that message: who may send it, in what form, how many times, and what the answer is recorded as. | reasoning: Part I's account: the authorization is the issuer's promise, the first of several, and an approved payment is worth more to every party than a declined one (payment-authorization, payment-economics). | `elaboration`: The two routes to one bank in the opening case, and Part I's authorization as the issuer's promise. → The path to that promise as the subject of Part II: who sends the message, in what form, how often, and how the answer is recorded. |\n| p03 | claim | Part II's claim is that a 'yes' is produced in six layers that sit around the issuer's decision (the acquirer and its license, the payment method, the provider's model of the payment, the provider's actions inside the authorization call, the choice among providers, and the terminal), and each layer changes how often the answer is yes or whether that yes can later be taken back. | reasoning: The six layers of the part thesis: the licensed entity that acquires the payment; the payment method and what its scheme lets 'yes' mean; the provider's model of the payment between request and outcome; the changes and retries the provider makes inside the authorization call; the choice among providers; and, when the card is in the room, the terminal.; figure: Figure 2: the issuer's decision at the center with six layers around it, labeled 'Acquirer', 'Method', 'State model', 'Optimization', 'Providers', 'Device'. | `cause_effect`: The provider's side of the authorization message. → What that side amounts to: six layers around the issuer's decision, each changing the rate of 'yes' or its permanence. |\n| p04 | analysis | The layers have two holders, the provider (the license, the model of the payment and the changes inside the call) and the merchant (the methods, the providers and the devices), so an approval is an outcome both help produce and an approval rate describes a setup, not the customers. | reasoning: The part thesis: the provider holds the license and makes the changes inside the call; the merchant chooses the methods it offers, the providers it uses and the devices it deploys. Its so-what: a team does not compare two providers' rates without first lining up the acquirer, the method mix and the metric. | `additional_support`: The six layers. → Who holds each of them, and what that does to the meaning of an approval rate. |\n| p05 | context | The part argues from what Stripe and Adyen publish, which differs at most layers and stops short of network membership per country, volume per acquirer and any audited approval lift. | fact: As the chapters establish and cite: neither company lists its network memberships by network and country (each states membership in general terms) or publishes volume per acquirer (acquiring-and-network-connectivity); the uplift figures each publishes for its optimization product are its own claims, on different metrics, and none was audited by a third party (authorization-optimization). | `contrast`: The claim and its consequence for approval rates. → The limit of the evidence behind it: what the two companies document and what neither publishes. |\n| p06 | transition | The six chapters take the layers in the order a 'yes' is constrained, each opening on a case at Larkfield: who acquires, what 'yes' means per method, how a payment is modeled as states, why issuers decline and what providers do, when a second provider helps, and what changes at a terminal. | reasoning: The part's roadmap and flow rationale: connectivity decides which networks can be reached at all; methods are what those connections carry; the state machine holds both instant and late answers; only then can optimization, routing and the terminal be explained. | `sequence`: The claim, its holders and the limits of its evidence. → The six questions in reading order, and that each chapter opens on a Larkfield case. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the six chapters answers one question about one layer of a 'yes' and opens on one Larkfield case, and each relies on the chapters before it.\n\n**Advances the thesis** (P2-1, P2-2, P2-3, P2-4, P2-5, P2-6): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The six questions in order (p06). → One paragraph per chapter: the question in bold, the Larkfield case it opens on and the difference between Stripe and Adyen it documents.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. The acquirer decides which networks and schemes can be reached, so it comes first; methods are what those connections carry and show that 'yes' has more than one meaning; the state machine is the model that holds both the card's instant answer and the other methods' late ones. Optimization needs the 'attempt' the state machine defines, routing needs one provider's levers to weigh a second against, and the terminal chapter reuses every earlier term with a device added. Moving optimization ahead of the state machine would ask the reader to follow a retry before knowing what an attempt is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | The acquiring chapter answers who acquires the payment and under which license: reaching a card network takes a membership only a licensed entity can hold, so every payment has an acquirer of record that differs by country, and Larkfield finds four acquiring arrangements behind its two providers. | scenario: Femke de Graaf's acquirer inventory of February 2027 (fictional): four acquiring arrangements behind two providers; the United States, with 700 studios, is the only market with a bank between the studio and the network.; fact: As chapter 6 documents: Adyen holds one banking license (2017) extended by branches; Stripe names its own e-money institutions as acquirer in the EEA and the UK and named banks in the United States. |  |\n| p08 | description | The methods chapter answers what 'yes' means when the method is not a card: one API unifies how a payment is started and reported and cannot unify what success promises, as Larkfield learned by treating direct debits, 21% of its online volume, like cards. | scenario: Larkfield (fictional): SEPA Direct Debit carries 21% of online volume and one rule, 'paid grants access and counts toward payout', was applied to every method.; fact: As chapter 7 documents: an iDEAL payment cannot be disputed through the payer's bank; a SEPA direct debit can be refunded without a reason for eight weeks (PSD2). | `contrast`: Card networks, which hand back an issuer's answer in seconds. → Methods with no issuer answer, no hold or no chargeback, where 'yes' means something else. |\n| p09 | description | The state-machine chapter answers how to model a payment whose outcome arrives over time: as one long-lived record with explicit states in which the API response is one transition, which Stripe exposes as a retrievable object and Adyen as result codes and webhooks. | scenario: Mila Janssen's membership set-up of 12 January 2027 (fictional): the provider's answer is neither approved nor declined, because her bank wants her to confirm in its app; Larkfield's five-state record has no clear place for the wait.; fact: As chapter 8 documents: Stripe's PaymentIntent (2018) can be retrieved by its ID; Adyen's Checkout API has no endpoint that returns a payment by its identifier. | `problem_solution`: Methods that answer at different times and may need the customer to act. → The one model that holds all of them: a record with explicit states. |\n| p10 | description | The optimization chapter answers why issuers decline genuine payments and what providers do about it: they reformat, retry and block inside the authorization call, so the approval rate is partly their product, and Larkfield's two December rates, 82.0% and 95.5%, turn out to differ mostly in how they were counted. | scenario: Larkfield (fictional, illustrative figures): December card renewals read 82.0% on Stripe and 95.5% on Adyen; counted on one basis the 13.5-point gap becomes 0.8 points at the first attempt and 0.4 points per renewal.; fact: As chapter 9 documents: Stripe states an acceptance rate 3.8% higher on average (2025) and Adyen payment conversion up to 6% higher in a pilot (January 2025), on different metrics. | `elaboration`: The state machine's 'attempt': a failed one returns the payment to a state from which another can be made. → Several network attempts behind one API call, and how to count a rate over them. |\n| p11 | description | The routing chapter answers when a second provider helps and what it costs: a routing layer unifies the authorization request and nothing after it, so Larkfield keeps its rule 'the studio's provider' with a rehearsed switch instead of buying orchestration. | scenario: Larkfield (fictional): CTO Daniel Osei proposes an orchestration product in February 2027; Keel decision K8 keeps two providers and one rehearsed switch, rehearsed quarterly for the 50 largest studios.; fact: As chapter 10 documents: disputes, settlement, balances and stored cards stay one set per provider; telling two routes apart by half a percentage point takes about 115,000 payments in one segment (the chapter's arithmetic under a stated assumption). | `problem_solution`: One provider's levers, which the merchant cannot inspect. → The usual proposal, a second provider with a layer that routes between them, and its cost. |\n| p12 | description | The in-person chapter answers what changes when the card is in the room: a terminal joins the payment path, a payment stored offline is credit the merchant extends, and treating store and online payments as one takes three properties that are checked separately, as a refund request at one of the 1,140 split studios shows. | scenario: Larkfield (fictional): in February 2027 a studio owner in Cologne asks for the terminal to keep working without Wi-Fi, and a member at one of the 1,140 split studios asks at the counter for a refund of a pass bought in the app.; fact: As chapter 11 documents: in store-and-forward the terminal stores the payment and asks the issuer later, and Stripe and Adyen both document that the loss is the merchant's. | `contrast`: Five chapters that assumed a payment made at a distance. → The same card tapped at a counter, with a device in the path. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the six chapters turn any decline, late outcome or provider question into a question about one layer, so the reader can enter at the layer in front of them; read from the start, each chapter's terms are in place before the next one uses them.\n\n**So what:** When a payment is declined, delayed or approved and later taken back, the reader asks which layer decided it before changing anything.\n\n**Callback:** The opening's member at one of the 1,140 studios whose card reaches one bank through two providers (p01). The reader is told that by the end of the part the two routes will read as two stacks of the same six layers.\n\n**Takeaway** (`course_of_action`): Begin with the acquiring chapter, the first layer: who is allowed to send the payment to the network.\n\n**Hand-off** to [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html): `elaboration`: The part intro's claim that a 'yes' is shaped in layers before the issuer decides, and Part I's acquirer as one box in the four-party model. → What is inside that box: a network membership, the license that permits it, and the different ways Stripe and Adyen hold both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | synthesis | The six chapters let a reader place a decline, a late outcome or a provider question in one layer, and by the end of the part the opening card's two routes read as two stacks of the same six layers; the first layer is the acquirer. |  |  |\n\n## Non-goals\n\n- Teaching acquiring, method semantics, the state model, optimization, routing or terminals; the page summarizes and does not re-argue the chapters. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html), [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html), [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html), [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html), [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n- The part's closing (the six layers side by side, each with its owner, and what follows for Keel decision K8). See [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure-pattern callout and Questions to Ask; part intros do not carry them (style guide).\n- External factual claims of the page's own; every company, network and regulatory statement repeats a chapter of the part, which cites it.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The closing sentence 'Begin with …' sits under its own heading, 'Where to Begin', as the conclusion's one paragraph. Rejected: Ending the 'Chapters in this part' section with it, as the intro brief words it: the draft checker reads a conclusion only from a heading of its own, and the sibling book's part intros use the same heading.\n- **2026-11-17** — The hook names the two acquiring entities of the split studios from chapter 6's inventory. Rejected: Leaving the two 'routes' abstract: the entities make the puzzle concrete and are already in the part.\n- **2026-11-17** — The six-layers table with owners is left to chapter 11, which carries the part's closing; the intro names the layers and the two holders only. Rejected: A layer-by-owner table here, which would pre-empt the closing synthesis.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-2: thesis, opening, flow, transition_in; post entry part-2) — Intent, thesis, role, hook, bridge, roadmap and the order of chapters.\n  - _research/scenario-ledger.md — The 1,140 split studios, Keel decision K8, Mila's membership set-up, the additions by chapters 6 to 11.\n  - posts/06-acquiring-and-network-connectivity, 07-local-payment-methods, 08-payment-state-machines, 09-authorization-optimization, 10-routing-and-orchestration, 11-in-person-payments (index.md, read in full) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n  - _research/consistency-issues.md (rulings 11, 12) — The qualified wording of Stripe's and Adyen's acquiring routes and of where Adyen's payment state can be read.\n\n## Changelog\n\n- **2026-11-17** — Spec created from the journal spec and the six written chapters of Part II.\n- **2026-11-17** — After the flow rubric: p03 now names the six layers in its controlling idea and p04 assigns the payment model to the provider, so p04 and p05 rest on named terms. Notes not acted on: the roadmap paragraph (p06) is kept although the chapter list repeats its six questions, because the style guide and AC-1 ask for the reading order in the lead; the chapter paragraphs for routing and in-person payments name Larkfield's rule and the three properties without explaining them, which <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
