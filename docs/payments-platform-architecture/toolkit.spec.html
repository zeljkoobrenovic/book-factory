<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The sixteen cards and templates: payment state card, idempotency key card, webhook consumer contract, provider comparison card, funds-flow diagram template, reconciliation card, payout exception card, dispute evidence card, PCI scope card, routing rule card, platform liability card, onboarding requirement tracker, billing retry schedule card, peak plan, provider exit plan card and architecture decision record; the question each answers and the chapter that teaches it.\n- **Know:** That every card asks for the same three things: the record that counts as the truth, an owner for the exception, and a date or deadline.\n- **Know:** That the filled examples use Larkfield's fictional facts and are to be replaced, and that the provider comparison card is filled only from dated sources or 'Not public'.\n- **Be able to:** Pick the card for the question on their desk, copy its fields and fill it with their own facts.\n- **Be able to:** Start with the three cards the book's last chapter names (payment state, idempotency key, reconciliation) and say what each must contain for one money-moving call of their own.\n- **Be able to:** Keep the cards current: review on a calendar, let incidents add fields, drop fields nobody reads.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a question from their own work, the reader picks the card that answers it and the chapter that teaches it. *Probe:* Using only this page: a nightly job that pays out to sellers sometimes times out and is re-run by hand, and last month 30 payouts came back from the receiving banks without anyone noticing for two weeks. Which two cards do you fill in first, which chapters teach them, and which three things does every card ask for? | `custom` | cold_reader | major |\n| AC-2 | The reader fills the idempotency key card correctly for a case the page does not contain. *Probe:* Using only this page: fill the idempotency key card for 'refund order 8841 in full' in a shop that lets support agents click Refund more than once. What is the key built from, what must it not be built from, and what do you do when the first call times out? | `custom` | cold_reader | major |\n| AC-3 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which cards and templates do the chapters introduce, and what do the sixteen have in common that makes filling them worth a team's time?\n\n> **Claim:** A team that cannot write down, for a recurring payment question, the record that counts as the truth, an owner for the exception and a date or deadline has not yet decided that question, and the toolkit's sixteen cards force the decision before an incident does. Each card is introduced by the chapter that raises its question, from the payment state card ('what state is this payment in') through the idempotency key card, the webhook consumer contract and the reconciliation card to the provider exit plan card ('how would we leave this provider'), and each asks for those same three things.\n\n**Disputed by:** The view that a payment integration is already documented by its code, its provider dashboard and the provider's documentation, so that separate cards duplicate them and go stale, and that what a team left undecided is cheaper to learn from its first incident than to write down in advance.\n\n**So what:** A team fills three cards (payment state, idempotency key, reconciliation) for its own integration before its next release, and treats a blank owner or a blank deadline on any card as work to do now, not as a detail to settle after an incident.\n\n**How and why:** Code and dashboards record what a system does when the answer arrives; they do not record who acts when it does not, and that is the case the book's failure patterns come from. Each card is the smallest form that forces the missing decision into writing. At Larkfield no document said what key a renewal retry must send, which system's record of a membership payment was the truth, or who owned a returned payout; the Double Charge, the Silent Webhook and the Payout That Bounced were found by members and studios first.\n\n**Supporting claims**\n\n- **S1** — A recurring payment question leads through one table to the card that answers it and the chapter that teaches it.\n- **S2** — Each card asks for the same three things, the record that counts as the truth, an owner for the exception and a date or deadline, and is filled once with Larkfield's fictional facts.\n- **S3** — The cards cite each other and meet at the payment state card and the reconciliation card, so a change to one says which others to re-read.\n\n## Role in the part\n\nGives the part the working records: one card per recurring question, so a decision taught in a chapter can be recorded without rereading it, and gives the book's closing takeaway its destination. Supports PR-2 of part `reference`.\n\n## Flow\n\n**Pattern:** `grouping`\n\nThe lookup table and the map of connections come first, because a reader arrives with a question and must find the card and see where it sits before reading any card. The sixteen cards then follow grouped by the part of the book whose chapter teaches them, in book order, so that a card can use the records of earlier ones: the payout exception and reconciliation cards use the states of the payment state card, the webhook contract moves those states, the exit plan card uses the routing rule and the PCI scope card. The decision record comes last because it changes rows on all the others. Moving the lookup behind the cards would make the page readable only front to back; the closing on upkeep needs all sixteen.\n\n## Introduction\n\n**Hook** (`direct_statement`): A team that cannot write down, for a recurring payment question, the record that counts as the truth, an owner for the exception and a date has not decided that question.\n\n**Bridge:** The reader has met each question in its chapter, with Larkfield's answer and a list of questions to ask, and now has the same question about their own integration. → This page turns sixteen of those questions into cards to copy, each with a filled Larkfield example and a link to its chapter.\n\n**Thesis statement** (KEY POINTS callout and paragraph p001): A team that cannot write down the record that counts as the truth, an owner for the exception and a date or deadline has not decided the question; sixteen cards force the decision before an incident does.\n\n**Roadmap** (IN THIS SECTION callout and paragraphs p001 and p004):\n\n- Find the card for the question on your desk. *Kept in:* find.\n- How the cards cite each other. *Kept in:* connect.\n- Sixteen cards grouped by the book's parts, among them the payment state card, the idempotency key card and the reconciliation card to start with, through to a provider exit plan card and an architecture decision record, each with its fields, a filled Larkfield example and its chapter. *Kept in:* tool-1, tool-2, tool-3, tool-4, tool-5, tool-6, tool-7, tool-8, tool-9, tool-10, tool-11, tool-12, tool-13, tool-14, tool-15, tool-16.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p001 | claim | A team that cannot write down the record that counts as the truth, an owner for the exception and a date has not decided a payment question, and this page gathers sixteen cards that force that decision, each built from the chapter that raises its question, with the glossary for the terms the cards leave undefined. |  |  |\n| p002 | explanation | The filled examples use Larkfield, the book's fictional studio-software platform, its named incidents of 2025 and 2026 (told on the Larkfield page), its 2027 Keel program of eight numbered decisions, K1 to K8, each keyed in a few words, and its people, and the reader replaces every name, date and figure with their own. | scenario: Larkfield, Keel decisions K1 to K8, the cast and the systems named by role. | `elaboration`: The sixteen cards and their chapters. → Whose facts fill the examples and how to read them. |\n| p003 | recommendation (list) | Three conventions hold for every card: it names the record that counts as the truth (the record a doubt is settled against: for a fact the record that wins a disagreement, for a plan or decision the rehearsal or measure that shows it works), an owner for the exception and a date; a provider's behavior is written with its source and date or as Not public; and a blank is work to do now. |  | `sequence`: The fictional examples. → The three conventions every card follows. |\n| p004 | recommendation | A team starts with three cards for one money-moving call of its own: the payment state card, the idempotency key card and the reconciliation card. |  | `emphasis`: The conventions all sixteen cards share. → The three cards to fill first. |\n\n## Sections\n\n### Find the Card for the Question on Your Desk\n\n**Controlling idea** (`description`, id `find`): A question from the reader's own work leads through one table to the card that answers it, the part of the book it belongs to and the chapter that teaches it.\n\n**Advances the thesis** (S1): Gives the lookup from question to card, part and chapter.\n\n**Transition in:** `sequence`: The three cards to start with. → The lookup from any question to its card.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p005 | description | Sixteen recurring questions, grouped by the book's parts (with Tool 15 placed in Part X beside the comparison card, as the Part X chapter advises, and Tool 16 serving every part), each lead to one card and to the chapter that teaches it. | table: Question, tool, part and teaching chapter for Tools 1 to 16. |  |\n| p006 | explanation | The plan named these sixteen as cards while the chapters teach them as questions and worked records, so each card here is built from its chapter's Larkfield section and its Questions to Ask, and six further working records stay in their own chapters. |  | `elaboration`: The sixteen cards and their chapters. → How the cards were built from the chapters, and which records are not repeated here. |\n\n### How the Cards Connect\n\n**Controlling idea** (`explanation`, id `connect`): The cards cite each other and meet at two of them, the payment state card and the reconciliation card, so a change to one card says which others to re-read.\n\n**Advances the thesis** (S3): Shows how the cards cite each other and where they meet.\n\n**Transition in:** `sequence`: The sixteen cards found by question. → How they connect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p007 | claim | Most changes touch several cards, and the cards meet at the payment state card, which says what the team believes about a payment, and the reconciliation card, which says how that belief is checked against the provider's report. | figure: One illustration placeholder: the cards around the payment state card and the reconciliation card. |  |\n| p008 | explanation | In plain words, a card that changes what moves a payment into a state or which report line proves it changes the two central cards as well, and a decision record names the cards it changes. |  | `elaboration`: The figure of the connected cards. → The rule it implies in plain words. |\n\n### <a id=\"tool-1\"><\/a>Tool 1: Dispute Evidence Card\n\n**Controlling idea** (`description`, id `tool-1`): The dispute evidence card (Part I): the decision it records, its blank template, when to fill it and who owns it, the same card filled for Larkfield, and the chapter that teaches it.\n\n**Advances the thesis** (S2): One card that asks for the record that counts as the truth, an owner and a date, filled once with Larkfield's facts.\n\n**Transition in:** `sequence`: How the cards connect. → Tool 1, taught in refunds-reversals-and-disputes (Part I).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p009 | definition | The dispute evidence card records, before any dispute arrives, which evidence a sale leaves behind, which message starts the deadline, who answers and by what policy in amounts. |  |  |\n| p010 | description | The template asks for the message that starts the deadline and the provider's deadline, an owner, the evidence created at the sale and at delivery with the identifier that links it to the payment, the policy in amounts, the record that is the truth and the state that ends the dispute. | table: The blank fields of the dispute evidence card. | `elaboration`: The decision the card records. → Its blank fields. |\n| p011 | recommendation | The policy rows are filled once per provider in a calm month and the case rows on the day a dispute record is created, by the person who owns disputes. |  | `sequence`: The fields. → When to fill them and who owns the card. |\n| p012 | example | Bram de Wit's €120.00 dispute at Studio Noord fills the card: notified on 24 February 2027, due on 5 April, owned by Jonas Weber, defended once on 3 March with a logged-in session and two check-ins, and won at a cost of the €15.00 fee. | scenario: The card filled with Larkfield's facts from refunds-reversals-and-disputes. | `example`: The card and its owner. → The same card filled in for Larkfield. |\n| p013 | explanation | The evidence existed only because the booking app had written it for scheduling under identifiers it shares with the payment, and it could not have been produced after the notification. |  | `elaboration`: The filled card. → What the filled card shows that the blank one cannot. |\n| p014 | transition | The Taught in line links the chapter whose Larkfield section and questions the dispute evidence card is built from, and the chapters that use it. |  | `sequence`: The card and its example. → The chapters that teach and use it. |\n\n### <a id=\"tool-2\"><\/a>Tool 2: Payment State Card\n\n**Controlling idea** (`description`, id `tool-2`): The payment state card (Part II): the decision it records, its blank template, when to fill it and who owns it, the same card filled for Larkfield, and the chapter that teaches it.\n\n**Advances the thesis** (S2): One card that asks for the record that counts as the truth, an owner and a date, filled once with Larkfield's facts.\n\n**Transition in:** `sequence`: The previous card, the dispute evidence card. → Tool 2, taught in payment-state-machines (Part II).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p015 | definition | The payment state card records what each state of the team's own payment record promises and which provider message or read may move a row into it. |  |  |\n| p016 | description | The template asks, per state, for its promise and the message or read that moves a row into it at each provider, and once for the whole record for the waiting party, the stored provider status, the child records, the sweep, the meaning of paid, an owner for an unknown status and a review date. | table: The blank fields of the payment state card. | `elaboration`: The decision the card records. → Its blank fields. |\n| p017 | recommendation | The card is filled before the first integration and re-read whenever a provider, a payment method or an API version is added, by the owner of the payment record. |  | `sequence`: The fields. tract records what a receiver may assume about a provider's events and what it does when an event never arrives. |  |  |\n| p052 | description | The template asks, per provider, for the acknowledgement and its time, the retry window and what can be read back afterwards, the record an event is confirmed against, the sweep, what an unconfirmed payment looks like to staff, and who is alerted when events stop. | table: The blank fields of the webhook consumer contract. | `elaboration`: The decision the card records. → Its blank fields. |\n| p053 | recommendation | One contract is filled per provider endpoint before it receives live events and tested by switching the endpoint off, by the team that owns the receiver. |  | `sequence`: The fields. → When to fill them and who owns the card. |\n| p054 | example | Larkfield's two receivers under K2 fill the contract: verify, store, acknowledge, confirm against the provider's own record, and sweep renewals that stay pending. | scenario: The card filled with Larkfield's facts from payment-webhooks-and-events. | `example`: The card and its owner. → The same card filled in for Larkfield. |\n| p055 | explanation | Replayed under the contract, the expired certificate of 14 September 2026 leaves rows wrong for about half an hour and not for nine hours. |  | `elaboration`: The filled card. → What the filled card shows that the blank one cannot. |\n| p056 | transition | The Taught in line links the chapter whose Larkfield section and questions the webhook consumer contract is built from, and the chapters that use it. |  | `sequence`: The card and its example. → The chapters that teach and use it. |\n\n### <a id=\"tool-9\"><\/a>Tool 9: PCI Scope Card\n\n**Controlling idea** (`description`, id `tool-9`): The PCI scope card (Part V): the decision it records, its blank template, when to fill it and who owns it, the same card filled for Larkfield, and the chapter that teaches it.\n\n**Advances the thesis** (S2): One card that asks for the r n\n**Transition in:** `sequence`: The previous card, the onboarding requirement tracker. → Tool 13, taught in payment-peak-load (Part VIII).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p081 | definition | The peak plan records, for a peak the team can predict, the rate it needs, the limit it meets first at each provider, what gives way and what no customer is told. |  |  |\n| p082 | description | The template asks for the peak and its size, the first limit at each provider and whether it is documented or agreed in writing, the pacing, the order in which work is served, the state for a charge not attempted yet, the signals watched, an owner and the date of the last rehearsal. | table: The blank fields of the peak plan. | `elaboration`: The decision the card records. → Its blank fields. |\n| p083 | recommendation | The plan is filled a calm month before each predictable peak and rehearsed before it is trusted, by the owner of the job that causes the peak. |  | `sequence`: The fields. → When to fill them and who owns the card. |\n| p084 | example | Larkfield's renewal wave under K5 fills the plan: about 357,000 renewals paced over 18 hours through one token bucket per provider, with checkout served before the batch. | scenario: The card filled with Larkfield's facts from payment-peak-load. | `example`: The card and its owner. → The same card filled in for Larkfield. |\n| p085 | explanation | The unpublished limit sets the length of the run, because the peak's Adyen share of about 200,000 renewals at 5 a second needs 11.1 hours. |  | `elaboration`: The filled card. → What the filled card shows that the blank one cannot. |\n| p086 | transition | The Taught in line links the chapter whose Larkfield section and questions the peak plan is built from, and the chapters that use it. |  | `sequence`: The card and its example. → The chapters that teach and use it. |\n\n### <a id=\"tool-14\"><\/a>Tool 14: Provider Comparison Card\n\n**Controlling idea** (`description`, id `tool-14`): The provider comparison card (Part X): the decision it records, its blank template, when to fill it and who owns it, the same card filled for Larkfield, and the chapter that teaches it.\n\n**Advances the thesis** (S2): One card that asks for the record that counts as the truth, an owner and a date, filled once with Larkfield's facts.\n\n**Transition in:** `sequence`: The previous card, the peak plan. → Tool 14, taught in stripe-and-adyen-bets-compared (Part X).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p087 | definition | The provider comparison card records, per bet and per country, what each provider has documented, with a date and a source or the words Not public, and what the team's own system does about the difference. |  |  |\n| p088 | description | The template has one row per bet and country, a cell per provider holding a dated fact with its source or Not public, the kind of difference, what the team's own system does, whom the team asked, and the date the row was last read. | table: The blank fields of the provider comparison card. | `elaboration`: The decision the card records. → Its blank fields. |\n| p089 | recommendation | The card is filled before a provider is chosen, kept or dropped and re-read every half-year, by the person who would have to defend the choice. |  | `sequence`: The fields. → When to fill them and who owns the card. |\n| p090 | example | Larkfield's card of October 2027 has six rows, from the acquirer and holder of funds to the platform model, and from it Larkfield decides to keep both providers. | scenario: The card filled with Larkfield's facts from stripe-and-adyen-bets-compared. | `example`: The card and its owner. → The same card filled in for Larkfield. |\n| p091 | explanation | The card fails by going stale, so every row carries its date and Larkfield reads it again in the half-yearly slot it keeps for API upgrades. |  | `elaboration`: The filled card. → What the filled card shows that the blank one cannot. |\n| p092 | transition | The Taught in line links the chapter whose Larkfield section and questions the provider comparison card is built from, and the chapters that use it. |  | `sequence`: The card and its example. → The chapters that teach and use it. |\n\n### <a id=\"tool-15\"><\/a>Tool 15: Provider Exit Plan Card\n\n**Controlling idea** (`description`, id `tool-15`): The provider exit plan card (Part X): the decision it records, its blank template, when to fill it and who owns it, the same card filled for Larkfield, and the chapter that teaches it.\n\n**Advances the thesis** (S2): One card that asks for the record that counts as the truth, an owner and a date, filled once with Larkfield's facts.\n\n**Transition in:** `sequence`: The previous card, the provider comparison card. → Tool 15, taught in tokenization-vaulting-and-pci (Part X).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p093 | definition | The provider exit plan card records how stored cards and running payments would leave a provider: by what procedure, in how many weeks and what does not travel; it sits in Part X because the Part X chapter says to keep it beside the comparison card. |  |  |\n| p094 | description | The template asks, per provider, who holds the vault, under whose identifier network tokens are issued, how cards leave, to whom, in how many weeks and at what fee, what does not travel, an owner and the date the answers were last checked. | table: The blank fields of the provider exit plan card. | `elaboration`: The decision the card records. → Its blank fields. |\n| p095 | recommendation | One card is filled per provider while the team does not need it and checked at every rehearsal of the switch, by the owner of the provider relationship. |  | `sequence`: The fields. → When to fill them and who owns the card. |\n| p096 | example | Larkfield's exit answers of 2027 fill the card: each provider holds the cards saved through it, network tokens are treated as not portable, and cards leave by a transfer between providers planned in weeks. | scenario: The card filled with Larkfield's facts from tokenization-vaulting-and-pci. | `example`: The card and its owner. → The same card filled in for Larkfield. |\n| p097 | explanation | The rehearsed switch of K8 moves no stored card, so the card that says how about 940,000 monthly renewals would leave is a separate record. |  | `elaboration`: The filled card. → What the filled card shows that the blank one cannot. |\n| p098 | transition | The Taught in line links the chapter whose Larkfield section and questions the provider exit plan card is built from, and the chapters that use it. |  | `sequence`: The card and its example. → The chapters that teach and use it. |\n\n### <a id=\"tool-16\"><\/a>Tool 16: Architecture Decision Record\n\n**Controlling idea** (`description`, id `tool-16`): The architecture decision record (All parts): the decision it records, its blank template, when to fill it and who owns it, the same card filled for Larkfield, and the chapter that teaches it.\n\n**Advances the thesis** (S2): One card that asks for the record that counts as the truth, an owner and a date, filled once with Larkfield's facts.\n\n**Transition in:** `sequence`: The previous card, the provider exit plan card. → Tool 16, taught in acquiring-and-network-connectivity (All parts).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p099 | definition | An architecture decision record keeps a decision with its reasons, the option that was declined, the record that will show whether it worked, an owner and a review date. |  |  |\n| p100 | description | The template asks for the decision, its status and date, the options with the one declined and why, the cards it changes, the record that will show whether it worked, an owner and a review date or trigger. | table: The blank fields of the architecture decision record. | `elaboration`: The decision the card records. → Its blank fields. |\n| p101 | recommendation | A record is written for every decision that changes a row on another card, on the day it is taken, and a later decision supersedes it and does not edit it. |  | `sequence`: The fields. → When to fill them and who owns the card. |\n| p102 | example | Keel decision K8 fills the record: in February 2027 an orchestration product with per-payment routing was declined, the per-studio rule was kept and a quarterly rehearsed switch was adopted. | scenario: The card filled with Larkfield's facts from acquiring-and-network-connectivity. | `example`: The card and its owner. → The same card filled in for Larkfield. |\n| p103 | explanation | Larkfield's 2024 record that added Adyen gave local acquiring as a reason and named no measure, so in 2027 it stands in the acquirer inventory as effect not measured. |  | `elaboration`: The filled card. → What the filled card shows that the blank one cannot. |\n| p104 | transition | The Taught in line links the chapter whose Larkfield section and questions the architecture decision record is built from, and the chapters that use it. |  | `sequence`: The card and its example. → The chapters that teach and use it. |\n\n## Conclusion: Keeping the Cards True\n\n**Synthesis:** The sixteen cards are one question asked sixteen times: which record counts as the truth, who acts when it disagrees with what the team believed, and by when. A card that no longer matches the system gives a wrong answer to all three with the same confidence.\n\n**So what:** A stale card is worse than none because people trust its owner and its date, so the upkeep of the cards is part of the decision and three habits carry it.\n\n**Callback:** The opening statement that a team which cannot write down the record, the owner and the date has not decided the question. A card whose date has passed or whose owner has left is the same undecided question, written down.\n\n**Takeaway** (`course_of_action`): Fill the payment state card, the idempotency key card and the reconciliation card for one money-moving call before the next release; review every card on a calendar, let incidents add fields and drop fields nobody reads.\n\n**Hand-off** to [Glossary: Plain-Language Definitions and a Stripe–Adyen Crosswalk](glossary.html): `elaboration`: The toolkit's cards, whose fields use terms such as idempotency key, clearing account, payout return and PCI scope without defining them. → Every term the book uses, defined and linked to its owning chapter, with the Stripe and Adyen word for each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p105 | recommendation (list) | Three habits keep the cards current: review each on a calendar, let incidents add fields, and keep the set small. |  |  |\n| p106 | transition | The glossary, the next page, defines terms the cards use, such as idempotency key, clearing account, payout return and PCI scope, and gives the Stripe and Adyen word for each, and the bibliography lists the sources behind the chapters. |  | `sequence`: Keeping the cards current. → The next reference pages. |\n\n## Non-goals\n\n- Re-teaching why each field exists See the chapter linked in each tool.\n- New facts about Stripe or Adyen: a filled card repeats the owning chapter's wording and date See the chapter linked in each tool, [Bibliography](bibliography.html).\n- New Larkfield facts: every example uses the scenario ledger and the chapters' Larkfield sections\n- The acquirer inventory, method-family table, version register, authentication loss table, period record and data-location page See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html), [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html), [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html), [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html), [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html).\n- Definitions of terms See [Glossary: Plain-Language Definitions and a Stripe–Adyen Crosswalk](glossary.html).\n- A 'Stripe and Adyen: Where They Differ' section, failure-pattern callouts and the three take-away tiers (chapter apparatus, not used on a reference page)\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The plan and the journal spec say the chapters introduce these cards; only the provider comparison card is named as a card in a chapter (chapter 48), and the exit plan appears as the 'exit sheet' (chapter 22). Should chapters be edited to name their cards, or the journal spec to say the toolkit builds them from the chapters?\n\n## Decision log\n\n- **2026-11-17** — Kept the plan's sixteen cards. Fifteen are named as cards by no chapter (chapter 48 names the provider comparison card; chapter 22 calls the exit plan an 'exit sheet'), so each is built only from its chapter's 'In Practice at Larkfield' section and 'Questions to Ask', and the page says so per card. Rejected: Leaving out the fifteen cards no chapter names; Inventing fields with no basis in a chapter\n- **2026-11-17** — Cards are separate sections in book order of their teaching chapter's part, as in ORDERED's toolkit; the part is a column of the lookup table. The provider exit plan card sits in Part X beside the comparison card, where chapter 50 tells the reader to keep it, with its fields from chapters 22 and 10. The decision record is last and is built from chapter 6's scene and chapter 10's Larkfield section. Rejected: One section per part with cards as sub-headings (sections of up to 18 units); Placing the exit plan card under Part V\n- **2026-11-17** — One illustration placeholder (how the cards connect), as the page brief allows, although the style guide says reference pages have none. Length set to the sibling page's: target 7,200, maximum 8,000 words. Rejected: No figure; Two figures\n- **2026-11-17** — Where a chapter names no person as owner, the filled card names the team or role the chapter gives and says so; no owner is invented and nothing is added to the ledger. Rejected: Adding owners to the scenario ledger\n\n## Sources\n\n- **Internal**\n  - PLAN.md — The Reference entry listing the sixteen cards.\n  - journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged.\n  - _research/scenario-ledger.md — Every Larkfield figure, name and date.\n  - _research/consistency-issues.md — Rulings 12/29, 13, 26, 28 and 41 to 48 applied to the filled cards.\n  - The 'In Practice at Larkfield' sections and 'Questions to Ask' of chapters 4, 6, 8, 10, 13, 14, 15, 18, 20, 22, 26, 29, 33, 34, 40, 45 and 48 — The fields and the filled example of each card.\n  - _journals/commerce-platform-architecture/posts/toolkit — The shape of the page.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 101 claims checked against the chapters as they read now and the scenario ledger (88 confirmed, 13 corrected, 0 hedged, 0 unsupported and removed, 0 unreachable); the 'Built from' lines of ten cards now name the questions their fields actually use, and the five-business-day escalation on the payout exception card is scoped to unmatched reconciliation items (chapter 15). Wording only; no unit added, dropped or reordered.\n- **2026-11-17** — Template field lists in the controlling ideas of Tools 1, 3, 5 to 13, 15 and 16 shortened to the fields the draft keeps, to fit the 8,000-word limit; no unit added, dropped or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Flow rubric note applied: the introduction says that Keel decisions are numbered K1 to K8. Notes not acted on, for the author: move the glossary pointer into the introduction; merge the first convention into the opening paragraph; shorten the paragraph on how the cards were built; the card order starts with the dispute evidence card (Part I) although the thesis names the payment state card first.\n- **2026-11-17** — Initial spec.\n- **2026-11-17** — Tool 4 given an owner, so that the page's rule that no card lacks an owner holds; max_words raised to 8,050.\n- **2026-11-17** — Visual layer: 1 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Round-1 draft-check revision: Keel decisions keyed in the introduction, named incidents pointed to meet-larkfield and glossed where cheap, the record-that-is-the-truth convention widened to plans and decisions, a glossary pointer added to p001, Tool 15's Part X placement explained in the finder and in its card, Tool 4's 'three figures' named, Tool 13's 200,000 named as the Adyen share, Tool 10's example labelled by template field, Tool 7's per-attempt key explained; spec wording of p001-p003, p005, p031, p066, p067, p085, p093 and p106 aligned; max_words raised 5% to 8,450.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
