<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What the chip adds (a one-time cryptogram per transaction), what the networks' liability rules make depend on it, and the two meanings of 'offline': approval by the card on the issuer's preset terms, and store-and-forward at the merchant's risk.\n- **Know:** The integration shapes for terminals (local or cloud at Adyen on the nexo retail protocol; SDK or server-driven at Stripe with the same PaymentIntent as online) and what each does when the connection drops.\n- **Know:** What 'unified commerce' consists of in data terms, and what each company publishes about its in-person business (Adyen reports point-of-sale volume, 22% of processed volume in 2025; Stripe publishes none).\n- **Believe:** A terminal is a managed computer in the payment path, with software, keys and certificates that someone must own.\n- **Believe:** Using one provider for both channels does not by itself make a store payment and an online payment one; a shared shopper identifier, a cross-channel refund and a single settlement report each have to be checked.\n- **Be able to:** Choose a terminal integration shape for a stated store network and say what it does offline and who carries that risk.\n- **Be able to:** Test a provider's unified-commerce claim with three separate checks: recognizing the same payer across channels, refunding across channels, and reconciling both channels in one report.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an offline requirement the chapter does not contain, the reader distinguishes the two mechanisms and states who bears the loss on a later decline. *Probe:* A ferry operator sells food on board with no connectivity for forty minutes per crossing. It wants to keep taking cards. Using only this chapter: what are its two options for an offline payment, and who loses the money if a stored payment is declined when the ferry docks? | `custom` | cold_reader | major |\n| AC-2 | Given a 'unified commerce' claim, the reader breaks it into the three checks and does not accept one as proof of the others. *Probe:* A provider says: 'With us, online and in-store payments are unified.' A shoe retailer wants to let customers return online orders in its shops for a refund to the original card. Using only this chapter, which three things do you verify, and which one does this use case depend on? | `custom` | cold_reader | major |\n| AC-3 | The chapter's closing section performs the part's closing: it puts the six layers of a 'yes' side by side, states what follows for comparing approval rates, and returns to the 1,140 Larkfield studios charged through Stripe online and Adyen at the front desk. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n| AC-4 | Liability rules are attributed to the network rules actually read (Visa, with their edition date) and Mastercard's are marked as not verified; terminal models, country lists and volumes carry their dates; the chapter says that neither company publishes its terminal key management, and that Adyen documents how it rolls out terminal software releases (every four weeks, gradually) while Stripe documents no equivalent. | `custom` | rubric | blocker |\n| AC-5 | A reader of the introduction alone (callouts and paragraphs p01 to p04) can predict the chapter's sections. *Probe:* After reading only the introduction: what will this chapter discuss, and in what order? | `intro_predicts_content` | cold_reader | major |\n| AC-6 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as the spec's paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What changes when the card is physically present, and what does it take to treat a store payment and an online payment as one?\n\n> **Claim:** When the card is present, a device joins the payment path: whether a fraud loss falls on the issuer or the merchant's side depends on the terminal reading the chip and the acquirer passing the chip data on, and a payment taken offline is credit the merchant extends. Treating a store payment and an online payment as one takes three things that have to be built and checked separately, a shared identifier for the payer, a refund path across channels and one settlement report; Stripe approaches them by reusing its online payment object at the counter, Adyen by shared references on one platform reached through a retail-industry terminal protocol.\n\n**Disputed by:** The view that a terminal is a card reader, an input device for the same payment, and that 'unified commerce' follows automatically from buying online and in-store payments from one provider.\n\n**So what:** A platform that puts terminals in its customers' shops takes on a device estate: inventory, software versions, keys and certificates per site, offline limits with a named owner, and a reconciliation path for stored payments. And it tests each of the three unified-commerce properties on its own, because a provider can deliver one without the others.\n\n**How and why:** The chip produces a one-time cryptogram, and Visa's published rules (edition of October 2026) let an issuer push a counterfeit-fraud loss to the acquirer when the transaction did not take place at a chip-reading device or the full chip data was not transmitted; Mastercard's rules were not read and are described only as industry knowledge. Offline has two documented forms: Adyen supports approval by the card and store-and-forward with limits the merchant sets, Stripe store-and-forward only with a ceiling it enforces. In store-and-forward, authorization is attempted only after the connection returns, so the goods have left before any issuer has answered, which is why the chapter calls it credit extended by the merchant. The integration shapes differ in the same direction: Adyen's Terminal API follows the nexo retail protocol and runs locally or through the cloud; Stripe drives readers from an SDK or its own API and represents the payment as the PaymentIntent used online, with a generated card for reuse, since Stripe documents that a card read in person cannot itself be reused online. That the shared identifier, the cross-channel refund and the single report are separable, so that a provider can deliver one without the others, is the author's judgement and not a documented finding about either company. Adyen has designed terminals in-house since 2022 and reports point-of-sale volume (22% of processed volume in 2025); Stripe publishes no in-person volume. That Adyen exposes more of the card-present toolkit and Stripe one safer default is the author's reading; neither publishes key management or failure rates, and only Adyen documents how terminal software updates are rolled out.\n\n**Supporting claims**\n\n- **S1** — The chip gives each transaction a one-time cryptogram, and Visa's rules put a counterfeit-fraud loss on the acquirer's side when the terminal did not read the chip or the acquirer did not transmit the chip data.\n- **S2** — A terminal is a managed computer in the payment path, with certifications, keys and software versions that someone must own, and neither company publishes how it manages keys; only Adyen documents how it stages fleet software updates.\n- **S3** — The integration shape, local or cloud at Adyen on the nexo protocol and SDK or server-driven at Stripe on the online payment object, decides what the counter does when the connection drops.\n- **S4** — Offline has two forms, approval by the card and store-and-forward, and a store-and-forward payment is credit the merchant extends, bounded by limits that need an owner.\n- **S5** — Treating a store payment and an online payment as one takes a shared payer identifier, a refund path across channels and one settlement report, which are built and checked separately.\n\n## Role in the part\n\nAdds the device to the layers of a 'yes' and carries the part's closing, where the six layers are set side by side and the part hands off to the question of where the approved money is recorded. Supports P2-6 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: two requests posed at Larkfield, answered after the mechanisms are taught; `comparison` in integration-shapes and where-they-differ)\n\nThe reader meets two requests the online stack cannot answer, then gets the mechanisms in the order each depends on the last: the chip and the liability rule say why the device matters; the device as a managed computer says what has been deployed; the integration shape says how software reaches it and, with that, whether it can work without the internet; offline can be explained only after the shapes, because it exists on one of them; unified commerce comes after the single counter payment is understood, because it is about joining that payment to another. The company comparison follows the mechanisms so that every cell repeats a fact already met, Larkfield's case answers the scene's two requests with all of it, and the failures come last because each is a mechanism failing. Moving offline before the integration shapes would ask the reader to weigh a risk without knowing which design carries it; moving unified commerce first would compare channels before the reader knows what the counter channel is.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On a Saturday morning a studio's internet connection drops while six people queue at the front desk. The terminal on the counter still lights up when a card is tapped and still prints 'approved'. No bank has been asked. Who approved those payments, and who pays if one of them is refused on Monday?\n\n**Bridge:** An engineer who has integrated online payments thinks of a terminal as an input device: it reads a card and hands the number to the same payment API. → The terminal is a computer in the payment path that holds keys, decides what data the issuer receives and can accept a payment with nobody upstream listening; and a payment it takes does not join the online payments of the same customer unless somebody builds the join.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02): When the card is present, a device joins the payment path: who carries a counterfeit-fraud loss depends on the terminal reading the chip and the acquirer passing the chip data on, and a payment taken offline is credit the merchant extends. Treating a store payment and an online payment as one takes a shared identifier for the payer, a refund path across channels and one settlement report, each built and checked separately.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start at Larkfield's front desks with two requests that the online payment stack could not answer. *Kept in:* scene.\n- Explain what the chip adds and what the networks' liability rules make depend on it. *Kept in:* chip-and-liability.\n- Show the terminal as a managed computer with certifications, keys and software versions. *Kept in:* managed-device.\n- Compare the ways point-of-sale software drives a terminal, on Adyen and on Stripe. *Kept in:* integration-shapes.\n- Separate the two meanings of 'offline' and say who carries the loss in each. *Kept in:* offline.\n- Break 'unified commerce' into three checks. *Kept in:* unified-commerce.\n- Set Stripe and Adyen side by side, work the checks through at Larkfield and list the failures. *Kept in:* where-they-differ, in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A terminal that keeps printing 'approved' with the internet down has asked no bank, so somebody other than the issuer has made the promise. | scenario: A studio front desk on a Saturday morning, connection down, six people in the queue, the terminal still accepting taps. |  |\n| p02 | claim | A terminal is a computer in the payment path, and what it reads, transmits and stores decides who carries a fraud loss and whether a counter payment can be joined to an online one. |  | `problem_solution`: The question of who approved the offline payments. → The chapter's claim: the device is a participant, liability turns on its data, offline acceptance is the merchant's credit, and 'one payment across channels' is three separate properties. |\n| p03 | context | Mila's class pass was bought in the app, so no terminal touched it; this chapter covers the same card tapped at Studio Noord's front desk, where a device stands between the card and the acquirer. | scenario: Mila's class pass of 9 March 2027 (in the app, Studio Noord on Adyen) against a counter payment at the same studio. | `place`: The chapter's claim. → Its position relative to the recurring payment. |\n| p04 | transition | The chapter goes from Larkfield's front desks to the chip and liability, the terminal as a managed device, the integration shapes, offline payments, the three checks of unified commerce, the comparison of Stripe and Adyen, Larkfield's worked case and the failures. |  | `sequence`: The position on the journey. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Two Requests From the Front Desk\n\n**Controlling idea** (`example`, id `scene`): Two ordinary requests from studios, keep selling when the Wi-Fi drops and refund an online purchase at the counter, could not be answered from Larkfield's online payment stack.\n\n**Advances the thesis** (S3, S5): Poses the chapter's two questions as concrete requests: one about the device and the connection, one about joining channels.\n\n**Transition in:** `example`: The roadmap's first stop. → Larkfield's front-desk estate and the two requests that expose what a terminal adds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Larkfield's front desks are a device estate on one provider: terminals at 2,100 studios, all supplied by Adyen and driven by the front-desk app, taking €210 million in 3.8 million payments in 2026. | fact: Terminals at 2,100 studios; €210M in 3.8M front-desk payments in 2026 (about €55 on average); all terminals on Adyen; the front-desk app is a tablet app that drives the terminal. |  |\n| p06 | example | In February 2027 two requests reached Femke de Graaf that the online stack could not answer: a studio owner wanted the terminal to keep working when the Wi-Fi dropped, and a member at one of the 1,140 studios on Stripe online wanted an online pass refunded at the counter. | scenario: The 1,140 studios in the Netherlands and Germany that are on Stripe for online payments and on Adyen terminals at the front desk; a studio owner's outage; a member's refund request at the desk. | `example`: The estate on one provider. → Two requests that test it: offline acceptance and a refund across channels. |\n\n### What the Chip Adds, and Who Pays When It Is Not Read\n\n**Controlling idea** (`explanation`, id `chip-and-liability`): The chip gives each transaction a one-time cryptogram the issuer can check, and Visa's rules move a counterfeit-fraud loss to the acquirer's side when the terminal did not read the chip or the acquirer did not transmit the chip data.\n\n**Advances the thesis** (S1): Establishes that liability depends on what the device reads and what the acquirer transmits.\n\n**Transition in:** `elaboration`: The terminal on Larkfield's counters. → What the card and the terminal exchange, starting with the vocabulary: card-present, magnetic stripe, chip.\n\n**Order of paragraphs** (`prerequisite_order`): Card-present is defined before the chip, the chip before the message that carries its data, and the message before the rule that depends on it; the rule would be unreadable without 'chip-reading device' and 'full chip data'.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | A card-present payment is one where a terminal reads the physical card or phone, and the oldest way of reading it, the magnetic stripe, hands over static data that can be copied onto another card. | reasoning: A magnetic stripe holds the same data on every swipe, so a copy of the stripe is indistinguishable from the card. |  |\n| p08 | definition | EMV is the chip-card standard: the chip computes a one-time cryptogram for each transaction, by contact or contactless, so a copied card cannot replay an earlier one. | quotation: 'EMV Chip technology uses advanced cryptography to generate a one-time security code (cryptogram) for each transaction that allows the card issuer and merchant point-of-sale terminal to authenticate the card. The security code is unique to each transaction and cannot be reused'; quotation: 'EMVCo does not mandate or enforce EMV compliance or the implementation policies for issuers, merchants, and acquirers, which are handled by payment networks independently outside of EMVCo'; statistic: 'globally, 97% of card-based transactions are EMV Chip', statistics as of Q4 2025, reported for card-present transactions. | `problem_solution`: The copyable stripe. → The chip and its one-time cryptogram. |\n| p09 | process | The cryptogram is useful only if it reaches the issuer: the terminal reads the chip, and the chip data travels with the authorization request through the provider, the acquirer and the network to the issuer, which verifies it. | figure: Message flow: card, terminal, provider and acquirer, card network, issuer; the chip data rides in the authorization request; the answer returns the same way.; reasoning: The parties are those of the four-party model (journey-of-a-payment) and the message is the authorization of payment-authorization, with one added field group. | `sequence`: The cryptogram the chip produces. → The path it takes to the party that can check it. |\n| p10 | evidence | The networks attach money to that path through the EMV liability shift, a dispute rule under which Visa lets an issuer push a counterfeit-fraud loss to the acquirer when the chip was not read or the chip data was not transmitted. | quotation: Dispute Condition 10.1, 'EMV Liability Shift Counterfeit Fraud': the transaction 'was completed with a Counterfeit Card in a Card-Present Environment', 'The Cardholder denies authorization', 'The Card is a Chip Card', and any of: 'The Transaction did not take place at a Chip-Reading Device', or it 'was Chip-initiated and, if the Transaction was authorized Online, the Acquirer did not transmit the Full-Chip Data to Visa in the Authorization Request', or it 'was approved offline, and the Acquirer did not transmit the Full-Chip Data to Visa in the Clearing Record' (Table 11-9, entry last updated October 2023).; fact: Table 11-1: the shift applies to all domestic, intraregional and interregional POS and ATM transactions in Visa's Canada, CEMEA, Europe and LAC regions, and to counterfeit POS and ATM transactions in the US region. | `cause_effect`: The chip data's path to the issuer. → The rule that decides who loses money when the data does not make the trip. |\n| p11 | analysis | Read as an engineer, the rule makes liability a property of data in transit: a certified terminal is not enough if the acquirer drops the chip data, and an offline approval keeps its protection only if the chip data reaches the clearing record; Mastercard's rules were not read for this chapter. | reasoning: Two of the rule's three conditions are about what the acquirer transmits, in the authorization request or in the clearing record.; fact: Mastercard's public rules returned an access error during research; Mastercard's equivalent shift is described only as industry knowledge. | `elaboration`: Visa's rule text. → What it means for the design, and where the evidence stops. |\n\n### A Terminal Is a Managed Computer\n\n**Controlling idea** (`explanation`, id `managed-device`): A terminal is a certified computer holding encryption keys and versioned software, so putting one on a counter creates an estate that someone must inventory, update and replace, and neither Stripe nor Adyen publishes how it does the key and update work.\n\n**Advances the thesis** (S2): Shows the device as a participant with its own lifecycle, against the view that it is a card reader.\n\n**Transition in:** `cause_effect`: Liability depends on what the terminal reads and what is transmitted. → The terminal itself: what kind of machine has to be trusted with that.\n\n**Order of paragraphs** (`large_to_small`): From the device and its certification, to the card data inside it and the compliance scope that follows, to the case where the device is a phone, and last to what is not published; the limit of the evidence closes the section because it applies to everything before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | A payment terminal is a certified computer with an expiry date: its hardware is approved under a PCI device standard by version, and both providers push software to it on their own schedule. | fact: Adyen's terminal catalog labels each model 'PCI PTS 5' or 'PCI PTS 6' and states 'PCI PTS 5 payment terminals will no longer be available for order starting April 30, 2026'.; quotation: 'All these terminals are all fully certified, can be centrally managed, and will automatically update themselves with the latest Adyen software'; quotation: 'The reader restarts every day at midnight for PCI compliance' |  |\n| p13 | explanation | Both providers encrypt card data inside the terminal by default and sell a point-to-point encryption (P2PE) solution validated against PCI's standard as an option, and the choice decides which compliance questionnaire the merchant completes. | quotation: PCI SSC: a P2PE solution 'cryptographically protects account data from the point where a merchant accepts the payment card to the secure point of decryption'; merchants using listed solutions 'have fewer applicable PCI Data Security Standard (PCI DSS) requirements'.; quotation: Adyen: default end-to-end encryption needs 'the SAQ B-IP'; P2PE needs 'the SAQ P2PE and the P2PE Instruction Manual'; 'While E2EE is secure, it does not have the PCI P2PE-validated “stamp”'.; quotation: Stripe: 'All payments using Terminal are securely encrypted using end-to-end encryption (E2EE) by default'; 'Stripe P2PE is an optional, paid feature'; Terminal-only merchants 'can validate using SAQ C'. | `elaboration`: The certified device. → What happens to card data inside it, and the compliance scope that follows. |\n| p14 | explanation | Tap to pay on a phone removes the terminal hardware and keeps everything else: the provider still supplies the certified terminal configuration, and a separate PCI standard covers payment acceptance on ordinary devices. | quotation: Apple: developers 'will first need to integrate with a supported payment service provider (PSP) who processes the payments read by Tap to Pay on iPhone and provides the certified terminal configurations that are loaded on the merchant's device. The PSP is responsible for all the necessary certifications and security considerations'.; fact: PCI SSC's Mobile Payments on COTS (MPoC) standard is for solutions accepting PIN and contactless data on a commercial off-the-shelf device; Adyen says store and forward with its Android Mobile SDK is in limited availability 'because it is not yet PCI MPoC certified'. | `contrast`: A dedicated certified device. → The case where the device is an ordinary phone. |\n| p15 | analysis | Neither company publishes how keys are loaded and rotated or how often terminals fail, and only Adyen documents how software updates are staged across a fleet, so the estate's own records have to be kept by the party that deploys the devices. | fact: No Stripe or Adyen page read describes terminal key injection or rotation, terminal failure rates or hardware economics. Adyen's 'Update to a new release' (n.d., accessed 2026-11) documents four-weekly releases, gradual automatic rollout and manual updating in batches; Stripe's S700 page says only that readers update automatically when not in use.; reasoning: Per device and site, the deployer can still record model, certification version, software version, last contact and assigned store, because both providers expose device management through an API or dashboard. | `contrast`: What the providers document about their devices. → What they do not, and what the deployer must therefore record itself. |\n\n### Driving the Terminal: Local or Cloud, SDK or Server\n\n**Controlling idea** (`comparison`, id `integration-shapes`): Point-of-sale software reaches a terminal either over the store's own network or through the provider's cloud, on both providers, and that choice decides what the counter can do when the internet connection drops.\n\n**Advances the thesis** (S3): Lays out the integration shapes and ties each to its behavior on connection loss, and shows the two companies' different starting points (a retail protocol; the online payment object).\n\n**Transition in:** `sequence`: The terminal as a managed computer. → How the merchant's own software talks to that computer.\n\n**Order of paragraphs** (`comparison`): The shared problem first, then each provider's two shapes, then the four side by side, then the choice; the table needs both providers' vocabulary and the recommendation needs the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | context | The point-of-sale software knows the amount and the terminal knows the card, so every counter payment needs a channel between the two, and there are two places to put it: the store's network or the provider's cloud. | reasoning: The point of sale (POS) is the merchant's till software; the terminal is the provider's certified device; card data must not cross from the second to the first.; table: Requirements of the channel: how fast, how consistent (one request, one payment), how available (as available as the till), and what happens on failure (the till can always ask what happened to its last request); targets labeled as the author's. |  |\n| p17 | description | Adyen's Terminal API follows nexo, a retail-industry protocol for messages between a till and a terminal, and runs in two architectures: local, where the till posts to the terminal's own address, and cloud, where the request goes to Adyen and is forwarded. | quotation: 'Our Terminal API is based on the nexo Retailer Protocol'; protocol version 3.0; `ServiceID` 'Must be unique within the last 48 hours for the terminal (`POIID`) being used'.; quotation: Local: 'you make an API request directly to the IP address of the terminal'; 'You receive the result of the payment synchronously'; the terminal 'listens for POST requests to `/nexo` on port 8443'; 'you need to add Adyen's certificate to your POS app, and encrypt your messages'. Cloud: 'you send your Terminal API requests to an endpoint on the Adyen payments platform. This request is forwarded to the terminal'; results 'synchronously or asynchronously'. Summary: 'cloud communications is easier to implement but does not support all use cases. Local communications on the other hand can be more robust but requires an additional effort'. | `example`: The two places for the channel. → Adyen's version of each. |\n| p18 | description | Stripe offers the same two places under different names, an SDK inside the point-of-sale app or a server-driven integration through the Stripe API, and in both the counter payment is the PaymentIntent used online. | quotation: 'Server-driven integrations use the Stripe API instead of a Terminal SDK to connect to' smart readers; 'The Stripe API: Receives requests and forwards them to a smart reader'; 'Server-driven integration doesn't support: Stripe Terminal mobile readers; Collect card payments while offline'.; fact: The offline flow diagrams show the POS application calling 'Create PaymentIntent', 'Collect payment method' and 'Confirm PaymentIntent' on the Terminal SDK. | `similarity`: Adyen's local and cloud architectures. → Stripe's SDK and server-driven integrations, and the object they share with online payments. |\n| p19 | comparison | Set side by side, the four shapes pair up: the two that stay inside the store keep working when the internet drops and cost network and certificate work, and the two that go through the provider's cloud are simpler and stop with the connection. | table: Shape (Adyen local, Adyen cloud, Stripe SDK, Stripe server-driven) by path of the request, how the result returns, security and network work for the merchant, and what happens when the internet connection drops.; figure: Two paths from a till to a terminal: through the store's local network, and out to the provider's cloud and back. | `conclusion_summary`: Each provider's two shapes. → The four in one table, paired by where the channel runs. |\n| p20 | recommendation | I would choose the cloud path for many small sites whose networks nobody manages and the local path where a store must keep selling through an outage, because the first trades resilience for an estate with no per-site network configuration and the second does the reverse. | reasoning: The local path needs a reserved address per terminal, a certificate and a shared key in the till software; the cloud path needs none of it and fails when the store's link fails. | `cause_effect`: The paired trade-off. → The author's rule for choosing, with its conditions. |\n\n### Two Meanings of Offline, and Who Carries the Loss\n\n**Controlling idea** (`explanation`, id `offline`): 'Offline' names two mechanisms, approval by the card on terms its issuer preset and store-and-forward, and in the second the merchant hands over goods before any issuer has answered, which makes it credit the merchant extends.\n\n**Advances the thesis** (S4): Argues that a payment taken offline by store-and-forward is the merchant's credit decision and needs limits, an owner and its own reconciliation.\n\n**Transition in:** `cause_effect`: Only the in-store shapes keep working without the internet. → What 'keep working' means when nobody upstream can be asked.\n\n**Order of paragraphs** (`prerequisite_order`): The two mechanisms are told apart first, because everything after applies only to the second; the risk comes before the limits that bound it, and the limits before the cases they do not cover and the clean-up afterward.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | In the first mechanism, offline EMV, the card itself approves the payment on terms its issuer configured in advance, which most debit cards do not allow. | quotation: 'Offline EMV: the payment terminal verifies that the PIN entered by the shopper matches the PIN on the EMV chip embedded in the card, and then asks the card to approve the payment. Whether the transaction is approved, depends on how the issuer configured the card. Because the card is in control, the payment can be processed in the clearing stream directly.' 'Most debit cards do not support this type of payment.' |  |\n| p22 | claim | In the second mechanism, store-and-forward, the terminal accepts the payment with no check, stores it and asks for authorization after the connection returns, so the merchant has extended credit to the customer for the time in between. | quotation: Adyen: 'the payment terminal or Mobile SDK approves payments without any verification'; 'In practice the authorization rates range from 95% in some industries to several percentage points higher'; 'You are fully liable for the risk of failed captures, chargebacks, and disputes related to payments that you process offline.'; quotation: Stripe: 'authorization is only attempted after connectivity is restored and the payment is forwarded'; 'You, as the user, assume all decline and tamper-related risks associated with an offline transaction'; 'there's no way to recover the funds'.; figure: Timeline: goods leave the counter, the payment waits on the device, the connection returns, the issuer answers; a 'no' at the end is the merchant's loss. | `contrast`: Approval by the card. → Acceptance by the terminal with no approval at all. |\n| p23 | comparison | Because the exposure is the merchant's, its size is set by limits, and the two providers put the limits in different hands: Adyen has the merchant set them, and Stripe enforces a ceiling and lets the merchant add its own. | fact: Adyen: chip floor limit, contactless floor limit, 'Store-and-forward max. amount' and 'Max. payments' per terminal; 'you need to set a transaction floor limit before your integration can make offline payments'.; quotation: Stripe: 'the Stripe-enforced offline maximum of 10,000 USD or equivalent in your operating currency'; in the European Economic Area 'customers are required to insert their card and enter a PIN'; 'Swiping isn't allowed'. | `cause_effect`: The merchant carries the loss. → The limits that bound it and who sets them. |\n| p24 | analysis | Store-and-forward covers the store's connection failing and little else: Adyen states that it does not work during an outage of its own platform, and Stripe requires a reader to have been online recently before it will work offline. | quotation: Adyen: 'Store-and-forward offline payments do not work in the event of an outage of the Adyen payments platform'; with cloud communications 'it is not very useful to enable offline payments'.; quotation: Stripe: 'you must have previously connected to the same reader using a valid connection token within the last 24 hours, on the same local network'; a reader whose 'software hasn't been updated in 30 days or more' must go online first.; reasoning: INFERENCE, NOT DOCUMENTED: why Adyen's terminals refuse store-and-forward during a platform outage is not explained on the page; a plausible reason is that the terminal can tell a failed store link from an unreachable platform and treats only the first as the case the merchant accepted risk for. | `contrast`: The limits a merchant can set. → The outages no limit covers. |\n| p25 | process | A stored payment has a second life after the outage: it surfaces later with identifiers the online path would have issued at once, may be declined, and may be retried, so it needs its own reconciliation path. | quotation: Adyen: the offline response 'misses the PSP reference. Only contains the tender reference'; 'failed store-and-forward payments that are eligible will be automatically retried for one calendar month' (Auto Rescue).; quotation: Stripe: 'When a network connection is restored, the SDK or smart reader automatically forwards any stored payments to Stripe'; the forwarding diagram ends in a 'Success or decline response' and a 'Forwarding event notification' to the POS application. | `time`: The outage and its limits. → What happens to stored payments once the connection is back. |\n\n### Unified Commerce Is Three Separate Checks\n\n**Controlling idea** (`analysis`, id `unified-commerce`): In data terms 'unified commerce' is three properties, a shared identifier for the payer, a refund path across channels and one settlement report, and a provider can deliver one without the others.\n\n**Advances the thesis** (S5): Breaks the claim 'online and in-store are unified' into three checks and shows what each company documents for each.\n\n**Transition in:** `contrast`: What the device adds to one counter payment. → The second question of the chapter: what it takes to treat that payment and an online payment as one.\n\n**Order of paragraphs** (`grouping`): The claim, then the three checks in the order a payment meets them (who paid, how money goes back, how it is reported), then the test for each; the closing table depends on all three having been defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | claim | A provider's statement that online and in-store payments are 'unified' can mean three different things, and my judgement is that they have to be verified one by one. | quotation: Adyen: Unified Commerce 'allows you to consolidate payments data from all customer-facing and back-end systems. With Adyen's single payments platform you have a unified view on all your customers'. Stripe: 'Manage online and in-person payments in a single Stripe account'.; reasoning: That the three are separable is the author's judgement, not a documented finding about either company. |  |\n| p27 | evidence | The first check is a shared identifier for the payer: Adyen returns a card alias that identifies a card and cannot pay, Stripe a fingerprint shared by online and in-person card records, and at both a card held in a phone wallet breaks the match. | quotation: Adyen: 'The card alias. You can use this to identify the shopper based on their card, but not to make payments'; 'PaymentAccountReference: If the shopper used an NFC wallet, you can use this instead of the alias'.; quotation: Adyen: 'If you tokenize the shopper's payment details when they make a payment at the point of sale, you can use that token in a later online payment.'; quotation: Stripe: 'each `card_present` payment method has a fingerprint attribute that uniquely identifies a particular card number. Cards from mobile wallets (for example, Apple Pay or Google Pay) don't share a fingerprint with cards used online.' 'When you create a PaymentIntent or SetupIntent with a card-present payment method, you can't save the PaymentMethod directly. However, in most cases, Stripe can create a reusable `generated_card` PaymentMethod'. | `sequence`: Three properties to verify. → The first, with what each company documents. |\n| p28 | evidence | The second check is a refund that crosses channels: Adyen documents refunding an online payment at a terminal by its PSP reference, and Stripe refunds every channel through the same server-side Refunds API with no card presented. | quotation: Adyen, table of refund types, row 'Omnichannel refunds': 'Supported, using the PSP reference' for referenced refunds and 'Not supported' for unreferenced ones; 'To refund an ecommerce payment, you need to know the PSP reference, the date, and the currency of the original payment'; for unreferenced refunds 'You are fully liable for losses resulting from fraudulent or duplicate unreferenced refunds'.; quotation: Stripe: 'create a refund by passing in the PaymentIntent ID or the charge ID'; 'Online refunds don't require a cardholder to present their card again at the point of sale'; 'In-person refunds are only available on Interac'. | `sequence`: Recognizing the payer. → Sending money back across channels. |\n| p29 | analysis | The third check is one settlement report covering both channels, and here the documentation read for this chapter gives general statements and no field-level proof, so it is the check to run on real files. | quotation: Adyen: 'The PSP reference and tender reference can be found in your Customer Area, and in reports generated by Adyen.' Stripe: 'We recommend reconciling payments on your back end after a day's activity to prevent unintended authorizations and uncollected funds.'; reasoning: A store-and-forward payment enters the report days after the sale and under the terminal's reference, so a report can cover both channels and still not match the till's day. | `sequence`: The refund path. → The report, and the limit of the evidence for it. |\n| p30 | comparison | Each check has its own test and its own way of failing, which is why passing one says nothing about the others. | table: Check (shared identifier, cross-channel refund, one report) by what to test and the sign that it fails: a wallet payment not matched to the same card online; a refund that needs the card present or an unreferenced refund; counter payments in a different file, or stored payments missing from the day they were sold. | `conclusion_summary`: The three checks and their evidence. → One table of tests and failing signs. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Stripe reaches the counter by extending its online payment object and SDKs, Adyen through a retail-industry protocol and shared references on its own acquiring platform, and only Adyen publishes the size of its in-person business.\n\n**Advances the thesis** (S3, S5): Sets the documented facts of the earlier sections side by side and states the two approaches the thesis names.\n\n**Transition in:** `conclusion_summary`: The mechanisms and the three checks, each with both companies' documentation. → The two companies compared directly.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What each company has published about its in-person business, then the table of documented differences, then what an integrator should do differently; the advice depends on the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence | The two companies publish very different amounts about their in-person business: Adyen has designed terminals since 2022 and reports point-of-sale volume, and Stripe, which launched Terminal in 2018, publishes no in-person volume or reader count. | quotation: Adyen, 18 August 2022: 'the launch of its first in-house designed terminals', the NYC1 and AMS1, 'after expanding into designing hardware for the first time'.; statistic: Adyen: 'point-of-sale volumes were €310.9 billion, comprising 22% of total processed volume, up from 18% in 2024' (Annual Report 2025); 'point-of-sale volumes were €311 billion, up 34% for the full year' (H2 2025 release, 2026-02-12); 'The number of transacting terminals across the platform reached 878k, up 25% YoY' (Q3 2026 business update).; fact: Stripe announced Terminal on 17 September 2018 as 'a programmable point of sale for in-person payments'; no Terminal volume, reader count or in-person share was found in Stripe's documentation, product pages or annual letters. |  |\n| p32 | comparison | On seven aspects the public record shows a consistent difference: Stripe gives the counter its online objects and one enforced default, and Adyen gives it a retail protocol, more configuration and its own references. | table: Aspect by Stripe, Adyen and what the difference suggests: how software drives the device; the payment record; recognizing a card across channels; offline acceptance; refunds across channels; encryption and compliance scope; published scale. | `additional_support`: What each publishes about its business. → What each documents about its product, aspect by aspect. |\n| p33 | recommendation | An integrator on Stripe should design around the PaymentIntent and decide early whether offline is needed, because that rules out the server-driven shape; an integrator on Adyen should choose local or cloud first and then own the limits and references the platform leaves to the merchant. | reasoning: Stripe: server-driven excludes offline; card-present methods are not reusable without the generated card. Adyen: offline needs local communications and merchant-set limits; referenced refunds need the PSP reference; neither publishes key management or failure rates; only Adyen documents a gradual rollout of fleet updates, and Stripe documents automatic updates, their timing and required dates that vary across a fleet. | `cause_effect`: The table of differences. → What to do differently on each provider. |\n\n### In Practice at Larkfield: One Estate, No Offline, Three Checks\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield keeps every terminal on one provider and on the cloud path with offline acceptance switched off, and for the studios split across two providers it supplies the three unified-commerce properties from its own systems.\n\n**Advances the thesis** (S2, S4, S5): Applies the device-estate view, the offline credit decision and the three checks to the two requests of the opening scene.\n\n**Transition in:** `example`: The comparison of the two providers. → One platform's decisions on one of them, with the scene's two requests answered.\n\n**Order of paragraphs** (`problem_solution`): The standing decision (one estate) first, then the two requests from the scene in the order they were posed, each answered with the section that taught the mechanism.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | explanation | Larkfield put every terminal on Adyen in 2024 because for a platform with thousands of small sites the cost of in-person payments is the estate, one device range, one certification path and one adapter in the front-desk app, more than the price per payment. | scenario: Adyen chosen in 2024 for in-person payments on one platform with online; all front-desk terminals on Adyen; in-person fee to studios 1.4% + €0.10. |  |\n| p35 | example | To the studio owner's request Femke's answer was no: the front-desk app drives the terminals over the cloud path, where offline acceptance is not practical, and the app itself cannot check a member in without the internet, so stored payments would have nothing to be sold against. | scenario: Front-desk app on Adyen's Terminal API with cloud communications; offline payments not enabled. Illustrative sizing had it been enabled on the local path: a store-and-forward maximum of €120 (one ten-class pass) and 25 payments per terminal bound the exposure at €3,000 per terminal per outage. | `problem_solution`: The estate on one provider. → The first request, offline acceptance, and why it was declined. |\n| p36 | example | At the 1,140 split studios none of the three checks passes at the provider level, so Larkfield supplies each itself: its member id is the shared identifier, the payment service refunds an online payment against the provider that took it, and the reconciliation job reads both providers' reports. | scenario: A Stripe fingerprint and an Adyen card alias are two unrelated values for one card; a pass bought online through Stripe cannot be refunded by an Adyen terminal; the member's request at the counter becomes a call from the front-desk app to the payment service, which creates the refund at Stripe with no card presented; Keel K3 extends the reconciliation job to both providers. | `sequence`: The first request. → The second request, the refund across channels, taken through the three checks. |\n| p37 | example | At Studio Noord, where both channels are on Adyen, the same refund could be made at the terminal, and Mila's €84.00 shows what it needs: the PSP reference of the online payment, its date and its currency. | scenario: Mila's refund of the unused part of her pass, €84.00 for seven classes, requested on 18 March 2027; the pass was bought in the app on 9 March 2027 for €120.00 in euros; had she asked at the front desk, the front-desk app would need the payment's PSP reference from the payment record store. | `contrast`: Studios split across two providers. → A studio with both channels on one provider. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `when-it-goes-wrong`): The counter fails in four characteristic ways, an unknown outcome between till and terminal, a stored payment declined later, a device that has aged out of service and an outage of the single provider, and each has a detection and a recovery.\n\n**Advances the thesis** (S2, S3, S4): Shows the cost of treating the terminal as an input device: each failure comes from the device, the channel to it or the credit extended through it.\n\n**Transition in:** `contrast`: Larkfield's decisions when everything works. → The failures those decisions have to survive.\n\n**Order of paragraphs** (`small_to_large`): From one payment, to a batch of stored payments, to a device, to the whole estate; the last failure is the one the earlier remedies do not reach.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | cause_effect | When the till loses contact with the terminal after the card was presented, the outcome is unknown, and starting the payment again before asking for the status of the first is how a customer is charged twice at a counter. | quotation: Adyen: 'When the connection is back, check the transaction status before you start the transaction again.' Stripe: 'We recommend reconciling payments on your back end after a day's activity to prevent unintended authorizations and uncollected funds.' |  |\n| p39 | cause_effect | A stored payment that is declined after the customer has left is a loss that must be booked by someone, so the forwarded outcomes need a consumer and the write-off needs an owner. | reasoning: The decline arrives as a webhook or forwarding event after the sale is closed; Adyen may retry for a calendar month; the goods are gone. | `additional_support`: One payment with an unknown outcome. → A batch of payments whose outcome arrives late. |\n| p40 | cause_effect | Devices drift out of service quietly, through a certification version that can no longer be ordered, software too old to work offline or a unit swapped between sites, and only an inventory with a last-seen date and a version per device shows it before a counter stops. | fact: Adyen's catalog says PCI PTS 5 terminals 'will no longer be available for order starting April 30, 2026'; a Stripe reader whose software 'hasn't been updated in 30 days or more' cannot collect offline until it goes online. | `additional_support`: Failures of payments. → Failures of the device estate. |\n| p41 | cause_effect | An estate on one provider has no second rail at the counter: store-and-forward does not cover the provider's own outage, and Larkfield's rehearsed switch moves online card payments only. | quotation: Adyen: 'Store-and-forward offline payments do not work in the event of an outage of the Adyen payments platform'.; scenario: Keel K8: the payment service can move a studio's online card payments to the other provider; the front desk stays on Adyen. | `emphasis`: Device failures one at a time. → The failure of everything at once, which the earlier remedies do not reach. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The chip rule, the managed device, the integration shape, the offline limit and the three checks are one observation: at the counter the merchant's side of the payment holds state, keys and risk that online it had handed to the provider. And the terminal is the sixth layer of Part II's 'yes': set beside the acquirer, the method, the state model, the optimizer and the routing choice, it shows that an approval rate describes a whole stack and belongs to a provider, a country and a method together.\n\n**So what:** A platform that puts terminals in its customers' shops takes on a device estate and a credit decision, and tests each unified-commerce property on its own. For Part II as a whole: Larkfield's K8 keeps two providers and one rehearsed switch and adds no orchestration product, because the gain at its volume is in knowing each stack.\n\n**Callback:** The introduction's terminal that prints 'approved' with the internet down, and the part's opening scene of 1,140 studios charged through Stripe online and Adyen at the front desk. The reader can now say who approved the offline payments (nobody yet: the studio extended credit) and can see the terminal on the counter as the last layer of one of the two stacks the same card meets.\n\n**Takeaway** (`course_of_action`): For each provider and country, write down the acquiring entity, each payment method with the date its payments become final, the provider states your own record mirrors, the approval metric with its denominator, and the date the switch to the other provider was last rehearsed; for the counter add the device inventory, the offline limits with their owner and the three unified-commerce tests.\n\n**Hand-off** to [Part III — LEDGER: Recording and Moving Money](part-3.html): `cause_effect`: Part II's result: an approved payment, held in a state machine, on a route and a device chosen to get a yes. → Every approval creates debts between issuer, network, provider and merchant that are paid over days, and a payment's state does not say who owes whom, so the provider needs a second record, the ledger.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis (list) | Established: the chip's one-time cryptogram, Visa's liability rule tied to chip reading and chip data, the two offline mechanisms and the merchant's liability for stored payments are documented by the standard body, the network and both providers. |  |  |\n| p43 | synthesis (list) | Depends on context: local or cloud, whether to accept offline and at what limits, and one provider or two for the two channels each turn on stated conditions. |  | `contrast`: What is documented. → What changes with the situation. |\n| p44 | recommendation (list) | The author's synthesis: treat a terminal rollout as taking on a device estate and a credit line, and treat 'unified' as three tests. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p45 | synthesis | Set side by side, the six layers of a 'yes' each have a different owner, so an approval rate describes the whole stack and cannot be moved from one provider, country and method to another. | table: Layer (acquirer and license, payment method, state model, optimization inside the call, choice of providers, device) by who owns it and the chapter that covers it. | `conclusion_summary`: This chapter's take-aways. → The part's: the device as the sixth layer beside the five before it. |\n| p46 | recommendation | For Larkfield and for the reader the consequence is to know each stack before unifying anything: K8 keeps two providers and one rehearsed switch, the 1,140 split studios are two stacks meeting one card, and the thing to write down is a short record per provider and country. | scenario: Keel K8; the 1,140 studios charged through Stripe online and through Adyen at the front desk. | `cause_effect`: An approval rate describes a whole stack. → What Larkfield decided and what the reader should write down. |\n| p47 | recommendation (list) | Nine questions let the reader test a terminal rollout and a unified-commerce claim in a design review or a provider evaluation. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p48 | transition | An approved payment, whichever stack produced it, creates debts between issuer, network, provider and merchant that are paid over days, and the payment's state does not say who owes whom, which is the subject of Part III. |  | `cause_effect`: The approval Part II has explained. → The debts it creates and the record needed to track them. |\n\n## Non-goals\n\n- The authorization message, holds and response codes in general. See [The First Promise: Authorization](payment-authorization.html).\n- Acquiring licenses, network membership and which entity acquires in which country. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html).\n- PCI DSS scope, self-assessment questionnaires and tokenization in depth. See [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html), [The Card Number's Replacement: Network Tokens and Credential Lifecycle](network-tokens.html).\n- The liability shift for online payments under 3-D Secure. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- Settlement reports and the reconciliation job's design. See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Idempotency and the unknown-outcome problem in general. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- Point-of-sale software, loyalty and promotions, and hardware-first companies such as Block and Toast beyond a mention. See [Other Answers: PayPal and Braintree, Checkout.com, Block](payment-contrast-cases.html).\n- Card-present interchange and pricing. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Mastercard's liability-shift rules were not readable (HTTP 403); the chapter cites Visa only and says so.\n- Neither company documents, on the pages read, a single settlement report format proven to cover both channels; the third unified-commerce check is stated as a test to run, not as a documented property.\n- Adyen's '95%' later-authorization figure for store-and-forward has no published dataset or method.\n- Country counts and terminal model lists change monthly; the chapter gives none as a load-bearing fact.\n\n## Decision log\n\n- **2026-11-17** — Open with the offline queue (who approved these payments?) and use Larkfield's scene for both of the chapter's questions, so the device and the channel join are each posed as a concrete request before any mechanism. Rejected: Opening with the part's 1,140-studio scene, which the conclusion returns to and the part introduction already uses.\n- **2026-11-17** — Put integration shapes before offline, because offline acceptance exists only on the in-store shapes and its risk cannot be weighed without them. Rejected: Offline directly after the liability rule, which would have grouped the two money topics but used 'local communications' before defining it.\n- **2026-11-17** — Carry the part's closing as two prose paragraphs inside 'What to Take Away', after the three tiers, with a six-layer table. Rejected: A separate closing section, which the style guide's page format does not have.\n- **2026-11-17** — Add documentation fetched in this session on cross-channel refunds (Adyen 'Refund a payment'; Stripe Terminal 'Refund transactions') and on Stripe's card fingerprint, because the research briefs had no dated evidence for the second unified-commerce check. Rejected: Presenting the refund path as inference only.\n- **2026-11-17** — Tap to pay gets one paragraph and hardware-first companies none: the first has little that differs architecturally from a terminal, and the second belongs to the contrast-cases chapter. Rejected: A section on tap to pay with country lists.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, contract for 11-in-person-payments — Scope, owned terms and the Larkfield thread.\n  - _research/brief-acquiring-methods-and-terminals.md, Part 3 — EMV, liability, PCI standards, tap to pay, offline, both companies' terminals and APIs, volumes, the open questions.\n  - _research/brief-adyen-payments-and-api.md (3.5), brief-card-data-tokens-and-authentication.md (1.4, cross-channel tokens), brief-companies-and-bets.md — Terminal API identifiers, encryption modes and questionnaires, Stripe Terminal's launch date, Adyen's terminal count.\n  - _research/scenario-ledger.md; _research/consistency-issues.md (rulings 8 and 17) — Larkfield's front-desk figures, the 1,140 studios, K3 and K8, Mila's refund; the gloss of 'liability shift' and the Mastercard limitation.\n- **External**\n  - Visa Core Rules and Visa Product and Service Rules, edition of 24 October 2026, https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf — Dispute Condition 10.1 and Table 11-1.\n  - EMVCo pages (n.d., accessed 2026-11); PCI SSC pages on P2PE and MPoC (n.d.); Apple, 'Tap to Pay on iPhone' (n.d.) — What the chip does, who enforces, P2PE and MPoC definitions, the PSP's role on a phone.\n  - Adyen documentation: Offline payments (2026-05-04), Choose an integration architecture (2023-12-06), Terminal API (2023-07-11), Refund a payment (2026-11-17), Card acquisition (2023-02-23), Tokenization (2026-11-17), E2EE and P2PE (2025-09-10), Select your terminals (2026-04-15) — Offline mechanisms and limits, local and cloud, nexo, references, omnichannel refunds, card alias, encryption modes.\n  - Stripe documentation (n.d., accessed 2026-11): Accept offline payments, Collect card payments while offline, Set up your integration (server-driven), Collect and save payment details, Refund transactions, Terminal overview, Stripe Reader S700/S710 — Store-and-forward and its ceiling, SDK and server-driven shapes, generated_card and fingerprint, refunds, encryption.\n  - Adyen press release 2022-08-18; Adyen Annual Report 2025; Adyen H2 2025 results release 2026-02-12; Adyen Q3 2026 Business Update; Stripe newsroom 2018-09-17 — In-house terminals, point-of-sale volume and share, transacting terminals, Terminal's launch.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 104 claims checked (91 confirmed, 5 corrected, 6 hedged, 0 unsupported and removed or relabeled, 0 unreachable, 2 term glosses not checked); the claim that neither company documents how terminal software updates are staged was wrong for Adyen (its 'Update to a new release' page documents gradual rollout and batches), so one supporting claim, the controlling idea and evidence of p15 and the evidence of the integrator-advice paragraph were reworded; no unit added, dropped, merged or reordered. Acceptance criterion AC-4 and thesis.how_why are copied from the journal spec and still say that neither company publishes fleet updates: the author must decide whether to change them there.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Initial outcome spec, written from the PLAN contract, the research briefs and pages fetched in the session; intent, thesis and role copied from the journal spec.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('the chapter says that neither company publishes its terminal' -> 'the chapter says that neither company publishes its terminal').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('neither publishes key management, fleet updates or failure r' -> 'neither publishes key management or failure rates, and only ').\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (ruling 28 / K3). Adyen documentation pages are now cited 'n.d., accessed 2026-11' instead of with 'last modified' metadata dates (ruling 30). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 5 statements of absence re-tested with a wide search (0 overturned, 2 narrowed, 3 hold; table in _research/absence-audit/11-in-person-payments.md). Narrowed: Stripe documents the timing of reader software updates (midnight local time; a required date that can vary across the fleet) though no rollout policy; a Stripe guide article says it handles key injection and decryption.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
