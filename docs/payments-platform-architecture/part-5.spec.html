<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-5 entry and the part thesis, opening and flow in journal-spec.json, the scenario ledger, and a full reading of the five written chapters of Part V. The page makes no external factual claim of its own: every statement about Stripe, Adyen, a network, a standard or a law repeats one a chapter of the part makes and cites.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part V argues that trust controls move card data, decisions and losses between parties instead of removing risk.\n- **Know:** The five chapters in order: card numbers and PCI scope, network tokens, fraud and risk scoring, 3-D Secure and strong customer authentication, compliance.\n- **Be able to:** Pick the Part V chapter that answers the question in front of them: where card numbers may go, why a stored card kept working or stopped, why a payment was blocked, who carries a fraud loss, or why a seller's payouts stopped.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to IV and are about to start the trust chapters, or who arrive with one question in hand (where card numbers may go, why a stored card kept working, why a payment was blocked, who carries a fraud loss, why a seller's payouts stopped) and want the chapter that answers it.\n\n**Already knows:**\n\n- Encryption, access control, audits, rate limits and webhooks as general engineering practice.\n- Parts I to IV: the issuer, the acquirer and the card network; authorization and disputes; the provider's API, its events and its limits.\n- Larkfield in outline: a fictional studio-software platform on Stripe and Adyen, and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- PCI scope, provider token, vault, network token, risk score, 3-D Secure, exemption, liability shift, capability, requirement: each is owned by a Part V chapter and is glossed in a clause here or only named.\n- How Stripe and Adyen differ on each control; the page states one documented fact per chapter and leaves the evidence to the chapter.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the part's claim and name the five chapters' subjects in reading order. *Probe:* After reading only this page: what does Part V argue, and what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with the Card-Testing Weekend as an event with its figures, not with a definition of trust or security. | `no_weak_introduction_pattern` | rubric | minor |\n\n## Thesis\n\n**Question:** What do the controls over card data, fraud, authentication and compliance actually do for a business that takes payments?\n\n> **Claim:** Each control relocates something and leaves something behind: tokenization moves card numbers to the provider's vault and leaves the merchant the page around the card fields; a network token moves the stored credential to the card network and leaves the merchant holding a provider token behind which the credential can change without its action; a risk score moves the allow-or-block decision to the provider's model and leaves the merchant the loss on what it accepts; 3-D Secure moves the fraud loss to the issuer when the payer is authenticated and leaves it with the merchant on every payment that is merchant-initiated or exempted at the request of the merchant's side; and verification moves the duty to know a seller to the regulated provider and leaves the platform the deadlines, whose lapse stops that seller's payouts.\n\n**Disputed by:** The view that these are security and compliance features which, once switched on at a certified provider, take card-data, fraud and regulatory risk off the merchant's or platform's hands.\n\n**So what:** A team that accepts the claim stops asking 'are we compliant?' and asks, for each control, what moved, to whom, and what came back: a script inventory, a stored-card exit plan, a fraud threshold it has priced, an exemption policy, and an owner for every verification deadline.\n\n**How and why:** Each control is defined by a rule that assigns responsibility, not by a technology that destroys risk. PCI DSS scope follows the path the card number takes. EMVCo describes a payment token as constrained to a specific merchant, device or payment scenario, with the network holding the mapping to the card. Stripe's documentation says the merchant is 'ultimately responsible for payments you choose to accept'. PSD2 Article 74(2) puts the loss on whoever avoids strong authentication. Anti-money-laundering law obliges the regulated provider, and both Stripe and Adyen pass that duty on as requirements with deadlines on an account. In every case the rule names a new holder and leaves a remainder with the business.\n\n**Supporting claims**\n\n- **P5-1** — Hosted card fields, provider tokens and an isolated vault move card numbers and most PCI scope from the merchant to the provider, and leave the merchant the page that hosts the fields and stored cards that exist for it only as that provider's tokens.\n- **P5-2** — A network token moves the stored credential, with its validity and its updates, from the provider's vault to the card network; the card survives a reissue, and the approval and fraud gains reported for tokens are the networks' and providers' own comparisons.\n- **P5-3** — A risk score moves the allow-or-block decision in front of the issuer to a model that learns weeks later whether it was right; the merchant keeps the loss on fraud it accepts and the cost of good customers it refuses.\n- **P5-4** — 3-D Secure moves the loss from a fraud dispute to the issuer only when the payer is authenticated; an exemption or a merchant-initiated payment leaves it with the party that asked, so choosing when to authenticate is choosing who carries the loss.\n- **P5-5** — Know-your-customer and monitoring duties sit with the regulated provider, which turns them into requirements with deadlines that switch a seller's capabilities on and off; the platform keeps the work of tracking that state, which can regress without the seller doing anything.\n\n## Role in the part\n\nPerforms the part's opening: the Card-Testing Weekend, the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `small_to_large` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on one weekend at one studio, widens it into the part's claim, and only then lists the chapters. The weekend comes first because it is the case in which the usual view fails in plain sight: Larkfield held no card numbers and still paid. The bridge names that usual view before the claim replaces it. The claim (five controls, each moving something and leaving something) has to precede the reason for it (each control is a rule that assigns responsibility) and the limit of its evidence, because both speak about 'the five controls' as a set. All three precede the chapter list because each chapter paragraph names what its control moves and what it leaves; a reader not yet told that controls relocate would read the list as five unrelated security topics. The chapter paragraphs keep the part's own order, credential, payer, party being paid, which the journal spec justifies as a prerequisite order; reordering them here would contradict the roadmap.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): On the weekend of 8–9 August 2026, bots used one studio's public booking widget to test 61,000 stolen card numbers with €1 drop-in payments. Larkfield stored none of those numbers and nothing was stolen from it. It still paid €4,100 in fees and refunds, and the studio could not sell online for 31 hours.\n\n**Bridge:** The engineer's sense of security as something you add and then have: encrypt it, put it behind a provider, pass the audit. → The payments view, in which every control names who holds the data and who pays when it fails.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p03; bullet 3 (the controls are linked, and what stays needs an owner) is the so-what stated in p04.): Each trust control relocates something (card numbers, the stored credential, the allow-or-block decision, the fraud loss, the duty to know a seller) to another party and leaves something behind with the business that takes payments; none makes the risk disappear.\n\n**Roadmap** (paragraph p06):\n\n- Five chapters, each asking what a control moves and what it leaves behind: card numbers into a vault; the stored credential to the card network; the fraud decision to a model; the fraud loss to the issuer when the payer is authenticated; and the duty to know the seller, which returns as account state with deadlines. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | On the Card-Testing Weekend of 8–9 August 2026 bots tested 61,000 stolen card numbers through one Larkfield studio's public booking widget; Larkfield stored none of them and lost no data, and it still paid €4,100 in provider fees and refunds and the studio could not sell online for 31 hours. | scenario: Larkfield (fictional): the Card-Testing Weekend, 8–9 August 2026: 61,000 stolen card numbers tested with €1 drop-in payments through one studio's public booking widget; €4,100 in fees and refunds; the studio's online payments off for 31 hours.; scenario: As chapter 22 states: not one of the 61,000 numbers reached a Larkfield server, log or database, because a frame served by the provider collected them.; figure: Figure 1: bots send a stream of cards into a booking page; the card numbers pass to a provider and none reach the platform's server; the platform is left with a bill of €4,100 and a studio closed for 31 hours. |  |\n| p02 | context | The weekend contradicts the engineer's sense that security is something you add and then have; in payments every control instead names who holds the data and who pays when it fails, and that assignment is what Part IV's API could not hide. | reasoning: The part's bridge and transition_in: from security as a property you add (encrypt it, put it behind a provider, pass the audit) to controls that assign data and losses to named parties; Part IV closed on what an API cannot hide. | `contrast`: The weekend: no card numbers held, and a bill and an outage all the same. → The belief it contradicts, and the payments view that replaces it: a control names a holder and a payer. |\n| p03 | claim | Part V's claim is that each of five controls relocates something and leaves something behind: tokenization moves card numbers to the provider's vault and leaves the page; a network token moves the stored credential to the card network and leaves a provider token behind which the card can change; a risk score moves the allow-or-block decision to the provider's model and leaves the loss; 3-D Secure moves the fraud loss to the issuer only when the payer is authenticated; verification moves the duty to know a seller to the provider and leaves the deadlines. | reasoning: The part thesis: the five relocations and the five remainders, as claimed in journal-spec.json and argued one per chapter (P5-1 to P5-5).; figure: Figure 2: a business at the left; five arrows carry something to five holders (vault, card network, risk model, issuer, provider); five small tiles stay at the business (page, token, threshold, exemptions, deadlines). | `example`: The payments view: a control names who holds what. → The five controls of the part, each stated as what moves, to whom, and what stays. |\n| p04 | analysis | The controls behave this way because each is defined by a rule that assigns responsibility, not by a technology that destroys risk, and the rules are linked; so the useful question for a team is not 'are we compliant?' but what moved, to whom, what came back, and who owns it. | fact: As the chapters cite: PCI DSS scope follows the path the card number takes (tokenization-vaulting-and-pci); Stripe's documentation says the merchant is 'ultimately responsible for payments you choose to accept' (payment-fraud-and-risk); PSD2 Article 74(2) puts the loss on the side that avoids strong authentication (three-d-secure-and-sca).; fact: As chapter 22 cites: Stripe's PCI guide says Radar 'is only available when using any of our methods for client-side tokenization', so the way a card is collected decides what the fraud model can see.; reasoning: The part's so_what: for each control, what moved, to whom, and what came back (a script inventory, a stored-card exit plan, a priced threshold, an exemption policy, an owner for every verification deadline). | `cause_effect`: The five relocations and their remainders. → Why they have that shape (rules that assign responsibility), that they are linked, and the question that follows for a team. |\n| p05 | context | The part argues from what Stripe and Adyen publish, and the record is uneven: neither publishes a vault design, Adyen has published little about its fraud-risk model, both companies say that they monitor transactions but not how, and the gains reported for tokens are the vendors' own comparisons. | fact: As the chapters establish: neither company publishes a vault design (tokenization-vaulting-and-pci); the approval and fraud figures for network tokens are vendors' comparisons that cannot be compared with one another (network-tokens); Adyen has published little about its fraud-risk model: two knowledge-hub articles (16 August 2024, 17 January 2025) name tree-based ensembles, a predicted chargeback probability and a median latency allocation of 20 ms per model endpoint, and nothing on features, training data or performance (payment-fraud-and-risk); both companies state that they monitor transactions and screen against sanctions lists (Stripe's financial crimes policy statement, November 2023; Adyen's compliance-obligations page, n.d.), and neither publishes its monitoring scenarios or sanctions-screening logic (payment-compliance-and-regulation). | `contrast`: The claim and the question that follows from it. → The limit of the evidence behind the claim: what the two companies document and what neither publishes. |\n| p06 | transition | The five chapters go from the credential, to the person using it, to the business being paid, each opening on a case at Larkfield and each asking what its control moves and what it leaves behind. | reasoning: The part's roadmap and flow rationale: two chapters on the credential (vault, network token), two on the payer (fraud score, authentication), one on the party being paid (verification); each needs the one before. | `sequence`: The claim, its reason and the limits of its evidence. → The five chapters in reading order and their grouping: credential, payer, party being paid. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question about one control, opens on one Larkfield case, and says what the control moves and what it leaves with the business.\n\n**Advances the thesis** (P5-1, P5-2, P5-3, P5-4, P5-5): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five chapters in order (p06). → One paragraph per chapter: the question in bold, the Larkfield case it opens on, and what the control moves and leaves.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. The network token is defined against the provider token and the vault, so the vault chapter comes first. Fraud scoring starts from what a vault and a token cannot do, stop a stolen number being typed in. Authentication is the third action of a risk rule and its exemptions depend on a fraud rate, so it follows fraud. Compliance comes last because it changes the subject from the payer to the seller and from a decision per payment to a state per account. Putting authentication before fraud would ask the reader to weigh an exemption before knowing what a risk score is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | The tokenization chapter, which opens on the weekend's 61,000 numbers that never reached a Larkfield system, answers how providers keep card numbers out of everyone's systems, including most of their own: a frame the provider serves, a token and an isolated vault move the numbers and most PCI scope to the provider and leave the merchant its payment page and stored cards held only as tokens, as Larkfield finds when it cannot sign the script line of the shortest PCI form. | scenario: Larkfield (fictional): in January 2027 Jonas Weber cannot sign the SAQ A line on script attacks; Tom Hendriks counts 17 third-party scripts from 9 domains on the payment step.; fact: As chapter 22 documents: at both Stripe and Adyen a redirect or hosted card fields lead to SAQ A and raw card numbers to the API lead to SAQ D; Stripe documents a vault that shares no credentials with its other services, Adyen names its vault and publishes less, and neither publishes a design. |  |\n| p08 | description | The network-token chapter answers what a network token is and why the card networks push every stored card toward one: it is a substitute card number the network issues and keeps pointing at the customer's current card, which moves the stored credential to the network, as Lotte Smit's renewal on a replaced card shows, and the gains published for it are vendor comparisons. | scenario: Larkfield (fictional): Lotte Smit's €49.00 membership renews on 1 March 2027 although her bank replaced the card ending 4417 in February; the app still shows 4417.; fact: As chapter 23 documents: Stripe and Adyen each keep the card number and choose token or card number per attempt; Visa says six basis points, Adyen 3% and Stripe 3.8% for a bundle, figures that cannot be compared. | `contrast`: The provider token of the previous chapter, which means something only inside one provider's vault. → A token the card network issues, which reaches the bank and stays valid when the card changes. |\n| p09 | description | The fraud chapter answers how a provider decides during an authorization whether a payment is fraud: it cannot know, so it estimates the chance of a later fraud dispute and blocks above a threshold before the bank is asked; the decision moves to the model, the loss and the refused customers stay with the merchant, and the chapter returns to the Card-Testing Weekend to show why card testing has to be stopped before authorization. | scenario: Larkfield (fictional): the Card-Testing Weekend in detail, and Femke de Graaf's two thresholds: break-even 96% for a first membership payment and 52% for a €16 guest drop-in (assumptions).; fact: As chapter 24 documents: Stripe's October 2026 figures show 41% of fraud disputes reported by day 14 and 86% by day 60; Stripe's documentation says the merchant is 'ultimately responsible for payments you choose to accept'. | `problem_solution`: A vault and a token, which protect a stored card. → What they leave open: a number stolen elsewhere and typed into the checkout, which something has to judge per payment. |\n| p10 | description | The authentication chapter answers how the card's bank checks who is paying and how providers decide when to ask: the bank answers through 3-D Secure, and a fraud loss moves to it only when that check happens, so an exemption or a merchant-initiated renewal leaves the loss with the merchant, as Bram de Wit's unchallenged €120.00 pass costs Studio Noord €135.00. | scenario: Larkfield (fictional): on 12 January 2027 Mila Janssen is challenged setting up her €49.00 membership; on 2 February Bram de Wit buys a €120.00 pass unchallenged; the chargeback of 24 February costs Studio Noord €120.00 plus a €15.00 fee, €135.00.; fact: As chapter 25 documents: a requested exemption and a merchant-initiated payment carry no liability shift (Stripe and Adyen documentation); Stripe places the merchant's authentication rules inside Radar, Adyen in a separate list, Dynamic 3D Secure. | `elaboration`: The risk rule's third action between allow and block, 'request 3-D Secure'. → What that action is: handing the question of who is paying to the issuer, with the loss following the question. |\n| p11 | description | The compliance chapter answers what a payment company must know about the businesses it pays and how that becomes software: the duty sits with the regulated provider and returns to the platform as requirements with deadlines that switch payouts on and off, as 230 Frozen Studios learned in May 2026; the chapter also closes the part. | scenario: Larkfield (fictional): the Frozen Studios, May 2026: a verification requirement changed and 230 studios went without payouts for up to 12 days; Keel decision K6, 'verification is state, not a form'.; fact: As chapter 26 documents: Stripe announces rule changes as data in `future_requirements`; Adyen documents its periodic data review as a flow; neither publishes how it monitors transactions or screens against sanctions lists. | `contrast`: Four chapters about the payer and the card, each a decision about one payment. → The other end: the business being paid, held as a standing state on an account. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the five chapters turn 'are we compliant?' into five answerable questions of one form: what moved, to whom, and what stayed. Read singly, each answers the question a reader arrives with: where card numbers may go, why a stored card kept working, why a payment was blocked, who carries a fraud loss, why a seller's payouts stopped.\n\n**So what:** For any control a provider offers, the reader asks what stayed with the business and who owns it before counting the risk as handled.\n\n**Callback:** The Card-Testing Weekend of the opening (p01). The reader is told that the weekend returns twice: in the first chapter as the control that worked, and in the third as the attack that control was never about.\n\n**Takeaway** (`course_of_action`): Begin with the tokenization chapter: the first and oldest relocation, of the card number itself.\n\n**Hand-off** to [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html): `example`: The part's claim that a control moves data or liability and leaves a remainder, and the Card-Testing Weekend, in which Larkfield held no card numbers. → The first and oldest case of the claim: moving the card number itself out of the merchant's systems, and what stays behind.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | synthesis | The five chapters each answer one question a reader may arrive with, and the opening weekend returns in two of them, as the control that worked and as the attack it was never about; the first and oldest relocation is the card number itself. |  |  |\n\n## Non-goals\n\n- Teaching PCI scope, tokens, risk scoring, 3-D Secure or verification; the page summarizes and does not re-argue the chapters. See [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html), [The Card Number's Replacement: Network Tokens and Credential Lifecycle](network-tokens.html), [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html), [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html), [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- The part's closing (the five controls as one system, the table of what moved, to whom, what stayed and its owner, the weekend set beside the Frozen Studios). See [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure-pattern callout and Questions to Ask; part intros do not carry them (style guide).\n- External factual claims of the page's own; every company, network, standard and regulatory statement repeats a chapter of the part, which cites it.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The closing sentence 'Begin with …' sits under its own heading, 'Where to Begin', as the conclusion's one paragraph, as in the Part I and II introductions. Rejected: Ending the 'Chapters in this part' section with it: the draft checker reads a conclusion only from a heading of its own.\n- **2026-11-17** — The links between controls get one example in the lead (card collection decides what the fraud model sees); the full set is left to chapter 26, which carries the part's closing. Rejected: Listing all four links here, which would pre-empt the closing synthesis.; Leaving the links out, although the third key point and the part's 'believe' outcome name them.\n- **2026-11-17** — The hook does not name the provider of the attacked studio or split the 61,000 attempts; the ledger leaves the provider unnamed and chapter 24 owns the split. Rejected: Repeating the blocked/declined/approved split, which is an illustrative assumption owned by chapter 24.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-5: thesis, opening, flow, transition_in; post entry part-5; the five chapter entries) — Intent, thesis, role, hook, bridge, roadmap, the order of chapters and their declared transitions.\n  - _research/scenario-ledger.md — The Card-Testing Weekend, the Frozen Studios, Keel decisions K4 and K6, the additions by chapters 22 to 26.\n  - posts/22-tokenization-vaulting-and-pci, 23-network-tokens, 24-fraud-and-risk-systems, 25-3ds-and-sca, 26-kyc-aml-and-regulation (index.md, read in full) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n\n## Changelog\n\n- **2026-11-17** — Spec created from the journal spec and the five written chapters of Part V.\n- **2026-11-17** — After the flow rubric: p01 says what the €4,100 was (provider fees and refunds), and p07 names the tokenization chapter's return to the weekend, so the conclusion's callback (the weekend returns in two chapters) rests on what the chapter list says. Notes not acted on: the roadmap paragraph (p06) is kept although the chapter section repeats the order, because the style guide and AC-1 ask for the reading order in the lead; p03 keeps all five move/leave pairs because it is the thesis statement AC-1 probes, and the chapter paragraphs add the question, the case and the evidence; p08 keeps 'vendor comparisons' although p05 names the limit, because it is that chapter's own finding.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass (part introduction, checked against the corrected chapters 22-26): 21 claims checked (20 agree, 1 corrected to match, 0 removed); the Radar availability rule is attributed to Stripe's PCI guide, as chapter 22 was hedged.\n- **2026-11-17** — Reconciliation after verification (17 November 2026): hook says the studio 'could not sell online' for 31 hours, as the ledger and chapter 24 do.\n- **2026-11-24** — Part thesis claim reworded as approved by the author after verification (clause made too strong by the verified sources).\n- **2026-11-17** — Absence audit (17 November 2026): the three statements of absence in the evidence paragraph re-tested with a wide search. 'Neither publishes a vault design' holds; 'Adyen's fraud-risk model is not public' narrowed to 'has published little' (model family and a latency allocation are on record); the monitoring sentence now says both companies state that they monitor, not how.\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
