<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** How a payment is divided on each provider: on Stripe an application fee or later transfers between balances, depending on the charge type; on Adyen a list of typed split instructions sent with the payment or applied from a store's profile.\n- **Know:** Who pays the processing fee in each setup, and why on Adyen some fees are not known when the payment is made.\n- **Know:** What a refund and a chargeback do to a payment that was already split and paid out, and the tools for recovering the seller's share.\n- **Know:** How seller payouts are scheduled on each provider and what a top-up is.\n- **Believe:** A split is not final when the seller is paid; it is final when the payment can no longer be refunded or disputed.\n- **Believe:** 'Payment succeeded' does not prove 'seller credited'; only reconciling each leg does.\n- **Be able to:** Write the ledger entries for one split payment, its payout and a later refund, keyed so the refund finds the bookings it must unwind.\n- **Be able to:** Say, for a refund or chargeback after payout, whose balance is debited first and how the platform recovers the seller's share.\n- **Be able to:** Compute a per-seller exposure figure from paid-out volume and the refund and dispute windows.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a split payment the chapter does not contain, refunded after the seller was paid, the reader says who is out of pocket if the seller cannot repay and what record the platform needed in order to unwind the split. *Probe:* A marketplace charges a buyer €200 through its own account at the provider, keeps €20 and credits the seller €180, which is paid out to the seller's bank on Friday. On Monday the buyer is refunded in full. The seller's balance at the provider is empty and the seller does not answer. Using only this chapter: who has paid for the refund so far, how can the marketplace try to get the €180 back, and what must it have recorded on Friday to do so? | `custom` | cold_reader | major |\n| AC-2 | The reader can explain why an approved payment on Adyen does not prove that the seller was credited, and name what to reconcile. *Probe:* On Adyen, a payment with split instructions is approved. Using only this chapter: can the platform conclude that the seller's balance account was credited? Why or why not, and what should it check? | `custom` | cold_reader | major |\n| AC-3 | The worked example splits Mila's €120.00 into €117.47 for Studio Noord and a €2.53 Larkfield fee, with the €0.61 provider cost labeled as an assumption, and the refund of €84.00 on 18 March 2027 follows the payout of 11 March, all as in the scenario ledger. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How is one payment divided among platform, seller and provider, and how does each get paid?\n\n> **Claim:** A payment is divided by booking parts of it to balances inside the provider: the seller's share to the seller's balance, the platform's fee to the platform's, and the provider's fee deducted from whichever of the two the configuration names; seller and platform are then paid by later payouts from their balances. Because sellers are paid before the refund and dispute window closes, the division is provisional: a refund or chargeback after payout is funded by the platform whenever the payment was booked through it, and the platform must then recover the seller's share itself.\n\n**Disputed by:** The view that a split is arithmetic done once at payment time (compute the fee, send the rest), that a refund runs the same arithmetic backwards, and that the provider keeps the parties square.\n\n**So what:** The platform needs a ledger entry for every leg of a split, keyed so a refund can find what to reverse, a per-seller figure for paid-out volume that can still come back, and a reconciliation that checks each seller was credited; a platform that only tracks 'paid' discovers the shortfall later, as an unexplained difference between its own ledger and the provider's balances.\n\n**How and why:** On Stripe the division is a set of movements between the platform's and the seller's balances that follows the charge type; on Adyen it is a list of typed split instructions declared with the payment. Stripe's documentation (n.d., accessed November 2026) moves the full amount of a destination charge to the seller and the application fee back to the platform, debits the platform's balance for a refund or dispute on a charge made through the platform, and leaves recovery to a transfer reversal the platform requests; a direct charge debits the seller's balance instead. Adyen's (n.d., accessed November 2026) takes a splits list with types for the seller's share, the commission and each fee, calculates transaction fees after the payment, allows a refund to be deducted only from the balance accounts that were credited, and has the platform choose where a chargeback will be booked when it sends the payment. Two documented differences matter to an integrator: Adyen fixes the chargeback booking at payment time where Stripe leaves the reversal to dispute time, and a split naming a missing or closed balance account is booked to the liable account without an error on Adyen, where a Stripe transfer fails. Each company has published a general account of its internal ledger; how either books a platform's splits and transfers in it is not public.\n\n**Supporting claims**\n\n- **S1** — A split is a set of bookings to balances inside the provider: the seller's share to the seller's balance, the platform's fee to the platform's, the provider's fee deducted from whichever of the two the configuration names; each party is paid later, by a payout from its balance.\n- **S2** — On Stripe the division is a set of movements between the platform's and the seller's balances that follows the charge type; on Adyen it is a list of typed split instructions declared with the payment, in which fees are assigned by type because their amounts are calculated afterwards.\n- **S3** — The division is provisional because sellers are paid before the refund and dispute window closes: a refund or chargeback after payout debits the balance the payment was booked through, and the platform must recover the seller's share itself with the tools the provider documents.\n- **S4** — The two providers differ on two points an integrator must design for: Adyen fixes the booking of a chargeback when the payment is sent and books a split that names a missing or closed balance account to the liable account without an error; Stripe leaves the reversal to dispute time and fails the transfer.\n- **S5** — A platform therefore needs a ledger entry for every leg of a split, keyed so a refund can find what to reverse, a reconciliation that checks each seller was credited, and a per-seller figure for paid-out volume that can still come back.\n\n## Role in the part\n\nTurns the loss assignment into money movements: shows where each euro of a payment is booked, when it leaves the provider, and whose balance funds a reversal that arrives afterwards. Supports P7-3, P7-1 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in bookings, stripe-split, adyen-split, reversals, payouts: each supplies the vocabulary the next uses; `comparison` in designs, where-they-differ; `chronological` in in-practice, when-it-goes-wrong)\n\nThe reader meets €317,200 of unrecorded refunds before any term is defined, so the split-as-bookings arrives as the explanation of a loss they have already seen. The definition must precede the providers' mechanics, because both are read as instances of it. The forward split on each provider precedes reversals, since a refund or chargeback is described by which of those bookings it debits. Payout schedules follow reversals because the reader then knows why the emptying of the balance matters; placed earlier they would be configuration detail. Designs and the comparison need all the mechanics; the worked example needs the comparison, since it runs the same payment through both; the failures come last because each is a departure from the example.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Dividing €120.00 among a studio, a platform and a payment provider looks like one line of arithmetic: €117.47, €2.53, and a processing cost taken out of the €2.53. Larkfield ran that line 31.4 million times in 2026. At the end of 2025 its books still said it owed studios €412,000 more than the two providers were holding for them, and €317,200 of the difference was refunds made after the studio had been paid.\n\n**Bridge:** An engineer sees a split as a pure function of the amount: compute the fee, send the rest, and run the same function backwards for a refund. → At a provider a split is a set of bookings to balances that are emptied on a schedule, so the backward run meets a balance that no longer holds the money.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p02): A payment is divided by booking parts of it to balances inside the provider, and each party is paid later from its balance; because sellers are paid before the refund and dispute window closes, the division is provisional, and a reversal after payout is funded by the platform whenever the payment was booked through it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the €317,200 of refunds after payout that Larkfield's books had never recorded. *Kept in:* scene.\n- Define a split as bookings to balances and show why it stays open after the seller is paid. *Kept in:* bookings.\n- Read how each provider divides a payment: Stripe by charge type, Adyen by typed split instructions. *Kept in:* stripe-split, adyen-split.\n- Follow a refund and a chargeback against a payment that was already split, and the tools for recovering the seller's share. *Kept in:* reversals.\n- Describe seller balances, payout schedules, top-ups and sellers in other countries. *Kept in:* payouts.\n- Compare three places to book the split, then the two providers. *Kept in:* designs, where-they-differ.\n- Split Mila's €120 on both providers, refund €84 after the payout, and list what goes wrong. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Dividing €120.00 three ways looks like arithmetic, yet a platform that did it 31.4 million times a year ended with €317,200 of refunds after payout that its books had never recorded. | scenario: Mila's €120.00 pass divided into €117.47 and €2.53; 31.4 million payments in 2026; the Unexplained €0.4 Million of year-end 2025, of which €317,200 was refunds after payout. |  |\n| p02 | claim | A split is a set of bookings to balances inside the provider that are paid out on a schedule, so the division is provisional until the payment can no longer be refunded or disputed, and a reversal after payout is funded by the platform whenever the payment was booked through it. |  | `problem_solution`: Arithmetic that was right and books that were wrong. → The chapter's claim: a split is bookings that stay open, not a calculation done once. |\n| p03 | context | In the journey of Mila's class pass this chapter is the moment after capture when €120.00 becomes three bookings, and the moment nine days later when €84.00 has to come back out of a balance already paid. | scenario: Pass bought Tuesday 9 March 2027 at 19:42; studio paid Thursday 11 March; refund of €84.00 requested 18 March. | `place`: The claim about splits in general. → Its two positions on the recurring payment's journey. |\n| p04 | transition | The chapter goes from Larkfield's unrecorded refunds to the split as bookings, then each provider's way of dividing a payment, reversals after payout, payouts and top-ups, three designs, the comparison, the worked example and the failures. |  | `sequence`: The claim and where it sits on the journey. → The order in which the chapter argues it. |\n\n## Sections\n\n### Setting the Scene at Larkfield: €317,200 Nobody Had Booked\n\n**Controlling idea** (`example`, id `scene`): Larkfield computed each studio's share once, at payment time, and had no entry for a refund that arrived after the studio was paid, which accounts for €317,200 of its unexplained €412,000.\n\n**Advances the thesis** (S3, S5): Shows the cost of treating the split as final before any mechanism is named.\n\n**Transition in:** `example`: The claim that a split stays open after the seller is paid. → One company whose books closed it at payment time.\n\n**Order of paragraphs** (`chronological`): What the books said, why they said it, then the questions it left for 2027: the reader arrives at the chapter's questions the way Femke did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | At year-end 2025 Larkfield's ledger said it owed studios €412,000 more than the two providers held for them, and refunds after payout were €317,200 of that. | scenario: The Unexplained €0.4 Million: €412,000, of which refunds after payout €317,200, chargeback fees €73,500, currency rounding €21,300. |  |\n| p06 | cause_effect | The cause was that Larkfield's posting job wrote an entry when a payment became paid and when a payout was created, and nothing when a refund reached a balance that had already been paid out. | scenario: The 2025 ledger was posted by a nightly job on 'paid' and on payout creation; refunds after payout had no entries of their own until Keel (K3). | `cause_effect`: The €317,200. → Why it was invisible: no entry existed for the movement. |\n| p07 | claim | The finding leaves Femke de Graaf three questions in 2027: where each euro of a payment is booked, whose balance funds a reversal that arrives after the seller was paid, and when the money leaves the provider. |  | `conclusion_summary`: The missing entry. → The three questions the chapter answers. |\n\n### A Split Is a Set of Bookings, and the Bookings Stay Open\n\n**Controlling idea** (`explanation`, id `bookings`): A split books parts of one payment to balances inside the provider, and because those balances are paid out within days while the payment stays reversible for months, the split is not final when the seller is paid.\n\n**Advances the thesis** (S1, S3): Defines split, platform fee, seller balance, transfer and payout, and establishes the timing gap that makes the division provisional.\n\n**Transition in:** `elaboration`: The question of where each euro is booked. → The split as bookings to three parties' balances.\n\n**Order of paragraphs** (`prerequisite_order`): The split and its three parties are defined before the movements that carry it, the movements before the clock that reopens them, and the liability rule last because it needs all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A split is the instruction that divides one customer payment among the seller, the platform and the provider by booking each part to a balance in the provider's books. | table: Three parties: what each receives from Mila's €120.00 (studio €117.47; platform fee €2.53; provider cost €0.61, an assumption), which balance it is booked to, and how it leaves. |  |\n| p09 | definition | A transfer moves money between two balances inside the provider and a payout moves it from a balance to a bank account, so a split consists of transfers and each party is paid by a later payout. | quotation: Adyen: an internal funds transfer 'moves funds between balance accounts within your platform. For comparison: a payout is an external funds transfer'. | `elaboration`: The balances a split books to. → The two kinds of movement, transfer and payout, and the seller balance between them. |\n| p10 | cause_effect | The seller is paid within days and the payment can be refunded at any time and disputed for about four months, so every payout leaves behind exposure: an amount that can still come back through a reversal, meaning a refund or a chargeback. | scenario: Mila's pass: payout Thursday 11 March 2027; card dispute window closes about 7 July 2027.; quotation: Stripe on Instant Payouts for platforms: they 'deliver funds before the dispute window closes'. | `contrast`: Bookings and payouts that look complete. → The window during which they can be reopened. |\n| p11 | claim | When a reversal arrives, it debits the balance the payment was booked through, and if that balance belongs to the platform, or stands behind a seller's empty one, the platform has paid and must recover the seller's share. | reasoning: The liability rule owned by the platform-models chapter: a loss falls first on the booked balance and then on the party assigned to cover that balance when it goes negative. | `cause_effect`: Paid-out money that can come back. → Whose balance it comes back out of, and the platform's position. |\n\n### Stripe: The Charge Type Decides Which Balances Move\n\n**Controlling idea** (`explanation`, id `stripe-split`): On Stripe Connect a split is a set of movements between the platform's balance and the seller's, and which movements occur follows from the charge type.\n\n**Advances the thesis** (S1, S2): Documents the three charge types as funds movements, with who pays Stripe's fee in each.\n\n**Transition in:** `example`: The split as bookings between balances. → How Stripe documents those bookings.\n\n**Order of paragraphs** (`grouping`): An overview table first, then one paragraph per charge type in the order seller-first, platform-first, collect-then-distribute, which is the order the designs section later generalizes; if the types came in another order the reader could not map them one to one onto the three designs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | comparison | Stripe documents three charge types, and each fixes where the payment first lands, how the seller's share and the platform's fee are moved, and whose balance pays Stripe's fee. | table: Direct charge, destination charge, separate charges and transfers: where the charge is created, how the seller is credited, how the platform is credited, who pays Stripe's fee.; quotation: 'The type of charge you create determines how the funds are distributed between your platform, the connected account, and Stripe.' |  |\n| p13 | process | In a direct charge the payment lands in the seller's balance, the application fee moves to the platform, and the platform chooses per account whether Stripe's fee is debited from the seller or from the platform. | quotation: 'You create a charge on your connected account, so the payment appears in the connected account’s balance, not in your platform’s balance'; 'You can choose whether to have Stripe debit fees directly from connected accounts or from your platform account.' | `elaboration`: The table's direct-charge row. → A charge that lands on the seller, with the fee payer chosen per account. |\n| p14 | process | In a destination charge with an application fee the full amount is transferred to the seller after capture, the fee is transferred back to the platform, and Stripe's fee comes out of the platform's balance. | quotation: 'the full charge amount is immediately transferred from the platform to the transfer_data[destination] account after the charge is captured. The application_fee_amount … is then transferred back to the platform.'; example: Stripe's worked example: 10.00 USD charge, 1.23 USD application fee, 0.59 USD Stripe fees; 'The application fee amount minus the Stripe fees (1.23 USD - 0.59 USD = 0.64 USD) remains in your platform account’s balance.' | `contrast`: A charge that lands on the seller. → A charge that lands on the platform: the two transfers inside it and who pays the fee. |\n| p15 | process | With separate charges and transfers the platform creates the charge and the transfers as unrelated calls, so the link between them, and the check that the money exists, are the platform's to keep. | quotation: 'The transfer_group only identifies associated objects. It doesn’t affect any standard functionality.'; fact: A transfer fails by default when it exceeds the platform's available balance and 'Stripe doesn’t automatically retry failed transfer requests'; source_transaction ties a transfer to a charge so it succeeds before the charge's funds are available. | `contrast`: Two charge types in which one call carries the split. → The type in which the split is separate calls the platform must link. |\n\n### Adyen: Typed Bookings Declared With the Payment\n\n**Controlling idea** (`explanation`, id `adyen-split`): On Adyen for Platforms a split is a list of typed bookings sent with the payment or applied from a store's profile; fees are assigned by type because their amounts are calculated afterwards, and the request does not check that the named balance accounts exist.\n\n**Advances the thesis** (S2, S4): Documents the splits list, the fee types, and the silent fallback that makes reconciliation per split necessary.\n\n**Transition in:** `contrast`: Stripe's movements chosen by charge type. → Adyen's bookings declared item by item.\n\n**Order of paragraphs** (`prerequisite_order`): The splits list is needed to read the fee types, and both are needed to see what the fallback does to them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | process | An Adyen split is a splits array on the payment, capture or refund request in which each item has a type, an amount where one is known, and the balance account to book it to, and an item without an account is booked to the platform's liable balance account. | table: Split types used in this chapter: BalanceAccount, Commission, PaymentFee and its components (Interchange, SchemeFee, AdyenMarkup, AdyenCommission), with what each books and to which account by default.; fact: Split configuration profiles apply the same logic per store from rules; without a catch-all rule 'any transaction that doesn't match a specific rule will be booked to your liable balance account by default'. |  |\n| p17 | cause_effect | The fee items carry no amount because Adyen calculates transaction fees after it receives the payment request, so the split names who bears each type of fee and the amount arrives later. | quotation: 'Transaction fees refer to the costs you incur on a transaction in your platform that are not known at the time of payment. They are calculated by Adyen after we receive the payment request. By default, these costs are deducted from your liable balance account'.; fact: Processing costs 'are aggregated and also applicable to refused and cancelled payments. Therefore, they cannot be allocated to individual payments.' | `elaboration`: The fee types in the splits list. → Why they have no amounts, and who pays by default. |\n| p18 | claim | An approved payment does not prove the seller was credited, because the request validates only the format of the split and books the whole amount and its fees to the liable balance account when the named account is missing or closed. | quotation: 'The API request validates only the format of the split instructions, not the balance accounts specified in the request. This means that even if the transaction is successful, it is possible that the funds are not credited to/deducted from the specified balance account. If the balance account does not exist, or it is linked to an account holder with a closed status, the full transaction and its fees are booked to your platform's liable balance account.'; fact: The Balance Platform Accounting Report 'tracks all balance changes on all balance accounts in your balance platform, including liable accounts and the accounts of your users'; transfer webhooks report each credit or debit of a balance account. | `contrast`: A split accepted with the payment. → What acceptance does not check, and what to reconcile. |\n\n### Refunds and Chargebacks Against a Payment Already Split\n\n**Controlling idea** (`explanation`, id `reversals`): A refund or chargeback debits the balance the payment was booked through, on Stripe by charge type and on Adyen by refund split and by chargeback logic set when the payment was sent, and recovering the seller's share is a separate step the platform takes with documented tools.\n\n**Advances the thesis** (S3, S4): Shows on both providers which balance a reversal debits and what the platform can do when the seller's balance is short.\n\n**Transition in:** `time`: Splits as they are booked at payment time. → What happens to them when money comes back days or months later.\n\n**Order of paragraphs** (`comparison`): Refund then dispute on Stripe, refund then chargeback on Adyen, so each pair can be read across; recovery comes last because it applies to all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | process | On Stripe a refund debits the connected account for a direct charge and the platform for the other two types, and the platform recovers the seller's share by reversing the transfer, a step that is off by default. | table: Refund by charge type: balance debited; how the seller's share is recovered; what happens if the balance is short (refund pending, fails after 45 days with insufficient_funds).; quotation: 'by default the destination account keeps the funds that were transferred to it, leaving the platform account to cover the negative balance from the refund.' |  |\n| p20 | process | A dispute on Stripe follows the same rule, debits the amount and the fee at once, and leaves the timing of the transfer reversal to the platform. | quotation: For charges created on the platform, 'with or without on_behalf_of, your platform balance is automatically debited for the disputed amount and fee'.; fact: Stripe's advice: 'If you challenge the dispute, wait for the dispute outcome before reversing the transfer'; 'Regardless of a dispute’s outcome, Stripe doesn’t automatically refund the application fee'. The second sentence stands under the guide's direct-charges heading. | `similarity`: Refunds debited by charge type. → Disputes, debited the same way, with the reversal timed by the platform. |\n| p21 | process | On Adyen a refund carries its own split, which can debit only balance accounts the payment credited, and a refund sent without a split may be booked in full to the liable balance account. | quotation: 'Refunds can only be deducted from the balance accounts to which the payment was credited.' Splitting a refund 'allows you to choose who is liable for the refund'.; fact: Without instructions Adyen uses a store profile, then a balance-platform default, then the capture's split ratio for a full refund of one capture; 'In all other cases, such as for refunds of partial captures, we book the full refund amount to your platform's liable balance account.' The logic is marked as in pilot. | `contrast`: Stripe, where the charge type decides. → Adyen, where each refund names its own bookings. |\n| p22 | process | On Adyen the booking of a chargeback is chosen before any chargeback exists, in a chargeback logic sent with the payment or capture, and the default is the platform's liable balance account. | quotation: 'Adyen withdraws the disputed funds from your platform's liable balance account'; the platform 'can change this behavior by booking the disputed amount to any of the balance accounts in your platform, or even splitting it between the accounts.'; fact: platformChargebackLogic.behavior: deductFromLiableAccount, deductFromOneBalanceAccount (with targetAccount), deductAccordingToSplitRatio; costAllocationAccount for the chargeback fees, by default the liable balance account. | `contrast`: A reversal decided when the dispute arrives. → A reversal decided when the payment is sent. |\n| p23 | comparison | When the seller's balance cannot cover its share, the platform stands behind it, by default on Adyen and on Stripe wherever the platform is responsible for negative balances, and both providers document tools for recovery: netting against future sales, a debit of the seller's bank account, and a movement between balances. | table: Recovery tools: Stripe (offset against future payments; transfer reversal, possible only if the balance suffices or connected reserves are enabled; debit_negative_balances; account debits with consent; platform reserve and transfer after 180 days) and Adyen (liable balance account stands behind negative user balances; top-up by direct debit from the verified bank account; internal transfer).; fact: Adyen: 'Adyen allows negative balances for up to 30 days. If a balance account has a negative balance for more than 30 days, Adyen compensates this by debiting your reserved compensation account on the first day of the following month.' A warning webhook is sent by default after 20 days. Managed Risk (pilot, limited availability): Adyen will 'assume the responsibility for negative balances' and writes them off after 180 days. | `problem_solution`: Reversals that debit a balance already paid out. → The documented ways to get the seller's share back, and where the documentation stops. |\n\n### Seller Balances, Payout Schedules and Top-Ups\n\n**Controlling idea** (`explanation`, id `payouts`): The seller balance is emptied by a schedule the platform configures, on Stripe by interval and delay and on Adyen by sales day and settlement delay, and the schedule, together with top-ups, is the platform's main control over how much paid-out money can still come back.\n\n**Advances the thesis** (S1, S3): Shows when each party is paid and that the payout schedule sets the size of the exposure.\n\n**Transition in:** `cause_effect`: Reversals that find the balance empty. → The schedule that empties it, and what the platform can set.\n\n**Order of paragraphs** (`grouping`): Stripe's schedule, Adyen's schedule, then the two special movements (money added from outside, money sent across a border) that the schedules do not cover.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | process | On Stripe the platform sets each connected account's payout interval and, where it bears the losses, a delay of up to 31 days, and a negative balance stops payouts until it is positive again. | fact: settlement_timing.delay_days 'reflects how long it takes for on_behalf_of charges (or direct charges performed on the connected account) to become available for payout'; it can be overridden 'to a number up to 31' on accounts where the platform owns fraud and dispute liability; minimum balances per currency.; quotation: 'While an account’s balance is negative, you can’t send payouts to the account’s bank or debit card on their behalf.' |  |\n| p25 | process | On Adyen a seller's funds settle to the balance account per sales day after a settlement delay, net of that day's refunds and chargebacks, and leave by a managed payout schedule or by a sweep the platform defines. | quotation: 'Adyen settles a settlement batch after its sales day ends and the configured settlement delay has passed. The date when the schemes or payment methods transfer the funds to Adyen does not affect this timing.'; fact: Managed payouts (release note of 20 May 2026): Standard 'two business days after capture', Accelerated one; weekdays, weekly or monthly; minimum, maximum and retained amounts; local payouts only. Custom payouts: a sweep on the balance account with a schedule, a trigger amount and a target amount. | `similarity`: Stripe's interval and delay. → Adyen's sales day, settlement delay and sweeps. |\n| p26 | definition | A top-up is bank money added to a balance at the provider that did not come from a customer payment, and the two providers scope it differently: Stripe documents it for the platform's balance, Adyen for a seller's balance account or the liable one. | fact: Stripe: 'Platforms can add funds to their balance from a bank account'; the availability table lists 'General availability' for 'USA, UK, Japan' and 'Private preview' for 'EU, Canada, Australia, New Zealand'.; quotation: Adyen: 'A top-up refers to an incoming transfer of funds from an external source that increases the balance in their balance account'; use case 'To cover negative balances resulting from refunds or chargebacks'; 'If needed, you can also top up your liable balance account.' | `contrast`: Money leaving a balance on a schedule. → Money entering a balance from a bank account. |\n| p27 | explanation | Paying a seller in another country is restricted on both providers, by listed regions and charge types on Stripe and by one balance platform per acquiring region on Adyen, where cross-border payouts go by custom payouts with no guaranteed arrival time. | fact: Stripe: 'Platforms based in the US, UK, EEA, Canada, or Switzerland can transfer funds to connected accounts in any of those regions'; supported for separate charges and transfers and destination charges without on_behalf_of, and top-ups and transfers.; fact: Adyen: 'You must have a separate balance platform for each region in which you acquire payments'; managed payout schedules support 'only … local payouts (within the same country and currency)', other cases use custom payouts. Custom payouts page: cross-border payouts may be processed through correspondent banks; 'The arrival time of the payout cannot be guaranteed'. | `additional_support`: Schedules and top-ups within one country. → What changes when the seller's bank account is in another one. |\n\n### Three Places to Book the Split, and What Each Costs\n\n**Controlling idea** (`comparison`, id `designs`): A platform can book a payment to the seller first, to itself first, or collect it and distribute later, and the choice trades the platform's exposure against its control and its bookkeeping.\n\n**Advances the thesis** (S3, S5): Turns the provider mechanics into three provider-neutral designs and states what each requires of the platform's own records.\n\n**Transition in:** `conclusion_summary`: Two providers' mechanics for splits, reversals and payouts. → The three designs those mechanics allow.\n\n**Order of paragraphs** (`comparison`): The three designs in order of how much the platform fronts and has to track, then the table that sets them side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | description | Seller-first booking puts the payment in the seller's balance and moves only the platform's fee, so reversals debit the seller first and the platform is exposed only when that balance goes negative. | reasoning: Stripe direct charges ('Refunds and chargebacks reduce the connected account’s balance'); Adyen split to the user's balance account with chargeback logic deductFromOneBalanceAccount. |  |\n| p29 | description | Platform-first booking puts the payment in the platform's balance and moves the seller's share out, so every reversal debits the platform and recovery is a second step. | reasoning: Stripe destination charges ('Refunds and chargebacks reduce your platform’s balance'); Adyen's default chargeback booking to the liable balance account. | `contrast`: The seller's balance debited first. → The platform's balance debited first. |\n| p30 | description | Collect-then-distribute keeps the payment on the platform until it decides who gets what, which handles several sellers and late decisions and makes the platform's own records the only link between the payment and its transfers. | reasoning: Stripe separate charges and transfers (Stripe: 'Use them only if your business use case requires them'; recommended 'only when you’re responsible for negative balances of your connected accounts'); Adyen split at capture or internal transfers. | `additional_support`: Two designs in which the split rides on the payment. → A third in which it is separate. |\n| p31 | comparison | The three designs differ in who is debited first, what the platform must record to unwind a payment, and which business they fit, and the choice follows from who the merchant is. | table: Design \\| Reversal debits first \\| Platform must record \\| Fits \\| Main risk — for the three designs. | `conclusion_summary`: Three designs described one by one. → Their trade-offs side by side and the author's rule for choosing. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): As documented in November 2026, Stripe divides a payment by charge type and decides reversals when they arrive, while Adyen divides it by typed bookings, fixes the chargeback booking at payment time and does not reject a split that names a missing account.\n\n**Advances the thesis** (S2, S4): Sets the documented differences side by side and says what an integrator does differently on each.\n\n**Transition in:** `contrast`: Designs that exist on both providers. → The points where the two providers' documented behavior differs.\n\n**Order of paragraphs** (`comparison`): The table of documented differences first and the integrator's consequences second, because each recommendation cites a row.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | comparison | Six documented differences separate the two providers: how the payment is divided, when the provider's fee is known, how a refund after payout is booked, when a chargeback's booking is decided, what a bad split does, and what the payout timing is based on. | table: Aspect \\| Stripe \\| Adyen \\| What the difference suggests: six rows, every cell a fact cited earlier in the chapter; last column labeled inference. |  |\n| p33 | recommendation | An integrator on Stripe must choose the charge type knowing it fixes the refund and dispute debit and must look for failed transfers and pending refunds, and on Adyen must set chargeback logic on every payment and reconcile bookings per split. |  | `cause_effect`: The six differences. → What to do differently on each provider. |\n\n### In Practice at Larkfield: Mila's €120 Three Ways, Then €84 Back\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield books Mila's €120.00 as four ledger entries keyed by the payment's reference, so that the payout of 11 March and the €84.00 refund of 18 March each find the entries they continue, on Adyen as it happened and on Stripe as it would have.\n\n**Advances the thesis** (S5, S3): Works the ledger entries for one split, its payout and a later refund on both providers, and computes an exposure figure.\n\n**Transition in:** `example`: The differences between the providers. → One payment worked through both.\n\n**Order of paragraphs** (`chronological`): 9 March, 11 March, 18 March, then the figure that summarizes what stays open: the order of the events themselves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | example | On Adyen, Larkfield sends Mila's payment with two split items and a chargeback logic, and its ledger records three legs under the payment's reference, the provider's cost arriving as a later booking. | scenario: Splits: BalanceAccount 11747 to Studio Noord's balance account; Commission 253; fees left to the default (PaymentFee on the liable balance account). Result: €117.47 studio, €2.53 fee, €0.61 processing cost (assumption), €1.92 left to Larkfield.; table: Ledger entries for 9 March under K3: funds at provider, owed to Studio Noord, fees owed to Larkfield, provider cost; each with the PSP reference and the business event id. |  |\n| p35 | comparison | Had Studio Noord been on Stripe, the same division would be a destination charge with a €2.53 application fee, and the provider's cost would be a different, single figure known from the balance transaction. | scenario: Destination charge €120.00 with application_fee_amount 253 and on_behalf_of the studio: €120.00 transferred, €2.53 back; Stripe fee €0.87 at the ledger's blended rate of 0.6% + €0.15 (assumption), leaving Larkfield €1.66.; table: Mila's €120.00 three ways on each provider: studio, Larkfield's fee, provider cost, Larkfield net. | `contrast`: The payment as Adyen booked it. → The same payment as Stripe would have. |\n| p36 | example | The payout of Thursday 11 March moves €117.47 out of Studio Noord's balance toward its bank, and from that day the amount is exposure: paid out and still reversible. | scenario: Payout marked sent 11 March 2027, arrived 25 March under Larkfield's 10-business-day window; ledger: owed to studio, payouts in transit, funds at provider. | `time`: The bookings of 9 March. → The payout two days later. |\n| p37 | example | The €84.00 refund of 18 March is sent with a refund split that debits Studio Noord's balance account, which that week's sales cover, and Larkfield's ledger books it against the original payment's entries. | scenario: Refund €84.00 for seven unused classes; Larkfield's policy: the refund is debited from the studio's balance account and Larkfield keeps its €2.53 fee (illustrative policy); the studio's balance on 18 March holds €212.40 of later sales (assumption).; table: Ledger entries for 18 March, and the variant in which the balance is empty: 'to recover from studio' opened for €84.00, the liable balance account standing behind it. | `time`: The payout. → The refund a week after it. |\n| p38 | comparison | On Stripe the same refund would debit Larkfield's platform balance for €84.00, and Larkfield would ask for the transfer reversal in the same call, which Stripe's charges page says returns an error if the studio's balance is short. | fact: Refund with reverse_transfer=true: 'a proportional amount of the transfer is reversed'; the application fee stays with the platform unless refund_application_fee is set; 'If the refund request also attempts a transfer reversal, but the connected account has an insufficient balance, the refund request returns an error'. The guide to separate charges and transfers excepts accounts with connected reserves from the balance condition on a transfer reversal; the pages do not say which rule governs a reversal sent with a refund, and the chapter says so. | `contrast`: The refund on Adyen. → The same refund on Stripe. |\n| p39 | example | Larkfield's exposure figure per studio is the card volume paid out in the last 120 days less what has already been refunded or disputed, about €64,000 for a studio selling €16,000 a month, and it measures what can come back, not what will. | reasoning: Exposure = paid-out online card volume inside the 120-day dispute window, less reversals already booked; Studio Noord at an assumed €16,000 a month: 4 × €16,000 = €64,000. Larkfield-wide: about €156 million (ledger). | `conclusion_summary`: One payment's open half. → The same quantity summed per studio. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Splits fail quietly: a booking lands on the wrong balance, a refund waits for money that is not there, a reversal is made too early, or a seller's debt ages with no owner, and each is found by reconciling legs, not by watching payment statuses.\n\n**Advances the thesis** (S5, S4): Lists the failures with detection and recovery, each tied to documented provider behavior.\n\n**Transition in:** `contrast`: The example as it should run. → The ways it does not.\n\n**Order of paragraphs** (`chronological`): The failures in the order a payment can meet them: at the split, at the refund, at the dispute, and long after.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | analysis | A split can be booked to the wrong balance without any error at payment time, on Adyen through the fallback to the liable account and on Stripe through a transfer that fails and is not retried. | fact: Adyen: fallback to the liable balance account, corrected by an internal transfer ('To correct the balances, you can transfer the funds between the balance accounts'). Stripe: 'Stripe doesn’t automatically retry failures … You must explicitly attempt the transfer again.' |  |\n| p41 | analysis | A refund can be accepted and still not reach the customer: on Stripe it waits as pending when the debited balance is short and fails after 45 days, and on Adyen its outcome arrives later by webhook. | fact: Stripe: refund status pending; 'If your platform’s balance is still insufficient 45 days after you create the refund, the refund fails with a failure_reason of insufficient_funds.' Adyen: 'You get the outcome of the refund request asynchronously, in a REFUND webhook.' | `sequence`: A failure at the split. → A failure at the refund. |\n| p42 | analysis | Recovering a disputed amount from the seller before the dispute is decided creates a second movement to undo if the dispute is won, and on Stripe that return transfer fails if the platform's balance is short. | fact: Stripe: 'If you reverse the transfer for a disputed payment that you challenge and win, transfering those funds back to a connected account can have unexpected results: If your platform has an insufficient balance, the transfer fails.' Adyen books a chargeback reversal and a second chargeback by the logic set on the payment. | `sequence`: A failure at the refund. → A failure at the dispute. |\n| p43 | recommendation | A seller's negative balance that nobody ages becomes the platform's loss by default, after 180 days on Stripe and after 30 days on Adyen, so the recovery account needs an owner and a write-off rule. | fact: Stripe: 'if a connected account’s balance remains negative for 180 days, we transfer funds from the platform reserve to cover the negative amount.' Adyen: a balance account negative for more than 30 days is compensated from the platform's liable (reserved compensation) account on the first day of the following month.; scenario: Larkfield's 'to recover from studio' clearing account under K3; open items older than five business days go to Priya Raman's weekly review. | `sequence`: Failures tied to one event. → The failure that is only the passing of time. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The charge type, the splits list, the chargeback logic and the payout schedule are four settings that answer one question in advance: when money comes back, which balance pays first and how fast was that balance emptied. A platform sets all four at integration, usually for other reasons, and reads the answer only when the first late refund arrives.\n\n**So what:** A platform that tracks only 'paid' will meet its split decisions later as an unexplained difference between its ledger and the provider's balances; one that books every leg, reconciles every split and keeps an exposure figure per seller can state its position on any day, and can price or shorten that exposure with the payout schedule.\n\n**Callback:** The €317,200 of refunds after payout inside Larkfield's unexplained €412,000. The reader can now say what those refunds were (debits to balances already paid out, with no ledger entry on Larkfield's side) and which entries and which reconciliation would have shown them the day they happened.\n\n**Takeaway** (`course_of_action`): Record every leg of a split under the payment's reference, set the refund split and chargeback booking deliberately on each provider, reconcile bookings per seller against the provider's report, and keep a per-seller figure for paid-out volume still inside the refund and dispute windows.\n\n**Hand-off** to [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html): `elaboration`: The seller balance, which exists between the split and the payout and is emptied on a schedule. → What a platform can offer if that money stays, is spent or is advanced (an account, a card, financing), and what each requires of the provider's license and of the platform.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | synthesis (list) | Established: a split is bookings to balances; the debit for a reversal follows the booking; fees on Adyen are calculated after the payment; an approved payment does not prove the seller was credited. |  |  |\n| p45 | recommendation (list) | Depends on context: which design to use, how long to delay payouts, whether to return the platform's fee on a refund, and when to recover from the seller during a dispute. |  | `contrast`: What is settled. → What depends on the platform's sellers, margins and who the merchant is. |\n| p46 | recommendation (list) | The author's synthesis: the split is final when the windows close, not when the seller is paid, and the €317,200 was a set of entries Larkfield never wrote. |  | `emphasis`: Conditional recommendations. → The author's own position, with the callback to Larkfield's unexplained difference. |\n| p47 | recommendation (list) | Eight questions let the reader test a split design or a provider's platform product. |  | `sequence`: The take-aways. → Questions to carry into a design review. |\n| p48 | transition | The seller balance exists only between the split and the payout, and the next chapter asks what a platform can offer when that money stays, is spent or is advanced. |  | `elaboration`: The seller balance that the schedule empties. → Accounts, cards and financing built on that balance, and what each requires. |\n\n## Non-goals\n\n- Who the merchant is, account configurations, the liable account as a concept and who bears a seller's negative balance. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- Verifying sellers, capabilities and requirements that pause payouts. See [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html).\n- Payout rails, payout states, returns and the payee check. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Balance states, reserves and deposits, pre-financing of payouts. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- How refunds and card disputes work between issuer, network and acquirer; dispute evidence and deadlines. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- What the provider's fee consists of (interchange, scheme fees, markup) and platform pricing models. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Ledger design and clearing accounts in general; reconciliation method and reports. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Accounts, cards and financing built on the seller balance; instant payouts to a card as a product. See [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- The step-by-step journey of the platform payment and its refund. See [Journey 3: One Payment, Three Parties, and a Refund After Payout](journey-platform-payment.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- How either company stores splits, transfers and balances and keeps them consistent internally: not public.\n- The consent wording Adyen supplies for debiting a seller's bank account could not be re-read in the terms-of-service page fetched in this session; the chapter does not quote it.\n- Adyen's refund split logic without instructions is documented as in pilot and not available for all platforms; the chapter marks it so.\n- Larkfield's Stripe charge type is not fixed by the scenario ledger; the chapter uses a destination charge with on_behalf_of as the 'had Studio Noord been on Stripe' version and records it as an addition.\n\n## Decision log\n\n- **2026-11-17** — The liability rule (a loss falls on the booked balance, then on the party behind it) is stated in one paragraph with a link, since ruling 7 gives it to platform-payment-models; this chapter covers the mechanics. Rejected: Re-deriving the rule from network rules and account configuration here\n- **2026-11-17** — The forward split gets one section per provider and the reversals one shared section, so refund and chargeback can be read across providers in pairs. Rejected: One long section per provider covering split, refund, dispute and payout; A section per event with both providers in every paragraph\n- **2026-11-17** — Designs are stated provider-neutrally (seller-first, platform-first, collect-then-distribute) and mapped to each provider's configuration. Rejected: Using Stripe's three charge types as the designs, which would leave Adyen as a footnote\n- **2026-11-17** — The Stripe version of Mila's pass is a destination charge with an application fee and on_behalf_of the studio; Larkfield's refund policy keeps its fee and debits the studio's balance. Both are labeled illustrative and appended to the scenario ledger. Rejected: A direct charge, which would make the studio's balance the first debit and hide the platform's fronting; Returning the fee pro rata, which adds arithmetic without changing the argument\n- **2026-11-17** — Payout rails, returns and instant payouts are left to chapter 14 and chapter 36; this chapter covers only the schedule as a control on exposure. Rejected: A full payouts section repeating chapter 14\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md, contract 35 — Scope, owned terms, the Larkfield examples.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — Mila's class pass, the refund after payout, the Unexplained €0.4 Million, Keel K3 accounts, cast.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md, rulings 7 and 18 — Ownership of the liability rule; pre-financing documented for Adyen only.\n- **External**\n  - Stripe documentation (n.d., accessed 2026-11): connect/charges, destination-charges, direct-charges, separate-charges-and-transfers, disputes, direct-charges-fee-payer-behavior, account-balances, risk-management, account-debits, manage-payout-schedule, top-ups, cross-border-payouts, instant-payouts, funds-segregation — Charge types, application fee flow, refunds and disputes by charge type, transfer reversal, negative balances and the 180-day rule, payout schedule, top-ups, cross-border payouts.\n  - Adyen documentation (n.d., accessed 2026-11): platforms/online-payments/split-transactions, transaction-fees, split-refunds, split-chargebacks; automatic-split-configuration; how-adyen-applies-split-instructions; account-structure-resources; settle-funds; managed-payouts; custom-payouts/scheduled-payouts; internal-fund-transfers; top-up-balance-account; reports-and-fees/balance-platform-accounting-report; release notes (20 May 2026) — Split types, fees calculated after the payment, the fallback to the liable account, refund split limits, chargeback logic, sales day settlement, payout schedules, top-ups, the accounting report.\n\n## Changelog\n\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: direct charges now precede destination charges so the Stripe section runs in the order of the three designs; exposure is defined where the timing gap is introduced; the scene's three questions follow the chapter's order. Not acted on: cutting the paragraph on sellers in other countries, which the chapter contract requires.\n- **2026-11-17** — First draft of the spec from the PLAN contract, the journal spec entry and the research on platforms and ledgers; load-bearing documentation pages re-fetched the same day.\n- **2026-11-17** — Verification pass: 84 claims checked (70 confirmed, 8 corrected, 4 hedged, 0 unsupported and removed or relabeled, 0 unreachable, 2 not checked); the two 'not public' statements about Adyen were wrong and were replaced by what Adyen documents: negative balances are allowed for up to 30 days and then compensated from the platform's reserved compensation account, and the Managed Risk pilot has Adyen assume responsibility for negative balances.\n- **2026-11-17** — Absence audit: 'how either company stores these bookings is not public' narrowed (both have published general accounts of their internal ledgers, cited in chapter 12; how platform splits and transfers are booked in them is not public).\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('How either company stores and keeps these bookings consisten' -> 'Each company has published a general account of its internal').\n- **2026-11-24** — Sweep of rulings 46 to 48: thesis how_why aligned with the prose: both companies have published general accounts of their ledgers, and what is not public is how platform splits and transfers are booked in them. Prose and units unchanged.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
