newer products, which regions it runs in).\n- **Believe:** Stripe is not a thin layer over other people's banks in every market, and not a bank in any; which it is depends on the country and the product.\n- **Believe:** What a builder can take from Stripe is its interface discipline, which is documented and works at any size, not its scale machinery or its product count.\n- **Be able to:** Say, for a given country, who Stripe names as the acquirer and what kind of regulated entity stands behind a Stripe balance, and what Stripe does not publish about either.\n- **Be able to:** Read a Stripe figure and state what it measures, who selected it and what it cannot be compared with.\n- **Be able to:** Separate, in Stripe's engineering publications, practices to adopt from machinery sized for Stripe, with the age of each source.\n\n**Audience:** A software engineer or architect who integrates with or evaluates Stripe, or is building a payment service, and knows the company by reputation.\n\n**Already knows:**\n\n- The mechanisms of Parts I to VIII: acquiring, licenses and safeguarding, ledgers, API design, idempotency, versioning, webhooks, billing, fraud, platforms, reliability.\n- Larkfield, its two providers and the Keel decisions.\n\n**Does not yet know:**\n\n- Stripe's history by date, which purchases have closed, and what its published figures measure.\n- Who Stripe names as acquirer per country and what kind of regulated entity it is.\n- Which of Stripe's engineering publications are old and which later documents confirm them.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given the claim that Stripe does not touch the money, the reader answers from Stripe's own legal pages, by region, and says what remains unpublished. *Probe:* A colleague says: 'Stripe is software on top of banks; it never acquires a payment or holds funds itself.' Using only this chapter: what does Stripe's own record show, region by region, and what does it leave unsaid? | `custom` | cold_reader | major |\n| AC-2 | Given a sentence that misuses Stripe's published numbers, the reader corrects each figure from the chapter. *Probe:* An investment memo says: 'Stripe's revenue grew 34% to $1.9 trillion in 2025, it employs about 7,000 people, and its market capitalization is $159 billion.' Using only this chapter: correct the sentence. | `custom` | cold_reader | major |\n| AC-3 | The reader separates the Stripe practices a small payments team should adopt from the machinery it should not copy, with the reason and the age of the evidence. *Probe:* A payments team of twelve at a travel-booking company wants to 'build like Stripe' and proposes sharding its database and deploying hundreds of times a day. Using only this chapter: what should the team take from Stripe's record, what should it leave, and why? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter establish about Stripe, in what order, and from what kinds of source? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** What does Stripe's dated public record show about how a developer platform became financial infrastructure, and which of its practices can a builder use?\n\n> **Claim:** Stripe's record shows a company that made the developer's interface its first product and then widened from it in two directions: outward into a suite of billing, tax and finance products, several of them bought, and downward into the regulated layer, which it holds as a non-bank assembled per market from e-money licenses, named acquirers, most of them partner banks, and, since 2025, narrow charters. A builder can use the disciplines Stripe has documented (idempotency keys, dated versions, a payment object whose state can be read again, a ledger whose clearing accounts must empty) and should not copy its sharded data platform, its deploy rate or its product count.\n\n**Disputed by:** Two opposite views, each held by experienced engineers: that Stripe is a thin software layer over other companies' banks and acquirers, suited to startups, and so has little to teach about the money path; and that Stripe is the model architecture, so that a serious payments team should reproduce its sharded data platform, its deploy rate and its breadth.\n\n**So what:** A team evaluating Stripe asks which entity acquires and which holds funds in each country it sells in, treats the named acquirer as data that can change, and tests the integration between Stripe products that arrived by acquisition instead of assuming it. A team building its own payment service takes the four interface practices into its design and budgets nothing for imitating Stripe's infrastructure.\n\n**How and why:** Stripe's 2022 letter lists 'simple, reliable, secure, and developer-friendly APIs' among the ways it pursues its mission, and its engineering posts (2017, 2020) describe the API as something designed, versioned and corrected over years: idempotency keys and dated versions in 2017 posts, the payment object and its states in 2020, and the Ledger with clearing accounts that return to zero in 2024. Those four practices concern correctness at the interface and work at any volume; the data platform and the deploy rate answer Stripe's volume and engineer count, which a builder does not have. The products around it came in dated steps and partly by purchase: tax (TaxJar, 2021), reconciliation (Recko, 2021), stablecoins (Bridge, 2025), usage billing (Metronome, 2026). The regulated layer is visible in legal pages, not in strategy statements: Stripe entities, regulated as e-money institutions in Ireland and the UK, are the named acquirer in the EEA, the UK and much of Asia-Pacific; other acquirers, most of them banks, are named for markets that include North America, Japan, India and Thailand; a Georgia limited-purpose bank of Stripe's own appears in the US list (the state regulator's bulletin dates its approval to 30 June 2025 and its start of business to 28 May 2026), and a February 2026 letter from the US regulator of national banks gives Bridge preliminary conditional approval for a trust charter. Stripe has not said why it uses partner banks, what share each acquirer carries, or what it earns: it publishes volume ($1.9 trillion in 2025, undefined) and customer counts, never revenue. The chapter stops where those documents stop.\n\n**Supporting claims**\n\n- **S1** — The dated record shows an order of construction: an API for developers in 2011, a product for platforms in 2012, a suite of billing, issuing, in-person, tax and finance products from 2018, and from 2020 a series of purchases that must be read as announced or completed.\n- **S2** — Stripe treated the interface as a product with a history: its own posts describe idempotency keys and dated versions (2017), a payment object redesigned around explicit states (2018 to 2020) and a ledger whose clearing accounts must empty (2024), and later documents confirm each.\n- **S3** — The regulated layer is a non-bank assembled per market: Stripe e-money institutions are the named acquirer in the EEA, the UK and much of Asia-Pacific, other acquirers, most of them banks, are named in markets that include the United States, Canada, Japan, India and Thailand, and two narrow charters were added in 2025 and 2026; Stripe has published neither its reasons nor any share of volume.\n- **S4** — Every published Stripe figure is selected by the company and most are undefined: 'total volume' is not revenue, 'profitable' names no measure, the last headcount is from 2022 and a valuation is the price of a funding round or a tender offer.\n- **S5** — The engineering record divides into practices about correctness at the interface, which hold at any volume, and machinery sized for Stripe's volume and engineer count, which a builder should not copy; several sources are six to nine years old, and the record stops at named places.\n\n## Role in the part\n\nSupplies the first company's record on its own terms, including the facts that do not fit the 'abstraction only' reading, so that the comparison in chapter 48 rests on dated documents and not on Stripe's reputation. Supports P10-1 of part `part-10`.\n\n## Flow\n\n**Pattern:** `grouping` (also `chronological` in history, and the order history, interface, suite, regulated-layer, which follows the order in which Stripe built them; `comparison` in transfers)\n\nThe sections follow the order in which Stripe built: dates, then the interface that came first, then the products around it, then the permissions under them. The figures come after the things they count, and the engineering record after the figures because its numbers borrow them. Sorting what transfers needs every earlier section, and the limits of the evidence come last so that they qualify the whole. Moving the regulated layer before the suite would hide that licenses followed products; moving the figures first would invite reading volume as the story.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Two sentences from Stripe's own pages, both current in November 2026: 'Stripe is not a bank', in its treasury documentation, and, in its acquirer disclosure for the European Economic Area, 'Payment Method Acquirer is Stripe Technology Europe, Ltd.' An engineer who has heard that Stripe is software on top of other people's banks has to explain the second; one who wants to 'build like Stripe' has to say which Stripe.\n\n**Bridge:** Engineers know Stripe as an API and a set of client libraries, and carry one of two opinions about it: a thin layer for startups, or the architecture to imitate. → Both opinions are claims about a company's record, and the record is public only in part: letters, press releases, legal pages, documentation and engineering posts, each with a date.\n\n**Thesis statement** (KEY POINTS bullets and paragraph p02): Stripe's record shows a company that made the developer's interface its first product and then widened from it in two directions: outward into a suite of billing, tax and finance products, several of them bought, and downward into the regulated layer, which it holds as a non-bank assembled per market from e-money licenses, named acquirers, most of them partner banks, and, since 2025, narrow charters. A builder can use the interface discipline Stripe has documented (idempotency keys, dated versions, a payment object whose state can be read again, a ledger whose clearing accounts must empty) and should not copy its sharded data platform, its deploy rate or its product count.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Say how the evidence is labeled, when it was read and which sources could not be reached. *Kept in:* method.\n- Give the history and the acquisitions by date, announced kept apart from completed. *Kept in:* history.\n- Show the interface as the first product. *Kept in:* interface.\n- Describe the suite around it: what was built, what was bought. *Kept in:* suite.\n- Set out licenses, partner banks and charters by region. *Kept in:* regulated-layer.\n- Read the published figures for what each one is. *Kept in:* figures.\n- Go through the documented engineering record with the age of each source. *Kept in:* engineering.\n- Separate what transfers to a builder from what does not. *Kept in:* transfers.\n- State where the evidence stops. *Kept in:* evidence-stops.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Two current sentences from Stripe's own pages, 'Stripe is not a bank' and a disclosure naming a Stripe company as the acquirer in Europe, do not fit either common opinion about the company. | quotation: 'Stripe is not  | `sequence`: The claim and its bearing on Larkfield. → The order of the sections and the kinds of source. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`definition`, id `method`): The case rests on documents Stripe published, read on 17 November 2026, each labeled by kind and age, and some sources could not be reached.\n\n**Advances the thesis** (S4, S5): Sets the rule that a sentence about Stripe is worth its source, which the figures and engineering sections depend on.\n\n**Transition in:** `elaboration`: The roadmap's promise of dated sources. → The labels, the cut-off date and the holes in the reading.\n\n**Order of paragraphs** (`grouping`): Labels first, then the gaps: the reader needs the labels to read the gaps.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Every statement in the case is a documented fact with its year, a trade-press report named as such, or the author's inference in a marked block; Stripe is private, so its numbers come from letters and press releases, never from audited accounts. | fact: Research cut-off 17 November 2026; the style guide's evidence labels; evidence older than about three years carries an 'Evidence age' mark.; fact: Stripe publishes annual letters (2022 to 2025 letters read as PDFs) and newsroom releases; no financial statements. |  |\n| p06 | context | Several sources could not be reached or verified, and the case says so instead of filling the gaps: a European licenses page, launch dates of three products and current headcount; the Georgia charter dates come from the regulator's bulletin. | fact: Research limitations: Stripe's European licenses page returned 404 (re-tested 2026-11-17); the Georgia charter dates come from the Georgia Department of Banking and Finance's May 2026 bulletin and Stripe's MALPB terms, with the trade-association item (ICBA, 2025-07-08) used only for what the charter permits; launch dates of Radar (2016), Treasury (2020) and Link not verified from a dated Stripe page; newsroom pages were served in a Netherlands locale with British spelling; no official headcount after 2022-11-03. | `contrast`: What was read and how it is labeled. → What could not be read. |\n\n### The History in Dated Steps: 2010 to 2026\n\n**Controlling idea** (`evidence`, id `history`): Stripe's products arrived in a datable order: an API in 2011, platforms in 2012, a cluster of new products in 2018 and 2021, and from 2020 purchases that are either announced or completed.\n\n**Advances the thesis** (S1): Supplies the dates on which 'interface first, then suite, then regulated layer' rests.\n\n**Transition in:** `sequence`: The rules for reading the evidence. → The record itself, starting with dates.\n\n**Order of paragraphs** (`grouping`): Launches, then purchases, then how the company's description of itself changed; inside the first two groups the items run by date, and the third is read against both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | evidence | Stripe launched in 2011 with a payments API, added Connect for platforms in October 2012, and added most of today's product names in two clusters, 2018 and 2021. | table: Dated steps, each from a Stripe release or post: launch 2011 (Stripe annual letter for 2023, published 2024-03-13 (https://stripe.com/annual-updates/2023): 'when Stripe launched in 2011'); Connect October 2012 (https://stripe.com/blog/the-new-connect, 2015-03-23); Atlas 2016-02-24; Billing 2018-04-05; Issuing 2018-07-26; Terminal 2018-09-17; Capital 2019-09-05; Tax 2021-06-10; Identity 2021-07-14; Revenue Recognition 2021-09-21; Financial Connections 2022-05-04; Tempo unveiled September 2025 and mainnet 2026-03-18 (all at https://stripe.com/newsroom/news/ and https://tempo.xyz/blog/mainnet).; quotation: Investor quotes in Stripe releases: 'partners since 2010' (2026-02-24) and 'When we first partnered with Stripe in 2010' (2024-02-28). |  |\n| p08 | evidence | From 2020 Stripe bought companies to fill named gaps, and on 17 November 2026 two of the purchases were announced and not confirmed closed. | table: Acquisitions with status: Paystack (agreement 2020-10-15); TaxJar ('will acquire', 2021-04-27); Bouncer (2021-05-14); Recko ('will acquire', 2021-10-20); Lemon Squeezy (announced by Lemon Squeezy 2024-07-26; site banner: shutting down 2027-03-31); Bridge (announced October 2024, completed 2025-02-04); Privy (July 2025, per 2026-02-24 release); Metronome (completed 2026-01-14); OpenRouter (agreement 2026-08-19); Parafin (agreement 2026-09-30, 'expected to close in the coming months'). Sources: https://stripe.com/newsroom/news/ slugs paystack-joining-stripe, taxjar, bouncer, recko, stripe-completes-bridge-acquisition, stripe-2025-update, stripe-completes-metronome-acquisition, stripe-agrees-to-acquire-openrouter, stripe-agrees-to-acquire-parafin; https://www.lemonsqueezy.com/blog/stripe-acquires-lemon-squeezy.; fact: The newsroom list re-read on 17 November 2026 shows no completion release for OpenRouter or Parafin. | `time`: The products Stripe launched. → The products it bought, from 2020, with their status. |\n| p09 | analysis | The first line of Stripe's press releases changed from 'economic infrastructure for the internet' to 'the programmable financial services company', and the OpenRouter agreement shows the company describing its market as wider than payments. | quotation: 'which builds economic infrastructure for the internet' (Series H release, 2021-03-14); 'a financial infrastructure platform for businesses' (2024-02-28); 'the programmable financial services company' (2025-12-11 and later), all at https://stripe.com/newsroom/news/.; quotation: 'Stripe is building the economic infrastructure for AI' (Patrick Collison, OpenRouter release, 2026-08-19); OpenRouter is 'a leading AI model gateway and routing platform'. | `additional_support`: What Stripe launched and bought. → What it called itself while doing so. |\n\n### The Interface Was the First Product\n\n**Controlling idea** (`evidence`, id `interface`): Stripe's first customers were developers at young companies, and its own posts describe the API as something designed, versioned and corrected over years.\n\n**Advances the thesis** (S2): Documents the four interface practices the thesis says a builder can use, with the age of each source and its later confirmation.\n\n**Transition in:** `cause_effect`: The dated order in which products arrived. → What came first in that order and how Stripe treated it.\n\n**Order of paragraphs** (`chronological`): First customers, then the API's redesign, then the two 2017 practices, then how the interface is governed today.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | evidence | Stripe started with self-service customers at technology companies and a published price, and says so; enterprises came later and pricing by negotiation with them. | quotation: 'Stripe grew up with companies in the technology sector' and the fourth of its 'four primary ways': 'Lowering the costs of scaling by providing simple, reliable, secure, and developer-friendly APIs and services' (Stripe annual letter for 2022, published 2023-04-05 (PDF linked from https://stripe.com/annual-updates/2022)).; quotation: 'Stripe's enterprise user base has compounded since 2019' (Series I release, 2023-03-15); 'In many cases, the 'long tail' is much of the dog' (release of 2026-02-24).; fact: Stripe pricing page (https://stripe.com/pricing, n.d., accessed 2026-11, Netherlands edition): a published standard rate per successful card charge and 'Design a custom package' with 'IC+ pricing' among the custom options. |  |\n| p11 | evidence | The payments API was redesigned once, from a synchronous charge to a payment object with explicit states, and Stripe published what the old design got wrong and what the new s remain in v1. | source: Mikael Mello and Anna Mason, 'How API changes flow into Stripe's developer products', https://stripe.dev/blog/how-api-changes-flow-into-stripes-developer-products, 2026-06-15: 'we've codified a set of design patterns that all APIs must follow'; v2 introduced in 2024.; fact: https://docs.stripe.com/api-v2-overview.md (n.d., accessed 2026-11): 'You can use any combination of APIs in the /v1 or /v2 namespace in the same integration'; payment objects are absent from the v2 resources listed in the changelog of 2026-10-28. | `time`: The practices of 2017 to 2020. → What Stripe has said about the interface since 2024. |\n\n### The Suite: Built, Bought and Sold Together\n\n**Controlling idea** (`analysis`, id `suite`): Around the payment Stripe sells named products, some built and some bought, and several of them can be used without Stripe processing the payment.\n\n**Advances the thesis** (S1): Shows the outward widening and that parts of the suite arrived by purchase, which is why integration between them has to be tested.\n\n**Transition in:** `additional_support`: The interface as first product. → The products built and bought around it.\n\n**Order of paragraphs** (`grouping`): What the suite is, then its parts by origin, then the parts that detach from payments, then the newest additions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | evidence | Stripe sells named products with separate prices and reports that most of its largest customers use more than payments; its Revenue suite is the one group for which it gives a run rate. | quotation: 'Seventy-five percent of these global winners use Stripe for more than just payments' (Series I release, 2023-03-15, of the one hundred businesses handling more than $1 billion a year).; quotation: 'Stripe's Revenue and Finance Automation Suite, with Billing at its core, has now passed a $500 million revenue run rate. Billing is being used by more than 300,000 companies' (Stripe annual letter for 2024, published 2025-02-27 (https://stripe.com/annual-updates/2024)); 'Metronome joins our Revenue suite, which is on track to hit an annual run rate of $1 billion this year' (Stripe annual letter for 2025, published 2026-02-24 (https://stripe.com/annual-updates/2025)). |  |\n| p15 | comparison | Tax, reconciliation, usage billing, merchant of record, stablecoins and platform credit each pair something Stripe built with something it bought, and the documentation shows the seams. | table: Product area, built, bought, state: tax (Stripe Tax 2021; TaxJar 2021); reconciliation (Recko 2021); usage billing (Meters API; Metronome completed 2026-01-14; docs: 'Metronome is Stripe's primary usage-based billing platform and the recommended starting point for all new integrations', https://docs.stripe.com/billing/subscriptions/usage-based.md, n.d., accessed 2026-11); merchant of record (Managed Payments, API changelog 2026-04-22; Lemon Squeezy bought 2024, shutting down 2027-03-31); stablecoins (Bridge 2025, Privy 2025; stablecoin balances in preview); platform credit (Capital 2019; Parafin announced 2026-09-30).; quotation: 'Metronome handles metering, rating, and billing, while Stripe handles payment collection, tax calculation, and revenue recognition' (https://docs.stripe.com/billing/subscriptions/usage-based/compare-metronome.md, n.d., accessed 2026-11). | `elaboration`: The suite as Stripe counts it. → Where each part came from. |\n| p16 | evidence | Fraud scoring and billing can both be used with other processors, in-person and platform products share the payment object, and Stripe publishes a volume for none of them. | fact: 'Radar can evaluate payments from any processor in real time and return risk signals' (https://docs.stripe.com/radar/multiprocessor.md, n.d., accessed 2026-11); October 2024: 'the ability to manage subscriptions with Stripe while processing transactions with other payments providers' (https://stripe.com/blog/our-biggest-ever-upgrades-to-stripe-billing, 2024-10-29).; fact: Terminal: a Terminal payment is a PaymentIntent, listed in 24 countries (https://docs.stripe.com/terminal.md and supported-card-brands page, n.d., accessed 2026-11); no Terminal volume published. 'More than 18,000 platforms build on Stripe' (Parafin release, 2026-09-30). | `contrast`: Products joined to the payment by purchase. → Products that can be detached from it. |\n| p17 | evidence | The additions of 2025 and 2026 furthest from card payments are stablecoin infrastructure: an orchestration company, a wallet company, a blockchain Stripe helped start and stablecoin balances that are still in preview. | fact: Bridge completed 2025-02-04; 'In July, Stripe acquired Privy'; 'In September, we unveiled Tempo, a blockchain purpose-built for payments, incubated together with Paradigm' (Stripe annual letter for 2025, published 2026-02-24 (https://stripe.com/annual-updates/2025)); Tempo mainnet 2026-03-18; stablecoin balances 'in public preview' in the United States (https://docs.stripe.com/financial-accounts/stablecoins.md, n.d., accessed 2026-11). | `time`: The suite as it stood by 2024. → What was added in 2025 and 2026. |\n\n### The Regulated Layer: A Non-Bank Assembled per Market\n\n**Controlling idea** (`evidence`, id `regulated-layer`): By its own legal pages Stripe is the acquirer in some regions and a payment facilitator under named banks in others, is not a bank anywhere, and has not published why or in what proportions.\n\n**Advances the thesis** (S3): Carries the fact that contradicts 'abstraction only' and the facts that support 'not a bank', region by region.\n\n**Transition in:** `contrast`: The products, which are visible in releases. → The permissions under them, which are visible only in legal pages.\n\n**Order of paragraphs** (`grouping`): Terms, then regions where Stripe acquires, then regions where banks do, then the wire-versus-membership caution, then the new charters, then what is unpublished.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | The products are visible in releases and the permissions under them only in legal pages; four terms decide the question: the acquirer is the network member that submits a merchant's card transactions and receives the money; an e-money institution is a licensed non-bank that may hold customer balances apart from its own funds; a partner bank lends its membership or its deposit accounts to a non-bank; a payment facilitator signs up merchants under such a bank's membership. | reasoning: Definitions as owned by chapters 6 (acquiring-and-network-connectivity) and 16 (licences-and-safeguarding), restated in one clause each. |  |\n| p19 | evidence | In the EEA, the United Kingdom and much of Asia-Pacific the named acquirer is a Stripe company, and the European ones are e-money institutions. | table: Region, Stripe's stated role, acquirer named, from Stripe, 'Acquirer Disclosure & Acquirer Terms', https://stripe.com/en-us/legal/acquirer-disclosure, n.d., accessed 2026-11: EEA: Stripe Technology Europe, Ltd.; UK, Gibraltar, Switzerland: Stripe Payments UK, Ltd.; Australia, New Zealand, Singapore, Malaysia, Hong Kong, Brazil: a Stripe entity; United States: payment facilitator of Cross River Bank, Deutsche Bank Trust Company Americas, Fifth Third Bank, Pathward N.A., PNC Bank N.A. and Stripe MALPB; Canada: Peoples Trust Company, PNC Bank Canada; Japan: Sumitomo Mitsui Card; India: payment aggregator of RBL Bank; Thailand: Bank of Ayudhya; Mexico: both acquirer and payment facilitator; UAE: independent sales organization of Network International.; quotation: 'STEL is authorised as an electronic money institution by the Central Bank of Ireland (reference number: C187865) to ... acquire payment transactions' (https://stripe.com/stel/legal, 2019-04-05); 'SPUKL is authorised as an electronic money institution by the U.K. Financial Conduct Authority (reference number: 900461)' (https://stripe.com/gb/legal/spukl, 2017-01-26). | `example`: The four terms. → The regions where the acquirer is Stripe. |\n| p20 | evidence | In the United States, Canada, Japan, India and Thailand a named bank or card company is the acquirer and Stripe is a payment facilitator or aggregator; US balances rest on state money-transmitter licenses and partner banks. | fact: Same disclosure page: 'Stripe, LLC is a Payment Facilitator of the following Payment Method Acquirers' (five banks and Stripe MALPB).; fact: Stripe Payments Company 'is a U.S. state-licensed money transmitter' (https://stripe.com/en-us/legal/spc, updated 2025-11-18); licenses in 53 jurisdictions by the count made in chapter 16 (https://stripe.com/legal/spc/licenses); 'Stripe is not a bank' (https://docs.stripe.com/treasury.md); a US card program's issuer is Celtic Bank (https://stripe.com/legal/celtic-spend-card). | `contrast`: Regions where Stripe is the acquirer. → Regions where a bank is. |\n| p21 | analysis | A direct technical connection to a card network, which Stripe announced for six networks in 2020, is not the same as being the acquirer of record. | quotation: 'Stripe now processes card transactions through direct integrations with all six major card networks in North America, Latin America, Europe and Asia Pacific' (https://stripe.com/en-ca/newsroom/news/direct-platform, 2020-04-23). | `contrast`: Who holds the membership. → Who runs the wire, which is a different fact. |\n| p22 | evidence | In 2025 and 2026 Stripe added two narrow charters, a Georgia bank that may acquire and a conditionally approved national trust bank for its stablecoin subsidiary, and neither takes deposits from the public. | source: Georgia Department of Banking and Finance, May 2026 bulletin (https://dbf.georgia.gov/financial-institutions-bulletin-2026): 'Stripe MALPB', Atlanta, approval date 30 June 2025, begin business date 28 May 2026. Stripe MALPB Acquirer Terms (https://stripe.com/legal/stripe-malpb-acquirer-terms, last updated 2026-05-28): 'a Georgia Merchant Acquirer Limited Purpose Bank', 'a member of the Networks, and a Payment Method Acquirer for Visa and Mastercard Transactions'; 'Stripe MALPB, 505 N Angier Avenue NE, Atlanta, GA' in the acquirer disclosure. ICBA news item, 2025-07-08 (secondary source), https://www.icba.org/w/georgia-approves-stripe-application-to-form-malpb: the charter 'will allow the financial services company to obtain direct membership with Visa and Mastercard and to process payments without a sponsoring bank'; such banks 'may not solicit or accept deposits from the general public'.; source: OCC Corporate Decision #1365, https://www.occ.treas.gov/topics/charters-and-licensing/interpretations-and-decisions/2026/cd1365.pdf, 12 February 2026: 'The OCC has granted preliminary conditional approval only' for Bridge National Trust Bank. | `time`: The structure as it stood until 2025. → What was added in 2025 and 2026. |\n| p23 | analysis | Stripe has not published why it uses partner banks, what share of volume each acquirer carries, which merchants its Georgia bank acquires for, or which banks hold safeguarded funds. | fact: Searched and not found: the four annual letters and the newsroom carry no statement of reasons; the acquirer disclosure gives no shares; the safeguarding pages name no banks (chapter 16). The nearest statement is a spokesperson quoted by trade press in April 2025 (Banking Dive, secondary source) calling the Georgia application an extension of work to expand the number of banking and other partners. | `contrast`: What the legal pages state. → What no page states. |\n\n### The Figures, and What Each One Is\n\n**Controlling idea** (`analysis`, id `figures`): Stripe publishes volume, customer counts, a run rate and prices from funding rounds and tender offers; it has never published revenue or margin, and each published figure has a definition problem.\n\n**Advances the thesis** (S4): Lets the reader correct a sentence that misuses Stripe's numbers.\n\n**Transition in:** `additional_support`: What Stripe does not publish about its regulated layer. → What it does publish about its size, and what those numbers are.\n\n**Order of paragraphs** (`grouping`): Volume first because it is the most misused, then counts and run rate, then valuation and headcount, then what cannot be compared.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | evidence | 'Total volume' of $1.9 trillion in 2025 is the value of payments made by businesses on Stripe, not revenue; the letters do not define it, and its name changed between years. | table: Letter wording by year: 2022 'more than $817 billion in total volume', up 26%; 2023 '$1 trillion in total payment volume', up 25%; 2024 '$1.4 trillion in total payment volume', up 38%; 2025 '$1.9 trillion in total volume, up 34% from 2024' (Stripe annual letter for 2022, published 2023-04-05 (PDF linked from https://stripe.com/annual-updates/2022); Stripe annual letter for 2023, published 2024-03-13 (https://stripe.com/annual-updates/2023); Stripe annual letter for 2024, published 2025-02-27 (https://stripe.com/annual-updates/2024); Stripe annual letter for 2025, published 2026-02-24 (https://stripe.com/annual-updates/2025)).; reasoning: A provider keeps a small fraction of the value it moves as fees; Adyen's 2025 report shows 17.0 basis points of processed volume as net revenue, which is Adyen's ratio and cannot be applied to Stripe. |  |\n| p25 | analysis | The customer count, the suite's run rate and the word 'profitable' are each narrower than they sound. | quotation: 'more than 5 million businesses directly or via platforms' (Stripe annual letter for 2025, published 2026-02-24 (https://stripe.com/annual-updates/2025)); 'on track to hit an annual run rate of $1 billion this year' (same); 'robustly cashflow positive in 2023' (Stripe annual letter for 2023, published 2024-03-13 (https://stripe.com/annual-updates/2023)), 'profitable in 2024' (Stripe annual letter for 2024, published 2025-02-27 (https://stripe.com/annual-updates/2024)), 'robustly profitable' (Stripe annual letter for 2025, published 2026-02-24 (https://stripe.com/annual-updates/2025)). | `additional_support`: The volume figure. → The other three figures the letters give. |\n| p26 | evidence | Stripe's valuations are prices at which employees' shares were bought, and its last official headcount is from November 2022. | fact: $95B Series H (2021-03-14); $50B Series I (2023-03-15); tender offers at $65B (2024-02-28), $91.5B (2025-02-27) and $159B (2026-02-24), all from Stripe releases at https://stripe.com/newsroom/news/.; quotation: 'which will return us to our February headcount of almost 7,000 people' (Patrick Collison's email, 2022-11-03, https://stripe.com/newsroom/news/ceo-patrick-collisons-email-to-stripe-employees). | `additional_support`: Figures about the business. → Figures about the company's price and size. |\n| p27 | recommendation | Stripe's figures cannot be ranked against Adyen's processed volume or any listed company's revenue, and a team planning cost or capacity needs contractual numbers. | reasoning: Stripe's 'total volume' is undefined; Adyen's processed volume, PayPal's total payment volume and Block's gross payment volume each have their own rules (chapters 47 and 49). | `cause_effect`: Undefined and selected figures. → What a reader may and may not do with them. |\n\n### The Engineering Record, and How Old It Is\n\n**Controlling idea** (`evidence`, id `engineering`): Stripe has published a handful of first-party accounts of its own systems; the newest describe the ledger, the database platform and deployment practice, and nothing describes regions.\n\n**Advances the thesis** (S5): Gives the documented basis, with ages, for sorting practices from machinery.\n\n**Transition in:** `additional_support`: What the letters say about size. → What the engineering posts say about how the systems are built.\n\n**Order of paragraphs** (`grouping`): The shape of the record first, then four groups from the money record outward: ledger, data store, how code is changed, where it runs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence | Most of Stripe's engineering blog is integration guidance for customers; the accounts of its own systems are few, and their ages run from months to nine years. | table: Source, date, what it documents, later confirmation: idempotency post (2017-02-22; current API reference); versioning post (2017-08-05; 2024 release process, 2026 API-changes post); payments API history (2020-12-15; current docs); Ledger post (2024-02-16; fee-credits post 2026-04-16); DocDB post (2024-06-06; database-fleet post 2026-07-16); 2023 annual letter section on reliability (2024-03-13; proxy post 2026-08-26 restates the availability target); AWS release (2023-01-23; AWS observability post 2024-10-24).; fact: The stripe.dev blog index listed 128 posts on 17 November 2026, 28 tagged Engineering and 7 Infrastructure (https://stripe.dev/blog). |  |\n| p29 | evidence | The Ledger is an immutable double-entry log, fed by many systems, in which a clearing account that does not return to zero is the signal of an error; a 2026 post shows the design still in use. | quotation: 'We built Ledger, an immutable and auditable log, as a trustworthy system of record for all of our financial data'; 'intermediate (clearing) pipes are empty'; 'Each day, Ledger sees five billion events and 99.99% of our dollar volume is fully ingested and verified within four days' (Ilya Ganelin, https://stripe.dev/blog/ledger-stripe-system-for-tracking-and-validating-money-movement, 2024-02-16).; source: Pratik Gupta and Sai Samant, https://stripe.dev/blog/how-we-built-stripe-credits-a-programmable-auditable-way-to-pay-your-stripe-fees, 2026-04-16: financial accounts 'backed by a real bank account' and a ledger lifecycle 'submitted → prepared → disbursed'. | `example`: The list of sources. → The first of them in detail: the ledger. |\n| p30 | evidence | Stripe's operational data sits in a document database platform built on MongoDB and split across about 2,000 shards, with in-house proxies and a system for moving data between shards without downtime. | quotation: 'It serves over five million queries per second'; '5,000+ collections distributed over 2,000+ database shards' (Jimmy Morzaria and Suraj Narkhede, https://stripe.dev/blog/how-stripes-document-databases-supported-99.999-uptime-with-zero-downtime-data-migrations, 2024-06-06).; quotation: 'A MongoDB shard—one of 2,000 that collectively processed $1.9 trillion in payments in 2025' (https://stripe.dev/blog/how-stripe-uses-graph-search-and-state-machines-to-auto-remediate-a-global-database-fleet, 2026-07-16). | `additional_support`: The ledger. → The store under the product systems. |\n| p31 | evidence | The 2023 letter gives the deployment figures usually quoted (about 400 deploys a day of one core service, about 1.4 million tests, rollouts checked against 55,000 metrics), and 2026 posts give a monorepo of about 50 million lines of Ruby and an availability target of 99.9995%. | quotation: 'approximately 400 times in a typical day'; 'a battery of around 1.4 million tests'; 'Each progressive rollout is inspected against 55,000 different metrics' (Stripe annual letter for 2023, published 2024-03-13 (https://stripe.com/annual-updates/2023)).; fact: 'our monorepo is the order of 50 million lines of Ruby code' (https://stripe.dev/blog/selective-test-execution-at-stripe-fast-ci-for-a-50m-line-ruby-monorepo, 2026-04-09); 'we target 99.9995% reliability' (https://stripe.dev/blog/building-a-data-plane-from-scratch-stripes-own-high-performance-distributed-proxy, 2026-08-26); the metric's formula is not given. | `additional_support`: How data is stored and moved. → How code is changed and what availability is aimed for. |\n| p32 | evidence | Stripe said in 2023 that it runs on AWS, and has published nothing about which regions, how many, or whether its API is served from more than one at a time. | quotation: 'Stripe has long relied on AWS to provide the core compute infrastructure on which Stripe is built'; 'We couldn't run without AWS—and we wouldn't want to' (David Singleton, then chief technology officer; https://stripe.com/newsroom/news/amazon-and-stripe, 2023-01-23).; fact: For payments, no first-party source names an AWS region, a region count or a failover design (searched: documentation and support sitemaps, stripe.com, stripe.dev, web search; chapter 39). One two-region design is on record for another system: usage-event processing for billing runs 'in two geographic regions simultaneously' with automatic failover (Stripe blog, 2025-01-28). | `contrast`: What is published about change and availability. → What is and is not published about where it all runs. |\n\n### What Transfers to a Builder, and What Does Not\n\n**Controlling idea** (`recommendation`, id `transfers`): Four interface practices transfer to a team of any size because they concern correctness; the data platform, the test fleet, the deploy rate and the product count answer Stripe's scale and do not.\n\n**Advances the thesis** (S5, S2): Turns the record into the thesis's second sentence: what to use and what not to copy.\n\n**Transition in:** `conclusion_summary`: The record, section by section. → A sorting of it by whether a builder can use it.\n\n**Order of paragraphs** (`comparison`): The table first, then the take side, then the leave side, then one fictional company's version.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison | Set side by side, each lesson from the record either concerns correctness at an interface or concerns capacity, and only the first kind transfers without Stripe's volume. | table: Lesson, Evidence, Transfers?: idempotency key on every money-moving request (2017 post; current reference) yes; dated versions pinned and upgraded on a schedule (2017 post; 2024 release process) yes; a payment object with explicit states that can be read again (2020 post; current docs) yes; immutable double-entry ledger with clearing accounts checked for zero (2024 post) yes, at small scale; sharded document database with a data movement platform (2024, 2026 posts) no; about 400 deploys a day behind 1.4 million tests and 55,000 metrics (2023 letter) no, the principle of staged rollout yes; a suite of twenty-odd products (releases) no; a regulated layer assembled per market (legal pages) not to copy, but to ask about. |  |\n| p34 | recommendation | A small payments team should take the four interface practices, because each protects a money movement from being duplicated, lost or misread and none needs volume to pay for itself. | reasoning: Idempotency keys prevent a retried timeout from charging twice; a pinned dated version prevents a silent change of field meaning; a readable payment object resolves an unknown outcome; clearing accounts that must empty expose a missing or late movement. Chapters 18, 19, 8 and 12 own the mechanisms. | `elaboration`: The table's 'yes' rows. → Why they hold at any size. |\n| p35 | recommendation | The same team should leave the shards, the test fleet, the deploy rate and the product count, because each answers a load or an engineer count the team does not have, and several of the sources may describe systems since replaced. | reasoning: 2,000 shards serve five million queries a second; 1.4 million tests guard a 50-million-line code base changed by thousands of engineers; a twelve-person team has neither the load nor the people, and the 2017 to 2020 posts carry age marks. | `contrast`: What to take. → What to leave, and why. |\n| p36 | example | Larkfield (fictional) took the practices and none of the machinery: its Keel decisions K1, K2, K3 and K7 are the four practices at the size of one payment service, and its acquirer inventory records the Stripe entity or bank per market as data. | scenario: Scenario ledger: K1 one writer, one key; K2 the provider's record is the truth; K3 a ledger entry for every movement, clearing accounts return to zero; K7 versions upgraded on a calendar; chapter 6's acquirer inventory (Stripe Technology Europe, Ltd. for NL/DE/BE; Stripe Payments UK, Ltd.; in the US one of six named acquirers, an open question put to Stripe). | `example`: The general sorting. → One company's version of it. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`synthesis`, id `evidence-stops`): Seven things a reader would want to know about Stripe are not in the public record as of 17 November 2026.\n\n**Advances the thesis** (S3, S4, S5): States the limits of the case so that chapter 48 does not compare what was never published.\n\n**Transition in:** `contrast`: What the record supports. → What it does not contain.\n\n**Order of paragraphs** (`order_of_importance`): Money first (revenue, volume definition, acquirer shares), then structure (reasons, pending deals), then systems (internals, regions).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | synthesis (list) | The record is silent on revenue and margin, on what 'total volume' counts, on acquirer shares and safeguarding banks, on Stripe's reasons for partner banks, on whether two purchases and one charter are final, on the internals behind most products, and on regions. | fact: The open questions of the companies, acquiring, ledger, API and scale briefs, each checked against the sources re-read on 17 November 2026. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Read by date, Stripe is neither of the two things engineers say it is. The interface came first and is the best-documented part; the regulated layer came later, is real, differs by country and is the worst-documented part. What a builder can use is on the well-documented side, and what a buyer must ask about is on the other.\n\n**So what:** A team evaluating Stripe asks, per country, which entity acquires and which holds funds, records the named bank as data that can change, and tests the joins between products that arrived by purchase. A team building its own payment service adopts the four interface practices and budgets nothing for imitating Stripe's infrastructure.\n\n**Callback:** The two sentences of the opening: 'Stripe is not a bank' and 'Payment Method Acquirer is Stripe Technology Europe, Ltd.' Both are true at once because the answer is per market and per function: a licensed non-bank that acquires in Europe and works under banks in the United States.\n\n**Takeaway** (`course_of_action`): Before the next provider review, write one row per country you sell in: acquirer of record, entity that holds the balance, license type, date read. Before the next design review, check your own payment service against the four practices.\n\n**Hand-off** to [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): `contrast`: Stripe's order of construction: the interface first, then products around it, then the regulated layer assembled per market as a non-bank, with volume and customer counts as its only public numbers. → A company that built in the other order (the acquiring license and the platform first, the bank next, adjacent software last and by purchase) and that reports audited figures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | synthesis (list) | Established: the dated order of products and purchases, the per-country acquirer disclosure and e-money licenses, the absence of revenue from every letter, and the four interface practices as Stripe documented them. |  |  |\n| p39 | synthesis (list) | Depends on context: how much the partner-bank structure matters to a buyer, how far to rely on products joined by purchase, and how much of the ledger design a small team needs. |  | `contrast`: What is settled. → What changes with the buyer's or builder's situation. |\n| p40 | recommendation (list) | The author's synthesis: Stripe's record is an order of construction, the label 'the abstraction' fits its origin and not its present, and the part worth imitating is the cheapest part. |  | `contrast`: What is established and what depends. → The author's own position, returning to the two opening sentences. |\n| p41 | recommendation (list) | Eight questions let the reader test a Stripe evaluation or their own payment service against the case. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p42 | transition | Stripe built the interface first and the regulated layer afterward; the next case is a company that built in the other order and reports audited figures. |  | `contrast`: Stripe's order of construction and its unaudited numbers. → Adyen's opposite order and its audited accounts. |\n\n## Non-goals\n\n- The mechanisms themselves: API object models, idempotency, versioning, webhooks, the ledger, acquiring, licenses, billing, fraud. See [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html), [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html), [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html), [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html), [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html), [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- Adyen's record. See [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html).\n- The bet-by-bet comparison of the two companies and what a customer should do with each difference. See [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- Agent payments, stablecoin law and instant payments in detail. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n- Any revenue, margin or headcount estimate for Stripe from press reports of investor material.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether the OpenRouter and Parafin acquisitions have closed: no completion release on 17 November 2026.\n- Whether Bridge National Trust Bank has final OCC approval (none found on 17 November 2026), and which merchants and how much volume Stripe's Georgia bank, in business since 28 May 2026, acquires.\n- The launch dates of Radar, Treasury and Link from a dated Stripe page; the case leaves them out of the dated table.\n- Resolved in the verification pass of 17 November 2026: Adyen's Annual Report 2025 (take rate 17.0 basis points), the AWS observability post of 24 October 2024 and the Banking Dive report of 7 April 2025 were fetched and confirmed.\n\n## Decision log\n\n- **2026-11-17** — No 'Stripe and Adyen: Where They Differ' section and no Larkfield scene section: the style guide's case anatomy replaces both, and Larkfield appears in one journey paragraph and one paragraph of the transfers section. Rejected: A Larkfield scene, which would add a fictional frame to a chapter about a real company's record.; A comparison table, which chapter 48 owns.\n- **2026-11-17** — The suite section comes before the regulated layer, following the order in which Stripe built them. Rejected: Leading with the regulated layer because AC-1 is about it: the reader needs the product dates to see that licenses followed products.\n- **2026-11-17** — Trade-press facts (the Georgia approval, the spokesperson's remark) are used only where a primary trace exists or the sentence names the source as secondary. Rejected: Using trade-press dates for when the Georgia bank began business.\n\n## Sources\n\n- **Internal**\n  - _research/brief-companies-and-bets.md — Part 1: dated history, acquisitions, letters, valuations, self-description, licenses, hosting, headcount; open questions.\n  - _research/brief-acquiring-methods-and-terminals.md — Sections 1.4 and 1.6: acquirer disclosure, regulated entities, charters, direct network connections; 3.7 Terminal.\n  - _research/brief-ledgers-and-money-movement.md — Sections 1.1, 1.2, 5.5 and 5.6: Ledger, fee credits, entities and partner banks, charter status.\n  - _research/brief-stripe-payments-and-api.md — API history, design practice, v2, idempotency and versioning posts with their later confirmations.\n  - _research/brief-reliability-and-scale.md — Inventory of engineering sources, DocDB, deployment figures, hosting, what is not public about regions.\n  - _research/brief-billing-and-revenue.md — Metronome, Managed Payments, Revenue suite, Billing with other processors.\n  - _research/consistency-issues.md — Rulings 11, 16, 21 and 22.\n  - _research/scenario-ledger.md — Larkfield's provider split, Keel decisions, the acquirer inventory.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 83 claims checked (64 confirmed, 11 corrected, 7 hedged, 0 unsupported, 0 unreachable, 1 not checked); the Georgia bank is now given from the regulator's bulletin and Stripe's own terms (approved 30 June 2025, in business since 28 May 2026), and the date of Stripe's 'programmable financial services company' wording, the non-bank acquirers and Mexico, the Adyen take rate and the engineering record (root-cause analyses, scheduling post, QCon talk on regions and retries) were corrected.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on: the history section is declared a grouping, the engineering section's reason no longer claims a payment's path, the 2025 to 2026 additions paragraph no longer repeats the OpenRouter purchase, 'acquirer' is glossed in the journey paragraph and the Keel decisions and acquirer inventory carry pointers. Notes not acted on: merging 'Where the Evidence Stops' into the conclusion (the style guide requires the section); moving the self-description paragraph next to the author's synthesis; the remark that the figures-before-engineering dependency is weak.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Reconciliation after verification (parts-9-10): intent, thesis and role re-synced with the corrected journal-spec entry; unit descriptions brought into line with the verified prose and the rulings. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: statements of absence re-tested with a wide search (documentation and support sitemaps, stripe.com, stripe.dev, web search). Narrowed: 'nothing about a single code base' (a Ruby monorepo of about 50 million lines is on record; which products live in it is not); 'no failover design' (a two-region active-active design with failover is published for usage-based billing events, 28 January 2025; none for payments); 'how the balance relates to the Ledger' (the April 2026 Stripe Credits post names Money Movement and Storage, financial accounts and the three-phase transfer). Holds: event delivery internals, idempotency key storage, total-volume definition, shares per acquirer, reasons for the partner-bank model. Two sources added; units unchanged.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after draft check round 1: p18 wording corrected to four terms (the page defines four) and opens on the contrast its transition declares; 'Stripe MALPB' explained at first use, before the table (ruling 33a); 'the colleague's sentence' now refers to the opening's engineer in the opening's words; Figures section opens with the bridge from what Stripe does not publish to what it does; the monorepo fact given once, in the engineering section; take-away lists the United Arab Emirates and calls the ten purchases the table's selection; the acquisitions status column explained; the illustrative team size introduced; Stripe Payments Company introduced as a second US company; the ledger called a practice behind the interface. max_words raised 6,500 to 6,600 (1.5%).\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('A builder can use the interface discipline Stripe has docume' -> 'A builder can use the disciplines Stripe has documented').\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
