pattern acting on this landscape.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can explain why Larkfield runs on two providers, how a payment is assigned to one, and why Keel adds neither a provider nor an orchestration product. *Probe:* Using only this page: why does Larkfield use both Stripe and Adyen, what decides which provider a given member payment goes to, and why does the Keel program not consolidate on one provider or buy an orchestration product? | `custom` | cold_reader | major |\n| AC-2 | Given the name of an incident and of a Keel decision, the reader says what each is without help from the citing chapter. *Probe:* A later chapter mentions 'the Silent Webhook' and 'K2'. Using only this page: what was the first, which pattern is it, and what does the second change? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what the eight incidents have in common and what that implies for the providers. *Probe:* Using only this page: what do Larkfield's eight incidents of 2025–2026 have in common, and what do they tell you about Stripe or Adyen? | `custom` | cold_reader | major |\n| AC-4 | Every system and payments term on the page is explained in one clause where it first appears, so the page can be read before Part I. | `known_before_new` | rubric | major |\n| AC-5 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the page's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this page discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-6 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** Which company do the book's examples come from, why does it run on both Stripe and Adyen, and what state are its payment systems in?\n\n> **Claim:** The examples come from Larkfield, a fictional studio-software platform that moved €1.12 billion in 31.4 million payments in 2026 through two providers, split by studio: Stripe since 2017, and Adyen since 2024, added to take in-person payments on the same platform as online ones and to acquire locally in the Netherlands and Germany. Its eight incidents of 2025–2026 share one cause: in each, Larkfield's own code, form or process treated a provider's answer, event or deadline as settled. Its 2027 program, Keel, therefore changes its own keys, records, pacing and ownership, keeps both providers and adds no orchestration product.\n\n**Disputed by:** The reading that a platform with double charges, bounced payouts and frozen sellers on two providers has a provider problem or a two-provider problem, and should consolidate on one provider or put an orchestration product in front of both.\n\n**So what:** The reader can take each chapter's scene as one more view of a single landscape, check any figure against this page, and ask of each Keel decision what the equivalent change would be in their own integration before asking whether their provider is the right one.\n\n**How and why:** Each system was added for the need of its year: a Stripe integration in 2017 with a webhook receiver that predates everything built later, a payment service with an adapter per provider for the Adyen launch in 2024, a small ledger in 2025 after the first unexplained difference. The joins between them were never designed as a whole, so the renewal job could mint a new idempotency key on a retry, the billing integration stayed outside the payments team, and the nightly reconciliation covered one provider only. A second provider or a routing product changes none of those.\n\n**Supporting claims**\n\n- **S1** — Larkfield is a fictional composite of a software platform that embeds payments: €1.12 billion of its studios' money passed through it in 31.4 million payments in 2026, of which it kept €19.8 million in fees as part of €46.0 million of revenue.\n- **S2** — It runs on two providers split by studio, Stripe since 2017 and Adyen since 2024, added for in-person payments on the same platform as online ones and for local acquiring in the Netherlands and Germany; on both, the studio is the seller and Larkfield never holds member funds.\n- **S3** — Each of its nine systems was added for the need of its year, and the joins between them were never designed as a whole.\n- **S4** — The eight incidents share one cause: in each, Larkfield's own code, form or process treated a provider's answer, event or deadline as settled, so they say nothing about Stripe or Adyen.\n- **S5** — Keel therefore changes Larkfield's own keys, records, pacing and ownership, keeps both providers and adds no orchestration product.\n- **S6** — The company's figures, people, incidents, decisions and worked examples are fixed in one record, so any chapter can cite them without introducing them again, and none of them is evidence about a provider.\n\n## Role in the part\n\nSupplies the one platform, with fixed figures, incidents, decisions and recurring payments, that every chapter's scene and worked example draws on, and performs the part's closing. Supports PF-4 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order`\n\nEach section supplies what the next one uses. The glance separates the studios' money from Larkfield's revenue; the business lines say where both come from and name the payment methods; the two-provider section needs the lines and the markets, because the split is drawn along them. The landscape follows the providers because every system in it is described by its relation to one or both. The people follow the systems because the cast is defined by what each person built or owns, and they precede the incidents because the incidents name owners and reviewers. The incidents follow the landscape because each incident's mechanism is one of the landscape's missing joins; before the landscape they would be eight anecdotes. Keel follows the incidents because its decisions answer them; before them it would read as a list of good practices. The worked examples come after Keel because all of them are set in 2027 while Keel runs, and several are told with Keel's keys and records. A short last section says how chapters use the record, and the conclusion draws the preface together.\n\n## Introduction\n\n**Hook** (`direct_statement`): The previous page used Larkfield's incidents one at a time, each to illustrate one failure pattern. This page gives the platform whole, so that the same incidents can be read as the history of one landscape.\n\n**Bridge:** The reader has met Larkfield in a few paragraphs of the introduction and in the incidents the patterns page used one at a time, and will meet a Larkfield scene near the top of every chapter. → This page gives the company whole and once: an invented composite whose figures, systems, people, incidents and decisions are kept consistent, so that what one chapter changes can be seen in the next.\n\n**Thesis statement** (KEY POINTS callout (bullets 2 and 3) and paragraph p02): Larkfield moved €1.12 billion for its studios in 2026 through two providers, split by studio. Its eight incidents share one cause: each time, Larkfield's own code, form or process treated a provider's answer, event or deadline as settled. Its 2027 program, Keel, therefore changes its own keys, records, pacing and ownership, keeps both providers and adds no orchestration product.\n\n**Roadmap** (IN THIS SECTION callout and paragraph p03):\n\n- The company first: what it is, its figures for 2026, its business lines, its fee and how members pay. *Kept in:* at-a-glance, business-lines.\n- Why it runs on two providers and how a payment is assigned to one. *Kept in:* two-providers.\n- Its nine systems as the new head of payments engineering found them in January 2027, and its people. *Kept in:* landscape, people.\n- The eight incidents, each with its pattern. *Kept in:* incidents.\n- The Keel program, K1 to K8, each decision with the pattern it answers. *Kept in:* keel.\n- The recurring worked examples, first among them Mila's €120 class pass. *Kept in:* examples.\n- How the chapters use all of it. *Kept in:* usage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous page used Larkfield's incidents one at a time to illustrate the failure patterns; this page gives the platform whole: an invented composite, not a disguised company, whose own systems are named by role and which uses Stripe and Adyen by name only as illustration. | fact: Larkfield is a composite of patterns common among software platforms that embed payments; it names Stripe and Adyen because the book compares the two, and everything it does with them is illustration, never a statement about how either treats a real customer. |  |\n| p02 | claim | The page's claim: Larkfield moved €1.12 billion in 31.4 million payments in 2026 through two providers split by studio; its eight incidents share one cause, that its own code, form or process treated a provider's answer, event or deadline as settled; so Keel changes its own keys, records, pacing and ownership, keeps both providers and adds no orchestration product. |  | `elaboration`: The platform given whole, with consistent facts. → What the whole shows that single incidents could not: one cause behind eight incidents, and the program that follows from it. |\n| p03 | transition | The page is a reference laid out in the order its claim needs: the company and its business lines, the two providers, the systems and the people, the eight incidents, the Keel program, the recurring examples and how chapters use them, with the invented figures in tables and each payments term explained where it first appears. |  | `sequence`: The claim about providers, incidents and Keel. → The order in which the page establishes it, and how to use the page as a reference. |\n\n## Sections\n\n### Larkfield at a Glance\n\n**Controlling idea** (`description`, id `at-a-glance`): Larkfield is a mid-sized, privately held software company through which €1.12 billion of other people's money passed in 2026, of which €46.0 million was its own revenue.\n\n**Advances the thesis** (S1, S6): Gives the company its fixed baseline figures and separates the studios' money from Larkfield's revenue, the distinction every later section relies on.\n\n**Transition in:** `elaboration`: The fictional studio-software platform the opening announced. → Its basic facts: founders, product, markets, size and revenue.\n\n**Order of paragraphs** (`large_to_small`): The company, then its size, then its money divided into what is the studios' and what is Larkfield's. Put the revenue before the size and the two sums arrive before the studios and members they belong to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Larkfield B.V. is a privately held software platform for independent fitness and wellness studios, founded in Rotterdam in 2017, whose product includes the payments members make to studios. | scenario: Founded 2017 by Sofie Vermeer (CEO) and Daniel Osei (CTO); Series B in 2023; product: class scheduling and booking, memberships, a member app, front-desk check-in and sales, and payments (members pay studios through Larkfield). |  |\n| p05 | description | In 2026 it serves 6,200 studios and 2.9 million active members in five countries (the Netherlands, Germany, the United Kingdom, Belgium and the United States) with 340 employees, of whom 11 are the payments team. | table: Studios per market: Netherlands 2,300 (home), Germany 1,450, United Kingdom 1,100, United States 700 (since 2025), Belgium 650; currencies EUR, GBP, USD.; statistic: 340 employees, 96 in engineering, 11 in the payments team. | `elaboration`: The company and its product. → Its size in 2026: studios, members, markets and headcount. |\n| p06 | explanation | Two sums describe Larkfield and they must not be confused: €1.12 billion of member payments belongs to the studios, and €46.0 million is Larkfield's own revenue, €19.8 million of it fees on those payments. | statistic: Payment volume €1.12 billion in 31.4 million payments; revenue €46.0 million = software subscriptions €24.5M + payments revenue €19.8M + other €1.7M; providers' processing costs €12.6M, payments margin €7.2M; fees about 1.77% of volume, blended. | `contrast`: The 6,200 studios and their 2.9 million members. → The money: what passes through Larkfield against what Larkfield earns. |\n\n### Three Business Lines and One Fee\n\n**Controlling idea** (`description`, id `business-lines`): Larkfield has three business lines, one in which it sells to studios and two in which studios sell to members through it, and it earns on the last two a per-payment fee that depends on how the member pays.\n\n**Advances the thesis** (S1): Shows where the two sums come from and introduces the payment methods and the fee that every worked example computes with.\n\n**Transition in:** `elaboration`: The two sums: €46.0 million of revenue and €1.12 billion of volume. → The three business lines that produce them.\n\n**Order of paragraphs** (`prerequisite_order`): The lines, then the fee earned on two of them, then the methods the fee is keyed to. Put the fee before the lines and it has no payments to apply to; put the mix before the fee and the reader meets shares of methods before knowing why the method matters to Larkfield.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | claim | The three lines differ in who the seller is: Larkfield sells subscriptions to studios, and studios sell memberships, passes and drop-ins to members, online and at the front desk. | table: Studio subscriptions: plans at €89, €189 and €349 per month per location, annual plans at ten times the monthly price paid up front, SMS overage €0.07 per message over the allowance (500, 2,000, 5,000 messages), €24.5M, billed with Stripe Billing since 2018. Member payments online: memberships (typical €49), ten-class passes (typical €120), drop-ins (typical €16), €910M in 27.6M payments, 61% recurring. Member payments at the front desk: €210M in 3.8M payments, terminals at 2,100 studios. |  |\n| p08 | description | Larkfield charges studios a platform fee on each member payment, set by payment method, and the provider's processing cost comes out of that fee. | table: 1.9% + €0.25 per online card payment; 0.8% + €0.25 per direct debit; €0.35 flat per iDEAL payment; 1.4% + €0.10 per in-person payment. | `elaboration`: The two lines in which studios sell to members. → What Larkfield earns on each of those payments. |\n| p09 | description | Barely half of online volume is paid by card: the rest moves by direct debit and bank methods whose rules differ from a card's. | table: Online mix 2026 by volume: cards 52% (about 70% debit; Apple Pay and Google Pay counted here), SEPA Direct Debit 21% (memberships in NL and DE), iDEAL 14% (passes and first payments in NL), Bacs Direct Debit 5% (UK memberships), Bancontact 4%, other 4%. | `additional_support`: The fee table's four methods. → How much of the volume each method carries. |\n\n### Why Larkfield Runs on Two Providers\n\n**Controlling idea** (`explanation`, id `two-providers`): Larkfield has two providers because it added Adyen in 2024 for two stated reasons and never moved everything; a studio's online payments are on exactly one of them, and on both the studio is the seller and the provider holds the money.\n\n**Advances the thesis** (S2): Establishes the split, its reasons and its limits before the landscape and the incidents depend on them.\n\n**Transition in:** `cause_effect`: The member payments, online and at the front desk, and the methods they use. → Which provider processes them, and why there are two.\n\n**Order of paragraphs** (`chronological`): Stripe in 2017, Adyen in 2024, then the state the two leave behind (the split by studio) and what is true on both sides of it (who sells, who holds the money). The split cannot be stated before both providers are introduced, and the ownership of the money is the same on both, so it comes last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | description | Stripe has been Larkfield's provider since 2017, for its own subscriptions and for member payments, and in 2026 still carried 44% of member payment volume. | scenario: Stripe Billing for studio subscriptions since 2018; Stripe Connect for member payments since 2017; today the United Kingdom, the United States and Belgium, and every studio onboarded before 2024 that has not been migrated: 3,590 studios, 44% of volume (€493M). |  |\n| p11 | explanation | Adyen was added in 2024 for two reasons, in-person payments on the same platform as online ones and local acquiring in the Netherlands and Germany, and Larkfield has never measured the effect of the second. | scenario: Adyen for Platforms since 2024: all front-desk terminals (2,100 studios) and online payments for 2,610 Dutch and German studios onboarded or migrated since 2024; 56% of volume (€627M).; scenario: The effect of the 2024 reason 'local acquiring in the Netherlands and Germany' was never measured: there is no before-and-after approval comparison that isolates the acquirer. | `time`: Stripe alone from 2017. → The second provider in 2024 and the two reasons for it. |\n| p12 | description | The split is by studio and not by payment, with one exception that produces trouble: 1,140 older Dutch and German studios take online payments on Stripe and front-desk payments on Adyen terminals. | table: Stripe online: UK 1,100, US 700, Belgium 650, older NL/DE 1,140 = 3,590 studios. Adyen online: NL/DE onboarded or migrated since 2024 = 2,610. Terminals: Adyen only, at 2,100 studios including the 1,140.; scenario: At the split studios the only payer identifier shared across the two channels is Larkfield's own member id. | `elaboration`: The two providers and the studios each carries. → The rule that assigns a payment to a provider, and the studios that straddle it. |\n| p13 | explanation | On both providers the studio is the seller and the provider holds the money: Larkfield never holds member funds, is not a payment institution and is not the merchant of record, yet it stands behind a studio's losses. | scenario: The studio's money sits in the provider's regulated balance until payout; members see the studio's name on their card statement. On Stripe the studios are legacy Custom connected accounts charged by destination charges with on_behalf_of; on Adyen the platform model books the studio's share to its balance account and Larkfield's fee to Larkfield's liable balance account.; scenario: Under Larkfield's terms the studio carries a lost dispute and its fee; if the studio's balance cannot cover it, the loss falls on Larkfield as the platform. | `additional_support`: Which provider processes a studio's payments. → Whose sale it is, who holds the money and who carries a loss, on either provider. |\n\n### The Systems Landscape in January 2027\n\n**Controlling idea** (`cause_effect`, id `landscape`): Nine systems, each added for the need of its year, make up Larkfield's payments landscape in January 2027, and what is missing is not a system but four joins: one writer for money-moving calls, a record confirmed against the provider, reconciliation of both providers, and one owner for billing and payments.\n\n**Advances the thesis** (S3): Shows the landscape as an accumulation of reasonable additions whose joins nobody designed, which is the 'how' of the thesis.\n\n**Transition in:** `elaboration`: Two providers, a split by studio, and Larkfield on neither side of the money. → The systems Larkfield itself runs between its product and the two providers.\n\n**Order of paragraphs** (`prerequisite_order`): The systems are named first, because the history, the gaps and the absences all refer to them by role; the history comes second, because it explains why the gaps exist; the gaps come before the deliberate absences so that the reader does not take the missing orchestration product for one more gap.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | In January 2027 Larkfield's payments run on nine systems of its own, each named in this book by its role. | table: The booking app (member app and studio back office; creates the business events); the payment service (one internal API for take a payment, refund, pay out; an adapter per provider; routes by studio; holds the idempotency keys; built 2024); the payment record store (every payment attempt in five states: pending, authorized, paid, refunded, disputed; PostgreSQL; fed by webhooks through an inbox table); the ledger (small double-entry ledger of what Larkfield and the studios are owed, per provider and currency; 2025); the billing integration (Stripe Billing objects for studio subscriptions and an SMS meter; owned by the growth team until 2027); the webhook receivers (one endpoint per provider; the Stripe one predates the payment service); the reconciliation job (nightly; Adyen only until Keel); the data warehouse (provider exports land here); the front-desk app (tablet app driving the Adyen terminals). |  |\n| p15 | cause_effect | Each system was added for the need of its year, so the landscape is a record of five moments, not of one design. | scenario: 2017: the Stripe integration, written by Daniel Osei, with its webhook receiver and one secret key; 2018: Stripe Billing for studio plans; 2024: the payment service, built by Tom Hendriks for the Adyen launch, and the second receiver; 2025: the ledger, after a first unexplained difference; then the nightly reconciliation job, after the audit finding of year-end 2025.; figure: Systems landscape of January 2027: the booking app above the payment service with its two adapters, the two providers below, events returning through two receivers into the payment record store, the ledger and the reconciliation job reading one provider's reports, the billing integration and the renewal job reaching one provider beside the payment service. | `time`: The nine systems as they stand in January 2027. → The years in which they arrived and what each was added for. |\n| p16 | analysis | What the new head of payments engineering finds between the systems in January 2027 is four missing joins: money-moving calls with more than one writer, a record whose `paid` rests on an event nobody confirmed, a reconciliation that covers one provider, and a billing integration outside the payments team. | scenario: One unrestricted Stripe secret key from 2017 shared by five systems, the renewal job among them; the renewal job's HTTP layer generated an idempotency key at each network call; the payment service's only read call returned Larkfield's own row; the reconciliation job read Adyen's reports only; the 2025 ledger had no entries for refunds after payout, chargeback fees or currency conversion. | `contrast`: Nine systems that each work. → The joins between them that were never designed. |\n| p17 | description | The landscape contains no orchestration product and no second provider at the front desk: routing is a single rule, the studio's provider. | scenario: The payment service's routing rule is 'the studio's provider' with a manual per-studio override; the front-desk app drives Adyen terminals over a cloud connection with offline payments not enabled, so a studio without internet cannot take cards at the front desk. | `additional_support`: What is missing between the systems. → What is absent by choice: an orchestration layer and a front-desk fallback. |\n\n### The People\n\n**Controlling idea** (`description`, id `people`): A small cast owns the systems and the consequences: an engineer who built each layer, a controller, a risk lead, a support lead, two studio owners and the members whose payments the book follows, with the new head of payments engineering as the reader's stand-in.\n\n**Advances the thesis** (S6): Fixes the names, roles and pronouns chapters use, and says whose view the book takes.\n\n**Transition in:** `elaboration`: The systems and the years they were built in. → The people who built them, own them and feel their failures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Thirteen people recur in the book, and each is defined by what they own or by the payment they make. | table: Femke de Graaf, Head of Payments Engineering since January 2027, leads Keel; Daniel Osei, CTO and co-founder, wrote the 2017 Stripe integration; Sofie Vermeer, CEO and co-founder; Priya Raman, Finance Controller, owns the close and the audit finding; Jonas Weber, Risk and Compliance Lead, owns verification, disputes and fraud rules; Aylin Demir, Head of Studio Support; Tom Hendriks, senior payments engineer, built the payment service in 2024; Ines Bakker, owner of Studio Noord (Utrecht yoga studio, on Adyen since 2024, three instructors, 410 members); Ravi Shah, owner of Ironworks Climbing (three locations in Manchester, one UK company, on Stripe Connect); members Mila Janssen, Bram de Wit, Daan Peters and Lotte Smit, all at Studio Noord. Pronouns as in the ledger. |  |\n| p19 | explanation | Femke de Graaf is the reader's stand-in: an experienced engineer who is new to payments, joined in January 2027 and leads Keel. | scenario: When a chapter says 'you' in a Larkfield scene it usually means Femke; she reviews each incident with its owner during her first months. | `emphasis`: The cast as a whole. → The one member of it whose position is the reader's. |\n\n### The Eight Incidents\n\n**Controlling idea** (`analysis`, id `incidents`): The eight incidents differ in pattern, provider and cost and share one cause: in each, something on Larkfield's side of the provider's API treated an answer, an event or a deadline as settled.\n\n**Advances the thesis** (S4): Presents the incidents as one landscape's history and argues the common cause the thesis claims.\n\n**Transition in:** `cause_effect`: The landscape's missing joins, and the people who own its systems. → What those gaps produced between the end of 2025 and November 2026.\n\n**Order of paragraphs** (`small_to_large`): The incidents come first as a dated list, because the claim about their common cause can only be checked against the mechanisms; the claim and its table follow; the limit on the claim (nothing follows about the providers) comes last because it qualifies the claim just made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | evidence (list) | Eight incidents, found between the year-end close of 2025 and November 2026, define the position Femke starts from; each is an instance of a pattern named on the previous page and is worked in full by the chapter that owns it. | scenario: In date order. The Unexplained €0.4 Million (year-end 2025): ledger 'owed to studios' €412,000 higher than the two providers' balances; three weeks to trace to refunds after payout €317,200, chargeback fees €73,500 and currency-conversion rounding in Larkfield's own posting job €21,300; an audit finding and the origin of the reconciliation job; The Black-Box Balance, with The Orphaned Refund. The Version Cliff (March 2026): the billing integration had run for three years on an account-default Stripe API version; a library upgrade for another feature moved it across a breaking release that removed a field the finance export read; subscription revenue reports wrong for 6 days; The Version Cliff. The Frozen Studios (May 2026): a verification requirement changed on Stripe Connect; Larkfield's one batch email went to sign-up addresses nobody read; 230 studios missed the deadline and went up to 12 days without payouts (Ironworks Climbing among them); The Frozen Seller. The Payout That Bounced (June 2026): a back-office form let owners change bank details with no check of the account holder; 412 payouts worth €386,000 returned over three weeks and sat unreconciled; 19 days to pay every studio; two studios left; The Stranded Payout. The Card-Testing Weekend (8–9 August 2026): bots tested 61,000 stolen card numbers through one studio's public booking widget with €1 trial drop-ins sold to guests; €4,100 in fees and refunds; the studio's online payments switched off for 31 hours; The Open Till. The Silent Webhook (Monday 14 September 2026): the Stripe webhook receiver's TLS certificate expired shortly after midnight; events failed for 9 hours; 3,200 memberships shown as unpaid and members turned away at check-in that morning; no money lost, 460 support tickets; The Trusted Doorbell, noticed as The Phantom Payment. The Renewal Wave (1 October 2026): 38% of monthly renewals in six hours; the unpaced renewal job met Stripe's rate limit, treated each refusal as a failed payment, and 7,900 renewals were delayed a day with dunning emails to members who had done nothing wrong; The First of the Month. The Double Charge (1 November 2026): a provider call timed out during the renewals and the job retried with a new idempotency key; 1,840 members charged twice; €71,300 refunded; 212 disputes anyway; The Double Charge. |  |\n| p21 | claim | Set side by side, the eight have one cause: what decided each outcome was a piece of Larkfield's own code, a form or a process that treated a provider's answer, event or deadline as settled, and most of them sit at one of the landscape's missing joins. | table: Per incident, the pattern with its family and what on Larkfield's side decided it: a ledger not reconciled to the providers' balances; an API version nobody owned; one reminder to an unread address and no owner for the deadline; an unverified bank-details form; a public widget with no limit on attempts; an expired certificate and no way to ask the provider; an unpaced job that read a refusal as a failure; a retry with a new key.; figure: A vertical line marked as the provider's API with eight incident markers all on Larkfield's side of it and none on the providers' side. | `conclusion_summary`: Eight incidents with eight different mechanisms. → The one thing the mechanisms have in common. |\n| p22 | explanation | The incidents tell you nothing about Stripe or Adyen: Larkfield is fictional, a provider is named only where an incident needs one, and a provider's behavior is established only by a dated source in the chapter that discusses it. | scenario: Stripe is named in four incidents (the Version Cliff, the Frozen Studios, the Silent Webhook, the Renewal Wave); in the Double Charge and the Card-Testing Weekend the provider is deliberately left unnamed, and the Payout That Bounced names none. | `contrast`: The common cause on Larkfield's side. → What must not be concluded about the other side. |\n\n### The Keel Program\n\n**Controlling idea** (`explanation`, id `keel`): Keel is eight decisions about Larkfield's own keys, records, pacing and ownership; it keeps both providers and answers the Single Rail by rehearsing a switch between the two it already has, not by buying an orchestration product.\n\n**Advances the thesis** (S5): Shows that the program follows from the common cause: every decision changes something on Larkfield's side.\n\n**Transition in:** `problem_solution`: Eight incidents decided on Larkfield's side of the API. → The 2027 program that changes that side.\n\n**Order of paragraphs** (`prerequisite_order`): The decisions first as a table, then the reading of them as four kinds of change, which needs all eight in view; then the decision most likely to be misread as a product purchase, which the reading has just set apart from the other seven; then the proposals declined as further evidence of the same reasoning. The reading before the table would group decisions the reader has not met, and the declined proposals would read as a list of refusals without the decisions before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | description | Keel, the 2027 program Femke de Graaf leads, consists of eight decisions, K1 to K8, and each answers one or more of the named patterns and, through them, the incidents. | table: K1 One writer, one key (key derived from the business event; for a renewal, membership id plus billing period plus the number of the scheduled attempt; a row written to the payment record store before the first send; only the payment service holds a credential that can move money): The Double Charge. K2 The provider's record is the truth; the webhook is the doorbell (receivers verify, persist, acknowledge; a state change is confirmed against the provider's own record, the payment object where the API lets Larkfield read it, the settlement report where it does not; a job sweeps everything still pending): The Trusted Doorbell, The Phantom Payment. K3 A ledger entry for every movement (fees, splits, refunds, disputes, payouts, returns; clearing accounts return to zero; the reconciliation job covers both providers, one run per provider when its reports are ready, written only from report lines, open items with an owner): The Black-Box Balance, The Orphaned Refund, The Stranded Payout. K4 Card numbers never touch Larkfield (hosted fields and provider tokens only; network tokens for stored cards; a script inventory for the booking widget): The Card in the Log, The Vault Hostage. K5 Renewals are spread and rate-limited by Larkfield, not by the provider (paced over 18 hours; retries on a schedule tied to decline codes): The First of the Month. K6 Verification is state, not a form (requirements, deadlines and capability status mirrored per studio and shown in the back office; an owner for every deadline): The Frozen Seller. K7 Versions are upgraded on a calendar (one planned API upgrade per provider per half-year, tested against recorded traffic): The Version Cliff. K8 Two providers, one rehearsed switch (the payment service can move a studio's online card payments to the other provider; rehearsed quarterly for the 50 largest studios; no orchestration product): The Single Rail. |  |\n| p24 | analysis | Read as a set, the decisions change four things, keys, records, pacing and ownership, and none of them changes a provider. | reasoning: K1 is about keys; K2, K3 and K4 about records and what may be stored; K5 about pacing; K6 and K7 about owners and calendars; K8 about rehearsing what already exists. The Card-Testing Weekend was answered at once in 2026 (a CAPTCHA on guest checkout, a cap on payment attempts per studio, an alert on unusual declines) and has no K number. | `conclusion_summary`: The eight decisions one by one. → What they change when read together. |\n| p25 | explanation | K8 is the answer to the question a two-provider platform is always asked: it makes the second provider a rehearsed failover for some payments and adds no routing product. | scenario: Each of the 50 largest studios keeps a verified account at both providers; the switch moves payments that bring their own credential (a wallet or a typed card: Mila's pass would move); stored-card renewals stay with, or wait for, the provider that holds the card; the quarterly rehearsal sends real payments through the second provider and follows them to payout, a refund and reconciliation; the front desk has no second provider. | `emphasis`: The eight decisions as changes on Larkfield's side. → The one decision that concerns the providers themselves, and how little it adds. |\n| p26 | evidence | The same reasoning shows in what Larkfield declined during 2027: each proposal would have added a product, a role or a mechanism before the records behind it existed. | table: February 2027: an orchestration product with per-payment routing (Daniel Osei), declined; offline card acceptance at the front desk (a studio), declined; a message queue with a distributed transaction (Tom Hendriks), replaced by an outbox live since 1 March 2027. April 2027: a refund buffer of about €43 million held in a Larkfield bank account (product team), rejected by Jonas Weber because Larkfield would hold studio funds, built instead as a longer payout schedule on the studio's own balance at the provider. May 2027: making the provider the merchant of record (Sofie Vermeer), answered no for both kinds of sale. May to June 2027: an instant-payout card for studios (product team), not launched until four conditions hold. | `additional_support`: What Keel decides to change. → What Larkfield decides not to add while Keel runs. |\n\n### The Recurring Worked Examples\n\n**Controlling idea** (`example`, id `examples`): Six worked examples with fixed amounts and dates recur through the book, first among them Mila's €120 class pass, so that one payment can be followed across many chapters with the numbers always agreeing.\n\n**Advances the thesis** (S6): Supplies the fixed payments the chapters compute with and the landscape and Keel are tested on.\n\n**Transition in:** `example`: The landscape, its incidents and the Keel decisions. → The individual payments on which chapters show all three at work.\n\n**Order of paragraphs** (`prerequisite_order`): The pass comes first because every other example is defined against it. The renewal is the same member's second payment, and the first of the month directly follows the single renewal it multiplies. The refund is of the same pass and the dispute is of the same product at the same studio, so the two backward flows sit together. The two further members vary the method on the same studio and the same €49. The billing examples come last because they change the seller, and placing them earlier would split the member payments in two.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | transition | Chapters show the mechanisms and test Keel on a small set of payments from early 2027, whose facts never change: six recurring examples and two further members. |  |  |\n| p28 | example | Mila's class pass is the recurring payment: €120.00 approved at 19:42 on Tuesday 9 March 2027, of which Studio Noord receives €117.47 on Thursday 11 March, and which stays disputable until about 7 July. | scenario: Ten-class pass from Studio Noord (on Adyen) bought in the member app with a Dutch Visa debit card held in her phone's wallet; the wallet authenticates her on the device, so there is no 3-D Secure challenge; captured automatically; Larkfield's fee 1.9% + €0.25 = €2.53; illustrative provider cost €0.61 (interchange €0.24, scheme fees €0.06, Adyen €0.31), leaving Larkfield €1.92; on Wednesday 10 March Ines Bakker's ticket reads 'It says paid. Paid to whom?'; payout sent Thursday 11 March and marked arrived in Larkfield's record on Thursday 25 March; basic dispute window taken to close about 7 July 2027. Had the studio been on Stripe, an assumed blended rate of 0.6% + €0.15 would cost €0.87 and leave Larkfield €1.66.; figure: Timeline of Mila's €120: approved 19:42 on 9 March, the studio's question on 10 March, payout of €117.47 on 11 March, marked arrived on 25 March, dispute window to about 7 July. | `example`: Six examples with fixed facts. → The first and most used of them. |\n| p29 | example | Mila's membership renewal is the recurring failure: a €49.00 monthly card payment declined on 1 April 2027 for insufficient funds and paid on 4 April. | scenario: Membership at Studio Noord set up on 12 January 2027 by typing in the same Visa debit card and passing a 3-D Secure challenge in her banking app (the customer-initiated first payment later renewals refer to); renewed on the 1st of each month as a merchant-initiated payment; the 4 April retry is scheduled attempt 2 with its own idempotency key (K1); Larkfield emails her on 1 April; she keeps access between 1 and 4 April. | `contrast`: A payment that is approved at once. → A payment by the same member that is first declined. |\n| p30 | example | The first of the month is the recurring peak: about 357,000 renewals worth €17.5 million attempted in six hours. | table: Recurring memberships: 61% of online volume, about €555 million a year, €46 million a month, about 940,000 renewals a month, of which about 540,000 by card (illustrative assumption); the wave is the 38% attempted in the first six hours of the 1st: about 357,000 renewals, €17.5 million; under K5 the wave runs over 18 hours. | `elaboration`: One member's renewal on the 1st. → All the renewals of the 1st taken together. |\n| p31 | example | The refund after payout is the recurring backward flow: on 18 March 2027 Mila asks for €84.00 back, a week after Studio Noord was paid. | scenario: Seven unused classes of the pass; under Larkfield's policy the studio funds the refund and Larkfield keeps its fee; the refund was taken from Studio Noord's balance account at Adyen, which held €212.40 of later sales that day, so the studio's next payout was €84.00 smaller; Aylin Demir's question that day: 'whose money pays this?'. | `contrast`: Payments moving forward, one at a time and by the hundred thousand. → Money moving back: part of the pass refunded after the studio was paid. |\n| p32 | example | The €120 dispute is the recurring reversal nobody at Larkfield started: Bram de Wit's pass of 2 February 2027 comes back as a chargeback on 24 February with a €15.00 fee. | scenario: Pass bought at Studio Noord with a Dutch Mastercard credit card and disputed as 'not recognized'; the booking app holds his logged-in purchase session and check-ins to two classes on 4 and 11 February; the payment went through without an authentication challenge, so the studio stands to lose €135.00; Larkfield submits its single defense on 3 March 2027; the outcome is told in the dispute journey. | `contrast`: A refund the member asked Larkfield for. → A reversal the cardholder asked his bank for. |\n| p33 | example | Two further members appear where a chapter needs a payment that is not a card payment by Mila: Daan Peters pays by direct debit and Lotte Smit's card is replaced by her bank. | scenario: Daan Peters: €49.00 membership at Studio Noord by SEPA Direct Debit collected Thursday 1 April 2027, fee €0.64, studio receives €48.36, refundable without reason until 27 May 2027. Lotte Smit: €49.00 membership on a Dutch Mastercard debit card stored in 2025; her bank replaces the card in February 2027 and the renewal of 1 March 2027 is still approved at the first attempt through a network token. | `additional_support`: The pass, the renewal, the refund and the dispute, all card payments. → Two more members at the same studio, added where a chapter needs a direct debit or a replaced card. |\n| p34 | example | Two examples follow Larkfield's own subscription revenue: Ironworks Climbing's annual plan and Studio Noord's monthly plan with its SMS usage. | scenario: Ironworks Climbing pays €1,890 up front on 1 February 2027 for an annual €189 plan at one location, recognized by the day over 365 days. Studio Noord is on the €89 plan and moves to €189 on 16 April 2027; in March 2027 it sent 1,240 SMS messages and was billed for 1,324. | `contrast`: Payments in which the studio is the seller. → Payments in which Larkfield is the seller and the studio the customer. |\n\n### How the Chapters Use Larkfield\n\n**Controlling idea** (`process`, id `usage`): Every chapter uses Larkfield in the same way, as a labeled illustration with fixed facts, and never as evidence about a provider.\n\n**Advances the thesis** (S6): States the conventions that make the fixed record usable and keep fiction apart from evidence.\n\n**Transition in:** `conclusion_summary`: The company, its landscape, incidents, program and examples. → How a chapter draws on them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | process | Each chapter opens with a 2027 scene at Larkfield, answers its question from dated public evidence, and returns to Larkfield for a worked example with these numbers. | fact: Chapters are set in 2027, Femke de Graaf's first year; each says near its top where on the path of Mila's class pass it sits; the journeys of Part IX follow the recurring payments end to end. |  |\n| p36 | explanation | Three conventions hold throughout: Larkfield is labeled fictional, its systems are named by role, and what it experiences with a provider is illustration, never evidence. | fact: Larkfield is labeled fictional the first time it appears in a chapter; a provider behavior shown in a Larkfield scene must also be documented and cited in that chapter. | `elaboration`: Where Larkfield appears in a chapter. → The rules that govern every appearance. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The preface's three pages are one argument at three sizes: Larkfield's eight incidents are instances of the named patterns, each pattern is a promise recorded as the truth or a dependency left untested, and the Keel decisions are the book's claim written as one company's program. What no page says alone is that the same discipline applies to the providers: what Larkfield experiences is illustration, and only a dated source is evidence.\n\n**So what:** The reader can treat every chapter's opening scene as one more view of a landscape and a list of failures they already know, check any figure against this page, and ask of each Keel decision what the equivalent change would be in their own integration before asking whether their provider is the right one.\n\n**Callback:** Mila's €120 class pass, on which the introduction to the book opened, and this page's opening statement that the platform is given whole so that incidents read as one landscape's history (p01). The €120 has returned as the recurring payment with its fixed figures (approved at 19:42 on Tuesday 9 March 2027, a €2.53 fee, €117.47 for Studio Noord, paid out on Thursday 11 March), and the reader can now name the systems and people behind each step.\n\n**Takeaway** (`course_of_action`): Begin Part I by following Mila's €120 through every party it touches, and ask at each step who has promised what, who holds the money and which record says so.\n\n**Hand-off** to [Part I — MONEY: How a Payment Actually Moves](part-1.html): `elaboration`: The preface's central idea that the instant answer is not the truth, the sixteen named failure patterns, and Larkfield with its recurring payment, Mila's €120 class pass. → Part I, the slow truth itself, before any software: who the parties behind the API are, what each one promises and when, and how long the promises stay open.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | synthesis | Read together, the preface's three pages are one argument at three sizes, a claim about every payment, sixteen patterns and one platform, and the discipline that keeps Larkfield's fiction apart from evidence applies to the providers as well; Mila's €120, on which the book opened, has returned here with the systems and people behind each step. |  |  |\n| p38 | transition | Part I takes up the slow truth before any software: who the parties behind the API are, what each promises and when, and how long the promises stay open; it begins by following Mila's €120 through every party it touches. |  | `sequence`: The argument of the preface: promises, patterns and one platform. → The next step: Part I and the questions to carry into it. |\n\n## Non-goals\n\n- The failure patterns themselves, their families and how they chain. See [Paid Twice, Paid Never: Sixteen Ways Payment Systems Go Wrong](where-payment-systems-go-wrong.html).\n- The parties to a card payment and the payment's timeline; this page uses 'authorization', 'payout' and 'dispute' with one-clause glosses only. See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html), [Part I — MONEY: How a Payment Actually Moves](part-1.html).\n- Explaining or justifying any Keel decision; each owning chapter does that. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html), [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html), [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html), [The Biggest Day: Peak Load and Capacity](payment-peak-load.html), [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html), [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html), [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- How Stripe or Adyen works. The page states only which product or account model Larkfield uses, as fixed in written chapters, and cites no public source.\n- The outcome of the €120 dispute. See [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html).\n- A 'Stripe and Adyen: Where They Differ' section, a three-tier take-away and Questions to Ask: preface pages do not carry them.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Resolved 17 November 2026: the journal spec's AC-2 'expected' answer now follows rulings 20 and 12 (the Silent Webhook on Monday 14 September 2026; on Adyen the confirming record is the webhook plus the settlement report).\n- The ledger calls the eight 'the 2026 incidents', but the Unexplained €0.4 Million is dated year-end 2025. The page says 'found between the year-end close of 2025 and November 2026' ; the thesis claim now reads 'eight incidents of 2025–2026' (ruling 24).\n- K3 in the ledger now reads 'the reconciliation job covers both providers, one run per provider, started when that provider's reports are ready'; chapter 15's addition says the job runs once per provider on the provider's report-ready signal, not at a fixed hour. The page quotes K3 and adds chapter 15's detail without calling the job nightly under Keel.\n- The ledger says the payout with Mila's €117.47 'arrives on Thursday 11 March'; chapter 14's addition says it is marked sent on 11 March and arrived on 25 March (the close of Larkfield's 10-business-day return window). The page follows chapter 14, which owns payouts: the studio is paid on 11 March, and Larkfield's record calls the payout arrived on 25 March.\n- No date for the approval of Keel is in the ledger; the page gives none.\n\n## Decision log\n\n- **2026-11-17** — Systems before people, people before incidents, as the journal spec's AC-5 expects: the cast is defined by what each person built or owns, and the incidents name owners. Rejected: People before systems, as on ORDERED's page, which would introduce 'built the payment service' before the payment service.\n- **2026-11-17** — The incidents are one dated list in chronological order, followed by a table of pattern and deciding cause; the ledger's own order is not chronological. Rejected: One wide table with mechanism, cost and pattern, whose cells would be too long to read.; The ledger's order, which starts with the last incident.\n- **2026-11-17** — Pattern labels: Double Charge, Version Cliff, Open Till, Frozen Seller, Stranded Payout and First of the Month map one to one; the Silent Webhook is The Trusted Doorbell (journal spec an on an account default nobody owned (not one nobody had chosen), and K3's reconciliation is no longer called nightly.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric (sound with notes): the first of the month moved to follow the renewal it multiplies and the billing examples moved last; the four missing joins of the landscape section made the same in its claim and its paragraph; the five countries named where the markets first appear; the common cause tied to the joins and the Keel decisions to the incidents; the pattern labels of three sections corrected. Not acted on: merging the two paragraphs of the last section (the conventions are restated there on purpose, as the place a reader looks them up).\n- **2026-11-17** — First draft of the spec, written before the article from the scenario ledger and PLAN.md.\n- **2026-11-17** — Journal-spec entry corrected for rulings 12, 13, 20 and 24; intent, thesis and role re-synced.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (stale open question closed; stale open question updated; ruling 28 / K3: not nightly). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
