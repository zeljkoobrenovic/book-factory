<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The history in dated steps: founded in Amsterdam in 2006; a European acquiring license, which its history page dates only to the period 2006 to 2012; banking license 2017; listing on Euronext Amsterdam in June 2018; US federal branch 2021; embedded financial products March 2022; UK banking authorization September 2023; the 2023 margin fall (55% in 2022 to 46% in 2023) and recovery (50% in 2024, 53% in 2025); Talon.One and Orb announced in April and June 2026 and closed on 1 July 2026.\n- **Know:** The single-platform bet in Adyen's own words (2025 annual report): operate 'the essential layers of the financial stack ourselves', 'a single platform built entirely in-house', licenses held to work 'without relying on partner banks', with data centers as the main capital expenditure (5% of net revenue in 2025, 7% expected for 2026).\n- **Know:** The figures with their definitions: processed volume, net revenue (what Adyen keeps after passing on interchange and scheme fees), EBITDA margin, take rate (17.0 basis points in 2025), full-stack share (84%), in-person volume (€310.9 billion, 22% of volume), the three pillars (Digital, Unified Commerce, Platforms), top ten merchants at 11% of revenue.\n- **Know:** Where the single platform stops by Adyen's own disclosures (16% of volume not full-stack, banking partners named as a concentration risk in locations where it has no acquiring license, Orb described in June 2026 as run as an 'incubator' that keeps serving other providers, 'convergence' stated as intent with no date) and where the public record stops (the cities, operators and number of its data centers beyond six named regions, the identity of the single large-volume customer, what has been integrated of the acquired products).\n- **Believe:** 'Single platform, built in-house' is a dated description of Adyen's payments and banking core, accurate there, and no longer a description of the whole company.\n- **Believe:** Owning the regulated layer is a choice with a visible price (capital, supervision, capital expenditure) and a visible return in Adyen's accounts; it is not available to, or sensible for, most builders.\n- **Be able to:** State which Adyen products run on the platform it built and which were bought in 2026, and what Adyen has and has not said about integrating them.\n- **Be able to:** Read Adyen's volume, net revenue, margin and take rate together and explain a year in which they move in different directions.\n- **Be able to:** Name the practices in Adyen's record that a builder can adopt and the assets it cannot.\n\n**Audience:** Engineers and architects new to payments who have read the Stripe case and the mechanism chapters of Parts I to VIII, and who integrate with Adyen, evaluate it, or are tempted to copy it.\n\n**Already knows:**\n\n- What an API, a webhook, a ledger, sharding and a data center are.\n- From earlier chapters: acquirer, issuer, interchange, settlement, payout, safeguarding, payment facilitator; they are glossed again in one clause where first used here.\n- Stripe's order of construction from the previous chapter: interface first, regulated layer assembled afterward.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given the claim that everything bought from Adyen is one platform, the reader answers as of November 2026 with the dated facts and the stated limits. *Probe:* An architect at a retailer says in November 2026: 'Adyen builds everything itself on one platform, so whatever we buy from them is one integration with one set of reports.' Using only this chapter: is that right? | `custom` | cold_reader | major |\n| AC-2 | Given Adyen's 2025 figures moving in different directions, the reader explains them from the definitions and from what Adyen reports. *Probe:* In 2025 Adyen's processed volume grew 8% and its net revenue grew 18%. A colleague concludes that Adyen raised its prices. Using only this chapter: what does Adyen's own reporting say? | `custom` | cold_reader | major |\n| AC-3 | The reader separates what a builder can adopt from Adyen's record from the assets that cannot be copied, and names the limit Adyen itself discloses. *Probe:* A logistics platform with a payments team of nine reads this chapter and wants 'what Adyen has'. Using only this chapter: what can it adopt, what can it not, and what does Adyen say about how its own largest customers buy? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter establish about Adyen, in what order, and from what kinds of source? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** What does Adyen's dated public record show about building payments as one platform under its own banking license, and which of its practices can a builder use?\n\n> **Claim:** Adyen's record shows a company that chose to operate the regulated layers itself for enterprise customers (one platform built in-house, its own acquiring and banking licenses in the EU, the US and the UK, its own data-center capacity) and that reports its volume, net revenue and margin in audited figures; Adyen itself discloses where the single platform stops (16% of 2025 volume was not full-stack, and it names banking partners in locations where it has no acquiring license), and since 1 July 2026 the phrase describes Adyen's payments and banking core and not the whole company, because loyalty and usage billing were bought and Adyen describes one of them, Orb, as run under 'an incubator model'. A builder can adopt the practice of one accounting core and one place for every change; the licenses, the data centers and the terminal estate are assets built over two decades, not a design a builder can adopt.\n\n**Disputed by:** The view that Adyen proves building everything in-house on one platform is the correct architecture for payments, that the company still builds and does not buy, and that the 2026 acquisitions are a footnote; or the opposite view, that the acquisitions show the single platform was always a slogan.\n\n**So what:** A customer integrating Adyen before July 2026 touched one platform; one that adds Orb or Talon.One should ask what is shared (credentials, events, reports) and plan for separate systems until Adyen says otherwise. A builder notes that Adyen attributes its 53% margin to the single platform, that the attribution is Adyen's own, and that the platform and licenses behind it took from 2006 to 2023 to assemble; the margin is not evidence for a design a team could reproduce in a year.\n\n**How and why:** The annual report for 2025 states the choice as a sequence: first 'our single global platform', so that an improvement 'takes effect everywhere, without reintegration work'; then 'our own banking licenses in the EU, US, and UK', to work 'without relying on partner banks'; data centers are the main capital expenditure. Adyen credits the platform for its margin ('the underlying operational efficiency inherent to our single-platform architecture', H1 2026), which is its own attribution, not an independent finding. The same documents mark the edges: 84% of 2025 volume was full-stack; concentration risk sits 'at banking partners in locations where there are no own direct acquiring licenses'; Orb is preserved under 'an incubator model' and keeps 'supporting multi-PSP environments'. In August 2026 Adyen wrote 'we are no longer just a payments company'. Its 2021 engineering account describes one accounting framework whose entries must sum to zero when written, which is the practice a builder can take. Its posts on the platform's architecture are mostly from 2018 to 2021, with later ones on partitioning (2023 to 2025) and one of 2026 that adds scale, so the chapter's account of internals is short and dated; the cities and operators of its data centers (it names six regions), what has been integrated of the acquisitions and the identity of the single large-volume customer behind its 2025 volume figures are not public.\n\n**Supporting claims**\n\n- **S1** — Adyen's dated history is an order of construction: an acquiring license and enterprise merchants first, the banking permissions next (EU 2017, US 2021, UK 2023), financial products on those permissions from 2022, and adjacent software last and by purchase in 2026.\n- **S2** — The single-platform bet is stated by Adyen as a sequence (one platform, its own licenses, its own infrastructure) and has a visible price in capital expenditure and supervision; an integrator meets it as specific documented behavior (terminals and online payments on one platform, payouts paid ahead of network settlement, one accounting core), not as a single API.\n- **S3** — Adyen itself discloses where the platform stops: 16% of 2025 volume was not full-stack, it names banking partners, as a concentration risk, in locations where it has no acquiring license (that they stand in for Adyen there is the author's inference), it sold no billing engine, tax engine or merchant-of-record service of its own, and since 1 July 2026 two bought products sit beside the platform, one of them described in June 2026 as run under an incubator model.\n- **S4** — Adyen's audited figures have to be read with their definitions and together: volume, net revenue, take rate and margin moved in different directions in 2025 because of merchant mix and tiered pricing, and the link from the single platform to the margin is Adyen's own attribution.\n- **S5** — The engineering record is thin and its architecture posts are mostly from 2018 to 2021; what a builder can take from it is practice (one accounting core checked when written, one place for each change, versions visible in every request), while the licenses, the data centers and the terminal estate are assets, and several questions have no public answer.\n\n## Role in the part\n\nSupplies the second company's record, including Adyen's own statements of where its platform and licenses stop and the 2026 acquisitions, so that the comparison does not set Stripe's documents against Adyen's slogan. Supports P10-2 of part `part-10`.\n\n## Flow\n\n**Pattern:** `assertion_evidence_reasoning` (also `chronological` in history and acquisitions: dated steps in order, 2006 to 2023 and April to October 2026; `large_to_small` in bet, licenses, in-person, platforms: the bet as a whole, then each layer and product line it produced)\n\nThe reader first learns how company evidence is weighed, then gets the history, because the thesis is about an order of construction and every later section refers to a date in it. The bet is quoted before the layers it names (licenses, in-person, platform products), so that each layer is read as a consequence and each ends on the edge Adyen discloses. The acquisitions follow the product edge they cross. The figures come after the acquisitions because the 2026 guidance, headcount and capital expenditure cannot be read without them; putting the figures first would present a 53% margin before the reader knows what the platform is or what changed in July. The engineering record comes late because it is the thinnest and oldest evidence and feeds directly into what transfers; the list of what is not public closes the body so that nothing after it is mistaken for fact.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In November 2026 an architect at a retailer says: 'Adyen builds everything itself on one platform, so whatever we buy from them is one integration with one set of reports.' On 9 April 2026 an Adyen press release said almost the same: 'Unlike many providers that rely on a patchwork of acquired technologies and third-party integrations, Adyen has built its entire financial technology stack on a single platform.' On 1 July 2026 Adyen closed the purchase of two software companies.\n\n**Bridge:** An engineer who has just read how Stripe started from an interface and added the regulated layer afterward expects the second company to be the tidy opposite: one platform, one bank, built in-house, end of story. → Adyen's own documents confirm that picture for payments and banking, mark its edges themselves, and since July 2026 no longer describe the whole company; the case reads those documents by date.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): Adyen chose to operate the regulated layers itself for enterprise customers and reports the result in audited figures; it discloses where the single platform stops, and since 1 July 2026 the phrase describes its payments and banking core, not the whole company. A builder can adopt its practices of one accounting core and one place for every change, not its licenses, data centers or terminal estate.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Say how the case is read: the labels, the cut-off date, the kinds of source and what could not be reached. *Kept in:* how-to-read.\n- Give the history in dated steps, from an acquiring license in Amsterdam to three banking permissions. *Kept in:* history.\n- Quote the single-platform bet in Adyen's words, then follow it through the licenses, the terminal estate, and the platform and financial products. *Kept in:* bet, licenses, in-person, platforms.\n- Set out the two acquisitions of 2026 and what they change. *Kept in:* acquisitions.\n- Read the published figures with their definitions. *Kept in:* figures.\n- Review the engineering record and its age, sort what transfers to a builder from what does not, and list where the evidence stops. *Kept in:* engineering, transfers, evidence-stops.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous case showed a company that built the interface first; this one built in the other order, and the sentence a retailer's architect says in November 2026 (everything Adyen sells is one platform it built) was Adyen's own wording in April 2026 and stopped being true of the whole company on 1 July 2026. | quotation: Adyen press release of 9 April 2026 (Intelligent Money Movement): 'Unlike many providers that rely on a patchwork of acquired technologies and third-party integrations, Adyen has built its entire financial technology stack on a single platform.' https://www.adyen.com/press-and-media/adyen-launches-intelligent-money-movement; fact: Adyen's closing release of 1 July 2026: 'Both transactions officially closed on July 1, 2026' (Talon.One and Orb). https://www.adyen.com/press-and-media/adyen-closes-talonone-and-orb-acquisitions-announces-leadership-updates |  |\n| p02 | claim | Adyen operates the regulated layers itself on one platform for enterprise customers and reports audited figures; it marks the edges of that platform itself; since July 2026 the single platform is its payments and banking core, not the company; and what transfers to a builder is practice, not assets. |  | `problem_solution`: The sentence that was true and then was not. → The thesis: what the dated record supports, where Adyen draws the edges, and what a builder can use. |\n| p03 | context | Mila's class pass was paid through Adyen, which carries 56% of Larkfield's member payment volume and every front-desk terminal; this chapter is about the company behind that share, not a step of the payment. | scenario: Scenario ledger: Mila Janssen's €120.00 ten-class pass at Studio Noord (on Adyen), 9 March 2027; Adyen's 2026 share of Larkfield's volume 56% (€627 million), Stripe 44% (€493 million); Adyen carries all front-desk terminals. | `place`: The thesis. → Its bearing on the recurring payment and on Larkfield's own split. |\n| p04 | transition | The chapter says how the case is read, gives the history by date, quotes the bet and follows it through licenses, terminals and platform products, sets out the 2026 acquisitions, reads the figures, reviews the engineering record, sorts what transfers and lists where the evidence stops. |  | `sequence`: Where the chapter stands relative to the payment. → The order of its sections. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`context`, id `how-to-read`): Every statement about Adyen is labeled documented, widely reported or inferred and carries its date; the sources differ in weight, and some could not be reached.\n\n**Advances the thesis** (S5): Sets the rules of evidence the rest of the case is held to, including the flag on engineering sources older than three years.\n\n**Transition in:** `sequence`: The roadmap's first promise. → The rules for reading company evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Claims are documented, widely reported or labeled inference; the research cut-off is 17 November 2026; and the sources rank from the audited annual report through unaudited letters and updates, press releases and undated license and documentation pages to engineering posts, most of them from 2018 to 2021 and flagged with their age. | source: The source set: Annual Report 2025 (audited, signed 5 March 2026); H2 2025 and H1 2026 shareholder letters and the Q3 2026 business update (unaudited); press releases 2018 to 2026; adyen.com license, pricing and about pages and docs.adyen.com (n.d., accessed November 2026); knowledge-hub engineering posts 2018 to 2026. |  |\n| p06 | context | Five things could not be reached or confirmed and are either left out or marked: the official filing of the annual report, the earnings calls, the 2023 Investor Day targets and share-price fall, the full status-page history, and any Adyen statement that the 2026 deals were its first acquisitions. | source: Research limitations recorded in the briefs: the annual report was read from a copy of the printed version (not the official ESEF filing); the calls of 23 April, 11 June and 13 August 2026 were not transcribed; the 2023 Investor Day targets and the August 2023 share-price fall were recalled, not fetched; status.adyen.com history is truncated to three items a month. Adyen's history page (n.d., accessed November 2026) lists no acquisition before Orb and Talon.One. | `contrast`: What the sources are. → What could not be read, and how the chapter treats it. |\n\n### From an Acquiring License to Three Banking Permissions: 2006 to 2023\n\n**Controlling idea** (`evidence`, id `history`): Adyen's dated steps run from an acquiring license and enterprise merchants, through a banking license in 2017 and a listing in 2018, to a US branch, financial products and a UK authorization, with one visible stumble in 2023.\n\n**Advances the thesis** (S1): Supplies the dated sequence that the thesis calls an order of construction.\n\n**Transition in:** `sequence`: The rules of evidence. → The first body of evidence: the history, by date.\n\n**Order of paragraphs** (`chronological`): Dated steps in the order they happened, so the reader sees which permission preceded which product.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | evidence | Adyen was founded in Amsterdam in 2006 and its own history lists a European acquiring license, point-of-sale and risk tools among the steps of 2006 to 2012, for a customer it describes as the enterprise. | quotation: https://www.adyen.com/about (n.d., accessed November 2026): 'We were founded in Amsterdam in 2006. We secured a European acquiring license, added POS and risk tools, and expanded into San Francisco, London, Paris, and Stockholm' (period 2006 to 2012); 'Built for enterprise, not adapted to it.' |  |\n| p08 | evidence | Between 2016 and 2020 Adyen became a bank and a listed company: a European banking license in 2017, acquiring licenses in Asia-Pacific, a listing on Euronext Amsterdam in June 2018 at €240 a share, and a long-term contract with eBay signed the same year. | fact: US branch release of 14 June 2021: 'its European banking license (obtained in 2017)'. IPO release of 11 June 2018: offer price €240, 'implying a market capitalization of €7.1 billion', existing shares only; trading from 13 June 2018. Annual Report 2025, note on the long-term contract: 'In 2018 Adyen entered into a long-term contract with eBay'. About page: 2016 to 2020, 'added acquiring licenses across APAC, including Singapore, Hong Kong, Australia, New Zealand, and Malaysia'. | `time`: The founding period. → The second period, 2016 to 2020: the bank and the listing. |\n| p09 | evidence | From 2021 to 2023 the banking permission was extended to the United States and the United Kingdom, and in between, in March 2022, Adyen announced accounts, cards and capital built on it; a table gives all the steps to 2026. | fact: OCC approval of a Federal Foreign Branch in San Francisco announced 14 June 2021 (Federal Reserve approval 24 May 2021); 'Adyen expands beyond payments, announces embedded financial products', 31 March 2022, with Thom Ruiter's 'without the barriers of regulatory complexity, lengthy product development, or sponsor bank restrictions'; UK banking authorization under Part 4A of FSMA 2000 announced 7 September 2023.; table: Dated steps 2006 to October 2026: Date \\| Step \\| Source and age. | `time`: The bank and the listing. → The third period: the permission extended and products built on it. |\n| p10 | analysis | The one visible stumble is 2023, when hiring took the EBITDA margin (earnings before interest, tax, depreciation and amortization as a share of net revenue, both glossed here in a clause and defined in the figures section) from 55% in 2022 to 46%, and the recovery to 50% in 2024 and 53% in 2025 is in the audited accounts. | statistic: H1 2023 release (17 August 2023): EBITDA margin 43%, 'primarily impacted by increased wages and salaries stemming from Adyen's investments into scaling its global team'. H2 2023 release (8 February 2024): 'EBITDA margin was 46% for the full year, compared to 55% in 2022'. Annual Report 2025: 53% (2024: 50%).; reasoning: INFERENCE block: the sequence is license, platform breadth, bank, products on the bank; each permission precedes the product that needs it. | `contrast`: A run of additions. → The year the run was interrupted, and what the accounts show. |\n\n### The Single-Platform Bet in Adyen's Own Words\n\n**Controlling idea** (`evidence`, id `bet`): Adyen states its bet as a sequence (platform, licenses, own infrastructure); for an integrator it is an operating claim, not one API, and its price is visible as capital expenditure on data centers.\n\n**Advances the thesis** (S2): Gives the bet in quotation, separates the operating claim from the interface the integrator meets, and shows the cost.\n\n**Transition in:** `cause_effect`: The order in which Adyen built. → The reason Adyen gives for building in that order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | evidence | The 2025 annual report states the bet as a strategic choice made 'from the beginning' and carried out in steps: first one global platform, then its own banking licenses, all run on its own infrastructure. | quotation: Adyen Annual Report 2025 (signed 5 March 2026; audited), 'The evolution of our foundation': 'rather than build a business around the limitations of external providers, we would develop and operate the essential layers of the financial stack ourselves'; 'The first step was our single global platform'; an improvement 'takes effect everywhere, without reintegration work'; 'acquiring our own banking licenses in the EU, US, and UK ... without relying on reasoning: INFERENCE block: 'single platform' is an operating claim (one code base and one place to change), not an interface claim; its cost is fixed and paid before the volume arrives. | `additional_support`: The platform as an operating claim. → The infrastructure layer under it, and what it costs. |\n\n### One Bank, Three Jurisdictions, and What the License Allows\n\n**Controlling idea** (`evidence`, id `licenses`): Adyen is one Dutch credit institution with a US and a UK branch; the license lets it acquire, hold funds and pay out ahead of settlement on its own balance sheet, and Adyen discloses that it does not reach everywhere.\n\n**Advances the thesis** (S2, S3): Shows the second layer of the bet, what it buys in documented behavior, and the first of the edges Adyen itself reports.\n\n**Transition in:** `elaboration`: The second layer of the bet, the licenses. → Their legal form, their documented uses and their limits.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | Legally Adyen is one credit institution supervised by the Dutch central bank, passported across the European Economic Area, with a federal branch in the United States and a branch in the United Kingdom, plus narrower local licenses elsewhere. | quotation: https://www.adyen.com/licenses/emea (n.d., accessed November 2026): 'Adyen N.V. is authorised as a credit Institution under the supervision of Dutch Central Bank'; 'authorised as an overseas branch of an EEA credit institution in the UK with a Part 4A permission'. https://www.adyen.com/licenses/united-states: 'a federal Branch of Adyen, N.V., licensed by the Office of the Comptroller of the Currency and the Federal Reserve Board of Governors'. H1 2026 letter: 'a Category II payments license from the Central Bank of the UAE'. Singapore Major Payment Institution; Japan registration as merchant acquirer. |  |\n| p15 | evidence | Adyen says the licenses exist so that it does not depend on partner banks and has direct access to payment networks and control over funds, and the balance sheet shows the funds: €12.4 billion of cash at mid-2026, most of it merchants' money in transit, earning finance income. | quotation: Adyen Annual Report 2025 (signed 5 March 2026; audited): 'the speed and autonomy that come from not relying on external parties for regulatory compliance'. Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): 'Our own licensed infrastructure grants direct access to payment networks, giving us control over funds'; 'We ended the half with €12.4 billion of total cash. The majority of that number represents balances moving through our system on behalf of our merchants'; finance income of €143.2 million 'generated primarily from our balances at central and commercial banks'. Annual Report 2025 income statement: finance income €267.6 million (2024: €349.8 million). | `cause_effect`: The legal form. → What Adyen says it is for, and where it shows in the accounts. |\n| p16 | evidence | The use an integrator sees most directly is the payout: under Sales day payout Adyen pays a day's sales after a fixed delay whether or not the card networks have paid Adyen, for up to 30 days, while its annual report calls paying after receipt the default. | quotation: Sales Day Payout Terms of Service (last update 17 June 2024): Adyen will 'initiate payout of the Net Captured Volume to Merchant on the Payout Day, irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner'. Documentation (n.d., accessed November 2026): 'Prefinancing is capped at 30 days.' Adyen Annual Report 2025 (signed 5 March 2026; audited), risk section: 'In the default setup, Adyen follows a pass-through model, paying out to merchants only after funds have been received from the payment method. Liquidity mismatches can arise only when deviating from this default, primarily through pre-financing in accelerated payout schedules.' | `example`: Control over funds. → The documented behavior that control makes possible: paying out ahead of settlement. |\n| p17 | evidence | The license does not reach everywhere, by Adyen's own disclosure: 84% of the 2025 processed volume (the value of payments it handled) was full-stack, a term the report leaves undefined there, its documentation lists 14 countries and regions with an Adyen acquiring connection, its risk section places concentration risk at banking partners where it has no acquiring license of its own, and, beyond license pages that name an entity for some markets (Japan, Singapore) and a 2026 claim of principal membership of Visa and Mastercard 'in major markets', it lists neither the acquiring entity per country nor its network memberships. | quotation: Adyen Annual Report 2025 (signed 5 March 2026; audited): 'Of processed volumes, 84% were full-stack volumes, up from 83% in 2024'; 'Concentration risk at Adyen originates primarily at banking partners in locations where there are no own direct acquiring licenses'. Documentation, 'Supported currencies' (n.d., accessed November 2026): 14 countries and regions listed with an 'Adyen acquiring connection'; payments are processed 'through one of our acquiring entities, for example Adyen Singapore'. H1 2026 letter: approval for direct access to France's domestic interbank clearing system and the UAE license, both in 2026.; reasoning: INFERENCE block: 'full-stack' is not defined where the 84% is given; the reading that it means Adyen is also the acquirer is the author's. The banking-partner sentence is a statement about concentration risk; reading it as evidence that partners acquire for Adyen in some markets is also the author's inference (ruling 27). The bank is what makes pre-financed payouts and financial products additions and not partnerships; Adyen states autonomy as the reason, not cost. | `contrast`: What the license allows. → Where, by Adyen's own account, it stops. |\n\n### Unified Commerce and the Terminal Estate\n\n**Controlling idea** (`evidence`, id `in-person`): In-person payments are a reported line of Adyen's business, 22% of 2025 volume on 878,000 transacting terminals by October 2026, run on the same platform as online payments.\n\n**Advances the thesis** (S2): Shows the single platform in the place where an integrator can see it: one provider record for the till and the web.\n\n**Transition in:** `additional_support`: The licenses, the second layer. → The channel where the single platform is most visible to a merchant: the shop counter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | evidence | Adyen reports in-person volume of €310.9 billion in 2025, 22% of processed volume and up from 18% in 2024, and 878,000 transacting terminals in the third quarter of 2026; 'Unified Commerce' is also the name of one of Adyen's three reporting pillars (Digital, Unified Commerce, Platforms), which is a different measure. | statistic: Adyen Annual Report 2025 (signed 5 March 2026; audited): 'point-of-sale volumes were €310.9 billion, comprising 22% of total processed volume, up from 18% in 2024'. H2 2023 release: €159.9 billion in 2023. Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): 838K transacting terminals, in-person volume €175.7 billion. Adyen Q3 2026 Business Update (28 October 2026; unaudited): 'The number of transacting terminals across the platform reached 878k, up 25% YoY'. Unified Commerce pillar net revenue €765.4 million in 2025. |  |\n| p19 | explanation | The terminals are supplied and managed by Adyen, some designed in-house since 2022, driven through a Terminal API based on a retail protocol, and tied to online payments by shared references; Larkfield chose Adyen in 2024 for exactly this. | fact: Release of 18 August 2022 (evidence age 4 years): 'its first in-house designed terminals'. Documentation: 'Our Terminal API is based on the nexo Retailer Protocol' (n.d., accessed November 2026), local or cloud communications. Owned by in-person-payments. Scenario ledger: Adyen carries all Larkfield front-desk terminals, in 2,100 studios; chosen in 2024 'for in-person payments on one platform with online'.; reasoning: INFERENCE block: the estate is an asset of logistics and certification built over years; it is also the reason Adyen gives for buying a loyalty engine, which the acquisitions section takes up. | `elaboration`: The reported size of the channel. → How it is built, in one paragraph, with the owning chapter. |\n\n### Platforms, Financial Products, and What Adyen Did Not Sell\n\n**Controlling idea** (`evidence`, id `platforms`): Through platforms Adyen reaches the small businesses it was not built for and sells them accounts, cards and capital on its license; until July 2026 it sold no billing engine, tax engine or merchant-of-record service.\n\n**Advances the thesis** (S2, S3): Shows the third use of the license and the product edge that the 2026 acquisitions then cross.\n\n**Transition in:** `additional_support`: The in-person channel. → The third pillar, and the edge of the product range.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | evidence | Platforms is Adyen's smallest and fastest-growing pillar, and Adyen says it is how it reaches smaller merchants. | statistic: Adyen Annual Report 2025 (signed 5 March 2026; audited), commercial pillars: Platforms net revenue €263.8 million in 2025 (2024: €176.1 million). Adyen Q3 2026 Business Update (28 October 2026; unaudited): Platforms net revenue €100.2 million, up 46%; '46 platform customers processing over €1 billion annually, up from 37 last quarter and 31 a year ago'; active business customers 312k; 'Our Platforms offering allows us to provide payments and financial products to smaller merchants, which will be a key driver of future growth.' Documentation: balance platform, erchant or to partners. |\n\n### July 2026: Loyalty and Usage Billing, Bought\n\n**Controlling idea** (`evidence`, id `acquisitions`): On 1 July 2026 Adyen closed its purchases of Talon.One and Orb; it describes one as being integrated and the other as run under an incubator model, with convergence as intent and no date.\n\n**Advances the thesis** (S3): Supplies the dated facts behind the claim that the single platform no longer describes the whole company, and Adyen's own words about integration.\n\n**Transition in:** `cause_effect`: The edge of the product range. → The two purchases that crossed it.\n\n**Order of paragraphs** (`chronological`): Facts, then statements in date order, then status at the cut-off, then the reading.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | evidence | The two deals were announced in April and June 2026 for €750 million and $335 million and both closed on 1 July; a table sets them side by side. | table: Talon.One \\| Orb: what (loyalty and incentives, Berlin, '300+ global merchants' \\| usage-based billing, San Francisco, founded 2021, customers Vercel, Glean, Replit, Supabase); announced (23 April 2026 \\| 11 June 2026); consideration (€750 million \\| $335 million); closed (1 July 2026, both); size ('approximately €60 million in ARR as of the end of this year' \\| funding $44 million, revenue not disclosed); how run (promotion engine to be integrated 'directly into our architecture' \\| 'an incubator model', 'continuing to support multi-PSP environments'). |  |\n| p24 | evidence | Read in order, management's statements move from a sentence against acquired technology in April to 'we are no longer just a payments company' in August, and none says Adyen has stopped building in-house. | quotation: 9 April 2026 release: 'a patchwork of acquired technologies'. 1 July 2026 release: 'Adyen has evolved into a comprehensive platform offering multiple, integrated solutions ... this multi-product reality'. Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): 'While organic growth remains our foundation, our strong balance sheet allows us to selectively deploy capital to accelerate our platform roadmap'; 'we are no longer just a payments company'. 'Why billing and payments belong together' (29 September 2026): 'we've historically stayed singularly focused on solving the hardest problems in payments ... When the opportunity to do something presented itself, we decided to act.' No fetched Adyen document contains a build-not-buy slogan (ruling 16). | `sequence`: What was bought. → What management said about it, in date order. |\n| p25 | analysis | As of 17 November 2026 integration is stated as intent: Talon.One's engine is to be integrated, Orb keeps serving other payment providers, 'convergence' has no date and no Adyen documentation page for billing was found, so a customer should plan for separate systems. | quotation: Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): 'Integrating Talon.One's promotion engine directly into our architecture will bridge this gap'. Orb release (11 June 2026): 'Adyen is adopting an incubator model, preserving Orb's operational continuity during the first phase of the acquisition and continuing to support multi-PSP environments. Beyond this first phase, the strategic intent is convergence'. September 2026 article: 'You'll soon see how we bring this unified Adyen and Orb experience to life across our platform.' Adyen Q3 2026 Business Update (28 October 2026; unaudited): 'we won the payments volumes of several of their customers, including Route and Wasabi Technologies'; 399 team members joined. H1 letter: about 1 percentage point added to 2026 net revenue growth, 'an estimated 1 percentage point margin dilution'. | `contrast`: What management said. → What has been integrated so far, as far as the record shows. |\n| p26 | analysis | The acquisitions leave the single-platform claim true of payments, acquiring, terminals and banking products and make it untrue of the company; Adyen's pages in November 2026 carry both descriptions. | quotation: https://www.adyen.com/global-acquiring (n.d., accessed November 2026): 'We've built our entire platform in house.' https://www.adyen.com/about (n.d., accessed November 2026): 'With the acquisition of Orb and Talon.One ... we've moved beyond payments and built a full enterprise financial operating system.' Design to Duty part 1 (2021; evidence age 5 years): 'We buy instead of build, if the use case is peripheral, it does not have to be real-time, we do not have to embed it'.; reasoning: INFERENCE block: the honest sentence is that Adyen built its payments and banking platform and, from July 2026, buys adjacent software; the 2021 rule allowed buying what is peripheral, and Adyen now calls billing and loyalty part of its platform, so the rule has moved; how far the products will be rebuilt on the platform is not known. | `conclusion_summary`: The facts, the statements and the integration status. → What they change about the phrase 'single platform'. |\n\n### The Figures, With Their Definitions\n\n**Controlling idea** (`evidence`, id `figures`): Processed volume, net revenue, take rate and EBITDA margin measure different things, moved differently in 2025, and can be explained from Adyen's own reporting; the margin's link to the platform is Adyen's attribution.\n\n**Advances the thesis** (S4): Gives the audited figures with definitions and works the year in which they diverged.\n\n**Transition in:** `cause_effect`: The acquisitions, which change headcount, margin guidance and capital spending in 2026. → The figures those changes show up in, defined before they are read.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | definition | Four measures carry Adyen's reporting: processed volume (the value handled), net revenue (what Adyen keeps after passing on interchange and scheme fees), take rate (net revenue over volume, in basis points) and EBITDA margin (EBITDA over net revenue); a table gives them for 2023 to the third quarter of 2026. | table: Metric \\| 2023 \\| 2024 \\| 2025 \\| H1 2026 \\| Q3 2026: processed volume €970.1B, €1,285.9B, €1,394.3B, €803.8B, €451.1B; net revenue €1,626.1M, €1,996.1M, €2,364.2M, €1,302.9M, €738.1M; EBITDA margin 46%, 50%, 53%, 49%, not reported; take rate n/a, 15.5 bps, 17.0 bps, 16.2 bps, not given; in-person volume €159.9B, €232.7B, €310.9B, €175.7B, not given.; fact: Adyen Annual Report 2025 (signed 5 March 2026; audited), note 2.2 and revenue note: net revenue is a non-IFRS measure, net non-interest revenue (non-interest revenue less 'costs incurred from financial institutions' and costs of goods sold) plus net interest income; €2,351.6 million plus €12.6 million in 2025. Processed volume is not defined in one sentence in the report. |  |\n| p28 | analysis | In 2025 volume grew 8% and net revenue 18% because a single large-volume customer, unnamed, processed less: excluding it volume grew 21%, the take rate rose from 15.5 to 17.0 basis points through merchant mix, and in the first half of 2026 it fell back to 16.2 through volume tiering. | quotation: H2 2025 release (12 February 2026): 'Processed volume was €1,394.3 billion, up 21% excluding a single large-volume customer, or 8% YoY including this customer.' Adyen Annual Report 2025 (signed 5 March 2026; audited): 'Full-year take rate for 2025 was 17.0 bps, up from 15.5 bps in 2024. This increase was driven by changes in the overall merchant mix.' Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): 'Take rate landed at 16.2 bps, reflecting expected volume tiering'. Adyen Q3 2026 Business Update (28 October 2026; unaudited): 'Adyen's tiered pricing structure incentivizes our customers to bring more volume to our platform.' Pricing page (n.d., accessed November 2026): 'a fixed processing fee + a fee determined by the payment method', Interchange++. | `example`: The definitions. → A year in which the measures moved apart, worked from them. |\n| p29 | evidence | The revenue comes from three pillars and is spread across large customers: the top ten merchants were 11% of 2025 revenue, none above 10%, and Adyen's own risk section says large merchants typically use several providers. | quotation: Adyen Annual Report 2025 (signed 5 March 2026; audited): pillars Digital €1,334.9 million, Unified Commerce €765.4 million, Platforms €263.8 million; 'Adyen's top 10 merchants represent 11% of revenue (2024: 12%)'; 'Large enterprise merchants typically work with multiple payment service providers to mitigate their own single-point-of-failure risk. As a result, these customers may terminate contracts or shift volume elsewhere'. Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): 'Our typical share of wallet increases from under 20% in years 3–7 to over 40% after year 12'. | `additional_support`: How volume turns into revenue. → Whose volume it is. |\n| p30 | analysis | Adyen attributes its margin to the single platform; the same documents show the margin following hiring and investment, with the 2026 expectation cut to 50% and the medium-term objective withdrawn on 28 October 2026. | quotation: Adyen H1 2026 Shareholder Letter and interim statements (13 August 2026; unaudited): EBITDA margin 49% (50% excluding €6.0 million of transaction costs), 'demonstrating the underlying operational efficiency inherent to our single-platform architecture as we scale'. Investor Day release (11 November 2025): 'above 55% by 2028'. Adyen Q3 2026 Business Update (28 October 2026; unaudited): 'we now expect EBITDA margin of 50% in 2026. To retain flexibility, we are discontinuing our medium-term EBITDA objective'; capital expenditure 7% of net revenue; 5,596 FTE including 399 from the acquisitions.; reasoning: INFERENCE block: a margin of 53% is evidence that the model is profitable at Adyen's scale, not that the architecture causes it; 2023 and 2026 both show it moving with headcount. Volume is not revenue: about €1 of net revenue for every €590 processed in 2025 (author's arithmetic). | `cause_effect`: Volume, revenue and customers. → What is left as margin, and what Adyen says causes it. |\n\n### The Engineering Record, and How Old It Is\n\n**Controlling idea** (`evidence`, id `engineering`): Adyen has published few engineering accounts; the architecture series dates from 2018 to 2021, and newer posts confirm scale and own hosting without describing topology.\n\n**Advances the thesis** (S5): Sets out what is documented about internals with its age, so that the transfer table rests on dated evidence.\n\n**Transition in:** `contrast`: Figures that are current and audited. → An engineering record that is neither.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | context | Of the hundreds of pages on Adyen's knowledge hub only a few dozen are engineering posts, the ones that describe architecture are from 2018 to 2021, and the newer ones cover databases, streaming and one incident. | source: Adyen knowledge hub, by date: 'From 0 to $100 billion' (3 January 2018), 'Design to Duty' parts 1 and 2 (28 July and 23 August 2021), a five-part PostgreSQL partitioning series (2023 to 2025), the DDoS incident update (22 April 2025) and its follow-up (31 October 2025), 'We built Architect for humans' (August 2026). Not found: topology, failover design, a deploy count comparable to Stripe's (the Infrastructure page states weekly releases of the core system), a postmortem. |  |\n| p32 | evidence | The 2021 account describes a stateless acceptance layer that favors uptime and an accounting system that favors consistency, fed through a local database queue, where records can be added only through templates proven to sum to zero. | quotation: Design to Duty part 2 (23 August 2021; evidence age 5 years): 'for the accounting systems we don't mind if they are down for a little bit as long as we can guarantee their reliability and consistency'; 'The only way to add new records to the accounting system is by means of templates'; 'These templates are mathematically verified'; 'if at any time, we sum up all the records in the accounting system, the result will always be 0'. Owned by payment-ledgers and payment-reliability-and-availability. | `elaboration`: The inventory. → Its most useful item: the 2021 design of the edge and the books. |\n| p33 | evidence | The same posts describe PostgreSQL clusters sharded round-robin at a stated cost, a Java monorepo, and development on one main line with features switched on one by one; no deployment frequency for the platform is public. | quotation: Design to Duty part 2 (2021): 'The migration to a sharded accounting database was quite painful.' Part 1 (2021): 'a single platform, in a single repository (monorepo), almost exclusively written in Java'. 'From 0 to $100 billion' (2018; evidence age 8 years): 'everybody develops on the main line'; 'we toggle features one-by-one on production, and then canary them'. Architect post (August 2026): 'Our monorepo alone runs to hundreds of thousands of files, and it's far from the only one.' Owned by payment-data-stores-and-consistency and payment-safe-change. | `additional_support`: The edge and the books. → The storage under them and the way changes reach production. |\n| p34 | evidence | Sources from 2025 and 2026 confirm the scale and the cost of running your own edge: about 3,000 live services on tens of thousands of hosts in tens of data centers, and one attack in April 2025 that Adyen answered partly by adding outside mitigation providers. | quotation: Architect post (August 2026): 'around 3,000 live services and the ~470,000 calls between them'; 'tens of thousands of hosts spread across tens of data centres'. Incident update (22 April 2025): the attack 'specifically targeted services within our European datacenters'; resolved 'by 03:20 CEST on April 22, 2025'; 'A detailed post-incident review ... will be made available to our customers.' Follow-up (31 October 2025): 'introducing additional global DDoS mitigation partners, such as Cloudflare, alongside existing global providers'. Adyen Annual Report 2025 (signed 5 March 2026; audited): one DDoS incident in 2025 that was reportable to regulators (paraphrased; the extracted text is ambiguous on a hyphen).; reasoning: INFERENCE block: 'single platform' is not a single process; the in-house rule bends where a specialist is cheaper than the risk; the public picture of the internals is a 2021 snapshot plus a few later measurements. | `time`: The architecture posts of 2018 to 2021. → What sources from 2025 and 2026 add. |\n\n### What Transfers to a Builder, and What Does Not\n\n**Controlling idea** (`analysis`, id `transfers`): Three practices in Adyen's record can be adopted at any size and three assets cannot be copied; Adyen's own customers show the limit of relying on one platform.\n\n**Advances the thesis** (S5): Turns the record into the distinction the thesis ends on: practice against assets.\n\n**Transition in:** `conclusion_summary`: The record, section by section. → What a builder can do with it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | synthesis | A table sorts seven lessons by the evidence behind each and by whether it transfers: one accounting core checked at write time, one place for each change and explicit versions do; licenses, data centers and the terminal estate do not; the margin is not a design lesson at all. | table: Lesson \\| Evidence \\| Transfers?: one accounting core, entries proven to sum to zero when written (2021, five years old) \\| yes; one place where each change takes effect (annual report 2025; 2018 practice) \\| yes, as a rule for your own payment service; a version visible in every request (documentation, n.d.) \\| yes; banking licenses in three jurisdictions (2017, 2021, 2023) \\| no; data centers at 5 to 7% of net revenue (2025, 2026) \\| no; 878,000 transacting terminals (Q3 2026) \\| no; a 53% margin (2025) \\| not a lesson: Adyen's attribution. |  |\n| p36 | recommendation | A small payments team should take the practices and budget nothing for the assets, and should note that Adyen's largest customers buy from several providers, as Larkfield does with its 44% and 56%. | scenario: Scenario ledger: Larkfield (fictional) has 11 people in its payments team, 44% of member payment volume on Stripe and 56% on Adyen, a small double-entry ledger since 2025, and under K8 a rehearsed switch for its 50 largest studios.; quotation: Adyen Annual Report 2025 (signed 5 March 2026; audited): 'Large enterprise merchants typically work with multiple payment service providers to mitigate their own single-point-of-failure risk.' | `example`: The table. → What a team of about ten does with it. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`evidence`, id `evidence-stops`): Seven things about Adyen are not in any public source found by 17 November 2026, and each is a question to put to Adyen, not a gap to fill by inference.\n\n**Advances the thesis** (S3, S5): States the boundary of the record item by item, as the journal entry requires.\n\n**Transition in:** `contrast`: What the record supports. → What it does not.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | evidence (list) | Not public: a list of which legal entity acquires in each country (license pages name some), which volume is not full-stack and what its banking partners do; the definition of processed volume and the identity of the single large-volume customer; the locations and ownership of its data centers; whether the 2021 accounting design is current; the depth and date of integration of Talon.One and Orb; which banks hold merchants' funds (the terms say Adyen holds them, the documentation gives a country per settlement currency); and whether its management has said in a call that it changed its stance on building in-house. | source: Open questions recorded in the research briefs after searches of Adyen's reports, releases, license pages, documentation and knowledge hub on 17 November 2026. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Read together, the history, the bet, the edges and the figures say something no section says alone: Adyen's single platform is the result of an order of construction that took from 2006 to 2023 and is priced in its accounts, and the same company that built it is the one that marks its limits and, in 2026, went outside it. The phrase is accurate with a scope and a date, and misleading without them.\n\n**So what:** A customer asks of each Adyen product whether it runs on the platform or was bought, and what is shared; a builder takes the accounting discipline and the one-place-for-change rule and does not mistake a bank, a data-center footprint or a margin for an architecture pattern.\n\n**Callback:** The retailer architect's sentence from the opening: 'Adyen builds everything itself on one platform, so whatever we buy from them is one integration with one set of reports.' The reader can now give it a scope (payments, acquiring, terminals, banking products) and a date (on the author's reading, true of everything Adyen sold until 30 June 2026), and name the two products it no longer covers.\n\n**Takeaway** (`course_of_action`): For every Adyen product you use or plan to use, write down whether it runs on the platform Adyen built or was bought in 2026, which entity acquires and holds funds in each country, which payout model applies, and the date and source of each answer; ask Adyen for what the public record does not say.\n\n**Hand-off** to [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html): `conclusion_summary`: The two records as the cases leave them: Stripe, the interface first and the regulated layer assembled afterward as a non-bank; Adyen, the license and platform first and adjacent software bought in 2026; each with its own list of what is not public. → The two set side by side on the same rows, with the 'Where They Differ' tables of Parts I to VIII gathered under them and sorted by the kind of evidence behind each difference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | synthesis (list) | Established: Adyen is one licensed credit institution with a US and a UK branch; it states the single-platform choice in its 2025 annual report and reports audited figures; 84% of 2025 volume was full-stack; Talon.One and Orb closed on 1 July 2026 and Orb runs under an incubator model. |  |  |\n| p39 | synthesis (list) | Depends on context: whether 'one platform' means one integration depends on which products you buy and when; whether Adyen acquires and pre-finances for you depends on the country and the payout model; whether its practices suit you depends on what you build, since the practices scale down and the assets do not. |  | `contrast`: What is settled. → What changes with the situation. |\n| p40 | recommendation (list) | The author's synthesis: the single platform is a dated and scoped description, so the architect's opening sentence is rewritten with its scope and date; and the lesson of Adyen is the order in which it built, not the stack it ended with. |  | `contrast`: What is established and what depends. → The author's own position, returning to the opening sentence. |\n| p41 | recommendation (list) | Seven questions let the reader take the case into a provider evaluation or a design review. |  | `cause_effect`: The author's position. → Questions that apply it. |\n| p42 | transition | With both records read on their own terms, the next chapter sets them side by side on the same rows and sorts the differences by the evidence behind each. |  | `conclusion_summary`: The two cases as they stand. → The comparison bet by bet in the next chapter. |\n\n## Non-goals\n\n- The mechanisms themselves: acquiring membership, terminals and offline payments, ledger design, balances and payout models, licenses and safeguarding law, API design, webhooks, billing engines, merchant of record. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html), [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html), [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html), [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html), [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html), [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html).\n- Any side-by-side comparison with Stripe; the case has no 'Where They Differ' section. See [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- Adyen's agent-payment products, stablecoin clause and instant-payment schemes. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n- Share price, valuation and analyst opinion; the 2023 Investor Day targets and the August 2023 share-price fall, which were not fetched.\n- Any description of Adyen's topology, failover design or hardware security modules beyond what Adyen states (six named regions, failover by load balancers, weekly releases of the core system): not public, and not inferred here.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The journal entry says Adyen was founded 'with a European acquiring license'. Adyen's history page lists the license among the steps of 2006 to 2012 without a year; the article says so and does not date the license to 2006.\n- The journal entry calls Talon.One and Orb Adyen's 'first two acquisitions'. No Adyen document read says so; Adyen's history page lists no earlier acquisition. The article says 'no earlier acquisition appears in Adyen's own history'.\n- The annual report describes pass-through payout as 'the default setup' while the documentation presents Sales day payout as the standard model; the article reports both and does not resolve them.\n- 'Full-stack' is not defined at the point where the 84% is reported; the article labels its reading as inference.\n\n## Decision log\n\n- **2026-11-17** — Section order follows the order the journal entry's AC-4 expects (history, bet, licenses, in-person, platforms, acquisitions, figures, engineering, transfers, evidence stops). Rejected: Figures directly after the history, as in ORDERED's cases: the 2026 guidance change cannot be read before the acquisitions.\n- **2026-11-17** — Each mechanism owned by an earlier chapter gets one paragraph and a link; the case adds only company-level facts. Rejected: Re-teaching the Terminal API, the payout models or the webhook contract.\n- **2026-11-17** — The phrase 'built, not bought' is not quoted or attributed (ruling 16); the article says no Adyen document read contains such a slogan. Rejected: Using the PLAN contract's wording as a section title.\n- **2026-11-17** — Larkfield appears twice only (the journey paragraph and the transfer section), because a case page reports a real company and the ledger adds no evidence about it. Rejected: A Larkfield scene section.\n\n## Sources\n\n- **Internal**\n  - _research/brief-companies-and-bets.md — Part 2 (history, statements, figures, acquisitions), Part 3 (bets), key numbers, open questions.\n  - _research/brief-reliability-and-scale.md — The inventory of Adyen engineering posts, data stores, change practice, the 2025 incident, hosting.\n  - _research/brief-ledgers-and-money-movement.md — The 2021 accounting system, payout models and pre-financing, licenses per region.\n  - _research/brief-acquiring-methods-and-terminals.md — Licenses, full-stack share and banking partners, terminals and unified commerce.\n  - _research/brief-adyen-payments-and-api.md — API families, versions, the absence of a payment GET.\n  - _research/brief-billing-and-revenue.md — Adyen before Orb, the Orb acquisition, tax and merchant of record.\n  - _research/brief-platforms-and-embedded-finance.md — Balance platform, financial products and their status, platform scale figures.\n  - _research/consistency-issues.md — Rulings 11, 12, 16, 18, 21, 22, 25, 27.\n- **External**\n  - https://investors.adyen.com/financials/2025 — Annual Report 2025: strategy statements, figures, notes, risk section (read in the PDF offered on the page, which labels itself a \"printed version\").\n  - https://investors.adyen.com/financials/h1-2026-c2a1a — H1 2026 shareholder letter and interim statements.\n  - https://investors.adyen.com/financials/q3-2026-10c88s — Q3 2026 business update.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 140 claims checked (110 confirmed, 15 corrected, 9 hedged, 3 unsupported and removed or relabeled, 0 unreachable; 3 not checked and listed as such); the engineering section and \"Where the Evidence Stops\" no longer say that failover, data-center regions and a release cadence are unpublished (Adyen's Infrastructure and peak-season pages), and they report the June 2024 remark that the sharding was being redesigned. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Ruling 27 applied after acceptance, with no change to the order or number of units: p17 now reports the 14 acquiring connections in Adyen's documentation and labels the reading of the banking-partner sentence as inference; p37 asks for the acquiring entity per country instead of saying no list exists.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: p01 now names the architect whose sentence the conclusion rewrites; p10 glosses EBITDA margin and net revenue where first used; p17 glosses processed volume and says 'full-stack' is undefined in the report; p18 names the three pillars. Notes not acted on, for the author: leave the 2024 to 2025 margin recovery and the 2026 capital-expenditure expectation to the figures section (kept in history and bet because the journal entry places the margin fall and recovery in the history and the capital expenditure in the bet); the earnings calls appear both under unreachable sources and under where the evidence stops; the declared reason gives a ranking, not a consequence, for placing the engineering record late.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs; load-bearing quotations re-checked against the fetched documents.\n- **2026-11-17** — Reconciliation after verification (parts-9-10): intent, thesis and role re-synced with the corrected journal-spec entry; unit descriptions brought into line with the verified prose and the rulings. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: statements of absence re-tested (most were already wide). Narrowed: 'Adyen does not name the legal entity that acquires in each country, or its card-network memberships' (its license pages name entities for some markets, e.g. Adyen Japan KK as merchant acquirer and Adyen Singapore for merchant acquisition; a 3 July 2026 article claims principal membership of Visa and Mastercard in major markets; no per-country list). p17 and p37 updated, two source entries added, four connective sentences trimmed to stay within length; units unchanged.\n- **2026-11-24** — Sweep of rulings 46 to 48: the evidence-stops bullet on merchants' funds is retitled to the banks that hold them, since Adyen's terms and payout-currencies page state the holder and a country per settlement currency (47g, owner chapter 16); p31 evidence no longer lists a deployment frequency as not found (46e); p37 aligned.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>

    (function () {
