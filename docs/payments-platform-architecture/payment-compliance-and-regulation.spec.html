<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The duties in outline: verifying a business and its beneficial owners, sanctions and politically-exposed-person screening, transaction monitoring and suspicious-activity reporting, periodic re-verification.\n- **Know:** How Stripe and Adyen each expose verification to a platform: requirements or verification errors, deadlines and capabilities, as documented in November 2026.\n- **Know:** The regulatory dates that matter as of November 2026: DORA in application since 17 January 2025, the EU anti-money-laundering regulation from 10 July 2027, instant payments and verification of payee, and PSD3 and the Payment Services Regulation not yet adopted.\n- **Know:** What neither company publishes: transaction-monitoring scenarios, sanctions-screening logic, re-verification intervals.\n- **Believe:** Onboarding is the first run of a loop: an account that was fully enabled can become restricted later without the seller doing anything.\n- **Believe:** A provider's verification does not discharge a platform's own obligations, and a missed deadline shows up as stopped payouts.\n- **Be able to:** Design a platform's handling of verification as mirrored state: requirements, deadlines, capability status, an owner for each deadline, and a way to tell the seller.\n- **Be able to:** Given a seller whose payouts stopped, list the causes the providers' documented models allow and where to look.\n- **Be able to:** Tell apart fraud scoring and anti-money-laundering monitoring by timing and output.\n- **Be able to:** Place a regulatory change on the calendar with its status: in application, adopted with a future date, or not adopted.\n\n**Audience:** A software engineer or architect who builds a platform on a payment provider and has met verification only as a sign-up flow.\n\n**Already knows:**\n\n- Webhooks as notifications that can be late, repeated or missing, and the rule to confirm against the provider's record (payment-webhooks-and-events).\n- Fraud scoring in the authorization path and its outputs (payment-fraud-and-risk); authentication and liability shift (three-d-secure-and-sca).\n- That only a licensed institution may hold customers' money, and which licenses Stripe and Adyen state they hold (licences-and-safeguarding).\n- Payouts and their states (payouts-and-money-movement).\n\n**Does not yet know:**\n\n- KYC, KYB, beneficial owner, sanctions screening, politically exposed person, transaction monitoring, suspicious-activity report, financial intelligence unit, obliged entity.\n- Capability, requirement and verification deadline as account state, in either provider's vocabulary.\n- DORA, the instant-payments regulation, verification of payee, the EU AML Regulation and the status of PSD3 and the Payment Services Regulation.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a seller whose payouts stop long after onboarding with no action on the seller's part, the reader names at least two causes consistent with the documented models and what the platform should have had in place. *Probe:* A marketplace for second-hand furniture onboarded a seller a year ago, and payouts have worked ever since. This morning the seller's payouts stopped. The seller changed nothing. Name two explanations that fit how payment providers handle verification, and say what the marketplace should have had in place. | `custom` | cold_reader | major |\n| AC-2 | Given a proposal to reuse the fraud engine for money-laundering monitoring, the reader states how the two differ in timing and output. *Probe:* An engineer proposes to detect money laundering with the same component that scores payments for fraud during authorization (the real-time request to the cardholder's bank). Give two ways in which the two jobs differ. | `custom` | cold_reader | minor |\n| AC-3 | The chapter states that neither Stripe nor Adyen publishes how it monitors transactions or screens against sanctions lists, and labels its own account of those systems as reference-architecture inference. | `custom` | rubric | blocker |\n| AC-4 | The chapter's conclusion performs the part's closing: it connects the five controls to one another, returns to the Card-Testing Weekend beside the Frozen Studios, and hands off to billing. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n\n## Thesis\n\n**Question:** What must a payment company know about its customers and their transactions, and how does that become software?\n\n> **Claim:** A payment company must know who each business it serves and pays is, who owns and controls it, whether any of them is under sanctions, and whether its transactions look like money laundering, and it must keep knowing this for as long as it serves that business; in software the verification duties become state on an account, made of requirements with deadlines that switch capabilities such as payouts on and off, and that state can change months after onboarding without the customer doing anything. How the monitoring of transactions becomes software is not public for Stripe or Adyen.\n\n**Disputed by:** The view that compliance is an onboarding form: identity is checked once at sign-up, the provider takes care of it, and an approved seller stays approved.\n\n**So what:** A platform that embeds payments must store and display each seller's verification state and give every deadline an owner, because the provider enforces a missed requirement by stopping the seller's payouts, and the provider's checks do not replace the platform's own legal duties.\n\n**How and why:** The duties are continuous by law: sanctions lists change and must be re-checked on new designations, ownership changes, and the EU regulation that applies from 10 July 2027 caps the interval between reviews at one year for higher-risk customers and five years for others. A one-time record cannot satisfy that, so both providers model verification as account state that gates capabilities and deliver changes by webhook. Stripe's documentation (n.d., accessed November 2026) lists requirements as currently due, eventually due and past due against a deadline, announces rule changes in a 'future_requirements' structure, and warns: 'Don't rely on Stripe's verification to meet any independent legal KYC or verification requirements.' Adyen's documents capabilities with a verification status, standard deadlines of 30 or 60 days, and a periodic data review as an API flow; Stripe's own periodic re-verification is announced (support article, last updated October 2026) and in preview, and Adyen announces rule changes in release notes without an API structure. That difference, Stripe exposing rule changes in its API and Adyen the periodic review, is what the public record shows. How either company monitors transactions or screens against sanctions lists, and at what intervals it re-verifies, is not public, and part of it may not lawfully be disclosed to the customer concerned; the chapter describes those systems only as labeled inference.\n\n**Supporting claims**\n\n- **S1** — The duties (verifying a business and its beneficial owners, screening for sanctions and politically exposed persons, monitoring transactions and reporting suspicion) are continuous by law: each has a trigger that makes it run again after onboarding.\n- **S2** — Stripe and Adyen both turn the verification duties into state on an account, made of requirements with deadlines that switch capabilities on and off and delivered by webhook, and that state can regress without the seller doing anything.\n- **S3** — Monitoring transactions for money laundering differs from fraud scoring in timing and output, and how Stripe or Adyen monitor, screen and schedule reviews is not public, so any account of those systems is inference.\n- **S4** — The provider's verification leaves the platform its own legal duties and the work of tracking each seller's requirements and deadlines, because a missed deadline is enforced by stopping the seller's payouts.\n- **S5** — The rules behind the requirements change on a calendar, and each change has a status (in application, adopted with a future date, not adopted) that must be stated with its date.\n\n## Role in the part\n\nShows the fifth relocation, from the payer's side to the seller's: the duty to know the customer sits with the provider and returns to the platform as state to track; the chapter also carries the part's closing. Supports P5-5 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the Frozen Studios are posed in the first section and replayed under K6 in the eighth; `comparison` in state-model (Stripe, then Adyen), designs and where-they-differ)\n\nThe reader meets an approved seller that stops being paid, then the legal duties that explain why approval is never final, then the data structure both providers use to hold the current result. Monitoring follows verification because it is the same duties' other half and because its section says where the public record stops. The calendar is not a prerequisite of what follows it; it sits after the mechanism because its items can only be read as causes of requirement changes once requirements are known, and before the designs so that the practical sections (designs, comparison, the incident replayed, failures) run uninterrupted to the end. The comparison follows the designs so that its last column can speak to an integrator's choices, and the incident is replayed only when every field it uses has been cited. Putting the provider models before the duties would show fields with no reason for their deadlines; putting the replay before the comparison would use Adyen's terms before they are set beside Stripe's.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In May 2026, 230 fitness studios on Larkfield's platform stopped receiving payouts. None of them had changed its owner, its bank account or its business. Each had been verified and approved years earlier.\n\n**Bridge:** An engineer meets compliance as an onboarding form: collect the documents once, get approved, move on. → The provider's duty to know the business it pays never ends, so its result is held as state on an account, with deadlines, and that state can change with no action by the business.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): A payment company must know who each business it serves is, who owns and controls it, whether any of them is under sanctions and whether its transactions look like money laundering, and must keep knowing it; in software the verification duties become requirements with deadlines that switch capabilities such as payouts on and off, and that state can change months after onboarding. How transaction monitoring becomes software is not public for Stripe or Adyen.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the Frozen Studios. *Kept in:* scene.\n- Set out what the law asks a payment company to know and keep knowing. *Kept in:* duties.\n- Show how both providers turn verification into requirements, deadlines and capabilities. *Kept in:* state-model.\n- Say what is public and what is inference about transaction monitoring. *Kept in:* monitoring.\n- Give the regulatory calendar as of November 2026. *Kept in:* calendar.\n- Compare three ways a platform can hold verification state. *Kept in:* designs.\n- Put Stripe and Adyen side by side. *Kept in:* where-they-differ.\n- Replay the incident under Keel decision K6. *Kept in:* in-practice.\n- List the ways this goes wrong. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | In May 2026, 230 Larkfield studios stopped receiving payouts although none of them had changed anything about its business. | scenario: The Frozen Studios: a verification requirement changed, 230 studios missed the deadline, payouts paused for up to 12 days. |  |\n| p02 | claim | Where the last four chapters each described a decision about one payment and its payer, compliance is a standing state on the account of the business being paid: requirements with deadlines that switch capabilities such as payouts on and off, which can change months after onboarding, while the monitoring of transactions behind it is not public for Stripe or Adyen. |  | `contrast`: Four chapters about the payer and the card: where the number is kept, which credential is sent, whether the payment looks like fraud, whether the cardholder was authenticated. → The other end of the payment: the business being paid, known as a state on an account instead of decided per payment; the thesis. |\n| p03 | context | This chapter is off the path of Mila's class pass and still decides its last step: Studio Noord's €117.47 reaches its bank on 11 March 2027 only because the studio's payout capability is switched on that day. | scenario: Mila's €120.00 pass, Tuesday 9 March 2027; Studio Noord receives €117.47 on Thursday 11 March 2027. | `place`: The claim that compliance is account state. → Where that state touches the recurring payment. |\n| p04 | transition | The chapter goes from the Frozen Studios, through the legal duties and the way both providers turn them into account state, to what is and is not public about monitoring, the regulatory calendar, three designs for a platform, the comparison of Stripe and Adyen, the incident replayed under K6 and the ways this fails. |  | `sequence`: Where the chapter sits on the payment's journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: The Frozen Studios\n\n**Controlling idea** (`example`, id `scene`): In May 2026 a changed requirement and a passed deadline paused the payouts of 230 studios for up to 12 days, although every fact Larkfield needed was readable from the provider and no person owned the deadline.\n\n**Advances the thesis** (S2, S4): Poses the chapter's question with a ledger incident in which an approved seller's state regressed and the platform had not tracked it.\n\n**Transition in:** `example`: The introduction's 230 studios. → The incident in detail, as Femke de Graaf reviews it in 2027.\n\n**Order of paragraphs** (`chronological`): What happened, what it cost, what Larkfield had in place: the reader meets the incident before the vocabulary.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | The Frozen Studios were on Stripe Connect: a verification requirement changed, the change had been announced ahead with a deadline, the deadline passed for 230 studios and their payouts were paused. | scenario: May 2026; 230 studios; payouts paused; Larkfield's reminder went to an unmonitored address. New ledger addition: the studios were on Stripe Connect and Larkfield was the party responsible for collecting requirements. |  |\n| p06 | evidence | The cost was studios' own money standing still: at the average studio's volume, up to about €1.4 million waited in provider balances. | statistic: €1.12 billion ÷ 6,200 studios ÷ 365 ≈ €495 per studio per day; × 230 studios × 12 days ≈ €1.37 million, an upper bound because 12 days was the longest wait. | `additional_support`: The paused payouts. → Their size in euros. |\n| p07 | analysis | Larkfield had treated verification as a form finished at sign-up, so its only response to the change was one batch email to sign-up addresses, and the question Femke takes from the review is what a provider must keep knowing about a business that has already been approved. | scenario: One batch email to each studio's sign-up address, for the 230 an unmonitored mailbox; no named owner for the deadline; Aylin Demir's support team heard first, from studios. | `cause_effect`: What it cost. → Why it happened and the question it raises. |\n\n### What a Payment Company Must Know, and Keep Knowing\n\n**Controlling idea** (`definition`, id `duties`): The law asks a payment company four things about every business it serves (who it is, who owns and controls it, whether any of them is under sanctions, whether its transactions look like money laundering), and each has an event that makes the check run again.\n\n**Advances the thesis** (S1): Supplies the vocabulary (KYC, KYB, beneficial owner, sanctions and PEP screening, transaction monitoring, suspicious-activity report) and the legal reason the checks never finish.\n\n**Transition in:** `elaboration`: Femke's question: what must a provider keep knowing about an approved business? → The duties the law puts on the provider.\n\n**Order of paragraphs** (`prerequisite_order`): Why the provider is obliged at all, then the three duties in the order a customer meets them (identity and ownership, screening, monitoring), then the provider's own list on top of the law, and last the property all of them share, on which the next section builds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | explanation | Anti-money-laundering law makes a firm that moves money an 'obliged entity': it must know its customers (KYC), and for a business customer that means knowing the business (KYB), because it is the point at which illicit money could enter the payment system. | fact: The EU AML Regulation 'shall apply from 10 July 2027'; until then national laws transposing Directive (EU) 2015/849 apply (the second half is the author's reading). Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19) |  |\n| p09 | definition | Verifying a business means identifying the people behind it: a beneficial owner is a natural person who ultimately owns or controls it, in EU and US rules anyone with 25% or more, plus a person who controls it, and the answer changes whenever shares change hands. | quotation: Article 52: 'direct or indirect ownership of 25 % or more of the shares or voting rights or other ownership interest in the corporate entity'. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19); quotation: FinCEN CDD rule: 'identify and verify the identity of any individual who owns 25 percent or more of a legal entity, and an individual who controls the legal entity', https://www.fincen.gov/resources/statutes-and-regulations/cdd-final-rule (n.d., accessed 2026-11; rule of 2016, applicable since May 2018, evidence age 10 years; covered financial institutions are banks, securities brokers, mutual funds and similar firms); FinCEN order FIN-2026-R001 of 2026-02-13 removed the duty to identify owners again at each new account opening, https://www.fincen.gov/system/files/2026-02/FinCEN-Order-CCDExceptiveRelief.pdf.; quotation: Adyen: 'Individuals who directly or indirectly own 25% or more of the total shares, voting rights or other equity in the organization'; if no controller can be identified 'members of senior management must be identified as UBOs through control'. https://docs.adyen.com/platforms/verification-requirements.md (n.d., accessed 2026-11) | `elaboration`: Knowing the business. → Who counts as its owner. |\n| p10 | definition | Sanctions screening checks the business and its owners against government lists of persons nobody may deal with, and screening for politically exposed persons (PEPs) finds customers who need closer checks; because the lists change, the check must be repeated whenever they do. | quotation: Article 20(1)(d): 'verifying whether the customer or the beneficial owners are subject to targeted financial sanctions'; Article 26(4): for credit and financial institutions the verification 'shall also be carried out upon any new designation'. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19); fact: OFAC's 50 Percent Rule: an entity owned 50 percent or more in the aggregate by blocked persons is itself blocked; the rule 'speaks only to ownership and not to control'. https://ofac.treasury.gov/faqs/topic/1521 (n.d., accessed 2026-11); quotation: 'politically exposed person' means 'a natural person who is or has been entrusted with prominent public functions'. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19) | `sequence`: The owners, once identified. → The lists they are checked against. |\n| p11 | definition | Transaction monitoring checks, for as long as the relationship lasts, that what a customer does fits what the firm knows about it, and a suspicion must be reported to the national financial intelligence unit without telling the customer. | quotation: Article 26(1): monitoring 'to ensure that those transactions are consistent with the obliged entity's knowledge of the customer, the customer's business activity and risk profile'. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19); quotation: Article 69: 'All suspicious transactions, including attempted transactions' are reported; Article 73: obliged entities 'shall not disclose to the customer concerned or to other third persons' that a report or analysis is under way. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19) | `sequence`: Who the customer is. → What the customer does. |\n| p12 | explanation | On top of the law each provider keeps its own list of prohibited and restricted businesses, shaped by card-network and bank-partner rules and by its own appetite for risk, so a lawful business can still be refused or asked for more. | fact: Adyen's list (last update 2025-11-13) marks categories 'R' ('We will require additional documentation prior to onboarding') or 'P', based on law, 'Requirements of our payment partners (e.g. card networks)', 'Level of assessed risk (e.g. chargebacks, fraud)' and 'Reputational impact to Adyen'. https://www.adyen.com/legal/list-restricted-prohibited; fact: Stripe's list (last updated 2026-09-22; English edition read in the verification pass; paraphrased) has prohibited and restricted categories and jurisdiction-specific additions; the requirement type `restricted_or_prohibited_industry_diligence` appears in https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1 (n.d., accessed 2026-11). https://stripe.com/legal/restricted-businesses | `additional_support`: Three duties set by law. → What the provider adds to them from its own rules. |\n| p13 | analysis | None of the duties is finished at sign-up, because each has a trigger that runs it again, so onboarding is the first run of a loop. | table: Rows: identity and ownership; sanctions and PEP screening; transaction monitoring; periodic review. Columns: the question, what makes it run again, the output.; quotation: Article 26(2): the period between updates of customer information shall not exceed 'for higher risk customers ... 1 year' and 'for all other customers, 5 years'; Article 26(3): also on 'a change in the relevant circumstances of a customer'. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19); figure: A gate crossed once beside a loop that passes the same checks again on four triggers. | `conclusion_summary`: Three legal duties and the provider's own list. → The property the checks share: each runs again. |\n\n### How Verification Becomes Software: Requirements, Deadlines, Capabilities\n\n**Controlling idea** (`process`, id `state-model`): Both providers turn the verification duties into state on an account, made of requirements with deadlines that switch capabilities on and off and delivered by webhook, and that state can regress without the seller doing anything.\n\n**Advances the thesis** (S2): The central mechanism of the thesis, documented field by field for each provider.\n\n**Transition in:** `cause_effect`: Duties that run again and again. → The data structure a provider needs to hold their current result.\n\n**Order of paragraphs** (`prerequisite_order`): The general shape first, so both vocabularies can be read against it; Stripe's three documented parts (the requirement lists, the deadline, announced changes and reviews); Adyen's two (capability status, triggers and deadlines); then what both imply.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | explanation | A one-time 'verified' flag cannot represent a loop, so the result of verification is held as three things: capabilities (named permissions such as taking card payments or receiving payouts), requirements (missing facts or documents) and deadlines, where an unmet requirement at its deadline switches a capability off. | figure: An account's capability moving between pending, active, restricted with a deadline, and disabled, with the events that move it.; reasoning: Capabilities are a function of the facts held about the business and the rules in force; either input can change after onboarding. |  |\n| p15 | description | Stripe publishes the outstanding work as lists on the account: what is currently due, eventually due, past due and pending verification, with one deadline. | table: Fields of `requirements`: `currently_due` ('requirements that you must resolve by the `current_deadline` for the account to remain `active`'), `eventually_due`, `past_due` ('requirements that have disabled capabilities because they weren't resolved before the `current_deadline`'), `pending_verification`, `current_deadline` ('the earliest deadline across all of the account's requested capabilities and risk requirements'), `disabled_reason`. https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1 (n.d., accessed 2026-11) | `example`: The general shape. → Stripe's version of it. |\n| p16 | cause_effect | At Stripe a missed deadline usually stops payouts first and charges later, and a requirement can become due because time has passed or volume has grown. | quotation: 'Stripe typically disables payouts on the account if we don't receive the information by the `current_deadline`. ... if payouts are already disabled and the account is unresponsive to our inquiries, Stripe might also disable the ability to process charges.' https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1 (n.d., accessed 2026-11); quotation: 'At certain variable thresholds—usually when a specified amount of time has passed or volume of charges have been made—you might need to collect and verify additional information. Stripe temporarily pauses charges or payouts if the information isn't provided or verified'. https://docs.stripe.com/connect/identity-verification.md (n.d., accessed 2026-11) | `cause_effect`: The lists and the deadline. → What happens when the deadline passes, and what can start one. |\n| p17 | explanation | Stripe announces rule changes as data: a second structure, `future_requirements`, lists what will become required and when, and whether Stripe or the platform must act on it depends on which of the two was configured to collect verification information from sellers. | quotation: 'Stripe frequently updates KYC requirements, often due to changes implemented by financial regulators, card networks, and other financial institutions.' 'The `future_requirements.current_deadline` timestamp represents when entries in `future_requirements` will move to `requirements`.' https://docs.stripe.com/connect/handle-verification-updates.md?accounts-namespace=v1 (n.d., accessed 2026-11); fact: When `controller.requirement_collection` is `stripe`, 'Stripe handles upcoming requirement changes for your connected accounts automatically'; when it is `application` the platform handles them; API onboarding means 'You must plan on reviewing and updating onboarding requirements at least every 6 months' (https://docs.stripe.com/connect/onboarding.md, n.d., accessed 2026-11). https://docs.stripe.com/connect/handle-verification-updates.md?accounts-namespace=v1 (n.d., accessed 2026-11) | `additional_support`: Thresholds that make a requirement due. → Rule changes, the third way a requirement appears. |\n| p18 | explanation | Compliance reviews reach a Stripe platform through the same structure, as named requirement types and disabled reasons, which is the only place the screening and monitoring behind them become visible. | fact: Requirement types: `sanctions_review` ('We must verify that the business isn't involved with a sanctioned person or jurisdiction'), `pep_review`, `legal_hold` ('Stripe is required to hold funds for a legal reason'), `other_compliance_inquiry`; `disabled_reason` values include `listed` ('The account might be on a prohibited persons or companies list') and `under_review`. https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1 (n.d., accessed 2026-11) | `additional_support`: Requirements raised by rules and thresholds. → Requirements raised by reviews. |\n| p19 | description | Adyen models the same thing from the capability's side: a legal entity is verified, and each capability of its account holder carries three flags, a verification status and, when something is wrong, a list of problems with the actions that would fix them. | fact: Capabilities have `requested`, `allowed` and `enabled` ('The capability can only be used when it is both allowed and enabled') and a `verificationStatus` of `pending`, `valid`, `invalid` or `rejected`, where rejected 'is final and any errors cannot be resolved by updating data or uploading documents'; problems carry verification errors and remediating actions. https://docs.adyen.com/platforms/verification-overview/capabilities.md (n.d., accessed 2026-11); quotation: 'As required by payment industry regulations, Adyen must verify the users in your platform before you can process payments, pay out their funds, and offer financial products to them.' https://docs.adyen.com/platforms/verification-overview.md (n.d., accessed 2026-11) | `contrast`: Stripe's lists of what is missing. → Adyen's flags for what is allowed. |\n| p20 | cause_effect | At Adyen verification runs again when capabilities are requested, when the seller's data changes and when Adyen requires a periodic data review, and for each it may set a deadline (as a standard, 30 days for payout capabilities and 60 days for receiving payments) during which the capability keeps working; a periodic review arrives as a verification error, and a change to the legal entity's data sends no webhook. | fact: Standard deadlines: a '30-day period' for payout-side capabilities such as `sendToTransferInstrument`, a '60-day period' for `receivePayments` and others; 'a standard deadline could be shortened or removed in specific situations'; 'Users are allowed to continue using the capabilities while the deadline is active.' Deadlines exist only in Legal Entity Management API v3 and v4. https://docs.adyen.com/platforms/verification-overview.md (n.d., accessed 2026-11); fact: Periodic review: 'Adyen occasionally requires your users to review and confirm that their data is up-to-date'; the webhook sets `verificationStatus` to `invalid`, `allowed` 'Remains set to `true`', error 3_10 'Review of data is required', a deadline, resolved by `/legalEntities/{id}/confirmDataReview`. https://docs.adyen.com/platforms/verification-overview/data-review-process.md (n.d., accessed 2026-11); fact: Staggered verification (payment facilitators only): on moving to a higher tier 'their payouts are temporarily disallowed until they complete additional verification checks'; 'There are four tiers'. https://docs.adyen.com/platforms/verification-overview/verification-types.md (n.d., accessed 2026-11); quotation: `balancePlatform.accountHolder.updated` webhooks 'are only triggered for capability-related changes to the account holder. Data changes to the legal entity of the account holder do not trigger webhooks.' https://docs.adyen.com/platforms/verification-overview.md (n.d., accessed 2026-11) | `cause_effect`: Adyen's flags. → The events that change them. |\n| p21 | analysis | On both providers an account that was fully enabled can therefore become restricted through five routes, four of which need no action by the seller: a rule change, a threshold of time or volume, a periodic review and a compliance review; the fifth is a change in the seller's own data. | reasoning: Collects the routes documented in the six preceding paragraphs. | `conclusion_summary`: Two vocabularies. → What both imply for an approved seller. |\n\n### Watching the Money: What Is Public and What Is Inference\n\n**Controlling idea** (`analysis`, id `monitoring`): Monitoring transactions for money laundering is a different job from scoring payments for fraud, and how Stripe or Adyen do it is not public, so everything beyond its visible effects is reference-architecture inference.\n\n**Advances the thesis** (S3): Carries the last sentence of the thesis: says what the public record shows, where it stops, and labels the rest.\n\n**Transition in:** `contrast`: Verification, which both providers document field by field. → Monitoring, which neither documents.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The distinction first, so the reader knows what kind of system is in question; then the evidence that neither company describes theirs; then a labeled inference from the duties.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | comparison | Fraud scoring and money-laundering monitoring both run rules and models over transactions, but fraud scoring decides one payment in milliseconds and its output is allow, block or challenge, while monitoring looks at behavior over days or weeks and its output is a case for a person, possibly a confidential report or a freeze. | table: Rows: the question, when it runs, what it looks at, the output, whether the customer is told. Columns: fraud scoring, money-laundering monitoring.; figure: Two lanes: a fast lane inside the payment request ending in allow, block or challenge; a slow lane fed afterwards ending in a case file, a report and a hold. |  |\n| p23 | evidence | Neither Stripe nor Adyen publishes its monitoring scenarios, its sanctions-screening logic or its re-verification intervals; what is public is the effect on an account and each company's statement, as policy, that it screens and monitors. | fact: Visible effects: Stripe's `legal_hold` and `other_compliance_inquiry` requirement types (https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1 (n.d., accessed 2026-11)); Adyen's sentence 'Verification deadlines may be adjusted based on ongoing account monitoring and subsequent verification checks' (https://docs.adyen.com/platforms/verification-overview.md (n.d., accessed 2026-11)); Stripe's 'We calculate account-level risk using KYC information, transactions, geographic risk factors, and behavior patterns' (https://docs.stripe.com/radar/rules.md, n.d., accessed 2026-11).; fact: Article 73 forbids disclosing to the customer that an analysis or report is under way. Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19) | `contrast`: What such a system does in general. → What the two companies say about theirs. |\n| p24 | analysis | A system that meets these duties plausibly needs a versioned customer record, a risk rating with a review date, a re-screening job triggered by list changes and by data changes, detection over weeks of behavior, a case queue for analysts and a way to place a hold; this is an inference from the duties, not a description of either company. | reasoning: Each component is derived from one legal duty in the 'duties' section: Article 26(2) gives the review date, Article 26(4) the list-change trigger, Article 26(1) the behavior baseline, Article 69 the case and report. | `cause_effect`: A public record that stops at the effects. → What can be inferred from the duties alone, labeled as such. |\n\n### The Regulatory Calendar as of November 2026\n\n**Controlling idea** (`description`, id `calendar`): The rules behind the requirements change on a calendar, and each item on it has one of three statuses (in application, adopted with a future date, not adopted) that must be stated with its date.\n\n**Advances the thesis** (S5): Explains where rule changes such as the one behind the Frozen Studios come from, and gives the reader the dated statuses the intent promises.\n\n**Transition in:** `cause_effect`: Stripe's statement that requirements change because regulators, card networks and other financial institutions change their rules. → The dated list of the regulatory changes, with the status of each.\n\n**Order of paragraphs** (`grouping`): The whole calendar in one table, then the items by status: in application (DORA, kept to one paragraph because it concerns resilience and not knowing the customer; instant payments, whose dates depend on the license and whose screening rule is a legislated case of the chapter's claim), then adopted with a future date and not adopted together, because both are things to track and not yet to build.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | description | Sorted by status on 17 November 2026, the calendar has rules already in application (DORA, instant payments and verification of payee for euro-area banks), rules adopted with a future date (the EU AML Regulation, instant payments for payment and e-money institutions) and rules not adopted (PSD3 and the Payment Services Regulation). | table: Rows: DORA; instant payments; verification of payee; EU AML Regulation; AMLA; PSD3 and PSR; US beneficial-ownership relief. Columns: status on 17 November 2026, the date, what it changes for a payment system. Sources: Regulation (EU) 2022/2554, http://publications.europa.eu/resource/celex/32022R2554 (published 2022-12-27); Regulation (EU) 2024/886, http://publications.europa.eu/resource/celex/32024R0886 (published 2024-03-19); Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19); Regulation (EU) 2024/1620 and https://www.amla.europa.eu/about-amla_en; https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2023/0210(COD) (accessed 2026-11-17); FinCEN FIN-2026-R001 (2026-02-13). |  |\n| p26 | explanation | DORA, the EU's Digital Operational Resilience Act, has applied since 17 January 2025 to banks, payment institutions and e-money institutions; it is on this calendar for its date and status only, because it regulates resilience (incident reporting, a register of technology suppliers) and not knowledge of the customer. | quotation: 'It shall apply from 17 January 2025'; scope includes 'payment institutions' and 'electronic money institutions'; Article 19 'Financial entities shall report major ICT-related incidents'; 'all financial entities should be required to maintain a register of information'. Regulation (EU) 2022/2554, http://publications.europa.eu/resource/celex/32022R2554 (published 2022-12-27) (evidence age: about 4 years; in application); fact: On 18 November 2025 the three European Supervisory Authorities published the list of designated critical ICT third-party providers. https://www.eba.europa.eu/publications-and-media/press-releases/european-supervisory-authorities-designate-critical-ict-third-party-providers-under-digital. No DORA statement by Stripe or Adyen was found (the URLs tried returned 404). | `example`: The calendar. → Its first item in application. |\n| p27 | explanation | The instant-payments rules apply on different dates to different license types, so which license a provider holds decides when it must send and receive euro transfers in ten seconds and check the payee's name first. | fact: Euro-area PSPs: receive by 9 January 2025, send by 9 October 2025; euro-area payment and e-money institutions: 'by 9 April 2027'; verification of payee (Article 5c, 'a service ensuring verification of the payee') for euro-area PSPs by 9 October 2025. Regulation (EU) 2024/886, http://publications.europa.eu/resource/celex/32024R0886 (published 2024-03-19) | `additional_support`: DORA. → The second group in application, with dates that depend on the license. |\n| p28 | evidence | In one case the law itself fixes the design: for instant credit transfers, EU rules replace sanctions screening of each transfer with a screen of the whole customer base at least once a day, moving the control from the payment path to account state. | quotation: Article 5d: PSPs 'shall carry out such verifications immediately after the entry into force of any new targeted financial restrictive measures ... and at least once every calendar day', and during an instant transfer 'shall not verify' the payer or payee against those lists in addition. Funds must reach the payee 'within 10 seconds'. Regulation (EU) 2024/886, http://publications.europa.eu/resource/celex/32024R0886 (published 2024-03-19) | `example`: Instant-payment dates that depend on the license. → What the same regulation does to sanctions screening: it moves the control from the payment path to account state. |\n| p29 | explanation | The EU AML Regulation is adopted and applies from 10 July 2027, while PSD3 and the Payment Services Regulation were not adopted on 17 November 2026, and I would track both and build to neither until the text and date are final. | fact: PSR procedure file: 'Council position published' 5 November 2026; second-reading referral 12 November 2026; 'Indicative plenary sitting date, 2nd reading' 14 December 2026; status 'Awaiting Parliament 2nd reading'. https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2023/0210(COD) (accessed 2026-11-17); quotation: Adyen's reading (published 2026-10-12): 'General application is expected 21 months after entry into force (Verification of Payee provisions will apply 27 months after).' https://www.adyen.com/knowledge-hub/psd3; fact: AMLA: Regulation (EU) 2024/1620 applies from 1 July 2025; first selection of directly supervised entities by 1 July 2027; 'During 2028 — Start of direct supervision' (https://www.amla.europa.eu/about-amla_en, n.d., accessed 2026-11). Whether either company's EU entity will be selected is unknown. | `contrast`: Rules in application, one of which legislates this chapter's claim. → Rules adopted for later and rules not adopted. |\n\n### Three Ways a Platform Can Hold Verification State\n\n**Controlling idea** (`comparison`, id `designs`): A platform can treat verification as a form, pass it through to the provider, or mirror it as state with owners (Larkfield's Keel decision K6), and only the mirror lets it answer a seller whose payouts have stopped.\n\n**Advances the thesis** (S4): Turns the so-what of the thesis into a design choice with stated conditions.\n\n**Transition in:** `problem_solution`: State that changes for reasons the seller and the platform do not control, on a calendar. → The ways a platform can respond.\n\n**Order of paragraphs** (`comparison`): The three designs, their trade-offs side by side, then the author's choice and when it does not hold.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | description | The three designs differ in what the platform stores: nothing after sign-up (the form), a yes-or-no per seller with everything else left to the provider's hosted pages and notices (the pass-through), or each seller's requirements, deadlines and capability status with an owner (the mirror, which is what Larkfield's Keel decision K6, 'verification is state, not a form', prescribes). | reasoning: The form is what Larkfield had in 2026; the pass-through matches the case where the provider collects requirements (Stripe's `requirement_collection` of `stripe`, Adyen's hosted onboarding); the mirror is Keel decision K6. |  |\n| p31 | comparison | The designs trade build effort against the platform's ability to notice a new requirement and to explain a stopped payout. | table: Rows: the form, the pass-through, the mirror. Columns: what the platform stores, who notices a new requirement, what the seller sees when payouts stop, when it is right. | `additional_support`: Three designs. → Their trade-offs. |\n| p32 | recommendation | I would build the mirror whenever the platform is the seller's only interface or carries the seller's losses, and accept the pass-through only where the seller has the provider's own dashboard and the provider collects requirements. | reasoning: The provider enforces a missed requirement on the seller's payouts (the state-model section) and only a platform that stores the state can show the seller why. The platform's detailed practice is in platform-onboarding-and-verification. | `cause_effect`: The trade-offs. → The author's choice and where it does not hold. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): In the public record Stripe documents what is missing and announces rule changes as data, Adyen documents what is allowed until when and the periodic review as an API flow, and neither documents its monitoring.\n\n**Advances the thesis** (S2, S3): The required comparison: documented facts per aspect, 'Not public' where they stop, the author's reading marked as inference.\n\n**Transition in:** `conclusion_summary`: Each provider's documented model and the designs open to a platform. → The two set side by side.\n\n**Order of paragraphs** (`comparison`): The table first, because every cell repeats a fact already cited; then what an integrator does differently on each provider, drawn only from those facts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison | Aspect by aspect, the two providers expose the same duties through different structures: Stripe as lists of requirements with one deadline and a preview of future ones, Adyen as flags and deadlines per capability with a documented periodic review. | table: Rows: unit verified and unit switched; what is outstanding; deadline; announced rule changes; periodic re-verification; sanctions and PEP reviews; transaction monitoring. Columns: Stripe, Adyen, what the difference suggests. Sources as cited in the state-model and monitoring sections. |  |\n| p34 | recommendation | On Stripe an integrator should read `future_requirements` on a schedule and treat the single deadline as per-account data, and on Adyen should build reminders on the published 30- and 60-day periods, handle the data-review error as a routine event, and re-read a legal entity after changing it because that change sends no webhook. | quotation: 'Data changes to the legal entity of the account holder do not trigger webhooks.' https://docs.adyen.com/platforms/verification-overview.md (n.d., accessed 2026-11) | `cause_effect`: The differences in the table. → What to do differently on each provider. |\n\n### In Practice at Larkfield: The Frozen Studios, Replayed under K6\n\n**Controlling idea** (`example`, id `in-practice`): Replayed against Stripe's documented fields, the Frozen Studios had three points at which stored state and a named owner would have kept payouts running, and K6 is the design that reads them on both providers.\n\n**Advances the thesis** (S4): The worked example with ledger numbers: the incident step by step, then the same control on Adyen.\n\n**Transition in:** `example`: What an integrator should do on each provider. → Larkfield doing it, starting from the incident it did not catch.\n\n**Order of paragraphs** (`chronological`): The incident's stages in order, then the record K6 keeps, then who acts on it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | process | The incident had four stages, each visible in the provider's API before the studios felt anything: the change announced, the requirement due with a deadline, the deadline passed and payouts paused, the requirement met and payouts resumed. | table: Rows: announced (`future_requirements`), due (`currently_due` with `current_deadline`), passed (`past_due`, payouts disabled), resolved. Columns: what the provider's record showed (the documented field), what Larkfield did in May 2026, what K6 does.; figure: A timeline of the four stages with two tracks: 2026 (one email, silence, 230 studios paused up to 12 days) and K6 (banner, owner alerted, resolved before the deadline). |  |\n| p36 | description | Under K6 the payment service keeps one verification record per studio in Larkfield's own vocabulary (requirement, due date, capability at risk, status, owner, when the studio was last told), filled from Stripe's requirement lists for a studio such as Ironworks Climbing and from Adyen's capability problems and deadlines for a studio such as Studio Noord. | scenario: K6: 'Each studio's requirements, deadlines and capability status are mirrored and surfaced in the back office, with an owner for every deadline.' Ironworks Climbing is on Stripe Connect; Studio Noord on Adyen since 2024. | `sequence`: What K6 would have done at each stage. → The record that makes it possible. |\n| p37 | explanation | Every open deadline has a named owner, Jonas Weber, with studio support as the channel to the studio, and the record is swept against the provider's API every day so that a missed webhook cannot hide a deadline. | scenario: Jonas Weber owns verification (ledger cast); Aylin Demir's team hears about payout problems first; alert thresholds of 14 and 3 days before a deadline are illustrative assumptions; K2 for the sweep. | `additional_support`: The record. → Who acts on it and how it is kept true. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Verification state fails a platform in four ways: a stopped payout nobody can explain, a mirror that has gone stale, a state the platform cannot resolve or may not be told the reason for, and the belief that the provider's checks are the platform's own.\n\n**Advances the thesis** (S2, S4): Detection and recovery for each failure, including the diagnosis list the intent promises.\n\n**Transition in:** `contrast`: The design working. → The ways it still fails.\n\n**Order of paragraphs** (`order_of_importance`): The most frequent first (a seller asks why payouts stopped), then the failure of the platform's own mechanism, then the cases nobody at the platform can fix, then the misunderstanding that outlasts all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | analysis | Each of the five routes by which an enabled account becomes restricted leaves a different trace, so a stopped payout is diagnosed by knowing where to look on each provider. | table: Rows: a requirement's deadline passed; a time or volume threshold was crossed; a rule change took effect; a periodic review was not confirmed; a sanctions, PEP or legal review opened. Columns: where to look on Stripe, where to look on Adyen. |  |\n| p39 | explanation | The mirror fails silently when a webhook is missed or was never sent, and a stale record that shows no open requirement is worse than no record. | quotation: Adyen: `balancePlatform.accountHolder.updated` webhooks 'are only triggered for capability-related changes to the account holder. Data changes to the legal entity of the account holder do not trigger webhooks.' https://docs.adyen.com/platforms/verification-overview.md (n.d., accessed 2026-11); scenario: The Silent Webhook, 14 September 2026: the Stripe receiver's certificate expired and events failed for 9 hours. | `additional_support`: Diagnosing one seller. → The failure of the mechanism that feeds the diagnosis. |\n| p40 | explanation | Some states the platform cannot resolve and may not be able to explain: a rejection that is final, a review the seller must complete in the provider's own interface, or a hold for a legal reason whose cause the law may forbid the provider to disclose. | fact: Adyen `rejected` 'is final' (https://docs.adyen.com/platforms/verification-overview/capabilities.md (n.d., accessed 2026-11)); Stripe expects platforms to handle risk-related requirements 'by notifying connected accounts of identified issues so you can guide them to resolve through Stripe interfaces' (https://docs.stripe.com/connect/handle-verification-updates.md?accounts-namespace=v1 (n.d., accessed 2026-11)); Stripe `legal_hold` (https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1 (n.d., accessed 2026-11)); Article 73 (Regulation (EU) 2024/1624, http://publications.europa.eu/resource/celex/32024R1624 (published 2024-06-19)). | `contrast`: Failures the platform can fix. → States it cannot. |\n| p41 | refutation | A provider's verification does not discharge whatever legal duties a platform has of its own, and Stripe says so in its documentation. | quotation: 'Even after Stripe verifies a connected account, platforms still must monitor for and prevent fraud. Don't rely on Stripe's verification to meet any independent legal KYC or verification requirements.' https://docs.stripe.com/connect/identity-verification.md (n.d., accessed 2026-11) | `emphasis`: States the provider controls. → What stays with the platform whatever the provider does. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The five controls of Part V are one system, not five features. How card numbers are collected decides which signals the fraud model sees; the fraud rate of a provider's whole portfolio decides which authentication exemptions it may request; tokens and authentication together decide network fees and who carries a fraud dispute; and the identity data collected for verification feeds the risk score of the seller's account. A choice made for one control is a choice about the others, and in each something comes back to the business: a page, a threshold, an exemption policy, a deadline.\n\n**So what:** A team can stop auditing its trust controls one certificate at a time and keep one table instead: per control, what moved, to whom, what stayed, and who at the company owns what stayed. For this chapter's control the row reads: the duty to know the seller moved to the regulated provider; the seller's requirements, deadlines and capability status stayed, and need an owner.\n\n**Callback:** The 230 studios of the opening, set beside the Card-Testing Weekend that opened Part V. One studio's online payments paused for 31 hours in the response to a fraud attack and 230 studios without payouts for up to 12 days by a verification control: in both Larkfield held no card data and no member funds, and in both the remainder it had not assigned to anyone is what failed.\n\n**Takeaway** (`course_of_action`): For each trust control in your own integration, write down what moved, to whom, what stayed with you, and a named owner for what stayed; Larkfield's Keel decisions K4 (card numbers never touch Larkfield) and K6 (verification is state, not a form) are two rows of that table.\n\n**Hand-off** to [Part VI — REVENUE: Billing, Tax and Recognition](part-6.html): `contrast`: Part V's point that a control moves data, a decision or a loss between parties without removing it, and the stored credentials and merchant-initiated payments that run without the cardholder present. → Payments that no customer starts: a clock starts them, for a billing period, which adds a second state machine above the payment and failures of time (late, twice, wrong period).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis (list) | Established: the duties are continuous by law, both providers expose verification as requirements, deadlines and capabilities, a missed deadline stops payouts, and the regulatory dates are as stated on 17 November 2026. |  |  |\n| p43 | synthesis (list) | Depends on context: whether to mirror or pass through, how much to collect up front, and whether a platform has legal duties of its own. |  | `contrast`: What is settled. → What changes with the situation. |\n| p44 | recommendation (list) | The author's synthesis: treat verification as a state machine with an owner per deadline, and treat every statement about a provider's monitoring as inference until the provider documents it. |  | `contrast`: What is established and what depends. → The author's own position. |\n| p45 | synthesis | Across Part V the five controls are one system in which each moves something to another party and returns a remainder, and the Card-Testing Weekend and the Frozen Studios are the same failure: a remainder with no owner. | scenario: The Card-Testing Weekend (8–9 August 2026: 61,000 card numbers, €4,100, one studio paused 31 hours) beside the Frozen Studios (May 2026: 230 studios, up to 12 days); K4 and K6. | `conclusion_summary`: This chapter's take-aways. → The part's closing: five controls as one system, the two incidents, the one table. |\n| p46 | recommendation (list) | Eight questions let the reader test how verification state is handled in a platform of their own or in a provider evaluation. |  | `cause_effect`: The closing argument. → Questions that apply it. |\n| p47 | transition | Part V ended with controls that assign data, decisions and losses to named parties for payments somebody starts; Part VI turns to payments that a clock starts. |  | `contrast`: Controls on a payment a customer or a seller is party to. → Payments started by a billing period, and their failures of time. |\n\n## Non-goals\n\n- What the platform does at onboarding: requesting minimal capabilities, hosted versus embedded versus API onboarding, onboarding conversion, the seller's view. See [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html).\n- Licenses, safeguarding and who may hold funds; UK safeguarding reform; US money-transmitter law. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Fraud models, merchant risk scores, reserves and deposits. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html), [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- Strong customer authentication and what PSD3 and the Payment Services Regulation would change for it. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- Verification of payee in the payout path and payout returns. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Operational resilience engineering under DORA. See [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html).\n- Legal advice on whether a given platform is itself an obliged entity.\n- FATF Recommendation numbers: the FATF text could not be fetched, so the chapter cites EU and US law only.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Transaction monitoring, sanctions-screening implementation and suspicious-activity reporting at both companies are not public and partly may not be published; the chapter says so and labels its account as inference.\n- Re-verification intervals: Stripe's support article 'KYC Refresh: Upcoming periodic confirmation requirements' (last updated October 2026; read in full in the verification pass) announces periodic attestation requirements, first in Europe, with the API in private preview in 2026 and a public preview planned for Q1 2027; it says the frequency depends on risk profile, local rules and the last update. Adyen says 'occasionally'. Neither publishes a schedule. Re-check Stripe's status before print.\n- PSD3 and the Payment Services Regulation awaited Parliament's second reading on 17 November 2026 (indicative plenary 14 December 2026); re-check before print.\n- Neither company's DORA position was found; whether either will be supervised directly by AMLA from 2028 is unknown.\n- Adyen's staggered-verification tier amounts are not in the page text.\n- Stripe's restricted-businesses page is paraphrased, not quoted (the English edition was read in the verification pass).\n- The Massachusetts settlement involving Stripe could not be read on the official page (HTTP 403) and is not used.\n\n## Decision log\n\n- **2026-11-17** — The Frozen Studios are placed on Stripe Connect, with Larkfield as the party that collects requirements, and the incident is replayed against Stripe's documented fields; the Adyen side of K6 is shown with Studio Noord as a hypothetical periodic review. Rejected: Leaving the provider unnamed, which would make the worked example unable to cite a field.; Placing it on Adyen: the ledger's 'a verification requirement changed' matches Stripe's documented future-requirements structure, and no equivalent Adyen construct was found.\n- **2026-11-17** — The calendar section comes before the designs, although the style guide lists designs straight after the mechanism, because rule changes are one cause of the state changes the designs must handle. Rejected: Calendar as the last body section, where it would read as an appendix.\n- **2026-11-17** — The platform designs are kept to three paragraphs and the detail is left to platform-onboarding-and-verification, under consistency ruling 2. Rejected: A full treatment of hosted, embedded and API onboarding here.\n- **2026-11-17** — US rules appear only where they define a term (the 25 percent threshold, OFAC's 50 Percent Rule) or changed in 2026 (FinCEN relief); the CFPB items and the model money-transmission law are left out as unverified or owned elsewhere. Rejected: A US calendar section built on items the research could not confirm.\n\n## Sources\n\n- **Internal**\n  - _research/brief-fraud-risk-and-compliance.md — Part 2 (legal obligations, how each company exposes compliance, transaction monitoring), Part 3 (the regulation calendar), section 1.8 (account-level risk), the open questions and research limitations.\n  - _research/brief-platforms-and-embedded-finance.md — Part 2 (capabilities and requirements as state; onboarding options) and its comparison table.\n  - _research/scenario-ledger.md — The Frozen Studios, the Card-Testing Weekend, the Silent Webhook, K2, K4 and K6, the cast, Mila's class pass.\n  - _research/consistency-issues.md — Ruling 2: this chapter owns verification as continuing account state; chapter 34 owns what the platform does.\n  - PLAN.md and journal-spec.json — The chapter contract; intent, thesis, role and transitions, copied unchanged; the part closing this chapter carries.\n- **External**\n  - Pages fetched by the writer on 17 November 2026: Stripe Connect documentation (identity verification, handling API verification, handle verification updates, onboarding, risk management, Radar rules); Adyen platforms documentation (verification overview, capabilities, data review process, verification requirements, verification types); Adyen's restricted list and PSD3 explainer; Regulations (EU) 2024/1624, 2024/886 and 2022/2554; the European Parliament procedure file 2023/0210(COD); the ESAs' press release of 18 November 2025. — Verification of every quotation used as evidence.\n\n## Changelog\n\n- **2026-11-17** — Absence audit: 8 statements of absence re-tested with a wide search (documentation sitemaps, support and help centers, company sites, policies and legal pages, engineering posts, web search). Narrowed: transaction monitoring and sanctions screening 'not public' (both companies state as policy that they screen and monitor: Stripe's financial-crimes policy statement of November 2023, Adyen's privacy statement and glossary; the method remains unpublished); Stripe deadline 'no standard length published' (support article: typically 14 days for payouts and 28 for payments on Custom accounts); Adyen sanctions and PEP reviews (party screening is defined in the glossary, not named as a verification status). Four sources added; one controlling idea aligned.\n- **2026-11-17** — Verification pass: 104 claims checked (88 confirmed, 7 corrected, 9 hedged, 0 unsupported and removed or relabeled, 0 unreachable); Stripe's periodic re-verification was 'Not public' and is now cited from Stripe's KYC Refresh support article (announced, API in private preview in 2026), in the text, the comparison table and the failure table. Inline external links reduced to plain attributions (ruling 22); no unit added, dropped, merged or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on: the instant-payments screening paragraph moved from the monitoring section into the calendar; the declared reason for the calendar's position rewritten; K6 bound to the mirror design; Adyen's deadlines, review error and silent legal-entity change established in the state-model section before the comparison uses them; the sweep rule stated once as mechanism (in-practice) and once as failure; the provider's own list moved before the loop paragraph; a flow declared for the comparison section. Notes not acted on: cutting DORA (the journal spec's intent requires its date; it is kept to one paragraph that says it is outside the claim); moving the calendar to directly after the duties.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Reconciliation after verification (17 November 2026): thesis how_why applies ruling 36: Stripe's periodic re-verification is announced and in preview, and Adyen announces rule changes in release notes.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
