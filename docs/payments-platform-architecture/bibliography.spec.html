<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 for a generated lookup page. The page is produced by _research/bib-tools/run.sh from every page's Sources and Evidence section; this spec fixes its units and their order, and render.py writes the prose of each unit. One spec paragraph per unit of the page; each group's entry list is one paragraph with form list; the two tables are recorded as the evidence of the paragraph that introduces them. Intent, acceptance criteria, thesis and role are copied unchanged from journal-spec.json; the three supporting claims are this spec's own. No count is fixed here: every count on the page is computed by the generator on each run.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Every public source the pages cite, listed once with a stable R-number, its publication date or 'n.d., accessed 2026-11', its evidence type, the claim it supports and the pages citing it, by topic and by chapter.\n- **Know:** The three groups of source the chapters use (company, product and investor sources; standards, regulation and official documentation; research and practitioner sources) and the marks '(secondary source)' and '(evidence age: N years)'.\n- **Know:** That the register is generated from the chapters' Sources and Evidence sections, so an R-number identifies a source and does not rank it.\n- **Believe:** A claim is as trustworthy as the kind and age of its source: a regulation records a requirement, audited accounts record reported numbers, an annual letter what a private company chose to say, documentation an interface as read on a date, an engineering post what a company said it had built that year.\n- **Be able to:** Trace a figure or a statement in a chapter to its dated source and weigh it by evidence type and date.\n- **Be able to:** Tell from an entry whether a statement about a provider's internals rests on current documentation or on an old engineering post.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader traces a claim to its entry and reads from the entry what kind of evidence it is, how old it is and which pages rely on it. *Probe:* Using only this page: the idempotency chapter says a Stripe API v1 idempotency key and its stored response are kept for at least 24 hours. Find the entry behind that statement. What kind of source is it, what is its date, and what does the page tell you about how many other pages rely on it? | `custom` | cold_reader | major |\n| AC-2 | A reader weighs a source by its type and date. *Probe:* Using only this page: one entry is a 2017 engineering post marked '(evidence age: 9 years)', one is a documentation page marked 'n.d.', and one is marked '(secondary source)'. How far should a reader trust each for a claim about a provider today, and does any source describe Larkfield? | `custom` | cold_reader | major |\n| AC-3 | A reader can say what is deliberately absent from the register. *Probe:* Using only this page: is the Productscape planning model listed as a source for any claim, and where would you find the source for a statement the book marks 'Not public'? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which sources does the book cite, and how much does each kind of source support?\n\n> **Claim:** The book cites each public source once, under a stable R-number, with its date, its evidence type and the pages that rely on it, and the type and date decide how much the source supports: a regulation or a network rule supports a requirement, audited accounts support a reported figure, undated documentation supports an interface as read in November 2026, and an engineering post supports only what the company said it had built in the year of the post.\n\n**Disputed by:** The view that a company's engineering blog is the best evidence of how its systems work regardless of when the post was written, so that a link in the chapter is enough and a register of types and dates adds nothing.\n\n**So what:** A reader who wants to rely on a statement about Stripe or Adyen looks up its entry first and, where the entry is an engineering post older than about three years or an undated page, checks the current documentation before building on it.\n\n**How and why:** The register is generated from the chapters' Sources and Evidence sections, so it shows what the chapters do not show one at a time: how many pages lean on one source, and how old the evidence under a subject is. That matters in this book because the public material is uneven: Stripe's best-known posts on idempotency, rate limiting and versioning are from 2017, Adyen's account of its accounting design is from 2021, most documentation pages are undated, and Stripe's company figures come from annual letters while Adyen's come from audited reports.\n\n**Supporting claims**\n\n- **S1** — Each public source the pages cite is listed once under a stable R-number that identifies and does not rank it, with its date or 'n.d.', its evidence type, the claim it supports and the pages that cite it.\n- **S2** — The evidence type and the date of a source decide how much it supports, and the register shows both on every entry: the type in words, undated pages as 'n.d.', evidence from November 2023 or earlier with an age mark and second-hand evidence with a secondary mark.\n- **S3** — Because it is generated from every page's Sources and Evidence section, the register shows what one chapter's list cannot: how many pages lean on one source, and how the kind and age of the evidence differ between Stripe, Adyen and the other publishers; an entry is found by publisher or by citing page.\n\n## Role in the part\n\nCloses the book's apparatus: every cited source once, typed and dated, so any claim can be traced to a document by topic or by chapter and weighed by its age. Supports PR-4 of part `reference`.\n\n## Flow\n\n**Pattern:** `prerequisite_order`\n\nHow to read an entry comes first, because every entry is weighed by its type, date and marks, and the counts by publisher tell the reader what kind of evidence to expect before they meet nine hundred entries. The topic index then maps the publisher groups before the entries themselves. The by-chapter list reads the same sources from the citing side and comes last because a reader who starts from a chapter needs the R-numbers the groups define; the closing ends the reference pages. Grouping by publisher instead of by the book's parts follows from the thesis: who published a source and in what kind of document decides how much it supports, and one documentation page is cited from several parts.\n\n## Introduction\n\n**Hook** (`direct_statement`): Use this register to trace a claim in any chapter to its public source and to see when that evidence was published or read.\n\n**Bridge:** The reader has met a figure, a rule or a statement about Stripe or Adyen in a chapter, or a definition in the glossary that rests on a chapter, and wants to know what document stands behind it and how far to trust it. → Every cited source is gathered here once, typed and dated, by publisher and by chapter.\n\n**Thesis statement** (KEY POINTS callout): Every public source is listed once under a stable R-number because a page cited it, and its type and date decide how much it supports: a regulation or a network rule a requirement, audited accounts a reported figure, an annual letter what a private company chose to say, undated documentation an interface as read in November 2026, an engineering post only what the company said it had built in that year.\n\n**Roadmap** (IN THIS SECTION callout and paragraph p03 (the by-chapter lookup, in the conclusion region, is announced there too)):\n\n- How to read an entry: R-numbers, dates and 'n.d.', the age and secondary marks, the evidence types and what each supports, the counts by publisher, and what is left out. *Kept in:* how-to-read.\n- A topic index, then the entries grouped by publisher. *Kept in:* topic-index, t1, t2, t3, t4, t5, t6, t7, t8, t9, t10, t11.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Use the register to trace a claim to its public source and its date; the entries come from the chapters' Sources and Evidence sections with their three groups and two marks, research ran up to 17 November 2026, and 'n.d.' means undated. |  |  |\n| p02 | explanation | The register shows what a chapter's own list cannot, how many pages lean on one source and how old the evidence under a subject is, which matters because the public record on Stripe and Adyen is uneven. |  | `elaboration`: What the register holds and how it is dated. → Why a register adds something to the chapters' own lists. |\n| p03 | transition | The page first explains how to read an entry, then gives a topic index, the entries grouped by publisher and the sources by chapter. |  | `sequence`: Why the register exists. → The order of the page. |\n\n## Sections\n\n### How to Read This Register\n\n**Controlling idea** (`explanation`, id `how-to-read`): An entry is identified, not ranked, by a stable R-number and carries what a reader needs to weigh it: its date or 'n.d.', an age mark, a secondary mark and an evidence type that says what the source can support.\n\n**Advances the thesis** (S1, S2, S3): Says how to read an entry, what each mark and evidence type means, how the evidence is distributed across publishers and what the register leaves out.\n\n**Transition in:** `sequence`: The register's purpose, its dating and the order of the page. → How to read one entry.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | explanation | R-numbers identify the sources harvested from the pages' Sources and Evidence sections and do not rank them; a document cited under two addresses is one entry. |  |  |\n| p05 | explanation | Identifiers stay stable: a new source takes the next unused number and a removed source retires its number. |  | `elaboration`: R-numbers as identifiers. → Why a number stays valid after regeneration. |\n| p06 | explanation | Each entry gives the R-number, linked title, publisher or author, date, supported claim, evidence type and citing pages; where chapters cited one document differently the page was read and the chapters corrected. |  | `elaboration`: Stable identifiers. → The fields of an entry. |\n| p07 | explanation | The date is the publication, version or last-updated date the source shows; 'n.d.' means the page shows none, which is the case for most documentation, so the access month dates the reading. |  | `elaboration`: The fields of an entry. → How to read the date field and 'n.d.'. |\n| p08 | explanation | An entry dated November 2023 or earlier carries '(evidence age: N years)', counted to the cut-off of 17 November 2026: for a legal text a reminder to check it is in force, for an engineering post a warning that the system may have been replaced. |  | `elaboration`: The date field. → The age mark and what it means by kind of source. |\n| p09 | explanation | An entry that is not first-party carries '(secondary source)'; chapters use such sources only to fill a gap and say so in the citing sentence. |  | `elaboration`: The age mark. → The secondary mark. |\n| p10 | explanation | The evidence type says how much a source can support, from a regulation or network rule (a requirement) through annual reports and filings (a reported figure), annual letters (what a private company chose to say), documentation (an interface as read), engineering posts (what was built in that year) and press releases to company guides and secondary sources. | table: One row per evidence type with the number of entries of that type (computed by the generator on each run), what the type contains and what it supports. | `elaboration`: The two marks. → The evidence types and what each supports. |\n| p11 | evidence | The evidence is uneven between publishers, and a table counts the entries by publisher with how many are undated, how many carry the age mark, how many are engineering posts and how many are letters, reports or filings. | table: One row per publisher group (Stripe, Adyen, card networks and payment schemes, regulators and standards bodies, other companies, independent authors and press, the author) with counts computed by the generator on each run. | `elaboration`: The evidence types. → How the types and ages are distributed across Stripe, Adyen and the other publishers. |\n| p12 | explanation | Two things follow from the counts: most statements about either provider's interface rest on undated documentation read in one month, and the engineering evidence reaches back years; Stripe's figures come from letters and Adyen's from audited statements, so they are not compared as like with like. |  | `cause_effect`: The counts by publisher. → What the counts mean for a reader. |\n| p13 | explanation | The register leaves out private research notes, the book plan and companion-book links; the planning model appears once as planning material; a statement marked 'Not public' has no entry by definition; no source describes Larkfield. |  | `contrast`: What the register contains and how it is distributed. → What it deliberately leaves out. |\n\n### Topic Index\n\n**Controlling idea** (`description`, id `topic-index`): Eleven groups by publisher, each summarized with its R-range, its coun their range; generated on each run. |  |\n\n## Conclusion: Sources by Chapter\n\n**Synthesis:** The four pages answer the four lookups a chapter leaves the reader with (where, which record, what word, what source), and each answer points back to the chapter that owns it. Together they also draw the book's outer line: a planning model that is not evidence, cards filled with fiction, definitions that defer to chapters, and a register in which a claim about a provider ends at a dated document or does not appear.\n\n**So what:** A claim, a term or a card in any chapter can be checked against its owning chapter and its dated source without rereading the book, and a disagreement between them is a defect to fix.\n\n**Callback:** This page's KEY POINTS: the type and the date decide how much a source supports; look the entry up before relying on a statement about Stripe or Adyen. The closing turns them into the course of action for using the whole book and, as the Reference part's closing, names the four lookups the four reference pages answer.\n\n**Takeaway** (`course_of_action`): Before relying on a statement about Stripe or Adyen from this book, find its source in the register, check the source's type and date, and keep documented facts, labeled inferences and Larkfield apart.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | description (list) | Each citing page, in reading order, with the number of sources it cites and their R-numbers in identifier order; pages that cite nothing of their own are omitted. |  |  |\n| p38 | explanation | No source describes Larkfield, which is fictional, and the recommendations, labeled inferences and labeled assumptions are the author's judgement. |  | `contrast`: The public sources by page. → What no source stands behind. |\n| p39 | synthesis | The four reference pages answer four lookups that point back to the owning chapter, so before building on a statement about Stripe or Ady <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

                sectionEl = document.createElement('p');

        const tagsHost = document.getElementById('tags');

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
