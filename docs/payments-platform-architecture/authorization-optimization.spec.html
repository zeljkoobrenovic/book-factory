d the issuer, the reader classifies it correctly and says how it affects the metrics. *Probe:* A payment comes back as 'blocked: low probability of authorization, not sent to network'. Is this an issuer decline? What does it do to your authorization rate and to your count of lost sales, according to this chapter? | `custom` | cold_reader | major |\n| AC-3 | Every uplift figure from Stripe or Adyen is quoted with its wording, source and date and is labeled a vendor claim; the chapter states that the two companies' figures use different metrics and cannot be compared. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** Why are payments from genuine cardholders with funds available declined, and what do providers do about it?\n\n> **Claim:** Payments from genuine cardholders with funds available are declined because each issuer decides alone, by its own reading of the authorization message, and usually returns no reason the merchant can act on; providers respond by acting inside the authorization call, where they reformat the message, swap the card number for a network token, retry, switch network or block the payment before it is sent. The approval rate is therefore partly the provider's product, and the uplift Stripe and Adyen each publish for it (Stripe: an acceptance rate 3.8% higher on average, stated in 2025; Adyen: payment conversion up to 6% higher in a pilot reported in January 2025) rests on different metrics, cohorts and baselines, so the two figures can be neither compared nor checked from public data.\n\n**Disputed by:** The view that a decline is the issuer's verdict on the cardholder, so the provider is a neutral pipe, the approval rate would be the same anywhere, and optimization products are packaging around a number nobody controls; or the opposite view, that a vendor's published uplift is what a merchant should expect to gain.\n\n**So what:** The merchant's system has to tolerate one call that produced several network attempts, a 'blocked' result that never reached a bank, and a credential or network other than the one it asked for. And the merchant, not the vendor, has to measure: fix the metric and denominator, hold out randomized traffic, wait for retries to finish, and watch fraud, fees and blocked payments in the same test.\n\n**How and why:** Stripe's guide describes issuers combining the fields of the authorization message each in their own way and classing most refusals as generic. Against that, both providers document actions the merchant did not request: Stripe's Adaptive Acceptance reformats and retries within the original request and, for accounts on interchange-plus pricing, blocks payments unlikely to succeed; Adyen's Uplift (January 2025) routes, adjusts messaging, retries and can block excessive retries. Both describe machine-learned models (Stripe a deep network replacing gradient-boosted trees, February 2025; Adyen several models coordinated by reinforcement learning with a 20-millisecond median budget each, January 2025) beside settings the merchant controls. On measurement, Stripe documents a modeled per-payment estimate and previewed a 30-day randomized test in April 2026; Adyen describes a control group that still receives a 'market baseline'. Neither publishes features, labels, per-issuer results, the cost of wrongly blocked payments or an audited lift, Visa's reattempt limit is confirmed from its rules of 24 October 2026 (20 in 30 days) while Mastercard's is known only from secondary sources, so the chapter argues from the documented behavior and says where the numbers are vendor claims.\n\n**Supporting claims**\n\n- **C1** — A payment can fail at the issuer, at the provider before the network or as an invalid request, and an issuer decline is one bank's private reading of the authorization message, returned mostly without a reason the merchant can act on.\n- **C2** — An approval rate has no meaning until its numerator, denominator, cohort and counting rule (per attempt or per purchase) are stated, because the same payments yield rates more than ten points apart.\n- **C3** — The levers that move approvals change what the issuer sees (credential, acquirer, message, authentication) or when it is asked, and retries are capped by network rules that all of a merchant's attempts share.\n- **C4** — Stripe and Adyen now pull those levers themselves inside the authorization call, so one API call can stand for several network attempts or none, decided by machine-learned models beside a few merchant settings.\n- **C5** — The uplift figures the two companies publish are vendor estimates on different metrics, cohorts and baselines; only a randomized holdout on the merchant's own traffic, with guardrails for fraud, fees and blocked payments, measures the effect.\n- **C6** — Because the provider acts inside the call, the merchant's retry schedule, payment record and stored-card data must be designed around it, or the two will double-count, misread outcomes and overspend the retry allowance.\n\n## Role in the part\n\nShows the provider as an actor inside the authorization, which makes the approval rate a property of the provider's stack and gives the routing chapter the metric it compares providers on. Supports P2-4 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in who-says-no, counting, levers, inside-the-call: each supplies the terms the next one uses (attempt and blocked payment, then the rates, then the levers, then the provider pulling them); `comparison` in designs and where-they-differ)\n\nThe reader meets two rates that disagree by 13.5 points before any term is defined, so the vocabulary arrives as the answer to a problem already felt. Who can say no comes first because the rates are defined by which failures they count; counting comes before the levers because a lever is judged by the rate it moves; the levers come before the providers' products because those products are the levers pulled automatically. Only when the reader knows what the provider does inside the call can a published uplift be read critically, and only after that do the design choice and the two-company comparison have their criteria. Larkfield's recount and test apply everything, and the failures close the body because each is a way the earlier advice is not followed. Opening with the products would present features with no metric to judge them by; putting measurement before the in-call actions would ask the reader to test something not yet described.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A member's card is valid, the account has money in it and the member wants to pay. The bank still answers no, with a two-digit code, 05, that means only 'do not honor'. Nothing in the merchant's systems is wrong, and the same card was approved last month.\n\n**Bridge:** An engineer reads a declined payment as an error response: the request was fine, the remote system said no, and the reason should be in the body. → Here the remote system is one of thousands of banks, each deciding alone and mostly without giving a reason, and between the merchant and that bank sits a provider that changes the request, repeats it or withholds it. That turns 'why was it declined?' into 'who decided, on what message, and who is counting?'\n\n**Thesis statement** (KEY POINTS bullets 1 and 3, and paragraph p02): A decline is one issuer's reading of one message, usually returned without a reason, and the provider now acts inside the authorization call to change that reading. The approval rate is therefore partly the provider's product, and the uplift figures Stripe and Adyen publish for it cannot be compared with each other or checked from public data.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from two approval rates at Larkfield that cannot both describe the same month, and come back to them with one basis and one test. *Kept in:* scene, in-practice.\n- Say who can stop a payment and wh
