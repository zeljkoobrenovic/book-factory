<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** PayPal's FY2025 Form 10-K: 'a global, two-sided network' with 439 million active accounts; total payment volume of $1.79 trillion, defined net of reversals and excluding gateway-exclusive transactions; lower Braintree volume and revenue in the first half of 2025 after 'a stronger focus on profitable growth'; Braintree products 'generally have higher expense rates than other products and services'.\n- **Know:** Checkout.com's 2026 releases (a private company's own figures): over $300 billion processed in 2025; $750 million of annualized net revenue; ten acquiring licenses in 56 countries; direct acquiring in the United States under a Georgia limited-purpose bank charter, announced on 9 September 2026 (the Georgia regulator dates the bank's start of business to 16 July 2026).\n- **Know:** Block's FY2025 Form 10-K: more than 4.5 million sellers and $250 billion of Square gross payment volume, defined net of refunds; custom-designed hardware and seller software sold with payments; Square Financial Services, a Utah-chartered industrial loan company, operational since 1 March 2021.\n- **Know:** Where the evidence stops: these are filings and press releases about business models; no first-party architecture evidence for PayPal, Braintree or Checkout.com was read, so the chapter makes no claim about how they are built.\n- **Believe:** What a payment provider owns follows from the customer relationship it started with, and Stripe and Adyen are two of several such starting points, not the two ends of one line.\n- **Believe:** Volume figures from different companies cannot be ranked without their definitions.\n- **Be able to:** Say which contrast case clarifies a given choice (a consumer wallet as an asset, an enterprise acquirer started later, seller software and hardware first) and what it implies about Stripe's and Adyen's positions.\n- **Be able to:** Read a 10-K sentence about a processing business and say what it shows about the economics of unbranded card processing.\n\n**Audience:** A software engineer or architect who has read the two company cases and the comparison of this part and now thinks of payment providers as lying somewhere between Stripe and Adyen.\n\n**Already knows:**\n\n- Issuer, acquirer, card network, payment facilitator, sponsor bank, e-money institution and banking license, from Parts I to III and the two cases (acquiring-and-network-connectivity, licences-and-safeguarding).\n- Stripe's and Adyen's dated records and the sorting of their differences into kind, degree and undecidable (case-stripe, case-adyen, stripe-and-adyen-bets-compared).\n- Larkfield, its two providers, Mila's class pass and decision K8 (meet-larkfield).\n\n**Does not yet know:**\n\n- Branded and unbranded checkout, a two-sided network, total payment volume (TPV), gross payment volume (GPV), gateway-exclusive transactions.\n- Form 10-K, transaction expense rate, industrial loan company, merchant acquirer limited purpose bank.\n- What PayPal, Checkout.com and Block have each put in a filing or release, and that none of it is architecture evidence.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a claim that infers a processor's strength from its parent's volume, the reader corrects it from the filing's definitions and its statements about Braintree. *Probe:* A marketplace founder says: 'PayPal processed $1.79 trillion in 2025, almost as much as Stripe, so Braintree is the safest home for our card processing.' Using only this chapter: what does PayPal's own filing say that bears on this? | `custom` | cold_reader | major |\n| AC-2 | Given three unlike businesses, the reader matches each to the contrast case that clarifies its choice and says what the case implies about Stripe or Adyen. *Probe:* Using only this chapter: which of the three contrast cases should each of these read first, and what does it tell them about Stripe or Adyen? (a) A food-truck franchise choosing a till and card reader for 300 owner-operators. (b) An airline that wants a second acquirer beside Adyen. (c) A product team that asks why Stripe keeps promoting its Link wallet. | `custom` | cold_reader | major |\n| AC-3 | A reader of the introduction alone can predict the three cases, the one choice each is used for and the limits of the evidence. *Probe:* After reading only the introduction: which companies does this chapter cover, what single point is each used for, and what kind of evidence does it not have? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** What do PayPal and Braintree, Checkout.com and Block each show about the Stripe and Adyen bets that the two companies alone cannot?\n\n> **Claim:** Each contrast adds one case the pair lacks: PayPal's filing describes a two-sided network of 439 million accounts beside an unbranded processing business that it says carries higher expense rates; Checkout.com sells to enterprises with its own acquiring licenses, as Adyen does, and in 2026 began acquiring in the United States under the same narrow charter that Stripe obtained; Block began with the seller's till and holds a third kind of bank, a Utah industrial loan company. Read together they support an inference that is the author's and not the companies': the regulated permissions and assets a provider holds are the ones its first customer relationship required, and a provider whose first license had nothing to do with its first customers would count against it.\n\n**Disputed by:** The view that payment providers sit on one spectrum from developer-first to enterprise-first, with Stripe and Adyen at its ends and every other company somewhere between them, so that the contrast cases add scale comparisons and nothing else.\n\n**So what:** A reader comparing providers adds a row the Stripe and Adyen comparison lacks: who owns the relationship with the payer and with the seller, because that relationship determines which data the provider sees and, on the author's reading, which products it adds. It also explains moves that the two-company view makes puzzling, such as Stripe's Link wallet or a processor seeking a bank charter.\n\n**How and why:** The evidence is each company's own filing or release, read for one point. PayPal's FY2025 10-K separates branded checkout from 'unbranded payments processing' and says Braintree products 'generally have higher expense rates'; it reports lower Braintree volume after a turn to 'profitable growth'. Checkout.com's September 2026 releases report ten acquiring licenses and direct US acquiring under a Georgia limited-purpose bank charter. Block's 10-K describes 'an integrated operating system for local commerce' with custom hardware, and a Utah industrial bank operational since 2021. That the first customer relationship explains what each holds is the author's reading, stated as inference; the companies do not say it, and three cases chosen for contrast cannot prove it. It concerns where a provider's permissions came from, not which customers it can serve now: Stripe and Adyen each sell to the other's first customers. The chapter makes no claim about these companies' internal architecture, because no first-party engineering evidence for them was read, and it does not rank their volumes, which are defined differently (PayPal's TPV, Checkout.com's processed volume, Square's GPV).\n\n**Supporting claims**\n\n- **S1** — PayPal's FY2025 filing names a two-sided network of 439 million active accounts as what it operates, defines its $1.79 trillion of volume so that it cannot be read as Braintree's or set beside Stripe's, and says that Braintree products carry higher expense rates and that it gave up Braintree volume in the first half of 2025 for profit; the consumer relationship is therefore the asset, and a card processor does not have it.\n- **S2** — Checkout.com, by its own 2026 releases, sells card acquiring to enterprises under ten acquiring licenses of its own, as Adyen does, and in September 2026 began acquiring in the United States under the same narrow Georgia charter that Stripe lists among its US acquirers; own acquiring is therefore something enterprise-facing providers assemble license by license, and neither anchor's route to it is unique.\n- **S3** — Block's FY2025 filing describes a company that began with the seller's till (custom hardware and software, with Square as merchant of record), that reaches the card networks through banks and acquiring processors for a majority of its transactions, and that owns a Utah industrial loan company used for lending and deposits; a provider can therefore own a bank without owning its acquiring.\n- **S4** — Read together, the three cases support an inference that is the author's: the regulated permissions and assets a provider holds are the ones its first customer relationship required. Three cases chosen for contrast cannot prove it, it concerns where permissions came from and not whom a provider can serve now, and it adds one row to any provider comparison: who owns the relationship with the payer and with the seller.\n- **S5** — The evidence is two audited filings and one private company's releases about business models: each volume figure has its own definition and the figures cannot be ranked, and no first-party source on how PayPal, Braintree, Checkout.com or Block build their systems was read, so the chapter claims nothing about their architecture.\n\n## Role in the part\n\nTests the comparison's reading on three companies that started somewhere else, so that the two anchors are seen as two answers among several and the explanation (first customer, then what is owned) is not fitted to two data points. Supports P10-4, P10-3 of part `part-10`.\n\n## Flow\n\n**Pattern:** `assertion_evidence_reasoning` (also `comparison` in paypal, checkout, block: the same three steps for each (what it reports, the telling fact, the reading for Stripe and Adyen))\n\nThe rules of evidence come first because every later number is safe only once the reader knows its definition and that none of the sources is about architecture. The introduction states the inference once, as the thesis and labeled as the author's, so the reader knows what the cases are being read for; it is argued only in the cross-case section. PayPal comes first because it resolves the opening puzzle and supplies the terms branded and unbranded, without which 'what Stripe and Adyen sell' has no name; Checkout.com second, because its Georgia charter introduces the second kind of charter after Adyen's banking licenses; Block last, because its bank is a third kind and only surprises once the reader has met the other two, and moving it earlier would leave 'a third kind' with nothing to count from. The cross-case section must follow all three, since its inference is drawn from them, and the limits come after it so that they bound the inference as well as the cases. Arguing the inference before the cases would present as a premise what three cases can only suggest.\n\n## Introduction\n\n**Hook** (`intriguing_example`): For 2025 PayPal reported $1.79 trillion of total payment volume and Stripe $1.9 trillion of total volume. The two numbers look like a close race between two card processors. PayPal's own annual filing says something else: in the first half of 2025 it accepted 'lower volume and transaction revenue' from Braintree, the part of PayPal that does what Stripe does, because of 'our stronger focus on profitable growth'.\n\n**Bridge:** After three chapters on Stripe and Adyen the reader places every other provider somewhere on a line between the two, and compares them by the one number each publishes, its volume. → Three companies that started with a different customer (a shopper with a wallet, an enterprise arriving later, a shopkeeper buying a till) each hold something neither anchor holds, and their volume figures measure different things.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): PayPal's asset is a consumer network of 439 million accounts, and its filing says the processing business beside it costs more to run. Checkout.com holds its own acquiring licenses, as Adyen does, and took the same narrow US charter as Stripe. Block began with the seller's till and owns a third kind of bank. My reading, labeled as inference, is that a provider holds the permissions its first customers required. The evidence is filings and releases about business models, not architecture.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Say how to read the evidence: what kind of documents these are and why the volume figures cannot be ranked. *Kept in:* how-to-read.\n- Read PayPal and Braintree for the consumer wallet as an asset beside a processor. *Kept in:* paypal.\n- Read Checkout.com for an enterprise acquirer assembled later with its own licenses. *Kept in:* checkout.\n- Read Block for seller software and hardware first, with payments included and a bank reached through lending. *Kept in:* block.\n- Put the three beside Stripe and Adyen, state the inference they support and what would count against it, and apply the added row to Larkfield. *Kept in:* what-transfers.\n- List where the evidence stops. *Kept in:* evidence-stops.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Two volume figures of nearly the same size, PayPal's $1.79 trillion and Stripe's $1.9 trillion, suggest two like companies, yet PayPal's filing reports that it let volume go from the one business that resembles Stripe's. | statistic: PayPal: 'In 2025, we processed $1.79 trillion of total payment volume (\"TPV\")'. Stripe: $1.9 trillion of 'total volume' in 2025, undefined.; quotation: 'As a result of our stronger focus on profitable growth and ongoing negotiations with merchants, we experienced lower volume and transaction revenue from our Braintree offerings in the first half of 2025 followed by revenue and TPV growth in the second half of 2025.' |  |\n| p02 | claim | Each of three companies that started with a different customer holds something neither Stripe nor Adyen holds, which suggests, as the author's inference, that a provider's permissions and assets follow its first customer relationship; the evidence is about business models only. |  | `cause_effect`: The puzzle of the two near-equal volumes. → The explanation: PayPal started somewhere else, as did two other companies, and the chapter's claim and its limits. |\n| p03 | context | Mila's class pass shows that the relationship with the payer can belong to a party other than the payment provider: she paid from a phone wallet inside Larkfield's booking app, and Adyen, which carried the payment, has no account with her. | scenario: Ledger: Mila's EUR 120.00 ten-class pass from Studio Noord on Tuesday 9 March 2027, paid from a phone wallet in the booking app, processed by Adyen. | `place`: The claim about customer relationships. → Where that relationship sits on the book's recurring payment. |\n| p04 | transition | The chapter first says how to read its evidence, then takes PayPal and Braintree, Checkout.com and Block in turn, then sets the three beside Stripe and Adyen and states what they support, and ends with where the evidence stops. |  | `sequence`: Where the chapter sits relative to the payment. → The order of its sections. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`context`, id `how-to-read`): The chapter's evidence is two audited annual filings and one private company's press releases, read for one point each, and their volume figures are defined so differently that they cannot be ranked.\n\n**Advances the thesis** (S5): Fixes the kind and limits of the evidence before any case uses it, so that no later sentence is read as a claim about architecture or as a ranking.\n\n**Transition in:** `elaboration`: The roadmap's first promise. → The labels, the research cut-off, the sources and the rule for volume figures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | The sources are PayPal's and Block's Form 10-K filings for 2025 and four Checkout.com releases of 2026, fetched on 17 November 2026; inferences are labeled, one thing was left out (PayPal's and Checkout.com's engineering blogs exist and were not read) and one could not be reached (the Georgia banking regulator's own page). | source: PayPal 10-K filed 3 February 2026; Block 10-K filed 26 February 2026; Checkout.com releases of 24 February, 9 September and 29 September 2026. A Form 10-K is the audited annual report a US-listed company files with the Securities and Exchange Commission. Not reached: Georgia Department of Banking and Finance bulletin page (404); no first-party Checkout.com architecture source found. |  |\n| p06 | comparison | Five companies publish five differently defined volume figures, so the chapter never ranks them. | table: Stripe 'total volume' $1.9 trillion (2025), undefined. Adyen processed volume EUR 1,394.3 billion (2025), audited report. PayPal TPV $1.79 trillion (2025): 'net of payment reversals ... not including gateway-exclusive transactions', whole company including PayPal and Venmo wallets. Checkout.com 'total processed volume' over $300 billion (2025), private company's own figure, undefined. Block: Square GPV $250 billion (2025), 'the total dollar amount of all card and bank payments processed by sellers using Square, net of refunds'. | `additional_support`: The kinds of source. → The one rule for the numbers in them: read the definition, do not rank. |\n\n### PayPal and Braintree: The Wallet Is the Asset\n\n**Controlling idea** (`evidence`, id `paypal`): PayPal's filing describes a consumer network as what the company operates and its card-processing business, Braintree, as the part with the higher expense rate, which shows what a processor without a consumer network lacks.\n\n**Advances the thesis** (S1): Supplies the first case: a provider whose first customer was the shopper, and what its own filing says about the processing business next to the wallet.\n\n**Transition in:** `example`: The rule that each figure is read with its definition. → The first case, which starts from the shopper.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What the company says it is, then what its volume figure counts, then what it says about Braintree, then the reading for Stripe and Adyen; the reading needs all three facts, and the Braintree statements mean nothing before branded and unbranded are defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | PayPal describes itself as a two-sided network of consumers and merchants, and sells merchants two different things: branded checkout, where the shopper pays with a PayPal or Venmo account, and unbranded processing, where PayPal handles the merchant's own card form. | quotation: 'We operate a global, two-sided network at scale that connects consumers and merchants with 439 million active accounts across approximately 200 markets as of December 31, 2025.' Merchants get 'online branded checkout solutions, including PayPal and Venmo; online unbranded payments processing'. |  |\n| p08 | explanation | The $1.79 trillion is the whole company's volume under PayPal's definition, so it says nothing about Braintree's size and cannot be set beside Stripe's total volume. | quotation: 'TPV is the value of payments, net of payment reversals, successfully completed on our payments platform or enabled by PayPal via a partner payment solution, not including gateway-exclusive transactions.' The filing gives no Braintree volume. | `cause_effect`: The two products inside PayPal. → What the single volume figure therefore does and does not count. |\n| p09 | evidence | On Braintree the filing says three things: its products generally have higher expense rates than PayPal's others, PayPal accepted lower Braintree volume in the first half of 2025 for the sake of profit, and Braintree revenue still rose by about $150 million over the year. | quotation: 'The decrease in transaction expense rate in 2025 compared to 2024 was primarily attributable to a lower proportion of TPV from Braintree products and services, which generally have higher expense rates than other products and services, and changes in merchant mix.' Transaction expense rate (transaction expense divided by TPV): 0.89% in 2025, 0.93% in 2024.; quotation: 'an increase of approximately $150 million in revenue from Braintree products and services, predominantly attributable to growth in TPV despite a decline in the number of payment transactions'; lower volume in the first half 'followed by revenue and TPV growth in the second half of 2025'. | `additional_support`: A volume figure that hides Braintree. → What the filing does say about Braintree, in its discussion of revenue and expense. |\n| p10 | analysis | Set beside Stripe and Adyen, the filing explains why a processor would build a consumer wallet: Stripe says its Link wallet has over 250 million users (over 300 million by September 2026), a figure it does not define, and Adyen has no consumer wallet; that Link is Stripe's attempt to grow the side PayPal started with is the author's inference. | fact: Stripe's Sessions 2026 release (29 April 2026) calls Link a consumer wallet with over 250 million users globally (a release of 8 September 2026 says over 300 million); the figure is undefined (accounts, not stated as active). No Adyen consumer wallet was found in its annual report for 2025.; reasoning: INFERENCE block: PayPal's filing shows the consumer relationship is the asset and unbranded processing the costlier part; Stripe has not said why it promotes Link; the reading that Link builds the consumer side a processor lacks is the author's. The filing does not state Braintree's margin. | `cause_effect`: Higher expense rates in processing, and a network of accounts as the asset. → What that implies about the two anchors, one of which is building a wallet. |\n\n### Checkout.com: An Enterprise Acquirer Assembled Later\n\n**Controlling idea** (`evidence`, id `checkout`): Checkout.com's own releases describe the proposition Adyen sells (card acquiring for enterprises under the provider's own licenses) being assembled by another company, including a US charter that Stripe also holds.\n\n**Advances the thesis** (S2): Supplies the second case: the same first customer as Adyen, started later, arriving at own acquiring by a different set of permissions.\n\n**Transition in:** `contrast`: A company that began with the shopper and owns a wallet. → A company that began, like Adyen, with the enterprise merchant and owns licenses.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The company's own figures, then the one dated event that links it to Stripe, then the reading; the charter cannot be compared with Stripe's before it is defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | description | Checkout.com is private, and its 2026 releases report over $300 billion processed in 2025, $750 million of annualized net revenue, over 1,700 enterprise merchants and ten acquiring licenses across 56 countries; these are its own unaudited figures. | statistic: 24 February 2026: 'processing over $300B in 2025'; 'adjusted EBITDA margin exceeding 10%'; 'over 1,000 enterprise merchants'. 29 September 2026: '$750m in annualised net revenue'; 'over 1,700 enterprise merchants'; 'operates across 56 countries with 10 acquiring licenses'. 'Enterprise merchant' is not defined and the count moved from 1,000 to 1,700 in seven months. |  |\n| p12 | evidence | In September 2026 Checkout.com began acquiring in the United States under a Georgia merchant acquirer limited purpose bank charter, the same narrow charter under which a Stripe entity appears among Stripe's US acquirers. | quotation: Checkout.com, 9 September 2026: 'the launch of direct acquiring in the US under its Merchant Acquirer Limited Purpose Bank (MALPB) charter in Georgia'; 'The MALPB will enable direct access to card networks, reduce reliance on third-party intermediaries'.; fact: Stripe's acquirer disclosure (n.d., accessed November 2026) lists 'Stripe MALPB, 505 N Angier Avenue NE, Atlanta, GA, 30308' among the acquirers of which Stripe, LLC is a payment facilitator, beside five banks. A trade association reported Georgia's approval of Stripe's application on 8 July 2025 and that such a bank 'may not solicit or accept deposits from the general public' (secondary source). | `example`: Ten acquiring licenses. → The newest of them, and who else holds one like it. |\n| p13 | analysis | The case shows that own acquiring is assembled license by license by whoever serves enterprises, and that an enterprise merchant looking for a second acquirer has one built on the same proposition as Adyen; why the margins differ is the author's inference, and nothing here describes how Checkout.com is built. | quotation: Adyen Annual Report 2025, risk section: 'Large enterprise merchants typically work with multiple payment service providers to mitigate their own single-point-of-failure risk.' Adyen: 84% of 2025 volume full-stack; banking licenses in the EU (2017), the US (2021) and the UK (2023).; reasoning: INFERENCE block: Checkout.com reports an adjusted EBITDA margin 'exceeding 10%' for 2025 and Adyen an EBITDA margin of 53%; the definitions are not shown to match; the author reads the gap as years of scale, not as evidence about design. The chief executive's phrase 'a single, unified infrastructure' is a press-release claim; no engineering source was read; the PLAN's 'on public cloud' could not be confirmed from a first-party source and is not asserted. | `cause_effect`: The same charter at two companies. → What the case implies for the two anchors and for a merchant choosing a second acquirer. |\n\n### Block: The Till First, Then a Bank\n\n**Controlling idea** (`evidence`, id `block`): Block's filing describes a provider whose product is the seller's till, which reaches the card networks through other companies' acquiring and owns a bank it uses to lend to its sellers.\n\n**Advances the thesis** (S3): Supplies the third case: a first customer who is a shopkeeper, and a bank obtained for lending while acquiring is still rented.\n\n**Transition in:** `contrast`: Two companies whose customers are large merchants with engineers. → A company whose customer is a shopkeeper who wants a till that takes cards.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What Square sells, then what it does not own, then what it does own and why; the bank is surprising only after the reader knows the acquiring is rented.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | Square sells sellers an integrated till, custom hardware and software with payments included, and is itself the merchant of record for their card payments; in 2025 more than 4.5 million sellers processed $250 billion through it. | quotation: 'Square's commerce enablement products include our payments, software, and hardware products, which together provide an integrated operating system for local commerce.' 'Square Hardware is custom-designed'. 'Square acts as both the merchant of record and payment service provider, settling funds with sellers and managing associated payment-related risk.' 'more than 4.5 million sellers used the Square ecosystem to make 5.9 billion individual sales transactions totaling $250 billion of Square GPV'. |  |\n| p15 | evidence | Block does not own its card acquiring: its filing says that for a majority of transactions it does not access the card networks directly and relies on banks and acquiring processors. | quotation: 'For a majority of our transactions, we do not directly access the payment card networks that enable our acceptance of payment cards. As a result, we must rely on banks and acquiring processors to process transactions on our behalf.' | `contrast`: What Square owns: the till and the seller. → What it does not own: the connection to the card networks. |\n| p16 | analysis | What Block does own is a bank of a third kind, a Utah industrial loan company operational since 1 March 2021, which it uses to lend to sellers against their Square sales and to hold their savings; set beside Adyen's banking licenses and the Georgia charter of Stripe and Checkout.com it is the third of three charters doing three jobs, and that Block reached a bank through lending and not through acquiring is the author's inference. | quotation: 'On March 1, 2021, Square Financial Services received its deposit insurance from the FDIC and charter approval from the Utah Department of Financial Institutions and became operational.' 'Square Loans facilitates loans to qualified Square sellers through Square Financial Services. We are able to underwrite these loans by using our unique data set of the seller's Square transactions'. 'Generally, loan repayment occurs automatically through a fixed percentage of every card transaction a seller takes.'; reasoning: INFERENCE block: three charters in this chapter do three jobs (Adyen's banking licenses: hold funds and acquire; Georgia MALPB: acquire only, no deposits; Utah industrial loan company: lend and take deposits, while acquiring is rented). Adyen reported 878 thousand transacting terminals in its Q3 2026 update, for enterprises and platforms; Stripe Terminal is documented as readers driven through SDKs and the API. Neither is a till sold to a shopkeeper. The reading that each charter follows the first customer is the author's. | `contrast`: Acquiring that is rented. → A bank that is owned, and what it is used for. |\n\n### What the Three Cases Add to the Comparison\n\n**Controlling idea** (`analysis`, id `what-transfers`): Beside Stripe and Adyen the three cases support the author's inference that a provider holds what its first customer relationship required, and they add one row to a provider comparison: who owns the relationship with the payer and with the seller.\n\n**Advances the thesis** (S4): Draws the cross-case reading, states it as inference with its limits, and turns it into a row a reader can use.\n\n**Transition in:** `conclusion_summary`: Three cases, each read alone for one point. → The three set beside the two anchors.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The lessons side by side with their evidence, then the inference and what would count against it, then its use on Larkfield; the Larkfield paragraph applies a row that the table and the inference first have to produce.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | comparison | Each case yields one lesson with its evidence, each transfers to a reader's decision only in part, and together they add one row to a provider comparison: who owns the relationship with the payer and with the seller. | table: Table 'Lesson \\| Evidence \\| Transfers?': (1) the consumer network is the asset, processing the costlier part: PayPal 10-K; transfers as a question about who knows the payer, not as advice on Braintree. (2) Own acquiring is assembled per market by any provider serving enterprises: Checkout.com releases, Stripe acquirer disclosure; transfers as 'ask which entity acquires in each country'. (3) A bank charter says nothing about acquiring: Block 10-K; transfers as 'ask what the charter permits'. (4) Volumes need definitions: all five; transfers fully. (5) What a provider holds follows its first customer: author's inference from three cases; a hypothesis, and one new row for a comparison: who owns the relationship with the payer and with the seller. |  |\n| p18 | claim | The inference is that a provider's permissions and assets are the ones its first customer relationship required; it is the author's, three cases chosen for contrast cannot prove it, a provider whose first license had nothing to do with its first customers would count against it, and it is about origins, not about whom a provider can serve today. | reasoning: Shopper first: accounts and a wallet (PayPal). Enterprise first: acquiring licenses (Adyen from 2006, Checkout.com later). Developer first: an API, then licenses and named acquirers per market (Stripe). Shopkeeper first: hardware, software and a lending bank (Block). Stripe and Adyen each now sell to the other's first customers. | `cause_effect`: The table's last row. → The inference in full, with what would refute it and what it does not claim. |\n| p19 | example | Applied to Larkfield, the fictional studio-software platform this book follows, the added row shows that Larkfield owns both relationships (the studio through its software, the member through its booking app) and its providers own neither, which is the position of a software-first company such as Block's Square and the reason Larkfield could adopt K8. | scenario: Ledger: Larkfield sells scheduling and booking software to studios and added payments; 2026 volume 44% on Stripe and 56% on Adyen; K8: the payment service can move a studio's online card payments to the other provider. Larkfield holds no license (chapter 16: the refund buffer was rejected). | `example`: The row 'who owns the payer and the seller'. → The row filled in for the book's running example. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`counterargument`, id `evidence-stops`): The chapter rests on filings and releases about business models, and six things it might be taken to show are not in them.\n\n**Advances the thesis** (S5, S4): States the limits of the three cases and of the inference drawn from them.\n\n**Transition in:** `contrast`: What the cases support. → What they cannot support.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | explanation (list) | Six limits bound what the chapter can claim: no architecture evidence for PayPal, Braintree or Checkout.com; no Braintree volume or margin; Checkout.com's figures are unaudited and partly undefined; no share of US volume through either Georgia charter; no account from Stripe of why it builds Link; and three cases selected for contrast. | reasoning: Absences checked: 'Fastlane' does not appear in PayPal's 10-K; the 10-K gives no Braintree TPV; Checkout.com gives no definition of 'enterprise merchant' or of its volume; neither Stripe nor Checkout.com states the volume through its MALPB; the Georgia regulator's page was unreachable; Block's filing names no acquiring processor shares. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The three cases do not sit between Stripe and Adyen; each stands on a different axis, the customer the company first served, and on that axis Stripe and Adyen are two points among five. The question 'which provider is bigger' therefore gives way to 'whose customer is the payer, whose customer is the seller, and which permission does each charter grant'.\n\n**So what:** A reader comparing providers adds one row and three questions to the comparison of chapter 48: who owns the relationship with the payer and with the seller; what a quoted volume counts; and what the provider's charter permits. The row also explains moves the two-company view leaves puzzling, such as a processor promoting a wallet or taking a bank charter.\n\n**Callback:** The two near-equal volumes of the opening, $1.79 trillion and $1.9 trillion. The reader can now say why they are not a race: one counts a wallet network and its processing together under a stated definition, the other is undefined, and the company behind the first chose to shed processing volume.\n\n**Takeaway** (`course_of_action`): Before comparing providers on a figure, write its definition next to it; before relying on 'it is a bank', write down what the charter permits; and add to the comparison card the row for who owns the payer and the seller.\n\n**Hand-off** to [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html): `time`: The positions as fixed in November 2026: two anchors that started at different ends and are converging, and three other companies whose starting customer explains what each holds. → What is changing under all five as the book goes to press: agents that pay, stablecoin settlement, instant account-to-account rails and new EU rules, each with its date and release phase.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | synthesis (list) | Established: PayPal's filing defines its volume and says Braintree products carry higher expense rates; Checkout.com says it acquires under ten licenses and a live Georgia charter; Block's filing says it relies on acquiring processors for a majority of transactions and owns a Utah industrial loan company; the five volume figures have five definitions. |  |  |\n| p22 | synthesis (list) | Depends on context: which case to read depends on the choice in front of you (a wallet, a second acquirer, a till), and whether a provider's charter matters depends on whether you need it to hold funds, to acquire or to lend. |  | `contrast`: What is settled. → What changes with the situation. |\n| p23 | recommendation (list) | The author's synthesis: providers are better placed by the customer they started with than on a line from Stripe to Adyen, so compare them by who owns the payer and the seller; this is a hypothesis from three cases, and the two near-equal volumes of the opening were never a race. |  | `contrast`: What is established and what depends. → The author's own position, returning to the opening. |\n| p24 | recommendation (list) | Seven questions let the reader test a provider comparison or a claim about a provider's size or charter. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p25 | transition | The positions of five companies are fixed here as of November 2026, and the next chapter turns to what is changing under all of them: agents that pay, stablecoin settlement, instant account-to-account payments and new EU rules. |  | `time`: Positions as they stood in November 2026. → The changes under way, each with its date and release phase. |\n\n## Non-goals\n\n- Stripe's and Adyen's own records and the bet-by-bet comparison. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- How PayPal, Braintree, Checkout.com or Block build their systems (no first-party architecture evidence was read).\n- Acquiring membership, sponsor banks and what a license lets a provider hold. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- In-person payments and terminals as a mechanism. See [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n- Uber's payment platform, the sibling book's case of a company that built payments in-house. See [Uber's Payments Platform: A Ledger at the Center of Money Movement](../finance-systems-architecture/case-uber-payments.html).\n- Global Payments and Worldpay, Shopify, Paddle, Spreedly and other companies named in the plan's positioning. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html), [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html), [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- Agent payments, stablecoins (including PayPal USD) and instant payments. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Checkout.com's founding year and hosting were not confirmed from a first-party source in this session; the article says 'later' on the strength of the dated licenses and marks the founding year as unverified general knowledge.\n- The filing does not say in so many words that Braintree is PayPal's unbranded processing business; the article states the identification as general knowledge.\n\n## Decision log\n\n- **2026-11-17** — The page is sized as a short chapter (about 3,000 words, 25 units) with the case anatomy of the style guide, because the plan marks it short by design and the evidence supports a business-model contrast only. Rejected: A full-length case of 4,500 to 6,000 words, which the evidence cannot fill without padding.\n- **2026-11-17** — Global Payments and Worldpay (brief section 4.4) are left out: the contract names three cases and consolidation belongs to chapter 50. Rejected: A fourth contrast case.\n- **2026-11-17** — The Block case uses two facts fetched from the 10-K beyond the brief (Square as merchant of record; reliance on banks and acquiring processors for a majority of transactions), because they turn 'holds a third kind of bank' into a contrast with acquiring. Rejected: Using only the brief's quotations.\n- **2026-11-17** — Per consistency ruling 22 the running text carries no external URLs; sources are attributed in the sentence and listed once under Sources and Evidence. Rejected: Inline links.\n\n## Sources\n\n- **Internal**\n  - _research/brief-companies-and-bets.md — Part 4 (contrast cases), section 1.6 and Part 3 (licenses, the Georgia charter), key numbers with definitions, research limitations and open questions 16 and 17.\n  - _research/brief-acquiring-methods-and-terminals.md — Stripe's acquirer disclosure and the Georgia charter's scope; Stripe Terminal's integration shapes.\n  - _research/scenario-ledger.md — Mila's class pass, the provider split and decision K8.\n- **External**\n  - PayPal Holdings, Form 10-K for FY2025, filed 2026-02-03, https://www.sec.gov/Archives/edgar/data/1633917/000163391726000024/pypl-20251231.htm (fetched 2026-11-17) — Two-sided network, TPV and its definition, branded and unbranded, Braintree statements, transaction expense rate.\n  - Block, Inc., Form 10-K for FY2025, filed 2026-02-26, https://www.sec.gov/Archives/edgar/data/1512673/000162828026012254/xyz-20251231.htm (fetched 2026-11-17) — Square GPV and its definition, integrated till, merchant of record, reliance on acquiring processors, Square Financial Services and Square Loans.\n  - Checkout.com release, 2026-02-24, https://www.checkout.com/newsroom/checkout-com-returns-to-full-year-profitability-and-surpasses-300b-in-volume-as-it-positions-for-the-era-of-agentic-commerce (fetched 2026-11-17); Checkout.com release, 2026-09-29, https://www.checkout.com/newsroom/checkout-com-reaches-750m-in-annualised-net-revenue-for-2026-and-increases-profitability (fetched 2026-11-17); Checkout.com release, 2026-09-09, https://www.checkout.com/newsroom/checkout-com-goes-live-with-us-direct-acquiring-under-malpb-charter (fetched 2026-11-17) — Volume, net revenue, margin, enterprise merchants, licenses, the Georgia charter going live.\n  - Stripe, Acquirer Disclosure, n.d., https://stripe.com/en-us/legal/acquirer-disclosure (fetched 2026-11-17) — Stripe MALPB among Stripe's US acquirers.\n  - ICBA (trade association, secondary), 2025-07-08, https://www.icba.org/newsroom/news-and-articles/2025/07/08/georgia-approves-stripe-application-to-form-malpb (fetched 2026-11-17) — Approval date and scope of Stripe's Georgia charter (secondary).\n\n## Changelog\n\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on: the added row (who owns the payer and the seller) is named in p17 before p19 applies it; p16 sets Block's bank against the two earlier charters and the two anchors; the flow rationale says that the introduction states the inference as a labeled thesis and gives a reason for the order of the cases that names what would break. Not acted on: moving the Mila paragraph out of the introduction, because the style guide fixes the 'Where we are in the payment's journey' paragraph there (the article glosses Larkfield and K8 where they first appear); shortening the Established list, which the style guide requires.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry, the companies brief and primary sources fetched on 17 November 2026.\n- **2026-11-17** — Verification pass: 42 claims checked (33 confirmed, 7 corrected, 1 hedged, 1 unsupported and now sourced, 0 unreachable); the two Georgia charters are now cited to the state regulator's 2026 bulletins (Stripe MALPB in business since 28 May 2026, Checkout.com MALPB since 16 July 2026) instead of an 'unreachable' page.\n- **2026-11-17** — Reconciliation after verification (parts-9-10): intent, thesis and role re-synced with the corrected journal-spec entry; unit descriptions brought into line with the verified prose and the rulings. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 'I found no first-party engineering source for PayPal, Braintree or Checkout.com' overturned: the PayPal Technology Blog and Checkout.com's blog publish engineering writing (Braintree's Medium publication is no longer maintained). The two sentences now say the blogs exist and were not read; one source line added. The statements about the 10-K filings (no Braintree volume or margin, no acquirer named by Block) are scoped to the filings and hold.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>

                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
