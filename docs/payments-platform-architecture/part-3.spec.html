<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written from the journal spec's part-3 entry (thesis, opening, flow) and the five Part III chapters as written (read in full on 2026-11-17). The KEY POINTS callout and the shape figure are evidence of the claim paragraph (p03); the reading-order figure is evidence of the roadmap paragraph (p04).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part III answers five questions in order: how the provider records money, what a balance means, how money leaves, how the record is proven, and who may hold the money.\n- **Believe:** A payment marked paid says nothing yet about who owes whom; that is a second record.\n- **Be able to:** Pick the Part III chapter that answers a money question in front of them: an unexplained difference, a balance that moved, a payout that did not arrive, a close that will not tie, or a funds flow that might need a license.\n\n**Audience:** Engineers and architects new to payments who have read Parts I and II and are about to start the ledger chapters, or who arrive with one money question in hand (an unexplained difference, a balance that moved, a payout that did not arrive, a close that will not tie, a funds flow that might need a license) and want the chapter that answers it.\n\n**Already knows:**\n\n- What a database row, an append-only log, a webhook and a state machine are.\n- Parts I and II: issuer, acquirer and card network; authorization, capture, clearing and settlement in outline; refunds and chargebacks; a payment held as a state machine.\n- Larkfield in outline: a fictional studio-software platform that uses Stripe and Adyen, and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- Double-entry ledger, clearing account, balance, payout, payout return, reconciliation, safeguarding: each is owned by a Part III chapter and is glossed in a clause here.\n- How Stripe's and Adyen's documented models differ on each; the page states the difference in a clause per chapter and leaves the evidence to the chapter.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order and say why the ledger comes first. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order, and why does the first one come first? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page states the part thesis in a form a reader can repeat: the provider knows where money is only from a record kept twice and proven against outside parties. *Probe:* After reading only this page: according to Part III, how does a provider know where the money is? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** Between the customer paying and the merchant being paid, how does a payment provider know where the money is and whose it is?\n\n> **Claim:** A provider knows where money is and whose it is only from a double-entry record it keeps itself, and that record counts as knowledge only while it is matched against records the provider did not write: network clearing files, bank statements and the statements of the accounts where customer funds are held. A balance and a report are that record read at a given moment, a payout is one of its entries becoming a bank transfer, and the provider's license decides which accounts the record must contain.\n\n**Disputed by:** The view that the money is simply 'at the provider', so that the balance in a dashboard is a count of cash like a bank balance, and ledgers and reconciliation are back-office accounting added later for the finance team.\n\n**So what:** An engineer who accepts the claim stops reading 'available', 'paid' and 'settled' as facts about cash, keeps an entry of their own for every movement, books from reports instead of from notifications, and asks of any funds flow who is licensed to hold the money in it.\n\n**How and why:** The cash behind a payment is never where the API objects are: it is in transit through networks and pooled in bank accounts across thousands of merchants, so 'where is this €120' can be answered only as entries that say who owes whom since when. Recording each movement twice makes a missing or wrong movement visible as an account that does not empty, but only a record kept by someone else can show that a recorded movement happened. Stripe (2024) and Adyen (2021) each describe a ledger built on this invariant and differ in where they enforce it; the merchant's balance, the payout and the settlement report are views of it; and safeguarding law turns the comparison between the ledger and the bank account into a legal duty for a provider that is not a bank.\n\n**Supporting claims**\n\n- **P3-1** — A ledger makes money errors visible by recording each movement as balanced, immutable entries through accounts that must empty; Stripe (2024) checks that invariant after the fact across many writing systems, and Adyen (2021) enforces it at the moment of writing.\n- **P3-2** — A merchant's balance is the provider's record of what it owes, and 'pending', 'available' and 'reserved' are the provider's decisions about when and how much it will pay, not reports of where the cash is.\n- **P3-3** — A payout turns a ledger balance into a transfer on a bank rail the provider does not control, so 'sent' and 'arrived' are different states and a transfer that fails comes back as a new movement.\n- **P3-4** — A ledger is proof only when its entries are matched against records it did not write, and the scheduled report, not the webhook, is the form in which a provider passes that proof to its customers.\n- **P3-5** — The license a provider holds decides which accounts its ledger must contain, which funds may never be mixed and what must be reconciled against a bank.\n\n## Role in the part\n\nPerforms the part's opening: poses the question with Larkfield's €412,000 difference, states the part thesis and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on one unexplained difference at Larkfield, says why a record of payments could not contain it (Part II's record says what happened to a payment, not who owes whom), widens that into the part's claim (a ledger kept twice and proven against outside records, of which balance, payout, report and license are aspects), and then narrows: to the five questions in order with the reason for the order, to one paragraph per chapter with its Larkfield case, to a guide from a problem to a chapter and where to begin. The difference comes first because the claim answers it; the claim precedes the chapter list because each chapter paragraph describes one aspect of the ledger, and a reader who has not been told that the ledger is the centre reads five unrelated topics. Put the chapter list first and the reader has no reason for its order; put the problem-to-chapter guide before the list and it points at chapters the reader has not met. In the closing, the problem-to-chapter guide precedes the synthesis so that the page ends on one instruction for the reader who starts at the beginning: begin with the ledger chapter.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At year-end 2025 Larkfield's ledger said one thing about what it owed its studios, and the balances at Stripe and Adyen said another: the two differed by €412,000. It took three weeks to trace the difference to refunds made after payout, chargeback fees and a currency-conversion rounding rule.\n\n**Bridge:** Part II, where the question was whether a payment is approved and the record was one payment's state (authorized, captured, refunded). → The days after approval, where every approval has created debts between card network, provider and merchant that are paid over days, the question is who owes whom, and the record is a set of accounts that must agree with the banks.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p03): A provider knows where money is, and whose it is, only from a double-entry ledger it keeps itself, and that record counts as knowledge only while it is matched against records the provider did not write: network clearing files and bank statements. A balance and a report are that ledger read at a given moment, a payout is one of its entries becoming a bank transfer, and the provider's license decides which accounts the ledger must contain.\n\n**Roadmap** (paragraph p04):\n\n- Five chapters in order, each needing the one before: how a provider builds the ledger that records every movement twice; what a merchant's balance says and does not say; how money leaves the provider and what happens when it does not arrive; how the provider proves its books against networks and banks and what it gives customers to prove theirs; and who is legally allowed to hold the money. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | At year-end 2025 every payment at Larkfield, the fictional studio-software platform, had the right status, yet its books said it owed its studios €412,000 more than the balances at Stripe and Adyen showed, and it took three weeks to trace the difference to refunds made after payout, chargeback fees and a currency-conversion rounding rule. | scenario: The Unexplained €0.4 Million (fictional): €412,000 at year-end 2025; three weeks; refunds after payout, chargeback fees, a currency-conversion rounding rule. Payout and chargeback are glossed in a clause each. |  |\n| p02 | cause_effect | Part II's record, one payment's state, could not contain that difference, because every approval creates debts (the card network owes the provider, the provider owes the merchant) that are paid over days, and a payment's state does not say who owes whom. | reasoning: The three causes all happened after the payment row was last correct (payment-ledgers: 'Each is money that moved after the payment row was last correct'); between approval and payout the amount is owed by the card network to the provider and by the provider to the merchant (payment-ledgers). | `cause_effect`: The €412,000 that correct payment statuses could not explain, and Part II's result: an approved payment held in a state machine. → Every approval creates debts paid over days; a payment's state does not say who owes whom, so a second record is needed, with a way to prove it. |\n| p03 | claim | Part III's claim: a provider knows where money is and whose it is only from a double-entry ledger it keeps itself, which counts as knowledge only while it is matched against records the provider did not write, and the balance, the report, the payout and the license are each that ledger seen from one side. | reasoning: KEY POINTS callout: a balance is a record of a debt, not a count of cash; the record is knowledge only while someone else's record agrees; 'available', 'paid' and 'settled' are one party's statement at one moment and can be reversed by a later entry.; figure: Shape figure: a ledger book at the centre; three views read from it (balance, payout, report); outside records it is matched against (network file, bank statement); a frame around it for the license.; reasoning: The disputed view, from the part thesis: the money is simply 'at the provider' and a dashboard balance counts cash like a bank balance. | `problem_solution`: The second record that the debts require, and the need to prove it. → What that record is (a double-entry ledger, glossed), what makes it knowledge (matching against outside records) and how balance, report, payout and license relate to it. |\n| p04 | description | Five chapters take five questions in an order in which each needs the one before: the ledger comes first because balances, payouts and reports are all read from it, and licenses come last because safeguarding is then one more comparison between a ledger and a bank account, this time required by law. | reasoning: The part's flow rationale in the journal spec: ledger, then balance as a view of entries, then payout as an entry becoming a transfer, then reconciliation of all three with outside records, then the legal duty reconciliation serves. Safeguarding glossed as the legal duty to keep customers' money apart from the firm's own.; figure: Reading-order figure: five steps left to right labeled Ledger, Balance, Payout, Proof, License, each with its question as an icon, joined by arrows. | `elaboration`: The claim that balance, payout, report and license are aspects of one ledger. → The five questions, their order and the reason for it. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question about the record of money, states where Stripe's and Adyen's documented models differ, and works it on one Larkfield case.\n\n**Advances the thesis** (P3-1, P3-2, P3-3, P3-4, P3-5): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five questions in order. → One paragraph per chapter: the question in bold, what the chapter argues and the Larkfield case it works.\n\n**Order of paragraphs** (`prerequisite_order`): Each chapter uses what the one before fixed. The ledger chapter supplies entries, accounts and clearing accounts; the balance chapter reads one merchant's claim out of those entries; the payout chapter follows that claim onto a bank rail; the reconciliation chapter generalizes the payout's two disagreeing records into matching every movement against an outside record; the license chapter asks whose bank account that outside record describes. Put reconciliation before the ledger and the reader matches records without knowing what they contain; put licenses first and safeguarding has nothing in the system to attach to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | The ledger chapter answers how a payment company knows whose money it holds and where it is: from balanced, never-edited entries and clearing accounts that must return to zero, enforced at the write as Adyen described in 2021 or proven afterwards as Stripe described in 2024, and it replays Larkfield's €412,000 through six accounts. | fact: As chapter 12 documents: Adyen's 2021 engineering post says records enter its books only through templates proven to net to zero; Stripe's 2024 post describes many systems publishing into an immutable log checked afterwards, with 99.99% of dollar volume verified within four days.; scenario: The €412,000 in three causes (refunds after payout €317,200, chargeback fees €73,500, rounding €21,300), replayed through Larkfield's six accounts and one posting function (fictional). |  |\n| p06 | description | The balances chapter asks where the money is, and whose, between the customer paying and the merchant being paid: a balance is the merchant's claim on the provider, 'pending', 'available' and 'reserved' are the provider's decisions about that debt, and Mila's €120.00 class pass becomes three figures in the provider's books. | fact: As chapter 13 documents (and ruling 18): Adyen's Sales Day Payout terms (2024) and documentation say it pays whether or not the card network has paid it, and takes back what has not settled within 30 days; Stripe publishes a schedule and, for standard payouts, does not say whether it waits for the network, beyond services terms (28 September 2026) that let a payout wait when a network fails to settle to Stripe.; scenario: Mila's €120.00 pass of 9 March 2027 as three figures: €117.47 owed to Studio Noord, €1.92 to Larkfield, €0.61 processing cost (an assumption) (fictional). | `sequence`: The provider's whole two-sided record. → One merchant's claim in it, and when that claim becomes payable. |\n| p07 | description | The payouts chapter asks how money leaves the provider and reaches a bank account, and what happens when it does not arrive: 'paid' means sent, a failed transfer comes back days later as a new credit, and Larkfield's Payout That Bounced shows what a one-state payout record costs. | fact: As chapter 14 documents: Stripe's documentation says a failed payout 'might initially show as paid'; both providers book a return as a separate transaction that credits the balance.; scenario: The Payout That Bounced, June 2026: 412 payouts worth €386,000 returned over three weeks; 19 days to pay every studio (fictional). | `sequence`: The studio's claim, now payable. → The claim leaving the ledger for a bank network the provider does not control. |\n| p08 | description | The reconciliation chapter asks how a provider proves its own books against the networks and banks and what it gives customers to prove theirs: it matches each expected movement against a record it did not write, hands customers the same proof as scheduled reports (per payout at Stripe, per payable batch at Adyen), and the chapter closes one Larkfield day on both providers. | fact: As chapter 15 documents: Stripe's payout reconciliation report itemizes each payout; Adyen's settlement details report itemizes each payable batch; both providers' own words separate a webhook that informs from a report that confirms.; scenario: Closing Tuesday 9 March 2027 on two providers; before Keel the nightly job covered Adyen only, while Stripe carried 44% of 2026 member payment volume booked from webhooks (fictional). | `problem_solution`: A payout that is 'paid' at the provider and absent at the bank: two records that disagree. → The general answer: match every movement against the other party's record, and book from reports. |\n| p09 | description | The licenses chapter asks who is legally allowed to hold customer money and where it sits: only a licensed institution may, Stripe states that it is a licensed non-bank and Adyen that it is a bank, neither names the banks that hold the money, and Larkfield's proposed 14-day buffer of about €43 million shows how a platform comes to hold funds by accident. | fact: As chapter 16 documents: Stripe states it is an e-money institution in Europe and 'not a bank' in the United States; Adyen N.V. states it is a Dutch credit institution with UK and US branches; neither names the banks that hold the money (Adyen's terms say balances are 'held by Adyen prior to Settlement' and its documentation gives a country per settlement currency).; scenario: The refund buffer proposed in April 2027: studio payouts held 14 days in Larkfield's own account, about €43 million against €46.0 million of annual revenue; stopped in review by Jonas Weber (fictional). | `elaboration`: Reconciliation as a comparison between a ledger and a bank's record. → Whose bank account that is, and the law that makes the comparison a duty for a provider that is not a bank. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read together, the five chapters ask one question five times: what does this record say is owed, and whose independent record agrees? That is why a reader can enter at the chapter matching the problem in front of them, and why the opening difference stops being a mystery: every payment status was right, and the €412,000 was in what no payment status records.\n\n**So what:** A reader with a money problem opens the chapter that owns it, and a reader starting from the beginning has each chapter's terms in place before the next uses them.\n\n**Callback:** The opening's €412,000 that correct payment statuses could not explain (p01). The reader is told where it sat: in movements that came after the payment and in a rounding rule, which a record of payments has no place for.\n\n**Takeaway** (`course_of_action`): Open the chapter that matches the problem in front of you, or begin with payment-ledgers, because every later chapter reads from the ledger.\n\n**Hand-off** to [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html): `elaboration`: The part intro's claim that a provider knows where money is only from a record kept twice, and Larkfield's €412,000 difference that a list of paid payments could not explain. → What that record is made of: balanced immutable entries, accounts, clearing accounts that must empty, and the two published ways of enforcing the invariant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | recommendation | A reader who arrives with a problem can go straight to its chapter: an unexplained difference to the ledger chapter, a balance that moved without a payout to the balances chapter, a payout marked paid that has not arrived to the payouts chapter, a close that will not tie to the reconciliation chapter, and a funds flow through the reader's own bank account to the licenses chapter. |  |  |\n| p11 | synthesis | Read in order, the chapters explain the opening: every payment status was right, and the €412,000 sat in movements that came after the payment and in a rounding rule, which a record of payments has no place for; begin with the ledger chapter. |  | `contrast`: Entering at one chapter for one problem. → Reading in order, what the chapters explain about the opening difference, and the first chapter. |\n\n## Non-goals\n\n- Teaching ledgers, balances, payout rails, reconciliation or licensing; the page summarizes and does not re-argue the chapters. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html), [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html), [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- The part's closing (ledger, balance, payout, reconciliation and license as one control seen five ways, and Keel decision K3 as the course of action). See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure patterns and Questions to Ask; part introductions carry none.\n- External factual claims of its own; every statement about Stripe, Adyen or a regulation is already in a chapter of the part and is linked, not cited.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The closing sits under its own short heading, 'Where to Begin', after 'Chapters in this part', as the Part II introduction does; the structure checker needs a heading to find the conclusion. Rejected: Ending the chapter list with 'Begin with …' and no conclusion heading (the checker cannot align a conclusion without one)\n- **2026-11-17** — The problem-to-chapter guide (the entry's can_do outcome) is a prose paragraph in the closing, not a table, to stay within 1,200 words. Rejected: A five-row table after the chapter list\n- **2026-11-17** — Flow rubric notes not acted on: the closing keeps the guide (p10) before the synthesis (p11) because the page must end on 'Begin with payment-ledgers' (INTRO-BRIEF); p10 addresses the reader with a problem and p11 the reader who reads in order, so the two instructions do not compete. Safeguarding is glossed inside p04, where it is first used. Rejected: Swapping p10 and p11; Moving safeguarding into the claim paragraph p03\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-3: thesis, opening, flow, transition_in; post entry part-3; payment-ledgers transition_in) — Intent, thesis, role, hook, bridge, roadmap, the order of chapters and the hand-off.\n  - posts/12-payment-ledgers, 13-balances-and-funds-flows, 14-payouts-and-money-movement, 15-payment-reconciliation-and-reporting, 16-licences-and-safeguarding (index.md, read in full) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n  - _research/scenario-ledger.md; _research/consistency-issues.md (ruling 18); _research/INTRO-BRIEF.md; _research/style-guide.md — The fictional facts, the wording on pre-financing (documented for Adyen, not for Stripe's standard payouts), and the shape and length of a part introduction.\n\n## Changelog\n\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Initial spec. Status draft. (AI-mediated session)\n- **2026-11-17** — Verification pass (part introduction, checked against the corrected chapters 12-16): 17 claims checked (17 agree, 0 corrected, 0 removed); no edit to the text.\n- **2026-11-17** — Absence audit: 1 statement of absence re-tested (narrowed, following chapter 13): Stripe's services terms let a standard payout wait when a network fails to settle to Stripe; table in _research/absence-audit/part-3-intro.md.\n- **2026-11-24** — Sweep of rulings 46-48: 'neither publishes which accounts hold the money' narrowed to 'neither names the banks that hold the money' (ruling 47g; owner chapter 16).\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
