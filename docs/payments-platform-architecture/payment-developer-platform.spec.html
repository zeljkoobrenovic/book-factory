s documentation says sandbox payments are not processed by card networks and that sandbox limits are lower, while Adyen, which runs test and live as separate environments with separate hosts and credentials, publishes no list of what test cannot simulate. A payment API is shared by every customer, so the provider must be able to refuse one caller's excess to protect the others, and a refusal the caller did not plan for delays payments. Stripe's engineering post of March 2017 describes four limiters, two per user and two that shed lower-priority traffic so that creating charges keeps working (evidence age nine years; current documentation confirms rate and concurrency limits and no source confirms the two load shedders still exist), and its documentation (accessed November 2026) publishes 100 requests a second per account in live mode and 25 in a sandbox. Adyen's documentation index has no rate-limit page for its payments APIs and publishes figures only for its Legal Entity Management API and parts of its Management API. Larkfield's renewal job met the provider's rate limit on 1 October 2026, and 7,900 renewals were delayed to the next day.\n\n**Supporting claims**\n\n- **S1** — A credential to a payment API can move money, so what each key is allowed to do bounds the damage of its leak or misuse; Stripe documents restricted keys and now advises them over unrestricted secret keys, and Adyen documents credentials that carry roles and an account scope.\n- **S2** — A test environment answers from a simulation, so a passing run shows that code handles the API's shapes and states and shows nothing about issuers, production latency or live limits; Stripe states some of these gaps and Adyen publishes no list of them.\n- **S3** — A shared payment API must be able to refuse one caller's excess, by a per-caller rate limit or by shedding lower-priority load for everyone; Stripe described four such limiters in 2017 and publishes its current limits, while Adyen publishes neither renewal job had no rate of its own, sent requests as fast as its workers got answers, and recorded a refusal for volume as a failed payment, which is how 7,900 members got a dunning email. | scenario: Ledger: 38% of monthly renewals (about 357,000, €17.5 million) are attempted in a 6-hour window; on 1 October 2026 the job hit the provider's rate limit and 7,900 renewals were delayed. New ledger additions: the limit met was Stripe's; the worker count had been raised from 12 to 48 in September 2026; an HTTP 429 was treated as a failed attempt, retried three times at once and then marked failed. |  |\n| p06 | analysis | Femke de Graaf's 2027 review found that the code was correct and that three questions had never been asked: what else the job's key could do, what the test run had shown, and which limit applied and where it was written. | scenario: Femke's review with Tom Hendriks (cast, ledger); before Keel one unrestricted Stripe secret key from 2017 was shared by several systems (new ledger addition).; figure: Conceptual figure: a service counter with three things in front of it, a key rack, a rehearsal room and a turnstile. | `cause_effect`: What the job did. → The three questions the review asked, which order the chapter. |\n\n### Credentials: What One Key Is Allowed to Do\n\n**Controlling idea** (`explanation`, id `credentials`): A key to a payment API can move money, so the unit of design is what each key may do; Stripe offers that as restricted keys and Adyen as roles and an account scope on every credential.\n\n**Advances the thesis** (S1): Establishes the first term: permission, with each provider's documented model.\n\n**Transition in:** `elaboration`: The review's first question, the reach of the job's key. → Why a payment key is different from other API keys, and the principle that bounds it.\n\n**Order of paragraphs** (`prerequisite_order`): Least privilege is defined first because both providers' models are answers to it; Stripe before Adyen because Stripe's all-powerful secret key is the case the principle argues against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | Least privilege for a payment key means each calling system holds a credential that can do its own task and nothing else, so that a leak or a bug is bounded by that task. | reasoning: A key that can create refunds and payouts can send money out; a key that can only read payouts cannot. The damage of a leak equals the permissions of the key.; quotation: Stripe key best practices (n.d., accessed 2026-11): 'People and systems must have only the privileges required to perform their jobs'; Stripe keys page: 'If a fraudulent actor obtains your secret key, they can harm your business.' |  |\n| p08 | evidence | Stripe lists four types of key, of which an integration of one account uses three (publishable, secret and restricted; the fourth is the organization key), and, as of November 2026, advises restricted keys over unrestricted secret keys. | quotation: docs.stripe.com/keys.md (n.d., accessed 2026-11): secret key is an 'API key that has unrestricted permissions on all Stripe APIs. Because you can’t limit their permissions, we don’t recommend using secret keys for new use cases, and for existing integrations, we recommend migrating secret key usage to RAKs.' Publishable keys are 'safe to embed'; live keys 'start with `pk_live_`, `rk_live_`, and `sk_live_`'.; quotation: docs.stripe.com/keys/restricted-api-keys.md (n.d., accessed 2026-11): per resource 'None, Read, or Write'; 'The default value for all permissions is None'; 'restricted API keys are drop-in replacements for secret API keys'. | `example`: The principle. → Stripe's key kinds and its current advice. |\n| p09 | evidence | Adyen documents a credential as a username, an API key and a set of roles, scoped to a company account or to chosen merchant accounts, and advises separate credentials for separate channels. | quotation: docs.adyen.com/development-resources/api-credentials.md (n.d., accessed 2026-11): 'Roles: Permissions that define what the credential is allowed to do'; 'Credentials created on a company account can access the company account, including all linked merchant accounts. Credentials created on a merchant account can only access that merchant account'; 'we strongly recommend creating a separate API credential for each channel'; allowed IP range per credential.; fact: docs.adyen.com/development-resources/client-side-authentication.md (n.d., accessed 2026-11): 'The client key is not used when making requests to our APIs.' | `contrast`: Stripe's keys, where restriction is a kind of key. → Adyen's credentials, where roles and scope are part of every credential. |\n\n### Test Environments: What a Passing Run Has Shown\n\n**Controlling idea** (`explanation`, id `test-environments`): A test environment answers from a simulation, so a passing run is evidence about the integration's handling of shapes and states and about nothing else; Stripe states some of the gaps and Adyen publishes no list.\n\n**Advances the thesis** (S2): Establishes the second term: what a test run proves, per provider, and what must be verified in production.\n\n**Transition in:** `sequence`: The first term, permission. → The second term: what the rehearsal with those credentials proves.\n\n**Order of paragraphs** (`prerequisite_order`): What a simulation can show comes first; then each provider's environment and stated gaps; the list of what to verify in production comes last because it is built from the gaps.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | explanation | In a test environment the provider's API creates simulated objects and contacts no card network or bank, so a test shows that your code handles each shape and state the API can return, and cannot show how often, how fast or under what limits those states occur in production. | reasoning: A test card that always returns 'insufficient funds' exercises the decline path; it says nothing about how many real issuers (cardholders' banks) will decline, or when. |  |\n| p11 | evidence | Stripe separates test from live by key inside one account, in sandboxes, and its documentation states several things a sandbox does not reproduce: card networks, live limits, live latency and the live webhook retry schedule. | quotation: docs.stripe.com/sandboxes.md (n.d., accessed 2026-11): 'the payments you create aren’t processed by card networks or payment providers'. docs.stripe.com/testing-use-cases.md: 'Use up to five sandboxes'; 'API objects in one mode aren’t accessible to the other'.; quotation: docs.stripe.com/rate-limits.md (n.d., accessed 2026-11): 'API limits are lower in a sandbox'; 'creating a charge in live mode sends a request to a payment gateway and that request is mocked in a sandbox, resulting in significantly different latency profiles'. docs.stripe.com/webhooks.md: 'We retry event deliveries created in a sandbox three times over the course of a few hours' against 'up to three days' in live mode.; fact: Sandboxes: private beta in the June 2024 developer digest, 'now in public beta' in the digest of 30 August 2024; 'Stripe Sandboxes are now generally available (GA)' in the stripe.dev post 'Sessions 2025 Developer Track resources' of 7 May 2025 (https://stripe.dev/blog/sessions-2025-dev-track-resources). | `example`: What a simulation can show. → Stripe's environment and the gaps it states. |\n| p12 | evidence | Adyen runs test and live as separate environments with separate endpoints, portals, credentials and configuration, and publishes no list of what its test environment cannot simulate; it states gaps one payment method at a time (for example 'MobilePay cannot be tested in the test environment'). | quotation: docs.adyen.com/development-resources/api-credentials.md (n.d., accessed 2026-11): 'When you switch to your live environment, you must generate a new API key in your live Customer Area'. Webhook configuration page: 'Adyen does not provide a \"copy\" function for moving your webhook configurations from the test environment to the live environment'. Live endpoints page: 'Apply and get your live account'; a live URL prefix per company account.; quotation: Adyen engineers, Medium, 2026-11-09: 'Getting a green happy-path response during integration testing doesn’t prove your integration will hold up under the conditions that actually matter at go-live.' | `contrast`: Stripe: one account, separation by key, stated gaps. → Adyen: two environments, and no published list of gaps. |\n| p13 | recommendation (list) | What test cannot show has to be listed and then verified in production under observation: issuer behavior, latency, live limits, the provider's retry schedule and the live configuration itself. | reasoning: Each item is either a gap Stripe states or, for Adyen, the author's inference from pages that describe live-only behavior (labeled as inference in the article). | `cause_effect`: The gaps, stated and unstated. → The list of what to verify in production. |\n\n### Request Limits: Rate Limiting and Load Shedding\n\n**Controlling idea** (`explanation`, id `request-limits`): A shared payment API protects itself by refusing requests, per caller (a rate limit) or for everyone by priority (load shedding); Stripe has described its design and publishes its numbers, Adyen publishes neither for payments, and the integrator's choice is to react, to pace or to agree a rate.\n\n**Advances the thesis** (S3, S4): Establishes the third term with its definitions, the dated evidence for each provider and the designs open to the integrator.\n\n**Transition in:** `sequence`: The second term, the rehearsal. → The third term: how much may be sent, and the review's third question.\n\n**Order of paragraphs** (`prerequisite_order`): The two kinds of refusal are defined before Stripe's four limiters, which are instances of them; the old design precedes the current numbers so the reader can see what is confirmed; Adyen follows as the case with no published figure; the integrator's designs come last because they depend on whether a figure exists.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | A rate limit caps what one caller may send and a load shedder drops lower-priority requests from all callers when the system itself is overloaded; both exist because one API serves every customer, and the caller sees the first as HTTP 429. | quotation: Stripe engineering, 'Scaling your API with rate limiters', Paul Tarjan, 2017-03-30: 'A rate limiter is used to control the rate of traffic sent or received on the network'; 'A load shedder makes its decisions based on the whole state of the system rather than the user who is making the request.' |  |\n| p15 | evidence | In March 2017 Stripe described four limiters in production: two per user (request rate and concurrent requests) and two load shedders that reserve capacity for critical methods such as creating charges. | quotation: Same post (evidence age: 9 years): 'At Stripe, we operate 4 different types of limiters in production'; request rate limiter 'restricts each user to N requests per second'; 'You can only have 20 API requests in progress at the same time'; 'critical API methods (e.g. creating charges) and non-critical methods (e.g. listing charges.)'; 'any non-critical request over their 80% allocation would be rejected with status code 503'; worker utilization load shedder 'is the final line of defense' with categories 'Critical methods', 'POSTs', 'GETs', 'Test mode traffic'; 'We use the token bucket algorithm', implemented with Redis.; figure: Structural figure: requests passing four gates in order (rate limiter, concurrency limiter, fleet load shedder, worker load shedder), with critical requests passing and lower-priority ones turned away. | `example`: The two definitions. → Stripe's four limiters as instances of them. |\n| p16 | evidence | Stripe's documentation of November 2026 confirms per-account rate and concurrency limits, contradicts the 2017 statement that test and live limits are the same, says nothing about the two load shedders, and publishes the numbers an integrator plans against. | table: docs.stripe.com/rate-limits.md (n.d., accessed 2026-11): global 100 requests per second in live mode and 25 in a sandbox, per account; individual endpoints 25 per second unless noted ('Stripe considers each named API operation a separate endpoint'); default global concurrency 50 in-progress requests in live mode; Payouts 15 create requests per second; read requests 'must not exceed an average of 500 per transaction' over 30 days; a 429 carries a `Stripe-Rate-Limited-Reason` header (global-rate, endpoint-rate, global-concurrency, endpoint-concurrency, resource-specific); large increases requested 'at least 6 weeks in advance'.; quotation: 2017: 'Our API provides the same rate limiting behavior in both test and live modes.' Current page: 'API limits are lower in a sandbox'. Current page still says long requests 'run the risk of causing the concurrency limiter to shed new requests'. | `time`: The 2017 design. → What the current documentation confirms and the current numbers. |\n| p17 | evidence | Adyen publishes no general rate limit and no limiter design for its payments APIs; it documents that a 429 exists and how to handle it, and gives figures only for its Legal Entity Management API and parts of its Management API. | fact: docs.adyen.com/llms.txt (documentation index, 2,701 lines, n.d., accessed 2026-11) lists no page on API rate limits, and neither do the documentation sitemap (2,619 URLs) or the help center, searched in the absence audit of 2026-11-17; the Checkout API v72 OpenAPI definition contains neither 'rate limit' nor a 429 response (checked by the writer on 2026-11-17).; quotation: docs.adyen.com/development-resources/response-handling.md (n.d., accessed 2026-11): 429 'You have sent too many requests in a short period. To handle this issue, implement a retry mechanism that uses exponential backoff with jitter'. Legal Entity Management API v4 description: 'Live environments: 700 requests per 5 seconds. Test environments: 200 requests per 5 seconds.' Terminal management page: 'these limits are indicative and can change as needed to maintain the stability of the live environment'. | `contrast`: Stripe's published numbers. → Adyen's absence of them for payments. |\n| p18 | comparison | An integrator can meet a limit in three ways (react to refusals, pace itself with a client-side token bucket below a known figure, or agree a throughput with the provider in advance), and a predictable peak needs the second or third. | table: Trade-off table: react (backoff with jitter on 429) / pace (client-side token bucket below the limit) / agree (ask for a figure or an increase in advance); columns: what it needs, what it costs, when it is right.; reasoning: Copying Stripe's four limiters into an integrator's own service would be the Borrowed Blueprint: the integrator needs one bucket per provider endpoint, not fleet-wide shedding. | `problem_solution`: Limits published at one provider and unpublished at the other. → The integrator's three designs and their trade-offs. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): In the public record Stripe states its limits, its test gaps and a limiter design, and Adyen states its credential and environment model and none of the three, which changes what an integrator reads and what it must ask.\n\n**Advances the thesis** (S1, S2, S3): The required comparison: documented facts per aspect, 'Not public' where they stop, the reading marked as inference.\n\n**Transition in:** `conclusion_summary`: The three terms as each provider documents them. → The two set side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | comparison | Aspect by aspect, the two providers document credentials and environments in comparable detail and differ most in what they publish about limits and test gaps. | table: Rows: server credentials; test environment; stated gaps of test; rate limits for payment requests; limiter design; request logs. Columns: Stripe, Adyen, what the difference suggests (the author's inference). |  |\n| p20 | recommendation | On Stripe the integrator plans from the published page and asks only for an increase; on Adyen it asks for a throughput figure and writes its own list of test gaps, and on both it recreates or checks live configuration deliberately. |  | `cause_effect`: The differences in the table. → What to do differently on each. |\n\n### In Practice at Larkfield: Pacing the Renewal Wave\n\n**Controlling idea** (`example`, id `in-practice`): Under Keel decisions K5 and K1 Larkfield computes the wave's request rate, paces it per provider below the limit with room for members who are waiting, never records a refusal as a decline, and gives each calling system its own narrow credential.\n\n**Advances the thesis** (S4, S1): Works the three can-do outcomes with ledger numbers: compute and pace, assign credentials, list what production must show.\n\n**Transition in:** `example`: The comparison and the three designs. → Larkfield's own numbers and choices.\n\n**Order of paragraphs** (`problem_solution`): The arithmetic shows why an average hides the burst; the pacing design answers it; credentials and the production checklist complete the review's three questions in the order the fix was made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | analysis | The wave's average rate was far below every published limit and its bursts were not: 357,000 renewals in six hours is about 17 a second, while 48 workers at an assumed half second per call send up to 96 a second at one endpoint whose documented limit is 25. | statistic: Ledger: about 357,000 renewals in 6 hours (21,600 seconds) = 16.5 per second; over K5's 18 hours (64,800 seconds) = 5.5 per second. Assumption: the wave splits like volume, 44% Stripe (about 157,000; 7.3 per second over 6 hours, 2.4 over 18) and 56% Adyen (about 200,000; 9.3 and 3.1). Assumption: 0.5 seconds per call, so 12 workers send at most 24 per second and 48 at most 96. Stripe documented limits: 25 per endpoint, 100 per account.; figure: Before/after figure: the same number of requests as tall bursts crossing a limit line and as a flat paced band under it. |  |\n| p22 | process | Under K5 the wave is spread over 18 hours and the payment service holds one token bucket per provider and endpoint, set below the published figure on Stripe and at a conservative figure on Adyen until one is agreed, to leave room for members paying interactively, and a 429 puts the renewal back in the queue with the same idempotency key and no change of payment state. | scenario: K5: the renewal job paces itself over 18 hours. Local design (new ledger additions): the Stripe bucket for creating payments is 10 requests per second, the Adyen bucket 5 per second (3.1 needed), raised only after asking Adyen for the rate the company account may send; interactive checkout is served before the batch.; quotation: docs.stripe.com/error-low-level.md (n.d., accessed 2026-11): 'Errors that occur before execution begins, such as invalid parameters, an invalid API key, or rate limiting, don’t cache a result. Retry these requests after resolving the error.' | `problem_solution`: The burst. → The pacing design and the handling of a refusal. |\n| p23 | example | Under K1 only the payment service holds a credential that can move money, and every other system that calls a provider holds one that can only read what it needs. | table: Table: calling system / task / credential on Stripe / credential on Adyen / what a leak allows. Rows: payment service; webhook receivers; reconciliation job and data warehouse; billing integration; booking app in the browser. | `additional_support`: The limit, now planned for. → The review's first question, the keys. |\n| p24 | recommendation | The first paced wave was run under observation because test could not show it: the count of 429s by reason, call latency, the share of issuer declines, and whether the wave finished inside 18 hours. | reasoning: Each watched quantity is one of the gaps listed in the test-environments section; the Stripe sandbox limit of 25 requests per second and its mocked latency make a sandbox load test uninformative, as Stripe's page says. | `sequence`: Design and credentials in place. → What the first production run had to show. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): These terms fail in three ways an integrator can detect: a refusal recorded as a failed payment, a key that leaks or is used beyond its task, and a question about past requests that the provider's logs can no longer answer.\n\n**Advances the thesis** (S4, S1): Gives detection and recovery for each term, including the logs and tools each provider offers.\n\n**Transition in:** `contrast`: The terms planned for. → The ways they still fail.\n\n**Order of paragraphs** (`order_of_importance`): The refusal mistaken for a decline first because it is the chapter's incident and misleads customers; the key next because it is rarer and costlier; logs last because both recoveries depend on them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | analysis | A refusal recorded as a failed payment is the Phantom Payment in reverse: the system believes a payment failed when the provider never tried it, and it is detected by the status code and reason of the response, which differ from a decline's. | fact: Stripe returns HTTP 429 with a `Stripe-Rate-Limited-Reason` header and documents that a 429 without the header 'might be a lock timeout'; Adyen documents 429 with backoff and jitter; a card decline is a payment result, not a 429. |  |\n| p26 | analysis | A leaked or misused key is contained by its permissions first and by rotation second, and the two providers document different rotation behavior. | quotation: docs.stripe.com/keys.md (n.d., accessed 2026-11): 'Rotating an API key revokes it and generates a replacement key that’s ready to use immediately. You can also schedule an API key to rotate after a certain time.'; 'When you rotate a key in the Dashboard, both the old and new keys work for up to 7 days.' docs.adyen.com api-credentials: 'When you generate a new API key, it becomes active immediately. The previous key remains active for 24 hours to allow you to update your systems'. | `additional_support`: A failure of the limit. → A failure of the credential. |\n| p27 | evidence | Each provider lets an integrator see its own requests for a bounded time (Adyen states thirty days for API logs; a Stripe support article states 31 days for GET request logs and 15 months for other requests), so the integrator's own request log is the durable one. | quotation: Adyen API logs page (n.d., accessed 2026-11): 'all API requests made in your test or live environment in the past thirty days'; 'API logs only support API requests that use JSON'; developer dashboard: 'in the past seven days'. Stripe: Workbench announced 2024-08-19 as 'our new home for developers within the Dashboard'; error objects carry `request_log_url`, 'A URL to the request log entry in your dashboard'; the Stripe CLI's `logs tail` 'only supports displaying request logs from a sandbox'; support.stripe.com/questions/stripe-request-log-retention-period (n.d., accessed 2026-11): 'The Dashboard allows users to view GET request logs from the past 31 days and non-GET request logs (including POST) from the past 15 months.' The Adyen documentation index lists no command-line tool. | `cause_effect`: Two recoveries that both start with 'what did we send?'. → The logs each provider gives and their limits. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Read together, the five chapters show that every protection the API offers has an edge: a key is remembered for a day or for one to two weeks, an event is retried for three days or thirty, a version is served until its notice runs out, a request is accepted up to a rate. Inside those edges the API can stand in for the slow process; outside them the integrator is back in the gap between the instant answer and the slow truth, and only its own record of each payment, checked against the provider's, covers it.\n\n**So what:** The integrator's design question changes from 'which endpoint do I call' to 'what do I do when the provider has stopped remembering for me', which is why the payment service holds the keys, the receivers store before they acknowledge, and reconciliation against the provider's reports runs however reliable the webhooks have been.\n\n**Callback:** The 7,900 refused renewals of the opening and, for the part, the four Larkfield incidents of the part opening (the Version Cliff, the Silent Webhook, the Renewal Wave, the Double Charge). The four Larkfield incidents of the part opening: in each one the integration assumed a contract wider than the provider documents (a retry recognized without the same key, a version that would never move, an event that always arrives, a limit that a predictable peak would not reach), and Keel decisions K1, K2, K5 and K7 each restate one contract in Larkfield's own terms.\n\n**Takeaway** (`course_of_action`): For each provider, write down five terms from its documentation (what can be read back by identifier, key retention, version pin and notice period, webhook retry window and acknowledgement deadline, request limits) and, next to each, what your own system does once that term runs out.\n\n**Hand-off** to [Part V — TRUST: Card Data, Fraud, Authentication and Compliance](part-5.html): `contrast`: Part IV's claim that an API can safely hide a slow, multi-party process when idempotency, versioning and events are designed in, and this chapter's keys, test environments and limits. → What the API cannot hide: the controls in the request path that decide who may hold a card number, who is trusted to be paying and who may be paid.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | synthesis (list) | Established: a payment key's permissions bound its damage, a test environment simulates and both providers separate it from live, and Stripe publishes limits while Adyen publishes none for payments. |  |  |\n| p29 | synthesis (list) | Depends on context: how many credentials to run, whether to pace or only react, and how much to trust a test run depend on the number of calling systems, the predictability of the peak and what the provider states. |  | `contrast`: What is settled. → What changes with the situation. |\n| p30 | recommendation (list) | The author's synthesis: read a limit as a field of the API, give the money-moving key one home, and treat a green test run as a statement about code paths only. |  | `contrast`: What is established and what depends. → The author's own position, returning to the refused renewals. |\n| p31 | synthesis | Across Part IV every protection the API offers has an edge (how long a key is remembered, how long an event is retried, how long a version is served, how many requests are accepted), and each of Larkfield's four incidents assumed a contract wider than the documented one. | fact: Documentation accessed November 2026, established in the earlier chapters of this part: Stripe API v1 may remove idempotency keys once 'at least 24 hours old' and retries webhooks 'for up to three days'; Adyen keys are valid '7 to 14 days' and webhooks are retried 'for up to 30 days'; an Adyen Checkout version that is deprecated leaves '2 years to upgrade'; Stripe's live limit is 100 requests per second per account. | `conclusion_summary`: This chapter's take-aways. → The part's closing: four edges of one contract, the four incidents and Keel decisions K1, K2, K5 and K7. |\n| p32 | recommendation (list) | Nine questions let the reader test the keys, the test environment and the limits of an integration or a provider. |  | `cause_effect`: The closing argument. → Questions that apply it. |\n| p33 | transition | Part IV showed what an API can hide when its contracts and their edges are designed in; Part V turns to what it cannot hide, the controls that decide who may hold a card number, who is trusted to be paying and who may be paid. |  | `contrast`: The interface and its edges. → The controls in the request path that an interface cannot hide. |\n\n## Non-goals\n\n- Idempotency keys, key retention and what to do after a timeout. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- Version pinning, deprecation notices and upgrade rehearsals. See [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html).\n- Webhook signing secrets, delivery contracts and receivers. See [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html).\n- Client libraries, OpenAPI definitions and how SDKs are generated. See [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html).\n- Capacity planning, fairness across customers, backpressure and published peak figures. See [The Biggest Day: Peak Load and Capacity](payment-peak-load.html).\n- Limits on the integrator's own public endpoints against card testing. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- Publishable and client keys as part of keeping card data out of scope. See [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html).\n- The retry schedule for declined renewals and dunning messages. See [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html).\n- Documentation tooling (Stripe's Markdoc, Markdown and llms.txt variants at both providers) as a subject of its own.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- How requests that a Stripe Connect platform makes for its connected accounts count against the platform's rate limit is not stated on the rate-limits page for the per-second limits (the page states it only for the read allocation); the chapter says so and makes it a question to ask.\n- Whether Stripe's 2017 fleet-usage and worker-utilization load shedders still exist is not confirmed by any current source.\n- Adyen's payment-request limits, whether they are per company account or per credential, and any limiter design are not public.\n- The retention period of Stripe's request logs is not on its documentation pages; the verification pass found it in an undated Stripe support article (31 days for GET, 15 months for other requests).\n- No dated general-availability announcement for Stripe Sandboxes was found.\n- The ledger does not say which provider's limit the Renewal Wave met on 1 October 2026; this chapter fixes it as Stripe's (the only provider with published limits) in a ledger addition, which chapter 40 should follow.\n\n## Decision log\n\n- **2026-11-17** — The chapter is planned at 33 units and about 4,400 words by the checker's count (which includes the three tables of documented figures and the source list; about 3,900 before Sources), shorter than a typical chapter and above the brief's range for a short one (15 to 25 units, 2,000 to 3,000 words), because the fixed elements of the style guide and the part's closing synthesis take ten units before any evidence, and all three terms have documented evidence at both providers. Rejected: Dropping the logs-and-tools paragraph, which the journal entry's outcome requires.; Folding the part closing into the author's synthesis, which AC-4 would fail.\n- **2026-11-17** — The Renewal Wave's limit is Stripe's, and the incident's mechanism is an unpaced job that recorded HTTP 429 as a failed attempt; both are ledger additions. Rejected: Leaving the provider unnamed, which would prevent comparing the job's rate with a documented figure.; Placing the incident on Adyen, for whose payments APIs no limit is published.\n- **2026-11-17** — Logs and tools are treated inside 'When It Goes Wrong' as the means of detection, not as a section of their own; client libraries and documentation tooling are non-goals. Rejected: A separate tooling section, which would read as a feature list.\n- **2026-11-17** — What Adyen's test environment cannot simulate is presented as the author's labeled inference, since Adyen publishes no such list. Rejected: Stating the gaps as documented.\n\n## Sources\n\n- **Internal**\n  - _research/brief-stripe-payments-and-api.md — Part 6 (keys, sandboxes, rate limits, Workbench and CLI) and the open questions.\n  - _research/brief-adyen-payments-and-api.md — Part 7 (environments, credentials, rate limits, logs, testing), sections 3.2, 3.4 and 6.7, and the open questions.\n  - _research/brief-reliability-and-scale.md — Sections 4.2 and 6.3 (limiter design and current limits).\n  - _research/scenario-ledger.md — The Renewal Wave, the first of the month, the systems landscape, K1, K5, the cast.\n  - _research/consistency-issues.md — Rulings 5, 12 and 13.\n- **External**\n  - Pages fetched by the writer on 2026-11-17: docs.stripe.com keys, keys/restricted-api-keys, keys-best-practices, sandboxes, testing-use-cases, rate-limits, webhooks, error-low-level, api/errors, api/idempotent_requests, workbench/overview, cli; stripe.com/blog/rate-limiters; the Stripe Workbench post and August 2024 developer digest; docs.adyen.com api-credentials, api-credentials/roles, client-side-authentication, live-endpoints, testing, testing/result-codes, testing/payments-and-modifications, response-handling, webhooks/configure-and-manage, webhooks/troubleshoot, api-idempotency, upgrade-your-integration, logs-resources/api-logs, logs-resources/webhook-event-logs, developer-dashboard, point-of-sale/automating-terminal-management, llms.txt; Adyen/adyen-openapi LegalEntityService-v4 and CheckoutService-v72; the Adyen Payment Simulator article on Medium. — Verification of every quotation and figure used.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 73 claims checked (66 confirmed, 6 corrected, 1 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the most significant fix: Stripe does state a request-log retention period (support article: 31 days for GET, 15 months for other requests), where the page said none was found; also Stripe lists four key types, not three, and its key rotation has a grace period of up to 7 days.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on: the scene now lists the three questions in section order (key, test, limit); HTTP 429 is defined with the rate limit; the token bucket is named in the designs paragraph; the 18-hour window and the per-provider figures are stated in the pacing paragraph; the failures paragraph on refusals is limited to detection; the declared reason no longer claims rotation and logs are defined earlier. Not acted on: the In Practice section keeps the order limit, key, test, the order in which Larkfield made the fix.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Reconciliation after verification (17 November 2026): AC-3 says no Adyen limiter design 'was found' instead of 'exists'; the part closing no longer calls the reconciliation 'nightly' (ruling 28).\n- **2026-11-17** — Absence audit: 6 statements of absence re-tested with a wide search (documentation sitemaps, help centers, company sites, engineering posts, web search). Overturned: 'no dated announcement of general availability' of Stripe Sandboxes (stripe.dev post of 7 May 2025 says they are generally available). Narrowed: Adyen publishes no list of test-environment gaps but states gaps per payment method (MobilePay cannot be tested in test). Adyen's payment rate limit and limiter design: still not found, now scoped to what was searched. Paragraph p11 evidence and p12 controlling idea updated; two sources added; four connective phrases trimmed to stay within 5,000 words.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
