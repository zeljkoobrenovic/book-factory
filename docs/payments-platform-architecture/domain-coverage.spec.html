<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the page's PLAN contract, the author's planning model (29 capability bricks counted from its bricks file) and the written chapters: each mapping was confirmed by opening the chapter and finding a section that treats the capability. Intent, acceptance criteria, thesis and role are copied unchanged from journal-spec.json. A lookup page: tables are recorded as the evidence of the paragraph that introduces them.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Which chapter covers each of the 29 capability bricks of the Productscape model of payments and revenue infrastructure, in its four groups: merchant payments, revenue automation, platform money movement, shared financial foundations.\n- **Know:** Which capabilities the book covers only briefly (for example hosted checkout and payment links as products, identity verification as a standalone product, delegated authority for agents) or leaves to sibling books, and why.\n- **Know:** What the book added that the model has no brick for: how a card payment clears and settles, payment economics, acquiring and licenses, tokenization and PCI scope, authentication, idempotency, API versioning, the whole of Part VIII on scale, the journeys, the failure patterns and the company cases.\n- **Know:** That the model is the author's planning map, built with Stripe as the modeled product and Adyen as the comparison, with logical records inferred from modeled jobs: never a source for a fact about either company.\n- **Be able to:** Find the chapter for a system they own by the job it does.\n- **Be able to:** Say whether a subject is absent from the book by decision or covered under another name.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader finds the chapter that covers a capability, or learns that it is covered briefly or left out and why. *Probe:* Using only this page: where does the book cover usage metering and rating, how much does it say about payment links, and does it explain how to post provider payouts into an ERP's general ledger? | `custom` | cold_reader | major |\n| AC-2 | A reader says what the planning model is, why it is not evidence, and what the book covers that the model does not. *Probe:* Using only this page: what is the model behind the book's planning, may a claim about Stripe's internal systems be sourced to it, and name three subjects the book gives a chapter to that the model has no capability for? | `custom` | cold_reader | major |\n| AC-3 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which planning model stands behind the book, which chapters cover its capabilities, and what did the book cover briefly, leave out or add?\n\n> **Claim:** The book was planned against a 29-capability Productscape model of payments and revenue infrastructure and gives every capability group at least one chapter, but it is organized differently from the model. It treats product-shaped capabilities (hosted checkout, payment links, standalone identity verification, delegated authority for agents) briefly, inside chapters about the mechanism beneath them; it leaves the finance-side posting of payouts to the sibling book RECONCILED; and it adds what the model has no capability for: how money moves between the parties, the mechanisms that make a retried or changed API call safe (idempotency, versioning, tokenization, authentication) and how the whole is run at scale. The model is a planning map and is evidence about no company.\n\n**Disputed by:** The view that a book planned from a capability model should follow that model chapter for chapter, so that a mismatch between the two is a gap in the book, and that a detailed model of Stripe's and Adyen's products can be cited for how those companies work.\n\n**So what:** A reader who owns a system finds its chapter by the job the system does, reads an absence as either a stated decision or a different name, and never quotes the model, or this page, for a fact about a provider.\n\n**How and why:** A product model answers what a customer can buy and which job it does; an engineer new to payments first needs what happens to the money and why the obvious integration fails, which no product brick states. So Parts I, IV and VIII have few or no bricks behind them, while product-shaped bricks such as hosted checkout or payment links fold into chapters about the mechanism beneath them. The model's own description says it does not attempt to describe either company's internal service topology, physical databases or cloud regions, which is why it can guide coverage and cannot support a claim.\n\n**Supporting claims**\n\n- **S1** — The planning model is a product and capability map of 29 bricks in four groups that describes no company's internal systems, so it guides coverage and is never a source for a fact.\n- **S2** — Every one of the 29 capabilities is sent to the chapters that treat it, with a grade, and every capability group has at least one chapter of its own.\n- **S3** — The capabilities the book treats in less than a chapter, and the parts of capabilities it leaves to sibling books, are named with the reason for each.\n- **S4** — The ten subjects the author set out to cover each have chapters, and that list, not the model, explains the book's order.\n- **S5** — The book adds what a product model has no capability for: how money moves between the parties, the mechanisms that make a retried or changed call safe, running the whole at scale, the journeys, the failure patterns and the company cases.\n\n## Role in the part\n\nOpens the reference part and sends a reader from a capability to its chapter, saying plainly what is covered briefly, left out or added, and that the planning model is not evidence. Supports PR-1 of part `reference`.\n\n## Flow\n\n**Pattern:** `large_to_small`\n\nWhat the model is comes first, because every table after it is read under the rule that the model is a map and not evidence. The whole map by capability follows, then the narrower questions a reader brings to it in turn: which capabilities get less than a chapter, whether the ten subjects the book set out to cover are all there, what the book added that the model lacks, and where a reader in a given seat should start. The added subjects come after the author's list because the list is the reason for most of them; putting the gaps before the map would list exceptions to a map the reader has not seen.\n\n## Introduction\n\n**Hook** (`direct_statement`): The planning model behind this book, last reviewed on 15 November 2026, lists 29 capabilities of payments and revenue infrastructure in four groups. None of the 29 is named for card clearing, a card vault, 3-D Secure, idempotency or API versioning, and this book gives each of those a chapter.\n\n**Bridge:** The reader has met capabilities, cards, terms and sources in the chapters, each where the argument needed it, and arrives with a system they own or a subject to look up. → The reference pages gather that material for lookup; this one sends a capability to its chapter and says what the book covers briefly, leaves out or added.\n\n**Thesis statement** (KEY POINTS callout and paragraph p01): Every capability of the 29-brick planning model has chapters that treat it and a grade; three are only mentioned and six get a section; the book adds what the model has no capability for; the model is a map, not evidence.\n\n**Roadmap** (IN THIS SECTION callout and paragraph p03):\n\n- What the planning model is and the rules for reading it. *Kept in:* model.\n- Tables that send each of the 29 capabilities to its chapters, group by group, with a grade. *Kept in:* by-capability.\n- What the book covers briefly or leaves out, why, and where to go instead. *Kept in:* brief.\n- The ten subjects the author set out to cover, each with its chapters. *Kept in:* author-list.\n- What the book added that the model has no capability for. *Kept in:* added.\n- A starting route for each of the model's five customer roles. *Kept in:* readers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The planning model lists 29 capabilities and none is named for clearing, a card vault, 3-D Secure, idempotency or API versioning, each of which has a chapter, so this page exists to send a job to its chapter and to say what was covered briefly, left out or added. |  |  |\n| p02 | transition | This page opens the four reference pages, which gather for lookup what the chapters introduce: coverage, the toolkit's sixteen cards, the glossary's terms with their Stripe and Adyen names, and the bibliography's dated sources. |  | `elaboration`: This page's purpose. → The other three reference pages and what each is for. |\n| p03 | transition | The page runs from what the model is, through the capability tables, the brief and left-out list, the author's ten subjects and the added subjects, to reading routes, and the argument itself lives in the introduction and the comparison chapter. |  | `sequence`: The four lookup pages. → The order of this page and where the argument lives instead. |\n\n## Sections\n\n### Where the Model Comes From\n\n**Controlling idea** (`definition`, id `model`): The model is the author's unpublished map of what a payments provider sells and which job each capability does, so three rules govern how the book uses it and how the tables are read.\n\n**Advances the thesis** (S1): Fixes what the model is and is not before any table relies on it.\n\n**Transition in:** `elaboration`: The planning model named in the opening. → What a Productscape model is and what this one contains.\n\n**Order of paragraphs** (`prerequisite_order`): What the model contains, then the rules that follow from it, then how a table row is read; each needs the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | A Productscape domain model describes customers, their needs, capabilities called bricks and the logical modules and records behind them; this one is the author's own, is not public, was reviewed on 15 November 2026 and has 29 bricks in four groups, beside product offerings, customer roles, logical records, stress scenarios and a comparison list of companies. | table: The four capability groups with their sub-groups and brick counts: Merchant Payments 7, Revenue Automation 7, Platform Money Movement 8, Shared Financial Foundations 7; total 29. Beside the bricks the model holds 7 product offerings, 5 customer roles in 4 groups, 48 logical records, 6 stress scenarios and a comparison list of 10 companies. |  |\n| p05 | claim (list) | Three rules follow from what the model is: nothing in it is a fact about a company, none of its figures is quoted in the book, and the running example is the book's own fiction. | quotation: The model's own description: it 'does not attempt to describe Stripe or Adyen's complete internal service topology, physical databases, cloud regions or universal legal rights', and its logical records and ownership 'are inferred from the modeled jobs'. | `cause_effect`: What the model is. → The rules that follow for the book. |\n| p06 | explanation | Each row names a brick by the model's key and grades the book's treatment in three levels (chapter, section, mention), with a fourth, not covered, that no whole brick needed; the grades were set by opening the chapters, not from the plan. |  | `sequence`: The rules. → How to read a row and what each grade means. |\n\n### Coverage by Capability\n\n**Controlling idea** (`description`, id `by-capability`): Of the 29 capabilities, 20 are the subject of at least one chapter, 6 get a section and 3 a mention, and every group has chapters of its own.\n\n**Advances the thesis** (S2): Gives the map from each capability to its chapters, with the grade.\n\n**Transition in:** `sequence`: How a row is read and graded. → The rows, group by group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | The tally is 20 chapters, 6 sections, 3 mentions and no brick left out, and the first two groups, merchant payments and revenue automation, show the pattern: mechanisms get chapters, product surfaces get less. | table: Merchant Payments (7 bricks: chck mention, elem section, pmlk mention, pmtd chapter, auth chapter, term chapter, rout chapter) and Revenue Automation (7 bricks: subs, usag, invo, taxx, revn, morc chapter; rpts section), each row with its chapters by permalink. |  |\n| p08 | description | The platform and shared-foundation groups complete the map: accounts, verification, splits, payouts, fraud, disputes, ledgers, reconciliation, webhooks and the developer platform each have a chapter, while issued cards, financing, financial accounts and delegated authority get a section and standalone identity verification a mention. | table: Platform Money Movement (8 bricks: acct, kycb, split, pyot chapter; issu, capm, tres section; iden mention) and Shared Financial Foundations (7 bricks: rada, disp, ledg, reca, webh, devx chapter; mand section), each row with its chapters. | `additional_support`: The first two groups. → The platform and shared-foundation groups. |\n\n### What the Book Covers Briefly or Leaves Out\n\n**Controlling idea** (`analysis`, id `brief`): Nine capabilities get less than a chapter and several parts of covered capabilities are left to sibling books, each for a stated reason.\n\n**Advances the thesis** (S3): Names what the map reaches only thinly or not at all, and why.\n\n**Transition in:** `contrast`: A map in which 20 capabilities have a chapter. → The nine that do not, and the parts left out.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | analysis | The nine capabilities below chapter level are product surfaces or separately licensed products, and the book treats each inside a chapter about the mechanism beneath it. | table: Capability, grade, where it stands, why: hosted checkout, payment links and standalone identity verification (mention); embedded payment fields, reporting and data export, issued cards, financing, financial accounts, delegated authority (section). |  |\n| p10 | analysis | Inside capabilities the book does cover, some parts are left out by decision, most of them because a sibling book owns them: posting payouts into an ERP's general ledger belongs to RECONCILED. | table: Part left out, the brick it belongs to, where to go instead, why: posting payouts and fees into the ERP general ledger (RECONCILED, payments-to-ledger); cart and order facts behind a checkout session (ORDERED, commerce-payments); agent-commerce protocols and agent permissions (ORDERED ai-and-agentic-commerce; Architecting Agentic Systems agent-identity-and-least-privilege); the accounting standards behind revenue recognition (RECONCILED accounting-for-architects); tax law and filing by country; a company's own treasury operations; dashboard users and operator roles. | `additional_support`: Whole capabilities treated briefly. → Parts of covered capabilities left to other books. |\n\n### The Ten Subjects the Book Set Out to Cover\n\n**Controlling idea** (`description`, id `author-list`): The book began from the author's list of ten subjects, not from the model, and each of the ten has chapters.\n\n**Advances the thesis** (S4): Checks the book against its own starting list and shows the list, not the model, set the order of the parts.\n\n**Transition in:** `contrast`: Coverage measured against the model. → Coverage measured against the list the book started from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | description | The ten subjects on the author's original list map onto the book's parts almost one to one, which is why the book is ordered by the path of the money and not by the model's product groups. | table: Ten rows, subject and chapters: payment lifecycle; acquiring, network connectivity, local methods, routing, orchestration; ledgers, money movement, reconciliation, payouts; API design (idempotency, versioning, webhooks, retries); tokenization, vaulting, PCI, network tokens; fraud, risk, 3DS and SCA; billing, subscriptions, invoicing, tax, revenue recognition; platform models; reliability, multi-region, consistency; where Stripe and Adyen made different bets. |  |\n\n### What the Book Added\n\n**Controlling idea** (`comparison`, id `added`): A product model says what a customer can buy and which job it does; the book adds what happens to the money, what makes a call safe to repeat or change, how the whole is run, and the stories and cases that join them.\n\n**Advances the thesis** (S5): Lists each added subject against what the model has in its place and names the chapter.\n\n**Transition in:** `cause_effect`: The ten subjects, most of which the model has no brick for. → What the book therefore added, subject by subject.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | comparison | Parts I, IV and VIII have few or no bricks behind them because a product brick does not state what happens to the money or why the obvious integration fails, which is what an engineer new to payments needs first. | table: What the model has, what the book adds, where: four history milestones in a tutorial vs the walk from cash to today's layers; six stress scenarios vs sixteen failure patterns; clearing and settlement inside other bricks vs Part I; no brick for acquiring and licenses, card vault and PCI scope, network tokens, 3-D Secure; idempotency and state named inside bricks vs chapters; no brick for API design and versioning; no brick for reliability, data stores, regions, peak load, safe change; one walkthrough vs four journeys; a comparison list of ten companies vs the two cases, the bets compared, three contrast cases and what is moving. |  |\n| p13 | comparison | The model's six stress scenarios are hypotheses about shocks, and the book has a nearest chapter for five of them and none for the sixth. | table: Six stress scenarios and the nearest chapter: a banking partner leaves a country (licences-and-safeguarding, acquiring-and-network-connectivity); a currency is redenominated under conversion controls (none); a platform's loss allocation changes (platform-payment-models); agents buy within delegated budgets (payments-what-is-moving); an instant-transfer and payee-verification duty changes payouts (payouts-and-money-movement, payments-what-is-moving); a merchant makes every processor a replaceable route (payment-routing-and-orchestration). | `example`: Stress scenarios replaced by failure patterns. → Where each of the six scenarios' subjects sits in the book. |\n\n### The Model's Customers and the Book's Readers\n\n**Controlling idea** (`description`, id `readers`): The model's five customer roles are the people the reader builds for, and each has a nearest seat at Larkfield and chapters to start with.\n\n**Advances the thesis** (S2, S5): Turns the map into reading routes and states the question the book adds to the model's customers' questions.\n\n**Transition in:** `additional_support`: What the book added to the model's capabilities. → How it uses the model's customers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | Each of the model's five customer roles maps to a seat in the fictional Larkfield cast and a short list of starting chapters. | table: Five roles (growth commerce lead, revenue operations lead, platform payments lead, platform seller and payout recipient, treasury and finance controller), what the model says each is responsible for, the nearest Larkfield seat (for example Priya Raman, Finance Controller; Ines Bakker of Studio Noord) and starting chapters. |  |\n| p15 | claim | The model's roles each ask about an outcome; the book's reader, the engineer, asks which record proves the outcome, and that question is what every chapter adds. |  | `contrast`: The five roles and their outcomes. → The engineer's question the book adds. |\n\n## Conclusion: One Map, Three Answers\n\n**Synthesis:** The tables give three different answers to one lookup: a chapter (the capability is a mechanism the book teaches), a section or a mention (it is a product surface on top of one), or another book (it belongs to the finance, commerce or agent side). The pattern across them is that the book is organized by what happens to the money and the model by what can be bought.\n\n**So what:** A reader who looks a system up by the job it does knows, before relying on the book, whether the answer is a chapter, a paragraph or elsewhere, and does not quote the model or this page for a fact about a provider.\n\n**Callback:** The opening's 29 capabilities, none named for clearing, a vault, 3-D Secure, idempotency or API versioning. The reader can now say why: those are mechanisms beneath the products, and the added-subjects table names the chapter for each.\n\n**Takeaway** (`course_of_action`): Match each system you own by the job it does, read the grade before the chapter, check the left-out list against your business, and treat the model as a map only; then continue to the toolkit.\n\n**Hand-off** to [Toolkit: Cards and Templates for Payment Architecture Decisions](toolkit.html): `sequence`: The map from capability to chapter. → The sixteen cards and templates those chapters introduce, each with a filled Larkfield example.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | synthesis | A lookup on this page ends in a chapter, a section or mention, or another book, and the difference follows from the book being organized by what happens to the money while the model is organized by what can be bought. |  |  |\n| p17 | transition | For the practical records the chapters introduce the reader continues to the toolkit, with the glossary for terms and the bibliography for sources. |  | `sequence`: The three kinds of answer. → The next reference page. |\n\n## Non-goals\n\n- Any fact about Stripe, Adyen or another provider, including how the two differ See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- The failure patterns themselves See [Paid Twice, Paid Never: Sixteen Ways Payment Systems Go Wrong](where-payment-systems-go-wrong.html).\n- Larkfield's cast, systems and incidents See [Meet Larkfield](meet-larkfield.html).\n- Templates and cards; definitions and the vocabulary crosswalk; sources See [Toolkit: Cards and Templates for Payment Architecture Decisions](toolkit.html), [Glossary: Plain-Language Definitions and a Stripe–Adyen Crosswalk](glossary.html), [Bibliography](bibliography.html).\n- The model's figures, strategy horizons, KPI definitions and vendor assessments\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Flow rubric notes not acted on (the author decides): move p13 (the six stress scenarios) into the brief and left-out section, since it reports coverage and one gap rather than an addition; merge p15 (the engineer's question) into the conclusion's synthesis; let p07 only tally and leave the reason for briefer treatment to p09.\n\n## Decision log\n\n- **2026-11-17** — Four grades (chapter, section, mention, not covered), set by opening each chapter and finding a section that treats the capability. A paragraph or a table row inside a section on a wider subject counts as a mention, so hosted checkout (one of four ways to collect a card in tokenization-vaulting-and-pci) is graded mention, not section. Rejected: Grading from the PLAN contracts, which would grade what was promised and not what was written.; ORDERED's five labels (covered, covered briefly, mentioned only, thin, left out), which mix a grade with a reason.\n- **2026-11-17** — One row per brick, in the model's group order, with the model's four-letter key kept so the count of 29 can be checked on the page. Rejected: Merging bricks into topic rows grouped by the book's parts, as ORDERED's page does for 152 capabilities; with 29 a row per brick is short enough and makes every number checkable.\n- **2026-11-17** — The author's ten-subject list is a section after the gaps and before the added subjects, because the list is the cause of most additions. Rejected: Placing it first, which would put the book's own list before the model the page is named for.\n- **2026-11-17** — No illustration: the style guide gives reference pages none, and the page is tables. Rejected: One coverage-map figure.\n- **2026-11-17** — The model is described as the author's own unpublished planning input and named without a path or link; companies on its comparison list are named only to say which have a chapter. Rejected: Listing the model's path under Sources, as ORDERED's page does.\n\n## Sources\n\n- **Internal**\n  - The author's Productscape domain model of payments and revenue infrastructure (not public), reviewed 2026-11-15 — The 29 bricks in four groups, the offerings, customer roles, logical records, stress scenarios, comparison list and the model's own statement of its limits.\n  - posts/*/index.md — The written chapters each capability was checked against.\n  - PLAN.md — The page's contract and the 68-page structure.\n  - _research/style-guide.md — Reference page format, valid permalinks and the allowed links to sibling books.\n  - _research/scenario-ledger.md — The Larkfield cast used for the reader seats.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 96 claims checked against the model's files and the chapters (92 confirmed, 4 corrected, 0 hedged, 0 unsupported and removed, 0 unreachable); the 'why' for financing no longer says the embedded-finance chapter calls itself short, which it does not. Wording only; no unit added, dropped or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — First version, written from the PLAN contract, the planning model and the written chapters.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
