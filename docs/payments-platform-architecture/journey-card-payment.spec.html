<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The twelve steps of the path on which nothing fails (checkout, tokenization, risk scoring, authentication, authorization, capture, clearing, settlement, ledger entries, split, payout, reconciliation) and, for each, the party that acts, the message or record it leaves, the promise made and the failure that can occur there, with the chapter that owns it.\n- **Know:** The canonical figures: €120.00 paid with a Dutch Visa debit card held in a phone wallet; approved and captured automatically at 19:42 on Tuesday 9 March 2027; Larkfield's fee €2.53 and the studio's €117.47; the payout that contains it sent on Thursday 11 March.\n- **Know:** How the same steps are recorded on each provider as documented in 2026: on Adyen a result code, then webhooks keyed by the PSP reference, then report lines, with no endpoint in the Checkout API that returns a payment by its identifier and no webhook when a payment settles; on Stripe a PaymentIntent with a status, a balance that moves from pending to available, and a payout object.\n- **Know:** Where the public record stops: the card networks' settlement cut-off times and cycles, and whether Stripe's standard payout schedule makes funds available before Stripe has received them (Stripe documents paying ahead only for Instant Payouts).\n- **Believe:** 'Payment successful' is a true statement about the issuer's authorization and says nothing about the eleven steps around it.\n- **Believe:** A payment is finished when the payout has been matched to the provider's settlement record, and reopenable for months after that.\n- **Be able to:** Fill in the step table for a card payment in their own system and name, for each row, the record that confirms the row before it.\n- **Be able to:** Decide for each state in their own payment vocabulary which provider record justifies entering it, on Adyen and on Stripe.\n\n**Audience:** A software engineer or architect who integrates or operates card payments through a provider and wants to see one payment whole, with every record it leaves.\n\n**Already knows:**\n\n- The six-step overview of a card payment and its parties (journey-of-a-payment), and the mechanisms of Parts I to VIII, each from its own chapter.\n- Larkfield, its payment record store, ledger, reconciliation job and the Keel decisions (meet-larkfield).\n- The part introduction's claim that payments go wrong at hand-offs, and the step table's five columns.\n\n**Does not yet know:**\n\n- Which record each of the twelve steps leaves on Adyen and on Stripe, and which later record confirms it.\n- At which steps an approved payment can be lost with no error on the day.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a payment that was approved and never reached the merchant, the reader lists the steps at which it can be lost without an error on the day, and the later record that shows each. *Probe:* A bike-rental app marks a €45 rental 'Paid' when the provider's API returns an approved authorization (the card issuer's agreement to honor the amount). The app collects the amount later, when the bike is returned. Nine days afterwards, support finds that the rental never appeared in any payout to the shop. Using only this chapter: at which steps could the money have been lost with no error on the day, and which record would have shown each loss? | `custom` | cold_reader | major |\n| AC-2 | The reader can say, for at least two steps, which record an integration should wait for on Adyen and which on Stripe. *Probe:* The same €120 pass is bought at a studio whose payments run on Stripe instead of Adyen. Using only this chapter: name two steps of the journey at which the record an integration should rely on differs between the two providers, and say what each provider gives at that step. | `custom` | cold_reader | major |\n| AC-3 | Every row of the step table names a party, a record, a promise and a failure, and links the failure to the chapter of Parts I to VIII that owns the mechanism, so a reader can go from any step to its full explanation. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What happens to Mila's €120, step by step and party by party, between her tap at 19:42 on 9 March 2027 and Studio Noord's reconciled payout, and what does each step promise?\n\n> **Claim:** Between Mila's tap at 19:42 on Tuesday 9 March 2027 and Studio Noord's payout on Thursday 11 March, her €120 passes through twelve steps. The first eleven each end in a promise by the party that ran them; only the twelfth, matching the payout to the provider's settlement record, establishes that the studio's €117.47 arrived. The 'Payment successful' on her screen reports the fifth step, the issuer's authorization. The losses on this path are the ones a step's own success message cannot report: an authorization that expires before capture, a capture the scheme rejects days later, a payout the bank returns.\n\n**Disputed by:** The view that a card payment is one request with one result: once Adyen answers 'Authorised' or a Stripe PaymentIntent is 'succeeded', the payment is done, and everything after it is the provider's internal bookkeeping, which an integrator can safely ignore.\n\n**So what:** A team that accepts this decides, for each state in its own payment vocabulary, which provider record justifies it, and keeps a state for 'promised, not yet confirmed'. Larkfield's Keel program adds the two checks this journey calls for: a job that sweeps every payment still pending against the provider's record (K2) and a reconciliation of both providers' reports against the ledger, run when each provider's reports are ready (K3).\n\n**How and why:** The twelve steps belong to different parties on different clocks. The wallet's device token, the provider's risk score, the authentication on Mila's phone and the issuer's approval take seconds; clearing, network settlement and the bank transfer of the payout take days. Each step passes the next a reference and its own result, which is all it knows. On Adyen, as documented in 2026, the Checkout API has no endpoint that returns a payment by its identifier: the integration gets a result code, then webhooks keyed by the PSP reference, then reports; a CAPTURE webhook marked successful can be followed days later by CAPTURE_FAILED, and no webhook is sent when a payment settles. On Stripe there is one PaymentIntent with a status that can be fetched, a balance that moves from pending to available, and a payout object. Adyen for Platforms settles funds to balance accounts after the sales day and a settlement delay, independent of when the schemes pay Adyen; Stripe publishes an availability schedule and documents paying ahead only for Instant Payouts; for standard payouts its services terms (28 September 2026) count a network's failure to settle to Stripe as a 'Payout Delay' and do not say whether its own receipt of funds otherwise comes first. Cut-off times and settlement cycles of the card networks are not in the public rule texts, so the walkthrough gives the clearing and settlement rows as a documented sequence and labels their timing as industry practice.\n\n**Supporting claims**\n\n- **S1** — The path with no failure has twelve steps run by different parties on different clocks, and each passes the next only a reference and its own result.\n- **S2** — The first five steps (checkout, tokenization, risk scoring, authentication, authorization) take about two seconds, and the 'Payment successful' on Mila's screen reports the fifth, the issuer's promise to honor a claim for a limited number of days.\n- **S3** — Steps six to eleven take days and each reports that something was accepted, booked or sent; only the twelfth, the match of the payout against the provider's settlement record, checks those promises against another party's record.\n- **S4** — Adyen and Stripe record the same twelve steps differently, as documented in 2026: Adyen as a result code, webhooks keyed by a PSP reference and report lines; Stripe as a PaymentIntent with a fetchable status, a balance that moves from pending to available and a payout object.\n- **S5** — The losses on this path are the ones a step's own success message cannot report (an authorization that expires before capture, a capture the scheme rejects later, funds held or set off in the balance, a payout the bank returns), so a payment system needs a state for 'promised, not yet confirmed', a sweep of that state and a daily reconciliation.\n\n## Role in the part\n\nWalks the recurring payment through all twelve steps once on Adyen and once on Stripe, sets up the step table that the other three journeys reuse, and shows on a payment with no failure that the customer's success message and the merchant's money are seven steps and at least two days apart. Supports P9-1, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `comparison` in on-stripe: the same twelve steps set against the Adyen walkthrough; `problem_solution` in silent-losses: the losses first, then the state and the two checks that catch them)\n\nThe body follows the payment in time: the scene fixes the reading question and the references, then the three stretches walk the twelve steps in the order the payment meets them (two seconds, two days, the books). The table comes after the walkthrough because each cell restates something the reader has just seen with its source; placed first it would be twelve rows of terms not yet tied to Mila's payment. The Stripe replay needs the Adyen walkthrough as its baseline, since it says only where the record differs. The silent losses come last because each is a hand-off the reader has seen working on both providers, and naming the confirming record for a loss needs both versions. Move the Stripe section before the table and the table could no longer be read as the Adyen path; move the losses before the walkthrough and the reader would meet failures of steps not yet shown.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At 19:42 on Tuesday 9 March 2027 Mila Janssen's phone says 'Payment successful' for a €120.00 class pass. Five steps lie behind that message and seven are still ahead, and Studio Noord's €117.47 will not be established as arrived until a job at Larkfield matches a payout against a report. Which of the twelve steps did the message report?\n\n**Bridge:** The reader has met each mechanism in its own chapter and has the part introduction's claim that payments go wrong at hand-offs. → Walking one payment on which nothing fails through all the mechanisms in order shows every hand-off working, and shows what each one passes on and what it leaves out.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): Between Mila's tap at 19:42 on Tuesday 9 March 2027 and Studio Noord's payout on Thursday 11 March, her €120 passes through twelve steps. The first eleven each end in a promise by the party that ran them; only the twelfth, matching the payout to the provider's settlement record, establishes that the studio's €117.47 arrived. The message on her screen reports the fifth.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start at Larkfield, where every record of one payment is laid out with the references that tie the records together. *Kept in:* scene.\n- Follow the first five steps, which fit in two seconds and end in the answer Mila sees. *Kept in:* two-seconds.\n- Follow capture, clearing and settlement, which take days and send Larkfield almost nothing. *Kept in:* days.\n- Follow the ledger entries, the split, the payout and the reconciliation that closes the payment. *Kept in:* books.\n- Set all twelve steps in one table with the promise each makes and the failure each can hide. *Kept in:* step-table.\n- Replay the same pass on Stripe and name the steps at which the record to wait for differs. *Kept in:* on-stripe.\n- List where an approved payment can be lost with no error on the day, and the checks that catch it. *Kept in:* silent-losses.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At 19:42 on Tuesday 9 March 2027 the message on Mila's screen is true, and it reports the fifth of twelve steps her €120.00 must pass, the other seven taking from one second to two weeks. | scenario: Mila's class pass: Tuesday 9 March 2027, 19:42, a ten-class pass for €120.00 at Studio Noord (on Adyen), Dutch Visa debit card in her phone's wallet; Larkfield introduced as fictional. The part introduction's claim that payments go wrong at hand-offs is picked up in the first sentence. |  |\n| p02 | claim | The twelve steps run from the tap to the payout on Thursday 11 March: the first eleven each end in a promise by the party that ran them, and only the twelfth establishes that the studio's €117.47 (the €120.00 less Larkfield's fee of €2.53) arrived; the steps are numbered by hand-off, not by the clock. |  | `problem_solution`: The question of which step the message reported. → The answer and the chapter's claim: twelve steps, eleven promises, one check. |\n| p03 | explanation | This journey teaches no new mechanism: it puts the mechanisms of the earlier chapters in the order one payment meets them, on a payment where nothing fails, so that what passes at each hand-off can be seen. | reasoning: Chapter 1 (journey-of-a-payment) gave the same payment as six steps seen from the banks' side; this page adds the steps that happen in the provider's and Larkfield's systems (checkout, tokenization, risk scoring, authentication, ledger entries, the split, reconciliation) and names the record and reference at each. | `elaboration`: The claim that eleven steps end in promises. → What kind of chapter this is and how it relates to the six-step overview. |\n| p04 | context | This chapter covers the whole of Mila's class pass, from the tap at 19:42 on Tuesday 9 March 2027 to the payout of Thursday 11 March and the day Larkfield marks that payout arrived. | scenario: Ledger: approved and captured at 19:42 on 9 March; payout on Thursday 11 March; payout marked arrived on Thursday 25 March (addition by 14-payouts-and-money-movement). | `example`: The twelve steps as a claim. → The stretch of Mila's payment the chapter covers. |\n| p05 | transition | The chapter goes from a scene at Larkfield through three stretches of the payment (two seconds: steps one to five; two days: capture, clearing and settlement; the books: ledger entries, split, payout and match), then sets the twelve steps in one table, replays the pass on Stripe and ends with the places where an approved payment is lost without an error. |  | `sequence`: The payment the chapter follows. → The order of the chapter's sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: One Payment, Every Record\n\n**Controlling idea** (`example`, id `scene`): Laid out in full, one ordinary payment is a set of records held by several systems under several references, and the walkthrough reads each record for what it promises and what later confirms it.\n\n**Advances the thesis** (S1): Shows before any step is walked that the payment exists as many records with different owners and keys, which is why hand-offs need a shared reference.\n\n**Transition in:** `example`: The introduction's claim that each step ends in a promise. → A review at Larkfield in which every record of Mila's pass is put on one page.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In late March 2027 Femke de Graaf and Tom Hendriks lay out every record that exists of Mila's pass and find that no single system holds the payment. ing more.\n\n**Transition in:** `sequence`: The references and the reading question. → The first stretch of the payment: the five steps before the answer.\n\n**Order of paragraphs** (`chronological`): The five steps in the order the request meets them; the closing paragraph can only say what the screen reports once all five have been walked.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | process | Step 1, checkout: before any provider is called, the payment service writes a `pending` row with Larkfield's own payment ID and an idempotency key, so the request that leaves carries a reference Larkfield already holds. | scenario: Ledger K1 and additions by 17-api-design-and-object-models and 18-idempotency-and-retries: a Larkfield payment ID written before any provider call and sent as Adyen's `reference`; a row with the idempotency key, a request fingerprint, the time of first send and state `pending`. The request also carries the split instruction (addition by 35-splits-balances-and-platform-payouts).; fact: Adyen: idempotency keys 'are valid for a period of 7 to 14 days after first submission' (https://docs.adyen.com/development-resources/api-idempotency, n.d., accessed 2026-11). Stripe keeps keys for at least 24 hours (https://docs.stripe.com/api/idempotent_requests, n.d., accessed 2026-11). |  |\n| p09 | process | Step 2, tokenization: Mila's wallet hands over a device token and a one-time cryptogram in place of her card number, so nothing that reaches Larkfield could be used to charge her again. | quotation: Adyen: 'Apple Pay uses network tokenization, stores payment information securely in the shopper's Apple Pay eligible device, and confirms the payment through Touch ID or Face ID authentication.' Google's developer guide: its API returns cards on file (`PAN_ONLY`) 'or a device token on an Android-powered device authenticated with a 3-D Secure cryptogram (`CRYPTOGRAM_3DS`)' (https://developers.google.com/pay/api/web/guides/tutorial, n.d., accessed 2026-11).; scenario: Ledger K4 (card numbers never touch Larkfield); the stored card behind Mila's membership dates from 12 January 2027 and is not used for the pass (ruling 14). | `sequence`: The request leaving Larkfield with its own reference. → What the request carries in place of a card number. |\n| p10 | process | Step 3, risk scoring: Adyen's risk checks run before Mila's bank is asked, and a pass is a judgement that the payment did not cross a block threshold, not a finding that it is genuine. | quotation: Adyen: 'Pre-authorization: the risk rule conditions are assessed before the payment is authorized. This saves issuer and scheme fees compared to blocking after authorization.' (https://docs.adyen.com/risk-management/configure-your-risk-profile, n.d., accessed 2026-11). Refusal reason 20, FRAUD: 'The pre-authorization risk checks resulted in a fraud score of 100 or more.' (https://docs.adyen.com/development-resources/refusal-reasons, n.d., accessed 2026-11). Stripe records a risk block on the charge as `network_status: not_sent_to_network`, `type: blocked` (https://docs.stripe.com/radar/risk-evaluation, n.d., accessed 2026-11). | `sequence`: The token and cryptogram arriving at the provider. → The provider's own decision before it asks the bank. |\n| p11 | process | Step 4, authentication: the check that Mila is the cardholder was done by her phone before the request was sent, so it reaches the issuer as data inside the authorization request and no 3-D Secure challenge runs. | quotation: Adyen: 'If you are implementing in Europe, Apple Pay is PSD2 SCA-compliant.' and 'Apple Pay supports liability shift for American Express, Discover, JCB, Mastercard, and Visa cards.'; scenario: Ledger: the wallet authenticates Mila on the device (fingerprint), no 3-D Secure challenge; addition by 25-3ds-and-sca: three fields per card payment (authentication outcome, exemption requested, liability shift expected) and the loss table row 'wallet payment: issuer'. | `contrast`: The provider's risk decision, made during the request. → A step that finished before the request began and travels inside it. |\n| p12 | process | Step 5, authorization: Mila's bank approves through Visa, Adyen returns the result code `Authorised` with a PSP reference, and Larkfield's row stays `pending`, its state for promised and not yet confirmed, until the `AUTHORISATION` webhook moves it to `paid`. | quotation: Adyen: 'Although you can use the payment result from the API, we recommend that you rely on the webhook to trigger any business logic'. Adyen result codes page: 'The status of a payment can sometimes change after you get the result code, so we recommend that you do not use the result code to update your order management system.' (https://docs.adyen.com/online-payments/build-your-integration/payment-result-codes, n.d., accessed 2026-11).; fact: Visa Core Rules, edition of 24 October 2026, Table 5-11: a cardholder-initiated card-absent transaction must be processed within 10 calendar days of a valid authorization (https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf). | `sequence`: The authentication data and the risk pass. → The issuer's decision and the two records it produces at Larkfield. |\n| p13 | analysis | The 'Payment successful' on Mila's screen reports step five alone: a bank's promise to honor a claim, with €120 reserved in her own account and no money moved. | reasoning: Of the six records so far, Larkfield holds one row and one stored webhook; the token is the wallet's, the risk result the provider's, the approval and the hold the issuer's.; figure: Conceptual figure: twelve numbered stepping stones in a row, a phone with a check mark standing on stone 5 and a studio's bank building at stone 12 (placeholder 42-message-at-step-five). | `conclusion_summary`: The five steps walked. → What the answer on the screen does and does not cover. |\n\n### Tuesday Night to Thursday: Capture, Clearing and Settlement Send No Message\n\n**Controlling idea** (`process`, id `days`): The three steps that turn the approval into money between banks are the ones Larkfield hears least about: the capture has no event of its own, clearing and settlement have none at all, and the networks do not publish their timing.\n\n**Advances the thesis** (S1, S3): Walks steps six to eight and shows that each is reported, if at all, as accepted or submitted, with the confirming record arriving later or never.\n\n**Transition in:** `time`: The approval at 19:42 and the row marked `paid`. → What happens to the claim over the next two days, mostly out of Larkfield's sight.\n\n**Order of paragraphs** (`chronological`): Capture, clearing and settlement in the order they occur; the paragraph on where the public record stops comes last because it qualifies the timing of the two steps before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | process | Step 6, capture: Adyen submits the claim automatically within the same second as the approval and sends no separate event for it, and whether the claim holds is known only days later, because the card scheme can still reject it. | quotation: Adyen: 'By default, payments are captured automatically without a delay, immediately after authorization of the payment request.'; 'A payment that is automatically captured does *not* trigger a separate CAPTURE webhook.'; a CAPTURE webhook with success true means the request 'is valid (for example, the authorization has not expired, and the balance is available) and has been submitted to the bank/third-party processor'; 'In rare cases, a capture fails even after you received a CAPTURE webhook with success: true ... This can even happen a few days after you submitted the capture request.' Webhook types page: 'Technical failures are automatically re-captured by Adyen within 10 business days.'; scenario: Ledger addition by 08-payment-state-machines: with automatic capture the row becomes `paid` on AUTHORISATION success; `paid` means 'the provider has confirmed the capture', never 'settled'; a late CAPTURE_FAILED moves the row back to `authorized`. |  |\n| p15 | process | Step 7, clearing: the acquirer presents a clearing record to Mila's bank through Visa, which fixes the final amount and the fee her bank keeps, and no record of it reaches Larkfield. | fact: Visa Core Rules (24 October 2026) define a presentment as 'A Clearing Record that an Acquirer presents to an Issuer through Interchange'. Regulation (EU) 2015/751 caps consumer debit interchange at 0.2%: at most €0.24 on €120.00 (ledger addition by 05-payment-economics, assumed charged in full).; reasoning: That Adyen N.V. is the acquirer of record is an inference (ledger addition by 01-journey-of-a-payment): Adyen's EMEA license page says Adyen N.V.'s authorisation includes cross-border acquiring in all EEA countries, and its documentation lists the regions where it has its own acquiring connection; no page lists the acquiring entity per country (ruling 27). | `sequence`: The claim submitted by the provider. → The claim as a record presented to the issuer through the network. |\n| p16 | process | Step 8, settlement: Visa transfers one net amount per member bank per day, so Mila's €120 moves inside a total, and Adyen sends no webhook when a payment settles. | quotation: Visa Core Rules: settlement amounts are 'The daily net amounts expressed in a Member's Settlement Currency resulting from Clearing'. Adyen: 'Adyen does not send a webhook message when a payment settles successfully.'; quotation: Adyen for Platforms: 'If Adyen does not receive the funds within 30 days after a payment's capture, we subtract those funds from the current settlement batch.' | `sequence`: The clearing record. → The money that follows it, as a net amount between banks. |\n| p17 | explanation | The public record stops at the timing of steps seven and eight: Visa's rule text gives no settlement cut-off times and no number of cycles a day, so the Tuesday-night and Wednesday timing in this walkthrough is industry practice and an assumption. | fact: Visa Core Rules (24 October 2026) define Settlement Date, Settlement Bank and Settlement Currency; cut-off times and cycles per day were not found in the rule text (established in clearing-and-settlement). | `contrast`: The sequence of clearing and settlement, which is documented. → Their timing, which is not. |\n\n### Wednesday to Thursday 25 March: Entries, the Split, the Payout and the Match\n\n**Controlling idea** (`process`, id `books`): The last four steps happen in books and bank transfers: Larkfield writes its ledger entries from the provider's report, the split becomes funds in two balance accounts, the payout is sent, and the reconciliation is the first step that checks any earlier promise against a record from another party.\n\n**Advances the thesis** (S3, S5): Walks steps nine to twelve and shows that booked and sent are still promises, and that the match against the settlement record is what closes the payment.\n\n**Transition in:** `time`: Clearing and settlement, which left Larkfield no record. → The first records that do arrive after the approval: report lines, bookings and a payout.\n\n**Order of paragraphs** (`chronological`): The four steps in the order their records appear, from the report of Wednesday morning to the payout marked arrived on 25 March; the dispute window comes last because it outlasts all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | process | Step 9, ledger entries: when Adyen's batch for the sales day of 9 March closes, Larkfield's reconciliation job (the one that does the matching at step 12, started on Adyen's report-ready signal) writes the payment into Larkfield's ledger from the report lines, under the PSP reference and Larkfield's own event ID. | quotation: Adyen: 'For Sales day indow closes with no return).; reasoning: Every earlier success (Authorised, the automatic capture, the booked split, the booked payout) was reported by the party that performed the step; the settlement record and the bank's silence are the first evidence from outside that party. | `contrast`: A payout reported as sent. → The step that checks it, and the others, against the provider's settlement record. |\n| p22 | explanation | After the twelfth step the payment is finished and still reopenable: Mila can dispute it through her bank until about 7 July 2027, so the row and its ledger entries must stay correctable for months after the payout. | scenario: Ledger addition by 01-journey-of-a-payment: the basic card dispute window is taken to close on 7 July 2027 (120 calendar days from 9 March; the author's arithmetic). The €84.00 refund of 18 March (Journey 3) is the first reopening. | `contrast`: The payment as closed by reconciliation. → The window in which it can still be reopened. |\n\n### The Twelve Steps in One Table\n\n**Controlling idea** (`synthesis`, id `step-table`): Set side by side, the first eleven steps each end in a promise by the party that ran them, and each has a failure that its own success message cannot report.\n\n**Advances the thesis** (S1, S3, S5): Collects the walkthrough into the step table the other journeys reuse, with the promise and the hidden failure per row and the chapter that owns each mechanism.\n\n**Transition in:** `conclusion_summary`: The twelve steps walked in three stretches. → The same steps as one table with the promise and the failure of each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | synthesis | The step table gives, for each of the twelve steps on Adyen, the party or system that acts, the message or record it leaves, the promise that record makes and the failure that can occur there, with the chapter that owns the mechanism. | table: Step table with columns Step \\| Party or system \\| Message or record \\| Promise made \\| What can fail here → chapter; twelve rows (checkout, tokenization, risk scoring, authentication, authorization, capture, clearing, settlement, ledger entries, split, payout, reconciliation), each failure linked to its chapter in Parts I to VIII.; figure: Sequence-style figure: six lanes (member's phone, platform, provider, card network, member's bank, studio's bank) with twelve numbered arrows in order, grouped under three time bands (placeholder 42-twelve-step-sequence). |  |\n| p24 | analysis | Read downward, the table shows that the record confirming a row is always in a later row and usually arrives on another channel: the approval is confirmed by the report line, the split by the accounting report, the payout by the match and the passing of the return window. | reasoning: Authorization (response and webhook) is confirmed by the capture's survival and the settlement report line; capture by the absence of CAPTURE_FAILED and the report line; the split by the Balance Platform Accounting Report; the payout by reconciliation and the return window. Clearing and settlement have no confirming record on the merchant's side at all. | `elaboration`: The table's rows. → How to read down it: which later record confirms each row. |\n\n### Had Studio Noord Been on Stripe: The Same Steps, Other Records\n\n**Controlling idea** (`comparison`, id `on-stripe`): On Stripe the same pass passes the same twelve steps and leaves different records: an object whose status can be read again, a balance transaction with a date, and a payout object, so the record an integration waits for changes at three hand-offs.\n\n**Advances the thesis** (S4): Replays the payment on the second provider and names where the confirming record sits in a different place and form.\n\n**Transition in:** `contrast`: The twelve steps as recorded on Adyen. → The same twelve on Stripe, where the records take another form.\n\n**Order of paragraphs** (`comparison`): The table of records first, then the dated replay it summarizes, then the three hand-offs where an integration must behave differently, and last the points on which Stripe's public record is silent, which qualify the comparison.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | comparison | Step by step, Stripe replaces Adyen's result code, webhooks and report lines with a PaymentIntent, a Charge, a balance transaction and a payout, each an object with an identifier and a status. | table: Table: Step \\| On Adyen (as it happened) \\| On Stripe (had it been) for the steps whose record differs: checkout (reference vs PaymentIntent created by the server), authorization (result code and AUTHORISATION webhook vs status `succeeded`, read back), capture (no event; CAPTURE_FAILED possible vs status, nothing published on later failure), ledger entries (report lines vs balance transaction with amount, fee, net), split (splits array and balance accounts vs destination charge with application fee), funds (sales-day batch after settlement delay vs pending to available at `available_on`), payout (transfer `booked` vs Payout `paid`, possibly `failed`), reconciliation (batch and accounting report vs payout reconciliation report by payout ID). |  |\n| p26 | example | Replayed on Stripe, Mila's pass is a destination charge that reads `succeeded` at 19:42, whose funds become available on Friday 12 March and are paid out from then on. | scenario: Ledger additions by 33-platform-payment-models (legacy Custom connected accounts; destination charges with `on_behalf_of` and an application fee equal to Larkfield's fee), 08 (on Stripe a row moves only after the PaymentIntent is re-read), 03 (Dutch default of 3 business days from capture: available Friday 12 March) and 05 (blended rate 0.6% + €0.15, an assumption: €0.87, leaving Larkfield €1.66).; quotation: Stripe: 'Stripe uses \"T\" to refer to the transaction time, which indicates the time of the original payment confirmation or capture'; 'Funds in a Balance transition from `pending` to `available` at the corresponding available_on time for each balance transaction.'; Netherlands: 7 calendar days initially, 3 business days by default. | `example`: The table of records. → The pass replayed on Stripe with its dates and amounts. |\n| p27 | analysis (list) | The record to wait for differs at three hand-offs: the outcome of the payment, the capture, and the moment funds reach the studio's balance. | fact: Outcome: Stripe's PaymentIntent can be retrieved by its ID at any time; Adyen's Checkout API specification, version 72, has three GET operations (/paymentLinks/{linkId}, /sessions/{sessionId}, /storedPaymentMethods), none returning a payment (https://github.com/Adyen/adyen-openapi, accessed 2026-11). Capture: Adyen documents CAPTURE_FAILED after a success; Stripe's pages do not say whether a capture can fail later. Funds: Stripe moves each transaction from pending to available on a schedule counted from capture; Adyen settles a sales day's batch after a settlement delay and sends no webhook when a payment settles. | `cause_effect`: The different records on the two providers. → What an integration must wait for at each of three hand-offs. |\n| p28 | explanation | Stripe's public pages leave a gap on two points this journey depends on; the first is the capture: they do not say whether a capture can be rejected by the network after the status reads `succeeded`, and Stripe's own two sentences on `succeeded` do not close it. | quotation: Stripe lifecycle page on `succeeded`: 'the corresponding payment flow is complete. The funds are now in your account and you can confidently fulfill the order.' Stripe payment methods page: 'A `succeeded` status indicates that the payment completed successfully according to the payment method's processing flow, but funds can still be refunded, disputed, returned, or reversed.' | `contrast`: What the two providers document. → What Stripe does not document, and how the chapter treats the silence. |\n| p28b | explanation | The second gap is the money: for standard payouts Stripe's services terms count a network's failure to settle to Stripe as a 'Payout Delay' without saying whether funds otherwise become available before Stripe has received them, and Stripe documents paying ahead only for Instant Payouts; Adyen's terms say it pays irrespective of receipt, which its Annual Report 2025 ('default setup': only after funds are received) does not reconcile. | fact: Adyen documents paying ahead of the network: its Sales Day Payout Terms of Service (last update 17 June 2024) say it initiates payout 'irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner' (https://www.adyen.com/legal/sales-day-payout-terms-of-service). Adyen's Annual Report 2025 (risk section) calls paying 'only after funds have been received' the 'default setup'; public text does not reconcile the two (ruling 47m). Stripe documents paying ahead only for Instant Payouts (ruling 18); its services terms (last modified 28 September 2026, https://stripe.com/legal/ssa-services-terms) define a 'Payout Delay' to include 'a delay or failure of a Financial Provider to settle a Transaction to Stripe' and state no pre-financing (ruling 47e). | `sequence`: The first of the two gaps, the capture. → The second gap, whether funds are paid before the provider has received them. |\n\n### Where an Approved Payment Is Lost Without an Error\n\n**Controlling idea** (`analysis`, id `silent-losses`): An approved payment can fail to reach the merchant at four steps without any error on the day, and each loss is shown only by a later record, which is why Larkfield's two Keel checks are a sweep of unconfirmed payments and a daily reconciliation.\n\n**Advances the thesis** (S5): Names the losses the thesis lists, the record that reveals each on both providers, and the checks that follow from them.\n\n**Transition in:** `contrast`: A payment on which every hand-off worked, on both providers. → The same hand-offs when the promise is not kept and nothing says so on the day.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | analysis | The four silent losses sit at capture, after capture, at funding and at payout, and in each case the step's own success message was true when it was sent. | table: Table: Where \\| What happens \\| Why no error on the day \\| The record that shows it (Adyen; Stripe). Rows: an authorization that expires before a delayed capture (Visa: 10 days; Stripe sets the PaymentIntent to `canceled`; Adyen sends EXPIRE, or a late capture fails); a capture the scheme rejects later (Adyen CAPTURE_FAILED and a CaptureFailed report entry; Stripe: not public); funds held or set off in the balance against refunds, a deposit or reserve, or a negative balance (accounting report and settlement details report; balance transactions); a payout the bank returns (Adyen transfer `returned`; Stripe Payout `paid` then `failed` within 5 business days). |  |\n| p30 | recommendation | Larkfield's answer is a state that means 'promised, not yet confirmed' with two checks behind it: a job that sweeps every payment still in that state against the provider's record (K2) and a reconciliation of both providers' reports against the ledger, run per provider when its reports are ready (K3). | scenario: Ledger K2 and K3; addition by 08 (`paid` means the provider has confirmed the capture, never settled; an unknown status is raised for review) and by 15 (open items older than five business days go to Priya Raman's weekly review). | `problem_solution`: Four losses that no success message reports. → The state and the two checks that catch them. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The three stretches of the walkthrough are three kinds of evidence: in the first two seconds every party answers and each answer is a promise; in the next two days nobody answers at all; in the last stretch the answers are bookings and a transfer marked sent. Nothing in the first eleven steps is a check of an earlier one. The payment's truth is therefore not in any step: it is in the twelfth, where Larkfield compares what it was told with what the provider's settlement record and the bank show.\n\n**So what:** A team that accepts this stops treating 'Authorised' or `succeeded` as the end of a payment. It decides, state by state, which provider record justifies each word in its own vocabulary, keeps a state for 'promised, not yet confirmed', sweeps it, and reconciles every day; and it knows that the record to wait for is a different one on Adyen and on Stripe.\n\n**Callback:** The 'Payment successful' on Mila's screen at 19:42 and the question of which step it reported. The reader can now say it reported the fifth of twelve, name the seven that followed, and say which record at Larkfield confirmed each, up to the payout marked arrived on 25 March and the window that stays open until July.\n\n**Takeaway** (`course_of_action`): Fill in the twelve-row step table for one card payment in your own system; for every row write the record that confirms the row before it and the provider record that justifies your own state, and start work where that cell is empty.\n\n**Hand-off** to [Journey 2: A Membership Renewal That Fails, and Comes Back](journey-failed-renewal.html): `contrast`: Journey 1's twelve steps on a payment that Mila started herself and that was approved the first time. → The same member and the same stored card with two things removed: Mila is not present when the charge is made, and the issuer says no. The steps that replace authentication and approval are a decline code, a schedule and a notice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | synthesis (list) | Established: the provider's synchronous answer is not the record to act on, a payout can fail after it was reported as sent on both providers, a capture can be rejected after it was accepted on Adyen, and funding runs on the provider's own schedule. |  |  |\n| p32 | synthesis (list) | Depends on context: which record justifies a state, when funds reach the seller and how a capture failure appears all depend on the provider and on the account's settings. |  | `contrast`: What both providers document. → What changes with provider and configuration. |\n| p33 | recommendation (list) | The author's synthesis: a card payment is finished at the twelfth step and final only when the dispute window closes, so the cheapest reliability work is at the hand-offs: one reference, one unconfirmed state, a sweep and a daily match. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p34 | recommendation (list) | Eight questions let the reader walk a card payment of their own through the step table. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own system. |\n| p35 | transition | Mila's pass had her present and her bank saying yes; the next journey keeps the member and the card and removes both, following a renewal that is declined on the first of the month. |  | `contrast`: Twelve steps on a payment the customer started and the issuer approved. → A payment the merchant starts alone and the issuer refuses. |\n\n## Non-goals\n\n- How any of the twelve mechanisms works inside: authorization messages and codes, capture models, clearing and settlement, the state machine, ledgers, balances, payouts, reconciliation, webhooks, tokens, risk scoring, 3-D Secure, splits. See [The First Promise: Authorization](payment-authorization.html), [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html), [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html), [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html), [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html), [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html), [The Card Number's Replacement: Network Tokens and Credential Lifecycle](network-tokens.html), [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html), [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- The six-step overview, the four-party model and the positions a provider can take. See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html).\n- A renewal that is declined, the retry rules and the billing state. See [Journey 2: A Membership Renewal That Fails, and Comes Back](journey-failed-renewal.html).\n- The split in detail, the €84.00 refund after payout and who funds it. See [Journey 3: One Payment, Three Parties, and a Refund After Payout](journey-platform-payment.html).\n- A chargeback and the dispute process. See [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html).\n- A 'Stripe and Adyen: Where They Differ' section: journeys show both providers inline (style guide).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The chapters disagree on what triggers Larkfield's first ledger entry for a sale: payment-ledgers shows it posted on the webhook into 'sales awaiting settlement report', while the ledger additions of chapters 15, 14 and 20 say ledger entries are written only from report lines. This journey follows the report-line rule and does not show an entry at webhook time; a reviewer should reconcile chapter 12.\n- The scenario ledger does not say which phone wallet Mila uses; the chapter cites Adyen's Apple Pay page and Google's developer guide and says so.\n- Whether Adyen N.V. is the acquirer of record for the pass is an inference (ledger addition by chapter 1).\n- Stripe's pages do not say whether a capture can be rejected at the network after `succeeded`, or whether availability waits for Stripe's own receipt of funds.\n- Visa's settlement cut-off times and cycles are not in the public rule text; the Tuesday-night and Wednesday timing is an assumption.\n\n## Decision log\n\n- **2026-11-17** — Walk the twelve steps as narrative in three stretches first and give the step table afterwards as the consolidation, so that every table cell restates a sourced sentence the reader has just read. Rejected: Table first, then narrative: twelve rows of terms before any is tied to Mila's payment.; One section per step: twelve short sections that would bury the hand-offs between them.\n- **2026-11-17** — Tell the journey on Adyen, Studio Noord's provider, and replay it on Stripe in one section with a per-step table of records, as the PLAN's 'shown once on each provider' asks. Rejected: Two full step tables, one per provider: most cells would repeat.; A Stripe sentence in every paragraph: it would hide the three hand-offs where the difference matters.\n- **2026-11-17** — Keep the journal spec's order of steps nine to twelve (ledger entries, split, payout, reconciliation) and date each by when its record becomes usable to Larkfield: entries from the report of Wednesday morning, the split as funds on Thursday, the payout on Thursday, the match closed on 25 March. The split instruction is said to travel with the payment at 19:42. Rejected: Placing the split at step five because the instruction is sent then: the journal thesis fixes the order, and the bookings become funds only after the settlement delay.\n- **2026-11-17** — No research brief is named in this page's PLAN contract; every provider fact is taken from the chapters that own it and was re-fetched from the provider's page in this session.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, contract 42-journey-card-payment; _research/consistency-issues.md rulings 10, 12, 14, 18, 22 — Scope, the twelve steps, the hand-off rule, the wallet, the pre-financing ruling, no inline URLs.\n  - journal-spec.json, entries journey-card-payment, part-9 and journey-failed-renewal — Intent, acceptance criteria, thesis, role, transition in, hand-off.\n  - _research/scenario-ledger.md, including Additions by chapter (01, 03, 05, 08, 12, 13, 14, 15, 17, 18, 25, 33, 35) — Every Larkfield date, amount, system and Keel decision.\n  - posts 01, 02, 03, 08 (read in full) and the Larkfield and 'Where They Differ' sections of 12, 13, 14, 15, 20, 22, 23, 24, 25, 35 — The provider facts and their sources, re-fetched for this page.\n- **External**\n  - Adyen documentation (capture, webhook types, result codes, settle funds, split transactions and split chargebacks, payout webhooks, sales day payout, Balance Platform Accounting Report, risk profile, refusal reasons, API idempotency, Apple Pay), n.d., accessed 2026-11; Adyen Sales Day Payout Terms of Service, 2024-06-17; Adyen OpenAPI Checkout v72 — The Adyen record at each step.\n  - Stripe documentation (PaymentIntent lifecycle, payment status updates, payment methods, balances, payouts, Payout object, payout reconciliation report, destination charges, Radar risk evaluation, idempotent requests), n.d., accessed 2026-11 — The Stripe record at each step.\n  - Visa Core Rules and Visa Product and Service Rules, 2026-10-24; Regulation (EU) 2015/751; Google Pay API tutorial, n.d., accessed 2026-11 — Authorization validity, presentment and settlement definitions, the interchange cap, the device token.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 51 claims checked (42 confirmed, 8 corrected, 1 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the unscoped “no call that returns a payment” is now scoped to Adyen's Checkout API for online payments (ruling 29), and the acquirer, report, pre-financing and expiry statements were brought into line with rulings 18, 27, 28 and 32. Three evidence and controlling-idea wordings updated to match (acquiring connection; reconciliation job on the report-ready signal); no unit added, dropped or reordered. Copied intent and thesis fields left for the author.\n- **2026-11-17** — While drafting: paragraph p27 (the three hand-offs where the record differs) changed from prose to a list with a lead-in; order and content unchanged, so the flow rubric verdict stands.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: five controlling ideas reworded without changing the order (the intro no longer counts capture as not yet happened at 19:42; `pending` named as the unconfirmed state at step 5; the accounting report named at step 10 and the return window at step 12; the Established bullet no longer says both companies document a late capture failure). Note not acted on, left to the author: merge the where-we-are paragraph into the roadmap (the style guide requires both).\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry, the scenario ledger and the chapters that own the twelve mechanisms.\n- **2026-11-17** — Reconciliation after verification (parts-9-10): intent, thesis and role re-synced with the corrected journal-spec entry. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: statements of absence re-tested with a wide search (documentation and support sitemaps, company sites, web search). Narrowed: 'Adyen names no acquiring entity per country' (its EMEA license page says Adyen N.V.'s authorisation includes cross-border acquiring in all EEA countries; no per-country list). Holds: Stripe on a network rejection of a capture after `succeeded`, and on funds available before receipt outside Instant Payouts (sentence now says what was searched). One source added; units unchanged.\n- **2026-11-17** — Sweep of rulings 46 to 48: step 7 now says Adyen's license pages name an acquiring entity for some markets and that no complete per-country list exists (46j); the evidence paragraph on Stripe's standard payouts cites the services terms' definition of Payout Delay in place of 'I found nothing' (47e) and adds the Annual Report 2025 caveat to Adyen's pre-financing terms (47m). Three sources added; p28 aligned; no unit added, dropped, merged or reordered.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Stripe publishes an availability schedule and, outside Insta' -> 'Stripe publishes an availability schedule and documents payi').\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after the round-1 draft check: p02 and p05 updated (fee derivation of €117.47; steps numbered by hand-off, not by the clock; stretches named with their steps); p07 gains the Keel K2-K4 glosses; p13 count corrected to six records to match its list; p28 split into p28 (the capture gap) and p28b (the funds gap). Prose glosses added for reference-table terms, Stripe terms, exemption, liability shift, `authorized`, Sales day payout.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
