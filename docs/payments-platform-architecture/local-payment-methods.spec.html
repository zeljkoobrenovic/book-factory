<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The payment method families and the properties on which they differ from cards: who starts the payment, when the outcome is known, whether there is a hold to capture, whether and for how long the payer can take the money back, how a refund travels, whether a mandate is needed, and when funds settle.\n- **Know:** How Stripe (a PaymentMethod object with a type; dynamic payment methods by default since API version 2023-08-16) and Adyen (a method type passed to the Checkout API, a documented flow type and capture mode per method, methods configured on the merchant account) each present methods through one API.\n- **Believe:** A status of 'succeeded' is a different promise for a card, a bank redirect and a direct debit, and no provider can change that because the scheme sets it.\n- **Believe:** 'Real-time' describes how fast the payer's money moves, not whether the payment is final for the merchant or when the merchant has the funds.\n- **Be able to:** Given a payment method they have not used, list the questions that decide what their system may do after 'succeeded' and find the answers in a provider's method page.\n- **Be able to:** Write a per-method-family policy (grant access, pay out, expect a reversal until when) instead of branching on the status alone.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a method the chapter does not walk through, the reader asks the questions that separate it from a card before deciding how to fulfill and pay out. *Probe:* Your company will start accepting a voucher method: the customer gets a barcode at checkout and pays cash at a convenience store within three days. Using only this chapter, list four questions you must answer before deciding when to ship the order and how refunds will work. | `custom` | cold_reader | major |\n| AC-2 | Given two providers' terms for the same scheme event, the reader recognizes them as one rule and maps them to a neutral term of their own. *Probe:* For a returned direct debit, one provider's report shows a 'dispute' and another's shows a 'chargeback'; the second provider also shows a 'chargeback' when the customer's account simply had no money. A dashboard adds these up as 'fraud disputes'. What is wrong, using only this chapter? | `custom` | cold_reader | major |\n| AC-3 | Scheme rules are attributed to the scheme or the law with their dates, provider behavior to the provider's documentation with its date, and items in preview or migration (iDEAL to Wero) are marked as likely to change. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How does one API accept a hundred payment methods whose semantics differ?\n\n> **Claim:** One API accepts many payment methods by unifying how a payment is started and how its status is reported; it cannot unify what 'succeeded' means, because when the outcome is known, whether there is a hold to capture and whether the payer can take the money back are fixed by each scheme. The integration therefore has to carry a rule per method family for what it may do after 'succeeded'.\n\n**Disputed by:** The view that the provider's abstraction is complete: once every method sits behind the same call and the same status field, the integration can treat them alike, and the differences are edge cases the provider absorbs.\n\n**So what:** A team that grants access, ships or pays a seller out on the status word alone has built the failure pattern A Card by Any Other Name. On a platform the cost lands in balances: a payment that can be taken back for weeks needs a payout rule that knows which method carried it.\n\n**How and why:** The scheme rules differ in kind. An iDEAL payment cannot be disputed through the payer's bank; a SEPA direct debit can be refunded without a reason for eight weeks and contested as unauthorized for thirteen months under PSD2 (2015, still in force), and is confirmed days after submission. Stripe's documentation says in general terms that a succeeded payment 'can still be refunded, disputed, returned, or reversed'. The two providers present the variety differently: Stripe stores the instrument as a PaymentMethod object and, by default since API version 2023-08-16, chooses which methods to show per session; Adyen takes the method as a parameter, returns the methods configured on the merchant account, and documents a flow type and a capture mode (immediate or separate) per method. They also name the same scheme event differently, a 'dispute' at Stripe and a 'chargeback' at Adyen. Neither publishes a list of the methods it reaches through another payment company (single method pages name a partner), so the chapter describes the contract each documents and not what is behind it.\n\n**Supporting claims**\n\n- **S1** — Payment methods differ from cards on a fixed set of properties (who starts the payment, when the outcome is known, whether there is a hold, whether and until when the payer can take the money back, how a refund travels, whether a mandate is needed, when funds settle) that the scheme or the law sets.\n- **S2** — A succeeded status is therefore a different promise for each method family, and real-time describes speed, not finality or the arrival of funds.\n- **S3** — Stripe and Adyen unify how a payment is started and how its status is reported through different abstractions: a stored instrument and a provider-chosen list, or a method parameter, a configured list and a documented flow and capture mode.\n- **S4** — Both abstractions leak at capture, refund, reversal and timing, the two providers name the same scheme event differently, and neither publishes what stands behind a method.\n- **S5** — The integration therefore has to carry a rule per method family, with terms of its own, for what it may do after success.\n\n## Role in the part\n\nShows that 'yes' has more than one meaning, so that the state model of the next chapter and every later use of 'approved' carries the method with it. Supports P2-2 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in scene, seven-questions, method-by-method, one-api: each supplies the terms the next uses; `comparison` in one-api, three-designs, where-they-differ)\n\nThe reader meets a payment that was paid and then was not before any vocabulary, so the seven questions arrive as the answer to a felt problem. The questions come before the method-by-method evidence because the evidence is read against them, and the schemes come before the providers because the providers' abstractions can only be judged once the reader knows what they are abstracting over. The integrator's designs follow the leaks they respond to; the provider comparison follows both; the worked example applies the chosen design; the failures close the body. Putting the providers first would present two APIs as the subject and hide that the differences come from the schemes.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On the 1st of the month a member's €49 membership, paid by direct debit, shows as paid. She books three classes. On the 6th her bank sends the debit back: there was not enough money in the account. Was the payment ever paid?\n\n**Bridge:** An engineer integrating a payment API sees one call, one status field and a list of method names, and reasonably treats the method as a parameter. → The status field is shared and its meaning is not: what a system may do after 'succeeded' depends on rules the provider did not write.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): One API can unify how a payment is started and how its status is reported. It cannot unify what success means, so the integration carries a rule per method family.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from what broke at Larkfield when a direct debit was treated like a card. *Kept in:* scene.\n- Set out the seven questions that separate a method from a card. *Kept in:* seven-questions.\n- Read what success promises for each method family. *Kept in:* method-by-method.\n- Show how Stripe and Adyen each present many methods through one API, and where they differ. *Kept in:* one-api, where-they-differ.\n- Compare three ways to handle the differences in your own code. *Kept in:* three-designs.\n- Work a direct debit through Larkfield's rule per method family and end with the failures. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A membership paid by direct debit can be reported as collected on the 1st and be taken back by the member's bank days or weeks later, with nothing in the status word to warn of it. | scenario: A studio member's €49 membership debit is marked paid on the 1st, the member books classes, and on the 6th the bank returns the debit for lack of funds. |  |\n| p02 | claim | One API can unify how a payment is started and how its status is reported, and it cannot unify what success means, because each scheme fixes when the outcome is known, whether there is a hold and whether the payer can take the money back. |  | `cause_effect`: The debit that was paid and then was not. → The reason: the meaning of success is set by the scheme, not by the provider's API. |\n| p03 | explanation | The cost of reading every method as a card lands in three places: access granted too early, sellers paid out with money that can still leave, and reports that count a failed collection as a dispute. |  | `cause_effect`: The claim that success differs by method. → Where the difference costs money or trust, which is the book's gap between the instant answer and the slow truth. |\n| p04 | context | Mila's class pass is a card payment made from a phone wallet, so this chapter covers the step before the journey starts, the choice of method at checkout, and asks what every later step would have looked like had she chosen iDEAL or a direct debit. |  | `place`: The chapter's subject. → Its position on the recurring payment's journey. |\n| p05 | transition | The chapter starts at Larkfield, sets out seven questions that separate a method from a card, reads what success promises method by method, shows how Stripe and Adyen each present the variety through one API, compares three ways to handle the differences in your own code, sets the two providers side by side, works a direct debit through Larkfield's rule per method family, and ends with the failures. |  | `sequence`: The position on the journey. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Paid Until It Was Not\n\n**Controlling idea** (`example`, id `scene`): Larkfield applied one rule to every payment method, and for direct debits the rule granted access, paid studios and counted disputes on a status that could still be reversed.\n\n**Advances the thesis** (S5, S2): Shows the cost of acting on the status word alone before any vocabulary is introduced.\n\n**Transition in:** `example`: The introduction's claim that success means different things. → One company where almost half the volume is not cards and one rule covered all of it.\n\n**Order of paragraphs** (`chronological`): The finding, its three symptoms, then the question Femke writes down: the reader reaches the chapter's question the way she did. Stating the question first would make it an abstract one, with no cost attached.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In February 2027 Femke de Graaf, who leads Keel, Larkfield's 2027 program to repair its payments estate, finds that almost half of the online volume is not paid by card, while the payment record store applies one rule to every method: `paid` grants access and counts toward the studio's payout. | statistic: Online method mix 2026 by volume: cards 52%, SEPA Direct Debit 21%, iDEAL 14%, Bacs Direct Debit 5%, Bancontact 4%, other 4%. |  |\n| p07 | example | Treating a direct debit like a card produced three symptoms at Larkfield: members who had access and then lost it, studios whose balance was debited after payout, and a dispute report inflated by debits that had simply bounced. | scenario: About 325,000 direct debits a month (21% of €910M a year at the typical €49); an assumed 1.5% come back, about 4,900 a month; on the Adyen side each arrived as a chargeback event and was recorded as `disputed`.; fact: Adyen: 'A SEPA chargeback notification can indicate that: ... There were insufficient funds in the shopper's bank account' (https://docs.adyen.com/payment-methods/sepa-direct-debit, n.d., accessed 2026-11). | `example`: The one rule for every method. → What it did when the method was a direct debit. |\n| p08 | claim | The question Femke writes down is not which methods to offer but what Larkfield may do after `paid`, for each kind of method. |  | `problem_solution`: Three symptoms of one rule. → The question the rest of the chapter answers. |\n\n### Seven Questions That Separate a Method From a Card\n\n**Controlling idea** (`definition`, id `seven-questions`): Methods differ from cards on seven properties that the scheme or the law fixes, and push or pull is the one from which most of the others follow.\n\n**Advances the thesis** (S1): Supplies the properties in which the rest of the chapter states every difference.\n\n**Transition in:** `problem_solution`: Femke's question of what may be done after `paid`. → The properties that decide the answer, as seven questions.\n\n**Order of paragraphs** (`large_to_small`): Families first, then the seven questions, then the two terms (push or pull, mandate) that need more than a table cell; the terms would be unreadable before the table that places them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A payment method is a way of paying that runs on a scheme, a body of rules and a network of participants, and both providers sort methods into families whose members behave alike. | quotation: Stripe: 'Payment methods in the same family have similar features and checkout experiences' and its family list: cards, bank debits, bank redirects, bank transfers, buy now pay later, real-time payments, vouchers, wallets (https://docs.stripe.com/payments/payment-methods/overview, n.d., accessed 2026-11).; fact: Adyen's catalog gives each method a payment type and a payment flow: Direct, Redirect, Additional action, await, qrCode, voucher (https://docs.adyen.com/payment-methods, n.d., accessed 2026-11). |  |\n| p10 | claim | Seven questions separate any method from a card, and the answers decide what a system may do after success. | table: Question / the card answer / what other methods do, seven rows: who starts the payment, when the outcome is known, is there a hold to capture, can the payer take it back and until when, how does a refund travel, is a mandate needed, when do funds settle. | `elaboration`: Families of methods that behave alike. → The properties on which families differ. |\n| p11 | definition | Who starts the payment matters most: in a push the payer instructs their own bank, and in a pull the merchant instructs the payer's bank under a permission, which is why pulls stay revocable and pushes mostly do not. | reasoning: A payer who approved a transfer in their own banking app has little ground to deny it; a payer whose account was debited by someone else is protected by a right to reverse it. Finality is the point after which the payer can no longer take the payment back through their bank. | `emphasis`: The seven questions. → The first one, push or pull, and the terms account-to-account payment and finality that follow from it. |\n| p12 | definition | A mandate is the payer's standing permission for a named creditor to pull money, and it is a record somebody must be able to produce years later. | fact: Stripe: 'Checkout and the Payment Element automatically display the required mandate terms and record the customer's acceptance' (https://docs.stripe.com/payments/sepa-debit, n.d., accessed 2026-11); Adyen: 'By default, Adyen uses its creditor ID on your behalf' and 'Adyen is only notified of a cancelled SEPA mandate when a payment is charged back' (https://docs.adyen.com/payment-methods/sepa-direct-debit, n.d., accessed 2026-11). | `elaboration`: Pull payments made under a permission. → The permission itself, the mandate, and who keeps it. |\n\n### What “Succeeded” Promises, Method by Method\n\n**Controlling idea** (`evidence`, id `method-by-method`): Read against the seven questions, a succeeded status is a different promise for a bank redirect, a direct debit, a wallet, a real-time payment and a voucher, and speed is not finality.\n\n**Advances the thesis** (S1, S2): Carries the evidence that the differences are of kind and are set outside the provider.\n\n**Transition in:** `example`: The seven questions. → The answers for each family, from law and from both providers' documentation.\n\n**Order of paragraphs** (`grouping`): The provider's general statement first, then one family at a time from the most final (redirect) to the least (direct debit), then the families the reader is likely to misfile (wallets, real-time, vouchers), and refunds last because they apply to all of them. Moving real-time ahead of direct debit would lose the contrast between push and pull that explains it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | Stripe's own documentation says that a succeeded payment has completed according to its method's flow and can still be undone, so the status word is a statement about the method's process and not about the money. | quotation: 'A `succeeded` status indicates that the payment completed successfully according to the payment method's processing flow, but funds can still be refunded, disputed, returned, or reversed' (https://docs.stripe.com/payments/payment-methods, n.d., accessed 2026-11). |  |\n| p14 | explanation | A bank redirect such as iDEAL or Bancontact is a push with an immediate answer, no hold to capture and no dispute through the payer's bank. | fact: Stripe on iDEAL: 'immediate notification'; manual capture support No; 'Customers can't dispute iDEAL \\| Wero payments with their bank' (https://docs.stripe.com/payments/ideal, n.d., accessed 2026-11). Stripe on Bancontact: 'customers can't file a chargeback through their bank' (https://docs.stripe.com/payments/bancontact, n.d., accessed 2026-11). Adyen's iDEAL row: flow redirect, no separate captures, no chargebacks (https://docs.adyen.com/payment-methods/ideal, n.d., accessed 2026-11).; figure: Three lanes side by side: a card pull with a hold, a bank redirect push, a direct debit pull with no hold and a long take-back window. | `example`: Success defined per method. → The first family, bank redirects, and the redirect flow. |\n| p15 | evidence | For a direct debit in euros, EU law gives the payer two separate rights: a refund without a reason for eight weeks, and a claim that the debit was never authorized for thirteen months. | quotation: PSD2, Directive (EU) 2015/2366, published 2015-12-23, still in force: Article 76(1) 'the payer has an unconditional right to a refund within the time limits laid down in Article 77'; Article 77(1) 'for a period of 8 weeks from the date on which the funds were debited'; Article 71(1) 'no later than 13 months after the debit date' (http://publications.europa.eu/resource/celex/32015L2366). Evidence age 11 years; PSD3 and the Payment Services Regulation are due to replace it. | `contrast`: A push that the payer cannot take back. → A pull that the payer can take back, and the law that says so. |\n| p16 | evidence | Both providers document a SEPA Direct Debit as an outcome that arrives days after the request and a reversal the merchant cannot contest. | fact: Stripe: 'Payment confirmation timing: At least 6 business days after submission'; 'Wait at least 6 business days before treating a SEPA Direct Debit payment as successful'; 'You can't submit evidence or counter a SEPA Direct Debit dispute through Stripe' (https://docs.stripe.com/payments/sepa-debit, n.d., accessed 2026-11). Adyen: the API example answers with resultCode 'Received' (https://docs.adyen.com/payment-methods/sepa-direct-debit/api-only, n.d., accessed 2026-11); 'You cannot defend SEPA chargebacks'; 'Due to the risk of chargebacks, we do not recommend using SEPA for one-off payments or the sale of physical goods' (https://docs.adyen.com/payment-methods/sepa-direct-debit, n.d., accessed 2026-11). | `additional_support`: The law's two rights. → How the two providers' documentation presents the same rights. |\n| p17 | evidence | Direct debit schemes outside the euro area have their own windows, and for the US scheme the two providers print different figures that this chapter could not check against the scheme's rules. | fact: Bacs: Stripe 'typically takes 4 business days to confirm' and 'Refunds aren't part of the Bacs Direct Debit scheme and are provided outside of Bacs by Stripe' (https://docs.stripe.com/payments/bacs-debit, n.d., accessed 2026-11); Adyen 'Unpaid direct debits are booked as chargebacks' (https://docs.adyen.com/payment-methods/bacs, n.d., accessed 2026-11). ACH: Stripe 'up to 60 calendar days after a debit on a personal account'; Adyen 'up to two years after the settlement date' (https://docs.stripe.com/payments/ach-direct-debit and https://docs.adyen.com/payment-methods/ach-direct-debit, n.d., accessed 2026-11). Nacha's rule text was not verified. | `similarity`: SEPA Direct Debit's rights. → Bacs and ACH, and a place where the evidence stops. |\n| p18 | explanation | A wallet is not a family in this sense: Apple Pay and Google Pay carry a card and keep every card rule, while PayPal and buy-now-pay-later providers such as Klarna are schemes of their own with their own capture and dispute rules. | fact: Adyen: Apple Pay 'uses network tokenization' (https://docs.adyen.com/payment-methods/apple-pay, n.d., accessed 2026-11) and the catalog lists chargebacks and separate captures for it (https://docs.adyen.com/payment-methods, n.d., accessed 2026-11); Stripe on Klarna: 'Klarna collects the initial payment from your customer and any future installment payments' (https://docs.stripe.com/payments/klarna, n.d., accessed 2026-11). | `contrast`: Methods that are not cards. → Methods that look new at checkout and are cards underneath, and ones that are not. |\n| p19 | claim | 'Real-time' describes how fast the payer's money moves between banks, and says nothing about whether the payment is final for the merchant or when the merchant has the funds. | fact: Regulation (EU) 2024/886, published 2024-03-19: the payee's provider must make the amount available 'within 10 seconds of the time of receipt of the payment order'. Stripe on Pix: settlement 'Up to 2 business days (T+2)' and full disputes supported (https://docs.stripe.com/payments/pix, n.d., accessed 2026-11); Adyen on Pix: a shopper can 'open a dispute with their bank within 90 days' (https://docs.adyen.com/payment-methods/pix, n.d., accessed 2026-11). FedNow 'went live on July 20, 2023' as an interbank service (https://www.federalreserve.gov/paymentsystems/fednow_about.htm, n.d., accessed 2026-11). | `contrast`: Methods sorted by family. → Rails sorted by speed, and why speed is a different property. |\n| p20 | example | Wero, the European scheme that is replacing iDEAL, shows what an authorization means on an account-to-account rail: a bank's guarantee to pay, with the funds arriving in a later step that can fail. | quotation: Adyen: 'Wero is currently in development'; 'The payment guarantee is the shopper's bank's commitment to pay Adyen. It is not the receipt of funds'; a CAPTURE_FAILED event if retries stop (https://docs.adyen.com/payment-methods/wero, n.d., accessed 2026-11). iDEAL: 'By the end of 2027 at the latest, all iDEAL merchants will have transitioned to Wero', with milestones 'subject to further consultation with the regulator' (https://ideal.nl/en/naar-wero, n.d., accessed 2026-11). Stripe: 'Switch to Wero in the course of 2026 and 2027' (https://docs.stripe.com/payments/ideal, n.d., accessed 2026-11). | `example`: Real-time rails. → One of them documented step by step, and marked as still changing. |\n| p21 | explanation | Vouchers sit at the far end: the API response is an instruction to the customer, and the outcome arrives days later by webhook or never arrives at all. | quotation: Stripe: with vouchers 'customers complete online purchases in person' (https://docs.stripe.com/payments/payment-methods/overview, n.d., accessed 2026-11). Adyen's catalog lists the flow 'voucher' for cash methods such as Boleto Bancário and OXXO (https://docs.adyen.com/payment-methods, n.d., accessed 2026-11). | `contrast`: Methods whose answer comes in seconds. → Methods whose answer may never come. |\n| p22 | explanation | A refund outside the card networks is a new payment in the other direction, with its own window, its own delay and its own way of failing. | fact: Stripe: SEPA Direct Debit refunds 'appear as separate credits to the customer's bank account instead of reversals', within 180 days; iDEAL refunds 'can remain in a pending state for up to 7 days'; Bancontact refunds within 730 days, 'never issued as a reversal' (Stripe method pages, n.d., accessed 2026-11). Adyen: for 'bank transfers, iDEAL, or Bancontact, the status of the payment can change from Refunded to RefundedReversed' (https://docs.adyen.com/online-payments/refund, n.d., accessed 2026-11). | `additional_support`: How the payment arrives in each family. → How the money goes back in each. |\n\n### How One API Presents Them: A Stored Instrument or a Parameter\n\n**Controlling idea** (`comparison`, id `one-api`): Stripe and Adyen unify the start of a payment and the reporting of its status through different abstractions, and both leak at capture, refund, reversal and timing.\n\n**Advances the thesis** (S3, S4): Shows what the abstraction covers and exactly where the scheme shows through it.\n\n**Transition in:** `contrast`: What the schemes fix. → What a provider's API can and cannot make uniform, and the two ways it is done.\n\n**Order of paragraphs** (`comparison`): What can be unified, then Stripe, then Adyen on the same points, then the leaks common to both, then where the evidence stops. The leaks come after both descriptions so that they read as a property of the problem and not of one provider.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | What a provider can make the same for every method is the request that starts a payment, the instruction for what the customer must do next, and the channel on which status is reported. | fact: Stripe: 'The Payment Methods API allows you to accept a variety of payment methods through a single API'; 'The `PaymentIntent` object's `next_action` property specifies the customer action' (https://docs.stripe.com/payments/payment-methods, n.d., accessed 2026-11). Adyen: the Advanced flow uses three requests, '/paymentMethods, /payments, and /payments/details', for every method (https://docs.adyen.com/online-payments/build-your-integration, n.d., accessed 2026-11). |  |\n| p24 | description | Stripe models the instrument as a stored object, a PaymentMethod with a type and a type-specific block of data, which is combined with a PaymentIntent to pay or a SetupIntent to save. | quotation: 'A PaymentMethod object contains the payment method details to create payments'; 'Each `PaymentMethod` has a type attribute, such as `\"type\": \"sepa_debit\"`, and a corresponding hash that contains information specific to the payment method'; single-use methods 'can't be attached to customers because they're consumed after a payment attempt' (https://docs.stripe.com/payments/payment-methods, n.d., accessed 2026-11). | `example`: What can be unified. → The first provider's way of doing it. |\n| p25 | description | Since API version 2023-08-16 Stripe also chooses which methods a customer is shown, from settings in the dashboard instead of a list in the integration's code. | quotation: Stripe blog, 17 August 2023 (evidence age 3 years, confirmed by current documentation): 'today, we're changing the default behavior of the PaymentIntents and SetupIntents API'. Changelog 2023-08-16: the previous default was to 'accept only card payments'. Current page: 'Stripe handles the logic for dynamically displaying the most relevant eligible payment methods to each customer'; 'Activation is generally instantaneous and doesn't require additional contracts' (https://docs.stripe.com/payments/payment-methods/dynamic-payment-methods and /payments/payment-methods, n.d., accessed 2026-11). | `additional_support`: The stored instrument. → Who decides which instruments are offered. |\n| p26 | description | Adyen takes the method as a parameter of the payment request and returns the methods configured on the merchant account, and its documentation states a flow type for each method. | fact: Payment requests carry paymentMethod.type, for example 'sepadirectdebit' (https://docs.adyen.com/payment-methods/sepa-direct-debit/api-only, n.d., accessed 2026-11); 'Sessions flow is the default integration that we recommend' (https://docs.adyen.com/online-payments/build-your-integration, n.d., accessed 2026-11); methods are requested in the Customer Area, 'we will contact you if there are additional requirements', and adding one to a store is 'an asynchronous process' confirmed by a paymentMethod.created webhook (https://docs.adyen.com/payment-methods/add-payment-methods, n.d., accessed 2026-11). | `contrast`: Stripe's stored object and provider-chosen list. → Adyen's parameter and configured list. |\n| p27 | description | Both providers document, method by method, whether a hold exists to capture, and Adyen names the two modes outright: direct capture, taken at once, and separate capture, where capture settings apply. | quotation: 'Most card payment methods use separate capture ... Some online banking payment methods, for example iDEAL, only support direct capture'; for direct capture 'Capture timing settings do not apply' (https://docs.adyen.com/online-payments/capture, n.d., accessed 2026-11). Stripe's equivalent is a per-method 'Manual capture support' property (method pages, n.d., accessed 2026-11). | `similarity`: The two providers' ways of carrying the method. → The capture mode each documents per method. |\n| p28 | analysis | The abstraction leaks in the same places on both providers: capture, refund, the reversal's name and the time at which success is known. | reasoning: Each leak is one of the seven questions: a capture flag that is rejected or ignored for some methods, a refund object that can fail, a 'dispute' or 'chargeback' that nobody can contest, a status that stays processing for days.; figure: One front door labeled as the API leading to rooms of different shapes behind it. | `cause_effect`: Two ways of presenting many methods through one API. → The points at which the method shows through either one. |\n| p29 | explanation | No page found at either company says how it adds a method or lists the methods it reaches through another payment company (single method pages name a partner, and Stripe's sub-processor list names three integration providers without their methods), so the chapter can describe the contract each documents and not what is behind it. | fact: Stripe's French SEPA mandate text authorizes 'Stripe, notre prestataire de services de paiement et/ou PPRO, son prestataire de services local' (https://docs.stripe.com/payments/sepa-debit, n.d., accessed 2026-11). Stripe's Pix page names Ebanx as 'our Pix partner' and says 'Ebanx appears as the payment recipient' (https://docs.stripe.com/payments/pix, n.d., accessed 2026-11). Adyen's ACH page mentions 'The legacy BOA acquirer' replaced by 'AdyenACH' (https://docs.adyen.com/payment-methods/ach-direct-debit, n.d., accessed 2026-11). No page found at either company lists partner-delivered methods or says how a method is added. | `contrast`: What the two contracts document. → Where the public record stops. |\n\n### Three Ways to Handle the Differences in Your Own Code\n\n**Controlling idea** (`comparison`, id `three-designs`): An integration either ignores the method, branches on its name or keeps a policy per family, and the third is the only one that survives a new or migrated method.\n\n**Advances the thesis** (S5): Turns the scheme differences into a design choice the reader's own code makes.\n\n**Transition in:** `problem_solution`: An abstraction that leaks at four points. → The integrator's three ways of living with the leaks.\n\n**Order of paragraphs** (`comparison`): The designs, their trade-offs, then the prior question of whether to offer a revocable method at all, which only makes sense once the reader knows what handling it costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | comparison | An integration can handle method differences in three ways: act on the status alone, branch on the method's name, or keep a policy per method family keyed by the seven questions. | reasoning: Status-only is what a card-first integration already is; branching by name is what it becomes after the first incident; a family policy is the same knowledge held as data. |  |\n| p31 | comparison | The three designs trade first-day effort against what happens when a method is added, renamed or migrated. | table: Design / what it costs to build / what happens when a method is added / where it fails / when it is right: status only, branch per method, policy per family. | `elaboration`: Three designs. → Their costs side by side and when each is right. |\n| p32 | recommendation | Whether to offer a revocable method at all is a pricing decision as much as a technical one: at Larkfield a direct debit costs the studio roughly half of what a card payment costs and can be taken back for eight weeks. | scenario: Larkfield's fee on a €49 membership: €0.64 by direct debit (0.8% + €0.25) against €1.18 by card (1.9% + €0.25); €0.35 flat for an iDEAL payment.; quotation: Adyen: 'we do not recommend using SEPA for one-off payments or the sale of physical goods' (https://docs.adyen.com/payment-methods/sepa-direct-debit, n.d., accessed 2026-11). | `additional_support`: How to handle the methods you offer. → Whether a cheap, revocable method is worth offering, and for what. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The two providers agree on the scheme rules and differ in the carrier of the method, the owner of the method list, activation and the words for a reversal.\n\n**Advances the thesis** (S3, S4): States the documented differences and what each asks of an integrator.\n\n**Transition in:** `conclusion_summary`: The two abstractions and the designs built on them. → The documented differences in one table, with the author's reading.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison | On payment methods the two providers document the same scheme rules and differ in the object that carries the method, in who chooses the list, in how a method is switched on and in the words used for a reversal. | table: Aspect / Stripe / Adyen / what the difference suggests, six rows: core abstraction; which methods are shown; turning a method on; capture; the word for a returned direct debit and how an unpaid one is reported; which methods are delivered through another company (not public at either). |  |\n| p34 | recommendation | On Stripe an integrator should decide whether the provider or the code names the methods and make the code safe for a method it has not met; on Adyen the list is fixed by configuration, and the work is in mapping chargeback events that are not disputes. |  | `cause_effect`: The documented differences. → What to do differently on each provider. |\n\n### In Practice at Larkfield: A Rule per Method Family\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield stores the method family and a reversal horizon with each payment and names reversals in its own four terms.\n\n**Advances the thesis** (S5): Shows the rule per method family filled in and applied to one dated payment on both providers.\n\n**Transition in:** `example`: What to do differently on each provider. → One platform doing it on both.\n\n**Order of paragraphs** (`large_to_small`): The whole table, then one payment through it, then the vocabulary used when that payment is reversed. The dated example would have no rule to apply if it came before the table, and the four terms would have no event to name if they came before the example.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | example | Under Keel, Larkfield's payment record store keeps the method family beside each payment, and one table says for each family when `paid` is set, when access is granted and until when a reversal is expected. | table: Family / methods at Larkfield / `paid` is set when / access granted / expect a reversal until / unknown family: default deny. Rows: card (and wallets carrying a card), bank redirect (iDEAL, Bancontact), direct debit (SEPA, Bacs), anything else. |  |\n| p36 | example | A €49 membership collected by SEPA Direct Debit on 1 April 2027 can be refunded to the member without a reason until 27 May 2027 and contested as unauthorized until 1 May 2028, and Larkfield's table turns those dates into what the studio and the member see. | scenario: Debit date Thursday 1 April 2027; eight weeks later is 27 May 2027; thirteen months later is 1 May 2028; fee €0.64, studio receives €48.36; access granted at submission as a stated risk the studio accepts.; figure: A timeline of the €49 debit with markers at 1 April 2027, six business days, 27 May 2027 and 1 May 2028. | `example`: The policy table. → One payment run through it with dates. |\n| p37 | example | Larkfield records every reversal under one of four neutral terms of its own, because the two providers report the same scheme event with different words. | table: Scheme event / Stripe reports / Adyen reports / Larkfield's term: unpaid debit (failed payment with a failure code such as insufficient_funds / CHARGEBACK event with reason AM04) = failed collection; refund claimed within eight weeks (dispute / chargeback) = payer refund claim; debit contested as unauthorized (dispute / chargeback) = unauthorized-debit claim; card chargeback (dispute / chargeback) = card chargeback. | `additional_support`: One payment's horizon. → The vocabulary used when the horizon is hit. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `when-it-goes-wrong`): The failures specific to non-card methods are a success the integration never hears of, a success withdrawn later, a refund paid twice and a scheme that changes under the integration.\n\n**Advances the thesis** (S2, S4, S5): Shows that each failure is one of the seven questions answered wrongly, with detection and recovery.\n\n**Transition in:** `contrast`: The rule working as designed. → The cases where the method's rules still catch an integration out.\n\n**Order of paragraphs** (`chronological`): In the order the failures occur in a payment's life: at the redirect, days after collection, at the refund, and across the life of the scheme. Any other order would separate each failure from the stage at which it is detected.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | cause_effect | When the customer approves a redirect payment and never returns to the merchant's page, an integration that fulfills on the return loses a payment that succeeded. | quotation: Stripe: 'For payment methods that require customer action, configure webhook endpoints for notifications on whether a payment has succeeded or not' (https://docs.stripe.com/payments/payment-methods, n.d., accessed 2026-11). Adyen: 'with payment methods like iDEAL, it can take time to get a confirmation that the payment was completed' (https://docs.adyen.com/development-resources/webhooks, n.d., accessed 2026-11). |  |\n| p39 | cause_effect | When a payment fails after it was reported as collected, the provider takes the amount back from the balance at once, so detection has to come from a report of money at risk and not from the customer. | quotation: Stripe: 'If the payment fails after a delay, Stripe immediately deducts the payment amount from your Stripe balance'; 'In rare cases, a payment can fail later and appear as a dispute' (https://docs.stripe.com/payments/sepa-debit, n.d., accessed 2026-11). | `additional_support`: A success the integration missed. → A success that is withdrawn. |\n| p40 | cause_effect | When a merchant refunds a direct debit that the payer has also asked their bank to return, the payer is paid twice, and both providers warn of it. | quotation: Stripe: 'If you refund while the bank also starts a dispute, the customer can receive two credits' (https://docs.stripe.com/payments/sepa-debit, n.d., accessed 2026-11). Adyen: 'Shoppers can dispute a payment with their bank even after you've issued a refund, potentially resulting in two credits for the same payment' (https://docs.adyen.com/payment-methods/sepa-direct-debit, n.d., accessed 2026-11). | `additional_support`: A payment withdrawn by the bank. → A payment returned by two routes at once. |\n| p41 | recommendation | A scheme migration arrives as a provider deadline, and the integration that names methods in code is the one that has to change before it. | fact: Adyen: API-only integrators had 'between January 29, 2026 and March 31, 2026' to rename iDEAL and change its logo (https://docs.adyen.com/payment-methods/ideal, n.d., accessed 2026-11); Stripe: 'Rebrand your integration in the first quarter of 2026 to iDEAL \\| Wero' (https://docs.stripe.com/payments/ideal, n.d., accessed 2026-11). The two providers currently document different capture support for Wero (Stripe: manual capture Yes; Adyen: the immediate flow 'is the only Wero flow Adyen supports today'). | `additional_support`: Failures of single payments. → A failure that arrives for a whole method at once. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The seven questions, the two abstractions, the three designs and the failures are one observation made four times: the provider owns the verb (start, report) and the scheme owns the noun (what was promised). An integration that stores only the provider's status has stored the verb.\n\n**So what:** On a platform the difference is money in someone else's balance: a payment that can be taken back for eight weeks needs a payout and access rule that knows which method carried it, and a report that calls every return a dispute misstates fraud.\n\n**Callback:** The introduction's membership that was paid on the 1st and returned on the 6th. The reader can now say that it was collected under a rule that let the bank return it, that 'paid' was never the right word for it on day one, and which neutral term the return belongs under.\n\n**Takeaway** (`course_of_action`): For every method you offer, answer the seven questions from the provider's method page and the scheme's rules, store the method family and the reversal horizon with the payment, and map each provider's reversal words to terms of your own. A list of eight questions for a provider evaluation or a design review follows.\n\n**Hand-off** to [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html): `problem_solution`: Methods that differ in whether the customer must act and whether the outcome arrives now or days later. → The one model that holds all of them: a payment as a record with states, and the two ways Stripe and Adyen present it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis (list) | Established: the properties that separate methods are set by schemes and law, a succeeded status is a statement about the method's flow, and real-time is a property of speed. |  |  |\n| p43 | synthesis (list) | Depends on context: which revocable methods to offer, who names the method list, and when to grant access for a payment that is not yet confirmed. |  | `contrast`: What the field agrees on. → What changes with the business. |\n| p44 | recommendation (list) | The author's synthesis: store the method family and a reversal horizon with every payment, and let a table, not the status word, decide what happens next. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p45 | recommendation (list) | Eight questions to ask turn the chapter's seven properties and its provider comparison into a checklist for a provider evaluation or a design review. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p46 | transition | Methods differ in whether the customer must act and whether the outcome arrives now or days later, and the next chapter gives the one model that can hold all of them: a payment as a record with states. |  | `problem_solution`: The differences this chapter leaves the integration to carry. → The state machine that carries them. |\n\n## Non-goals\n\n- The card authorization, clearing, refund and dispute flows that serve as the baseline See [The First Promise: Authorization](payment-authorization.html), [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html), [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- The states of a payment object and how to mirror them (PaymentIntent, result codes, next actions) See [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html).\n- Which entity acquires a local scheme and under which license See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Payout timing, reserves and negative balances on a platform See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Wallet credentials and network tokens See [The Card Number's Replacement: Network Tokens and Credential Lifecycle](network-tokens.html), [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html).\n- Retrying failed recurring collections See [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html), [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html).\n- Per-method pricing and market shares by country See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The ACH consumer return window: Stripe prints 60 calendar days and Adyen 'up to two years'; neither was checked against Nacha's rules.\n- The SEPA Direct Debit rulebook (pre-notification period, reason codes) was not read directly; the eight-week and thirteen-month rights are cited from PSD2.\n- Pix and UPI scheme rules are known only through the two providers' documentation.\n- The iDEAL to Wero end dates are subject to change; Wero's capture behavior differs between the two providers' current pages.\n- No list of the methods either provider delivers through another payment company was found; single method pages name a partner (Ebanx for Pix and PPRO in a SEPA mandate text at Stripe, a legacy bank acquirer for ACH at Adyen).\n\n## Decision log\n\n- **2026-11-17** — Organize the method evidence by the seven questions and by family, not as a catalog of methods, because the reader outcome is to ask the questions of a method the chapter does not cover. Rejected: One subsection per method; A country-by-country tour\n- **2026-11-17** — Keep Larkfield's five-state vocabulary unchanged and add a method family field and four neutral reversal terms beside it, since the state vocabulary is owned by the next chapter. Rejected: Adding a sixth state for returned debits\n- **2026-11-17** — Do not print a count of payment methods for either provider: Stripe's '125+' is undefined and no Adyen count was found. Rejected: Comparing '125+' with a tally of Adyen's catalog\n- **2026-11-17** — Treat UPI, PayPal detail and buy-now-pay-later mechanics briefly; the chapter's worked depth goes to bank redirects and direct debits, which carry Larkfield's non-card volume. Rejected: Equal space per family\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md, chapter 7 contract — Scope, owned terms and the Larkfield line.\n  - _journals/payments-platform-architecture/journal-spec.json, entry local-payment-methods — Intent, acceptance criteria, thesis and role, copied unchanged.\n  - _research/brief-acquiring-methods-and-terminals.md, Part 2; brief-stripe-payments-and-api.md 1.5; brief-adyen-payments-and-api.md 1.5 — Tagged claims with URLs and dates; every load-bearing quotation was re-fetched on 2026-11-17.\n  - _research/scenario-ledger.md — Method mix, fees, cast, Keel decisions.\n- **External**\n  - Stripe documentation: Payment Methods API, payment method overview, dynamic payment methods, SEPA Direct Debit, iDEAL | Wero, Wero, Bancontact, Bacs, Pix, ACH (n.d., accessed 2026-11); changelog 2023-08-16; blog 2023-08-17 — The Stripe abstraction and per-method properties.\n  - Adyen documentation: payment methods catalog, SEPA Direct Debit, SEPA chargebacks, iDEAL | Wero, Wero, capture, refund, add payment methods, build your integration (accessed 2026-11) — The Adyen abstraction and per-method properties.\n  - Directive (EU) 2015/2366 (PSD2), 2015-12-23; Regulation (EU) 2024/886, 2024-03-19; iDEAL 'naar Wero' page; Federal Reserve FedNow page — The legal refund rights, the instant-payment obligation and the migration dates.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 95 claims checked (82 confirmed, 5 corrected, 7 hedged, 1 unsupported and relabeled, 0 unreachable); the statement that only one public trace exists of a method delivered through another payment company was corrected, since Stripe's Pix page names Ebanx as its Pix partner and Adyen's ACH page mentions a legacy bank acquirer.\n- **2026-11-17** — Evidence lists aligned with the draft after cutting for length: the method mix is given in prose, the per-method summary table, the bank-transfer quotation and the custom-payment-methods citation were dropped. No unit added, dropped or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: Keel introduced in the scene, section rationales say what would break, the capture paragraph covers both providers, the questions list reworded. Notes not acted on: merging the comparison table into the one-api section (the section is required by the style guide), folding the ACH paragraph into the SEPA one, cutting the introduction's cost paragraph.\n- **2026-11-17** — Spec written from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry thesis.how_why (ch7 verification rows 69, 70) re-synced; ch7 verification rows 69, 70; ruling 30). Adyen documentation pages are now cited 'n.d., accessed 2026-11' instead of with 'last modified' metadata dates (ruling 30). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 3 statements of absence re-tested with a wide search (0 overturned, 1 narrowed, 2 hold; table in _research/absence-audit/07-local-payment-methods.md). Narrowed: Stripe's sub-processor list (27 September 2026) names three payment method integration providers, without the methods they serve.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
