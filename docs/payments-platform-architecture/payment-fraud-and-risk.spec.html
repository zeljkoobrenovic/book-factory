s fraud disputes are down and it declares the rule a success. What two things is that conclusion missing? | `custom` | cold_reader | major |\n| AC-2 | Given a description of a card-testing attack on a merchant the chapter does not mention, the reader identifies it, says why a model trained on disputes does not catch it, and names where it must be stopped. *Probe:* A charity's donation form suddenly receives thousands of €1 donations an hour from constantly changing IP addresses; most are declined by the card issuers. What is happening, why would a fraud model that learns from disputes be slow to see it, and where should it be stopped? | `custom` | cold_reader | major |\n| AC-3 | Every statement about Stripe's or Adyen's models carries its year, old sources are flagged with their age, and the chapter states what is not public: Adyen's fraud-risk model beyond its family and weekly retraining (2024), both companies' criteria and models for accepting a merchant, and Radar's current retraining interval (daily in a 2019 post). | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How does a provider decide, during an authorization, whether a payment is fraud?\n\n> **Claim:** A provider cannot know during an authorization whether a payment is fraud. It estimates, before the issuer sees the payment and inside the payment's time budget, how likely the payment is to be disputed as fraud later, using signals from many merchants, and blocks above a threshold; the facts it learns from arrive weeks afterwards and never arrive for payments it blocked, so each threshold trades refused legitimate customers against fraud losses, and the merchant bears both.\n\n**Disputed by:** The view that fraud detection is the provider's job: its model classifies each payment as fraud or not, so a merchant who switches it on is protected and has nothing left to decide.\n\n**So what:** A merchant has to set the threshold from its own margins, judge any rule or model change only after the dispute labels have come in, use the provider's backtests and control group to see what its rules refuse, and put limits in front of any endpoint that can start a payment.\n\n**How and why:** Both companies document a decision before the payment goes to the network (Stripe marks a blocked payment 'not_sent_to_network'; Adyen's pre-authorization rules) and a second after the issuer answers. The score predicts a dispute: Adyen's documentation says its risk level 'indicates the likelihood that a transaction will result in a fraudulent dispute'. Stripe's October 2026 engineering post gives the delay: 41% of fraud disputes are reported by day 14, 66% by day 30 and 86% by day 60, and a larger model that looked better at first was rolled back once later labels arrived. Because a blocked payment has no outcome, Adyen documents 'control traffic' and Stripe documents altering the score for a small subset of payments, which the chapter reads, as an inference, as a holdout. Card testing has no per-payment label at all, and its declined attempts still cost the merchant fees and standing with issuers, so it has to be stopped before authorization. A refused legitimate customer is a sale the merchant loses, and for accepted fraud Stripe states that the merchant is 'ultimately responsible for payments you choose to accept'. The public record is uneven: Stripe has described Radar's model lineage (to a neural-network-only model in mid-2022, per its 2023 post) and exposes a 0–99 score; Adyen has described its bot-attack feature pipeline (October 2026) and, for its fraud models, tree-based ensembles retrained weekly by default (August 2024), exposes five risk levels, and lets each rule run before or after authorization. Stripe's 'less than 100 milliseconds' is from 2023; Adyen gives 20 ms median and 100 ms at the 99th percentile per model endpoint (January 2025) and no figure for the whole risk decision.\n\n**Supporting claims**\n\n- **C1** — The provider's risk decision is an estimate of a later fraud dispute, made before the payment reaches the card network and again after the issuer answers, inside the payment's time budget and from signals gathered across many merchants.\n- **C2** — The facts the estimate learns from arrive as disputes over about two months, never arrive for blocked payments and take different forms for different kinds of fraud, so any measurement of a model or rule is provisional and needs a holdout.\n- **C3** — A block threshold is a price between legitimate customers refused and fraud accepted, both paid by the merchant, who sets it through thresholds, rules, lists and reviews and can test it with the providers' backtests, partial rollouts and control groups.\n- **C4** — Card testing has no per-payment label and its declined attempts still cost the merchant, so it is a problem of traffic shape that has to be stopped before authorization.\n- **C5** — Stripe and Adyen document the same decision points and kinds of control, and a holdout that Adyen states and Stripe's documentation only implies, but have published very different amounts about their models: Stripe its model lineage and label delay, Adyen its bot-attack pipeline and the family and weekly retraining of its fraud models (2024), and neither its timeout behavior or its merchant underwriting criteria.\n- **C6** — The same estimate-now, facts-later structure applies to the merchant being paid: a provider that pays out before the dispute window closes is exposed to each account and scores it or holds funds against that exposure.\n\n## Role in the part\n\nShows the third relocation: the allow-or-block decision moves to the provider's model while the loss stays with the merchant, and supplies the fraud rate and risk score that authentication exemptions depend on. Supports P5-3 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in kinds, where-it-sits, learning, threshold: each supplies the terms the next one uses (dispute and false positive, then the decision points and the score, then labels and the holdout, then the threshold and its tests); `comparison` in where-they-differ)\n\nThe reader meets an attack that cost money without any fraud being 'detected' before any term is defined, so the vocabulary arrives as the answer to a problem already felt. The kinds of fraud come first because the rest of the chapter turns on how each kind's evidence arrives. The decision points and the score come before the learning section because a label is only meaningful once the reader knows what was decided without it; the threshold comes after learning because the argument that it is a price, and that a change cannot be judged early, needs the label delay and the holdout. Card testing follows the threshold as the contrast case: the one kind of fraud to which the score, the labels and the threshold do not apply, which is also the answer to the opening scene. Merchant risk is placed after it because it changes the subject from the payer to the payee and must not interrupt the argument about payments, and before the comparison so that the gap in underwriting can be listed with the other gaps. Larkfield's worked case needs every mechanism, so it follows the comparison; the failures close the body. Putting card testing first, where the scene suggests it, would explain the exception before the rule it is an exception to.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At 03:14 on a Saturday a €1 payment arrives at a studio's booking page. The card number is real, the expiry date is right and the three-digit code matches. Nothing was stolen from the studio, its platform or its payment provider; the number was taken somewhere else, months ago. The only person who knows this payment is fraud is the cardholder, who is asleep and will find out from a bank statement some weeks from now.\n\n**Bridge:** An engineer expects a fraud check to be a classifier: a request goes in, 'fraud' or 'not fraud' comes out, and the provider that runs it owns the answer. → No such answer exists when the payment is made. What exists is a prediction of a dispute that may be filed weeks later, a threshold somebody chose, and a bill for both kinds of error that goes to the merchant.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p02): A provider cannot know during an authorization whether a payment is fraud; it estimates the chance of a later fraud dispute before the issuer sees the payment, blocks above a threshold, and learns weeks later and never about what it blocked, so each threshold trades refused customers against fraud losses and the merchant bears both.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the Card-Testing Weekend at Larkfield, in which no card data was stolen and no fraud model fired, and return to what Larkfield changed and how it priced its thresholds. *Kept in:* scene, in-practice.\n- Name the kinds of fraud and how the evidence for each arrives. *Kept in:* kinds.\n- Show where the risk decision sits in the authorization path, what the score estimates and how long it may take. *Kept in:* where-it-sits.\n- Explain how the models learn from disputes that arrive weeks later and never arrive for blocked payments. *Kept in:* learning.\n- Treat the block threshold as a price and compare what a merchant can configure. *Kept in:* threshold.\n- Explain card testing and why it has to be stopped before authorization. *Kept in:* card-testing.\n- Extend risk from the payment to the merchant being paid. *Kept in:* merchant-risk.\n- Compare what Stripe and Adyen document and say where the public record stops. *Kept in:* where-they-differ.\n- Show how a risk system fails and how each failure is detected. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A card number stolen somewhere else and typed into a checkout passes every check the last two chapters built, and at that moment the one person who knows it is fraud, the cardholder, has not found out yet. | quotation: \"A payment is considered fraudulent when the cardholder didn't authorize it. Most fraudulent payments are made using stolen cards or card numbers.\"; statistic: Theft of card details accounted for \"more than 56% of the total value\" of remote card fraud in the EEA in 2024. |  |\n| p02 | claim | A provider therefore does not detect fraud during an authorization: it estimates how likely the payment is to be disputed as fraud later, blocks above a threshold before the issuer is asked, and learns weeks afterwards and only about what it let through, so the threshold is a price whose two costs both fall on the merchant. |  | `cause_effect`: The fact that nobody in the payment path knows. → What a provider does instead of knowing: the chapter's thesis. |\n| p03 | context | On the journey of Mila's class pass the risk decision sits between Larkfield's request to Adyen and the authorization request to her bank at 19:42 on 9 March 2027, and the typed-in card that set up her membership on 12 January is the kind of payment this chapter is mostly about. | scenario: Mila's €120.00 class pass, paid from a phone wallet with device authentication, approved at 19:42 on Tuesday 9 March 2027 at Studio Noord (on Adyen); her €49.00 membership set up on 12 January 2027 by typing in the card (ledger; consistency ruling 14). | `place`: The estimate made before the issuer is asked. → Where that step sits in the book's recurring payment. |\n| p04 | transition | The chapter goes from the Card-Testing Weekend at Larkfield to the kinds of fraud and how their evidence arrives, where the decision sits, how the models learn, why a threshold is a price, card testing, merchant risk, the comparison of Stripe and Adyen, Larkfield's changes, and the failures. |  | `sequence`: The chapter's place on the payment's journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: The Card-Testing Weekend\n\n**Controlling idea** (`example`, id `scene`): Over one weekend 61,000 stolen card numbers were tested through one studio's booking widget; Larkfield lost no data and almost no payment was ever disputed, yet it paid €4,100 and the studio could not take payments for 31 hours.\n\n**Advances the thesis** (C4): Poses the chapter's hardest case first: an attack in which no single payment looks like fraud and no dispute label ever arrives.\n\n**Transition in:** `example`: The introduction's claim that a provider estimates and a merchant pays. → One weekend at Larkfield in which the estimate had nothing to work with.\n\n**Order of paragraphs** (`chronological`): The attack, then what it cost and what it did not involve, then the questions it left; the questions are the chapter's sections, so they come last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | On the weekend of 8–9 August 2026 bots sent 61,000 one-euro drop-in payments, each with a different stolen card number, through the public booking widget of one studio. | scenario: The Card-Testing Weekend, 8–9 August 2026: 61,000 stolen card numbers, €1 drop-in payments, one studio's public booking widget (ledger). Illustrative split, labeled as assumption: about 38,400 attempts blocked by the provider before the network, 19,700 declined by issuers, 2,900 approved. |  |\n| p06 | analysis | The weekend cost Larkfield €4,100 in fees and refunds and cost the studio 31 hours without online payments, although Larkfield stored no card numbers and the approved payments were refunded before they could become disputes. | scenario: €4,100 in fees and refunds; the studio's payments paused for 31 hours (ledger). Illustrative split, labeled as assumption: €2,900 refunded on the approved €1 payments and about €1,200 in provider fees on attempts and refunds; each unrefunded payment could have become a dispute with an illustrative €15.00 fee. | `cause_effect`: The 61,000 attempts. → What they cost and what they did not touch. |\n| p07 | claim | When Femke de Graaf and Jonas Weber review the weekend in February 2027, three questions remain: what the provider's risk system decides and when, why a system trained on fraud did not treat this as fraud, and who chooses how strict it is. |  | `cause_effect`: A loss with no stolen data and no disputes. → The questions that the rest of the chapter answers. |\n\n### Five Kinds of Fraud, and How the Evidence for Each Arrives\n\n**Controlling idea** (`definition`, id `kinds`): Payment fraud is five different problems, and what separates them for a system builder is when and in what form the evidence that a payment was fraud arrives.\n\n**Advances the thesis** (C2): Supplies the vocabulary (dispute, fraud label, false positive) and shows that only one of the five kinds produces the per-payment label a model can learn from directly.\n\n**Transition in:** `elaboration`: Femke's question why a system trained on fraud did not see the weekend as fraud. → What 'fraud' covers, and how each kind becomes known.\n\n**Order of paragraphs** (`large_to_small`): The definition and the size of the problem come first, then the five kinds side by side, then what the table implies for anyone building a detector.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Card fraud becomes known to the payment system only as a dispute filed by the cardholder's bank, the loss from it falls on the merchant, and it is concentrated in online payments. | quotation: \"the business suffers a loss equal to the amount of the payment, and the cost of any goods or services already provided. The business is also subject to a dispute fee.\"; statistic: EEA, 2024: the card fraud rate by value was 0.091% for remote payments against 0.007% for non-remote payments, \"13 times higher in value\". |  |\n| p09 | comparison | The five kinds (stolen-card fraud, card testing, account takeover, friendly fraud and merchant fraud) differ in who is deceived and in how the evidence arrives: as a dispute weeks later, as no per-payment evidence at all, or as a property of an account. | table: Table: kind \\| what happens \\| how the evidence arrives \\| who carries the loss by default. Stolen card: dispute weeks later; merchant. Card testing (\"testing a card (or multiple cards) on one site to see if it's still valid before using it on another site\"): no per-payment evidence; merchant pays fees, a later victim merchant takes the fraud. Account takeover (absent from both companies' risk-product documentation; the row follows Adyen's payment-fraud guide of 8 December 2025: \"when fraudsters get access to shoppers’ accounts\"): dispute or customer complaint; merchant. Friendly fraud (\"a legitimate cardholder makes a purchase, but then disputes it at a later date\"): the same dispute signal as real fraud; merchant unless it wins the dispute. Merchant fraud (\"a fraudulent business takes payments without providing the services or goods\"): many disputes against one account; the platform or provider if funds cannot be recovered. | `elaboration`: Fraud as an unauthorized payment that surfaces as a dispute. → The five kinds and the form their evidence takes. |\n| p10 | analysis | Because fraud is rare and the evidence for its kinds arrives so differently, a single verdict on a payment covers several separate prediction problems, and its most frequent error is a false positive: a legitimate payment refused. | reasoning: At roughly 9 euros of fraud in every 10,000 euros of remote card payments (ECB/EBA, 2024), a detector that is wrong about 1% of legitimate payments refuses about ten good payments for every fraudulent one it could possibly catch. The author's arithmetic and judgement, labeled as such. | `cause_effect`: Five kinds whose evidence arrives in three different forms. → What that means for a single score, and the term false positive. |\n\n### Where the Decision Sits: Before the Issuer, and Again After\n\n**Controlling idea** (`explanation`, id `where-it-sits`): Both providers make a first risk decision before the payment is sent to the card network and a second after the issuer answers, and the score behind both is an estimate of a later fraud dispute computed inside the payment's time budget from signals collected across many merchants.\n\n**Advances the thesis** (C1): Establishes the mechanism the thesis describes: an estimate, in front of the issuer, on a time budget, from cross-merchant signals.\n\n**Transition in:** `sequence`: Fraud that cannot be known at payment time and a score that will often be wrong about good payments. → Where in the authorization path that score is used.\n\n**Order of paragraphs** (`chronological`): The order of the payment itself: the decision before the network, the decision after the issuer's answer, then what the number in both means, how long it may take, and what it is computed from. The score is defined after the two decision points because the reader needs to know what is being decided before learning what the number estimates.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | explanation | The first decision is made before the card network and the issuer see the payment, so a blocked payment is one the bank was never asked about. | fact: Stripe: the outcome of a payment blocked for risk shows `\"network_status\": \"not_sent_to_network\"`, `\"type\": \"blocked\"`, `\"reason\": \"highest_risk_level\"`.; quotation: Adyen: \"Pre-authorization: the risk rule conditions are assessed before the payment is authorized. This saves issuer and scheme fees compared to blocking after authorization.\"; figure: Figure: the authorization path with two decision points, one before the network and one after the issuer's answer. |  |\n| p12 | explanation | A second decision is made after the issuer answers, because some signals (the result of the security-code and address checks, the outcome of authentication) exist only then, and review by a person comes later still, after the money is already reserved. | quotation: Adyen: in post-authorization rules \"the risk evaluation can take extra signals into account that are only available after authorization. For example authentication results, CVC/CVV codes, or AVS responses.\"; fact: Stripe: built-in rules \"block certain payments that the card issuer approved\"; \"Payments placed into review are typically already successfully processed, unless you capture authorized payments later.\" Adyen: with capture delay for case management, \"up to seven calendar days to reject a transaction\". | `sequence`: The decision in front of the issuer. → The decision after the issuer's answer and the review queue behind it. |\n| p13 | definition | The risk score used at both points is an estimate of how likely the payment is to end in a fraud dispute, exposed by Stripe's product, Radar, as a number from 0 to 99 with the levels normal, elevated and highest, and by Adyen's, Protect, as one of five levels. | quotation: Adyen: the risk level \"indicates the likelihood that a transaction will result in a fraudulent dispute\", \"ranging from Very Low to Very High\"; \"By default, the block threshold for this rule is set to high risk and above.\"; fact: Stripe: \"a risk score that ranges from 0–99\"; \"By default, a score of 65 or above indicates elevated risk, while a score of 75 or above indicates high risk\"; high-risk payments are blocked by default and elevated-risk payments allowed. The score is returned only on certain Radar plans (the plans are named Lite, Standard, Plus and Pro as of November 2026). | `elaboration`: Two decision points that both use a score. → What the score is an estimate of, and how each company exposes it. |\n| p14 | explanation | The estimate has to fit inside the payment's time budget, for which Stripe published 'less than 100 milliseconds' in 2023 and Adyen has published nothing, and only Stripe documents what happens when the evaluation fails. | quotation: Stripe, 2023: Radar \"makes this decision, accurately, in less than 100 milliseconds\" (evidence age: more than three years); 2024: \"the time required to retrieve features directly impacts the overall payment API latency\"; 2026: the model \"scores payments in milliseconds\".; fact: Stripe: \"an error might cause risk evaluation to fail. If this happens, Stripe reports the payment as having unknown risk\"; the documented example outcome shows the payment authorized with `risk_level` `unknown`.; table: Requirements table: how fast (Stripe: under 100 ms, 2023; Adyen: no figure for the whole decision; its January 2025 engineering post gives the model-serving service \"a p50 of 20 ms and p99 of 100 ms\" per request and \"between 2 and 5\" model endpoints per transaction), how consistent (the same answer for a retry: Stripe pins retries to the same traffic-allocation bucket), how available (documented for neither), what happens on failure (Stripe: unknown risk, payment proceeds; Adyen: not documented). Followed by an INFERENCE, NOT DOCUMENTED block on timeouts. | `additional_support`: A score defined as an estimate. → The time it has and what happens when it cannot be computed. |\n| p15 | explanation | The inputs to the estimate, called fraud signals, come mostly from the provider's view across many merchants and from data its client-side script collects, so how a merchant integrates decides how much the model can see. | quotation: Stripe, 2026: \"a credit card that is new and untrusted to one business might have years of history elsewhere on Stripe that proves it's OK or an IP address may link activity across several cards and accounts.\"; quotation: Adyen: models \"can detect recent fraud on a shopper's email address or recognize a good shopper because of a recent in-person payment on a card on the Adyen platform\"; \"Adyen collects data about how shoppers interact with and use the payment form.\"; fact: Stripe's card-testing guidance lists the data a merchant can send to its card-testing models and marks \"Advanced fraud detection\" (device and activity signals collected by its JavaScript library) as \"Highest impact\". | `elaboration`: An estimate that must be fast. → What it is computed from, and the term fraud signal. |\n\n### Learning Weeks Later: Labels, Delay and the Payments Nobody Sees\n\n**Controlling idea** (`explanation`, id `learning`): A fraud model learns from disputes that arrive over about two months and never arrive for payments it blocked, so its measured performance is always provisional and it must let some risky payments through to keep learning.\n\n**Advances the thesis** (C2, C5): Gives the dated evidence for the second half of the thesis (the facts arrive weeks afterwards and never for blocked payments) and records what each company has published about the model that does the learning.\n\n**Transition in:** `cause_effect`: A score that estimates a future dispute. → How and when the system finds out whether the estimate was right.\n\n**Order of paragraphs** (`prerequisite_order`): The delay comes first because the rollback is its consequence; the missing labels for blocked payments are a second, separate gap, answered by the holdout; the feedback loop names what the two gaps have in common; the published model detail closes the section because it is the system the earlier paragraphs describe.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | evidence | The fact a model learns from, called a label, is the fraud dispute, and Stripe's 2026 figures show it arriving slowly: 41% of fraud disputes by day 14, 66% by day 30 and 86% by day 60. | quotation: \"For a payment made with a stolen card, it could take weeks for the cardholder to notice and report it to their bank. When Stripe receives the fraudulent dispute, we gain a fraud label for a payment we scored weeks earlier.\" Chart: the cumulative share of fraudulent disputes reported reaches \"41% by day 14, 66% by day 30, and 86% by day 60 after the payment\".; figure: Figure: the label-arrival curve with the points 41%, 66% and 86% at days 14, 30 and 60. |  |\n| p17 | example | Because of that delay a model or rule that looks better after two weeks can turn out worse, which is what Stripe reports happened to a larger Radar model it had to roll back. | quotation: A larger model \"looked better in offline tests and in early results of a production experiment. But, as more fraud reports arrived, its measured performance fell below the earlier model's, and we had to roll back\"; training without downsampling had added \"more fraudulent examples labeled as legitimate, about 20 times more\". | `cause_effect`: Labels that take two months to arrive. → What happens to a judgement made before they have. |\n| p18 | explanation | A blocked payment never receives a label at all, so a provider needs a holdout: Adyen documents one (control traffic) and Stripe documents a device that reads as one. | quotation: Stripe: \"For a small subset of payments, Stripe modifies the reported risk score so we can measure the performance of our models and obtain data for subsequent model development.\"; quotation: Adyen: \"A very small percentage of all transactions is randomly selected to be part of control traffic. Control traffic transactions are settled regardless of their risk evaluation.\" Excluded: \"Transactions with an amount of EUR 2000 or higher\". | `additional_support`: Labels that arrive late. → Labels that never arrive, and the holdout that replaces them. |\n| p19 | definition | Together these make a feedback loop: the system's own decisions determine which outcomes it will later see, and merchants add to the loop when they report a payment as fraudulent. | fact: Stripe: refunding a payment with the reason `fraudulent` adds the card fingerprint and email address to the default block lists, and \"Our AI models respond to feedback you share with us\".; reasoning: Friendly fraud arrives through the same dispute signal as stolen-card fraud, so the labels are noisy in both directions. The author's judgement, labeled as such. | `conclusion_summary`: Late labels and missing labels. → The term feedback loop and the merchant's part in it. |\n| p20 | evidence | Stripe has published the lineage and size of the model that does this learning, while Adyen has published nothing about its fraud-risk model, and Stripe has not said how often Radar is retrained. | fact: Stripe, 2023 (evidence age: more than three years): from \"relatively simple ML models (e.g., logistic regression)\" to an ensemble of XGBoost and a deep neural network, then \"in mid-2022 ... to a pure DNN-only model\". Stripe, 2026: the transaction-fraud model is named Shield and was trained on \"roughly 800 million\" sampled transactions; a version trained on more data \"grew to roughly 30 million parameters, three times its previous size\" and was rolled back (the size of the production model is not stated); a new training configuration \"improved recall by over 8%\" in a controlled comparison; \"regular retraining\" with no interval stated; a Stripe engineering post of 7 May 2019 said Radar's models were trained and deployed \"on a daily cadence\" (evidence age: 7 years). Adyen, 16 August 2024 (evidence age: 2 years): fraud models \"currently based on tree-based ensembling models\", retrained \"on a default weekly cadence\".; fact: Adyen's documentation says only that the premium tier offers \"Machine learning powered fraud detection using global transaction data\". | `elaboration`: The feedback loop as a mechanism. → What each company has published about the model inside it. |\n\n### The Threshold Is a Price: Refused Customers against Fraud Losses\n\n**Controlling idea** (`analysis`, id `threshold`): The block threshold trades legitimate customers refused against fraud accepted, both costs fall on the merchant, and the merchant's real configuration choices (threshold, rules, lists, review) are ways of setting that price and testing it.\n\n**Advances the thesis** (C3): Argues the thesis's final clause and gives the reader the rule for setting or challenging a threshold.\n\n**Transition in:** `cause_effect`: A model whose errors are only visible weeks later and partly never. → Who chooses how strict it is, and on what basis.\n\n**Order of paragraphs** (`problem_solution`): The trade and who pays come first; the break-even rule turns it into a number; the four configurations are the ways to act on the number; rules get their own paragraph because they are the configuration that most often goes wrong; testing closes the section because every earlier choice has to be checked against the label delay of the previous section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | Wherever the threshold is set it trades two errors, fraud allowed and good customers refused, and the merchant pays for both. | quotation: Stripe: \"you're ultimately responsible for payments you choose to accept, including those that are later disputed or found to be fraudulent.\"; fact: Stripe, 2023 (evidence age: more than three years): \"Radar incorrectly blocks just 0.1%\" of legitimate payments. A vendor's network-wide average, not any one merchant's rate.; figure: Figure: a threshold slider between two piles, refused good customers and accepted fraud. |  |\n| p22 | explanation | The threshold that minimizes cost blocks a payment only when its chance of fraud times the cost of a fraud case exceeds its chance of being legitimate times the cost of refusing a good customer, so it depends on the merchant's margins and not on the model. | quotation: Adyen's guidance: retailers with thin margins should set a Low or Medium threshold because \"the cost of a fraud case ... largely outweighs the cost of a false decline\"; sellers of digital goods a High or Very High one because \"the cost of a false decline (potential loss of lifetime value) mostly outweighs the cost of a fraud case\".; reasoning: Break-even probability = cost of a refused customer ÷ (cost of a refused customer + cost of a fraud case). Illustrative: a €200 item that cost the retailer €160, with a €15 dispute fee: a fraud case loses €175, a refused customer the €40 margin, so 40 ÷ (40 + 175) = 19%. Adyen's documentation states the dependence: \"The optimal blocking threshold ... depends on your business model and the difference in cost between a fraud case and a false decline.\" | `elaboration`: Two errors, both paid by the merchant. → The rule that prices one against the other. |\n| p23 | comparison | A merchant can run the provider's model in four configurations, each giving more control at more cost: the default, its own threshold, its own rules and lists on top, and manual review of the middle band. | table: Trade-off table: configuration \\| what you control \\| what it costs \\| when it is right. Rows: provider default; own threshold (Stripe risk settings and presets, Adyen risk level per profile); model plus rules and lists; plus manual review (Stripe review queue after processing; Adyen case management with up to seven days). | `sequence`: A price that depends on the merchant. → The four ways a merchant can set it. |\n| p24 | explanation | Rules are the merchant's own, explainable additions to the model, whose actions are allow, block and, between the two, review by a person or a request for 3-D Secure (asking the issuer to check who is paying), and their danger is the allow rule, which overrides the model for everything it matches. | quotation: Stripe: \"Implement any allow rules minimally, because they override the Stripe default rules, along with any other custom rules that match the same criteria\"; \"You can create a maximum of 200 transaction rules and 100 account rules.\" Adyen: \"Allow rules have the highest priority within a risk profile.\" Stripe's example of the third action: `Request 3D Secure if :risk_level: != 'normal' and :amount_in_usd: > 25`. | `elaboration`: The third configuration, model plus rules. → What a rule can do and where it bites back. |\n| p25 | recommendation | Any change to a threshold or rule should be tested before and during rollout with the tools both providers document (a backtest on past payments, a partial or shadow rollout, a live experiment) and judged only once the labels are in, because the backtest and the control group are the only places a merchant can see what a rule refuses. | fact: Stripe: the rule tester \"runs a simulation on the last 6 months of charges\"; traffic allocation applies a rule to a percentage of matching payments, 0% evaluates it in shadow, and \"Radar assigns all attempts for the same transaction to the same allocation bucket, so each retry receives the same outcome as the original attempt.\" Adyen: custom rules can be backtested (premium), and risk experiments \"A/B test two risk profiles against each other\" on \"real transactions\". | `problem_solution`: Rules that can silently override the model or refuse good customers. → How to test a change, and when to judge it. |\n\n### Card Testing: Fraud That Leaves No Label\n\n**Controlling idea** (`explanation`, id `card-testing`): Card testing produces no per-payment label and few disputes, its declined attempts still cost the merchant, and the only place to stop it is before authorization, by limiting the endpoint and by models that watch the shape of traffic.\n\n**Advances the thesis** (C4): Argues the one kind of fraud the estimate-and-learn mechanism of the earlier sections cannot handle, and answers the scene's question.\n\n**Transition in:** `contrast`: A score, a threshold and a feedback loop that all depend on dispute labels. → The kind of fraud that produces none.\n\n**Order of paragraphs** (`problem_solution`): What the attack is and why it is run, why the dispute-trained model is slow to see it, why waiting for the issuer to decline is not good enough, then the layered controls. The cost of declined attempts has to come before the controls because it is the reason the controls sit in front of authorization.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | definition | Card testing is the use of a merchant's checkout to find out which stolen or guessed card numbers work, and it is worth doing because a validated card is used for real fraud elsewhere within days. | quotation: Adyen, 2026: \"verification, where bots iterate through lists of stolen credentials using low-amount transactions to identify active cards; and enumeration, where scripts systematically guess missing fields, such as CVVs or expiry dates, within specific BIN ranges.\"; statistic: Visa, 2024 (its own data): \"Thirty three percent of enumerated accounts experienced fraud within five days\"; enumeration causes \"$1.1B annually in fraud losses\". |  |\n| p27 | explanation | A model trained on disputes is slow to see card testing because each attempt looks ordinary and none carries a label; the evidence is in the shape of traffic over minutes, which is what Adyen's 2026 description of its bot-attack model is built around. | quotation: Adyen, 2026: \"Unlike chargeback fraud ... card testing offers no explicit transaction-level signal.\" \"Rotational attacks: Fraudsters continuously rotate details—such as IP addresses—to stay well below baseline velocity thresholds.\" Features are computed on \"subslices\" such as a BIN range at one merchant; a feature language is compiled to Apache Spark for training and to Apache Kafka and Flink for live scoring, and \"Flink writes these streaming metrics to an Apache Cassandra feature store, where the risk engine fetches the latest subslice values to make real-time block/allow decisions before sending transactions to the issuer.\"; figure: Figure: single payments that each look normal beside the aggregate view of one slice of traffic in which the attack is obvious. | `contrast`: An attack made of small, ordinary-looking payments. → Why per-payment scoring misses it and what detects it instead. |\n| p28 | cause_effect | Attempts that the issuer declines still cost the merchant: in fees, in its standing with issuers, and in the card networks' monitoring, which counts declined attempts as well as approved ones. | quotation: Stripe: \"A high decline rate might damage the reputation of your business with card issuers and card networks, which makes all of your transactions appear riskier\"; symptoms include \"A spike in requests with 402 errors\".; fact: Visa's Acquirer Monitoring Program (fact sheet, 2025) defines an enumeration ratio as \"[Count of Enumerated Authorization Transactions (Approved + Declined)] ÷ [Count of Authorization Transactions (Approved+ Declined)]\", with thresholds of 2,000 basis points and 300,000 enumerated transactions in a month, and \"requires acquirers to take proactive steps to prevent merchants from exceeding enumeration thresholds\". | `cause_effect`: An attack the issuer mostly declines. → Why those declines are still the merchant's problem. |\n| p29 | recommendation | Card testing therefore has to be stopped before authorization, in two layers: limits the merchant puts in front of any endpoint that can start a payment, and the provider's pre-authorization blocking, whose published results are vendor claims without baselines. | quotation: Stripe: \"simple firewall rules or filters based on a single heuristic such as IP addresses are usually not sufficient\"; recommended merchant controls are CAPTCHA, requiring login before the payment form and rate limits; card-testing prevention is included in every Radar plan. Adyen: the bot-attack rule \"detects and blocks transactions that come in at an unusually fast rate with suspicious payment properties ... This rule mostly prevents large scale attacks\" and is in the basic tier with no configuration.; fact: Vendor claims: Stripe (May 2025), \"While attacks are up industry-wide, they are down 80% on Stripe\"; Adyen (October 2026), \"increasing blocked card testing attacks by 28% on average, with zero impact on legitimate shoppers\". Neither gives baseline, period or method. | `problem_solution`: Declines that cost the merchant. → Where and how to stop the attempts earlier. |\n\n### Risk Beyond the Payment: When the Merchant Is the Risk\n\n**Controlling idea** (`explanation`, id `merchant-risk`): The same structure, an estimate now and the facts later, applies to the business being paid: a provider that pays a merchant before the dispute window closes is exposed to that merchant, scores accounts and holds funds against the exposure, and publishes little about how.\n\n**Advances the thesis** (C6): Extends the thesis from the payer to the payee and opens the thread that the compliance chapter picks up.\n\n**Transition in:** `similarity`: Risk decided per payment, about the payer. → Risk decided per account, about the party being paid.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | explanation | Merchant fraud and merchant failure are properties of an account, and because a provider pays out before customers' right to dispute has expired it carries a credit exposure to every merchant, which both companies manage with account-level scores or funds held back. | quotation: Stripe, 2026: its risk decisions include \"Is the business trustworthy? ... Has this business become suddenly popular, or is it under attack? Should we adjust a business' credit reserves?\"; for platforms, an account risk score estimates the probability \"that an account would cause losses to your platform\".; quotation: Adyen: \"Adyen calculates the deposit requirement for your account daily, based on variables such as your processing volume and the number of chargebacks and refunds\"; if exposure exceeds coverage \"by more than EUR10,000, then Adyen automatically withholds funds from your next payout\". |  |\n| p31 | analysis | Stripe names the factors behind a reserve and both companies list the businesses they prohibit, but the credit criteria and models by which either accepts a merchant are not public, and for a platform the practical point is that a seller's loss the seller cannot cover falls on the platform or the provider, which is where the next chapters on compliance and platforms take over. | fact: Stripe's support site names the factors behind a reserve (\"industry conditions, payment activity, dispute rate, refund rate, and financial stability\") with no formula or amounts; each company publishes a list of prohibited businesses; no credit criteria or models were found in documentation, help centers, sites or engineering posts (17 November 2026). Stripe: \"responsibility for your connected accounts' negative balances can belong to your platform or to Stripe\". Larkfield's terms: the studio carries a lost dispute; if its balance cannot cover it, the loss falls on Larkfield (ledger). | `contrast`: What the two companies document about account risk. → What they do not, and what a platform should take from it. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Stripe and Adyen document the same decision points and kinds of control, and a holdout that Adyen states and Stripe's documentation only implies, and differ in how fine a score they expose, how a rule's timing is chosen, how a change is tested and, most of all, in how much each has published about its models.\n\n**Advances the thesis** (C5): Sets the documented facts of the earlier sections side by side and states what neither company has published.\n\n**Transition in:** `conclusion_summary`: Decision points, scores, holdouts, rules, card-testing controls and account risk described company by company. → The same facts in one table, with the author's reading.\n\n**Order of paragraphs** (`comparison`): The table carries the facts in cells without retelling the earlier sections; the reading follows because it is advice drawn from the rows; the list of what is not public closes the section because it qualifies both columns. The section comes after merchant risk so that the gap in underwriting can be listed with the others.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | comparison | Seven aspects separate or align the two in the public record, from where a rule runs to what has been published about the model. | table: Where They Differ table, seven rows: decision before the network; exposed score and default block; holdout; testing a change; card-testing control; published model detail; published latency. Every Stripe and Adyen cell is a fact cited earlier in the chapter or 'Not public'; the last column is the author's inference. |  |\n| p33 | recommendation | On Stripe an integrator should read the outcome of every payment and use the rule tester and traffic allocation; on Adyen it should decide for each rule whether it runs before or after authorization, check which tier its features need, and use control traffic and experiments to measure. | reasoning: Follows from the table: Stripe exposes a finer score and per-rule rollout; Adyen exposes timing as a property of each rule and gates the fraud-risk model, custom rules and experiments behind premium features. | `cause_effect`: The documented differences. → What an integrator does differently on each. |\n| p34 | analysis (list) | Six things were not found in either company's documentation, help center, site or engineering posts: the size and training data of Adyen's fraud-risk model, both companies' merchant underwriting (credit criteria and models, the amounts behind Stripe's reserve factors and Adyen's deposit calculation), how often Radar is retrained now, a latency figure for Adyen's whole risk decision, behavior on timeout at either, and how Stripe's payments foundation model relates to the model its engineers describe. | fact: List of gaps, each checked against the sources read on 17 November 2026: Adyen's fraud-risk model beyond its family and weekly retraining (size, training data); merchant credit criteria and models at both, and the amounts behind Stripe's named reserve factors and behind Adyen's documented deposit calculation (its deposit page gives the exposure and coverage components); the size of the Shield model in production; Radar's current retraining interval (daily in 2019; \"regular retraining\" only in 2026); a latency figure for Adyen's whole risk decision; timeout behavior at both; the relation between the payments foundation model announced on 15 May 2025 and Shield (the October 2026 engineering post does not mention it). | `contrast`: What the public record supports. → Where it stops. |\n\n### In Practice at Larkfield: Closing the Open Till and Pricing Two Thresholds\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield's answer to the weekend was limits in front of the widget, not a stricter fraud model, and when it did set thresholds it priced them per product and refused to judge a new rule before its labels had arrived.\n\n**Advances the thesis** (C3, C4): Applies the card-testing controls and the break-even rule with ledger numbers, and replays the acceptance probe's mistake inside the fictional company.\n\n**Transition in:** `example`: Mechanisms and the two providers' documented controls. → What one platform did with them.\n\n**Order of paragraphs** (`chronological`): The fix for the weekend, then the pricing done during Keel, then the rule Jonas proposed and how it was tested; the weekend comes first because it is what started the work, and the rule comes last because testing it needs both the priced threshold and the label curve.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | example | After the weekend Larkfield put three limits in front of the public booking widget (a challenge for guests who pay without logging in, a rate limit per studio in the payment service, and an alert on a studio's declined and blocked attempts) and left the providers' pre-authorization blocking on. | scenario: The Card-Testing Weekend (ledger) and decision K1 (every money-moving call goes through the payment service). New local facts, to be appended to the ledger: guest checkout requires a CAPTCHA; the payment service caps payment attempts per studio at a multiple of that studio's busiest recorded hour; an alert fires when a studio's declined and blocked attempts in ten minutes exceed its usual hourly total. |  |\n| p36 | example | Pricing the threshold with the break-even rule gives two different answers for one studio: a first €49 membership payment should be blocked only above about a 96% chance of fraud, a €16 guest drop-in above about 52%. | scenario: Ledger prices: membership €49.00 a month, drop-in €16.00, illustrative dispute fee €15.00. Assumptions, labeled: a member stays eight months on average (€392 of revenue); a class seat has no marginal cost, so a fraud case costs the studio the €15.00 fee. Membership: 392 ÷ (392 + 15) = 96%. Drop-in: 16 ÷ (16 + 15) = 52%. | `sequence`: The endpoint limited. → The threshold priced, per product. |\n| p37 | example | When Jonas proposed blocking every elevated-risk payment on the Stripe studios and pointed to two weeks of lower disputes, Femke asked for the two things that result could not show, and the rule went to shadow evaluation, a backtest and a sixty-day wait instead. | scenario: Illustrative Larkfield decision (March 2027): the rule `Block if :risk_level: = 'elevated'` is run at 0% traffic allocation and tested against the last six months of charges; the verdict is set for sixty days after rollout, when Stripe's 2026 curve says about 86% of fraud disputes have been reported. On Adyen the threshold stays at the default and control traffic supplies the comparison. | `contrast`: A threshold set from costs. → A rule proposed from two weeks of results. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): A risk system fails quietly in three ways: the evaluation does not run, a rule or list switches the model off for some traffic, or good customers are refused without any error appearing; each needs its own detector.\n\n**Advances the thesis** (C1, C3): Shows the failure side of the synchronous estimate and of the merchant-set price.\n\n**Transition in:** `contrast`: A risk setup that works as designed. → The ways it fails without announcing it.\n\n**Order of paragraphs** (`order_of_importance`): From the failure that is rarest and documented, through the one a merchant causes itself, to the one that is commonest and hardest to see, which is why it comes last and gets the detector the whole chapter has been building toward.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | analysis | When the risk evaluation itself fails, Stripe documents that the payment goes ahead marked as unknown risk, so a merchant should count and review those payments instead of treating the absence of a block as a pass. | fact: Stripe: \"In unusual cases, an error might cause risk evaluation to fail. If this happens, Stripe reports the payment as having unknown risk\"; the example outcome has `\"reason\": \"unknown_risk_level\"` and `\"type\": \"authorized\"`. Adyen documents no equivalent. |  |\n| p39 | analysis | A broad allow rule or a stale allow-list entry turns the model off for whatever it matches, and a rule that treats a retry differently from the first attempt gives the same customer two answers. | fact: Stripe: allow rules \"override the Stripe default rules\"; \"Allowlists can allow fraudsters to operate without restrictions and bypass controls\", and entries on default fingerprint allow lists \"have a maximum lifespan of 30 days\"; retries are pinned to one allocation bucket. Adyen: allow rules have the highest priority. | `additional_support`: A failure of the provider's evaluation. → A failure the merchant configures itself. |\n| p40 | analysis | The commonest failure raises no error at all: a threshold or rule that refuses good customers shows up only as sales that did not happen, and the opposite mistake shows up months later as a dispute rate that crosses a card network's monitoring threshold. | fact: Visa's Acquirer Monitoring Program (fact sheet, 2025) counts fraud reports and disputes against settled transactions and lowered its 'Excessive' merchant threshold in the EU, the US, Canada and Asia-Pacific to 150 basis points on 1 April 2026.; reasoning: Detection for the first mistake is a holdout or control group and the blocked-payment count per rule; for the second, the dispute rate by cohort month, read only after sixty days. The author's recommendation. | `emphasis`: Failures that at least leave a trace in configuration. → The failure that leaves none. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The decision point, the label delay, the threshold and card testing are one fact seen four ways: every risk decision is made before its evidence exists. The score is a forecast of a dispute; the model's quality is known two months late and only for what was allowed; the threshold is a bet placed with the merchant's money; and card testing is the case where the evidence never comes as a label at all. That is why the provider's part (the estimate) and the merchant's part (the price, the limits, the patience to wait for labels) cannot be swapped or merged.\n\n**So what:** A team that believes the provider detects fraud will switch the product on, tighten it after an incident and call the result a success two weeks later. A team that sees an estimate and a price will set the threshold from its margins, keep a holdout, date every verdict sixty days out, and put a limit in front of every endpoint that can start a payment.\n\n**Callback:** The opening €1 payment at 03:14 on a Saturday, which nobody in the payment path could know was fraud. The reader can now say what could be known at that moment (a score, the shape of the traffic around it), what could not (the cardholder's consent), and that for this payment the useful control was a limit on the endpoint, not a better guess.\n\n**Takeaway** (`course_of_action`): Price your block threshold from the cost of a refused customer and the cost of a fraud case, per product; judge no model or rule change before sixty days of labels; keep a holdout; and limit every endpoint that can start a payment.\n\n**Hand-off** to [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html): `elaboration`: A risk rule has a third action between allow and block, 'request 3-D Secure', and on every payment the merchant allows without it the merchant carries the fraud loss. → What that third action is: handing the question of who is paying to the issuer, and the conditions under which the issuer then takes the loss as well.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | synthesis (list) | Established: both providers decide before the network and again after the issuer; the score estimates a later fraud dispute; labels take about two months to arrive and never arrive for blocked payments; the merchant is responsible for what it accepts. |  |  |\n| p42 | synthesis (list) | Depends on context: where to set the threshold, whether rules and manual review are worth their cost, which card-testing controls an endpoint needs, and whether a merchant has the volume to test a change. |  | `contrast`: What the field agrees on. → What changes with the merchant's margins, products and volume. |\n| p43 | recommendation (list) | The author's synthesis: a risk product moves the decision to the provider and leaves the price with the merchant, so I own the threshold, the control-group measurement and the endpoint limits myself and never judge a change before its labels arrive. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p44 | recommendation (list) | Eight questions let the reader test a fraud setup in a design review or a provider evaluation. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p45 | transition | Between allow and block a risk rule has a third course, 'request 3-D Secure', and on every payment allowed without it the merchant carries the fraud loss, which is the question the next chapter takes up. |  | `elaboration`: The third action of a risk rule and the loss left with the merchant. → Handing the question of who is paying to the issuer, and when the loss goes with it. |\n\n## Non-goals\n\n- The dispute process itself: chargeback reason codes, evidence, representment, deadlines. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html), [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html).\n- 3-D Secure flows, strong customer authentication, exemptions and the liability shift; the chapter only names 'request 3-D Secure' as a rule action. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- How card data is collected and which client-side integration leads to which compliance scope. See [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html).\n- Blocking a payment before the network to save a fee, and its effect on approval metrics. See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html).\n- Request limits and load shedding as a platform feature. See [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html).\n- Know-your-customer checks, sanctions screening, transaction monitoring and verification deadlines. See [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html), [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html).\n- Who carries a seller's negative balance on a platform, reserves and the liable account in detail. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Fraud between buyers and sellers on a marketplace (fake listings, scams, account abuse). See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](../listing-systems-architecture/fraud-prevention.html).\n- Authorized push payment fraud and fraud on bank transfers, which have no chargeback.\n- How to build a fraud model: algorithms, feature engineering, training infrastructure beyond what Stripe and Adyen have published.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The split of the Card-Testing Weekend's 61,000 attempts (38,400 blocked, 19,700 declined, 2,900 approved) and of the €4,100 (€2,900 refunds, €1,200 fees) is this chapter's illustrative assumption, appended to the ledger; the provider the studio was on is left unnamed. The part introduction should not contradict it.\n- Stripe's description of retraining (\"regular retraining\") gives no interval; the 'daily' statement is first-party (Stripe press release on Radar 2.0, 2018; engineering post of 7 May 2019) and is used with its evidence age.\n- Whether Radar's 'more than 1,000 characteristics' (2023) and 'hundreds of risk factors' (current documentation) describe the same thing is not reconciled anywhere public; the chapter uses neither number as a load-bearing fact.\n- Stripe's guide 'A primer on machine learning for fraud protection' (last updated 15 December 2021) was read in English in the absence audit; it points to the 2018 talk on counterfactual evaluation that the chapter cites.\n- Account takeover is defined in Adyen's payment-fraud guide and in Stripe's issuing and platform fraud guides, not in either risk product's documentation; the chapter follows Adyen's definition.\n\n## Decision log\n\n- **2026-11-17** — Ten body sections: the style guide's required elements (scene, Where They Differ, In Practice, When It Goes Wrong) plus kinds of fraud, decision points, learning, threshold, card testing and merchant risk. What each company has published about its models is placed with the mechanism it belongs to (Stripe's lineage with learning, Adyen's pipeline with card testing) and the gaps are listed once, in Where They Differ. Rejected: A separate section 'What Stripe and Adyen have published'; Folding merchant risk into the comparison section\n- **2026-11-17** — The provider of the studio attacked in the Card-Testing Weekend is left unnamed, so the scene does not attribute undocumented behavior to Stripe or Adyen; the worked rule example in 'In Practice' uses Stripe because its rule syntax, shadow allocation and six-month simulation are documented. Rejected: Naming Stripe as the studio's provider; A second worked rule example on Adyen\n- **2026-11-17** — The designs-and-trade-offs requirement of the style guide is met by the four merchant configurations and their table inside the threshold section, not by a separate section. Rejected: A separate 'designs' section on rules versus machine learning\n- **2026-11-17** — Four figures: the two decision points (structure), the label-arrival curve, the threshold as a dial with two costs, and single payments against the aggregate view (conceptual). Rejected: A figure of Adyen's streaming pipeline, which would need product names the style guide forbids in figures\n- **2026-11-17** — After the flow rubric (sound with notes): Radar and Stripe's risk levels are named where the score is defined; 3-D Secure is glossed where the rule actions are listed; the merchant's own way to see refused customers (backtest and control group) is stated in the testing paragraph; 'labeled' and 'fraud score' no longer appear before they are defined. Not acted on: moving Stripe's model lineage (learning section) into the comparison, and moving merchant risk after the Larkfield section; the first keeps the comparison a table of facts already cited, the second keeps the gap in underwriting listed with the other gaps. Rejected: Merging the published-model paragraph into Where They Differ; Placing merchant risk after In Practice\n- **2026-11-17** — Stripe's foundation-model claims of May 2025 are used only for the card-testing claim and listed among the gaps; no account of how the model is used in the authorization path is given, because none is public. Rejected: A paragraph on the payments foundation model as an architecture\n\n## Sources\n\n- **Internal**\n  - PLAN.md — The chapter contract: question, scope, owned terms (risk score, fraud signal, card testing, false positive, feedback loop), the Larkfield thread.\n  - journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged; the previous and next chapters' transitions; the part thesis.\n  - _research/brief-fraud-risk-and-compliance.md — Part 1 (sections 1.1 to 1.8), key numbers, open questions and research limitations.\n  - _research/scenario-ledger.md — The Card-Testing Weekend, prices, Mila's payments, the €120 dispute terms, the cast and Keel decisions.\n  - _research/consistency-issues.md — Rulings 8 (chapter 9 forward-references 'risk block' here) and 14 (Mila's pass is a wallet payment; the typed-in card is the membership set-up).\n- **External**\n  - Stripe documentation: Risk evaluation; Rules; Reviews; Lists; How Radar works; Risk settings; Card testing; Types of fraud; Account fraud prevention; Use Radar with Connect; Risk management with Connect (n.d., accessed November 2026) — Decision points, outcomes, score and thresholds, rules and precedence, traffic allocation and simulation, lists, holdout, failure behavior, card-testing guidance, fraud taxonomy; fetched and checked 17 November 2026.\n  - Stripe engineering posts: 'How we built it: Stripe Radar' (29 March 2023); 'Shepherd' (15 April 2024); 'Scaling Radar' (19 October 2026); 'Fine-tuning LLMs for risk assessment' (9 October 2026); Stripe blog on the Payments Intelligence Suite (15 May 2025) — Model lineage, latency, label-delay curve, rollback, Shield, risk decisions about businesses, the card-testing claim; fetched and checked 17 November 2026.\n  - Adyen documentation: Risk management; Configure your risk profile; Machine learning rules; Control traffic; Case management; Run A/B test experiments; Fraud data collection; Risk lists; Deposit (n.d., accessed November 2026) — Pre- and post-authorization rules, risk levels and default threshold, threshold guidance, control traffic, tiers, review window, experiments, deposit; fetched and checked 17 November 2026.\n  - Jaap Stefels, 'Catching card testing at scale with real-time features', Adyen, 4 October 2026 — Verification and enumeration, the absence of labels, subslice features, the streaming pipeline, the 28% claim; fetched and checked 17 November 2026.\n  - Visa press release of 7 May 2024 (VAAI Score); Visa Acquirer Monitoring Program fact sheet (2025) — Enumeration losses and the five-day figure; the enumeration ratio counting approved and declined attempts; the 150 basis-point merchant threshold from 1 April 2026.\n  - EBA and ECB, '2025 Report on payment fraud' (December 2025) — EEA card fraud rates for 2024, remote against non-remote, and the share from theft of card details.\n\n## Changelog\n\n- **2026-11-17** — Absence audit: 14 statements of absence re-tested with a wide search (documentation sitemaps, help centers, company sites, engineering posts, web search). Overturned: Adyen's fraud-risk model family and retraining (tree-based ensembles, default weekly cadence, 2024 post); account takeover is defined by both companies. Narrowed: Adyen latency (20 ms median, 100 ms p99 per model endpoint, 2025; no figure for the whole decision), Radar retraining (daily in 2018-2019), Stripe's holdout (2018 talk describes the method), Stripe's reserve (factors named on the support site), acceptance criteria (both publish prohibited-business lists), the foundation model (used against card testing). Seven sources added; evidence text of six units and three open questions aligned.\n- **2026-11-17** — Verification pass: 85 claims checked (69 confirmed, 7 corrected, 8 hedged, 1 unsupported and relabeled, 0 unreachable); the 30-million-parameter figure was presented as Shield's size but belongs to the version Stripe rolled back, and 'neither company documents the score as a probability' and 'no deposit formula is public' were contradicted by Stripe's risk-settings page and Adyen's deposit page.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — First version, written from PLAN.md, the journal spec and the fraud, risk and compliance research brief.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('both run a holdout (Stripe alters the score for a small subs' -> 'Adyen documents 'control traffic' and Stripe documents alter').\n- **2026-11-17** — Reconciliation after verification (17 November 2026): AC-3 narrows 'merchant underwriting' to acceptance criteria and models (Adyen documents its deposit calculation in outline); two units say Stripe's holdout is implied, not stated.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('what Adyen has published about its bot-attack model (2026)' -> 'what Adyen has published about its fraud models (tree-based ').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('the chapter states that Adyen's fraud-risk model, both compa' -> 'the chapter states what is not public: Adyen's fraud-risk mo').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen has described only its bot-attack feature pipeline (Oc' -> 'Adyen has described its bot-attack feature pipeline (October').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen publishes no latency figure.' -> 'Adyen gives 20 ms median and 100 ms at the 99th percentile p').\n- **2026-11-24** — Sweep of rulings 46-48: intent, acceptance criterion 3 and thesis how_why corrected for what Adyen has published about its fraud models (family and weekly retraining, 2024; 20 ms median and 100 ms p99 per model endpoint, 2025) and for Radar's daily retraining in a 2019 post (ruling 48e). Prose unchanged.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
