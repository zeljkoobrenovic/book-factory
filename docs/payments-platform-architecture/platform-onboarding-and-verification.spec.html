| `evidence_is_explained` | rubric | blocker |\n\n## Thesis\n\n**Question:** How does a platform get thousands of small businesses verified without losing them or its licence partner's trust?\n\n> **Claim:** By treating verification as a state the provider reopens for the life of every account, not as a sign-up step. To keep sellers, the platform requests only the capabilities a seller needs and lets the provider's hosted or embedded flow collect the documents; to keep the trust of the licensed provider, whose license requires the checks, it mirrors every open requirement and deadline with a named owner, so that the seller hears of a missing document from the platform first and the provider does not have to restrict an account the platform had not noticed.\n\n**Disputed by:** The view that onboarding is a conversion funnel that ends at sign-up, so the platform should own every screen through the API to keep drop-off low, and can leave what happens afterwards to the provider's emails to the seller.\n\n**So what:** Verification becomes an operated system with an owner, alerts and a seller-facing explanation, not a project that ends at launch: the first thing a neglected requirement breaks is a seller's payout, the first place it shows is the support queue, and because neither provider publishes a completion rate or a comparison of flows the platform has to measure sign-up drop-off on its own flows.\n\n**How and why:** Both providers gate what a seller may do behind capabilities that depend on verification, and both reopen verification after sign-up. Adyen's documentation (n.d., accessed November 2026) names the events that trigger verification, among them a seller changing its data and periodic data reviews, and standard deadlines of 30 days for payout capabilities and 60 for receiving payments; Stripe's (n.d., accessed November 2026) lists requirements as currently due, eventually due and past due against a per-account deadline and says it typically disables payouts first. That is the documented difference: Adyen's deadlines are standard periods a platform can build reminders on, Stripe's must be read per account. Stripe also documents that its hosted and embedded flows pick up new requirements immediately while API onboarding needs integration changes, and that who collects requirements is derived from who bears losses. Neither company publishes a completion rate or a comparison of its flows, so the cost of a hosted flow in lost sign-ups cannot be stated from the public record.\n\n**Supporting claims**\n\n- **S1** — A capability is a permission the provider switches on when its verification requirements are met, and what a seller must provide follows from the capabilities requested, the country and the business type; requesting only the capabilities a seller needs, and choosing how much to collect up front, are the platform's first controls on how many sellers finish sign-up.\n- **S2** — Verification data can be collected on the provider's hosted pages, in the provider's components embedded in the platform's application, or in the platform's own forms over the API; the three differ in what the platform must keep current, and on Stripe a platform collects requirements itself only in a configuration in which it also bears seller losses.\n- **S3** — The provider reopens verification after sign-up (changed seller data, changed rules, thresholds, periodic reviews), payouts are usually the first capability to stop, and the platform inherits every deadline whether or not it collected the data.\n- **S4** — A platform keeps both the seller and the provider's trust by holding every open requirement and deadline with a named owner, reminding the seller through a channel someone watches, and showing the seller the reason, the date and the provider's link or component that fixes it.\n- **S5** — Neither Stripe nor Adyen publishes conversion figures for its onboarding flows, so a platform has to measure drop-off and time to first payout on its own flows, from signals each provider documents.\n\n## Role in the part\n\nShows the first consequence of the loss assignment: the provider's license requires every seller to be verified continuously, and the platform inherits the deadlines whether or not it collects the data. Supports P7-2 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `chronological` in what-is-asked, three-ways-to-collect, after-sign-up: the order of a seller's life, from what is requested through how it is collected to what happens afterwards; `comparison` in three-ways-to-collect (three designs, both providers within each) and where-they-differ)\n\nThe scene and the second section state the problem as two losses. The next three sections answer them in the order a seller meets them: what is asked decides the loss at sign-up, the way of collecting decides who maintains the forms, and the work after sign-up answers the loss that comes later. If collecting came before what is asked, the reader could not judge the cost of own forms, which is the cost of tracking what is asked; if the work after sign-up came first, its dependence on the provider's flow for the seller's way back would be unexplained. Measurement follows the mechanisms because its stages are their signals. The comparison comes after every fact in its table has been cited, the Larkfield example applies the choices in the same order, and the failures are those of the recommended design, so they come last.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): On Monday 11 May 2026 the payouts of Ironworks Climbing stopped. Its three gyms in Manchester were full all week, every payment showed as paid in Larkfield's back office, and for nine days nothing reached the company's bank account. No screen Ravi Shah could open said why.\n\n**Bridge:** An engineer thinks of seller onboarding as a sign-up form: collect the fields, send them to the provider, mark the seller as onboarded. → The provider that holds the license never marks a seller as done: it switches capabilities on and off as requirements are met, reopened and missed, and the platform's product is where the seller feels each switch.\n\n**Thesis statement** (KEY POINTS bullet 1 and paragraph p02): A platform gets thousands of small businesses verified by treating verification as a state the provider reopens for the life of every account: it requests only the capabilities a seller needs, lets the provider's hosted or embedded flow collect the documents, and mirrors every open requirement and deadline with a named owner, so the seller hears of a missing document from the platform first.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from nine days in which a studio chain was paid by its customers and not by its platform. *Kept in:* scene.\n- Name the two ways a platform loses a seller, with the two terms it needs: capability and verification requirement. *Kept in:* two-ways-to-lose.\n- Show what decides how much a seller is asked for. *Kept in:* what-is-asked.\n- Compare hosted, embedded and API onboarding by what each leaves the platform to maintain. *Kept in:* three-ways-to-collect.\n- Say what the platform must do after sign-up: an owner for every deadline and a reason on the seller's screen. *Kept in:* after-sign-up.\n- Say what can be measured, and that no provider figures exist. *Kept in:* measuring.\n- Set Stripe and Adyen side by side. *Kept in:* where-they-differ.\n- Onboard the three-location chain on both providers and list the failures that remain. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | For nine days in May 2026 Ironworks Climbing was paid by its customers and not by its platform, and no screen its owner could open said why. | scenario: The Frozen Studios, May 2026: a verification requirement changed; 230 studios missed the deadline because Larkfield's reminder went to an unmonitored address; payouts paused for up to 12 days. New ledger addition: Ironworks Climbing (Ravi Shah, three locations in Manchester, on Stripe Connect) was one of the 230; its payouts were paused from Monday 11 May to Wednesday 20 May 2026, nine days. |  |\n| p02 | claim | Because every seller is an account at a licensed provider that must know who the seller is and keep knowing it, verification is a state the provider reopens for the life of the account, and the platform's job is to request little, let the provider's flow collect the documents and hold every open requirement and deadline with a named owner. | reasoning: From platform-payment-models: every seller is an account at a licensed provider with someone standing behind its losses. The provider's license requires the checks (payment-compliance-and-regulation), so the account may take payments and receive payouts only while the provider knows who the seller is. | `cause_effect`: Chapter 33's result that every seller is an account at a licensed provider, with someone standing behind its losses; the nine days of the opening. → What follows: the provider must know the seller and keep knowing it, which makes verification a state with deadlines, and the thesis about what the platform does with it. |\n| p03 | context | This chapter is before the first step of Mila's class pass: Studio Noord could take her €120.00 on 9 March 2027 and be paid on 11 March only because its capabilities at Adyen were active, and they stay active only while its verification does. | scenario: Mila's €120.00 ten-class pass at Studio Noord (on Adyen since 2024), Tuesday 9 March 2027; the studio's €117.47 paid out Thursday 11 March. | `place`: The chapter's claim. → Where it sits relative to the recurring payment. |\n| p04 | transition | The chapter goes from the nine days at Ironworks through the two ways to lose a seller, what a seller is asked for, the three ways to collect it, the work after sign-up and what can be measured, to the comparison of the two providers, the onboarding of Ironworks and the failures that remain. |  | `sequence`: Where the chapter sits. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Nine Days Without a Reason\n\n**Controlling idea** (`example`, id `scene`): Seen from the seller's side, the Frozen Studios were a product that showed every payment as paid and held no reason, no date and no way to fix a pause whose cause sat in the provider's record.\n\n**Advances the thesis** (S3, S4): Poses the chapter's question through one seller's view of a documented kind of pause, before any mechanism is named.\n\n**Transition in:** `example`: The nine days of the opening. → What Ravi Shah could and could not see, and what the review found missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Ravi Shah could see every payment and one running total, and could not see the open requirement, its deadline or how to meet it, because Larkfield's back office held none of them and its one email had gone to an address nobody read. | scenario: Ledger: before Keel the studio back office showed one running total per provider, copied from the provider, with no dates or reasons (13-balances-and-funds-flows); Larkfield's only response to the changed requirement was one batch email to each studio's sign-up address (26-kyc-aml-and-regulation); Aylin Demir's support team heard first. New local detail: Ravi's ticket of Thursday 14 May 2026.; figure: Conceptual figure: a studio front door with members paying, a pipe from the studio's balance to its bank closed by a valve, and a blank sign on the valve. |  |\n| p06 | analysis | Femke de Graaf's review of the incident from the seller's side found three things missing on Ravi's screen (the reason, the date and a way to fix it) and one thing wrong behind it: the sign-up forms were Larkfield's own, written in 2017, and had no field for what the provider now asked. | scenario: Femke de Graaf (joined January 2027) reviews with Aylin Demir, head of studio support. New ledger addition: until Keel, studios on Stripe signed up through Larkfield's own forms, which sent the data to Stripe over the API; the forms dated from Daniel Osei's 2017 integration and gained fields only when a country was launched. | `cause_effect`: What the seller could not see. → The review's finding: three things missing on the screen and a home-built form behind them, which order the chapter. |\n\n### Two Ways to Lose a Seller\n\n**Controlling idea** (`explanation`, id `two-ways-to-lose`): A platform can lose a seller at sign-up, by asking for more than the seller will give, and after sign-up, when the provider restricts an account the platform had not noticed; both follow from capabilities that depend on verification requirements.\n\n**Advances the thesis** (S1, S3): Defines the two terms the chapter owns and states the problem as two losses the later sections each answer.\n\n**Transition in:** `elaboration`: The review's two findings. → The vocabulary and the general form of the problem: capabilities, requirements and two ways to lose a seller.\n\n**Order of paragraphs** (`prerequisite_order`): The two terms come first because both losses are stated in them; the sign-up loss precedes the later one because it happens first in a seller's life.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | A capability is a named permission on a seller's account, such as taking card payments or receiving payouts, and a verification requirement is one fact or document the provider needs before, or in order to keep, a capability switched on. | quotation: Stripe (n.d., accessed 2026-11): 'Capabilities represent functionality that you can request for your connected accounts, such as accepting card payments or receiving transferred funds from your platform account. A capability must be active for a connected account to perform actions associated with that capability.' https://docs.stripe.com/connect/account-capabilities.md. Requirements 'describe the account information that Stripe needs in order to enable one or more capabilities for that account' (https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v2).; quotation: Adyen (n.d., accessed 2026-11): 'As required by payment industry regulations, Adyen must verify the users in your platform before you can process payments, pay out their funds, and offer financial products to them.' 'Based on the results of the verification checks, Adyen decides if a user can perform any action on your platform. These actions are known as capabilities.' https://docs.adyen.com/platforms/verification-overview.md |  |\n| p08 | analysis | The first loss happens at sign-up: every capability requested adds information the seller must provide, and a small business that came for booking software can give up at any question. | quotation: Stripe (n.d., accessed 2026-11): 'The capabilities you request for a connected account determine the information you’re required to collect for it. To reduce onboarding effort, only request the capabilities that your accounts need. Requesting more capabilities means the onboarding flow must verify more information.' https://docs.stripe.com/connect/account-capabilities.md; reasoning: A seller who abandons sign-up never takes a payment; the platform loses the seller and the provider is unaffected. Industry practice treats this as a funnel; no provider figure for it is public (measuring section). | `cause_effect`: Capabilities depend on requirements. → The first consequence: more requested means more asked, and sellers drop out. |\n| p09 | analysis | The second loss happens after sign-up: the provider reopens a requirement, the deadline passes and a capability is switched off, and the seller meets that on the platform's product whether or not the platform was the one collecting the data. | quotation: Stripe (n.d., accessed 2026-11): 'Stripe typically disables payouts on the account if we don’t receive the information by the `current_deadline`.' https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1. Adyen (n.d., accessed 2026-11): 'If the user does not resolve the verification issues in a timely manner, their capabilities will be disallowed.' https://docs.adyen.com/platforms/verification-overview.md; reasoning: The seller's payouts are a feature of the platform's product; when they stop, the seller calls the platform. The mechanism of deadlines and capability state is owned by payment-compliance-and-regulation. | `contrast`: The loss at sign-up. → The loss afterwards, which the seller meets on the platform's product. |\n\n### What a Seller Is Asked For, and What Decides It\n\n**Controlling idea** (`explanation`, id `what-is-asked`): What a seller must provide is decided by the capabilities requested, the country and the business type, and the platform controls two of the inputs: which capabilities it requests and how much it collects before the seller may start.\n\n**Advances the thesis** (S1): Shows the platform's first controls on sign-up loss: request little, and choose deliberately between collecting everything first and collecting as needed.\n\n**Transition in:** `problem_solution`: The loss at sign-up. → What decides how much is asked, and which of those inputs the platform controls.\n\n**Order of paragraphs** (`prerequisite_order`): The inputs are named before the two controls, because each control changes one input: the capabilities requested, then the timing of collection.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | explanation | The list of what a seller must provide is computed from the capabilities requested, the country and the type of business, so it differs between a sole trader and a company and between two countries, and for a company it includes the people who own and control it. | fact: Stripe (n.d., accessed 2026-11): 'Verification requirements for connected accounts vary by account, depending on: Country; Capabilities; Business type (for example, individual, company); Business structure (for example, public corporation, private partnership); The service agreement type between Stripe and the connected account; The risk level.' https://docs.stripe.com/connect/identity-verification.md; fact: Adyen (n.d., accessed 2026-11): 'Your users' legal entity type and operating country determine the required verification information' (https://docs.adyen.com/platforms/onboard-users.md); 'in Belgium, a sole proprietorship is required to have a registration number, while this is not required in the United Kingdom'; for an organization, in general: 'The legal name of the organization; The registration number; The registered address and the principal place of business, if different from their registered address; The ultimate beneficial owners, controllers, and signatories; The bank account for payouts'; UBOs through ownership are 'Individuals who directly or indirectly own 25% or more of the total shares, voting rights or other equity in the organization'. https://docs.adyen.com/platforms/verification-requirements.md |  |\n| p11 | recommendation | The platform's first control is to request only the capabilities a seller needs, because each one it requests for every seller by default is asked of every seller. | quotation: Stripe (n.d., accessed 2026-11): 'To reduce onboarding effort, only request the capabilities that your accounts need.' 'For some capabilities, requesting them enables them permanently. Attempting to remove or unrequest a permanent capability returns an error.' https://docs.stripe.com/connect/account-capabilities.md; fact: Adyen (n.d., accessed 2026-11): 'In the design phase, you set the default capabilities for your platform. These capabilities are requested every time you onboard a new user and create an account holder for them.' 'If a user needs a specific capability that is not requested by default, you must request the additional capability. In some cases, this requires more verification.' https://docs.adyen.com/platforms/verification-overview.md | `cause_effect`: The capabilities requested are one input to what is asked. → The control that follows: request few, and add later for the sellers who need more. |\n| p12 | comparison | The second control is timing, collecting everything before the seller starts or only what is due now, and the two providers offer it differently: Stripe leaves the choice to any platform, while Adyen tells platforms to collect up front and reserves collection in stages for payment facilitators. | quotation: Stripe (n.d., accessed 2026-11): 'Up-front onboarding collects the `eventually_due` requirements for the account, while incremental onboarding only collects the `currently_due` requirements.' Advantages listed for up-front: 'Normally requires only one request for all information', 'Avoids the possibility of payout and processing issues due to missed deadlines', 'Exposes potential risk early when accounts refuse to provide information'; for incremental: 'Accounts can onboard quickly because they don’t have to provide as much information'. https://docs.stripe.com/connect/identity-verification.md; quotation: Adyen (n.d., accessed 2026-11): 'As a platform, you should collect verification data from your users upfront because the capability to receive payments is automatically requested for them.' 'Only payment facilitators can use staggered verification.' 'When a user is moved to a higher tier, their payouts are temporarily disallowed until they complete additional verification checks.' 'There are four tiers.' https://docs.adyen.com/platforms/verification-overview/verification-types.md | `additional_support`: The first control, what is requested. → The second control, when it is collected, and how each provider offers it. |\n\n### Three Ways to Collect the Data: Hosted, Embedded, API\n\n**Controlling idea** (`comparison`, id `three-ways-to-collect`): Verification data can be collected on the provider's pages, in the provider's components inside the platform's application, or in the platform's own forms over the API, and what separates them is who keeps the forms current when requirements change and who handles the documents.\n\n**Advances the thesis** (S2): Sets out the three designs, each provider's version of them, the link between collecting and bearing losses, and the author's choice.\n\n**Transition in:** `sequence`: What is asked of a seller and when. → How it is collected: three designs that differ in whose screen the seller types into.\n\n**Order of paragraphs** (`comparison`): The three designs are taken from least to most work for the platform, each with both providers, so that the cost of the third is read against the first two; the rule on who may collect follows the API design it restricts, and the table and the recommendation close the comparison.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | explanation | The three ways differ in whose page the seller types into and whose server first receives the documents: the provider's page, the provider's component inside the platform's page, or the platform's own form and server. | fact: Stripe (n.d., accessed 2026-11) lists 'Stripe-hosted onboarding', 'Embedded onboarding' and 'API onboarding' (https://docs.stripe.com/connect/onboarding.md); Adyen (n.d., accessed 2026-11) lists 'Hosted onboarding' and 'API-only onboarding', with Onboarding components for use inside the platform's interface (https://docs.adyen.com/platforms/onboard-users.md).; figure: Structural figure: three lanes from a seller to the provider. Hosted: the seller leaves the platform's application for the provider's page. Embedded: a provider-drawn panel sits inside the platform's page and sends data straight to the provider. API: the seller fills the platform's own form, the platform's server receives the documents and forwards them. |  |\n| p14 | evidence | In hosted onboarding the platform creates the account and sends the seller to the provider's pages by a link, and both providers make that link short-lived or authenticated because it opens the seller's personal data. | quotation: Stripe (n.d., accessed 2026-11): 'Stripe-hosted onboarding is a web form hosted by Stripe with your brand’s name, color, and icon' (https://docs.stripe.com/connect/onboarding.md). The Account Link: 'You can only use each temporary Account Link URL once, because it grants access to the account holder’s personal information.' 'Don’t email, text, or otherwise send account link URLs outside of your platform application. Instead, provide them to the authenticated account holder within your application.' https://docs.stripe.com/connect/hosted-onboarding.md?accounts-namespace=v2; quotation: Adyen (n.d., accessed 2026-11): 'Hosted onboarding is our recommended solution for collecting the information needed to onboard your users.' Two variants: 'Onboarding on invite' ('All actions are performed in your Customer Area') and 'API-initiated'. 'Your user can securely access the hosted onboarding link with an SMS authentication.' https://docs.adyen.com/platforms/onboard-users.md. Release note of 2026-05-04: with Onboarding on Invite 'you can now choose to automatically send the hosted onboarding link by email instead of copying it manually' (https://docs.adyen.com/release-notes/platforms-and-financial-products.md). | `example`: The first of the three ways. → Each provider's hosted flow and how the seller reaches it. |\n| p15 | evidence | In embedded onboarding the provider's form is drawn inside the platform's application; Stripe documents a whole onboarding flow as one component, while Adyen documents components that cover parts of a flow the platform otherwise builds. | quotation: Stripe (n.d., accessed 2026-11): 'You embed the Account onboarding component directly in your application and your connected accounts go through the onboarding flow without leaving your application'; 'With embedded onboarding, you get a customized onboarding flow and don’t need to update your onboarding integration as compliance requirements change' (https://docs.stripe.com/connect/onboarding.md). 'Stripe uses an AccountSession to express your intent to delegate API access to your connected account' (https://docs.stripe.com/connect/get-started-connect-embedded-components.md?platform=web).; quotation: Adyen (n.d., accessed 2026-11): 'We recommend using the Onboarding components in your API-only onboarding flow to reduce engineering efforts and speed up implementation. It is important to note that the Onboarding components only cover certain functionality, and you still need to implement API calls for other parts of your API-only onboarding flow.' https://docs.adyen.com/platforms/onboard-users/components.md | `contrast`: The seller leaves the platform for the provider's page. → The provider's form inside the platform's page, complete at Stripe and partial at Adyen. |\n| p16 | evidence | In API onboarding the platform builds the forms and takes on everything the provider's flow carried: fields per country and business type, localization, error handling, the documents themselves, and keeping all of it current when requirements change. | quotation: Stripe (n.d., accessed 2026-11): with API onboarding you 'build an onboarding flow and handle identity verification, localization, and error handling for each country your connected accounts onboard in'; 'You must plan on reviewing and updating onboarding requirements at least every 6 months.' Table row 'Automatic updates for new compliance requirements': 'Immediate' for hosted and embedded, 'Requires integration changes' for API; new countries without integration changes: supported for hosted and embedded, not for API. 'We don’t recommend this option unless you’re committed to the operational complexity required to build and maintain an API onboarding flow.' https://docs.stripe.com/connect/onboarding.md; quotation: Adyen (n.d., accessed 2026-11): 'API-only onboarding: Build your own UI and collect required user data. You make API requests to create resources and submit the user data to Adyen. This onboarding type gives you complete control over the user journey within your platform's environment.' https://docs.adyen.com/platforms/onboard-users.md | `contrast`: The provider's form, hosted or embedded. → The platform's own form, and the list of what it now maintains. |\n| p17 | explanation | On Stripe the party that collects requirements is not chosen freely: it is derived from who bears seller losses, so a platform collects them itself only in a configuration in which it also carries the losses, and even then some requirements can be met only through Stripe's own interfaces. | quotation: Stripe (n.d., accessed 2026-11): 'In most configurations, Stripe is responsible for collecting KYC requirements from your connected accounts. Your platform is responsible only when you set `defaults.responsibilities.losses_collector` to `application` and `dashboard` to `none`.' 'Configure platform responsibility for requirements collection only if you’re prepared to manage the operational complexity required to verify requirement information and maintain compliance with any requirement updates.' https://docs.stripe.com/connect/accounts-v2/connected-account-configuration.md; quotation: Stripe (n.d., accessed 2026-11): 'Stripe risk reviews of a connected account can add extra requirements, which you can’t provide using the API. You can take action in your Dashboard, or the connected account can provide them through a Connect embedded component, Stripe-hosted onboarding, or a remediation link.' https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v2; fact: Adyen: the onboarding pages read (https://docs.adyen.com/platforms/onboard-users.md, https://docs.adyen.com/platforms/onboard-users/components.md, n.d., accessed 2026-11) tie the choice between hosted and API-only onboarding to no liability setting. | `elaboration`: The platform's own forms. → Who is allowed to collect at all on Stripe, and the requirements own forms cannot satisfy. |\n| p18 | comparison | Set side by side, the three ways trade the platform's control of the screens against the work of keeping forms current and handling documents. | table: Rows: hosted, embedded, API. Columns: what the seller sees; who keeps the fields current; who first receives the documents; what the platform still builds; when it is right. | `conclusion_summary`: The three ways and the rule on who collects. → The trade-offs in one table. |\n| p19 | recommendation | I would let the provider's flow collect the documents, embedded where the provider offers a complete component and hosted otherwise, and build own forms only when the platform has chosen to carry seller losses and can staff the reviews, since nothing public shows that own forms keep more sellers. | reasoning: The cost of own forms is documented (the review at least every six months, integration changes per requirement and country, the documents). The benefit claimed for them, lower drop-off, has no public figure from either provider (measuring section). Conditions under which the judgement changes: a seller population the provider's flow does not cover, or a platform that has measured a difference on its own sellers. | `cause_effect`: The trade-offs. → The author's choice and the conditions that would change it. |\n\n### After Sign-Up: An Owner for Every Deadline, a Reason for Every Seller\n\n**Controlling idea** (`explanation`, id `after-sign-up`): Because the provider reopens verification for the life of the account and payouts usually stop first, the platform has to hold every open requirement and deadline with a named owner, remind the seller by a channel someone watches, and show the seller the reason, the date and the provider's own way to fix it.\n\n**Advances the thesis** (S3, S4): Turns the continuing state established in payment-compliance-and-regulation into the platform's operating duties and the seller's screen.\n\n**Transition in:** `time`: Collection at sign-up. → What happens for the rest of the account's life, taken as given from the compliance chapter.\n\n**Order of paragraphs** (`problem_solution`): The reopening events and the order in which capabilities stop state the problem; the record with an owner, the channel and the seller's screen answer it in the order in which a requirement travels from provider to platform to seller.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | explanation | Four kinds of event reopen verification after sign-up: the seller changes its data, the rules change, a threshold of time or volume is crossed, or the provider runs a periodic review; none of them is triggered by anything the platform does. | fact: Adyen (n.d., accessed 2026-11): verification is triggered by 'Requesting capabilities for your user', 'When users change their data' and 'Periodic data reviews required by Adyen' (https://docs.adyen.com/platforms/verification-overview.md). Stripe (n.d., accessed 2026-11): 'Stripe frequently updates KYC requirements, often due to changes implemented by financial regulators, card networks, and other financial institutions' (https://docs.stripe.com/connect/handle-verification-updates.md?accounts-namespace=v1); 'At certain variable thresholds—usually when a specified amount of time has passed or volume of charges have been made—you might need to collect and verify additional information' (https://docs.stripe.com/connect/identity-verification.md). |  |\n| p21 | evidence | When a deadline passes, payouts are usually the first capability to stop and payments stop later, so the seller's first symptom is money coming in and none going out. | quotation: Stripe (n.d., accessed 2026-11): 'Stripe typically disables payouts on the account if we don’t receive the information by the `current_deadline`. However, other consequences might apply in some situations. For example, if payouts are already disabled and the account is unresponsive to our inquiries, Stripe might also disable the ability to process charges.' https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v1; fact: Adyen (n.d., accessed 2026-11): standard verification deadlines of a '30-day period' for `sendToTransferInstrument` (payouts) and other outgoing capabilities and a '60-day period' for `receivePayments` and `receiveFromPlatformPayments`; 'Users are allowed to continue using the capabilities while the deadline is active'; 'a standard deadline could be shortened or removed in specific situations'. https://docs.adyen.com/platforms/verification-overview.md; figure: Timeline figure for Adyen's standard periods: a requirement opens at day 0; payouts stop at day 30; payments stop at day 60; a person labeled owner and a reminder bell stand before day 30. | `cause_effect`: A reopened requirement carries a deadline. → What stops when it passes, and in which order. |\n| p22 | recommendation | The platform therefore holds each seller's open requirements, deadlines and capability status from the day the account is created, with a named person who owns every open deadline, whether or not the platform collects the data. | quotation: Stripe (n.d., accessed 2026-11): 'Responsible platforms must also monitor their connected accounts’ requirement statuses and handle any updates in a timely manner.' https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v2; reasoning: The record's fields and its daily re-read against the provider are set out in payment-compliance-and-regulation (the mirror; Keel decision K6). This chapter adds two points: it starts at account creation, and an owner is a person with a list, not a team mailbox. | `problem_solution`: Payouts stop first and the seller calls the platform. → The platform's answer: the state held from day one, with an owner. |\n| p23 | recommendation | A reminder has to travel by a channel someone watches, which for a small business is the product its staff open every day and not the email address typed at sign-up, and it has to reach the person who can act, who may be an owner or director and not the user of the back office. | scenario: The Frozen Studios: Larkfield's reminder went to an unmonitored address and 230 studios missed the deadline (ledger).; fact: Adyen (n.d., accessed 2026-11): in hosted onboarding a user 'can select Invite decision-maker to ask the decision-maker to complete their own verification'; 'Adyen sends an email to the decision-maker with a link to provide their information.' https://docs.adyen.com/platforms/onboard-users.md | `additional_support`: The record and its owner inside the platform. → How the open requirement reaches the seller, and which person at the seller. |\n| p24 | explanation | What the seller needs on the screen is the reason, the date and one action that leads into the provider's own flow, and both providers supply that action so the platform does not have to rebuild the form for each requirement. | quotation: Stripe (n.d., accessed 2026-11): the Notification banner component 'lists open tasks that can affect a connected account’s status or capabilities' (https://docs.stripe.com/connect/supported-embedded-components/notification-banner.md); 'Send a connected account back through onboarding when it has any `currently_due` or `eventually_due` requirements. You don’t need to identify the specific requirements, because the onboarding interface knows what information it needs to collect.' (https://docs.stripe.com/connect/hosted-onboarding.md?accounts-namespace=v2); fact: Adyen (n.d., accessed 2026-11): an invalid capability carries 'the `verificationErrors`, `subErrors`, and `remediatingActions` arrays' (https://docs.adyen.com/platforms/verification-overview/capabilities.md); the 'View Verification Status component ... automatically creates a hosted onboarding link, redirects your user to the Adyen-hosted page to provide their information, and shows their verification status' (https://docs.adyen.com/platforms/onboard-users.md); a periodic review arrives as error 3_10 with a deadline and is closed by a call to `/legalEntities/{id}/confirmDataReview` (https://docs.adyen.com/platforms/verification-overview/data-review-process.md). | `sequence`: The reminder reaches the right person. → What that person sees and can do. |\n\n### Measuring Onboarding: Where the Evidence Stops\n\n**Controlling idea** (`analysis`, id `measuring`): Neither provider publishes conversion figures for its onboarding flows, so the platform measures its own, from signals each provider documents, and counts the work after sign-up as well as the funnel before it.\n\n**Advances the thesis** (S5): States the limit of the public record and replaces the missing provider figures with a measurement the platform can build.\n\n**Transition in:** `contrast`: What the providers document about collecting and keeping verification. → What they do not publish: how many sellers finish.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | No public source gives a completion or drop-off rate for either provider's hosted, embedded or API onboarding, or a comparison between them; the one public figure is Stripe's relative, seven-year-old claim about a redesign. So the cost of a hosted flow in lost sign-ups, and the gain claimed for own forms, cannot be stated from the public record. | fact: Searched: the Stripe Connect onboarding pages and the Adyen for Platforms onboarding and verification pages cited in this chapter (n.d., accessed 2026-11), and the release notes; none gives a completion or drop-off rate. Adyen's page says only that scanning an ID document 'improves verification pass rates', without a number (https://docs.adyen.com/platforms/onboard-users.md). Found in the verification pass: a Stripe blog post of 2019-06-24 (https://stripe.com/blog/connect-express-onboarding) says a redesign of Express onboarding 'drove a 5.3% average increase in conversion rates' and quotes one customer on 17% (evidence age 7 years). |  |\n| p26 | process | Each provider documents a dashboard of the platform's own sellers (Stripe's for hosted and embedded onboarding only, Adyen's up to verification), so a platform still builds the measurement from seven stages, each marked by a signal it already receives, provided it never counts a seller as onboarded because a redirect came back. | table: Rows: account created; flow opened; flow left; information submitted; capability active; first payment; first payout. Columns: the signal on Stripe; the signal on Adyen; what the stage tells you.; quotation: Stripe (n.d., accessed 2026-11) on the return URL: 'It doesn’t mean that all information has been collected, or that there are no outstanding requirements on the account. It only means the flow was entered and exited properly.' 'Alternatively, listen to the `v2.core.account[requirements].updated` event sent to your webhook endpoint and cache the state of the account in your application.' https://docs.stripe.com/connect/hosted-onboarding.md?accounts-namespace=v2. Adyen (n.d., accessed 2026-11): 'Adyen sends all verification-related updates through webhooks' (https://docs.adyen.com/platforms/verification-overview.md). | `problem_solution`: No provider figures. → A funnel the platform can build itself, stage by stage. |\n| p27 | recommendation | I would report two numbers per country, business type and collection method (the share of started sign-ups that reach a first payout, and the days it takes) and a third for the life after sign-up: sellers with an open requirement, by days left to the deadline. | reasoning: A first payout is the first moment the seller has what it came for and both capabilities have been exercised. Segments matter because requirements differ by country and business type (what-is-asked). The third number is the early warning the Frozen Studios lacked. Only a comparison on the platform's own sellers can show whether one way of collecting keeps more of them. | `elaboration`: The stages. → Which numbers to report from them, and the one that covers the second loss. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The two providers offer the same three ways to collect and the same continuing state, and differ in how complete the embedded option is, whether collecting is tied to bearing losses, how much is collected up front, how deadlines are published and how a seller is brought back.\n\n**Advances the thesis** (S2, S3, S5): Collects the documented differences that change what an integrator builds on each provider.\n\n**Transition in:** `conclusion_summary`: The mechanisms of the four preceding sections. → The two providers aspect by aspect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison | Aspect by aspect, the documented differences are in the completeness of the embedded flow, the tie between collecting and loss bearing, the timing of collection, the form of deadlines, the way back for a seller and the platform's own switch; on conversion neither publishes a completion rate and each documents a dashboard of the platform's own sellers. | table: Rows: ways to collect; who may collect; how much up front; deadlines and what stops first; bringing a seller back; the platform's own switch; published conversion figures. Columns: Stripe, Adyen, what the difference suggests (the author's inference).; fact: Two cells not cited earlier. Stripe (n.d., accessed 2026-11): where the platform is responsible for negative balances 'You can pause payments or payouts for your connected accounts'; where Stripe is, 'You can’t pause payments or payouts for your connected accounts' (https://docs.stripe.com/connect/risk-management.md). Adyen (n.d., accessed 2026-11): the `enabled` setting 'allows you to manage your users’ access to capabilities. Changing this setting does not trigger verification checks'; 'The capability can only be used when it is both allowed and enabled' (https://docs.adyen.com/platforms/verification-overview/capabilities.md). |  |\n| p29 | recommendation | On Stripe an integrator should settle who bears losses before designing onboarding and read each account's deadline as data; on Adyen it should plan for collection up front, build reminders on the 30- and 60-day periods and expect to build more of an in-application flow itself. | reasoning: Follows from the table rows: collecting is derived from loss bearing on Stripe (platform-payment-models decides it); Stripe's deadline is per account, with a support article giving 'typically' 14 days to keep payouts and 28 to keep payments for updated requirements on Custom accounts (https://support.stripe.com/questions/custom-connected-account-onboarding-requirements, n.d., accessed 2026-11), which are typical and not fixed; Adyen's are standard but can be 'shortened or removed'; Adyen's components 'only cover certain functionality'. | `cause_effect`: The table. → What an integrator does differently on each. |\n\n### In Practice at Larkfield: Onboarding Ironworks Climbing, and Keeping It Verified\n\n**Controlling idea** (`example`, id `in-practice`): Onboarded under Keel, Ironworks Climbing is one company with three locations: one seller to verify, three capabilities requested, the provider's component collecting the data inside Larkfield's back office, and a record with an owner that would have turned the nine days of May 2026 into a banner with a date.\n\n**Advances the thesis** (S1, S2, S4): Works the chapter's choices through one seller with ledger facts, on Stripe as it is and on Adyen as it would be.\n\n**Transition in:** `example`: The comparison of the two providers. → One seller taken through the chapter's choices with Larkfield's facts.\n\n**Order of paragraphs** (`chronological`): The example follows the seller's life: who it is, how its account is shaped, how its data is collected, and what happens when a requirement reopens.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | Ironworks Climbing has three locations and is one company, so there is one seller to verify: the company, the people who own and control it, and its bank account; the three gyms are Larkfield's records, not three verifications. | scenario: Ledger: Ravi Shah, owner of Ironworks Climbing, three locations in Manchester, on Stripe Connect. New local detail: one private limited company of which Ravi Shah is the owner and a director. |  |\n| p31 | comparison | On Stripe the company is one connected account for which Larkfield requests three capabilities (card payments, Bacs Direct Debit and transfers, the last because Larkfield uses destination charges; payouts need no capability of their own on a legacy Custom account); had it been on Adyen it would be one legal entity with one account holder, a balance account with a verified bank account, and three stores. | fact: Stripe (n.d., accessed 2026-11): capabilities `card_payments` and `bacs_debit_payments`; 'Adding the `merchant` configuration to an `Account` automatically requests the `merchant` configuration’s `stripe_balance.payouts` capability' (https://docs.stripe.com/connect/account-capabilities.md). Ledger: Bacs Direct Debit carries UK memberships (5% of online volume).; fact: Adyen (n.d., accessed 2026-11), resources belonging to each user: 'One or more stores ... representing the physical locations of your user's businesses'; 'At least one account holder for each country your user operates in'; 'For each account holder, at least one balance account'; 'For each balance account, a transfer instrument (verified bank account)'; 'A legal entity in each country your user operates in'. https://docs.adyen.com/platforms/account-structure-resources/platform-structure.md; figure: Structural figure: one company building with three small gyms. Left, Provider A (Stripe): one account box holding three capability switches. Right, Provider B (Adyen): one legal-entity card linked to one account holder, one balance account with a bank, and three store icons. | `elaboration`: One seller, three locations. → How that seller is shaped as accounts and capabilities on each provider. |\n| p32 | analysis | Larkfield carries its studios' losses and so may collect verification data itself on Stripe, and from 2017 it did, with its own forms; under Keel it keeps that responsibility and gives up the forms, placing Stripe's onboarding component in the back office, as Adyen's hosted pages have done for its Dutch and German studios since 2024. | scenario: Ledger: under Larkfield's terms a loss the studio's balance cannot cover falls on Larkfield; on Stripe Larkfield is the party that collects verification information (26-kyc-aml-and-regulation). New ledger additions: own forms over the API from 2017, extended by hand at each country launch and never reviewed on a schedule; nine years at Stripe's documented interval is eighteen reviews; Adyen studios onboard through Adyen's hosted onboarding since 2024; under K6 the Stripe forms are replaced in 2027 by Stripe's embedded onboarding and notification components.; quotation: Stripe (n.d., accessed 2026-11): 'You must plan on reviewing and updating onboarding requirements at least every 6 months.' https://docs.stripe.com/connect/onboarding.md | `sequence`: The account and its capabilities. → How the data to activate them is collected, before and under Keel. |\n| p33 | example | Replayed under K6 from Ravi's side, the changed requirement of 2026 appears in the back office on the day it is announced, with the reason, the date and one button that opens the provider's component, while Jonas Weber's list shows Ironworks as one of the open studios until it is cleared. | scenario: Ledger: K6; Jonas Weber owns every open deadline; studio support is alerted 14 and 3 days before one (illustrative assumption, 26-kyc-aml-and-regulation); 230 studios were paused. Author's arithmetic: Stripe carries 1,100 UK + 700 US + 650 Belgian + 1,140 older Dutch and German studios = 3,590, so 230 is 6.4% of them.; fact: Stripe (n.d., accessed 2026-11): 'To avoid disruption of your connected accounts’ capabilities, collect information for future requirements before the `future_requirements.current_deadline`'; hosted and embedded flows collect them when `future_requirements` is set to `include` (https://docs.stripe.com/connect/handle-verification-updates.md?accounts-namespace=v1). | `time`: Sign-up under Keel. → The same seller months later, when a requirement reopens. |\n| p34 | analysis | Larkfield now reports sign-up by country and business type as the share reaching a first payout and the days it took, and the open requirements by days to deadline, and it has no figure yet for whether the provider's component keeps more studios than its own forms did. | scenario: New local detail: the three reports under K6; for the 50 largest studios, which hold a verified account at both providers (K8, 10-routing-and-orchestration), there are two verification records each. No outcome figures are given. | `additional_support`: The replayed incident. → What Larkfield measures, and what it does not yet know. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Three failures remain with a provider-run flow and a mirrored record: a returned redirect taken for a finished sign-up, a reminder or link that reaches nobody who can act, and a requirement that the platform's own interface cannot satisfy.\n\n**Advances the thesis** (S2, S4): Names the residual failures of the recommended design, with detection and recovery for each.\n\n**Transition in:** `contrast`: The onboarding as designed. → The ways it still fails.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | analysis | The first failure is marking a seller as onboarded because the browser came back from the provider's flow, when the seller saved for later, the link had expired, or a requirement is still under review. | quotation: Stripe (n.d., accessed 2026-11): the account is redirected to the refresh URL when 'The link is expired (a few minutes went by since the link was created)' or 'The link was shared in a third-party application such as a messaging client that attempts to access the URL to preview it'; the return URL is reached 'when they complete the onboarding flow or click Save for later at any point in the flow'. https://docs.stripe.com/connect/hosted-onboarding.md?accounts-namespace=v2 |  |\n| p36 | analysis | The second failure is a reminder or link that reaches nobody who can act: an address from sign-up, a link pasted into a chat, or a back-office user who is not the director the provider needs to hear from. | scenario: The Frozen Studios (ledger): the reminder went to an unmonitored address.; fact: The two providers' documented positions differ: Stripe says not to send Account Links outside the platform application (https://docs.stripe.com/connect/hosted-onboarding.md?accounts-namespace=v2); Adyen's invite flow can email the hosted onboarding link and protects it with SMS authentication (https://docs.adyen.com/platforms/onboard-users.md; release note 2026-05-04). | `additional_support`: A redirect taken for completion. → A message that never reaches the person who must act. |\n| p37 | analysis | The third failure is a requirement the platform cannot satisfy on the seller's behalf: a risk review that only the provider's interface accepts, or a rejection that is final, for which the platform needs a route into the provider's interface and a person who owns the case. | quotation: Stripe (n.d., accessed 2026-11): risk-review requirements 'you can’t provide using the API' (https://docs.stripe.com/connect/handling-api-verification.md?accounts-namespace=v2). Adyen (n.d., accessed 2026-11): the `rejected` status 'is final and any errors cannot be resolved by updating data or uploading documents' (https://docs.adyen.com/platforms/verification-overview/capabilities.md). Adyen: 'Data changes to the legal entity of the account holder do not trigger webhooks' (https://docs.adyen.com/platforms/verification-overview.md), so the record is re-read after every change (payment-compliance-and-regulation). | `additional_support`: Messages that do not arrive. → Requirements that the platform's own interface cannot meet. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The choice of how to collect verification data and the duty to keep a seller verified look like two topics and are one: both are decided by where the current requirement lives. A provider-run flow reads the requirement from the provider's record each time it opens; an own form holds a copy made on the day it was written; a seller's screen with no requirement on it holds nothing. The Frozen Studios failed on both counts at once, with a 2017 form that could not ask the new question and a back office that could not show it.\n\n**So what:** A platform team stops treating onboarding as a launch project owned by product and runs it as a system: a default set of capabilities kept small, the provider's flow as the collector, a record of open requirements with a named owner, a seller-facing reason, and its own conversion and time-to-first-payout numbers, since no provider will supply them.\n\n**Callback:** Ravi Shah's nine days without payouts and without a reason. Under K6 the same requirement is a banner with a date and a button on the day it is announced, and a line on Jonas Weber's list until it clears; the nine days become a task of a few minutes.\n\n**Takeaway** (`course_of_action`): For your own platform, write down the default capabilities you request and why each is there, who keeps your sign-up fields current, where a seller sees an open requirement and its date, and the name of the person who owns every open deadline.\n\n**Hand-off** to [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html): `sequence`: A verified seller whose capabilities to receive payments and payouts are active. → The first payment to that seller: how it is divided among three parties, when each is paid, and what a reversal after payout does to the division.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | synthesis (list) | Established: capabilities depend on requirements that both providers reopen after sign-up, payouts usually stop first, hosted and embedded flows follow requirement changes while own forms need maintenance, and neither provider publishes conversion figures. |  |  |\n| p39 | synthesis (list) | Depends on context: how much to collect up front, whether embedded or hosted fits, and whether own forms are ever justified depend on the provider, on who bears seller losses and on whether sellers work inside the platform's application. |  | `contrast`: What is settled. → What changes with the situation. |\n| p40 | recommendation (list) | The author's synthesis: collecting and keeping are one question of where the current requirement lives, so let the provider's flow hold the form, hold the deadline yourself with a named owner, and measure your own sign-up, which turns Ravi Shah's nine days into a banner with a date. |  | `contrast`: What is established and what depends. → The author's own position, returning to the nine days of the opening. |\n| p41 | recommendation (list) | Eight questions let the reader test a platform's onboarding or a provider's onboarding product. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p42 | transition | With a seller verified and its capabilities to receive payments and payouts active, the next chapter follows the first payment to it: how it is divided among platform, seller and provider, when each is paid, and what a reversal after payout does to the division. |  | `sequence`: A verified seller with active capabilities. → The first payment to that seller and its division. |\n\n## Non-goals\n\n- Why a regulated provider must verify its customers: KYC and KYB duties, beneficial ownership rules, sanctions screening, transaction monitoring, and the model of requirements, deadlines and capabilities as account state. See [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- Who the merchant is, account configurations and charge types, and who bears seller losses. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- Licenses, safeguarding and why the provider and not the platform holds seller funds. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Splits, seller balances, payout schedules and what a refund after payout does. See [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Checking a changed bank account before a payout, and payout returns. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Merchant risk scores, reserves and deposits a provider sets on a seller. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html), [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- Extra verification for accounts, cards and financing offered to sellers. See [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- Field-by-field verification requirements per country: they change, and each provider publishes a tool for them.\n- User-interface design of sign-up forms and copywriting for reminders.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Neither provider publishes a completion rate for hosted, embedded or API onboarding, or a comparison between them. Stripe published one relative figure in 2019 (5.3% average increase after a redesign of Express onboarding), and both document a dashboard of the platform's own sellers (Stripe onboarding insights; Adyen KYC verification insights).\n- Adyen's staggered-verification tier amounts are not on the page read; the chapter says there are four tiers and gives no amounts.\n- Whether Adyen ties the choice of hosted or API-only onboarding to who bears seller losses is not stated in the pages read; the table says only that no such tie is documented there.\n- How long an Adyen hosted onboarding link stays valid was not found in the pages read and is not stated.\n- Stripe's 'typically disables payouts' sentence is on the Accounts v1 variant of the verification page; the v2 variant says an entry lists 'the affected capabilities'. The chapter cites the v1 page for the order.\n\n## Decision log\n\n- **2026-11-17** — Length is set at about 6,100 words by the checker's count, which includes four tables and the source list (about 5,650 before Sources): above the 4,000 to 5,500 aim and under the 6,500 limit. The 42 units each carry documented evidence from both providers, and the draft was cut twice from 6,600. Rejected: Dropping the measurement section or the trade-off table to reach 5,500, which would remove the evidence behind acceptance criteria AC-2 and AC-3.\n- **2026-11-17** — Under consistency ruling 2 the model of verification as continuing state (requirement lists, deadlines, capability flags, the mirror and its daily re-read) is taken as given from payment-compliance-and-regulation. This chapter defines capability and verification requirement in one paragraph, because PLAN gives it those terms, and spends its space on requesting capabilities, the three ways to collect, the owner, the channel, the seller's screen and measurement. Rejected: Re-teaching the requirement lists and capability flags field by field.; Repeating the form, pass-through and mirror designs of chapter 26.\n- **2026-11-17** — The seller's side of the Frozen Studios is told through Ironworks Climbing, which becomes one of the 230 (new ledger fact: payouts paused Monday 11 May to Wednesday 20 May 2026). Rejected: An unnamed studio, which would give the seller's view no face.; Studio Noord, which is on Adyen while the Frozen Studios were on Stripe Connect (chapter 26's ledger addition).\n- **2026-11-17** — Larkfield's pre-Keel Stripe onboarding is its own forms over the API (2017), which makes the incident an example of the API design's documented maintenance cost; under K6 it moves to Stripe's embedded components. Rejected: Leaving the collection method unstated, which would leave the In Practice section with nothing to decide.\n- **2026-11-17** — No conversion percentages appear anywhere, not even as labeled assumptions; the measuring section gives stages and signals only. Rejected: An illustrative funnel with invented percentages, which a reader could mistake for provider data and which acceptance criterion AC-3 guards against.\n- **2026-11-17** — The trade-off table and the author's recommendation sit at the end of the section on the three ways to collect instead of in a separate Trade-offs section. Rejected: A separate two-paragraph section, which would split the comparison from the facts it compares.\n- **2026-11-17** — Member payments at Ironworks are in pounds, so the example uses days, counts and shares and no money amount for Ironworks. Rejected: Inventing a daily volume in pounds for one studio chain.\n- **2026-11-17** — Verification pass: the chapter now cites Stripe's 2019 claim of a 5.3% average increase in conversion as an attributed vendor claim with its evidence age, and names both providers' onboarding dashboards. This narrows the earlier decision that no conversion percentage appears anywhere: no invented or illustrative percentage appears, and the one vendor figure is not presented as a completion rate. Rejected: Keeping 'neither publishes a conversion figure for any onboarding flow', which the Stripe post contradicts.; Mentioning the Stripe post without its number, which would hide what the source says.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, contract 34 — The question, the coverage list, the Larkfield thread and the owned terms.\n  - journal-spec.json, entry platform-onboarding-and-verification — Intent, acceptance criteria, thesis and role, copied unchanged; the neighbours' transitions.\n  - _research/brief-platforms-and-embedded-finance.md — Part 2 (capabilities and requirements as state; hosted, embedded and API onboarding), sections 1.3, 1.5 and 1.6, and the open questions.\n  - _research/brief-fraud-risk-and-compliance.md — Sections 2.2 and 2.3 (how each provider exposes compliance to customers) and the open questions.\n  - _research/scenario-ledger.md and _research/consistency-issues.md — The Frozen Studios, K6, the cast, chapter 26's additions; ruling 2 on ownership of verification as state.\n- **External**\n  - Stripe documentation, Connect onboarding, capabilities, verification, hosted and API onboarding, embedded components, risk management (docs.stripe.com, n.d., fetched 2026-11-17) — Every Stripe fact and quotation in the evidence.\n  - Adyen documentation, Adyen for Platforms verification overview, capabilities, verification types, data review, onboarding, components, verification requirements, platform structure, and release notes of 2026-05-04 (docs.adyen.com, fetched 2026-11-17) — Every Adyen fact and quotation in the evidence.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — Verification pass: 84 claims checked (75 confirmed, 5 corrected, 4 hedged, 0 unsupported and removed or relabeled, 0 unreachable; one further source URL replaced); 'neither provider publishes a conversion figure for any onboarding flow' corrected to 'no completion rate or comparison of flows', with Stripe's 2019 figure, both providers' onboarding dashboards and Stripe's announced KYC Refresh (ruling 36) added. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on in the draft: 'who bears seller losses' and 'payment facilitator' are glossed where first used; the failure paragraph on reminders is limited to links and the wrong recipient and points back to the section on channels; the Larkfield measurement paragraph is kept to what is not yet known. Not acted on: the rule on who may collect stays after the API design it restricts; the trade-off table (three designs) and the provider table (two providers) stay separate; measurement stays before the comparison because its last row is the comparison's last row.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs; every quotation re-read on the provider's page.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('That neither company publishes conversion figures for its on' -> 'That neither company publishes a completion rate or a compar').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('The chapter states that no public conversion figures exist f' -> 'The chapter states that no completion rate or comparison of ').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('because neither provider publishes conversion figures the pl' -> 'because neither provider publishes a completion rate or a co').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Neither company publishes conversion figures for its flows, ' -> 'Neither company publishes a completion rate or a comparison ').\n- **2026-11-17** — Absence audit: completion-rate, liability-rule and deadline-length absences re-tested (Adyen documentation full text, both sites, domain-restricted web search): hold; the scope of the search is restated in the evidence paragraph.\n- **2026-11-24** — Sweep of rulings 46 to 48: the deadline row and the advice after the table no longer say that Stripe publishes no standard deadline length; they give the typical 14 and 28 days for Custom accounts from Stripe's support article, as chapter 26 does (48g). One source added; p29 evidence aligned; two connective phrases trimmed to stay within the word limit.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
