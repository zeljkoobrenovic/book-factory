<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a merchant balance, pending and available funds, a reserve, a negative balance and pre-funding are.\n- **Know:** How Stripe's documented model (a balance per account and currency, one balance transaction per change, availability by a country and method schedule) differs from Adyen's (payable batches per sales day with a computed payout delay; balance accounts on platforms).\n- **Know:** That Adyen documents paying out before the scheme pays it, capped at 30 days, and that Stripe's documentation does not say whether it does so for standard payouts, while its terms (28 September 2026) let a payout wait when a network fails to settle to Stripe.\n- **Believe:** A balance is a dated claim on the provider, and 'available' is a risk decision expressed as a timestamp.\n- **Believe:** Money can leave a balance without a payout, because refunds, chargebacks, fees and holds are booked when they occur, not on the day of the original sale.\n- **Be able to:** Given a change in a provider balance, list the kinds of movement that could explain it and name the record that shows which one it was.\n- **Be able to:** Map Stripe's and Adyen's balance vocabularies onto one internal model without matching terms by name.\n\n**Audience:** Engineers and architects new to payments who have read the ledger chapter and now have to read, store or display a provider balance.\n\n**Already knows:**\n\n- Authorization, capture, clearing and settlement between network members (payment-authorization, clearing-and-settlement).\n- Refunds, chargebacks and disputes in outline (refunds-reversals-and-disputes).\n- A double-entry ledger, immutable entries and clearing accounts (payment-ledgers).\n- Larkfield, its two providers and the Unexplained €0.4 Million (meet-larkfield).\n\n**Does not yet know:**\n\n- Merchant balance, pending and available funds, reserve, deposit, negative balance, pre-funding.\n- Balance transaction, payable batch, sales day, payout delay, settlement delay, value date.\n- That 'settlement' to the merchant and settlement between network members are different events.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a balance that fell with no payout, the reader names at least three kinds of movement that could explain it and the record that settles which. *Probe:* On Friday a merchant's provider dashboard shows €10,000 available and €4,000 pending. On Monday it shows €9,200 available. No payout was sent and no new sale became available over the weekend. Using only this chapter: name three things that could have happened, and say where you would look to find out which. | `custom` | cold_reader | major |\n| AC-2 | The reader can say what 'available' does and does not tell them about where the cash is. *Probe:* A colleague says: 'The funds are available, so the card network must have paid the provider.' Is that a safe conclusion? Answer for each of the two providers as the chapter documents them. | `custom` | cold_reader | major |\n| AC-3 | The reader does not map 'reserve' between the two providers by name: they can say which term at each provider means a hold the provider imposes and which means a buffer the merchant sets. *Probe:* Your internal model has one field, 'held by provider for risk'. Which documented term feeds it at Stripe and which at Adyen? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Between the customer paying and the merchant being paid, where is the money and whose is it?\n\n> **Claim:** Between payment and payout the cash is in transit through the network or in bank accounts that are not the merchant's, and the merchant's share of it exists only as the provider's record of what it owes: the merchant holds a claim, not money. 'Pending', 'available' and 'reserved' are the provider's decisions about when and how much of that claim it will pay. Adyen documents that under its default payout model it pays the merchant whether or not the scheme has paid Adyen, and takes back what has not settled within 30 days; Stripe documents a schedule by country and payment method and does not say whether it waits for the network, beyond terms that let a payout wait when a network fails to pay Stripe.\n\n**Disputed by:** The view that a provider balance works like a bank balance: 'pending' means the money is on its way from the network, 'available' means it has arrived and is the merchant's cash held in the merchant's name.\n\n**So what:** An integrator has to model each amount with its own availability date and state instead of one running total, expect entries that are unrelated to the day of the original sale, plan for a balance that goes negative, and translate each provider's vocabulary by function, because 'reserve' names a hold the provider imposes at Stripe and a buffer the merchant sets at Adyen.\n\n**How and why:** A provider collects from networks in bulk and pays merchants one by one, so no bank account holds one merchant's sales; what exists per merchant is a line in the provider's books, and the states of that line are rules the provider sets. The two providers' documentation shows the rules. Stripe's documentation (accessed November 2026) gives every balance transaction an available_on time set by a schedule per country and payment method, nets its fee on each transaction and holds risk money in a reserve; it does not say whether availability waits for the network's own settlement. Adyen's documentation (accessed November 2026) assigns sales to a payable batch per sales day, sets the payout delay at the break-even point between fast and slow payment methods, nets fees in the batch with a monthly invoice that is trued up later, and holds risk money in a deposit recalculated daily. Refunds, chargebacks and adjustments are booked when they occur at both, so a day's payout cannot be recomputed from that day's sales. Who carries the gap when a provider pays before it is paid is documented for Adyen and, for standard payouts, not stated by Stripe beyond terms (28 September 2026) that let it delay a payout when a network fails to settle to it; the chapter says so and does not fill the gap.\n\n**Supporting claims**\n\n- **S1** — Between payment and payout the merchant holds a claim on the provider and not cash: the cash is in transit or in pooled accounts that are not the merchant's, and the balance is a line in the provider's books.\n- **S2** — 'Pending' and 'available' are the provider's decisions about when it will pay, set by a rule each provider chooses: Stripe dates each transaction by a schedule per country and payment method, and Adyen dates a whole sales day by a delay computed from the mix of payment methods.\n- **S3** — Whether 'available' waits for the network is documented for Adyen (it pays whether or not the scheme has paid, and takes back what has not settled within 30 days) and is not stated for Stripe's standard payouts beyond terms (28 September 2026) that let a payout wait when a network fails to settle to Stripe.\n- **S4** — A balance changes without a payout, because fees, refunds, chargebacks, holds, reversals and conversions are booked when they occur; it can therefore go negative, and a day's payout cannot be recomputed from that day's sales.\n- **S5** — An integrator therefore keeps one entry per movement with its own state and availability date, and maps the two providers' vocabularies by function, because 'reserve' names opposite things at Stripe and Adyen.\n\n## Role in the part\n\nTurns the provider's ledger into what a merchant sees of it, and shows that the states of a balance are decisions about a debt, which the payout chapter then follows out of the provider. Supports P3-2 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in scene, claim-not-account, stripe-model, adyen-model, pre-funding: each supplies the terms the next one uses; `comparison` in stripe-model with adyen-model; leaving-without-payout; modeling; where-they-differ; `chronological` in in-practice)\n\nThe reader meets a question nobody at Larkfield can answer before any vocabulary, and its three parts (where is the cash, who decides when it is usable, what can still be taken out) are answered in that order by claim-not-account, the two provider sections with pre-funding, and leaving-without-payout. The claim comes first because every later term (pending, available, reserve) is misread as a fact about cash without it. Each provider's rule for dating the claim follows, Stripe then Adyen, in parallel order so they can be compared; Stripe comes first because Adyen's balance names are explained against Stripe's, and reversing them would leave that contrast without its first term. Pre-funding comes only after both schedules, because its question (does availability wait for the network?) is visible only once the reader has seen two schedules that do not mention the network. The movements that reduce a balance come after pre-funding because the reversal of an advance is one of them. Modeling comes after all documented behavior because it is the consequence; the comparison table follows the designs, as in every chapter of the book, and collects what was established; the worked example then uses every term; failures come last because they are recognizable only against the normal case. Moving modeling before the provider sections would ask the reader to accept a design before seeing what it must absorb.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A studio owner sells a €120 class pass on Tuesday evening. On Wednesday morning her payments screen shows €117.47. Her bank account shows nothing. She asks one question that turns out to be three: is that money mine, where is it right now, and why can I not have it until Thursday?\n\n**Bridge:** An engineer reads a number labeled 'balance' as a stored quantity: a count of something that exists somewhere, as an account balance at a bank appears to be. → At a payment provider the number is a computed debt with rules attached, and the rules (when it becomes payable, what may be subtracted from it) are the provider's. The previous chapter showed the provider's two-sided ledger; this one shows the one-sided view of it a merchant gets.\n\n**Thesis statement** (KEY POINTS callout, bullets 1 and 2, and paragraph p02): Between payment and payout the merchant holds a claim on the provider, not money. 'Pending', 'available' and 'reserved' are the provider's decisions about when and how much of that claim it will pay. Adyen documents that it pays whether or not the card scheme has paid it and takes back what has not settled within 30 days; Stripe documents a schedule and does not say whether it waits for the network.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from a studio owner's question at Larkfield about a balance of €117.47, and return to it with dates and amounts. *Kept in:* scene, in-practice.\n- Say what a provider balance is and where the cash behind it sits. *Kept in:* claim-not-account.\n- Show how Stripe and then Adyen decide when an amount becomes payable. *Kept in:* stripe-model, adyen-model.\n- Establish what each provider documents about paying a merchant before the network has paid the provider. *Kept in:* pre-funding.\n- List what takes money out of a balance without a payout: fees, holds, negative balances and currency conversion. *Kept in:* leaving-without-payout.\n- Compare three ways to model a provider balance in your own system. *Kept in:* modeling.\n- Set the two providers side by side. *Kept in:* where-they-differ.\n- Show how a balance problem is detected and repaired. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A provider balance looks like a bank balance, and a studio owner who reads it as one cannot explain why the money is not hers to use yet or why the figure later falls. | scenario: The hook: a €120 pass sold on Tuesday evening, €117.47 on the screen on Wednesday, nothing at the bank until Thursday (Larkfield, fictional). |  |\n| p02 | claim | Between payment and payout the merchant holds a claim on the provider, and 'pending', 'available' and 'reserved' are the provider's decisions about when and how much of it to pay; this is the book's gap between the instant answer and the slow truth, seen from the merchant's side. | fact: Adyen's terms say it pays 'irrespective of whether the funds are actually received by Adyen'; Stripe's documentation gives a schedule by country and payment method and is silent on the network. | `problem_solution`: The owner's unanswered questions about the number on her screen. → What the number is: a claim, with states the provider sets. |\n| p03 | cause_effect | Because the balance is a claim with rules, an integrator who stores it as one running total gets the Black-Box Balance: a figure nobody can break down into sales, fees, refunds and holds. | case: Larkfield's Unexplained €0.4 Million: its ledger's 'owed to studios' differed from the providers' balances by €412,000 at year-end 2025, traced to refunds after payout, chargeback fees and a currency-conversion rounding rule. | `cause_effect`: The balance as a claim whose states are decisions. → What that costs a team that models it as a single number. |\n| p04 | context | On the journey of Mila's class pass, this chapter covers the two days between the capture on Tuesday 9 March 2027 and the payout that reaches Studio Noord on Thursday 11 March. | scenario: Mila's class pass: €120.00 on Tuesday 9 March 2027 at 19:42; the studio receives €117.47; payout arrives Thursday 11 March. | `place`: The chapter's subject. → Its position on the recurring payment's journey. |\n| p05 | transition | The chapter goes from the studio owner's question, to what a balance is, to how each provider dates and reduces it, to how to model it, and ends with the same €120 worked through and the failures to expect. |  | `sequence`: The stretch of the journey the chapter covers. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Whose €117.47 Is It?\n\n**Controlling idea** (`example`, id `scene`): A studio owner's question about one amount shows that Larkfield cannot say where the money is, whose it is or what could still reduce it.\n\n**Advances the thesis** (S1, S5): Poses the thesis question in a concrete case and shows the cost of having no model of the claim.\n\n**Transition in:** `example`: The roadmap's promise to start from a studio owner's question. → The question as it reached Larkfield in March 2027.\n\n**Order of paragraphs** (`chronological`): The question, then why it could not be answered, then the questions it breaks into; the reader needs the failure before the split into three makes sense.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | On Wednesday 10 March 2027 Ines Bakker saw €117.47 for Mila's pass in the back office of Larkfield, the platform that takes a fee of €2.53 on the sale, and asked support whether it was hers, where it was and why it would only arrive on Thursday. | scenario: Ines Bakker, owner of Studio Noord (on Adyen since 2024); Aylin Demir, Head of Studio Support; €120.00 pass, Larkfield fee €2.53, studio amount €117.47. |  |\n| p07 | evidence | Femke de Graaf found that the back office showed each studio one running total copied from the provider, and that the 1,140 studios on both providers saw two totals with different words on them. | scenario: 1,140 studios onboarded before 2024 are on Stripe online and on Adyen terminals; the back office shows one number per provider (local detail, fictional). | `cause_effect`: Ines's question arriving at support. → Why nobody at Larkfield could answer it from Larkfield's own data. |\n| p08 | claim | Femke turned the question into three that the rest of the chapter answers: where is the cash, who decides when the studio may use the amount, and what can still be taken out of it. |  | `conclusion_summary`: A total that explains nothing. → The three questions the chapter is organized around. |\n\n### A Balance Is a Claim on the Provider, Not an Account\n\n**Controlling idea** (`definition`, id `claim-not-account`): A merchant balance is the provider's record of what it owes the merchant; the cash is elsewhere, pooled and in transit, and the words on the balance are rules about the debt.\n\n**Advances the thesis** (S1): Establishes the first half of the thesis: a claim, not money.\n\n**Transition in:** `elaboration`: Femke's first question: where is the cash? → The answer that it is not in any account of the merchant's, and what the balance is instead.\n\n**Order of paragraphs** (`prerequisite_order`): Definition, then the reason it must be so, then the parties, then the state vocabulary; the terms in p12 would be read as facts about cash if the claim were not established first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A merchant balance is the net amount the provider's books say it owes the merchant at a given moment: sales credited, less everything debited, less what has already been paid out. | quotation: Adyen: 'Adyen pays you on a net basis. This means your payable batch is made up from your sales figure from which we deduct: Transaction costs; Refunds; Chargebacks; Other adjustments'.; quotation: Stripe: 'When a customer initiates a refund or files a dispute, funds are also deducted from the payments balance.' |  |\n| p10 | explanation | No bank account holds one merchant's sales, because a provider is paid by the networks in bulk and pays its merchants one by one. | reasoning: Card networks settle net amounts between their members for a whole cycle (clearing-and-settlement); the acquirer or provider receives one amount per network and currency, not one per merchant; commonly these funds sit in pooled accounts.; quotation: Adyen's steps from capture to payout: 'A payment is captured, and the card scheme or payment method sends the funds to Adyen.' | `cause_effect`: The balance as a computed net figure. → Why it has to be a figure in a book and cannot be an account. |\n| p11 | comparison (table) | Between payment and payout four parties each hold something different: the cardholder's bank holds the cash and a promise, the network holds an obligation to settle, the provider holds pooled cash and a debt to the merchant, and the merchant holds a claim. | table: Table: Party \\| In plain words \\| What it holds between payment and payout \\| What it risks. Rows: issuer (the cardholder's bank), card network or scheme, acquirer or provider, merchant.; figure: Figure 13-claim-not-cash: the cash path (cardholder's bank, network, provider's pooled account, merchant's bank) below, and the record path (the merchant's balance line) above. | `elaboration`: The provider is paid in bulk and owes one by one. → Who holds what, party by party. |\n| p12 | definition (list) | Five terms describe the state of the claim: pending funds, available funds, a reserve, a negative balance and pre-funding. | fact: Definitions in one line each: pending (owed, not yet payable), available (payable now, also usable for refunds), reserve (owed but held back by the provider against later refunds and chargebacks), negative balance (the merchant owes the provider), pre-funding (the provider pays before it has been paid). | `sequence`: The claim and who holds it. → The words for the states the claim can be in. |\n\n### Stripe: A Balance per Currency and a Date on Every Transaction\n\n**Controlling idea** (`description`, id `stripe-model`): Stripe documents a balance per account, product and currency, changed only by balance transactions, each of which carries its own availability date set by a schedule per country and payment method.\n\n**Advances the thesis** (S2, S4): Shows the first provider's rule for 'pending' and 'available' as a per-transaction date.\n\n**Transition in:** `example`: The five state terms. → How the first of the two providers implements them, as documented.\n\n**Order of paragraphs** (`large_to_small`): From the balance, to the entry, to the date on the entry, to the other entries; each step narrows the previous one, and the schedule would be unmotivated before the reader knows the date is per transaction.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | description | Stripe's documentation describes several balances per account and two states for funds in them, pending and available. | quotation: 'Your Stripe account can have one or more balances that hold funds for different products and currencies'; types: payments balance, refunds and disputes balance, reserve balance, financial account (US and UK only).; quotation: 'the charge amount (minus Stripe's fee) appears in your pending balance until settlement'; 'After the funds settle, they move to your available balance.' |  |\n| p14 | definition | Every change to a Stripe balance is a balance transaction: one amount, one fee, one net, a status and an available_on date. | fact: Fields: created (when the entry was booked), amount, fee, fee_details, net ('amount - fee'), status ('either available or pending'), available_on ('The date that the transaction's net funds become available in the Stripe balance'), type, reporting_category, source, balance_type, exchange_rate.; quotation: A comment in Stripe's Sigma documentation calls the balance_transactions table 'the canonical record of changes to your Stripe balance'.; reasoning: INFERENCE block: a balance transaction is a one-sided statement line; how it is derived from the internal Ledger Stripe described in 2024 is not documented. | `elaboration`: Balances with two states. → The entry that moves an amount between them. |\n| p15 | evidence | The available_on date comes from a published schedule by country and payment method, and Stripe's word 'settle' in this context means that schedule running out. | statistic: United States 2 business days; Netherlands, Germany, Belgium and the United Kingdom 7 calendar days for the first payout, then 3 business days; SEPA Direct Debit 6 business days, Bacs Direct Debit 4, ACH Debit 4.; quotation: 'Settlement time is the time between when a payment or a funding transaction is made and when the funds become available in your Stripe balance.' 'These payments have a higher risk of returns or reversals, which factors into their longer settlement periods.' 'In some cases, risk criteria might prevent your account from changing to the default settlement timing.' | `cause_effect`: The available_on field on each transaction. → Where its value comes from. |\n| p16 | evidence | Sales are one of many transaction types, so a Stripe balance is moved by refunds, disputes, fees, holds and payouts on the days those happen. | fact: Types include charge, payment, refund, refund_failure, adjustment (disputes are booked as adjustments: 'Stripe deducts the disputed amount from your balance'), stripe_fee, reserve_hold, reserve_release, payout, payout_failure, payout_minimum_balance_hold, topup, transfer.; quotation: 'Your account might have fees debited from your balance on a daily or monthly basis'. | `additional_support`: Sales that become available on a date. → The other entries that move the same balance. |\n\n### Adyen: A Batch per Sales Day and a Delay Computed From the Mix\n\n**Controlling idea** (`description`, id `adyen-model`): Adyen documents a payable batch per merchant account into which a whole sales day is placed after a payout delay that it computes from the merchant's mix of payment methods, with later adjustments added as they occur.\n\n**Advances the thesis** (S2, S4): Shows the second provider's rule for the same states as a per-day date, and that later entries are unrelated to the sales day.\n\n**Transition in:** `contrast`: Stripe's date on every transaction. → Adyen's date on a whole sales day.\n\n**Order of paragraphs** (`large_to_small`): Batch, then its date, then its other contents, then the names of the resulting balances, then the platform variant; mirrors the order of the Stripe section so the two can be compared item by item.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | process | At Adyen, captured sales are assigned to a payable batch, the batch closes on the payout frequency, and a positive batch is paid out. | quotation: 'The funds are assigned to a payable batch based on your payout model. The payable batch closes according to your payout frequency. If the payable balance is positive when the payable batch closes, Adyen instructs the payout to you.'; quotation: Sales day payout, the default: 'You get all the funds from a particular sales day in a single payout batch, with a fixed payout delay.' 'the payable batch always closes two hours after your sales day closing time'. |  |\n| p18 | evidence | The payout delay is computed, as the point where fast payment methods have brought in enough to cover the slow ones. | quotation: 'The payout delay is calculated to be the break-even point, where faster payment methods settle enough funds to make up for the funds not yet settled by the slower payment methods.'; statistic: 2 business days when at least 80% of transactions are in AUD, CAD, EUR, GBP, NZD, RON, SEK or USD and acquired in the currency's own region; 3 business days otherwise; 3, 7 or 12 for accounts onboarded through a partner; 7 business days if most payments are American Express. | `elaboration`: The fixed payout delay. → How that delay is derived. |\n| p19 | evidence | Adyen pays net, and what it deducts is booked when it occurs, so a batch contains refunds and chargebacks that belong to other days' sales. | quotation: 'Refunds, chargebacks, and other adjustments are added to the payable batch as they occur and are not related to the sales day of the original transaction.' | `additional_support`: A batch built from one sales day. → What else is in the batch. |\n| p19a | evidence | Fees reach an Adyen merchant twice: netted in the batch, then trued up in a later batch after the monthly invoice. | quotation: 'Each month, Adyen gives you a Payment processing invoice'; 'There can be a difference between the costs in the invoice and the deductions from your settlement batches during the month. Adyen will credit or debit the difference to the next settlement batch'. | `additional_support`: A batch that mixes one day's sales with entries belonging to other days. → The fee correction as one more such entry. |\n| p20 | description | Adyen's 'available funds' is a sum that includes 'pending' and 'next payout', so 'available' at Adyen does not mean what it means at Stripe. | quotation: 'Pending: the gross amount of sales and refunds that have not yet been settled by the respective card scheme or payment method'; 'Next payout: the current amount to be settled to your bank account at the next moment of payout'. The two further parts of the sum and the separate deposit are holds and buffers, explained in leaving-without-payout. The negative refund allowance is glossed at first use with Adyen's definition: 'the additional balance to issue refunds even when your reserve is too low or insufficient'. | `contrast`: How the batch is built. → How the resulting balances are named. |\n| p21 | description | On Adyen for Platforms the claim is held in a balance account per user, credited per sales day after a settlement delay, and each entry carries a booking date and a value date. | quotation: 'Adyen settles a settlement batch after its sales day ends and the configured settlement delay has passed. The date when the schemes or payment methods transfer the funds to Adyen does not affect this timing.'; quotation: 'The booking date is when the event (like a payment) took place, and the value date is when the actual balance is credited or debited to a balance account.' | `additional_support`: The merchant-account model. → The platform model the Larkfield example uses. |\n\n### Paying Before Being Paid: Pre-Funding and Who Carries the Gap\n\n**Controlling idea** (`evidence`, id `pre-funding`): Adyen documents that it pays merchants before the scheme has paid it, for up to 30 days and reversibly; Stripe documents this only for Instant Payouts, and nothing public says whether its standard availability waits for the network.\n\n**Advances the thesis** (S3): Supplies the evidence for the thesis's claim about what 'available' assumes at each provider, and marks where the evidence stops.\n\n**Transition in:** `problem_solution`: Two schedules that fix when an amount becomes payable, neither of which mentions the network paying the provider. → The question the schedules leave open, and what each provider has published on it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Definition of the gap, Adyen's statement, its limit, its safeguards, Stripe's one explicit case, then where the evidence stops; the limits of the Stripe record are only meaningful after the reader has seen what a documented answer looks like.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | Pre-funding means the provider pays the merchant from its own liquidity before the network has paid the provider, which separates the merchant's payout date from the network's settlement date. | reasoning: If the payout date is fixed (two business days) and schemes settle on their own timelines (Adyen: American Express 'has a settlement delay of 7 days'), then on some payments the provider has paid out money it has not received. The scheme's 'settlement delay' is glossed as its own delay in paying Adyen, distinct from the platform setting of the same name. |  |\n| p23 | evidence | Adyen states in its terms and its documentation that under Sales day payout it pays whether or not it has been paid. | quotation: Terms: Adyen will 'initiate payout of the Net Captured Volume to Merchant on the Payout Day, irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner'.; quotation: Docs: 'Adyen prefinances your payments. When Adyen settles a transaction's funds to your payable batch before the card scheme or payment method settles those funds to Adyen, Adyen advances you the funds while settlement is still pending.' | `example`: Pre-funding as a mechanism. → The provider that documents doing it. |\n| p24 | evidence | The advance is capped at 30 days and is taken back by an entry in a later batch, with a second entry if the money then arrives. | quotation: 'Prefinancing is capped at 30 days. If the card scheme, payment method, or acquirer does not settle the funds within 30 days, Adyen reverses the prefinanced amount from your payable batch. These reversals appear as SettledReversed and RefundNotCleared entries.' 'If Adyen receives the funds after 30 days, you see an additional Settled booking.'; fact: Settlement details report: SettledReversed is a debit that 'reverses a Settled entry', booked when Adyen does not receive the funds within 30 days after capture; RefundNotCleared is a credit that 'reverses a Refunded entry', booked 'when the acquirer does not process the refund within 30 days after it was initiated'.; fact: The SETTLED_REVERSED and REFUND_NOT_CLEARED webhook event types 'apply to all payment methods and are disabled by default'; on platforms, 'If Adyen does not receive the funds within 30 days after a payment's capture, we subtract those funds from the current settlement batch.'; figure: Figure 13-paid-before-being-paid: a timeline with the sale on day 0, the merchant paid on business day 2, the network paying the provider on a later, variable day, and the 30-day cap. | `additional_support`: Adyen pays regardless of receipt. → The limit and the reversal. |\n| p25 | evidence | Adyen limits its exposure by contract: slow or unpredictable payment methods are excluded, a slow mix delays the payout day, and where it cannot pre-fund it pays only on receipt. | quotation: Terms: 'If more than 25% of the Captured Volume on a sub-account consists of Payment Methods that structurally settle to Adyen later than the Payout Day, Adyen will have the right to accordingly delay the Payout Day'; activation is 'subject to regional availability and Adyen's ongoing review and approval'; 'Merchant commits to provide Adyen with insight into its financial standing'.; quotation: Pass-through payout: 'Sales are assigned to the payable batch as soon as the schemes or payment methods send the funds to Adyen'; it is 'the only available payout model in Africa, Brazil, and India'. | `cause_effect`: An advance that can be outstanding for 30 days. → How Adyen bounds the risk it takes by advancing. |\n| p26 | evidence | Stripe documents an advance explicitly in one product, Instant Payouts, where card funds can be paid out while still pending and bank debits cannot. | quotation: 'Card payment funds are available immediately, including pending funds within your payout schedule window. Bank debit funds (ACH, SEPA) are only included after they fully settle, since they can be reversed before that point.'; quotation: Connect: 'When platforms and marketplaces are liable for losses, you're liable for uncovered negative balances due to refunds or disputes on instantly paid out funds.' | `contrast`: Adyen's documented default. → The one case Stripe documents. |\n| p27 | analysis | For Stripe's standard payouts the public record stops at the schedule and two rights in the terms (delay and reversal): nothing says whether available_on otherwise waits for the network's settlement, so the chapter does not say either. | fact: Stripe's balances, payouts and Connect balance pages give the schedule and use no term such as pre-financing; the balance transaction type list includes payment_network_reserve_hold ('Funds that a payment network holds in reserve') but no entry type described as reversing an unsettled advance.; reasoning: INFERENCE block: at Adyen the provider carries the timing gap for up to 30 days and the merchant carries the outcome, because an unsettled amount is taken back by set-off; for Stripe's standard payouts the terms (28 September 2026) allow a delay when a network fails to settle to Stripe and a reversal when the payment method provider invalidates the transaction, and who carries the timing gap in the normal case is not public. | `contrast`: What Stripe documents for Instant Payouts. → What it does not document for the standard case, and what the reader may and may not conclude. |\n\n### What Leaves a Balance Without a Payout: Fees, Holds, Negative Balances and Currency\n\n**Controlling idea** (`comparison`, id `leaving-without-payout`): Six kinds of movement reduce a balance without a payout, each with its own record at each provider; holds are named in opposite ways, and a balance that goes below zero is recovered differently at each.\n\n**Advances the thesis** (S4, S5): Establishes that entries unrelated to the day of sale move the balance, and that the vocabulary for holds cannot be mapped by name.\n\n**Transition in:** `additional_support`: A reversal of a pre-funded amount as one entry that reduces a balance weeks after the sale. → The full list of such entries.\n\n**Order of paragraphs** (`grouping`): The list first, then holds (provider's, merchant's), then what happens below zero (Stripe, Adyen), then currency; the table in p28 is the map and the later paragraphs enlarge the rows a newcomer gets wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison | A balance can fall with no payout for six reasons, and at each provider one itemized record says which: the balance transactions at Stripe, the journal types of the settlement details report at Adyen. Fees and holds are rows of the list; a negative balance (what remains when the movements exceed the credits) and currency conversion are the section's other two subjects, taken up after the holds. | table: Table: Movement \\| Stripe record (balance transaction type) \\| Adyen record (journal type). Rows: refund (refund \\| Refunded); chargeback (adjustment with a dispute as source \\| Chargeback, SecondChargeback); fee debited apart from the sale (stripe_fee \\| Fee, InvoiceDeduction); hold raised by the provider (reserve_hold, reserved_funds \\| DepositCorrection); pre-funded amount taken back (not documented for standard payouts \\| SettledReversed); merchant's own buffer topped up from sales (payout_minimum_balance_hold \\| ReserveAdjustment). |  |\n| p29 | comparison | Both providers hold back part of a merchant's money against later refunds and chargebacks, Stripe as a reserve for a set period and Adyen as a deposit it recalculates every day. | quotation: Stripe: 'A reserve is a temporary hold on a portion of a business's funds for a predetermined period of time'; 'Stripe uses two different types of reserves: fixed and rolling'; the reserve balance 'holds funds that you can't pay out or transfer until the reserve hold period is complete'.; quotation: Adyen: 'Unlike the reserve, you cannot determine your own deposit amount. Adyen calculates the deposit requirement for your account daily, based on variables such as your processing volume and the number of chargebacks and refunds.' 'If the deposit requirement increases, funds from your sales are booked to the deposit.' | `elaboration`: The hold row of the table. → What a provider-imposed hold is at each provider. |\n| p30 | comparison | Both also let the merchant keep a buffer of its own, which Stripe calls a minimum balance and Adyen calls a reserve, so the word 'reserve' means the provider's hold at one and the merchant's buffer at the other. | quotation: Stripe: 'Automatic payouts only pay out funds exceeding this minimum balance to your bank account.' Adyen: 'Reserve: the available amount you configure to cover for refunds, chargebacks, and other operational expenses.'; table: Table: Function \\| Stripe term \\| Adyen term. Rows: held by the provider for risk (reserve \\| deposit); buffer set by the merchant (minimum balance; refunds and disputes balance \\| reserve). | `contrast`: A hold the provider imposes. → A buffer the merchant chooses, and the naming trap between the two. |\n| p31 | process | When debits exceed credits a Stripe balance goes negative, and Stripe recovers it from future payments, then by debiting the merchant's bank account, and on a platform from the platform after 180 days. | quotation: 'if you receive 100 USD in payments but refund 200 USD of prior payments, your account balance would be -100 USD. If you don't receive further payments to balance out the negative amount, Stripe creates a payout that debits your bank account.'; quotation: Connect: 'Stripe holds a reserve on your platform account's available balance'; 'When a connected account holds a negative balance amount for 180 days, Stripe transfers a portion of your balance to zero out that account's balance'; 'While an account's balance is negative, you can't send payouts'. | `cause_effect`: Refunds, chargebacks and fees booked when they occur. → What happens when they exceed what the balance holds, at Stripe. |\n| p32 | process | Adyen's documented default for a negative amount is to carry it into the next payout day or set it off, and on a platform the platform's own account stands behind its users' accounts. | quotation: Terms: 'If the amount to be paid out on the Payout Day ... is negative, Adyen may in its discretion (i) transfer such negative balance to the immediately following Payout Day, or (ii) exercise its set-off right or other rights in accordance with the terms of the Agreement.' Report journal type Balancetransfer: 'A balance transfer to or from subsequent payout batches in order to process negative payable/capture balances'.; quotation: Platforms: 'Liable balance account: the account where your business' funds are held. Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks.' | `contrast`: Stripe's recovery of a negative balance. → Adyen's. |\n| p33 | description | Currency adds one more movement: a sale in one currency reaches a balance in another at a rate recorded on the entry, unless the provider keeps a balance in the sale's currency. | quotation: Stripe: 'Stripe automatically converts all incoming funds into your default currency. With multi-currency settlement, you can configure your account to accrue balances and get paid out in up to 18 supported currencies'; the balance transaction's exchange_rate: 'the amount in currency A, multiplied by the exchange_rate, equals the amount in currency B'.; quotation: Adyen: 'offers like-for-like (no currency conversion) settlement if the currency is also supported as a settlement currency by the payment method'; the settlement details report has an Exchange Rate column, 'The exchange rate used for converting the gross amount into the net amount.'; case: Larkfield's €412,000 difference was traced in part to a currency-conversion rounding rule. | `additional_support`: Movements that reduce a balance. → A movement that changes its currency. |\n\n### Three Ways to Model a Provider Balance in Your Own System\n\n**Controlling idea** (`comparison`, id `modeling`): Of the three ways to hold a provider balance in your own system (copy the total, recompute it from payments, keep an entry per movement), only the third can explain a change, and it is required as soon as the balance is owed onward to someone else.\n\n**Advances the thesis** (S5): Turns the documented behavior into the design consequence the thesis's so-what states.\n\n**Transition in:** `cause_effect`: A balance moved by many kinds of entry on their own dates, in two vocabularies. → What that means for the integrator's own data model.\n\n**Order of paragraphs** (`order_of_importance`): Cheapest and weakest first, the recommended design last, then the comparison; the reader sees why each cheaper design fails before being asked to pay for the third.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | description | The first design copies the provider's total and shows it, which costs almost nothing and explains nothing. | scenario: Larkfield's back office before Keel: one number per studio per provider. |  |\n| p35 | description | The second design recomputes the balance from your own payment records, and drifts from the provider with every entry that is not a sale. | case: The Unexplained €0.4 Million: 'owed to studios' computed from payments differed from the providers' balances by €412,000; the causes were refunds after payout, chargeback fees and a conversion rounding rule.; quotation: Adyen: adjustments 'are not related to the sales day of the original transaction'. | `contrast`: A copied total that cannot be explained. → A derived total that can be explained and is wrong. |\n| p36 | recommendation | The third design keeps one internal entry for every movement the provider reports, with a type assigned by function, a booked-at time, an available-at time and the provider's own reference; this is the one I would build. | fact: Sources of the entries: Stripe balance transactions (type, created, available_on, source); Adyen settlement details rows (journal type, PSP reference, batch) and, on platforms, accounting report rows (booking date, value date).; scenario: Keel decision K3: a ledger entry for every movement; fees, splits, refunds, disputes, payouts and returns are entries. | `problem_solution`: Two designs that cannot both explain and agree. → The design that does. |\n| p37 | comparison (table) | The three designs trade build cost against what they can answer, and the deciding condition is whether anyone else is owed from the balance. | table: Table: Design \\| What it can answer \\| What it misses \\| When it is right. Rows: mirror the total; recompute from payments; entry per movement. | `conclusion_summary`: The three designs described one by one. → Their comparison on the same criteria. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The two providers differ in the unit they date, in whether they say what availability assumes, in how fees reach the merchant, in the names of holds and in how a negative balance is recovered.\n\n**Advances the thesis** (S2, S3, S5): Collects the documented differences that the thesis names, in one table.\n\n**Transition in:** `conclusion_summary`: A model that maps both providers' entries by function. → The differences that mapping has to absorb, side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | comparison (table) | Six documented differences separate the two models, and the last column of the table is my reading of each, not a documented fact. | table: Table: Aspect \\| Stripe \\| Adyen \\| What the difference suggests. Rows: unit of the claim; when funds become payable; tie to network settlement (Stripe: not public for standard payouts beyond terms that allow a delay when a network fails to settle to Stripe); fees; provider's hold and merchant's buffer; negative balance. Every cell is a fact cited earlier in the chapter or 'Not public'. |  |\n| p39 | recommendation | On Stripe, read available_on per transaction and expect a bank debit when the balance goes negative; on Adyen, reconcile per batch, subscribe to the reversal events and reconcile the monthly invoice. | fact: Stripe: available_on, negative payouts; Adyen: SETTLED_REVERSED and REFUND_NOT_CLEARED disabled by default, monthly invoice difference credited or debited to the next batch. | `cause_effect`: The six differences. → What an integrator does differently on each provider. |\n\n### In Practice at Larkfield: The Three Balances Behind Mila's €120\n\n**Controlling idea** (`example`, id `in-practice`): Mila's €120 exists between Tuesday and Thursday as three figures in Adyen's books, none of them cash of Studio Noord's, and the answer to Ines is a date and a list of what can still change the figure.\n\n**Advances the thesis** (S1, S2, S4, S5): Works the thesis through the recurring payment with ledger numbers on Adyen, with the Stripe dates beside it.\n\n**Transition in:** `example`: The comparison of the two providers in general. → One payment worked through on the provider Studio Noord uses.\n\n**Order of paragraphs** (`chronological`): Tuesday's booking, Thursday's availability, the Stripe date beside it, the refund a week later, then the model that shows all of it; the dates are the argument.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | example | On the evening of Tuesday 9 March the €120 becomes three figures: €117.47 owed to Studio Noord, €1.92 owed to Larkfield, and €0.61 kept as the provider's processing cost. | table: Table: Balance \\| Whose claim \\| Amount \\| Booked how. Rows: Studio Noord's balance account €117.47; Larkfield's liable balance account €2.53 less €0.61 = €1.92; the provider's cost €0.61 (assumption). 117.47 + 1.92 + 0.61 = 120.00.; quotation: Adyen platforms: transaction fees 'By default ... are deducted from your liable balance account'.; figure: Figure 13-three-balances: one €120 payment divided into €117.47, €1.92 and €0.61. |  |\n| p41 | example | The studio's €117.47 is booked on Tuesday and becomes available on Thursday 11 March, two business days after the sales day, whether or not Visa has paid Adyen by then. | scenario: Studio Noord's settlement delay is two business days (Larkfield contract detail, illustrative); the payout that includes the pass arrives Thursday 11 March.; quotation: Adyen platforms: 'All the sales captured for that balance account within the sales day on Monday are settled two business days later, on Wednesday, regardless of when the schemes pay out the funds.' | `time`: The three figures booked on Tuesday. → When the studio's figure changes state. |\n| p42 | comparison | Had Studio Noord been on Stripe, the same sale would carry an available_on of Friday 12 March on the documented Dutch default of three business days, and seven calendar days if it were the account's first payout. | statistic: Netherlands: 7 calendar days initial, 3 business days default. | `contrast`: The Adyen date. → The Stripe date for the same sale. |\n| p43 | example | The refund of €84.00 that Mila asks for on 18 March is booked on 18 March, against a balance that no longer contains her payment, which was paid out a week earlier. | scenario: The refund after payout: €84.00 on 18 March 2027, after Studio Noord was paid on 11 March.; quotation: Adyen: 'Refunds, chargebacks, and other adjustments are added to the payable batch as they occur and are not related to the sales day of the original transaction.' | `time`: The amount paid out on 11 March. → What happens to the balance a week later. |\n| p44 | recommendation | Under Keel decision K3 Larkfield replaced the copied total with entries, and its back office now answers Ines with three amounts and their dates: on its way, ready to pay out, and held. | table: Table: Larkfield's internal field \\| Fed at Stripe by \\| Fed at Adyen by. Rows: on its way (pending balance transactions \\| bookings whose value date is in the future); ready to pay out (available \\| settled to the balance account); held by the provider for risk (reserve \\| deposit); buffer set by Larkfield or the studio (minimum balance \\| reserve). | `problem_solution`: A balance that moves on dates unrelated to the sale. → What Larkfield shows a studio owner now. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Three balance failures recur (a fall nobody can explain, an advance taken back weeks later, a hold or a negative balance that stops payouts), and each is detected from the itemized record and not from the total.\n\n**Advances the thesis** (S4, S5): Shows the consequences of the thesis in operation and the record that resolves each failure.\n\n**Transition in:** `contrast`: The balance behaving as designed in the worked example. → The cases where it surprises the merchant.\n\n**Order of paragraphs** (`order_of_importance`): The general case first because its procedure is reused by the other two; then the latest-arriving surprise; then the one that stops payouts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | process | When a balance falls and no payout was sent, list the entries since the last known figure and group them by type; the answer is one of the six movements, and the total alone will never say which. | fact: Stripe: list balance transactions by created date and type; Adyen: the settlement details report by journal type (on platforms, the accounting report). |  |\n| p46 | process | When Adyen takes back a pre-funded amount, it arrives as a debit up to 30 days after a sale the merchant has long since spent, and an integrator who has not enabled the event learns of it only from the report. | fact: SettledReversed is booked 'when it does not receive the funds from the card scheme or payment method within 30 days after capture. No action is required. Adyen adjusts your balance automatically'; the SETTLED_REVERSED event is disabled by default. | `additional_support`: An unexplained fall in general. → The one that arrives latest. |\n| p47 | process | When a hold is raised or a balance goes negative, payouts shrink or stop with no failed API call, so the signal has to come from watching the hold and the sign of the balance. | fact: Adyen: 'If the deposit requirement increases, funds from your sales are booked to the deposit' (DepositCorrection); Stripe: 'While an account's balance is negative, you can't send payouts to the account's bank or debit card on their behalf'. | `additional_support`: Entries that reduce the balance. → States of the balance that stop the payout. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The schedule, the batch, the hold, the reversal and the negative balance are one thing seen five ways: a debt whose terms the provider sets and can change with a new entry. Reading any figure on a balance therefore means asking three things of it: as of when, payable from when, and reducible by what.\n\n**So what:** A team that stores the total will one day be unable to tell a seller why they were paid less; a team that stores the entries with their dates can answer from its own data on both providers, and knows which of the two has told it what 'available' assumes.\n\n**Callback:** The studio owner's €117.47 on Wednesday morning and her question whether it is hers and where it is. The reader can now answer: it is a claim on the provider that becomes payable on Thursday by rule; the cash may not yet have left the card network; and a refund, a chargeback, a hold or a reversal can still reduce what she is owed.\n\n**Takeaway** (`course_of_action`): Model every provider movement as an entry with a type by function, a booked-at and an available-at time; map 'reserve' and 'deposit' by what they do; and ask each provider what its 'available' assumes. Eight questions to ask follow.\n\n**Hand-off** to [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html): `cause_effect`: The available balance as a debt the provider has decided it will pay. → Paying it means leaving the ledger for a bank rail, where the provider can record that it sent the money and cannot see whether it arrived.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | synthesis (list) | Established: a provider balance is a net figure in the provider's books, both providers publish the rule that makes funds payable, both book adjustments when they occur, and Adyen documents paying before it is paid with a 30-day cap. |  |  |\n| p49 | synthesis (list) | Depends on context: how long funds stay pending, whether a hold applies and who covers a negative balance depend on country, payment method, the provider's risk view of the account and, on a platform, the liability set-up. |  | `contrast`: What is settled. → What varies with conditions. |\n| p50 | recommendation (list) | The author's synthesis: 'available' is a risk decision expressed as a timestamp, so I keep entries with dates and map vocabularies by function, and I treat a provider's silence about what availability assumes as a question to ask, not a fact to infer. |  | `additional_support`: What depends on context. → The author's own position. |\n| p51 | recommendation (list) | Eight questions let the reader test a balance model or a provider in a design review. |  | `sequence`: The three tiers. → Questions to take into a review. |\n| p52 | transition | An available balance is a debt the provider has decided to pay, and paying it means leaving the ledger for a bank rail where 'sent' and 'arrived' are different facts. |  | `cause_effect`: The balance as a decided debt, and Ines's answered question. → The payout as the next thing that can go wrong. |\n\n## Non-goals\n\n- How a ledger is built and what Stripe and Adyen have published about theirs. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html).\n- Clearing, net settlement between network members and settlement cycles. See [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html).\n- Payout schedules, rails, returns, instant payout pricing and beneficiary verification. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Reports as a contract, report timing and provider-side reconciliation. See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Where the cash is held, safeguarding and what a license permits. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Split instructions, application fees, who funds a refund after payout and seller-balance mechanics on platforms. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Interchange, scheme fees and the fee stack on the €120. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Stored-value products, financial accounts and issuing balances. See [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether Stripe pre-finances standard payouts: the documentation gives a schedule and is silent on Stripe's own receipt of funds. The chapter states the gap.\n- How Stripe's customer-facing balance and balance transactions are derived from its internal Ledger: not documented.\n- Adyen's dedicated sub-pages for the reserve, the deposit and the next payout returned 404 in research; the parent Balances page (front matter last modified 2021) is the source.\n- No Adyen page describing a platform-level negative-balance procedure was found beyond the liable balance account statement.\n\n## Decision log\n\n- **2026-11-17** — Read 'the three balances behind Mila's €120' as the three figures the payment becomes in the provider's books (studio €117.47, Larkfield €1.92, provider cost €0.61), because they add up to the payment and show the claim per party. Rejected: Pending, available and reserved as the three balances: Studio Noord has no hold in the ledger, so the third would be empty.\n- **2026-11-17** — Give each provider its own mechanism section in parallel order before the pre-funding section, so that the question of network settlement is asked of both at once. Rejected: One mechanism section organized by topic with both providers interleaved: harder to cite and to compare unit by unit.\n- **2026-11-17** — The refund after payout gets one paragraph on its booking date only; who funds it is left to chapters 33 and 35 (consistency ruling 7). Rejected: Working the refund's split here.\n- **2026-11-17** — Stripe's standard-payout pre-funding is stated as not public, with no inference in either direction, as the journal thesis requires. Rejected: Inferring pre-funding from the fixed schedule.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, chapter 13 contract — Scope, owned terms, Larkfield example.\n  - journal-spec.json, entry balances-and-funds-flows — Intent, acceptance criteria, thesis, role (copied unchanged).\n  - _research/brief-ledgers-and-money-movement.md, Part 2 — Tagged claims on balances, settlement timing, reserves, negative balances, payable batches, pre-financing; open questions.\n  - _research/brief-platforms-and-embedded-finance.md — Liable balance account, transaction fees on platforms, Connect negative balances.\n  - _research/scenario-ledger.md — Mila's class pass, the refund after payout, the Unexplained €0.4 Million, Keel K3.\n  - _research/consistency-issues.md, rulings 3 and 7 — Custody belongs to chapter 16; refund after payout to chapters 33 and 35.\n- **External**\n  - Stripe documentation (balances, balance transaction object and types, payouts, Connect account balances, Instant Payouts, minimum balances, multi-currency settlement, reserves FAQ), n.d., accessed November 2026 — Stripe's documented balance model; fetched in this session.\n  - Adyen documentation (getting paid, sales day payout, upgrade to sales day payout, pass-through payout, balances, settlement details report, payment processing invoice, settle funds, account structure, transaction fees, balance platform accounting report), n.d., accessed November 2026; Sales Day Payout Terms of Service, last update 17 June 2024 — Adyen's documented balance model and pre-financing; fetched in this session.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 78 claims checked (70 confirmed, 5 corrected, 3 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the Stripe list of balance transaction types does have an entry that takes back a credited payment (`payment_reversal`), so the sentence and table cell that said it had none now name it; inline external links removed under ruling 22.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: hold vocabulary moved out of the Adyen section into leaving-without-payout, the monthly invoice named in p19, Larkfield's fee named in p06, the flow rationale extended. Not acted on: placing the comparison table before the modeling section (the book's fixed section order keeps it after).\n- **2026-11-17** — First draft of the outcome spec from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Absence audit: 6 statements of absence re-tested with a wide search (0 overturned, 3 narrowed, 3 hold; table in _research/absence-audit/13-balances-and-funds-flows.md). Narrowed: Stripe's services terms (28 September 2026) let it delay a payout when a network fails to settle to Stripe and reverse a settlement the payment method provider invalidates; whether available_on otherwise waits for the network remains unstated. Locked sentences that call this simply 'not public' are reported to the author.\n- **2026-11-17** — Cross-chapter conflict settled (reported from chapter 48): where the chapter states Adyen's pre-financing, one caveat now follows: the Annual Report 2025 risk section calls paying 'only after funds have been received' the 'default setup', which cannot be reconciled with the Sales Day Payout terms from public text (chapter 47's wording and source).\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('that Stripe publishes nothing on whether it does so for stan' -> 'that Stripe's documentation does not say whether it does so ').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Stripe documents a schedule by country and payment method an' -> 'Stripe documents a schedule by country and payment method an').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('is documented for Adyen and, for standard payouts, not publi' -> 'is documented for Adyen and, for standard payouts, not state').\n- **2026-11-17** — Sweep of rulings 46-48: the locked sentences that called Stripe's standard-payout question simply 'not public' now carry the services-terms clause (28 September 2026) in intent, thesis claim, thesis how_why and supporting claim 3; excerpt and key point aligned; one paragraph controlling idea aligned (ruling 47e).\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after round-1 draft check: p19 split into p19 (adjustments booked as they occur) and p19a (fees reach the merchant twice); p28 table's Adyen reversal type corrected to SettledReversed only, matching the settlement details report (CaptureFailed removed; RefundNotCleared clarified in p24 as a credit reversing an uncleared refund); p28 controlling idea relates the six rows to the section heading; glosses recorded for created (p14), negative refund allowance (p20) and the scheme's settlement delay (p22).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {

                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
