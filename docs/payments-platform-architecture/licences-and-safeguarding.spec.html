<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a payment institution, an e-money institution, a bank (credit institution), a money transmitter, a partner bank and safeguarding are.\n- **Know:** The licenses each company states it holds: Adyen N.V. as a Dutch credit institution with a UK branch and a US federal branch; Stripe as an e-money institution in the EEA and the UK and, in the US, a state-licensed money transmitter and a payment facilitator of six named acquirers (five banks and its own limited-purpose bank), plus the narrow charters of 2025 and 2026 and their status.\n- **Know:** What is not public: which banks hold Stripe's safeguarded funds in the EU and UK, and which banks hold the balances Adyen keeps before payout (Adyen documents that it holds them itself, in a country per settlement currency).\n- **Believe:** A license is a design input: it fixes which accounts must exist, which funds may never be mixed and which comparison with a bank must always hold.\n- **Believe:** A platform stays outside these rules only while a licensed provider, and not the platform, has possession or control of the funds.\n- **Be able to:** Look at a proposed funds flow and say at which step, if any, the builder would hold other people's money, and what that would require.\n- **Be able to:** Ask a provider which entity holds the funds in each region, under which license, and how user funds are kept apart from its own.\n\n**Audience:** A software engineer or architect who builds on a payment provider and has never had to ask which legal entity holds the money in a funds flow.\n\n**Already knows:**\n\n- Double-entry ledgers, clearing accounts and balances as the provider's record of what it owes (payment-ledgers, balances-and-funds-flows).\n- Payouts, payout returns and the difference between sent and arrived (payouts-and-money-movement).\n- Reconciliation as the comparison of a ledger with a record somebody else keeps (payment-reconciliation-and-reporting).\n- Larkfield, its two providers and Mila's class pass (meet-larkfield).\n\n**Does not yet know:**\n\n- Payment institution, e-money institution, credit institution, money transmitter, partner bank, sponsor bank, for-benefit-of account, safeguarding, passporting.\n- Which licenses Stripe and Adyen state they hold, and what is not public about where funds sit.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a funds flow that routes customer money through the builder's own bank account, the reader names what the builder has become, what the rules would require and the design that avoids it. *Probe:* A tutoring marketplace plans to collect parents' payments into its own company bank account, hold them until the lesson has taken place, and pay tutors weekly, tracking each tutor's share in its database. Using only this chapter: what has the marketplace taken on, what would EU rules require of a firm doing this, and what is the alternative design? | `custom` | cold_reader | blocker |\n| AC-2 | The reader can state the documented license difference between Stripe and Adyen in one region and one thing it lets or requires each to do, without claiming where either holds the funds. *Probe:* In the EEA, what kind of licensed institution is each of the two providers, and name one consequence the chapter documents for each. | `custom` | cold_reader | major |\n| AC-3 | Every statement that links Adyen's bank status to a product behavior (such as paying out before it is paid) is labeled as inference, and pending regulation and charters are given with their status as of November 2026. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** Who is legally allowed to hold customer money, where does it sit, and how does that shape the architecture?\n\n> **Claim:** The license decides which accounts a provider's ledger must contain, which funds may never be mixed and what must be compared with a bank. A licensed non-bank may hold customers' money only apart from its own: Stripe, an e-money institution in the EEA and the UK and by its own words 'not a bank' in the US, keeps user funds in safeguarding and partner-bank accounts, and where such an account is pooled Stripe's own record is the only division of it between customers. Adyen N.V. is a bank, a Dutch credit institution with UK and US branches; it says the licenses give it direct connections to rails and schemes, and it says merchant balances are held by Adyen before settlement, in a country documented per settlement currency, without naming the banks.\n\n**Disputed by:** The view that licensing is a matter for lawyers and contracts with no effect on system design, and that a platform which holds customers' funds 'only in transit' for a few days in its own account is not holding customer money.\n\n**So what:** Before drawing a funds flow, a builder has to ask at which step the money would be in its possession or control. Larkfield never touches member funds for this reason, and a design that pools them in the platform's own account, or that has the platform track recipients' funds itself, has taken on a license question whether or not anyone decided to.\n\n**How and why:** EU law says funds received by a payment institution are not deposits and must be safeguarded: kept apart from everyone else's and placed in a separate account at a bank or in secure assets, insulated from the institution's creditors. The UK regulator's 2025 policy statement, in force since 7 May 2026, adds a formal comparison between what is owed to users and what the safeguarding accounts hold, with any shortfall made up from the firm's own funds. That comparison is the ledger-to-bank reconciliation of the previous chapter, required by law. Stripe's documentation shows the structure: safeguarding accounts in the EU and UK, a partner bank holding pooled US balances while Stripe keeps the per-customer record, and, in its 2026 engineering post on fee credits, a ledger that separates user funds from corporate funds that need not be safeguarded. Adyen's pages state its license (a European banking license since 2017, a US federal branch since 2021) and, in a 2026 release, that the licenses enable direct connections to rails and schemes; its terms and documentation say merchant balances are held by Adyen before settlement, in a country per settlement currency, without naming a bank, and the reading that its documented pre-financing of payouts rests on a bank's balance sheet is the author's inference. In 2025 and 2026 Stripe added narrow charters (a Georgia acquiring bank it now lists among its US acquirers, and a national trust bank for its stablecoin subsidiary that has the OCC's preliminary conditional approval only), none of them a full banking license.\n\n**Supporting claims**\n\n- **S1** — Holding money received for other people is a regulated act, and the license type (bank, payment institution, e-money institution, US money transmitter) decides whether the holder may treat that money as its own.\n- **S2** — Safeguarding is a requirement on the data model: a record of who is owed what, a separate bank account or asset, and a dated comparison between the two whose shortfall the firm covers from its own funds.\n- **S3** — Stripe documents the structure of a licensed non-bank: e-money licenses in the EEA and the UK, safeguarding accounts, partner banks in the US and a ledger that classifies user funds apart from corporate funds, without naming the safeguarding banks.\n- **S4** — Adyen documents that it is a bank (a Dutch credit institution with UK and US branches) and says the licenses give it direct connections to rails and schemes; it says merchant balances are held by Adyen before settlement, in a country per settlement currency, and names no bank, so every link from its bank status to a product behavior is an inference.\n- **S5** — A platform stays outside these rules only while a licensed provider, and not the platform, has possession or control of the funds; a flow through the platform's own account, or one in which the platform tracks recipients' funds itself, raises the license question.\n\n## Role in the part\n\nAnswers the 'whose' in the part's question, shows that the reconciliation of ledger to bank is a legal duty and not only good practice, and carries the part's closing. Supports P3-5 of part `part-3`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the 14-day buffer is posed in the first section and resolved in the ninth; `comparison` in stripe-structure, adyen-structure, regional-entities, where-they-differ; and platform-designs)\n\nThe reader meets a proposal that looks harmless, then gets the licenses, then the mechanism those licenses impose, and only then the two companies, because 'Stripe safeguards and Adyen is a bank' means nothing before safeguarding and bank have been defined. The companies come before the platform designs because the first design is defined by what the provider's license lets the platform avoid. Regional entities follow the two company sections because they are the consequence both structures share. The comparison table keeps the book's fixed position after the designs and their trade-offs (the style guide's body order), although it depends only on the company sections; the flow reviewer would move it before the designs, and that note was not acted on. Larkfield's worked example and the failures come last because they apply everything before them. Put the companies first and the chapter becomes a list of license names; put the designs first and 'possession or control' has no rule behind it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On a whiteboard, an engineer draws one arrow from 'customer' to 'our bank account' and a second from there to 'sellers', with a note: hold for 14 days, then pay out. Nothing in the code review will object. Which rule did that arrow just bring into the system?\n\n**Bridge:** An engineer treats a bank account as one more integration: money comes in, a job sends it out, a table tracks who is owed what. → Money received for someone else is not the receiver's money, and the law reserves holding it to licensed institutions; which license the holder has decides what its ledger must contain.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p02): The license decides which accounts a provider's ledger must contain, which funds may never be mixed and what must be compared with a bank. Stripe is a licensed non-bank that keeps user funds apart in safeguarding and partner-bank accounts; Adyen is a bank and does not name the banks where merchant funds sit.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from a Larkfield proposal to hold studio payouts in its own account for 14 days. *Kept in:* scene.\n- Define the licenses that allow a firm to hold other people's money, in the EU, the UK and the US. *Kept in:* regulated-act.\n- Show how safeguarding works as accounts, a deadline and a comparison with a bank. *Kept in:* safeguarding-mechanism.\n- Set out what Stripe and Adyen each document about their licenses and where funds sit, and what neither publishes. *Kept in:* stripe-structure, adyen-structure, regional-entities, where-they-differ.\n- Compare the three positions a platform can take relative to the money. *Kept in:* platform-designs.\n- Follow Mila's €120 by license holder and list the ways custody fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | One arrow on a funds-flow diagram, from the customer into the builder's own bank account, changes what the builder is in law while changing almost nothing in the code. | scenario: The whiteboard arrow: customer to 'our bank account', hold 14 days, then pay sellers. |  |\n| p02 | claim | Who may hold customer money is fixed by a license, and the license decides which accounts the holder's ledger must contain, which funds may never be mixed and what must be compared with a bank. |  | `problem_solution`: The arrow nobody objected to. → The license as the rule it brought in, and the thesis in plain words. |\n| p03 | context | In the journey of Mila's class pass, this chapter covers the two days between 9 March and 11 March 2027 when €117.47 is owed to Studio Noord and has not reached it, and asks who is holding it. | scenario: Mila's €120.00 pass, Tuesday 9 March 2027 19:42; studio receives €117.47 on Thursday 11 March; Larkfield's fee €2.53. | `place`: The chapter's claim. → Its position on the recurring payment's journey. |\n| p04 | transition | The chapter goes from a Larkfield proposal, through the licenses and the safeguarding mechanism, to what Stripe and Adyen each document, the positions open to a platform, Mila's €120 by license holder and the ways custody fails. |  | `sequence`: Where the chapter sits on the journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: The Fourteen-Day Buffer\n\n**Controlling idea** (`example`, id `scene`): A proposal to hold studio payouts in Larkfield's own account for 14 days would have put about €43 million of other people's money in Larkfield's possession, and that, not the code, is what stopped it.\n\n**Advances the thesis** (S5): Shows the license question arriving through an ordinary product proposal, before any license is defined.\n\n**Transition in:** `example`: The introduction's arrow into the builder's own account. → Larkfield's version of that arrow, with its amounts.\n\n**Order of paragraphs** (`chronological`): Proposal, its size, the objection: the reader meets the question the way Larkfield did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In April 2027 the product team proposed a refund buffer: collect member payments into a Larkfield bank account and pay studios 14 days later, so that a refund like Mila's €84 never arrives after the studio has been paid. | scenario: The refund after payout: Mila asks for €84.00 back on 18 March 2027, after Studio Noord was paid on 11 March. |  |\n| p06 | evidence | At Larkfield's 2026 volume, a 14-day buffer would hold about €43 million of studios' money at any moment, close to Larkfield's whole annual revenue of €46.0 million. | statistic: €1.12 billion a year is about €3.07 million a day; 14 days is about €43 million; 2026 revenue €46.0 million. | `additional_support`: The proposal. → Its size, computed from ledger figures. |\n| p07 | claim | Jonas Weber's objection was that the buffer makes Larkfield the holder of funds it does not own, which is a regulated activity, and the chapter's question is what that status would require and how to get the buffer without it. | figure: Two funds flows side by side: through the platform's own account, and through a licensed provider that the platform only instructs. | `contrast`: A proposal that works on paper. → The objection that it changes what Larkfield is. |\n\n### Why Holding Other People's Money Needs a License\n\n**Controlling idea** (`definition`, id `regulated-act`): The law sorts holders of other people's money by whether they may use it as their own: a bank may, a payment or e-money institution and a US money transmitter may not.\n\n**Advances the thesis** (S1): Supplies the vocabulary and the one distinction (may the holder use the money?) that the rest of the chapter applies to Stripe, Adyen and Larkfield.\n\n**Transition in:** `elaboration`: Jonas's claim that holding studio funds is a regulated activity. → The licenses that permit it and what separates them.\n\n**Order of paragraphs** (`prerequisite_order`): The reason for regulation first, then the bank as the reference case, then the non-bank licenses defined against it, the US as a variation, and the table only once every row has been defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | explanation | Holding money for others is regulated because, if the holder fails, somebody must be able to say which of its cash was never its own. | reasoning: A holder's bank account shows one balance; its creditors and its customers both claim it unless a rule and a record keep them apart. |  |\n| p09 | definition | A bank, in EU law a credit institution, takes deposits and may lend them out, so money left with a bank becomes the bank's own asset and the customer holds a claim on the bank. | quotation: 'an undertaking the business of which is to take deposits or other repayable funds from the public and to grant credits for its own account' (Regulation (EU) No 575/2013, Article 4(1)(1)). | `sequence`: The question of whose cash it is. → The first answer: the holder that may use the money. |\n| p10 | definition | A payment institution is a licensed non-bank that may move customers' money, and the funds it receives are by law not deposits; it must keep them apart from its own, which the law calls safeguarding (defined in the next section). | quotation: PSD2 Article 18(2)-(3): payment accounts 'used exclusively for payment transactions'; funds received 'shall not constitute a deposit or other repayable funds'. Article 7: capital 'at no time be less than EUR 125 000'. | `contrast`: The bank, which may use what it holds. → The licensed non-bank, which may not. |\n| p11 | definition | An e-money institution may in addition keep a customer's money as a stored balance, and must safeguard that balance in the same way. | quotation: Directive 2009/110/EC Article 7: funds received by payment instrument 'need not be safeguarded until they are credited to the electronic money institution's payment account', and 'by no later than five business days' after issuance. | `additional_support`: The payment institution. → The license that adds a stored balance. |\n| p12 | definition | The United States has no single payments license: a non-bank is licensed state by state as a money transmitter and relies on banks for what only a bank may do. | fact: CSBS on the Money Transmission Modernization Act: 'a single set of nationwide standards, including net worth (capital), surety bond, and permissible investments (liquidity) requirements'; 'thirty-one states have enacted the law in full or in part' (status as read November 2026).; reasoning: Partner bank, sponsor bank and for-benefit-of account defined as industry practice; 'permissible investments' read as the US counterpart of safeguarding (author's reading). | `contrast`: The EU's two non-bank licenses, valid across the EEA. → The US arrangement of state licenses and partner banks. |\n| p13 | comparison | Set side by side, the four license types differ on one line that matters to an architect: only the bank may treat the money it holds as its own. | table: License type / may hold customers' funds / may use them as its own / how the customer is protected: bank; payment institution; e-money institution; US money transmitter. | `conclusion_summary`: Four definitions. → One table and the line that separates them. |\n\n### How Safeguarding Works: A Ledger, an Account and a Comparison\n\n**Controlling idea** (`process`, id `safeguarding-mechanism`): Safeguarding turns 'this is not our money' into three things a system must have: a record of who is owed what, a separate bank account or asset, and a comparison between them made on a schedule.\n\n**Advances the thesis** (S2): Shows that the legal duty is a data-model and reconciliation requirement, which is what makes the license an architectural fact.\n\n**Transition in:** `elaboration`: The non-bank licenses, whose holders may not use customers' money. → What the law makes them do with it instead.\n\n**Order of paragraphs** (`prerequisite_order`): The rule, then the accounts it implies, then its clock, then the fullest published version of the comparison, then the link to reconciliation, and last the note that the rule text is about to change.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | Safeguarding is the duty of a licensed non-bank to keep the funds it has received apart from everyone else's, by segregation or by an outside guarantee. | quotation: PSD2 Article 10(1)(a): funds 'shall not be commingled at any time with the funds of any natural or legal person other than payment service users'; held past 'the end of the business day following the day when the funds have been received', they 'shall be deposited in a separate account in a credit institution or invested in secure, liquid low-risk assets' and 'insulated ... against the claims of other creditors'. Article 10(1)(b): or covered by 'an insurance policy or some other comparable guarantee'. |  |\n| p15 | explanation | In a system, segregation needs a liability record of what is owed to each user and a bank account that holds only users' money, and where that account is pooled the firm's record is the only thing that divides it. | figure: A ledger of per-user claims on the left, one pooled safeguarding account at a bank on the right, and a comparison between their totals.; reasoning: The bank holding a pooled account does not know the users; only the institution's ledger does. | `elaboration`: The rule's words. → The accounts and records the rule implies. |\n| p16 | process | The rule carries a clock: funds still held at the end of the business day after receipt must already be in the separate account, so the system has to know each day how much that is. | table: Requirement / what a system must do / on failure: no commingling; separate account by the next business day; the account covers what is owed. | `additional_support`: The accounts. → The deadline that applies to them. |\n| p17 | evidence | The UK regulator's 2025 rules spell the comparison out: a reconciliation of what should be safeguarded against what the accounts hold on each reconciliation day, with any shortfall made up from the firm's own funds. | quotation: FCA PS25/12 (7 August 2025): the Supplementary Regime 'will come into force on 7 May 2026'; reconciliations 'at least once each reconciliation day'; 'If the D+1 segregation resource is lower than the D+1 segregation requirement, a payments firm will be required to remedy the shortfall. If it is not possible to use relevant funds to do so, the firm must use its own funds'; monthly return; annual safeguarding audit; the end-state trust regime not to be implemented 'without further consideration and consultation'. | `example`: The EU rule and its clock. → The most explicit published version of the comparison, in the UK. |\n| p18 | analysis | That comparison is the previous chapter's reconciliation of ledger against bank, with two differences: it is required by law, and a break in it is paid for from the firm's own money. | reasoning: payment-reconciliation-and-reporting established that a ledger is proof only when matched against a record it did not write; safeguarding names the outside record (the safeguarding account statement) and attaches a penalty. | `similarity`: The regulator's reconciliation. → Its identity with the reconciliation of the previous chapter. |\n| p19 | context | The EU rules quoted here are about to be replaced: as of 17 November 2026 the Payment Services Regulation and the third Payment Services Directive are agreed and not yet adopted. | fact: European Parliament procedure file 2023/0210(COD): 'Council position published' 5 November 2026; committee referral, second reading, 12 November 2026; indicative plenary date 14 December 2026; status 'Awaiting Parliament 2nd reading'. | `time`: The rules as they stand. → Their pending replacement and its status. |\n\n### What a Licensed Non-Bank Documents: Stripe\n\n**Controlling idea** (`evidence`, id `stripe-structure`): Stripe's public pages show the non-bank structure piece by piece: e-money licenses in the EEA and the UK, safeguarding accounts at banks it does not name, state licenses and partner banks in the US, and a ledger that marks which funds are users'.\n\n**Advances the thesis** (S3): Applies the mechanism to the first of the two companies, from its own legal pages, documentation and one engineering post.\n\n**Transition in:** `example`: Safeguarding as accounts, a clock and a comparison. → A provider that is subject to it and says so.\n\n**Order of paragraphs** (`grouping`): By region (EEA and UK license, their safeguarding, the US), then the ledger evidence that cuts across regions, then the recent charters; the ledger post comes after the legal pages because it shows in code what they state in law.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | evidence | In the EEA and the UK Stripe is an e-money institution: one entity authorized in Ireland and passported across the EEA, and one authorized by the UK regulator. | quotation: 'STEL is authorised as an electronic money institution by the Central Bank of Ireland (reference number: C187865)' (stripe.com/stel/legal, last updated 2019-04-05, evidence age 7.5 years); 'SPUKL is authorised as an electronic money institution by the U.K. Financial Conduct Authority (reference number: 900461)' (stripe.com/gb/legal/spukl, last updated 2017-01-26, evidence age almost 10 years); 'STEL passports its electronic money institution licence' (PSD2 FAQ, last updated 2024-01-18). |  |\n| p21 | evidence | Stripe says user funds in the EU and the UK are held in safeguarding accounts that only Stripe controls, and it does not name the banks. | quotation: Funds 'are settled to Stripe's safeguarding accounts, before payout'; 'only Stripe has control over the funds held in the Stripe-titled safeguarded bank account' (PSD2 FAQ, 2024-01-18). UK support article (n.d., read through a summarizing fetch): safeguarding accounts with credit institutions; as an e-money institution Stripe is not covered by the Financial Services Compensation Scheme. | `cause_effect`: The e-money license. → The safeguarding statements that follow from it. |\n| p22 | evidence | In the US Stripe holds state money transmitter licenses and says it is not a bank, and its stored balances sit at a partner bank either in the customer's own name or pooled with Stripe keeping the per-customer record. | fact: Stripe Payments Company (NMLS #1280479) lists 53 jurisdictions: 49 states (not Montana), DC, Guam, Puerto Rico, US Virgin Islands (stripe.com/legal/spc/licenses, n.d., accessed 2026-11; count from the page).; quotation: Treasury docs (n.d., accessed 2026-11): 'Stripe is not a bank'; a financial account is 'backed by either a demand deposit account (DDA) ... or a for-benefit-of (FBO) arrangement'; 'The bank's records show that the account holds funds for the benefit of Stripe customers'; 'Stripe records how much of the total balance belongs to your business and reconciles that record against the funds held at the bank'; funds eligible for pass-through insurance 'are held at Fifth Third Bank, N.A.'.; fact: Acquirer disclosure (n.d., accessed 2026-11): in the US 'Stripe, LLC is a Payment Facilitator of the following Payment Method Acquirers', a list of sponsor banks plus 'Stripe MALPB'. | `contrast`: The EEA and UK, one license each. → The US, assembled from state licenses and banks. |\n| p23 | evidence | Stripe's 2026 engineering post on fee credits shows the safeguarding distinction as a property of ledger accounts: real financial accounts are backed by bank accounts, and credits are classed as corporate funds that need no safeguarding. | quotation: 'Every real Stripe financial account—merchant payment balances, bank settlement accounts, treasury accounts—is backed by a real bank account'; credits 'aren't user funds in the regulatory sense ... we can classify the money sitting behind a credit as corporate funds. It doesn't need to be safeguarded, swept to a bank account, or reconciled against a real cash position'; 'We reject attempts to create a transfer between a logical account and a real account at the platform level'. | `additional_support`: The legal and documentation pages. → The same distinction inside the ledger design. |\n| p24 | evidence | In 2025 and 2026 Stripe added two narrow charters, a Georgia acquiring bank and a conditionally approved national trust bank, and neither makes it a deposit-taking bank. | fact: Georgia approved Stripe's merchant acquirer limited purpose bank application (ICBA news item, 2025-07-08, secondary source): such banks 'may not solicit or accept deposits from the general public'; Stripe's acquirer disclosure now lists 'Stripe MALPB'. OCC letter of 12 February 2026 to Bridge Ventures LLC: 'preliminary conditional approval' for Bridge National Trust Bank; 'Final approval ... will not be granted until all preopening requirements are met'. Final approval not verified as of November 2026. | `time`: The structure as documented. → What changed in 2025 and 2026, with status. |\n\n### What a Bank Documents: Adyen\n\n**Controlling idea** (`evidence`, id `adyen-structure`): Adyen states that it is a bank in the EEA, the UK and the US and what it says that enables, and it names no bank where merchant funds sit, so what its bank status means for a product is inference.\n\n**Advances the thesis** (S4): Applies the same questions to the second company and keeps documented license facts apart from the author's reading of them.\n\n**Transition in:** `contrast`: A non-bank that must safeguard. → A provider that is itself the bank.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): License facts, then the company's own claim about them, then the author's inference kept in its own paragraph, then where the evidence stops for both companies; mixing the third into the first two would break AC-3.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | evidence | Adyen N.V. is a Dutch credit institution that serves the EEA by passport, the UK through a branch and the US through a federal branch licensed in 2021. | quotation: 'Adyen N.V. is authorised as a credit Institution under the supervision of Dutch Central Bank' ... 'commonly referred to as a \"banking license\"'; 'authorised as an overseas branch of an EEA credit institution in the UK'; 'Adyen N.V. San Francisco Branch is a federal Branch of Adyen, N.V., licensed by the Office of the Comptroller of the Currency and the Federal Reserve Board of Governors' (adyen.com/licenses, n.d., accessed 2026-11); 2021 release: European banking license 'obtained in 2017' (evidence age 5 years, confirmed by current pages). |  |\n| p26 | evidence | Adyen says the licenses give it direct connections to payment rails and card schemes; its product pages separately offer interest on platform users' balances, and the link between the licenses and that offer is labeled as the author's reading. | quotation: 'Adyen is one of the select fintech companies that holds its own banking licenses across the U.S., the U.K., and Europe. This infrastructure enables direct connections to payment rails and card schemes, reducing intermediaries and fund settlement times' (press release, 2026-04-09); 'Submerchants in the US and EU can earn interest on deposited funds' (adyen.com/accounts, n.d.). | `cause_effect`: The licenses. → What Adyen says they enable. |\n| p27 | analysis | What a bank license implies for how Adyen holds merchant funds and why it can pay out before it is paid is the author's inference, because Adyen's pages state the license and the product separately. | fact: Sales day payout terms (last update 2024-06-17): Adyen pays out 'irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner'; docs: 'Prefinancing is capped at 30 days'.; reasoning: INFERENCE block: a credit institution holds merchant balances as its own liabilities under bank rules, not as safeguarded funds under PSD2 Article 10; pre-financing is consistent with a bank's balance sheet. | `contrast`: What Adyen says. → What it does not say and the author infers. |\n| p28 | claim | The public record stops short of the accounts for both companies: Stripe does not name its safeguarding banks, and Adyen's terms make Adyen the holder of merchant funds before settlement and its documentation gives the country where it holds each settlement currency, without naming a bank. | fact: Adyen's H1 2026 shareholder letter (2026-08-13): '€12.4 billion of total cash', 'The majority of that number represents balances moving through our system on behalf of our merchants'; finance income 'generated primarily from our balances at central and commercial banks'. No breakdown by bank, currency or region.; reasoning: Regulators' registers were not queried; license statements are the companies' own. | `conclusion_summary`: Two documented structures. → The same gap in both. |\n\n### Regional Entities Are Money Boundaries\n\n**Controlling idea** (`analysis`, id `regional-entities`): A region in a provider's API is a different regulated entity or branch with its own accounts, so money crossing regions is a transfer between institutions and not a row moving between tables.\n\n**Advances the thesis** (S3, S4): Draws the architectural consequence of both license structures for an integrator working in several regions.\n\n**Transition in:** `cause_effect`: Licenses that are granted per jurisdiction. → What that does to accounts and flows across regions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | evidence | Where a platform can stand depends on which entity holds the money in each country, and both companies expose that regional license structure to integrators, Stripe through the contracting and acquiring entity of each account's country and Adyen through a separate balance platform per acquiring region. | quotation: Stripe Services Agreement (last modified 2026-09-28): EEA contracting parties 'Stripe Payments Europe, Limited' and 'Stripe Technology Europe, Limited'; UK 'Stripe Payments UK Ltd'. Adyen docs (n.d.): 'You must have a separate balance platform for each region in which you acquire payments'. |  |\n| p30 | analysis | Because each region's funds sit with a different entity, branch or account, a cross-region movement is a real transfer with its own timing and failure modes, and the license tells you nothing reliable about where data is stored. | quotation: Stripe 2026 fee-credits post: 'MMS runs automated intercompany sweeps based on ledger data'.; reasoning: Neither company's license pages describe data location; that question belongs to payment-multi-region-and-data-residency. | `cause_effect`: The regional structure. → What it means for money flows, and what it does not say about data. |\n\n### Three Places a Platform Can Stand\n\n**Controlling idea** (`comparison`, id `platform-designs`): A platform can stay out of the funds, hold a license itself, or send funds it already holds through a payout product, and only the first keeps it outside the rules of this chapter.\n\n**Advances the thesis** (S5): Turns the license vocabulary into the design choice the reader faces and answers the 'only in transit' objection.\n\n**Transition in:** `problem_solution`: Providers whose licenses decide where funds sit. → The positions a platform can take relative to those funds.\n\n**Order of paragraphs** (`comparison`): The three designs on the same criteria, least to most obligation; the objection comes after them because it is an attempt to get the second design's freedom at the first design's cost; the table and recommendation close.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | comparison | In the first design the provider holds the sellers' funds for the sellers and the platform only gives pre-agreed instructions, which is how Stripe describes Connect and how Larkfield runs on both providers. | quotation: Stripe PSD2 FAQ (2024-01-18): 'the platform does not have possession of user's funds at any point'; 'The platform can provide pre-agreed instructions to Stripe'; the platform 'does not have discretionary authority over the funds'; platforms 'would generally only be considered to be engaged in providing payment services where they are in possession or control of user funds'. |  |\n| p32 | comparison | In the second design the platform becomes the licensed holder, which by Stripe's own published estimates takes years and millions before the first payment. | fact: Stripe's payment facilitator guide (n.d., accessed 2026-11; read in the Dutch edition served to this session, so paraphrased): US money transmitter licenses at a minimum of about US$450,000 over about three years for 50 states; platforms in Europe that control the flow of funds need an e-money license that can take a long time and millions of euros. A vendor's estimate, attributed. | `contrast`: Staying out of the funds. → Taking the license. |\n| p33 | comparison | In the third design the platform already holds the money and uses a provider only to send it, and the provider's documentation then says the license and the record of who is owed what are the platform's. | quotation: Stripe docs (n.d., accessed 2026-11): 'Global Payouts is best for businesses that already hold the licenses required to move money themselves'; 'If you manage your customers' funds, you might need a license such as an MTL'; 'you're responsible for any desired tracking of recipient funds'; Connect payouts are 'Covered by Stripe's licensing' and 'your platform isn't part of the payout funds flow'. | `contrast`: A license taken on deliberately. → A product whose terms assume the sender already has one. |\n| p34 | refutation | The objection that money held 'only in transit' for a few days is not customer money does not survive the text of the rule, which covers funds from the moment they are received and gives one business day before they must be in a separate account. | reasoning: PSD2 Article 10 applies to 'all funds which have been received'; its only time limit is the next-business-day placement deadline. Exemptions exist and Stripe's 2024 FAQ expects the commercial agent and limited network exemptions to be narrowed. The author's reading, not legal advice. | `contrast`: Three designs that take the rule seriously. → The view that a short hold escapes it, and the answer. |\n| p35 | recommendation | For a platform whose business is software, the first design is right until the platform needs to do something with the money that no provider will do on instruction. What a provider supports depends on its own license, which is why the providers are compared next. | table: Design / who holds the funds / who keeps the record of who is owed what / what the platform takes on / when it is right: instruct a licensed provider; hold a license; send funds you hold through a payout product. | `conclusion_summary`: Three designs and one objection. → The trade-off table and the author's rule for choosing. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): In the public record the two differ in license type in every major region and in how much of the custody structure they describe, and the difference changes the questions an integrator should ask each.\n\n**Advances the thesis** (S3, S4): The required comparison: documented facts per aspect, 'Not public' where they stop, and the author's reading marked as inference.\n\n**Transition in:** `conclusion_summary`: Each company's documented structure and the designs open to a platform. → The two set side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | comparison | Aspect by aspect, Stripe documents a licensed non-bank's custody structure and Adyen documents a bank's license, with the last column of the table as the author's inference. Stripe's Instant Payouts enters the chapter in the table's last row, where it is cited. | table: Rows: license in the EEA; in the UK; in the US; where customer funds sit; paying out before funds arrive. Columns: Stripe, Adyen, what the difference suggests. |  |\n| p37 | recommendation | An integrator should ask Stripe which entity and safeguarding arrangement applies to each account country, and ask Adyen how balances are treated in each region, since its pages do not say. |  | `cause_effect`: The differences in the table. → What to do differently on each provider. |\n\n### In Practice at Larkfield: Mila's €120 by License Holder\n\n**Controlling idea** (`example`, id `in-practice`): Followed by holder instead of by state, Mila's €120 is never in Larkfield's possession on either provider, and the 14-day buffer can be built the same way.\n\n**Advances the thesis** (S5, S2): Works the chapter's test (who has possession or control at each step) on the recurring payment and resolves the scene's proposal.\n\n**Transition in:** `example`: The comparison of the two providers. → One payment followed through each provider's license structure.\n\n**Order of paragraphs** (`comparison`): The same payment on one provider, then the other, then the proposal resolved; the resolution needs both cases first because it has to work on both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | example | On Adyen, the €117.47 owed to Studio Noord between 9 and 11 March 2027 is a balance at Adyen N.V., a bank, and Larkfield's ledger holds only a record of it. | scenario: €120.00 at 19:42 on 9 March 2027; €117.47 to Studio Noord, paid out 11 March; Larkfield's fee €2.53; Studio Noord on Adyen. |  |\n| p39 | example | Had Studio Noord been on Stripe, the same €117.47 would by Stripe's description sit in a safeguarding account of its Irish e-money institution, and across Larkfield's five markets the holder changes with the provider and the country. | table: Larkfield market / provider / licensed holder as the provider documents it / license type: NL and DE on Adyen; NL and DE studios still on Stripe (1,140); Belgium; United Kingdom; United States. | `contrast`: The Adyen case. → The Stripe case and the map of holders by market. |\n| p40 | example | Larkfield got its buffer without holding the money: the delay is an instruction on the studio's balance at the provider, and Larkfield's ledger records what is held back and why. | scenario: The refund buffer as a hold on the studio's provider balance, with a ledger entry per K3; the mechanics of holds and refunds after payout belong to splits-balances-and-platform-payouts and platform-payment-models. | `problem_solution`: Funds that never touch Larkfield. → The scene's proposal rebuilt inside that constraint. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Custody fails in four ways an engineer can check for: a pooled account whose record is wrong, a shortfall the integrator cannot see, a platform that came into possession by accident, and a license structure that changed underneath a design.\n\n**Advances the thesis** (S2, S5): Gives detection and recovery for the failures the mechanism and the designs make possible.\n\n**Transition in:** `contrast`: The flow working as designed. → The ways it fails.\n\n**Order of paragraphs** (`grouping`): Two failures at the provider (the record, the shortfall), then one at the platform, then drift over time; the provider failures come first because they explain why the platform must not copy the structure casually.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | evidence | When a pooled account's record is wrong and the firm that kept it fails, the bank cannot say whose money it holds, which is what US regulators cited when they proposed new record-keeping rules in 2024. | quotation: FDIC press release, 17 September 2024: the proposal is 'an important step to ensure that banks know the actual owner of deposits placed in a bank by a third party such as Synapse, whether the deposit has actually been placed in the banks, and that the banks are able to provide the depositor their funds even if the third party fails' (Chairman Martin J. Gruenberg). A proposal. Status as of 17 November 2026 (FDIC 2024 Federal Register publications page and the Federal Register's documents for RIN 3064-AG07, accessed 2026-11-17): proposed 2 October 2024 (89 FR 80135), comment period extended to 16 January 2025, no final rule or withdrawal listed. |  |\n| p42 | analysis | A shortfall at your provider is invisible from the API, so the protection is to know what you are exposed to: the balance left at the provider, for how long, and under which protection scheme. | fact: Stripe's UK support article: an e-money institution's customers are not covered by the Financial Services Compensation Scheme (read through a summarizing fetch). | `additional_support`: A failure of the record. → What an integrator can and cannot see of it. |\n| p43 | analysis | A platform usually comes into possession by accident, through a refund paid from its own account, a top-up collected for sellers or a temporary collection account, and the test is whether any bank account in its own name receives money owed to someone else. | reasoning: Each of the three flows puts funds owed to a seller or customer into an account the platform controls. | `contrast`: Failures at the provider. → Failures at the platform, the Accidental Bank. |\n| p44 | analysis | License facts change faster than integrations: acquirer lists, partner banks and charters all moved in 2025 and 2026, so they should be recorded with a date and rechecked on a schedule. | fact: Stripe's acquirer disclosure now lists its own Georgia bank; the Bridge charter is conditionally approved; PSD3 and the Payment Services Regulation are pending; the UK's end-state regime has no date. | `additional_support`: Accidental possession. → Drift in the provider's own structure. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The ledger, the balance, the payout, the reconciliation and the license are one control seen five ways: a statement of who owes whom, made true by comparing it with a record somebody else keeps. 'Where is the money' has no answer inside the provider: the cash is at banks, and what the provider holds is a structure of claims and the proof that it matches. The license decides which claims and which proof.\n\n**So what:** An integrator cannot inherit that proof by reading a balance. It has to keep its own entry for each movement, reconcile it against the provider's reports, and know which licensed party holds the funds at each step, or it will find its own unexplained difference at year-end.\n\n**Callback:** The whiteboard arrow from the customer into 'our bank account', and, for the part, Larkfield's €412,000. The reader can now say what the arrow brings in (possession, therefore a license, a safeguarding account and a daily comparison) and that the €412,000 sat in movements after the payment, which a record of payments has no place for.\n\n**Takeaway** (`course_of_action`): For each kind of movement in your system (fee, split, refund, dispute, payout, return), write the entry, name the clearing account it must empty and name the outside report that proves it, as Larkfield's Keel decision K3 does; and for each step of each funds flow, write down which licensed entity has possession.\n\n**Hand-off** to [Part IV — INTERFACE: The API as the Product](part-4.html): `contrast`: Part III's provider seen from inside: every movement recorded twice and proven against networks and banks over days. → The same provider seen from outside, by a developer who gets an answer in seconds: what of that slow record the API shows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | synthesis (list) | Established: funds received by a licensed non-bank are not deposits and must be safeguarded, a bank may use what it holds, and both companies state their license types on their own pages. |  |  |\n| p46 | synthesis (list) | Depends on context: whether a platform should ever hold a license, how much to leave in a provider balance and how far a provider's license type should weigh in choosing it. |  | `contrast`: What is settled. → What changes with the situation. |\n| p47 | recommendation (list) | The author's synthesis: treat possession as a design property to be checked at every arrow, and treat a provider's license as a dated fact in your own records. |  | `contrast`: What is established and what depends. → The author's own position, returning to the opening arrow. |\n| p48 | synthesis | Closing Part III: the ledger, the balance, the payout, the reconciliation and the license are one control seen five ways, and Larkfield's €412,000, the year-end 2025 gap told in payment-reconciliation-and-reporting, was what the absence of that control looks like. |  | `conclusion_summary`: This chapter's take-aways. → The part's closing: five chapters as one control, the €412,000 and Keel decision K3. |\n| p49 | recommendation (list) | Eight questions let the reader test custody in a funds flow of their own or in a provider evaluation. |  | `cause_effect`: The closing argument. → Questions that apply it. |\n| p50 | transition | Part III looked at the provider from inside, over days; Part IV looks at the same provider from outside, through an API that answers in seconds. |  | `contrast`: The slow record and its proof. → The fast interface that must not be mistaken for it. |\n\n## Non-goals\n\n- Acquiring membership, sponsor banks as acquirers and the acquirer of record. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html).\n- Balances, reserves, negative balances and pre-funding as product mechanics. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- How reconciliation is built and what reports each provider exposes. See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Know-your-customer, anti-money-laundering duties and verification as account state; the regulation calendar. See [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- Platform charge types, liability for losses, splits and the mechanics of refunds after payout. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Accounts, cards and lending offered to a platform's users. See [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- Where data is stored and data-localization law. See [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html).\n- Stablecoin reserves and the regulation of stablecoin issuers. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n- Legal advice on whether a given platform needs a license or qualifies for an exemption.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- PSD3 and the Payment Services Regulation awaited Parliament's second reading on 17 November 2026 (indicative plenary 14 December 2026); article numbers and the safeguarding text must be rechecked after publication in the Official Journal.\n- Final approval of Bridge National Trust Bank was not found as of 17 November 2026: the OCC's list of decisions shows only the preliminary conditional approval of 12 February 2026. Recheck before publication.\n- Stripe's UK safeguarding article renders client-side and was read through a summarizing fetch; it is paraphrased, not quoted.\n- Regulators' registers (Central Bank of Ireland, FCA, DNB, OCC) were not queried; license statements are the companies' own.\n- Whether a balance waiting for payout at Adyen is a deposit under the Dutch deposit guarantee is not stated; Adyen's depositor information sheet covers its business accounts only.\n\n## Decision log\n\n- **2026-11-17** — The Larkfield scene is a rejected proposal (a 14-day refund buffer in Larkfield's own account) and not an incident, because the ledger says Larkfield never holds member funds and no 2026 incident is about custody. Rejected: Inventing a custody incident at Larkfield, which would contradict the ledger.; Opening with the Unexplained €0.4 Million, which belongs to the part opening and returns here only in the part closing.\n- **2026-11-17** — Stripe and Adyen get one section each before the comparison table, because the documented material differs in kind (structure for Stripe, license statements for Adyen) and AC-3 needs the inference about Adyen in a paragraph of its own. Rejected: One merged section organized by region.\n- **2026-11-17** — The Synapse failure is cited only through the FDIC's 2024 press release, fetched by the writer, as the regulator's statement of the pooled-account failure; no account of the bankruptcy itself is given. Rejected: Narrating the Synapse case from trade press.\n- **2026-11-17** — Stripe's payment facilitator guide is paraphrased, not quoted, because the page was served in Dutch to this session. Rejected: Quoting the English wording from the research brief without seeing it.\n\n## Sources\n\n- **Internal**\n  - _research/brief-ledgers-and-money-movement.md — Part 5 (licenses and safeguarding), section 1.2 (fee credits post), section 2.7 (pre-financing), section 3.3 (Global Payouts) and the open questions.\n  - _research/brief-companies-and-bets.md — Adyen's license statements in investor documents and the H1 2026 cash figure; Stripe's charters.\n  - _research/brief-fraud-risk-and-compliance.md — The regulation calendar: PSD3 and PSR status, UK safeguarding reform, the US model law.\n  - _research/brief-platforms-and-embedded-finance.md — Adyen's balance platform per region; Stripe's payment facilitator guide.\n  - _research/scenario-ledger.md — Larkfield's volumes, markets, providers, Mila's class pass, the refund after payout, K3.\n  - _research/consistency-issues.md — Rulings 3, 7 and 11.\n- **External**\n  - Pages fetched by the writer on 2026-11-17: Directive (EU) 2015/2366; Directive 2009/110/EC; Regulation (EU) No 575/2013; FCA PS25/12 (page and PDF); OCC conditional approval letter of 2026-02-12; FDIC press release of 2024-09-17; European Parliament procedure file 2023/0210(COD); Stripe legal, FAQ, documentation and stripe.dev pages; Adyen license, press and documentation pages. — Verification of every quotation used.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 78 claims checked (65 confirmed, 10 corrected, 3 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the UK safeguarding rules and Stripe's Georgia acquiring bank are now stated as in force and in business from primary sources, and Adyen's depositor information sheet replaces a \"Not public\" cell.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on in the draft: passporting, federal branch, trust bank and deposit guarantee are glossed where first used. Notes not acted on: moving the comparison section before the platform designs; merging p28 into p36; cutting the data-location sentence of p30.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry know[1] (ruling 33b) re-synced; journal entry thesis.how_why (ruling 33c) re-synced; journal entry thesis.how_why (ruling 33d) re-synced). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 5 statements of absence re-tested with a wide search (0 overturned, 3 narrowed, 2 hold; table in _research/absence-audit/16-licences-and-safeguarding.md). Narrowed: Adyen's terms (1 November 2023) describe balances before payout as 'amounts held by Adyen prior to Settlement'; Stripe's services terms place funds in pooled accounts at unnamed financial providers. p28's controlling idea updated.\n- **2026-11-17** — Absence audit, second finding: Adyen's 'Supported payout currencies' page documents the country where it holds funds per settlement currency; the 'Not public' cell for balances waiting for payout now says so and keeps 'Not public' for the banks only. The journal-spec-locked 'What is not public: ... where Adyen holds merchant funds' is reported to the author.\n- **2026-11-17** — Cross-chapter conflict settled: caveat added to the pre-financing sentence (Annual Report 2025: paying 'only after funds have been received' is the 'default setup').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('and where Adyen holds merchant funds.' -> 'and which banks hold the balances Adyen keeps before payout ').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('and it does not publish where merchant funds sit.' -> 'and it says merchant balances are held by Adyen before settl').\n- **2026-11-17** — Sweep of rulings 46-48: 'does not publish where merchant funds sit' narrowed in intent, thesis claim, thesis how_why, supporting claim, thesis statement and one section controlling idea: Adyen documents that it holds the balances itself, in a country per settlement currency; only the banks are unnamed (ruling 47g). Key point aligned.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('they do not say where merchant funds sit, and' -> 'its terms and documentation say merchant balances are held b').\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after draft check, round 1. AC-3: the link between Adyen's licenses and its interest offer is labeled as the author's reading (p26); the FDIC's 2024 custodial-accounts proposal is given with its status as of 17 November 2026 from the FDIC's and the Federal Register's listings (p41, one source entry added). Safeguarding glossed at first use (roadmap, callout, p10; p11 now 'safeguard'). Glosses for D+1, Stripe MALPB, Stripe Payments Europe, fee credits and logical accounts, Sales day payout, Femke de Graaf, the five markets and Rotterdam. License table, Sales day payout sentence and the 'public record stops' paragraph clarified; 'Against all three' and table-row references reworded; Where They Differ lead-in no longer calls Instant Payouts cited above; transitions into Stripe, Regional Entities and Where They Differ strengthened; the part closing reminds the reader of the €412,000.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
