2017; neither company publishes its webhook delivery design, its card-vault internals beyond a paragraph, or where its systems run more finely than a continent or country (Adyen) or beyond two countries named for login and identity data (Stripe names no cloud region).\n- **Know:** Larkfield and Mila's class pass in a few paragraphs, and the names of the sixteen failure patterns as a list grouped by family that the patterns page unpacks.\n- **Know:** What the book leaves to its sibling books: reconciliation and posting from the finance side (RECONCILED) and payments as a merchant's order system sees them (ORDERED).\n- **Believe:** The API's answer is not the outcome: a payment is done when it is settled and every record of it agrees.\n- **Believe:** Stripe and Adyen are the anchors because both publish enough to compare, not because either is the right answer for every business.\n- **Believe:** An honest 'Not public' is more useful to a builder than a confident guess about a provider's internals.\n- **Be able to:** Go from the decision in front of them to the chapter to start with.\n- **Be able to:** Tell a documented fact from an inference, a Larkfield illustration and an assumption when a chapter states one, and say how much a dated source supports about the present.\n- **Be able to:** Read a 'Where They Differ' row and say which cells are evidence and which is the author's reading.\n\n**Audience:** A software engineer or architect who is new to payments and has opened the book at its first page, possibly with a payment decision already waiting.\n\n**Already knows:**\n\n- APIs, HTTP, databases, queues, webhooks as a mechanism, retries and replication.\n- What paying online and at a terminal is like from the customer's side.\n\n**Does not yet know:**\n\n- Payments vocabulary (issuer, acquirer, clearing, settlement, chargeback, payout); each term the page uses is glossed in a clause.\n- What Stripe and Adyen have and have not published about their systems, and how old the best-known material is.\n- Larkfield, the failure patterns and how the book is laid out.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the book's argument and list the subjects of its parts in order. *Probe:* After reading only this page: what does this book argue, and what will its parts cover, in order? | `custom` | cold_reader | major |\n| AC-2 | Given a decision the page's routing table lists, the reader names the chapter to start with. *Probe:* Your nightly job that charges customers timed out halfway, and you do not know which customers were charged. Using only this page: which chapter do you open first, and why not the reliability chapter? | `custom` | cold_reader | major |\n| AC-3 | Given four sentences in the book's style, the reader labels each with the kind of statement it is. *Probe:* Using only this page, say what kind of statement each is and how far you may rely on it: (a) 'Adyen's Annual Report 2025 reports processed volume of €1,394.3 billion.' (b) 'INFERENCE, NOT DOCUMENTED: a provider plausibly keeps slow webhook endpoints in a separate queue.' (c) 'Larkfield processed €1.12 billion for its studios in 2026.' (d) 'Assume the provider's cost on this payment is €0.61.' | `custom` | cold_reader | major |\n| AC-4 | The reader can say what the public record does and does not contain for the two companies, without overstating either. *Probe:* Using only this page: a colleague wants to compare Stripe's and Adyen's revenue and then copy 'how Stripe implements idempotency' from its engineering blog. What does this page tell you about each plan? | `custom` | cold_reader | major |\n| AC-5 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the page's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this page discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-6 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does this book argue, who is it for, and how should its evidence about Stripe and Adyen be read?\n\n> **Claim:** This book argues that the answer a payment API returns in two seconds is the first of several promises, kept over days by parties that cannot see each other and reversible for months, and that each component of payment infrastructure exists to close that gap without losing or duplicating money. It is for engineers and architects new to payments, and it states about Stripe and Adyen only what a public source with a date says, marking everything else as inference, illustration, assumption or 'Not public'.\n\n**Disputed by:** The view that payments are a solved commodity behind an API, so that a newcomer should begin with a provider's quickstart and a feature comparison, and that what the two companies' engineering blogs describe can be taken as how their systems work today.\n\n**So what:** A reader who accepts this stops treating the API response as the outcome, asks of every design which promise it records and what will prove the promise was kept, and discounts any account of a provider's internals, including this book's, by the age and kind of its source.\n\n**How and why:** Mila's €120 is approved at 19:42 on a Tuesday and reaches the studio on Thursday; between the two, the issuer, the network, the acquirer and the provider each act on their own records, and the integrator hears of it through responses, webhooks and reports. The companies publish unevenly: Adyen files audited annual accounts, Stripe publishes annual letters with volume but no revenue; Stripe's posts on idempotency, rate limiting and API versioning are from 2017 and Adyen's on its accounting system from 2021; neither publishes how its webhook sender is built or the topology and timing of a failover between its data centers or regions. A book that hid those gaps would teach invented internals, so each chapter shows per aspect what is documented, with its year, and what is not.\n\n**Supporting claims**\n\n- **S1** — The answer a payment API returns in two seconds is the first of several promises, kept over days by parties that cannot see each other and reversible for months; each component of payment infrastructure exists to close that gap without losing or duplicating money, and the failures of payment systems are promises that some system recorded as the truth.\n- **S2** — The book is written for engineers and architects new to payments and is laid out so that each part supplies the vocabulary the next one needs: four preface pages, ten parts from how money moves to how Stripe and Adyen chose to build, and four reference pages, with a route from a decision to the chapter that answers it.\n- **S3** — Every statement in the book is one of six kinds that the wording keeps apart, a statement about Stripe or Adyen carries its source and year, an old source is flagged, and 'Not public' reports a dated search that found no first-party statement, not a proof that nothing exists.\n- **S4** — Stripe and Adyen are the anchors because both publish enough to compare and not because either is the right answer; they publish unevenly, so each chapter's 'Where They Differ' table shows per aspect what each has documented and what it has not, and keeps the author's reading in a separate column.\n- **S5** — The book's examples come from one fictional platform, Larkfield, which is never evidence about a provider; the book is independent of both companies, rests on public dated sources only, and leaves the finance side and the merchant's order system to its sibling books.\n\n## Role in the part\n\nPerforms the journal's and the part's opening: states the claim, the reading order and the evidence rules, explains the 'Where They Differ' sections, and gives the pattern names and Larkfield in outline so the next two pages have something to unpack. Supports PF-1, PF-2 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `large_to_small` in organization and larkfield: the whole before its parts; `small_to_large` in evidence: from one sentence to the two companies' record to a chapter's conclusions)\n\nEach section supplies what the next one uses. The reader comes first because the argument is phrased for them. The argument comes before the patterns, which are its negative form, and before the organization, whose order it explains. The evidence rules come after the organization because they explain two fixed elements of every chapter (the 'Where They Differ' table and the take-away tiers) that the organization section has just named; put first, they would be rules for a book the reader has not yet seen. Larkfield follows the evidence rules because it must be read as illustration, never as evidence. The routes come after all of these because a routing table is useful only to a reader who knows the claim, the parts and how far to trust a chapter; the boundary and the sources close the page because they qualify everything before them. Moving the routes to the front would serve the reader with a decision and cost the first-time reader the claim.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): At 19:42 on Tuesday 9 March 2027, Mila Janssen buys a ten-class pass for €120 in a studio's app and sees 'Payment successful' two seconds later. At that moment no money has moved: her bank has made a promise, and the studio will be paid on Thursday, by systems that never saw her tap the button.\n\n**Bridge:** An engineer sees a payment as one API call that returns success in a second or two. → On the provider's side that answer is the first of several promises kept over days by parties that cannot see each other, and the gap between the answer and the settled truth is the book's subject.\n\n**Thesis statement** (KEY POINTS callout (the three bullets) and paragraph p02): The answer a payment API returns in two seconds is the first of several promises, kept over days by parties that cannot see each other and reversible for months, and each component of payment infrastructure exists to close that gap without losing or duplicating money. The book states about Stripe and Adyen only what a public source with a date says and marks everything else.\n\n**Roadmap** (Paragraph p03, with the KEY POINTS callout):\n\n- Who the book is for. *Kept in:* audience.\n- The argument that a payment is a promise that takes days to keep, and the named ways systems fail when a promise is recorded as the truth. *Kept in:* argument, patterns.\n- How the book is organized in ten parts. *Kept in:* organization.\n- How to read the evidence labels, the 'Where They Differ' tables and the take-away tiers, and why Stripe and Adyen are the anchors. *Kept in:* evidence.\n- The fictional platform Larkfield and the recurring payment. *Kept in:* larkfield.\n- How to find a chapter for a decision, what is left to the sibling books and what the book draws on. *Kept in:* routes, left-out, basis.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At 19:42 on Tuesday 9 March 2027 Mila Janssen sees 'Payment successful' two seconds after buying a €120 class pass, and at that moment no money has moved: her bank has made a promise, and the studio is paid on Thursday by systems that never saw her tap; Mila, the studio and the platform between them, Larkfield, are fictional. | scenario: Mila's class pass (scenario ledger; fictional): €120.00 ten-class pass at Studio Noord, Tuesday 9 March 2027 at 19:42; payout sent Thursday 11 March. |  |\n| p02 | claim | To a developer a payment is one call that returns success, but on the provider's side that answer is the first of several promises kept over days by parties that cannot see each other and reversible for months, and each component of payment infrastructure exists to close that gap without losing or duplicating money. | reasoning: The journal thesis, first half, in the journal spec's words; Larkfield named as fictional. | `contrast`: The success message on Mila's screen. → What that message is on the provider's side: the first of several promises; the book's claim. |\n| p03 | transition | This page says who the book is for, states the argument and names the ways it fails, lays out the ten parts, explains how to read the evidence about Stripe and Adyen, introduces Larkfield, and routes a reader from a decision to a chapter and to what the sibling books cover, using one fictional payment and dated public facts about what the two companies publish. |  | `sequence`: The claim. → The order of this page and the kind of evidence it uses. |\n\n## Sections\n\n### Who This Book Is For\n\n**Controlling idea** (`description`, id `audience`): The book is for people who build software for a living and have just been asked to integrate, operate, extend or evaluate payment infrastructure; it assumes software knowledge and no payments vocabulary.\n\n**Advances the thesis** (S2): Fixes the reader the rest of the book is written for and what it will and will not explain.\n\n**Transition in:** `elaboration`: The roadmap's first promise. → The reader the claim is addressed to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description (list) | The reader is an engineer or architect who is new to payments and has been asked to integrate with a provider, to operate or extend a payment system, to build a platform that pays other businesses, or to evaluate providers. | example: Four situations as a list: integrating a provider; running or repairing an existing integration; building a platform whose customers are the sellers; choosing or comparing providers (journal spec, audience). |  |\n| p05 | explanation | The book assumes you know APIs, databases, queues and retries and explains every payments, banking and billing term where it is first used in each chapter, and it speaks as an architect who builds on payment providers, in the first person where it gives judgement. | example: Terms explained locally, for example issuer (the cardholder's bank) and acquirer (the licensed institution that takes a merchant's card payments into the card networks); the glossary collects them with each provider's word (style guide, voice and audience). | `elaboration`: The reader's situation. → What the book assumes of that reader, what it explains, and whose voice it speaks in. |\n\n### The Argument: A Promise That Takes Days to Keep\n\n**Controlling idea** (`claim`, id `argument`): A payment is a chain of promises kept over days, the components of payment infrastructure exist to close the gap between the instant answer and the settled truth, and Stripe and Adyen differ mainly in which side of that gap they built first.\n\n**Advances the thesis** (S1): States the journal thesis in full, with the timeline behind it and the view it disputes.\n\n**Transition in:** `elaboration`: The reader, who sees a payment as one call. → What stands behind that call: five promises, in order.\n\n**Order of paragraphs** (`prerequisite_order`): The timeline of one payment first, because the claim about components means nothing until the reader has seen the promises; then the claim, the view it disputes, and last the half of the thesis about the two companies, which uses the phrase 'side of the gap' the first three paragraphs define.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | explanation | Mila's payment is five promises made in turn by her bank, the studio, the acquirer, the network and the provider (authorization, capture, clearing, settlement, payout), followed by a dispute window of about 120 days in which nothing is final. | table: Six rows (Step \\| Who promises what \\| For Mila's €120), in the wording of journey-of-a-payment, which owns the six steps and five promises: authorization, the issuer, 'I will honor a claim for this amount if it arrives in time', 19:42 Tuesday; capture, the merchant, 'I claim the money', automatic; clearing, the acquirer, 'this is the final amount and data', the same or the next day (industry practice); settlement, the network, its members pay each other, the next business day or later (industry practice); payout, the provider, 'this is yours to withdraw', Thursday 11 March; dispute window, no promise: until it closes nothing is final, until about 7 July 2027 (ledger; 120 days per Visa's rules of 24 October 2026 as cited in journey-of-a-payment).; figure: Illustration placeholder: a two-second answer at the left of a long timeline whose later marks are payout after two days and the end of the dispute window after about 120 days. |  |\n| p07 | claim | Because the answer is a promise and not the outcome, a payment is done when it is settled and every record of it agrees, and each major component (state machines, idempotency, ledgers, reconciliation, tokens, risk scoring, platform accounts) exists to close the gap between the two without losing or duplicating money. | reasoning: Journal thesis, first half: each component named with the part that teaches it. | `cause_effect`: Five promises on five clocks. → The consequence: when a payment is done, and what the architecture is for. |\n| p08 | counterargument | The view the book disputes is that payments are a solved commodity behind an API; a reader who accepts the claim instead asks of every design which promise it records, who made it and which record will prove it was kept. | reasoning: The disputed view and the so-what of the journal thesis; the three questions from the preface's thesis. | `contrast`: The claim. → The opposite view and what changes for a team that gives it up. |\n| p09 | claim | Stripe and Adyen differ mainly in which side of the gap they built first, Adyen the regulated money path and Stripe the developer's abstraction over it; by 2026 each is building toward the other's side, and the public record shows the order of construction more clearly than the reasons for it. | fact: Adyen Annual Report 2025 (signed 5 March 2026, https://investors.adyen.com/financials/2025): 'we would develop and operate the essential layers of the financial stack ourselves'; 84% of 2025 processed volume was full-stack. Adyen press release, 1 July 2026 (https://www.adyen.com/press-and-media/adyen-closes-talonone-and-orb-acquisitions-announces-leadership-updates): Talon.One and Orb acquisitions closed.; fact: Stripe, Acquirer Disclosure & Acquirer Terms (n.d., accessed November 2026, https://stripe.com/legal/acquirer-disclosure): 'Payment Method Acquirer is Stripe Technology Europe, Ltd.' for the EEA; 'Stripe MALPB' among the US acquirers (rulings 11, 27, 33; as verified in case-stripe). | `additional_support`: The gap and its two sides: the slow, regulated movement of money and the instant answer a developer sees. → The second half of the thesis: which side each company built first. |\n\n### Sixteen Ways the Gap Shows\n\n**Controlling idea** (`description`, id `patterns`): Payment systems fail in sixteen recurring, named patterns in four families, each a way of taking a promise or an untested assumption for the truth, and the patterns chain.\n\n**Advances the thesis** (S1): Gives the claim its negative form: what happens when a system treats a promise as the outcome.\n\n**Transition in:** `cause_effect`: The claim that the answer is a promise. → What goes wrong when a system records that promise as the truth: sixteen named patterns.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | description (list) | The sixteen patterns fall into four families: money truth, integration, trust, and platform and scale. | example: The sixteen names exactly as in the style guide's table, grouped by family, each family glossed in a clause from where-payment-systems-go-wrong. |  |\n| p11 | explanation | The patterns chain: a failure is usually noticed at a money-truth pattern and started at one of the other eleven, so the chapters name the patterns they work on and the list serves as an index. | scenario: Larkfield's 1 November 2026 (ledger): the first-of-month renewal wave, a timeout, a retry under a new idempotency key; 1,840 members charged twice, €71,300 refunded. | `elaboration`: Sixteen names in four families. → How the patterns connect, and how the book uses the names. |\n\n### How the Book Is Organized\n\n**Controlling idea** (`description`, id `organization`): The book has four preface pages, ten parts in the order each needs the vocabulary of the one before, and four reference pages; chapters in Parts I to VIII share one anatomy, and Parts IX and X use everything before them.\n\n**Advances the thesis** (S2): Lays out the parts in order with the question each answers, so the reader can list them and knows why the order is what it is.\n\n**Transition in:** `sequence`: The argument and the patterns that follow from it. → How the book spreads the argument over its parts.\n\n**Order of paragraphs** (`large_to_small`): The whole layout first, then the reason for its order, then what one chapter looks like, then the two parts that depart from that anatomy; the chapter anatomy presupposes the reader knows which parts it applies to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | description | The book is laid out as four preface pages, ten parts and four reference pages (domain coverage, toolkit, glossary, bibliography), and each part answers one question. | table: Twelve rows (Section \\| The question it answers \\| Pages): Preface (this page, how-payments-got-complicated, where-payment-systems-go-wrong, meet-larkfield); part-1 to part-10 with the question from each part's journal-spec thesis and its chapter subjects from config.yaml; Reference (domain-coverage, toolkit, glossary, bibliography). |  |\n| p13 | explanation | The parts are in prerequisite order: each needs the vocabulary of the ones before it, and the journeys and the comparison of the two companies come last because they use all of it. | reasoning: Journal spec flow rationale: parties and timeline (I) before approval (II); both before the ledger (III); balances and states before the API (IV); the API before the controls in its path (V); billing after the controls because recovering a renewal uses stored credentials; platforms, then scale; journeys and cases last.; figure: Illustration placeholder: a map of the book as a path from a preface block through ten numbered stations to a reference shelf, with the first eight stations grouped as mechanisms and the last two as 'whole payments' and 'two companies'. | `cause_effect`: The order of the table. → Why the parts come in that order. |\n| p14 | description | Every chapter in Parts I to VIII has the same anatomy: a scene at Larkfield, a paragraph that places it on the path of Mila's class pass, the problem before the mechanism, the designs and their trade-offs, a section titled 'Stripe and Adyen: Where They Differ', what goes wrong, and 'What to Take Away'. | example: Style guide, page format and body order: the five questions (what problem and why it is hard, how the mechanism works, which designs exist, what trade-offs, how Stripe and Adyen each do it); 'Where we are in the payment's journey'; Questions to Ask; Sources and Evidence. | `elaboration`: The parts. → What one chapter inside Parts I to VIII contains. |\n| p15 | description | Parts IX and X teach no new mechanism: Part IX follows four Larkfield payments end to end on both providers, and Part X reads the two companies' dated records, compares their nition | Because the book is anchored on two real companies, every statement in it is one of six kinds that the wording keeps apart: documented fact, industry practice, labeled inference, recommendation, illustration and assumption. | table: Six rows (Kind \\| What it is \\| How to recognize it), from the style guide's evidence discipline: documented fact (attributed in the sentence, year given, URL under Sources and Evidence); industry practice ('commonly', no invented percentages); reference-architecture inference (a block marked INFERENCE, NOT DOCUMENTED); recommendation (first person, with conditions); illustration (Larkfield, labeled fictional in each chapter); assumption ('assume…' or *(assumption)*). |  |\n| p17 | explanation | A documented fact about a company carries its year in the sentence, and a source older than about three years carries an evidence-age flag, because much of the best-known material on Stripe's API internals dates from 2017 and Adyen's account of its accounting system from 2021. | fact: Stripe engineering posts: 'Designing robust and predictable APIs with idempotency', Brandur Leach, 22 February 2017 (https://stripe.com/blog/idempotency); 'Scaling your API with rate limiters', Paul Tarjan, 30 March 2017 (https://stripe.com/blog/rate-limiters); 'APIs as infrastructure: future-proofing Stripe with versioning', Brandur Leach, 5 August 2017 (https://stripe.com/blog/api-versioning). Adyen: 'Design to Duty: The Accounting and Reporting Systems at Adyen', Willem Pino, 23 August 2021 (https://www.adyen.com/knowledge-hub/design-to-duty-adyen-architecture-part2). All re-fetched 17 November 2026.; fact: Documentation pages are undated and cited 'n.d., accessed November 2026' (ruling 30); current documentation still describes the idempotency key of the 2017 post and states that keys can be removed once at least 24 hours old (https://docs.stripe.com/api/idempotent_requests); the 2017 post itself gives no retention period. | `elaboration`: The first kind, the documented fact. → Why it carries a year and, when old, a flag. |\n| p18 | definition | 'Not public' means that no first-party statement was found in the provider's documentation, help center, site or engineering posts as of November 2026; it does not mean the provider lacks the mechanism, and it is an answer to record, not an omission. | reasoning: Style guide and ruling 39: an absence is worded as 'not found in the documentation, help center or site as of November 2026'. | `contrast`: What a dated source says. → What the book writes when no source says anything. |\n| p19 | evidence | When every chapter was checked against its sources, the most common error corrected was an over-confident 'Not public', so an absence in this book is a dated search result and not a proof. | case: Verification of the book, 17 November 2026 (consistency rulings 34, 39, 42): first searches leaned on the providers' documentation indexes, which do not list every page. Two corrected absences: Adyen on load testing ('We periodically load test this system with merchants who hold transactions and then release the transactions in bulk', Peak season readiness, https://docs.adyen.com/industries/peak-season, n.d., accessed November 2026) and Stripe on how renewals are scheduled ('a scheduling service that looks for database records meeting certain criteria', Ji Huang, 9 May 2024, https://stripe.dev/blog/test-clocks-how-we-made-it-easier-to-test-stripe-billing-integrations). | `additional_support`: The definition of 'Not public'. → What happened when those statements were tested: the commonest error in the book. |\n| p20 | comparison | Stripe and Adyen are the anchors because both publish enough to compare, not because either is the right answer for every business, and they publish unevenly: Adyen is listed and files audited accounts, while Stripe is private and publishes volume and customer counts but no revenue. | statistic: Adyen Annual Report 2025 (audited; https://investors.adyen.com/financials/2025): processed volume €1,394.3 billion, net revenue €2,364.2 million. Stripe annual letter 2025, 24 February 2026 (https://stripe.com/annual-updates/2025): 'businesses running on Stripe generated $1.9 trillion in total volume'; the metric is not defined and no annual letter gives the company's revenue (case-stripe; the 2025 letter gives a run rate for one product group only).; reasoning: Edges of the record common to both, as the chapters word them after verification: neither publishes how its webhook sender is built (payment-webhooks-and-events), a design for its card vault (tokenization-vaulting-and-pci), or the topology and timing of a failover between data centers or regions (payment-reliability-and-availability, payment-multi-region-and-data-residency; ruling 45). | `additional_support`: Dated facts and dated absences about two companies. → Why these two companies, and how unevenly they publish. |\n| p21 | explanation | A 'Stripe and Adyen: Where They Differ' table has one row per aspect; its Stripe and Adyen cells hold a documented fact with its year or the words 'Not public', and its last column is the author's inference. | table: Two sample rows from idempotency-and-retries (documentation accessed November 2026): Retention window \\| API v1: at least 24 hours; API v2: 30 days \\| 7 to 14 days after first submission \\| a next-day retry is inside Adyen's window and outside Stripe v1's guarantee. Key store unavailable \\| Not public \\| 503 with code 703 \\| Adyen leaves the choice between availability and protection to the integrator. Sources: https://docs.stripe.com/api/idempotent_requests, https://docs.stripe.com/api-v2-overview, https://docs.adyen.com/development-resources/api-idempotency. | `example`: The uneven record. → The device that shows it per aspect in every chapter of Parts I to VIII. |\n| p22 | definition | Every chapter ends its argument with 'What to Take Away' in three tiers (established, depends on context, the author's synthesis), which say how much weight each conclusion carries. | example: Style guide, three tiers of take-away: Established (what the field agrees on, with the evidence or standard behind it); Depends on context (holds under a stated condition); The author's synthesis (the author's position, with its reasoning). | `similarity`: The kinds, which label single sentences, and the table's last column, which is marked as the author's. → The same separation applied to a chapter's conclusions. |\n| p23 | claim | Two things are never evidence about a provider: Larkfield, which is fictional, and the author's position, because the book is independent of Stripe and Adyen and uses no internal material, and neither company reviewed it. | reasoning: Style guide (Larkfield usage: what Larkfield experiences with a provider is illustration, never evidence; never claim inside knowledge of any company); meet-larkfield's three conventions. | `emphasis`: Kinds, dates, absences and tiers. → What is excluded from evidence altogether. |\n\n### Larkfield and Mila's Class Pass\n\n**Controlling idea** (`description`, id `larkfield`): The book's examples come from one fictional platform, Larkfield, which runs on both providers, had eight incidents and answers them with the Keel program, and from one recurring payment whose facts never change.\n\n**Advances the thesis** (S5): Introduces the illustration in outline so that later pages and chapters can use its names.\n\n**Transition in:** `elaboration`: Larkfield, named as fiction and as never evidence. → What Larkfield is, in a few paragraphs.\n\n**Order of paragraphs** (`large_to_small`): The company, then its incidents and program, then the one payment. The payment is known from the opening; what this section adds to it (the fee, the studio's provider, the fixed figures) needs the company first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | description | Larkfield is a fictional Rotterdam rs it, and the right first chapter is not always the one the symptom suggests.\n\n**Advances the thesis** (S2): Turns the layout into routes, so a reader can use the book without reading it in order.\n\n**Transition in:** `contrast`: The parts as a learning path, and Larkfield as its example. → A second way in, for a reader who arrives with a decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | recommendation | If a decision or an incident is already on your desk, find its row, read the chapter in 'Start with' and follow 'Then'. | table: About ten rows (If you need to decide or repair… \\| Start with \\| Then), each mapped to chapters as written; includes: a job that charges customers timed out and you do not know who was charged → idempotency-and-retries, then payment-webhooks-and-events and payment-state-machines; books that do not match the provider's balance → payment-ledgers; whether to add a second provider → payment-routing-and-orchestration; who carries a seller's refund or chargeback → platform-payment-models; choosing between Stripe and Adyen → stripe-and-adyen-bets-compared. |  |\n| p28 | explanation | One row starts somewhere you might not expect: after a timeout the first chapter is idempotency and retries, not reliability, because the question is how to make a charge safe to send twice when the outcome is unknown, not how to keep the path up. | reasoning: payment-authorization and idempotency-and-retries as written: a timeout is an unknown outcome, not a decline; the same request under the same key, or a read of the provider's record. payment-reliability-and-availability concerns keeping the path up and the sweep after an outage. | `emphasis`: The routing table. → The one row whose starting point surprises, and why. |\n| p29 | recommendation (list) | Readers in different roles can take different routes through the parts, and the toolkit collects the working cards for the decision itself. | example: Four routes as a list: integrating one provider (Parts I, II chapter on state machines, IV, then journey-card-payment); running billing (Parts IV and VI, journey-failed-renewal); building a platform (Parts III and VII, journey-platform-payment); choosing or comparing providers (Part I, the 'Where They Differ' sections, Part X). The toolkit has sixteen cards, from the payment state card and the idempotency key card to the reconciliation card (journal spec, reference part). | `additional_support`: Routes by decision. → Routes by role, and the templates for the decision. |\n\n### What the Book Leaves to Others\n\n**Controlling idea** (`description`, id `left-out`): The book stops at the finance side of payments and at the merchant's order system, which sibling books cover, and it does not attempt a product guide, inferred internals or the issuer's side.\n\n**Advances the thesis** (S5): Draws the book's boundary so the reader knows where to go for what it does not cover.\n\n**Transition in:** `contrast`: Where the routing table leads. → Where it stops, and which book or source takes over.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | description (list) | Four subjects are left to sibling books and four things are not attempted at all. | example: Journal spec non-goals as a list: reconciliation, clearing accounts and posting to the ERP from the finance side (RECONCILED: payments-fundamentals, payments-to-ledger); payments as a merchant's order system sees them (ORDERED: commerce-payments); running a marketplace (LISTED: fraud-prevention, marketplace-regulation); how AI agents are built and kept within bounds (Architecting Agentic Systems: side-effects-and-external-actions). Not attempted: a product guide or integration tutorial for either provider; inferred internal topologies of any real company; issuer-side and network-side system design beyond what an acquirer-side builder needs; cryptocurrency trading, lending products and consumer banking apps. |  |\n\n### What the Book Draws On\n\n**Controlling idea** (`description`, id `basis`): The book rests on public, dated sources only, uses a domain model as a planning map and never as evidence, and is a living journal with a research cut-off of 17 November 2026.\n\n**Advances the thesis** (S5): States the material behind the book's statements and the date after which they were not checked.\n\n**Transition in:** `sequence`: What the book covers and what it leaves out. → What stands behind what it does say.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | description | The book uses public, dated sources (company documentation, engineering posts, letters, reports and legal pages, network rules, standards and laws), names secondary sources as such, and uses a domain model only as a planning map. | example: PLAN, provenance: primary sources preferred and secondary ones named as such; the Productscape model (reviewed 15 November 2026) is a model, not a description of any company, and domain-coverage maps its capabilities to chapters; the bibliography lists each source with its date and type. |  |\n| p32 | description | The book is a living journal with a research cut-off of 17 November 2026 and scenes set in 2027; it was developed through AI-mediated authoring, each page links the specification it was written against, and its content and errors are the author's responsibility. | fact: PLAN: research cut-off 17 November 2026; chapters set in 2027 (style guide). Every page has a 'View spec' link (build behaviour); the foundation record on AI-mediated authoring. | `additional_support`: The sources. → The date they were read up to, and how the book is made and revised. |\n\n## Conclusion: Where to Go Next\n\n**Synthesis:** The argument, the reading rules and the fictional platform are one discipline applied three times: to a payment (which promise is this, and which record proves it was kept), to a sentence about a provider (which source says so, and how old is it), and to an example (is this evidence or illustration). None of the sections says alone that the book asks of itself what it asks the reader to build.\n\n**So what:** A reader who takes this in stops treating the API response as the outcome and stops treating an engineering post, or this book, as a description of a provider's system today; both are promises to be checked against a later record.\n\n**Callback:** Mila's €120 class pass, successful at 19:42 on Tuesday 9 March 2027. The reader can now say what the success message was (her bank's promise), when the studio was paid (Thursday) and how long the payment stays open (until about 7 July).\n\n**Takeaway** (`course_of_action`): Carry three questions into every chapter: which promise is this, who made it, and which record proves it was kept; and check the year on every sentence about a provider before relying on it.\n\n**Hand-off** to [From Cash to Code: How Paying Got This Complicated](how-payments-got-complicated.html): `elaboration`: The introduction's claim that the answer a payment API returns is the first of several promises kept over days by parties that cannot see each other. → Where those promises and parties came from: the walk from cash to today's layers, one need and one concept at a time.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | synthesis | The argument, the evidence rules and the fictional platform apply one discipline three times, to a payment, to a sentence about a provider and to an example, so the book asks of itself what it asks you to build: do not record a promise as the truth. |  |  |\n| p34 | transition | Mila's success message was her bank's promise, the studio was paid on Thursday and the payment stays open until about 7 July; carry the three questions into every chapter, and turn next to the walk from cash to today's layers, which shows where those promises and parties came from. |  | `sequence`: The discipline. → The callback to Mila's payment, the three questions, and the next page (or, for a reader with a decision, the routing table). |\n\n## Non-goals\n\n- Teaching any mechanism: each concept gets a clause and a link. See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html), [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html), [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html).\n- Where the parties, records and delays behind a payment came from. See [From Cash to Code: How Paying Got This Complicated](how-payments-got-complicated.html).\n- The failure patterns themselves; the page gives only their names, families and one chain. See [Paid Twice, Paid Never: Sixteen Ways Payment Systems Go Wrong](where-payment-systems-go-wrong.html).\n- Larkfield in full: systems, cast, every incident and every Keel decision. See [Meet Larkfield](meet-larkfield.html).\n- Comparing Stripe and Adyen: the page states the journal thesis and a few verified facts and characterizes neither company with a slogan. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- A 'Stripe and Adyen: Where They Differ' section, a three-tier take-away or a failure-pattern callout of its own: the page explains these devices and does not carry them.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Resolved 17 November 2026: the journal-spec entry's sentences on data-center layout, failover and key storage were corrected and re-synced; the article agrees with them. One residue for the author: the entry's 'or at all (Stripe names no cloud region)' is stronger than chapter 39, which says Stripe names no AWS region but does name data centers in the United States and India for login and identity data. The article does not repeat it.\n- Stripe's support article on periodic re-verification (ruling 36) renders client-side and could not be re-read in this session, so the page's Stripe example of a corrected absence is the 2024 scheduler post (ruling 34) instead.\n- The patterns page and the journal spec say a failure 'started at one of the other twelve'; sixteen patterns less five money-truth patterns is eleven. This page now says eleven; the patterns page, its spec and the journal spec still say twelve.\n\n## Decision log\n\n- **2026-11-17** — Section order follows the entry's AC-5 and the journal opening's roadmap (audience, argument, organization, evidence, Larkfield, routes, sibling books), with a short patterns section after the argument because the entry's outcome asks for the sixteen names. Rejected: ORDERED's order with the running example before the organization.; Routes before Larkfield, as in the coordinator's list of sections: AC-5 expects Larkfield first.; Folding the pattern names into the argument section, where a sixteen-item list would bury the thesis.\n- **2026-11-17** — The journal thesis is stated in the journal spec's words, including its second half about Stripe and Adyen, followed at once by the two qualifications the verified case pages establish (Stripe's own entities acquire in the EEA; Adyen bought two products in 2026). Rejected: Stating only the first half and leaving the companies to Part X.; Summarizing the two companies in a phrase each.\n- **2026-11-17** — Statements of absence on this page are worded as the verified chapters word them: 'how its webhook sender is built', 'a design for its card vault', 'the topology and timing of a failover'. The entry's broader wording ('data-center or cloud-region layout') is not repeated. Rejected: Repeating the entry's wording, which ruling 45 makes too strong for Adyen.\n- **2026-11-17** — Opener is KEY POINTS only, as instructed for this page; no IN THIS SECTION callout, no failure-pattern callout, no 'Where They Differ' section, no three-tier take-away; two illustration placeholders; 2,500 to 3,500 words. Rejected: The chapter format of the style guide.\n- **2026-11-17** — The sample comparison rows are taken from idempotency-and-retries, because the retention windows are short, re-fetchable facts and one row has a 'Not public' cell. Rejected: An invented sample row.; A row from the reliability chapter, whose cells are long.\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md — The page contract, the positioning, the structure table and the provenance.\n  - _journals/payments-platform-architecture/journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged; the journal's opening, thesis, flow rationale and non-goals; Part X and reference entries; the next page's transition.\n  - _research/style-guide.md — The six kinds of statement, the evidence-age flag, the 'Where They Differ' rules, the three tiers, the pattern names, valid permalinks, the figure format.\n  - _research/scenario-ledger.md — Larkfield's figures, incidents, Keel and Mila's class pass.\n  - _research/consistency-issues.md — Rulings 11, 22, 24, 27, 30, 33, 34, 39, 42, 45: how the two companies' acquiring, absences and failover may be worded.\n  - posts/* as written (preface pages, part introductions, chapters 1 to 47, 49 and 50) — What the book actually argues, in its words and numbers; the verified wording of each Stripe and Adyen fact used here.\n  - _journals/commerce-platform-architecture/posts/introduction/index.md — The section pattern and tone.\n- **External**\n  - Adyen N.V., Annual Report 2025, signed 5 March 2026, https://investors.adyen.com/financials/2025 — Processed volume, net revenue, the 84% full-stack share, the stated strategic choice.\n  - Stripe annual letter 2025, 24 February 2026, https://stripe mber 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('or its data-center or cloud-region layout.' -> 'or where its systems run more finely than a continent or cou').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('or how one of its regions takes over from another.' -> 'or the topology and timing of a failover between its data ce').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('and how keys are stored today is not public.' -> 'and how Stripe stores keys today is not public (Adyen descri').\n- **2026-11-17** — Verification pass: 34 claims checked (27 confirmed, 4 corrected, 2 hedged, 0 unsupported and removed or relabeled, 0 unreachable; 1 absence taken from its owning chapter and not checked independently); most significant fix: the page said Stripe's API reference 'still' describes the 24-hour key removal, but the 2017 post gives no retention period, so the sentence now says the reference still describes the 2017 post's key and adds the 24 hours. Also: 'the other twelve' patterns corrected to eleven; the two sample rows restored to chapter 18's wording (API v2: 30 days; 503 with code 703); p11, p17, p20 and p21 evidence wording updated to match; no unit added, dropped or reordered.\n- **2026-11-17** — On the coordinator's instruction: the promises table now agrees with journey-of-a-payment and how-payments-got-complicated (five promises in turn by her bank, the studio, the acquirer, the network and the provider, then the dispute window as no promise; six rows, chapter 1's wording); p06 reworded to match, same unit. One sentence restored in p23: neither company reviewed the book. Paid for by trimming connective wording; 3,500 words.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('or where its systems run more finely than a continent or cou' -> 'or where its systems run more finely than a continent or cou').\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
