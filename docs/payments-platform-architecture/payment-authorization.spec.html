<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What the authorization message carries and the path it takes, at an introductory level, and what a hold, a response code and a validity window are.\n- **Know:** The variants: pre-authorization, incremental, partial and zero-value authorization, reversal, and stand-in processing.\n- **Know:** The difference between customer-initiated and merchant-initiated transactions and what the stored-credential rules require.\n- **Know:** How Stripe and Adyen each report a decline: a normalized reason, the raw network code and retry advice.\n- **Believe:** An approval is a perishable promise, not a payment, and a timeout is an unknown outcome, not a decline.\n- **Be able to:** Given an authorization and a planned capture date, say whether the promise will still be valid and where to read its expiry.\n- **Be able to:** Given a decline, decide whether a retry is allowed, from the network's retry advice and not from the provider's message alone.\n- **Be able to:** Given a request that timed out, state the steps to take before sending it again.\n\n**Audience:** A software engineer or architect who is new to payments and has read the previous chapter's six-step timeline; most of all the engineer who owns a retry loop, a renewal job or a payment-status column.\n\n**Already knows:**\n\n- APIs, HTTP timeouts, retries, idempotency keys as a general technique, webhooks, state machines.\n- The parties of a card payment and the six-step timeline (journey-of-a-payment).\n- Larkfield, the Double Charge in outline and Mila's class pass (meet-larkfield).\n\n**Does not yet know:**\n\n- Hold, response code, validity window, reversal, stand-in processing.\n- Estimated, incremental, partial and zero-value authorization.\n- Customer-initiated and merchant-initiated transaction, stored credential.\n- What ISO 8583 is and which fields of it surface in a provider's API.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a timeout on an authorization request the chapter does not contain, the reader says the outcome is unknown and names what to do before retrying. *Probe:* A ticket shop sends a €45 card payment to its provider and the connection drops after ten seconds with no response. The code path marks the order 'payment failed' and shows the customer a 'try again' button. What is wrong with that, and what should the shop do instead? | `custom` | cold_reader | major |\n| AC-2 | Given a decline with its codes, the reader says whether to retry and why. *Probe:* A monthly membership charge comes back declined with the card network's code for 'not sufficient funds'. A second one comes back with a code from the group the network labels 'issuer will never approve'. Which may the merchant try again, how do you know, and what does it cost to get it wrong? | `custom` | cold_reader | major |\n| AC-3 | Validity windows and retry limits are given with their source and date (the Visa rules edition, or the provider's documentation with its access date), Mastercard rules are attributed to the provider that reports them, and the 7-day versus 10-day difference is stated without an invented reason. | `custom` | rubric | blocker |\n| AC-4 | Every payments term the chapter introduces (hold, response code, validity window, estimated, incremental, partial and zero-value authorization, reversal, stand-in processing, customer-initiated, merchant-initiated, stored credential) is defined in one plain clause before it is relied on. | `known_before_new` | rubric | major |\n\n## Thesis\n\n**Question:** What exactly does an authorization promise, who decides, and what can change before the money moves?\n\n> **Claim:** An authorization promises one thing: that the issuer will honor a claim for up to the approved amount if the claim arrives inside a validity window, which Visa's rules set, in their general table, at 5 to 30 days depending on the kind of transaction. The issuer alone decides, and by Stripe's account issuers return most refusals as a generic code. Until the claim arrives the promise can expire, be reversed or be changed in amount, and after a timeout it can exist without the merchant knowing.\n\n**Disputed by:** The view that an approved authorization means the customer has paid, and that an error or a timeout means they have not, so the safe response to a missing answer is to send the request again.\n\n**So what:** The merchant must store when each approval expires, read it from the provider instead of computing it, keep the provider's reason, the raw network code and the network's retry advice as three separate facts, and resolve every timeout by looking the payment up before any retry; the Double Charge at Larkfield is what the other reading costs.\n\n**How and why:** The authorization is a message, not a transfer: the issuer reserves the amount on the cardholder's account and nothing moves. If the response is lost on the way back, the reservation still stands and the merchant does not know it. Visa's rules (edition of 24 October 2026) fix how long the acquirer has to present the transaction and sort declines into categories with retry limits, and Stripe's documentation says issuers return most declines as generic. The two providers document the same promise differently (both n.d., accessed November 2026): Stripe gives a 7-day window for a customer-initiated online Visa payment where Visa's rule and Adyen's page say 10, and gives no reason; Stripe says it and the network classify a payment as customer- or merchant-initiated from signals, while Adyen's pages take the merchant's declared fields; Adyen documents canceling by the merchant's own reference within 24 hours, which fits the case where no provider reference came back. Neither says whether an approval came from the issuer or from the network standing in for it, and the public record stops there.\n\n**Supporting claims**\n\n- **S1** — An authorization is a message exchange that ends in the issuer reserving an amount; it promises that a claim up to that amount will be honored if it arrives in time, and it moves no money.\n- **S2** — The issuer alone decides, most refusals arrive as a generic code, and a refusal is three separate facts (the provider's reason, the raw network code, the network's retry advice) of which the third governs a retry.\n- **S3** — The promise expires after 5 to 30 days under Visa's rules, the two providers document different windows for the same payment, and the expiry must therefore be read and stored, not computed.\n- **S4** — Before the claim arrives the promise can be resized or withdrawn (estimate, increment, partial approval, reversal), and the rules that apply depend on whether the customer or the merchant initiated the request.\n- **S5** — A request that gets no answer has an unknown outcome: the promise may exist, and it must be resolved against the provider's record or by the merchant's own reference before any new request is sent.\n- **S6** — Stripe and Adyen document the same promise differently in the window, the classification, the timeout procedure and the raw code, and neither says whether an approval came from the issuer or from the network standing in.\n\n## Role in the part\n\nShows that the first and most visible step moves no money and can lapse, which is the strongest single piece of evidence that the instant answer is a promise. Supports P1-2 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in the five sections from what-an-authorization-is to who-is-asking, taken as whole sections: each supplies terms the next one uses (inside, validity-windows runs large to small and ways-to-ask is a grouping); `comparison` in where-they-differ; `grouping` in in-practice: one payment per outcome)\n\nThe reader meets a duplicate charge caused by a missing answer before any term is defined, so the definitions arrive as answers to three questions the scene poses: what was promised, who decided, what can change. The body takes them in that order. What an authorization is must precede the issuer's decision, because a code is a field of the message; the decision must precede the expiry, because only an approval expires; the variants need the expiry (an increment does not extend it); customer- and merchant-initiated come after the variants because the zero-value check and the validity table both use the label and the reader needs those two uses to see why it matters. The unknown outcome comes after all of them because resolving it means knowing what may exist at the issuer: a hold, with an amount and an expiry. The provider comparison follows the last section that supplies one of its rows, and the Larkfield payments come last because they apply every section and close the opening scene. Moving the timeout section forward would give the reader a procedure before the thing it protects; moving the comparison forward would fill a table with terms not yet defined.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On 1 November 2026 Larkfield's renewal job sends a membership charge to its payment provider and waits. No answer comes. It sends the charge again, and 1,840 members pay twice: €71,300 to refund and 212 disputes. Nothing was down, and no request had been refused.\n\n**Bridge:** Every engineer has written the loop that retries a call when it times out, and for most calls that loop is correct. → For a payment it is correct only if a missing answer means nothing happened, and it does not: the cardholder's bank may already have said yes. What that yes is, and what it is worth, is the subject of the chapter.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): An authorization is the issuer's promise to honor a claim for up to an approved amount inside a limited window. It moves no money, the issuer alone decides, and before the claim arrives the promise can expire, be resized or be withdrawn; after a timeout it can exist without you knowing.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the timeout behind Larkfield's Double Charge. *Kept in:* scene.\n- Explain what an authorization is: the message, its path, the hold and the promise. *Kept in:* what-an-authorization-is.\n- Show how the issuer decides and how a refusal and its retry rules reach the merchant. *Kept in:* issuer-decides.\n- Say how long an approval lasts and where to read its expiry. *Kept in:* validity-windows.\n- Set out the ways to ask for an approval and to give it back. *Kept in:* ways-to-ask.\n- Distinguish customer-initiated from merchant-initiated requests and the stored-credential rules. *Kept in:* who-is-asking.\n- Say what to do when no answer comes back. *Kept in:* no-answer.\n- Compare Stripe and Adyen and replay three Larkfield payments. *Kept in:* where-they-differ, in-practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A renewal job that read a missing answer as a refusal charged 1,840 members twice, because each first request had been approved without Larkfield knowing. | scenario: Larkfield (fictional), 1 November 2026: a provider call timed out during the first-of-month renewals, the job retried with a new idempotency key, 1,840 members were charged twice, €71,300 was refunded and 212 disputes followed (scenario ledger, the Double Charge). |  |\n| p02 | claim | An authorization is the issuer's promise to honor a claim for up to an approved amount inside a limited window; it moves no money, it can lapse, shrink or be withdrawn before the claim arrives, and after a timeout it can exist without the merchant knowing. |  | `cause_effect`: The duplicate charges and the missing answer behind them. → What the first request had actually obtained: a promise, with the three ways it can change. |\n| p03 | context | On the journey of Mila's €120.00 class pass this chapter covers 19:42 on Tuesday 9 March 2027, the first of six steps and the only one she sees. | scenario: Mila's class pass (scenario ledger): €120.00, Dutch Visa debit card in a phone wallet, Studio Noord on Adyen, approved at 19:42, captured automatically, paid out Thursday 11 March. | `place`: The promise the chapter is about. → Its position on the recurring payment's journey. |\n| p04 | transition | The chapter starts with the timeout at Larkfield, explains what an authorization is, how the issuer decides and reports a refusal, how long an approval lasts, the ways to ask for one, who is asking, and what to do when no answer comes back, then compares Stripe and Adyen and replays three Larkfield payments. |  | `sequence`: The chapter's place on the journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: A Timeout on the First of the Month\n\n**Controlling idea** (`example`, id `scene`): The Double Charge came from a model of the outcome with two values, approved and not approved, in which a timeout was filed under the second.\n\n**Advances the thesis** (S5): Shows the cost of reading a missing answer as a refusal, which the unknown-outcome section later resolves.\n\n**Transition in:** `example`: The introduction's claim that an approval can exist without the merchant knowing. → The incident in which that happened 1,840 times.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | On 1 November 2026 a provider call timed out during Larkfield's renewals and the job sent each waiting charge again under a new key. | scenario: Ledger: 38% of monthly membership volume is attempted in a 6-hour window on the 1st; on 1 November 2026 the renewal job retried with a new idempotency key; 1,840 members charged twice; €71,300 refunded; 212 disputes anyway. |  |\n| p06 | cause_effect | The job had two outcomes in its code, approved and not approved, and it filed the timeout under the second although the issuers had already approved and reserved the money. | reasoning: A timeout says the reply did not arrive; it says nothing about whether the request did. A new key made the retry a new request, so the provider could not recognize it as a repeat. Femke de Graaf's three questions in January 2027: what did the first request promise, who decided, what could still change. | `cause_effect`: The retry under a new key. → Why the code retried: its model had no third outcome. |\n\n### What an Authorization Is: A Message, a Decision and a Hold\n\n**Controlling idea** (`definition`, id `what-an-authorization-is`): An authorization is a question carried to the issuer and an answer carried back; an approval reserves an amount on the cardholder's account and promises to honor a later claim, and nothing else.\n\n**Advances the thesis** (S1): Defines the promise and separates it from the movement of money.\n\n**Transition in:** `elaboration`: Femke's first question: what did the first request promise? → The definition of an authorization and its parts.\n\n**Order of paragraphs** (`prerequisite_order`): The definition comes first, then the path the message takes, then the message itself, then what the approval does at the issuer (the hold), and only then what the approval does and does not promise, which needs all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | An authorization is the process in which the issuer, or a party acting for it, approves or declines a transaction before any money moves. | quotation: Visa glossary: Authorization is \"A process where an Issuer, a VisaNet Processor, Visa Scheme Processor, or Stand-In Processing approves a Transaction.\" |  |\n| p08 | process | The request for Mila's pass travels from the app through Larkfield's payment service, the provider and the card network to her bank, and the answer returns the same way in a few seconds. | quotation: Visa's annual report for fiscal 2026 (filed 5 November 2026): \"Through VisaNet, the acquirer presents the transaction data to Visa, which in turn sends the transaction data to the issuer to check the account holder's account balance or credit line for authorization.\"; figure: Figure: the request and the response between member app, platform, provider, card network and issuer, with the hold at the issuer.; table: Requirements table for the exchange: speed (seconds; an assumption labeled as industry practice), availability (the network can answer for an unavailable or slow issuer: Visa's Stand-In Processing definition), consistency (the issuer's record is the truth, every other party holds a copy of the answer), failure (a lost reply leaves the outcome unknown). | `elaboration`: The parties named in the definition. → The route the question and the answer take between them. |\n| p09 | description | The question travels as an ISO 8583 message, a compact format of a type indicator, a bitmap and numbered data elements, which the provider builds and the merchant never sees. | quotation: Stripe's explainer (updated 18 September 2026): ISO 8583 \"defines the structure of messages between acquirers and card issuers during a transaction\"; \"Each message is built from an MTI, a bitmap, and data elements\"; \"The ISO 8583 standard isn’t self-describing\"; \"ISO 8583 still dominates card authorisation, even as ISO 20022 gains adoption on other payment systems\"; \"Businesses that use a payments provider such as Stripe don’t have to build or manage these messages themselves.\"; fact: The field an integrator meets most is the response code, for example Visa's \"51 (Not sufficient funds)\"; the standard itself is paid and was not read, so no field numbers are given. | `elaboration`: The path of the request. → The format of what travels on it. |\n| p10 | definition | An approval makes the issuer place a hold: it lowers the cardholder's available balance by the approved amount without debiting the account. | quotation: Stripe documentation (n.d., accessed November 2026): \"Authorizing a payment guarantees the amount by holding it on the customer’s payment method.\" Adyen documentation (n.d., accessed November 2026): a pre-authorization \"verifies that the shopper's account is valid and has sufficient funds to cover a transaction, but does not debit the account.\" Stripe: \"Card statements from some issuers and interfaces from payment methods don’t always distinguish between authorizations and captured (settled) payments, which can sometimes confuse customers.\" | `cause_effect`: The approval carried back in the response. → What the approval changes at the issuer. |\n| p11 | analysis | The approval promises that a claim for up to the approved amount (the capture, in the next chapter's term) will be honored if it arrives in time, and it does not promise that money has moved, that the merchant will be paid or that the cardholder will not take it back. | table: What it promises / What it does not promise: honors a claim up to the amount inside the validity window; not a transfer (clearing and settlement, next chapter), not a payout, not protection from a dispute (about 120 days), not indefinite.; reasoning: Visa's rules call the answer an Approval Response and give the acquirer a maximum timeframe to process the completed transaction after it (section 5.7.3.5). | `conclusion_summary`: The message, the decision and the hold. → What they add up to: one promise, and four things it is not. |\n\n### The Issuer Decides, and Mostly Does Not Say Why\n\n**Controlling idea** (`explanation`, id `issuer-decides`): The approval comes from the issuer's side of the network, never from the provider; its refusal arrives as a code that is usually generic, and the networks attach retry rules to the code that the provider's own message does not replace.\n\n**Advances the thesis** (S2): Establishes who decides and why a decline must be stored as three separate facts.\n\n**Transition in:** `elaboration`: Femke's second question: who decided? → The issuer's decision and the form in which a refusal reaches the merchant.\n\n**Order of paragraphs** (`prerequisite_order`): Who decides comes first, then the code the decision arrives as, then the retry rules the networks attach to that code, then the shorthand practitioners use for those rules, then how each provider passes all of it on, and last the cost of ignoring it; the provider comparison would be a list of field names without the network rules before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | The yes comes from the issuer's side of the network; a provider can refuse a payment before asking, but it cannot approve one. | quotation: Stripe documentation (n.d., accessed November 2026): \"When Stripe blocks a payment, it doesn’t obtain authorization from the card issuer.\" (outcome `network_status: not_sent_to_network`). Adyen refusal reason 20, FRAUD: \"The pre-authorization risk checks resulted in a fraud score of 100 or more.\" |  |\n| p13 | definition | A response code is the short code the issuer returns with its answer, and by both providers' accounts the most common refusal code is a generic one. | quotation: Visa rule 7.3.6.3: an issuer \"must send to VisaNet the Decline Response code that most accurately reflects the reason for the decline\". Stripe (n.d., accessed November 2026): \"Card issuers categorize most declines as generic (generic_decline), making the exact decline reason unclear.\" Adyen (n.d., accessed November 2026): \"The most frequent refusal reason, 05: Do not honor, falls into this category.\" | `elaboration`: The issuer's decision. → The code it arrives as, and how little that code usually says. |\n| p14 | explanation | The networks attach retry rules to the code: Visa sorts decline codes into four categories with reattempt limits, and Mastercard returns a separate advice code. | table: Visa Table 7-2 (24 October 2026): Category 1 'Issuer will never approve' (04, 07, 12, 14, 15, 41, 43, 46, 57, R0, R1, R3): \"a Merchant must never resubmit\"; Category 2 'Issuer cannot approve at this time' (includes 51 Not sufficient funds, 91 Issuer or switch inoperative): \"Reattempt permitted (up to 20 attempts in 30 days)\"; Category 3 'Data quality' (54, N7, 1A in Europe): same limit; Category 4 generic codes: same limit.; fact: Adyen's page on Visa's categories (n.d., accessed November 2026) still says \"up to 15 times in a 30-day period\" where Visa's Table 7-2 says up to 20 attempts in 30 days (consistency ruling 19); the paragraph states Visa's limit before the discrepancy; Mastercard's Merchant Advice Code as Adyen documents it (n.d., accessed November 2026): 03 Do not try again, 24 Retry after 1 hour to 30 Retry after 10 days; \"Not all Mastercard issuers return the MAC.\" | `additional_support`: The code returned with a refusal. → The retry rule each network ties to it. |\n| p15 | definition | 'Soft decline' and 'hard decline' are industry shorthand for 'may be retried' and 'must not be retried', not terms in the networks' rules. | fact: The nearest official vocabulary: Visa's Category 1 against Categories 2 to 4, Mastercard's advice code, and the authentication-required refusal (Visa code 1A in Europe; Stripe `authentication_required`; Adyen reason 38, \"Authentication required\"). | `similarity`: The networks' categories and advice codes. → The informal words practitioners use for them. |\n| p16 | comparison | Each provider hands the merchant a refusal as three separate facts: its own normalized reason, the network's raw code and the network's retry advice. | table: Stripe: `decline_code` (for example `insufficient_funds`), `network_decline_code`, `network_advice_code` and Stripe's own `advice_code` (`do_not_try_again`, `try_again_later`, `confirm_card_data`). Adyen: `refusalReason` with `refusalReasonCode` (12 Not enough balance, 27 Declined Non Generic), `refusalReasonRaw` (must be enabled in the Customer Area), `additionalData.merchantAdviceCode` for Mastercard.; example: Stripe's next step for `insufficient_funds` reads \"The customer needs to use an alternative payment method\", advice for a checkout with the customer present; Visa puts code 51 in Category 2, where a reattempt is permitted. | `sequence`: What the networks return. → How each provider passes it to the merchant. |\n| p17 | cause_effect | A retry against the network's advice costs money and approvals: the network charges fees, the provider may block the attempt, and issuers read repeated attempts as a sign of fraud. | quotation: Adyen (n.d., accessed November 2026): \"Visa charges system integrity fees. These fees are related to excessive retries of failed transactions, and excessive numbers of transactions that failed due to incorrect payment details.\" Adyen refusal reason 46: \"Transaction blocked by Adyen to prevent excessive retry fees\". Stripe: \"Excessive retry prevention: Stripe blocks a payment that would have incurred network retry penalties and likely failed\"; \"Stripe recommends a maximum of eight retries for charges that permit retries. Card issuers might see creating additional retries as potential fraud\". | `cause_effect`: The retry advice each provider passes on. → What happens to a merchant that ignores it. |\n\n### A Promise with an Expiry Date: Validity Windows\n\n**Controlling idea** (`explanation`, id `validity-windows`): An approval is valid for 5 to 30 days under Visa's rules depending on the kind of transaction, the two providers document different windows for the same payment, and the expiry is therefore a fact to read and store.\n\n**Advances the thesis** (S3): Shows that the promise is perishable and that its lifetime is not the same number on both providers.\n\n**Transition in:** `contrast`: The refusal and its retry rules. → The other branch: an approval, and the first thing that can change it, which is time.\n\n**Order of paragraphs** (`large_to_small`): The network's rule first, then what each provider documents against it, then where to read the expiry for one payment, then what happens when it passes; the recommendation to read the expiry needs the disagreement between the documents before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Visa's rules give an approval a maximum life of 5, 10 or 30 calendar days, set by whether the cardholder took part in the payment or the merchant charged a stored card alone, and by where the card was used. | table: Visa Table 5-11 (24 October 2026): cardholder-initiated, card-absent: 10 calendar days (30 with an extended Authorization indicator); estimated authorization at cruise, lodging and vehicle rental merchants: 30; card-present: 5; all merchant-initiated transactions: 5. \"Timeframe starts on the date of a valid Authorization.\"; reasoning: A one-sentence gloss of the two labels at the table's first use: cardholder-initiated (the providers say customer-initiated) when the cardholder takes part, as at a checkout; merchant-initiated when the merchant charges a stored card alone, as in a renewal; with a pointer saying why the full rules come two sections below. |  |\n| p19 | comparison | The two providers document different windows for the same Visa payment: Stripe gives 7 days for a customer-initiated online payment where Visa's rule and Adyen's page give 10, and Stripe's page gives no reason. | table: Stripe (n.d., accessed November 2026): Visa card-not-present 7 days customer-initiated, 5 days merchant-initiated with the note \"The exact authorization window is 4 days and 18 hours, to allow time for clearing processes\"; Mastercard 7 days. Adyen (n.d., accessed November 2026): Visa cardholder-initiated card-not-present 10 days, merchant-initiated 5 days, Mastercard final authorization 7 days and pre-authorization 30 days; \"Adyen expires (pre-)authorization requests automatically after 28 days\". | `contrast`: The network's maximum. → What each provider tells its merchants. |\n| p20 | recommendation | Read the expiry of each approval from the provider and store it with the order; do not compute it from a table. | quotation: Stripe (n.d., accessed November 2026): `payment_method_details.card.capture_before` \"is the most reliable and accurate way to determine your charge’s authorization window\"; \"Stripe and the card network classify transactions as MIT or CIT based on signals of cardholder participation, not solely on API parameters like off_session.\"; fact: Adyen's pages read for this chapter document no equivalent field: the window follows from its per-scheme table and the fields the merchant declared, the 28-day ceiling applies on top, and an EXPIRE webhook reports the expiry on Adyen's platform. | `cause_effect`: Two documents that disagree about one payment. → The consequence for the integrator: read the expiry, store it. |\n| p21 | cause_effect | When the window passes, the promise is gone: on Stripe the payment is canceled, and on Adyen a late capture is possible at the merchant's risk. | quotation: Stripe: \"If the authorization expires before you capture the funds, the funds are released and the payment status changes to `canceled`.\" Adyen: capturing after expiry on the scheme's side \"increases the risk of\" a failed capture, \"Increased interchange fees\", \"Card scheme transaction fees\" and \"A cardholder-initiated chargeback for 'No Authorization' or 'Late Presentment' reasons\". Visa Dispute Condition 11.3: No Authorization/Late Presentment. | `time`: The stored expiry. → What happens on the day after it. |\n\n### Asking for the Promise: Five Variants and When Each Fits\n\n**Controlling idea** (`comparison`, id `ways-to-ask`): There are five ways to ask for the promise (the exact amount, which is the default, an estimate, an increment, a partial approval and a zero-value check) and one way to give it back (a reversal), and the choice among them is a design decision with a table of trade-offs.\n\n**Advances the thesis** (S4): Shows that the amount and the existence of the promise can change before the claim arrives.\n\n**Transition in:** `additional_support`: Time as the first thing that changes an approval. → The second: the merchant's own choices about the amount, and the option to give the promise back.\n\n**Order of paragraphs** (`grouping`): The default and the variants that change the amount come first (estimate, increment, partial), then the one that asks for no amount, then the reversal, which withdraws the promise; the trade-off table and the recommendation come last because they compare the five ways of asking and say when each leaves a reversal owed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | An estimated authorization, which Adyen calls a pre-authorization, reserves an amount the merchant expects before the final amount is known; the default on both providers is a final authorization for the exact amount. | quotation: Visa glossary: an Estimated Authorization Request is \"for the amount that a Merchant expects a Cardholder to spend in an individual Transaction and that is submitted before the final Transaction amount is known\". Adyen: \"By default, Adyen handles all card payment requests as final authorizations\"; `additionalData.authorisationType`: PreAuth or FinalAuth. |  |\n| p23 | definition | An incremental authorization raises an approved estimate, and it does not extend the approval's life. | quotation: Visa: \"An Incremental Authorization Request does not extend the processing timeframes\". Stripe: \"a maximum of 10 incremental authorization attempts per PaymentIntent\", offered \"to users on IC+ pricing\". Adyen: authorization adjustment, with eligibility by merchant category code and an asynchronous or synchronous mode. | `sequence`: The estimate. → Raising it. |\n| p24 | definition | A partial authorization approves less than was asked, so the approved amount must be read from the response and never assumed to equal the request. | quotation: Visa glossary: \"An approval response for an amount less than the amount requested by a Merchant for a Transaction.\" Stripe: `request_partial_authorization: if_available`, with `amount_requested` and `amount_authorized` on the charge. Adyen: `additionalData.allowPartialAuth`, result code PartiallyAuthorised, Visa and Mastercard only, not available in the Sessions flow. | `contrast`: Raising the amount on the merchant's initiative. → The issuer lowering it. |\n| p25 | definition | A zero-value authorization, which Visa calls an account verification, asks whether the card can be used without reserving anything, and Visa requires it or a real authorization before a card is stored. | quotation: Visa glossary: Account Verification is \"A message sent by an Acquirer to the Issuer, using a currency unit of zero, for confirmation that a Transaction can be completed using the Card.\" Visa Table 5-21: before storing, a merchant must submit an Authorization Request for the amount or, \"If payment is not required, submit an Account Verification\". Adyen: \"We recommend that you store payment details by making a zero-auth transaction\". Stripe saves a card with a SetupIntent; its documentation page does not say what is sent, and a Stripe support article says Stripe may send a $0, $1 or similar authorization when card details are stored. | `contrast`: Requests that reserve an amount. → A request that reserves none. |\n| p26 | definition | A reversal is the message that cancels an approval and releases the hold, and Visa requires one within 24 hours when a sale is not completed. | quotation: Visa glossary: an Authorization Reversal is \"A V.I.P. System message that cancels an Approval Response.\" Visa Table 5-13: within 24 hours for an approval whose transaction is not completed, and for the difference when the final amount is lower. Stripe: canceling a PaymentIntent \"releases any held funds\"; Stripe uses 'reversal' for a refund issued shortly after the charge. Adyen: cancel before capture; its reversal endpoint cancels an uncaptured payment and refunds a captured one. | `contrast`: The ways to obtain or resize the promise. → The way to give it back. |\n| p27 | recommendation | Ask for the exact amount and capture at once unless the sale forces otherwise; each other variant buys flexibility with an expiry to track, a field to read or a reversal to send. | table: Trade-off table: exact amount with immediate capture (nothing to track; Larkfield's passes and renewals); exact amount, capture on fulfillment (expiry to store, reversal owed if the order is canceled); estimate plus increments (unknown final amount; clock runs from the first approval; reversal for the difference); partial approval (prepaid and debit balances; second payment for the remainder); zero-value check (store a card now, charge later as merchant-initiated). The author's judgement, with the condition under which each row is right.; figure: Figure: the life of an approval as states: requested, approved, then captured, adjusted, reversed or expired; declined; and unknown. | `conclusion_summary`: Five variants. → When each fits, and the author's default. |\n\n### Who Is Asking: Customer-Initiated, Merchant-Initiated and Stored Credentials\n\n**Controlling idea** (`explanation`, id `who-is-asking`): Whether the customer is taking part in the payment or the merchant is charging a stored card under an agreement changes the validity window and the rules, and Stripe and Adyen settle that classification in different places.\n\n**Advances the thesis** (S4): Shows that the same card and amount yield a different promise depending on who initiated the request.\n\n**Transition in:** `elaboration`: The question of who started the payment, answered so far only in a clause where the validity table first uses the two labels (p18), and met again in the zero-value check. → The full definitions, now that both uses are in view, and the stored-credential rules behind them.\n\n**Order of paragraphs** (`prerequisite_order`): The two labels are defined first, then the network's rules for storing and using a card, then both labels on Mila's two payments, and last who assigns the label on each provider, which only matters once the reader knows what hangs on it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | definition | A customer-initiated transaction is one the cardholder takes part in; a merchant-initiated transaction is one the merchant starts alone, under a prior agreement, with a card it has stored. | quotation: Stripe (n.d., accessed November 2026): \"An MIT is a transaction that you initiate without direct participation of your customer, based on a prior agreement with that customer authorizing you to store and use their credentials.\" |  |\n| p29 | explanation | Visa's stored-credential rules say what must happen before a card is stored, how a later charge must be marked and what the merchant owes the cardholder when a merchant-initiated charge is declined. | quotation: Visa glossary and Table 5-21 (24 October 2026): a Stored Credential is information \"stored by ... A Merchant or its agent, a Payment Facilitator, or a Digital Wallet Operator to process future Transactions\"; \"If the initial Authorization Request or Account Verification is not approved, the Merchant must not store the credential\"; a transaction with a stored credential must \"Use POS Entry Mode code 10\"; on a declined merchant-initiated request \"the Merchant must notify the Cardholder in writing and allow the Cardholder at least 7 calendar days to pay by other means.\" Mastercard's equivalent rules were not readable directly. | `elaboration`: The prior agreement in the definition. → What the network requires around it. |\n| p30 | example | Mila's two payments at Studio Noord carry the two labels: the pass on 9 March is customer-initiated, and each membership renewal is merchant-initiated under the agreement she made on 12 January. | scenario: Ledger: membership of €49.00 set up on 12 January 2027 by typing in the card and passing a 3-D Secure challenge (the customer-initiated first payment), renewed on the 1st of each month as a merchant-initiated card payment; the €120.00 pass on 9 March paid from a phone wallet with device authentication. | `example`: The rules for storing and reusing a card. → The same card used both ways by one member. |\n| p31 | comparison | The label is assigned in different places: Stripe says it and the network classify from signals, while Adyen's pages take the fields the merchant declares. | quotation: Stripe: \"a payment with `off_session: true` might still be classified as a CIT if a CVC is present, resulting in the CIT authorization window instead.\" Adyen: `shopperInteraction` (Ecommerce, ContAuth) with `recurringProcessingModel` (CardOnFile, Subscription, UnscheduledCardOnFile); its validity table applies the merchant-initiated row to \"ContAuth + Subscription / UnscheduledCardOnFile\". Nothing on the Adyen pages read says Adyen reclassifies. | `contrast`: The labels on Mila's payments. → Who puts them there on each provider. |\n\n### When No Answer Comes Back: Unknown Outcomes and Stand-In Processing\n\n**Controlling idea** (`process`, id `no-answer`): A request has three outcomes, approved, declined and unknown; the unknown one is resolved by asking again with the same key or by looking the payment up or canceling it by the merchant's own reference, and even an approval may have come from the network standing in for the issuer.\n\n**Advances the thesis** (S5): Establishes that a timeout is an unknown outcome and gives the documented way out on each provider.\n\n**Transition in:** `contrast`: Everything so far assumed that an answer arrived. → The case in which none does, which is Femke's third question and the Double Charge.\n\n**Order of paragraphs** (`problem_solution`): The third outcome is stated first, then its resolution on Stripe and on Adyen, then the related case in which an answer arrives but not from the issuer, and last the questions the public record leaves open; the resolutions would read as API trivia without the problem stated before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | claim | A request has three outcomes, not two: the reply can be lost after the issuer has approved, and then the hold exists while the merchant holds no answer. | quotation: Stripe (n.d., accessed November 2026): \"When a connection fails, you might not know whether Stripe received or executed the request.\"; \"Treat the outcome of a request that returns `500` as indeterminate: the operation might have produced side effects even though you received an error.\"; figure: Figure: three envelopes returning from the bank: 'yes', 'no', and one lost on the way back while the hold stays in place. |  |\n| p33 | process | On Stripe the way out is to repeat the request with the same idempotency key within 24 hours, and otherwise to retrieve the payment object before doing anything else. | quotation: Stripe: \"Retry with the same idempotency key and parameters within the first 24 hours after the original request.\"; \"Don’t retry with a new idempotency key until you’ve resolved the original outcome. Retrieve the relevant object, inspect the request in the Dashboard, and use webhook events to reconcile what happened.\"; keys are retained \"for at least 24 hours\". | `problem_solution`: The unknown outcome. → Its resolution on Stripe. |\n| p34 | process | On Adyen there is no payment to fetch, so the way out is the same key, the webhook, or a cancel by the merchant's own reference within 24 hours. | quotation: Adyen (n.d., accessed November 2026): \"If you do not receive a response (for example, in case of a timeout), you can safely retry the request with the same HTTP header\"; \"Idempotency keys are valid for a period of 7 to 14 days after first submission.\"; \"Canceling a payment using your reference is possible up to 24 hours after authorization\", recommended only \"if you generate a unique references for each payment request and do not have the `pspReference` available\"; a reversal for \"If you are not sure if a payment has been captured\". Checkout API v72 specification: three GET operations, none returning a payment by its reference. | `contrast`: A provider whose payment can be retrieved. → A provider whose payment cannot. |\n| p35 | explanation | Stand-in processing means an answer can come from the network on the issuer's behalf, so even an approval is not always the issuer's own decision. | quotation: Visa glossary: Stand-In Processing is \"The component ... that provides Authorization services on behalf of an Issuer when the Issuer, its VisaNet Processor, or a Visa Scheme Processor is unavailable, when Issuer responses exceed the maximum response time, or when the Issuer has instructed Visa to process a Transaction on behalf of the Issuer.\" Stripe's table of Visa codes: 91 is \"Issuer or switch inoperative and STIP not applicable or not available for this transaction; time-out when no stand-in\". Without stand-in the merchant sees Stripe `issuer_not_available` or Adyen reason 9, Issuer Unavailable. | `similarity`: A missing answer between the merchant and the provider. → A missing answer between the network and the issuer, and what the network does about it. |\n| p36 | analysis | The public record stops at four points: neither provider says whether an approval came from stand-in, what it does when its own call to the network times out online (Adyen documents a 120- or 150-second cancellation for terminals), or how it turns an API call into a network message, and Mastercard's stand-in rules were not readable. | fact: Searched and not found on the Stripe and Adyen pages read for this chapter (all n.d., accessed November 2026); Mastercard's rule documents returned HTTP 403. | `conclusion_summary`: What the networks and providers document about missing answers. → What they do not. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The two providers document the same promise differently in five places: the Visa window, where the expiry is read, who classifies the transaction, how a timeout is resolved and how the raw decline reaches the merchant.\n\n**Advances the thesis** (S6): Sets the documented differences side by side and separates them from the author's reading.\n\n**Transition in:** `conclusion_summary`: The provider facts given section by section. → The same facts in one table, with the author's reading of each difference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | comparison | On five aspects of the authorization the two companies' documentation differs, and on a sixth, stand-in, both are silent. | table: Rows: Visa customer-initiated online window (Stripe 7 days; Adyen 10 days); where the expiry is read (Stripe `capture_before` on the charge; Adyen per-scheme table, 28-day platform expiry, EXPIRE webhook); who classifies customer- or merchant-initiated (Stripe and the network from signals; Adyen from the merchant's declared fields); resolving a timeout (Stripe: same key for at least 24 hours, retrieve the object; Adyen: same key for 7 to 14 days, no payment GET, cancel by own reference within 24 hours); raw network code (Stripe `network_decline_code` on the charge outcome; Adyen `refusalReasonRaw` once enabled); stand-in approval flagged (Not public; Not public). Last column: the author's reading, introduced as inference. |  |\n| p38 | recommendation | On Stripe, read what the provider decided (the expiry, the classification) from the object; on Adyen, declare the classification yourself, keep your own unique reference for every request and switch on the raw response. | reasoning: Follows from the rows: Stripe returns the derived facts on a retrievable object; Adyen takes declarations and reports by webhook, with the merchant reference as the only handle when no PSP reference came back. | `cause_effect`: The differences in the table. → What an integrator does differently on each provider. |\n\n### In Practice at Larkfield: One Approval, One Decline and One Silence\n\n**Controlling idea** (`example`, id `in-practice`): Three Larkfield payments show the three outcomes handled correctly: Mila's pass approved at 19:42, her renewal declined on 1 April and retried on 4 April, and the timeout of the Double Charge replayed under Keel.\n\n**Advances the thesis** (S1, S2, S3, S5): Applies the promise, the decline's three facts, the expiry and the unknown outcome to ledger payments on both providers.\n\n**Transition in:** `example`: The differences between the two providers. → Three ledger payments worked through with them.\n\n**Order of paragraphs** (`grouping`): One payment per outcome, in the order the chapter introduced them: the approval and its expiry, the refusal and its retry, and the silence last because it resolves the opening scene.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | example | At 19:42 on 9 March 2027 Mila's bank approves €120.00 and reserves it; Larkfield holds a promise and a reference, and no money has moved. | scenario: Ledger: Studio Noord on Adyen; Dutch Visa debit card in a phone wallet, device authentication, no 3-D Secure challenge; captured automatically; payout Thursday 11 March.; table: What exists at 19:42 and who holds it: the decision (issuer), the hold of €120.00 (issuer, on Mila's account), the result code Authorised and the PSP reference (Adyen's response), the AUTHORISATION webhook (Larkfield's receiver), money moved: none. Adyen: \"we recommend that you rely on the webhook to trigger any business logic\". |  |\n| p40 | example | Had the pass been authorized for later capture, the promise would lapse on a different day on each provider: about 16 March on Stripe's documented 7 days, 19 March on the 10 days of Visa's rule and Adyen's table. | scenario: \"Had Studio Noord been on Stripe\" (the ledger's convention): 9 March plus 7 days and plus 10 days; an illustration, since Larkfield captures automatically. | `contrast`: The pass as it happened, captured at once. → The same pass under delayed capture, where the expiry would matter. |\n| p41 | example | Mila's renewal of €49.00 is declined on 1 April 2027 for insufficient funds, stored as three facts, and retried on 4 April because the network's category permits it. | scenario: Ledger: renewal declined on 1 April 2027 (insufficient funds), retried on 4 April and approved; K5: retries on a schedule tied to decline codes; K1: the key includes the number of the scheduled attempt. Chapter facts: Adyen reason 12 Not enough balance; Visa code 51, Category 2, up to 20 attempts in 30 days; the 7-calendar-day notice rule for a declined merchant-initiated request. | `contrast`: An approval. → A refusal, and the decision whether to ask again. |\n| p42 | example | Under Keel the timeout of 1 November 2026 becomes a payment in the state `pending`: the same key is sent again, the provider's record is consulted, and a new request is made only when the first is known to have failed. | scenario: Ledger: K1 (one writer, one key derived from the business event), K2 (the provider's record is the truth; a job sweeps everything still pending), the payment record store's five states with `pending`. Chapter facts: Stripe replays the stored response and lets the object be retrieved; Adyen returns the first response for the same key and has no payment GET, so the webhook, the cancel by own reference and the settlement report stand in. | `problem_solution`: The opening scene's timeout. → The same timeout handled as an unknown outcome on each provider. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The decline's three facts, the expiry and the unknown outcome are one discipline seen three times: an authorization lives in the issuer's records, and the merchant holds only a copy of the answer, which can be vague (a generic code), stale (an expired window) or missing (a timeout). In each case the remedy is the same move: go back to a record closer to the issuer before acting.\n\n**So what:** A payment record with one status field cannot hold a promise: it needs the approved amount, the expiry, the three facts of a refusal and a state for 'asked, not yet answered', and the code that retries must read them. That is cheaper than 1,840 refunds.\n\n**Callback:** The 1,840 members charged twice on 1 November 2026. The reader can now say that each first request had probably obtained a promise, that the job needed a third outcome and the same key, and what it should have asked the provider before sending anything new.\n\n**Takeaway** (`course_of_action`): Give every authorization request a key and a reference of your own before it is sent, store what comes back as separate facts with the expiry, and treat silence as a state to resolve. Eight questions to ask follow.\n\n**Hand-off** to [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html): `contrast`: The authorization as a promise that reserves an amount and moves nothing. → The steps that do move money, which run later, in batches and in net amounts, between parties the merchant never sees.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | synthesis (list) | Established: an authorization moves no money and expires, the issuer decides and usually answers with a generic code, the networks set retry limits by code, and a timeout leaves the outcome unknown. |  |  |\n| p44 | synthesis (list) | Depends on context: whether to separate authorization from capture, how many retries to schedule, and how to resolve a timeout, which differs by provider. |  | `contrast`: What the field agrees on. → What changes with the sale and the provider. |\n| p45 | recommendation (list) | The author's synthesis: the merchant holds a copy of an answer whose original is at the issuer, so the payment record should store the promise as separate facts and model silence as a state. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p46 | recommendation (list) | Eight questions let the reader test how their own system, or a provider under evaluation, handles approvals, refusals and missing answers. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p47 | transition | The authorization reserved an amount and moved nothing; the next chapter follows the steps that do move money, later, in batches and as net amounts between parties the merchant never sees. |  | `contrast`: A promise that moves no money. → The steps that move it. |\n\n## Non-goals\n\n- The parties, the four-party model and the six-step timeline. See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html).\n- Capture models, clearing, interchange qualification and settlement. See [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html).\n- Refunds, the dispute lifecycle and the provider-side meaning of a refund issued as a reversal. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- Raising the approval rate: retry scheduling, account updater, network tokens, routing. See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html), [The Card Number's Replacement: Network Tokens and Credential Lifecycle](network-tokens.html), [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- How an idempotency key is designed and how a server implements it. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- The provider's payment state machine and where its state lives. See [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html).\n- 3-D Secure, strong customer authentication and exemptions. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- Fraud scoring before authorization and card testing. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- Authorization on terminals, offline and store-and-forward. See [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n- Dunning: what the merchant tells the customer after a declined renewal. See [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Flow rubric notes not acted on, for the author: move the two definitions of customer- and merchant-initiated to the start of validity-windows (the chapter glosses the labels there in one clause instead); move stand-in processing next to 'who decides'; fold the where-the-evidence-stops paragraph into the comparison section; merge the storage requirement of the zero-value check into the stored-credential paragraph.\n- Why Stripe documents 7 days where Visa's rule allows 10 for a customer-initiated online payment: not explained by Stripe; the chapter states the difference without a cause.\n- Mastercard's own rule text (validity, advice codes, stored credentials, stand-in) was not readable (HTTP 403); Mastercard facts are attributed to Stripe's and Adyen's documentation.\n-  The chapter contract: question, coverage, the Larkfield thread and owned terms.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — The Double Charge, Mila's class pass and membership renewal, Keel decisions K1, K2 and K5, the payment record store's states.\n  - _journals/payments-platform-architecture/_research/brief-card-lifecycle-and-networks.md — Part 2 (authorization): message path, response codes and retry rules, validity windows, authorization variants, reversals, stand-in, stored credentials, with the Stripe and Adyen comparisons.\n  - _journals/payments-platform-architecture/_research/brief-stripe-payments-and-api.md — PaymentIntent lifecycle, error model and decline fields, idempotency behavior and the indeterminate outcome.\n  - _journals/payments-platform-architecture/_research/brief-adyen-payments-and-api.md — Result codes, no payment GET, cancel by merchant reference, authorization types and expiry, idempotency key lifetime.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md — Rulings 12 (no payment GET on Adyen), 13 (key lifetimes and the attempt number), 14 (wallet payment, no challenge), 15 (soft and hard decline are not network terms), 17 (Mastercard rules through the providers).\n- **External**\n  - Visa, Visa Core Rules and Visa Product and Service Rules, 24 October 2026 — Definitions (Authorization, Authorization Reversal, Account Verification, Stand-In Processing, Stored Credential), Tables 5-11, 5-13, 5-21 and 7-2, Dispute Condition 11.3. Re-read for this spec.\n  - Stripe documentation, n.d., accessed 17 November 2026: place a hold on a payment method; declines (card, codes, network codes); CITs and MITs; low-level error handling; idempotent requests; incremental, partial and extended authorization; refunds; PaymentIntent lifecycle — Stripe's documented windows, decline fields, classification statement and unknown-outcome procedure. Re-fetched for this spec.\n  - Adyen documentation, n.d., accessed 17 November 2026: adjust authorisation; refusal reasons; raw acquirer responses; Visa integrity fees; cancel; reversal; API idempotency; make token payments; create tokens; partial authorizations; result codes; webhook types; Checkout API v72 OpenAPI specification — Adyen's documented windows, refusal fields, declared classification, cancel by reference and key lifetime. Re-fetched for this spec.\n  - Stripe, ISO 8583: The message standard behind card authorisations, updated 18 September 2026 — The message structure at an introductory level and its relation to ISO 20022.\n  - Visa Inc., Form 10-K for the fiscal year ended 30 September 2026, filed 5 November 2026 — The network's description of the authorization path.\n\n## Changelog\n\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Initial outcome spec, written from the PLAN contract, the journal-spec entry and the research briefs. Status draft.\n- **2026-11-17** — Verification pass: 122 claims listed (114 confirmed, 3 corrected, 4 hedged, 0 unsupported and removed or relabeled, 0 unreachable, 1 not checked: Mastercard's own rules); Adyen refusal reason 38 is named \"Authentication required\" (\"Retry with 3D Secure\" is its description), and timetoread corrected from 28 to 23 minutes.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry thesis.claim (ch2 verification row 52) re-synced; ch2 verification row 32). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 5 statements of absence re-tested with a wide search (1 overturned, 1 narrowed, 3 hold; table in _research/absence-audit/02-authorization.md). Overturned: Stripe's support site says it may send a $0, $1 or similar authorization when card details are stored. Narrowed: Adyen documents its time-out cancel                     i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
