<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part I argues that a card payment is a chain of promises by different parties, none of which makes it final.\n- **Know:** The five chapters follow the payment in order: the journey, authorization, clearing and settlement, the backward flows, the economics.\n- **Be able to:** Pick the Part I chapter that answers a question about a payment status, a delay, a reversal or a fee.\n\n**Audience:** A software engineer or architect who is new to payments, has read the preface and is about to start Part I, or who arrives with one question about a payment status, a delay, a reversal or a fee and wants the chapter that answers it.\n\n**Already knows:**\n\n- APIs, webhooks, retries, queues and databases.\n- From the preface: that the instant answer is not the truth, the sixteen failure patterns, and Larkfield in outline with Mila's €120 class pass (introduction, where-payment-systems-go-wrong, meet-larkfield).\n\n**Does not yet know:**\n\n- Issuer, acquirer, card network, authorization, capture, clearing, settlement, payout, dispute, chargeback, interchange, scheme fees: each is owned by a Part I chapter and is only glossed in a clause here.\n- Bram de Wit's €120 dispute as a worked case.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the part's claim and name the five chapters' subjects in reading order. *Probe:* After reading only this page: what does Part I argue, and what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with the €120 dispute of 24 February 2027 as an actual scene with its dates and amounts, labeled as fictional, not with a description of the part. | `no_weak_introduction_pattern` | rubric | major |\n\n## Thesis\n\n**Question:** What actually happens between the moment an app says 'Payment successful' and the moment the merchant has money it can keep?\n\n> **Claim:** A card payment is not one event but a chain of separate promises made by different parties on different clocks: the issuer's authorization in seconds, the merchant's claim at capture, the acquirer's clearing record and the network's net settlement over the following days, and the provider's payout on its own schedule. None of them makes the payment final: the cardholder's right to dispute it runs for about 120 days and outlasts them all, so the money is the merchant's to keep only when that window closes, and what the merchant keeps is net of a fee divided among the same parties.\n\n**Disputed by:** The integrator's working model: a payment is a request that either succeeds or fails, the provider's 'succeeded' status means the money has been taken, and what happens after the API responds is the provider's internal plumbing.\n\n**So what:** A team that accepts the claim stops storing one status per payment and starts recording which promise it holds, from whom, and when it expires; it treats a missing answer as unknown instead of failed, books refunds and disputes as events that arrive long after the sale, and reads a provider's price as three separate costs.\n\n**How and why:** The party that answers the API call is not the party that decides (the issuer), that moves the money between banks (the network's settlement process) or that can take it back (the cardholder, through the issuer). Each of those parties keeps its own record and works to its own deadline: Visa's public rules give an authorization, in their general table, 5 to 30 days of validity, define settlement as daily net amounts between members, and give the issuer up to 120 days to dispute most transactions. The provider can only report other parties' promises as they arrive, which is why its records, and the merchant's, lag the truth.\n\n**Supporting claims**\n\n- **P1-1** — The provider that answers the API call does not decide the approval, does not move the money between banks and cannot stop it being taken back; each of those belongs to a different party with its own record and its own clock.\n- **P1-2** — An authorization is the issuer's time-limited promise to honor a claim for an amount; it moves no money, and a request that gets no answer has an unknown outcome, not a failed one.\n- **P1-3** — Money moves only at clearing and settlement, a day or more after the approval, as net amounts between network members, so 'settled' names a different event at the network, at the provider and at the merchant's bank.\n- **P1-4** — Money goes back through new transactions and a network-run dispute process, each with its own failures and deadlines, so a payment stays reversible for months after it was paid out.\n- **P1-5** — Each party in the chain is paid separately (interchange to the issuer, scheme fees to the network, a markup to the provider), and whether a provider blends these costs or passes them through decides which of them the merchant can see.\n\n## Role in the part\n\nPerforms the part's opening: the hook, the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `chronological` in chapters: the five chapter paragraphs, in the order a payment happens)\n\nThe page opens on one payment that came back, states the claim that explains it, gives the reason the claim holds and what it changes for the reader's own records, then names the order of the chapters, then takes the chapters one by one, and ends by returning to the opening payment. The scene comes first because the claim is an answer to it; the reason (each step has a different owner with its own clock) stands before the roadmap because it is why the part has one chapter per step; the roadmap stands directly before the list it orders. Put the chapter list first and 'promise', 'issuer' and Bram's €120 arrive unexplained; put the claim before the scene and the reader has no case to test it on; put the closing's return to Bram before the list and it refers to parties and fees the reader has not met.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On 2 February 2027 a €120.00 class pass is bought with Bram de Wit's card at Studio Noord, a yoga studio on the fictional platform Larkfield, and the payment is approved. On 24 February a chargeback arrives: the €120 is taken back, with a €15.00 dispute fee on top, because he told his bank he did not recognize the charge. No step of the payment had failed.\n\n**Bridge:** The reader's view as an engineer: a payment is a request to a provider's API that returned success. → The view of the parties behind the API, where that success was one bank's promise and three more steps and one long waiting period were still to come; hence the question of what happens between 'Payment successful' and money the merchant can keep.\n\n**Thesis statement** (KEY POINTS callout and paragraph p02): Part I argues that a card payment is not one event but a chain of separate promises made by different parties on different clocks (the bank's approval, the merchant's claim, the settlement between banks, the provider's payout), that none of them makes the payment final because the cardholder can dispute it for about 120 days, and that what the merchant keeps is net of a fee divided among the same parties.\n\n**Roadmap** (paragraph p04):\n\n- Five chapters follow the payment in the order it happens: the whole journey and its parties, the authorization, capture with clearing and settlement, the refunds, reversals and disputes that move money back, and who earns what at each step; one paragraph introduces each. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | A €120 class pass bought with Bram de Wit's card on 2 February 2027 at Studio Noord, on the fictional platform Larkfield, was approved and paid out, and on 24 February a chargeback took the €120 back with a €15.00 fee on top, although no step of the payment had failed. | scenario: The €120 dispute: pass bought 2 February 2027 at Studio Noord (Larkfield, fictional); approved; the studio paid within days; chargeback 24 February 2027 because the cardholder told his bank he did not recognize the charge; €15.00 dispute fee (illustrative). |  |\n| p02 | claim | What the API reported as success was one bank's promise: a card payment is a chain of separate promises by different parties (the cardholder's bank, called the issuer, approves; the merchant claims; the banks settle through the card network; the provider pays out), and none of them makes it final, because the cardholder's right to dispute runs for about 120 days and outlasts them all. | fact: Visa's public rules (edition of 24 October 2026) give the issuer 120 calendar days from the transaction processing date for most kinds of dispute.; figure: Figure: one payment as a chain of four links (approved, claimed, settled, paid out), each held by a different party with its own clock, and a 120-day stretch after the last link from which an arrow runs back. | `elaboration`: The €120 that came back although nothing had failed. → The reading that explains it: the success was a bank's promise, the first of several, and the right to dispute outlasts them all. |\n| p03 | explanation | Because each of those promises is made by a different party that keeps its own record on its own clock, and only the last, the payout, is the provider's own, the provider that answers the API call can only report the others as they arrive, so one stored status word is wrong for days at a time. | reasoning: The issuer decides the approval; the network's settlement process moves the money between banks as daily net amounts; the cardholder, through the issuer, can take it back; the provider reports each as it arrives. | `cause_effect`: The chain of promises by different parties. → Why they cannot be collapsed into one status: each is made by a different party with its own record and clock, and only the payout is the provider's own; and what a team that accepts this stores instead. |\n| p04 | transition | Part I follows the payment in the order it happens, in five chapters (the whole journey, the first promise, the money moving forward, the money moving back, the fee), and on the way three beliefs an integrator arrives with are overturned: that approved means paid, that paid out means final, that the fee is one charge. | figure: Figure: the five chapters of Part I laid along one payment's timeline: chapter 1 spans the whole line, chapter 2 the approval, chapter 3 capture to payout, chapter 4 the backward arrows in the dispute window, chapter 5 the fee paid to each party. | `sequence`: Separate promises, each with its own owner and clock. → The part's shape: one chapter for the whole timeline, then one per stretch of it in order, and the fee last. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question about the payment, in the order the payment happens, and works the answer through one Larkfield case.\n\n**Advances the thesis** (P1-1, P1-2, P1-3, P1-4, P1-5): Each paragraph introduces the chapter that argues one of the part's five supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five chapters named in order. → One paragraph per chapter: its question in bold, what it argues and its Larkfield case.\n\n**Order of paragraphs** (`chronological`): The part's own reading order, which is the order a payment happens: the whole timeline and its parties, then the promise, the money moving forward, the money moving back. Economics is last because a fee can be assigned to a party and a step only once the reader knows both. Put authorization before the journey and issuer and acquirer have no place to sit; put disputes before settlement and there is no settled money to take back; put the fee first and interchange is a number with no owner.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Chapter 1 follows one card payment through six steps carried out by at least five parties (five promises made in turn by the issuer, the merchant, the acquirer, the network and the provider, then the dispute window) and shows that the provider answering the API call controls none of the three steps that decide the outcome. | scenario: Mila Janssen's €120.00 class pass, bought at 19:42 on Tuesday 9 March 2027 at Studio Noord and paid out to the studio on Thursday 11 March; studio owner Ines Bakker's question on the Wednesday: 'It says paid. Paid to whom?'; fact: Six steps (authorization, capture, clearing, settlement, payout, dispute window): five promises made in turn by the issuer, the merchant, the acquirer, the network and the provider, then the dispute window; the acquirer, the institution that accepts card payments on the merchant's behalf and sends the clearing record through the network, is the link the chapter adds to the introduction's chain of four; a message moves first, then a record, then money; the chapter's first question to put to a provider: which legal entity is the acquirer in this country. |  |\n| p06 | description | Chapter 2 opens the first step: an authorization is the issuer's promise to honor a claim for up to an approved amount inside a window of 5 to 30 days under Visa's rules, it moves no money, and a request that gets no answer has an unknown outcome, not a failed one. | scenario: The Double Charge of 1 November 2026: a renewal job read a timeout as a refusal and retried; 1,840 members paid twice and €71,300 was refunded.; fact: Visa's rules (edition of 24 October 2026) set validity at 5, 10 or 30 calendar days by transaction type. | `elaboration`: The six-step timeline, whose first step is the only one the customer sees. → What that first step promises, who decides it, how long it lasts and what is known when no answer comes back. |\n| p07 | description | Chapter 3 covers the steps that do move money (the merchant's capture, the acquirer's clearing record, the network's daily net settlement, the provider's payout) and shows that 'settled' names a different event at the network, at the provider and at the merchant's bank. | scenario: Wednesday 10 March 2027: Larkfield's record shows Mila's €120 as paid, the provider's balance shows it as not yet paid out, the studio's bank shows nothing; €117.47 arrives on Thursday 11 March.; fact: Stripe counts its settlement timing from the capture; Adyen pays a whole sales day on a fixed delay, and its terms (17 June 2024) say it pays whether or not it has received the funds (documentation n.d., accessed November 2026). | `contrast`: The authorization, a promise that reserves an amount and moves nothing. → The steps that do move money, later, in batches and as net amounts between banks. |\n| p08 | description | Chapter 4 follows the money backward by three routes with three owners (a cancel or reversal, a refund, a dispute) and shows why a paid-out payment stays open for months: the dispute runs on the issuer's clock and the merchant answers once. | scenario: Bram de Wit's €120 dispute followed day by day from the chargeback of 24 February 2027; the payment's financial effect stays open until at least 2 June 2027, 120 days after the sale.; fact: Visa's rules (edition of 24 October 2026) give 120 days for most disputes and up to 540 where a service is delivered later. | `time`: Money that has been cleared, settled and paid out, the last forward step. → What can still happen afterwards for weeks or months: the merchant sends money back or the cardholder's bank takes it back. |\n| p09 | description | Chapter 5 puts a price on each promise: the fee on a card payment is three payments (interchange to the issuer, scheme fees to the network, a markup to the provider), and whether a provider blends them or passes two through decides which costs the merchant can see. | scenario: The fee on Mila's €120 (illustrative): Larkfield's fee €2.53, of which €0.61 is provider cost: €0.24 interchange, €0.06 scheme fees, €0.31 for the provider.; fact: EU Regulation 2015/751 caps consumer interchange at 0.2% (debit) and 0.3% (credit); Stripe's published standard price is one blended rate, Adyen's published price passes interchange and scheme fees through at cost (price lists n.d., accessed November 2026). | `cause_effect`: The full chain in both directions and the parties that carry it. → What each party charges for the promise it carries, and how the provider prices its share. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the five chapters turn Bram's €120 from a surprise into a sequence: each party that said yes on 2 February made its own promise on its own clock and was paid for it, and the one right that outlasted them all belonged to the cardholder.\n\n**So what:** A reader who finishes the part can look at any status, payout line, dispute event or fee and say whose promise it reports and what is still open, and can open the one chapter that answers a question about a status, a delay, a reversal or a fee.\n\n**Callback:** Bram de Wit's €120 of the opening (p01). By the end of the part the reader can name each party that said yes on 2 February, what each earned, and why none of those yeses stopped the chargeback of 24 February.\n\n**Takeaway** (`course_of_action`): Read the chapters in order, beginning with the payment's journey; with one question in hand (a status, a delay, a reversal, a fee), open the chapter that answers it.\n\n**Hand-off** to [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html): `example`: The part's claim that a payment is ield](meet-larkfield.html).\n- The part's closing synthesis (the promises and the fees on one line) and the hand-off to Part II, which the last chapter carries. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The post entry in the journal spec has a question and no thesis. A part intro performs the part's opening, so this spec uses the part's thesis and its five supporting claims P1-1 to P1-5 unchanged (the precedent of ORDERED's part-1 intro); each chapter paragraph introduces the chapter that argues one of them. Intent outcome, AC-1, AC-2 and role are copied from the post entry; the hook from the part's opening. Rejected: Writing a separate thesis for the page from its question: it would restate the part's claim.\n- **2026-11-17** — The schema requires a conclusion and the structure check finds it by its heading, so the page ends with one short paragraph under 'Where to Begin' (the form ORDERED's part intros use) that carries the callback to Bram's €120 and the sentence 'Begin with [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html).' The style guide puts that sentence at the end of the chapter list; here it is the last sentence before Sources and Evidence, one heading later. Rejected: Ending the chapter list with the sentence and no closing section: the conclusion would have no unit and the structure check would fail.; A closing that performs the part's synthesis of promises and fees: the journal spec gives that to payment-economics.\n- **2026-11-17** — Two figures: the chain of promises with p02 (the claim) and the five chapters on the payment's timeline with p04 (the roadmap). Chapter 1 already draws the six-step timeline and chapter 5 the promises-and-fees line; these two show the claim as links with owners and the part's shape, and repeat neither. Rejected: A figure of the parties: journey-of-a-payment owns the four-party diagram.\n- **2026-11-17** — Company facts on the page are limited to one clause per chapter, each already stated and sourced in that chapter, with the chapter linked at the start of the paragraph; no source is cited here. Rejected: A comparison of the two providers in the intro: the chapters' own sections do that.\n- **2026-11-17** — Flow rubric (fresh reader, order of ideas only): sound with notes. Taken: p02 names the issuer where it first says 'the cardholder's bank' and p05 glosses acquirer, so later chapter paragraphs can use both; p03 is narrowed to the one new consequence (separate records on separate clocks make one stored status wrong for days) and no longer repeats p02's list of who does what; p04 names the three beliefs the chapters overturn. Mila's class pass is introduced in p05 before the closing uses it. No unit was moved. Rejected: Merging p03 into p02: the claim and its consequence for the reader's own records are two ideas.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-1 and its post entry part-1) — Intent, AC-1, AC-2 and role (post entry); thesis, supporting claims, opening hook, bridge and roadmap, flow (part); chapter 1's transition_in for the hand-off; the transitions between the five chapters.\n  - journey-of-a-payment, payment-authorization, clearing-and-settlement, refunds-reversals-and-disputes, payment-economics (posts/01 to 05, index.md, read in full) — What each chapter argues, in its words and numbers; every statement about Stripe, Adyen, Visa's rules and the EU regulation.\n  - _research/scenario-ledger.md — The €120 dispute, Mila's class pass, the Double Charge, the additions by chapters 01 to 05.\n  - PLAN.md (Part I contracts), _research/style-guide.md and _research/INTRO-BRIEF.md — Shape and length of a part introduction.\n\n## Changelog\n\n- **2026-11-17** — While drafting, to keep the page within 1,200 words: the provider comparisons were dropped from the evidence of p05, p06 and p08 (acquirer disclosure, 7 versus 10 days, the shape of a dispute record); they stay in the chapters. Units and order unchanged, so the flow rubric verdict stands.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Initial spec for the part introduction, written after reading the five chapters. (AI-mediated session)\n- **2026-11-17** — Verification pass (part introduction, checked against the corrected chapters 1-5): 24 claims checked (23 agree, 1 corrected to match, 0 removed); the authorization window is now attributed to Visa's general table, as chapter 2 was hedged.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (part thesis.how_why (ch2 verification row 52: Table 5-12 has country windows from 1 day) copy re-synced). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Part thesis claim reworded as approved by the author after verification (clause made too strong by the verified sources).\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after draft check round 2 (the page's only revision). Spec repairs: p03's controlling idea and transition no longer say every promise belongs to a party other than the provider (the payout is the provider's own, as p02 and chapter 1 say); p05's controlling idea and evidence now give chapter 1's count as it stands (six steps = five promises by the issuer, the merchant, the acquirer, the network and the provider, then the dispute window) and name the acquirer's clearing record as the link added to the introduction's chain of four. Draft: 'each chapter gets a paragraph', beliefs sentence moved ahead of the chapter list, clearing and card network glossed, p05's closing instruction turned into what the chapter gives; trimmed to 1,200 words. No unit added, dropped, <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
