<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The sixteen pattern names, each with its warning sign and its family.\n- **Know:** What each family points to: money truth, a record of money that nothing outside the system has confirmed; integration, an assumption about the provider's interface that was never tested; trust, a control over card data, fraud or verification handed to the provider and then not watched; platform and scale, a dependency, a peak or a regulated role nobody rehearsed or named.\n- **Know:** How the patterns chain, and that a chain is usually noticed at a money-truth pattern and started elsewhere.\n- **Believe:** A pattern accumulates from decisions that were each reasonable when they were made, so finding it is not finding someone to blame.\n- **Believe:** Repairing the money at the end of a chain (refunding, re-sending a payout) does not hold; changing the assumption at its start does, and that change is rarely a new provider.\n- **Be able to:** Name the pattern and family behind a described incident, the upstream pattern to check for, and the chapter that addresses it.\n- **Be able to:** Ask for the number or record that would confirm a warning sign.\n- **Be able to:** Use the patterns as questions in a design review, an incident review and a provider evaluation.\n\n**Audience:** A software engineer or architect who is new to payments, has just read the introduction and has not yet met Larkfield as a company or read any chapter.\n\n**Already knows:**\n\n- APIs, webhooks, retries, queues, databases, TLS certificates and rate limiting.\n- From the introduction: that the answer a payment API returns is the first of several promises, that Larkfield is fictional and never evidence about a provider, and the sixteen pattern names as a list.\n\n**Does not yet know up. The slow parts of a payment contradict each of these only later and only sometimes, so the shortcut survives testing and fails under a timeout, a peak or a rule change. At Larkfield the first-of-month renewal peak met a timed-out call and a retry that generated a new key, and 1,840 members paid twice; an expired certificate on a webhook receiver stopped events for nine hours, and 3,200 memberships were shown as unpaid. In both, the money error was the last link.\n\n**Supporting claims**\n\n- **S1** — Payment systems fail in sixteen recurring patterns, each recognizable by a warning sign that a number or a record can confirm.\n- **S2** — The sixteen fall into four families that say where to look: an unconfirmed record of money, an untested assumption about the provider's interface, an unwatched control handed to the provider, and an unrehearsed or unnamed dependency, peak or regulated role.\n- **S3** — Each pattern began as a shortcut that matched how the provider's API behaved on the first day and that the slow parts of a payment contradict only later, so it accumulates from decisions that were reasonable when made.\n- **S4** — The patterns chain: a failure is usually noticed at a money-truth pattern and started at one of the other eleven, so a repair holds at the start of the chain and is rarely a new provider.\n\n## Role in the part\n\nGives the book its shared names for failure: without it Larkfield's incidents are eight anecdotes and no chapter can open by naming the patterns it works on. Supports PF-3 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in sixteen-patterns: the patterns by family, in the table's order; how-the-patterns-chain: one chain per paragraph; `small_to_large` in sixteen-patterns to how-the-patterns-chain to the conclusion: single patterns, then the chains that join them, then their use in a review)\n\nThe catalog comes first because the chains and the review questions are written in pattern names and mean nothing to a reader who has not met them. The chains follow because they need every pattern's mechanism and Larkfield case, which the entries supply, and because they add the one thing no entry says: the direction from the other eleven patterns into money truth. The uses come last because 'name the upstream pattern' is an instruction only a reader who knows the chains can follow. Put the chains first and the reader meets arrows between sixteen undefined names; put the uses before the chains and the incident-review advice has no upstream to point to.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer is charged twice for one month of a membership. Another has paid and is turned away at the door, because the system says she has not. In both cases the provider was up and answered every call the way its documentation says it does.\n\n**Bridge:** An engineer who has integrated a payment API knows it as calls that return success and webhooks that arrive, and has seen a duplicate charge or a 'paid' customer shown as unpaid filed as a bug in one service. → Seen from the introduction's claim, each is a promise or a silence that a system recorded as the truth, and the ways that happens recur often enough to be named.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraphs p02 and p129): Each pattern records a promise as the truth or leaves a dependency untested, and each began as a shortcut that matched how the provider's API behaved on the first day. The sixteen fall into four families that say where to look, and they chain: a failure is usually noticed at a money-truth pattern and started at one of the other eleven, so the repair that holds is at the start.\n\n**Roadmap** (Paragraph p03, with the IN THIS SECTION and KEY POINTS callouts):\n\n- Sixteen named patterns in four families, each with a typical quote, what it looks like, why it happens, what it costs, a Larkfield illustration, a remedy direction and the chapters that address it. *Kept in:* sixteen-patterns.\n- The chains the patterns form (and, in the closing section, three uses: a design review, an incident review and a provider evaluation). *Kept in:* how-the-patterns-chain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A customer can be charged twice, and a paying customer turned away, while the provider answers every call as documented, because a system on the integrator's side recorded a promise or a silence as the truth. | scenario: Two unnamed customers: one charged twice for one month of a membership, one who has paid and is turned away at the door because the system says she has not; the provider was available throughout. |  |\n| p02 | claim | Each pattern began as a shortcut that matched the provider's API on the first day and was reasonable when made, and the slow parts of a payment contradict it only later, so finding a pattern is not finding someone to blame. |  | `cause_effect`: Two failures in which a promise or a silence was recorded as the truth. → Where such failures come from (a first-day shortcut) and why that is nobody's fault. |\n| p129 | claim | The patterns chain, so that the money error a customer or an accountant notices is usually the last link and the repair that holds is at the first. |  | `additional_support`: The patterns and their common first-day origin. → That the patterns also chain, with the visible money error last and the lasting repair first. |\n| p03 | transition | The page gives sixteen entries of one shape in four families, illustrated by invented incidents at Larkfield (a fictional software platform through which members pay fitness studios, on Stripe or Adyen, with a 2027 repair program called Keel whose decisions are numbered K1 to K8) and by provider behavior only as the linked chapters document it, and then the chains and three uses. |  | `sequence`: The patterns, their first-day origin and their chains. → The shape of each entry, the two kinds of evidence the page uses, Larkfield in two sentences, and what follows the sixteen entries. |\n\n## Sections\n\n### Sixteen Patterns to Recognize\n\n**Controlling idea** (`description`, id `sixteen-patterns`): Payment systems fail in sixteen recognizable patterns in four families, each with a warning sign a number or record can confirm, a mechanism that began as a first-day shortcut, a cost, and a remedy on the integrator's own side of the provider's API.\n\n**Advances the thesis** (S1, S2, S3): Names and sorts the sixteen, and shows for each the first-day shortcut, the cost, one Larkfield case and the remedy direction.\n\n**Transition in:** `elaboration`: The introduction's promise of sixteen named patterns in four families and the shape of each entry. → The four families defined, the table of names and warning signs, and then each pattern in turn.\n\n**Order of paragraphs** (`grouping`): The table comes first so the reader has all sixteen names, signs and families before reading any one entry. The entries then follow the table's order, family by family (five money truth, three integration, four trust, four platform and scale): money truth first because its symptoms are the ones a customer or an accountant sees and a newcomer already recognizes, then the three families in which those symptoms usually start. Every entry has the same seven units in the same order, so the reader learns the shape once and can look any pattern up later; within an entry the problem (sign, mechanism, cost, case) comes before the remedy and the chapters, because a remedy read before its mechanism looks like a generic rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | A table gives all sixteen names, warning signs and families, and the four families say where to look (an unconfirmed record of money, an untested assumption about the provider's interface, an unwatched control handed to the provider, an unrehearsed or unnamed dependency, peak or regulated role), and money truth comes first because its symptoms are the ones customers and finance see. The payments terms the table uses (chargeback and dispute, payout, reserve, token, acquirer) are glossed in a clause each before the table. | table: Sixteen rows: pattern name, warning sign and family (five money truth, three integration, four trust, four platform and scale), in the style guide's exact wording. |  |\n| p05 | recommendation | A warning sign is a prompt to look and not a verdict, so the reader should ask for the number or record that would confirm it, as the breakdown of a provider balance against the ledger does for a Black-Box Balance. | example: For a Black-Box Balance: the provider balance on one date broken down into payments, fees, refunds, disputes and reserves, set against the company's own ledger for the same date, with the size and age of the unexplained difference. | `contrast`: The warning signs in the table. → Their limit: a sign needs a number or a record before it counts as a finding, with one worked example. |\n| p06 | example | The Double Charge sounds like a team that resent a timed-out payment and saw both requests succeed. | scenario: Invented quote: “It timed out, so we sent it again. Both went through.” | `example`: The table's first row, and the rule that a warning sign has to be confirmed by a number or a record. → The first money-truth pattern, The Double Charge, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p07 | description | A Double Charge shows as two approved payments for one purchase, clustered on the days when timeouts are frequent. |  | `elaboration`: The Double Charge: the quoted symptom. → The signs by which the pattern shows in general. |\n| p08 | explanation | A timeout is an unknown outcome that the first-day shortcut codes as a failure, and a resend is safe only under the same idempotency key while the provider still remembers it. | fact: Stripe's API v1 replays the stored first response for at least 24 hours; Adyen keeps a key for 7 to 14 days (provider documentation, n.d., accessed November 2026). | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p09 | cause_effect | A Double Charge costs refunds and support time, and disputes from customers who saw the second debit before the refund. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p10 | example | At Larkfield a renewal retried under a new key charged 1,840 members twice on 1 November 2026, and the €71,300 of refunds did not prevent 212 disputes. | case: The Double Charge (ledger): 1 November 2026, first-of-month renewals, a provider call timed out, the renewal job retried with a new idempotency key generated at each network call; 1,840 members charged twice; €71,300 refunded; 212 disputes anyway. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p11 | recommendation | The remedy is one writer of money-moving calls and a key derived from the business event (for a renewal: membership, billing period and scheduled attempt), with a timeout recorded as unknown. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p12 | transition | Three chapters address the Double Charge (idempotency and retries, authorization, and reliability), and the failed-renewal journey also names it. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p13 | example | The Phantom Payment sounds like a record that says paid while the provider still says pending. | scenario: Invented quote: “Our system says paid. The provider says pending. The member is already in class.” | `sequence`: The Double Charge, closed by its chapter links. → The Phantom Payment, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p14 | description | A Phantom Payment shows as a local status of paid or failed that the provider's record does not confirm. |  | `elaboration`: The Phantom Payment: the quoted symptom. → The signs by which the pattern shows in general. |\n| p15 | explanation | The status is written from the response, the browser or a silence because on the first day, for a card, these coincide with the outcome; other methods answer days later and a timeout answers nothing. |  | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p130 | explanation | Where the confirming record lives differs by provider: Stripe's payment object can be read back by its identifier, while on Adyen the confirmation is the webhook and, later, the settlement report. | fact: Stripe's PaymentIntent is an object that can be retrieved by its identifier; Adyen's Checkout API has no endpoint that returns a payment, and reports outcomes by webhook and settlement report (documentation accessed November 2026). | `additional_support`: A status written from something other than the provider's confirmed record. → Where that confirmed record is found on each provider. |\n| p16 | cause_effect | A Phantom Payment costs unpaid services and refused customers, and it corrupts every figure built on the status. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p17 | example | Before Keel, Larkfield marked a direct debit paid when the provider accepted it, days before collection could be confirmed, so on an assumed 1.5% return rate about 4,900 debits a month were recorded as paid and were not. | scenario: Ledger addition of chapter 7: before Keel a ox Balance, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p28 | description | A Black-Box Balance shows as a provider total or a net payout that nobody can split into sales, fees, refunds, disputes and reserves. |  | `elaboration`: The Black-Box Balance: the quoted symptom. → The signs by which the pattern shows in general. |\n| p29 | explanation | A balance computed as a sum over payments stops being right when refunds, chargebacks, fees and holds leave the balance on their own dates. | reasoning: A provider balance changes through movements that are not payments or payouts (refunds, chargebacks, fees, holds), each booked when it occurs. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p30 | cause_effect | A Black-Box Balance costs audit findings, weeks of tracing and sellers who get no explanation. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p31 | example | At Larkfield the ledger's 'owed to studios' balance was €412,000 above the providers' balances at year-end 2025, and three weeks of tracing found three kinds of movement that had no entries. | case: The Unexplained €0.4 Million (ledger): year-end 2025, 'owed to studios' €412,000 higher than the two providers' balances; three weeks of work traced it to refunds after payout, chargeback fees and a currency-conversion rounding rule; audit finding; origin of the reconciliation job. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p32 | recommendation | The remedy is an entry per movement, a reconciliation against each provider's itemized report, run when that provider's reports are ready, and an owner for every unmatched amount. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p33 | transition | Three chapters address the Black-Box Balance (balances and funds flows, reconciliation and reporting, and ledgers); the card-payment and platform-payment journeys and the Stripe case also name it. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p34 | example | The Stranded Payout sounds like a payout that the screen calls paid and the seller never received. | scenario: Invented quote: “We paid them on the 3rd. They say nothing arrived. Our screen says “paid”.” | `sequence`: The Black-Box Balance, closed by its chapter links. → The Stranded Payout, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p35 | description | A Stranded Payout shows as a payout marked paid that the seller's bank does not show, followed by a credit that matches no open payout. |  | `elaboration`: The Stranded Payout: the quoted symptom. → The signs by which the pattern shows in general. |\n| p36 | explanation | A provider's 'paid' on a payout means sent, both providers document that the money can still come back, and a record closed at 'paid' has no place for the return. | quotation: Stripe's documentation (n.d., accessed November 2026): a failed payout \"might initially show as `paid`\"; Adyen's: a non-instant payout \"cannot fail\" but can be returned. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p37 | cause_effect | A Stranded Payout costs sellers weeks without their money and leaves returned money that no record owns. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p38 | example | At Larkfield 412 payouts worth €386,000 were returned over three weeks in June 2026 after an unchecked change o aranteed order. Adyen's: a 2xx within 10 seconds, a failing endpoint's events queued for up to 30 days (n.d., accessed November 2026). | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p44 | cause_effect | A Trusted Doorbell costs wrongly unpaid customers, duplicated fulfillment and missed deadlines that started with one event. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p45 | example | At Larkfield an expired certificate on the Stripe webhook receiver stopped events for 9 hours on Monday 14 September 2026, and 3,200 paid memberships were shown as unpaid. | case: The Silent Webhook (ledger; consistency ruling 20): Monday 14 September 2026, the Stripe webhook receiver's TLS certificate expired shortly after midnight; events failed for 9 hours; 3,200 memberships shown as unpaid; members turned away at check-in on Monday morning; no money lost; 460 support tickets. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p46 | recommendation | The remedy is to treat the webhook as a notice: store and acknowledge it, confirm the change against the provider's record, sweep what stays pending and read silence as unknown. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p47 | transition | Three chapters address the Trusted Doorbell (webhooks and events, state machines, and reconciliation and reporting), and the dispute journey follows it. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p48 | example | The Version Cliff sounds like a library upgrade for one feature that silently broke a report. | scenario: Invented quote: “We only upgraded the library for one new feature. Why is the revenue report wrong?” | `sequence`: The Trusted Doorbell, closed by its chapter links. → The Version Cliff, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p49 | description | A Version Cliff shows as API versions nobody can list and an upgrade that crosses years of changes in one deploy. |  | `elaboration`: The Version Cliff: the quoted symptom. → The signs by which the pattern shows in general. |\n| p50 | explanation | Pinning hides change on the first day, the version is set in several unowned places, and each skipped release lengthens the jump that is eventually forced. | fact: Stripe uses one dated version for its whole API, set by account default, by header or, since 2023, by SDK release; Adyen puts a version number in the URL of each API (documentation accessed November 2026). | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p51 | cause_effect | A Version Cliff usually costs silently wrong data, because a removed field raises no error. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p52 | example | At Larkfield a library upgrade in March 2026 moved the billing integration across three years of versions, a removed field broke the finance export without an error, and revenue reports were wrong for 6 days. | case: The Version Cliff (ledger and chapter 19 addition): March 2026, the billing integration was pinned to a three-year-old API version (the account default); a forced SDK upgrade for another feature moved it across a breaking release that removed a field the finance export read; no error raised; subscription revenue reports wrong for 6 days. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p53 | recommendation | The remedy is a version register with owners and upgrades made on a calendar, one release at a time, tested and staged. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p54 | transition | Three chapters address the Version Cliff: API versioning, safe change, and revenue recognition. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p55 | example | A Card by Any Other Name sounds like the belief that 'paid' means the same for every payment method. | scenario: Invented quote: “Paid is paid. Why would a direct debit be any different?” | `sequence`: The Version Cliff, closed by its chapter links. → A Card by Any Other Name, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p56 | description | A Card by Any Other Name shows as one rule for every method and a dispute report that counts things that are not disputes. |  | `elaboration`: A Card by Any Other Name: the quoted symptom. → The signs by which the pattern shows in general. |\n| p57 | explanation | One API unifies how a payment starts and how its status is reported but not what the status means, which each payment scheme fixes for itself. | fact: Under EU law a SEPA direct debit can be refunded without a reason for eight weeks and contested as unauthorized for thirteen months; an iDEAL payment cannot be disputed through the payer's bank. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p58 | cause_effect | A Card by Any Other Name costs access given for uncollected money, wrong retry schedules and reports that cannot be compared. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p59 | example | Before Keel, Larkfield applied one rule to every method and recorded a returned debit as a dispute, although a €49.00 debit of 1 April 2027 stays refundable until 27 May 2027 and contestable until 1 May 2028. | scenario: Ledger addition of chapter 7: before Keel one rule covered every method; on the Adyen side a returned debit was recorded as `disputed`; Daan Peters, €49.00 membership by SEPA Direct Debit collected 1 April 2027, refundable without reason until 27 May 2027, contestable as unauthorized until 1 May 2028. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p60 | recommendation | The remedy is a method family on every payment with its own rules for paid, access and reversal, and neutral names for reversals. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p61 | transition | Three chapters address A Card by Any Other Name (local payment methods, state machines, and refunds and disputes), and the closing chapter on what is moving applies it to new rails. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p62 | example | The Vault Hostage sounds like a business that would change provider if its stored cards could come along. | scenario: Invented quote: “We would switch tomorrow. Except every stored card lives with them.” | `sequence`: A Card by Any Other Name, closed by its chapter links. → The Vault Hostage, the first pattern of the trust family, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p63 | description | A Vault Hostage shows as a database of one provider's tokens, which a second provider cannot charge. |  | `elaboration`: The Vault Hostage: the quoted symptom. → The signs by which the pattern shows in general. |\n| p64 | explanation | Storing cards with the provider is right on the first day, and it returns a token that works only there, so leaving is a transfer between vaults that the merchant cannot perform. | fact: A provider token works only with that provider; moving stored cards is a transfer between providers that takes weeks (provider documentation, accessed November 2026). | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p65 | cause_effect | A Vault Hostage costs negotiating position, a failover without renewals and cards lost in migration. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p66 | example | At Larkfield stored cards exist only as each provider's tokens, so the rehearsed switch of K8 cannot move stored-card renewals, and an exit sheet per provider records how the cards would leave. | scenario: Ledger additions of chapters 10 and 22: under K8 the switch covers payments that bring their own credential; stored-card renewals stay with, or wait for, the provider that holds the card; Femke de Graaf owns one exit sheet per provider (how stored cards leave, in how many weeks, what does not travel). | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p67 | recommendation | The remedy is to decide who holds the vault before adding a provider, write the exit down in advance, and ask what happens to network tokens. | fact: Neither Stripe nor Adyen documents whether network tokens survive a move between providers (documentation accessed November 2026). | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p68 | transition | Three chapters address the Vault Hostage: tokenization and vaulting, network tokens, and routing and orchestration. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p69 | example | The Card in the Log sounds like a company that stores no card numbers except where customers paste them. | scenario: Invented quote: “We never store card numbers. Well, the support chat does, when members paste them in.” | `sequence`: The Vault Hostage, closed by its chapter links. → The Card in the Log, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p70 | description | A Card in the Log shows as a card number in a log, a ticket or an analytics event, or as unowned scripts on the payment page. |  | `elaboration`: The Card in the Log: the quoted symptom. → The signs by which the pattern shows in general. |\n| p71 | explanation | Hosted card fields keep the number away on the first day, but the security standard binds every system that can affect it, and the page around the fields stays the merchant's. | fact: PCI DSS binds every system a card number passes through or can affect; hosted fields lead to SAQ A at both providers; since 31 March 2025 a merchant filing SAQ A must confirm that scripts on the payment page cannot attack the form. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p72 | cause_effect | A Card in the Log costs a growing assessment, a questionnaire signed on trust and, at worst, stolen cards. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p73 | example | In January 2027 the payment step of Larkfield's booking widget loaded 17 third-party scripts from 9 domains, four of them unowned, and K4 cuts that to 3 scripts from 2 domains. | scenario: Ledger addition of chapter 22: in January 2027 the payment step of the booking widget loaded 17 third-party scripts from 9 domains, 4 with no known owner; under K4 the payment step move apabilities, and the law lets a requirement reopen at any time. | fact: Stripe and Adyen both hold verification as requirements with deadlines that switch capabilities such as payouts on and off, and deliver changes by webhook (documentation accessed November 2026). | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p86 | cause_effect | A Frozen Seller costs sellers days of income and the platform tickets and departures. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p87 | example | At Larkfield 230 studios missed a changed verification requirement in May 2026 because the only reminder went to an unread address, and their payouts were paused for up to 12 days. | case: The Frozen Studios (ledger, chapter 26 and 34 additions; consistency ruling 23): May 2026, a verification requirement changed, announced in advance with a deadline; one batch email to each studio's sign-up address; 230 studios missed the deadline; payouts paused up to 12 days; the studios were legacy Custom connected accounts on Stripe, with verification data collected through Larkfield's own API forms since 2017. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p88 | recommendation | The remedy is to mirror each seller's requirements and deadlines as state, give every deadline an owner and show the seller the reason and the date. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p89 | transition | Three chapters address the Frozen Seller: compliance and regulation, platform onboarding, and embedded finance. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p90 | example | The Single Rail sounds like a company with two providers that has never moved a payment between them. | scenario: Invented quote: “We have two providers. We have never moved a payment from one to the other.” | `sequence`: The Frozen Seller, closed by its chapter links. → The Single Rail, the first pattern of the platform and scale family, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p91 | description | A Single Rail shows as payments that depend on one provider, acquirer or region, with a second route that has never carried traffic. |  | `elaboration`: The Single Rail: the quoted symptom. → The signs by which the pattern shows in general. |\n| p92 | explanation | One provider is right on the first day and a second costs a second set of everything after the authorization request, so the switch goes unrehearsed. | reasoning: A routing layer unifies the authorization request and nothing after it: disputes, settlement, balances, payment-method coverage and stored cards stay one set per provider. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p93 | cause_effect | A Single Rail makes the provider's outage the merchant's in full, and an improvised switch during it produces double charges. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p94 | example | Before Keel Larkfield had two providers and no way to move a studio between them; K8 adds one switch, rehearsed each quarter with real payments for the 50 largest studios. | scenario: Ledger (systems landscape, K8) and chapter 10 and 11 additions: the routing rule is 'the studio's provider'; under K8 each of the 50 largest studios keeps a verified account at both providers and the quarterly rehearsal sends real payments through the second provider and follows them to payout, a refund and reconciliation; the front desk has no second provider ameless customers, and its timeouts feed the Double Charge. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p101 | example | At Larkfield 38% of monthly renewals ran in six hours, and on 1 October 2026 the job hit Stripe's rate limit, delayed 7,900 renewals and sent their members dunning emails. | case: The Renewal Wave (ledger and chapter 21 addition): 38% of monthly membership volume attempted in a 6-hour window on the 1st; on 1 October 2026 the renewal job hit Stripe's rate limit; an HTTP 429 was treated as a failed attempt; 7,900 renewals delayed to the next day; dunning emails sent to members who had done nothing wrong. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p102 | recommendation | The remedy is to pace the peak on the merchant's side, serve checkout before the batch and treat a refusal as 'not attempted yet'. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p103 | transition | Three chapters address the First of the Month (peak load, the developer platform, and subscriptions and billing engines), and the failed-renewal journey also names it. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p104 | example | The Borrowed Blueprint sounds like a team that takes a provider's Black Friday figure as its own design target. | scenario: Invented quote: “Stripe did 152,000 a minute on Black Friday. We should build for that.” | `sequence`: The First of the Month, closed by its chapter links. → The Borrowed Blueprint, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p105 | description | A Borrowed Blueprint shows as a small team adopting machinery that a large provider described. |  | `elaboration`: The Borrowed Blueprint: the quoted symptom. → The signs by which the pattern shows in general. |\n| p106 | explanation | A provider's published design answers the provider's own scale, often years ago, and a published peak figure is load carried for all customers, not capacity offered to one. | fact: Stripe's 2017 engineering post on rate limiters (evidence age: 9 years) describes four types of limiter in production; Stripe's newsroom reported more than 152,000 transactions per minute at peak over the Black Friday weekend of 2025. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p107 | cause_effect | A Borrowed Blueprint costs months of machinery and leaves the actual fault untouched. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p108 | example | Larkfield avoided the pattern twice in 2027: it declined an orchestration product in February, and in April it answered a provider's Black Friday figure with the per-account limit. | scenario: Ledger additions of chapters 10 and 40: in February 2027 Daniel Osei proposed an orchestration product with per-payment routing and Femke de Graaf declined it (provider tied to country); in April 2027 he objected to K5 with 'Stripe did 152,000 a minute on Black Friday' against a wave of about 1,000 renewals a minute, and she answered with the per-account limit. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p109 | recommendation | The remedy is to copy rules and not machinery, after asking which problem a design answered, at what volume and in which year. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p110 | transition | Three chapters address the Borrowed Blueprint most directly (peak load, data stores and consistency, and ledgers); the Stripe and Adyen cases, the contrast cases and the closing chapter also name it. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n| p111 | example | The Accidental Bank sounds like a proposal to collect sellers' money into the platform's own account. | scenario: Invented quote: “Let's collect into our own account and pay the studios two weeks later. It makes refunds simpler.” | `sequence`: The Borrowed Blueprint, closed by its chapter links. → The Accidental Bank, the next row of the table, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p112 | description | An Accidental Bank shows as sellers' money in the platform's account, liability taken by a default setting, or financial products on the roadmap. |  | `elaboration`: The Accidental Bank: the quoted symptom. → The signs by which the pattern shows in general. |\n| p113 | explanation | A platform is outside the rules for holding others' funds only while it never has possession or control of them, and product ideas do not arrive labeled as regulated. | reasoning: A platform is outside the licensing and safeguarding rules only while it never has possession or control of customers' funds; one arrow through its own bank account raises a license question. | `cause_effect`: What the pattern looks like. → The first-day shortcut behind it and what later contradicts the shortcut. |\n| p114 | cause_effect | An Accidental Bank costs regulatory exposure and losses nobody priced. |  | `cause_effect`: The mechanism of the pattern. → What the mechanism costs in money, customers and trust. |\n| p115 | example | Larkfield avoided the pattern in April 2027, when a proposed refund buffer of about €43 million in its own account was rebuilt as a held amount on each studio's balance at the provider. | scenario: Ledger addition of chapter 16: in April 2027 the product team proposed a refund buffer (collect member payments into a Larkfield bank account, pay studios 14 days later, about €43 million held at any moment); Jonas Weber rejected it because it would put Larkfield in possession of studio funds; built instead as a longer payout schedule and a held amount on the studio's own balance at the provider. | `example`: The pattern's mechanism and cost in general. → One case at the fictional Larkfield, labeled as fiction, with its ledger figures. |\n| p116 | recommendation | The remedy is to draw the funds flow, mark the licensed holder and the loss bearer at every arrow, and choose liability on purpose. |  | `problem_solution`: The pattern as lived at Larkfield. → The direction of the repair, and the Keel decision that takes it where there is one. |\n| p117 | transition | Three chapters address the Accidental Bank (licenses and safeguarding, platform payment models, and embedded finance); the platform-payment and dispute journeys, the Adyen case and the contrast cases also name it. |  | `elaboration`: The remedy direction in two or three clauses. → The chapters that work the remedy out, each with what it owns. |\n\n### How the Patterns Chain\n\n**Controlling idea** (`cause_effect`, id `how-the-patterns-chain`): The patterns chain in one direction: a chain is usually noticed at a money-truth pattern and started at an integration, trust, or platform-and-scale pattern, so the repair holds at the start.\n\n**Advances the thesis** (S4): Names three chains by the family where they start, follows each to the money-truth patterns where it is noticed, and shows one chain end to end at Larkfield with the repairs Keel makes at its start.\n\n**Transition in:** `cause_effect`: The sixteen patterns, each described on its own. → The patterns as causes of one another: three chains, where each starts and where it is noticed.\n\n**Order of paragraphs** (`grouping`): A lead paragraph states the section's claim, then one chain per paragraph in the order of the families in the table (integration, trust, platform and scale), so the reader can check each chain against entries read in the same order. The Larkfield chain comes last because it is the worked instance of the claim, one chain (the scale chain) followed link by link; placed first, it would read as one more incident before the reader knows what a chain is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p118 | claim | The patterns chain in one direction: a chain is usually noticed at a money-truth pattern and started at one of the other eleven, in three chains named by the family where they start. | figure: Figure: three columns of starting patterns (integration, trust, platform and scale) with arrows into the five money-truth patterns. |  |\n| p119 | cause_effect | The integration chain starts at an untested assumption about the interface (a Trusted Doorbell, A Card by Any Other Name, a Version Cliff) and ends in Phantom Payments, Orphaned Refunds and figures nobody can explain. | case: The Silent Webhook's 3,200 memberships shown as unpaid for 9 hours; the direct debit marked `paid` at submission (both told above, from the ledger). | `elaboration`: The claim that chains start outside money truth, in three families. → The first chain, from the three integration patterns to the money-truth patterns they produce. |\n| p120 | cause_effect | The trust chain starts at an unwatched control: a Frozen Seller and an Open Till end in balances and refunds nobody can explain, a Vault Hostage feeds the Single Rail, and the Card in the Log is the exception that is not noticed in the money. |  | `similarity`: The integration chain, from interface assumptions to money-truth patterns. → The second chain, from the four trust patterns, with the one pattern that does not end in money. |\n| p121 | cause_effect | The scale chain starts at an unrehearsed dependency or peak: the First of the Month and the Single Rail end in Double Charges and Phantom Payments, the Accidental Bank in refunds the platform funds, and the Borrowed Blueprint delays every repair. |  | `similarity`: The trust chain. → The third chain, from the four platform-and-scale patterns to the money-truth patterns they produce. |\n| p122 | example | Larkfield's 1 November 2026 is one chain end to end (the renewal wave, a timeout, a retry under a new key, 1,840 double charges, 212 disputes), which is why Keel changes the pacing and the key and not the provider. | case: The Double Charge and the Renewal Wave (ledger): 1 November 2026, first-of-month renewals, a timeout, a retry with a new key, 1,840 members charged twice, €71,300 refunded, 212 disputes; Keel decisions K1, K2 and K5; K8 adds no orchestration product.; figure: Figure: four links in a row (the wave, the timeout, the retry under a new key, the double charge) with the refund at the last link and the Keel decisions at the first three. | `example`: The three chains in general. → One chain followed link by link at Larkfield, and the order of repair it implies. |\n\n## Conclusion: Using the Patterns\n\n**Synthesis:** The catalog and the chains together say something neither says alone: a payment failure is recorded in one place and decided in another. It shows where the money is counted and was decided earlier, on the integrator's own side of the provider's API, by a retry rule, a webhook handler, a form or a schedule.\n\n**So what:** A correction made only to the money has to be made again next month. The repair that holds is rarely a new provider: it is a key, a state, a ledger entry, a reconciliation and a named owner, and finding a pattern is not finding someone to blame, because each decision behind it was reasonable on the first day.\n\n**Callback:** The two customers of the opening: one charged twice, one who paid and was turned away. The reader can now name them (a Double Charge; a Phantom Payment begun at a Trusted Doorbell), look upstream, and ask who owns the assumption now.\n\n**Takeaway** (`course_of_action`): Use the patterns as questions: in a design review at every step of one payment, in an incident review by naming the upstream pattern and assigning the owner there, and in a provider evaluation by asking to see the pattern and not the feature.\n\n**Hand-off** to [Meet Larkfield](meet-larkfield.html): `example`: The sixteen pattern names, and the Larkfield incidents the patterns page used one at a time as illustrations. → The platform as a whole: its business lines and figures, its two providers, its systems and people, the eight incidents as one landscape's history, the Keel decisions and the recurring payments.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p123 | synthesis | The catalog and the chains together say that a payment failure shows where the money is counted and was decided earlier on the integrator's own side of the API, so a correction to the money alone repeats and the lasting repair is rarely a new provider. |  |  |\n| p124 | analysis | The two customers of the opening can now be named (a Double Charge, and a Phantom Payment begun at a Trusted Doorbell) and traced upstream, where the question is who owns the assumption now, to be asked in three situations. |  | `example`: A failure is decided somewhere other than where it shows. → The opening's two customers, named and traced upstream; ownership, not blame; the announcement of three situations. |\n| p125 | recommendation | In a design review, walk one payment through the design and ask at every step which promise is recorded, which record proves it and which pattern occurs if that record is late, repeated or missing. |  | `elaboration`: The question of who owns the assumption, and the announcement of three situations. → The first situation: a design review, one payment walked through every step. |\n| p126 | recommendation | In an incident review, name the money-truth pattern, then the upstream pattern, and assign the owner upstream, because a review that ends with the refund has repaired only the last link. |  | `similarity`: The patterns used as questions about a design. → The same names used after a failure: the pattern, the upstream pattern, the owner. |\n| p127 | recommendation | In a provider evaluation, ask to see the pattern and not the feature, and record 'not public' as an answer, because most of what the questions reveal concerns the integrator's own side. |  | `similarity`: The patterns used in an incident review. → The same questions put to a provider: timeouts and keys, the webhook contract, account limits, how stored cards leave. |\n| p128 | transition | The next page introduces Larkfield as a whole, with the eight incidents used here one at a time shown as one platform's history. |  | `example`: The patterns and the Larkfield incidents used one at a time. → The platform as a whole, on the next page. |\n\n## Non-goals\n\n- Teaching any remedy in depth; every pattern links to the chapters that own it.\n- Introducing Larkfield as a company (business lines, systems landscape, cast, the Keel program as a whole); the page uses incidents and decisions one at a time. See [Meet Larkfield](meet-larkfield.html).\n- The book's claim, its evidence rules and how to read a 'Where They Differ' table. See [Introduction: Why Payment Infrastructure Is Hard](introduction.html).\n- A 'Stripe and Adyen: Where They Differ' section and the three tiers of take-away: this is a preface page; provider behavior is repeated only from the chapters that document it.\n- Public incident cases at real companies: the briefs hold dated provider documentation, not attributable incident reports, and the page cites no source of its own.\n- Ranking the patterns by frequency or cost; no survey supports it.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Chapters 42 to 47, 49 and 50 now exist and -11-17** — The chapters under 'Where this book helps' are taken from the FAILURE PATTERNS callouts of the written chapters (1 to 41), at most three per pattern, chosen by ownership in PLAN.md. Rejected: Listing every chapter whose callout names the pattern (up to eighteen for The Phantom Payment).\n- **2026-11-17** — Between patterns the parallel sub-heading is the declared transition: the fifteen pattern-opening units carry relationship 'sequence', form 'phrase'. Inside an entry the bold label carries the transition. Rejected: A connective sentence at the start of each of sixteen entries, which would disturb the catalog's repeated shape.\n- **2026-11-17** — Consistency rulings applied: 12 (the confirming record is the object on Stripe, the webhook plus the settlement report on Adyen), 13 (K1's key includes the scheduled attempt number), 14 (no 3-D Secure example is attached to Mila's pass), 20 (the Silent Webhook is Monday 14 September 2026), 22 (no external URLs in the text), 23 (legacy Custom connected accounts), 24 (eight incidents, seven of them in 2026).\n- **2026-11-17** — Length: sixteen entries of about 270 words need more than the chapter target, so the page is sized at about 6,000 words with the 6,500 limit kept, as the coordinator's brief for this page allows. Rejected: Shortening entries to five units.\n\n## Sources\n\n- **Internal**\n  - _research/style-guide.md — The sixteen pattern names, warning signs and families; page format; valid permalinks; the figure suffix.\n  - _research/scenario-ledger.md — The eight incidents, the Keel decisions and the chapter additions used as illustrations.\n  - PLAN.md — The page's contract and the chapter contracts that decide which chapter owns a remedy.\n  - _research/consistency-issues.md — Rulings 12, 13, 14, 20, 22, 23 and 24.\n  - posts/01 to 41: the FAILURE PATTERNS callouts and KEY POINTS of the written chapters — The chapter-to-pattern links, and every statement of provider behavior repeated on this page (with the chapters' own dated sources).\n  - journal-spec.json, entry where-payment-systems-go-wrong — Intent outcome, acceptance criteria AC-1 to AC-6, thesis and role, copied unchanged; the hand-off relationship from the next page's transition_in.\n  - _journals/commerce-platform-architecture/posts/where-commerce-platforms-go-wrong — The shape of the page and of each entry.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 38 claims checked against their owning chapters (36 confirmed, 1 corrected, 1 hedged, 0 unsupported and removed or relabeled, 0 unreachable); links added to chapters 42 to 50 under the patterns their callouts name, the 'one chapter' sentence removed from The Stranded Payout, and K3 and K4 named for The Stranded Payout and The Vault Hostage to agree with meet-larkfield.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Initial spec. (AI-mediated session)\n- **2026-11-17** — Journal-spec entry corrected for rulings 12, 13, 20 and 24; intent, thesis and role re-synced.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (ruling 28 / K3: not nightly; stale open question closed). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 'Adyen publishes no limit for payments' re-tested with a wide search (documentation and help-center sitemaps, web search of Adyen's domains); it holds. No change to the text.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('the other eleven' -> 'the other eleven').\n- **2026-11-17** — Count corrected: sixteen patterns less five money-truth patterns leave eleven, not twelve (key point, chains section, thesis, units).\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision                 let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
