<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-6 entry and the part thesis, opening and flow in journal-spec.json, the scenario ledger, and a full reading of the six written chapters of Part VI. The page makes no external factual claim of its own: every statement about Stripe, Adyen, a network or a regulation repeats one a chapter of the part makes and cites.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VI argues that revenue needs a second, time-driven state machine above payments, whose output is the invoice and whose failures are late, twice and wrong period.\n- **Know:** The six chapters follow one billing period: engine, usage, invoice and collection, tax, recognition, merchant of record.\n- **Know:** The Adyen side of several chapters is short: no first-party Adyen tax, invoicing or revenue-recognition product was found in public sources as of November 2026, and Adyen states that it does not act as a merchant of record.\n- **Be able to:** Pick the chapter of Part VI that answers the billing question in front of them.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to V and are about to start the billing chapters, or who arrive with one billing question (a late or doubled renewal, a usage invoice, a failed renewal, a tax line, a revenue number, a merchant-of-record offer) and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a scheduler, a state machine, a retry and an idempotency key are.\n- Parts I to V: authorization, the payment state machine, stored credentials and merchant-initiated payments, idempotency, and that a control moves liability between parties without removing it.\n- Larkfield in outline: a fictional studio-software platform that uses Stripe and Adyen, and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- Billing engine, invoice as a record of one debt per period, proration, meter, rating, finalization, credit note, dunning, tax registration, deferred revenue, merchant of record: each is owned by a Part VI chapter and is glossed in a clause here or only named.\n- That the public record on Adyen is uneven across the part: a token and a flag for recurring payments, payment-level retry and card updating are documented; no integrated billing, tax or recognition product was found; and Adyen states that it is not a merchant of record.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the part's claim and name the six chapters' subjects in reading order. *Probe:* After reading only this page: what does Part VI argue, and what will each of the next six chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with the two dated Larkfield renewal incidents themselves (1 October and 1 November 2026, with their figures), not with a description of billing. | `no_weak_introduction_pattern` | rubric | major |\n\n## Thesis\n\n**Question:** What has to be built on top of a payment API before single payments become recurring, usage-priced, taxed and reportable revenue, and how does that system fail?\n\n> **Claim:** Revenue needs a second state machine on top of payments, driven by the clock and by billing periods instead of by a customer's click: it decides what is owed, for which period and when to ask, and hands the payment engine an invoice. Its failures are failures of time (a charge that is late, taken twice, or counted in the wrong period), and whoever holds the invoice is the only party that can collect it as a debt, tax it and recognize it. As of November 2026 the public record puts that machine inside Stripe's platform and outside Adyen's.\n\n**Disputed by:** The view that billing is a thin layer of configuration over payments (a monthly job that charges saved cards, plus reports for finance), so that a provider with good authorization rates and stored credentials has already solved the hard part.\n\n**So what:** A team that accepts the claim designs renewals around the invoice and its period, not around the charge; asks of any provider 'where does the invoice live?' before comparing features; and, where the provider holds no invoice, budgets for a billing system of its own or a third party's.\n\n**How and why:** A customer-started payment has one moment and one amount. A recurring charge has neither until something computes them: a scheduler picks the instant, a price plan and a usage count give the amount, and a state machine says what the subscription is while the invoice is unpaid. Each of those depends on time boundaries (period start, event cut-off, retry window, tax point, service period), and each boundary is a place where a charge can land late, twice or in the wrong period. Stripe documents subscription, invoice, meter, tax and revenue-recognition objects on one platform. Adyen documents stored tokens charged with a recurring flag, payment-level retry and card updating, and closed its acquisition of the billing company Orb on 1 July 2026; no integrated Adyen billing product, tax engine or revenue-recognition product was found in public sources, and Adyen states that it does not act as a merchant of record, so several comparisons in this part are between Stripe's product and what a merchant must supply itself.\n\n**Supporting claims**\n\n- **P6-1** — A billing engine is a scheduler, a price calculator and a subscription state machine whose output is an invoice; the payment API executes only its last step.\n- **P6-2** — Usage can be billed correctly only if three time rules are fixed before the first invoice (how long an event is accepted, when the period's invoice closes, how a wrong event is corrected), because usage events arrive late and twice.\n- **P6-3** — Between owed and paid, what is recovered is the debt on a finalized invoice, through as many attempts and payment methods as it takes; a provider that holds the invoice retries a debt, and one that sees only payments retries a payment.\n- **P6-4** — Tax and revenue recognition are second readings of the same invoice lines, by place and by period, and a provider can compute them only for the sales and contracts it sees; the liability and the accounting judgement stay with the seller.\n- **P6-5** — As of November 2026 the public record shows the billing state machine inside Stripe's platform and outside Adyen's: Adyen documents recurring token payments, payment-level retry and an Orb acquisition closed on 1 July 2026 with no documented integrated product, so for invoicing, tax, recognition and merchant of record the comparison is Stripe's product against the merchant's own or a third-party system.\n- **P6-6** — Making the provider the merchant of record puts its name on the customer's statement and invoice and hands it the indirect tax and the handling of fraud and disputes; under the one arrangement documented in detail as of November 2026, Stripe's, the cost of disputes, refunds and reversals, the seller-of-record role and the revenue stay with the business. The price is a fee, the checkout, the statement name and part of the customer relationship; it is an operating model, and it does not fit a platform that pays other sellers.\n\n## Role in the part\n\nPerforms the part's opening: the two renewal incidents, the part thesis, the reading order, and the warning that the public record on Adyen is thin for half the part.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the six chapter paragraphs, in the part's reading order)\n\nThe page opens on two dated renewal incidents in which every payment worked, names what failed (the thing that decides when to ask and for which month), and then narrows: from the change of subject (payments nobody present starts), to the claim (a second state machine whose output is an invoice and whose failures are late, twice and wrong period), to what follows from holding the invoice, to how far the public record on the two providers carries the comparison, to the reading order, to one paragraph per chapter. The incidents come first because the claim's first two failures are named after them; told after the claim they would read as illustrations of a definition instead of the puzzle the definition solves. The claim precedes the chapter list because each chapter paragraph says what its chapter does to the invoice, and a reader who has not been told that the invoice is the engine's output reads the list as six topics. The evidence paragraph precedes the list because three chapter paragraphs say what was not found for Adyen, and the reader must know first that an absence in public sources is not a statement by Adyen, and that on merchant of record Adyen has made a statement. Moving it after the list would let the first 'no Adyen product was found' be read as a fact about Adyen.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): On 1 October 2026 Larkfield's renewal job hit its provider's rate limit and 7,900 membership renewals slipped to the next day; dunning emails went to members who had done nothing wrong. On 1 November 2026 a provider call timed out, the same job retried with a new idempotency key, and 1,840 members were charged twice; €71,300 was refunded and 212 members disputed the charge anyway. Every card payment that ran in those two months did what it was asked. The fault was in the thing that decides when to ask, and for which month.\n\n**Bridge:** Parts I to V, in which a customer starts each payment and the question is whether it was approved, recorded and safe; and the reader's own experience of a subscription that renewed unnoticed or failed without explanation. → Payments that nobody present starts: a clock starts them, for a billing period, from a stored credential.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraphs p03 and p04; bullet 3 (where the public record puts that machine on each provider) is stated in p05.): Revenue needs a second state machine above payments, driven by the clock and by billing periods: it decides what is owed, for which period and when to ask, and hands the payment engine an invoice. It fails in time (late, twice, in the wrong period), and the party that holds the invoice is the one that can collect it as a debt, tax it and recognize it.\n\n**Roadmap** (paragraph p06):\n\n- Six chapters in the order of one billing period and what follows from it: the billing engine and its subscription state machine; counting usage before charging for it; the invoice, its collection and what happens when the first attempt fails; tax on the invoice; revenue recognition and the hand-off to finance; and the model in which the provider sells in its own name as the merchant of record. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | On 1 October 2026 Larkfield's renewal job hit a rate limit and 7,900 renewals slipped a day; the job marked them failed with no card charged, and an email job that could not tell a decline from a card never charged sent failure notices; on 1 November a timed-out call retried under a new idempotency key charged 1,840 members twice (€71,300 refunded, 212 disputes anyway); every card payment in both months did what it was asked, so the fault was in the thing that decides when to ask and for which month. | scenario: Larkfield (fictional): the Renewal Wave of 1 October 2026 (7,900 renewals turned away before any card was charged, marked failed and delayed to the next day; an email job that could not tell a declined card from one never charged sent failure notices; ruling 37a) and the Double Charge of 1 November 2026 (1,840 members charged twice; €71,300 refunded; 212 disputes tations labeled 'Schedule', 'Count', 'Collect', 'Tax', 'Recognize', 'Seller'; a clock above the first station; a payment card icon below 'Collect'. | `cause_effect`: Payments started by a clock for a period. → What must exist for that to work, and how it fails: a second state machine whose output is an invoice, and three failures of time. |\n| p04 | analysis | Because the engine's output is the invoice, the party that holds the invoice is the one that can collect it as a debt, tax it and recognize it, so the first question to ask of a provider or a design is where the invoice lives. | reasoning: The part thesis and so_what: whoever holds the invoice is the only party that can collect it as a debt, tax it and recognize it; a team asks 'where does the invoice live?' before comparing features and, where the provider holds no invoice, budgets for a billing system of its own or a third party's. | `additional_support`: The invoice as the second machine's output. → Who can act on it, and the question that follows for any provider. |\n| p05 | context | As of November 2026 the public record puts the billing machine inside Stripe's platform and outside Adyen's, and the Adyen side is uneven: recurring token payments, payment-level retry and card updating are documented, the billing company Orb was acquired on 1 July 2026 with no integrated billing product documented by Adyen, no first-party invoicing, tax-calculation or recognition product was found (an absence in public sources, not a statement by Adyen), and on merchant of record (the provider sells in its own name) Adyen has stated that it does not act as one. | fact: As the chapters establish and cite: Stripe documents subscription, invoice, meter, tax and revenue-recognition objects on one platform; Adyen documents a stored token charged with a recurring processing model, Auto Rescue and Real Time Account Updater; Adyen's acquisition of Orb closed on 1 July 2026 and its article of 29 September 2026 speaks of integration in the future tense; searches on 17 November 2026 found no Adyen invoice object, tax product or revenue-recognition product.; fact: As chapter 32 cites: Adyen's article 'Merchant of record explained' (15 September 2026) states that Adyen does not act as a direct, third-party merchant of record. | `example`: The question 'where does the invoice live?'. → The answer the public record gives for Stripe and for Adyen, and the kind of evidence behind each part of it. |\n| p06 | transition | The six chapters follow one billing period and what follows from it, each opening on a Larkfield case: the engine, the usage count, the invoice and its collection, tax, revenue recognition, and the model in which the provider sells in its own name. | reasoning: The part's roadmap and flow rationale: the invoice is built up chapter by chapter; chapters 27 to 29 follow one billing period in the order it happens, 30 and 31 are the two calculations that read a finalized invoice, and 32 can be judged only after the obligations it takes over or leaves have been seen. | `sequence`: The claim, its consequence and the limits of the record. → The six subjects in reading order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the six chapters answers one question about the invoice (what produces it, what fills it, how it is collected, how it is taxed, when it counts as revenue, whose name is on it) and opens on one Larkfield case, and each relies on the chapters before it.\n\n**Advances the thesis** (P6-1, P6-2, P6-3, P6-4, P6-5, P6-6): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The six subjects in order (p06). → One paragraph per chapter: the question in bold, the Larkfield case and what is documented for Stripe and for Adyen.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. Chapter 27 defines the subscription, the period and the invoice; chapter 28 needs the period to say when usage stops counting toward it; chapter 29 needs both to explain what is frozen and what is collected; tax and recognition read the finalized invoice's lines and its credit notes, which chapter 29 owns; and merchant of record can be judged only after the reader has seen every obligation it takes over. Putting tax before invoicing would ask the reader to tax a document whose freeze has not been explained; putting merchant of record first would present a shortcut before the reader knows what it is a shortcut around.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | The billing-engine chapter answers what a billing engine does that a payment API does not: it is a scheduler, a price calculator and a subscription state machine whose output is an invoice; Stripe keeps it in its platform, Adyen documents a stored token charged with a recurring flag, and Larkfield turns out to run two engines, one of which nobody had called one. | scenario: Femke de Graaf's inventory of May 2027 (fictional): two billing engines, Stripe Billing for studio plans and the booking app's renewal job for member memberships, whose schedule was a cron expression and which kept no record of a period's debt.; fact: As chapter 27 documents: Stripe has a Subscription object with eight statuses and generates an invoice for every billing period; Adyen's documentation describes 'Subscription' as a processing model on a token payment that the merchant initiates. |  |\n| p08 | description | The metering chapter answers how to bill for usage when events arrive late and twice: three time rules (how long an event is accepted, when the invoice closes, how a wrong event is corrected) are fixed before the first invoice, as Studio Noord's March 2027 invoice shows, with 1,240 messages sent and 1,324 billed. | scenario: Studio Noord, March 2027 (fictional): 1,240 text messages sent, 1,324 billed; 180 events re-sent without an identifier of Larkfield's own and 96 reported after the invoice was finalized.; fact: As chapter 28 documents: Stripe's meters accept events up to 35 days old and bill them only until the invoice is finalized after a grace period of 1 to 72 hours; both providers bought a usage engine in 2026 (Stripe completed Metronome on 14 January, Adyen closed Orb on 1 July). | `contrast`: Chapter 27's prices, known the moment the period starts. → An amount that is unknown until the period ends, counted from events. |\n| p09 | description | The invoicing chapter answers what happens between owed and paid when the first attempt fails: a finalized invoice is frozen and collected as one debt through as many attempts as it takes, so Stripe retries an invoice it holds while Adyen's Auto Rescue retries a payment tied to the billing cycle by the merchant's reference; the case is Mila Janssen's €49.00 renewal, declined on 1 April 2027 and paid on 4 April. | scenario: Mila Janssen's €49.00 membership renewal (fictional): declined on 1 April 2027 for insufficient funds, attempted again on 4 April and approved; one period record, two attempt rows.; fact: As chapter 29 documents: Stripe's Smart Retries retry an invoice, by default up to 8 times within 2 weeks on new accounts; Adyen's Auto Rescue retries a refused merchant-initiated payment and asks for a merchantOrderReference that represents the billing cycle. | `sequence`: The amount owed for a period, fixed by plan or counted from usage. → The step from owed to paid. |\n| p10 | description | The tax chapter answers how much of indirect tax a payment provider can do: it can calculate, because its invoice holds the facts, but calculating is one of four steps and the liability stays with the seller; Stripe Tax returns zero where no registration is recorded, as two Larkfield invoices with the same €0.00 tax line and different reasons show, and no first-party Adyen tax engine was found (ruling 38). | scenario: Three Larkfield invoices of May 2027 (fictional), two with a tax line of €0.00: Cologne, a reverse charge, and Leipzig, where no German registration was recorded.; fact: As chapter 30 documents: Stripe names four steps (know where tax is due, register, calculate and collect, file and remit) and its calculation returns zero tax without a registration; searches on 17 November 2026 found no Adyen product that calculates, collects or files tax on a merchant's sales. | `elaboration`: The finalized invoice, frozen for tax reasons. → One line on it: the tax amount. |\n| p11 | description | The recognition chapter answers how invoices become revenue and where a billing system should stop: each invoice line gets a service period, its amount is deferred and released as the service is delivered, and billing should stop where contracts stop matching invoices; Ironworks Climbing's €1,890 annual plan is €144.99 of February revenue, Stripe documents a recognition ledger over its own invoices, and none was found for Adyen. | scenario: Ironworks Climbing's annual plan (fictional): €1,890 paid on 1 February 2027; €144.99 recognized in February (28 days of 365).; fact: As chapter 31 documents: Stripe Revenue Recognition treats each invoice line item as its own performance obligation and amortizes it evenly over the line's period; Adyen's reports describe transactions, and no revenue-recognition product was found in its documentation index on 17 November 2026. | `similarity`: Tax, a reading of the invoice lines by place. → A second reading of the same lines, by period. |\n| p12 | description | The merchant-of-record chapter answers what changes when the provider is the merchant of record: it sells in its own name, so its name goes on the statement and the invoice and it takes over the indirect tax and the handling of fraud and disputes, for a fee and control of the checkout, while under Stripe's terms the cost of disputes and refunds stays with the business; that makes it an operating model that a platform cannot use; Stripe's Managed Payments costs 3.5% on top of payment fees and excludes Connect platforms, Adyen states that it is not a merchant of record, and Femke answers her chief executive's question with no, twice. | scenario: May 2027 (fictional): Sofie Vermeer asks whether Larkfield can make its provider the merchant of record; Femke de Graaf answers no for both kinds of sale, because the studios are the sellers of classes and the fee on Larkfield's own €24.5M of subscriptions would be €857,500 a year.; fact: As chapter 32 documents: Stripe's Managed Payments, in a release version of the API since 22 April 2026, costs 3.5% per successful transaction on top of payment fees, takes fully automated digital products sold directly and does not support Connect platforms; Stripe's service terms (last modified 28 September 2026) keep the business liable for the full amount of disputes, refunds and reversals; Adyen's article of 15 September 2026 says it does not act as a direct, third-party merchant of record. | `problem_solution`: The obligations chapters 27 to 31 leave with the seller. → A model that moves some of them by changing who sells to the customer. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the six chapters build one document, the invoice, from the scheduler that produces it to the name printed on it, so a billing fault can be placed by asking which chapter's step went wrong and whether it was late, twice or in the wrong period.\n\n**So what:** Faced with a billing incident or a provider's billing feature, the reader asks first what period the charge was for and which system holds its invoice.\n\n**Callback:** The opening's two renewal incidents of 1 October and 1 November 2026 (p01). The reader is told that the first chapter starts from the second of them and names the missing record.\n\n**Takeaway** (`course_of_action`): Begin with the billing-engine chapter, which says what the thing that decides when to ask is made of.\n\n**Hand-off** to [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html): `elaboration`: The part intro's claim that something above the payment decides when to ask and for which month, shown by Larkfield's late and doubled renewals. → What that something is made of: a scheduler, a price calculator and a subscription state machine, with the invoice as the object it hands to the payment engine.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | synthesis | The six chapters let a reader place a billing fault at one step of the invoice's life and name it as late, twice or wrong period; the first chapter starts from the doubled November renewals and names the record that was missing. |  |  |\n\n## Non-goals\n\n- Teaching the billing engine, metering, collection, tax, recognition or merchant of record; the page summarizes and does not re-argue the chapters. See [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html), [Counting Before Charging: Usage Metering and Rating](usage-metering-and-rating.html), [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html), [Whose Tax, at What Rate: Tax Calculation in the Payment Path](billing-and-payment-tax.html), [Cash Is Not Revenue: Revenue Recognition and the Hand-off to Finance](billing-revenue-recognition.html), [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html).\n- The part's closing (every chapter was about one document; Keel decisions K1 and K5 as billing-engine decisions; the course of action). See [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure-pattern callout and Questions to Ask; part intros do not carry them (style guide).\n- External factual claims of the page's own; every company, network and regulatory statement repeats a chapter of the part, which cites it.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The closing sentence 'Begin with …' sits under its own heading, 'Where to Begin', as the conclusion's one paragraph, as the Part I and II introductions do. Rejected: Ending the 'Chapters in this part' section with it: the draft checker reads a conclusion only from a heading of its own.\n- **2026-11-17** — On merchant of record the page says Adyen states that it is not one, as chapter 32 found (Adyen's article of 15 September 2026), and keeps 'not found in public sources' for invoicing, tax and revenue recognition only. Rejected: Repeating the journal entry's wording that no first-party Adyen merchant-of-record product 'was found in public sources': true, but weaker than what chapter 32 establishes, and it would present a published statement as an absence.\n- **2026-11-17** — The third failure of time is given its Larkfield case (the €1,890 annual plan) in the claim paragraph, so that late, twice and wrong period each have numbers before the chapter list. Rejected: Leaving 'wrong period' abstract until chapter 31's paragraph.\n- **2026-11-17** — The Keel answers (K1, K5) are left to the part's closing in chapter 32. Rejected: Naming them in the opening, which would pre-empt the callback.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-6: thesis, opening, flow, transition_in; post entry part-6) — Intent, thesis, role, hook, bridge, roadmap and the order of chapters.\n  - _research/scenario-ledger.md — The Renewal Wave and the Double Charge with their figures, Mila's renewal, the annual plan, and the additions by chapters 27 to 32.\n  - posts/27-subscriptions-and-billing-engines, 28-usage-metering-and-rating, 29-invoicing-collections-and-dunning, 30-tax, 31-revenue-recognition, 32-merchant-of-record (index.md, read in full) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n  - _research/consistency-issues.md (rulings 20, 21, 22) — The Orb closing date (1 July 2026) and the date of Adyen's Orb article (29 September 2026); no weekday named for the Silent Webhook; no external URLs in the running text.\n\n## Changelog\n\n- **2026-11-17** — Spec created from the journal spec and the six written chapters of Part VI.\n- **2026-11-17** — After the flow rubric: p05 now glosses merchant of record and identifies Orb as a billing company, so it stands on its own. Notes not acted on: merging the roadmap paragraph (p06) into the chapter list, because the style guide and AC-1 ask for the reading order in the lead; thinning p05 to the rule alone, because AC-4 of the part needs the documented Adyen items named before the chapters; 'wrong period' has no opening incident, and p03 gives it its own Larkfield case (the annual plan) instead.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Reconciled with chapter 32's verification pass, after the journal-spec fragment part-6.json was corrected first. Re-synced the copied fields (intent.outcome know[2], part thesis how_why, supporting claim P6-6). Corrected the page's own fields: the roadmap promise and p05, p06 and p12 no longer say that the provider takes the dispute liability or is the legal seller (under Stripe's terms the handling of disputes moves and their cost stays with the business), and p12's evidence gives Managed Payments as in a release version of the API since 22 April 2026. No section or paragraph was added, dropped, merged or reordered. Any earlier check report is stale.\n- **2026-11-17** — Verification pass: 32 claims checked against chapters 27 to 32, their verification files and rulings 18 to 43 (25 agree, 7 corrected to match, 0 removed). Most significant fix: the merchant-of-record paragraph no longer says the provider resells and takes the dispute liability (chapter 32, Stripe's terms); also the two-step account of the 7,900 emails (ruling 37a), 'first-party' on Adyen's tax and billing products (rulings 38, 39b) and KEY POINT 3. Wording inside units only; p01, p05 and p10 controlling ideas brought into line.\n- **2026-11-17** — Absence audit: the two Adyen absences (no integrated billing product documented; no first-party invoicing, tax-calculation or revenue-recognition product found) re-tested with chapters 27, 30 and 31 against the documentation full text, sitemaps and web search: hold, no change to the page.\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
