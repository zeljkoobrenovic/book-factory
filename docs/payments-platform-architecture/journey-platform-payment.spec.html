that way.\n- **Be able to:** Trace a refund made after payout to the balance it is debited from and the party that covers a shortfall, on either provider.\n- **Be able to:** List what a platform must decide before its first late refund: the refund split, what happens to its own fee, who bears the processing cost, and how a seller's shortfall is recovered and recorded.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a refund after payout on a platform the chapter does not contain, the reader says which balance is debited, who covers a shortfall on each provider and what the platform should have decided and recorded beforehand. *Probe:* A tutoring platform takes card payments from parents and pays each tutor daily. A parent is refunded €60 for a lesson that was paid out to the tutor four days earlier; the tutor has since stopped using the platform and has no further sales. Using only this chapter: where does the €60 come from on Adyen for Platforms and on Stripe Connect, and what should the platform have decided and recorded before this happened? | `custom` | cold_reader | major |\n| AC-2 | The reader can say why the provider's processing cost is not a fixed line in the split and who bears it by default on each provider. *Probe:* A platform wants every payment split into exactly three known amounts at the moment of payment: the seller's share, the platform's fee and the provider's cost. Using only this chapter: why can it not always know the third amount at that moment, and who pays it by default on Adyen and on Stripe? | `custom` | cold_reader | major |\n| AC-3 | Every step that names an Adyen resource names the Stripe counterpart, and the chapter says once that the pairing is the book's own mapping, since neither company publishes one. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How is Mila's €120 divided among Studio Noord, Larkfield and the provider, and whose money pays the €84 refund on 18 March, a week after the studio was paid?\n\n> **Claim:** Mila's €120 is divided by an instruction attached to the payment into €117.47 for Studio Noord and €2.53 for Larkfield, and the provider's cost (an illustrative €0.61) comes out of Larkfield's share, leaving it €1.92. The €84 refund of 18 March is debited from a balance out of which that €117.47 was already paid on 11 March, and the platform's account model, chosen long before either date, decides whose balance goes short and who stands behind it. On Adyen a refund is debited from the balance accounts the payment credited, and Larkfield's liable balance account covers a studio balance that goes negative; on Stripe the charge type decides whether the studio's or the platform's balance is debited first.\n\n**Disputed by:** The view that a platform only passes money through: once the split is correct and the studio has been paid, the payment is the studio's business, a later refund is the studio's refund, and a platform that never holds funds carries no balance risk.\n\n**So what:** A platform that accepts this decides the refund split, the fate of its own fee and the recovery of a seller's shortfall before the first late refund, keeps its own figure per seller for money paid out that can still come back, and books a refund after payout as its own ledger entry. Refunds after payout were one of the three causes of Larkfield's unexplained €412,000 at year-end 2025, and Keel's K3 makes every such movement an entry.\n\n**How and why:** Money moves forward on the provider's schedule and backward on the customer's, so the two meet in a balance at different times. On Adyen, as documented in 2026, a split is a list of typed bookings declared at authorization or capture (the user's balance account, the platform's commission, the fee types); the provider's own fees are calculated after the request and by default fall on the liable balance account; refunds 'can only be deducted from the balance accounts to which the payment was credited', and the result arrives later by webhook; funds can be deducted from the liable balance account when a user's balance account goes negative through refunds or chargebacks; and an instruction that names a missing or closed balance account is not rejected but booked in full to the liable account. On Stripe a platform fee is an application fee on the charge or a transfer after it; a refund on a direct charge debits the connected account, a refund on a destination charge debits the platform, which must reverse the transfer to recover it; a refund against a short balance waits as pending and fails after 45 days; and a connected account's negative balance is collected from its bank account first and, where the platform is responsible, from a platform reserve after 180 days. Adyen documents a negative balance for up to 30 days before the platform's reserved compensation account is debited, and an arrangement in which Adyen itself bears the loss only as a pilot (Managed Risk), so the walkthrough states the default and names the pilot.\n\n**Supporting claims**\n\n- **S1** — The split is an instruction attached to the payment request (typed bookings on Adyen, an application fee on a destination charge on Stripe), it depends on an account state set before the sale, and the approval of the payment does not confirm that the bookings landed where the instruction said.\n- **S2** — The provider's cost is not a line in the split: on Adyen it is calculated after the request and booked by fee type, by default to the liable balance account; on Stripe it follows from the charge type and fee configuration and is reported on the balance transaction; so Larkfield's €2.53 becomes €1.92 only when the cost is reported.\n- **S3** — Money moves forward on the provider's schedule and backward on the customer's: the payout of 11 March emptied the balance that the refund of 18 March is debited from, so the refund is funded by something other than the payment it refunds.\n- **S4** — The account model chosen at integration decides whose balance goes short and who stands behind it: on Adyen the balance accounts the payment credited, with the liable balance account behind them; on Stripe the charge type, with a published order of collection; and Adyen documents 30 days before the platform's liable account is debited, with a pilot in which Adyen takes the loss.\n- **S5** — The journey runs without loss only where each hand-off is followed by a later record and the platform has decided beforehand: the refund split, its own fee, the processing cost and the recovery of a shortfall, with an exposure figure per seller and a ledger entry per leg.\n\n## Role in the part\n\nOpens the split and payout rows of Journey 1 into a full platform journey in both providers' vocabularies and then reverses it, showing the first backward flow of the part and the point at which the account model becomes the liability model. Supports P9-3, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `problem_solution` in scene poses the question; the steps answer it; decisions turn the answer into what to set beforehand; `comparison` in inside each step: Adyen as it happened, Stripe as it would have)\n\nA journey is read in the order the payment meets its steps, because each hand-off is only visible when the step before it has just been told: the capability state before the instruction that relies on it, the instruction before the bookings, the payout before the refund that finds the balance empty, the actual refund before the shortfall that did not happen. The ledger and the step table come after the steps because they summarize them, and the decisions come last because each is the answer to a failure the reader has by then seen. Telling the refund first, as the hook does, and then the forward steps works only for one paragraph; a reader who met the shortfall before the payout would not know why the balance was empty. Moving the ledger before the refund would list an entry for a movement the reader has not seen; moving the step table before the steps would fill its rows with terms not yet glossed; moving the decisions before the table would ask for four choices before the failures they prevent have been set side by side.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On Thursday 18 March 2027 Ines Bakker approves an €84.00 refund for Mila Janssen. The €117.47 Studio Noord received for Mila's pass went to its bank a week earlier, and Larkfield, the platform between them, never held any of it. Whose money goes back to Mila?\n\n**Bridge:** An engineer who has built a split sees a platform as a pipe: compute the shares, pass the money through, and the seller's later refund is the seller's business. → The refund is debited from a balance at the provider that the payout already emptied, and which balance that is, and who stands behind it, was fixed by the account model at integration.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p03): Mila's €120 is divided by an instruction attached to the payment into €117.47 for Studio Noord and €2.53 for Larkfield; the €84 refund of 18 March is debited from a balance out of which that €117.47 was already paid, and the platform's account model, chosen long before either date, decides whose balance goes short and who stands behind it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p06):\n\n- Start from the question Larkfield's support lead asked on 18 March and the three answers it got. *Kept in:* scene.\n- Begin the journey before the sale, with the state that lets the studio take payments and be paid. *Kept in:* before-sale.\n- Follow the €120 through the split, the platform's fee and the provider's cost on 9 March. *Kept in:* split.\n- Follow the studio's share into its balance and out to its bank on 11 March. *Kept in:* claim-and-payout.\n- Follow the €84 refund of 18 March to the balance it is debited from, and then to the short nswer it.\n\n**Transition in:** `example`: The question of whose money pays the €84. → The people who asked and answered it at Larkfield on 18 March 2027.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | Product said the studio pays, finance said Larkfield and the CTO said the provider, and each answer was true of one step: the refund policy, the ledger account for money to recover, and the balance that holds the money. | scenario: 18 March 2027: Ines Bakker approves the €84.00 refund; Aylin Demir asks 'whose money pays this?'; product cites Larkfield's terms, finance the ledger account 'to recover from studio', Daniel Osei the provider that holds the money; none had read the provider configuration. |  |\n| p08 | process | Femke de Graaf answers by walking the one payment through eleven steps on five dates, starting before the sale, and the figure shows that walk as a sequence. | figure: Sequence figure: member, platform, provider's books and the studio's bank as lanes; forward arrows on 9 and 11 March, backward arrows on 18 March; amounts €120.00, €117.47, €2.53 and €84.00. | `problem_solution`: Three answers that do not add up to one. → The method: follow one payment in order, with every hand-off. |\n\n### Before the Sale: Studio Noord May Take Payments and Be Paid\n\n**Controlling idea** (`process`, id `before-sale`): The payment of 9 March depends on a state set long before it, the studio's verified capabilities, and that state can lapse without the next payment failing in an obvious way.\n\n**Advances the thesis** (S1): Step 1: the account the split instruction will name has to exist and be allowed, and the instruction does not check that.\n\n**Transition in:** `sequence`: The decision to start before the sale. → Step 1: the studio's verification and capability state.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | process | Step 1 is a state, not an event: Studio Noord could take Mila's payment and be paid for it because its capabilities to receive payments and to pay out to its bank account were allowed by Adyen and enabled by Larkfield, which on Stripe is a capability whose status is active. | quotation: Adyen capabilities page: 'The capability can only be used when it is both allowed and enabled'; capabilities receivePayments ('Allows users to receive payments using a payment method') and sendToTransferInstrument ('Allows users to transfer funds to verified bank accounts'). Stripe: 'A capability must be active for a connected account to perform actions associated with that capability.' |  |\n| p10 | cause_effect | The hand-off from that state to a payment fails quietly: payouts are switched off a month before payments, and on Adyen a split that names the balance account of a closed account holder is booked to the platform without an error. | fact: Adyen's standard verification deadlines: a 30-day period for sendToTransferInstrument and a 60-day period for receivePayments; 'If the user does not resolve the verification issues in a timely manner, their capabilities will be disallowed.' Split pages: if the balance account 'is linked to an account holder with a closed status, the full transaction and its fees are booked to your platform's liable balance account.'; scenario: The Frozen Studios, May 2026: 230 studios on Stripe Connect missed a verification deadline and went up to 12 days without payouts. | `contrast`: The state that made the payment possible. → What happens to the next payment when that state lapses. |\n\n### 9 March, 19:42: One Instruction, Two Bookings and a Cost That Arrives Later\n\n**Controlling idea** (`process`, id `split`): The division of the €120.00 is an instruction that travels with the payment request and books two amounts; the approval does not confirm the bookings, and the provider's cost is not one of them.\n\n**Advances the thesis** (S1, S2): Steps 2 to 4: the split instruction, the platform's fee and the processing cost, each with its hand-off, on both providers.\n\n**Transition in:** `sequence`: A studio that is allowed to take the payment. → Steps 2 to 4: the payment and the instruction that divides it.\n\n**Order of paragraphs** (`chronological`): The instruction is sent, then answered, then the cost is booked; the paragraph on what the approval does not confirm has to follow the instruction it is about, and the cost has to come last because it is the only amount that arrives after the payment.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | process | Steps 2 and 3: the division is written before the payment, as an instruction inside the payment request, which on Adyen is two typed split items and on Stripe a destination charge that names the studio and an application fee. | table: The instruction in two vocabularies. Adyen: splits item BalanceAccount, 11747, Studio Noord's balance account; item Commission, 253, booked to the liable balance account; platformChargebackLogic for a later chargeback. Stripe: destination charge of €120.00 with on_behalf_of the studio, transfer_data[destination] the studio's connected account, application_fee_amount 253.; quotation: Adyen: BalanceAccount 'Books a part of the transaction to your user's balance account'; Commission 'Books your platform's commission to your liable balance account'. Stripe: 'the full charge amount is immediately transferred from the platform to the transfer_data[destination] account after the charge is captured. The application_fee_amount (capped at the full amount of the charge) is then transferred back to the platform.' |  |\n| p12 | analysis | The answer 'Authorised' at 19:42 reports the issuer's approval and that the instruction was well formed; it does not report that €117.47 reached Studio Noord's balance account, which only the transfer webhooks and the accounting report show. | quotation: Adyen 6 | process | Step 5: on 10 March the €117.47 is a claim on Adyen with a date set by Adyen's schedule, not by the card network, and the hand-off from booking to payable is that date. | quotation: Adyen settle-funds page: 'Adyen settles a settlement batch after its sales day ends and the configured settlement delay has passed. The date when the schemes or payment methods transfer the funds to Adyen does not affect this timing.' The accounting report distinguishes a booking date from a value date. Stripe's Dutch default is 3 business days.; scenario: Studio Noord's sales day closes at midnight with a two-business-day delay; on 10 March Ines's ticket reads 'It says paid. Paid to whom?'; on Stripe's Dutch default the funds would have become available on Friday 12 March. |  |\n| p17 | process | Step 6: on 11 March the payout leaves, and what the provider reports is that it sent the money; in the best case the money lands that day; Larkfield marks the payout sent and sets the record state arrived only on 25 March, when ten business days have passed without a return, which is not the date of the credit. | quotation: Adyen payout webhooks page, on booked: 'This status is not final.' Stripe Payout object: 'Some payouts that fail might initially show as paid, then change to failed.'; scenario: The payout carrying Mila's €117.47 is marked sent on Thursday 11 March 2027 and arrived on Thursday 25 March; a sent payout stays open for 10 business days (Larkfield's policy, an assumption). | `sequence`: A claim that became payable. → The payout, and what its status reports. |\n| p18 | analysis | The payout closes nothing about the payment: money moves forward on the provider's schedule and backward on the customer's, so from 11 March the studio's balance no longer contains Mila's money while the €117.47 can still come back until about 7 July. | reasoning: Payout two days after the sale; refunds whenever the studio agrees; basic card dispute window of about 120 days, to about 7 July 2027.; figure: Conceptual figure: a tray filled on 9 March and emptied on 11 March; a refund arrow arriving on 18 March at the empty tray. | `cause_effect`: A balance emptied on Thursday 11 March. → What stays open after it: the amount that can still come back. |\n\n### 18 March: €84 Goes Back Through a Balance the Payout Emptied\n\n**Controlling idea** (`process`, id `refund`): The refund is a new instruction, written from a policy decided beforehand, and it is debited from the balance the payment was booked to, which by 18 March holds other members' payments.\n\n**Advances the thesis** (S3, S4): Steps 7 and 8: the refund request and the debit, with the rule on each provider for which balance pays.\n\n**Transition in:** `time`: A balance emptied on 11 March with exposure left behind. → A week later, steps 7 and 8: the first money in the part that goes backward.\n\n**Order of paragraphs** (`chronological`): The reader has to see the instruction before the rule that bounds it, and the rule before the actual outcome at Studio Noord; the platform's fee and the refund's confirmation are consequences of the outcome and cannot come earlier.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | process | Step 7: Mila asks, Ines approves, and the payment service sends a refund that carries its own instruction, written from a policy Larkfield set beforehand: the studio funds the refund and Larkfield keeps its fee. | table: The refund instruction in two vocabularies. Adyen: refund of 8400 on the original payment's PSP reference with one split item, BalanceAccount, 8400, Studio Noord's balance account. Stripe: refund of 8400 on the charge with reverse_transfer=true and without refund_application_fee.; quotation: Adyen: splitting a refund 'allows you to choose who is liable for the refund.' |  |\n| p20 | cause_effect | The hand-off that fails here is a refund sent without its instruction, and on both providers the default then puts the whole amount on the platform. | quotation: Adyen, how split instructions are applied (pilot, not available for all platforms): a refund without instructions is checked against a split configuration profile and a default refund logic first, then uses the capture's split ratio only for a full refund of one capture; 'In all other cases, such as for refunds of partial captures, we book the full refund amount to your platform's liable balance account.' Stripe: 'by default the destination account keeps the funds that were transferred to it, leaving the platform account to cover the negative balance from the refund.' | `contrast`: The refund with its instruction. → The same refund without one. |\n| p21 | explanation | Step 8: the debit lands on the balance the payment was booked to, not on the payment: on Adyen a refund can be deducted only from the balance accounts the payment credited, and on Stripe a refund of a destination charge debits the platform's balance, which recovers by reversing a proportional part of the transfer. | quotation: Adyen: 'Refunds can only be deducted from the balance accounts to which the payment was credited.' Stripe: 'Stripe debits your platform balance for the refund amount. You can reverse the transfers made to your connected accounts to recover your refund cost'; with reverse_transfer, 'If the refund results in the entire charge being refunded, the entire transfer is reversed. Otherwise, a proportional amount of the transfer is reversed.' Direct charges: 'Stripe debits the refund amount from the connected account's balance directly when you create a refund.'; reasoning: €84.00 is 70% of the €120.00 transferred; a proportional reversal is €84.00 (the author's arithmetic). | `sequence`: A refund request and its instruction. → Where the provider debits it. |\n| p22 | example | What paid Mila on 18 March was €84.00 of the €212.40 that other members had paid Studio Noord since the payout, so the refund showed up only as a next payout that was €84.00 smaller. | scenario: On 18 March Studio Noord's balance account held €212.40 of later sales (assumption); the refund was netted and the next payout was €84.00 smaller. Adyen settles net of the day's refunds and chargebacks. | `example`: The rule for which balance is debited. → What that balance held on the day. |\n| p23 | analysis | The fate of the platform's fee is a separate decision inside the refund: under Larkfield's policy the studio keeps €33.47 for three classes sold at €36.00 and Larkfield keeps the full €2.53, and each provider has a parameter that would have changed that. | reasoning: €120.00 for ten classes is €12.00 a class; three classes taken = €36.00; the studio received €117.47 and gives back €84.00, keeping €33.47; Larkfield's fee stays €2.53 (the author's arithmetic on ledger figures).; quotation: Stripe: 'When refunding a charge with an application fee, by default the platform account keeps the funds from the application fee'; with refund_application_fee=true on a partial refund 'you refund a proportional amount of the application fee'. Adyen refund split type Commission: 'deducts the amount of your platform's commission for the original payment from your liable balance account.' Stripe: 'Stripe's processing fees from the original transaction aren't returned.' Adyen's split-refund page does not say the original fees are returned; it lists fee items for the refund itself. The 70% and the €1.77 are the author's arithmetic. | `additional_support`: A refund funded by the studio's later sales. → What happened to Larkfield's own €2.53. |\n| p24 | analysis | An accepted refund is again a promise: Adyen's REFUND webhook says the request was sent to the card network, Stripe's Refund object can stay pending or fail, and the refund's row in Larkfield's record stays open until the provider's later record confirms it. | quotation: Adyen: 'You get the outcome of the refund request asynchronously, in a REFUND webhook'; success true means 'we sent the refund request to the card scheme. However, the card scheme can still reject the refund. This can happen even a few days after you submit the refund request.' Stripe: a refund against a short balance is pending and 'fails with a failure_reason of insufficient_funds' after 45 days. | `contrast`: A refund that was debited. → Whether it has reached Mila, and how Larkfield learns that. |\n\n### Had the Balance Been Empty: Who Goes Short, and How the Money Is Recovered\n\n**Controlling idea** (`analysis`, id `shortfall`): When the debited balance cannot pay, the account model decides who is short and who stands behind them: on Adyen the studio's balance account with Larkfield's liable balance account behind it, on Stripe by charge type, and Adyen documents 30 days before the liable account is debited and one pilot in which it takes the loss.\n\n**Advances the thesis** (S4): Steps 9 and 10: the shortfall and its recovery on both providers, and where the evidence stops.\n\n**Transition in:** `contrast`: A refund that later sales covered. → The same refund against a studio with no later sales: steps 9 and 10.\n\n**Order of paragraphs** (`prerequisite_order`): Who is short on Adyen, then on Stripe, has to be known first. What Adyen documents about the period and the pilot follows at once, because it qualifies the Adyen answer and is read against the Stripe timeline just given; moved later, the reader would take the Adyen default for the whole story. Recovery comes after it and runs into the exposure figure, which is the platform's response to recovery routes that can all fail.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | explanation | Step 9 on Adyen: had Studio Noord stopped selling after 11 March, Mila would still have been refunded, the studio's balance account would stand at minus €84.00, and Larkfield's liable balance account is the account Adyen documents as standing behind it. | quotation: Adyen account structure: 'Liable balance account: the account where your business' funds are held. Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks.' |  |\n| p26 | comparison | On Stripe the charge type decides who is short: with Larkfield's destination charges the platform's balance has already paid and the reversal of the transfer errors when the studio's balance is short, while with a direct charge the studio's connected account is debited and a short balance holds the refund as pending for up to 45 days; a connected account that does go negative is collected from its bank account first, and the loss then falls on whoever is responsible for that account's negative balances. | quotation: Stripe: 'If the refund request also attempts a transfer reversal, but the connected account has an insufficient balance, the refund request returns an error instead of creating a refund with pending status'; 'Stripe first attempts to offset the negative amount by collecting funds from the account's external account'; 'if a connected account's balance remains negative for 180 days, we transfer funds from the platform reserve to cover the negative amount.'; table: Who is short and who stands behind: Adyen (studio's balance account; liable balance account); Stripe destination charge (platform's balance; nobody behind it, the platform must reverse the transfer); Stripe direct charge (connected account's balance; the refund waits as pending for up to 45 days; for a negative balance Stripe or the platform by the account's loss responsibility).; figure: Two-panel figure, Provider A (Adyen) and Provider B (Stripe, destination charge): the refund debits the seller's tray with the platform's tray behind it, or the platform's tray first with a reversal arrow to the seller's tray. | `contrast`: Adyen's answer: the studio's balance account, with the liable balance account behind. → Stripe's answer, which depends on the charge type. |\n| p27 | analysis | Adyen publishes a shorter period than Stripe's 180 days and names the account: a balance account may be negative for up to 30 days and is then compensated from the platform's reserved compensation account on the first day of the following month; one arrangement in which Adyen takes the loss, Managed Risk, is documented as a pilot with limited availability; no price list for platforms is published. | source: Adyen, Manage liable balance accounts: 'Adyen allows negative balances for up to 30 days. If a balance account has a negative balance for more than 30 days, Adyen compensates this by debiting your reserved compensation account on the first day of the following month.' Adyen Managed Risk (pilot, limited availability): Adyen will 'assume the responsibility for negative balances'. Adyen pricing page: 'Other Adyen products, besides payment methods, are priced separately.' Stripe risk-management page: Stripe or the platform responsible per account; 180-day transfer from the platform reserve. | `contrast`: Stripe's published order of collection and its 180 days. → What Adyen documents about the same shortfall: a period, an account and a pilot. |\n| p28 | process | Step 10: the money comes back from the studio by netting against later sales, by a debit of its bank account or by a movement between balances, and the second route needs a consent that was given before the shortfall and can itself be reversed. | quotation: Adyen top-ups: 'To cover negative balances resulting from refunds or chargebacks'; for SEPA accounts 'your users must first accept a mandate that authorizes you to debit their accounts', which they 'only need to accept ... once', and whose recommended text says 'You must claim a refund within 8 weeks from the date your account was debited.' Stripe: debit_negative_balances; account debits require 'legally binding consent'; 'If at all possible, Stripe automatically offsets negative transactions against future payments.' | `sequence`: A balance that went short, and a record that does not say when the platform pays for it. → Step 10: how the money is got back from the studio. |\n| p29 | recommendation | Because the shortfall is decided by sales that have not happened yet, Larkfield keeps its own figure per studio for money paid out that can still come back: about €64,000 for Studio Noord and about €156 million across the platform. | statistic: Exposure = online card volume paid out in the last 120 days less refunds and disputes already booked; Studio Noord at €16,000 a month (assumption) ≈ €64,000; Larkfield ≈ €156 million (52% of €910M × 120/365). | `problem_solution`: Recovery routes that all need a studio that still sells or still has a bank account to debit. → The figure the platform keeps itself, so the shortfall is sized before it happens. |\n\n### What Larkfield's Ledger Records, Leg by Leg\n\n**Controlling idea** (`process`, id `ledger`): Every step that moved money is an entry in Larkfield's ledger under the provider's reference, written from the provider's report, and the reconciliation of those entries, run on each provider's report-ready signal, is the later record that catches each failed hand-off in this journey.\n\n**Advances the thesis** (S5): Step 11: the platform's own record of every leg and the check that confirms the earlier promises.\n\n**Transition in:** `sequence`: Ten steps at the provider. → Step 11: the same steps in Larkfield's own books.\n\n**Order of paragraphs** (`prerequisite_order`): The entries are listed first, then the source they are written from and the job that checks them, then the same entries replayed against 2025; the replay needs both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | process | Step 11: under K3 each leg of the journey is its own entry, keyed by the provider's payment reference and Larkfield's event id, and the refund after payout is an entry and not a changed status. | table: Entries: 9 March studio's share (funds at provider / owed to Studio Noord, €117.47); Larkfield's fee (funds at provider / fees owed to Larkfield, €2.53); provider's cost when reported (fees owed to Larkfield / funds at provider, €0.61, assumption); 11 March payout sent (payouts in transit / funds at provider, €117.47); 25 March payout marked arrived (owed to Studio Noord / payouts in transit, €117.47); 18 March refund, balance covers it (owed to Studio Noord / funds at provider, €84.00); refund, balance empty (to recover from Studio Noord / funds at provider, €84.00). |  |\n| p31 | explanation | The entries are written from the provider's report lines, not from webhooks, and the reconciliation job, run on each provider's report-ready signal, matches each leg against the provider's own bookings (on Adyen the Balance Platform Accounting Report, marked as required for full financial reconciliation), so a split booked to the wrong account, a refund sent without its instruction or a recovery that came back surfaces as an open item with an owner. | scenario: K3: the reconciliation job runs per provider on its report-ready signal and writes ledger entries only from report lines; matching keys are the payout ID on Stripe and, on Adyen, the balance platform's daily report per studio; an item open more than five business days goes to Priya Raman's weekly review. | `elaboration`: The entries. → What they are written from and what checks them. |\n| p32 | example | The refund row is the entry Larkfield lacked in 2025: refunds after payout were €317,200 of the €412,000 its books could not explain, each of them a debit at a provider with no entry at Larkfield. | statistic: The Unexplained €0.4 Million at year-end 2025: €412,000, of which refunds after payout €317,200, chargeback fees €73,500, conversion rounding €21,300. | `example`: A ledger with an entry per leg. → The year Larkfield ran without one. |\n\n### The Journey in One Table: Eleven Steps and What Each Promises\n\n**Controlling idea** (`synthesis`, id `step-table`): Set side by side, the eleven steps show that every failure in this journey sits at a hand-off and is reported later by a different record, which Adyen delivers as events and report lines and Stripe as objects with a status.\n\n**Advances the thesis** (S5, S1, S3, S4): Collects the steps into the part's reading device and states what the column of failures has in common.\n\n**Transition in:** `conclusion_summary`: Eleven steps told one by one. → The same steps in one table, with party, record, promise and failure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | description | The table lists the eleven steps with the party or system that acts, the record it produces on Adyen and on Stripe, the promise that record makes and the failure that can occur there with the chapter that owns the mechanism. | table: Step table, columns Step \\| Party or system \\| Message or record \\| Promise made \\| What can fail here → chapter; rows: 1 capability state, 2 split instruction, 3 platform's fee, 4 provider's cost, 5 studio's balance, 6 payout, 7 refund request, 8 debit of the paid-out balance, 9 shortfall, 10 recovery, 11 ledger entries and reconciliation. |  |\n| p34 | analysis | Read down the last column, none of the failures is a mechanism breaking: each is one step's answer taken as final by the next, and each is caught by a later record on another channel, an event or report line on Adyen and a fetchable object on Stripe. | reasoning: The confirming records named in the sections: transfer webhooks and the accounting report for the split; the fee booking for the cost; the closed return window for the payout; the REFUND webhook or Refund status for the refund; the sign of the balance for the shortfall; the reconciliation for all of them. | `elaboration`: The table. → What its last column has in common. |\n\n### Four Decisions to Take Before the First Late Refund\n\n**Controlling idea** (`recommendation`, id `decisions`): Before its first refund after payout a platform has to decide the refund split, the fate of its own fee, who bears the processing cost and how a seller's shortfall is recovered and recorded, because each has a provider default that otherwise decides for it.\n\n**Advances the thesis** (S5, S4): Turns the journey into the list of decisions the thesis says the account model makes for a platform that does not make them.\n\n**Transition in:** `problem_solution`: Failures that sit at hand-offs. → The decisions that close the ones a platform controls.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | recommendation | Four decisions cover the backward half of the journey, and each is a parameter or an agreement on both providers: the refund split, the platform's fee, the processing cost, and the recovery of a shortfall with its consent, its exposure figure and its ledger account. | table: Decision \\| Larkfield's answer \\| Where it is set on Adyen \\| Where it is set on Stripe: refund split (studio funds; refund's splits item; reverse_transfer); platform's fee (kept; Commission item in the refund split; refund_application_fee); processing cost (Larkfield bears; fee split types, default liable account; charge type and fee configuration); shortfall (netting, then bank debit, booked to 'to recover from studio'; top-up under a mandate, internal transfer; debit of the bank account, account debit, transfer reversal). |  |\n| p36 | recommendation | Left undecided, each of the four still has an answer, and on both providers the default answer is the platform, which is why I treat the account model as the decision about who pays and write the four answers down before the first seller is onboarded. | reasoning: Defaults cited above: Adyen books unspecified amounts, fees and bare partial refunds to the liable balance account; Stripe leaves the transferred funds with the destination account and the application fee with the platform. | `cause_effect`: Four decisions with a named parameter each. → What happens when a platform does not take them: the defaults decide. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The forward half of a platform payment is finished in two days by instructions the platform wrote, and the backward half is decided by a balance on some later day; the only things that connect the two halves are the account model, which says whose balance is asked, and the platform's own ledger entry, which says that it happened.\n\n**So what:** A platform that reads its account model as a liability decision sets the refund split, the fee, the cost and the recovery before its first late refund and keeps an exposure figure per seller; one that reads it as plumbing meets the same decisions as a difference in its books, as Larkfield did with €317,200.\n\n**Callback:** Aylin Demir's question of 18 March, 'whose money pays this?', and the three answers it got. The reader can now give the one answer: other members' payments in Studio Noord's balance account paid it, Larkfield's liable balance account stood behind them, and each of the three earlier answers was one step of that.\n\n**Takeaway** (`course_of_action`): Walk one refund after payout through your own configuration before it happens: name the balance it debits, the party behind that balance, the parameter that sets each of the four decisions, and the ledger entry it writes.\n\n**Hand-off** to [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html): `contrast`: Journey 3's refund: money going back because the member asked and the studio agreed, debited from a balance that had been paid out, with the account model deciding who covers the gap. → Money going back because the cardholder's bank says so: the same balances and the same question of who covers the gap, with nobody on the merchant side having agreed, a fee, a deadline and a count that the refund did not have.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | synthesis (list) | Established: a split is an instruction on the payment whose approval does not confirm the bookings; the provider's cost arrives after the payment; a refund after payout debits the balance the payment was booked to; an accepted refund and a sent payout are promises. |  |  |\n| p38 | recommendation (list) | Depends on context: who funds a refund and whether the platform returns its fee, how hard to pursue a seller's shortfall, and, on Adyen, whether the provider can bear a seller's loss, which depends on access to the Managed Risk pilot and on unpublished terms and prices. |  | `contrast`: What is documented. → What depends on the platform's terms, sellers and contract. |\n| p39 | recommendation (list) | The author's synthesis: the account model is the answer to 'who pays' for every later refund, and 'whose money pays this?' has one answer only when the payment is walked through every hand-off. |  | `emphasis`: Conditional recommendations. → The author's own position, with the callback to the question of 18 March. |\n| p40 | recommendation (list) | Seven questions let the reader walk a refund after payout through their own platform. |  | `sequence`: The take-aways. → Questions to carry into a design review. |\n| p41 | transition | Mila's refund went back because she asked and the studio agreed; the next journey follows a payment that goes back because the cardholder's bank says so, through the same balances, with a fee, a deadline and a count the refund did not have. |  | `contrast`: A refund the merchant side agreed to, and the account model that decided who covered it. → A chargeback nobody on the merchant side agreed to: Bram de Wit's €120. |\n\n## Non-goals\n\n- Who the merchant is, the network definitions of payment facilitator and marketplace, and the liability rule itself. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- The mechanics of charge types, split types, payout schedules and top-ups beyond what each step needs. See [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Onboarding, requirements and deadlines beyond the one state the payment depends on. See [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html), [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- Pending, available and reserved balances, pre-financing and holds. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- Payout rails, returns and the payee-name check. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- The forward card steps before the split (tokenization, risk, authentication, authorization, capture, clearing, settlement). See [Journey 1: Mila's Class Pass, From Tap to Settled](journey-card-payment.html).\n- Chargebacks, the chargeback logic in use, dispute fees, deadlines and monitoring ratios. See [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html), [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- Ledger design and reconciliation design. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- A 'Stripe and Adyen: Where They Differ' section: journeys show both providers inline.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- How long an Adyen user's balance account may stay negative before the liable balance account is debited, and whether Adyen offers any arrangement in which it bears a seller's loss: nothing published; the chapter says so and stops at the default.\n- Whether Stripe rounds a proportional application-fee refund up or down (70% of €2.53 is €1.771): not documented on the pages read; the chapter says 'about €1.77'.\n- Chapter 12's worked ledger books Mila's refund to 'to recover from Studio Noord' on 18 March and moves it out when later sales cover it; chapter 35 and its ledger addition book a covered refund directly against 'owed to Studio Noord'. This chapter follows chapter 35 (the mechanics owner) and shows the other account only for the empty-balance case. The author may want the two reconciled.\n- Adyen's fallback for a refund sent without split instructions is documented as in pilot and not available for all platforms; what applies to a platform outside the pilot is not stated on the page.\n\n## Decision log\n\n- **2026-11-17** — The step table closes the narrative instead of opening it: its rows use terms (liable balance account, split item, transfer reversal) that the steps gloss as they are told. Rejected: The table first as a map, as a pure reference page would have it; A table per section\n- **2026-11-17** — Eleven steps, following the list in the journal-spec entry (capability state, split instruction, platform fee, processing cost, studio balance, payout, refund request, debit of the paid-out balance, shortfall, recovery, ledger entries). Rejected: Reusing Journey 1's twelve steps and marking the ones this journey opens; Collapsing fee and cost into one step, which would hide the point of AC-2\n- **2026-11-17** — The shortfall is told as a counterfactual ('had the balance been empty'), because the ledger fixes that Studio Noord's balance held €212.40 on 18 March. Rejected: Changing the scenario so the balance was empty; Using a different studio for the shortfall\n- **2026-11-17** — The statement that the Stripe–Adyen term pairs are the book's own mapping is made once, in the introduction's reading paragraph, as AC-3 asks. Rejected: Repeating the caveat at every pair; A separate crosswalk table, which platform-payment-models already has\n- **2026-11-17** — The chargeback instruction that travels with the same payment is named in one sentence and left to Journey 4. Rejected: Explaining platformChargebackLogic here\n- **2026-11-17** — No 'Stripe and Adyen: Where They Differ' section and no separate 'When It Goes Wrong' section: the style guide exempts journeys from the first, and the failures are the last column of the step table and are told inside each step. Rejected: A closing failure section that would repeat the steps\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md, contract 44 — Scope: onboarding state, split, fee, seller balance, payout, refund after payout, negative balance and recovery, both vocabularies.\n  - _journals/payments-platform-architecture/journal-spec.json, entry journey-platform-payment and part-9 — Intent, acceptance criteria, thesis, role, transitions in and out.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — Mila's pass, the refund after payout, and the additions of chapters 01, 03, 04, 05, 12, 13, 14, 15, 33 and 35.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md, rulings 7, 10, 12, 18 and 22 — Hand-off first; ownership of the liability rule and the mechanics; no payment GET on Adyen; no external URLs in running text.\n  - Chapters 13, 14, 33, 34 and 35 of this book as written (and 04, 12 skimmed) — The provider facts the journey walks through, each re-fetched for this page.\n- **External**\n  - Adyen documentation (n.d., accessed 2026-11): platforms/online-payments/split-transactions, transaction-fees, split-transactions/split-refunds, split-transactions/split-chargebacks, how-adyen-applies-split-instructions, account-structure-resources, verification-overview, verification-overview/capabilities, settle-funds, managed-payouts, payout-webhooks, top-up-balance-account, top-up-balance-account/on-demand-top-ups, internal-fund-transfers, reports-and-fees/balance-platform-accounting-report, reports-and-fees, prepare-reports/generate-download-reports, manage-liable-accounts, managed-risk, split-transactions/split-payments-at-authorization; online-payments/refund; adyen.com/pricing — Split types and defaults, fees calculated after the payment, the credited-accounts rule for refunds, the liable balance account, capabilities and deadlines, settlement timing, payout status, top-ups and the SEPA mandate, the accounting report.\n  - Stripe documentation (n.d., accessed 2026-11): connect/charges, connect/destination-charges, connect/account-balances, connect/risk-management, connect/account-debits, connect/account-capabilities, connect/disputes, refunds, payments/balances, api/payouts/object, api/balance_transactions/object — Charge types, the application fee flow, refunds by charge type, the 45-day pending refund, transfer reversal, the order of collection and the 180-day transfer, capabilities, payout status.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 66 claims checked (51 confirmed, 6 corrected, 8 hedged, 0 unsupported and removed or relabeled, 0 unreachable, 1 not checked against a primary source); the paragraph saying Adyen's public record stops at its default was wrong and now gives the documented 30-day rule for negative balances and the Managed Risk pilot, and a Stripe direct-charge refund against a short balance is held pending, not booked negative. intent.outcome.know[3] and the AC-1 probe still carry the earlier wording because they must equal the journal spec.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: in the shortfall section the limit of Adyen's public record now follows the Stripe answer directly and precedes recovery; the ledger paragraph on reconciliation keeps the specific failures and leaves the generalisation to the step table; the declared reason now says what breaks if the ledger, table or decisions move. Notes carried into the draft as glosses, not as order changes: 'split' glossed at its first use before the sale, 'liable balance account' at the split, K3 and the 2025 figures introduced where used, the Adyen €0.61 stated with the cost.\n- **2026-11-17** — First draft of the outcome spec, from PLAN contract 44, the journal-spec entry, the platforms brief and chapters 13, 14, 33, 34 and 35 as written.\n- **2026-11-17** — Reconciliation after verification (parts-9-10): intent, thesis and role re-synced with the corrected journal-spec entry. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: statements of absence re-tested with a wide search (docs.adyen.com and help.adyen.com sitemaps, adyen.com pricing and legal pages, web search). All hold: Adyen's split-refund page lists fee items for the refund itself and does not say the original fees are returned; no terms or prices for the Managed Risk pilot are published. No change to the text.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
