<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The terms progressive rollout, feature flag, dark launch, zero-downtime migration and postmortem.\n- **Know:** What Stripe's 2023 annual letter (published March 2024) says about its deployment pipeline, and what happened on 8 February 2024 when a change reached 1% of its critical traffic.\n- **Know:** What Adyen has published about release practice (2018, 2021, and current documentation that says releases are applied continuously and frozen around named peak days) and database change without downtime (2018 to 2025), and that Adyen's Infrastructure page says it publishes new releases of its core system every week, while no figure comparable to Stripe's deploy count is public for it.\n- **Know:** The engineering-culture facts each company has stated that bear on change: one dominant language and a monorepo at both, software built in-house or on open source at both, cloud rented at Stripe and hardware owned at Adyen.\n- **Believe:** On a money path, frequent small reversible changes are safer than rare large ones, and one percent of traffic is still real payments.\n- **Believe:** A deployment or migration is finished when the records agree afterwards, not when the rollout reaches 100%.\n- **Be able to:** Plan a change to a money path as stages with a bounded share of traffic, a signal that withdraws it and a way back at each stage.\n- **Be able to:** Plan a table or version migration with dual writing, comparison and a reconciliation check before the old path is removed.\n- **Be able to:** After a withdrawn rollout, find the payments it touched and prove their state.\n\n**Audience:** A software engineer or architect who deploys, or is about to deploy, changes to a system that calls a payment provider, and who knows continuous delivery in general.\n\n**Already knows:**\n\n- Continuous integration, canary releases, feature flags, blue-green deployment and schema migrations as general engineering.\n- Idempotency keys and the unknown outcome (idempotency-and-retries), the webhook receiver's contract (payment-webhooks-and-events), the ledger and reconciliation (payment-ledgers, payment-reconciliation-and-reporting) and the Version Cliff (payment-api-versioning).\n- The four earlier chapters of Part VIII and the incidents they cite; Larkfield and the Keel decisions (meet-larkfield).\n\n**Does not yet know:**\n\n- What Stripe and Adyen have each published, with dates, about deployment, migration and incident practice, and where that record stops.\n- Why a rollout's own metrics cannot close a change on a money path.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a rollout that was withdrawn automatically, the reader says the work is not finished and names what remains. *Probe:* A change to your payment service went to 1% of live traffic for ten minutes, error rates rose, and the rollout was withdrawn automatically. Your manager says the system worked and nothing more is needed. Using this chapter, what is still to do? | `custom` | cold_reader | major |\n| AC-2 | Given a migration the chapter does not contain, the reader orders its steps so that each can be reversed and says when the old path may be removed. *Probe:* Your team must move from one version of a provider's API to another that renames a field your finance export reads, with no downtime and no wrong reports. Put the steps in order and say when the old code may be deleted. | `custom` | cold_reader | major |\n| AC-3 | The chapter does not compare the two companies' deployment frequency and says why the public record cannot support that comparison; it presents reconciliation after a change as the author's recommendation, and states that neither company has published such a gate. | `custom` | rubric | blocker |\n| AC-4 | As the page that carries the part's closing, the conclusion returns to the two Larkfield first-of-month runs and states what the five chapters show together that none shows alone. | `conclusion_calls_back_to_introduction` | rubric | major |\n\n## Thesis\n\n**Question:** How do you ship changes many times a day to a system that moves money?\n\n> **Claim:** A money path can take hundreds of changes a day when each one is first exposed to a bounded share of live traffic, is withdrawn automatically when its metrics deviate, and has a way back that has itself been tested; because even a change limited to 1% of traffic fails real payments, the author's rule is that a change is finished only when the records agree after it.\n\n**Disputed by:** The view that systems that move money should change rarely: release windows, freezes before busy periods and manual sign-off are safer than hundreds of deployments a day.\n\n**So what:** The reader stops defending their payment system by pinning versions and avoiding change, which is how Larkfield reached the Version Cliff, and instead schedules small staged changes with a comparison step and a reconciliation after each, as K7 does.\n\n**How and why:** Stripe's 2023 annual letter (published March 2024) describes about 400 deployments a day to one core API service, each rolled out to test-mode traffic first and then to rising shares of live traffic, inspected against 55,000 metrics and withdrawn automatically. The same letter reports the limit: on 8 February 2024 an erroneous change reached 1% of critical traffic and payments failed. Its 2019 root-cause analysis shows a rollback causing the second outage of the day, which is why the way back has to be tested too; its 2017 and 2024 migration accounts keep both paths writable until a comparison passes. Adyen's 2018 account describes development on one main line, release branches, and features switched on one by one and then tried on a small share of traffic. So the documented difference is that Stripe describes gating the deployed code by traffic share (2024) and Adyen gating the feature (2018); each may do both; Adyen states a weekly release of its core system and no deploy count, so frequency cannot be compared number for number. Neither company has published a check of money correctness tied to a deployment; the last clause of the claim is the author's recommendation, drawn from the book's own test for a single payment.\n\n**Supporting claims**\n\n- **S1** — Exposure can be bounded: Stripe's 2023 annual letter describes each change reaching test-mode traffic, one machine and then rising shares of live traffic, withdrawn automatically when metrics deviate, and Adyen's 2018 account separates deploying code from activating a feature.\n- **S2** — Bounded exposure still fails real payments, and the way back is a change that can fail too: on 8 February 2024 a change at 1% of Stripe's critical traffic failed payments, and on 10 July 2019 a revert caused Stripe's second outage of the day.\n- **S3** — A change to stored data is made reversible by keeping the old and the new path both working until a comparison passes, as Stripe described in 2017 and 2024 and as Adyen's database posts of 2018 to 2025 show from the database side.\n- **S4** — The public record supports a comparison of what each company gates and of a few engineering-culture facts, and does not support a comparison of deployment frequency or a claim that either ties a check of money correctness to a deployment.\n- **S5** — Error metrics cannot see a change that writes wrong records without failing a request, so the author's rule is that a change to a money path is finished only when the records agree after it.\n\n## Role in the part\n\nNames change as the cause behind the incidents the part has cited and gives the reader the staged, reversible, reconciled change as the practice; carries the part's closing. Supports P8-5 of part `part-8`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in rollout, migrations, designs: code change before data change, mechanisms before the comparison of designs; `comparison` in incidents-and-culture and where-they-differ)\n\nThe Larkfield deploy comes first because it poses four questions (exposure, withdrawal, way back, records), and the body answers them in that order. The cost of a bad change precedes the mechanisms because its third kind of damage, a wrong record with no error, is what none of the mechanisms catches; without it the last rule would look like an afterthought. Rollout precedes migrations because a migration is a rollout whose effects cannot be withdrawn by routing, so it needs the rollout vocabulary. The four designs come after both because the table compares mechanisms the reader has now seen documented, and it is where the fourth answer, a reconciliation after the change, is named as the step none of the designs supplies. Incident and culture facts follow the designs and precede the comparison because the comparison table cites them; placed before the designs they would separate the mechanisms from the table that sorts them. Larkfield's upgrade comes after the comparison because it opens with what a small team should take from the providers and then applies all four answers; moved earlier it would use dark launch and reconciliation before they are defined. The withdrawn rollout comes last because it is the failure of the plan the upgrade section has just laid out.\n\n## Introduction\n\n**Hook** (`intriguing_example`): On 8 February 2024, between 21:46 and 21:52 UTC, a change at Stripe reached 1% of what the company calls its critical tier of traffic. The staged pipeline had kept it from the other 99%. In those six minutes the three most affected users had 39, 15 and 12 payments fail.\n\n**Bridge:** An engineer protects a system that must not break by changing it rarely: release windows, a freeze before the busy season, a pinned dependency nobody touches. → A payment system has no quiet hour and no freeze that fits around its peaks, and Larkfield's Version Cliff shows where avoiding change leads; the question becomes how to make each change small, bounded and reversible, and how to know it is done.\n\n**Thesis statement** (KEY POINTS bullets 1 and 3 and paragraph p03): A money path can take hundreds of changes a day when each one is first exposed to a bounded share of live traffic, is withdrawn automatically when its metrics deviate, and has a way back that has itself been tested; because even a change limited to 1% of traffic fails real payments, the author's rule is that a change is finished only when the records agree after it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from Larkfield's March 2026 upgrade read as a change, and the four questions it could not answer. *Kept in:* scene.\n- Say why a money path cannot stop changing and which three kinds of damage a bad change does. *Kept in:* problem.\n- Explain progressive rollout from Stripe's 2023 letter, its limit on 8 February 2024, Adyen's 2018 account and the 2019 rollback. *Kept in:* rollout.\n- Explain migrations that keep two paths alive until a comparison passes, with Stripe's and Adyen's published cases. *Kept in:* migrations.\n- Compare four ways to limit a change. *Kept in:* designs.\n- Report what each company has shown in public about incidents and about engineering choices that shape change. *Kept in:* incidents-and-culture.\n- Set the two providers side by side. *Kept in:* where-they-differ.\n- Walk Larkfield's May 2027 upgrade as a staged change and recover from a withdrawn rollout. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Chapter 40 left a system that cannot be stopped for its peaks, and the incidents on record show what threatens it: on 8 February 2024 a change at Stripe
