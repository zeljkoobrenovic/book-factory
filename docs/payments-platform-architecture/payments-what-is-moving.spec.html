 2026, would each move or shorten one promise in the payment chain (who authorized the purchase, what the settlement asset is, when the payment is final), and none removes the need to know who promised what and to prove that the records agree. An architect should therefore build now only what every variant assumes (a checkout a machine can call, with idempotent order creation; every balance behind one ledger abstraction; a payment state machine whose rules for finality and reversal are set per payment method) and should watch, not build to, anything tied to one agent protocol, one blockchain or a regulatory date not yet published.\n\n**Disputed by:** The view that these changes make the existing architecture obsolete: that agents will replace checkout, stablecoins will replace card settlement and instant payments will end chargebacks, so a team should rebuild around whichever arrives first; and the opposite view, that all three are vendor announcements an acquirer-side builder can ignore.\n\n**So what:** The reader leaves the book with a test instead of a forecast: for any new payment technology or provider, ask which promise it changes, who now carries it and how you will know the money arrived. A team applies it by keeping its state machine, keys, ledger and reconciliation, and adding new rails behind them. Mila's €120 was successful on Tuesday, paid out on Thursday and reversible in June; a new rail changes those intervals and who is exposed during them, not the need to track them.\n\n**How and why:** The record in November 2026 is mostly announcements and previews with dates. On agents, several protocols coexist (ACP from Stripe and OpenAI in September 2025, Google's AP2 and UCP, the Machine Payments Protocol, x402); Adyen's product was released in limited availability and Stripe's documentation says availability and launch stage 'vary by integration'; neither has published a volume. As published, each of these protocols still ends in an authorization by someone on behalf of someone, which is the promise the book started with. On stablecoins the two companies differ most: Stripe owns an orchestration company, a wallet company, helped start a blockchain and offers balances in preview, while Adyen has published one clause. On instant payments, FedNow's 2025 average payment of about $101,000 points to business transfers, not checkout, and the effect on card economics is inference. PSD3 and the PSR were agreed and not confirmed as published. Each company responds from its starting point (Stripe co-authors protocols and sells a suite that connects a business to several agents; Adyen joins the foundations and implements several), which is the part's argument seen in motion; why Adyen has said so little on stablecoins is not public. Since nothing here is final, the chapter's advice is limited to what the variants share: every agent protocol read calls a merchant's catalog and creates an order from software, which needs structured product data and an order endpoint that tolerates a repeated call; a stablecoin balance is one more balance, which a ledger that already separates balances by type can hold and remove; and an instant payment, a card payment and a direct debit become final at different moments, which the state machine must know per method.\n\n**Supporting claims**\n\n- **S1** — Agent-initiated payment moves the authorization promise from a person at a checkout to software holding a scoped credential; in November 2026 several protocols coexist, the products are at early phases, no volume is published, and each documented product still ends in an ordinary authorization or balance credit.\n- **S2** — A stablecoin changes the asset in which money is held and settled; Stripe owns and previews a stack of products, Adyen has published one clause, the US law takes effect on 18 January 2027, and a stablecoin balance remains a balance to record and reconcile.\n- **S3** — Instant account-to-account payment shortens settlement from days to seconds without ending reversal or reconciliation, as the Wero documentation shows; its effect on card economics is inference.\n- **S4** — The EU's PSD3 and Payment Services Regulation were agreed and not published on 17 November 2026, so their dates are forecasts, and the acquisitions of 2026 show both companies buying the systems beside the payment.\n- **S5** — Since none of the changes is final, an architect should build now only what every variant assumes (a machine-callable checkout with idempotent order creation, one ledger abstraction for every balance, per-method rules for finality and reversal) and watch anything tied to one protocol, one blockchain or an unpublished date.\n- **S6** — For each change, the company better positioned to carry the promise that moves is the one whose first-built asset the promise runs through (Stripe's interface and wallet for delegated authorization, Adyen's banking license for settlement in seconds, Stripe's non-bank position for a new settlement asset); this is inference, and each company is also working on the other's side.\n\n## Role in the part\n\nShows the two companies' positions in motion on the same dated evidence, so the part ends on direction instead of a snapshot, and carries both the part's closing and the journal's closing, returning to Mila's class pass. Supports P10-5 of part `part-10`.\n\n## Flow\n\n**Pattern:** `assertion_evidence_reasoning` (also `comparison` in agents, stablecoins, instant: the same steps for each change (the promise it moves, the dated record, both companies' positions); `chronological` in the dated records inside agents, stablecoins and rules-and-consolidation; `problem_solution` in scene to build-prepare-watch to in-practice: three proposals posed, a rule derived, the proposals sorted)\n\nThe scene poses the sorting problem and the reading aids define the labels and the three-promise frame, because no later status or comparison is safe to read without them. The three changes follow se changes as proposals that cite an announcement as if it were a product, and the first useful act is to write a date, a release phase and a promise next to each.\n\n**Advances the thesis** (S5): Poses the chapter's question as a sorting task a team actually faces, before any evidence is given.\n\n**Transition in:** `example`: The roadmap's first promise. → Larkfield's version of the question: three proposals to sort.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example | In January 2027 Femke de Graaf inherits three proposals the product team wrote in November 2026: let AI assistants book and pay for classes, pay United States studios out in stablecoins, and replace iDEAL with Wero at once. | scenario: Ledger: Femke de Graaf joins as Head of Payments Engineering in January 2027; iDEAL is 14% of online volume (€910M online, so €127.4M); 700 United States studios, on Stripe Connect; Jonas Weber owns compliance. New local fact: the three proposals and Jonas's question about PSD3 dates. |  |\n| p07 | explanation | Each proposal cites a press release as though it described something Larkfield could switch on, so Femke's first step is to write three things beside each: the date of the source, the release phase, and the promise in the payment chain that the change would alter. |  | `cause_effect`: The three proposals and the compliance question. → The three notes Femke adds to each, which are the chapter's method. |\n\n### How to Read This Chapter: Four Labels, One Date, Three Promises\n\n**Controlling idea** (`definition`, id `how-to-read`): Every item in the chapter carries one of four release labels and the date 17 November 2026, and every change is read through the one promise it moves.\n\n**Advances the thesis** (S1, S2, S3): Defines the labels and the three-promise frame that the three change sections apply.\n\n**Transition in:** `elaboration`: Femke's three notes: date, phase, promise. → The same three notes defined for the whole chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | The chapter uses four labels (announced, preview, limited availability, generally available), and every status in it was read from the vendor's or regulator's own page on 17 November 2026, which makes this the page of the book that will go stale first. | fact: Labels as the vendors use them: Stripe's documentation marks stablecoin balances 'public preview' in the United States and 'private preview' elsewhere; Adyen's release puts Adyen Agentic 'in limited availability for enterprise merchants operating in the U.S.'; Stripe's agentic commerce documentation says 'Availability, launch stage, and supported countries vary by integration.' |  |\n| p09 | explanation | Each change moves one promise: an agent changes who authorized the purchase, a stablecoin changes what the money is held and settled in, and an instant payment changes when the money has moved, while the tracking of states, balances and reversals stays, so each change is read with three questions: which promise does it change, who now carries it, and how will I know the money arrived. | table: Table 'Change \\| Promise it moves \\| From, to \\| What stays': agents \\| who authorized \\| the cardholder at the checkout, to software holding a scoped credential \\| an authorization by an issuer, a capture, a dispute window. Stablecoins \\| the settlement asset \\| a bank balance, to a token redeemable for dollars \\| a balance to record and reconcile, a refund path. Instant payments \\| when the money has moved \\| days, to seconds \\| two records of the same money, a reversal or refund process with its own states. | `additional_support`: The labels and the date. → The second reading aid: the promise each change moves. |\n\n### Agents That Pay: Who Authorized the Purchase\n\n**Controlling idea** (`evidence`, id `agents`): Agent-initiated payment moves the authorization promise from a person at a checkout to software holding a scoped credential, and as documented in November 2026 every product still ends in an ordinary authorization or balance credit, at early release phases and with no published volume.\n\n**Advances the thesis** (S1): Gives the dated record for the first change and shows that the promise is re-addressed, not removed.\n\n**Transition in:** `example`: The first row of the frame: who authorized. → The products and protocols that move that promise, with their dates and labels.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The promise that moves is stated first, then the dated record, then what the documented credentials amount to, then the two companies' positions; the positions would be unreadable before the record names the protocols and products.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | explanation | When software buys for a person, the promise that changes is the cardholder's authorization: the issuer is asked to approve a payment the cardholder did not key in, on the strength of a credential delegated to an agent and limited in scope. | fact: Stripe's documentation defines Shared Payment Tokens as 'scoped grants that let an agent use a customer's payment method, such as a card'; 'Each SPT includes usage and expiration limits.' Google's AP2 announcement names the three problems as 'Authorization', 'Authenticity' and 'Accountability'. |  |\n| p11 | evidence | Between April 2025 and October 2026 two card networks, Google, Stripe with OpenAI, Tempo (a payments blockchain Stripe helped start) and Adyen each announced an agent payment protocol or product, and by November 2026 several protocols coexist, one launch surface has been pulled back, and the phases run from announced to limited availability. | table: Table 'Date \\| Item \\| Label on 17 November 2026': 30 Apr 2025 Visa Intelligent Commerce, announced as an 'initiative', current phase not stated; 16 Sep 2025 Google AP2, open protocol announced with 'more than 60 organizations' including Adyen; 29 Sep 2025 Stripe and OpenAI Instant Checkout in ChatGPT (US, Etsy sellers) and ACP, the protocol 'currently in beta' per its repository, the checkout surface reported sidelined in March 2026; 11 Dec 2025 Stripe Agentic Commerce Suite, launched, Stripe-managed checkout 'available in the US, Canada, and select European countries', one option 'in private preview in the US'; 11 Jan 2026 Google UCP, published open standard, endorsed by Adyen and Stripe among others; 18 Mar 2026 Machine Payments Protocol, 'an open standard for machine payments co-authored by Stripe and Tempo'; 2 Apr 2026 x402 Foundation, Adyen 'a founding member'; 29 Apr 2026 Link wallet for agents, agent payments for 'US and Canadian customers'; 16 Jun 2026 Adyen Agentic, limited availability, US enterprise merchants; Q3 2026 Adyen with Sierra and Meta on a Personal Agent Protocol, announced; 21 Oct 2026 Stripe Treasury for agents, announced, no phase stated, more 'soon'. Mastercard Agent Pay exists (a Mastercard executive's quote in Adyen's release); its phase was not verified. | `example`: The delegated credential as the thing that moves the promise. → The dated record of who announced what. |\n| p12 | analysis | As documented, each of these products ends in a mechanism this book has already covered (a single-use card the person approves, a scoped token with limits, a credit to the merchant's balance), so the authorization promise is addressed to a new holder and still has to be made, kept and recorded. | quotation: Stripe, April 2026: 'a one-time-use card is issued per task, and you approve each payment.' Stripe's machine payments documentation: 'Payments land directly in your Stripe balance and settle in fiat', with refunds 'through the Refunds API'. Adyen's x402 article separates 'consumer-direct transactions' from 'machine-to-machine transactions where agents pay autonomously for the tools, data, and services they consume'. | `cause_effect`: The list of protocols and products. → What they have in common underneath: an authorization and a balance. |\n| p13 | comparison | On the same record the two companies stand differently: Stripe co-authored two of the protocols, sells a suite on them and runs a consumer wallet that issues the agent's credential, while Adyen authored none, became a founding member of the x402 Foundation and an endorser of the others, and sells one integration that translates across the protocols to enterprise merchants; neither has published a volume of agent-initiated payments. | quotation: Adyen, June 2026: 'we intentionally designed Adyen Agentic to help retailers integrate once and participate across evolving platforms, protocols, and experiences — without having to bet on which ecosystems ultimately win.' Stripe, September 2026: Link is 'Stripe's consumer network with over 300 million users globally', and for businesses that do not accept Link, 'Link issues Muse a single-use virtual card scoped to the approved purchase.' Stripe's CEO, April 2026: 'in the not-too-distant future agents will account for most transactions online.' | `contrast`: What all the products share. → Where the two companies differ on them. |\n\n### Stablecoins: What the Money Is Held and Settled In\n\n**Controlling idea** (`evidence`, id `stablecoins`): A stablecoin changes the asset in which money is held and settled, and on this change the two companies' public records differ most: Stripe owns and previews a stack of products, Adyen has published one clause, and the United States law that governs issuers takes effect in January 2027.\n\n**Advances the thesis** (S2): Gives the dated record for the second change and shows that a stablecoin balance is one more balance to record and reconcile.\n\n**Transition in:** `similarity`: The first change, read as one promise moved. → The second change, read the same way: the settlement asset.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The promise first, then each company's record, then the law; the law comes last because it explains why the products are still previews.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | explanation | A stablecoin, a token on a blockchain that its issuer promises to redeem one for one for a currency, changes what the money is between payment and payout, and as Stripe documents it for a merchant the result is a payment method without disputes that still settles to an ordinary balance. | fact: Stripe's stablecoin payments documentation: 'completed payments settle in your Stripe balance in your local currency'; 'Dispute support: No'; refunds yes; businesses in the US, with 'private preview to businesses operating in the European Union, Hong Kong, Mexico, and Switzerland'. |  |\n| p15 | evidence | Stripe's record on stablecoins is a sequence of purchases and launches from February 2025 to September 2026: an orchestration company, a wallet company, a blockchain it helped start, a stablecoin from a company it co-founded, and balances that its documentation still labels preview. | fact: Bridge acquisition completed 4 February 2025; 'In July, Stripe acquired Privy' (2025); Tempo 'unveiled' September 2025, 'incubated together with Paradigm', mainnet 18 March 2026; 30 September 2026: OUSD 'created by Open Standard, an independent company founded by Coinbase, Mastercard, Shopify, Stripe, and Visa'; financial accounts 'can hold a stablecoin balance in OUSD or USDC', 'In the United States, stablecoin balances are in public preview', elsewhere 'private preview'. The $400 billion of 2025 stablecoin payments volume in Stripe's release is an industry estimate, not Stripe's volume. | `example`: What a stablecoin changes. → What Stripe has bought, started and released. |\n| p16 | evidence | Adyen's record on stablecoins is one clause in a results release, a membership reported by the trade press, and a role in the European Central Bank's digital euro pilot; no Adyen stablecoin product page was found on 17 November 2026. | quotation: Adyen H1 2026 release: 'Joined the x402 Foundation and Open Standard, driving open protocols for HTTP payments in agentic commerce and shaping stablecoin infrastructure via OpenUSD for global merchants.' Trade press, 1 July 2026, quoting Adyen's CTO: 'we're joining OS to help shape an open, merchant-first foundation for stablecoin utility.' Q3 2026 release: 'Joined the European Central Bank's digital euro pilot as an acquiring payment service provider'; the word 'stablecoin' does not occur in that release. | `contrast`: Stripe's sequence of purchases and launches. → Adyen's one clause. |\n| p17 | context | The law that says who may issue such a token is itself recent: the United States GENIUS Act was approved on 18 July 2025 and takes effect on 18 January 2027 by the regulator's bulletin, and the EU's MiCA regulation has applied in full only since its transition period ended on 1 July 2026. | fact: GENIUS Act, section 20: effect 'on the earlier of' 18 months after enactment or 120 days after final regulations. OCC Bulletin 2026-50 (21 October 2026): 'The GENIUS Act's effective date is January 18, 2027'; anti-money-laundering and sanctions rules 'will be addressed in a separate rulemaking'. ESMA: MiCA 'entered into force in June 2023'; providers under national law could continue 'until 1 July 2026 or until they are granted or refused a MiCA authorisation'. | `cause_effect`: Two companies' records, both short of general availability. → The legal calendar behind the labels. |\n\n### Instant Payments: When the Payment Is Final\n\n**Controlling idea** (`evidence`, id `instant`): Instant account-to-account payment shortens the interval between the answer and the money from days to seconds, but the newest European scheme documents an authorization that is not yet the money and a dispute process still to come, and its effect on card economics is inference.\n\n**Advances the thesis** (S3): Gives the dated record for the third change and shows that shorter settlement leaves reversal and reconciliation in place.\n\n**Transition in:** `similarity`: The second change, read as one promise moved. → The third: when the money has moved.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The promise, then the volumes and rollout, then one scheme read closely, then the economic inference; the close reading of Wero needs the rollout dates before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | explanation | An instant payment is a transfer pushed from the payer's bank account that reaches the payee's account within seconds at any hour, so the promise it changes is settlement: the days between the answer and the money shrink to seconds. | fact: Regulation (EU) 2024/886: the payee's provider shall, 'within 10 seconds of the time of receipt of the payment order', make the amount available on the payee's account; euro-area providers had to offer sending 'by 9 October 2025'; e-money and payment institutions in the euro area 'by 9 April 2027'; charges 'shall not be higher than' for other credit transfers. |  |\n| p19 | evidence | The public figures show instant rails carrying large volumes where a country has adopted them and, in the United States, mostly large business transfers; in Europe the retail scheme Wero is still rolling out and is due to absorb iDEAL by the end of 2027, with both providers offering it before general availability and Stripe also selling a pay-by-bank method. | table: Table 'Rail \\| Figure or status \\| Source': FedNow 2025: 8,413,402 settled payments, $853.4 billion, average $101,435; Q3 2026: 6,376,467 payments, average $58,161 (Federal Reserve). Pix 2025: 79.7 billion transactions; UPI 2025: 228.3 billion (a research firm, secondary; not checked against the central banks). Wero: 'live t; this effect on card economics is the author's inference, and neither company has published it. | scenario: Ledger: of the illustrative €0.61 provider cost on Mila's €120 card payment, €0.24 is interchange and €0.31 is Adyen's (Interchange++); Larkfield's own fee is €2.53 on that card payment and a flat €0.35 on an iDEAL payment; on Stripe Larkfield's assumed blended rate is 0.6% + €0.15. | `cause_effect`: A rail with no card network in it. → What that does to who earns what, labeled as inference. |\n\n### The Rules and the Map: PSD3, the PSR and Who Bought Whom\n\n**Controlling idea** (`evidence`, id `rules-and-consolidation`): Around the three changes, the EU's new payment rules are agreed but were not law on 17 November 2026, and the year's acquisitions show both companies buying the systems next to the payment, usage billing above all.\n\n**Advances the thesis** (S4): Gives the legal status that makes 'a regulatory date not yet published' concrete and the acquisitions that show the two companies converging.\n\n**Transition in:** `additional_support`: Three changes, each moving one promise. → Two changes that move none directly but alter the ground: the rules and who owns what.\n\n**Order of paragraphs** (`grouping`): Two things that change the ground under every provider: first the rules (status, then content as one provider reads it), then the ownership map.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | evidence | PSD3 and the Payment Services Regulation, the EU texts that will replace the current payment services directive, had final compromise texts on 23 April 2026 and on 17 November 2026 were still awaiting the Parliament's second reading, with no publication in the Official Journal and therefore no application date. | fact: European Parliament Legislative Observatory, both procedures: status 'Awaiting Parliament 2nd reading'; 'Council position published' 5 November 2026; 'Indicative plenary sitting date, 2nd reading' 14 December 2026. Law-firm briefings: the Council published the final compromise texts on 23 April 2026; publication expected 'at the end of Q4 2026', 'a 21-month implementation period'. Adyen (12 October 2026): 'General application is expected 21 months after entry into force (Verification of Payee provisions will apply 27 months after)'; 'These dates will move if publication slips.' An 18-month period also appears in earlier commentary; no source read on 17 November 2026 gives it. |  |\n| p23 | explanation | On one provider's reading of the agreed texts, the rules keep strong customer authentication and move fraud liability along the chain, and the detail that decides whether a passkey counts as authentication waits for technical standards in 2027 and 2028; Adyen has published that reading and a passkey pilot, and nothing from Stripe on PSD3 was found. | quotation: Adyen knowledge hub (its interpretation, not the legal text): 'SCA isn't going anywhere'; 'Issuing banks can seek to recoup losses from acquirers, which increases the likelihood of chargebacks reaching businesses further down the chain'; 'Whether a specific passkey flow qualifies as SCA will depend on the EBA's technical standards.' Adyen, 29 October 2026: Visa Payment Passkey offered 'initially ... in the UK, with further enhancements and a global expansion planned for 2027'; its documentation: 'Scheme passkeys are currently in pilot phase'. | `elaboration`: The status of the texts. → What they are expected to change, on one provider's reading. |\n| p24 | evidence | In 2026 the ownership map changed at both ends: two of the largest processors merged, and Stripe and Adyen each bought a usage-billing company within six months of each other, with two further Stripe purchases announced and not completed. | table: Table 'Date \\| Deal \\| Status on 17 November 2026': 9 Jan 2026 Global Payments acquires Worldpay, completed (Form 8-K); 14 Jan 2026 Stripe, Metronome (usage billing), completed; 1 Jul 2026 Adyen, Talon.One (loyalty) and Orb (usage billing), completed, Orb under 'an incubator model ... continuing to support multi-PSP environments'; 19 Aug 2026 Stripe, OpenRouter (AI model routing), agreement announced, no completion in Stripe's newsroom list; 30 Sep 2026 Stripe, Parafin (embedded credit), agreement announced, 'expected to close in the coming months'; 31 Mar 2027 Lemon Squeezy, bought by Stripe in 2024, 'will shut down'. | `additional_support`: The rules changing under every provider. → The ownership changing among them. |\n\n### Each Change Read Against the Two Bets\n\n**Controlling idea** (`analysis`, id `two-bets`): For each of the three changes, the company better positioned to carry the promise that moves is the one whose first-built asset that promise runs through, which is the part's argument seen in motion; this is the author's inference, and the record also shows each company working on the other's side.\n\n**Advances the thesis** (S6): Ties the three dated records to what each company built first, as ruling 9 requires, and states the limits of that reading.\n\n**Transition in:** `conclusion_summary`: Three changes, the rules and the ownership map, each with both companies' records. → The records set beside what each company built first.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The facts side by side, then the inference they support, then what counts against it; the limits come last so the reader weighs the inference after seeing it whole.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | comparison | Set side by side, the three changes meet two different inheritances: Stripe's is an interface developers adopt, a consumer wallet and regulated functions assembled without a banking license, and Adyen's is a bank on one platform with direct access to payment systems and enterprise merchants. | table: Table 'Change \\| Promise that moves \\| Stripe: built first, and has now \\| Adyen: built first, and has now \\| Positioned to carry it (inference)'. Agents \\| who authorized \\| an API and object model; the Link wallet ('over 300 million users'), co-author of ACP and MPP, Suite launched \\| acquiring for enterprises; Adyen Agentic released in limited availability, member of the foundations \\| Stripe for the credential; Adyen for processing whatever credential arrives. Stablecoins \\| settlement asset \\| an e-money institution that places users' funds at banks (chapter 16); Bridge, Privy, Tempo, OUSD, balances in preview \\| a credit institution with 'balances at central and commercial banks'; one clause, Open Standard membership, digital euro pilot \\| Stripe. Instant payments \\| when the money has moved \\| named acquirers and its own entities per market; Pay by Bank, Wero in public preview \\| banking licenses in the EU, US and UK; 'direct access to France's domestic interbank clearing system', 'the earliest adopters of the US FedNow service'; Wero in development \\| Adyen, by license; no volumes at either. |  |\n| p26 | analysis | The inference is that each promise runs through something one company built first: delegated authorization runs through an interface and a wallet, which Stripe built; settlement in seconds runs through membership of bank payment systems, which Adyen's license gives it; and a settlement asset that needs no bank is worth most to the company that is not one. | reasoning: Stripe can issue the agent's credential because it operates the wallet the credential comes from and the API the merchant already calls; Adyen needs no partner to reach an instant rail where it is itself the bank; a non-bank must place users' funds at banks (chapter 16), so an asset it can hold and move through its own subsidiary changes what it can offer, while a bank already holds central-bank and commercial-bank balances. Adyen has not said why it has published so little on stablecoins. | `cause_effect`: The two inheritances beside the three changes. → The reading that explains the pattern, labeled as inference. |\n| p27 | counterargument | Being positioned is not the same as prevailing, and the same record shows each company on the other's side of every row: Adyen sells an agent product and has joined the stablecoin company Stripe co-founded, Stripe sells the bank payments of the instant-payments section and lists a bank of its own among its acquirers, and both bought a usage-billing company in 2026. | fact: Adyen Agentic (June 2026) and Open Standard membership (H1 2026 release); Stripe Pay by Bank and Wero (documentation, November 2026) and 'Stripe MALPB' in its US acquirer list (accessed 17 November 2026). No volume for agent payments, stablecoin balances or instant payments is published by either. | `contrast`: The inference about who is positioned. → What the same record shows against reading it as a forecast. |\n\n### What to Build Now, What to Prepare, What to Watch\n\n**Controlling idea** (`recommendation`, id `build-prepare-watch`): Because nothing here is final, build now only the three things every variant assumes, prepare where a dated migration already affects you, and watch anything tied to one protocol, one blockchain or a regulatory date not yet published.\n\n**Advances the thesis** (S5): Turns the records into the chapter's rule of action and names the event that would move each item.\n\n**Transition in:** `cause_effect`: Three records at early phases and a reading of who is positioned. → What a team should do, given that none of it is final.\n\n**Order of paragraphs** (`order_of_importance`): The rule and its table first, then what to build, then what to watch and what would change it; a reader who stops after the table has the sort.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | recommendation | The rule I use is to sort every proposal by two facts, the release phase in my market and the promise it changes, into three piles: build now what every variant assumes, prepare for a dated change to a method already in use, and watch anything tied to one protocol, one blockchain or an unpublished date. | table: Table 'Sort \\| What goes here \\| Examples in November 2026 \\| What moves it': Build now \\| what every variant assumes \\| structured product data and an idempotent order endpoint; one ledger abstraction for every balance; per-method finality and reversal rules \\| nothing: these pay off without any of the changes. Prepare \\| a dated change to a method you already use \\| the iDEAL to Wero migration ('By the end of 2027 at the latest'); Wero disputes from February 2027 on Adyen's page \\| the provider's migration deadline. Watch \\| anything tied to one protocol, one chain or an unpublished date \\| an end-to-end integration of one agent protocol; stablecoin balances in preview; flows rebuilt to PSD3 dates \\| general availability in your market, a published volume, publication in the Official Journal. |  |\n| p29 | recommendation (list) | Three things are worth building now because every variant above assumes them: a checkout a machine can call, with idempotent order creation and the seller-of-record logic kept on your side; every balance behind one ledger abstraction; and a payment state machine whose rules for finality and reversal are set per payment method. | reasoning: Every agent protocol read creates an order from software, so a repeated call must not create two orders (chapter 18); Google's UCP post says 'you remain the Merchant of Record'. A stablecoin balance is one more balance type, which a ledger that separates balances by type can add and remove (chapters 12 and 13). A card payment, a direct debit and a Wero payment become final and reversible at different moments (chapters 7 and 8). | `elaboration`: The 'build now' row of the sort. → Its three items and why each survives every variant. |\n| p30 | recommendation | Everything tied to one agent protocol, one blockchain or a date that is not yet law belongs on a watch list with the event that would move it, and the cost of waiting is small because the three builds above are what any later integration will plug into. | reasoning: Several protocols coexist and one flagship surface was withdrawn within six months; stablecoin balances are in preview and the US law takes effect on 18 January 2027; PSD3 and the PSR were not published on 17 November 2026. The moving events: the provider labels the product generally available in your market; a volume is published; the Official Journal prints the text. | `contrast`: What to build regardless. → What to hold back, and until when. |\n\n### In Practice at Larkfield: Sorting the Folder\n\n**Controlling idea** (`example`, id `in-practice`): Applied to Larkfield's three proposals, the sort yields one build, one preparation and one item to watch, and the three closing questions answer the Wero proposal in full.\n\n**Advances the thesis** (S5, S3): Works the rule on ledger numbers and shows the three questions producing a concrete answer.\n\n**Transition in:** `example`: The sort and its three builds. → The sort applied to the folder from the opening scene.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | example | Femke sorts the folder in one afternoon: the assistant proposal becomes a build of the order endpoint and class catalog with no protocol integration, the stablecoin payout goes on the watch list, and Wero becomes a preparation with a date. | scenario: Ledger and chapter facts: K1 keys derived from the business event; Larkfield's 700 United States studios are on Stripe, and Adyen Agentic was released in limited availability for US enterprise merchants; Larkfield never holds studio funds; iDEAL is 14% of €910M online volume, €127.4M a year; the method-family table of chapter 7; the K7 upgrade calendar; Wero lists recurring payments as not supported at both providers, so memberships stay on SEPA Direct Debit. |  |\n| p32 | example | For a €120 pass paid by Wero at a studio on Adyen, the three questions give: the settlement promise changes from two days to seconds behind a bank's guarantee; Adyen pursues an unpaid guarantee and, by its page, a Dutch payer cannot open a dispute before 1 January 2028; and Larkfield knows the money arrived from the settlement report, exactly as it does for a card. | scenario: Adyen's Wero page (17 November 2026): 'Adyen asks the shopper's bank to settle the payment under the payment guarantee. You don't have to pursue the shopper's bank yourself'; CAPTURE_FAILED; no pre-dispute for accounts 'based in the Netherlands, until 1 January 2028'. Ledger: K2 (the provider's record is the truth), K3 (ledger entries from report lines); chapter 8's rule that a late CAPTURE_FAILED moves a row from paid back to authorized. | `elaboration`: Wero sorted as 'prepare'. → The three questions worked on one Wero payment. |\n\n### When It Goes Wrong: Building to an Announcement\n\n**Controlling idea** (`example`, id `when-it-goes-wrong`): The typical failure of this subject is to build to a status that then changes: a launch surface is withdrawn, or a documented property of a method is revised.\n\n**Advances the thesis** (S5): Shows with two dated cases what the 'watch' rule protects against.\n\n**Transition in:** `contrast`: The sort working as intended. → What happens to a team that builds to an announcement instead.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | example | A team that integrated end to end with the first agent checkout surface lost its channel within six months: Instant Checkout in ChatGPT launched on 29 September 2025, and in March 2026 the trade press reported OpenAI sidelining it in favor of merchants' own apps. | case: Stripe release, 29 September 2025: 'ChatGPT users in the United States can buy from Etsy merchants (and, soon, from Shopify merchants)'. Digital Commerce 360, 6 March 2026: the feature 'is reportedly being sidelined'; an OpenAI spokesperson: 'We're evolving how we approach commerce in ChatGPT'. The protocol itself continued. |  |\n| p34 | example | A documented property can change between two readings of the same page: on 17 November 2026 Adyen's Wero page showed no chargebacks in its feature table and, lower down, dispute support from February 2027, while Stripe's page for the same scheme said disputes are not supported. | case: Adyen Wero page, n.d., accessed 17 November 2026 (feature table: chargebacks not supported; section 'Disputes': 'Dispute support starts in February 2027'); Stripe Wero page, same day: 'Dispute support: No'. | `additional_support`: A surface withdrawn. → A method's documented behavior revised. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`context`, id `evidence-stops`): The record of November 2026 lacks volumes, several release phases, the legal text's final dates and any stated reason for Adyen's silence on stablecoins.\n\n**Advances the thesis** (S1, S2, S3, S4): States the limits of each record so that no reading in the chapter is taken for more than the evidence carries.\n\n**Transition in:** `elaboration`: Statuses that change after they are read. → What could not be read at all.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | context (list) | Six things were not public or not verifiable on 17 November 2026: agent payment volumes at either company; the phases of Visa Intelligent Commerce, Mastercard Agent Pay and Stripe Treasury for agents; whether Stripe's OpenRouter and Parafin purchases have closed; Adyen's position on stablecoins beyond one clause; the PSD3 and PSR application dates; and Pix and UPI figures from the central banks' own tables. |  |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Every mechanism in the book answered the same question for a different kind of promise: what do we do between the instant answer and the slow truth. Agents, stablecoins and instant payments shorten or move the gap; none removes the need to know who promised what and to prove that the records agree. And the two companies absorb each change as they absorbed the earlier ones, each from the side it built first, so a provider's architecture is a trace that keeps being redrawn.\n\n**So what:** The reader can judge a new payment technology, or a provider, with one test before any feature comparison: which promise does it change, who now carries it, and how will I know the money arrived. A provider choice becomes a dated decision about specific promises, written down with its evidence and reviewed, not an identity to adopt.\n\n**Callback:** The hook's three variants of Mila's €120 class pass, which is the payment of the book's introduction. The reader can now say that under each variant she would still have had an answer first, the money later and a period in which it could come back: successful at 19:42 on Tuesday, paid to the studio on Thursday, still reversible in June. Only the intervals and the exposed party differ.\n\n**Takeaway** (`course_of_action`): Start with the payment state card, the idempotency key card and the reconciliation card from the toolkit, for the reader's own integration; for each provider, fill in the provider comparison card and keep the provider exit plan card beside it.\n\n**Hand-off** to [Domain Coverage: From the Planning Model to the Book's Chapters](domain-coverage.html): `conclusion_summary`: The cards, terms and sources introduced chapter by chapter, and this chapter's advice to start with the payment state card, the idempotency key card and the reconciliation card. → The same material gathered for lookup in the reference pages: coverage by capability, the cards, the vocabulary with its Stripe and Adyen crosswalk, and the register of sources.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis (list) | Established: the release phases and dates as read on 17 November 2026; that several agent protocols coexist; that Stripe's stablecoin balances are in preview and the US law takes effect on 18 January 2027; that PSD3 and the PSR were agreed and not published; that both companies bought a usage-billing company in 2026. |  |  |\n| p37 | synthesis (list) | Depends on context: whether Wero is a preparation or a watch item depends on your iDEAL volume; whether an agent channel is worth an integration depends on its phase in your market and on whether you can keep it behind an adapter; whether a stablecoin balance is useful depends on whether you pay across borders and on your regulator. |  | `contrast`: What is settled. → What changes with the situation. |\n| p38 | recommendation (list) | The author's synthesis: each change moves one promise and none removes the work of tracking it, so I build what all variants assume and date everything else; and which company is positioned to carry each promise follows from what it built first, which is an inference and not a forecast. |  | `contrast`: What is established and what depends. → The author's own position. |\n| p39 | recommendation (list) | Eight questions let the reader test a proposal built on a new payment technology, beginning with the three the book ends on. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p40 | synthesis | Read together, the two cases, the comparison, the three contrasts and this chapter say that what looks like a provider's architecture is the trace of where it started, and that the trace keeps being redrawn: the two facts that opened the part, Adyen's sentence about 'a patchwork of acquired technologies' and the bank in Stripe's acquirer list, were both out of date within a year, so a provider choice is a dated decision to record on the provider comparison card and keep beside an exit plan. | quotation: Adyen, 9 April 2026: 'Unlike many providers that rely on a patchwork of acquired technologies and third-party integrations, Adyen has built its entire financial technology stack on a single platform'; two acquisitions closed on 1 July 2026. Stripe's acquirer disclosure (accessed 17 November 2026) lists 'Stripe MALPB' beside five partner banks, on the site of a company that says 'Stripe is not a bank'. | `conclusion_summary`: The chapter's questions. → What Part X says as a whole, returning to the two facts that opened it. |\n| p41 | synthesis | Every mechanism in the book answered one question for a different kind of promise, what to do between the instant answer and the slow truth, and the changes of 2026 shorten or move that gap without removing the need to know who promised what and to prove that the records agree. |  | `conclusion_summary`: What the last part says. → What the ten parts say together. |\n| p42 | synthesis | Mila's €120 was successful at 19:42 on Tuesday, paid to the studio on Thursday and still reversible in June, and under each of the opening's three variants she would still have had an answer first, the money later and a period in which it could come back; only the lengths of the intervals and the party exposed in each would differ. | scenario: Ledger: Tuesday 9 March 2027, 19:42; payout Thursday 11 March; window to about 7 July 2027. This chapter: a scoped credential still produces an issuer's authorization; a stablecoin payment still settles to a balance; Wero's guarantee is 'not the receipt of funds' and its disputes run 120 days. | `example`: The gap between the answer and the truth. → The payment the book began with, seen through the three changes. |\n| p43 | recommendation | The reader leaves with a test instead of a forecast (which promise does it change, who now carries it, and how will I know the money arrived) and a place to start on their own integration: the payment state card, the idempotency key card and the reconciliation card, which the reference pages collect with the rest. |  | `cause_effect`: The same three intervals under every variant. → The three questions that follow from it and the three cards to begin with. |\n\n## Non-goals\n\n- The commerce-side agent protocols (ACP, UCP, AP2, MCP) in detail, the merchant's catalog feed and the European authentication of agent purchases. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](../commerce-platform-architecture/ai-and-agentic-commerce.html).\n- Stripe's and Adyen's company records, licenses and the bet-by-bet comparison. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- How local and bank-transfer payment methods work, including iDEAL and SEPA Direct Debit. See [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html).\n- Strong customer authentication, exemptions and liability shift as they stand under PSD2. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- Usage billing as a mechanism and the Metronome and Orb products. See [Counting Before Charging: Usage Metering and Rating](usage-metering-and-rating.html), [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html).\n- How blockchains, wallets or stablecoin reserves work internally; central bank digital currencies beyond one mention of the digital euro pilot.\n- A forecast of which protocol, chain or company will prevail.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The journal-spec entry (know item 4 and the expected answer of AC-1) says secondary sources give 18 or 21 months for the PSR's application. Every source read on 17 November 2026 (Adyen's knowledge hub, Addleshaw Goddard, and a web search of law-firm notes) gives 21 months, with 27 for Verification of Payee; no dated source for 18 months was found. The article reports 21 months as the figure in the sources read and mentions the 18-month figure as unverified. The author may want to correct the journal-spec entry.\n- Stripe's Wero documentation shows 'Public preview' on its HTML page but no phase label in the .md variant; the article uses the HTML page's label.\n- Adyen's Wero page changed on 17 November 2026 (a disputes section with a February 2027 start while its feature table still shows no chargebacks). Chapter 7 describes Wero without disputes; a reviewer may want to align it.\n- Whether Adyen joined Open Standard as a founding member rests on Adyen's one clause and trade press; Stripe's release names five founders, Adyen not among them.\n\n## Decision log\n\n- **2026-11-17** — The hook is Mila's class pass varied three ways, so that the chapter's own callback and the journal's callback are the same return. Rejected: Opening on a vendor quotation about agents, which would make the conclusion's return to Mila a new element.\n- **2026-11-17** — The 'positioned by what it built first' argument (ruling 9) has its own section after the four records, with a table whose last column is labeled inference; each change section ends on the two companies' documented positions only. Rejected: A 'Stripe and Adyen: Where They Differ' section, which Part X chapters do not carry.; Stating the inference inside each change section, which would mix documented fact and inference three times.\n- **2026-11-17** — Open Standard and OUSD (Stripe release of 30 September 2026; Payments Dive, 1 July 2026) are added to the record although the research brief did not have them, because re-fetching showed that the stablecoin named in Adyen's one clause comes from a company Stripe co-founded. Rejected: Leaving 'OpenUSD' unexplained as in the brief.\n- **2026-11-17** — Passkeys are treated in one paragraph under the rules, as the one product built toward PSD3's authentication provisions, and not as a fourth change. Rejected: A separate section on passkeys, owned in substance by three-d-secure-and-sca.\n- **2026-11-17** — The journal's closing is carried by the last three paragraphs of the conclusion, after the part's closing and the Questions to Ask, under a content heading inside the conclusion if the structure check allows one. Rejected: A separate body section for the closing, which would put the synthesis and callback outside the conclusion.\n\n## Sources\n\n- **Internal**\n  - _research/brief-companies-and-bets.md — Part 5 (what is moving), sections 1.2 and 2.4 (acquisitions), open questions 11 to 15.\n  - _research/brief-card-data-tokens-and-authentication.md — Sections 3.6 (passkeys) and 4.7 (PSD3/PSR status and Adyen's reading).\n  - _research/brief-acquiring-methods-and-terminals.md — Sections 2.3 and 2.5 (iDEAL to Wero, SEPA Instant, FedNow).\n  - _research/brief-fraud-risk-and-compliance.md — Part 3 (regulation calendar: PSD3/PSR, Instant Payments Regulation).\n  - _research/brief-billing-and-revenue.md — Sections 1.10 and 2.3 (Orb, Talon.One, Metronome).\n  - _research/scenario-ledger.md — Mila's class pass, the method mix, fees, K1 to K8, the cast.\n  - _research/consistency-issues.md — Rulings 9, 14, 21 and 22.\n- **External**\n  - https://docs.adyen.com/payment-methods/wero — The payment guarantee, capture failure and the dispute process from February 2027 (fetched 2026-11-17).\n  - https://stripe.com/newsroom/news/ousd-is-now-available-on-stripe — Open Standard's founders and OUSD's launch (fetched 2026-11-17).\n  - https://oeil.secure.europarl.europa.eu/oeil/en/procedure-file?reference=2023/0210(COD) — PSR status on 17 November 2026.\n  - https://www.frbservices.org/resources/financial-services/fednow/volume-value-stats — FedNow volumes and average values.\n\n## Changelog\n\n- **2026-11-17** — First version, written from the PLAN contract, the journal-spec entry, ruling 9 and the gent payments, stablecoin balances or instant payments from either company (Stripe's 2025 letter gives growth of Bridge's volume, not a value); no Adyen stablecoin product. Sources note widened; units unchanged.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>

    (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {

            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');

                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
