## Thesis\n\n**Question:** When a platform sits between payer and seller, who is the merchant, who holds the money and who carries the loss?\n\n> **Claim:** The merchant is whoever the customer understands they are buying from, the money sits in balances at the provider and not with the platform, and the loss falls first on the balance the payment was booked to and then on the party assigned to cover that balance when it goes negative. The platform's configuration does not decide who the merchant is, but it must agree with it, and it does decide the booking and the loss bearer, on Stripe permanently for each account.\n\n**Disputed by:** The view that Standard, Express and Custom accounts, or marketplace and platform setups, differ in how much user interface the platform builds, so the choice belongs to the product team and can be revisited when the business model changes.\n\n**So what:** A team should settle who bears seller losses before it designs onboarding or the checkout, record that decision per account in its own systems, and expect a change of commercial model on Stripe to mean new accounts for its sellers, not a changed setting.\n\n**How and why:** Visa's rules (October 2026 edition) classify an entity as the merchant if it sells to the cardholder, is named to the cardholder and gives recourse in a dispute. Stripe's documentation (n.d., accessed November 2026) tells platforms to determine the merchant of record from the business model and not from the charge type, books negative transactions to the seller's balance for direct charges and to the platform's for charges made through the platform, offers a setting under which Stripe is responsible for negative seller balances, and says of an account's fee and loss responsibilities that their values cannot be updated later. Adyen's documentation (n.d., accessed November 2026) books amounts and fees to the platform's liable balance account unless split instructions say otherwise and deducts from it when sellers' balance accounts go negative. Where they differ, as documented in 2026: Stripe exposes loss bearing as a per-account choice with Stripe as one option; Adyen puts the platform behind its sellers by default and documents, as a pilot with limited availability, a Managed Risk programme in which Adyen bears seller losses.\n\n**Supporting claims**\n\n- **S1** — The merchant is whoever the customer understands they are buying from: card-network rules decide it by who sells, who is named and who gives recourse, and the platform's configuration has to agree with that fact and cannot decide it.\n- **S2** — The money sits in balances at a licensed provider and not with the platform, because the alternative, registering as a payment facilitator and holding the licenses, costs more than most platforms will pay.\n- **S3** — A loss falls first on the balance the payment was booked to and then on the party assigned to cover that balance when it goes negative, so a platform that never holds the funds can still carry the loss.\n- **S4** — Stripe records the booking in the charge type and the loss bearer in per-account responsibilities that cannot be changed, with Stripe as one option; Adyen records the booking in split and chargeback instructions on each payment and puts the platform's liable balance account behind every seller, by default; a Managed Risk pilot with limited availability is the one documented exception.\n- **S5** — A team therefore settles who bears seller losses before it designs onboarding or checkout, records the three answers per account in its own systems, and translates between the two vocabularies by question, not by term.\n\n## Role in the part\n\nEstablishes the three questions, the two vocabularies and the loss assignment that the other three chapters build on. Supports P7-1 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in scene, three-questions, stripe-connect, adyen-for-platforms: each supplies the terms the next one uses; `comparison` in stripe-connect with adyen-for-platforms; crosswalk; designs; where-they-differ; in-practice; `order_of_importance` in when-it-goes-wrong)\n\nThe reader meets a question nobody at Larkfield can answer (who funds a refund after payout) before any vocabulary, then gets the three questions in neutral terms, so that each provider's product can be read as answers and not as a feature list. Stripe comes before Adyen because its documentation states the loss assignment as an explicit property, which gives the reader the concept that Adyen's defaults and instructions then express differently. The crosswalk and the designs need both vocabularies; the comparison section needs the designs to say what the differences change; Larkfield's two configurations apply everything and answer the opening question; failures come last because each one is a model working as configured against a fact that changed. Moving the designs before the providers would leave them without the documented behavior that makes their costs concrete.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A member buys a €120 class pass through a booking platform. Two days later the studio is paid. A week after that the member wants €84 back for the classes she will not take. The studio's money has gone to its bank; the platform never held any of it. Whose balance pays the member?\n\n**Bridge:** An engineer integrating a platform product reads its account types and charge types as integration options: which API calls to make, which dashboard the seller sees, how much onboarding to build. → Those options assign money: they decide whose balance a refund or a chargeback is taken from and who covers that balance when it is empty, and on one provider the assignment cannot be changed afterwards.\n\n**Thesis statement** (KEY POINTS callout and paragraph p02): The merchant is whoever the customer understands they are buying from, the money sits in balances at the provider and not with the platform, and the loss falls first on the balance the payment was booked to and then on the party assigned to cover that balance when it goes negative. Configuration does not decide the first; it decides the other two, on Stripe permanently for each account.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from a refund after payout at Larkfield, and return to it with the answer on both providers. *Kept in:* scene, in-practice.\n- Define the three questions (merchant, balance, loss) and the network's terms for a company in the middle. *Kept in:* three-questions.\n- Show how Stripe Connect and then Adyen for Platforms answer them. *Kept in:* stripe-connect, adyen-for-platforms.\n- Translate between the two vocabularies and say where they do not map. *Kept in:* crosswalk.\n- Compare the three ways of assigning the loss and what each costs. *Kept in:* designs.\n- Set the two providers side by side. *Kept in:* where-they-differ.\n- Show how a platform model fails and how each failure is detected. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A refund requested after the seller has been paid needs new money, and on a platform it is not obvious whose: Mila wants €84.00 back a week after Studio Noord received its payout, and Larkfield, which never held the money, may be the one that funds it. | scenario: The refund after payout: Studio Noord was paid on Thursday 11 March 2027; on 18 March Mila asks for €84.00 back for seven unused classes of a €120.00 pass. |  |\n| p02 | claim | Three questions decide every platform payment: the merchant is whoever the customer understands they are buying from, the money sits in balances at the provider, and a loss falls first on the balance the payment was booked to and then on the party assigned to cover that balance when it goes negative; the platform's configuration must agree with the first answer and decides the vocabularies, to the three ways of assigning the loss, to the two providers side by side, to Studio Noord modeled on both, and to the ways a model goes wrong. |  | `sequence`: The stretch of the journey the chapter covers. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Who Funds Mila's €84.00?\n\n**Controlling idea** (`example`, id `scene`): A refund after payout shows that nobody at Larkfield can say whose balance pays for a reversal, because the answer was fixed by configuration years ago and written down nowhere.\n\n**Advances the thesis** (S3, S5): Poses the thesis question in a concrete case and shows the cost of not knowing the loss assignment.\n\n**Transition in:** `example`: The roadmap's promise to start from Larkfield's question. → The refund request as it reached Larkfield on 18 March 2027.\n\n**Order of paragraphs** (`chronological`): The request, then the three conflicting answers inside the company, then the questions they reduce to; the three questions only make sense after the reader has seen the answers disagree.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | On 18 March 2027 Studio Noord approved Mila's €84.00 refund in Larkfield's back office, a week after the €117.47 from her pass had been paid out, and Aylin Demir asked the payments team whose money would pay it. | scenario: Ines Bakker, owner of Studio Noord (on Adyen since 2024); Aylin Demir, Head of Studio Support; the €120.00 pass, Larkfield's fee €2.53, the studio's €117.47 paid out on 11 March. |  |\n| p07 | evidence | Femke de Graaf collected three answers from inside Larkfield (the studio, Larkfield, the provider), each held with confidence, and found that for the 1,140 studios on Stripe online and Adyen at the front desk the answer could differ by channel. | scenario: Local detail (fictional): product points to Larkfield's terms (the studio carries refunds and lost disputes), finance to the ledger account 'to recover from studio', Daniel Osei to the fact that the provider holds the money; 1,140 studios are on both providers. | `cause_effect`: Aylin's question. → Why nobody could answer it from Larkfield's own records. |\n| p08 | claim | Femke reduced the disagreement to three questions that a configuration answers one by one: who is the merchant, whose balance was the payment booked to, and who covers that balance if it goes negative. |  | `conclusion_summary`: Three confident answers that disagree. → The three questions the chapter is organized around. |\n\n### Three Parties, Three Questions: Merchant, Balance, Loss\n\n**Controlling idea** (`definition`, id `three-questions`): A platform payment has to answer who the merchant is, where the money sits and who carries a loss; the card networks' rules decide the first from what the cardholder sees, a licensed provider's balances answer the second, and a two-step rule answers the third.\n\n**Advances the thesis** (S1, S2, S3): Establishes the three answers in provider-neutral terms before either provider's vocabulary appears.\n\n**Transition in:** `elaboration`: Femke's three questions. → What each question means and what decides its answer, before any provider's terms.\n\n**Order of paragraphs** (`prerequisite_order`): Merchant, then the network's names for a company in the middle, then why the money sits at a provider, then the seller's balance, then the loss rule, then the table that joins them; the loss rule cannot be stated before the reader knows what a seller balance is and why the platform does not hold it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | The merchant is the party the cardholder buys from, and Visa's rules decide it by three tests: who sells the goods or services, whose name identifies the outlet to the cardholder, and who gives the cardholder recourse in a dispute. | quotation: Visa rule 5.3.2.2: an entity is classified as a Merchant or Sponsored Merchant if it 'is selling the goods or services to the Cardholder', 'uses its name primarily to identify its Merchant Outlet to the Cardholder' and 'provides recourse to the Cardholder in the event of a dispute'; Visa 'reserves the right to determine' the classification. |  |\n| p10 | definition | For an entity that is not itself the merchant, Visa's rule lists four classes, two of which fit a company between cardholder and seller: a payment facilitator, whose sellers are sponsored merchants and remain the merchants, or a marketplace, which puts its own name ahead of its retailers and is financially liable for disputes. | table: Table: Role \\| Visa's definition (October 2026) \\| Who the cardholder buys from. Rows: payment facilitator ('An entity that contracts with an Acquirer to deposit Transactions, receive settlement from, or contract with an Acquirer on behalf of a Sponsored Merchant'); sponsored merchant ('An entity that contracts with a Payment Facilitator and, pursuant to that contract, is able to accept a Card to sell goods or services'); marketplace ('An entity that brings together Cardholders and retailers on an electronic commerce website or mobile application and processes Transactions and receives Settlement on behalf of those retailers'; rule 5.3.4.1: name displayed 'more prominently than the name and brands of retailers', 'Is financially liable for Disputes'). | `elaboration`: The network's test for the merchant. → The network's names for the company in the middle, each tied to an answer to that test. |\n| p11 | explanation | A platform could register as a payment facilitator itself, and most do not, because registration brings an acquirer's sponsorship, card-data security validation, underwriting, payout and dispute systems and, where the platform controls the flow of funds, licenses of its own. | fact: Stripe's guide to payment facilitators lists the obligations and gives its own approximate minimums: Level 1 PCI DSS validation US$50,000 to US$500,000, a merchant management system from US$600,000, initial registration fees of US$5,000 each to Visa and Mastercard, US money transmitter licenses from US$450,000; the guide is vendor material in support of Connect and cites a September 2018 industry report (evidence age: about 8 years).; fact: Adyen's documentation treats a registered payment facilitator as one kind of platform customer: a platform onboards 'as a payment facilitator' when 'You are already registered with Visa or Mastercard as a payment facilitator'. | `contrast`: The facilitator role in network rules. → Why a platform rarely takes that role itself. |\n| p12 | definition | In a provider's platform product each seller instead becomes an account at the licensed provider with its own balance, so the answer to the second question is that the money sits in the provider's books and the platform is not in the flow of funds. | quotation: Stripe on Connect payouts: 'Stripe handles licensing requirements, and your platform isn't part of the payout funds flow.'; quotation: Adyen: 'Balance account: holds the funds of your user.'; reasoning: A seller balance is a claim on the provider (balances-and-funds-flows); which license lets the provider hold it is licences-and-safeguarding's subject (consistency ruling 3). | `problem_solution`: The cost of registering as a facilitator. → What a platform does instead, and where that puts the money. |\n| p13 | definition | A loss arises when a refund or a chargeback is larger than the balance it is booked to, and it then falls in two steps: first on the balance the payment was booked to, which goes negative, and then on the party assigned to stand behind that balance if the seller never fills it again. | quotation: Stripe: 'Stripe first assigns negative transactions to the account the associated charge was made on.'; quotation: Adyen: the liable balance account is 'the account where your business' funds are held. Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks.' | `sequence`: Where the money sits. → What happens when more is taken back than that balance holds. |\n| p14 | comparison (table) | Each of the three questions is decided by a different thing (the sale as the customer sees it, the booking of the payment, an assignment made in configuration), and only the last two are the platform's to choose. | table: Table: Question \\| What decides it \\| Who can change it \\| Where the two providers record it. Rows: Who is the merchant? \\| what the customer sees: seller, name, recourse (Visa 5.3.2.2) \\| nobody by configuration; only by changing the business \\| Stripe: charge type and `on_behalf_of` must match; Adyen: marketplace or platform model, and the store. Whose balance holds the money? \\| the booking of the payment \\| the platform, per payment \\| Stripe: charge type; Adyen: split instructions. Who covers a negative balance? \\| an assignment \\| the platform, when it configures \\| Stripe: the account's responsibilities; Adyen: the liable balance account.; figure: Figure 33-three-questions: payer, platform and seller around a provider's book of balances, with the three questions placed on the sale, on the booking and under the seller's balance. | `conclusion_summary`: The three definitions. → The three questions side by side, with what decides each. |\n\n### Stripe Connect: The Charge Type Books the Payment, the Account's Responsibilities Assign the Loss\n\n**Controlling idea** (`description`, id `stripe-connect`): Stripe answers the booking question with the charge type and the loss question with responsibilities set once on each connected account, with Stripe itself as one possible loss bearer.\n\n**Advances the thesis** (S1, S3, S4): Shows the three answers in Stripe's documented vocabulary, including the immutability of the loss assignment.\n\n**Transition in:** `example`: The three questions in provider-neutral terms. → The first provider's answers, in its own vocabulary.\n\n**Order of paragraphs** (`prerequisite_order`): Connected account, then charge type, then the merchant rule that constrains the charge type, then responsibilities, then what happens to a negative balance, then what else the choice fixes, then the legacy names; responsibilities are about a connected account's balance, so they need the booking rule first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | A connected account is the record a platform creates at Stripe for each seller, with its own balance, next to the platform's own account and balance. | quotation: Stripe defines a connected account as 'A person or business accepting payments or receiving payouts on a Connect platform'. |  |\n| p16 | definition | A charge type is the choice of which account a payment is created on: a direct charge is created on the connected account, and the two indirect types (destination charges, and separate charges and transfers) are created on the platform, which then moves the seller's share. | table: Table: Charge type \\| Where the payment is booked \\| Refunds and chargebacks reduce \\| Stripe's fees are debited from \\| Stripe's example. Direct: 'the payment appears in the connected account's balance, not in your platform's balance' \\| 'the connected account's balance' \\| the connected account or the platform, by configuration \\| a SaaS platform. Destination: 'the payment appears in your platform's balance. A portion of the funds immediately transfers to the connected account's balance' \\| 'your platform's balance' \\| 'your platform's balance' \\| a home rental marketplace or a ridesharing app. Separate charges and transfers: 'on your platform's account first. Create a separate transfer' \\| the platform's balance \\| the platform's balance \\| a marketplace with one cart for several sellers.; figure: Figure 33-charge-booking: one payment booked two ways, on the seller's balance (direct) and on the platform's balance with a transfer to the seller (indirect), and a chargeback arrow landing on the booked balance in each. | `elaboration`: The connected account and the platform account, each with a balance. → The setting that chooses which of the two a payment lands on. |\n| p17 | explanation | Stripe tells platforms to determine the merchant first and choose the charge type second, and its `on_behalf_of` parameter lets an indirect charge name the seller as the business of record without changing whose balance a dispute debits. | quotation: Stripe: 'The MoR is the entity that the customer understands they're buying from.' 'Determine the MoR based on the business model... Don't base it on the charge type or payment configuration.' Allowed combinations: platform as merchant of record, indirect charges without `on_behalf_of`; connected account as merchant of record, direct charges or indirect charges with `on_behalf_of`.; quotation: Stripe on disputes for indirect charges: the balance debited is the 'Platform's balance, with or without `on_behalf_of`'; the merchant-of-record page notes that the entity liable to the customer 'can differ from the entity whose balance Stripe directly debits for chargebacks'. | `contrast`: The charge type as a booking choice. → The limit on that choice: it has to match who the merchant is. |\n| p18 | definition | Who covers a connected account's negative balance is a property of the account, `losses_collector`, which names either Stripe or the platform and cannot be changed once the account has been configured to accept payments. | quotation: Stripe: 'You must define `defaults.responsibilities` properties when you add the Merchant configuration to an account. You can't update their values later.' `losses_collector`: 'Assigns responsibility for negative balances incurred by the connected account'; value `stripe`: 'Stripe is liable for the connected account's negative balances. Your platform is still liable for negative balances on your platform account.' Constraint: 'If you set `losses_collector` to `application`, then you must also set `fees_collector` to `application`.'; quotation: Stripe: 'If you use indirect charges, assign negative balance responsibility to your platform, not to Stripe. Assigning responsibility to Stripe doesn't absolve your platform of responsibility for its own balance.' | `sequence`: Which balance a reversal reduces. → Who stands behind a connected account's balance when it goes negative. |\n| p19 | process | When a connected account's balance goes negative, Stripe documents a recovery order: it offsets against the account's later payments, tries to debit the seller's bank account, stops payouts meanwhile, and then, if the platform is responsible, takes the amount from a reserve held on the platform's balance after 180 days. | quotation: Stripe: 'Regardless of ultimate responsibility, if a connected account's balance becomes negative, Stripe first attempts to offset the negative amount by collecting funds from the account's external account.' If the platform is responsible, Stripe 'holds funds in your platform account in reserve'; 'if a connected account's balance remains negative for 180 days, we transfer funds from the platform reserve to cover the negative amount.'; fact: The reserve is the platform's `connect_reserved` balance; 'While an account's balance is negative, you can't send payouts to the account's bank or debit card on their behalf'; bank debits need `debit_negative_balances` and a bank in a supported country. | `sequence`: The assignment of the loss. → How the loss is collected, step by step. |\n| p20 | comparison | The loss assignment fixes more than the loss: under Stripe's responsibility the platform cannot pause a seller's payouts, debit its balance or offer it the provider's financial products (accounts and payment cards for sellers), and under the platform's responsibility it can do all three and must manage seller risk itself. | table: Table from Stripe's risk page: Aspect \\| Stripe is responsible \\| Platform is responsible. Losses: 'Stripe covers losses due to your connected accounts' negative balances' \\| 'Your platform can incur losses'. Payment fees: from connected accounts or the platform \\| from the platform. Seller risk operations: Stripe's risk teams; Managed Risk \\| the platform; 'You can't use Managed Risk'. Payment and payout pauses: 'You can't pause payments or payouts' \\| can pause. Debiting seller balances: 'You can't directly debit connected account balances' \\| in certain regions. Verification data: Stripe collects \\| the platform collects 'unless they use the Stripe Express Dashboard'. Accounts and cards: 'Your platform can't use Stripe Treasury or Issuing' \\| can offer them. | `additional_support`: The loss bearer and the recovery process. → The other settings and permissions that follow from the same choice. |\n| p21 | context | The older names Standard, Express and Custom were bundles of these same decisions, and the current Accounts v2 interface that unbundles them was, as of November 2026, documented with a preview API version and still needed the older interface for some features. | fact: The account-types page carries a 'Deprecated feature' notice and says 'After you create a connected account, you can't change its type'; fraud and dispute liability: Standard, the connected account for direct charges; Express and Custom, the platform.; fact: Accounts v2 gives an Account configurations (`merchant`, `customer`, `recipient`); the documentation's example request carries 'Stripe-Version: 2026-10-28.preview'; 'You must use Accounts v1' for some cases, among them the `treasury` and `card_issuing` capabilities. Release status (verified 17 November 2026): Stripe's changelog for API version 2025-12-15 says Accounts v2 'is now available for new Connect users'; the API reference says 'The Accounts v2 API is broadly available to Connect platforms, and to other users in preview.' Express Dashboard access combined with Stripe responsibility for negative balances is in public preview.; reasoning: INFERENCE block: Stripe's documentation says the values cannot be updated and does not say what a platform should do when its commercial model changes; for the dashboard setting it does say 'To change a connected account's dashboard, you must create a new Account object' (https://docs.stripe.com/connect/migrate-to-controller-properties). The author reads the same remedy into a change of loss bearer: new accounts for the sellers, with onboarding repeated. | `time`: Responsibilities as Stripe documents them today. → The names an older integration uses for the same decisions, and the release stage of the new ones. |\n\n### Adyen for Platforms: The Model Names the Merchant, the Liable Balance Account Stands Behind Every Seller by Default\n\n**Controlling idea** (`description`, id `adyen-for-platforms`): Adyen answers the merchant question with a choice of model, the booking question with split and chargeback instructions on each payment, and the loss question with the platform's liable balance account, the only party its public documentation puts behind a seller.\n\n**Advances the thesis** (S1, S3, S4): Shows the same three answers in Adyen's documented vocabulary and where the public record on loss bearing stops.\n\n**Transition in:** `contrast`: Stripe's answers: a charge type and a permanent per-account property. → The second provider's answers, which use an account structure and per-payment instructions.\n\n**Order of paragraphs** (`prerequisite_order`): Model, balance platform, the seller's resources, the platform's liable account, the booking rules, then the negative balance and the limit of the evidence; the booking defaults name the liable balance account, so it must be defined before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | comparison | Adyen asks the merchant question first, as a choice between two integration models whose names reuse words this chapter has used more loosely: a marketplace model, where the shopper deals with the platform, and a platform model, where the shopper deals with the platform's user. | quotation: Adyen's model comparison: shopper interaction is 'Directly with you' for a marketplace and 'Directly with your user' for a platform; in-person payments and payment facilitators are supported only in the platform model. Marketplace: 'Customers recognize that they are doing business directly with your marketplace.' Platform: 'your users have a contractual relationship with the payment methods, while you maintain a relationship with your users.' |  |\n| p23 | definition | The balance platform is Adyen's accounting system for a platform's funds, separate from the merchant accounts in which payments are processed, and a platform has one per region in which it acquires payments. | quotation: Adyen: 'The balance platform is an accounting system that manages the flow of funds within your business. You must have a separate balance platform for each region in which you acquire payments.' A store 'ensures that the transactions you process for your users correspond to an accurate payer statement'. Acquiring regions listed: Australia, Canada, Europe/EEA, Hong Kong, New Zealand, Singapore, United Kingdom, United States. | `sequence`: The choice of model. → The system in which the money of either model is kept. |\n| p24 | definition | A seller on the balance platform is several resources, each answering one thing: a legal entity says who the seller is, an account holder what it may do, a balance account holds its funds, a transfer instrument is its verified bank account, and a store ties its payments to the name the payer sees. | table: Table: Resource \\| Adyen's definition \\| The question it answers. Legal entity: 'contains information about your user, for example, the legal name, address, and tax information'. Account holder: 'specifies what your user can do in your platform'. Balance account: 'holds the funds of your user. All financial activities in your platform, such as paying out to a bank account, happen through balance accounts'. Transfer instrument: 'your user's verified bank account where they can receive payouts'. Store: ties the user's payments to a merchant account and an accurate payer statement.; fact: Adyen's worked example: per user 'At least one account holder for each country your user operates in' and 'For each account holder, at least one balance account with a defined base currency'.; figure: Figure 33-seller-resources: Provider A as one account object with settings inside it; Provider B as four linked resources for the seller with the platform's liable balance account beneath them. | `elaboration`: The balance platform as the place where funds are kept. → What a seller is inside it. |\n| p25 | definition | The platform has its own pair of resources on the balance platform, a liable account holder and a liable balance account, which Adyen creates and from which it may deduct when a seller's balance account goes negative. | quotation: Adyen: 'Liable account holder: represents your business in the balance platform. Liable balance account: the account where your business' funds are held. Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks. These resources are created by Adyen.' | `similarity`: The seller's resources. → The platform's own resources of the same kinds, with a role the seller's do not have. |\n| p26 | process | Bookings go to the liable balance account unless an instruction says otherwise: a split instruction books part of a payment to a seller's balance account, a refund instruction debits the accounts the payment was credited to, and a chargeback instruction sent with the payment, or a default set through Adyen's support, books a later chargeback to a seller. | quotation: Adyen: 'By default, all transaction amounts and fees are booked to your platform's liable balance account'; 'If you do not specify an `account` in your split instructions, the split amount is booked to your liable balance account.'; quotation: Adyen on chargebacks: 'Adyen withdraws the disputed funds from your platform's liable balance account'; 'You can change this behavior by booking the disputed amount to any of the balance accounts in your platform, or even splitting it between the accounts'; the `platformChargebackLogic` object takes `deductFromLiableAccount`, `deductFromOneBalanceAccount` or a split by ratio, set per payment or as a balance-platform default configured through support. Refunds: 'Refunds can only be deducted from the balance accounts to which the payment was credited.' | `sequence`: The liable balance account. → How payments, chargebacks and refunds are booked to it or away from it. |\n| p27 | analysis | When a seller's balance account goes negative, Adyen's public documentation lets the balance stand for up to 30 days and then debits the platform's reserved compensation account, names tools for recovery, and documents one exception to the platform as loss bearer: Managed Risk, a pilot with limited availability in which Adyen assumes responsibility for negative balances. | fact: Adyen documents top-ups 'To cover negative balances resulting from refunds or chargebacks', pulled by direct debit from a verified transfer instrument, and internal funds transfers 'between your liable balance account and the balance account of one of your users'.; reasoning: Documented (Adyen docs, 'Manage liable balance accounts', https://docs.adyen.com/platforms/manage-liable-accounts): 'Adyen allows negative balances for up to 30 days. If a balance account has a negative balance for more than 30 days, Adyen compensates this by debiting your reserved compensation account on the first day of the following month.' Three liable accounts (main, reserved incorrect splits, reserved compensation). A separate reserve account ('Manage your reserve account') is collateral for negative balances caused by transfers. Exception (Adyen docs, 'Adyen Managed Risk', https://docs.adyen.com/platforms/managed-risk, n.d., accessed November 2026): 'Limited availability', 'in pilot phase'; Adyen will 'assume the responsibility for negative balances on their accounts'; write-offs after the balance 'has remained negative for 180 days after their last captured payment'. Consistency ruling 41.; reasoning: INFERENCE block: because the chargeback instruction travels with each payment, two payments of the same seller can carry different loss assignments, so the platform has to store the instruction it sent with each payment. | `cause_effect`: The booking rules. → What follows when a seller's balance account cannot cover what is booked to it, and what the public record does not say. |\n\n### One Set of Questions, Two Vocabularies\n\n**Controlling idea** (`comparison`, id `crosswalk`): The two vocabularies translate question by question, not term by term, and in three places they do not map one to one.\n\n**Advances the thesis** (S4, S5): Gives the reader the translation the second can_do outcome asks for and marks its limits.\n\n**Transition in:** `similarity`: Two providers described one after the other. → The same questions answered in both vocabularies in one table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison (table) | Asked seven questions, this chapter's three and the four practical ones an integration meets around them, the two providers answer with different words for the same function, which the table pairs as the author's own mapping, since neither company publishes one. | table: Table (author's mapping, an inference): Question \\| Stripe term \\| Adyen term. A seller \\| connected account (v2 Account with the `merchant` configuration) \\| legal entity + account holder + balance account. The seller's money at the provider \\| connected account balance \\| balance account. The platform's own money \\| platform balance, with `connect_reserved` \\| liable balance accounts (main, reserved compensation, reserved incorrect splits). How a payment is tied to the merchant \\| charge type and `on_behalf_of` \\| model, store and merchant account. Where a payment is booked \\| charge type \\| `splits` instructions. The platform's cut \\| application fee \\| `Commission` split. Who bears seller losses \\| `losses_collector` on the account \\| the liable balance account, with chargeback and refund instructions. |  |\n| p29 | analysis | The mapping breaks in three places: one Stripe object against several Adyen resources, a loss assignment fixed per account against one instructed per payment, and a loss bearer chosen per account on Stripe against a default of the platform on Adyen with a pilot program as the exception. | reasoning: From the two sections above: a v2 Account carries identity, configurations and a balance, while Adyen separates them; `losses_collector` cannot be updated, while `platformChargebackLogic` is sent per payment; Stripe documents the value `stripe`, Adyen documents no counterpart. | `contrast`: The rows that pair cleanly. → The three places where a term in one vocabulary has no single counterpart in the other. |\n\n### Three Ways to Assign the Loss, and What Each Costs\n\n**Controlling idea** (`comparison`, id `designs`): A platform that does not register as a facilitator has three realistic models, distinguished by who the merchant is and who stands behind the seller, and each trades control and revenue against exposure.\n\n**Advances the thesis** (S3, S5): Turns the loss rule into a design choice with stated costs, and argues it comes first.\n\n**Transition in:** `cause_effect`: Two vocabularies for the same three answers. → The combinations of answers a platform can actually choose, as designs.\n\n**Order of paragraphs** (`comparison`): The three models in order of rising platform exposure, then the pricing that follows each, then the table, then the recommendation; the recommendation needs the costs of all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | description | In the first model the seller is the merchant and the provider bears the seller's losses, which Stripe documents as a setting on the account and Adyen as a pilot program, and which costs the platform its control over the seller's payouts and balance. | fact: Stripe's 'Stripe-owned pricing model': connected accounts 'Are the merchant of record', 'Pay Stripe fees', 'Assume liability for their negative balances', 'Process payments as direct charges'; 'Stripe doesn't charge your platform in this model'. Managed Risk: 'Stripe assumes liability for unrecoverable negative balances on connected accounts'; direct charges are compatible, destination charges with `on_behalf_of` are in private preview, other indirect charges are not compatible. |  |\n| p31 | description | In the second model the seller is still the merchant and the platform stands behind it, which gives the platform the pricing, the pause and the debit, and the account risk of every seller it onboards. | fact: Stripe's 'Buy rate model': connected accounts 'Don't pay Stripe fees', 'Are the merchant of record', 'Are liable to the platform, not Stripe, for their negative balances', and process direct charges or destination charges with `on_behalf_of`. Adyen's platform model with chargebacks instructed to the user's balance account: 'Use this logic if you want to make your user liable for all chargeback-related events on the payment.' | `contrast`: The provider behind the seller. → The platform behind the seller, with the controls and the exposure that brings. |\n| p32 | description | In the third model the platform is the merchant, so payments are booked to its own balance and every refund and chargeback reduces that balance first, whatever the seller later repays. | fact: Visa's marketplace qualification: the marketplace 'Is financially liable for Disputes'. Stripe's marketplace guide: 'You're the merchant of record', 'You pay Stripe fees and manage disputes and refunds'. Adyen's marketplace model: shopper interaction 'Directly with you'; chargebacks withdrawn from the liable balance account by default. | `contrast`: Models in which the seller is the merchant. → The model in which the platform is. |\n| p33 | explanation | Platform revenue follows the same choice: where the provider prices and bears the loss the platform earns a fee on top or a revenue share, and where the platform bears the loss it buys processing and sets its own price, at a published list price on Stripe and a negotiated one on Adyen. | fact: Stripe's list prices as served to the Netherlands: where Stripe handles pricing for the platform's users there are no fees for the platform; where the platform handles pricing, €2 per monthly active account and 0.25% + €0.10 per payout sent. Adyen: the platform's revenue is a `Commission` split booked to the liable balance account; no public price list for Adyen for Platforms was found, and the get-started page says to 'contact us to register your interest'. | `additional_support`: The three models by exposure. → The three models by where the platform's revenue comes from. |\n| p34 | comparison (table) | Set side by side, the three models and the facilitator route differ in who the customer sees, where a reversal lands first, who stands behind the seller, what the platform controls and what it earns. | table: Table: Model \\| Merchant \\| A reversal lands first on \\| Behind the seller \\| Platform controls \\| Platform earns \\| Documented at. Provider bears seller losses \\| seller \\| seller's balance \\| the provider \\| least: no pause, no debit \\| a fee on top or a revenue share \\| Stripe; Adyen in pilot. Platform bears seller losses \\| seller \\| seller's balance (Stripe direct charge; Adyen when instructed) or the platform's (Stripe indirect charge; Adyen default) \\| the platform \\| pricing, pauses, recovery \\| its own price less the provider's cost \\| Stripe and Adyen. Platform is the merchant \\| platform \\| platform's balance \\| the platform \\| everything customer-facing \\| its margin on the sale \\| Stripe and Adyen. Register as a facilitator \\| seller \\| the facilitator's arrangement with its acquirer \\| the facilitator \\| everything, with the license and registration duties \\| the full processing margin \\| network rules; Adyen documents onboarding registered facilitators. | `conclusion_summary`: Three models and their pricing. → The comparison in one table, with the facilitator route for reference. |\n| p35 | recommendation | I decide the loss bearer first and take the provider-bears-losses model only when sellers are numerous, small and unknown to me and I do not need to control their payouts; I take the platform-bears model when I price payments myself or plan to offer accounts and cards. | reasoning: From the Stripe table of consequences: Treasury and Issuing require the platform to bear losses; pausing payouts and debiting balances require it too. The condition under which the recommendation fails: a platform without a risk function and without capital to absorb a failed seller should not take the second model for its revenue alone. | `conclusion_summary`: The trade-off table. → The author's rule for choosing, with its conditions. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): As documented in November 2026, Stripe makes loss bearing a permanent per-account choice with itself as one option, and Adyen makes it a default on the platform's liable account that instructions on each payment redistribute, with no other bearer in the public record.\n\n**Advances the thesis** (S4): States the documented difference the thesis ends on.\n\n**Transition in:** `contrast`: Designs that hold on either provider. → The differences between the two providers that change how a design is implemented.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | comparison (table) | Seven documented differences separate the two platform products, and the largest is who may stand behind a seller. | table: Table: Aspect \\| Stripe \\| Adyen \\| What the difference suggests (author's inference). How the merchant is expressed \\| per payment, by charge type and `on_behalf_of` \\| by integration model (marketplace or platform) and store \\| on Stripe one seller account can be charged either way; on Adyen it is closer to a structural decision. What represents a seller \\| one Account with configurations \\| legal entity, account holder, balance account, transfer instrument \\| Adyen separates identity, permissions and money in the API. Where a chargeback is booked \\| by charge type: the connected account's balance for direct charges, the platform's for indirect, with or without `on_behalf_of` \\| the liable balance account by default; another account per payment through `platformChargebackLogic`, or a default set through support \\| Stripe decides by the kind of charge, Adyen by an instruction on each payment. Who stands behind a seller's negative balance \\| Stripe or the platform, per account (`losses_collector`) \\| the platform's liable accounts by default; Adyen under Managed Risk, a pilot with limited availability \\| Stripe offers the provider as loss bearer as a setting, Adyen as a pilot. Can the assignment change \\| no: 'You can't update their values later' \\| instructions are sent per payment; the default is changed through support \\| a new model means new accounts on Stripe, new instructions on Adyen. Recovery from a negative seller balance \\| debit of the seller's bank account, a reserve on the platform, a transfer after 180 days \\| top-up by direct debit and internal transfers; a debit of the platform's reserved compensation account after more than 30 days \\| both publish a timeline: 180 days on Stripe, one to two months on Adyen. Price list for the platform product \\| public (Netherlands: €2 per active account and 0.25% + €0.10 per payout when the platform prices) \\| Not public; Adyen's pricing page lists payment-method prices only ('Other Adyen products, besides payment methods, are priced separately') \\| no inference drawn. |  |\n| p37 | recommendation | On Stripe an integrator decides the loss bearer before creating the first account and stores it per account, and on Adyen sends and stores the chargeback instruction with every payment and expects a seller's negative balance to reach its reserved compensation account within one to two months. |  | `cause_effect`: The seven differences. → What an integrator does differently on each provider because of them. |\n\n### In Practice at Larkfield: Studio Noord Modeled Twice\n\n**Controlling idea** (`example`, id `in-practice`): Modeled on both providers, the same studio gets the same merchant answer and the same final loss bearer, Larkfield, through a different booking on each, which is why Larkfield carries a loss on money it never holds.\n\n**Advances the thesis** (S1, S3, S5): Works the three questions for one seller on both providers with ledger numbers and answers the opening question.\n\n**Transition in:** `example`: The differences between the providers in general. → One Larkfield studio configured on each.\n\n**Order of paragraphs** (`comparison`): The merchant answer first because it is the same on both, then Adyen as the studio's real provider, then Stripe as the counterfactual, then the two reversals side by side, then what Larkfield records; the table needs both configurations.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | example | Studio Noord is the merchant on either provider, because Mila books a class at Studio Noord, sees the studio's name on her statement and asks the studio for her refund. | scenario: Ledger: Larkfield 'is not the merchant of record for class sales; the studio is the seller'. New canonical detail: the card statement shows the studio's name. |  |\n| p39 | example | On Adyen, where Studio Noord has been since 2024, Larkfield uses the platform model: the studio is a legal entity with an account holder, a euro balance account, a transfer instrument and a store, the €120.00 is split €117.47 to the studio's balance account and €2.53 to Larkfield's liable balance account, and each payment carries an instruction that books a chargeback and its fee to the studio's balance account. | scenario: Ledger: €120.00 pass, Larkfield's fee €2.53, studio receives €117.47; the liable balance account keeps €1.92 after the illustrative €0.61 processing cost (assumption). New canonical detail: Larkfield sends `platformChargebackLogic` with `deductFromOneBalanceAccount`, the studio's balance account as target and as cost allocation account.; fact: Adyen documents `deductFromOneBalanceAccount` with a `targetAccount` and an optional `costAllocationAccount` ('By default, chargeback fees are booked to your liable balance account'). | `sequence`: The merchant answer. → The configuration that expresses it on the provider the studio really uses. |\n| p40 | example | Had Studio Noord been on Stripe, like the studios Larkfield onboarded before 2024, it would be a legacy Custom connected account charged by destination charges with `on_behalf_of`, with Larkfield collecting the fees, the verification data and bearing the losses. | scenario: New canonical detail: Larkfield's Stripe studios are legacy Custom accounts (created from 2017; no Stripe dashboard); payments are destination charges with `on_behalf_of` set to the studio and an application fee equal to Larkfield's fee; in controller-property terms `losses.payments`, `fees.payer` and `requirement_collection` are all `application`, which agrees with the ledger's statement that Larkfield collects verification information on Stripe.; fact: Stripe: the buy rate model allows 'destination on-behalf-of (OBO) charges'; for Custom legacy accounts fraud and dispute liability is the platform's, and a Custom account maps to `losses.payments: application`, `requirement_collection: application`, `stripe_dashboard.type: none` (https://docs.stripe.com/connect/migrate-to-controller-properties); `on_behalf_of` makes 'the connected account the business of record for the payment'. | `contrast`: Studio Noord on Adyen. → The same studio on Stripe, as Larkfield's older studios are configured. |\n| p41 | comparison (table) | For Mila's €84.00 refund and for Bram de Wit's €120.00 dispute the first balance debited differs by provider (Larkfield's platform balance on Stripe, Studio Noord's balance account on Adyen) and the party behind it is Larkfield on both. | table: Table: Question \\| Studio Noord on Adyen \\| Had it been on Stripe. Merchant \\| Studio Noord (platform model; the store) \\| Studio Noord (`on_behalf_of`). The €120.00 is booked to \\| €117.47 studio's balance account, €2.53 liable balance account \\| Larkfield's platform balance, then €117.47 transferred to the studio's balance. The €84.00 refund debits first \\| the studio's balance account, by the refund's split instruction \\| Larkfield's platform balance; Larkfield recovers by reversing the transfer. The €120.00 chargeback and €15.00 fee (illustrative) debit first \\| the studio's balance account, by the chargeback instruction \\| Larkfield's platform balance; Larkfield 'can attempt to recover funds' by reversing the transfer. If the studio cannot cover it \\| the liable balance account \\| Larkfield's balance has already paid; what it cannot pull back stays its loss.; fact: Stripe: for destination charges 'Stripe debits your platform balance for the refund amount. You can reverse the transfers made to your connected accounts to recover your refund cost'; for disputes on indirect charges 'your platform can attempt to recover funds from the connected account by reversing the transfer'. Adyen: 'Refunds can only be deducted from the balance accounts to which the payment was credited.'; figure: Figure 33-loss-steps: a reversal stepping down from the booked balance, to the seller's bank account, to the party behind the seller, with the platform at the bottom step. | `cause_effect`: The two configurations. → What each does with the refund and the dispute from the ledger. |\n| p42 | recommendation | Under Keel, Femke's team records the three answers per studio and provider in Larkfield's own systems and reports one exposure figure, the paid-out volume that can still come back, because 'we never hold the funds' had been read as 'we never carry the loss'. | scenario: Ledger: about €156 million of paid-out online card volume is inside the 120-day dispute window at any time (what is disputable, not an expected loss); the ledger account 'to recover from studio' (K3). New local detail: per studio and provider the payment service stores merchant, booking rule, loss bearer and whether the assignment can change. | `conclusion_summary`: Larkfield as the party behind the studio on both providers. → What Larkfield now writes down and measures because of it. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): A platform model fails in four recognizable ways (a seller that disappears, a configuration that contradicts the merchant, a booking that silently falls back to the platform, a commercial model that changes), and each is detected from a record the platform can keep.\n\n**Advances the thesis** (S3, S5): Shows the loss rule and the immutability at work in failure, with detection and recovery.\n\n**Transition in:** `contrast`: A model that works as configured. → The ways a model fails, and the record that shows each.\n\n**Order of paragraphs** (`order_of_importance`): From the failure that costs money directly, to the one that causes disputes, to the one that hides, to the one that is slow; the first three are operational and the last is a planning failure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | example | The costliest failure is a seller that stops trading while its customers can still dispute: the chargebacks arrive at a balance nobody refills, and the party behind it pays. | case: Stripe's own example: 'During the COVID pandemic, some hotels and short-term accommodation providers represented by connected accounts went out of business. As a result, customers who had pre-paid for future stays submitted chargebacks, which were covered by the platforms that processed those payments.'; reasoning: Detection: an exposure figure per seller (paid-out volume inside the dispute window, weighted toward prepaid sales). Recovery where the platform bears losses: pause payouts, hold a reserve on the seller's balance, debit or top up from the seller's bank account, all of which need the seller to still exist. |  |\n| p44 | cause_effect | A configuration that contradicts the merchant shows up as disputes: when the statement, the receipt and the checkout name different businesses, customers do not recognize the payment, and Stripe's documentation warns of network scrutiny and fines. | quotation: Stripe: 'Misalignment can confuse customers, increase unrecognized transactions and disputes, require your platform to take remediation actions, and possibly lead to card-network scrutiny or enforcement, including fines.'; reasoning: Detection: follow one payment from checkout to receipt to statement descriptor to the provider configuration and check that all four name the same business; the Borrowed Blueprint is a charge type copied from a larger platform whose merchant answer was different. | `additional_support`: A loss that follows the configuration. → A failure in which the configuration itself is wrong about the merchant. |\n| p45 | cause_effect | On Adyen a wrong balance account in a split or chargeback instruction does not fail the payment: the amount is booked to the platform's liable balance account, and only reconciliation shows it. | quotation: Adyen: 'The API request validates only the format of the split instructions, not the balance accounts specified in the request... If the balance account does not exist, or it is linked to an account holder with a closed status, the full transaction and its fees are booked to your platform's liable balance account.'; reasoning: Detection: reconcile every split leg against the balance platform's transfer webhooks and accounting report (payment-reconciliation-and-reporting); a closed studio is exactly the case in which the fallback and a late chargeback coincide. | `contrast`: A failure the customer notices. → A failure nobody notices until the books are compared. |\n| p46 | analysis | The slow failure is a change of commercial model on accounts whose responsibilities are fixed: on Stripe a platform that wants to move from the provider's pricing and cover to its own cannot change the setting and has to plan a migration of its sellers. | reasoning: From 'You can't update their values later' and 'After you create a connected account, you can't change its type' (Stripe docs). The remedy, new accounts with onboarding repeated, is documented by Stripe for unsupported configurations ('Migrate to a supported Connect configuration': 'you need to create new connected accounts with the desired account configuration and re-onboard your users'); that it applies to a platform's own change of commercial model is the author's inference, labeled as such; a platform can therefore end up with several combinations of responsibilities and must store them per account. | `time`: Failures that occur on a single payment. → A failure that takes years to appear. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The charge type, the responsibilities, the model, the split and the chargeback instruction are one decision made in pieces: who pays when a seller cannot. Stripe asks for it once per account and holds the platform to it; Adyen asks for it on every payment and defaults to the platform. Either way the platform has made the decision by the time the first account exists, whether or not anyone in the company knows.\n\n**So what:** A platform's largest payments exposure is money it never held: paid-out volume that can still be refunded or disputed. A team that knows its loss assignment can size that exposure, price for it and tell a seller in advance what happens to a refund; a team that does not finds out from its own balance.\n\n**Callback:** Mila's €84.00 refund after Studio Noord's payout, and the question of whose balance funds it. The reader can now answer it: Studio Noord's balance account on Adyen is debited first and Larkfield's liable balance account stands behind it; on Stripe Larkfield's platform balance would be debited first; on both, Larkfield carries what the studio cannot.\n\n**Takeaway** (`course_of_action`): Before designing onboarding or checkout, name the merchant from what the customer sees, decide who stands behind a seller's negative balance, write both down per account in your own system, and compute the paid-out volume that can still come back.\n\n**Hand-off** to [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html): `cause_effect`: Chapter 33's result that every seller is an account at a licensed provider, with someone standing behind its losses. → What follows from that: the provider must know who each seller is before the account may take payments or receive payouts, and must keep knowing it, which makes verification a state with deadlines.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis (list) | Established: the networks decide the merchant by what the cardholder sees, both providers keep seller money in their own balances, reversals are booked to the balance the payment was booked to, and Stripe fixes the loss bearer per account. |  |  |\n| p48 | synthesis (list) | Depends on context: which model fits depends on who the customer buys from, whether the platform prices payments, whether it wants accounts and cards, and how well it knows its sellers; on Adyen a negative seller balance may stand for up to 30 days before the reserved compensation account is debited, and Adyen bears the loss only under Managed Risk, a pilot with limited availability. |  | `contrast`: What is settled. → What varies with conditions. |\n| p49 | recommendation (list) | The author's synthesis: the account model is a liability decision that I take first and record per account, and I treat 'we never hold the funds' as saying nothing about who carries the loss. |  | `additional_support`: What depends on context. → The author's own position. |\n| p50 | recommendation (list) | Nine questions let the reader test a platform model or a provider in a design review. |  | `sequence`: The three tiers. → Questions to take into a review. |\n| p51 | transition | Every seller is now an account at a licensed provider with someone standing behind its losses, so the provider has to know who each seller is before that account may take payments or receive payouts, and has to keep knowing it, which makes verification a state with deadlines. |  | `cause_effect`: The answered question about Mila's €84.00 and the party behind Studio Noord. → Verification as the next consequence of the loss assignment. |\n\n## Non-goals\n\n- The mechanics of splits, application fees, transfers and transfer reversals, top-ups, and how a refund or dispute after payout is unwound leg by leg. See [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html), [Journey 3: One Payment, Three Parties, and a Refund After Payout](journey-platform-payment.html).\n- Capabilities, verification requirements, deadlines and onboarding flows. See [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html), [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- Accounts, cards and financing for sellers. See [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- Merchant of record as an operating model in which the provider is the legal seller. See [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html).\n- Acquirer of record, sponsor banks and the facilitator's place under an acquirer. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html).\n- Custody, safeguarding and what a license lets a provider hold. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Balances, reserves and negative balances for a single merchant; payout schedules and returns. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html), [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Dispute process, evidence and deadlines. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html), [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Resolved in the verification pass (ruling 41): Adyen documents Managed Risk, a pilot with limited availability, in which Adyen bears users' negative balances; the default remains the platform (negative balances allowed for up to 30 days, then the reserved compensation account is debited). The journal-spec fields copied here were corrected in the reconciliation pass of 17 November 2026.\n- Stripe's Accounts v2 status, resolved in the verification pass: available to Connect platforms since API version 2025-12-15 and 'broadly available to Connect platforms' in the API reference; some combinations and the non-Connect use remain in preview. The chapter dates the observation.\n- Mastercard's current payment-facilitator rules could not be read directly (consistency ruling 17); the network-rule section rests on Visa.\n- Stripe's payment-facilitator guide was served in Dutch in this session; its figures were confirmed there and are paraphrased, not quoted.\n- Adyen for Platforms pricing: no public price list for the platform product (Adyen's pricing page lists payment-method prices only).\n- How either company builds its platform product internally: nothing published.\n\n## Decision log\n\n- **2026-11-17** — Stripe before Adyen in the mechanism sections, because Stripe documents the loss assignment as a named property and that gives the reader the concept before Adyen's defaults and instructions. Rejected: Adyen first; one interleaved section by question.\n- **2026-11-17** — The facilitator route is explained in the vocabulary section and appears in the trade-off table for reference, not as a fourth design paragraph: the contract says platforms rarely take it and chapter 6 owns the role. Rejected: A full design paragraph on registering as a facilitator.\n- **2026-11-17** — Larkfield's Stripe studios are modeled as legacy Custom accounts with destination charges and `on_behalf_of`, Larkfield collecting fees and bearing losses; its Adyen payments carry a chargeback instruction naming the studio's balance account. Both follow from the ledger (the studio is the seller; the provider's cost comes out of Larkfield's fee; the loss falls on Larkfield if the studio cannot cover it) and are appended to the ledger. Rejected: Direct charges on Standard accounts (the studio would then pay Stripe's fees itself, against the ledger); Express accounts (Stripe would collect verification data, against the ledger line of chapter 26); leaving the configuration unstated.\n- **2026-11-17** — The refund after payout is answered here only as far as whose balance is debited first and who stands behind it; the legs are left to chapter 35 (consistency ruling 7). Rejected: Working the refund's split and fee return here.\n- **2026-11-17** — The acceptance probe uses a dog-grooming platform, and Stripe's merchant-of-record page uses pet groomers as its own example; the chapter therefore quotes neither that example nor any grooming case. Rejected: Quoting Stripe's scenario table.\n- **2026-11-17** — Adyen's supplied consent wording about deducting from a user's bank account is not used: the page did not show it when re-fetched. Rejected: Quoting it from the research brief.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, chapter 33 contract — Scope, owned terms, Larkfield example.\n  - journal-spec.json, entry platform-payment-models — Intent, acceptance criteria, thesis, role (copied unchanged).\n  - _research/brief-platforms-and-embedded-finance.md, Parts 1, 3 and 5 and the open questions — Tagged claims on network rules, Connect, Adyen for Platforms, loss liability, pricing; the vocabulary crosswalk as judgement.\n  - _research/scenario-ledger.md — Mila's class pass, the refund after payout, the €120 dispute, the exposure figure, Keel K3.\n  - _research/consistency-issues.md, rulings 2, 3, 7 and 17 — Ownership of verification, custody, the liability rule and the Mastercard limitation.\n- **External**\n  - Stripe documentation (merchant of record, charges, risk and liability, connected account configuration, Accounts v2, account balances, disputes, account types, SaaS platform, marketplace, Managed Risk), Connect pricing, the payment facilitators guide, Stripe Sessions 2026 — Stripe's documented platform model; re-fetched in this session.\n  - Adyen documentation (Adyen for Platforms model, account structure, platform and marketplace account structure, split transactions, automatic split configuration, split chargebacks, split refunds, top-ups, internal funds transfers, get started) — Adyen's documented platform model; re-fetched in this session.\n  - Visa Core Rules and Visa Product and Service Rules, 24 October 2026 — Definitions of payment facilitator, sponsored merchant and marketplace; rule 5.3.2.2; marketplace qualification; re-fetched in this session.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — Verification pass: 90 claims checked (76 confirmed, 7 corrected, 5 hedged, 0 unsupported and removed or relabeled, 0 unreachable; 2 not checked); Adyen does document a period and accounts for a seller's negative balance (up to 30 days, then a debit of the platform's reserved compensation account), so the 'no period, no reserve' statements were replaced; and Adyen documents Managed Risk, a pilot in which Adyen bears seller losses (ruling 41), so every 'only Stripe' statement was replaced in the key point, the Adyen section, the crosswalk, the models, the comparison table and the take-aways.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: Bram de Wit's dispute introduced in the journey paragraph, refund booking named in the Adyen booking paragraph, the store added to the seller's resources, the collision of Adyen's model names with the chapter's generic words flagged, financial products glossed, the crosswalk questions explained. Larkfield's Stripe accounts changed from Express to Custom to agree with the ledger line of chapter 26. Not acted on: merging the crosswalk's second paragraph into the comparison section (the
