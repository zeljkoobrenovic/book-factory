<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What double-entry, an immutable entry, a clearing account and a fund flow are, and why a ledger is a separate system from the payment database.\n- **Know:** What Stripe published about its Ledger in 2024 and its money-movement platform in 2026, what Adyen published about its accounting system in 2021, and that Adyen's account is five years old.\n- **Know:** What neither company has published: Stripe's ledger storage and how its customer-facing balance is derived; whether Adyen's 2021 design is current.\n- **Believe:** A ledger's value is that a missing or wrong movement becomes a balance that will not clear, which a simple query finds.\n- **Believe:** A platform should copy a provider's ledger invariants and not its scale machinery.\n- **Be able to:** Given a money movement, write it as balanced entries through a clearing account and say what a nonzero balance in that account would mean.\n- **Be able to:** Say, for a given system, whether money correctness is enforced when an entry is written or detected afterwards, and what each choice requires.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a design that keeps money as mutable status fields and computed sums, the reader names what it cannot answer and the two changes that fix it. *Probe:* A marketplace keeps each order's payment status in an orders table and works out what it owes each seller with a nightly SUM over paid orders. A refund made after the seller was paid is recorded by changing the order's status to 'refunded'. Using only this chapter: what can this design not tell you, and what two changes would you make? | `custom` | cold_reader | blocker |\n| AC-2 | The reader can explain why a clearing account with a nonzero balance signals an error and why that makes detection cheap at any volume. *Probe:* An account named 'card funds expected from the network' shows €18,400 that has been there for nine days. What does that tell you, and why did nobody need to compare individual payments to find it? | `custom` | cold_reader | major |\n| AC-3 | Every statement about Stripe's or Adyen's ledger carries its year; Adyen's 2021 account is flagged as five years old; and the chapter says in plain words what neither has published. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How does a payment company know, at every moment, whose money it holds and where it is?\n\n> **Claim:** It does not know it from the payment database, and it does not know it at every moment: it knows it from a separate, append-only double-entry ledger in which every movement is two balanced entries and every amount in flight sits in a clearing account that must return to zero, so that a missing or mismatched movement appears as a balance that will not clear. The knowledge is as current as that proof, which at Stripe in 2024 meant 99.99% of dollar volume ingested and verified within four days.\n\n**Disputed by:** The view that the payment tables already are the record: sum the successful payments, subtract refunds and fees, and you have each merchant's money, so a ledger is a reporting layer that finance can add later.\n\n**So what:** A team building on a provider needs the same invariants at small scale (entries never edited, every movement balanced, clearing accounts that must empty, corrections as new entries) and none of the provider's machinery; a team that skips them finds out, as Larkfield did with €412,000, that a list of paid payments cannot explain a balance.\n\n**How and why:** A payment row holds one payment's current state and is overwritten as it changes; it has no place for money that is between parties or for what was true yesterday. Double entry gives every amount a source and a destination, so a missing half is visible. The two anchors apply this at different points. Adyen's 2021 engineering post says records can be added only through templates proven to net to zero, so an unbalanced entry cannot be written, and that the payment layer queues work for the accounting databases instead of waiting for them. Stripe's 2024 post describes many independent systems publishing events into an immutable log, with errors found afterwards by three measures: clearing, timeliness and completeness. The public record stops there: Stripe names no storage engine and does not say how the balance in its API relates to Ledger, and no newer Adyen account confirms the 2021 design.\n\n**Supporting claims**\n\n- **S1** — A payment table holds each payment's current state and overwrites it, so it cannot say what was owed on an earlier date or where an amount in flight is; sums computed from it change silently.\n- **S2** — A double-entry ledger of immutable, balanced entries routes every amount in flight through a clearing account that must return to zero, so a missing or mismatched movement appears as a balance that will not clear, which one query finds at any volume.\n- **S3** — The invariant can be enforced when an entry is written or detected afterwards: Adyen's 2021 post describes the first, Stripe's 2024 post the second, and both keep the ledger off the path that answers the payment.\n- **S4** — The knowledge a ledger gives is as current as its proof (at Stripe in 2024, 99.99% of dollar volume ingested and verified within four days), and the public record stops short of Stripe's storage, the link between its Ledger and its API balance, and whether Adyen's 2021 design is current.\n- **S5** — A platform building on a provider needs the invariants at small scale (entries never edited, every movement balanced, clearing accounts that must empty, corrections as new entries) and none of the provider's scale machinery.\n\n## Role in the part\n\nSupplies the record and its vocabulary (entry, account, clearing account, fund flow) that the balance, payout, reconciliation and license chapters all read from. Supports P3-1 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in payment-table before mechanism (the failure defines what the parts must do); mechanism before prevention and detection (both enforce the invariant it defines); `comparison` in prevention, detection, trade-offs, where-they-differ)\n\nThe reader meets a €412,000 difference and a payment table that cannot explain it before any ledger term is defined in full (the thesis names them; the mechanism section defines them), so the terms arrive as the answer to a felt problem; defining them first would leave the reader with vocabulary and no reason to want a second system. The two enforcement designs come only after the invariant, because each is a way of enforcing it; putting the company material first would make the Stripe and Adyen accounts read as two unrelated systems. The general trade-off comes before the Stripe and Adyen table so that the table's rows are read as instances of a choice, not as trivia. Larkfield's small ledger comes after the comparison so that the reader can see which provider features it leaves out, and the failure section comes last because every failure is read off the accounts built in the practice section.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At the end of 2025 Larkfield, the fictional studio-software platform this book follows, has every payment's status right in its payment record store. Yet its books say it owes studios €412,000 more than its two providers' balances show, and it takes three weeks to find out why.\n\n**Bridge:** An engineer's first model of money is a payments table: sum the paid rows, subtract refunds and fees, and you know what each merchant is owed. → Every row was correct and the sum was still wrong, so the record of who owes whom must be something other than the list of payments; that other record is the ledger.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraphs p02 and p03): A payment company does not know whose money it holds from its payment database. It knows it from a separate, append-only double-entry ledger in which every movement is balanced and every amount in flight sits in a clearing account that must return to zero, so a missing movement shows up as a balance that will not clear; and it knows it only as recently as that proof has run.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from Larkfield's €412,000 difference and why a list of paid payments could not explain it. *Kept in:* scene, payment-table.\n- Define the ledger's parts: entry, account, clearing account and fund flow, with one €120 payment worked through them. *Kept in:* mechanism.\n- Describe the two published ways to enforce the invariant: refusing an unbalanced entry at the write (Adyen, 2021) and letting many systems write and proving the result afterwards (Stripe, 2024 and 2026). *Kept in:* prevention, detection.\n- Compare what each costs, say where the public evidence stops, and set the two companies side by side. *Kept in:* trade-offs, where-they-differ.\n- Rebuild Larkfield's ledger at small scale and list how a ledger fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At year-end 2025 every payment in Larkfield's payment record store had the right status, and its books still said studios were owed €412,000 more than the two providers' balances showed. | scenario: The Unexplained €0.4 Million: €412,000 difference at year-end 2025, three weeks to trace; Larkfield is named as fictional. |  |\n| p02 | claim | A payment company knows whose money it holds from a separate, append-only double-entry ledger, in which a missing or mismatched movement appears as a clearing-account balance that will not return to zero, and not from its payment database. |  | `problem_solution`: The difference that the payment rows could not explain. → The ledger as the record that would have shown it, and the mechanism by which it shows errors. |\n| p03 | explanation | The ledger's knowledge is as current as its proof, which is this chapter's form of the gap between the instant answer and the slow truth. | statistic: \"Each day, Ledger sees five billion events and 99.99% of our dollar volume is fully ingested and verified within four days.\" | `contrast`: The ledger as the record that knows where money is. → The limit on that knowledge: it is proven after the fact, not at every moment. |\n| p04 | context | For Mila's €120 class pass, this chapter covers the record that exists from the approval at 19:42 on 9 March 2027 until Studio Noord is paid on 11 March: who owes the €120 to whom at each step. | scenario: Mila's class pass: €120.00, Larkfield fee €2.53, studio receives €117.47, payout Thursday 11 March 2027; Studio Noord is on Adyen. | `place`: The chapter's subject. → Its position on the recurring payment's journey. |\n| p05 | transition | The chapter moves from Larkfield's unexplained difference and the limits of a payment table, through the ledger's parts, to the two published enforcement designs, their trade-offs and the Stripe and Adyen comparison, then to Larkfield's small ledger and the ways a ledger fails. |  | `sequence`: Where the chapter sits on the payment's journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: €412,000 and a List of Paid Payments\n\n**Controlling idea** (`example`, id `scene`): Larkfield's €412,000 difference came from three kinds of money movement that had no entry of their own, while every payment row was correct.\n\n**Advances the thesis** (S1): Shows the failure before the vocabulary: correct payment rows, wrong total.\n\n**Transition in:** `example`: The introduction's claim that the payment database is not the record of who owes whom. → The one company and one year-end where that was found out.\n\n**Order of paragraphs** (`chronological`): The finding, its three causes, then the question it leaves; the reader reaches the question the way Femke did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In January 2027 Priya Raman walks Femke de Graaf through the audit finding: Larkfield's books put what it owed studios €412,000 higher than the providers' balances, and three causes account for all of it. | table: Cause / amount / why no entry existed: refunds after payout €317,200; chargeback fees €73,500 (4,900 disputes at the illustrative €15.00); currency-conversion rounding in Larkfield's posting job €21,300; total €412,000. 'Chargeback' is glossed in one clause. |  |\n| p07 | analysis | All three causes were money that moved after the payment row was last correct, and the books of 2025, though called a ledger, were written only from payment rows: one entry when a payment became paid and one when a payout was created. | scenario: Ledger fact: the 2025 ledger was posted by a nightly job on `paid` and on payout creation; refunds after payout, chargeback fees and conversion had no entries until Keel K3. | `cause_effect`: The three causes. → What they share: a movement with no entry. |\n| p08 | claim | Femke's question is the chapter's: what must a book record so that such a difference shows up on the day it begins, without anyone comparing payments one by one? |  | `problem_solution`: Three weeks of comparing payments by hand. → The requirement the rest of the chapter answers. |\n\n### Why the Payment Table Cannot Be the Book\n\n**Controlling idea** (`refutation`, id `payment-table`): A payment row records one payment's current state and is overwritten, so it has no place for history or for money between parties, and a sum over it changes without a trace.\n\n**Advances the thesis** (S1): States the opposing view fairly and shows the two things it cannot answer.\n\n**Transition in:** `elaboration`: Femke's question about what a book must record. → Why the record Larkfield already had, the payment table, could not be that book.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The opposing view first, then its two failures on Mila's refund, then an outside company's account of the same failure, then the two changes that follow; the reader must see the table fail before accepting a second system.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | counterargument | The natural view is that the payment tables already are the record: sum the successful payments, subtract refunds and fees, and a ledger is a reporting layer finance can add later. | scenario: Before the ledger existed (until 2025), Larkfield computed what each studio was owed with a nightly query: the sum of its `paid` payments, less fees and payouts sent. The 2025 ledger was posted by a nightly job from the same payment rows. |  |\n| p10 | example | A refund made after the payout overwrites the row, so the sum for a past date changes and nothing records that it changed. | scenario: Mila's refund after payout: €84.00 of the €120.00 pass refunded on 18 March 2027, after Studio Noord was paid €117.47 on 11 March; the five-state vocabulary has one `refunded` status for a part refund. The five states are listed; counting the refunded row gives nothing owed back, dropping it gives €117.47, against the true €84.00. | `contrast`: The nightly sum that seemed sufficient. → The first thing it cannot answer: what was owed on an earlier date. |\n| p11 | explanation | A payment row also has no place for money that is between parties, such as the €84 Studio Noord now owes back. |  | `additional_support`: What the row loses about the past. → The second thing it cannot hold: an amount in flight or owed back. |\n| p12 | evidence | Payment companies report the same two limits from their own single-entry tables. | quotation: Square (2019) on its single-entry settlement table: computing a merchant's balance \"requires doing an expensive group-by aggregate for each merchant\", and \"It’s impossible to split a single payment into multiple payouts\".; quotation: Modern Treasury: \"in most cases, companies need to retrofit [accounting concepts] after painful incidents involving missing funds, broken payout flows, or inconsistent balances\" (quoted from the phrase \"after painful incidents involving missing funds, broken payout flows, or inconsistent balances\"). | `additional_support`: The two limits seen at Larkfield. → Published accounts that describe them at a real company and across integrators. |\n| p13 | claim | Two changes fix both limits: money is recorded as append-only balanced entries, and amounts in flight get accounts of their own that must return to zero. | table: Question / payment table / ledger: current state of one payment; what was owed on a past date; where an amount in flight is; what a seller owes back; how an error shows. | `problem_solution`: The two things a payment table cannot answer. → The two changes that answer them, which the next section defines. |\n\n### Entries, Accounts and Clearing Accounts: How a Ledger Works\n\n**Controlling idea** (`process`, id `mechanism`): A ledger is accounts plus immutable entries whose lines sum to zero, with clearing accounts on every multi-step path, and that construction turns an error into a balance left where none should be.\n\n**Advances the thesis** (S2): Defines the four owned terms and shows on one payment why a missing movement cannot hide.\n\n**Transition in:** `elaboration`: The two changes named at the end of the previous section. → The parts they are made of, one term at a time.\n\n**Order of paragraphs** (`prerequisite_order`): Entry and account before immutability, immutability before derived balances, clearing account before fund flow, the worked flow before the error it reveals; each term is used by the next.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | An account is a named bucket of value, an entry is a set of signed lines that sum to zero, and double entry means every movement is recorded in at least two accounts so that a missing half is visible. | quotation: \"Ledger is based on double-entry bookkeeping, a standard method for guaranteeing that all money in a system is fully accounted for by balancing credits and debits.\" |  |\n| p15 | definition | Entries are immutable: nothing is edited or deleted, a correction is a new entry, and a balance is computed from the entries, so any past state can be rebuilt. | quotation: \"Transactions previously published into Ledger cannot be deleted or modified, and we can always reconstruct past state by processing all events up to that point.\"; quotation: \"once transfers are recorded, they cannot be erased. Reversals are implemented with separate transfers to provide a full and auditable log of business events.\" | `additional_support`: Balanced entries. → The second property: they are never changed. |\n| p16 | definition | A clearing account holds an amount only while a multi-step process is in flight and must return to zero when the process completes, unlike accounts that are meant to hold a lasting balance. | analogy: Stripe's image: \"At steady state, terminal (nonclearing) reservoirs are full, and intermediate (clearing) pipes are empty. If there is water stuck in the pipes, then you have a problem\".; figure: Illustration: reservoirs connected by pipes, one pipe with water stuck in it. | `elaboration`: Accounts and immutable entries. → The special kind of account that carries money in flight. |\n| p17 | process | A fund flow is the fixed path an amount takes through accounts for one kind of business event, a state machine in which accounts are the states and entries are the transitions. | quotation: \"Ledger encodes a state machine representation of producer systems, and models its behavior as a logical fund flow—the movement of balances (events) between accounts (states).\"; table: Teaching model, not either provider's chart of accounts: four entries for a €120.00 card payment (captured; network settles; payout instructed; bank confirms), each with signed lines across 'card funds expected from the network' (clearing), 'owed to merchant', 'cash at bank' and 'payout in transit' (clearing); fees left out.; figure: Illustration: the €120 moving through four accounts, the two clearing accounts ending empty. | `elaboration`: Clearing accounts as the in-flight states. → The path that strings them together, worked on one payment. |\n| p18 | analysis | Four rules together (every movement is a balanced entry, entries are never edited, a correction is a new entry, and every amount in flight sits in a clearing account that must return to zero) mean that a missing, late or misidentified movement is whatever balance remains in a clearing account, and finding it is one query whatever the volume. | quotation: \"Even when we have billions of transactions, a single missing, late, or incorrect transaction immediately creates a detectable accuracy issue with a simple query—for example, 'Find the clearing Accounts with nonzero balance.'\" | `cause_effect`: The worked flow with its clearing accounts emptied. → What happens to those accounts when a step is missing or wrong. |\n| p19 | example | An account named 'card funds expected from the network' that has shown €18,400 for nine days says that a flow which should have completed did not, and nobody compared payments to learn it. | scenario: Illustrative figures (assumption): €18,400 in 'card funds expected from the network', nine days old. | `example`: The claim that an error is a remaining balance. → One such balance and how to read it. |\n| p20 | explanation | The invariant proves that the book agrees with itself, not that it agrees with the world: a movement recorded on both sides that never happened still balances. | quotation: Stripe (2024) lists the inputs that go wrong: \"malformed reports or propagated errors from banking or network partners\". | `contrast`: What a clearing balance reveals. → What no internal invariant can reveal, and which records do. |\n\n### Design One: Refuse the Entry That Does Not Balance\n\n**Controlling idea** (`evidence`, id `prevention`): One design enforces the invariant at the write, so that an unbalanced entry cannot exist; Adyen described it in 2021, and it works because the payment layer does not wait for the books.\n\n**Advances the thesis** (S3): Documents the first of the two enforcement points with its date and its cost.\n\n**Transition in:** `sequence`: The invariant every ledger shares. → The first of two places a system can enforce it: before the entry exists.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The design, Adyen's account of it, the price Adyen names, then two non-anchor systems that take the same position; the dated primary source comes before the contrasts that generalize it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | The first design allows only writers that cannot produce an unbalanced entry, so correctness is a property of the write path. |  |  |\n| p22 | evidence | Adyen's 2021 engineering post says records enter its accounting system only through templates that are automatically proven to net to zero. | quotation: \"The only way to add new records to the accounting system is by means of templates.\" \"These templates are mathematically verified... prove that every combination of amounts will result in a net sum of 0. This verification is fully automated and runs on every change to the templates.\" \"if at any time, we sum up all the records in the accounting system, the result will always be 0.\" | `example`: The design in the abstract. → The anchor company that published it, with the age of the account. |\n| p23 | evidence | The same post names the price of write-time enforcement: about fifty rows per payment, a PostgreSQL database sharded into clusters, and transfers between clusters where money crosses shards. | quotation: \"Over the lifetime of a payment transaction, about 50 rows have to be inserted into the accounting database.\" \"we decided to shard our accounting database into several accounting clusters\" by \"a simple round-robin strategy\". A payout \"needs to come from one account\", so \"the money needs to be transferred from one cluster to the other\". | `cause_effect`: Every movement written through verified templates. → What that write volume and strictness cost. |\n| p23b | evidence | The payment path does not wait for the books: the payment layer saves the payment locally and a separate process feeds accounting, so in 2021 Adyen's book was a separate system from the one that answers the payment, by stated priority. | quotation: \"for the accounting systems we don't mind if they are down for a little bit as long as we can guarantee their reliability and consistency.\" The payment layer \"saves the payment in a local database and a separate process picks it up when possible.\" | `contrast`: The cost of the accounting system. → How the payment path is kept free of that cost. |\n| p24 | comparison | Square's Books (2019) and the TigerBeetle database take the same position: the store itself refuses a write that is not a balanced movement. | quotation: \"you should never be able to transact with the database in a way that results in an illogical financial transaction.\"; quotation: \"Where SQL allows destructive UPDATE and DELETE, TigerBeetle enforces append-only immutability\"; \"A two-phase transfer moves funds in stages\" (pending, then posted or voided). | `similarity`: Adyen's write-time enforcement. → Two other systems that make the same choice, one a company's service and one a database. |\n\n### Design Two: Let Many Systems Write, Then Prove the Result\n\n**Controlling idea** (`evidence`, id `detection`): Stripe's 2024 post describes the other design: many independent systems publish events into an immutable log, and errors are found afterwards by three measures, with a stated delay.\n\n**Advances the thesis** (S3, S4): Documents the second enforcement point, its measures and the four-day figure the thesis rests on.\n\n**Transition in:** `contrast`: A single write path that refuses bad entries. → A company whose many writers could not be put behind one gate.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Why a gate was not available, what the log records, how it is checked, how fast, how it is corrected, and what 2026 adds; each step needs the one before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | context | Stripe's 2024 post starts from a different constraint: many independently built systems, with different cadences and volumes, all record money. | quotation: \"there is no intrinsic mechanism forcing these systems to represent or deliver data in the same way\"; \"some producers generate billions of events per day, while others may only generate a few hundred\"; \"prove that these individual systems are collectively modeling our financials correctly\". |  |\n| p26 | evidence | Ledger records each producer's work as events in an immutable log, and joins events that arrive separately, and possibly out of order, by their identifiers. | quotation: \"We built Ledger, an immutable and auditable log, as a trustworthy system of record for all of our financial data.\" \"the creation and release events are completely independent. Even if they arrive out of order, or are created by different sources, Ledger maintains accurate fund flows\". | `problem_solution`: Many writers with no common form. → The common structure they all publish into. |\n| p27 | evidence | Correctness is then measured after the fact by three questions: did the flow clear, did the data arrive on time, and is it complete. | quotation: \"Clearing: Did the fund flow complete correctly? Timeliness: Did the data arrive on time? Completeness: Do we have a complete representation of the underlying data system?\"; \"we ensure that every ID in a producer database has a matching Ledger event\"; \"the 50% score for Aging Balances means that some clearing issues have persisted over time\". | `sequence`: Events recorded without a gate. → How their correctness is judged afterwards. |\n| p28 | analysis | The post's own numbers put a delay on the proof: 99.99% of dollar volume ingested and verified within four days, with faster response named as future work. | statistic: \"Each day, Ledger sees five billion events and 99.99% of our dollar volume is fully ingested and verified within four days.\" \"over 99.9999% explainability of money movement\". \"In the future, we want to improve timeliness to minute-level analysis and response.\" (Stripe's own figures, February 2024.); reasoning: INFERENCE, NOT DOCUMENTED: a system verified within four days is an after-the-fact proof system and is unlikely to be what answers a balance request during an API call; the post does not say what does. | `cause_effect`: Checks that run after the events arrive. → How long after, in Stripe's figures, and what that implies about what Ledger is. |\n| p29 | evidence | Because the log is immutable, Stripe corrects it by reverting and reprocessing under review, never by editing. | quotation: \"we can’t run simple queries to mutate the state; instead, we have to revert and reprocess prior operations\"; \"All operations must go through a two-phase review and commit of the data\". | `additional_support`: Errors found after the fact. → How a found error is repaired without breaking immutability. |\n| p30 | evidence | Stripe's 2026 post on fee credits shows the same vocabulary still in use and adds a rule enforced at the write, so the two designs are not exclusive. | quotation: \"we extended Stripe’s existing Money Movement and Storage (MMS) platform\"; \"the financial account, which represents an entity capable of holding a balance and participating in money transfers\"; \"Every OMT follows a three-phase lifecycle through the ledger: submitted → prepared → disbursed\"; \"We reject attempts to create a transfer between a logical account and a real account at the platform level\". | `time`: The 2024 account. → A 2026 account that confirms it is current and qualifies the detection-only reading. |\n\n### Trade-offs: What Each Enforcement Point Costs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Prevention buys certainty at the write and needs a single write path; detection accepts any writer and pays in delay and investigation; and in both the ledger stays off the payment path.\n\n**Advances the thesis** (S3): Sets the designs on the same criteria and gives the author's reading of why each company chose as it did.\n\n**Transition in:** `contrast`: The two designs as each company described its own. → The same criteria applied to both, and to having no ledger at all.\n\n**Order of paragraphs** (`comparison`): The table first, then the author's reading of why each company sits where it does, then the property both designs share; the shared property comes last because it is what the reader carries into the Stripe and Adyen table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | comparison | Set on the same criteria, computed sums, write-time prevention and after-the-fact detection differ in who may write, what an error looks like, and how long it takes to know. | table: Design (computed sums over the payment table / prevention at the write / detection after the write) by: who can write; what an error looks like; when you know; main cost; right when. |  |\n| p32 | analysis | My reading is that the choice follows the number of writers: one write path can be put behind a template, and hundreds of producers on different cadences cannot. | reasoning: INFERENCE, NOT DOCUMENTED: neither company says this; it is consistent with Stripe's description of many producers (2024) and Adyen's of one in-house accounting framework (2021). The designs overlap: Stripe refuses some transfers at the platform level (2026), and Adyen matches partner reports to its records after the fact (2021: \"first parse a file and then split it into the relevant parts for each cluster\"). | `cause_effect`: The table's row on who may write. → The author's explanation of why each company sits where it does, labeled as inference. |\n| p33 | explanation | Both designs keep the ledger off the path that answers the payment, because the payment must be fast and available while the book must be complete and consistent. | table: What a ledger must promise: how fast (not on the authorization path; minutes to days), how consistent (an entry is written whole or not at all), how available (may pause), on failure (queue and catch up, never guess); each row marked documented (Adyen 2021, Stripe 2024) or typical.; quotation: Uber (2020): its legacy design had separate collection and disbursement systems with \"no holistic view of end-to-end money movements\"; Gulfstream \"is a single, integrated, SOX-compliant system built on the principles of double-entry accounting and can reconcile itself.\" | `similarity`: Where the two designs differ. → The property they share: the book is a separate system with different promises. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): On the public record the two share the invariant and differ in where they enforce it, how many systems write and how old the account is; much is unpublished, and none of it is visible in either API.\n\n**Advances the thesis** (S3, S4): The required side-by-side of documented facts, with the inference column marked.\n\n**Transition in:** `conclusion_summary`: The designs, their costs and the limits of the evidence. → The two anchors in one table.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The table of documented facts, then the limits of the record the table rests on, then what an integrator does with both; the limits must come before the advice so the advice does not lean on the 2021 details.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | comparison | Seven aspects of the two ledgers can be compared from dated public sources, and the last column of the table is my inference. | table: Aspect / Stripe / Adyen / what the difference suggests: public engineering account (two posts, Feb 2024 and Apr 2026 / one post, Aug 2021); where the invariant is enforced; who writes; published scale (five billion events a day, 99.99% within four days / about 50 rows per payment, thousands of inserts a second); storage (Not public / PostgreSQL clusters, round-robin, 2021); correction (revert and reprocess under two-phase review / Not public); one core for payments and stored balances (financial accounts, 2026 / 'We leverage this same system of accounting for our banking platform', 2021). |  |\n| p34 | context | The public record stops well short of an implementation: Stripe names no storage engine and does not say how the balance in its API relates to Ledger, and nothing newer than 2021 says whether Adyen's design is current. | fact: Absences checked by reading the full posts: the 2024 Stripe post names no database, schema or consistency model; neither Stripe post relates the Balance and balance transaction objects to Ledger; no Adyen engineering account of the accounting system after August 2021 was found; Airbnb's 2017 ledger post could not be fetched and is not used. | `contrast`: What the table shows the two companies have published. → What neither has published, in plain words, which bounds every reading in the table's last column. |\n| p36 | recommendation | An integrator does nothing differently at the API because neither ledger is exposed; what differs is the one-sided record each provider hands you to build your own book from. | fact: Stripe's balance transaction object has `amount`, `fee` and `net` against one balance, and an example query in Stripe's Sigma documentation labels the table \"the canonical record of changes to your Stripe balance\" (https://docs.stripe.com/api/balance_transactions/object, https://docs.stripe.com/data/data-freshness, n.d., accessed 2026-11). Adyen's settlement details report lists entries by journal type, such as Settled, Refunded, Chargeback and MerchantPayout (https://docs.adyen.com/reporting/settlement-reconciliation/transaction-level/settlement-details-report, n.d., accessed 2026-11). | `cause_effect`: Two internal systems that are only partly published and not exposed. → What that means for someone who sees only each provider's outputs. |\n\n### In Practice at Larkfield: A Ledger Small Enough to Copy\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield's 2027 ledger applies the four rules of the mechanism section with a handful of accounts and one write path, and with them the €412,000 would have appeared as balances on the day each cause began.\n\n**Advances the thesis** (S2, S5): Works the invariants on ledger numbers and shows which parts of a provider's design were left out.\n\n**Transition in:** `example`: Two providers' ledgers that the integrator cannot see. → The book the integrator keeps itself, at Larkfield's size.\n\n**Order of paragraphs** (`small_to_large`): The accounts, one payment, one refund after payout, then the whole year-end difference, then what was deliberately not built; each example reuses the accounts of the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | description | Under Keel decision K3 Larkfield's ledger has three lasting accounts and three clearing accounts per provider and currency, and it records claims, not cash, because Larkfield never holds member funds. | table: Account / kind / what a balance means: funds at provider; owed to studio (one per studio); fees owed to Larkfield; clearing: sales awaiting settlement report, payouts in transit, to recover from studio. |  |\n| p38 | example | Mila's €120.00 pass is four entries, and after the fourth both clearing accounts it touched are back at zero. | table: Entries with signed lines: 1 report line for the capture of 9 March (+120.00 sales awaiting settlement report; −117.47 owed to Studio Noord; −2.53 fees owed to Larkfield); 2 settlement report line (−120.00 sales awaiting settlement report; +120.00 funds at provider); 3 payout reported as sent, 11 March (+117.47 payouts in transit; −117.47 funds at provider); 4 payout marked arrived, 25 March (+117.47 owed to Studio Noord; −117.47 payouts in transit), the order chapter 14 owns. Each entry is written from a provider report line, never from a webhook (ruling 28); the capture line on Adyen is a SentForSettle record in the payment accounting report (https://docs.adyen.com/reporting/invoice-reconciliation/payment-accounting-report, n.d., accessed 2026-11). | `example`: The accounts. → One payment moving through them. |\n| p39 | example | The €84.00 refund on 18 March is one more entry, booked against 'owed to Studio Noord' because the studio's sales since the payout cover it, with no earlier entry changed, where the old nightly sum would have silently lowered a figure already paid out. | scenario: The refund entry (−84.00 funds at provider; +84.00 owed to Studio Noord, lowering what the studio is owed; the studio's sales since the payout, €212.40 that day, an assumption, cover it, ruling 26); the next payout is €84.00 smaller.; quotation: Adyen: refunds and chargebacks \"are added to the payable batch as they occur\". | `sequence`: The pass sold and paid out. → The refund after payout, the case the payment table could not hold. |\n| p39b | example | In a counterfactual where the studio had no sales since the payout to cover the refund, the +84.00 would sit in 'to recover from Studio Noord', visible and dated, until later sales covered it, and if the studio left first someone would have to decide who bears it. | scenario: Counterfactual (did not happen): +84.00 to recover from Studio Noord, and a further entry when recovered (−84.00 to recover from Studio Noord; +84.00 owed to Studio Noord); the studio leaving first leaves the balance for a decision (platform-payment-models). The treatment of Larkfield's fee on the refunded part is left to the platform chapters. | `contrast`: The actual refund, covered by the studio's sales. → The case where nothing covers it. |\n| p40 | analysis | Replayed through these accounts, each of the three causes of the €412,000 becomes an entry or a balance on the day it happens. | scenario: €317,200 of refunds after payout as entries against 'owed to studio' where the studio's balance covered the refund and into 'to recover from studio' only for the part it could not cover; €73,500 of chargeback fees booked from the providers' report lines; €21,300 of rounding removed by booking the provider's reported amount instead of recomputing it. | `cause_effect`: One refund handled as an entry. → The whole year-end difference handled the same way. |\n| p41 | recommendation | Larkfield copied the four rules and none of the machinery: one database and one posting function that refuses an unbalanced entry or a second entry for the same business event, and no shards, event log or template prover. | reasoning: With one writer (the reconciliation job, posting only from provider report lines) the write path can enforce balance in a single database transaction and reject a repeated business-event id; Adyen's 50 rows per payment and Stripe's five billion events a day are answers to volumes Larkfield's 31.4 million payments a year do not approach. | `contrast`: What Larkfield built. → What it deliberately did not build, and why prevention fits a system with one writer. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `when-it-goes-wrong`): A ledger fails in a small number of recognizable ways, and each shows up as a duplicate, a lag or a clearing balance that ages, provided someone owns the balance.\n\n**Advances the thesis** (S2, S4): Shows detection and recovery for each failure, and that an unowned clearing balance defeats the mechanism.\n\n**Transition in:** `contrast`: The ledger working as designed. → The ways it fails and how each is detected and repaired.\n\n**Order of paragraphs** (`order_of_importance`): The catalogue first, then the two failures that need more than a table row: the book falling behind, and the balance nobody owns, which is the one that turns a detected error into a loss.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | cause_effect | Six failures cover most of what goes wrong, and each has a visible sign in the book and a repair that adds entries without editing any. | table: Failure / how it shows / recovery: duplicate posting; missing event; late event; wrong identifier; entry edited in place; payment recorded while the ledger is down.; quotation: Stripe (2024): if a release event \"is never published or has the wrong `id`, Ledger would not clear the balance\". |  |\n| p43 | explanation | When the ledger falls behind the payments, the safe behavior is to queue and catch up, and to date every balance, never to write estimated entries. | quotation: Adyen (2021): the pick-up process \"will run behind if we have doubt about whether we can guarantee consistency in the accounting or if an accounting database is not available but that will not impact the availability of the PAL itself\" (PAL is Adyen's payment processing layer). | `elaboration`: The table's last row, the ledger being down. → What to do while it is behind. |\n| p44 | explanation | A clearing balance detects an error only if someone owns it and its age is tracked, because the older an unexplained amount is, the more likely it is a loss. | quotation: Stripe (2024) scores \"Aging Balances\" per team and raises \"auto-generated tickets\".; scenario: Larkfield's local rule under Keel: every clearing balance has a named owner, and one open for more than five business days goes to Priya Raman's weekly review. | `emphasis`: Errors made visible as balances. → The organizational condition without which visibility achieves nothing. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The payment table, the two enforcement designs and Larkfield's six accounts are one idea at three sizes: money is known only as movements that balance, and an error is known only as a balance left where none should be. Where the invariant is enforced is a consequence of how many systems write; whether it is kept is not optional at any size.\n\n**So what:** A team building on a provider that keeps mutable statuses and computed sums will meet its own €412,000; the four invariants cost a few tables and one posting function, and nothing a provider has published about scale is needed to adopt them.\n\n**Callback:** The opening €412,000 that correct payment rows could not explain. The reader can now say it was three kinds of movement with no entry, and name the account in which each would have appeared on the day it began. Carried by the second bullet of the author's synthesis (p47).\n\n**Takeaway** (`course_of_action`): For every money movement in your system, write the balanced entry, name the clearing account that must return to zero and the outside record that proves it; then give every clearing balance an owner and an age limit. Eight questions to ask follow.\n\n**Hand-off** to [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html): `contrast`: The ledger as the provider's complete, two-sided record of every movement, kept for the provider's own proof. → The merchant sees none of that: it sees one-sided lines against a balance, and the open question there is when the amount becomes the merchant's to use.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | synthesis (list) | Established: double entry with clearing accounts (and, at Stripe, Square and Uber, stated immutability) is the published basis of both anchors' books and of the contrast systems, and it makes errors visible as balances. |  |  |\n| p46 | synthesis (list) | Depends on context: whether to enforce at the write or detect afterwards turns on the number of writers, and how stale the book may be and whether to buy or build the store turn on the number of writers and the volume. |  | `contrast`: What the field agrees on. → What changes with the situation. |\n| p47 | recommendation (list) | The author's synthesis: the payment table, the two designs and Larkfield's six accounts are one idea at three sizes; copy the invariants, not the machinery, because the €412,000 was three movements with no entry and a team with mutable statuses will meet its own; and treat any provider balance as a claim that is as current as its last proof. |  | `contrast`: What is established and what depends on context. → The author's own position, marked as such. |\n| p48 | recommendation (list) | Eight questions let the reader test a ledger, their own or a provider's, in a design review. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p49 | transition | The ledger is the provider's two-sided record kept for its own proof, whereas the merchant sees only one-sided lines against a balance, where the question is when the money becomes theirs to use. |  | `contrast`: The questions, which are for whoever keeps a book, and the complete internal record this chapter described from the keeper's side. → The merchant's partial view of it, the subject of the next chapter. |\n\n## Non-goals\n\n- What the merchant sees of the ledger: balances, pending and available funds, balance transactions, payable batches, reserves, pre-funding. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- Payouts, rails and payout returns. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Proving the ledger against network clearing files, bank statements and provider reports; exception handling in depth. See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Who may legally hold the money, and safeguarding. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Debits and credits, charts of accounts, the general ledger and posting to an ERP. See [Accounting for Architects: Ledgers, Journals and Revenue](../finance-systems-architecture/accounting-for-architects.html), [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html), [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html).\n- Database engines, sharding and consistency models for payment data. See [Never Lose a Cent: Data Stores and Consistency](payment-data-stores-and-consistency.html).\n- Interchange, scheme fees and the provider's cost inside a payment. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Who funds a refund after payout on each provider, and split mechanics. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- How Stripe's customer-facing balance relates to Ledger and to MMS is not public; the chapter says so and does not guess beyond one labeled inference.\n- Whether Adyen's 2021 accounting design (templates, PostgreSQL clusters, round-robin) is current is not public.\n- Airbnb's 2017 double-entry post returned HTTP 403 during research and is not used; PLAN names Airbnb as an optional contrast.\n- Flow rubric note not acted on: moving p30 (the 2026 post showing the designs are not exclusive) into the trade-offs section. It stays with the Stripe material because it is dated evidence about Stripe; the trade-offs section restates the overlap in p32.\n\n## Decision log\n\n- **2026-11-17** — Entries are shown as signed lines that sum to zero, with debit and credit named once and left to RECONCILED. Rejected: Debit and credit columns throughout: an engineer new to payments would have to learn the sign convention before the invariant.\n- **2026-11-17** — The two enforcement designs get one section each, with the anchor company's dated account inside its design, and the comparison is kept for the required section. Rejected: One section per company: it would present the designs as company trivia instead of as choices.\n- **2026-11-17** — Square, TigerBeetle, Modern Treasury and Uber appear in one or two sentences each, only where they support a design choice. Rejected: A survey of ledger systems; an Airbnb contrast (source unreachable).\n- **2026-11-17** — Added a breakdown of the €412,000 and the pre-2025 nightly query to the scenario ledger so the worked example has numbers. Rejected: Leaving the three causes without amounts.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, chapter 12 contract — Scope, owned terms, required Larkfield example.\n  - _research/brief-ledgers-and-money-movement.md, Part 1 — Verified quotations and dates for Stripe (2024, 2026), Adyen (2021), Square, Uber, TigerBeetle, Modern Treasury; the list of what is not public.\n  - _research/brief-reliability-and-scale.md, sections 2.1 to 2.4 and 6.4 — Storage facts and their absence for Stripe; Adyen's PostgreSQL sharding.\n  - _research/scenario-ledger.md — The Unexplained €0.4 Million, K1 to K3, Mila's class pass and the refund after payout, plus this chapter's three additions.\n- **External**\n  - https://stripe.dev/blog/ledger-stripe-system-for-tracking-and-validating-money-movement (2024-02-16) — Stripe's Ledger: fund flows, clearing, the three measures, scale figures, correction.\n  - https://stripe.dev/blog/how-we-built-stripe-credits-a-programmable-auditable-way-to-pay-your-stripe-fees (2026-04-16) — MMS, financial accounts, the transfer lifecycle, write-time rejection.\n  - https://www.adyen.com/knowledge-hub/design-to-duty-adyen-architecture-part2 (2021-08-23) — Adyen's templates, zero-sum guarantee, sharding, decoupling of the payment layer.\n  - https://developer.squareup.com/blog/books-an-immutable-double-entry-accounting-database-service/ (2019-10-16) — Limits of a single-entry table; prevention by construction.\n  - https://www.uber.com/blog/money-scale-strong-data/ (2020-10-02) — Contrast: an integrated double-entry platform replacing separate systems.\n  - https://docs.tigerbeetle.com/concepts/debit-credit/ and /coding/two-phase-transfers/ (n.d.) — Immutability and pending transfers enforced by the database.\n  - https://www.moderntreasury.com/journal/accounting-for-developers-part-i (2022, updated 2025) — Retrofitting ledgers after incidents.\n\n## Changelog\n\n- **2026-11-17** — Revision after round-1 draft check (REVISE-BRIEF): p23 split into p23 (the price of write-time enforcement) and p23b (the payment path does not wait for the books); p39 split into p39 (the actual €84.00 refund, covered by the studio's sales) and p39b (the counterfactual with nothing to cover it); p46 and p47 reworded to match the conclusion (no new idea in Depends on context; synthesis and the €412,000 callback added to the author's synthesis); p09 and p10 evidence state the pre-ledger nightly query and the 2025 nightly posting job as two periods (ledger line for chapter 12) and the two wrong amounts. max_words raised from 6,500 to 6,750 (3.8%). Prose: transition into the mechanism section, webhook glossed and linked, sign rule explained for 'owed to' accounts, €18,400 announced before Figure 2, Uber quotation explained and placed before the requirements table, Where They Differ opening says what is new (house format), Larkfield entries matched to their sources, years added to Adyen's 50 rows (2021) and Stripe's five billion events (2024) for AC-3, hand-off no longer calls the whole chapter the provider's view. No fact, number or source changed.\n- **2026-11-17** — First version, written from the PLAN contract, the ledger and scale briefs and the journal spec entry.\n- **2026-11-17** — After the flow rubric: the scene says 'books' before 'ledger' is defined and states that the 2025 ledger was written from payment rows; the four rules are enumerated in p18; the paragraph on where the evidence stops (p34) moved from trade-offs into the Stripe and Adyen section, after the table.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass: 58 claims checked (52 confirmed, 2 corrected, 2 hedged, 0 unsupported and removed or relabeled, 0 unreachable; 2 not checked); the Larkfield ledger example now agrees with rulings 26 and 28 and with chapter 14: entries are written only from provider report lines, the covered €84.00 refund is booked against 'owed to studio', and the payout entries follow sent (11 March) then arrived (25 March).\n- **2026-11-17** — Absence audit: 8 statements of absence re-tested with a wide search of both companies' engineering posts, documentation and sites (0 overturned, 0 narrowed, 8 hold; table in _research/absence-audit/12-payment-ledgers.md); two sentences now say what was searched.\n- **2026-11-17** — Ruling 46(i) checked: the page already quotes the three-phase transfer ('submitted → prepared → disbursed') from the stripe.dev post of 16 April 2026 and lists it in Sources; no text change.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
