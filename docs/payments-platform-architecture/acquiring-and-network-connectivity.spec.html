<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What an acquirer, a sponsor bank, a processor, a gateway and a payment facilitator each are, and which of them holds the network membership.\n- **Know:** The licenses Adyen states it holds and their years (EU banking license 2017, US federal branch 2021, UK authorization 2023), and the acquirer Stripe names per country in its acquirer disclosure (its own entities in Europe and much of Asia-Pacific, named partner banks and its own limited-purpose bank in the United States).\n- **Know:** What neither company publishes: a list of network memberships by network and country, volume per acquirer, and a current list of direct connections.\n- **Believe:** A direct technical connection to a network and being the acquirer of record are different facts, and a provider can have the first without the second.\n- **Believe:** That domestic payments are approved more often and cost less than cross-border ones is accepted in the industry, and the size of the effect is not publicly measured.\n- **Be able to:** For a given provider and country, find out which entity is the acquirer of record and say what follows for the flow of funds and for who answers to the network.\n- **Be able to:** Read a provider's 'direct connection' or 'local acquiring' claim and say what it does and does not establish.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a provider statement about connectivity, the reader separates the technical connection from the acquirer of record and names what to ask next. *Probe:* A payment company's website says it has 'direct integrations with Visa and Mastercard' in Canada. Its legal pages say it is a 'payment facilitator' (a company that signs up many merchants under another institution's network membership) of a named Canadian bank. Using only this chapter: who is the acquirer for a Canadian merchant, and what does the 'direct integration' sentence tell you? | `custom` | cold_reader | major |\n| AC-2 | Given a claimed approval gain from local acquiring, the reader says the direction is accepted, the size is vendor-reported, and what a sound measurement would need. *Probe:* A sales deck promises 'a 3% authorization uplift from local acquiring', citing one customer. Using only this chapter, how much weight do you give the number, and why? | `custom` | cold_reader | major |\n| AC-3 | Every statement about Stripe's or Adyen's licenses, acquirers and connections carries its year or access date, and the chapter says in plain words where the public record stops. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** What does it take to connect to the card networks and local schemes, and what separates Adyen's route to them (one banking license) from Stripe's (licenses and partner banks assembled market by market)?\n\n> **Claim:** Connecting to a card network takes a membership that only a licensed entity can hold, so every payment has an acquirer of record that differs by country and that decides whether the issuer sees a domestic payment and where the money flows. Adyen obtained one banking license in 2017 and extended it through branches, while Stripe is its own acquirer under e-money licenses in the EEA and the UK and a payment facilitator under named acquirers, most of them banks, in markets such as the United States: both are ways of holding that membership, and what separates them is how many parties stand between the merchant and the network: none where the provider is itself the acquirer, a sponsoring acquirer where it is not.\n\n**Disputed by:** The view that connectivity is a technical integration: a provider that sends messages straight to Visa and Mastercard is connected, and the licenses behind it are legal paperwork with no effect on approvals, cost or where the money flows.\n\n**So what:** A team evaluating a provider asks, per country, which entity acquires its payments, because that entity decides whether the issuer sees a domestic payment, adds or removes a settlement hop, and is the party whose rules and failures the merchant inherits. 'Which provider' is the wrong unit; 'which acquirer in this country' is the right one.\n\n**How and why:** Visa defines an acquirer as a member that signs the merchant and enters transactions 'directly or indirectly', so membership and the technical link are separate. Stripe shows both sides: in April 2020 it announced direct integrations with six card networks, and its acquirer disclosure (read November 2026) still names five partner banks and its own limited-purpose Georgia bank as US acquirers, with Stripe entities as acquirer in the EEA and the UK. Adyen states that its licenses give it direct network access and that 84% of its 2025 volume was 'full-stack', and its annual report places concentration risk at banking partners 'in locations where there are no own direct acquiring licenses', which the chapter reads, as an inference, as reliance on partners there. Adyen's stated reason for its route is 'the speed and autonomy that come from not relying on external parties' (annual report for 2025); Stripe has published no comparable account of why it chose its route, so the chapter compares what the two routes are and does not claim to know Stripe's reasons. The comparison is the author's inference. Neither publishes a list of its network memberships by network and country, volume per acquirer or a current list of direct connections, and no independent figure exists for the approval gain from local acquiring, so the chapter argues from the entities and stops there.\n\n**Supporting claims**\n\n- **S1** — A card network admits only members and a regulator must license the member, so acquiring is a legal status held per country by a named entity.\n- **S2** — Processors, gateways and payment facilitators work under an acquirer's membership, so a provider can exchange messages with a network directly while another institution is the acquirer of record.\n- **S3** — The acquirer of record fixes the country a merchant can sell from, which decides whether the issuer sees a domestic payment; that domestic payments are approved more often is accepted, and the size of the effect has no public measurement.\n- **S4** — A provider can hold a membership in three ways (under a sponsor bank, under a narrow license per market, under a bank license with branches), and the ways differ in how many parties stand between the merchant and the network.\n- **S5** — Adyen documents one banking license (2017) extended by branches; Stripe documents its own entities as acquirer in the EEA and the UK and named banks as acquirer in the United States; neither publishes a list of its network memberships by network and country, volume per acquirer or a current list of direct connections.\n- **S6** — For an integrator the unit of evaluation is the acquirer per country, which can be written down as an inventory from each provider's legal pages and contracts.\n\n## Role in the part\n\nEstablishes who is allowed to send a payment to a network and under whose name, which is the first constraint on every later chapter's 'yes'. Supports P2-1 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the question posed at Larkfield and the inventory that answers it; `comparison` in routes, adyen, stripe, differ: three routes on common criteria, then the two companies, then the two side by side)\n\nEach section supplies what the next one uses. The scene poses the question in a team's words. Membership and license define the acquirer; the roles section then shows who works under an acquirer without being one, which yields the distinction between connection and membership. Only then can the reader see what the acquirer of record changes (the domestic status of a payment) and judge the uplift claims made for it. The three routes come after that, because their trade-off is stated in terms of the parties in the flow and the countries covered; the two companies follow as documented cases of the routes, and the comparison needs both. Larkfield's inventory applies all of it, and the failures show the cost of not having one. Placing the companies before the roles would present Stripe's 'payment facilitator' wording before the reader knows where the membership sits in that model; placing the uplift claims after the companies would let the reader take 'local acquiring' on trust through two company sections.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In April 2020 Stripe announced that it processed card transactions 'through direct integrations with all six major card networks'. In November 2026 its legal pages say that in the United States 'Stripe, LLC is a Payment Facilitator of' five named banks and a limited-purpose bank of its own. Both statements are true at once.\n\n**Bridge:** An engineer reads 'connected directly to Visa and Mastercard' as a statement about network topology: fewer hops, lower latency. → The network does not care who operates the wire; it cares which member answers for the transaction. That member, the acquirer of record, is a legal fact per country, and the merchant inherits its rules, its settlement path and its failures.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p03): Connecting to a card network takes a membership that only a licensed entity can hold, so every payment has an acquirer of record that differs by country. Adyen holds the membership through one banking license extended by branches; Stripe is its own acquirer in the EEA and the UK and a payment facilitator under named banks in the United States. What separates the routes is how many parties stand between the merchant and the network.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from a line in Larkfield's 2024 decision record that nobody can explain, and end with the inventory that explains it. *Kept in:* scene, in-practice.\n- Define the two permissions acquiring takes and the roles that work under an acquirer without holding its membership. *Kept in:* membership-and-license, roles.\n- Say what the acquirer of record changes for approvals and cost, and how far the published uplift figures can be trusted. *Kept in:* local-acquiring.\n- Compare the three ways a provider can hold a membership. *Kept in:* routes.\n- Set out what Adyen and Stripe each document about their licenses, acquirers and connections, with dates, and where the public record stops. *Kept in:* adyen, stripe, differ.\n- Show how an acquiring arrangement fails and how a merchant finds out. *Kept in:* when-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Stripe's 2020 announcement of direct integrations with six card networks and its 2026 disclosure of bank acquirers in the United States are both true, which a reader who treats connectivity as wiring cannot explain. | quotation: 'Stripe now processes card transactions through direct integrations with all six major card networks in North America, Latin America, Europe and Asia Pacific.'; quotation: 'Stripe, LLC is a Payment Facilitator of the following Payment Method Acquirers', followed by Cross River Bank, Deutsche Bank Trust Company Americas, Fifth Third Bank, Pathward N.A., PNC Bank, N.A. and Stripe MALPB. |  |\n| p02 | context | The entity that holds the network membership matters to a merchant because it decides how the payment arrives at the issuer, receives the settlement money first, and passes on its rules and failures to a merchant that never chose it. | reasoning: The merchant signs with a provider; the network recognizes the member. If the two are different companies, a party the merchant has never dealt with sits in its flow of funds. | `cause_effect`: Two true statements that seem to conflict. → Why the difference between them costs a merchant something. |\n| p03 | claim | A network membership is held by a licensed entity per country, and Adyen and Stripe hold it by different routes that differ in how many parties stand between the merchant and the network. | fact: Adyen: EU banking license 2017, US federal branch 2021, UK authorization 2023. Stripe: own entities named as acquirer in the EEA and the UK, payment facilitator under named banks in the United States (acquirer disclosure read November 2026). | `problem_solution`: The merchant's exposure to an acquirer it did not choose. → The chapter's answer: who the acquirer is, and how the two companies come to be one. |\n| p04 | context | On the journey of Mila's class pass this chapter covers the step before the authorization message leaves: which entity is allowed to send it under its own name. | scenario: Mila Janssen's EUR 120.00 ten-class pass from Studio Noord on Tuesday 9 March 2027 at 19:42, paid with a Dutch Visa debit card; Studio Noord is on Adyen. | `place`: The acquirer of record as the chapter's subject. → Its position on the recurring payment's journey. |\n| p05 | transition | The chapter goes from a line in Larkfield's records, through the two permissions and the roles under an acquirer, to what the acquirer changes, the three routes, the two companies, the comparison, Larkfield's inventory and the failures. |  | `sequence`: The chapter's position on the journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Two Words in a 2024 Decision Record\n\n**Controlling idea** (`example`, id `scene`): Larkfield chose a provider for 'local acquiring' and cannot say which entity acquires its studios in any of its five markets.\n\n**Advances the thesis** (S6): Poses the chapter's question in the form the reader will meet it: a team that knows its providers and not its acquirers.\n\n**Transition in:** `example`: The claim that the acquirer of record is a per-country fact a merchant should know. → One fictional company that does not know it.\n\n**Order of paragraphs** (`problem_solution`): The unexplained phrase comes first, the team's failure to answer the follow-up second, and the question the chapter answers last; stating the question first would make the scene decoration.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In February 2027 Femke de Graaf finds that the 2024 decision to add Adyen rests on two reasons, in-person payments and 'local acquiring in the Netherlands and Germany', and that nobody can say what the second one changed. | scenario: Larkfield, the fictional studio-software platform: Stripe since 2017, Adyen since 2024, 'chosen for in-person payments on one platform with online, and for local acquiring in the Netherlands and Germany'. |  |\n| p07 | example | Asked who acquires the studios in each market, the payments team answers with provider names, and for the 700 studios in the United States nobody knows that a bank is involved at all. | scenario: Markets: Netherlands 2,300 studios, Germany 1,450, United Kingdom 1,100, Belgium 650, United States 700 (since 2025). Tom Hendriks, who built the payment service in 2024, answers 'Stripe' and 'Adyen'. | `example`: The unexplained phrase. → The follow-up question and the answer it gets. |\n| p08 | claim | The question Femke writes down is the chapter's: for each provider and country, which entity is the acquirer of record, under what license, and what follows for approvals and for the flow of funds. |  | `conclusion_summary`: A team that can name providers and not acquirers. → The question in the form the chapter answers. |\n\n### Two Permissions: A Network Membership and a License\n\n**Controlling idea** (`definition`, id `membership-and-license`): Acquiring is a status granted twice, by a regulator and by a network, and the network ties liability to the member whose identifier a transaction carries.\n\n**Advances the thesis** (S1): Establishes that the acquirer is defined by membership and license, which is the premise of every later section.\n\n**Transition in:** `elaboration`: Femke's question, which uses 'acquirer of record' without a definition. → What an acquirer is in the network's own rules.\n\n**Order of paragraphs** (`prerequisite_order`): The member is defined first, then what the member does, then the two permissions behind it, then the tiers of membership; sponsorship cannot be explained before membership and license are separate ideas.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A card network is a membership organization, and the acquirer is the member that signs the merchant and enters its transactions, directly or indirectly. | quotation: Visa glossary, Acquirer: 'A Member that signs a Merchant or Payment Facilitator, provides a Cash Disbursement to a Cardholder, or loads funds to a Prepaid Card, and directly or indirectly enters a Transaction into Interchange.' |  |\n| p10 | explanation | From the merchant's side the acquirer is the entity that submits its transactions for authorization and clearing and receives the settlement money for them; this book calls the entity that holds that role for a given payment the acquirer of record. | quotation: Stripe Services Terms, 'Payment Method Acquirer': 'an entity that a Payment Method Provider has authorized to (a) sponsor or submit Transactions at the request of merchants to the Payment Method Provider for authorization and clearing; and (b) receive and remit settlement funds for authorized and cleared Transactions'. | `additional_support`: The network's definition of the member. → The same role defined in a provider's contract with the merchant. |\n| p11 | definition | Acquiring takes two separate permissions: a license from a financial regulator to provide the service and handle the merchant's funds, and a membership from each network to submit transactions under an identifier. | table: Two rows: regulatory license (granted by a financial regulator; allows acquiring as a regulated service and handling the merchant's funds) and network membership or sponsorship (granted by each network or scheme; allows submitting transactions under an identifier and taking part in settlement). The split into two is the author's summary.; quotation: Adyen knowledge hub: 'Acquirers must be licensed by local financial regulators and card schemes to relay transactions.'; quotation: Stripe Technology Europe Limited 'is authorised as an electronic money institution by the Central Bank of Ireland (reference number: C187865) to issue electronic money, execute payment transactions, make money remittances, issue payment instruments and acquire payment transactions'. | `cause_effect`: What the acquirer does: submits and receives money. → The two permissions those two activities require. |\n| p12 | explanation | Network membership has tiers: a member that is not a principal reaches the network through a sponsor, and the network holds the sponsor liable for what is processed under its identifier, which is what 'sponsor bank' and 'BIN sponsorship' mean. | quotation: Visa Core Rules: 'A Principal-Type Member is responsible and liable for all activities associated with any BIN or Acquiring Identifier that it licenses'; for an associate, 'To the extent an Associate-Type Member is unable to fulfill that responsibility, its Sponsor will be responsible and/or liable.'; fact: Mastercard's rules could not be read (the public PDF returned 403); 'principal' and 'affiliate' are the trade terms commonly used for its two levels. | `elaboration`: Membership as one of the two permissions. → Its tiers, and the sponsor that stands behind a non-principal. |\n\n### Processor, Gateway, Payment Facilitator: Who Holds the Membership\n\n**Controlling idea** (`comparison`, id `roles`): Of the roles a payment company can play only the acquirer holds the membership, so a direct connection to a network and being the acquirer of record are separate facts.\n\n**Advances the thesis** (S2): Separates the technical connection from the legal role, which the disputed view merges.\n\n**Transition in:** `contrast`: The member and its sponsor. → The companies around the member that hold no membership.\n\n**Order of paragraphs** (`large_to_small`): All roles first in one table, then the one role a platform reader is most likely to be under (the payment facilitator) and its limit, then the conclusion the table allows; the conclusion needs the non-member roles defined first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | comparison | Four roles surround a card payment, and only one of them, the acquirer, is a member of the network; 'payment service provider' is a commercial label for a company that packages several. | table: Role \\| What it does \\| Network member? \\| Holds the merchant's money? Rows: acquirer; acquirer processor; gateway; payment facilitator (the PSP label is explained in the lead-in, not as a row). The Visa glossary line for the processor is quoted; the other cells are industry usage and labeled so. |  |\n| p14 | definition | A payment facilitator signs many small sellers under one acquirer's membership, and the network treats those sellers as merchants of that acquirer, which stays liable for them. | quotation: Visa glossary, Payment Facilitator: 'An entity that contracts with an Acquirer to deposit Transactions, receive settlement from, or contract with an Acquirer on behalf of a Sponsored Merchant.' Core Rules: 'A Sponsored Merchant will be treated as a Merchant of its Payment Facilitator's Acquirer. An Acquirer that contracts with a Payment Facilitator is liable for all acts, omissions, and other adverse conditions caused by the Payment Facilitator and its Sponsored Merchants'. | `elaboration`: The payment facilitator as one row of the table. → Its definition and where the liability stays. |\n| p15 | evidence | The network limits the facilitator model by seller size: above USD 1 million of annual volume the acquirer must contract with the seller directly. | quotation: Visa Core Rules 5.3.1.4: 'An Acquirer that contracts with a Payment Facilitator must enter into a direct Merchant Agreement with a Sponsored Merchant that exceeds USD 1 million in annual Transaction volume', with stated exceptions. | `additional_support`: The acquirer's liability for sponsored merchants. → The size above which the acquirer must sign the seller itself. |\n| p16 | claim | A direct technical connection to a network and being the acquirer of record are different facts, and a company can have either without the other. | reasoning: 'Directly or indirectly' in Visa's acquirer definition and the non-member 'Acquirer Processor' together allow a member that does not run the link and a non-member that does.; quotation: Block, Inc. Form 10-K for 2025: 'For a majority of our transactions, we do not directly access the payment card networks'.; figure: Figure: the message path (merchant, provider, network, issuer) drawn separately from the membership (held by a sponsoring bank beside the path). | `conclusion_summary`: The roles and where the membership sits in each. → The distinction the chapter turns on. |\n\n### What the Acquirer of Record Changes: Domestic Payments and an Unmeasured Uplift\n\n**Controlling idea** (`analysis`, id `local-acquiring`): The acquirer's license fixes the countries a merchant can sell from, which decides whether the issuer sees a domestic payment; the direction of the effect on approvals is accepted and its size has never been publicly measured.\n\n**Advances the thesis** (S3): Shows the consequence of the legal fact for approvals and cost, and separates what is accepted from what is only claimed.\n\n**Transition in:** `cause_effect`: The acquirer of record as a legal fact separate from the connection. → What that fact changes for a payment.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The definition of a domestic payment and the jurisdiction rule come first because 'local acquiring' is their combination; then the accepted direction, the published figures, what a measurement would need, and last the case where the effect is not marginal at all. Putting the figures first would present numbers before the reader knows what they claim to measure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | definition | A card payment is domestic when the issuer is in the same country as the merchant's outlet, and international when it is not. | quotation: Visa glossary: Domestic Transaction, 'A Transaction where the Issuer of the Card used is located in the Transaction Country'; Transaction Country, 'The country in which a Merchant Outlet is located'; International Transaction, 'A Transaction where the Issuer of the Card used is not located in the Transaction Country.' |  |\n| p18 | cause_effect | Because an acquirer may accept transactions only from merchant outlets inside its own jurisdiction, a business can sell as a local merchant only where its provider has an acquirer whose license reaches that country (one country, or the whole EEA under a passported license), and that is what 'local acquiring' means. | quotation: Visa Core Rules 1.5.1.1: 'An Acquirer must accept Transactions only from a Merchant Outlet within the Acquirer's Country of Domicile (and that country's territories and possessions) unless any of the following', the exceptions including 'In the Europe Region: An Acquirer has passported its license in line with EU passporting regulations.'; figure: Figure: one card and one studio; through an acquirer licensed in the studio's country the payment reaches the issuer as domestic, through an acquirer elsewhere as international. | `cause_effect`: Domestic defined by the merchant outlet's country. → The rule that limits which acquirer may serve an outlet there. |\n| p19 | explanation | That domestic payments are approved more often and cost less than international ones is accepted in the industry and stated by both companies without numbers. | quotation: Stripe guide, last updated 2023-08-15: 'Because the transaction is local, the chances of approval are typically higher compared to an international transaction'.; quotation: Adyen acquiring page: 'Local processing can increase authorization rates and reduce cross-border fees.' | `cause_effect`: Local acquiring as what makes a payment domestic. → What a domestic payment is accepted to gain. |\n| p20 | evidence | Every published figure for the size of the gain is vendor-reported, comes from a single customer or an executive's remark, and bundles local acquiring with other changes. | table: Claim \\| Who says it \\| What it measures. Rows: Adyen's Klook case, 2024-08-05 ('an overall uplift of 3% in their authorization rates' after it 'unlocked key local payment methods and optimized their payments setup'); John Collison in trade press, 2020 ('upwards of half a percentage point' from direct connectivity, not local acquiring). | `contrast`: The accepted direction. → The published sizes, and what is wrong with each. |\n| p21 | recommendation | A sound measurement would change only the acquiring entity and compare authorization rates per attempt for the same merchant, card country, card type and payment type over the same period. | reasoning: The author's judgement: anything else that changes with the acquirer (checkout, tokens, authentication, retries, the mix of first and recurring payments) moves the rate too, and a rate per order hides retries. | `problem_solution`: Figures that bundle causes and give no baseline. → What a figure would need in order to be believed. |\n| p22 | explanation | The larger effect of a local acquirer is structural: some domestic card schemes and clearing systems can be reached only by a member in that country. | fact: Adyen H1 2026: 'Secured direct access to France's domestic interbank clearing system'; the shareholder letter cites its announcement titled 'Adyen devient membre principal de CB et participant direct de STET'. | `contrast`: A marginal gain that cannot be measured from outside. → A gain that is all or nothing: reaching a scheme at all. |\n\n### Three Ways to Hold a Membership\n\n**Controlling idea** (`comparison`, id `routes`): A provider can acquire under a sponsor bank, under a narrow license per market or under a bank license with branches, and each route trades speed of entry against the number of parties between the merchant and the network.\n\n**Advances the thesis** (S4): Supplies the frame in which the two companies' documented arrangements are compared.\n\n**Transition in:** `problem_solution`: The need for an acquirer licensed in each country a merchant sells from. → The ways a provider can meet it.\n\n**Order of paragraphs** (`comparison`): The routes are given in order of how much permission the provider itself holds, from none to the most, on the same criteria, and the table comes last because its columns are the criteria the three descriptions introduce.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | There are three routes, and what separates them is how many parties stand between the merchant and the network. |  |  |\n| p24 | description | Under a sponsor bank the provider is a payment facilitator: it enters a market fastest, and a bank stands in the flow with its own terms, its own account for settlement and the liability to the network. | fact: Visa's rule that the acquirer is liable for its payment facilitator; Stripe's acquirer disclosure, where each US acquirer has its own 'Acquirer Terms' the merchant accepts. | `sequence`: The count of three. → The first route. |\n| p25 | description | Under a narrow license the provider is its own acquirer for a market with the smallest permission that allows it: an e-money or payment institution license in Europe, or in the United States Georgia's merchant acquirer limited purpose bank charter. | fact: Stripe Technology Europe Limited, e-money institution, Central Bank of Ireland (2019 page); Stripe Payments UK, e-money institution, FCA (2017 page).; quotation: ICBA, 2025-07-08, on Georgia's charter: it 'will allow the financial services company to obtain direct membership with Visa and Mastercard and to process payments without a sponsoring bank'; such banks 'may not solicit or accept deposits from the general public'. Georgia Department of Banking and Finance, bulletin of May 2026: Stripe MALPB, Atlanta, approved 30 June 2025, began business 28 May 2026. | `contrast`: A bank between the provider and the network. → The provider holding the permission itself, cut as narrowly as the regulator allows. |\n| p26 | description | Under a bank license with branches the provider holds the widest permission once and extends it, which removes the sponsor everywhere the license reaches at the price of capital, supervision and time. | fact: Adyen N.V.: credit institution under De Nederlandsche Bank, 2017, passported across the EEA; branch licenses in the United States (2021) and the United Kingdom (2023).; reasoning: That a bank license costs capital, reporting and supervisory attention is the author's judgement from how banks are regulated, not a figure from either company. | `contrast`: The narrowest sufficient permission per market. → The widest permission, obtained once. |\n| p27 | comparison | The three routes compared on parties in the flow, speed of entry, what the provider controls and what it owes show that none is better in general: a sponsor fits a new market, a license fits a market large enough to justify its cost. | table: Route \\| Parties between merchant and network \\| What the provider gains \\| What it costs \\| Documented example. Rows: sponsor bank; narrow license; bank license with branches.; figure: Figure: three lanes from merchant to network, with a bank in the first lane, the provider's own licensed entity in the second, and one bank with branches in the third. | `conclusion_summary`: Three routes described one by one. → The same three on common criteria, and when each fits. |\n\n### Adyen's Route: One Banking License, Extended by Branches\n\n**Controlling idea** (`evidence`, id `adyen`): Adyen documents one credit-institution license from 2017 extended by a US branch in 2021 and a UK authorization in 2023, gives control as its reason, and discloses that the route stops where it has no acquiring license.\n\n**Advances the thesis** (S5): Documents one of the two routes the thesis names, with dates and with the company's own statement of its limits.\n\n**Transition in:** `example`: The third route, a bank license with branches. → The company that took it, in its own documents.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What is held, then why the company says it holds it, then where its own filings say the arrangement ends; the limits read as a qualification only after the claim is on the page.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence | Adyen states that it holds one credit-institution license granted in 2017, a US federal branch license from 2021 and a UK authorization from 2023. | table: Region \\| License in Adyen's words \\| Year. EEA: 'authorised as a credit Institution under the supervision of Dutch Central Bank ... includes the ability to provide cross-border acquiring, payment and banking services in all EEA countries' (license 'granted in 2017'). US: 'a federal Branch of Adyen, N.V., licensed by the Office of the Comptroller of the Currency and the Federal Reserve Board of Governors' (Federal Reserve approval 24 May 2021; OCC approval announced 14 June 2021). UK: 'authorization as a UK bank ... under Part 4A of FSMA 2000' (7 September 2023). |  |\n| p29 | evidence | Adyen's stated reason for the route is control: performing the regulated activities itself instead of through partner banks, which it ties to direct access to payment networks. | quotation: Annual Report 2025: 'acquiring our own banking licenses in the EU, US, and UK. Operating these licenses ourselves allows us to perform mission-critical activities without relying on partner banks, improving reliability and settlement speed'; operating under its own licenses 'provides the speed and autonomy that come from not relying on external parties for regulatory compliance'. H1 2026 letter: 'Our own licensed infrastructure grants direct access to payment networks, giving us control over funds'. | `cause_effect`: The licenses held. → The reason the company gives for holding them. |\n| p30 | evidence | Adyen's own disclosures show where the route stops: 84% of 2025 volume was 'full-stack', its annual report names banking partners 'in locations where there are no own direct acquiring licenses' (read, as an inference, as reliance on them), and it publishes no list of network memberships while its documentation lists 14 countries and regions with an Adyen acquiring connection. | statistic: 'Of processed volumes, 84% were full-stack volumes, up from 83% in 2024.' The report does not define the term at that point.; quotation: 'Concentration risk at Adyen originates primarily at banking partners in locations where there are no own direct acquiring licenses.'; fact: 'Pass-through payout is the only available payout model in Africa, Brazil, and India' (documentation, n.d., accessed November 2026).; reasoning: INFERENCE: by Adyen's long-standing usage 'full-stack' means volume it both processes and acquires; the 2025 report does not say so in the passage quoted. | `contrast`: The stated aim of not relying on external parties. → Where the company's own filings say it still does. |\n\n### Stripe's Route: Acquirer in Some Countries, Payment Facilitator in Others\n\n**Controlling idea** (`evidence`, id `stripe`): Stripe publishes the acquirer per country: its own e-money institutions in the EEA and the UK, named banks and its own limited-purpose bank in the United States; with its 2020 statement on direct integrations this shows a connection without a membership, and Stripe has not said why it chose the route.\n\n**Advances the thesis** (S5, S2): Documents the second route and uses it as the worked case of the difference between connection and membership.\n\n**Transition in:** `contrast`: One license extended from one entity. → A set of entities and partners that differs by country.\n\n**Order of paragraphs** (`large_to_small`): The whole disclosure first, then the two regions that show the two roles, then what the pair of publications proves, then what is missing; the hook's puzzle can be resolved only after the US arrangement is on the page.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence | Stripe publishes, per country, which entity is the acquirer for Visa and Mastercard payments, and the answer is a Stripe entity in some countries and a named bank in others. | table: Country or region \\| Stripe's stated role \\| Acquirer named. EEA: acquirer 'is Stripe Technology Europe, Ltd.' UK, Gibraltar, Switzerland: 'Stripe Payments UK, Ltd.' Australia, New Zealand, Singapore, Malaysia, Hong Kong, Brazil: a Stripe entity. United States: 'Stripe, LLC is a Payment Facilitator of' Cross River Bank; Deutsche Bank Trust Company Americas; Fifth Third Bank; Pathward N.A.; PNC Bank, N.A.; Stripe MALPB. Canada: payment facilitator of Peoples Trust Company and PNC Bank Canada. Japan: Sumitomo Mitsui Card Co. India: 'Payment Aggregator of' RBL Bank. Thailand: Bank of Ayudhya. UAE: 'Independent Sales Organization (ISO) of' Network International. Mexico: 'both a Payment Method Acquirer and a Payment Facilitator'. |  |\n| p32 | evidence | In the EEA and the United Kingdom the acquirer is a Stripe e-money institution, so no bank stands between Stripe and the network there. | quotation: Stripe Technology Europe: 'authorised as an electronic money institution by the Central Bank of Ireland ... to ... acquire payment transactions' (page dated 2019-04-05). Stripe Payments UK: 'authorised as an electronic money institution by the U.K. Financial Conduct Authority (reference number: 900461) to ... acquire payment transactions' (page dated 2017-01-26). | `example`: The disclosure as a whole. → The region where Stripe is the acquirer. |\n| p33 | evidence | In the United States Stripe is a payment facilitator of five banks and of its own Georgia-chartered limited-purpose bank, and it does not publish how volume is divided among them. | fact: The six US acquirers on the disclosure page; 'Stripe MALPB, 505 N Angier Avenue NE, Atlanta, GA' with its own acquirer terms. The Georgia regulator's May 2026 bulletin gives approval on 30 June 2025 and the start of business on 28 May 2026; Stripe's terms for the bank carry the same date. | `contrast`: The region where Stripe is the acquirer. → The country where banks are. |\n| p34 | analysis | Stripe's 2020 statement about direct integrations and its 2026 list of US bank acquirers describe two different layers, the wire and the membership, which is why both can be true. | quotation: 2020: 'By exchanging information directly with the card networks, rather than relying on intermediaries, Stripe can reduce latency and remove potential points of failure'. Current product page: 'Stripe has direct connections to card networks to ensure our data is as rich as possible.' | `conclusion_summary`: Stripe as acquirer in Europe and facilitator in the United States. → What that shows about the introduction's two statements. |\n| p35 | analysis | Stripe has published no account of why it took this route, so the chapter compares what the two routes are and does not claim to know Stripe's reasons. | quotation: Banking Dive, 2025-04-07, reporting a Stripe spokesperson: the Georgia application 'is an extension of its work to expand the number of banking and other partners it works with'. | `contrast`: What Stripe documents. → What it has not said. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `differ`): The two companies differ in regulatory form and in who the acquirer is where, not in what they claim about direct connections, and neither publishes the facts that would let an outsider compare them fully.\n\n**Advances the thesis** (S5, S4): Puts the two documented routes on the same rows and marks the cells the public record leaves empty.\n\n**Transition in:** `similarity`: Each company's route described on its own. → The two on the same rows.\n\n**Order of paragraphs** (`comparison`): Table, then what to do with it, then its limits; the limits come last so the reader does not discount the documented rows before reading them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | comparison | Set side by side, Adyen and Stripe differ on regulatory form, on who the acquirer is and on what they disclose about it, and are alike in claiming direct connections without a current list. | table: Aspect \\| Stripe \\| Adyen \\| What the difference suggests (author's inference). Rows: regulatory form; acquirer of record; where a partner bank stands in; direct connections; stated reason; measured gain from local acquiring. |  |\n| p37 | recommendation | On Stripe an integrator reads the acquirer disclosure for each country it sells in and the acquirer terms that come with it; on Adyen it asks, per country, whether Adyen acquires under its own license or through a partner, because no public page says. |  | `cause_effect`: The differences in the table. → What an integrator does differently on each provider. |\n| p38 | analysis | The public record stops at three things for both companies: a list of network memberships by network and country (each states membership in general terms), volume per acquirer and a current list of direct connections. | fact: Stripe's list of six directly connected networks dates from April 2020; Adyen's naming of Visa and Mastercard is press boilerplate from 2021; Adyen's 84% has no published definition or breakdown; Stripe gives no shares for its six US acquirers. Adyen claims 'principal membership of Visa and Mastercard in major markets' (article of 3 July 2026) without naming them, and its license pages name an acquiring entity for some markets (Japan, Singapore) but give no complete list per country; the one membership stated for a named network and country is its 2026 announcement that it became a principal member of CB in France. | `contrast`: What the table can say. → What neither company publishes. |\n\n### In Practice at Larkfield: The Acquirer Inventory\n\n**Controlling idea** (`example`, id `in-practice`): Written down per market, Larkfield's two providers turn out to be four acquiring arrangements, 'local acquiring' turns out to have changed the entity and not the domestic status of a Dutch payment, and the only market with a bank in between is the United States.\n\n**Advances the thesis** (S6, S3): Applies the chapter's method to the running example and shows what a 'local acquiring' claim does and does not establish.\n\n**Transition in:** `example`: The two routes and the gaps in the public record. → One platform reading its own position from that record.\n\n**Order of paragraphs** (`large_to_small`): The whole inventory first, then one payment read through it, then what the company cannot conclude from its own history, then the one row that needs action; the single payment is meaningless before the rows exist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | example | Femke's inventory has one row per provider and market and shows four acquiring arrangements behind two providers. | table: Market \\| Studios \\| Provider \\| Acquirer of record, per the provider's public pages (November 2026) \\| License \\| Bank between studio and network. Netherlands and Germany on Adyen (2,610 studios online; all terminals): Adyen N.V., credit institution, passported; none. Netherlands and Germany still on Stripe online (1,140): Stripe Technology Europe, Ltd., e-money institution, Ireland; none. Belgium (650): Stripe Technology Europe; none. United Kingdom (1,100): Stripe Payments UK, Ltd., e-money institution; none. United States (700): one of six named acquirers, Stripe, LLC as payment facilitator; a bank, unless the acquirer is Stripe's own limited-purpose bank. |  |\n| p40 | example | Mila's EUR 120 payment is a domestic transaction by Visa's definition on either provider, so what the 2024 move to Adyen changed for a Dutch studio was the acquiring entity, from an Irish e-money institution to a Dutch bank, and not whether the issuer sees a domestic payment. | scenario: Studio Noord in Utrecht (merchant outlet in the Netherlands), Mila's Dutch Visa debit card (issuer in the Netherlands), acquirer Adyen N.V.; had Studio Noord been on Stripe, Stripe Technology Europe under its passported license.; reasoning: The author's reading of the published Visa rule; it does not cover how an issuer's own risk model treats the two acquirers, which is not public, and Mastercard's rule was not read. | `example`: The inventory. → One payment read through its first two rows. |\n| p41 | analysis | Larkfield cannot say what the move did to approvals, because the migration changed the checkout, the stored-card setup and the mix of studios together with the acquirer. | scenario: Illustrative: studios moved to Adyen in 2024 and after also got a new checkout integration and re-collected card details; no before-and-after comparison holding those constant exists. | `contrast`: What the rule says about the domestic status. → What Larkfield's own data cannot say about the result. |\n| p42 | example | The United States is the one Larkfield market with a bank between the studio and the network, and the one where the facilitator threshold applies. | scenario: 700 US studios on Stripe Connect since 2025; average payment volume per Larkfield studio EUR 1.12 billion / 6,200 = about EUR 181,000 a year, far below USD 1 million, though a multi-location chain could cross it. Femke asks Stripe which of the six acquirers applies to Larkfield's US studios, since the public page does not say per account. | `contrast`: The European rows, where the provider is the acquirer. → The row where it is not. |\n\n### When It Goes Wrong: The Acquirer You Did Not Know You Had\n\n**Controlling idea** (`analysis`, id `when-wrong`): Acquiring arrangements fail slowly and by contract (a sponsor changes, a seller outgrows the facilitator model, an expansion turns domestic customers into foreign ones), and each failure is detectable only by a team that recorded the arrangement.\n\n**Advances the thesis** (S6, S4): Shows the cost of not knowing the acquirer per country and that the cost depends on the route.\n\n**Transition in:** `contrast`: The inventory when nothing is changing. → What happens to a team without one when something does.\n\n**Order of paragraphs** (`grouping`): Three failures of the same kind, ordered from the one the merchant controls least (the provider's sponsor) to the one it causes itself (its own expansion); each has the same three parts, so they are kept parallel.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | claim | The failures of this layer are not outages: they arrive as a notice of changed terms, a letter from a bank or a slow fall in approval rate, and there are three worth planning for. |  |  |\n| p44 | process | A sponsor relationship changes: the provider adds, drops or replaces an acquiring bank, and the merchant finds new acquirer terms and possibly a new settlement path; the detection is watching the provider's disclosure and notices, and the recovery is the provider's migration plus a rehearsed second provider. | fact: Stripe's disclosure page is undated and lists six US acquirers in November 2026, one of them added after May 2026; Adyen's annual report names 'banking partners in locations where there are no own direct acquiring licenses' as its concentration risk.; scenario: Larkfield's Keel decision K8: two providers, one rehearsed switch. | `sequence`: The count of three. → The first failure. |\n| p45 | process | A seller outgrows the facilitator model: once it passes the network's threshold the acquirer must sign it directly; the detection is tracking each seller's annual card volume against the threshold, and the recovery is a direct agreement arranged before the deadline. | fact: Visa Core Rules 5.3.1.4: USD 1 million in annual Transaction volume; 'within 2 years' for an existing sponsored merchant, with exceptions. | `sequence`: A change made by the provider. → A change caused by a seller's growth. |\n| p46 | process | An expansion turns domestic customers into foreign ones: a business that starts selling in a new country from its home entity sends that country's cards as international payments; the detection is a report of issuer country against merchant country, and the recovery is an entity and an acquirer that cover the new country. | reasoning: Follows from Visa's definitions of Domestic and International Transaction and the jurisdiction rule; the failure pattern is The Single Rail in its acquirer form. | `sequence`: A change caused by a seller's growth. → A change the business makes itself. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The network's rules, the two companies' legal pages and the unmeasured uplift say one thing together that none says alone: 'which provider' is a commercial question and 'which acquirer in this country' is the operative one, because the membership, the liability, the first receipt of the money and the domestic status of the payment all attach to the acquirer, while every public claim about connectivity and approval gain attaches to the provider.\n\n**So what:** A team that records the acquiring entity per provider and country can read a 'direct connection' or 'local acquiring' claim for what it establishes, knows which contract and which bank stand in each flow of funds, and sees a sponsor change or a threshold coming instead of discovering it in a notice.\n\n**Callback:** The introduction's two Stripe statements, direct integrations with six networks (2020) and five banks plus its own limited-purpose bank as US acquirers (2026). The reader can now say why both are true: one describes who exchanges messages with the network, the other who holds the membership and answers for the transaction.\n\n**Takeaway** (`course_of_action`): For each provider and country you sell in, write down the acquirer of record, its license, whether a sponsor bank stands between it and the network, and whether your customers' cards are domestic to it; then take the questions that follow to the provider.\n\n**Hand-off** to [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html): `contrast`: The acquirer and its network memberships, described for cards, and the observation that some local schemes can be reached only by a local acquirer or entity. → Payments that are not cards: methods with no issuer answer, no hold or no chargeback, where what the provider connects to changes what 'approved' promises.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis (list) | Established: acquiring is a membership right tied to a license, the acquirer stays liable for a payment facilitator and its sellers, a payment is domestic when issuer and merchant outlet share a country, and Stripe's and Adyen's licenses and named acquirers are as their own pages state. |  |  |\n| p48 | synthesis (list) | Depends on context: whether a sponsor bank in the flow matters, how much local acquiring is worth, and whether the difference between the two routes affects a given merchant, each turn on the countries sold in and the seller sizes involved. |  | `contrast`: What the rules and the companies' documents settle. → What changes with the merchant's situation. |\n| p49 | recommendation (list) | The author's synthesis: evaluate acquirers per country, not providers, and give a quoted local-acquiring uplift no weight until it comes with a baseline that holds everything else constant. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p50 | recommendation (list) | Eight questions let the reader take the chapter into a provider evaluation or a design review. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p51 | transition | Everything in this chapter was about cards, whose networks give an issuer's answer; the next chapter turns to payment methods that have no issuer answer, no hold or no chargeback, some of which only a local acquirer can reach. |  | `contrast`: The acquirer and its card-network memberships. → Methods that are not cards, where 'approved' promises something else. |\n\n## Non-goals\n\n- Custody of funds, safeguarding, and what an e-money or banking license lets a provider hold; why Adyen's license matters for balances and treasury products. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html), [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- The four-party model and the payment timeline. See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html).\n- Interchange, scheme fees and cross-border fee levels. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Approval-rate metrics, retries, network tokens and the providers' optimization products. See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html).\n- Routing across acquirers and providers, least-cost routing and failover design. See [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- Payment methods other than cards and their schemes. See [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html).\n- Platform liability models and what a platform becomes when it is a payment facilitator itself. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- The companies' histories and strategy beyond acquiring. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Mastercard's rules on membership, payment facilitators and domestic transactions could not be read (403); the chapter's rule evidence is Visa's.\n- Whether Stripe's Georgia-chartered bank processes live volume, and for which merchants, is not stated by Stripe; the dates come from the Georgia regulator's May 2026 bulletin and Stripe's terms for the bank.\n- What Adyen's 'full-stack' share excludes, and which banking partners it uses where, are not published.\n- How Visa determines the country of an e-commerce merchant outlet is governed by tables in the Core Rules the chapter does not walk through; the chapter states only the definition and the jurisdiction rule.\n\n## Decision log\n\n- **2026-11-17** — The section on what the acquirer changes (domestic payments, uplift claims) is placed before the three routes and the two companies, following the order of the thesis claim, so the reader knows why the acquirer of record matters before comparing ways to become one. Rejected: Local acquiring after the company sections, next to the vendors' claims.\n- **2026-11-17** — The Larkfield example tests the ledger's phrase 'local acquiring in the Netherlands and Germany' against Visa's definition of a domestic transaction and both providers' EEA licenses, and concludes that the move changed the acquiring entity and not the domestic status. The ledger line is kept as the reason the 2024 team recorded; the chapter does not change it. Rejected: Inventing a measured approval gain for the 2024 migration.; Describing Stripe's EEA acquiring as cross-border for Dutch studios, which the public record does not support.\n- **2026-11-17** — Stripe's reasons for its route are not stated; the one trade-press quotation about the Georgia charter is given as such. Follows the journal spec's how_why and consistency ruling 11. Rejected: Explaining Stripe's use of partner banks as a speed-of-entry choice in the company's voice.\n- **2026-11-17** — The claim that a bank license costs capital and supervision is labeled as the author's judgement; no figure is given. Rejected: Quoting capital figures from Adyen's accounts, which belong to licences-and-safeguarding.\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md, contract 6 — Scope, owned terms and the Larkfield thread.\n  - _journals/payments-platform-architecture/_research/brief-acquiring-methods-and-terminals.md, Part 1 — The tagged claims on membership, roles, the two companies' licenses and acquirers, and local acquiring; its open questions.\n  - _journals/payments-platform-architecture/_research/brief-companies-and-bets.md, sections 1.6, 2.2, 3.1, 3.2 — Adyen's stated reasons; the absence of a Stripe statement of reasons.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — Larkfield's markets, providers, counts and Mila's class pass.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md, rulings 3, 11, 17 — Ownership split with chapter 16; the qualifications on both companies' acquiring; Mastercard facts only through provider documentation.\n- **External**\n  - Visa Core Rules and Visa Product and Service Rules, 24 October 2026 — Definitions of acquirer, acquirer processor, payment facilitator, domestic and international transaction; sponsorship and liability; acquirer jurisdiction; the USD 1 million threshold (fetched and read 2026-11-17).\n  - Stripe, Acquirer Disclosure & Acquirer Terms, n.d., accessed 2026-11-17 — The acquirer per country.\n  - Adyen Annual Report 2025 and H1 2026 Shareholder Letter — License strategy in Adyen's words, the 84% full-stack share, banking partners, France and UAE in 2026.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 86 claims listed, 85 checked (71 confirmed, 9 corrected, 3 hedged, 2 unsupported and relabeled, 0 unreachable; 1 not checked, Mastercard's terms); the sentence saying a merchant accepts each US bank's acquirer terms now says what the terms read (Cross River Bank, Stripe MALPB) state: they take effect above the network's USD 1 million threshold. Also: Mexico added to Stripe's acquirer table, Stripe MALPB confirmed from Stripe's own terms, ruling 27 applied (Adyen lists 14 acquiring connections but names no entity per country), two 'Not public' cells replaced by documented facts. Wording changed inside units only.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — While drafting to length, evidence lists were narrowed to what the article uses (p13 four roles, p19, p20, p22, p25, p28); no unit was added, dropped, merged or reordered.\n- **2026-11-17** — Flow rubric (fresh agent, flow outline only): sound with notes. Acted on: p10 names the acquirer of record; p18 says a license can reach the whole EEA by passport, which p40 relies on; p29 states Adyen's direct-access claim, which the comparison in p36 uses. Not acted on, left to the author: moving p22 (structural reach of a local acquirer) ahead of the uplift figures; merging p35 into p38; folding p23 into p24.\n- **2026-11-17** — Spec written from the PLAN contract, the acquiring and companies briefs, the ledger and the consistency rulings; intent, thesis and role copied from the journal spec.\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry thesis.claim (ruling 27a) re-synced; journal entry thesis.how_why (ruling 27c) re-synced; rulings 27b, 27c; ruling 27c; ruling 33a; ruling 30). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 8 statements of absence re-tested with a wide search (0 overturned, 1 narrowed, 7 hold; table in _research/absence-audit/06-acquiring-and-network-connectivity.md). Narrowed: Adyen claims principal membership of Visa and Mastercard 'in major markets' in a 2026 knowledge-hub article, still without a list by network and country.\n- **2026-11-17** — Ruling 46(j) applied: Adyen's license pages name an acquiring entity for some markets (Adyen Japan KK, Adyen Singapore Pte. Ltd., Adyen N.V. for the EEA and UK); the article with 'principal membership of Visa and Mastercard in major markets' is dated 3 July 2026; what is not public is a complete list of acquiring entities per country. Wording matched to chapter 47.\n- **2026-11-17** — Cross-chapter conflicts settled: the comparison table and the limits paragraph now match chapters 47 and 1 (license pages name an entity for some markets, no page lists it per country; each company states network membership in general terms and neither lists networks and countries).\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('publishes membership class per country' -> 'publishes a list of its network memberships by network and c').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('network membership class per country' -> 'a list of network memberships by network and country').\n- **2026-11-24** — Sweep of rulings 46-48: 'membership class per country' replaced by 'a list of network memberships by network and country' in intent, thesis how_why and supporting claim (rulings 46j, 47j). Prose unchanged.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
