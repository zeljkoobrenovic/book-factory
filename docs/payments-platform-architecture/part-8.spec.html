<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-8 entry and the part thesis, opening and flow in journal-spec.json, the scenario ledger, and a full reading of the five written chapters of Part VIII. The page makes no external factual claim of its own: every statement about Stripe or Adyen repeats one that a chapter of the part makes and cites, except the statement that neither has published how its webhook sender is built, which acceptance criterion AC-3 requires and which chapter 20 (payment-webhooks-and-events) makes and is linked for.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VIII answers five questions in order: how a payment path stays up, how its data stays consistent when split, where systems and data may live, how a peak is met, and how the system is changed while running.\n- **Know:** This is the part of the book with the least public evidence, and chapter 39 is short for that reason.\n- **Believe:** In a money path, late is cheaper than wrong.\n- **Be able to:** Pick the Part VIII chapter that answers the operational question in front of them.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to VII and are about to start the chapters on operating a payment system, or who arrive with one operational question (an outage, a database split, a residency questionnaire, a peak, a risky deploy) and want the chapter that answers it.\n\n**Already knows:**\n\n- What redundancy, replication, sharding in general, rate limits, queues and deployments are.\n- Parts I to VII: the payment's journey, the unknown outcome of a timed-out request and the idempotency key, webhooks, the ledger and reconciliation, the platform account model.\n- Larkfield in outline: a fictional studio-software platform on Stripe and Adyen, its incidents and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- Graceful degradation, consistency boundary, outbox, data localization, backpressure, progressive rollout: each is owned by a Part VIII chapter and is glossed in a clause here or only named.\n- What Stripe and Adyen have each published about operating at scale, and where that record stops; the page states it in a clause per chapter and leaves the evidence to the chapter.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order and state the part's claim in one sentence. *Probe:* After reading only this page: what does Part VIII argue, and what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens on the two Larkfield first-of-month runs with the ledger's figures and says which was late and which was wrong. | `custom` | rubric | major |\n| AC-3 | The page tells the reader, before any chapter, that a cell design, the topology and timing of a failover between regions, which data is replicated synchronously and the webhook sender are not public for either company. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How is a system that moves money kept running through failures, growth, legal limits on where data may live, peaks and constant change, and how much of Stripe's and Adyen's answer is public?\n\n> **Claim:** A payment platform is run at scale by deciding in advance what gives way (the freshness of the books under failure, a system-wide transaction under growth, a global identifier under a localization law, a caller's burst under peak, the reach of a rollout under change), and in every design Stripe or Adyen has published the record of money is not among the things relaxed; the two have documented their choices on outages, data stores, limits and rollouts, and neither has published a cell design or the topology or timing of a failover of its payment path between its data centers or regions.\n\n**Disputed by:** The view that scale in payments is ordinary web scale with a stricter number: add redundancy and capacity until the uptime figure is reached, keep everything strongly consistent everywhere, and treat availability as the first measure of a provider.\n\n**So what:** A team that accepts the claim writes down, for each of its own money-moving paths, what is allowed to lag, be refused, be paced or be rolled back, and stops comparing providers by a count of nines or by an assumed failover design that neither provider has documented.\n\n**How and why:** Something has to give when a dependency fails, data outgrows one database, a law fixes where data sits, a month's renewals arrive in six hours or a change goes wrong. The published designs show what was chosen: Adyen's 2021 account lets accounting run behind so the edge keeps answering; Stripe's 2017 account sheds non-critical requests first and its 2024 account moves data between shards with a write pause of under two seconds that retries absorb; Stripe's India page (updated 2023) records features cut to keep data in the country; Stripe's documented limits (accessed November 2026) cap each account long before capacity; Stripe's 2023 annual letter stages every change by traffic share. In none of them is the record of money the thing that is relaxed. On the topology and timing of failover, on cells and on which data is replicated synchronously the public record of both companies stops (Adyen lists its data centers by continent or country and states that its load balancers fail over between them; Stripe names no AWS region and describes takeover only for billing usage events, not for payments), and the part says so instead of inferring.\n\n**Supporting claims**\n\n- **P8-1** — A payment path stays available because its operator decides beforehand what may lag or be shed, and the lasting cost of an outage is the payments left with an unknown outcome, which published uptime figures do not report.\n- **P8-2** — Once money data is split across shards or clusters, it is kept consistent by small local transactions, idempotent retries, messages between clusters and verification afterwards, not by a transaction that spans the system.\n- **P8-3** — Where payment data lives is settled by localization law where one applies and by the provider's hosting model elsewhere, before any engineering goal, and the public record gives each provider's hosting, the regions Adyen names and what each has said about India, but not the topology or timing of a failover.\n- **P8-4** — A merchant's predictable peak fails at the provider's per-customer limits, not at the provider's capacity, so the load has to be paced by the party that creates it.\n- **P8-5** — Change on a money path is made safe by bounding how much live traffic a mistake can reach and testing the way back, and a change is finished only when the records agree after it.\n\n## Role in the part\n\nPerforms the part's opening: the two Larkfield months, the part thesis, the reading order and the warning about where the evidence is thin.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on two months at one company, one late and one wrong, and widens them into the part's claim, then narrows: from the reversal of priorities the two months show, to the claim (something is chosen to give way and the record of money is not it), to how far the public evidence carries the claim, to the five questions in order, to one paragraph per chapter. The two months have to come first because 'late before wrong' is an abstraction until the reader has seen what each cost. The claim has to precede the chapter list because each chapter paragraph names what gives way in its subject, and a reader who has not been told that something always gives way reads the list as five unrelated operations topics. The evidence paragraph has to precede the list because the chapter paragraphs state what Stripe and Adyen document, and acceptance criterion AC-3 asks that the reader know before any chapter which parts are not public. The chapter paragraphs keep the part's own reading order, which the journal spec justifies as an argument in which each chapter builds on the one before (failure separates the path that must answer from the record that must be right; growth, law and load test that record; change, which set off the incidents the earlier chapters cite, comes last); reordering them here would contradict the roadmap.\n\n## Introduction\n\n**Hook** (`intriguing_example`): On 1 October 2026 Larkfield's renewal job hit its provider's rate limit and 7,900 membership renewals were delayed to the next day; dunning emails went to members who had done nothing wrong. On 1 November 2026 a provider call timed out, the job retried with a new idempotency key, and 1,840 members were charged twice: €71,300 refunded, and 212 disputes anyway. The first month was late. The second was wrong.\n\n**Bridge:** The engineer's habit of counting downtime as the cost of failure, and Parts II to VII, which described each mechanism for one payment at a time. → The two Larkfield months, where the late run cost emails and the wrong run cost refunds and disputes: in a money path the order of priorities is the reverse of a content site's, and Part VIII puts the mechanisms under failure, growth, law, peak and change.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraphs p03 (the claim) and p04 (where the public record stops).): A payment platform is run at scale by deciding in advance what gives way (the freshness of the books under failure, a system-wide transaction under growth, a global identifier under a localization law, a caller's burst at peak, the reach of a rollout under change); in every design Stripe or Adyen has published the record of money is not among the things relaxed; and neither has published a cell design or the topology or timing of a failover between regions.\n\n**Roadmap** (paragraph p05):\n\n- Five chapters, each naming what gives way so that the record does not and building on the one before: failure separates a path that must answer from a record that must be right; growth, law and load then test that record; change comes last because it set off the incidents the earlier chapters cite. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | On two first-of-month runs at Larkfield, a rate limit made 7,900 renewals a day late in October 2026 and a retry under a new idempotency key charged 1,840 members twice in November 2026: the first month was late and the second was wrong. | scenario: Larkfield (fictional), the Renewal Wave: on 1 October 2026 the renewal job hit its provider's rate limit and 7,900 renewals were turned away before any card was charged, marked failed and delayed to the next day; the email job could not tell a declined card from one never charged and sent dunning emails (ruling 37a).; scenario: Larkfield (fictional), the Double Charge: on 1 November 2026 a provider call timed out during the renewals, the job retried with a new idempotency key, and 1,840 members were charged twice; €71,300 refunded, 212 disputes anyway.; figure: Figure 1: two calendar pages side by side, one for October marked 'Late' with waiting renewals and a clock, one for November marked 'Wrong' with a doubled charge and money going back. |  |\n| p02 | context | Parts II to VII described each mechanism for one payment at a time; Part VIII puts them under conditions no single payment shows, and Larkfield's two months show that there the order of priorities is the reverse of a content site's: the late run cost emails, the wrong run cost refunds and disputes. | reasoning: The part's transition_in and bridge: the mechanisms of Parts II to VII, ending with Part VII's account model, under a dependency failing, data outgrowing one database, a law on where data sits, a month of renewals in six hours and several hundred deployments a day; the engineer's habit of counting downtime set against the costs of the two months. | `contrast`: The two months, one late and one wrong, and Parts II to VII's mechanisms described one payment at a time. → The conditions no single payment shows (failure, growth, law, peak, change), under which lateness is the cheaper failure. |\n| p03 | claim | Part VIII's claim is that a payment platform is run at scale by deciding in advance what gives way (the freshness of the books under failure, a system-wide transaction under growth, a global identifier under a localization law, a caller's burst at peak, the reach of a rollout under change), and that in every design Stripe or Adyen has published the record of money is not among the things relaxed. Larkfield's late October run met the peak case without a plan (its burst waited a day), and in November, with nothing chosen to give way, the record itself gave way. | reasoning: The five things the part thesis names as giving way, one per chapter, and its statement that in none of the published designs is the record of money relaxed; chapter 37 labels the common ordering (late before wrong) as the author's inference and says neither company states it as a principle.; figure: Figure 2: a record book at the center that does not move, and five springs around it that compress under five pressures, labeled 'Freshness', 'Transaction', 'Identifier', 'Burst' and 'Rollout'. | `cause_effect`: The reversed order of priorities: late is cheaper than wrong. → What follows for design: something else is chosen in advance to give way, five times over, so that the record does not. |\n| p04 | context | This is the part of the book with the least public evidence: both companies have documented their choices on outages, data stores, limits and rollouts, and neither has published a cell design, the topology or timing of a failover between regions, which data is replicated synchronously, or how its webhook sender is built, so an unsourced sentence about them is a guess and an uptime figure does not replace one, since the five kinds of figure published as uptime cannot rank the two. | fact: As the chapters establish and cite: failover between data centers is not found for Stripe's payment path (described for billing usage events only, 2025) and is stated by Adyen in general terms, with no topology or timings; 'cell architecture' is named once in a 2024 Stripe talk with no detail (chapter 37); which data is replicated synchronously and read consistency are not public for either (chapter 38; ruling 42b); neither describes between which places one region or data center takes over from another or how fast, and Stripe names no AWS region (chapter 39); the published uptime figures are five different measurements that cannot be ranked (chapter 37).; fact: As chapter 20 states: 'Neither Stripe nor Adyen has published how its webhook sender is built.' | `contrast`: The claim, which rests on designs the two companies have published. → What they have not published, and that this part has less public evidence than any other. |\n| p05 | transition | The five chapters each name what gives way so that the record does not, open on a case at Larkfield and build on the one before: failure separates a path that must answer from a record that must be right, growth, law and load test that record, and change comes last because it set off the incidents the earlier chapters cite. | reasoning: The part's roadmap and flow rationale: reliability first because it introduces the split between a path that must answer and a record that must be right; data stores show how the record stays right once spread over shards; regions ask where the shards may be; the peak chapter needs the hosting difference; change comes last because the incidents the earlier chapters cite were set off by a change. | `sequence`: The claim and the limits of its evidence. → The order of the five chapters and why, and that each chapter opens on a Larkfield case. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question about operating a money path, names what gives way there and opens on one Larkfield case, and each relies on the chapters before it.\n\n**Advances the thesis** (P8-1, P8-2, P8-3, P8-4, P8-5): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The order of the five chapters and why (p05). → One paragraph per chapter: the question in bold, what gives way, what Stripe and Adyen have documented and the Larkfield case it opens on.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. Reliability introduces the split every later chapter uses, a path that must answer and a record that must be right. Data stores show how that record stays right once divided into shards; regions take the same shards and ask where they may be, and introduce the hosting difference the peak chapter starts from. Change is last because the incidents the first four chapters cite were set off by changes. Putting regions before data stores would ask where shards may live before saying what a shard is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | The reliability chapter answers how a payment path stays up and what an outage leaves behind: it stays up because the books or the non-critical requests give way, and what a merchant repairs afterwards is the payments with unknown outcomes, which Larkfield measures with a scripted 44-minute outage drill. | fact: As chapter 37 documents: Adyen described in  stop at it, and the provider's hosting model decides elsewhere, Stripe runs on Amazon Web Services and names no AWS region, Adyen runs its own data centers and names them by continent or country, no finer, and a studio chain's questionnaire puts the question to Larkfield. | fact: As chapter 39 documents: Stripe's page on its India data storage (last updated 16 May 2023) lists features changed or disabled to keep data in the country; Stripe runs on AWS (2023, 2024, current documentation) and names no AWS region; Adyen runs its own infrastructure (2021, 2025, 2026) its documentation names five integration regions, and its website places its data centers by continent or country, no finer.; scenario: Larkfield (fictional): in April 2027 a pilates chain in Hamburg asks where its members' payment data is stored and whether it leaves the European Union; a ten-minute draft answer has no source for any clause. | `contrast`: Chapter 38's shards: data divided by engineers, for size and load, in designs described at length. → Data divided by country and by law, where both companies have published very little. |\n| p09 | description | The peak chapter answers how a predictable peak is met: a merchant's own peak meets the provider's per-customer limit before the provider's capacity, so the party that creates the load paces it, as Larkfield does by running its first-of-month wave over 18 hours. | fact: As chapter 40 documents: Stripe's documentation (n.d., accessed November 2026) allows an account 100 requests a second; Adyen publishes no limit for payment requests.; scenario: Larkfield (fictional): the wave of about 357,000 renewals, sent until Keel in the first six hours of the 1st; in April 2027 CTO Daniel Osei objects that Stripe carried 152,000 transactions a minute on Black Friday; Keel decision K5 paces the run over 18 hours. | `cause_effect`: Chapter 39's documented hosting difference: rented cloud capacity at Stripe, owned infrastructure at Adyen. → What follows when load arrives at once, and the per-customer share a merchant reaches first on both. |\n| p10 | description | The safe-change chapter answers how a system that cannot stop is changed: the reach of a rollout gives way, as each change first reaches a bounded share of live traffic, is withdrawn automatically and has a tested way back, and because even 1% is real payments the author's rule is that a change is finished when the records agree, which Larkfield's upgrades of March 2026 and May 2027 show from both sides. | fact: As chapter 41 documents: Stripe's 2023 annual letter (published March 2024) describes about 400 deployments a day to one core API service, staged by share of traffic with automatic withdrawal; on 8 February 2024 a change that reached 1% of its critical tier failed payments for six minutes; Adyen's 2018 account describes toggling features one by one after a release.; scenario: Larkfield (fictional): the March 2026 library upgrade (the Version Cliff) reached every request in one deploy and subscription revenue reports were wrong for six days; the May 2027 upgrade is staged by studio, first to 62 of 6,200. | `problem_solution`: Chapter 40's open problem: a payment system cannot be stopped for its peaks. → How it is changed while it runs: bounded exposure, automatic withdrawal, a tested way back, and reconciliation as the finish. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** The five chapters build on one another: failure separates a path that must answer from a record that must be right, growth, law and load test that record, and change comes last because it set off the incidents the others cite; a reader who enters at one operational question finds the same test there: what gives way, and is the record on the list.\n\n**So what:** Faced with an outage, a split database, a residency question, a peak or a risky deploy, the reader asks first what is allowed to be late, and makes a money path late before it is wrong.\n\n**Callback:** The opening's two first-of-month runs at Larkfield, 7,900 renewals late in October 2026 and 1,840 members charged twice in November 2026 (p01). The reader is told that by the end of the part the two runs read as one design choice, late before wrong, made by accident in 2026 and on purpose under Keel.\n\n**Takeaway** (`course_of_action`): Begin with the reliability chapter: the first thing that gives way, under failure, is the freshness of the books.\n\n**Hand-off** to [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html): `elaboration`: The part opening's two first-of-month runs and its claim that something must give way so the record does not. → The first thing that gives way: under failure, the freshness of the books and the non-critical requests, and what a merchant is left to repair afterwards.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | synthesis | The five chapters are best read in order, though a reader may start at one operational question; either way the first question is what may be late, because a money path should be late before it is wrong; by the end the two first-of-month runs read as one choice, late by accident in 2026 and on purpose under Keel; the first thing that gives way, under failure, is the freshness of the books. |  |  |\n\n## Non-goals\n\n- Teaching reliability, consistency, residency, peak handling or rollout; the page summarizes and does not re-argue the chapters. See [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html), [Never Lose a Cent: Data Stores and Consistency](payment-data-stores-and-consistency.html), [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html), [The Biggest Day: Peak Load and Capacity](payment-peak-load.html), [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html).\n- The part's closing (the asymmetry between what the providers documented and what a merchant cannot verify, Keel's K5 and K1 as the answer to the two months, and the one-line takeaway per money path). See [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html).\n- Rate limits themselves and the design of webhook delivery, which earlier chapters own. See [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure-pattern callout and Questions to Ask; part intros do not carry them (style guide).\n- External factual claims of the page's own; every company statement repeats a chapter, which cites it.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The closing sentence 'Begin with …' sits under its own heading, 'Where to Begin', as the conclusion's one paragraph. Rejected: Ending the 'Chapters in this part' section with it: the draft checker reads a conclusion only from a heading of its own, and the other part intros of this book use the same heading.\n- **2026-11-17** — The statement that the webhook sender is not public, required by AC-3, is made with a link to chapter 20, which owns and cites it, although chapter 20 is outside Part VIII. Rejected: Leaving it out, which fails AC-3.; Stating it without a link, which would be a claim of the page's own.\n- **2026-11-17** — The claim paragraph says that 'the record is not among the things relaxed' is the author's reading of the published designs, as chapter 37 labels it. Rejected: Stating it as something either company has said: neither states it as a principle.\n- **2026-11-17** — Keel's answer to the two months (K5 paces, K1 fixes the key) is only touched in the peak paragraph; the full callback is left to chapter 41, which carries the part's closing. Rejected: Resolving the hook in the intro, which would pre-empt the closing.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-8: thesis, opening, flow, transition_in; post entry part-8) — Intent, thesis, role, hook, bridge, roadmap and the order of chapters.\n  - _research/scenario-ledger.md — The Renewal Wave and the Double Charge with their figures, Keel decisions K1 and K5, the additions by chapters 37 to 41.\n  - posts/37-payment-reliability, 38-payment-data-stores-and-consistency, 39-multi-region-and-data-residency, 40-payment-peak-load, 41-safe-change (index.md, read in full); posts/20-webhooks-and-events (the statement on the webhook sender) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n  - _research/consistency-issues.md (rulings 22, 24, 25) — No external URLs in the running text; 'eight incidents', seven of them in 2026; publication dates as displayed (the page gives years only).\n\n## Changelog\n\n- **2026-11-17** — Revision after the round-1 draft check (no unit added, dropped or moved). Ordering principle corrected in p05, flow.rationale, conclusion.synthesis, p11 and the journal spec's part-8 flow rationale: the order is not 'from what must hold to what threatens it' (the first chapter is about failure) but one in which each chapter builds on the one before (failure separates the answering path from the record; growth, law and load test the record; change, which set off the earlier incidents, comes last). p05 no longer repeats the five chapter questions (roadmap promise reworded; the chapter list carries the questions). Chapter paragraphs now say what gives way in the claim's words (transaction, identifier, burst, rollout), and the peak and safe-change link sentences state their connections from chapters 40 and 41. Prose: recap moved after the late-versus-wrong argument; 'the fourth' replaced; November named as the record giving way; 'five different things' named; 'cell design' and 'edge' glossed; so_what re <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
