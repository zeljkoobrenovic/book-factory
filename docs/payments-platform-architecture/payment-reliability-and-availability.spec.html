rms availability target, failure isolation, graceful degradation and incident report are defined before they are used. | `known_before_new` | rubric | major |\n\n## Thesis\n\n**Question:** How do payment providers stay up, and what happens when they do not?\n\n> **Claim:** A payment path is kept answering by an operator that has decided beforehand what may lag or be dropped (the books, the non-critical requests) so that no payment is recorded twice or lost; when the path fails anyway, the provider restores service and publishes little about it, and what the merchant has to repair is the set of payments whose outcome nobody knows, not the minutes of downtime.\n\n**Disputed by:** The view that availability is a number to buy: pick the provider that reports the most nines, add redundancy on your own side, and consider an outage over when the status page says so.\n\n**So what:** The reader plans against the contractual commitment and its exclusions, measures payment success on their own side, and builds the sweep that resolves unknown outcomes before building a second provider connection.\n\n**How and why:** Adyen described the split in 2021: for the edge 'the priority was uptime', while for accounting 'we don't mind if they are down for a little bit as long as we can guarantee their reliability and consistency', with a local database queue between them. Stripe described a different lever in 2017, reserving capacity for critical methods such as creating charges and shedding the rest, and committed to per-shard isolation after its outage of 10 July 2019; it has not published where state sits on its API path. The published figures do not settle a comparison: Stripe states a target of 99.9995% (2024, 2026) with no formula, and no public service-level percentage for Stripe was found; Adyen's public terms (last updated 1 November 2023) commit it to 'commercially reasonable efforts' toward 99.9% per quarter, with exclusions, while its status page reports successful requests over 30 days and Stripe's status page displays 99.999% over 90 days with no definition. None of these figures says what happened to requests that timed out. Stripe's root-cause analysis of 10 July 2019, the one full public account of an outage found, reports two windows of 27 and 93 minutes in which 'a substantial majority of API requests' failed, and says Stripe emailed every user with five or more failed POST requests: the cleanup was counted in requests, per customer, not in minutes. Neither company publishes its failover design or routine postmortems, and the chapter stops there.\n\n**Supporting claims**\n\n- **C1** — The two providers publish five different things under the word uptime (a target, an achieved yearly figure, a peak-weekend figure, rolling 30-day and 90-day figures, a contractual commitment); they cannot be compared, only Adyen's 99.9% per quarter is a public commitment and it has exclusions, no public percentage for Stripe was found, and none of the figures counts failures at banks and networks or says what happened to requests that timed out.\n- **C2** — A payment path is kept answering by failure isolation and graceful degradation decided in advance, and in the two documented designs (Adyen's accounting running behind its edge, 2021; Stripe's shedding of non-critical requests, 2017, and per-shard isolation after 2019) what gives way is not the record of a payment.\n- **C3** — For each step of a payment path the choice under a failed dependency is to skip, queue or refuse, and it follows from whether the step decides if money may move, records that it moved, or tells someone; a deadline on a slow dependency turns into unknown outcomes at the edge.\n- **C4** — When the path fails anyway the provider restores service and publishes little: four public documents exist for the two companies, they count the aftermath in failed requests or payments per customer where they count it at all, and neither company publishes its failover design or routine post o the rehearsal to answer the third. | scenario: Local detail consistent with K1, K2 and K8: an outage drill added to the quarterly rehearsal, with the count of payments in an unknown state as its exit criterion (appended to the ledger). | `problem_solution`: The figure is not the measure. → Three questions that can be answered, and the drill. |\n\n### Five Figures Under One Word: What Uptime Measures\n\n**Controlling idea** (`analysis`, id `what-uptime-means`): Five different things are published as uptime by the two providers (a target, an achieved yearly figure, a peak-weekend figure, rolling 30-day and 90-day figures and a contractual commitment); they cannot be compared, only the contractual one is a commitment, and none of them says what happened to failures at banks and networks or to requests that timed out.\n\n**Advances the thesis** (C1): Establishes that the published figures cannot settle a comparison and names the number to plan against.\n\n**Transition in:** `elaboration`: Femke's first question: what does each figure measure? → The vocabulary (availability, target, commitment) and the five figures, each with publisher, definition and date.\n\n**Order of paragraphs** (`grouping`): Definitions, then each company's reported figures, then the promised figure and its absence, then what none of them measures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | Availability is the share of time, or the share of requests, in which a service answers correctly, and a figure for it is one of three kinds of statement: an availability target (an internal goal), an achieved figure (a report) or a contractual commitment (a promise with consequences, usually called a service-level agreement). | table: Author's arithmetic: 99.9% of a 91-day quarter allows about 131 minutes; 99.999% of 30 days allows about 26 seconds; 99.9995% of a 30-day month allows about 13 seconds (the last figure is also Stripe's own: Stripe Sessions talk 'Building a culture of system reliability' (https://stripe.com/us/sessions/2024/building-a-culture-of-system-reliability, 2024-04-25), 'Five and a half nine means in a month we can only tolerate 13 seconds of unavailability.'). |  |\n| p10 | evidence | Stripe publishes a target of 99.9995% (2024, 2026) without a formula, an achieved figure of 99.999% for 2023 and none in its letters for 2024 and 2025, peak-weekend figures above 99.9999% (2024, 2025) and, on its status page, a rolling 90-day figure for the Stripe API with no definition on the page; the only hint of a definition is a 2023 sentence about availability 'measured at the individual transaction level'. | fact: Stripe Sessions talk 'Building a culture of system reliability' (https://stripe.com/us/sessions/2024/building-a-culture-of-system-reliability, 2024-04-25) and Stripe, 'Building a data plane from scratch' (https://stripe.dev/blog/building-a-data-plane-from-scratch-stripes-own-high-performance-distributed-proxy, 2026-08-26) ('we target 99.9995% reliability'; 'maintaining 99.9995% public API uptime').; fact: Stripe 2023 annual letter (https://stripe.com/annual-updates/2023, published 2024-03-13): 'Stripe was only 99.999% available last year'. Stripe 2022 annual letter (https://stripe.com/annual-updates/2022, published 2023-04-05; evidence age 3 years): 'Our API reliability is now consistently in excess of 99.999%' and 'a live tracker of our 90-day trailing API availability, measured at the individual transaction level'. BFCM press releases (https://stripe.com/us/newsroom/news/bfcm2024, 2024-12-03; /bfcm2025, 2025-12-02): API uptime of more than 99.9999%. The letters for 2024 (published 2025-02-27) and 2025 (published 2026-02-24) carry no reliability figure (PDFs searched 2026-11-17). Stripe status page (https://www.stripestatus.com/, n.d., accessed 2026-11-17): '99.999% uptime for the last 90 days' for the Stripe API, as rendered that day; no definition on the page. | `example`: Three kinds of statement. → Stripe's figures, sorted by kind. |\n| p11 | evidence | No published Adyen target was found; it reports a rolling 30-day figure on its status page, defined as the percentage of successful requests to its Payments API, and a peak-weekend figure for 2025, so set side by side the two companies' figures are five measurements on different periods and bases. | fact: Adyen status page (https://status.adyen.com/, n.d., accessed 2026-11-17): 'Last 30 days: 99.999% uptime', 'Based on the percentage of successful requests to our Payments API in the last [UPTIME_DAYS] days'. Adyen H2 2025 results (https://www.adyen.com/press-and-media/adyen-publishes-h2-2025-financial-results-3pgu2, 2026-02-12): 'processed 837 million transactions during Black Friday Cyber Monday with 99.9999% uptime'.; table: Table: figure, publisher, kind, definition as published (or 'none given'), source date, for the Stripe and Adyen figures above and the Adyen contractual commitment. | `similarity`: Stripe's figures. → Adyen's figures and the table of all of them. |\n| p12 | evidence | The one public contractual commitment is Adyen's: commercially reasonable efforts toward a quarterly-average minimum uptime of 99.9% for receiving transaction messages, with exclusions that cover issuing banks, acquirers, card networks, individual payment methods and general internet failures, and a right to terminate if it is missed for two consecutive quarters; its status page says the reported figure is not that commitment. | quotation: Adyen Terms and Conditions (https://www.adyen.com/legal/adyen-terms-and-conditions, last updated 2023-11-01, for agreements entered into on or after that date, accessed 2026-11-17), clause 7.2: 'Adyen will use commercially reasonable efforts to achieve a quarterly-average minimum uptime of 99.9% of the Payment Interface, as measured by its ability to receive Transaction messages'; excluded is downtime caused by '(i) acts or omissions of Merchant, Issuing Banks, Acquirers or Scheme Owners; (ii) changes implemented by Adyen on Merchant's specific request; (iii) general internet failures; (iv) failures of individual Payment Methods; or (v) a Force Majeure Event'; clause 11.2: Merchant may terminate immediately if 'The SLA commitments in Clause 7.2 are not met during two consecutive quarters'. The older terms (https://www.adyen.com/legal/terms-and-conditions, effective 2023-03-07, for agreements before 1 November 2023) carry the same 99.9% in clause 6.1.; quotation: Adyen status page (https://status.adyen.com/, n.d., accessed 2026-11-17): the page 'does not represent the service level commitments in your agreement with Adyen'. | `contrast`: Reported figures. → The promised figure and its exclusions. |\n| p13 | evidence | No public service-level percentage for Stripe was found: its Services Agreement contains no uptime figure and says Stripe does not warrant uninterrupted use, and whether negotiated contracts carry a figure is not public. | fact: Stripe Services Agreement, General Terms (https://stripe.com/us/legal/ssa, n.d., accessed 2026-11-17), section 8.2: 'Stripe does not warrant that User's use of the Services and Stripe Technology will be uninterrupted or error-free'; a text search finds neither 'uptime' nor 'service level'. | `contrast`: Adyen's public commitment. → The absence of one in Stripe's public terms. |\n| p14 | analysis | None of the figures counts what a merchant experiences: failures at issuers, card networks and payment methods are excluded by Adyen's contract and fill both status pages, and no figure says what became of requests that timed out, so the number to plan against is the contractual one and the number to trust is the payment success rate measured on the merchant's own side. | fact: Stripe status feed (https://www.stripestatus.com/history.json, n.d., accessed 2026-11-17): 160 entries for October 2026 (count to be stated with its breakdown); entries such as 20 October 2025, 'Affirm, Klarna, and Amazon Pay had brief periods of unavailability due to a widespread outage external to Stripe'. Adyen status page (https://status.adyen.com/, n.d., accessed 2026-11-17): the page 'tracks performance across a variety of products, services, and payment methods'.; reasoning: Brief judgement, presented as the author's: a merchant's experienced availability is lower than either figure and must be measured merchant-side. | `cause_effect`: Five figures, one commitment with exclusions, one absence. → What all of them leave out and what follows for planning. |\n\n### How a Payment Path Stays Up: Deciding What Gives Way\n\n**Controlling idea** (`explanation`, id `what-gives-way`): A payment path is kept answering by failure isolation and graceful degradation, and the two documented examples (Adyen's accounting that runs behind its edge, 2021; Stripe's shedding of non-critical requests, 2017, and its per-shard isolation after 2019) each let something other than the record of money give way.\n\n**Advances the thesis** (C2): Shows the mechanism behind the first half of the thesis with the two documented designs and says where the record stops.\n\n**Transition in:** `contrast`: Figures that report how often the path answered. → How the path is kept answering: what its operator lets lag or drop.\n\n**Order of paragraphs** (`comparison`): Definitions, Adyen's documented design, Stripe's documented design, then the limits of both records and the reading that joins them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | Redundancy alone does not keep a payment path up, because copies share dependencies; what does is failure isolation (one broken part cannot take the rest down) and graceful degradation (the important requests are still served, in a reduced way, while something is broken), and both require deciding in advance what is allowed to give way. | reasoning: Definitions from the brief's glossary, plus the 2019 case as forward pointer: redundant nodes within a shard did not help when the shard itself was a dependency shared by everything. |  |\n| p16 | evidence | Adyen's 2021 account describes an edge built to be expendable: every payment passes through a stateless acceptance layer in which any instance can be shut down without affecting processing. | quotation: Adyen, 'Design to Duty: How we make architecture decisions at Adyen' (https://www.adyen.com/knowledge-hub/design-to-duty-adyen-architecture, 2021-07-28; evidence age 5 years): 'any PAL instance can be shut down without impacting our ability to process payments, and a new PAL can immediately be as effective as the other PALs already running. This makes our horizontal scaling linear.'; 'All payments pass through it.' | `example`: Failure isolation defined. → Adyen's documented edge. |\n| p17 | evidence | The same 2021 account states what gives way: the edge's priority is uptime and the accounting systems' is consistency, and a local database queue between them lets the books run behind without stopping the edge. | quotation: Adyen, 'Design to Duty: The Accounting and Reporting Systems at Adyen' (https://www.adyen.com/knowledge-hub/design-to-duty-adyen-architecture-part2, 2021-08-23; evidence age 5 years): 'Whereas for the latter the priority was uptime, for the accounting systems we don't mind if they are down for a little bit as long as we can guarantee their reliability and consistency.'; quotation: Adyen, 'Design to Duty: The Accounting and Reporting Systems at Adyen' (https://www.adyen.com/knowledge-hub/design-to-duty-adyen-architecture-part2, 2021-08-23; evidence age 5 years): the PAL 'saves the payment in a local database and a separate process picks it up when possible. This process will run behind if we have doubt about whether we can guarantee consistency in the accounting or if an accounting database is not available but that will not impact the availability of the PAL itself.'; figure: Figure 37-path-and-record: an answering path, a local queue, and books that run behind. | `cause_effect`: An edge that holds no state. → Where the state goes and what is allowed to lag. |\n| p18 | evidence | Stripe described a different lever in 2017: it divides traffic into critical methods such as creating charges and non-critical ones such as listing them, always reserves capacity for the first kind and sheds the second; a 2026 post suggests request priorities still exist in another form. | quotation: Stripe, 'Scaling your API with rate limiters' (https://stripe.com/blog/rate-limiters, 2017-03-30; evidence age 9 years): 'We divide up our traffic into two types: critical API methods (e.g. creating charges) and non-critical methods (e.g. listing charges.)'; 'We always reserve a fraction of our infrastructure for critical requests.'; fact: Stripe, 'Building a data plane from scratch' (https://stripe.dev/blog/building-a-data-plane-from-scratch-stripes-own-high-performance-distributed-proxy, 2026-08-26): the in-house proxy 'supports retries, hedging, rate limiting, and dynamic priority-based request routing'. | `contrast`: Adyen's lever: the books lag. → Stripe's lever: the non-critical request is refused. |\n| p19 | evidence | Stripe's isolation work is documented from an outage: in 2019 its data was split into clusters and shards with redundant nodes, one shard still took the API down (the outage itself is told in the incident section), and Stripe committed to circuit breaking and to containing a single failed shard; its 2024 talk mentions cells in one phrase. | quotation: Stripe, 'Root cause analysis: significantly elevated error rates on 2019-07-10' (https://stripe.com/rcas/2019-07-10, published July 2019; evidence age 7 years; re-fetched 2026-11-17): 'Stripe splits data by kind into different database clusters and by quantity into different shards. Each cluster has many shards, and each shard has multiple redundant nodes.'; remediation: 'additional circuit-breaking on failed operations to particular clusters' and 'additional fault isolation techniques to contain the impact of a single failed shard and limit resource consumption by clients attempting repeated retries of failed requests'.; quotation: Stripe Sessions talk 'Building a culture of system reliability' (https://stripe.com/us/sessions/2024/building-a-culture-of-system-reliability, 2024-04-25): 'cell architecture' appears once in a list of practices, with no detail. | `additional_support`: Shedding by request class. → Isolation by shard, documented after it failed. |\n| p20 | analysis | The public record stops well short of a design for either company: Stripe has not published where state sits on its API path or which payment steps it would skip, Adyen has not published any shedding by request class, and on failover between data centers or regions Stripe has published nothing for the payment path (a two-region design for billing usage events only, 2025) and Adyen a few general sentences of documentation that state an intent without timings or topology. | fact: Adyen documentation, peak season readiness (https://docs.adyen.com/industries/peak-season, n.d., accessed 2026-11): 'active/active, stateless architecture'; 'With load balancers in front of every data center, transactions can be equally processed through any available data center. In the event that a data center is unavailable, these load balancers also manage the failover to the other data centers.' Stripe 2023 annual letter: its systems 'can automatically remediate many incidents by invoking redundant rails or enabling emergency fallback capabilities'. Adyen documentation, live endpoints (https://docs.adyen.com/development-resources/live-endpoints, n.d., accessed 2026-11): 'alternative routing can be enabled to backup infrastructure and new infrastructure can be provisioned on demand'. Adyen Annual Report 2025 (2026-03-05, the PDF offered at https://investors.adyen.com/financials/2025, which calls itself a printed version): 'Adyen designs its platform to avoid single points of failure'. Brief: not found for Stripe: any post on regional or cell architecture or API failover. | `contrast`: What the two companies have documented. → What neither has. |\n| p21 | analysis | Read together, the two published designs relax something other than the record of money (the freshness of the books at Adyen, the non-critical request at Stripe), which is the author's reading and is labeled as inference: late before wrong. | reasoning: Brief architecture implication (ASSUMPTION/JUDGEMENT), rendered as an INFERENCE, NOT DOCUMENTED block: both split an answering path from a record-keeping path that may lag; neither company states this as a shared principle. | `conclusion_summary`: Two documented levers and the limits of the record. → What they have in common, as inference. |\n\n### The Designs: Skip, Queue or Refuse, Step by Step\n\n**Controlling idea** (`comparison`, id `skip-queue-refuse`): For each step of a payment path whose dependency fails there are three designs (let the payment proceed without the step, do the step later, or refuse the payment), and the choice follows from whether the step decides if money may move, records that it moved, or tells someone about it.\n\n**Advances the thesis** (C3): Turns the providers' documented choices into a rule the reader applies to their own path, which AC-2 tests.\n\n**Transition in:** `elaboration`: Operators that decided beforehand what gives way. → The reader's own version of that decision, one step at a time.\n\n**Order of paragraphs** (`prerequisite_order`): The three designs must be named before the rule that chooses among them; the rule before its documented instances; and the timeout last, because it is what every one of the designs meets in practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | When a step's dependency is unreachable there are three designs: fail open (skip the step and let the payment proceed), queue (accept the payment and do the step later) and fail closed (refuse or hold the payment), and each trades availability against a different risk. | reasoning: Brief glossary: fail open / fail closed; the queue is Adyen's documented third option (the local database queue). |  |\n| p23 | explanation | The sorting rule is the step's job: a step that records or reports a payment can be queued because it may be late but not lost, a step that tells someone can be queued or skipped, and a step that decides whether money may move is refused by default and failed open only as a written decision with a bound on the loss. | table: Trade-off table: step (receipt or notification; ledger posting; fraud score; check that the seller may take payments; idempotency store; the issuer's authorization) by job, default design, what the choice risks. Author's recommendation, with the receipt and permission-check rows matching AC-2. | `cause_effect`: Three designs. → The rule that picks one per step. |\n| p24 | example | Each design has a documented instance: Adyen queues its accounting (2021); Adyen's API refuses a keyed request when its idempotency store is unavailable and hands the choice to the caller; Stripe in 2014 expected its fraud scoring to fail open under a network partition and found a latency spike instead. | fact: Adyen documentation, API idempotency (https://docs.adyen.com/development-resources/api-idempotency, n.d., accessed 2026-11): HTTP 503 with error 703 'required resource temporarily unavailable'; the caller may 'Pause processing and retry the requests later (if this is feasible)' or 'Fall back to non-idempotent processing by not submitting the idempotency-key HTTP header'.; case: Stripe, 'Game Day Exercises at Stripe: Learning from kill -9', Marc Hedlund, 2014-10-28 (read from the Internet Archive snapshot of 2021-06-22; evidence age 12 years): the team guessed a partition between charge processing and the scoring service 'would cause these calls to time out and fail open (that is, allow the charge to go through immediately)'; the test 'caused a spike in latency, where we'd expected calls to scoring-srv to time out and fail open quickly'. | `example`: The rule. → One documented case of each design. |\n| p25 | analysis | A failing dependency is more often slow than down, so every step needs a deadline, and at the outer edge a deadline turns slowness into unknown outcomes, by the thousand during an outage; clients that then retry at once add load to the system that is failing, which Stripe's 2019 remediation names. | quotation: Stripe, 'Root cause analysis: significantly elevated error rates on 2019-07-10' (https://stripe.com/rcas/2019-07-10, published July 2019; evidence age 7 years; re-fetched 2026-11-17): 'limit resource consumption by clients attempting repeated retries of failed requests'.; fact: Stripe, 'Advanced error handling' (https://docs.stripe.com/error-low-level, n.d., accessed 2026-11): 'When a connection fails, you might not know whether Stripe received or executed the request.' | `cause_effect`: Designs tested against a dependency that is down. → The commoner case, a slow dependency, and what a deadline produces. |\n\n### When It Fails Anyway: What the Public Incident Accounts Show\n\n**Controlling idea** (`evidence`, id `incident-accounts`): Four public documents describe a failure of either company's payment path (Stripe's root-cause analysis of 10 July 2019 and its paragraph on 8 February 2024; Adyen's update on the attack of 21 April 2025 and its follow-up); they show failures set off by a change or an attack and deliberate choices about what to keep, and none says how the failover works or how many payments were left unknown.\n\n**Advances the thesis** (C4): Supplies the evidence for 'when the path fails anyway, the provider restores service and publishes little'.\n\n**Transition in:** `contrast`: Designs that keep a path answering. → The occasions on which it did not, as the companies have told them.\n\n**Order of paragraphs** (`chronological`): The term first, then the accounts in date order (2019, 2024, 2025), then what they share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | definition | An incident report (also called a root-cause analysis or postmortem) is a written account of what failed, why, and what will change; a merchant reads it for a fourth thing it rarely contains, what happened to the requests in flight, and for the two companies there are four such public documents in total. | fact: Brief inventory: Stripe, one full RCA (2019) and one paragraph in the 2023 letter; Adyen, one incident update (2025-04-22) and one follow-up (2025-10-31); not found: any public detailed postmortem by Adyen, any public Stripe RCA after July 2019 other than that paragraph. |  |\n| p27 | evidence | Stripe's analysis of 10 July 2019 describes a cascade: a database failover fault left one shard without a primary, that shard was used by so many applications that the API starved, and the second, longer window was caused by reverting the first fix. | quotation: Stripe, 'Root cause analysis: significantly elevated error rates on 2019-07-10' (https://stripe.com/rcas/2019-07-10, published July 2019; evidence age 7 years; re-fetched 2026-11-17): 'two different database bugs and a configuration change interacted in an unforeseen way, causing a cascading failure across several critical services'; two nodes 'stopped emitting metrics reporting their replication lag but continued to respond as healthy to active checks'; 'Because of widespread use of this shard across applications, including the API, the unavailability of this shard starved compute resources for the API and cascaded into a severe API degradation'; 'our revert to a known stable version interacted poorly with a recently-introduced configuration change to the production shards'; 'Automated monitoring detected the failed election within a minute.' | `example`: Four public documents. → The fullest of them. |\n| p28 | analysis | For a merchant the telling part of that account is its unit: failed POST requests per user, and Stripe's current documentation says what such a request leaves behind, an indeterminate outcome that Stripe's own recovery may or may not reconcile. | quotation: Stripe, 'Root cause analysis: significantly elevated error rates on 2019-07-10' (https://stripe.com/rcas/2019-07-10, published July 2019; evidence age 7 years; re-fetched 2026-11-17): 'We've sent you an email if you had five or more failed POST requests.'; quotation: Stripe, 'Advanced error handling' (https://docs.stripe.com/error-low-level, n.d., accessed 2026-11): 'Treat the outcome of a request that returns 500 as indeterminate'; 'During incident recovery, Stripe attempts to reconcile failed operations and send webhook events for any objects created during reconciliation. The cached response doesn't change, and reconciliation isn't guaranteed to resolve every operation.' | `cause_effect`: The cascade and its two windows. → What the account implies for the merchant's records. |\n| p29 | evidence | Stripe's only later account is a paragraph in its 2023 annual letter about six minutes on 8 February 2024, caused by an erroneous change that reached 1% of the critical tier of traffic and counted in failed payments per user; the status feed's entries for 2026 state a window and a resolution and no analysis. | quotation: Stripe 2023 annual letter (https://stripe.com/annual-updates/2023, published 2024-03-13): 'the most significant recent issue which happened on February 8, 2024 between 21:46 and 21:52 UTC'; 'the three most impacted users had 39, 15, and 12 payments fail, respectively'; 'an erroneous change rolled out all the way to 1% of the critical tier of traffic'.; fact: Stripe status feed (https://www.stripestatus.com/history.json, n.d., accessed 2026-11-17): 27 September 2026, impact 'major', 'From 00:32 UTC to 01:01 UTC, we saw elevated API errors. This issue is now resolved.'; 14 November 2026, 'From 02:34 to 03:01 UTC on November 14th, we saw increased API error rates for the Stripe API. This is now resolved.' | `additional_support`: The 2019 analysis. → The 2024 paragraph and the status feed. |\n| p30 | evidence | Adyen's one public account concerns an attack: on 21 April 2025 a distributed denial-of-service attack on its European data centers disrupted payment processing mainly between 18:51 and 19:35 CEST, its mitigations deliberately left hosted checkout components impaired, and the detailed review went to customers only; a follow-up six months later names four changes. | quotation: Adyen, 'Incident update: Mitigating a DDoS attack on April 21, 2025' (https://www.adyen.com/knowledge-hub/mitigating-a-ddos-april-2025, dated 2025-04-21 on the page): 'a DDoS attack targeting services across our European datacenters'; 'the main impact for Ecommerce and In-Person Payment Transaction processing occurring between 18:51 CEST and 19:35 CEST'; 'As a result of our deliberate mitigations, checkout services such as Session Integrations, Secured Fields, and Pay by Link, remained impacted throughout the entire incident.'; 'A detailed post-incident review, including root cause analysis and long term prevention measures, will be made available to our customers.'; fact: Adyen, 'Strengthening our platform resilience' (https://www.adyen.com/knowledge-hub/strengthening-our-platform-resilience, 2025-10-31): 'introducing additional global DDoS mitigation partners, such as Cloudflare, alongside existing global providers'; 'We've scaled and re-architected our load-balancing layer'; 'We've accelerated planned geographic distribution of key services'; 'additional automated testing and monitoring'. Adyen Annual Report 2025 (printed version, 2026-03-05): 'In 2025, there was one instance of reduced availability, linked to the disruption incident referenced earlier.' | `contrast`: Stripe's disclosed failures, set off by its own changes. → Adyen's disclosed failure, set off from outside. |\n| p31 | analysis | What the four documents have in common is their limit: each says what broke and what was kept, none describes a failover between regions or how many payments ended with an unknown outcome, and neither company publishes postmortems as a routine, so a merchant gets that detail only by asking for it under contract and by counting on its own side. | reasoning: Brief open questions 7 and 9 and its 'where detail goes' row; Adyen's annual report: 'Each incident triggers a root-cause analysis and an assessment of its impact on the broader risk and control framework' (internal, not published). | `conclusion_summary`: Four documents read one by one. → Their shared limit. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): On reliability the documented differences are in what each company states and promises in public (a target at Stripe, a contractual commitment at Adyen), in which lever each has described, and in how each has reported incidents; on failover neither has published a design.\n\n**Advances the thesis** (C1, C2, C4): Gathers the dated facts of the three previous sections into the required comparison.\n\n**Transition in:** `conclusion_summary`: Figures, designs and incident accounts, each read at both companies. → The side-by-side table and what an integrator does differently on each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | comparison | Set side by side, Stripe states a target and no public commitment while Adyen states a public commitment and no target; Stripe has documented shedding and per-shard isolation, Adyen a lagging accounting queue; each has a handful of incident documents; and on failover between data centers Stripe's record is empty and Adyen's is a few general sentences. | table: Where They Differ table, six rows: stated target; reported figures; contractual commitment; documented lever (what gives way); public incident accounts; failover between data centers. Cells are the dated facts cited in the sections above or 'Not public'; the last column is the author's reading, introduced as inference. |  |\n| p33 | recommendation | An integrator therefore asks Stripe for a commitment in the contract and reads its feed by machine, reads Adyen's exclusions before relying on its 99.9%, asks both for incident reports under contract, and on both measures payment success itself. | reasoning: Follows from the table rows; Stripe's status history is a public JSON feed, Adyen's page is a summary with a disclaimer. | `cause_effect`: The table. → What to do differently on each provider. |\n\n### In Practice at Larkfield: A Scripted Forty-Four Minutes\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield's outage drill scripts 44 minutes of failure at one provider and is finished when no payment has an unknown outcome, which shows that the sweep does the repair, that the contract would not have been breached, and that the switch helps only new payments.\n\n**Advances the thesis** (C3, C5): Works the thesis through with ledger facts: what gives way at Larkfield and what has to be repaired afterwards.\n\n**Transition in:** `example`: What each provider documents and where each record stops. → Larkfield, which depends on both, rehearsing an outage of one.\n\n**Order of paragraphs** (`chronological`): The dependency, the prepared decisions, the scripted outage, the repair, the end.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | context | Larkfield depends on its two providers one studio at a time, so for most studios an outage of their provider means waiting: the K8 switch covers online card payments that bring their own credential at the 50 largest studios, stored-card renewals wait for the provider that holds the card, and the front desk has no second provider. | scenario: Scenario ledger: split by studio; K8; chapter 10 addition (verified accounts at both providers for the 50 largest studios; stored-card renewals stay with or wait for the provider that holds the card); chapter 11 addition (front desk has no second provider, offline payments not enabled). |  |\n| p35 | example | Larkfield's own step table says what gives way when a provider is slow: interactive checkout gets a deadline and a 'checking' state, renewals pause, receipts and ledger entries wait, and no step may record a payment as failed or create a second one. | table: Larkfield step table under Keel: checkout request (deadline, then pending with waiting_on = provider); renewal batch (paused and paced, K5); receipt email (queued); ledger entry (posted from the report, K3); studio verification status (read from the mirror, K6; refuse if the studio is not allowed to take payments). Local details consistent with K1 to K6 and the chapter 2 and 8 additions. | `elaboration`: A dependency on two providers. → What gives way at Larkfield when one is slow. |\n| p36 | example | The June 2027 drill scripts a degradation of 44 minutes, the length of the main impact window Adyen published for April 2025, and assumes 2,000 payment attempts of which 760 get no usable answer; measured against a 99.9% quarterly commitment those 44 minutes are no breach. | statistic: Illustrative assumptions for the drill: 2,000 attempts, 1,240 answered, 760 timeouts or server errors. Author's arithmetic: a 91-day quarter has 131,040 minutes; 44 minutes is 0.034%, so the quarter would stand at about 99.966%, inside a 99.9% commitment that allows about 131 minutes. | `example`: What gives way. → The scripted outage and its count. |\n| p37 | process | The 760 are resolved one by one without a new charge: each stays pending, is resent under its stored key inside Larkfield's limits, and what is still open goes to the sweep, the job that confirms each pending payment against the provider's record (the payment object on Stripe, the webhook and then the settlement report on Adyen); in the drill 310 turn out to have been approved and 450 never executed. | scenario: Scenario ledger: K1, K2; chapter 18 addition (resend under the stored key for 20 hours on Stripe and 6 days on Adyen; on Stripe the sweep finds the payment by the Larkfield identifier in metadata); chapter 2 addition (pending covers 'request sent, no answer yet'); ruling 12 (no payment GET in Adyen's Checkout API). Assumed split of the 760: 310 approved, 450 not executed. | `sequence`: 760 payments with no answer. → How each is resolved, per provider. |\n| p38 | analysis | The drill ends when the count of unknown payments is zero, hours after the scripted recovery, and the switch plays a small part in it: thrown during the window it moves new wallet and typed-card payments at the 50 largest studios, while the 760 stay with the first provider and are never retried on the second. | reasoning: Chapter 10: retry on another provider only when the first attempt is known to have failed. Local detail: the drill records time-to-known per provider as its result (appended to the ledger). | `conclusion_summary`: The 760 resolved. → When the drill is over and what the switch contributed. |\n\n### When It Goes Wrong: Recoveries That Make an Outage Worse\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Four recoveries turn an outage into lasting damage: recording timeouts as failures, retrying everything at once when service returns, sending an unknown payment to the other provider, and declaring the outage over when the status page turns green.\n\n**Advances the thesis** (C5): Shows the failure modes of the merchant's side of the thesis, each with detection and recovery.\n\n**Transition in:** `contrast`: A drill in which every prepared decision held. → The four ways the merchant's own recovery goes wrong.\n\n**Order of paragraphs** (`order_of_importance`): From the most common and most expensive (a timeout recorded as failed) to the one that makes the others invisible (ending the incident at green).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | analysis | Recording a timeout as a failure creates a Phantom Payment and invites a Double Charge, because the customer or a job then pays again; it is detected by payments at the provider with no successful local record, and prevented by a state for 'unknown'. | case: Scenario ledger: the Double Charge (1,840 members, EUR 71,300, 212 disputes); the drill's 310 approved among 760 unanswered (assumption). |  |\n| p40 | analysis | Retrying everything the moment service returns hits the recovering provider with a burst and the merchant's own rate limit, which is the Renewal Wave produced by an outage; pacing, backoff with jitter and serving interactive payments before the backlog prevent it. | case: Scenario ledger: the Renewal Wave of 1 October 2026 (7,900 renewals delayed after the job hit the rate limit); chapter 21 addition (a 429 was treated as a failed attempt). Stripe, 'Root cause analysis: significantly elevated error rates on 2019-07-10' (https://stripe.com/rcas/2019-07-10, published July 2019; evidence age 7 years; re-fetched 2026-11-17): Stripe's commitment to 'limit resource consumption by clients attempting repeated retries of failed requests'. | `additional_support`: A wrong record. → A wrong recovery rate. |\n| p41 | analysis | Sending an unknown payment to the second provider charges the customer at two providers that share no idempotency key, and a second provider that has never carried traffic fails on the day; both are detected only by rehearsal. | reasoning: Chapter 10 owns the cross-provider retry and the cold second rail; one paragraph and a link here. | `additional_support`: Too many retries at one provider. → A retry at the other provider. |\n| p42 | analysis | Declaring the outage over when the status page recovers leaves the unknown payments unowned, and they keep changing afterwards (Stripe's recovery may create objects and send their events later); the outage is over when the count of payments older than a set age in an unknown state is zero, and that count needs an owner and an alert. | quotation: Stripe, 'Advanced error handling' (https://docs.stripe.com/error-low-level, n.d., accessed 2026-11): 'Prepare your webhook handlers to process objects your integration hasn't received in an API response.'; figure: Figure 37-two-ends-of-an-outage: a timeline with 'Service restored' at minute 44 and 'Every outcome known' later, the count of unknown payments falling from 760 to zero between them. | `conclusion_summary`: Three wrong recoveries. → The fourth: stopping too early, and the definition of 'over'. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The provider and the merchant make the same decision at different scales. The provider keeps its path answering by letting the books lag or the list calls fail; the merchant keeps its records right by letting its own answer to the customer be late ('checking') instead of wrong. An availability figure measures only the first; the count of unknown outcomes measures the second, and it is the only one of the two the merchant controls.\n\n**So what:** A team that plans this way reads the contract and its exclusions instead of the reported nines, measures payment success itself, and has a sweep that drives unknown outcomes to zero before it spends on a second provider connection; a team that buys nines and adds a failover has two providers and still charges people twice.\n\n**Callback:** The email Stripe sent in July 2019 to users with five or more failed POST requests, and Sofie Vermeer's question about which provider is more reliable. The email was the provider handing each customer its share of the outage; the answer to Sofie is that reliability, for Larkfield, is how fast that share reaches zero, on either provider.\n\n**Takeaway** (`course_of_action`): For each provider: write down the contractual commitment and its exclusions, alert on your own payment success rate, list for every step of your payment path whether it is skipped, queued or refused when its dependency fails, and rehearse an outage until the count of payments in an unknown state returns to zero without a duplicate.\n\n**Hand-off** to [Never Lose a Cent: Data Stores and Consistency](payment-data-stores-and-consistency.html): `cause_effect`: The split this chapter introduced: the answering path is kept independent of the record, and the record may lag but may not be wrong. → The consequence: the record has to be kept right on its own terms, in databases that have themselves been divided into shards, without a transaction that covers all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | synthesis (list) | Established: the published figures are different measurements; Adyen's public terms commit to 99.9% per quarter with exclusions and no public percentage for Stripe was found; Adyen (2021) and Stripe (2017, 2019) each documented a design that lets something other than the payment give way; a timeout or a 500 is an unknown outcome; neither company publishes its failover design or routine postmortems. |  |  |\n| p44 | synthesis (list) | Depends on context: whether a deciding step may fail open, how long a customer-facing request may wait, whether a second provider is worth its cost, and how much to rely on a provider's own post-incident reconciliation all depend on the loss at stake, the kind of payment and what the merchant can rehearse. |  | `contrast`: What the record establishes. → What changes with the merchant's situation. |\n| p45 | recommendation (list) | The author's synthesis: judge an outage by the time until every payment attempted during it has a known outcome, build the sweep before the second provider connection, and let your own answer be late before you let your record be wrong. |  | `additional_support`: What is established and what depends. → The author's own position. |\n| p46 | recommendation (list) | Nine questions let the reader test a provider's availability claims and their own payment path in a design review. |  | `sequence`: The author's position. → Questions that apply it. |\n| p47 | transition | Keeping the answering path independent of the record has a consequence: the record must be kept right on its own terms, in databases that have themselves been split into shards with no transaction covering all of them, which is the subject of the next chapter. |  | `cause_effect`: The split between the path that must answer and the record that must be right. → The consequence for the record once it is spread over shards. |\n\n## Non-goals\n\n- The mechanics of idempotency keys, key windows and retry policy. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- The webhook receiver's contract and the sweep's implementation. See [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html).\n- Rate limits and the design of Stripe's 2017 limiters. See [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html).\n- Routing across providers, orchestration and the mechanics of the switch. See [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- Databases, shards, replication and how the record stays consistent. See [Never Lose a Cent: Data Stores and Consistency](payment-data-stores-and-consistency.html).\n- Hosting, regions, data centers and data residency. See [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html).\n- Peak figures, capacity planning and load testing. See [The Biggest Day: Peak Load and Capacity](payment-peak-load.html).\n- Deployment practice, progressive rollout and how postmortems are run. See [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html).\n- Offline acceptance at the terminal. See [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n- EU operational-resilience regulation (DORA).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Stripe's availability formula (time-based or request-based, which endpoints, how downstream failures count) is not public; the only hint is the 2023 phrase 'measured at the individual transaction level'.\n- Whether Stripe's negotiated contracts carry a service-level percentage is not public.\n- Neither company has published a failover design for payments. Adyen's documentation says in general terms that load balancers fail over between its data centers (peak season readiness page) and that 'alternative routing ... to backup infrastructure' can be enabled; neither is described further. For Stripe nothing was found for payments; a blog post of 28 January 2025 describes two-region processing with automatic failover for billing usage events.\n- Adyen's detailed review of the April 2025 attack went to customers only; the saturated components and the number of affected payments are not public.\n- Whether Stripe's 2017 load shedders still exist in that form is unconfirmed; a 2026 post mentions priority-based request routing.\n- Adyen's status history endpoint returned a truncated view; nothing in the chapter may be read as 'Adyen had no incident of type X'.\n- Stripe's status page displayed '99.999% uptime for the last 90 days' for the Stripe API on 17 November 2026 and gives no definition; the page's own data endpoint (/uptime_showcase) returned 99.94 for the same component and window that day. The chapter states the displayed figure; the author decides whether to mention the discrepancy.\n\n## Decision log\n\n- **2026-11-17** — The uptime figures come before the mechanism, because the thesis is disputed by 'availability is a number to buy' and the reader arrives with that number. Rejected: Opening the body with failure isolation and treating the figures as an appendix.\n- **2026-11-17** — Larkfield's worked example is a drill run by fault injection at Larkfield's own adapter, not a provider outage, so that nothing in the scene is evidence about a provider; its 44 minutes borrow the length of Adyen's published main impact window. Rejected: Inventing a provider outage in 2027.; Replaying the Double Charge again (chapter 18 did).\n- **2026-11-17** — Status pages are treated as evidence inside the figures section and the incident section, not in a section of their own. Rejected: A separate status-page section, which would repeat both.\n- **2026-11-17** — Hosting (cloud versus own data centers), fault-injection practice in detail, deployment figures and peak figures are left to chapters 39, 40 and 41. Rejected: A full inventory of each company's reliability engineering posts.\n- **2026-11-17** — The trade press report of the April 2025 attack's resolution time is not used; only Adyen's own two documents and its annual report are. Rejected: Citing a secondary source read only as a search summary.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, chapter 37 contract — Scope, owned terms, Larkfield example.\n  - journal-spec.json, entry payment-reliability-and-availability and part-8 — Intent, acceptance criteria, thesis, role, transitions.\n  - _research/brief-reliability-and-scale.md, Part 1, Part 6, Part 7, Key numbers, Open questions — The tagged claims used as evidence; the list of what is not public.\n  - _research/scenario-ledger.md and consistency-issues.md (rulings 4, 5, 12, 13) — Larkfield facts, K1 to K8, ownership boundaries with chapters 18, 20 and 21.\n- **External**\n  - https://stripe.com/rcas/2019-07-10 — The 2019 root-cause analysis.\n  - https://www.adyen.com/knowledge-hub/design-to-duty-adyen-architecture and -part2 — The stateless edge and the lagging accounting queue (2021).\n  - https://stripe.com/blog/rate-limiters — Critical and non-critical traffic (2017).\n  - https://www.adyen.com/legal/terms-and-conditions; https://status.adyen.com/; https://stripe.com/us/legal/ssa — The contractual commitment, the status-page definition and disclaimer, the absence of a Stripe percentage.\n  - Stripe annual letters 2022 and 2023; Sessions 2024 talk; stripe.dev proxy post 2026; BFCM press releases 2024, 2025 — Stripe's target and reported figures; the 8 February 2024 paragraph.\n  - https://www.adyen.com/knowledge-hub/mitigating-a-ddos-april-2025; /strengthening-our-platform-resilience; Adyen Annual Report 2025 (printed version); H2 2025 results — The April 2025 incident, its follow-up, the BFCM 2025 figure.\n  - https://docs.stripe.com/error-low-level; https://docs.adyen.com/development-resources/api-idempotency; https://docs.adyen.com/development-resources/live-endpoints; https://www.stripestatus.com/history.json — Indeterminate outcomes and incident reconciliation; the idempotency-store fallback; alternative routing; status entries.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — First draft of the outcome spec from the PLAN contract, the journal-spec entry and the reliability brief.\n- **2026-11-17** — After the flow rubric: the sweep is named where the drill resolves its unknown payments; the failover paragraph states Adyen's one documented sentence so the comparison table only gathers; the 2019 outage is pointed forward from the isolation paragraph; the hook ends on the fact. Not acted on: merging the paragraph on the absence of a Stripe percentage into the paragraph on Adyen's commitment (kept apart, one idea each; AC-3 turns on it).\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass: 67 claims checked (51 confirmed, 9 corrected, 6 hedged, 1 unsupported and relabeled, 0 unreachable); most significant fixes: Adyen does document failover between data centers in general terms (peak season readiness page), the uptime commitment is now quoted from Adyen's current terms of 1 November 2023 as a commercially-reasonable-efforts clause, and Stripe's status page shows a rolling 90-day figure. Paragraph-level controlling ideas and evidence updated to match; intent, thesis and acceptance criteria untouched; no unit added, dropped or reordered.\n- **2026-11-17** — Absence audit: statements of absence re-tested with a wide search (documentation and support sitemaps, company sites and license pages, web search). Narrowed: Stripe's yearly figures (the Sessions 2026 keynote gives 99.9996% for 'critical APIs' in 2025); Adyen's achieved figures (Adyen Australia publishes a quarterly regulatory availability disclosure: 100% for accepting card payments, Q3 2026); Stripe's contractual commitment (no availability percentage; paid support plans state a 15-minute response); Stripe on failover (none found for payments; a two-region design with failover is published for billing usage events, 2025). Holds: no Adyen availability target; no public service-level percentage for Stripe. Four sources added; connective sentences trimmed; units unchanged.\n- **2026-11-24** — Sweep of rulings 46 to 48: the sentence on Stripe and failover is scoped to the payment path, as the table already was (46g); p20 aligned.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {

            const out = [];

            const bullet = /^(\s*)([-*])\s+(.*)$/;

            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';

                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
