sms imply that money is kept consistent by local transactions, retries that are safe to repeat, messages between clusters and verification afterwards.\n\n**Disputed by:** The view that money needs one strongly consistent relational database, or distributed transactions across every service that touches it, and that a document store or any eventual consistency has no place near a payment.\n\n**So what:** The reader stops asking which database is safe for money and instead draws a small consistency boundary (for Larkfield, the payment record and its outbox row), makes everything that crosses it idempotent, and adds a check that proves both sides agree.\n\n**How and why:** Stripe's 2024 account describes DocDB, built on MongoDB Community, with more than 2,000 shards and a platform that moves data between them; during the switch, which takes under two seconds, 'all failed reads and writes directed to the source shard succeed on retries'. Adyen's 2018 to 2025 posts describe PostgreSQL clusters; its 2021 account says accounting was sharded round-robin, that rebalancing was not implemented, and that clusters exchange 'back and forth messages' to stay aligned, while templates guarantee that the records sum to zero. That is the documented difference: Stripe invested in moving data between shards and verifies its ledger after the fact (2024), Adyen in not needing to move it and in checking at write time (2021). That both rely on idempotent operations and later verification instead of a global transaction is an inference from these mechanisms; neither company states it, and which data is replicated synchronously, read consistency and the cross-cluster protocol are not public.\n\n**Supporting claims**\n\n- **C1** — Payment data does not need one level of consistency: a small set of records must change together (the consistency boundary, at most one database) and everything else may catch up, so the design question is where the boundary sits, not which database is used.\n- **C2* erification afterwards (the last step of that reading is the author's inference), so what matters is where the consistency boundary is drawn.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from a pass at Larkfield that was paid and not activated. *Kept in:* scene.\n- Say which payment data has to be exact and define the consistency boundary. *Kept in:* what-has-to-be-exact.\n- Explain what sharding keeps and what it breaks. *Kept in:* shards.\n- Report what Stripe has published and then what Adyen has published, with dates and with what is not public. *Kept in:* stripe-published, adyen-published.\n- Compare the two and state what both records imply about transactions. *Kept in:* where-they-differ, no-spanning-transaction.\n- Give the small-scale version: a local transaction, an outbox and an idempotent consumer. *Kept in:* outbox.\n- Apply it to Larkfield's payment record store, including an online change to that store's shape, and go through the ways it fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | In 2023 Stripe moved 1.5 petabytes of data between database shards while payments ran, and each move deliberately rejected reads and writes on the data being moved for up to two seconds, which is not what 'never lose a cent' is usually taken to mean. | quotation: Stripe's 2024 post: \"we bin-packed thousands of underutilized databases by migrating 1.5 petabytes of data transparent to product applications, and reduced the total number of underlying DocDB shards by approximately three quarters\"; \"The entire traffic switch protocol takes less than two seconds to execute, and all failed reads and writes directed to the source shard succeed on retries.\" |  |\n| p02 | transition | Chapter 37 separated the path that must answer from the record that must be right, and the consequence is that the record has to be kept right on its ng payment. |\n| p05 | transition | The chapter goes from a paid pass that was not activated at Larkfield, through which data has to be exact, what sharding keeps and breaks, what Stripe and then Adyen have published, how the two differ and what both records imply, to the outbox as the small-scale version, Larkfield's own design with a change to its store's shape made while it runs, and the ways it fails. |  | `sequence`: The claim and its place in the journey. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Paid, and Not Activated\n\n**Controlling idea** (`example`, id `scene`): Larkfield's payment record store marked a payment paid and then told the booking app in a second, separate step, so a failure between the two left members who had paid without the thing they paid for.\n\n**Advances the thesis** (C1, C5): Shows the problem at the scale the reader works at: two systems that must agree and no transaction that covers both.\n\n**Transition in:** `example`: The claim that consistency depends on where the boundary is drawn. → A case in which no boundary had been drawn at all.\n\n**Order of paragraphs** (`chronological`): The fault as it was found, the first proposed repair, then the question that replaced it; the proposal is only understandable after the fault, and the question only after the proposal.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | Before Keel, Larkfield's webhook processing took a stored message from the inbox table, committed `paid` to the payment record store and then called the booking app to activate the pass or membership, and in 2026 that second step failed silently for 146 purchases. The scene opens by naming it as a case in which no consistency boundary had been drawn between a payment and what it pays for, and glosses Keel (Larkfield's 2027 program of eight decisions, K1 to K8) at first use. | scenario: Scenario ledger: the payment record store (PostgreSQL, fed by webhooks through an inbox table) and the booking app are separate systems. New local facts added to the ledger: before Keel the activation was a direct call made after the commit, with no retry; 146 purchases in 2026 stayed `paid` without an activated pass or membership period until the member contacted support (illustrative). |  |\n| p07 | context | Tom Hendriks's first proposal in February 2027 was to add a message queue and wrap the database write and the publish in one distributed transaction, which is the answer most engineers reach for first. | scenario: Local detail consistent with the ledger: Femke de Graaf's review of the record with Tom Hendriks is in late March 2027 (addition by 08-payment-state-machines); the proposal is made in February 2027, in Femke's second month, and the outbox design that replaced it is live from 1 March 2027, before Mila's pass of 9 March. | `problem_solution`: The paid-and-not-activated purchases. → The repair that was proposed first. |\n| p08 | claim | Femke de Graaf replaced the proposal with three questions that the rest of the chapter answers: which records must change together, what is allowed to catch up later, and which check proves afterwards that both sides agree. K2 and K3 are glossed where named, and so is the clearing account (an account that should return to zero once a flow completes). | scenario: Keel decisions K2 (the provider's record is the truth; a job sweeps everything still pending) and K3 (clearing accounts must return to zero; reconciliation when each provider's reports are ready) already answer the third question for provider data (scenario ledger). | `contrast`: A transaction stretched over two systems. → A boundary, a list of what may lag, and a check. |\n\n### What Has to Be Exact: Consistency Boundaries by Kind of Data\n\n**Controlling idea** (`explanation`, id `what-has-to-be-exact`): Payment data does not need one level of consistency: a small set of records must change together or not at all, everything else may catch up, and the line between them is the consistency boundary.\n\n**Advances the thesis** (C1): Supplies the term the thesis turns on and shows that the requirement differs by kind of data.\n\n**Transition in:** `elaboration`: Femke's first two questions: what must change together and what may catch up. → The general answer by kind of data, and the name for the line between the two.\n\n**Order of paragraphs** (`prerequisite_order`): The observation that requirements differ comes first, with a provider's own words; the term for the line is defined from it; only then can the reader see why stretching the line over several systems is avoided. Defining the boundary before showing that data differs would give a term with nothing to apply it to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | explanation | The kinds of data on a money path have different requirements: the record of a payment and of the money must be exact when written, while balances shown to people, reports and analytics may run behind as long as they say so. | quotation: Adyen, 2021: \"Whereas for the latter the priority was uptime, for the accounting systems we don't mind if they are down for a little bit as long as we can guarantee their reliability and consistency.\" Stripe, 2024: \"99.99% of our dollar volume is fully ingested and verified within four days\". Adyen, 2024: reports were served from \"an aggregated (and summarized) version of the original data from all shards\" in a separate database.; table: Requirements table, the author's reference design (not a provider's): rows idempotency-key record, payment state with its outbox row, ledger entries, balance shown to a studio, reports and analytics; columns: must be exact when, may lag by, what happens when the store is unavailable. |  |\n| p10 | definition | A consistency boundary is the set of records that change together in one local transaction or not at all, and in practice it can be no larger than one database. | reasoning: A local transaction is the one mechanism a database gives that is atomic without a protocol between machines owned by different systems; everything outside it is reached by a message or a call that can fail independently.; figure: Figure 38-consistency-boundary: a small fenced area holding a payment row and an outbox row that change together; outside the fence a pass, a ledger and a report, each with a clock. | `elaboration`: Data that must be exact and data that may lag. → The name and the size of the line between them. |\n| p11 | explanation | A transaction stretched across systems is avoided on a money path for three reasons: both systems must be up for either to commit, a participant that fails mid-way leaves the others waiting, and the most important participant, the provider or the bank, offers no transaction to join. | quotation: A practitioner statement of the common position: \"it is not viable to use a traditional distributed transaction (2PC) that spans the database and the message broker\", because either \"might not support 2PC\" and it is \"often undesirable to couple the service to both\".; reasoning: A card authorization is a message to a bank; no API of either provider exposes a prepare-and-commit step a merchant's database could enrol in. | `cause_effect`: A boundary no larger than one database. → Why it is not simply made larger. |\n\n### When One Database Is Not Enough: What a Shard Keeps and What It Breaks\n\n**Controlling idea** (`explanation`, id `shards`): Splitting one kind of data across shards keeps transactions local to each shard and removes them between shards, so the choice of shard key decides which operations stay inside a boundary.\n\n**Advances the thesis** (C2): Explains why growth turns one consistency boundary into many, which is the condition both companies' published designs answer.\n\n**Transition in:** `cause_effect`: A boundary that is at most one database. → What happens to it when the data no longer fits in one database.\n\n**Order of paragraphs** (`prerequisite_order`): The term first, then the choice it forces, then the alternatives to making that choice at all; the contrast cases only mean something once the reader knows what sharding costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | A shard is one of many databases that each hold a slice of the same kind of data; inside a shard a transaction works as before, and across shards three things stop being free: a transaction, a query over all the data, and moving data to even out the load. | quotation: Stripe, 2019: \"Stripe splits data by kind into different database clusters and by quantity into different shards. Each cluster has many shards, and each shard has multiple redundant nodes.\" Adyen, 2024: \"sharding splits a large database into smaller, more manageable shards\". |  |\n| p13 | comparison | The shard key decides what stays local: placing data by business entity keeps one merchant's operations in one shard and makes shards uneven, while placing it by rotation or hash keeps shards even and spreads one merchant's money across several. | quotation: Adyen, 2021, on why it rejected placement by merchant or payment method: \"every rule we considered would bring its own problems. For example, if we would put each processing merchant in one database, you still need to go to every shard when you need aggregate data to send to our payment method partners.\"; table: Trade-off table, three placements (by business entity, by rotation or hash, by time or kind): what stays in one transaction, what crosses shards, what rebalancing needs, when it fits. | `elaboration`: Transactions that are local to a shard. → The key that decides which operations those are. |\n| p14 | comparison | The trade can also be avoided by not sharding the money at all: Square's 2019 Books service bought global consistency from a managed distributed database, and TigerBeetle's documentation argues for a ledger database that does not shard at all; Stripe and Adyen both sharded, which leads into the two accounts that follow. | quotation: Square, 2019: \"we picked Google Cloud Spanner. It is a fully managed, globally distributed SQL database which let us not worry about sharding\". TigerBeetle documentation: \"Unfortunately, business transactions don't shard well.\" | `contrast`: Choosing a shard key, a trade forced by sharding. → Two published ways of not having to choose one. |\n\n### What Stripe Has Published: A Document Database and a Platform That Moves Data\n\n**Controlling idea** (`evidence`, id `stripe-published`): Stripe has published a document database platform on MongoDB with more than 2,000 shards (2024, 2026), a platform that moves data between them with a write pause under two seconds, a 2017 pattern for changing a data model online and a ledger that verifies after the fact, and it has not published transaction boundaries, read consistency or replication settings.\n\n**Advances the thesis** (C3): Sets out the documented half of the thesis for Stripe, each item with its year, and ends where the record stops.\n\n**Transition in:** `example`: The costs of sharding in general. → The first of two published accounts of living with them.\n\n**Order of paragraphs** (`grouping`): Three groups: the platform and the one operation that shows what it relaxes (p15 to p17), two further published mechanisms that share its copy-compare-switch habit, the 2017 migration pattern and the ledger that checks afterwards (p18, p19), and the limits of the record (p20). The migration pattern stays here and not with Larkfield's migration because it is Stripe's dated evidence and defines the term the later section uses. The list of what is not public comes last because it is only credible after the reader has seen how much is public.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | description | Stripe's 2024 account describes DocDB, an in-house platform around MongoDB Community chosen in 2011 for developer productivity, with applications reaching more than 2,000 shards through proxies that look up where each chunk of data lives. A chunk is glossed at first use (a slice of a collection's data placed and moved as one unit). | quotation: \"Stripe's DocDB is an extension of MongoDB Community—a popular open-source database—and consists of a set of services that we built in-house. It serves over five million queries per second from Stripe's product applications.\"; \"10,000+ distinct query shapes over petabytes of important financial data that lives in 5,000+ collections distributed over 2,000+ database shards\"; \"we chose MongoDB as our online database because it offered better developer productivity than standard relational databases\"; proxies \"developed in-house in Go\" rely on \"a chunk metadata service that maps chunks to database shards\"; shards are \"replica sets that comprise a primary node and several secondary nodes with replication and automated failover\".; quotation: Stripe, 2026: \"A MongoDB shard—one of 2,000 that collectively processed $1.9 trillion in payments in 2025\". |  |\n| p16 | process | The same account describes a Data Movement Platform that moves a chunk between shards in six steps, and the only step the application can notice is the switch, during which reads and writes on that chunk are rejected for under two seconds and succeed when retried. | quotation: Steps as published: registration, bulk import, asynchronous replication, a correctness check \"by comparing point-in-time snapshots\", traffic switch, deregistration. The switch uses \"versioned gating\": \"We added a custom patch to MongoDB that allows a shard to enforce that the version token number it receives on requests from the proxy servers is newer than the version token number it knows of\"; \"all reads and writes on the chunk on the source shard are rejected at this point\"; \"The entire traffic switch protocol takes less than two seconds to execute, and all failed reads and writes directed to the source shard succeed on retries.\"; figure: Figure 38-shard-move: a chunk copied from a source shard to a target shard, kept in sync, checked, then a short pause while the route is switched. | `elaboration`: A map from chunks to shards. → What the map makes possible: moving a chunk while it is in use. |\n| p17 | analysis | What the move relaxes is availability, for one chunk and for a time Stripe set to match what its applications already tolerate, and what it does not relax is the data: the copy is compared before the switch and a version check stops the source shard from serving the chunk once the route has moved. | quotation: The stated bound for the switch: \"shorter than the duration of a planned database primary failover—typically lasting a few seconds, and in line with the retry budget of our product applications\".; reasoning: The post does not say how product applications make a retried write safe. That those writes are idempotent is the author's inference, stated in an INFERENCE block. | `cause_effect`: A rejected request that succeeds on retry. → What was given up, what was kept, and the part of the explanation that is inference. |\n| p18 | process | Stripe has published a second kind of move, which Larkfield's own migration at the end of the chapter follows: moving data between shards is one kind of online migration, and Stripe's 2017 post describes the other kind, changing the shape of the data, as four steps of dual writing with reads compared in production before any switch. | quotation: The \"4 step dual writing pattern\": \"Dual writing to the existing and new tables to keep them in sync\", \"Changing all read paths in our codebase to read from the new table\", \"Changing all write paths in our codebase to only write to the new table\", \"Removing old data that relies on the outdated data model\"; the example moved \"hundreds of millions of Subscriptions objects\"; reads were verified with \"GitHub's Scientist\"; \"We perform all infrastructure upgrades online, rather than relying on planned maintenance windows.\" Evidence age nine years; whether the same tooling is used today is not public; the 2024 post covers a different problem and does not replace it. | `similarity`: Data moved between shards with a comparison before the switch. → Data reshaped in place by the same discipline, in an older account. |\n| p19 | evidence | Stripe's 2024 Ledger post describes verification after the fact as a system of its own: an immutable log that every producing system writes to, in which a missing or wrong event shows up as a clearing account that does not return to zero. | quotation: \"We built Ledger, an immutable and auditable log\"; \"Each day, Ledger sees five billion events and 99.99% of our dollar volume is fully ingested and verified within four days\"; a problem is found with a query such as \"Find the clearing Accounts with nonzero balance.\" The post names no storage engine for Ledger. | `additional_support`: Comparisons made before a switch. → A comparison that runs all the time, over all money movement. |\n| p20 | evidence | The record stops short of the things a consistency argument would most like to know: which data lives outside DocDB, where transaction boundaries sit across collections, what consistency a read has, and how many replicas acknowledge a write. The fee-credits post is introduced as the nearest Stripe comes to describing money moving between its own accounts. | fact: Not found in any Stripe first-party source read for this book (research of 17 November 2026): whether the ledger, the card vault or idempotency keys are stored in DocDB; transaction boundaries across collections; the consistency level of reads; replica counts per shard and the replication mode. The 2024 post does not use the word 'transaction'. | `contrast`: What Stripe has published. → What it has not. |\n\n### What Adyen Has Published: PostgreSQL, Accounting Clusters and Partitions\n\n**Controlling idea** (`evidence`, id `adyen-published`): Adyen has published PostgreSQL clusters (2018 to 2025), an accounting database sharded by rotation with no rebalancing, messages between clusters and write-time templates (2021), and it has not published the cross-cluster protocol, the number of clusters or which data it replicates synchronously.\n\n**Advances the thesis** (C4): Sets out the documented half of the thesis for Adyen, each item with its year, and ends where the record stops.\n\n**Transition in:** `contrast`: A document database with data that is moved between shards. → A relational database whose owner decided not to move data.\n\n**Order of paragraphs** (`chronological`): The posts are read in the order they were written (2018, 2021, 2023 to 2025) because each describes the system at one moment and the later ones revise sizes; within the 2021 account the decision comes before its cost and the cost before what contains it. The limits of the record close the section, as in the Stripe section, so the two can be compared item by item. The idempotency store named in 2021 (p46) follows the edge's queue (p24) because both are stores at the same edge; the limits of the record (p26) no longer carry it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | description | Adyen's 2018 post gives the starting point: PostgreSQL chosen because it is transactional, run as clusters of one primary and at least three replicas spread over several data centers. | quotation: \"Our PostgreSQL database clusters consist of one primary and at least three replica servers, spread over multiple data centers.\"; \"having a transactional database was key as it ensures we don't lose track of records\"; \"We currently process 5,000+ PostgreSQL transactions per second across multiple clusters\"; \"our biggest cluster has already grown to 74 terabytes.\" Evidence age eight years: the sizes are superseded (\"transactional databases of hundreds of terabytes\", 2021; \"Some of our tables are already over 20TB in size\", 2023) and the cluster shape is not restated in newer posts. |  |\n| p22 | evidence | The 2021 account says the accounting database, which takes about 50 inserted rows per payment, stopped scaling and was split into several clusters filled by rotation, a key chosen so that a cluster can be added or taken out of routing at any time and nothing ever has to be rebalanced. | quotation: \"Over the lifetime of a payment transaction, about 50 rows have to be inserted into the accounting database.\"; \"Now we have several accounting databases, or clusters, processing side-by-side.\"; \"eventually decided to go for a simple round-robin strategy with some parameters we can adjust\"; \"At the moment we can just add a new cluster whenever we need more capacity or remove one from the routing when we see strange behavior we want to investigate.\"; rebalancing \"has not been implemented yet for this setup\". Evidence age five years; no newer Adyen account of the accounting system was found. | `time`: One relational store in 2018. → The same store's accounting data, split three years later. |\n| p23 | cause_effect | The cost of that key falls on any operation that needs one account's money in one place: a merchant's money ends up on several clusters, a payout must come from one account, and moving the money between clusters is no longer one transaction. By the author's reading, each such message must be safe to apply twice and checked afterwards, the two needs the chapter returns to. | quotation: \"The migration to a sharded accounting database was quite painful.\"; \"consider a payout to a merchant. This needs to come from one account. However, because you processed these transactions on different clusters, the money needs to be transferred from one cluster to the other in order to end up in the same account. To do this without compromising on the strict correctness requirement was quite difficult. In the end, we created several jobs and processes that use back and forth messages between the clusters to keep everything aligned.\" The protocol is not described. | `cause_effect`: Entries placed by rotation. → What rotation does to an operation that needs one account's money in one place. |\n| p24 | evidence | Two published mechanisms keep the books right despite the split: entries can be written only through templates that are verified to sum to zero, and the edge hands payments to accounting through a queue held in a local database, so accounting can run behind without losing anything. | quotation: \"The only way to add new records to the accounting system is by means of templates\"; \"we can guarantee that if at any time, we sum up all the records in the accounting system, the result will always be 0\"; the payment layer \"saves the payment in a local database and a separate process picks it up when possible. This process will run behind if we have doubt about whether we can guarantee consistency in the accounting or if an accounting database is not available but that will not impact the availability of the PAL itself.\" | `problem_solution`: A transfer that is no longer one transaction. → What Adyen says keeps the books correct anyway. |\n| p46 | evidence | The same edge holds a second store, for recognizing a repeated request: one 2021 sentence names Cockroach, a distributed database, for API idempotency keys at the PAL, with no later Adyen confirmation and one vendor customer story of 2023 (archived) that names CockroachDB, dates the move from PostgreSQL to 2019 and says the store holds the client's key and the response. | quotation: 2021, on API idempotency at the stateless edge: \"The information needs to be available locally, so we eventually decided on integrating Cockroach, a distributed database, with our PALs.\" Cockroach Labs customer story, 2023-02-14, archived copy (secondary source). | `additional_support`: The edge's database-backed queue to accounting. → The edge's second store, for idempotency keys. |\n| p25 | evidence | The partitioning posts of 2023 to 2025 show the other way Adyen divides data, inside one database, and record that this too can threaten the store: adding one partition to a critical database brought it close to failure before a December peak. What it shows: a division inside one database keeps the transaction whole but still carries an operational cost. | quotation: \"As a rule of thumb, we partition tables that might exceed the size of 100GB.\" (2023); \"In most cases, it is not possible to lock the table for more than a few seconds.\" (2024); \"I still have nightmares about incident number 2016. We were preparing for one of the most critical seasons for our merchants – December shopping– when the CPU unexpectedly spiked.\" and \"We partitioned individual tables, not the environment.\" (2025; '2016' is an incident number, not a year). | `additional_support`: Data divided across clusters. → Data divided inside one cluster, in the newer posts. |\n| p26 | evidence | For Adyen the record stops at the protocol: the number of accounting clusters, how a cross-cluster transfer is made atomic, whether rebalancing now exists, which data is replicated synchronously and how failover works are not public (one 2024 podcast remark says both asynchronous and synchronous replicas are in use). | fact: Not found in any Adyen first-party source read for this book: the number of accounting clusters, the cross-cluster protocol, which data is replicated synchronously, failover procedure and time. Postgres FM, episode 100 (2024-06-07): 'We have both.' | `contrast`: What Adyen has published. → What it has not. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The documented difference is that Stripe built the ability to move data between shards and verifies money after the fact, while Adyen chose not to need to move data and checks entries as they are written; replication, read consistency and cross-shard transfers are not public for either, and the published scale figures cannot be compared.\n\n**Advances the thesis** (C3, C4): Condenses the two accounts into the comparison the thesis states, cell by cell, with 'Not public' where the record is silent.\n\n**Transition in:** `conclusion_summary`: Two accounts, each ending in a list of what is not public. → The two set side by side.\n\n**Order of paragraphs** (`comparison`): The table first, because the advice is read off its rows; it stands directly after the two accounts so every cell has just been cited.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | comparison | Seven aspects of the public record can be compared, and the last column of the table is the author's reading of each difference. | table: 'Where They Differ' table, seven rows: primary online store; how data is placed and scaled; what gives way during a move or an outage of the store; where money correctness is checked; moving money across shards; replication and read consistency; published scale (not comparable: different years and units). |  |\n| p28 | recommendation | For an integrator the difference changes little at the API and a good deal in what can be copied: on both providers a brief refusal is retried under the same idempotency key and the books are confirmed from the provider's later record, and a team choosing its own design should copy the constraint each company accepted, not its database. | reasoning: Stripe's design needs a platform team to build proxies, a chunk map and a migration system; Adyen's needs every cross-cluster operation rewritten as messages. A team with one PostgreSQL database needs neither, which is the Borrowed Blueprint failure pattern in reverse. | `cause_effect`: The documented differences. → What an integrator and a builder do with them. |\n\n### What Both Records Imply: No Transaction Spans the Money Path\n\n**Controlling idea** (`analysis`, id `no-spanning-transaction`): Neither company describes a transaction that spans its shards or clusters, and the mechanisms each has published imply the same four-part design: small local transactions, retries that are safe to repeat, messages between stores and verification afterwards; this is an inference, and it is the one a small team can use.\n\n**Advances the thesis** (C5): States the inferential step of the thesis, labels it, and explains the two ideas it depends on.\n\n**Transition in:** `cause_effect`: Two different stores with the same silence about cross-shard transactions. → What the published mechanisms have in common.\n\n**Order of paragraphs** (`prerequisite_order`): The inference with its label and its grounds first, then the two ideas that make it work in order of dependence: repeats made harmless, then the check that finds what repeats cannot. Verification comes last because it only makes sense once the reader accepts that messages can be lost as well as repeated.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | claim | Read together, the two records contain no transaction that spans shards and four things in its place, and the conclusion that both companies rely on idempotent operations and later verification instead of a global transaction is the author's inference, which neither company states. Its opening says that neither column of the table, not even the row on moving money across shards, describes a transaction across shards. | reasoning: Grounds: Stripe's switch works because \"all failed reads and writes directed to the source shard succeed on retries\" (2024) and its Ledger verifies afterwards (2024); Adyen's clusters are aligned by \"back and forth messages\" and fed through a database queue (2021), with templates checked at write time. Neither post mentions a distributed transaction. Rendered as a prose paragraph followed by an `INFERENCE, NOT DOCUMENTED` block. |  |\n| p30 | explanation | The first idea the inference depends on is that an effect happens exactly once when a message that may arrive several times meets a receiver that records what it has already applied, in the same local transaction as the effect. | quotation: Uber's 2018 account of its payments platform lists among its design goals \"exactly-once payment processing by the means of idempotency and strong consistency\" (evidence age eight years; a payer of drivers, not a processor).; reasoning: The same mechanism as the idempotency key between a merchant and a provider (idempotency-and-retries), applied between two internal stores. | `elaboration`: 'Retries that are safe to repeat'. → How a repeated message is made harmless. |\n| p31 | explanation | The second idea is that idempotency only makes a repeat harmless and cannot notice a message that was never sent, so the design is complete only with a comparison that runs afterwards and has an owner. Adyen's partner-report matching is introduced as part of the same 2021 account. | reasoning: Stripe's published check is the clearing account that must return to zero (2024); Adyen split its partner report matching per cluster (2021: \"a two-step framework that would first parse a file and then split it into the relevant parts for each cluster\"); for a merchant the equivalent is reconciliation against the provider's reports (payment-reconciliation-and-reporting). | `additional_support`: Repeats made harmless. → The failure that idempotency cannot see, and what catches it. |\n\n### The Same Design at Small Scale: A Local Transaction, an Outbox and an Idempotent Consumer\n\n**Controlling idea** (`process`, id `outbox`): For a team with one database and one other system to inform, the four-part design reduces to an outbox: the state change and a row describing the message are committed together, a relay delivers the row at least once, the consumer ignores repeats, and a periodic comparison proves the two sides agree.\n\n**Advances the thesis** (C5): Gives the reader the small-scale form of the thesis and the design comparison that justifies it.\n\n**Transition in:** `example`: Four parts inferred from systems with thousands of shards. → The same four parts for one database and one consumer.\n\n**Order of paragraphs** (`prerequisite_order`): The mechanism, then its alternatives, then the duties it leaves behind. The comparison table needs the outbox defined; the consumer's duty and the check are last because they are what the outbox does not do by itself.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | definition | An outbox is a table in the same database as the business data: the state change and a row describing the message are written in one local transaction, and a separate relay reads the rows and publishes them, repeating until each is acknowledged. | source: The pattern as commonly described by practitioners: the service \"must atomically update the database and send messages\", and does so by inserting the message into an outbox table as part of the local transaction; a separate process publishes it.; figure: Figure 38-outbox-flow: inbox, one transaction containing a payment row and an outbox row, a relay, a queue, a consumer with a list of applied event ids, and a nightly comparison underneath. |  |\n| p33 | comparison | Four designs can connect a state change to a message (write then publish, a distributed transaction as Tom proposed, an outbox, and change data capture from the database log), and they differ in what happens when a process dies between the two steps. | table: Design comparison, four rows: write then publish (dual write); distributed transaction; outbox with a relay; change data capture from the database log. Columns: what a crash between steps leaves, what it requires, when it is the right choice. Stripe's 2024 post documents change data capture at its scale: \"We transport the oplog from every DocDB shard to Kafka\". | `contrast`: The outbox. → The three other ways to do the same job. |\n| p34 | explanation | The outbox moves the problem to the consumer, which must expect each message more than once and out of order, and to a comparison of the two systems, which is the only thing that finds a message that was never produced or never applied. | reasoning: At-least-once delivery from the relay means duplicates; several relay workers mean disorder; a bug that skips writing the outbox row is invisible to the relay. Deduplication by event id inside the consumer's own transaction answers the first, a state machine that ignores backward moves the second (payment-state-machines), a periodic comparison the third. | `cause_effect`: A relay that repeats until acknowledged. → What that leaves for the receiving side to do. |\n\n### In Practice at Larkfield: The Payment Record Store and Its Outbox\n\n**Controlling idea** (`example`, id `in-practice`): Under Keel, Larkfield's consistency boundary is the payment row and its outbox row; activation of the pass, ledger entries and the warehouse catch up, each with a named check, and the store's own schema is changed by an online migration in five steps.\n\n**Advances the thesis** (C1, C5): Works the thesis through with ledger numbers: one boundary, a list of what lags, a check per item.\n\n**Transition in:** `example`: The outbox in general. → The outbox in Larkfield's payment record store, for one payment.\n\n**Order of paragraphs** (`chronological`): Mila's payment is followed in the order things happen to it, then the table of what lags is read off that sequence, then the migration, which changes the store the first two paragraphs describe and so comes after them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | example | Femke's three questions led to an outbox in place of the distributed transaction, live since 1 March 2027; when Mila's €120.00 payment is approved at 19:42 on 9 March 2027, one local transaction marks the inbox message processed, moves the payment row to `paid` and inserts an outbox row, and the booking app activates her pass when the relay delivers that row, once, however many times it arrives. | scenario: Scenario ledger: Mila's class pass (€120.00, Studio Noord on Adyen, 19:42, `paid` on the AUTHORISATION webhook); the payment record store is PostgreSQL fed through an inbox table. New canonical facts added to the ledger: under Keel the store has an outbox table in the same database; a relay publishes rows to a queue the booking app consumes; the booking app records applied event ids. |  |\n| p36 | example | Everything outside that transaction is allowed to lag, by an amount Larkfield has written down, and each lagging item has a check that proves it caught up. | table: Table for Mila's payment: inside the boundary (inbox mark, payment row, outbox row: together or not at all); pass activation (seconds; alert when the oldest unpublished outbox row is older than 5 minutes, assumption); ledger entries (written from the settlement report by the reconciliation job, K3; open items reviewed after five business days); data warehouse (next day). Check for activation: a nightly comparison of `paid` payments against activated passes and paid period records. | `elaboration`: One transaction for the payment row and its outbox row. → The list of what sits outside it. |\n| p37 | process (list) | The store's own schema changes without a maintenance window: Keel's child rows for attempts, captures, refunds and disputes were introduced by an online migration in five steps, each reversible until the last. | scenario: Scenario ledger (addition by 08-payment-state-machines): under Keel the payment record store adds child rows for attempts, captures, refunds and disputes, each with an amount and its own status. The five steps (create and dual-write in one transaction; backfill in idempotent batches; compare reads and daily counts and sums; switch reads; stop writing the old columns and later drop them) follow Stripe's 2017 pattern with a reconciliation of counts and amounts added before each switch. | `additional_support`: The outbox, which changed how the store announces a payment. → The store while its own shape is being changed. |\n\n### When It Goes Wrong: A Stalled Relay, a Repeated Message and a Row That Was Never Written\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): The outbox design fails in three ways, a relay that stops, a message delivered twice or out of order, and a state change with no outbox row, and each is late or caught by a check rather than wrong.\n\n**Advances the thesis** (C5): Tests the design against its own failures and shows that each ends in lateness or detection, not in a wrong record.\n\n**Transition in:** `contrast`: A payment for which every step worked. → The steps failing one at a time.\n\n**Order of paragraphs** (`order_of_importance`): In ascending order of importance: from the failure that is most frequent and least harmful (the relay stops) to the one that is rarest and silent (no row was written), which is last because only the comparison finds it and it is the reason the comparison exists. Reversed, the section would end on the failure the reader least needs to remember.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | analysis | When the relay stops, payments stay `paid` and passes stay inactive until it resumes, which is late and visible: the age of the oldest unpublished row is the alarm, and nothing has to be repaired afterwards. | scenario: Larkfield's setting: alert when the oldest unpublished outbox row is older than 5 minutes (assumption). |  |\n| p39 | analysis | When a message arrives twice or after a newer one, the consumer's record of applied event ids and its state rules absorb it, provided the id is written in the same transaction as the effect. | reasoning: If the booking app activated the pass and recorded the event id in two steps, a crash between them would reproduce the original fault one system further along; ten classes would become twenty on a redelivery. | `additional_support`: A message that is late. → A message that is repeated or out of order. |\n| p40 | analysis | The silent failure is a code path that changes a payment's state without writing an outbox row, and only the nightly comparison finds it, which is why the comparison is kept even when the relay has never lost a message. | scenario: Illustration: a support tool that sets a payment to `paid` by hand with a direct update. The nightly comparison lists the payment as `paid` with no activated pass; the item has an owner and an age, like an open reconciliation item (addition by 15-payment-reconciliation-and-reporting). | `contrast`: Failures the mechanism absorbs. → The failure that bypasses the mechanism. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The two providers started from opposite stores and made opposite sharding choices, and the public record of both still reduces to the same shape Larkfield uses for one table: keep the atomic unit small, make whatever crosses it repeatable, and prove agreement afterwards. What each company relaxed is documented (two seconds of refusals at Stripe, books that run behind and data that is never rebalanced at Adyen); what a consistency proof would need (which data is replicated synchronously, read consistency, the cross-cluster protocol) is not, so the claim that neither uses a spanning transaction remains an inference from mechanisms.\n\n**So what:** A team stops choosing a database for its reputation with money and writes down three things for each money-moving write: the records inside the boundary, the lag allowed to everything outside it, and the check that proves agreement and who owns it.\n\n**Callback:** The two seconds in which Stripe's platform rejects reads and writes on a chunk being moved. The refusal is the design working: availability of one chunk gives way for a time the callers' retries already cover, so that no write lands on the wrong copy.\n\n**Takeaway** (`course_of_action`): For one money-moving write in your system, draw the boundary, list what catches up and by how much, and name the check that proves both sides agree; if a proposal needs a transaction across two systems, replace it with an outbox and an idempotent consumer.\n\n**Hand-off** to [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html): `contrast`: Shards and clusters: data divided for engineering reasons, by size and load, in designs both companies have described at length. → Data divided for reasons engineers do not choose, by country and by law, in a part of the record where both companies have published very little.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | synthesis (list) | Established: both companies have published sharded stores with their dates, a local transaction is atomic only inside one database, and neither has published which data is replicated synchronously, read consistency or a cross-shard transfer protocol. | source: Stripe 2024 and 2026 database posts, 2017 migrations post, 2024 Ledger post; Adyen 2018 PostgreSQL post, 2021 accounting post, 2023 to 2025 partitioning posts. |  |\n| p42 | synthesis (list) | Depends on context: whether to shard at all, which shard key, outbox or change data capture, and how much lag each consumer may have all turn on stated conditions. | reasoning: Each recommendation holds under a condition (data size against one database, whether operations are per-entity, whether a log-reading platform already exists, the cost of a minute of lag to the person waiting). | `contrast`: What is settled. → What depends on the system at hand. |\n| p43 | recommendation (list) | The author's synthesis: the database product matters less than the boundary, and a claim that a store is 'consistent' is incomplete until it names the check that would show it is not. | reasoning: Both anchors reached scale on stores an engineer would not have predicted for money; what their accounts share is the discipline around the store. | `emphasis`: Conditional advice. → The author's own position. |\n| p44 | recommendation (list) | Eight questions let the reader check a money-moving write, or a proposed data design, in a review. | reasoning: The questions restate the chapter's decisions as checks: boundary, lag, consumer idempotency, comparison and owner, shard key, cross-shard operations, migration steps and way back, and what a provider has and has not published. | `conclusion_summary`: The three tiers of take-away. → The same content as questions to ask. |\n| p45 | transition | The shards and clusters of this chapter divide data for reasons engineers choose, size and load, in designs both companies describe at length; the next chapter turns to data divided for reasons engineers do not choose, country and law, where both have published very little. |  | `contrast`: Data divided by size and load, with a long public record. → Data divided by country and law, with a short one. |\n\n## Non-goals\n\n- Ledger design: double entry, clearing accounts, immutability, and the internals of Stripe's Ledger and Adyen's accounting templates. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html).\n- Idempotency keys between merchant and provider: retention windows, key design, retry policy. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- The webhook receiver's contract and the inbox. See [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html).\n- Availability targets, failure isolation, graceful degradation and incident reports, including Stripe's outage of 10 July 2019 as an incident. See [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html).\n- Regions, hosting, data residency, and whether shards or clusters span regions. See [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html).\n- Deployment practice, progressive rollout, dark launches and zero-downtime schema changes as a release discipline. See [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html).\n- Reconciliation against provider reports. See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Consensus protocols, isolation levels and the theory of distributed transactions beyond what the argument needs.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether Adyen still uses CockroachDB for idempotency keys: one 2021 Adyen sentence (which writes 'Cockroach') and a Cockroach Labs customer story of 14 February 2023 read in an archived copy; no later Adyen publication. The chapter reports both with their dates.\n- Whether Adyen's accounting clusters can now be rebalanced, and how many there are: the 2021 post is the last account.\n- Whether Stripe's 2017 dual-write tooling is still in use; the 2024 post covers a different kind of migration.\n- Pat Helland's 'Life beyond Distributed Transactions' (ACM Queue, 2016) would be the natural research citation for the inference; the page could not be fetched in this session (blocked), so it is not cited.\n\n## Decision log\n\n- **2026-11-17** — The statement that neither company uses a transaction spanning its money path is a section of its own, placed after the comparison table and rendered with an INFERENCE, NOT DOCUMENTED block. Rejected: Stating it in each company's section, where it would read as a documented fact about that company.; Leaving it to the take-aways, which would put the thesis's main step in the conclusion.\n- **2026-11-17** — Adyen's database queue between the edge and accounting is described as having the same shape as an outbox, not as 'Adyen's outbox': the post does not use the word. Rejected: Calling it an outbox.\n- **2026-11-17** — Contrasts are limited to Square Books (2019), TigerBeetle's documentation and one sentence from Uber (2018), each with its age and kind of source. Checkout.com and PayPal are left out because no first-party architecture source was read; Airbnb's 2019 account is left to idempotency-and-retries. Rejected: A survey of ledger databases.; A contrast built on vendor case studies.\n- **2026-11-17** — Larkfield gains an outbox table, a relay, a queue consumed by the booking app, and a count of 146 paid-and-not-activated purchases in 2026 (illustrative); these are appended to the scenario ledger. Rejected: Reusing the Silent Webhook as the scene: it is a missing inbound event, owned by payment-webhooks-and-events, not a missing outbound effect.\n- **2026-11-17** — The chapter is planned at normal length (about 4,800 words): the contract says 'short where the record is thin, especially for Adyen', and the record for this chapter is the richest in Part VIII; the Adyen section is kept to what five dated posts say and ends in a list of what is not public. Rejected: A 2,500-word chapter, which would drop either the online-migration plan or the design comparison that the 'can do' outcomes require.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, chapter contract 38 — Scope, owned terms (shard, online migration, consistency boundary, outbox), the Larkfield thread (the payment record store and its outbox).\n  - journal-spec.json, part-8, payment-data-stores-and-consistency — Intent, acceptance criteria, thesis and role, copied unchanged; the neighbours' transitions.\n  - _research/brief-reliability-and-scale.md, Parts 0, 1.2, 2 and 6, and 'Open questions' — Verified quotations for Stripe's database, migration and RCA posts and Adyen's PostgreSQL, accounting and partitioning posts; the contrasts; the lists of what is not public.\n  - _research/brief-ledgers-and-money-movement.md, Part 1 — Verified quotations for Stripe's Ledger post and Adyen's accounting templates; the detection and prevention reading, kept as the author's judgement.\n  - _research/scenario-ledger.md and _research/consistency-issues.md (rulings 4 and 12) — The payment record store, the inbox, K2 and K3, Mila's class pass, the child rows added under Keel, reconciliation open items; no payment GET on Adyen.\n- **External**\n  - Stripe, 'How Stripe's document databases supported 99.999% uptime with zero-downtime data migrations', 2024-06-06; 'How Stripe uses graph search and state machines to auto-remediate a global database fleet', 2026-07-16; 'Online migrations at scale', 2017-02-02; 'Ledger', 2024-02-16; root cause analysis of 2019-07-10 — Every Stripe fact in the chapter; all re-fetched on 17 November 2026.\n  - Adyen, 'Design to Duty' parts 1 and 2, 2021-07-28 and 2021-08-23; 'Updating a 50 terabyte PostgreSQL database', 2018-03-14; partitioning series, 2023-10-06 to 2025-09-16 (displayed dates, ruling 25) — Every Adyen fact in the chapter; all re-fetched on 17 November 2026.\n  - Square, 'Books, an immutable double-entry accounting database service', 2019-10-16; TigerBeetle documentation, OLTP page, accessed 2026-11; Uber, 'Engineering Uber's next-gen payments platform', 2018-12-05; microservices.io, 'Transactional outbox', accessed 2026-11 — Contrasts and the practitioner description of the outbox; re-fetched on 17 November 2026.\n  - Jimmy Morzaria (Stripe), 'Stripe's DocDB: How Zero-Downtime Data Movement Powers Trillion-Dollar Payment Processing', QCon San Francisco, November 2025, transcript published by InfoQ 2026-04-30; Postgres FM episode 100, 'To 100TB, and beyond!', 2024-06-07 (Derk van Veen of Adyen); Cockroach Labs, 'The Price of Payments: How Adyen Guarantees Idempotency & Eliminates Downtime', 2023-02-14, archived copy — Added in the verification pass of 17 November 2026: where Stripe's retries happen, Adyen's replication remark and sharding redesign remark, and the one later (secondary) account of the idempotency store.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — First version, written from the chapter contract, the reliability and ledger research briefs and the scenario ledger; intent, thesis and role copied from the journal spec.\n- **2026-11-17** — After the flow rubric (sound with notes): Tom's proposal moved to February 2027 so it precedes Mila's payment of 9 March; the inbox named in the scene; a spec-internal label removed from p23; change data capture and Tom's proposal named in p33; flow labels of three sections corrected. Not acted on, for the author: moving the 2017 migration pattern (p18) next to Larkfield's migration, shrinking the partitioning paragraph (p25), merging p34 into p32, and moving the advice in p28 after the inference (the style guide puts it after the table).\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass: 76 claims checked (62 confirmed, 7 corrected, 6 hedged, 0 unsupported, 0 unreachable, 1 not checked); the statements that Stripe does not describe its retries and that Adyen's replication mode and idempotency store have no later source were corrected against a 2025 Stripe talk, a 2024 podcast remark by an Adyen engineer and an archived 2023 vendor story; 'Partitioning an environment' dated 2025-09-16 (ruling 25); 'Cockroach
