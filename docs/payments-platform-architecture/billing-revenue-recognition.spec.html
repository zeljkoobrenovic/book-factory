<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Why cash, billings and revenue are three different numbers, and what a performance obligation, a revenue schedule and deferred revenue are, at an architect's level.\n- **Know:** The five steps of IFRS 15 and ASC 606 (issued together in May 2014) in one line each.\n- **Know:** How Stripe Revenue Recognition is documented: built on a double-entry ledger, each invoice line treated as one performance obligation and amortized evenly over its period, with rules and imports for the rest. No Adyen revenue-recognition product was found; Orb documents one of its own.\n- **Believe:** A payments report is not a revenue report.\n- **Believe:** Recognition inside a billing provider fits a business whose contracts equal its invoices; past that point the schedule belongs in a finance system.\n- **Be able to:** Say how much of an up-front payment is revenue on a given date and what the rest is.\n- **Be able to:** Specify the export a billing engine owes finance: per invoice line, the amount net of tax, the service period and every later adjustment with its own date.\n- **Be able to:** Recognize a contract that the provider's default method will get wrong.\n\n**Audience:** A software engineer or architect who builds or integrates billing on a payment provider and has never had to explain to a finance team why the payments report is not the revenue report.\n\n**Already knows:**\n\n- Subscriptions, billing periods, proration and the invoice as the billing engine's output (subscriptions-and-billing-engines).\n- Usage events and meters (usage-metering-and-rating).\n- Finalized invoices, credit notes, refunds, disputes and dunning (invoicing-collections-and-dunning, refunds-reversals-and-disputes).\n- The tax line on an invoice (billing-and-payment-tax).\n- Double-entry ledgers and clearing accounts (payment-ledgers).\n- Larkfield, its two providers and its 2026 incidents (meet-larkfield).\n\n**Does not yet know:**\n\n- Billings versus revenue, performance obligation, deferred revenue, revenue schedule, contra revenue, accounting period close, subledger and general ledger.\n- IFRS 15 and ASC 606.\n- What Stripe Revenue Recognition assumes, and that no Adyen counterpart is documented.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an up-front payment in a case the chapter does not contain, the reader splits it into recognized and deferred revenue and names the data needed to do so. *Probe:* A customer pays €1,200 on 1 January for one year of a software service. On 31 March: how much of it is revenue, what is the rest called, and what must the billing system have recorded for finance to work this out? | `custom` | cold_reader | major |\n| AC-2 | The reader identifies a contract for which invoice-line-equals-obligation recognition gives the wrong schedule. *Probe:* A sales team sells, on one invoice line, a year of software access together with a one-day onboarding workshop held in the first week. Why might a billing provider's default revenue schedule be wrong for this sale, and what are the options? | `custom` | cold_reader | major |\n| AC-3 | The chapter links to RECONCILED for posting to the general ledger and does not re-teach it; it stops at the data the billing side must hand over. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How does a billing system turn invoices and payments into recognized revenue, and where should it stop?\n\n> **Claim:** A billing system turns invoices into revenue by giving each invoice line a service period, deferring its amount and releasing it as the service is delivered, with every refund, dispute and credit note as a dated adjustment; it should stop where contracts stop matching invoices. Stripe Revenue Recognition is documented on exactly that assumption (each invoice line is one performance obligation, amortized evenly over its period), so it serves a business whose contracts equal its invoices, and beyond that the schedule belongs in a finance system that the billing engine feeds. Adyen documents no revenue-recognition product; its reports describe payments, settlement and fees.\n\n**Disputed by:** The view that revenue is what was charged in the month, so the payment provider's report is the revenue report; and the opposite view that recognition is the ERP's business alone and the billing engine owes finance nothing but totals.\n\n**So what:** An architect can specify what the billing side must export whatever tool does the recognition: per invoice line, the amount net of tax, the service period, and each later adjustment with its own date; and, for usage, the date of the usage as well as the date of the invoice, because they fall in different accounting periods at every month end.\n\n**How and why:** IFRS 15 and ASC 606 recognize revenue when a promise to the customer is fulfilled, which for a service is over time; the cash for an annual plan arrives on one day and is a liability until earned. That is the part's third time failure, the wrong period, and it is produced by reading a payments report as revenue. Stripe documents its product as a double-entry ledger over the activity inside Stripe, with one rule per transaction and CSV imports for what Stripe did not process, and reports that update hours later; Stripe's own product page calls it 'a centralised revenue subledger', and its output still has to reach the general ledger. Orb documents recognition from invoices and raw usage for its own product, which describes Orb and not Adyen's platform; no Adyen revenue-recognition product was found in its documentation, help center or site, where revenue recognition is mentioned only on an Orb partner page and in an article of 22 October 2026.\n\n**Supporting claims**\n\n- **S1** — Cash, billings and revenue are three numbers with three dates; IFRS 15 and ASC 606 recognize revenue when a performance obligation is satisfied, which for a service is over time, so money paid up front is deferred revenue, a liability, until earned.\n- **S2** — A revenue schedule is computed from the invoice line (amount net of tax, service period) and changed only by dated adjustments (refund, dispute, credit note) and, for usage, by the date of use; payment status does not drive it and closed periods are corrected, not rewritten.\n- **S3** — Stripe documents Revenue Recognition as a double-entry ledger over activity inside Stripe in which each invoice line is one performance obligation amortized evenly over its period, with rules, imports and a preview API for the rest and reports that update hours later; that it is a subledger whose output must still reach the general ledger is the author's inference.\n- **S4** — No Adyen revenue-recognition product or documentation was found: Adyen's reports describe payments, settlement and fees, and Orb's documented recognition describes Orb's own product, not Adyen's platform.\n- **S5** — Recognition inside the billing system fits a business whose contracts equal its invoices; beyond that the schedule belongs in a finance system, and in both cases the billing side owes the same line-level export.\n\n## Role in the part\n\nSupplies the part's third failure of time, the wrong period, and draws the line between what a billing engine must hand to finance and what finance must do itself. Supports P6-4 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the two February numbers are posed in the first section and resolved, with Larkfield's decision, in the eighth; `comparison` in stripe-documented, adyen-documented, where-they-differ; and where-to-stop)\n\nThe reader meets two numbers that disagree, then gets the three terms that explain the disagreement, then the mechanism that computes the right one, because 'each invoice line is one performance obligation amortized over its period' means nothing before obligation, deferral and schedule exist. The two companies follow the mechanism so that each can be read as an implementation or an absence of it. The designs come after the companies because the second design is the one Stripe documents and its limit is the assumption just quoted; the export specification closes the designs because it is what remains constant across them. The comparison table keeps the book's fixed position after designs and trade-offs. Larkfield's worked schedule and the failures come last because they use every earlier term. Put the companies first and the chapter is a product description; put the designs first and 'contracts equal invoices' has no mechanism behind it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On 1 February 2027 a customer pays €1,890 for a year of software. At the end of the month one dashboard says February revenue from that customer was €1,890 and the finance controller's books say €144.99. Both were computed from the same invoice, and neither has a bug.\n\n**Bridge:** An engineer who integrates a payment provider sees a successful charge and a total per month, and it is natural to call that total revenue. → Accounting counts revenue when the service is delivered, not when it is charged, so the billing system owes finance more than a total: the period each amount is for and every later change to it.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): A billing system turns invoices into revenue by giving each invoice line a service period, deferring its amount and releasing it as the service is delivered, with every refund, dispute and credit note as a dated adjustment; it should stop where contracts stop matching invoices. Stripe Revenue Recognition is documented on that assumption; Adyen documents no revenue-recognition product.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from two Larkfield reports that disagree about February's subscription revenue. *Kept in:* scene.\n- Define billings, cash, revenue, performance obligation, deferred revenue and the revenue schedule. *Kept in:* three-numbers.\n- Show how an invoice line becomes a schedule and what refunds, disputes, credit notes, usage and the period close do to it. *Kept in:* mechanism.\n- Set out what Stripe documents and what was and was not found for Adyen and Orb. *Kept in:* stripe-documented, adyen-documented, where-they-differ.\n- Compare three places to keep the schedule and specify the export the billing side owes finance. *Kept in:* where-to-stop.\n- Work the annual plan month by month and list the quiet ways recognition fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | One payment of €1,890 on 1 February 2027 for a year of software gives three different and equally correct answers to 'what did we make in February?': €1,890 invoiced, €1,890 collected and about €145 earned. | scenario: Ironworks Climbing pays €1,890 up front on 1 February 2027 for an annual €189 plan at one location; one-twelfth of a 365-day period that starts on 1 February is 28 days, €144.99. |  |\n| p02 | claim | A billing system turns an invoice line into revenue by giving it a service period, deferring its amount and releasing it as the service is delivered, with every refund, dispute and credit note as a dated adjustment, and it should stop where contracts stop matching invoices. |  | `problem_solution`: Three numbers for one payment. → The rule that separates them and the chapter's thesis, including what Stripe documents and what Adyen does not. |\n| p03 | context | Revenue recognition is off the path of Mila's class pass but reads the same records: Larkfield's €2.53 fee on her €120.00 pass is earned on 9 March 2027, while the pass itself is ten classes the studio still owes her, which is why her later refund is €84.00 for seven unused classes. | scenario: Mila's ten-class pass, €120.00, 9 March 2027; Larkfield's fee €2.53; refund of €84.00 for seven unused classes on 18 March 2027. | `place`: The chapter's claim. → Where it sits relative to the recurring payment. |\n| p04 | transition | The chapter goes from Larkfield's three numbers, through the vocabulary and the mechanism of a revenue schedule, to what Stripe and Adyen each document, the three places a schedule can live, the comparison, the annual plan worked month by month, and the ways the number goes wrong. |  | `sequence`: The chapter's position. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Three Numbers for February\n\n**Controlling idea** (`example`, id `scene`): At the February 2027 close two Larkfield reports disagree about subscription revenue by a factor of thirteen on one customer, and neither has a bug: they answer different questions.\n\n**Advances the thesis** (S1): Poses the chapter's question with ledger numbers before any accounting term is defined.\n\n**Transition in:** `example`: The roadmap. → The situation at Larkfield that poses the question.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | The growth team's dashboard counts Ironworks Climbing's €1,890 as February subscription revenue, and Priya Raman's books count €144.99. | scenario: Ironworks Climbing, annual plan, €1,890 paid 1 February 2027; the billing integration was owned by the growth team until 2027; Priya Raman is Finance Controller and owns the close. |  |\n| p06 | claim | The question Femke de Graaf inherits with the billing integration is what the billing side must hand finance so that the second number can be computed and defended, and whether the provider should compute it. | scenario: The Version Cliff, March 2026: an API upgrade removed a field the finance export read, and subscription revenue reports were wrong for 6 days. | `cause_effect`: Two numbers for one invoice. → The design question behind them: the hand-off from billing to finance. |\n\n### Cash, Billings and Revenue: Three Numbers, Three Dates\n\n**Controlling idea** (`definition`, id `three-numbers`): Billings, cash and revenue measure three different events (an invoice issued, money received, a promise kept), and the accounting standards tie revenue to the third.\n\n**Advances the thesis** (S1): Supplies the vocabulary (billings, performance obligation, deferred revenue, revenue schedule) and the rule that the rest of the chapter mechanizes.\n\n**Transition in:** `elaboration`: Two numbers that are both right. → The definitions that explain why.\n\n**Order of paragraphs** (`prerequisite_order`): The three numbers first because the reader has just seen them; then the standard that picks one of them; then the two terms the standard introduces, each needed by the next: a schedule cannot be defined before the obligation it releases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | Billings are what was invoiced in a period, cash is what was collected and revenue is what was earned by delivering, and for anything paid in advance or in arrears the three fall in different months. | table: Three numbers for two Larkfield cases: the Ironworks annual plan in February 2027 (billings €1,890, cash €1,890, revenue €144.99) and an illustrative €70.00 of SMS overage (1,000 messages at €0.07) used in March and invoiced in April (March: billings 0, cash 0, revenue €70.00). |  |\n| p08 | explanation | IFRS 15 and ASC 606, issued together in May 2014, recognize revenue when a promise to the customer is fulfilled, in five steps (find the contract, find its promises, set the price, allocate the price across the promises by what each would sell for alone, recognize as each is fulfilled), none of which starts from the payment. | quotation: Joint IASB and FASB news release of 28 May 2014: 'today issued jointly a converged standard on the recognition of revenue from contracts with customers', introduced into the FASB codification 'as Topic 606' (evidence age 12 years). IFRS Foundation page: 'In May 2014 the Board issued IFRS 15 Revenue from Contracts with Customers, together with the introduction of Topic 606 into the Financial Accounting Standards Board's Accounting Standards Codification'; effective for annual periods beginning on or after 1 January 2018; the five steps: identify the contract(s) with a customer; identify the performance obligations; determine the transaction price; allocate the transaction price to each performance obligation; recognise revenue when a performance obligation is satisfied.; table: The five steps, one line each, with what a billing system holds for each step (contract: often outside billing; obligations: products and invoice lines; price: the invoice amount net of tax; allocation: line amounts; satisfaction: the service period). | `elaboration`: Revenue as 'what was earned'. → The standard that defines earned. |\n| p09 | definition | A performance obligation is one distinct promise in a contract, which may hold several, and each is satisfied either at a point in time or over time, which decides whether its revenue lands on one date or is spread. | quotation: 'Performance obligations are promises in a contract to transfer to a customer goods or services that are distinct'; 'A performance obligation may be satisfied at a point in time (typically for promises to transfer goods to a customer) or over time (typically for promises to transfer services to a customer).'; example: A year of software access is satisfied over time; a one-day onboarding workshop and Larkfield's fee on one payment are satisfied at a point in time. | `elaboration`: Step two of the five. → The term the chapter owns and its two timing cases. |\n| p10 | definition | Deferred revenue is the part of an invoiced amount not yet earned, a liability and not income, and the revenue schedule is the dated plan by which it becomes revenue. | example: Ironworks at 31 March 2027: 59 of 365 days delivered, €305.51 recognized and €1,584.49 deferred; counted as two of twelve equal months, €315.00 and €1,575.00.; figure: Illustration 31-cash-is-not-revenue: one payment on day one against twelve monthly slices of revenue. | `cause_effect`: A promise satisfied over time. → What the unearned part is called and how it is released. |\n\n### How an Invoice Line Becomes a Schedule\n\n**Controlling idea** (`process`, id `mechanism`): A schedule is computed from the invoice line (amount net of tax, service period) and changed only by dated adjustments; payment status does not drive it, and a closed period is corrected, not rewritten.\n\n**Advances the thesis** (S2): Turns the definitions into a mechanism with inputs, entries and failure behavior, which is what the two providers are then compared on.\n\n**Transition in:** `sequence`: The schedule as a definition. → The schedule as a computation with inputs and entries.\n\n**Order of paragraphs** (`prerequisite_order`): The undisturbed case first (entries, then inputs), then the three things that disturb it in the order a billing period meets them: money going back, usage arriving after the period, and the period being closed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | process | When an invoice is finalized each line's net amount is booked as deferred revenue, and a slice moves to revenue as each day of the service period passes, whether or not the invoice has been paid. | quotation: Stripe: 'an entry which finalizes an invoice would debit AccountsReceivable and credit DeferredRevenue. Paying an invoice would debit Cash and credit AccountsReceivable.' Orb: 'the payment status of an individual invoice is not factored into accounting treatment'. |  |\n| p12 | explanation | The schedule needs four inputs per invoice line (the amount net of tax, the start and end of the service period, the product that identifies the promise, and the currency), and a missing input fails silently into a default. | table: Requirements table: input, where it comes from, what happens when it is missing (no service period: recognized in full at finalization, per Stripe's documented default; tax inside the amount: revenue overstated; no product: no way to treat a workshop differently from access). | `elaboration`: The entries. → The data they are computed from. |\n| p13 | explanation | A refund, a dispute or a credit note is a dated adjustment that splits in two: the part already recognized becomes contra revenue, an account that reduces revenue without deleting the original entry, and the part still deferred is removed from the liability. | quotation: 'if you issue a 120 USD refund on an annual subscription during the second month, 20 USD for the first 2 months is contra revenue. The remaining 100 USD is adjusted and reflected in your deferred revenue balance'.; example: Had Ironworks disputed the whole €1,890 on 1 August 2027 (hypothetical): 181 days delivered, €937.23 becomes contra revenue and €952.77 leaves deferred revenue.; figure: Illustration 31-line-to-schedule: an invoice line fills a deferred-revenue tank that drains month by month into revenue, with a refund drawing from both. | `contrast`: A schedule that runs undisturbed. → What happens when money goes back. |\n| p14 | explanation | Usage is earned on the day it happens and invoiced later, so at every month end some revenue belongs to a month whose invoice does not exist yet, and the schedule needs the usage date as well as the invoice date. | quotation: Orb: calculating recognized revenue for usage 'requires understanding exactly when usage occurs. This can be particularly difficult when invoicing and accounting periods do not align'; 'Revenue is recognized for usage as it occurs on a daily basis, regardless of the associated line item's service period.' | `contrast`: Amounts invoiced before delivery. → Amounts invoiced after it. |\n| p15 | explanation | Once finance closes a month, a late change to that month is booked as a correction in the current period, so the schedule must know which periods are closed. | fact: Stripe documents accounting periods that close automatically or manually and can be reopened to 'make adjustments to past data without creating corrections in the current period'; Orb documents accounting period locks: 'Closing an accounting period ensures that there will be no subsequent changes to that period'. | `additional_support`: Adjustments and late usage. → The rule for where a late change may land. |\n\n### What Stripe Documents: A Ledger Over What Stripe Sees\n\n**Controlling idea** (`evidence`, id `stripe-documented`): Stripe documents Revenue Recognition as a double-entry ledger over activity inside Stripe that treats each invoice line as one performance obligation amortized evenly over its period, with rules, imports and previews for everything else.\n\n**Advances the thesis** (S3): Sets out the documented behavior of the one first-party product either anchor company has, and separates it from the author's reading of it.\n\n**Transition in:** `example`: The mechanism in general. → One provider's documented implementation of it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The core assumption, then its defaults, then the overrides, then the outputs with the author's reading, and last the limit of the evidence, so that the inference comes after every fact it rests on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | evidence | Stripe says the product is built on a double-entry ledger over 'all transactions that happen within Stripe', and that each invoice line is its own performance obligation, deferred at finalization and amortized evenly, by the day unless configured otherwise. | quotation: 'Stripe built Revenue Recognition on top of a double-entry accounting ledger that tracks debits and credits resulting from your business activity'; 'Revenue Recognition treats each invoice line item as its own performance obligation. When the invoice finalizes, Revenue Recognition defers the total recognizable amount and subsequently amortizes it evenly over the period of each invoice line item.'; fact: Settings page: 'By default, Stripe Revenue Recognition recognizes revenue by the day'; by second and two by-month options exist. The subscriptions-and-invoicing page says 'Revenue recognition amortizes revenue by the second, but our example uses a daily interval'; the chapter notes the discrepancy and follows the settings page. |  |\n| p17 | evidence | What has no service period is recognized at once: an invoice line without a period at finalization, a payment without an invoice when it occurs, and a platform's application fee on a Connect charge immediately. | quotation: 'If you don't set a period on an invoice line item, Revenue Recognition recognizes the full amount on the invoice line item when the invoice is finalized'; one-time payments: 'By default, Revenue Recognition recognizes these payments immediately when the payment occurs'; Connect destination charges: 'the application_fee_amount is immediately recognized as the revenue'. | `contrast`: A line with a period. → Everything without one. |\n| p18 | evidence | Stripe documents four ways past the default: rules, of which one applies per transaction; CSV imports that add or override a service period, split a payment or bring in another processor's data; standalone selling prices that split a bundled product across its components; and a Performance Obligations API in preview that recognizes a line as fulfillment is reported. | quotation: Rules: 'Each transaction can only have one rule applied to it'; 'Rules are typically applied to reports within 24 hours'. Import: 'Import an external payment processor's data with a service period, amount, and currency'; reports 'take approximately 3-4 hours to update after you upload data'. Performance Obligations API: 'Request to join the preview'. Standalone selling prices: 'The standalone selling price (SSP) feature helps businesses allocate revenue across products sold as a bundle'; 'Applying a rule to a product precludes it from being set as a bundle'; 'You can’t apply bundles alongside data imports.' | `problem_solution`: Defaults that recognize at once. → The documented ways to override them. |\n| p19 | analysis | The product's output is reports and exports that appear hours after the activity, with a mapping to the general ledger's account names, which Stripe itself calls a subledger (product-page heading \"A centralised revenue subledger\"; report column \"Stripe subledger account\"); that its totals must still be posted by something else is the chapter's labeled inference. | quotation: 'new transaction data appears within approximately 3-4 hours after transaction completion'; Data Pipeline syncs 'once every 6 hours'; chart-of-accounts mapping is applied 'to the CSV reports you download'; the report API note: 'Because this feature is in beta, the data fields might change.' | `sequence`: How schedules are computed and overridden. → What comes out and where it goes. |\n| p20 | claim | The documentation read stops short of three things: allocating one price by stand-alone selling price beyond a product set up as a bundle (nothing on a contract that spans several lines or invoices), estimating variable consideration, and the 'revenue contracts' its chart of accounts mentions without a page that explains them. | fact: The methodology page's account descriptions for 'Unbilled deferred revenue' and 'Contract asset' say 'This is only used when working with revenue contracts'; neither Stripe's documentation index (fetched 17 November 2026) nor any of the 38 Revenue Recognition pages read in the verification pass describes revenue contracts. The index is incomplete: the standalone-selling-price page is linked from the activity-logs page and absent from the index. | `contrast`: What is documented. → Where the documentation read stops. |\n\n### What Adyen Documents: Payments, Settlement and Fees\n\n**Controlling idea** (`evidence`, id `adyen-documented`): No Adyen revenue-recognition product or documentation was found; Adyen's reports describe transactions, and Orb, which Adyen has owned since 1 July 2026, documents recognition for Orb's own billing product.\n\n**Advances the thesis** (S4): States the one-sided comparison plainly and keeps Orb's documentation apart from Adyen's platform.\n\n**Transition in:** `contrast`: A provider that documents a recognition product. → A provider for which none was found.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | Adyen's documentation describes its reports as information about transactions, and neither its documentation index nor its help center has a page on revenue recognition, deferred revenue or billing, which is an absence in public sources and not a statement by Adyen. | quotation: 'Adyen reports show you information about your transactions'; the Settlement details report 'includes the details of payments that have been settled and paid out to you by Adyen'. The guide 'Closing your fiscal period' works from the balances in the Monthly or Daily finance report.; fact: docs.adyen.com/llms.txt, fetched 17 November 2026: 2,573 entries (about 2,600), none with 'revenue recognition', 'deferred', 'billing', 'revenue' or 'Orb' in its title or description. help.adyen.com/sitemap.xml, fetched the same day: 978 English addresses, none on revenue recognition; the two with 'billing' redirect to documentation pages on Adyen's own invoices to merchants. |  |\n| p22 | evidence | Orb documents revenue recognition computed from invoices and raw usage, and as of November 2026 that describes Orb's stand-alone product, which collects through Adyen and Stripe as gateways: Adyen's own site mentions revenue recognition only in describing Orb and usage-based billing, has announced an intent to integrate and has published no integrated product. | quotation: Orb: 'Orb automatically calculates recognized revenue in a way that accords with ASC606 guidelines'; 'the lineage of revenue from a summary entry → invoice → raw product usage data'. Adyen, 1 July 2026: 'Both transactions officially closed on July 1, 2026'; Adyen, 29 September 2026: 'You'll soon see how we bring this unified Adyen and Orb experience to life across our platform.' Orb: 'Orb integrates with payment gateways like Adyen and Stripe for payment processing'; 'Orb supports Adyen as a payment gateway'. Adyen partner page for Orb: 'finance teams get fine-grained reporting to facilitate revenue recognition'. Adyen, 22 October 2026, 'Usage-based billing, explained': 'Revenue recognition for usage-based billing needs adjustment'. | `contrast`: Adyen's own documentation. → What its acquired billing company documents. |\n\n### Three Places to Keep the Schedule, and Where Billing Should Stop\n\n**Controlling idea** (`comparison`, id `where-to-stop`): The schedule can be derived from payment reports, kept in the billing system or kept in a finance system; the second fits a business whose contracts equal its invoices, the third everything beyond, and in both the billing side owes the same line-level export.\n\n**Advances the thesis** (S5): Answers the second half of the chapter's question: where the billing system should stop, and what it owes finance wherever recognition is done.\n\n**Transition in:** `problem_solution`: One provider documents a schedule and the other does not. → The design choice that follows for the integrator.\n\n**Order of paragraphs** (`comparison`): The designs in order of where the schedule sits, from furthest from the contract to closest, and then the export that is common to the two workable ones.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | comparison | The first design computes revenue from payment reports, and it is right only for a business in which every sale is delivered in the month it is paid. | reasoning: A payment report has an amount and a payment date and no service period; for Ironworks it yields €1,890 in February and nothing for eleven months. |  |\n| p24 | comparison | The second design keeps the schedule in the billing system, where it follows every proration, credit note and refund automatically, and it holds as long as each invoice line is one promise delivered evenly over its period. | reasoning: The billing system already holds the line, the period and the adjustments; Stripe documents this design, and Orb documents it with usage. | `contrast`: Revenue from payments. → Revenue from invoice lines, inside the billing system. |\n| p25 | comparison | The third design keeps the schedule in a finance system fed by the billing system, and it becomes necessary when a contract and its invoices diverge: a bundle on one line, a negotiated deal, or revenue that arrives through more than one provider. | example: A year of access and a one-day onboarding workshop sold on one invoice line: the default spreads the whole amount over the year, while the workshop is a separate promise delivered in the first week.; table: Trade-off table: the three designs against what each sees, what it gets wrong, lineage for audit, and when it is right. | `contrast`: A schedule inside the billing system. → A schedule outside it, and the contracts that force it there. |\n| p26 | recommendation | Wherever the schedule lives, the billing side owes finance the same export per invoice line: the amount net of tax, the service period, the product, each later adjustment with its own date and, for usage, the date of use. | table: Export specification: field, why finance needs it, what breaks without it.; figure: Illustration 31-billing-finance-boundary: the billing engine hands a labeled package across a boundary to finance. | `conclusion_summary`: Three designs. → The one obligation that is the same in all of them. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): On revenue recognition the difference is presence against absence: Stripe documents a product built on its own invoices, and for Adyen no product was found, with Orb's documented separately from Adyen's platform.\n\n**Advances the thesis** (S3, S4): Puts the documented facts of the two company sections side by side and says what an integrator does differently on each.\n\n**Transition in:** `conclusion_summary`: The designs and the export. → The two providers side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | comparison | Aspect by aspect, Stripe documents a recognition ledger over its own invoices and payments, and Adyen documents transaction reports, with recognition documented only by Orb for Orb. | table: Where They Differ table: first-party product; source of the schedule; data from elsewhere; output and boundary with the general ledger. Stripe and Adyen cells restate facts cited in the two company sections; the last column is the author's inference. |  |\n| p28 | recommendation | On Stripe the integrator decides whether its contracts equal its invoices before switching the product on; on Adyen it builds the schedule from its own billing system's invoices and uses Adyen's reports for the cash side only. |  | `cause_effect`: The table. → What to do differently on each provider. |\n\n### In Practice at Larkfield: The Annual Plan, Month by Month\n\n**Controlling idea** (`example`, id `in-practice`): Worked by the day, Ironworks' €1,890 is €1,729.48 of 2027 revenue and €160.52 of liability at year-end, and Larkfield keeps the schedule in its finance system because more than half of its other revenue never passes through Stripe.\n\n**Advances the thesis** (S2, S5): Applies the mechanism and the design choice to ledger numbers.\n\n**Transition in:** `example`: The comparison of providers. → The worked example on ledger numbers.\n\n**Order of paragraphs** (`small_to_large`): One invoice line first, then the company's whole revenue, then the decision that follows from both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | example | Recognized by the day over 365 days, the €1,890 gives €144.99 for February, €160.52 for a 31-day month, €1,729.48 by 31 December 2027 and €160.52 still deferred into January 2028. | table: Schedule table for the Ironworks plan: period, days, revenue in the period, cumulative revenue, deferred balance (February 2027; March 2027; 31 December 2027; January 2028). |  |\n| p30 | example | Larkfield has two kinds of revenue on two providers (subscriptions billed on Stripe and earned over time, payment fees earned at the moment of each payment on Stripe and on Adyen), so a ledger over what Stripe sees would hold part of it. | scenario: 2026: subscriptions €24.5M billed with Stripe Billing; payments revenue €19.8M; Adyen carried 56% of member payment volume and Stripe 44%. | `additional_support`: One subscription's schedule. → The rest of Larkfield's revenue and where it is visible. |\n| p31 | recommendation | Priya Raman keeps the schedule in the finance system, and Femke de Graaf's team makes the export a versioned interface with the fields above, tested in each planned API upgrade. | scenario: Keel decision K7: one planned API upgrade per provider per half-year, tested against recorded traffic; the Version Cliff of March 2026. | `cause_effect`: Revenue split across two providers. → Larkfield's decision and what the billing side builds. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Recognition fails quietly, in four ways: a line with no period, an unpaid invoice that keeps earning, a late change to a closed month and an export that breaks or sees only part of the business.\n\n**Advances the thesis** (S2, S5): Gives detection and recovery for the failures the mechanism and the designs imply.\n\n**Transition in:** `contrast`: The schedule working as designed. → The ways it goes wrong without an error.\n\n**Order of paragraphs** (`grouping`): Ordered from the smallest unit to the largest: a field on a line, the state of an invoice, the state of a period, the export as a whole.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | analysis | A line without a service period is recognized in full on the day it is finalized, so one missing field moves a year of revenue into one month, and the check is a query for recurring products whose lines have no period. | fact: Stripe's documented default for a line with no period (methodology and subscriptions pages). |  |\n| p33 | analysis | An invoice that stays open and unpaid keeps being recognized, so collections and recognition have to agree on when a debt is given up. | quotation: 'Unpaid invoices that remain in open status, without changing to void or uncollectible, continue to be recognized as revenue in the Revenue Recognition report.' | `additional_support`: A missing period. → A missing decision about an unpaid invoice. |\n| p34 | analysis | A backdated cancellation, a new rule or a late refund that touches a closed month appears as a correction in the current month, and a team that does not expect corrections reads them as errors. | quotation: 'If the effective period for a new rule overlaps with a closed accounting period, it generates corrections if you retroactively apply the rules to transactions from past (closed) accounting periods.' | `additional_support`: State on the invoice. → State on the accounting period. |\n| p35 | analysis | The export itself fails like any integration, by a schema change or by covering one provider only, and the control is a monthly comparison of what the recognition ledger says was invoiced and collected with the provider's own balance report. | scenario: The Version Cliff: subscription revenue reports wrong for 6 days in March 2026.; fact: Stripe documents a reconciliation of Revenue Recognition cash and fees against the Balance summary report and warns that the two 'use different timestamps for payments'. | `additional_support`: Failures inside the schedule. → Failures of the hand-off that feeds it. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Collection, tax and recognition are three readings of the same invoice line, by debtor, by place and by period. Recognition is the one in which time is the entire answer, which is why it needs the two dates a payment report does not carry (the start and end of the service) and why every adjustment needs its own date. The provider can do the reading only for the lines it holds.\n\n**So what:** An architect who is asked for 'revenue from the payment data' can say what is missing and specify it: per invoice line the net amount, the service period, the product and dated adjustments, plus the usage date. With that export the recognition tool is a replaceable choice; without it no tool gives a number an auditor will accept.\n\n**Callback:** The two February numbers for Ironworks Climbing's €1,890. The reader can now say that €1,890 is billings and cash, €144.99 is revenue, €1,745.01 is deferred revenue at the end of February, and that the difference between the reports is the date each keys on.\n\n**Takeaway** (`course_of_action`): Before choosing where recognition runs, write the line-level export and make it a versioned interface; then decide, with finance, whether your contracts equal your invoices.\n\n**Hand-off** to [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html): `problem_solution`: The obligations chapters 27 to 31 left with the seller: running the billing engine, registering for and filing tax, answering disputes, and producing the data finance needs. → A model that moves some of them (the indirect tax, the handling of fraud and disputes, the name on the statement) by changing who sells to the customer, and what that costs in money, control and customer data.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis (list) | Established: revenue is recognized when a performance obligation is satisfied, money received before that is a liability, and Stripe documents an invoice-line-based recognition ledger while no Adyen product was found. |  |  |\n| p37 | synthesis (list) | Depends on context: whether recognition belongs in the billing system or a finance system, by day or by month, and whether to import other providers' data into Stripe's product. |  | `contrast`: What is settled. → What changes with the business. |\n| p38 | recommendation (list) | The author's synthesis: specify the line-level export first and choose the recognition tool second, and never show a payments total under the word revenue. |  | `contrast`: What is established and what depends. → The author's own position. |\n| p39 | synthesis | Recognition is the third reading of one invoice line, after collection and tax, and it is the reading in which time is the whole answer: the three February numbers differ only in which date each one keys on. |  | `conclusion_summary`: The take-aways. → What the chapter adds to the part, returning to the three numbers. |\n| p40 | recommendation (list) | Eight questions let the reader test a revenue number, a billing export or a provider's recognition product. |  | `cause_effect`: The closing argument. → Questions that apply it. |\n| p41 | transition | Chapters 27 to 31 left the seller with a billing engine to run, tax to register and file, disputes to answer and an export to maintain; the next chapter examines the model that moves part of that by letting the provider sell in its own name, and what stays with the business. |  | `problem_solution`: The obligations that stay with the seller. → A model that changes who the seller is. |\n\n## Non-goals\n\n- Subscriptions, billing cycles, proration and who holds the invoice. See [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html).\n- Meters, late and corrected usage events, credits and commitments as billing mechanics. See [Counting Before Charging: Usage Metering and Rating](usage-metering-and-rating.html).\n- The invoice state machine, credit notes as documents, dunning and when an invoice is given up as uncollectible. See [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html).\n- Tax calculation and the tax liability account. See [Whose Tax, at What Rate: Tax Calculation in the Payment Path](billing-and-payment-tax.html).\n- Posting to the general ledger, the period close, principal versus agent, and Stripe's finance products seen from the enterprise side. See [Accounting for Architects: Ledgers, Journals and Revenue](../finance-systems-architecture/accounting-for-architects.html), [Stripe: Every Movement Is a Balance Transaction](../finance-systems-architecture/stripe.html), [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html).\n- A full treatment of IFRS 15 and ASC 606: contract modifications, variable consideration, stand-alone selling prices, costs to obtain a contract.\n- Whether Larkfield is principal or agent for member payments; the chapter takes its fee as its revenue, as the ledger does.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The text of ASC 606 in the FASB codification was not read (fasb.org returned 403 to automated requests on 17 November 2026); the joint issue is cited from the boards' joint news release of 28 May 2014 (FASB copy via the Internet Archive, IASB copy on ifrs.org) and the IFRS Foundation's page.\n- Stripe's 'revenue contracts' are mentioned in two account descriptions and one settings page; no documentation page describing them was found on 17 November 2026, in the index or among the Revenue Recognition pages read.\n- How Stripe Revenue Recognition treats usage-based billing in detail was not researched beyond the Revenue account description and the data-freshness note on legacy metered usage; the chapter uses Orb's documentation for the usage rule and says so.\n- Whether and when Orb's revenue reporting will be offered as part of Adyen's platform is unknown; only forward-looking statements were found.\n- The absence of an Adyen revenue-recognition product is an absence in public documentation, not a confirmation from Adyen.\n- Stripe Revenue Recognition pricing is volatile and is left out of the chapter.\n\n## Decision log\n\n- **2026-11-17** — The chapter is shorter than the typical 35 to 50 paragraphs (41 units, about 4,900 words) because the Adyen side has two paragraphs of evidence and the accounting standard is owned by RECONCILED's accounting-for-architects. Rejected: Padding the Adyen section with Orb's product detail, which describes Orb and belongs to usage-metering-and-rating.; A 2,000-word chapter, which would drop the worked schedule and the export specification the acceptance criteria test.\n- **2026-11-17** — The Larkfield scene is a disagreement between two reports at the February 2027 close, not an incident, because the ledger has no revenue-recognition incident; the Version Cliff is used only as the canonical failure of the finance export. Rejected: Inventing a misstatement of Larkfield's 2026 revenue, which would contradict the ledger's figures.\n- **2026-11-17** — Larkfield's schedule is computed by the day, matching Stripe's documented default, and the by-month figure is shown once as the alternative convention; the €1,890 is treated as net of tax (assumption). Rejected: Month-based figures throughout, which would not match the documented default the chapter quotes.\n- **2026-11-17** — Larkfield keeps the schedule in its finance system and does not adopt Stripe Revenue Recognition as its book of record, because its payment-fee revenue on Adyen is outside Stripe. Rejected: Adopting the product with CSV imports of Adyen fee revenue: a defensible design, shown in the trade-off table, not chosen for Larkfield.\n- **2026-11-17** — A dispute refund example uses a hypothetical ('had Ironworks disputed') so that no new canonical event is added to Ironworks' history. Rejected: A canonical cancellation or dispute by Ironworks.\n\n## Sources\n\n- **Internal**\n  - _research/brief-billing-and-revenue.md — Part 5 (revenue recognition), sections 1.9 and 1.10 (Adyen before and after Orb), the open questions and research limitations.\n  - _research/scenario-ledger.md — The annual plan, Larkfield's revenue lines and provider split, the Version Cliff, K7, the cast.\n  - PLAN.md and journal-spec.json — The chapter contract; intent, thesis and role, copied unchanged.\n- **External**\n  - https://docs.stripe.com/revenue-recognition/methodology.md and its sibling pages (subscriptions-and-invoicing, refunds-and-disputes, rules, data-import, revenue-settings, accounting-period-control, data-freshness, chart-of-accounts, api, connect, performance-obligations-api, data-reconciliation) — Every statement about Stripe Revenue Recognition; fetched by the writer on 17 November 2026.\n  - https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers/ — The joint issue of IFRS 15 and Topic 606, the five steps, point in time versus over time.\n  - https://docs.withorb.com/revenue-reporting/revenue-recognition.md — Orb's recognition methodology, usage timing, period locks.\n  - https://docs.adyen.com/reporting.md; https://docs.ady <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
