<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What capture, clearing, presentment, net settlement, settlement cycle and funding mean, and how dual-message and single-message systems differ.\n- **Know:** That interchange is fixed at clearing from the data and timing of the clearing record, not at authorization.\n- **Know:** What the network guarantees (payment between its members) and what it does not (the acquirer's payment to the merchant).\n- **Know:** What Stripe and Adyen each document about capture models, capture results and when funds become available, and what neither publishes.\n- **Believe:** 'Captured' is the merchant's claim, not the merchant's money, and the records of one payment legitimately disagree until settlement and payout are complete.\n- **Be able to:** Given a provider's statement that a payment is 'settled' or will be paid at 'T+2', say which event is meant and what the clock starts from.\n- **Be able to:** Given a late or partial capture, name the consequences: a failed capture, a higher interchange fee or a dispute right for late presentment.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two systems that disagree about one payment, the reader explains the disagreement by the layer each system reports and does not call either one wrong. *Probe:* On Friday afternoon a furniture shop's order system shows Thursday's €2,400 card payment as 'paid', its provider dashboard shows the amount as 'pending', and its bank account shows nothing. Is one of the three wrong? Explain what each is reporting. | `custom` | cold_reader | major |\n| AC-2 | Given a merchant that captures on shipment, the reader says what can go wrong when shipment is late. *Probe:* A shop gets card approvals when orders are placed and collects the money only when it ships. A supplier delay pushes one shipment to three weeks after the order. What may happen when the shop then tries to collect, and why? | `custom` | cold_reader | major |\n| AC-3 | The chapter says in so many words that network settlement cut-off times and the number of cycles per day are not public and labels the timings it uses as industry practice or illustration; it states Adyen's documented pre-financing of payouts with its source and date, and states that Stripe documents nothing equivalent for standard payouts. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How does an approved payment become money in the acquirer's account, and why does it take days?\n\n> **Claim:** An approved payment becomes money through three further steps, each on its own schedule: the merchant's capture, the acquirer's clearing record presented through the network, and the network's daily net settlement between its member banks. It takes days because the records travel in batches and the money moves only as one net amount per member per day, not per payment, and the provider's payout to the merchant is a fourth step, on the provider's own schedule. 'Settled' therefore names a different event at the network, at the provider and at the merchant's bank.\n\n**Disputed by:** The view that the delay has no meaning for an integrator: once the provider reports a payment as captured the money is as good as received, and 'settled' is one well-defined moment.\n\n**So what:** A merchant that books revenue or releases goods on 'captured' is acting on its own claim; it should record capture, the provider's available balance and the payout as separate facts, expect them to disagree for days, and ask every provider what its 'T' counts from before comparing payout speeds.\n\n**How and why:** Visa's rules (edition of 24 October 2026) define clearing as the exchange and valuation of records between Visa and its members and settlement as the transfer of daily net amounts that result from it, and the network's guarantee covers members paying each other: Mastercard's annual report for 2025 says it does not guarantee payments to merchants by their acquirers. The interchange fee is fixed from the clearing record, which is why Adyen's documentation warns that a late capture can raise it. The two providers describe the last steps differently (both n.d., accessed November 2026): Stripe counts its settlement timing from the time of capture and uses 'settlement' for the release of funds to the merchant's available balance; Adyen separates the scheme sending funds to Adyen, Adyen's payable batch and the bank's processing, and reports a capture that fails later by webhook. Paying the merchant before the network's funds arrive is documented for Adyen and not for Stripe: Adyen's Sales Day Payout terms (17 June 2024) say it pays 'irrespective of whether the funds are actually received by Adyen', with pre-financing capped at 30 days and then reversed, while Stripe states nothing of the kind for standard payouts. Network cut-off times and cycles, and whether a Stripe capture can fail later, are not public; the chapter's timings for Mila's €120 are industry practice and ledger illustration.\n\n**Supporting claims**\n\n- **S1** — Capture is the merchant's claim against a promise with a deadline: it moves no money, and it can be late, partial or rejected after the provider has accepted it.\n- **S2** — Clearing turns the claim into a record that the acquirer presents to the issuer through the network in batches, and the final amount, the data and the interchange fee are fixed there, not at authorization.\n- **S3** — Settlement moves money as one net amount per member per day, and the network guarantees payment between its members, not the acquirer's payment to the merchant.\n- **S4** — Funding the merchant is a fourth step on the provider's own schedule, so 'settled' and 'T+N' name different events at the network, at the provider and at the merchant's bank.\n- **S5** — Because each layer keeps its own record on its own clock, the records of one payment legitimately disagree for days, and a merchant should store capture, availability and payout as separate facts.\n\n## Role in the part\n\nLocates the moment money actually moves and shows why every system's record of a payment differs in the meantime, which Part III's ledger and reconciliation chapters depend on. Supports P1-3 of part `part-1`.\n\n## Flow\n\n**Pattern:** `chronological` (also `problem_solution` in scene, not-yet-money: the disagreement first, then the outline of what explains it; `comparison` in funding-designs, where-they-differ)\n\nThe body follows the payment in the order things happen to it: the merchant's claim, the acquirer's record, the network's net transfer, the provider's funding. The reader meets the three disagreeing screens before any of that, so each step arrives as part of the answer to a question already felt, and the overview table gives every later section a place. The comparison of funding designs and of the two providers comes only after all four steps, because its rows use the terms those sections define; the worked timeline comes after the comparison so that it can show both providers; the failures come last because each is a step of the timeline going wrong. Starting with the funding step, which is what the studio owner asks about, would use 'settled' before the reader knows it has three meanings; putting the provider comparison first would compare vocabulary the reader cannot yet place.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On Wednesday 10 March 2027 Ines Bakker, who owns Studio Noord, asks Larkfield's support whether the €120 Mila paid on Tuesday evening is hers yet. The booking app says the payment is paid. The provider's balance view shows the amount as not yet paid out. Her bank account shows nothing. Which of the three is wrong?\n\n**Bridge:** An engineer who sees three systems give three answers about one record looks for the stale copy or the bug. → Here there is no bug: each system reports a different step of the same payment, and the steps happen on different days, which turns the question into what those steps are and whose record each one is.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): After the approval an online card payment still needs the merchant's capture, the acquirer's clearing record and the network's daily net settlement, and then the provider's payout; the records travel in batches and the money moves as one net amount per member per day, so 'settled' means three different things depending on who says it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from three systems at Larkfield that disagree about Mila's €120, and return to the same payment hour by hour. *Kept in:* scene, in-practice.\n- Explain why an approval is not yet money and name the steps that remain. *Kept in:* not-yet-money.\n- Follow capture, clearing and net settlement in the order they happen. *Kept in:* capture, clearing, settlement.\n- Show the provider's funding step and what 'settled' means at each layer. *Kept in:* funding.\n- Compare three ways a provider can fund a merchant, and what Stripe and Adyen each document. *Kept in:* funding-designs, where-they-differ.\n- Say what goes wrong and how a merchant detects it. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | On the Wednesday after Mila's €120 payment, Larkfield's record says 'paid', the provider's balance says the money has not been paid out and the studio's bank account shows nothing, and none of the three is wrong. | scenario: Mila's ten-class pass, €120.00, approved Tuesday 9 March 2027 at 19:42 and captured automatically; the studio's payout arrives Thursday 11 March. On Wednesday 10 March three systems give three answers. |  |\n| p02 | claim | An approved payment becomes money through capture, clearing and the network's daily net settlement, with the provider's payout as a fourth step, so 'settled' names a different event at the network, at the provider and at the merchant's bank. |  | `cause_effect`: Three records that disagree about one payment. → The reason: three further steps and a payout, each on its own schedule and each with its own record. |\n| p03 | context | On the journey of Mila's class pass this chapter covers the stretch from 19:42 on Tuesday, when the approval and the automatic capture are done, to Thursday, when the studio's payout arrives. | scenario: Tuesday 9 March 2027, 19:42, to Thursday 11 March 2027. | `place`: The steps the chapter is about. → Their position on the recurring payment's journey. |\n| p04 | transition | The chapter starts with the three answers at Larkfield, explains why an approval is not yet money, follows capture, clearing and settlement in the order they happen, then the provider's funding step and the three meanings of 'settled', compares three funding designs and the two providers, works Mila's €120 through hour by hour and ends with what goes wrong. |  | `sequence`: The chapter's place on the journey. → The order in which the chapter takes its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Three Answers to “Has the Studio Been Paid?”\n\n**Controlling idea** (`example`, id `scene`): Three systems give three true answers about one €120 payment, and Larkfield has no place that says which answer means what.\n\n**Advances the thesis** (S5): Shows the disagreement the thesis explains, before any mechanism is named.\n\n**Transition in:** `example`: The introduction's claim that the records of one payment report different steps. → One morning at Larkfield where that disagreement reaches a studio owner.\n\n**Order of paragraphs** (`chronological`): The scene, then its reading, then the question it leaves; the question cannot be posed before the reader has seen that no system is wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | On Wednesday 10 March 2027 Aylin Demir's support team cannot answer Ines Bakker's question, because the booking app, the Adyen balance and the studio's bank each say something different about Mila's €120. | scenario: Ines Bakker (Studio Noord, on Adyen since 2024) asks whether Mila Janssen's €120.00 pass, bought Tuesday 9 March 2027 at 19:42, has been paid to her; the payment record store shows `paid`; the payout that includes it arrives Thursday 11 March.; fact: Adyen's Balances page lists 'Pending: the gross amount of sales and refunds that have not yet been settled by the respective card scheme or payment method' and 'Next payout: the current amount to be settled to your bank account at the next moment of payout'. |  |\n| p06 | analysis | Each of the three answers is true of a different step: Larkfield's `paid` records the approval and the capture, the provider's balance records its own funding schedule, and the bank records only a transfer that has arrived. | figure: Conceptual figure: three screens showing three statuses for the same €120 (record 'Paid', balance 'Next payout', bank '€0'). | `contrast`: Three answers that look like one of them must be stale. → Each is correct about the step it reports. |\n| p07 | claim | Femke de Graaf turns the support question into the chapter's question: what happens to the €120 between Tuesday 19:42 and Thursday, who does each step, and which record shows it? |  | `cause_effect`: Three correct answers that support cannot translate for the studio. → The question that would let them: what the steps are and who holds each record. |\n\n### Why an Approval Is Not Yet Money\n\n**Controlling idea** (`explanation`, id `not-yet-money`): After the approval nothing has moved; four steps remain, each done by a different party on its own schedule and each leaving its own record.\n\n**Advances the thesis** (S5): Lays out the layers whose separate clocks make the records disagree.\n\n**Transition in:** `problem_solution`: Femke's question about what happens between Tuesday and Thursday. → The outline of the answer: the steps that remain after an approval, and why they cannot be instant.\n\n**Order of paragraphs** (`large_to_small`): The whole stretch in one table before any step is opened up, so each later section has a place to sit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | claim | The authorization reserved €120 on Mila's account and moved nothing, so on Tuesday evening the studio holds a bank's promise and Larkfield holds a record of that promise. | fact: Visa's walkthrough of a payment: after authorization 'the issuer posts the transaction to the consumer’s account and effectively pays the acquirer an amount equal to the value of the transaction, minus the interchange reimbursement fee (IRF). The acquirer pays the amount of the purchase, minus the merchant discount rate (MDR), to the seller.' |  |\n| p09 | description | Four steps remain after the approval (capture, clearing, settlement and payout), and each has a different actor, moves a different thing and typically happens at a different time. | table: Table of the four steps plus the approval: step, who acts, what moves (an instruction, a record, net money between banks, a bank transfer), what the merchant can see, and a typical time labeled as industry practice.; fact: Mastercard names three network services: it enables 'the routing of a transaction to the issuer for its approval', facilitates 'the exchange of financial transaction information between issuer and acquirer after a successfully conducted transaction', and settles 'by facilitating the exchange of funds between parties via settlement banks chosen by us and our customers'. | `elaboration`: A promise and nothing else on Tuesday evening. → The four steps that turn it into money, side by side. |\n| p10 | cause_effect | The steps take days because records travel in batches, money moves between banks as daily net amounts, and the parties that do this (the acquirer, the network, the issuer) are ones the merchant never talks to. |  | `cause_effect`: Four steps with four actors. → Why they cannot collapse into the two seconds the approval took. |\n\n### Capture: The Merchant's Claim\n\n**Controlling idea** (`explanation`, id `capture`): Capture is the merchant's instruction to collect an approved amount; it moves no money, it has a deadline set by the approval, and it can be accepted by the provider and still be rejected later.\n\n**Advances the thesis** (S1): Argues that 'captured' is a claim and that the claim itself can fail.\n\n**Transition in:** `sequence`: The four remaining steps in one table. → The first of them, the only one the merchant performs.\n\n**Order of paragraphs** (`large_to_small`): The definition and default first, then the variants, then the deadline they all share, then the two ways the claim fails. The deadline has to follow the variants because only delayed and manual captures meet it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Capture is the merchant telling its provider to collect an authorized amount, and by default both providers do it automatically straight after the approval. | quotation: Adyen: 'By default, payments are captured automatically without a delay, immediately after authorization of the payment request.' Stripe captures automatically unless `capture_method` is set to `manual`. |  |\n| p12 | comparison | A merchant can instead delay the capture, send it manually, capture part of the amount or capture several times, and the two providers expose the same choices under different settings. | table: Capture models on each provider: automatic (default on both); delayed automatic (Adyen: capture delay of 'immediate' or 1 to 7 days per merchant account, or `captureDelayHours` per payment; Stripe: `automatic_delayed`, private preview); manual (Stripe: status `requires_capture`, capture call with `amount_to_capture`; Adyen: 'Manual capture lets you settle funds on fulfillment, when an order is shipped'); partial (Stripe: 'A partial capture automatically releases the remaining amount'; Adyen: 'Any unclaimed amount that is left over after partially capturing a payment is automatically cancelled'); multiple (Stripe: 'up to 50 non-final captures for a single PaymentIntent', an IC+ feature; Adyen: multiple partial captures, where 'The maximum allowable partial captures against a single pre-authorization is determined by the issuer'). | `contrast`: The automatic default. → The cases where the merchant chooses when and how much to claim. |\n| p13 | evidence | Every capture other than the immediate one runs against a deadline, because Visa gives the acquirer a fixed number of days from the approval to process the transaction and each provider adds its own cut-off. | fact: Visa Table 5-11: 10 calendar days for a cardholder-initiated card-absent transaction, 30 with an extended authorization indicator, 5 calendar days for other card-present and for all merchant-initiated transactions; the timeframe 'starts on the date of a valid Authorization'.; fact: Stripe lists 7 days for a customer-initiated online Visa payment and 5 days for merchant-initiated, noting 'The exact authorization window is 4 days and 18 hours, to allow time for clearing processes'; `capture_before` 'indicates when the authorization expires', and on expiry 'the funds are released and the payment status changes to `canceled`'.; fact: Adyen: 'Adyen expires (pre-)authorization requests automatically after 28 days from the day the payment is authorized', and with manual capture 'it is possible to capture remaining balance on a payment after an authorization has already expired on the card scheme's side'. | `cause_effect`: Captures that happen later than the approval. → The deadline every such capture runs against, at the network and at each provider. |\n| p14 | cause_effect | A capture after the network's window can fail, can cost a higher interchange fee and scheme fees, and gives the issuer a dispute right for late presentment that lasts 75 days. | quotation: Adyen: capturing after the scheme's validity period 'increases the risk of: A failed capture. Increased interchange fees. Card scheme transaction fees. A cardholder-initiated chargeback for 'No Authorization' or 'Late Presentment' reasons.'; fact: Visa Dispute Condition 11.3, No Authorization/Late Presentment: one reason is that 'A valid Authorization was obtained but the Transaction was not processed within the timeframe specified in Section 5.7.3.5'; time limit '75 calendar days from the Transaction Processing Date'. | `cause_effect`: The deadline. → What missing it costs. |\n| p15 | evidence | A capture that the provider accepted can still be rejected afterwards by the network or the issuer: Adyen reports this by a second webhook, and Stripe's documentation does not say whether the same can happen there. | quotation: Adyen's CAPTURE webhook with `success: true` means the request 'is valid (for example, the authorization has not expired, and the balance is available) and has been submitted to the bank/third-party processor'; 'In rare cases the card scheme can still reject the capture, and you will receive a CAPTURE_FAILED webhook.' An automatically captured payment 'does not trigger a separate CAPTURE webhook'.; fact: Stripe's hold page presents capture as a call after which the PaymentIntent changes status and emits events; it contains no statement on a capture failing later at the network. | `additional_support`: A capture that fails because it is late. → A capture that fails although it was on time and accepted. |\n\n### Clearing: The Claim Becomes a Record\n\n**Controlling idea** (`explanation`, id `clearing`): Clearing is the batch exchange of final transaction records between acquirer and issuer through the network, and it is where the amount, the data and the interchange fee become definitive.\n\n**Advances the thesis** (S2): Argues that the record that counts between the banks is created after the approval, in a batch, and fixes the fee.\n\n**Transition in:** `sequence`: The merchant's claim, accepted by the provider. → What the acquirer does with it: present a record to the issuer through the network.\n\n**Order of paragraphs** (`prerequisite_order`): Two-message processing has to be named before 'presentment' means anything, and the record has to exist before the fee can be fixed from it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | definition | Card networks carry a payment either as two messages, an authorization and a later clearing record, or as one message that does both, and online card payments in Europe are typically the two-message kind. | quotation: Federal Reserve: a dual-message network 'typically uses separate messages to authorize and clear a transaction'; a single-message network 'typically uses a single message to authorize and clear a transaction. These networks normally process PIN-authenticated transactions'.; fact: Visa's glossary: an Online Financial Transaction is 'A Transaction that is authorized, cleared, and settled in a single online financial message'; in the US, ATM and PIN-authenticated Visa Debit transactions must be processed that way. |  |\n| p17 | definition | In the two-message case the acquirer sends each captured transaction to the issuer as a clearing record called a presentment, and the network validates and values those records in batches. | quotation: Visa's glossary: Clearing is 'A processing service for the validation and valuation of financial and non-financial records exchanged between Visa and Members'; a Presentment is 'A Clearing Record that an Acquirer presents to an Issuer through Interchange, either initially (a first Presentment) or after a Dispute'; Interchange is 'The exchange of Clearing Records between Members'.; figure: Structural figure: five parties in a row (merchant, provider or acquirer, network, issuer, cardholder) and three arrows over time: 'Capture' from merchant to provider, 'Presentment' from acquirer through the network to the issuer, 'Net settlement' back from issuer side to acquirer side, then 'Payout' to the merchant. | `elaboration`: The second message of the two-message case. → What that message is called, who sends it and what the network does with it. |\n| p18 | cause_effect | The interchange fee, the share of the payment the acquirer's side pays the issuer, is determined from the clearing record and its timing, not from the approval, which is why a late or incomplete presentment can cost more. | quotation: Visa's glossary: the Interchange Reimbursement Fee is 'A fee between Acquirers and Issuers in the Clearing and Settlement of an Interchange Transaction'. Mastercard: 'We administer the collection and remittance of interchange fees through the settlement process.'; fact: The rules that decide which rate a record qualifies for are published only in part: Visa publishes its US rates by program ('Visa USA Interchange Reimbursement Fees', 24 October 2026), but its rulebook names a 'US Interchange Reimbursement Fee Rate Qualification Guide' in its list of documents and does not reproduce it. That the rate depends on the record's data and timeliness is industry practice; Adyen's warning of 'Increased interchange fees' on late capture is a documented instance. | `cause_effect`: Records that are validated and valued at clearing. → One of the values fixed there: the fee the issuer receives. |\n\n### Settlement: One Net Amount per Member per Day\n\n**Controlling idea** (`explanation`, id `settlement`): Settlement is the transfer of daily net amounts between the network's members; the network guarantees those transfers between members and nothing beyond them, and its timetable is not public.\n\n**Advances the thesis** (S3): Argues that money moves per member per day, that the guarantee stops at the acquirer and that the schedule cannot be read from public rules.\n\n**Transition in:** `cause_effect`: Records cleared and valued in batches. → The money those records give rise to, which moves as one net amount per member per day.\n\n**Order of paragraphs** (`large_to_small`): The definition first, then the guarantee that makes net settlement safe, then the currency detail, then the limit of the evidence. The limit comes last because the reader must know what settlement is before being told which part of it is not public.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition | Settlement moves no payment individually: each member pays or receives one net amount per day for everything cleared, with interchange and other fees already inside it. | quotation: Visa's glossary: Settlement is 'The reporting and funds transfer of Settlement Amounts owed by one Member to another, or to Visa, as a result of Clearing'; a Settlement Amount is 'The daily net amounts expressed in a Member’s Settlement Currency resulting from Clearing. These amounts include Transaction and Fee Collection Transaction totals'.; example: Illustrative netting (assumption): an acquirer presents €10,000,000 of purchases on one day, has €300,000 of refunds and disputes going the other way and owes €40,000 of interchange and fees; it receives one transfer of €9,660,000, in which Mila's €120 cannot be pointed to. |  |\n| p20 | evidence | The network guarantees that its members pay each other and does not guarantee that the acquirer pays the merchant, so after settlement the merchant's claim is on its provider alone. | quotation: Visa: 'We indemnify issuers and acquirers for settlement losses they may suffer due to the failure of another issuer or acquirer to honor its settlement obligations'. Mastercard: 'We guarantee the settlement of many of the transactions from issuers to acquirers ... We do not, however, guarantee payments to merchants by their acquirers'.; figure: Conceptual figure: many small payment slips flowing into a funnel on each side and one single transfer labeled 'One net amount' crossing between two banks, with a shield over the bank-to-bank link only. | `additional_support`: Net amounts between members. → What stands behind those transfers, and where the guarantee ends. |\n| p21 | explanation | Currency conversion happens at two layers: the network converts into each member's settlement currency at a rate Visa sets, and the provider then decides in which currency the merchant's balance and payout are held. | quotation: Visa's glossary, Currency Conversion Rate: 'A rate set by Visa from the range of rates available (not necessarily executed) in wholesale currency markets ... when VisaNet converts the Transaction Currency to the Acquirer’s Settlement Currency, or to the Issuer’s Settlement Currency, the rate is applied by Visa and may not be adjusted.'; fact: Stripe: 'Stripe automatically converts all incoming funds into your default currency', unless multi-currency settlement is configured, where 'Stripe charges the applicable fee when funds settle into a non-primary settlement currency, not when you initiate a payout'. Adyen 'offers like-for-like (no currency conversion) settlement if the currency is also supported as a settlement currency by the payment method'. | `additional_support`: Net amounts expressed in a member's settlement currency. → Where a payment in another currency is converted, and by whom. |\n| p22 | context | The public record stops at the timetable: Visa's rules define a settlement date, a settlement bank and settlement currencies but publish no cut-off times and no number of cycles per day, and the next-business-day timing this chapter uses is industry practice. | fact: Visa's glossary defines Settlement Date ('The date on which Visa initiates the transfer of Settlement Amounts'), Settlement Bank and Settlement Currency, and section 7.7 covers a National Net Settlement Service; none gives cut-off times or cycles per day. Mastercard's rule documents were not readable (HTTP 403). | `contrast`: What the rules and annual reports say about settlement. → What they do not say: when it happens. |\n\n### Funding: The Provider's Step, and Three Meanings of “Settled”\n\n**Controlling idea** (`explanation`, id `funding`): The payout to the merchant is the provider's own step on the provider's own schedule, and each provider uses 'settle' for a different event, so 'settled' and 'T+2' must be read per layer.\n\n**Advances the thesis** (S4): Argues that funding is a separate step and shows the three events the word 'settled' can name.\n\n**Transition in:** `sequence`: Net money that has reached the acquirer side, with no guarantee beyond it. → The last step, which belongs to the provider: making funds available and paying them out.\n\n**Order of paragraphs** (`comparison`): The claim, then the two providers on the same points (unit of funding, starting point, vocabulary), then the one point on which the record differs in kind, then the table that sums the layers. The table cannot come first because its provider columns use terms the two evidence paragraphs introduce.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | Funding the merchant is a decision the provider takes on its own schedule: it is bound by its contract and its license, not by the network's settlement timetable. | reasoning: Since the network 'does not guarantee payments to merchants by their acquirers' (Mastercard, 2026), when and whether the merchant is paid depends on the provider's terms and on how the provider is licensed to hold funds. The author's judgement; the license question is owned by the chapter licences-and-safeguarding. |  |\n| p24 | evidence | Stripe ages each transaction: funds are `pending` and become `available` at a time fixed per transaction by a country schedule that counts from the capture, and Stripe calls that moment settlement. | quotation: Stripe: 'Funds in the pending state represent incoming transactions that haven’t settled into your balance'; 'Settlement time is the time between when a payment ... is made and when the funds become available in your Stripe balance'; funds move 'from `pending` to `available` at the corresponding `available_on` time for each balance transaction'. Netherlands: initial settlement timing 7 calendar days, default 3 business days.; quotation: Stripe: 'Some payment processors might start “T” from their internal settlement time, meaning when the funds land in their bank accounts. Stripe uses “T” to refer to the transaction time, which indicates the time of the original payment confirmation or capture'; 'Choosing a payout schedule doesn’t change how long it takes for your pending balance to become available. It only controls when payouts are sent.' | `example`: Funding as the provider's own schedule. → The first provider's documented schedule and vocabulary. |\n| p25 | evidence | Adyen ages a sales day: all captured sales of one day go into one payable batch that is paid after a fixed payout delay, typically two business days, and its documentation keeps the scheme sending funds to Adyen as a separate event. | quotation: Adyen: '1. Capture: A payment is captured, and the card scheme or payment method sends the funds to Adyen. 2. Adyen processing: The funds are assigned to a payable batch ... 3. Bank processing: Your bank processes and clears the funds.' Sales day payout 'is the default payout model'; 'You get all the funds from a particular sales day in a single payout batch, with a fixed payout delay'; 2 business days where at least 80% of transactions are in listed currencies including EUR and acquired in the currency's region; 'the payable batch always closes two hours after your sales day closing time'.; fact: For platforms: 'Adyen settles a settlement batch after its sales day ends and the configured settlement delay has passed. The date when the schemes or payment methods transfer the funds to Adyen does not affect this timing.' | `contrast`: A schedule per transaction, counted from capture. → A schedule per sales day, with the network's transfer named as its own step. |\n| p26 | evidence | One of the two documents paying before it is paid: under Sales day payout Adyen pays out whether or not the scheme's funds have arrived and takes the money back if they have not come within 30 days, while Stripe's pages do not say whether standard availability waits for network funds. | quotation: Adyen's terms: Adyen will 'initiate payout of the Net Captured Volume to Merchant on the Payout Day, irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner'. Documentation: 'Prefinancing is capped at 30 days. If the card scheme, payment method, or acquirer does not settle the funds within 30 days, Adyen reverses the prefinanced amount from your payable batch.'; fact: Stripe documents the case only for a paid product: 'Funds acquired from card payments are available for Instant Payouts as soon as the charge is complete.' For standard payouts the balances and payouts pages give the schedule and say nothing about Stripe's own receipt of funds. | `additional_support`: Two funding schedules that are both fixed in advance. → Whether a fixed schedule means the provider pays before the network has paid it. |\n| p27 | synthesis | 'Settled' therefore names three events (the network's transfer to the acquirer, the provider's release of funds to the merchant's balance or batch, and the arrival of the payout at the merchant's bank), and a quoted 'T+2' is only comparable once you know which event and which starting point it uses. | table: Table: layer (network, provider, merchant's bank); what 'settled' means there; who can see it; Stripe's word; Adyen's word; what a 'T+N' at that layer counts from. | `conclusion_summary`: Network settlement, two provider schedules and pre-financing. → The three events the one word covers, in one table. |\n\n### Three Ways to Fund a Merchant, and What Each Costs\n\n**Controlling idea** (`comparison`, id `funding-designs`): A provider can pass funds through as the network pays, pay on a fixed delay and carry the gap itself, or advance funds at once for a fee, and each choice moves risk and reconciliation effort between provider and merchant.\n\n**Advances the thesis** (S4): Shows that the timing of the fourth step is a design choice with a price, not a property of card payments.\n\n**Transition in:** `elaboration`: Two providers' funding schedules, one of which pays before it is paid. → The general designs those schedules are instances of, and their trade-offs.\n\n**Order of paragraphs** (`comparison`): From the design in which the provider carries nothing to the one in which it carries most, then the table; the order follows increasing provider risk so each design is read as a step from the previous one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison | In pass-through funding the provider pays the merchant as each method's funds arrive, which costs the provider nothing in liquidity and leaves the merchant with one day's sales spread over several payouts. | quotation: Adyen, Pass-through payout: 'Sales are assigned to the payable batch as soon as the schemes or payment methods send the funds to Adyen'; 'The sales from Monday, January 1 are paid out in separate batches over the subsequent days, from January 2 to January 7.' It is 'the only available payout model in Africa, Brazil, and India'. |  |\n| p29 | comparison | In fixed-delay funding the provider pays a whole day's sales after a set number of days and carries the difference between fast and slow methods, protecting itself with a delay, a time limit and a right to take the money back. | quotation: Adyen: 'The payout delay is calculated to be the break-even point, where faster payment methods settle enough funds to make up for the funds not yet settled by the slower payment methods'; 'American Express has a settlement delay of 7 days. If you process most payments through American Express, Adyen will set your payout delay to 7 business days.' Terms: if more than 25% of captured volume uses methods that 'structurally settle to Adyen later than the Payout Day', Adyen may delay the payout day. | `contrast`: Paying as funds arrive. → Paying on a fixed day regardless of arrival. |\n| p30 | comparison | In instant funding the provider advances card funds as soon as the charge completes, for a fee, and the loss on a later refund or dispute stays with the merchant. | quotation: Stripe: 'Card payment funds are available immediately, including pending funds within your payout schedule window'; 'Stripe assesses a fee on each Instant Payout.' | `contrast`: A fixed delay of days. → No delay, at a price. |\n| p31 | recommendation | The three designs trade the provider's liquidity and risk against the merchant's cash-flow speed and reconciliation effort, and I would choose by which of those the business is short of. | table: Trade-off table: design (pass-through, fixed delay, instant); who waits for the network; who carries the gap; what the merchant must reconcile; when it is right; documented instance. | `conclusion_summary`: Three designs described one by one. → Their trade-offs on common criteria and the author's rule for choosing. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): On the public record the two providers differ in how a capture result is reported, in their own authorization cut-off, in what 'settlement' and 'T' mean, in the unit they fund and in whether they document paying ahead of the network.\n\n**Advances the thesis** (S1, S4): Collects the documented differences in capture and funding that an integrator has to design for.\n\n**Transition in:** `conclusion_summary`: Documented behavior of each provider, spread over the capture, funding and design sections. → The same facts side by side, with the author's reading of each difference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | comparison | Five documented differences matter to an integrator, and the reading of each in the last column is the author's inference. | table: Where They Differ table. Rows: (1) capture result: Stripe status change and events, later failure not stated / Adyen CAPTURE then possible CAPTURE_FAILED webhook; (2) provider's own authorization cut-off: Stripe `capture_before`, cancels on expiry / Adyen 28 days, late capture possible at the merchant's risk; (3) what 'settlement' and 'T' mean: Stripe funds become available, T is capture / Adyen separates scheme funds, payable batch, bank processing; (4) unit of funding: Stripe per transaction at `available_on`, NL default 3 business days / Adyen per sales day, typical payout delay 2 business days; (5) paying ahead of the network: Stripe not public for standard payouts beyond terms that allow a delay when a network fails to settle to Stripe, documented for Instant Payouts / Adyen documented, capped at 30 days and reversible. |  |\n| p33 | recommendation | On Stripe an integrator should read the expiry and the availability time from the object and not compute them, and on Adyen should subscribe to the failure and reversal events that are off by default and reconcile by batch. | fact: Adyen: the `SETTLED_REVERSED` and `REFUND_NOT_CLEARED` event types can be subscribed to for the 30-day adjustments; CAPTURE and CAPTURE_FAILED are enabled in the Standard webhook settings. Stripe: `payment_method_details.card.capture_before` and the balance transaction's `available_on`. | `cause_effect`: Five differences. → What to do differently on each provider because of them. |\n\n### In Practice at Larkfield: When Mila's €120 Becomes the Studio's Money\n\n**Controlling idea** (`example`, id `in-practice`): Followed hour by hour, Mila's €120 is a claim on Tuesday, a record and a net transfer between banks by about Wednesday and €117.47 in the studio's account on Thursday, and Larkfield stores each of those as a separate fact.\n\n**Advances the thesis** (S5): Applies the layers to the recurring payment and shows the records disagreeing on schedule.\n\n**Transition in:** `example`: The mechanism and the two providers' documented behavior. → One payment worked through on Adyen, with the Stripe variant beside it.\n\n**Order of paragraphs** (`chronological`): The timeline first, then what to say and store at its midpoint, then the variant; the variant is only meaningful against the timeline.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | example | On Adyen the €120 passes through five dated events between Tuesday evening and Thursday, of which only the first and the last are visible to Larkfield at the time they happen. | table: Timeline table: Tue 9 March 19:42 approval and automatic capture (ledger; documented default); Tue night to Wed, presentment in the acquirer's clearing batch (industry practice, timing not public); about Wed 10 March, network net settlement to the acquirer (industry practice, timing not public); Wed 10 March, Ines asks (scene); Thu 11 March, payout after a payout delay of two business days, €117.47 to Studio Noord after Larkfield's fee of €2.53 (ledger). Each row says what each of the three records shows.; figure: Structural figure: a horizontal timeline Tuesday to Thursday with three lanes ('Larkfield record', 'Provider balance', 'Studio bank') and the status each lane shows at each point. |  |\n| p35 | analysis | The answer to Ines on Wednesday is that her payment is claimed and scheduled, not received, and Larkfield now stores the capture, the provider's funding date and the payout as three facts with three sources. | table: Small table: fact (captured, funds available or batch closed, payout arrived); the record it comes from on Adyen and on Stripe; when it is known.; scenario: Keel decisions K2 (the provider's record is the truth; the settlement report where the API gives no object to read) and K3 (a ledger entry for every movement). | `cause_effect`: The timeline with its two days of disagreement. → What support can say on Wednesday and what Larkfield records so that it can say it. |\n| p36 | comparison | Had Studio Noord been on Stripe, the same capture on Tuesday evening would, on Stripe's default schedule for a Dutch account, become available three business days later, on Friday 12 March, and be paid out after that. | fact: Stripe: Netherlands default settlement timing 3 business days; 'Stripe pays out funds daily from transactions that were captured 3 business days earlier'. | `contrast`: The Adyen timeline. → The same payment on Stripe's documented default schedule. |\n\n### When It Goes Wrong: Late Claims, Rejected Claims and Payouts That Do Not Match\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Each layer fails in its own way and on its own delay, and each failure is found by comparing two of the three records, not by watching one.\n\n**Advances the thesis** (S1, S5): Shows the cost of treating 'captured' as received and how separate records make each failure detectable.\n\n**Transition in:** `contrast`: A payment where every step went right. → The ways each step goes wrong and how a merchant finds out.\n\n**Order of paragraphs** (`chronological`): Failures in the order of the steps they belong to: the claim, the claim's acceptance, the payout.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | cause_effect | A claim that is sent too late is the failure the merchant controls: an approval whose expiry was computed instead of read, or a shipment that slipped, leaves a capture that fails, costs more or can be disputed. | reasoning: Detection: store the provider's expiry (`capture_before` on Stripe; the scheme's validity period on Adyen, whose own expiry of 28 days is later), alert on open authorizations a day before it, and ask for a new or extended approval instead of capturing late. Consequences as cited in the capture section (Adyen, n.d.; Visa Dispute Condition 11.3). |  |\n| p38 | cause_effect | A claim that was accepted and later rejected is found only by the event or report line that says so, and if the sale was already paid out the provider takes the amount from the current batch. | quotation: Adyen: 'If Adyen cannot capture the funds for a sales transaction that we already paid out, we subtract those funds from the current payable batch'; such reversals 'appear in the Settlement Details Report as CaptureFailed and RefundFailed entries'. | `contrast`: A failure the merchant causes and can prevent. → A failure that arrives from outside after the merchant has recorded success. |\n| p39 | cause_effect | A payout almost never equals a day's sales, because refunds, chargebacks and reversals are netted in as they occur and bank holidays stop transfers in both directions, so a payout is reconciled from its report lines and not from the sales of the day. | quotation: Adyen: 'Refunds, chargebacks, and other adjustments are added to the payable batch as they occur and are not related to the sales day of the original transaction'; on bank holidays 'clearing for a specific currency may be closed and therefore Adyen cannot process payouts. Adyen also cannot receive funds'. Stripe: 'When a payout fails, the status might initially show as `paid`, but then change to `failed` within 5 business days.' | `additional_support`: One sale taken back out of a batch. → The general case: the batch is a net of everything open when it closes. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Capture, clearing, settlement and funding are not four stages of one status but four records held by four parties, each complete on its own terms: the merchant's claim, the acquirer's presentment, the network's net amount and the provider's batch or balance. None of them is keyed to the others or shares their granularity, which is why a payment has no single moment at which it is 'settled' and why the disagreement between records is the normal state for days, not an error to be fixed by faster synchronization.\n\n**So what:** A team that stores one 'paid' flag will release goods, book revenue and answer customers on its own claim; a team that stores the claim, the provider's funding date and the payout as three facts can say what has happened, what has not, and which provider's 'T+2' is actually faster.\n\n**Callback:** Ines Bakker's question on Wednesday 10 March and the three screens that disagreed about Mila's €120. The reader can now label each screen with the step it reports and tell Ines the date her money arrives and why no screen was wrong.\n\n**Takeaway** (`course_of_action`): Record capture, provider availability and payout as separate facts with their sources; read expiry and availability times from the provider; ask every provider what 'settled' means in its reports and what its 'T' counts from. Eight questions to ask follow.\n\n**Hand-off** to [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html): `time`: Money that has been cleared, settled between the banks and paid out to the studio, the last forward step. → What can still happen to it for weeks or months afterwards: the merchant sends it back, or the cardholder's bank takes it back.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | synthesis (list) | Established: capture is a claim with a deadline, money moves between members as daily net amounts that the network guarantees only between members, and the fee to the issuer is fixed from the clearing record. |  |  |\n| p41 | synthesis (list) | Depends on context: when to capture, which funding model to accept and how much to rely on a provider's fixed payout day depend on what is sold, on the method mix and on which provider documents what. |  | `contrast`: What the rules and filings establish. → What changes with the business and the provider. |\n| p42 | recommendation (list) | The author's synthesis: treat 'settled' as a word that needs a layer, store three facts instead of one status, and read the three screens at Larkfield as three correct reports. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such, with the return to the opening scene. |\n| p43 | recommendation (list) | Eight questions let the reader test a provider's capture and funding behavior and their own records of it. |  | `cause_effect`: The take-aways. → Questions that apply them in a design review or a provider evaluation. |\n| p44 | transition | With the €117.47 in the studio's account the forward journey is over, and what remains is everything that can still pull it back. |  | `time`: Money cleared, settled between the banks and paid out. → The weeks and months after it, in which the merchant can send it back or the cardholder's bank can take it back. |\n\n## Non-goals\n\n- The parties, the four-party model and the full six-step timeline See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html).\n- What an authorization promises, validity windows in full, incremental and extended authorization, reversals See [The First Promise: Authorization](payment-authorization.html).\n- Refunds, chargebacks and the dispute lifecycle (only the late-presentment dispute right is used here) See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- Interchange levels, caps, scheme fees and provider pricing See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Balance types, reserves, deposits and negative balances See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- Payout rails, schedules, failures and returns See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Reports and the reconciliation job See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html), [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html).\n- What a license lets a provider hold between settlement and payout See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Capture and settlement of non-card methods (direct debit, iDEAL, bank transfers) See [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether a Stripe capture can be rejected by the network after the API accepted it: not stated on the pages read.\n- Whether Stripe's standard availability schedule waits for its own receipt of network funds: not stated; Stripe's services terms (28 September 2026) count a Financial Provider's failure to settle to Stripe as a Payout Delay, and only Instant Payouts are documented as available on completion of the charge.\n- Visa and Mastercard settlement cut-off times, cycles per day and settlement banks: not in the public rule text; Mastercard's rule documents were not readable.\n- Why Stripe documents a 7-day window for customer-initiated online Visa payments where Visa's rule gives 10 days: not explained by Stripe (owned by payment-authorization).\n\n## Decision log\n\n- **2026-11-17** — Funding designs get their own section (pass-through, fixed delay, instant) because both providers document instances of them and the style guide asks for designs and a trade-off table; capture variants are treated as a table inside the capture section instead. Rejected: Treating capture models as 'the designs'; Folding funding designs into the funding section\n- **2026-11-17** — Validity windows are used only as the capture deadline, with a link to payment-authorization, which owns them. Rejected: Repeating the full per-network window table\n- **2026-11-17** — Clearing file formats and transaction codes are left out: they are not public documents and the chapter's argument does not need them. Rejected: Naming Base II transaction codes from a secondary mention\n- **2026-11-17** — The limit of the evidence on settlement timing is its own paragraph (p22) so that acceptance criterion AC-3 is met in one identifiable place. Rejected: Scattering 'not public' remarks through the section\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md — The chapter contract: question, coverage, owned terms, Larkfield thread.\n  - _journals/payments-platform-architecture/journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged; the neighbours' transitions.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — Mila's class pass, Studio Noord, the cast, Keel decisions K2 and K3.\n  - _journals/payments-platform-architecture/_research/brief-card-lifecycle-and-networks.md — Part 3 (capture, clearing, settlement, funding) and section 2.3 (validity windows), with the verified quotations.\n  - _journals/payments-platform-architecture/_research/brief-ledgers-and-money-movement.md — Part 2 (balances, settlement timing, payable batches, sales day payout, pre-financing).\n- **External**\n  - Visa Core Rules and Visa Product and Service Rules, edition of 24 October 2026, https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf — Definitions of clearing, presentment, interchange, settlement, settlement amount, currency conversion rate; Table 5-11; Dispute Condition 11.3. Re-read 17 November 2026.\n  - Visa Inc., Form 10-K for the fiscal year ended 30 September 2026, filed 5 November 2026, https://www.sec.gov/Archives/edgar/data/1403161/000140316126000134/v-20260930.htm — The payment walkthrough and the settlement indemnification. Re-read 17 November 2026.\n  - Mastercard Incorporated, Form 10-K for 2025, filed 11 February 2026, https://www.sec.gov/Archives/edgar/data/1141391/000114139126000013/ma-20251231.htm — The three network services, the settlement guarantee and its limit, interchange through settlement. Re-read 17 November 2026.\n  - Federal Reserve Board, Average Debit Card Interchange Fee by Payment Card Network, last update 19 December 2025, https://www.federalreserve.gov/paymentsystems/regii-average-interchange-fee.htm — Definitions of dual-message and single-message networks.\n  - Stripe documentation (hold, multicapture, balances, payouts, Instant Payouts, multi-currency settlement), n.d., accessed 17 November 2026 — Capture models and deadline, pending and available, settlement timing and what T counts from.\n  - Adyen documentation (capture, adjust authorisation, getting paid, sales day payout, upgrade to Sales day payout, pass-through payout, balances, settle funds) and Sales Day Payout Terms of Service (17 June 2024), accessed 17 November 2026 — Capture models and webhooks, late capture, payable batches, payout delay, pre-financing and its reversal.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 80 claims checked (67 confirmed, 4 corrected, 6 hedged, 1 unsupported and relabeled, 0 unreachable; 2 rows are labeled industry practice with no source); Adyen's reversal webhooks are disabled by default, not separate subscriptions, and the Larkfield timeline now states Adyen's documented payout and bank processing times next to the best-case Thursday arrival.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Journal-spec entry corrected by the author (Adyen's pre-financing is documented; consistency ruling 18); intent, thesis and role recopied and the blocking open question cleared.\n- **2026-11-17** — Flow rubric by a fresh agent: sound with notes. Acted on: section 8 claim now names all five differences; conclusion wording on the fee. Not acted on, for the author: move the cost and dispute consequences of p14 to p37 so interchange is met once where it is defined; shorten the Where They Differ section, which repeats p24 to p26; gloss chargeback and reversal in p39.\n- **2026-11-17** — First draft from PLAN.md, the journal spec and the cards and ledger briefs. Left at draft: the journal-spec entry states that pre-financing by either provider is not public, which Adyen's terms and documentation contradict (see open questions).\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry thesis.claim (ruling 18: a payout is not necessarily after network settlement) re-synced; journal entry AC-1 expected (ruling 18) re-synced). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 9 statements of absence re-tested with a wide search (0 overturned, 2 narrowed, 7 hold; table in _research/absence-audit/03-clearing-and-settlement.md). Narrowed: Visa publishes US interchange rates by program (the qualification guide stays unpublished); Stripe's services terms count a network's failure to settle to Stripe as a payout delay, though no pre-financing is stated for standard payouts.\n- **2026-11-17** — Cross-chapter conflict settled: one caveat added after Adyen's pre-financing (the Annual Report 2025 calls paying 'only after funds have been received' the 'default setup'; not reconcilable with the terms from public text), with a link to chapter 13, which owns the
