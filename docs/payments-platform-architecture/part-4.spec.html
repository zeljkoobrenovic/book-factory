<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part IV answers five questions in order: what the API exposes, how a request is made safe to repeat, how the API changes, how the provider reports later outcomes, and what surrounds the API.\n- **Know:** Which of Larkfield's 2026 incidents each chapter explains.\n- **Be able to:** Pick the Part IV chapter that answers the integration decision or incident in front of them.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to III and are about to start the interface chapters, or who arrive with one integration decision or incident (a timeout, a forced upgrade, a missing event, a refused batch) and want the chapter that addresses it.\n\n**Already knows:**\n\n- APIs, HTTP, webhooks as a mechanism, retries, rate limits and version numbers as general engineering.\n- Parts I to III: a payment is a chain of promises settled over days, modeled by the provider as states and recorded in a ledger that is proven against networks and banks.\n- Larkfield in outline: a fictional studio-software platform that uses Stripe and Adyen, and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- Idempotency key, version pinning, at-least-once delivery, retry window, restricted key, load shedding: each is owned by a Part IV chapter and is only named or glossed in a clause here.\n- What Stripe and Adyen each document for these contracts; the page gives one or two figures per chapter and leaves the evidence to the chapter.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order and state the part's claim in one sentence. *Probe:* After reading only this page: what does Part IV argue, and what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with the four Larkfield incidents with their ledger figures and does not explain their mechanisms, which belong to the chapters. | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How can an API make a payment that takes days and several parties look like one call without misleading the developer who calls it?\n\n> **Claim:** It can do so only by giving the developer a contract for each case the single call hides (a stable identity and state for each payment, a key that lets a request with an unknown outcome be repeated, a pinned version that lets the provider change the interface underneath, and events for outcomes that arrive after the response) and by stating the limits of time, volume and permission within which each contract holds, so that those limits are part of the interface the developer builds against.\n\n**Disputed by:** The view that a payment API is a product surface whose quality is its simplicity: the endpoints are the interface, and idempotency keys, version pins, webhooks and limits are advanced features that a team adds when it grows.\n\n**So what:** A team that accepts the claim reads four numbers before it writes code (how long keys are kept, how long events are retried, how long a version is served, how many requests are allowed) and keeps its own record of every payment for whatever falls outside them.\n\n**How and why:** The call returns in seconds, while the response can be lost, the outcome can arrive hours later, and the integration outlives many API releases. The provider can cover each case only by remembering something for the developer: the object, the key, the version, the undelivered event. Remembering costs storage and compatibility work, and a shared API must be protected from any one caller, so each contract has a limit. The documented limits differ between the two companies, which is why an integration is built to its provider's terms and not to the idea: Stripe's API v1 keeps a key for at least 24 hours and retries a webhook for up to three days; Adyen keeps a key for 7 to 14 days and retries for up to 30 days (both from documentation accessed in November 2026). How either company implements these mechanisms is published only in part, much of it in Stripe engineering posts from 2017.\n\n**Supporting claims**\n\n- **P4-1** — An integration survives years of new payment methods when it depends on a stable identifier, a normalized vocabulary of states and refusals, and an explicit line between what the response answers and what arrives later; where the current state can be read back differs between Stripe and Adyen.\n- **P4-2** — A timeout leaves the outcome of a payment request unknown, and a retry is safe only with the same key, derived from the business event, sent while the provider still remembers it.\n- **P4-3** — Pinning each integration to the version it was built against lets a provider change its API, and moves the cost of change onto the provider's code and the integrator's eventual upgrade without removing it.\n- **P4-4** — Outcomes that arrive after the response are delivered as events at least once, for a limited time and in no guaranteed order, so an event is a notice to store and then confirm against the provider's record (the object where it can be read back, the report where it cannot), not the final word.\n- **P4-5** — Credentials, test environments and request limits are the limits of permission and volume on the other four contracts: they decide who may call, what a passing test run has shown (shapes and states, not production volume or issuer behavior) and how much may be sent.\n\n## Role in the part\n\nPerforms the part's opening: the four incidents at the API boundary, the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on four dated incidents at one company, widens them into what they share (in each the response was not the whole exchange) and then into the part's claim (a contract for each case one call hides, each with a stated limit), and narrows again: to the five questions in order, then to one paragraph per chapter. The incidents come first because the claim is an abstraction that the reader accepts only after seeing four concrete ways a response fell short. The claim has to precede the chapter list because each chapter paragraph names its contract and its limit, and a reader who has not been told that there are contracts with limits reads the list as five API features. The chapter paragraphs keep the part's reading order, which the journal spec justifies as prerequisite order (objects before the mechanisms that speak about them, the key before the version, both before events, limits last because the earlier chapters create the traffic that meets them); reordering them here would contradict the roadmap. The closing comes last because it maps the opening's incidents onto chapters the reader has by then been shown.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Four of Larkfield's eight incidents happened in 2026 at the provider's API and not in the money. In March a forced SDK upgrade moved the billing integration across a breaking release, and subscription revenue reports were wrong for 6 days. On 14 September a webhook receiver's certificate expired, events failed for 9 hours, and 3,200 memberships were shown as unpaid. On 1 October the renewal job hit the provider's rate limit, and 7,900 renewals were delayed to the next day. On 1 November a provider call timed out, the job retried with a new idempotency key, and 1,840 members were charged twice.\n\n**Bridge:** The reader's experience of a payment API as a request and a response, and Part III's provider seen from inside, where every movement is recorded twice and proven over days. → The same provider seen from outside by a developer who gets an answer in seconds, and the four cases in which that answer was not the whole exchange: it never arrived, its shape changed, the outcome came later by another channel, or the request was refused for volume.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2 and paragraph p03): An API can make a payment that takes days and several parties look like one call only by giving the developer a contract for each case the call hides (an identity and state for each payment, a key that makes a request repeatable, a pinned version, events for later outcomes) and by stating the limits of time, volume and permission within which each contract holds.\n\n**Roadmap** (paragraph p04):\n\n- Five chapters in order: what the API exposes (objects, identifiers, errors); how a request is made safe to repeat; how the API changes without breaking integrations; how the provider reports what happens after the response; and the keys, test environments and limits around all of it. Each sets Stripe's and Adyen's documented terms side by side and says where the public record stops. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Four of Larkfield's incidents in 2026 happened at the provider's API and not in the money: a forced upgrade that left revenue reports wrong for 6 days, an expired certificate that showed 3,200 memberships as unpaid, a rate limit that delayed 7,900 renewals and a retry under a new key that charged 1,840 members twice. | scenario: The Version Cliff (March 2026, subscription revenue reports wrong for 6 days); the Silent Webhook (Monday 14 September 2026, certificate expired shortly after midnight, events failed for 9 hours, 3,200 memberships shown as unpaid, members turned away that morning); the Renewal Wave (1 October 2026, 7,900 renewals delayed to the next day); the Double Charge (1 November 2026, 1,840 members charged twice). Larkfield is named as fictional here. |  |\n| p02 | analysis | In each of the four incidents the code treated the API as a request and a response, and the response was not the whole exchange, in the incidents' own order: its shape had changed (the upgrade), the outcome was waiting in another channel (the events behind the expired certificate), the request was refused for volume (the rate limit), or it never arrived (the timeout). | reasoning: The four incidents matched one to one, in the order of p01, with the four ways a response falls short; set against Part III, where the provider proves each movement over days while the developer gets an answer in seconds. | `cause_effect`: The four incidents and their figures. → What they have in common: the response was not the whole exchange, in four different ways. |\n| p03 | claim | The part's claim is that an API can make a slow, multi-party payment look like one call only by giving a contract for each case the call hides (identity and state, a repeatable request, a pinned version, events for later outcomes) and by stating the limit within which each holds, and the documented limits differ between Stripe and Adyen. | fact: Stripe's API v1 keeps an idempotency key for at least 24 hours and retries an undelivered webhook for up to three days; Adyen keeps a key for 7 to 14 days and retries for up to 30 days (documentation accessed November 2026, as cited in idempotency-and-retries and payment-webhooks-and-events).; figure: Figure: one call on the surface and, behind it, four contracts (state, key, version, events), each with a boundary, with the integrator's own record beyond the boundaries. | `problem_solution`: The four ways a response was not the whole exchange. → The part's answer: a contract for each hidden case, each with a stated limit, and the two providers' different limits. |\n| p04 | transition | The five chapters take the contracts in the order each depends on the last (what the API exposes, how a request is made safe to repeat, how the API changes, how later outcomes are reported, and the keys, test environments and limits around all of it), and each says where the public record of Stripe's and Adyen's implementation stops. | fact: How either company implements these mechanisms is published only in part, much of it in Stripe engineering posts from 2017 (idempotency, rate limiters, versioning), as the chapters report with evidence-age marks.; figure: Figure: the five chapters as a widening scope: the objects, one request, one integration over years, every event the provider sends, all callers at once. | `sequence`: The contracts and their limits. → The order in which five chapters take them, and the edge of the public record. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question about a contract the single call hides, states the two providers' documented terms for it, and explains one Larkfield case.\n\n**Advances the thesis** (P4-1, P4-2, P4-3, P4-4, P4-5): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The roadmap's five questions in order. → One paragraph per chapter: the question in bold, the two providers' terms and the Larkfield case.\n\n**Order of paragraphs** (`prerequisite_order`): The object model comes first because the other four chapters speak about its objects, identifiers and errors. Idempotency follows because it resolves the question the object model leaves open, the response that never arrives. Versioning follows as the second thing a provider remembers for the integrator, for years instead of hours. Webhooks come after both: the unknown outcome defined under idempotency is what events resolve, and the pinned version fixes the shape of what the provider sends. The developer platform is last because its limits are met by the traffic the earlier chapters create. Putting webhooks before idempotency would separate the unknown outcome from its definition; putting the developer platform first would present limits before the reader knows which calls must never be refused.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | The API-design chapter answers what makes a payment API usable for ten years: an integration should depend on a stable identifier, a normalized vocabulary of states and refusals, and an explicit line between what the response answers and what arrives later, and Stripe and Adyen differ in where the current state can be read. | fact: Stripe returns objects that can be fetched again by identifier; Adyen's Checkout API returns a reference and a result code and has no call that returns a payment (specification v72, 2026).; scenario: Larkfield's payment service has a call named get payment that reads Larkfield's own table and has never asked either provider (fictional). |  |\n| p06 | description | The idempotency chapter takes the question the object model leaves open, the response that never arrives, and answers how to make 'charge this card' safe to send twice: the same key, derived from the business event and stored before the first send, while the provider still remembers it. | fact: At least 24 hours on Stripe's API v1, 7 to 14 days on Adyen (documentation accessed November 2026).; scenario: The Double Charge: the renewal job generated a key per network call, so each retry was a new payment; 1,840 members, €71,300 refunded (fictional). | `problem_solution`: The object model, in which a create request returns an identifier. → What the integrator holds when that response never arrives, and the key that makes a second send the same intention. |\n| p07 | description | The versioning chapter turns to a second thing the provider remembers for the integrator, for years, and answers how an API integrated long ago can change: each integration keeps the version it was built against, which moves the cost of change without removing it. | fact: Stripe pins one dated version by account default, header or SDK release and has shipped breaking changes in two named major releases a year since October 2024; Adyen puts a number in each API's URL and gives a deprecated Checkout API version two years before end-of-life (documentation accessed November 2026).; scenario: The Version Cliff: one library upgrade moved the billing integration across three years of changes in one step; reports wrong for 6 days (fictional). | `similarity`: The idempotency key as something the provider remembers for hours or days. → The version as something it remembers for years, with the same question of what happens when the memory ends. |\n| p08 | description | The webhooks chapter reverses the direction, the provider calls the integrator, in a shape the pinned version fixes and with a twin of the lost response, the event that never arrives; it answers what a receiver may assume: only that an unacknowledged event is sent again while a retry window is open, so an event is a notice to store and then confirm against the provider's record. | fact: Stripe retries for up to three days and disclaims order; Adyen asks for a 2xx within 10 seconds and queues a failing endpoint's events for up to 30 days; the confirming record is the object at Stripe and the settlement report at Adyen (documentation accessed November 2026).; scenario: The Silent Webhook of Monday 14 September 2026: nine hours inside a three-day window, so every event came again, but for those hours Larkfield read a missing event as 'unpaid' (fictional). | `contrast`: Three chapters in which the integrator calls and the provider answers; the lost response of the idempotency chapter and the pinned version of the versioning chapter. → The reversed direction, with the provider's rules for acknowledgement, retry, order and authenticity. |\n| p09 | description | The developer-platform chapter follows from the traffic the earlier chapters create and answers what else must exist around an API: credentials that limit what each caller can do, a test environment whose gaps are stated and request limits an integrator can plan for, each a term of the contract. | fact: Stripe documents 100 requests a second per account in live mode and 25 per endpoint; Adyen publishes no rate limit for its payments APIs (documentation accessed November 2026).; scenario: The Renewal Wave of 1 October 2026: refusals for volume were recorded as failed payments, and 7,900 members got an email about a payment no bank had declined (fictional). | `cause_effect`: Stored keys, reads after every event, sweeps and upgrade rehearsals. → All of that as traffic on a shared API, sent with credentials, rehearsed in test and subject to limits. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the chapters widen from one payment's identity to every caller of the API at once; read by need, each of the opening's four ways a response falls short has its own chapter, and the first chapter says what can be read back in every one of them.\n\n**So what:** A reader with an incident in front of them can name the contract that was assumed to be wider than documented and open that chapter first.\n\n**Callback:** The four incidents of p01 and the four ways a response was not the whole exchange (p02). Each way is matched to the chapter that covers it: a lost response, a changed shape, a missing event, a refused request.\n\n**Takeaway** (`course_of_action`): Begin with payment-api-design, the first contract: a stable identity and state for each payment; or open the chapter that matches the incident in front of you.\n\n**Hand-off** to [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html): `elaboration`: The part intro's claim that an API must give contracts for the cases one call hides, the first being a stable identity and state for each payment. → What that identity and state look like in the two providers' APIs, and what an integrator must store when the provider does not return it later.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | synthesis | Each of the opening's four ways a response falls short has its chapter (a lost response, a changed shape, a missing event, a refused request), and all four rest on the first contract, a stable identity and state for each payment, which is where to begin. |  |  |\n\n## Non-goals\n\n- Teaching object models, idempotency, versioning, webhook delivery or keys and limits; the page summarizes and does not explain the incidents' mechanisms (AC-2). See [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html), [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html), [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html), [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html).\n- The part's closing (every protection has an edge; the five terms to write down per provider; Keel decisions K1, K2, K5 and K7 as restated contracts). See [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure-pattern callout and Questions to Ask; part intros do not carry them (style guide).\n- External factual claims of the page's own; every company statement repeats a chapter of the part, which cites it.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The post entry in the journal spec has a question and no thesis. A part intro performs the part's opening, so this spec uses the part's thesis and its supporting claims P4-1 to P4-5 unchanged; intent outcome, AC-1, AC-2 and role are copied from the post entry; hook, bridge and roadmap from the part's opening. Rejected: Writing a separate thesis for the page: it would restate the part's claim.\n- **2026-11-17** — The closing sits under its own short heading, 'Where to Begin', after 'Chapters in this part' and ends on 'Begin with [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html).', as the Part II introduction does; the structure check needs a headed region for the conclusion (coordinator's instruction of 17 November 2026). Rejected: Ending the chapter list itself with the 'Begin with' sentence: the conclusion would have no units.\n- **2026-11-17** — The hook says 'four of the eight incidents this book keeps returning to', not 'four of Larkfield's eight incidents in 2026', because the ledger dates the Unexplained €0.4 Million to year-end 2025. The Silent Webhook is dated Monday 14 September 2026 and no weekend day is named (ruling 20). Rejected: Copying the journal spec's wording 'eight incidents in 2026'.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-4: thesis, opening, flow, transition_in; post entry part-4; payment-api-design's transition_in) — Intent, thesis, role, hook, bridge, roadmap, the order of chapters and the hand-off.\n  - _research/scenario-ledger.md — The four incidents and their figures; the additions by chapters 17 to 21.\n  - posts/17-api-design-and-object-models, 18-idempotency-and-retries, 19-api-versioning, 20-webhooks-and-events, 21-developer-platform (index.md, read in full) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n  - _research/consistency-issues.md (rulings 4, 5, 12, 13, 20, 22) — Ownership of 'confirm against the provider's record' and of request limits; where Adyen's payment state can be read; the date of the Silent Webhook; no external URLs in running text.\n  - _research/INTR sitemap, the help center and web searches; both hold. No change to the page.\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
