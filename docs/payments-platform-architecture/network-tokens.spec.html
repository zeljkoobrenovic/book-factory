<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a network token is, how it differs from a provider token, and the roles of token requestor and token service provider.\n- **Know:** What a cryptogram is and what happens to a token when the card behind it is reissued.\n- **Know:** What Visa, Mastercard, Stripe and Adyen have each claimed about approval rates and fraud, with dates, and what those figures do and do not measure.\n- **Know:** How Stripe and Adyen each expose network tokens, as documented in November 2026.\n- **Believe:** A stored card now has several representations, and the provider, not the merchant, chooses which one is sent on each attempt.\n- **Believe:** Published token uplift figures are vendor comparisons and cannot be compared with one another.\n- **Be able to:** Explain why a membership keeps renewing after the member's card is replaced, and what the merchant's own record may no longer show correctly.\n- **Be able to:** Question an uplift figure before using it in a business case.\n- **Be able to:** Say which party requested a token and why that matters when changing providers, and where the public record does not answer.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a stored card whose underlying card is reissued, the reader says what happens to the next charge and what the merchant's records should and should not assume. *Probe:* A streaming service stores cards with one provider, which has network tokens (substitute card numbers issued by the card network) switched on. A subscriber's bank replaces her card with a new number. What happens to next month's charge, and what should the service's own customer record assume about the card? | `custom` | cold_reader | major |\n| AC-2 | Given a quoted uplift figure for network tokens, the reader says what kind of evidence it is and what to ask before relying on it. *Probe:* A sales deck says: 'Network tokens lift approval rates by 6%.' What would you want to know before putting that number into a business case? | `custom` | cold_reader | major |\n| AC-3 | Network fee amounts are attributed in the sentence to the processor bulletins or consultancy they come from, and the chapter says that the networks' fee schedules are not public. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** What is a network token, who issues it, and why are networks pushing every stored card toward one?\n\n> **Claim:** A network token is a substitute card number that the card network issues for one card at one merchant or device, at the request of a merchant, provider or wallet, and maps back to the real card during authorization; the networks push stored cards toward it with stated targets and with fees on untokenized transactions, and the effect of that push is to make the network, instead of each merchant's or provider's vault, the place where a stored credential is kept valid, restricted and priced.\n\n**Disputed by:** The view that a network token is a security upgrade with a free approval-rate gain, which a merchant switches on once and can then forget.\n\n**So what:** A merchant should treat the provider token as its record key and never assume which credential was sent, keep the fall-back to the card number, re-check each year the two fee lines that are moving (charges on stored-card transactions sent without a token, and charges for token and updater services), and ask who requested its tokens before counting on them in a change of provider.\n\n**How and why:** EMVCo describes the token as constrained to a merchant, device or payment scenario, and because the network holds the mapping it can re-point the token when a card is reissued and attach a one-time cryptogram to a cardholder's use. The push is documented: Mastercard stated on 11 June 2024 a goal of 100% e-commerce tokenization in Europe by 2030, and processor bulletins report network fees since October 2023 on card-number transactions that are neither tokenized nor authenticated. The networks' stated reasons are less fraud and an end to manual card entry; that the push also moves control of the stored credential to the network is the chapter's reading of those facts and is labeled as the author's synthesis, not as a motive the networks have stated. The reported gains are the vendors' own: Visa's release of 4 June 2024 says a 'six-basis point' approval increase, Adyen (2024) reports 3% on average, and Stripe reports 3.8% for a bundle of three features. The two providers expose tokens differently, as documented in November 2026: Stripe provisions them automatically and chooses token or card number per payment, showing the merchant a read-only field and documenting no integration for a merchant's own tokens; Adyen offers an Adyen-managed mode and a merchant-managed mode, returns per-attempt data, and supports tokens only on payments it acquires. Whether tokens a provider requested move with a merchant that leaves is answered for Adyen only: its terms (13 June 2025) describe a Network Token Sharing Service for use with other payment providers, with the cryptogram still supplied by Adyen; no Stripe statement was found.\n\n**Supporting claims**\n\n- **C1** — A network token is a substitute card number that the card network issues as token service provider, at the request of a merchant, provider or wallet, and unlike a provider token it travels to the issuer in place of the card number.\n- **C2** — Because the network holds the mapping from token to card, it can restrict the token to its requestor, attach a one-time cryptogram and re-point the token when the card is reissued, while the provider, which still holds the card number, chooses per attempt which credential to send.\n- **C3** — The networks push stored cards toward tokens with stated targets, with fees on untokenized transactions that are known only from processor bulletins, and in India by law; the effect is to make the network the place where the stored credential is kept valid, restricted and priced.\n- **C4** — The published approval and fraud gains are vendors' own comparisons of tokenized with untokenized volume on different metrics and bundles, and cannot be compared with one another or taken as a merchant's expected gain.\n- **C5** — Stripe and Adyen expose tokens differently as documented in November 2026, and whether tokens a provider requested move with a merchant that leaves is answered for Adyen only, by a sharing service in its terms (13 June 2025).\n- **C6** — What stays with the merchant is a record keyed on the provider token that never assumes which credential was sent, displayed card details that must be refreshed, a fall-back to the card number, and a yearly review of fee lines and of who the token requestor is.\n\n## Role in the part\n\nShows the second relocation: the stored credential moves from the provider's vault to the card network, and what the merchant gains and can no longer assume. Supports P5-2 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene and in-practice: the renewal nobody can explain, then the rule that explains and records it; `comparison` in designs and where-they-differ)\n\nThe reader meets a payment that should have failed before any term is defined, so the vocabulary arrives as the answer to a question already asked. The two tokens are distinguished first because every later section depends on knowing which token is meant. The mechanism follows because the push, the gains and the designs all rest on one fact it establishes: the network holds the mapping and the token belongs to its requestor. Wallets and Click to Pay come straight after the mechanism, while it is fresh, and before the push, because Mastercard's stated aim names them. The push precedes the gains because the fees are the cost of not tokenizing and the gains are the claimed benefit of doing so; a reader needs both before choosing a design. Designs come before the company comparison so the table can say which design each company documents. Larkfield's rule and the failures come last because they use every earlier section. Moving the gains ahead of the mechanism would ask the reader to judge a tokenized-versus-untokenized comparison before knowing why some cards have no token.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A member's bank replaces her card after fraud at another shop. She tells nobody. On the first of the next month her gym membership is charged as usual and approved, although the card number the studio's software stored no longer exists, and the app still shows the last four digits of the dead card.\n\n**Bridge:** An engineer expects a stored credential to be a value in someone's database: if the value changes at the source and nobody updates the copy, the next use fails. → A stored card is no longer one value. Beside the card number in the provider's vault and the provider's token in the merchant's database there is a third number, issued by the card network, that the network keeps pointing at whatever card the bank has issued last.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p02): A network token is a substitute card number that the card network issues for one card at one merchant or device, at the request of a merchant, provider or wallet, and maps back to the real card during authorization; the networks push stored cards toward it with stated targets and with fees on untokenized transactions, and the effect is that the network, not each vault, becomes the place where a stored credential is kept valid, restricted and priced.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from a Larkfield renewal that succeeded on a card the member no longer has, and return to it with a rule for the payment record. *Kept in:* scene, in-practice.\n- Define the network token against the provider token, with the parties that request and issue it. *Kept in:* two-tokens.\n- Follow a token from provisioning through the cryptogram to a reissued card, and say what it does not promise. *Kept in:* mechanism.\n- Place wallets, Click to Pay and payment passkeys as the same token with other requestors. *Kept in:* other-requestors.\n- Set out why the networks push: targets, fees and one legal mandate. *Kept in:* push.\n- Read the published approval and fraud figures and say what they measure. *Kept in:* uplift-figures.\n- Compare three ways to hold tokens, then Stripe and Adyen. *Kept in:* designs, where-they-differ.\n- Show how tokens fail in production and how each failure is noticed. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A membership is charged and approved on a card the member's bank has already replaced, and nothing in the merchant's own records explains why it worked or which card paid. | statistic: Stripe's newsroom release of 23 February 2023: \"Last year, approximately 40% of cardholders replaced their cards as a result of the card expiring, getting lost, or being compromised by fraud.\" (Evidence age: 3.7 years; refers to 2022; Stripe gives no source.) |  |\n| p02 | claim | The renewal worked because the number sent to the bank was a network token, a substitute the card network issues and keeps valid, and the networks' push toward it moves the keeping, restricting and pricing of stored credentials from each vault to the network. |  | `cause_effect`: The renewal that succeeded on a replaced card. → What made it succeed and what that changes: the chapter's thesis. |\n| p03 | context | On the journey of Mila's class pass the token was already there, as the device token in her phone's wallet, and this chapter is about the same mechanism applied to the card stored for her monthly membership. | scenario: Mila's class pass, 9 March 2027, paid from a phone wallet with device authentication; her EUR 49.00 membership set up on 12 January 2027 by typing the card and renewed on the 1st of each month as a merchant-initiated payment (ledger; consistency ruling 14). | `place`: The network token as the thing sent to the bank. → Where it appears in the book's recurring payment. |\n| p04 | transition | The chapter goes from a Larkfield renewal to the two kinds of token, the mechanism, the token's other forms, the networks' push, the published gains, three ways to hold tokens, the comparison of Stripe and Adyen, Larkfield's rule and the failures. |  | `sequence`: The chapter's place on the payment's journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: The Renewal That Should Have Failed\n\n**Controlling idea** (`example`, id `scene`): One approved renewal at Larkfield leaves three different card numbers in three places, and nobody at Larkfield chose which one went to the bank.\n\n**Advances the thesis** (C2, C6): Poses the chapter's question with a concrete payment before any term is defined: a credential changed behind the merchant's key without the merchant's action.\n\n**Transition in:** `example`: The introduction's claim that the network now keeps the stored credential valid. → One Larkfield member whose renewal shows it.\n\n**Order of paragraphs** (`chronological`): The member's question, then what the engineer finds behind it, then the questions it raises; the questions are the following sections, so they come last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In March 2027 Lotte Smit, a member of Studio Noord, asks support which card paid her EUR 49.00 renewal on 1 March, because the app shows a card ending 4417 that her bank replaced in February. | scenario: Lotte Smit (fictional), Studio Noord, EUR 49.00 monthly membership on a Dutch Mastercard debit card ending 4417, stored since 2025; her bank replaces the card in February 2027 (new number ending 8052); the renewal of 1 March 2027 is approved; she writes to support on 3 March (new ledger facts, appended). |  |\n| p06 | analysis | Tom Hendriks finds three numbers for the one payment: the dead card's last four in the payment record store, the new card's last four in an optional field of the provider's response that Larkfield never switched on, and a third number, the one that went to the bank, that Larkfield has never held. | fact: Adyen documents optional response fields 'networkToken.tokenSummary' (\"The last four digits of the network token\") and 'latestCard.summary' (\"The last four digits of the card\"), and says that with Adyen-managed tokens \"we automatically swap that for a network token\". | `cause_effect`: Lotte's question about which card paid. → What the records show when an engineer looks. |\n| p07 | claim | Femke de Graaf turns the ticket into four questions: who issued the third number, who asked for it, who decides which number is sent on each attempt, and what it costs to send the old kind. |  | `cause_effect`: Three numbers for one payment, none chosen by Larkfield. → The questions that the chapter's sections answer. |\n\n### Two Tokens With One Name: The Provider's and the Network's\n\n**Controlling idea** (`definition`, id `two-tokens`): A provider token is a key into one provider's vault that the bank never sees, while a network token is a substitute card number issued by the card network that travels to the bank in place of the card number, so one stored card now has three representations issued by three parties.\n\n**Advances the thesis** (C1): Defines the network token, token requestor and token service provider against the provider token the previous chapter established.\n\n**Transition in:** `elaboration`: Femke's first question: who issued the third number. → The difference between the provider's token and the network's.\n\n**Order of paragraphs** (`prerequisite_order`): The known token first, then the new one defined against it, then the parties that request and issue it, then the three representations side by side, which needs all three terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | The token Larkfield holds is a provider token: an identifier that means something only inside one provider's vault, which the bank that issued the card never sees. | quotation: Stripe describes its own tokens as \"a nonsensitive string that can be used only by the business that collected the card\". |  |\n| p09 | definition | A network token is a substitute card number issued under the EMV payment tokenization standard, restricted in where it can be used, and carried through the acquirer and the network to the issuer in the authorization itself. | quotation: EMVCo: \"an EMV Payment Token is constrained in how it can be used. For example, to a specific merchant, device or payment scenario\"; and it is used \"from point of purchase, to an acquirer and then passing across the payment networks through to payment authorisation by the card issuer\", whereas \"within the merchant environment tokenisation can happen between the merchant and acquirer\".; quotation: Adyen: \"A network token is 16-digit alternative for the Primary Account Number (PAN), and is unique per combination of shopper and merchant.\" | `contrast`: A token that stops at the provider's vault. → A token that goes all the way to the issuer. |\n| p10 | definition | Two roles define a network token: the token requestor, which asks for it and is the only party that may use it, and the token service provider, in practice the card network, which issues it and holds the mapping to the card. | quotation: EMVCo's registration programme: the TSP Code \"is included in the Token Requester ID, which uniquely identifies the pairing of Token Requester with the Token Service Provider\".; quotation: Adyen's explainer: \"A network token can be requested by a merchant, payment gateway, or payment processor.\" Visa names its service the Visa Token Service; EMVCo's Technical Framework v2.4 was published on 9 July 2026 and was not read for this chapter. | `elaboration`: A token issued under a standard and restricted in use. → The two roles the standard defines, requestor and issuer of the token. |\n| p11 | comparison | One stored card therefore exists in three forms, each issued by a different party and valid in a different place, and only the network token stays valid when the bank issues a new card. | table: Three rows (card number, provider token, network token) by who issues it, who can use it, whether the issuer sees it, and what happens when the card is reissued.; figure: Illustration: one card with three representations held by three parties. | `conclusion_summary`: The provider token, the network token and the roles behind it. → The three representations of one card, compared. |\n\n### From Request to Reissue: Provisioning, Cryptograms and the Choice per Attempt\n\n**Controlling idea** (`process`, id `mechanism`): Because the network holds the mapping from token to card, it can restrict the token to its requestor, demand a one-time cryptogram, and re-point the token when the card is reissued; and because the provider still holds the card number, the provider chooses on each attempt which of the two to send.\n\n**Advances the thesis** (C2): Explains the mechanism that makes the token stay valid and restricted, and shows that the credential sent is the provider's choice per attempt.\n\n**Transition in:** `sequence`: Three representations of one card and the roles of requestor and token service provider. → How a token comes to exist and what happens each time it is used.\n\n**Order of paragraphs** (`chronological`): The life of one token in the order it happens: it is requested, restricted, given a cryptogram for a use, chosen or not on each attempt, and re-pointed months later when the card is reissued, which is the step that explains the opening scene; the list of what it does not promise closes the section because each limit refers to a step already described.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | process | A token is provisioned when the requestor sends the card number to the network, the network asks the issuer, and the issuer agrees, so a token exists only for cards whose issuers take part. | quotation: Adyen: \"The requestor sends a PAN to the card scheme, which forwards the request to the issuer. The issuer approves the request, and the network issues the token.\" Visa (4 June 2024): \"over 8,000 issuers are enabled for tokenization\". Stripe's documentation index tells readers not to \"assume every card or payment is eligible for network tokenization\".; figure: Illustration: provisioning (requestor to network to issuer and back) and then an authorization carrying token and cryptogram that the network translates for the issuer. |  |\n| p13 | explanation | The network binds each token to the party that requested it, so a token stolen from one merchant or provider cannot be used by another. | quotation: Adyen: \"Tokens are domain-locked, meaning the same token can only be used by the party that requested it.\" Stripe's analytics documentation: network tokens are \"payment credentials that you can dynamically restrict to specific businesses and channels\". | `sequence`: A token that now exists for one card. → The restriction the network attaches to it. |\n| p14 | definition | A cryptogram is a one-time value the network generates for one use of one token, which proves the request comes from the token's holder and costs a call to the network before the authorization. | quotation: Adyen: \"card schemes issue a cryptogram each time a customer uses their saved card details to initiate a purchase. These cryptograms are effectively one-time-passwords that are contextual to the business, token, and purchase.\" Adyen's API names the field 'tokenAuthenticationVerificationValue': \"This is the network token cryptogram.\"; quotation: Stripe: \"using a network token often requires a one-time cryptogram that needs to be fetched from networks. As a result, network tokens can be prone to high additional latency compared to using PANs.\" | `additional_support`: The restriction of a token to its requestor. → A second control, applied per use: the cryptogram. |\n| p15 | explanation | The provider keeps the card number beside the token and decides on each attempt which to send, and may retry with the other, so the stored-card record alone never says which credential reached the bank. | quotation: Stripe: \"determining when to use a network token or the underlying PAN. We maintain PAN redundancy to retry failed network token transactions on the underlying PAN\". Adyen: \"If a payment attempt with a network token fails (attempt1), we automatically retry the payment. In the second attempt (attempt2), we do not swap the card details or the storedPaymentMethodId token for a network token.\" | `contrast`: A token with its restriction and its cryptogram. → The card number the provider still holds beside it, and the provider's choice between the two on each attempt. |\n| p16 | process | When the bank issues a new card, the network re-points the token at it, so the requestor keeps sending the same token and the merchant does nothing. | quotation: Stripe: \"if a customer lost their card, Stripe would get notified by the network and would update the token directly so it would continue to work without the customer having to update their payment information.\" Adyen: \"if the shopper receives a new card because the old one expired or was lost, the network token remains the same.\"; figure: Illustration: before and after a reissue; the card changes, the token and the merchant's key do not, the merchant's displayed last four goes stale. | `time`: A token and a card number, one of them chosen per attempt. → What happens months later when the card behind the token is replaced: the token is re-pointed and the card number in the vault is the one that goes out of date. |\n| p17 | analysis | A network token promises continuity and restriction, and it does not promise approval, coverage, speed or a record of what was sent. | table: 'What it promises / What it does not promise' in four rows: continuity after reissue (not coverage of every card), restriction to the requestor (not protection against a card number typed in by a thief), a current credential (not an approval: Stripe \"doesn't guarantee any outcomes\"), a per-use cryptogram (not speed). | `conclusion_summary`: Provisioning, restriction, cryptogram, the per-attempt choice and reissue. → What the mechanism does and does not guarantee. |\n\n### The Same Token Under Other Names: Wallets, Click to Pay and Passkeys\n\n**Controlling idea** (`explanation`, id `other-requestors`): A phone wallet's device token, a Click to Pay card and a payment passkey are the same network-issued credential with a different requestor or a different way of proving the cardholder is present.\n\n**Advances the thesis** (C1): Shows that 'at the request of a merchant, provider or wallet' covers credentials the reader already meets under other names.\n\n**Transition in:** `similarity`: A token requested by a provider for a stored card. → The same kind of token requested by other parties.\n\n**Order of paragraphs** (`order_of_importance`): Three neighbours of the stored-card token, ordered from the most established (wallets) to the least (passkeys, in pilot), so the reader meets the documented ground before the moving one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | explanation | A wallet payment such as Mila's class pass carries a device token: a network token whose requestor is the wallet and whose restriction is the device, with the cryptogram produced when she unlocks the phone. | quotation: Adyen: \"Apple Pay uses network tokenization, stores payment information securely in the shopper's Apple Pay eligible device, and confirms the payment through Touch ID or Face ID authentication.\" Google: the API returns \"cards on file on Google.com (PAN_ONLY) or a device token on an Android-powered device authenticated with a 3-D Secure cryptogram (CRYPTOGRAM_3DS)\". Stripe's forwarding API sends Apple Pay device numbers through fields named 'network_token_number' and 'network_token_cryptogram'. |  |\n| p19 | explanation | Click to Pay moves the stored card itself to the network: the cardholder keeps cards in a profile with Visa or Mastercard, and the merchant receives a token. | quotation: Adyen: \"The card scheme is responsible for securely storing the cardholder data and issuing tokens.\" and \"Currently, Adyen's Click to Pay integration only supports recurring payments on Mastercard Click to Pay.\" Mastercard (11 June 2024): \"To eliminate manual card entry, Mastercard is making it easier to embed Click to Pay into merchant sites\". No Stripe page on Click to Pay was found in its documentation index. | `additional_support`: A token requested by a wallet. → A token issued from a card the network itself stores. |\n| p20 | explanation | Payment passkeys attach a device-bound proof of the cardholder to a tokenized payment, and as of November 2026 they are a pilot at Adyen and undocumented at Stripe. | quotation: Adyen's press release of 29 October 2026: \"Adyen will initially offer Visa Payment Passkey through Authenticate in the UK, with further enhancements and a global expansion planned for 2027.\" Adyen's documentation: \"Scheme passkeys are currently in pilot phase, and only enabled for a specific group of merchants\" and \"Scheme passkey authentication is supported for Mastercard network tokenized transactions.\" Stripe's documentation index has no page that mentions passkeys for card payments. | `additional_support`: Cards stored by the network. → A way to authenticate the cardholder that builds on the token. |\n\n### Why the Networks Push: Targets, Fees and One Legal Mandate\n\n**Controlling idea** (`analysis`, id `push`): The networks push stored cards toward tokens with public targets and with fees on card-number transactions that are neither tokenized nor authenticated, fee amounts are known only through processor bulletins, and the effect of the push is to make the network the place where the stored credential is kept valid, restricted and priced.\n\n**Advances the thesis** (C3): Documents the push (targets, fees, a mandate) with source quality stated, and separates the networks' stated reasons from the author's reading of the effect.\n\n**Transition in:** `cause_effect`: Tokens now sit behind stored cards, wallets and network checkouts. → Why the networks want every stored card on one, and what they do to get there.\n\n**Order of paragraphs** (`small_to_large`): From the softest instrument to the hardest (a stated vision, fees on untokenized payments, fees on tokens themselves, a law), then the author's reading, which needs all four in view.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | The networks state their aim in public: Mastercard has a vision of full e-commerce tokenization in Europe by 2030, and both report that a quarter or more of their transactions already use tokens. | quotation: Mastercard (11 June 2024): \"Mastercard today announced its vision for 100% e-commerce tokenization in Europe by the end of the decade. This supports a global commitment to phase out manual card entry\"; its tokenization service \"today secures 25% of all e-commerce transactions globally\". Visa (4 June 2024): \"Currently, 29% of all transactions processed by Visa use tokens\" and \"more than 10 billion tokens since the technology's launch in 2014\". |  |\n| p22 | evidence | Since October 2023 processor bulletins report network fees in Europe on stored-card and e-commerce transactions sent with a card number and neither a token nor 3-D Secure, and the networks' own fee schedules are not public. | quotation: Braintree's 2023 bulletin: \"Effective 1 October 2023: Visa will introduce a new fee of 2.5bps (0.025%) per transaction for domestic and interregional ecommerce primary account number (PAN)-approved authorizations processed without Visa EMV Payment Tokens (network tokenization) or Visa Secure (3D Secure)\" (evidence age: 3 years). Its fall 2026 bulletin: Mastercard revises the Customer Performance Development Fund from 1 January 2027, \"four rate changes phased in over three years, aimed at driving tokenization and authentication\", and \"In April 2028, Guest Checkout will be included in the non-token fee\"; it calls these \"behavioral fees intended to drive tokenization and authentication\". | `additional_support`: A stated aim. → The price attached to not following it. |\n| p23 | evidence | A second fee line is appearing on the tokens themselves and on the services that keep credentials current, so the token is moving from a discount to a priced service. | quotation: Stripe: \"Stripe doesn't reflect any fees that might occur as a result of network token use, such as the Visa Digital Credential Updater (VDCU) fee\" and \"Mastercard levies a Credential Continuity Program (CCP) fee when attempting a payment using outdated card details\". Adyen (2024): \"Some schemes, like Visa, might charge a fee for the management of issued tokens. They still charge lower fees for processing tokens than for processing PANs.\" CMSPI (2026): \"Beginning in April 2026, Visa will introduce a Card-Present Token Fee on authorized network-tokenized card-present transactions.\"; table: The fee lines by direction (charged for not tokenizing, charged for tokens and updates, reduced for tokens), with the source and its kind in each row. | `contrast`: Fees for sending no token. → Fees for the token and its upkeep. |\n| p24 | evidence | In one market the push is law: India's central bank forbids merchants and payment providers to store card numbers, so a stored card there can only be a token. | quotation: Stripe's India page: \"The RBI mandates card on file (CoF) tokenization through the card networks\"; \"Businesses, Payment Aggregators (PAs), Payment Gateways (PGs), and acquiring banks can no longer store customer card information\"; and \"Cards won't be automatically tokenized\" without the customer's consent. | `emphasis`: Fees that make card numbers more expensive. → A market where storing them is forbidden. |\n| p25 | analysis | The networks give fraud and the end of manual card entry as their reasons; the author's reading is that the push also moves the keeping, restricting and pricing of a stored credential from each merchant's or provider's vault to the network. | reasoning: The network holds the mapping (so it keeps the credential valid), sets the domain controls (so it restricts it), and sets the fees on both the token and its absence (so it prices it). The stated reasons are Mastercard's \"phase out manual card entry and make e-commerce safer\" and the bulletin's \"to help reduce fraud and improve approval rates\". | `conclusion_summary`: Targets, two fee lines and a mandate. → The stated reasons, and the author's reading of the combined effect. |\n\n### What the Gain Is Worth: Four Figures That Cannot Be Compared\n\n**Controlling idea** (`analysis`, id `uplift-figures`): The published approval and fraud gains from tokens are the vendors' own comparisons of tokenized with untokenized volume, they differ in metric, bundle and scale by up to a factor of one hundred, and only a measurement on the merchant's own traffic says what a token is worth to it.\n\n**Advances the thesis** (C4): Tests the 'free approval-rate gain' half of the view the thesis disputes against what the sources actually say.\n\n**Transition in:** `contrast`: The cost of not tokenizing. → The benefit claimed for tokenizing, and how well it is evidenced.\n\n**Order of paragraphs** (`problem_solution`): The figures first, exactly as published, then why they cannot answer a merchant's question (what kind of evidence they are, for approvals and then for fraud), then the measurement that can; the method only makes sense once the figures have been shown not to answer the question.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | evidence | Four published figures describe the approval gain, and no two of them measure the same thing. | table: Visa, 4 June 2024: \"a six-basis point increase in payment approval rates globally\"; CMSPI (2026), citing Visa: \"a 6% improvement in authorized rates\"; Adyen (2024): \"an average uplift of 3% in authorization rates for businesses on our platform who use network tokenization\"; Stripe (n.d.): \"Increase acceptance rates by 3.8% on average with Authorisation Boost\", a bundle of three features; Doist via Stripe (2023): \"increase subscription auth rates by over 4%\" with two features. |  |\n| p27 | analysis | Each figure is a vendor's comparison of payments that used a token with payments that did not, with no published method, and the two groups differ in more than the token. | reasoning: Visa's footnote gives the basis as \"VisaNet CY2023 credit and debit global card-not-present (CNP) payment volume for tokenized and non-tokenized credentials\". A token exists only where the issuer takes part and is mostly attached to stored cards of returning customers; those payments would be approved more often anyway. Visa's release says six basis points (0.06 percentage points); a secondary source quotes six percent for the same effect. | `cause_effect`: Four figures that disagree. → Why they cannot be reconciled: what each one compares. |\n| p28 | analysis | The fraud figures are the same kind of comparison, and they describe fraud that reuses a stolen credential, not a stolen card number typed into a checkout. | quotation: Visa (4 June 2024): \"tokenization can reduce the rate of fraud by up to 60%\" and tokens \"saved $650 million in fraud in the last year\", footnoted to \"Risk Datamart CY2023, Visa Processed global card-not-present (CNP) payment volume for tokenized vs non-tokenized credentials\". | `similarity`: Approval figures that are vendor comparisons. → Fraud figures of the same kind, and what they leave out. |\n| p29 | recommendation | Both providers return enough per-payment data to measure the token's effect on your own traffic, provided like is compared with like. | fact: Adyen returns 'retry.attemptN.networkTokenOffered' and the raw response per attempt when the merchant enables \"Include the retry attempts\". Stripe's Charge object has 'payment_method_details.card.network_token.used' (\"Indicates if Stripe used a network token, either user provided or Stripe managed when processing the transaction\"), its acceptance analytics has a 'Network token usage' dimension, and its optimization page estimates recovered volume by attributing each payment \"to the one most likely responsible for approval\", stating that \"The optimization calculations we provide are estimates\". | `problem_solution`: Published figures that do not answer the merchant's question. → The data each provider returns for answering it. |\n\n### Three Ways to Hold Tokens, and What Each Leaves You\n\n**Controlling idea** (`comparison`, id `designs`): A merchant can let its provider be the token requestor, become the requestor itself, or use an independent vault as requestor, and the choice decides who can use the tokens when the merchant changes provider; Adyen's terms describe a service that shares tokens for use with other providers, still dependent on Adyen for each cryptogram, and Stripe says nothing on whether tokens it requested move with a merchant that leaves.\n\n**Advances the thesis** (C5, C6): Turns 'who requested the token' into a design choice with trade-offs, and marks where the evidence on portability stops.\n\n**Transition in:** `cause_effect`: A token belongs to the party that requested it, and its worth has to be measured. → The design choice that follows: who should be the requestor.\n\n**Order of paragraphs** (`comparison`): The three designs described, then compared in a table with the conditions for each, then the question the comparison raises and cannot fully answer from public sources.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | description | The requestor can be the provider, the merchant or an independent vault, and each is documented somewhere. | fact: Provider as requestor: Stripe \"will request tokens on your behalf\"; Adyen \"We collect and store network tokens from the card schemes\". Merchant as requestor: Adyen's merchant-managed mode (\"you can keep your existing network tokens and use them in the payment requests that you send to Adyen\"), with limits (\"It is not possible to combine this with our tokenization feature\"; \"You cannot use 3D Secure for transactions with network tokens that you manage yourself\"); Stripe's product page says businesses can \"bring external tokens for processing\". Independent vault: Spreedly describes itself as a \"Token Requestor Token Service Provider (TR-TSP)\" through which merchants \"request network tokens using their merchant-specific TRID\" (contrast case). |  |\n| p31 | comparison | Letting the provider request the tokens costs nothing to build and ties them to that provider, while requesting them yourself or through a vault buys continuity across providers at the price of network enrollment, card-data scope and lost provider features. | table: Three designs by what the merchant builds, PCI scope, what works across providers, what is lost, and when it is the right choice (author's judgement). | `cause_effect`: Three documented designs. → What each costs and when each is right. |\n| p32 | analysis | Whether tokens that a provider requested can follow a merchant to another provider is answered only by Adyen, whose terms describe a sharing service that still needs Adyen's cryptogram for each cardholder payment; Stripe says nothing, and the reasonable planning assumption is that the tokens do not outlive the contract. | fact: Adyen: \"a token cannot be used by a party other than its requestor\". Stripe's export page describes an encrypted file with \"the card details of your customers, email addresses, and any attached metadata\" and does not mention network tokens. Adyen's Additional Services Terms (last updated 13 June 2025), clause 4: the Network Token Sharing Service \"allows Adyen to share Network Tokens with its customers (i.e., Merchants or Platforms) for them to store and/or use to process payments with other payment providers\"; for a customer-initiated transaction at another provider \"you will need to retrieve a one-time cryptogram from us\". No Adyen documentation page describes an export; its Forward API says \"We support forwarding card details, and network tokens\" to a third party, per request and enabled by Support. | `problem_solution`: A comparison that turns on portability. → What the public record says, and does not say, about tokens moving between providers. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Stripe documents network tokens as something it does for the merchant with a read-only report of the result, while Adyen documents two modes, per-attempt data and a limit to payments it acquires.\n\n**Advances the thesis** (C5): Sets the two providers' documented handling side by side, as of November 2026.\n\n**Transition in:** `example`: Three designs for holding tokens. → Which of them each of the two providers documents, and how.\n\n**Order of paragraphs** (`comparison`): The table first, because the advice is read off its rows; then what an integrator does differently on each provider.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison | On seven aspects of network tokens the two companies document different things, and the difference follows who is allowed to be the requestor and how much of each attempt the merchant is shown. | table: Rows: provisioning; who may be the requestor; token or card number per attempt; what the merchant can see; scope and limits; reported gain and price; leaving. Stripe and Adyen cells are quotations from the sources above; the last column is the author's reading. |  |\n| p34 | recommendation | On Stripe an integrator reads what was done and listens for card updates; on Adyen it first decides the mode, asks for the attempt data and checks that the payments in question are acquired by Adyen. | fact: Stripe: the 'payment_method.automatically_updated' event \"notifies you of automatic card updates from the network\" and includes \"the card's new expiration date and last four digits\". Adyen: \"Network tokenization is only applicable for payments acquired by Adyen. It cannot be used with external acquirer connections.\" | `cause_effect`: The differences in the table. → What an integrator does differently on each. |\n\n### In Practice at Larkfield: Memberships That Survive a Reissued Card\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield keeps the provider token as its key, records per attempt whether a token was used, refreshes what it displays from the provider's update signals, and adds the token requestor and the two moving fee lines to its yearly review.\n\n**Advances the thesis** (C6): Applies the chapter to the opening payment with ledger numbers and turns the remainder left with the merchant into a rule.\n\n**Transition in:** `example`: What each provider documents. → The same facts applied to Lotte Smit's renewal and to Larkfield's stored cards.\n\n**Order of paragraphs** (`chronological`): What happened in Lotte's renewal, then the rule Larkfield writes from it, then the money the rule's fee review looks at; the answer to Lotte needs the first, the fee review needs the rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | explanation | Lotte's renewal was sent with a network token that the card network had re-pointed at her new card in February, and Larkfield's record went stale because nothing told it to change. | scenario: Studio Noord is on Adyen with Adyen-managed tokens; the renewal of 1 March 2027 for EUR 49.00 is approved at the first attempt; Larkfield had not enabled the optional 'latestCard' fields; fee 1.9% + EUR 0.25 = EUR 1.18, studio receives EUR 47.82 (illustration; the provider behavior is the one documented in the mechanism section). |  |\n| p36 | recommendation | Under decision K4 Larkfield writes one rule for stored cards: the provider token is the key, each attempt records whether a token was used, and the card shown to a member is refreshed from the provider and never used as proof of which credential paid. | fact: Adyen: 'retry.attemptN.networkTokenOffered', 'latestCard.summary', 'latestCard.expiryDate'. Stripe: 'network_token.used' on the Charge, and the 'payment_method.automatically_updated' event; \"If the card update includes a new card number, the fingerprint changes.\" Ledger K4: \"network tokens for stored cards\". | `problem_solution`: A record that went stale without anyone noticing. → The rule that keeps the record honest. |\n| p37 | analysis | The fee side is small per payment and worth a yearly line in the review: at the reported 2.5 basis points an untokenized, unauthenticated EUR 49.00 renewal costs about one cent, and across the card renewals on Adyen, where Larkfield's pricing passes network fees through, about EUR 2,600 a month at most. | scenario: About 210,000 card renewals a month on Adyen at EUR 49.00 = EUR 10.29 million (ledger addition of chapter 9, an assumption); 2.5 bps of that = EUR 2,572 a month, an upper bound that assumes every renewal is a Visa card sent with a card number and no authenticated first payment. Larkfield is on pass-through pricing with Adyen and a blended rate with Stripe (ledger additions of chapter 5), so the line is visible only on the Adyen invoice. The Braintree bulletin adds that related merchant-initiated transactions \"that are in scope for tokens or 3DS will avoid the behavioral fee\", and Mila's membership was set up with 3-D Secure on 12 January 2027. Femke adds two columns to the acquirer inventory of chapter 6: token requestor, and fee lines reviewed. | `additional_support`: A rule for the record. → A review for the fees, with its size. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Tokens fail in four ways a merchant can detect: a card identity that changes under its own rules, one call that hides two authorizations, a cost that the savings estimate leaves out, and tokens left behind in a change of provider.\n\n**Advances the thesis** (C6): Shows what the view 'switch on once and forget' costs, failure by failure, with the signal that reveals each.\n\n**Transition in:** `contrast`: A renewal that went right and a rule written in time. → The ways tokens go wrong in production, and how each is noticed.\n\n**Order of paragraphs** (`grouping`): Four failures ordered from the one inside the merchant's own data, through the one at the payment call and the one on the invoice, to the one that appears only when the merchant leaves; each is further from daily view than the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | cause_effect | When a card is replaced behind a token, anything the merchant keyed on the card's fingerprint or last four digits silently changes meaning: duplicate-card checks, fraud rules and what support tells a member. | quotation: Stripe: \"If the card update includes a new card number, the fingerprint changes.\" |  |\n| p39 | cause_effect | When a token attempt is declined and the provider retries with the card number, one API call contains two authorizations, and a merchant that retries on its own schedule on top can spend the network's retry allowance faster than it thinks. | fact: Adyen's documented example: attempt1 with 'networkTokenOffered' true and response code 05, attempt2 with 'networkTokenOffered' false and response code 00. Stripe names the latency of fetching a cryptogram. Network retry limits are covered in the chapter on authorization optimization. | `similarity`: A change the merchant's data does not show. → A second attempt the merchant's call count does not show. |\n| p40 | cause_effect | When the saving from tokens is taken from the provider's estimate, token and updater fees are missing from it, so the net effect has to be read from the invoice. | quotation: Stripe: \"Stripe doesn't reflect any fees that might occur as a result of network token use, such as the Visa Digital Credential Updater (VDCU) fee. Any such fees reduce the overall cost saving benefits from network tokens.\" Stripe's price list (Ireland locale) shows \"EUR 0.15 per token provisioned for accounts without Authorisation Boost and with custom interchange pricing\". Adyen's prices for network tokenization are not public. | `contrast`: Failures in the payment path. → A failure on the invoice. |\n| p41 | cause_effect | When stored cards are migrated to another provider, the tokens the old provider requested stay behind as the designs section assumed, and the consequence is that the first billing cycle on the new provider runs on card numbers as they were exported, some of them already replaced. | reasoning: Adyen: tokens can \"only be used by the party that requested it\". Larkfield's K8 switch never moves stored cards (ledger addition of chapter 10); the planned migration of the 1,140 studios still on Stripe online to Adyen is an export and import of card numbers (chapter 22's exit sheet). That the first cycle after a migration sees more declines on stale numbers is an inference from these facts, not a measured result. | `emphasis`: Costs that show up in a year's invoices. → The cost that shows up only on the day the merchant moves. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The definition, the mechanism, the fees and the designs are one change seen from four sides: the stored credential has moved up a level. The merchant holds a key to the provider's vault, the provider holds a key to the network's mapping, and the network alone knows which card is current, who may use the token and what it costs to use or to avoid.\n\n**So what:** A team that treats network tokens as a switch will show members cards that no longer exist, count one authorization where there were two, book a saving its invoice does not confirm and discover on the day it changes provider that the tokens were never its own. A team that treats them as a credential someone else keeps will record what was sent, listen for what changed, measure the gain itself and ask who the requestor is before it needs to know.\n\n**Callback:** The opening renewal: approved on a card the member's bank had replaced, with the dead card still on screen. The reader can now say that the network re-pointed a token the provider had requested, that the provider chose to send it, and that the stale digits were the one part left to the merchant.\n\n**Takeaway** (`course_of_action`): Key stored cards on the provider token; record per attempt whether a token was used; refresh displayed card details from the provider's signals; keep the fall-back to the card number; measure the gain on your own traffic; review the two fee lines and the token requestor once a year.\n\n**Hand-off** to [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html): `problem_solution`: Chapters 22 and 23 protected the credential: the number is in a vault, or replaced by a token restricted to one merchant. → The problem those controls leave open: a card number stolen elsewhere is typed into the checkout by someone who is not the cardholder, and something has to judge each use of a card, not the storage of it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis (list) | Established: what a network token is and who issues it, that the network re-points it on reissue, that both providers keep the card number and choose per attempt, and that the networks have stated the direction. |  |  |\n| p43 | synthesis (list) | Depends on context: who should be the requestor, whether the published gain applies to your traffic, and whether the fee lines reach you at all. |  | `contrast`: What the field agrees on. → What changes with the merchant's providers, pricing and volume. |\n| p44 | recommendation (list) | The author's synthesis: since the stored credential now lives at the network, the provider token is the merchant's only stable key, the uplift is unproven until measured, and the requestor question belongs in the contract. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p45 | recommendation (list) | Eight questions let the reader test a provider's or a design's handling of network tokens in a review. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p46 | transition | A vault and a token protect the stored credential, and neither can tell whether the person typing a card number into a checkout is its owner, which is the problem the next chapter takes up. |  | `problem_solution`: A credential protected in a vault or replaced by a restricted token. → The use of a stolen number at checkout, which needs a judgement per payment. |\n\n## Non-goals\n\n- PCI DSS scope, hosted fields, the vault, provider tokens in depth, card import and export procedures. See [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html).\n- Account updater services in depth, retry rules and network retry limits, measuring uplift with a holdout. See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html).\n- 3-D Secure flows, liability shift, exemptions and how passkeys authenticate. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- Fraud models, risk scores and card testing. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- Routing between providers, orchestration products and forwarding APIs as a routing tool. See [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- Interchange, scheme fees and pricing models in general. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Tokens in the in-person flow beyond the wallet's device token. See [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- EMVCo's Technical Framework (v2.4, 9 July 2026) was not read; role definitions rest on EMVCo's public pages and on Adyen's and Stripe's descriptions. The article says so.\n- Whether a merchant-initiated renewal sent with a network token carries a cryptogram is not stated in any source read; Adyen's explainer ties the cryptogram to a customer-initiated purchase. The article states the gap.\n- Whether Stripe's 'payment_method.automatically_updated' event fires when only the token's mapping changes (and not the vaulted card) is not stated on the pages read.\n- Adyen's pages disagree on whether network tokens are on by default ('automatically requests network tokens for stored cards when possible' against 'ask our Support Team to enable payments with network tokens').\n- The journal spec's how_why says Stripe chooses token or card number 'with no interface for the merchant'. Stripe's API reference lists a read-only field, payment_method_details.card.network_token.used, and its product page says merchants can 'bring external tokens'. The article says there is no documented control over the choice and reports the read-only field; the journal entry may want the same nuance.\n- Mastercard's token service name (Mastercard Digital Enablement Service) is confirmed only through a third party's documentation (Spreedly); Mastercard's developer pages were not reachable.\n\n## Decision log\n\n- **2026-11-17** — The scene uses a new fictional member, Lotte Smit, whose card is replaced, instead of Mila Janssen: the ledger fixes Mila's card and her April decline, and a reissue would conflict with other chapters. Rejected: Reissuing Mila's Visa debit card in February 2027\n- **2026-11-17** — Ten body sections: the style guide's fixed elements (scene, designs with a trade-off table, Where They Differ, In Practice, When It Goes Wrong) plus four content sections; wallets, Click to Pay and passkeys get one short section because the contract says 'briefly'. Rejected: Folding wallets into the mechanism section; A separate section on India\n- **2026-11-17** — Fee amounts appear only with the bulletin or consultancy named in the sentence, and the Larkfield fee figure is an upper-bound illustration; the networks' schedules are stated to be not public (AC-3). Rejected: A fee table presented as network rates\n- **2026-11-17** — Three figures: three representations of one card; provisioning and authorization flow; before and after a reissue. Rejected: A fourth figure of the three designs\n- **2026-11-17** — After the flow rubric (sound with notes): the per-attempt choice now precedes the reissue so the mechanism section is strictly chronological and ends on the step that explains the scene; the uplift section's pattern is declared as problem_solution; the comparison section has a declared order; the last failure refers back to the designs section and adds only the consequence; the synthesis bullet states consequences instead of repeating the push paragraph. Not acted on: merging the two-paragraph 'Where They Differ' section into the designs section (the style guide requires it as its own section) and moving wallets after the push (kept beside the mechanism it reuses). Glosses for 3-D Secure, updater, fingerprint, K4 and the retry allowance are given in the prose where first used. Rejected: Merging 'Where They Differ' into the designs section\n\n## Sources\n\n- **Internal**\n  - PLAN.md — The chapter contract: question, scope, owned terms (network token, token requestor, cryptogram, credential lifecycle), Larkfield thread.\n  - journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged; the previous and next chapters' transitions.\n  - _research/brief-card-data-tokens-and-authentication.md — Part 3 (EMVCo, Visa and Mastercard claims, fees and mandates, how each provider exposes tokens, wallets, Click to Pay and passkeys), section 2.4 (portability), open questions.\n  - _research/brief-optimization-routing-orchestration.md — Sections 3.2 and 3.3 (tokens and updater as approval levers), 4.1 (Authorization Boost packaging and prices), 8 and 9 (forwarding, Spreedly as contrast).\n  - _research/scenario-ledger.md — Mila's class pass and membership, K4 and K8, the card renewal volumes added by chapter 9, the acquirer inventory added by chapter 6.\n  - _research/consistency-issues.md — Rulings 8 (chapter 9 glosses the network token and links here), 14 (Mila's pass is a wallet payment), 17 (Mastercard facts through provider or secondary sources).\n- **External**\n  - Stripe: guide 'Understanding the benefits of network tokens'; documentation 'Payments optimization', 'Cards', 'Acceptance analytics', 'India network tokenization', 'Request a payment data export', 'Forward card details'; API reference 'The Charge object'; product page 'Authorization Boost' (n.d., accessed November 2026); newsroom release of 23 February 2023 — Provisioning, per-attempt choice, latency, lifecycle, fee notes, update event, read-only token field, prices, the 40% replacement figure; fetched 17 November 2026.\n  - Adyen: documentation 'Network tokenization', 'PAN fallback for network tokens', 'Tokenization', 'Forward payment details', 'Apple Pay', 'Click to Pay', 'Scheme passkeys' (n.d., accessed November 2026); knowledge hub 'Optimize card payments with network tokenization' (September 2024); press release of 29 October 2026 — Modes, limits, attempt data, requestor flow, cryptogram, 3% figure, fees, wallets, passkey status; fetched 17 November 2026.\n  - EMVCo public pages on EMV Payment Tokenisation and the Token Service Provider Registration Programme (n.d., accessed November 2026) — Definition of the payment token, the contrast with merchant-side tokenization, the TSP Code and Token Requester ID.\n  - Visa press release of 4 June 2024; Mastercard newsroom release of 11 June 2024 — Adoption figures, the 'six-basis point' and 'up to 60%' claims with footnotes, the 2030 vision.\n  - PayPal Braintree network-update bulletins (2023 and fall 2026); CMSPI article (2026); Spreedly documentation (n.d.) — secondary sources — Network fee amounts and dates; the 6% citation; the independent-vault design.\n\n## Changelog\n\n- **2026-11-17** — Absence audit: 9 statements of absence re-tested with a wide search (documentation sitemaps, support and help centers, company sites and legal terms, web search). Overturned for Adyen: 'neither says whether tokens it requested can follow a merchant that leaves' (Additional Services Terms, 13 June 2025: Network Token Sharing Service for use with other payment providers, with a cryptogram from Adyen per cardholder payment). Narrowed: 'the networks do not publish their fee schedules' (interchange tables are public; network fee schedules are not). Others hold; two sentences now say what was searched. One source added; section and paragraph controlling ideas and one evidence item aligned. The thesis claim copied from the journal spec ('not answered in the public record') is now false for Adyen and was not edited.\n- **2026-11-17** — Verification pass: 83 claims checked (66 confirmed, 7 corrected, 10 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the most significant fix: Stripe does document Click to Pay (its Secure Remote Commerce guide, United States only, onboarding paused), and Adyen's own request examples show that a subscription payment with a merchant-managed token carries no cryptogram.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — First version, written from PLAN.md, the journal spec and the card-data and optimization research briefs.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('chooses token or card number per payment with no interface f' -> 'chooses token or card number per payment, showing the mercha').\n- **2026-11-17** — Reconciliation after verification (17 November 2026): AC-2 expected answer says one secondary source attributes six percent to Visa (it cites a different Visa text).\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Whether tokens a provider requested move with a merchant tha' -> 'Whether tokens a provider requested move with a merchant tha').\n- **2026-11-24** — Sweep of rulings 46-48: thesis how_why no longer says token portability is 'not answered in the public record': Adyen's terms (13 June 2025) answer it for Adyen; no Stripe statement (ruling 48d). Prose unchanged.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
