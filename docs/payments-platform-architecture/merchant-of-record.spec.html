<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between a processor, a payment facilitator and a merchant of record: who is the seller to the buyer, whose name is on the card statement, who owes the indirect tax, who handles a dispute and who pays for it.\n- **Know:** What Stripe documents for Managed Payments as of November 2026: first in the preview API version 2026-02-25.preview and in a release version since 22 April 2026, 3.5% per successful transaction on top of payment fees, digital products sold directly, the customer sees 'Sold through Link', no Connect platforms, countries where the tax liability does not transfer, and service terms under which the business remains the seller of record and pays for disputes, refunds and reversals.\n- **Know:** That Paddle and the app stores are the contrast cases, and that Adyen states it does not act as a merchant of record.\n- **Believe:** Merchant of record is an operating model that changes the checkout, the statement name, the invoice issuer and who holds customer data; it is not a setting on a payment integration.\n- **Believe:** A liability can be handed to a provider only by letting the provider become the seller to the customer, and only as far as the provider's contract says.\n- **Be able to:** Decide for a stated business whether a merchant-of-record provider fits, and list what the business gives up.\n- **Be able to:** Explain why a platform whose sellers are the merchants cannot solve its tax and dispute burden this way.\n\n**Audience:** A software engineer or architect who has read Part VI's chapters on billing, invoicing, tax and revenue recognition and wonders whether a provider can take those obligations away.\n\n**Already knows:**\n\n- The billing engine, the invoice and its collection (subscriptions-and-billing-engines, invoicing-collections-and-dunning).\n- That a provider's tax product calculates and collects while the liability stays with the seller (billing-and-payment-tax).\n- Chargebacks and who answers a dispute (refunds-reversals-and-disputes).\n- Larkfield, its two providers, its two kinds of sale and Mila's class pass (meet-larkfield).\n\n**Does not yet know:**\n\n- Merchant of record, seller of record, liability transfer, payment facilitator as a role distinct from the seller.\n- What Stripe documents for Managed Payments, and what Adyen says about acting as a merchant of record.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two businesses the chapter does not contain, the reader says which can use a merchant-of-record provider, what it gives up, and why the other cannot. *Probe:* Business A is two people selling a €15-a-month note-taking app to consumers in 40 countries. Business B is a booking platform that takes payments for 500 independent hair salons. Which of them could put a merchant-of-record provider in front of its sales, what would it give up, and why can the other not? | `custom` | cold_reader | major |\n| AC-2 | The reader can fill a three-column comparison of processor, payment facilitator and merchant of record for seller, statement name and tax liability. *Probe:* For a processor, a payment facilitator (a provider that lets many businesses accept cards under its own agreement with the card networks) and a merchant of record: in each case, who is the seller to the buyer and who owes the sales tax or VAT? | `custom` | cold_reader | major |\n| AC-3 | The chapter's closing synthesizes the part around where the invoice lives, returns to Larkfield's 1 October and 1 November 2026 renewals, and hands off to Part VII through the fact that Larkfield's studios, not Larkfield, are the sellers. | `conclusion_calls_back_to_introduction` | rubric | major |\n| AC-4 | The explanation of why Adyen has no merchant-of-record product is labeled as inference while Adyen's position is given as its own published statement, the Managed Payments release history is cited to Stripe's own pages, and no sentence says that the cost of disputes, refunds or reversals moves to the provider under Stripe's terms. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** What changes when the provider, not you, is the merchant of record?\n\n> **Claim:** When the provider is the merchant of record it sells your product to the customer in its own name, and only part of the seller's position moves with that. Under Stripe's Managed Payments, the one arrangement whose contract terms this chapter reads (as of November 2026), the provider's entity is the name on the customer's bank statement and the invoice, is the supplier for indirect tax wherever local rules let that transfer, and handles fraud screening, disputes and transaction support; the business remains the seller of record, books the revenue and pays the full cost of disputes, refunds and reversals, on top of a fee and the loss of control over the checkout, the eligible products and the integration. Because the provider must itself be the party the customer buys from, this is an operating model, not a feature added to a payment integration, and it does not fit a platform whose sellers are third parties: Managed Payments, in a release version of the API since 22 April 2026, takes digital products sold directly and excludes Connect platforms. Adyen states that it does not act as a merchant of record.\n\n**Disputed by:** The view that a merchant of record takes the seller's liabilities whole, the cost of fraud and disputes included, so that a business can switch it on as a compliance add-on to an existing integration; and the view that it is a payment facilitator under another name.\n\n**So what:** The reader can decide fit from the business model before reading a price list: a small seller of an automated digital product in many tax jurisdictions gains most, and a business that needs its own checkout, sells goods or human-delivered services, or pays other sellers is excluded or loses more than it gains. A business that adopts the model still budgets for lost disputes and refunds, and reads the provider's contract to see what moves. It also explains why Larkfield cannot hand its studios' tax and disputes to such a provider: the studios are the sellers.\n\n**How and why:** Tax authorities and card networks hold the party that sells to the customer responsible, so a provider can take over the indirect tax and the name on the statement only by selling in its own name, and a party that sells in its own name decides what it sells and how. How much else moves is set by the provider's contract, not by the term. Stripe's service terms (last modified 28 September 2026) make its affiliate Sold through Link, LLC the merchant of record and the supplier 'for Indirect Tax purposes only', say that it 'is not the seller of record' and 'will not book the revenue', and keep the business liable 'for the full amount of any Disputes, refunds, and Reversals': Stripe handles a dispute and the business pays for it. The terms thus split two roles: merchant of record and tax supplier move to Stripe's affiliate, while seller of record and the revenue stay with the business. Stripe's documentation shows the other consequences: a fee of 3.5% on top of payment fees, the customer sees 'Sold through Link', only Checkout and Payment Links are supported, access depends on an eligibility review, and in some countries (Japan for domestic sales, for example) the tax liability does not transfer. Paddle sells the role as one bundled price and says it acts as the seller, and app stores are its older form. The release history is in Stripe's own pages: announced on 7 May 2025, in the preview API version 2026-02-25.preview, in the release version 2026-04-22.dahlia, and open to all digital businesses according to Stripe's blog of 29 April 2026; no page read uses the words 'generally available', and Apple's public developer agreement (Schedule 2, 13 October 2026) appoints Apple as agent or commissionaire depending on the region. Adyen's article of 15 September 2026 says that it 'doesn't act as a direct, third-party merchant of record'; that it offers no such product because its enterprise merchants are their own sellers in each market is the author's inference, not a documented reason.\n\n**Supporting claims**\n\n- **S1** — Tax authorities and card networks hold the seller responsible, so a processor and a payment facilitator leave the tax and the seller's identity with the business; only a merchant of record moves them, and it does so by selling to the customer in its own name, with the rest of what moves set by its contract.\n- **S2** — Stripe's Managed Payments documents what the change of seller does: Link's name on the statement, the receipt and the invoice; tax, fraud, disputes and transaction support handled by Stripe; refunds, dispute decisions and part of the customer data no longer wholly the business's own; and service terms that keep the seller-of-record role, the revenue and the full cost of disputes, refunds and reversals with the business, for 3.5% on top of payment fees.\n- **S3** — A seller must control what it sells and how, so the model is restricted to automated digital products sold directly through the provider's own checkout; it fits a small seller in many tax jurisdictions and excludes a platform whose sellers are third parties.\n- **S4** — Merchant-of-record providers differ in how much they bundle (a layer per transaction, one bundled price, an app store), and all of them trade a higher fee, less control and a harder exit for the duties the provider takes over.\n- **S5** — Adyen states that it is not a merchant of record, so the comparison is between Stripe's product and being your own seller on Adyen's infrastructure; why Adyen offers none is an inference.\n\n## Role in the part\n\nCloses the part with the limiting case: instead of carrying the seller's obligations yourself, let the provider sell in its own name, and see which obligations move and which stay. It also carries the part's closing and sets up Part VII by showing a model that platforms cannot use. Supports P6-6, P6-5 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: Sofie Vermeer's question is posed in the first section and answered in the sixth; `comparison` in three-roles, designs and where-they-differ)\n\nThe reader meets a request that sounds like configuration, then gets the one distinction that decides it (who the seller is) before any product. Stripe's documentation comes next because it is the only detailed public account of what the change of seller does, and the other forms can then be described by how they differ from it. The Adyen comparison follows the forms because Adyen's stated position ('act as your own') is only intelligible once the reader knows what acting as someone else's seller involves. Larkfield's two answers come after both, since one answer depends on Stripe's eligibility rules and the other on Adyen's position. Moving the roles after the product would leave 'the customer sees Link as the merchant of record' undefined; moving Larkfield's answers before the comparison would answer for 56% of its volume without the Adyen fact.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On 22 April 2026 a new parameter reached a release version of Stripe's API. Set managed_payments[enabled] to true on a checkout session and, the changelog says, Stripe handles indirect tax compliance in more than 80 countries, fraud prevention, dispute management and transaction-level customer support. Five chapters of obligations appear to end with one boolean. What the boolean changes is who the seller is.\n\n**Bridge:** An engineer reads a provider's feature as configuration: a flag that adds a capability to an integration that otherwise stays the same. → This flag changes who sells to the customer, and with it the checkout, the name on the card statement, the issuer of the invoice and who decides a refund; that is why it works only for some products and some businesses.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): A merchant of record sells your product in its own name: its name goes on the card statement and the invoice, and it takes over the indirect tax, wherever local rules let it transfer, and the handling of fraud and disputes, in exchange for a fee and for control; on Stripe the cost of a lost dispute stays with the business. A liability can be handed over only by letting the provider become the seller to the customer, and only as far as its contract says, so the model does not fit a platform whose sellers are third parties. Adyen states that it is not a merchant of record.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from a question Larkfield's chief executive asks in May 2027: can the provider become the seller? *Kept in:* scene.\n- Separate the processor, the payment facilitator and the merchant of record by who the seller is. *Kept in:* three-roles.\n- Read Stripe's Managed Payments documentation for what changes when the provider sells. *Kept in:* managed-payments.\n- Compare the three forms the model takes (a layer, a bundle, a store) and say when it fits. *Kept in:* designs.\n- Put Stripe and Adyen side by side. *Kept in:* where-they-differ.\n- Answer Larkfield's question for its two kinds of sale, and list how the model fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A single API parameter appears to remove the obligations of the previous five chapters, and what it changes is the identity of the seller. | fact: Stripe changelog, 22 April 2026 (API version 2026-04-22.dahlia, the first release version with the parameter; it first appeared in the preview version 2026-02-25.preview): 'When you set managed_payments.enabled to true, Stripe handles indirect tax compliance (in more than 80 countries), fraud prevention, dispute management, and transaction-level customer support.' https://docs.stripe.com/changelog/dahlia/2026-04-22/managed-payments.md |  |\n| p02 | claim | A liability can be handed to a provider only by letting the provider become the seller to the customer, and only to the extent its contract says, which makes merchant of record an operating model with a price in money, control and customer data, one that a platform with third-party sellers cannot use and that Adyen says it does not offer. |  | `problem_solution`: The boolean and the obligations it seems to remove. → What it really changes, and the thesis in plain words. |\n| p03 | context | Mila's class pass has a seller, Studio Noord, and this chapter stands beside the payment's path to ask whether that seller could have been somebody else. | scenario: Mila's €120.00 ten-class pass from Studio Noord, 9 March 2027; Larkfield is not the merchant of record for class sales, the studio is the seller. | `place`: The chapter's claim. → Its bearing on the recurring payment. |\n| p04 | transition | The chapter goes from a question at Larkfield, through the three roles and Stripe's documented product, to the forms the model takes, the comparison with Adyen, Larkfield's two answers and the ways the model fails. |  | `sequence`: Where the chapter stands relative to the journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Can Somebody Else Be the Seller?\n\n**Controlling idea** (`example`, id `scene`): Larkfield's chief executive asks whether the provider can become the merchant of record, and the question splits at once into two sales with two different sellers.\n\n**Advances the thesis** (S3): Poses the fit question with a real business before any vocabulary, and sets up the two cases the chapter later answers differently.\n\n**Transition in:** `example`: The introduction's claim that the model changes who the seller is. → A company asking for the model without knowing that.\n\n**Order of paragraphs** (`chronological`): The question, then its split into two sales, then the one test both must pass.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In May 2027 Sofie Vermeer forwards a description of a merchant-of-record product and asks whether Larkfield can turn it on and stop dealing with disputes and tax. | scenario: The €120 dispute at Studio Noord (chargeback 24 February 2027, €15.00 fee); Larkfield sells in five countries; the 2026 incidents. |  |\n| p06 | analysis | Femke de Graaf answers that Larkfield makes two kinds of sale with two different sellers: a studio sells a class to a member, and Larkfield sells software to a studio. | statistic: Member payments €1.12 billion in 31.4 million payments in 2026, sold by 6,200 studios; Larkfield's own subscriptions €24.5 million. | `contrast`: One question about 'our payments'. → Two sales with two sellers. |\n| p07 | claim | For each sale the test is the same: who is the seller today, and could a provider take that place. |  | `cause_effect`: The two sales. → The one test both must pass, which needs the vocabulary of the next section. |\n\n### Processor, Payment Facilitator, Merchant of Record: Who Is the Seller?\n\n**Controlling idea** (`definition`, id `three-roles`): Three roles a provider can play differ in one respect that decides everything else, who the seller is to the buyer, and only the merchant of record changes it.\n\n**Advances the thesis** (S1): Defines the three roles against the seller's identity, which is the ground for the claim that a liability moves only with the seller's role.\n\n**Transition in:** `elaboration`: Femke's test: who is the seller. → Why the seller matters and the three roles a provider can play around it.\n\n**Order of paragraphs** (`prerequisite_order`): Why the seller is the unit of responsibility comes first; then the three roles in order of how much they take over; the table only after each has been defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | explanation | Tax law and card-network rules attach their obligations to the seller, and the seller is identified by what the customer understands, not by how the payment is configured. | quotation: Stripe Connect documentation: 'The MoR is the entity that the customer understands they're buying from'; 'card network compliance rules require a brand's identity to be clear and consistent throughout the transaction' (https://docs.stripe.com/connect/merchant-of-record.md, n.d., accessed 2026-11). |  |\n| p09 | definition | A processor moves the payment and leaves the business as the seller, with the tax, the disputes and the name on the statement. | quotation: Stripe: 'the business itself remains the MoR while Stripe acts as a payment processor or payment gateway' (https://stripe.com/resources/more/merchant-of-record, last updated 27 January 2026). Adyen: 'A payment processor only handles the technical routing of transaction data between financial institutions' (https://www.adyen.com/knowledge-hub/merchant-of-record, 15 September 2026). | `sequence`: The seller as the unit of responsibility. → The first role, which leaves it untouched. |\n| p10 | definition | A payment facilitator lets many businesses accept cards under its own agreement with the card networks, and each business is still the seller and still owes the tax. | quotation: Stripe: a payment facilitator works by 'aggregating multiple merchant accounts under one master account' and 'does not assume responsibility for tax collection and remittance' (same guide, 2026). Adyen: it provides the infrastructure 'while leaving tax and legal liability to the merchant' (same article, 2026). | `contrast`: A provider that only processes. → A provider that takes over the network relationship but not the sale. |\n| p11 | definition | A merchant of record replaces the seller toward the customer by selling the product in its own name, commonly as a reseller, and that is what moves obligations to it; how much of the tax, the fraud losses and the disputes moves is set by each provider's contract; 'seller of record' is used for the same party or, in some sources, for the owner of the goods. | quotation: Paddle: 'when a buyer purchases your product through Paddle, we act as the seller to them' (https://www.paddle.com/help/sell/tax/how-paddle-handles-vat-on-your-behalf, n.d., accessed 2026-11). Adyen: the MoR 'assumes full financial responsibility for compliance, tax collection, and risk. It also appears on the customer's bank statement'; a seller of record 'is the legal owner of the goods at the time of sale' (same article, 2026). | `contrast`: Two roles that leave the business as the seller. → The role that replaces it, and the term liability transfer. |\n| p12 | comparison | Set side by side, the three roles differ in who the seller is, whose name is on the statement, who owes the indirect tax and who answers a dispute. | table: Rows: seller to the buyer; name on the card statement; who owes the indirect tax; who answers a dispute (for the merchant of record: the provider, and who pays for a lost one depends on its contract); what the business gives up. Columns: processor, payment facilitator, merchant of record. Marked as the author's synthesis of the Stripe, Adyen and Paddle definitions.; figure: Three panels: the business sells and a processor carries the payment; the business sells under a facilitator's umbrella; the provider stands between buyer and business as the seller. | `conclusion_summary`: Three definitions. → The comparison in one table and one figure. |\n\n### What Changes When the Provider Sells: Stripe Managed Payments\n\n**Controlling idea** (`explanation`, id `managed-payments`): Stripe's documentation and service terms for Managed Payments show each consequence of the provider selling in its own name: what the customer sees, what Stripe takes on, what stays with the business or leaves its control, and which businesses and integrations qualify.\n\n**Advances the thesis** (S2, S3): Supplies the documented evidence for the thesis: the name, the duties Stripe takes on, the costs its terms leave with the business, the fee, the limits on products, accounts and integrations.\n\n**Transition in:** `example`: The merchant of record defined in general. → One documented product, read for what the definition means in practice.\n\n**Order of paragraphs** (`prerequisite_order`): The product and its price first, framed as the worked case of the definition; then the visible change (the name), because the duties follow from it; then what Stripe takes and what the business gives up as a pair; then the restrictions, which make sense only once the reader has seen that the provider is the seller; integration and data next because they are consequences of all of the above; the release history last, because it matters only to a reader planning on the product.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | context | Managed Payments is the worked case of the definition: Stripe's merchant-of-record product for digital goods, the one arrangement whose contract terms the chapter reads, priced at 3.5% per successful transaction on top of payment fees. | fact: Pricing page: '3.5% per successful Managed Payments transaction in addition to Payments fees' (https://stripe.com/pricing, n.d., accessed 2026-11). |  |\n| p14 | description | The customer buys from Link, not from the business: Link is named as the merchant of record at checkout, on the card statement, on receipts and on invoices; Stripe's service terms name the legal entity, Sold through Link, LLC, as the merchant of record and limit its role: it is not the seller of record, does not book the revenue, and is the supplier for indirect tax purposes only; in the previous section's terms, Link is the merchant of record and the business stays the seller of record. | quotation: 'The customer sees Link as the merchant of record, and sees purchases as Sold through Link'; statement: 'LINK.COM* [Your statement descriptor]'; 'These emails are sent from Link'; 'Custom domains aren't supported on Managed Payments checkouts' (https://docs.stripe.com/payments/managed-payments/how-it-works.md, n.d., accessed 2026-11). The tax page refers to 'Sold through Link, LLC' and Lemon Squeezy's site footer reads 'Sold through Link, LLC f/k/a Lemon Squeezy LLC' (accessed 2026-11). Stripe Services Agreement, service terms for Stripe Managed Payments (https://stripe.com/legal/ssa-service-terms, last modified 28 September 2026): the service 'is provided by Stripe's Affiliate, Sold through Link, LLC', which 'is the merchant of record', 'is not the seller of record', 'will not book the revenue', invoices the customer in its own name as the business's undisclosed agent, and is treated as making the supply 'for Indirect Tax purposes only'. | `sequence`: The product and its price. → What the customer sees. |\n| p15 | explanation | As the merchant of record, Stripe carries out the seller's duties: the four steps of indirect tax, the fraud rules, the dispute responses and transaction-level support. | quotation: Tax: Stripe 'Registers and files tax returns with local tax authorities', 'Remits collected taxes', 'Issues tax invoices' (https://docs.stripe.com/payments/managed-payments/tax-compliance.md). Fraud: 'No action is needed from you because Stripe configures the rules and maintains blocklists'. Disputes: 'Stripe handles disputes for you', 'submitting evidence on your behalf' (https://docs.stripe.com/payments/managed-payments/how-it-works.md). | `cause_effect`: Link is the merchant of record the customer sees. → The seller's duties that Stripe therefore carries out. |\n| p16 | explanation | What the business gives up is decision rights and some money: Stripe may refund or accept a dispute without it, the business stays liable for the full amount of disputes, refunds and reversals and pays a dispute fee, so Stripe takes over the work of a dispute and not its cost, and in some countries the tax liability does not transfer at all. | quotation: 'If you don't respond within 48 hours, Stripe might issue a refund without your approval'; 'If we determine that you're unlikely to win a dispute, we might accept it instead of countering it'; 'Received disputes incur a dispute received fee'; service terms (last modified 28 September 2026): 'User, as Seller, is liable to SMP and its Affiliates for the full amount of any Disputes, refunds, and Reversals' (https://stripe.com/legal/ssa-service-terms); on refunds in certain jurisdictions 'your account balance will be reduced by the amount that corresponds to the original sales tax amount' (https://docs.stripe.com/payments/managed-payments/how-it-works.md). 'In countries where local regulations prevent Managed Payments from assuming liability for indirect taxes, you're responsible'; exceptions Japan (all domestic) and Singapore (B2B domestic) (https://docs.stripe.com/payments/managed-payments/tax-compliance.md). | `contrast`: What Stripe takes on. → What the business loses, and what it keeps paying for. |\n| p17 | explanation | Because Stripe sells in its own name, it decides what it will sell and for whom: access is by eligibility review, products must be fully automated digital goods sold directly, and platforms are excluded. | quotation: 'Stripe determines access to Managed Payments based on an eligibility review'; 'Managed Payments supports direct integrations only. It doesn't support ... Connect platforms, Express accounts, Accounts controlled by a platform'; unsupported: 'Physical goods', 'Professional services', 'Live in-person events'; 'You sell the product directly to customers, not through a platform or marketplace'; 'You sell a fully automated digital product'; business locations: US, CA, 31 European countries, AU, HK, JP, SG (https://docs.stripe.com/payments/managed-payments/eligibility.md, n.d., accessed 2026-11). | `cause_effect`: The duties Stripe carries out as merchant of record, and their limits. → The limits it sets on what and for whom it sells. |\n| p18 | explanation | The parameter is per checkout session, but it works only where Stripe runs the checkout: Checkout and Payment Links, new subscriptions only under the published documentation, Stripe Tax only; taking subscriptions back out requires notice to their customers. | fact: Unsupported: Connect; 'Elements with the Checkout Sessions API or advanced integrations with the Payment Intents API'; 'Creating a subscription outside of Checkout or Payment Links'; one-off invoices outside the billing period; 'Third-party tax integrations' (https://docs.stripe.com/payments/managed-payments.md). 'You can only enable Managed Payments for new subscriptions purchased through a Managed Payments Checkout Session. Existing subscriptions aren't eligible' (https://docs.stripe.com/payments/managed-payments/update-checkout.md). Stripe's roadmap page lists a migration of existing Billing subscriptions as a private preview (n.d., accessed 2026-11). Lemon Squeezy: 'Managed Payments works at the transaction level' (16 November 2026). Service terms (last modified 28 September 2026): taking subscriptions back requires notice to their customers. | `additional_support`: Limits on products and accounts. → Limits on the integration, and what the flag can and cannot be added to. |\n| p19 | explanation | The customer's data and the money report change hands too: a customer's deletion request to Link cancels subscriptions and removes data from the business's own Stripe objects, and tax withheld appears inside the fee column unless separated. | quotation: On a deletion request Stripe 'Cancels any subscriptions sold to them through Managed Payments' and 'Deletes their data from any data objects (including objects in your Stripe account)'; 'By default, the fee column in the following reports includes both Stripe fees and withheld tax', with optional withheld_tax and fee_net_of_withheld_tax columns (https://docs.stripe.com/payments/managed-payments/how-it-works.md).; figure: A provider storefront facing the customer holds tokens for tax, fraud, disputes and receipts; the business keeps product, pricing and support; duties and a 3.5% fee move from the business to the provider. The caption says that the handling of disputes moves and, on Stripe, their cost stays with the business. | `additional_support`: Limits on the integration. → Effects on customer data and reporting. |\n| p19a | context | Whether the product is ready to plan on, Stripe's own pages answer only in part: announced on 7 May 2025, in the preview API version 2026-02-25.preview, in the release version 2026-04-22.dahlia, open to all digital businesses on 29 April 2026, with no page saying 'generally available', access still by eligibility review, and two pages disagreeing on the number of tax countries. | fact: API changelog: the managed_payments parameter introduced in the preview version 2026-02-25.preview (https://docs.stripe.com/changelog/clover/2026-02-25/managed-payments.md) and in the release version 2026-04-22.dahlia (https://docs.stripe.com/changelog/dahlia/2026-04-22/managed-payments.md); pricing page 'more than 75 countries' (https://stripe.com/pricing, n.d., accessed 2026-11) against 'more than 80 countries' in the documentation (https://docs.stripe.com/payments/managed-payments.md).; source: Stripe blog, 7 May 2025 (Will Gaybrick, 'Our top product updates from Sessions 2025'): 'this summer we'll launch Managed Payments, our merchant of record offering'. Lemon Squeezy blog: 'launching this summer in private preview' (2025); early access by waitlist (28 January 2026). Stripe blog, 29 April 2026 ('Everything we announced at Sessions 2026'): 'All digital businesses can now use Managed Payments'. Stripe's roadmap page (n.d., accessed 2026-11) lists three Managed Payments features in private preview. None of these pages uses the words 'generally available'. | `additional_support`: What changes when the provider sells, summed up in the figure. → How far the product's release status can be planned on. |\n\n### A Layer, a Bundle, a Store: Three Forms of the Same Trade\n\n**Controlling idea** (`comparison`, id `designs`): Merchant-of-record providers differ in how much they bundle with the seller's role, and every form makes the same trade of fee, control and exit for the duties the provider takes over.\n\n**Advances the thesis** (S4, S3): Shows that Stripe's product is one of three forms, that the trade is the same in each, and derives when the model fits.\n\n**Transition in:** `similarity`: One documented product. → The other forms of the same model, for contrast.\n\n**Order of paragraphs** (`comparison`): The three forms from least to most bundled, then one table across them and the alternative of selling yourself, then the judgement the table supports.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | description | Stripe sells the role as a layer: a percentage added to its payment fees, switched per transaction, with billing priced separately. | fact: 3.5% 'in addition to Payments fees' (Stripe pricing, n.d.); 'it's now applied at the transaction level' (Lemon Squeezy, 2025). That this is a layer on a payment platform is the author's reading of the price pages. Lemon Squeezy's older product tied the role to a seller's entire account. |  |\n| p21 | description | Paddle sells the role as a bundle: one price covers payments, billing, tax and the seller's role. | quotation: '5% + 50¢ per Checkout transaction'; 'No monthly fees, migration fees, or hidden extras' (https://www.paddle.com/pricing, n.d., accessed 2026-11); 'Because Paddle is registered in over 100 jurisdictions worldwide' (Paddle help, n.d., accessed 2026-11). | `contrast`: A layer on a payment platform. → One bundled price. |\n| p22 | description | An app store is the oldest form: the store is the seller, takes a commission several times larger, and also owns distribution; Apple's agreement appoints it agent or commissionaire (an agent that concludes agreements in its own name) by region, and its legal effect per country is where the record stops. | quotation: Apple: 'The commission on the sale of digital goods and services through the App Store is 30% (15% if you're enrolled in the App Store Small Business Program ...) and 15% for qualifying subscriptions' (https://developer.apple.com/programs/whats-included/, n.d., accessed 2026-11). Google: 'As the merchant of record for transactions with customers in the United Kingdom, Google is responsible for determining, charging, and remitting VAT'; with alternative billing 'you are the merchant of record' (https://support.google.com/googleplay/android-developer/answer/138000, n.d., accessed 2026-11). Apple's developer agreement is public (https://developer.apple.com/support/terms/apple-developer-program-license-agreement/); its Schedule 2 (last updated 13 October 2026) appoints Apple as agent or commissionaire by region. Exhibit A defines a commissionaire as an agent who 'concludes agreements in their own name but acts on behalf of other persons'. | `additional_support`: Two payment companies as sellers. → Stores as sellers. |\n| p23 | comparison | Across the three forms and the baseline of selling yourself with a processor, the fee rises with what is handed over, and control of the checkout and ease of exit fall. | table: Rows: being your own seller with a processor and a tax tool; merchant-of-record layer (Stripe Managed Payments); bundle (Paddle); app store. Columns: published fee; who runs the checkout; name the customer sees; indirect tax liability; what leaving takes. For Stripe, leaving means new checkout sessions without the flag, and taking existing subscriptions back requires notice to their customers (service terms, 2026). Fees are the vendors' published list prices and are not comparable line for line. | `conclusion_summary`: Three forms described one by one. → All of them against selling yourself. |\n| p24 | recommendation | The model fits a small seller of an automated digital product with customers in many tax jurisdictions, and stops fitting when the business needs its own checkout, sells goods or human-delivered services, or pays other sellers. | reasoning: The fee is a percentage of revenue, while the cost of tax registration and filing is roughly fixed per jurisdiction (assumption): the first grows with the business and the second does not. | `cause_effect`: The trade-off table. → When the trade is worth making. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Stripe sells a merchant-of-record product and Adyen states that it is not a merchant of record, so on Adyen the business is its own seller or brings a partner.\n\n**Advances the thesis** (S5): The required comparison: Stripe's documented product against Adyen's documented statement that it offers none, with the reason marked as inference.\n\n**Transition in:** `contrast`: Providers that sell the role. → The second anchor company, which says it does not.\n\n**Order of paragraphs** (`comparison`): The comparison table first, then what to do differently on each provider with the labeled inference, then the limits of the public record that the inference belongs to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | comparison | Aspect by aspect, Stripe documents a first-party product and Adyen documents the opposite position, with the last column as the author's inference. | table: Rows: first-party merchant-of-record product; who the customer buys from; price; platforms; acquired merchant-of-record business. Stripe cells from the Managed Payments documentation, pricing page and Lemon Squeezy's posts; Adyen cells from its article of 15 September 2026: 'Adyen doesn't act as a direct, third-party merchant of record'; 'we integrate with global merchant of record partners'. |  |\n| p26 | recommendation | An integrator on Stripe decides per sale whether Stripe is the seller; an integrator on Adyen plans to be the seller everywhere or to add a third party, and the reason Adyen offers no such product is the author's inference from its customer base. | quotation: Adyen: 'By acting as your own merchant of record, you maintain complete control over your customer journey, checkout branding, and refund policies'; 'tools that let enterprises act as their own MoR' (https://www.adyen.com/knowledge-hub/merchant-of-record, 15 September 2026). | `cause_effect`: The differences in the table. → What to do differently on each, and the labeled inference about why. |\n| p35 | explanation (list) | The inference about Adyen is one of five points where the public record stops, and the chapter's claims go no further than it. | source: no Stripe page says 'generally available' and access still depends on an eligibility review; Stripe's terms name Sold through Link, LLC as the merchant of record and say it is not the 'seller of record', and what that distinction means under each country's law is not stated; Apple's public agreement says agent or commissionaire by region, and its legal effect per country is not stated; Adyen states its position but not its reason; no independent data on dispute rates or win rates under a merchant of record. | `additional_support`: The labeled inference about Adyen's reason. → All the points where the public record stops. |\n\n### In Practice at Larkfield: Two Sales, Two Answers\n\n**Controlling idea** (`example`, id `in-practice`): Applied to Larkfield, the test gives a no for the studios' class sales on grounds no price could change, and a no for Larkfield's own subscriptions on grounds of account type and cost.\n\n**Advances the thesis** (S3): Works the fit decision with ledger numbers and shows why a platform cannot solve its tax and dispute burden this way.\n\n**Transition in:** `example`: The model, its forms and the two providers' positions. → Sofie Vermeer's question, answered for each of the two sales.\n\n**Order of paragraphs** (`order_of_importance`): The class sale first because it is 98% of the money and the answer is structural; the hypothetical of Larkfield as seller next because it is the obvious follow-up; the subscription last because its answer is arithmetic.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | analysis | For Mila's class pass the seller is Studio Noord, and the sale fails every documented condition: it is sold through a platform, for a service delivered in person, on Adyen, which is not a merchant of record, and had the studio been on Stripe it would run through a Connect platform account, which is excluded. | scenario: Mila's €120.00 pass; Studio Noord on Adyen; Adyen 56% of 2026 volume (€627M), Stripe Connect 44% (€493M). Stripe's Connect documentation gives as its example of a connected account as merchant of record 'a SaaS provider that offers payment processing and scheduling services to independent pet groomers' (https://docs.stripe.com/connect/merchant-of-record.md). Larkfield's fee on the pass: 1.9% + €0.25 = €2.53 (ledger). |  |\n| p28 | analysis | Making Larkfield the seller instead would not remove the burden; it would move every studio's sales, tax and disputes onto Larkfield. | reasoning: As seller Larkfield would book €1.12 billion of class sales in its own name and answer every dispute (about €156 million of paid-out card volume is inside the dispute window at any time). EU deemed-supplier rules do not cover fitness studios (ruling 16). The author's reasoning, labeled; the account model that decides this is Part VII's subject. The €156 million is 52% of €910M online volume × 120/365 (ledger, 04 addition). | `contrast`: The provider cannot be the seller of a class. → Larkfield could be, and what that would mean. |\n| p29 | analysis | Larkfield's own subscription is the kind of product the model takes, but Larkfield's Stripe account is a Connect platform, which is excluded, and at €24.5 million a 3.5% fee would cost about €857,500 a year to cover five countries. | statistic: 3.5% × €24.5M = €857,500; on the €1,890 annual plan, €66.15; Larkfield sells in NL, DE, UK, BE and US. The fee is Stripe's list price; whether a separate account could qualify is not documented and not assumed. Ironworks Climbing is a three-location climbing studio in Manchester (ledger cast). | `contrast`: The sale where Larkfield is not the seller. → The sale where it is. |\n| p30 | claim | Femke's answer to Sofie Vermeer is no twice, and for the studios the burden has to be handled where it sits: in the account model and in each studio's own tax position. | figure: Two rows: a studio sells a class to a member (€1.12 billion) with the platform beside the sale and a provider gated off; the platform sells software to the studio (€24.5 million) with a 3.5% tag. | `conclusion_summary`: Two analyses. → The decision and where the remaining problem goes. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): The model fails where the handed-over role meets the business that still owns the product: a name the customer does not recognize, decisions taken without the business, liability that comes back, and a merchant of record that stops selling.\n\n**Advances the thesis** (S4, S2): Shows the costs of the trade as concrete failures with detection and recovery.\n\n**Transition in:** `contrast`: A business that decided against the model. → What happens to one that adopts it.\n\n**Order of paragraphs** (`chronological`): In the order a business meets them: at the first statement, at the first refund or dispute, when the provider finds a product ineligible, when the provider withdraws.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | cause_effect | A customer who does not recognize the seller's name on the statement disputes the charge, so the model can raise the disputes it was bought to take over. | quotation: Adyen lists 'Customer confusion: Customers might not recognize the name of the MoR on their credit card statement, leading to accidental chargebacks and support tickets' (https://www.adyen.com/knowledge-hub/merchant-of-record, 2026). Stripe: misalignment can 'increase unrecognized transactions and disputes' (https://docs.stripe.com/connect/merchant-of-record.md). |  |\n| p32 | cause_effect | Refunds and dispute outcomes can now happen without the business acting, so its own records must take them from the provider's events and not from its own actions. | fact: The 48-hour refund rule and accepted disputes (https://docs.stripe.com/payments/managed-payments/how-it-works.md); Larkfield's K2, a rule of Keel (its 2027 program of payment repairs), glossed at use: the provider's record is the truth. | `sequence`: The first statement. → The first refund or dispute decided elsewhere. |\n| p33 | cause_effect | The liability can come back: a product that Stripe finds ineligible returns its indirect tax liability to the business, on notice. | quotation: Stripe: 'we'll notify you that you're responsible for any indirect tax liability for the product and you must discontinue the use of Managed Payments for that product' (https://docs.stripe.com/payments/managed-payments/eligibility.md). | `sequence`: Decisions taken by the provider case by case. → The provider's decision about a whole product. |\n| p34 | cause_effect | The merchant of record can stop selling: Lemon Squeezy, which Stripe acquired in 2024, stops processing payments on 31 March 2027, and its sellers must move customers, subscriptions and stored cards by the provider's date. This is the Vault Hostage and the Single Rail patterns. | quotation: Lemon Squeezy, 16 November 2026: 'we've closed new store sign-ups, and Lemon Squeezy will stop processing payments on March 31, 2027'; Managed Payments is not 'a like-for-like replacement'; 'Managed Payments isn't available in every country Lemon Squeezy supports' (https://www.lemonsqueezy.com/blog/saying-goodbye-to-lemon-squeezy). | `sequence`: A product the provider stops selling. → A provider that stops selling altogether. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Every chapter of the part turned out to be about one document. The scheduler exists to produce the invoice, metering fills it, dunning collects it, tax and recognition read it, and merchant of record changes whose name is on it. So the question that sorts billing architectures, and the two providers, is not which features each has but where the invoice lives: the party that holds it knows what is owed, for which period, by whom and to whom, and every other party sees only payments with a reference.\n\n**So what:** A reader evaluating a provider, or a build-versus-buy decision for billing, can ask one question first (who holds the invoice and its period?) and predict from the answer who will do the retries, the tax, the revenue schedule and the corrections; and can decide whether a merchant of record fits from who the seller is, before reading a price list.\n\n**Callback:** The boolean of the opening, and, for the part, Larkfield's 1 October and 1 November 2026 renewals: late, then twice. The reader can now say what the boolean flips (the seller, and with it the name on the invoice). Keel's answers to the two renewal failures are billing-engine decisions taken inside a payments program: K1 derives the idempotency key for a renewal from the membership id plus the billing period (and the attempt number), and K5 has the renewal job pace itself over 18 hours and retry on a schedule tied to decline codes.\n\n**Takeaway** (`course_of_action`): For every recurring charge in your own system, write down the period it is for, derive its key from that period, and name the one system that holds the invoice. Then check each of the part's jobs (retry, tax, recognition, correction) against that system, not against the payment provider's feature list. Before considering a merchant of record, write down who the seller is in each kind of sale you make.\n\n**Hand-off** to [Part VII — PLATFORMS: Paying Many Parties](part-7.html): `contrast`: Part VI's billing machinery and this chapter's question of who sells to the customer, answered here by letting the provider sell in its own name. → The opposite arrangement: the seller stays the seller, a platform stands between it and the payer, and the liability, of which a merchant of record takes over only the part its contract names, is divided among three parties by the account model.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis (list) | Established: the merchant of record is the seller to the buyer, and the indirect tax and the handling of disputes follow it; Stripe documents such a product with its fee, its limits, its exclusion of platforms and terms that keep the cost of disputes and refunds with the business; Adyen states that it is not one. |  |  |\n| p37 | synthesis (list) | Depends on context: whether the fee is worth paying depends on revenue against the number of tax jurisdictions, on whether the business needs its own checkout, and on how much of the customer relationship it can share. |  | `contrast`: What is settled. → What changes with the situation. |\n| p38 | recommendation (list) | The author's synthesis: decide fit from who the seller is before reading a price list, and treat a merchant of record as a dependency to plan an exit from on the day it is adopted, because the provider that carries the tax liability also holds the customers. |  | `contrast`: What is established and what depends. → The author's own position, returning to the opening boolean. |\n| p39 | recommendation | The chapter's own course of action: before considering a merchant of record, write down who the seller is in each kind of sale and whose name the customer will see on the invoice. |  | `conclusion_summary`: This chapter's take-aways. → The chapter's course of action. |\n| p39a | synthesis | Part VI closes on the name on the invoice: every chapter of the part was about the invoice, so where it lives sorts billing architectures; Larkfield's late renewals of 1 October and double charges of 1 November 2026 were failures of that machine, which Keel (Larkfield's 2027 repair program) answers with K1 (a renewal's key from membership, period and attempt) and K5 (renewals paced over 18 hours). | scenario: 1 October 2026: 7,900 renewals delayed; 1 November 2026: 1,840 members charged twice, €71,300 refunded, 212 disputes; K1 and K5. | `conclusion_summary`: The name on the invoice, from the chapter's course of action. → The part's closing: where the invoice lives, the two renewal dates, the course of action for the part. |\n| p40 | recommendation (list) | Eight questions let the reader test fit and exposure before adopting a merchant of record, or before assuming a provider offers one. |  | `cause_effect`: The closing argument. → Questions that apply it. |\n| p41 | transition | This chapter let a provider sell in its own name and found that only part of the seller's position moves with that, and that a platform cannot use the model; Part VII takes the opposite case, where the seller stays the seller and a platform stands between it and the payer. |  | `contrast`: A model that platforms cannot use. → The arrangement platforms do use, and how it divides liability. |\n\n## Non-goals\n\n- How indirect tax is calculated, registration thresholds, Stripe Tax and deemed-supplier rules. See [Whose Tax, at What Rate: Tax Calculation in the Payment Path](billing-and-payment-tax.html).\n- The billing engine, subscriptions, invoices, dunning and revenue recognition themselves. See [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html), [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html), [Cash Is Not Revenue: Revenue Recognition and the Hand-off to Finance](billing-revenue-recognition.html).\n- Connect charge types, on_behalf_of, account configurations and who carries a seller's losses on a platform. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- The payment-facilitator model as an acquiring arrangement, and sponsor banks. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html).\n- The dispute lifecycle and evidence. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- A market survey of merchant-of-record vendors beyond Paddle and the app stores as contrast.\n- App-store commission policy, alternative billing rules by country and their litigation.\n- Legal or tax advice on whether a given business is the seller in a given transaction.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Stripe's pricing page says 'more than 75 countries' and the documentation 'more than 80'; the chapter reports both.\n- Whether a Connect platform could use Managed Payments for its own subscriptions through a separate, non-platform account is not documented and is not asserted.\n- Resolved 2026-11-17 (absence audit): Apple's Developer Program License Agreement, including Schedule 2 (paid applications), is public on developer.apple.com; it appoints Apple as agent or commissionaire by region. What that means under each country's law is not stated as fact.\n- What the distinction between merchant of record and seller of record in Stripe's service terms means under each country's law is not stated in the sources read; the chapter says so and does not interpret it.\n- Only the English edition of Stripe's service terms served for the Netherlands was read; other regional editions were not compared.\n\n## Decision log\n\n- **2026-11-17** — The Larkfield scene is a question from the chief executive that is answered no for both kinds of sale, because the ledger fixes that the studio is the seller and Larkfield is not the merchant of record. Rejected: Having Larkfield adopt a merchant of record, which would contradict the ledger.; Using only the class sale, which would leave the chapter without a case where the product type fits.\n- **2026-11-17** — The chapter is planned at about 4,000 words: one company documents a product and the other documents that it has none. Rejected: A full-length chapter padded with a vendor survey.\n- **2026-11-17** — The three-role table is marked as the author's synthesis, because the card-network rule texts were not read; the definitions quoted are Stripe's, Adyen's and Paddle's. Rejected: Presenting the table as network rule.\n- **2026-11-17** — The opening hook is the API parameter, to meet the 'it is a setting' view head on; the chapter concedes that the flag is real and per transaction and shows what it is conditional on. Rejected: Opening with a generic small-seller story, which would duplicate the cold-reader probe of AC-1.\n\n## Sources\n\n- **Internal**\n  - _research/brief-billing-and-revenue.md — Part 6 (merchant of record): definitions, Managed Payments, Lemon Squeezy, Paddle, app stores, the Stripe and Adyen comparison, open questions 7 to 11.\n  - _research/brief-platforms-and-embedded-finance.md — Section 1.4: Stripe Connect's merchant-of-record guidance and charge types.\n  - _research/scenario-ledger.md — Larkfield's business lines, provider split, Mila's class pass, the €120 dispute, the 2026 incidents, K1, K2 and K5.\n  - _research/consistency-issues.md — Rulings 6, 7 and 16.\n- **External**\n  - Pages fetched by the writer on 2026-11-17: Stripe Managed Payments documentation (overview, how it works, eligibility, tax compliance, update a Checkout integration), the changelog entry of 2026-04-22, Stripe pricing, Stripe's merchant-of-record guide, Stripe's Sessions 2025 blog post, Stripe Connect 'Determine and configure the merchant of record'; Adyen knowledge hub 'Merchant of record explained'; Lemon Squeezy blog posts of 2024-07-26, 2025, 2026-01-28 and 2026-11-16; Paddle help and pricing; Apple Developer Program page; Google Play tax page. Added by the verification pass of 2026-11-17: Stripe Services Agreement service terms, section 'Stripe Managed Payments' (last modified 2026-09-28); Stripe API changelog entry of 2026-02-25 (preview version); Stripe blog 'Everything we announced at Sessions 2026' (2026-04-29); Stripe roadmap; European Commission pages on the One Stop Shop and VAT in the Digital Age. See _research/verification/32-merchant-of-record.md. — Verification of every quotation used.\n\n## Changelog\n\n- **2026-11-17** — Round-1 revision: p13 split into p13 (product framed as the worked case, with its fee) and p19a (release history and the 75/80 discrepancy, now last in the section); p35 (limits of the public record) moved from When It Goes Wrong to the end of Stripe and Adyen: Where They Differ (rule 7); p39 split into p39 (the chapter's course of action) and p39a (the closing of Part VI, with Keel, K1 and K5 glossed); p14, p18, p22, p27 to p29, p35 wording aligned with the revised prose and ruling 46c; flow rationales and transitions updated; max_words raised 5% to 5,775.\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and
