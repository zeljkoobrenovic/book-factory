<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The steps of a dispute: the cardholder's claim to the issuer, the chargeback through the network, the provider's notification, the debit of the amount and a fee, the evidence and its single submission, the deadline, the issuer's review, the outcome and its possible reopening, the booking of the loss on the platform, the ledger entries and the count toward the network's monitoring program; for each, the party, the record, the promise and the failure, with the chapter that owns it.\n- **Know:** The canonical facts: Bram de Wit disputes a €120.00 pass bought at Studio Noord on 2 February 2027 as 'not recognized'; the chargeback arrives on 24 February 2027 with an illustrative €15.00 fee.\n- **Know:** The two providers' dispute records as documented in 2026: on Stripe one Dispute object with a status, the amount and a fee debited when it is created, and the amount returned only on a win; on Adyen a series of events against the original payment (notification of chargeback, chargeback, information supplied, chargeback reversed, second chargeback), with the credit on a reversal provisional. On Adyen for Platforms the chargeback is booked by logic set on the payment, by default to the platform's liable balance account; on Stripe Connect the charge type decides which balance is debited.\n- **Know:** Where the public record stops: Adyen's chargeback fee amount is contractual, with only CAD 24.00 published, in Adyen Canada's fee disclosure (Stripe's Netherlands list price is €20 per dispute received and €20 per dispute countered); Mastercard's deadlines are known here only as the two providers render them.\n- **Believe:** A paid-out payment is not final; it is a payment nobody has disputed yet.\n- **Believe:** Winning a dispute returns the money and leaves the count against the merchant unchanged.\n- **Believe:** Who carries a dispute's loss is settled when the payment is created, so it is a design decision, not something to settle when the dispute arrives.\n- **Be able to:** Book a chargeback on the day it arrives, against the balance the account model names, as a provisional entry that a later event can reverse.\n- **Be able to:** List the evidence their own system would need at the moment of sale to answer a 'not recognized' claim in one submission.\n- **Be able to:** Say which dispute event on each provider a ledger must not treat as final.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a team's plan for handling a chargeback on a platform the chapter does not contain, the reader says what is wrong with each step of the plan. *Probe:* A ticket marketplace receives a €200 chargeback (the buyer's bank taking the payment back, here with the claim that the buyer did not make it) on a sale it paid out to the event organizer two months ago. The team plans to (a) book nothing until it knows whether it has won, (b) refund the buyer now so that the dispute goes away, and (c) collect evidence when someone has time. Using only this chapter: what is wrong with each? | `custom` | cold_reader | major |\n| AC-2 | The reader can name, for each provider, the dispute event or status that looks final and is not. *Probe:* A ledger is fed by dispute events from both Stripe and Adyen. Using only this chapter: name one event or status on each provider that the ledger must not treat as the end of the dispute, and say what can follow it. | `custom` | cold_reader | major |\n| AC-3 | The reader can say whether winning disputes improves a merchant's standing in a network monitoring program and what does. *Probe:* A studio answers ten disputes in a month and wins nine. Using only this chapter: has its standing in the card networks' dispute monitoring programs (which count a merchant's disputes against its sales each month) improved, and what would have? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** What happens, in money, deadlines and records, when Bram de Wit's bank takes back a €120 payment three weeks after it was made, and who ends up carrying the loss?\n\n> **Claim:** A chargeback debits first and judges later. The €120 and a fee (an illustrative €15) leave the platform side before the issuer has ruled on any evidence; the merchant may submit evidence once, within a deadline counted in days (at Adyen, 40 for a Mastercard such as the one in this dispute and 18 for a Visa payment processed outside the US and Canada); and the dispute counts toward the network's monitoring ratio whether it is won or lost. Adyen records it as separate events, with a provisional credit if the chargeback is reversed, and Stripe as one Dispute object whose status can still change after 'lost'. Who carries the €135 was decided before Bram de Wit made his claim: on Adyen by the chargeback logic set on the payment of 2 February, which by default books it to Larkfield's liable balance account, and on Stripe by the charge type.\n\n**Disputed by:** The view that a dispute is a customer-service case: it is rare, support answers it when it arrives, the merchant who is in the right gets the money back, and nothing in the payment system needs to be designed for it.\n\n**So what:** A team that accepts this captures evidence at the sale, books the debit the day it arrives as an entry a later event can reverse, sets the chargeback logic or charge type knowing it is choosing who pays, and tracks its own dispute count per network. Chargeback fees were one of the three causes of Larkfield's unexplained €412,000, and under K3 every dispute movement is a ledger entry.\n\n**How and why:** The issuer returns the transaction to the acquirer through the network on the cardholder's word, and the rules give the merchant side a response, not a veto: for many Visa conditions the issuer has 120 calendar days from processing to dispute, the Visa rules give the acquirer 30 calendar days to respond, and the providers' merchant-facing deadlines are shorter (18 days at Adyen for Visa outside the US and Canada; 'usually 7-21 days' at Stripe). A 'not recognized' claim is a fraud dispute, which on Visa follows the flow Adyen calls Allocation, where a defended chargeback is not credited back at once. Both providers document that evidence is submitted once (Stripe: 'only one opportunity to submit your response'; Adyen: submitting defense documents 'is irreversible'). As documented in 2026, Stripe models the dispute as one object with a status and moves money when it is created and, if the dispute is won, again when it ends, though 'lost' can later become 'won'; Adyen exposes the network's cycle as separate events, so a reversal's credit is provisional and a second chargeback can take it again. The monitoring programs count disputes received and ignore outcomes and refunds. Adyen's terms (clause 8.2) call the chargeback fee non-refundable and leave its amount to the merchant agreement, so the €15 is illustrative; Mastercard's time limits are given as the two providers state them, because Mastercard's own rule documents were not readable for this book.\n\n**Supporting claims**\n\n- **S1** — Three things that decided Bram de Wit's dispute were fixed on 2 February 2027, before any claim existed: the payment carried no liability shift because Adyen requested an exemption and the issuer granted it, the chargeback logic sent with the payment named Studio Noord's balance account for the amount and the fee, and the evidence that would answer the claim was a by-product of the sale and of two check-ins held in the booking app.\n- **S2** — The claim reaches the merchant side as a debit and not as a question: on 24 February the €120.00 and an illustrative €15.00 fee leave Studio Noord's balance account before anyone has read any evidence, so the dispute record has to be opened from the notification and the ledger entries written from the provider's report that day, as entries a later event can reverse.\n- **S3** — The merchant side answers once, against a deadline the provider sets (40 days for Mastercard and 18 days for Visa outside the US and Canada at Adyen; 'usually 7-21 days' at Stripe), so what Larkfield sends on 3 March can only be what already existed, and a refund is not one of the answers.\n- **S4** — A favorable event is not the outcome: Adyen returns the €120.00 on a chargeback reversal while the issuer is still reviewing, a second chargeback can take it again, and Bram's dispute is won only when the issuer's time runs out on 12 May; on Stripe the money returns only on a win, and a dispute marked lost can still become won.\n- **S5** — Winning returned the €120.00 and changed nothing else: the fee stayed with the studio, the dispute stayed in Mastercard's count for February, and the payment stayed disputable until 2 June 2027.\n- **S6** — Seen whole, the dispute is twelve hand-offs, most of them between parties Larkfield does not control, and it reads differently per provider: on Adyen a series of events against the payment's reference with the studio's balance debited by an instruction on the payment, on Stripe one Dispute object with Larkfield's platform balance debited first.\n\n## Role in the part\n\nFollows the one flow that starts outside every system the merchant controls, from the cardholder's claim to the ledger entries and the monitoring count, on Adyen and on Stripe; as the part's last journey it also performs the part's closing, setting the four journeys against the €412,000 of the opening. Supports P9-4, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in sale and after-win: three settings fixed at the sale; three things the win left unchanged; `comparison` in on-stripe: the rows that differ between the two providers; `small_to_large` in conclusion p34 to p36: from this journey to the four journeys of the part)\n\nThe dispute is told in the order of its dates (2 February, 24 February, 3 March, 5 March to 12 May) because its lesson is an order: the settings come before the claim, the debit before the answer, the credit before the verdict. Starting on 24 February, where the merchant first notices anything, would present the loss bearer and the missing liability shift as discoveries and hide that they were decisions. What the win left unchanged follows the win because each residue is defined against it. The step table comes after the narrative, as its summary, because a reader who met twelve rows of event names first would have no dates or amounts to attach them to; the Stripe reading comes after the table because it is told as the rows that differ. The part's closing is last because it needs all four journeys, of which this is the fourth.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On Wednesday 24 February 2027 Studio Noord's balance at Adyen fell by €135.00. The pass it paid for had been sold three weeks earlier for €120.00, paid out to the studio two days after the sale, and used for two classes. No one at the studio, at Larkfield or at Adyen had decided anything, and no one had yet looked at any evidence.\n\n**Bridge:** An engineer's expectation of a complaint process: someone raises a claim, the two sides are heard, a decision is made, and only then does money move; a sale that was approved, paid out and consumed is a closed record. → A card dispute runs in the other order. The cardholder's bank takes the money back first, the merchant side may answer once, and the ruling comes weeks later, so the questions that matter (who pays, with what evidence, counted where) were answered when the payment was made.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): A chargeback debits first and judges later: the €120 and a fee leave before the issuer has ruled, the merchant side answers once against a deadline, the dispute counts in the network's monitoring ratio whether it is won or lost, and who carries the loss was decided on the day of the sale, on Adyen by the chargeback logic set on the payment and on Stripe by the charge type.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start on 2 February, with the three things about Bram de Wit's payment that were settled before anyone disputed it. *Kept in:* sale.\n- Follow the claim to 24 February, when it arrives as a debit of €135.00 and has to be recorded. *Kept in:* debit.\n- Show the single answer Larkfield sends on 3 March and why a refund is not one. *Kept in:* answer.\n- Follow the money back on 5 March and the wait until the dispute is won on 12 May. *Kept in:* provisional.\n- Say what the win left unchanged: the fee, the count and the open window. *Kept in:* after-win.\n- Lay the whole dispute out as a step table of twelve rows with one sequence figure. *Kept in:* step-table.\n- Read the same rows on Stripe, where one object replaces the events and the platform pays first. *Kept in:* on-stripe.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | On 24 February 2027 Studio Noord's balance at Adyen fell by €135.00 for a pass that had been sold, paid out and used, before anyone on the merchant side had decided anything or seen any evidence. | scenario: The €120 dispute: Bram de Wit, Dutch Mastercard credit card, €120.00 pass bought at Studio Noord on 2 February 2027; chargeback on 24 February 2027 with an illustrative €15.00 fee; check-ins on 4 and 11 February. |  |\n| p02 | claim | A chargeback debits first and judges later, and who carries the loss was decided when the payment was made. | fact: Adyen: 'Adyen processes the chargeback and debits the payment amount and the chargeback processing fee from your account.' Stripe: on creation of a dispute it 'Debits the disputed amount, plus a dispute fee, from your Stripe account.' | `elaboration`: The debit that nobody on the merchant side decided. → The order of events in a card dispute, and the point in time at which its outcome for the merchant was fixed. |\n| p03 | explanation | This journey teaches no new mechanism: it follows one dispute through mechanisms that earlier chapters own, told on Adyen with the Stripe record beside it, and it marks which of its dates and amounts are illustration. | reasoning: Studio Noord is on Adyen in the ledger; the pairing of Adyen and Stripe terms is the book's own mapping; dates after 24 February and the €15.00 fee are illustrative; Mastercard's rules are given as Adyen and Stripe render them (ruling 17). | `sequence`: The claim about the order of a dispute. → How the journey is told and what in it is fact, rendering or illustration. |\n| p04 | context | On the payment's journey this is the last and slowest step, shown on a second sale at the same studio, and it differs from Journey 3's refund in that nobody on the merchant side agreed to it and it brings a fee, a deadline and a count. | scenario: Journey 3: Mila's €84.00 refund of 18 March 2027, requested by the member and funded from Studio Noord's balance account; Mila's own pass stays disputable until about 7 July 2027. | `contrast`: Journey 3's refund: money going back by the studio's choice, from a balance already paid out. → Money going back by the issuer's choice, with a fee, a deadline and a count the refund did not have. |\n| p05 | transition | The chapter goes through the dispute in date order (2 February, 24 February, 3 March, 5 March to 12 May), says what the win left unchanged, sets the whole out as a step table, reads it again on Stripe and ends by closing Part IX. |  | `sequence`: The journey's place in the part. → The order in which it is told. |\n\n## Sections\n\n### 2 February: Three Things Settled Before Anyone Disputed Anything\n\n**Controlling idea** (`cause_effect`, id `sale`): By the time Bram de Wit's payment was marked paid, three things that would decide a dispute about it were already fixed: no liability shift, the balance a chargeback would debit, and the evidence that existed.\n\n**Advances the thesis** (S1): Shows each of the three settings being made at the sale by a mechanism that was not thinking about disputes.\n\n**Transition in:** `time`: The introduction's claim that the loss was assigned when the payment was made. → The day of the sale and what each system recorded on it.\n\n**Order of paragraphs** (`grouping`): The closed record first, then the three settings one per paragraph in the order the payment met them (authentication, split, the booking app's own data), so the reader holds all three before the claim arrives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | On 2 February the payment for Bram de Wit's pass was approved, split and marked paid, the studio was paid on 4 February, and every Larkfield record of it was closed. | scenario: €120.00 split into €117.47 for Studio Noord and €2.53 for Larkfield, provider cost €0.73 leaving Larkfield €1.80 (illustrative); sales day plus two business days puts the payout on Thursday 4 February 2027; payment record store state 'paid'. |  |\n| p07 | cause_effect | The payment carried no liability shift, because Adyen requested the low-risk exemption for it and the issuer granted it, so a fraud dispute would stay on the merchant side. | quotation: Adyen on a transaction-risk-analysis exemption requested by the merchant or its acquirer: 'If the exemption is granted, the chargeback liability stays with you.' Each payment response reports the request in `additionalData.scaExemptionRequested`.; scenario: Bram's payment went unchallenged because Adyen requested the exemption and the issuer granted it; the pass was his first purchase as a member (illustrative). | `sequence`: The closed record of the sale. → The first of three settings inside it: authentication and who carries a fraud loss. |\n| p08 | cause_effect | The split sent with the payment also said where a chargeback would be booked: by Larkfield's instruction, Studio Noord's balance account for both the amount and the fee, where Adyen's default is the platform's liable balance account. | quotation: Adyen: by default it 'withdraws the disputed funds from your platform's liable balance account'; `deductFromOneBalanceAccount` 'Deducts the full amount from the balance account specified in `targetAccount`'; 'Use this logic if you want to make your user liable for all chargeback-related events on the payment'; chargeback fees are booked 'By default' to the liable balance account unless `costAllocationAccount` names another.; fact: On Stripe the counterpart is the charge type: for charges created on the platform the balance debited is the 'Platform’s balance, with or without `on_behalf_of`'. | `additional_support`: The first setting, made by the provider's default. → The second setting, made by Larkfield's own integration: the balance a chargeback debits. |\n| p09 | explanation | The evidence that could answer a claim was created as a by-product of the sale and of two check-ins, in the booking app, a system the payment never passes through. | scenario: The booking app holds Bram's logged-in purchase session and his check-ins to two classes on 4 and 11 February 2027; the payment record store and the booking app share the member id and Larkfield's payment ID. | `additional_support`: Two settings on the payment itself. → A third thing fixed at the sale that sits outside the payment system: the evidence. |\n\n### 24 February: The Claim Arrives as a Debit\n\n**Controlling idea** (`process`, id `debit`): The claim crosses three parties Larkfield cannot see and reaches it as a notification with a deadline and a debit of €135.00 from the studio's balance, each of which has to become a record of Larkfield's own that day.\n\n**Advances the thesis** (S2): Follows the claim to the two records it must become (a dispute record from the notification, ledger entries from the report) and names what fails at each hand-off.\n\n**Transition in:** `time`: The three settings left on the payment of 2 February. → Three weeks later, the claim that puts them to use.\n\n**Order of paragraphs** (`chronological`): The claim's path in the order it travels: the cardholder and issuer, the notification, the debit, the ledger entries written from the report that lists the debit, and last what could have gone wrong with that booking. The silent failures come after the entries so that the dated story of the debit and its booking is not interrupted; they look back at a booking the reader has just seen confirmed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | process | Bram de Wit's claim goes from him to his bank, and from the bank through Mastercard to Adyen, without any record reaching the merchant side and without anyone there being asked. | fact: Adyen's timeframes table gives the bank 120 calendar days from the transaction date to initiate a chargeback for Mastercard and for Visa; Visa's rules give '120 calendar days from the Transaction Processing Date' for most conditions; a 'not recognized' claim is a fraud dispute (Mastercard code 4837, No Cardholder Authorization, as Adyen lists it). |  |\n| p11 | process | Adyen's notification of chargeback is the one message that starts the defense period, so the hand-off that matters is from that webhook to a dispute record with an owner and a deadline, which for a Mastercard at Adyen is 40 days later, 5 April. | quotation: Adyen on NOTIFICATION_OF_CHARGEBACK: 'This webhook message marks the start of the defense period.' For Mastercard: 'You must provide your defense documents within **40 days**.' 24 February plus 40 days is 5 April 2027.; fact: On Stripe the same moment is a Dispute object whose deadline is the field `evidence_details.due_by`, which can be read again. | `sequence`: The claim's path to Adyen. → The first record of it that Larkfield receives, and what Larkfield must make of it. |\n| p12 | evidence | With the notification comes the debit: €120.00 and the €15.00 fee leave Studio Noord's balance account under the logic sent on 2 February, before anyone has read any evidence. | quotation: Adyen: 'Adyen processes the chargeback and debits the payment amount and the chargeback processing fee from your account'; for Mastercard 'The chargeback debit usually occurs a few days after you receive the NoC'. Adyen publishes no amount for the fee.; scenario: The studio received €117.47 for the sale and is debited €120.00 plus €15.00; Larkfield keeps its €2.53 fee; the ledger places the notification and the debit on the same day. | `cause_effect`: The notification and its deadline. → The money movement that accompanies it and whose balance it lands on. |\n| p14 | process | Larkfield's ledger books the debit from the provider's report and not from the webhook (K3): two entries dated 24 February, one for the amount and one for the fee, signed as in the ledger chapter, both tied to a dispute record that says they can still be reversed. | fact: Adyen's Balance Platform Accounting Report 'tracks all balance changes on all balance accounts in your balance platform, including liable accounts and the accounts of your users' and has transfer types for a chargeback, a chargeback reversal and a second chargeback.; scenario: Under K3 (an entry for every movement, written from report lines, never from webhooks): +120.00 on 'owed to Studio Noord' and −120.00 on 'funds at provider'; +15.00 and −15.00 on the same accounts for the fee. Signs as in chapter 12: a positive line on an account of what Larkfield owes pays the debt down. In 2025 chargeback fees had no entries: €73,500 of the unexplained €412,000. | `sequence`: The debit at the provider. → The same debit in Larkfield's own books, the channel it is read from and the sign convention of its lines. |\n| p13 | analysis | The booking of that debit, now in the ledger, is the only confirmation that the instruction of 2 February was right, and it can go wrong without any error: a wrong or closed balance account sends it to Larkfield's liable balance account, and a studio balance that cannot cover it leaves Larkfield standing behind it. | quotation: Adyen: 'The API request validates only the format of the split instructions, **not** the balance accounts specified in the request'; if the balance account does not exist or belongs to a closed account holder, 'the full transaction and its fees are booked to your platform's liable balance account'. Of the liable balance account: 'Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks.' | `contrast`: The debit and its two entries, booked where the instruction said. → The ways the same hand-off fails silently, and who pays then. |\n\n### 3 March: One Answer, Sent Once\n\n**Controlling idea** (`process`, id `answer`): Larkfield has two real choices, accept or defend, makes the choice by a policy written in advance, and sends on 3 March the only answer the rules allow, built from what the booking app already held.\n\n**Advances the thesis** (S3): Shows the single submission, its deadline on each provider and why its contents had to exist before the claim.\n\n**Transition in:** `cause_effect`: A dispute record with a deadline of 5 April and a debit already booked. → What the merchant side can do about it, and when.\n\n**Order of paragraphs** (`chronological`): The decision, the submission, then what happens to a team that cannot make the submission in time; the failure comes last because it is defined by the deadline the second paragraph gives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | analysis | The choice on 24 February is between accepting and defending; a refund is not a third option, and defending has a price of its own. | quotation: Adyen: 'A chargeback fee is charged for every booked chargeback', and one reason it gives for accepting is that the amount 'does not outweigh the risk of losing the chargeback fee for the second booked chargeback'. Stripe: 'You can’t issue a refund outside the dispute process while the dispute is open.'; fact: Adyen auto-defends 'Chargebacks with a fraud reason code for which there was a liability shift'. |  |\n| p16 | process | On 3 March Larkfield submits its defense once: the logged-in purchase and the two check-ins, which neither provider lets it amend afterwards. | quotation: Adyen: 'Submitting the defense documents is irreversible' and 'There is no opportunity later in the process to provide information or to update information you provided.' Stripe: 'You’ve only one opportunity to submit your response.'; fact: Deadlines for the merchant: Adyen 40 days for Mastercard, 18 days for Visa (9 in the United States and Canada since 21 July 2025); Stripe 'usually 7-21 days, depending on the card network'; the Visa rules give the acquirer 30 calendar days. | `sequence`: The decision to defend. → The submission itself, its contents and its deadline. |\n| p17 | cause_effect | A team that has to assemble evidence after the notification, or that never sees the notification, loses by default when the defense period ends. | quotation: Adyen on DISPUTE_DEFENSE_PERIOD_ENDED: 'You have not defended the dispute within the timeframe, or the defense period ended because you accepted liability for the chargeback and will not defend the dispute.'; scenario: The Silent Webhook of 14 September 2026 dropped events for 9 hours; under K2 open disputes are swept against the provider's own record. | `contrast`: A defense sent 33 days before the deadline from records that already existed. → The same step for a team without the records or without the notification. |\n\n### 5 March to 12 May: The Money Returns Before the Verdict\n\n**Controlling idea** (`process`, id `provisional`): Adyen credits the €120.00 back two days after the defense, while the issuer is still reviewing it; the credit could have been taken again, and the dispute is won only when the issuer's time runs out on 12 May.\n\n**Advances the thesis** (S4): Separates the favorable event (the reversal) from the outcome (the expiry of the issuer's time) and shows the branch that would have reversed the credit.\n\n**Transition in:** `time`: The defense submitted on 3 March. → What comes back, and how long it stays uncertain.\n\n**Order of paragraphs** (`chronological`): The credit, the branch that could have followed it, then what did follow; the branch sits in the middle because it is what makes the credit provisional and the final event meaningful.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | On 5 March a chargeback reversal credits €120.00 to Studio Noord's balance account, and both Adyen's wording and Larkfield's ledger treat it as provisional. | quotation: Adyen on CHARGEBACK_REVERSED: 'This stage is not final and a second chargeback can be presented by the issuing bank, resulting in losing the chargeback case'; for Mastercard: 'The issuer is still reviewing the defense. If they accept, this is the final status.'; table: Ledger entries of the dispute: 24 February amount (+120.00 owed to Studio Noord, −120.00 funds at provider); 24 February fee (+15.00, −15.00); 5 March reversal (+120.00 funds at provider, −120.00 owed to Studio Noord); 12 May no entry, the dispute record changes state. |  |\n| p19 | explanation | Until the issuer's time ran out it could have rejected the defense, and Larkfield would then have received a second chargeback, final, for the €120.00 again. | quotation: Adyen for Mastercard: the issuer escalates 'by filing a Pre-Arbitration case within **45 days** of the date that the defense was uploaded'; 'The Pre-Arbitration case is accepted when the response time expires'; 'If the case is accepted, the dispute is lost, and you receive a second chargeback'; in scheme arbitration 'you can incur a fee of up to USD 600'.; reasoning: 3 March plus 45 days is 17 April 2027. A lost defense costs the studio €135.00 by the ledger's count, and Adyen's statement that a fee is charged for every booked chargeback means a second fee may apply. | `contrast`: The credit of 5 March. → What could still have undone it, and by when. |\n| p20 | example | The dispute is won on 12 May 2027 by an event that moves no money and does not say whether the issuer accepted the defense or let its time run out. | quotation: Adyen on ISSUER_RESPONSE_TIMEFRAME_EXPIRED: 'The issuer either accepted your defense of the dispute, or did not respond in time.' Its timeframes table gives 70 days from the defense date for the final decision on a Mastercard dispute.; scenario: Outcome chosen for the ledger: the event arrives on Wednesday 12 May 2027, 70 days after the defense (illustrative); the dispute record is closed as won and the payment row returns to 'paid'. | `time`: The branch in which the credit is taken again. → The branch that happened: nothing came, and the win was declared by a clock. |\n\n### What Winning Did Not Change: The Fee, the Count and the Open Window\n\n**Controlling idea** (`analysis`, id `after-win`): The win returned €120.00 and left three things as they were: the studio is €15.00 poorer, the dispute is in Mastercard's count for February, and the payment can still be disputed until 2 June.\n\n**Advances the thesis** (S5): Takes the three residues of a won dispute one at a time and says what would have changed each.\n\n**Transition in:** `contrast`: A dispute marked won on 12 May. → What the win left unchanged.\n\n**Order of paragraphs** (`grouping`): Money, count, what would have changed either, whose count it is, then time: the money result first because it answers the chapter's question, the count second because it is the residue a merchant least expects, the remedy third because it needs both, the counted entity fourth because it qualifies the count and leads into the inference, and the window last because it looks forward to the part's closing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | analysis | In money, Studio Noord carried €135.00 for nine days and €15.00 for good, by an instruction Larkfield sent on 2 February, with Larkfield's liable balance account behind it had the studio's balance been short. | scenario: 24 February −€135.00; 5 March +€120.00; net −€15.00 for the studio. Larkfield kept its €2.53 fee (€1.80 after the provider's cost). Under Larkfield's terms the studio carries a dispute's fee.; figure: The studio's balance as a line: down €135 on 24 February, up €120 on 5 March as a dashed segment, solid from 12 May, ending €15 lower. |  |\n| p22 | evidence | In the network's count nothing came back: Mastercard assigns the chargeback to February, the month it was received, and counts it whatever the outcome. | quotation: Stripe: 'monitoring programs don’t consider dispute outcomes'; 'Both networks assign a dispute or fraud report to the month in which they received it, regardless of when the original payment occurred'; 'Mastercard calculates the ratio of disputes or fraud to the total number of payments in the previous month'.; fact: Mastercard's Excessive Chargeback Merchant level as both providers render it: 100 to 299 chargebacks and a rate of 1.5 to 2.99%. Larkfield's 4,900 disputes of 2025 are about 408 a month against about 1.2 million online card payments a month (assumption), about 0.03%. | `contrast`: The money, most of which came back. → The count, none of which did. |\n| p23 | analysis | What would have changed the loss is authentication at the sale, and what would have changed the count is a dispute that never arrived; Larkfield acted on the loss with a 3-D Secure rule for first typed-card purchases of €100 or more. | fact: Stripe: Mastercard counts a chargeback 'regardless of whether it was hidden due to a refund' and regardless of liability shift; Visa's fact sheet says the VAMP ratio 'Excludes disputes resolved through pre-dispute solutions'; Stripe lists €40.00 per Mastercard resolution in the Netherlands.; scenario: Larkfield's rule of April 2027: request 3-D Secure on a new member's first typed-card purchase of €100 or more; Bram's pass was such a purchase. | `problem_solution`: A loss of €15.00 and a count that winning did not remove. → What would have prevented each. |\n| p23a | analysis | The public record does not say which entity the networks count for a studio on a platform: Adyen and Stripe name the account, not the seller behind it, so Larkfield computes the ratio per studio and for the platform and treats neither as the networks' figure. | fact: Adyen shows monitoring-program standing 'only on your company account'; Stripe says Visa 'identifies an account by the static component of its statement descriptor and its acquiring bank'.; reasoning: INFERENCE callout: members see the studio's name on their statements, so a network could count the studio on its own; neither company's pages say so for a platform; Larkfield computes the ratio per network twice. | `contrast`: A count that only prevention lowers. → Where the record is silent about whose count it is. |\n| p24 | claim | The payment is not closed by the win either: it stays disputable until 2 June 2027, so its record has to be able to reopen. | fact: 120 days from 2 February 2027 is 2 June 2027. Stripe: 'In extremely rare cases, you might receive more than one dispute per payment'; Adyen: American Express 'can reopen a dispute that was previously closed in your favor'. | `additional_support`: Two things the win left unchanged. → A third: the time during which the payment can still come back. |\n\n### The Whole Dispute in Twelve Rows\n\n**Controlling idea** (`synthesis`, id `step-table`): Laid out as twelve steps, the dispute shows that after the claim Larkfield decides only one thing, and that almost every row is confirmed only by a later record from another party.\n\n**Advances the thesis** (S6): Puts every step, record, promise and failure in one table with the chapter that owns each mechanism, on Adyen.\n\n**Transition in:** `conclusion_summary`: The dispute told in date order. → The same dispute as a table of hand-offs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | evidence | The twelve rows give, for each step, the party that acts, the record it produces, the promise that record makes and the failure that can occur there, with the chapter that owns the mechanism. | table: Step table of twelve rows (sale and authentication; split with chargeback logic; evidence at the sale; cardholder's claim; chargeback through the network; notification; debit and fee; ledger entries; defense; chargeback reversal; issuer's time expires; count and open window), columns Step \\| Party or system \\| Message or record \\| Promise made \\| What can fail here → chapter. |  |\n| p26 | analysis | Read down the promise column, the table shows where a record was easy to mistake for a fact: the payment marked paid, the notification delivered once, the split accepted without validation and the credit of 5 March. | figure: Sequence figure: cardholder, issuer, network, provider, platform and studio balance as columns; arrows for the claim, the chargeback, the notice, the debit of €135, the single defense, the credit of €120 and the final state. | `elaboration`: The table of twelve rows. → What reading one column of it shows. |\n\n### The Same Dispute on Stripe: One Object, and the Platform Pays First\n\n**Controlling idea** (`comparison`, id `on-stripe`): Had Studio Noord been on Stripe, five of the twelve rows would hold a different record: one Dispute object in place of the events, Larkfield's platform balance debited first, money returned only on a win, and a lost status that can still change.\n\n**Advances the thesis** (S6, S4): Reads the rows that differ on the other provider and says which record an integration waits for on each.\n\n**Transition in:** `contrast`: The twelve rows as Adyen records them. → The rows that change on Stripe.\n\n**Order of paragraphs** (`comparison`): The differing rows side by side first, then the one with the largest consequence (whose balance pays), then where the comparison cannot be completed from public sources.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | comparison | On Stripe the dispute is one Dispute object with a status, the money moves when it is created and when it ends, and the last status is no more final than Adyen's reversal. | table: Rows that differ: the record (events keyed by references vs a Dispute object with a status); the deadline (40 days Mastercard, 18 Visa vs `evidence_details.due_by`, 'usually 7-21 days'); when money returns (on the reversal, provisionally vs only on a win); the fee (non-refundable, amount in the contract vs €20.00 received and €20.00 countered at Netherlands list price); what is not final (CHARGEBACK_REVERSED vs `lost`, which can become `won`).; quotation: Stripe: 'These funds are held for the entire duration of the dispute'; 'in rare cases the status can change from `lost` to `won`'. |  |\n| p28 | analysis | The same Larkfield terms produce a different first payer on Stripe, because there the charge type decides: a dispute on a destination charge debits Larkfield's platform balance, and getting the studio's share back is a second step that Larkfield has to time. | quotation: Stripe: the balance debited for the disputed amount on indirect charges is the 'Platform’s balance, with or without `on_behalf_of`'; 'If you challenge the dispute, wait for the dispute outcome before reversing the transfer'; 'Regardless of a dispute’s outcome, Stripe doesn’t automatically refund the application fee'.; scenario: Larkfield's Stripe studios are legacy Custom connected accounts charged by destination charges with `on_behalf_of`; at list price the debit would be €120.00 plus €20.00. | `emphasis`: Five rows that differ. → The one with the largest consequence: whose balance is debited first. |\n| p29 | explanation | The comparison stops where the public record does: Adyen's chargeback fee, Mastercard's own rule text and a call that returns a dispute's state on Adyen were not available, and the pairing of the two vocabularies is this book's own. | fact: Adyen's terms (clause 8.2) call the chargeback fee non-refundable and leave the amount to the merchant agreement; its pricing page lists none and its Canadian fee disclosure shows CAD 24.00; Mastercard's rule documents returned HTTP 403 (ruling 17); the Disputes API pages read describe actions on a dispute and no read call; neither company publishes a mapping to the other's terms. | `contrast`: What the two providers document. → What neither documents, and what this chapter therefore leaves open. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Everything the merchant side could do about Bram de Wit's dispute it had done by 2 February: the exemption that left the loss with the merchant, the instruction that named the studio's balance, the session and check-ins that became the defense. Everything after 24 February was reading other parties' records in the right order and booking them as provisional: a notification, a debit, a credit that was not yet an outcome, an expiry that was. A dispute is therefore prepared at the sale and only recorded afterwards.\n\n**So what:** A team that treats disputes as support cases finds out who pays, with what evidence and against which deadline on the day the money has already left. A team that has read this journey sets the chargeback logic or charge type knowing it is choosing who pays, stores the authentication outcome and the evidence with every sale, books the debit from the report the day it arrives, and keeps its own count per network.\n\n**Callback:** The hook: Studio Noord's balance falling by €135.00 on 24 February 2027 with nobody having decided anything. The reader can now say who had decided it and when: Adyen's exemption request and Larkfield's chargeback logic, both on 2 February. They can also say what became of the €135.00: €120.00 back on 5 March, final on 12 May; €15.00 gone; one chargeback in February's count for good.\n\n**Takeaway** (`course_of_action`): Take one ordinary payment, one failed renewal, one refund made after payout and one dispute from your own system and fill in a step table for each. For every row write the record that confirms the row before it. Start work at the rows where that cell is empty.\n\n**Hand-off** to [Part X — BETS: Where Stripe and Adyen Diverge](part-10.html): `cause_effect`: Four journeys that showed the same payment recorded in two vocabularies: a retrievable object on Stripe and a reference plus events on Adyen, a charge type against an instruction on the payment, one status against a provisional credit. → The companies themselves as the subject: their histories, licenses, figures and stated strategies, and whether one explanation accounts for the differences the reader has now seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | synthesis (list) | Established: the debit precedes the ruling on both providers, the merchant side answers once against the provider's deadline, the networks count a dispute on receipt whatever its outcome, and the booking of a chargeback follows the chargeback logic on Adyen and the charge type on Stripe. |  |  |\n| p31 | synthesis (list) | Depends on context: whether to defend, whose balance should be debited first, and how much authentication to request, each of which turns on amounts, on the sellers and on distance from a threshold. |  | `contrast`: What the documents establish. → What changes with the situation. |\n| p32 | recommendation (list) | The author's synthesis: a dispute is prepared at the sale and only recorded afterwards, and an outcome should be a state on a dispute record, never an edit to an entry. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labeled as such. |\n| p33 | recommendation (list) | Seven questions let the reader test whether a system is ready for its next chargeback. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p34 | synthesis | The four journeys end in the same place by different roads: in each, the first success message came from the step that made a promise, and the news of whether it was kept came later, from another party, on another channel, into another system. | scenario: The four pairs: the approval on Mila's screen on 9 March against the settlement report two days on; the decline of 1 April against a membership whose state no payment record holds; the split of 9 March against a refund debited on 18 March from a balance already paid out; a payment closed in February against a chargeback three weeks later.; figure: Four short timelines, one per journey, each with a first message at the left and a later record at the right, and a gap between them. | `conclusion_summary`: The fourth journey and its questions. → What all four journeys of Part IX have in common. |\n| p35 | synthesis | Together the four set one number that no single journey states, and they account for the €412,000 that opened the part: a payment's record has to stay open, and its ledger entries correctable, until the slowest later report can no longer arrive. | scenario: The Unexplained €0.4 Million of year-end 2025: €317,200 of refunds after payout, €73,500 of chargeback fees, €21,300 of rounding; none of them a failed payment. Journey 3 produced the first as a ledger entry and Journey 4 the second. The slowest report for a card payment is a dispute: 120 days, to 2 June for Bram's payment and about 7 July for Mila's. | `cause_effect`: The pattern the four journeys share. → The number that follows from it and the part's opening difference of €412,000. |\n| p36 | recommendation | The cheapest improvements to a payment system are therefore at its hand-offs, and the way to find them is to walk one payment of each kind through a step table. | scenario: Keel: K1 one key per business event, K2 the provider's record over the webhook, K3 a ledger entry for every movement with a reconciliation run when each provider's reports are ready, K5 renewals paced and retried by decline code, K6 verification as state; K8 adds no orchestration product. | `cause_effect`: Failures that sit between mechanisms. → Where to spend first, and an exercise that finds the gaps. |\n| p37 | transition | The four journeys showed the same payment recorded in two vocabularies without saying where the difference comes from, which is the question Part X takes up with the two companies as its subject. |  | `cause_effect`: Two providers that put the confirming record in different places. → The companies themselves, and whether one explanation accounts for the differences. |\n\n## Non-goals\n\n- The dispute lifecycle in general: reason-code families, Visa's two flows, pre-dispute products, monitoring-program thresholds and fines, and the payer's rights outside cards. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- How 3-D Secure works, the exemptions and when the liability shift applies. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- How a provider scores a payment for fraud and how dispute labels train the models. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- The account models, who is the merchant and who stands behind a negative seller balance. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- Split instructions, transfer reversals, payout schedules and recovery of a seller's shortfall. See [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Ledger design and the reconciliation job. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- The webhook receiver's contract and the payment record's states. See [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html), [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html).\n- Why the two providers differ, as companies. See [Part X — BETS: Where Stripe and Adyen Diverge](part-10.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Adyen's chargeback fee amount is contractual (terms clause 8.2: non-refundable, set in the merchant agreement; CAD 24.00 in Canada's standard disclosure); the €15.00 is the ledger's illustration.\n- Adyen's documentation says 'A chargeback fee is charged for every booked chargeback', so a defended and lost dispute may cost two fees; chapters 4 and 25 and the ledger count €135.00 for a lost dispute (one fee). This chapter keeps €135.00 and states the possible second fee in the branch; a reviewer should decide whether the earlier pages need a note.\n- The journal-spec thesis gives the merchant's deadline as '18 days at Adyen for a Visa card'; Bram de Wit's card is a Mastercard (ledger), for which Adyen's deadline is 40 days. The chapter states both and uses 40 days for the dates.\n- Adyen's Mastercard page gives the issuer 45 days from the defense to file pre-arbitration, and its timeframes table gives 70 days from the defense for the final decision; the chapter states both and places the final event at 70 days.\n- Which entity Mastercard and Visa count in their monitoring programs for a studio on a platform (the studio, the platform's merchant account, or both) is not stated in the pages read.\n- Mastercard's own rules were not readable (ruling 17); every Mastercard figure is Adyen's or Stripe's rendering.\n- Journeys 1 to 3 and the Part IX opening were not yet written when this page was drafted; the part closing relies on their journal-spec entries and the ledger.\n\n## Decision log\n\n- **2026-11-17** — Outcome of the €120 dispute: won. The defense of 3 March is followed by a chargeback reversal on 5 March and by ISSUER_RESPONSE_TIMEFRAME_EXPIRED on 12 May 2027; the studio keeps the loss of the €15.00 fee. Chosen because it demonstrates the two beliefs a loss cannot (winning returns the money and leaves the count; the favorable event is not the outcome), keeps every figure of chapters 4 and 25 valid, and lets the losing branch be stated with its documented cost. Rejected: Lost by second chargeback: it would force a choice between the ledger's €135.00 and the €150.00 that Adyen's 'fee for every booked chargeback' implies.; Accepted without defense: the ledger already records a defense submitted on 3 March.\n- **2026-11-17** — Tell the journey in date order from 2 February and place the step table after the narrative. Rejected: Open with the step table as a map: twelve rows of event names before any date or amount.; Start at 24 February and flash back to the sale: it would present the loss assignment as a discovery, not a decision.\n- **2026-11-17** — Show Stripe in one or two sentences at each step and collect the rows that differ in a short closing section with a table, since Studio Noord is on Adyen in the ledger. Rejected: Two full step tables, one per provider: most rows would repeat.; A 'Where They Differ' section: journeys do not have one (style guide).\n- **2026-11-17** — Carry the part's closing as three paragraphs under their own heading inside the conclusion region, after the take-aways and questions and directly before the hand-off to Part X, so the part ends on its own synthesis. Rejected: A body section before 'What to Take Away': the part-level view would be followed by a step back down to the single dispute.\n- **2026-11-17** — No separate 'When it goes wrong' section: each step's failure is told at the step and collected in the table's last column, as the part's reading device requires. Rejected: A failure section repeating chapter 4's table.\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md — The contract for Journey 4 and the part.\n  - _journals/payments-platform-architecture/journal-spec.json — Intent, acceptance criteria, thesis and role, copied unchanged; the part's closing; the transitions of this page and of Part X.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — The €120 dispute and every addition that mentions it (chapters 4, 5, 12, 25, 33, 35), the €412,000 breakdown, Keel decisions.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md — Rulings 7, 10, 12, 15, 17, 22 and 23.\n  - refunds-reversals-and-disputes, three-d-secure-and-sca, platform-payment-models, splits-balances-and-platform-payouts, payment-ledgers, payment-reconciliation-and-reporting, payment-fraud-and-risk — The mechanisms the journey walks through and the provider facts already established there.\n- **External**\n  - Adyen documentation, n.d., accessed 2026-11 (dispute flow, Mastercard chargebacks, dispute timeframes, manage disputes, Disputes API, dispute and fraud monitoring, SCA exemptions, split chargebacks, account structure, Balance Platform Accounting Report) — The events of a Mastercard dispute, deadlines, the provisional reversal, the fee per booked chargeback, the chargeback logic and its fallback; re-fetched on 17 November 2026.\n  - Stripe documentation and pricing, n.d., accessed 2026-11 (how disputes work, responding, Connect disputes, monitoring programs, the Dispute object, arbitration, Netherlands pricing) — The Dispute object, the debit at creation, the single submission, the balance debited per charge type, what the monitoring programs count, list fees; re-fetched on 17 November 2026.\n  - Visa Core Rules and Visa Product and Service Rules, 24 October 2026; Visa Acquirer Monitoring Program fact sheet, 2025 — The 120-day limit, the acquirer's 30 days, the exclusion of pre-dispute resolutions from the VAMP ratio.\n\n## Changelog\n\n- **2026-11-17** — Revision after the round-1 draft check. Spec repairs: p23 split into p23 (what would have changed the loss and the count) and p23a (which entity the networks count, with the INFERENCE callout); in the debit section p13 (silent failures of the booking) moved after p14 (the ledger entries), with both transitions and the section's flow rationale updated. Draft: Keel labels made consistent with the ledger (K3 an entry for every movement, written from report lines; K2 the provider's record as truth, the webhook as doorbell); the sign convention of the ledger lines stated as in chapter 12; the €135.00 named as €120.00 plus the €15.00 fee; the reversal fee type no longer implies a fee is charged (ruling 46f, verification row 54); the notification paragraph and the count paragraph reordered; the provider's deadline explained against Visa's 30 days; 'the fee it avoids' names Stripe's €20.00; Larkfield's Stripe charge type stated at the sale; 'row 7' names its table; 'the number is a duration' clarified; the conclusion's synthesis now closes the hook's €135.00. No claim changed.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: the deadline's length and date stated where the defense period starts (p11), the charge type named in p28, and the step-table section's controlling idea corrected. Notes not acted on: moving the question of which entity the networks count from p23 to p22; opening the 3 March section on the decision of 24 February.\n- **2026-11-17** — Initial outcome spec written from the PLAN contract, the journal-spec entry, the ledger and the chapters the journey walks through; provider quotations re-fetched on this date. Status draft.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('within 18 days at Adyen for a Visa card' -> 'within a deadline counted in days (at Adyen, 40 for a Master').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('(18 days for Visa outside the US and Canada at Adyen; 'usual' -> '(at Adyen 18 days for Visa outside the US and Canada and 40 ').\n- **2026-11-17** — Verification pass: 81 claims checked (70 confirmed, 1 corrected, 8 hedged, 0 unsupported and removed or relabeled, 1 unreachable; 1 restated from chapter 25 and not re-checked at source); the sentence that a missed Adyen notification is found only in the Customer Area was corrected to Adyen's daily Dispute transaction details report, and the fee and monitoring statements were made specific (fee types per event, cost of a won and a lost defense as illustration, Mastercard's programs named).\n- **2026-11-17** — Reconciliation after verification (parts-9-10): intent, thesis and role re-synced with the corrected journal-spec entry; unit descriptions brought into line with the verified prose and the rulings. No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: three statements of absence re-tested with a wide search (documentation and help-center sitemaps, adyen.com legal and license pages, web search). Overturned: the wait before the liable account is debited (30 days, reserved compensation account; ruling 41a) and whether the chargeback fee is returned (terms clause 8.2: non-refundable). Narrowed: the fee amount (contractual; CAD 24.00 in Adyen Canada's standard fee disclosure). Four sources added; units unchanged.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen's chargeback fee is not published (Stripe's' -> 'Adyen's chargeback fee amount is contractual, with only CAD ').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen does not publish its chargeback fee, so the €15 is ill' -> 'Adyen's terms (clause 8.2) call the chargeback fee non-refun').\n- **2026-11-17** — Sweep of rulings 46 to 48: intent and thesis how_why no longer say Adyen's chargeback fee is not published; the amount is contractual (terms, clause 8.2), with CAD 24.00 in Adyen Canada's fee disclosure, as the prose already says (46f). Prose and units unchanged.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
