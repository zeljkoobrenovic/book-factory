<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-10 entry and the part thesis, opening and flow in journal-spec.json (the part thesis claim as reworded with the author's approval), the scenario ledger, and a full reading of the five written chapters of Part X (46 to 50) after their verification and the absence audit (rulings 41 to 46). The page makes no external factual claim of its own: every statement about Stripe, Adyen or another company repeats one that a chapter of the part makes and cites, in that chapter's wording, hedges and dates.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part X reads five chapters in order: Stripe as a case, Adyen as a case, the architectural bets compared one by one, three contrast cases (PayPal and Braintree, Checkout.com, Block), and what is moving in November 2026, which also closes the book.\n- **Know:** How the evidence is read: company documents researched on 17 November 2026; every claim dated; documented, widely reported and inferred statements kept apart; Stripe is private and publishes volume and customer counts in annual letters, Adyen is listed and files audited accounts, so their figures are not alike; each case ends with what the record could not establish.\n- **Know:** The reading under test: that Adyen chose to own the regulated money path and Stripe the developer's abstraction over it, and that the part finds this supported for some choices, contradicted for one and undecidable for others.\n- **Be able to:** Say, before reading a case, which kinds of statement about a company they should expect to find sourced and which marked as inference or as not public.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to IX and are about to read the two company cases, or who arrive with one sentence about Stripe or Adyen ('it is a bank', 'it is for startups', 'it builds everything itself') and want to know where it is tested.\n\n**Already knows:**\n\n- Parts I to IX: the payment's journey, acquirer, e-money institution and partner bank, the ledger, the platform account model, and one 'Stripe and Adyen: Where They Differ' table per chapter.\n- Larkfield in outline: a fictional studio-software platform that runs on both Stripe and Adyen and rehearses a switch between them (K8).\n- The common shorthand for the two companies: the bank and the API, the enterprise one and the startup one.\n\n**Does not yet know:**\n\n- The dated record of either company: licenses, named acquirers, acquisitions, published figures and their definitions; each is owned by a case chapter and only named here.\n- How the part labels evidence (documented, widely reported, inferred, not public) and why Stripe's and Adyen's figures are not alike.\n- That the shorthand holds for some choices, fails for one and cannot be decided for others.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters in order, what each examines, the reading the part tests and how the evidence is labeled. *Probe:* After reading only this page: what will each chapter of this part examine, in order, what claim about Stripe and Adyen does the part test, and how is the evidence in it read? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with the two dated facts of the part's hook and does not describe either company in general terms before them. | `no_weak_introduction_pattern` | rubric | minor |\n\n## Thesis\n\n**Question:** What do the public records of Stripe and Adyen show about how the two came to build payment infrastructure differently, and how far does the reading 'Adyen owns the regulated money path, Stripe owns the developer's abstraction over it' hold?\n\n> **Claim:** The records show an order of construction, not a division of territory, and they show sequence more than motive: Adyen, founded in 2006, built on an acquiring license it obtained in its first years and on enterprise customers, and became a bank (EU 2017, US 2021, UK 2023) on one platform it built and runs on servers it manages itself, while Stripe launched in 2011 with an API for developers and assembled the regulated layer afterward, market by market, from e-money licenses, named acquirers, most of them partner banks, and, since 2025, narrow charters. The reading holds for banking and hosting, fails for card acquiring in Europe and much of Asia-Pacific, where Stripe's own entities are the acquirer, cannot be tested on Stripe's motives or on how much volume each named acquirer carries, because Stripe has published neither, and by 2026 each company was moving toward the other's position.\n\n**Disputed by:** The view that the two made opposite and stable architectural choices: Adyen the bank that owns the whole chain, Stripe the software layer over other people's banks, so that choosing between them is choosing between owning the money path and renting it. Its commercial version is 'Stripe for startups, Adyen for enterprises'.\n\n**So what:** A team that accepts the claim stops choosing a provider by its slogan and compares bet by bet, with a date on every row: which entity acquires and holds funds in each country it sells in, what the pricing default is, which products were built and which bought, and what the provider has not published. It also treats the choice as one to revisit, as Larkfield (fictional) does with 44% of its volume on Stripe, 56% on Adyen and a rehearsed switch between them (K8).\n\n**How and why:** Each company's own documents carry the argument. Adyen's 2025 annual report says it chose to 'develop and operate the essential layers of the financial stack ourselves' and to work 'without relying on partner banks'; Stripe's site says 'Stripe is not a bank' and its 2023 release says 'We couldn't run without AWS'. Those support the reading. Stripe's acquirer disclosure (accessed November 2026) names Stripe entities as acquirer across Europe and much of Asia-Pacific and lists a Stripe limited-purpose bank among its US acquirers (the Georgia regulator's bulletin dates its approval to 30 June 2025 and its start of business to 28 May 2026; the US regulator of national banks gave Stripe's Bridge preliminary conditional approval for a trust charter in February 2026); Adyen reports 84% of 2025 volume as full-stack and names banking partners in locations where it has no acquiring license; on 1 July 2026 Adyen closed two acquisitions, the only ones its history page lists, one of which it described in June 2026 as run under an incubator model. Those cut against it. Stripe has published no reason for using partner banks, no share of volume per acquirer and no revenue; Adyen lists the countries and regions where it has an acquiring connection names its acquiring entity for some markets and gives no complete list per country; it says the integration of what it bought has begun and gives no date for its completion. On those points the part says the record is silent and does not infer.\n\n**Supporting claims**\n\n- **P10-1** — Stripe's dated record shows a company that made the developer's interface its product first (one API and object model, self-serve onboarding, a published history of its own API design) and then widened from it in two directions: outward into a suite of billing, tax and finance products, several of them bought, and downward into the regulated layer, which it holds as a non-bank through e-money licenses, partner banks and, since 2025, narrow charters. Its public numbers are volume and customer counts it selects, never revenue.\n- **P10-2** — Adyen's dated record shows a company that chose to operate the regulated layers itself for enterprise customers (its own platform, acquiring, banking licenses and data-center capacity) and reports the result in audited figures; the single platform has edges Adyen itself discloses, and since 1 July 2026 it describes Adyen's payments and banking, not the whole company, because loyalty and usage billing were bought.\n- **P10-3** — Compared bet by bet, the documented differences are of three kinds: differences of kind that hold in November 2026 (a bank against an e-money institution with partner banks; own data-center capacity against AWS), differences of default, sequence or degree that narrowed in 2025 and 2026 (acquiring, build or buy, first customers and pricing, billing products, the API model), and questions the public record cannot decide; a customer should therefore choose per bet and per country, not per brand.\n- **P10-4** — PayPal, Checkout.com and Block show that the two anchors are not the ends of one line: each holds something neither anchor does (a consumer wallet, a set of acquiring licenses started later, the seller's till and an industrial bank), and read together they support the inference, labeled as the author's, that what a provider holds traces to the customer relationship it started with.\n- **P10-5** — The changes under way in November 2026 (agent-initiated payments, stablecoins, instant account-to-account payments, new EU rules) move or shorten a promise in the payment chain without removing the need to track it, and each company's response repeats its starting point while the two keep converging: Stripe co-authors protocols and owns a stablecoin stack, Adyen implements several protocols and has published one clause on stablecoins, and both bought a usage-billing company in 2026.\n\n## Role in the part\n\nStates the reading the part tests, the rules for reading company evidence and the order of the chapters, so that the two cases are read as evidence for a question and not as company profiles.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on two dated facts from 2026, one per company, that the reader's shorthand cannot explain, and widens them into the part's question, then narrows: from the shorthand the reader brings and why the earlier parts could not settle it, to the reading under test and what the part finds, to the rules by which the evidence is read, to the five chapters in order, to one paragraph per chapter. The two facts have to come first because 'the bank and the API' sounds settled until a dated line from each company contradicts it (and AC-2 asks for it). The claim has to precede the evidence rules because the rules matter only once the reader knows a claim is being tested and that part of the verdict is 'cannot be decided'. The evidence rules have to precede the chapter list because each chapter paragraph states what a company has documented and what is the author's inference, and the reader must know the labels before meeting them. The chapter paragraphs keep the part's own order, which the journal spec justifies: the two records first, then the comparison that reasons across them, then three companies that test the reasoning, then the positions in motion and the book's closing.\n\n## Introduction\n\n**Hook** (`intriguing_example`): On 9 April 2026 an Adyen press release said: 'Unlike many providers that rely on a patchwork of acquired technologies and third-party integrations, Adyen has built its entire financial technology stack on a single platform.' Fourteen days later Adyen announced that it would buy Talon.One for €750 million, and on 11 June that it would buy Orb for $335 million; both deals closed on 1 July. By November 2026 the page on which Stripe, whose site says 'Stripe is not a bank', lists its US acquirers named, next to five partner banks, 'Stripe MALPB, 505 N Angier Avenue NE, Atlanta': a limited-purpose bank of Stripe's own.\n\n**Bridge:** The reader's own shorthand for the two companies (the bank and the API, the enterprise one and the startup one), and the 'Where They Differ' tables of Parts I to VIII and the four journeys of Part IX, which gave documented differences and no account of where they come from. → The companies' own documents read with dates: what each said it chose, what its filings and legal pages show, and where neither says anything. Larkfield, the fictional platform this book follows, runs on both, so the question is practical: what exactly differs between the 44% of its volume on Stripe and the 56% on Adyen.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p03.): The records show an order of construction, not a division of territory, and sequence more than motive: the reading 'Adyen owns the regulated money path, Stripe owns the developer's abstraction over it' holds for banking and hosting, fails for card acquiring in Europe and much of Asia-Pacific, where Stripe's own entities are the acquirer, cannot be tested on Stripe's motives or on volume per acquirer, and by 2026 each company was moving toward the other's position.\n\n**Roadmap** (paragraph p05):\n\n- Five chapters in order: Stripe as a case; Adyen as a case; the bets compared one by one; three other answers (PayPal and Braintree, Checkout.com, Block); and what is moving in November 2026, which also closes the book. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Two dated facts from 2026: on 9 April an Adyen press release set the company apart from providers that rely on 'a patchwork of acquired technologies', and by 1 July Adyen had closed the purchases of Talon.One and Orb; and in November 2026 the US acquirer list of Stripe, whose treasury documentation says 'Stripe is not a bank', named a limited-purpose bank of Stripe's own next to five banks. | fact: As chapter 47 quotes and cites: Adyen's press release of 9 April 2026, 'Unlike many providers that rely on a patchwork of acquired technologies and third-party integrations, Adyen has built its entire financial technology stack on a single platform.'; agreements to buy Talon.One (23 April 2026, 'a total consideration of €750 million') and Orb (11 June 2026, '$335 million'); 'Both transactions officially closed on July 1, 2026'.; fact: As chapters 46 and 49 quote and cite: Stripe's treasury documentation (n.d., accessed November 2026), 'Stripe is not a bank.'; Stripe's acquirer disclosure (n.d., accessed November 2026) lists 'Stripe MALPB, 505 N Angier Avenue NE, Atlanta' among its US acquirers, next to five banks; the Georgia regulator's May 2026 bulletin gives its begin-business date as 28 May 2026; Stripe's terms call it 'a Georgia Merchant Acquirer Limited Purpose Bank'.; figure: Figure 1: two halves. Left, a statement card about building everything on one platform, dated April, followed by two bought product boxes dated July. Right, a list of six acquirers, five generic banks and a sixth marked as the provider's own. |  |\n| p02 | context | Neither fact fits the shorthand the reader brings (the bank and the API, the enterprise one and the startup one); the tables of Parts I to VIII and the journeys of Part IX gave documented differences and no account of where they come from, and for Larkfield, the fictional platform that runs 44% of its volume on Stripe and 56% on Adyen, the question is practical. | reasoning: The part's transition_in and bridge: Part IX showed the same payment recorded in two vocabularies (a retrievable object on Stripe, a reference plus events on Adyen; funds per transaction on one and per sales day on the other); with the 'Where They Differ' tables the reader holds documented differences and no explanation.; scenario: Larkfield (fictional): 2026 member payment volume 44% on Stripe (€493 million) and 56% on Adyen (€627 million). | `contrast`: The two dated facts, one per company. → The shorthand they do not fit, and why the earlier parts could not test it. |\n| p03 | claim | The part tests one reading, that Adyen owns the regulated money path and Stripe the developer's abstraction over it, and finds an order of construction instead of a division of territory: the reading holds for banking and hosting, fails for card acquiring in Europe and much of Asia-Pacific, cannot be tested on Stripe's motives or on volume per acquirer, and by 2026 each company was moving toward the other's position. | reasoning: The part thesis as it stands in the journal spec, and chapter 48's sorting and conclusion: two differences of kind (a licensed bank against e-money institutions with partner banks; infrastructure Adyen manages itself against AWS), the rest differences of default, sequence or degree that narrowed in 2025 and 2026; 'the map therefore shows an order of construction, not a division of territory'; Stripe's own entities named as acquirer in the EEA, the United Kingdom and much of Asia-Pacific (chapter 46); Stripe has published no reason for its partner-bank model and no share of volume per acquirer (chapter 46, 'Where the Evidence Stops'). | `problem_solution`: The shorthand and the lack of an account of where the differences come from. → The shorthand stated as a reading to test, and what the part finds. |\n| p04 | context | The evidence is read by fixed rules: company documents researched on 17 November 2026, every claim dated, documented and widely reported statements kept apart from the author's inference, 'not public' said where the record is silent; Stripe is private and publishes volume and customer counts it selects, Adyen is listed and files audited accounts, so their figures are not alike, and each case ends with what the record could not establish. | fact: As the chapters state: research cut-off 17 November 2026; three kinds of statement (documented, with its year or 'n.d., accessed November 2026'; a named secondary source; inference only in blocks marked INFERENCE, NOT DOCUMENTED) (chapters 46 and 47, 'How to Read This Case'); 'Not public' means not found by 17 November 2026, not proof of absence (chapter 48); Stripe is private, its numbers come from annual letters and press releases that nobody audits, and it has never published revenue or a margin (chapter 46); Adyen's Annual Report 2025 is audited (chapter 47); both cases end with 'Where the Evidence Stops'. | `elaboration`: The verdict, part of which is 'cannot be tested'. → The rules by which a statement about a company is admitted, and why the two companies' figures differ in kind. |\n| p05 | transition | Five chapters carry the test in order: Stripe as a case, Adyen as a case, the bets compared one by one, three other answers, and what is moving in November 2026, which also closes the book; the cases come before the comparison so that every row has a dated record behind it. | reasoning: The part's roadmap and flow rationale: the cases give each record on its own terms; the comparison reasons across them; the contrast cases test that reasoning on three companies that started elsewhere; the last chapter shows the positions moving and closes the book. Stripe comes first because an engineer has most likely met its API already.; figure: Figure 2: two record folders side by side feeding one comparison card, three smaller folders beside the card, and an arrow onward labeled as moving. | `sequence`: The reading under test and the rules of evidence. → The five chapters in reading order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question about the two companies' records, says what is documented and what is the author's inference, and has its own Larkfield case; each relies on the chapters before it.\n\n**Advances the thesis** (P10-1, P10-2, P10-3, P10-4, P10-5): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five chapters in order (p05). → One paragraph per chapter: the question in bold, what the record shows, what is inference and the Larkfield case.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. The two cases come first and ask the same questions of each company, Stripe before Adyen because the reader has most likely met Stripe's API. The comparison needs both records. The contrast cases need the comparison's reading to test. The chapter on what is moving needs every position fixed before it can say what changes, and carries the closing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | The Stripe case answers what Stripe's dated record shows about how a developer platform became financial infrastructure and what a builder can use: an API in 2011, a suite built and bought around it, a regulated layer held per market by a company that is not a bank, volume published and revenue never; the interface practices transfer and the machinery does not, and Larkfield records the Stripe entity that acquires in each of its markets. | fact: As chapter 46 documents: launch in 2011, Connect in October 2012, Billing, Issuing and Terminal in 2018; ten named purchases from 2020, two not confirmed closed on 17 November 2026; Stripe companies named as acquirer in the EEA, the United Kingdom and much of Asia-Pacific, the European ones e-money institutions; in the United States Stripe is a payment facilitator of six named acquirers, five banks and its own Georgia bank; $1.9 trillion of 'total volume' for 2025, undefined; revenue and margin never published; four interface practices (idempotency keys, dated versions, a payment object whose state can be read again, a ledger whose clearing accounts must empty) against about 2,000 shards and about 400 deploys a day.; scenario: Larkfield (fictional): its acquirer inventory records Stripe Technology Europe, Ltd. for its Dutch, German and Belgian studios ot decidable from the public record; it adds no new fact, and Larkfield's chief executive asks which provider to keep. | fact: As chapter 48 argues from the owning chapters: eight bets (license and money-holding; acquiring; build or buy; one platform or a suite; first customers with pricing and the API model; hosting; billing and revenue products; platforms); differences of kind: a licensed bank against e-money institutions with partner banks, own infrastructure in data centers against AWS; the others narrowed in 2025 and 2026; the chapter adds no new fact.; scenario: Larkfield (fictional): in October 2027 chief executive Sofie Vermeer asks which provider to keep; Femke de Graaf answers with the provider comparison card from the toolkit, and Larkfield keeps both. | `conclusion_summary`: The two records, each on its own terms. → The two set side by side on the same rows and sorted by the evidence behind each. |\n| p09 | description | The contrast cases answer what PayPal and Braintree, Checkout.com and Block each show that the two anchors cannot: each started with another customer and holds something neither anchor holds, which supports the author's inference that a provider holds the permissions its first customers required; the evidence is filings and releases about business models, and Larkfield owns the relationship with both studio and member. | fact: As chapter 49 documents: PayPal's filing for 2025 describes 'a global, two-sided network' of 439 million active accounts and says Braintree products 'generally have higher expense rates'; Checkout.com reports ten acquiring licenses and announced on 9 September 2026 US acquiring under a Georgia Merchant Acquirer Limited Purpose Bank charter, the kind Stripe holds; Block relies on banks and acquiring processors for a majority of its transactions and owns a Utah industrial loan company that lends to its sellers; five volume figures under five definitions, not ranked; the first-customer reading is labeled the author's inference, which three cases cannot prove.; scenario: Larkfield (fictional): it owns the relationship with the studio (through the scheduling software) and with the member (through the booking app); Stripe and Adyen own neither; that made K8 possible; Larkfield holds no license. | `additional_support`: The comparison's reading, traced to each company's first customers from two cases only. → Three companies with other first customers. |\n| p10 | description | The last chapter answers which changes under way in November 2026 alter how payment infrastructure should be built and which to watch: agents, stablecoins and instant payments each move one promise, each carries a date and a release phase, and the advice is to build what every variant assumes; Larkfield's new head of payments engineering sorts a folder of three proposals, and the chapter closes the part and the book. | fact: As chapter 50 documents: agent-initiated payments change who authorized the purchase, stablecoins what the money is held and settled in, instant payments when the money has moved; four labels (announced, preview, limited availability, generally available) read on 17 November 2026; Adyen's agent product released in limited availability for US enterprise merchants, Stripe's stablecoin balances in preview, the EU's new payment rules agreed and not yet law; neither company has published a volume for any of it.; scenario: Larkfield (fictional): in January 2027 Femke de Graaf starts as Head of Payments Engineering and finds a folder of three proposals written in November 2026 (assistants that pay, stablecoin payouts to the US studios, Wero in place of iDEAL), which she sorts into build, prepare and watch. | `time`: The positions as fixed in November 2026. → What is changing under all of them, and the book's closing. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the five chapters are one test: two records, a comparison that reasons across them, three companies that check the reasoning, and the positions in motion; a reader who enters at one chapter finds the same rule there, a date and a source on every statement.\n\n**So what:** Faced with a sentence about a provider, the reader asks who documented it, when, under which definition, and what the record does not say, before using it to choose.\n\n**Callback:** The opening's two dated facts: Adyen's April 2026 sentence about acquired technologies followed by two acquisitions, and the bank in the acquirer list of the company that 'is not a bank' (p01). The reader is told that by the end of the part the two facts read as steps in one direction, each company adding what the other began with; the full callback is left to chapter 50, which carries the part's closing.\n\n**Takeaway** (`course_of_action`): Begin with the Stripe case: the first of the two records, read for what supports the label 'the abstraction' and what does not.\n\n**Hand-off** to [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): `elaboration`: The reading under test (Adyen the regulated money path, Stripe the developer's abstraction), the two dated facts from 2026 and the rules for labeling evidence. → The first of the two records in full: Stripe's history, products, licenses, figures and engineering publications by date.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | synthesis | The chapters are one test and are best read in order, because the comparison rests on the two records before it, though a reader with one question can enter at the matching chapter; by the end the two opening facts read as steps in one direction; begin with the Stripe case. |  |  |\n\n## Non-goals\n\n- Either company's record, the comparison, the contrast cases or the 2026 changes in any detail; the page summarizes and does not re-argue the chapters. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html his book; Stripe before Adyen rests on the reader's familiarity, as the journal spec declares; 'eight bets' is first counted in the comparison paragraph, where the count belongs.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass: 46 claims checked against the five chapters of Part X as they read now (41 confirmed, 0 corrected, 4 hedged to the chapter's wording, 1 unsupported and reworded to the part thesis, 0 unreachable); most significant fix: 'Adyen's own data centers' became 'infrastructure Adyen manages itself', since chapters 47 and 48 document managed infrastructure and name no operators.\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
