<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a payout, a payout rail, a cut-off, a value date, a payout return and an instant payout are.\n- **Know:** The documented payout states at each provider: at Stripe, 'paid' that may become 'failed' within five business days, and 'posted' then 'returned' for Global Payouts; at Adyen, 'booked' followed by tracking events and possibly 'returned'.\n- **Know:** What the EU's verification of payee rule (in force for euro-area providers since 9 October 2025) and the UK's Confirmation of Payee check before a transfer, and what each provider exposes of it.\n- **Believe:** 'Paid' on a payout means the provider sent it; arrival is a separate fact that often has to be inferred from the absence of a return.\n- **Believe:** A returned payout is a new credit that reopens a debt to the payee, not an undo of the original.\n- **Be able to:** Design a payout record with separate states for instructed, sent, arrived and returned, and say how long it must stay open.\n- **Be able to:** Given a rail and a time of day, reason about when the transfer is processed and when a failure could still surface.\n- **Be able to:** Decide what to do with a payee-name check that returns a close match or no match, and say who carries the loss if the sender continues.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a payout marked complete that the payee never received, the reader explains what happened and what the payout record should have looked like. *Probe:* A platform marks a seller's payout 'completed' when the provider's notification says the payout is paid. Eight days later the seller says nothing arrived, and the provider shows a balance for that seller that is higher than the platform's own records say. Using only this chapter: what most likely happened, and how should the platform have recorded the payout? | `custom` | cold_reader | blocker |\n| AC-2 | The reader can say how the two providers' payout interfaces differ in what the sender chooses, and what follows for an adapter over both. *Probe:* You must send the same third-party payout through either provider. What do you choose in the request at Stripe's Global Payouts and what at Adyen's Transfers API, and which of the two tells you the money arrived? | `custom` | cold_reader | major |\n| AC-3 | Product availability, limits, fees and cut-off times are stated with 'as of November 2026' and marked as likely to change. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How does money leave the provider and reach a bank account, and what happens when it does not arrive?\n\n> **Claim:** Money leaves the provider through two processes that finish at different times: the provider's accounting debits the balance when it instructs the transfer, and a bank rail then delivers or returns it on the rail's own clock, so a payout marked 'paid' has been sent, not received. A transfer that does not arrive comes back days later as a new credit, and Stripe and Adyen both document payouts this way.\n\n**Disputed by:** The view that a payout is the last step of a payment and ends when the provider reports it paid, so that a payout failure is an error returned by the API at request time.\n\n**So what:** A platform must keep every payout open until the return window has passed, link each return to the payout it undoes and to the payee it now owes again, and check the payee before sending, because Stripe's documentation says funds sent to a wrong account might not be recoverable.\n\n**How and why:** Batch rails accept a transfer first and reject it later: the receiving bank finds the account closed or the details wrong and sends the money back. Stripe's documentation (accessed November 2026) says a failed payout 'might initially show as paid' and change to failed within five business days, that a posted Global Payout 'doesn't guarantee that your recipient has received money', and that the funds of a returned one come back 'in a separate transaction'. Adyen's (accessed November 2026) splits the lifecycle into accounting events up to 'booked' and tracking events after it, says a non-instant payout 'cannot fail' but can be returned, and creates a new transaction for the return. The documented difference is in what the sender controls and learns: Stripe's Global Payouts lets the sender name the network, Adyen's Transfers API takes a priority and chooses the route, and Adyen confirms arrival for instant bank transfers. Checks of the payee's name before sending (required of euro-area providers since 9 October 2025, and offered in the UK as Confirmation of Payee) move the error to a warning before the money leaves; both providers pass the result to the sender and leave the decision there. Which rail either uses for a standard merchant payout in each country is not published.\n\n**Supporting claims**\n\n- **S1** — A payout is two processes on two clocks: the provider's accounting debits the balance when it instructs the transfer, and a bank rail then delivers it according to its own cut-offs, business days and limits.\n- **S2** — Batch rails accept a transfer first and reject it later, so a failed payout comes back days after it was marked sent, as a new credit and not an undo, and Stripe and Adyen both document it that way.\n- **S3** — The documented difference between the two providers is in what the sender controls and learns: a named network at Stripe's Global Payouts, a priority mapped to a route at Adyen, and a confirmed arrival only for instant transfers.\n- **S4** — A check of the payee's name before sending moves the error from money gone to a warning, and leaves the decision to continue, and its consequences, with the sender.\n- **S5** — A payout record therefore needs separate states for instructed, sent, arrived and returned, must stay open through the return window, and must link each return to its payout and payee.\n\n## Role in the part\n\nFollows a balance out of the provider's ledger onto a rail it does not control, and leaves the part with its sharpest case of two records that disagree: 'paid' at the provider and nothing at the bank. Supports P3-3 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in two-clocks, rails, lifecycle: each supplies the vocabulary the next uses; `comparison` in designs, where-they-differ; `chronological` in in-practice, when-it-goes-wrong)\n\nThe reader meets 412 payouts that were marked paid and came back before any term is defined, so the two processes arrive as the explanation of a failure they have already seen. The rails follow because the second process cannot be reasoned about without them, and the providers' documented states come only then, since they are read as instances of the two processes. The payee check sits after the returns because its case is the one failure a return does not report. Designs come after all the mechanisms they choose among; the provider comparison after the facts it tabulates; the worked payout and the remaining failures last, because they use the four-state record. Opening with the rails would be a catalogue without a question; putting the comparison table before the lifecycles would compare statuses the reader cannot yet read.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A studio owner calls support: the dashboard has shown her payout as 'Paid' for eight days, and her bank account shows nothing. The support agent can see that the provider debited the balance on the day it said it would. Both statements are true.\n\n**Bridge:** An engineer reads a status field named 'paid' the way they read HTTP 200: the operation completed. → On a payout the field reports what the provider did, and the bank that had to finish the job answers later, on another system's clock, or not at all.\n\n**Thesis statement** (KEY POINTS bullet 1 and paragraph p02): A payout is two processes that finish at different times: the provider debits the balance when it instructs the transfer, and a bank rail then delivers or returns it on its own clock. 'Paid' means sent; a transfer that does not arrive comes back days later as a new credit.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from Larkfield's 412 payouts that were marked paid and came back. *Kept in:* scene.\n- Separate the provider's accounting from the bank rail's delivery, with the vocabulary of rails, cut-offs, value dates and returns. *Kept in:* two-clocks, rails.\n- Read the payout states Stripe and Adyen each document, including how a failed payout comes back. *Kept in:* lifecycle.\n- Explain the check of the payee's name before sending, in the EU and the UK, and what each provider exposes of it. *Kept in:* payee-check.\n- Compare three ways to record a payout and what a faster rail costs, then compare the two providers. *Kept in:* designs, where-they-differ.\n- Work one payout through Larkfield's record on both providers and list the ways a payout fails after it was sent. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A payout shown as paid for eight days and a bank account that never received it can both be accurate records. | scenario: A studio owner's call to support: 'Paid' in the dashboard, nothing at the bank, the provider's balance debited on schedule. |  |\n| p02 | claim | A payout is two processes on two clocks, the provider's accounting and a bank rail's delivery, so 'paid' reports that the money was sent and a failed delivery returns later as a new credit. |  | `problem_solution`: The two true statements that disagree. → The two processes that explain them, and the chapter's claim. |\n| p03 | context | In the journey of Mila's class pass this chapter is the step where Studio Noord's €117.47 leaves Adyen's books for Ines Bakker's bank account, due there on Thursday 11 March 2027, which is a different fact from the record state 'arrived' set on 25 March. | scenario: Mila's €120.00 pass bought Tuesday 9 March 2027 at 19:42; studio share €117.47; payout due in the account Thursday 11 March (best case); record state 'arrived' on Thursday 25 March. | `place`: The chapter's claim about payouts in general. → Its position on the recurring payment's journey. |\n| p04 | transition | The chapter goes from Larkfield's returned payouts to the two processes and the rails, then the providers' documented lifecycles and returns, the payee check, the ways to record a payout, the comparison of Stripe and Adyen, a worked payout and the failures that remain. |  | `sequence`: The claim and where it sits on the journey. → The order in which the chapter argues it. |\n\n## Sections\n\n### Setting the Scene at Larkfield: 412 Payouts Marked Paid\n\n**Controlling idea** (`example`, id `scene`): In June 2026 Larkfield recorded 412 payouts as finished that the receiving banks sent back, and it had no place to record a payout that returns.\n\n**Advances the thesis** (S2, S5): Shows the cost of a record with one final state before any mechanism is named.\n\n**Transition in:** `example`: The claim that 'paid' means sent. → One company whose payout record treated it as arrived.\n\n**Order of paragraphs** (`chronological`): What happened, why it stayed invisible, then the questions it left: the reader arrives at the chapter's questions the way Femke did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In June 2026 a form that let studio owners change bank details without checking the account holder led to 412 payouts worth €386,000 being returned by receiving banks over three weeks. | scenario: The Payout That Bounced: 412 payouts, €386,000, three weeks, June 2026. |  |\n| p06 | cause_effect | The returns sat unreconciled because Larkfield's payout record ended at 'paid', so a credit that arrived days later had no payout to attach to and no owner. | scenario: 19 days to pay every studio; two studios left; Aylin Demir's support team heard first. | `cause_effect`: The 412 returned payouts. → Why nobody saw them: the record had no state after 'paid'. |\n| p07 | claim | The incident leaves three questions the chapter answers: what 'paid' asserts, how long a payout can still come back, and what should have stopped the transfer before it left. |  | `conclusion_summary`: The record that ended too early. → The three questions Femke de Graaf takes into the Keel program in 2027. |\n\n### Two Processes, Two Clocks: Why “Paid” Means Sent\n\n**Controlling idea** (`explanation`, id `two-clocks`): A payout is the provider's accounting followed by a bank rail's delivery, and the provider controls and observes only the first.\n\n**Advances the thesis** (S1): Establishes the two processes and the vocabulary (payout, payout rail, cut-off, value date, payout return) that every later section uses.\n\n**Transition in:** `elaboration`: The question of what 'paid' asserts. → The two processes inside one payout.\n\n**Order of paragraphs** (`prerequisite_order`): Payout is defined before its two processes; the processes before the consequence for the status field; the return last, because it is the second process reporting back. Reordering would use 'rail' and 'return' before they are defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A payout is the provider sending money it owes from a balance in its books to a bank account outside the provider, which distinguishes it from a transfer between two balances inside the provider. | quotation: Stripe: 'Stripe sends funds from your available balance to your bank account as payouts.' |  |\n| p09 | process | The first process is accounting inside the provider's ledger: check the balance, reserve the amount, debit it, and it finishes when the provider decides. | fact: Adyen's accounting events: received, authorised ('we reserve the payout amount on your balance account'), booked ('Adyen deducts the funds from your balance account and creates a transaction'). | `sequence`: The payout as money leaving the provider's books. → The first of its two processes, which stays inside those books. |\n| p10 | process | The second process is delivery on a payout rail, the bank network that carries the instruction to the receiving bank, which runs to cut-off times and business days and credits the payee with a value date of its own. | table: Who holds the money and who can see it at each step: provider ledger, provider's bank or direct connection, the rail, the receiving bank, the payee's account.; fact: Adyen: 'There are specific times during a business day, called cut-off times, when Adyen stops processing bank transfers for settlement within the settlement delay.' | `sequence`: The debit that ends the accounting process. → The delivery process that starts there, with rail, cut-off and value date defined. |\n| p11 | cause_effect | Because a batch rail does not confirm the credit to the sender, the status a provider shows after sending describes its own action, and both providers say so. | quotation: Stripe Global Payouts: 'A posted status doesn’t guarantee that your recipient has received money, because their bank might delay the release of funds.' Global Payouts is glossed at first use as Stripe's product for paying third parties who are not merchants on Stripe, with `posted` as its status after sending.; fact: Adyen: for non-instant bank transfers the tracking webhook carries tracking.estimatedArrivalTime, an estimate, where instant transfers get a credited status.; figure: Two timelines side by side: the provider's ledger (instructed, debited) and the rail (submitted, cut-off, receiving bank, credited or returned). | `cause_effect`: Delivery happening on a network the provider does not run. → What that does to the meaning of the provider's status. |\n| p12 | definition | A payout return is the receiving bank sending the money back after the rail accepted the transfer, typically because the account is closed or the details do not match, and it reaches the sender as a new transaction days later. | quotation: Stripe: 'Incorrect destination information causes most returned payouts (for example, the provided bank account is closed, or the account holder’s details don’t match the recipient’s information).' | `elaboration`: A status that cannot confirm arrival. → The one signal the second process does send back: the return. |\n\n### The Rails a Payout Travels On\n\n**Controlling idea** (`comparison`, id `rails`): Which rail carries a payout decides when it is processed, whether the sender gets a definite answer and what it costs.\n\n**Advances the thesis** (S1): Shows that the second clock is not one clock: each rail has its own schedule, limits and failure behavior.\n\n**Transition in:** `elaboration`: The rail as the network outside the provider. → The rails that exist and how they differ.\n\n**Order of paragraphs** (`large_to_small`): The table of rails first, then the three properties that matter for an integration one at a time (cut-offs, business days and value dates, instant), then the cross-border case that adds parties. The table must come first because the later paragraphs refer to its rows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | comparison | Payout rails differ mainly in whether they process in batches or one transfer at a time, when they operate, and whether the sender learns the outcome. | table: Rails: SEPA Credit Transfer, SEPA Instant Credit Transfer, ACH, Faster Payments, wires (Fedwire, SWIFT), push to card; columns: where, how it processes, what the sender learns, where the providers name it.; fact: Stripe's Global Payouts pricing lists ACH next day, ACH same day, RTP, Fedwire, SEPA Credit Transfer, SEPA Instant Credit Transfer, Faster Payments and SWIFT as rails. |  |\n| p14 | example | Cut-off times turn the time of day into a processing date, as Adyen's published table shows. | fact: Adyen cut-off examples as of November 2026: SEPA regular 15:45 CET same day; UK regular 19:30 GMT with settlement delay T+3; UK fast 21:00 GMT same day; US regular 01:45 ET; transfers after the cut-off are processed the next day. The Adyen transfer priority (regular, instant, crossBorder; mapped by Adyen to a route) is glossed at first use here.; fact: Stripe: same-day manual payouts in EUR if initiated before 4 pm Europe/Copenhagen; payments and payouts processed according to UTC. | `example`: Batch rails that operate on a schedule. → Published cut-offs and what happens after them. |\n| p15 | explanation | Rails and banks count business days, so a payout's arrival date is an expectation computed from calendars, and the value date is the receiving bank's to set. | fact: Stripe's Payout object: arrival_date is the 'Date that you can expect the payout to arrive in the bank. This factors in delays to account for weekends or bank holidays.'; fact: Adyen: 'Adyen cannot process payouts on bank holidays'; after initiation 'your bank may need up to three more business days to post the funds.' | `additional_support`: Time of day deciding the processing date. → Weekends, holidays and the receiving bank's own posting adding to it. |\n| p16 | comparison | An instant rail replaces the schedule with a synchronous answer within seconds, around the clock, at the price of an amount limit and banks that cannot be reached. | fact: Regulation (EU) 2024/886: the payee's PSP makes the amount available 'within 10 seconds'; euro-area PSPs had to offer sending instant credit transfers by 9 October 2025; charges 'shall not be higher' than for other credit transfers.; fact: Adyen: instant priority 24/7, maximum 100,000.00 EUR in SEPA and 1,000,000.00 USD in the US; 'while most banks can process regular transfers, some do not support instant transfers.'; table: Requirements of a payout on a batch rail and on an instant rail: how fast, how definite the answer, when it operates, what failure looks like. | `contrast`: Batch rails with cut-offs and business days. → Instant rails, which answer at once. |\n| p17 | explanation | A payout that crosses a border adds intermediary banks and a currency conversion, so the amount that arrives can differ from the amount sent. | quotation: Adyen: with the cross-border priority 'payout delays and additional fees may occur due to intermediary banks. As a result, the beneficiary may receive a lower amount than the instructed value.'; fact: Stripe Global Payouts, as of November 2026: SWIFT 20.00 EUR per payout; FX fee 0.50% on 20 listed currencies and 1.00% on all others, the higher of the two currencies' rates applying; Adyen pays out to third parties in local currencies with two exceptions. | `additional_support`: Domestic rails, batch and instant. → The cross-border case, with more parties and a conversion. |\n\n### How a Payout Leaves, and How It Comes Back, at Each Provider\n\n**Controlling idea** (`evidence`, id `lifecycle`): Stripe and Adyen both document a payout as a sequence of states in which the money can come back after the state that looks final.\n\n**Advances the thesis** (S1, S2): Gives the documentary evidence for both halves of the thesis: the states up to sent, and the return as a new movement.\n\n**Transition in:** `example`: Rails and the two processes in general. → The states each provider's documentation gives a payout as it passes through them.\n\n**Order of paragraphs** (`chronological`): The order a payout lives through: scheduled, sent, mapped to common states (with the limit of the public record about how it is carried between them), returned, retried; the case that never returns closes the section because the next section answers it. Returns before the states would describe a movement out of states the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | explanation | A standard payout is a scheduled batch that carries many payments, and its schedule controls when it is sent, not when funds become available. | quotation: Stripe: 'Choosing a payout schedule doesn’t change how long it takes for your pending balance to become available. It only controls when payouts are sent.'; fact: Adyen: payouts follow the payable batch; 'After the payable batch closes, it can take one to two business days for the payout to be initiated'; on platforms a managed payout schedule is Standard ('two business days after capture') or Accelerated (one). |  |\n| p19 | process | Stripe's Payout object moves from pending to in_transit to paid, and the documentation says a paid payout may still become failed within five business days. | quotation: Stripe API reference: 'A payout is pending until it’s submitted to the bank, when it becomes in_transit. The status changes to paid if the transaction succeeds, or to failed or canceled (within 5 business days). Some payouts that fail might initially show as paid, then change to failed.' | `sequence`: The scheduled batch. → The states Stripe gives it once it is created. |\n| p20 | process | Stripe's Global Payouts, its product for paying third parties, uses a different object whose states are processing, posted and returned, and posted is defined as funds leaving, not arriving. | fact: OutboundPayment statuses: processing, failed, canceled, posted, returned; 'Creating an OutboundPayment doesn’t mean that Stripe has sent the funds'; reviews 'typically take up to 2 business days'. | `similarity`: The Payout object for a merchant's own balance. → The parallel states of the third-party payout product. |\n| p21 | process | Adyen splits the lifecycle into accounting events that end at booked and tracking events after it, and only an instant bank transfer gets a status that says the funds arrived. | fact: Tracking after booked: instant bank transfers 'receive a credited status when the funds arrive, or failed'; payouts to cards get accepted; non-instant bank transfers get tracking.estimatedArrivalTime.; fact: 'After a payout reaches the booked status, but before the funds leave Adyen, the payout is automatically analyzed'; if it fails manual review 'Adyen freezes the funds and does not pay them out externally'. | `contrast`: Stripe's single status field per object. → Adyen's two groups of events, accounting and tracking. |\n| p22 | comparison | The three vocabularies map onto four states an integrator needs (instructed, sent, arrived and returned), because those are the points at which the answer to 'where is the money?' changes; on a batch rail neither provider has a status for arrived. | table: Rows instructed, sent, arrived, returned; columns Stripe Payout, Stripe Global Payouts OutboundPayment, Adyen transfer. | `conclusion_summary`: Three documented lifecycles. → One set of four states they can be translated into. |\n| p25 | explanation | Neither provider publishes which rail or bank carries a standard merchant payout in each country, or how often payouts are returned, so anything beyond the documented states is inference. | reasoning: Stripe's payouts page names no rail for standard payouts (its Global Payouts pages do); Adyen's April 2026 press release says its banking licenses enable 'direct connections to payment rails' without listing them; no return rates are published by either. | `contrast`: The documented states, mapped onto four. → What the documentation leaves out between them: the rails, the banks and the return rates. |\n| p23 | evidence | Both providers document a failed delivery as a new movement that credits the balance, days after the payout was sent. | fact: Stripe: 'It can take up to 5 additional business days for your bank to return the payout and inform us that it failed'; the Payout's failure_balance_transaction is 'the balance transaction that reverses the initial balance transaction and returns the funds from the failed payout back in your balance'.; quotation: Stripe Global Payouts, returned: 'The payout failed to arrive at the destination. Stripe returns the funds to you in a separate transaction... Payouts are typically returned within 2–3 business days, but might take longer depending on the recipient country.'; quotation: Adyen: 'Payouts that do not have an instant priority cannot fail, but they can be returned by the counterparty's bank... A new transaction is created for the return.'; fact: Adyen merchant payouts: five business days after the batch closed, filter the Aggregate settlement details report on journal type BankInstructionReturned. | `time`: The documented states up to sent, and where the public record of them stops. → What both providers record when the delivery fails afterwards. |\n| p24 | comparison | What follows a return differs by product: Stripe reattempts a standard payout once the bank details are corrected, while Global Payouts and Adyen's transfers leave the next step to the sender. | fact: Stripe standard payouts: 'Stripe then reattempts the payout at the next scheduled payout interval'; Global Payouts: 'Stripe doesn’t retry or reroute payouts automatically'; Adyen: a list of priorities is tried in order when a route is unavailable, which happens before sending. | `sequence`: The return as a credit. → Who sends the money again. |\n| p26 | claim | A transfer to a valid account that belongs to someone else produces no return, and the documentation puts that loss on the party that supplied the details. | quotation: Stripe: 'Stripe might send payouts to the wrong bank account and might not be able to recover the funds. Any fees or losses that you incur because of incorrect information fall under your responsibility.'; fact: Global Payouts reversals: US domestic ACH and Fedwire 'within 24 hours of creating the payout'; UK Faster Payments and cross-border payouts not reversible; 'Stripe can’t guarantee a reversal'. | `contrast`: Failures that come back as returns, and who sends the money again. → The failure that does not come back, which the next section answers. |\n\n### Checking the Payee Before the Money Leaves\n\n**Controlling idea** (`explanation`, id `payee-check`): A check of the payee's name against the receiving bank's record turns a misdirected payout into a warning before sending, and leaves the decision and its consequences with the sender.\n\n**Advances the thesis** (S4): Covers the one control that acts before the second clock starts.\n\n**Transition in:** `problem_solution`: The misdirected payout that never returns. → A check that can catch it before the transfer is authorized.\n\n**Order of paragraphs** (`problem_solution`): Why a wrong account succeeds, then the rule that answers it in the EU and the service in the UK, then what the two providers expose, then what to do with the result. The recommendation needs the result codes, which need the rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | cause_effect | Bank transfers are routed by account identifier and not by name, so a valid number that belongs to the wrong person is a successful transfer. | fact: Regulation (EU) 2024/886, Article 5c(8), refers to 'the execution of a credit transfer to an unintended payee on the basis of an incorrect unique identifier, as laid down in Article 88 of Directive (EU) 2015/2366'. |  |\n| p28 | evidence | Since 9 October 2025 payment service providers in the euro area must check the payee's name against the account before the payer authorizes a credit transfer, tell the payer the result, and still let the payer proceed. | quotation: Article 5c: 'A payer’s PSP shall offer the payer a service ensuring verification of the payee... immediately after the payer provides relevant information about the payee and before the payer is offered the possibility of authorising that credit transfer.'; fact: On an almost-match the PSP shows the name on the account; the service is free of charge; it must not prevent the payer from authorizing; non-consumers may opt out for payment orders submitted as a package; non-euro member states comply by 9 July 2027. | `problem_solution`: Routing by number alone. → The EU's verification of payee rule. |\n| p29 | evidence | The United Kingdom has run the equivalent check, Confirmation of Payee, since 2020 as a service between banks. | quotation: Pay.UK: 'Since launching in 2020, over 300 organisations have already implemented CoP, with more than 2m checks being completed every day'; 'CoP is an API-based peer-to-peer service, with no central infrastructure in place, but with a directory identifying the organisations in the ecosystem.' | `similarity`: The EU rule. → The older UK service that does the same job. |\n| p30 | comparison | Both providers pass the result of the check to the sender: Stripe in the Dashboard and API flows of Global Payouts, Adyen through an endpoint for its enterprise payouts. | fact: Stripe Global Payouts: for a GBP payout from a UK financial account to a UK bank account the results are Match, Partial Match or No Match, and Unavailable, with 'Continue without match' in the Dashboard, and a recipient_verification result that must be acknowledged in the API; a Stripe support article says 'When initiating a payout to an EU recipient in the Dashboard, Stripe will perform the VoP check'.; fact: Adyen: POST /verifyCounterpartyName for 'enterprise bank account holders', domestic EU and UK accounts; responses nameMatch, partialNameMatch, noNameMatch, nameMatchNotSupported; the account name is returned only on a partial match 'to safeguard against name-guessing'. | `example`: The two national schemes. → What Stripe and Adyen each expose of them. |\n| p31 | recommendation | The sender should treat a no-match as a stop, route a close match to a person with the returned name in front of them, and record who decided to continue, because the consequences of continuing fall on the sender. | quotation: Stripe: 'Only continue without a match if you’re confident the bank account belongs to the intended recipient. Funds sent to the wrong bank account might not be recoverable.'; fact: Article 5c(8): a PSP 'shall not be held liable for the execution of a credit transfer to an unintended payee on the basis of an incorrect unique identifier... provided that it has fulfilled the requirements of this Article'; PSPs must inform users of the implications of ignoring a notification. | `cause_effect`: A result handed to the sender. → What the sender should do with each result, as the author's judgement. |\n\n### Three Ways to Record a Payout, and What Speed Costs\n\n**Controlling idea** (`comparison`, id `designs`): A payout can be recorded as finished when the provider says paid, held open through a return window, or confirmed by an instant rail, and the third costs money and has limits.\n\n**Advances the thesis** (S5, S3): Turns the mechanism into the design choice the so_what names, and prices the alternative of confirmed arrival.\n\n**Transition in:** `sequence`: Controls before sending. → How to record the payout after it is sent.\n\n**Order of paragraphs** (`comparison`): The three designs in order of increasing certainty, then the separate question of paying people who are not merchants on the provider, to which the same designs apply, then the table that compares them. The table must follow the three designs it summarizes and closes the section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | comparison | The first design copies the provider's status into one field and treats paid as final, which is correct for most payouts and silent about every return. | scenario: Larkfield's record in June 2026. |  |\n| p33 | comparison | The second design keeps four states and leaves a sent payout open for a return window, inferring arrival from the absence of a return. | fact: Documented windows: Stripe paid may become failed within 5 business days; Global Payouts returns typically within 2–3 business days, longer by country; Adyen advises checking for a returned bank instruction five business days after the batch closed. | `contrast`: A record that ends at paid. → A record that stays open until the return window has passed. |\n| p34 | comparison | The third design pays for a rail that confirms arrival: instant payouts, which both providers sell with a fee and a ceiling. | fact: Stripe Instant Payouts, as of November 2026: funds 'typically settle... within 30 minutes'; at most 10 a day; 0.40 to 9,999 EUR per payout in the euro area; 'Stripe assesses a fee on each Instant Payout'; the Connect pricing page as shown in euros lists 1% of payout volume.; fact: Adyen: instant is a transfer priority; 'A payout with a higher priority incurs higher fees'; no public price table; credited status on arrival. | `contrast`: Arrival inferred from silence. → Arrival confirmed by the rail, at a price. |\n| p36 | explanation | The same three designs apply to paying someone who is not a merchant on the provider, which uses a separate product at each company, with narrower availability at Stripe and a license question for the sender. | fact: Stripe Global Payouts, as of November 2026: senders located in GB and US; 22 countries in private preview; 'Global Payouts requires Treasury'; 'best for businesses that already hold the licenses required to move money themselves'; 'Payouts don’t flow through a Stripe balance belonging to the recipient, so you’re responsible for any desired tracking of recipient funds.'; fact: Adyen payouts service: payouts 'from your balance account to third-party bank accounts by using the Transfers API', funded by 'funds acquired through payments with Adyen or externally transferred funds'; packaged with liquidity management as Intelligent Money Movement on 9 April 2026. | `additional_support`: The three designs for payouts to merchants. → The products for payouts to third parties, where the same designs apply. |\n| p35 | comparison | The three designs trade cost against how soon and how surely the payer knows the money arrived, and the second is the default for scheduled payouts. | table: Designs: status copy, open window, confirmed arrival; columns: what 'arrived' rests on, cost, what it misses, when it is right. | `conclusion_summary`: The three designs, for merchants and third parties alike. → Their trade-offs side by side. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The two providers document the same sent-then-returned lifecycle and differ in what the sender chooses and what the sender is told.\n\n**Advances the thesis** (S3): States the documented difference the thesis names: network versus priority, and confirmation of arrival.\n\n**Transition in:** `conclusion_summary`: Lifecycles, checks and products described provider by provider. → The same facts aspect by aspect.\n\n**Order of paragraphs** (`comparison`): The table first, then what an integrator does about it; the advice would have nothing to refer to if it came first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | comparison | Aspect by aspect, for payouts to third parties Stripe exposes the network and publishes per-rail prices, while Adyen takes a priority, chooses the route and confirms arrival on instant transfers. | table: Aspects: status after sending; how the sender picks speed; confirmation of arrival; after a return; payee check; third-party payouts; published prices. Columns Stripe, Adyen, what the difference suggests. |  |\n| p38 | recommendation | An adapter over both should send an intent (amount, payee, latest acceptable arrival) and map it to a network list at Stripe and a priority list at Adyen, and should store the return as its own record on both. |  | `cause_effect`: The differences in the table. → What an integrator does differently on each provider. |\n\n### In Practice at Larkfield: One Payout Record for Two Providers\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield's 2027 payout record has four states, a clearing account that must empty and a window, and it would have surfaced the 412 returns as open items on the day each arrived.\n\n**Advances the thesis** (S5): Works the recommended record through the recurring payment and replays the incident against it.\n\n**Transition in:** `example`: The four-state design and the provider differences. → Both applied to Studio Noord's payout of 11 March 2027.\n\n**Order of paragraphs** (`chronological`): One payout from sent to arrived, its ledger entries, the incident replayed, then the same record on the second provider. The replay needs the entries; the second provider needs the first as the reference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | example | The payout that carries Mila's €117.47 is marked sent when Adyen books the transfer and arrived only when the window closes without a return. | scenario: Pass bought Tuesday 9 March 2027 19:42; payout reaches the account Thursday 11 March (best case; Adyen allows up to five business days from batch close to bank posting); Larkfield's window of 10 business days ends Thursday 25 March (illustrative policy).; fact: Adyen managed payouts, Standard: 'The funds arrive in your user's bank account two business days after capture.' |  |\n| p40 | process | In the ledger the payout passes through a clearing account, payouts in transit, which empties on arrival or on return and whose aged balance is the list of stranded payouts. | table: Entries: sent, arrived, returned within the window, returned after the window; debit and credit accounts for each. | `elaboration`: The states of the payout record. → The ledger entries behind each state, under Keel decision K3. |\n| p41 | example | Replayed against this record, each of the 412 returns of June 2026 would have matched a sent payout by the provider's reference and reopened that studio's balance the day it arrived. | scenario: 412 payouts, €386,000, about €937 on average; 19 days in 2026; under Keel a change of bank details triggers a payee-name check and holds the next payout. | `example`: The entries for one payout. → The same entries applied to the incident. |\n| p42 | comparison | For a studio on Stripe the same four states are fed by different signals: payout.paid sets sent, a later payout.failed sets returned, and the window is the documented five business days plus a margin. | fact: Stripe: payout.created, payout.paid and payout.failed events; status may change from paid to failed within 5 business days.; scenario: Ironworks Climbing, Ravi Shah's three locations in Manchester, on Stripe Connect. | `contrast`: Studio Noord on Adyen. → Ironworks Climbing on Stripe, with the same record and different signals. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Four failures remain after the record is fixed, and each has a signal to watch and a recovery.\n\n**Advances the thesis** (S2, S5): Tests the record against the cases the happy path and the ordinary return do not cover.\n\n**Transition in:** `contrast`: The record working as designed. → The cases it has to survive.\n\n**Order of paragraphs** (`chronological`): In the order they occur in a payout's life: before sending (duplicate, held), then after (late return, no return).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | analysis | A payout request that times out and is retried without the same idempotency key can pay a studio twice, and the defense is a key derived from the payout's business identity. | scenario: Keel decision K1: one writer, one key derived from the business event. |  |\n| p44 | analysis | A payout can be debited and not yet sent, because both providers review payouts after the accounting step and can hold or freeze them. | fact: Adyen: review after booked, funds frozen on failure; Stripe Global Payouts: status remains processing with reason under_review, reviews 'typically take up to 2 business days'. | `sequence`: A failure at the request. → A hold after the debit and before the rail. |\n| p45 | analysis | A return that arrives after the window has closed must reopen the debt with a new entry and never by editing the closed payout. | quotation: Stripe: returns 'might take longer depending on the recipient country'. | `time`: Holds before sending. → A return that comes later than the window allowed for. |\n| p46 | analysis | A misdirected payout that the receiving bank keeps produces no event at all, so the payee's complaint is the detector and a bank trace reference is the only tool. | fact: Stripe: Payout trace_id is 'A value that generates from the beneficiary’s bank that allows users to track payouts with their bank'; Adyen: 'download the bank instruction letter... and share it with your bank.' | `contrast`: A late return, which is at least a signal. → The failure with no signal. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The rails, the documented states, the payee check and the record design are one fact seen four times: the party that says 'paid' is not the party that knows whether the money arrived, so certainty about a payout is either bought from an instant rail, checked before sending, or waited for.\n\n**So what:** A platform that closes a payout on the provider's word will discover returns from its customers; one that keeps the payout open, links the return and checks the payee first discovers them from its own clearing account.\n\n**Callback:** The studio owner whose payout was 'Paid' for eight days with nothing at the bank. The reader can now say that 'Paid' was the provider's debit, that if the bank refused the transfer its answer comes back days later as a new credit to the studio's balance, and which state the record lacked; the opening owner is not Ines, whose payout arrived.\n\n**Takeaway** (`course_of_action`): Give the payout record four states and a window, book every return as a new linked entry through a clearing account, check the payee when bank details change, and take the eight questions into the next provider review.\n\n**Hand-off** to [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html): `problem_solution`: A payout the provider recorded as paid and the bank returned: two records of the same money that disagree. → Matching every expected movement against the other party's record, aging what does not match, and the reports that let customers do the same.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis (list) | Established: a payout status reports sending, a failed delivery returns as a new movement, and a payee-name check precedes euro-area credit transfers. |  |  |\n| p48 | recommendation (list) | Depends on context: the length of the window, whether instant payout is worth its fee, and how strictly to stop on a close match. |  | `contrast`: What is settled. → What depends on the platform's payees, amounts and rails. |\n| p49 | recommendation (list) | The author's synthesis: 'arrived' is a state the platform has to earn, and the studio owner's call is answered by a return the record could not hold. |  | `emphasis`: Conditional recommendations. → The author's own position, with the callback to the opening call. |\n| p50 | recommendation (list) | Eight questions let the reader test a payout design or a provider's payout product. |  | `sequence`: The take-aways. → Questions to carry into a design review. |\n| p51 | transition | A returned payout is two records of the same money that disagree, and the standing answer is to match every movement against the other party's record, which is the next chapter. |  | `problem_solution`: The disagreement between 'paid' at the provider and nothing at the bank. → Reconciliation as the practice that settles such disagreements. |\n\n## Non-goals\n\n- When funds become available, reserves, negative balances and pre-funding. See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html).\n- How a provider or a customer reconciles payouts against bank statements, and the payout reports themselves. See [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Which license lets a party hold or move other people's money, including the license question Global Payouts raises. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Splits, sweeps, payout schedules per seller and refunds after payout on a platform. See [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html), [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- Verifying a seller's bank account at onboarding and requirements that pause payouts. See [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html), [Know Your Customer, Watch the Money: Compliance as a System](payment-compliance-and-regulation.html).\n- The design of ledgers and clearing accounts in general. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html).\n- Payouts to crypto wallets and stablecoin rails. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n\n## Modalities\n\nArticle only payout scheduling (sweeps, managed payouts, delay_days) gets one paragraph and a link, since chapter 35 owns it. Rejected: A section on platform payouts\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md, contract 14 — Scope, owned terms, the Larkfield incident.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — The Payout That Bounced, Mila's class pass dates and amounts, Keel K1–K3, cast.\n- **External**\n  - Stripe documentation: Receive payouts; The Payout object; Global Payouts (overview, send money, manage payouts, pricing, comparison with Connect); Instant Payouts (n.d., accessed 2026-11) — Payout states, the paid-then-failed rule, returns as separate transactions, networks, fees, limits, Confirmation of Payee.\n  - Adyen documentation: Payout lifecycle (n.d., accessed 2026-11); Pay out to bank accounts; Verify counterparty name; Getting paid; Managed payouts; On-demand payouts (n.d., accessed 2026-11) — Accounting and tracking events, returns, priorities, routes, cut-offs, counterparty name verification.\n  - Regulation (EU) 2024/886 of 13 March 2024 (Instant Payments Regulation), Official Journal 19 March 2024 — Verification of payee (Article 5c), instant credit transfer deadlines, 10 seconds, charges.\n  - Pay.UK, Confirmation of Payee (n.d., accessed 2026-11) — UK service: launch year, scale, architecture.\n  - Adyen press release, 'Adyen launches Intelligent Money Movement', 9 April 2026 — The 2026 packaging of payouts and the statement on direct connections to rails.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 70 claims checked (59 confirmed, 6 corrected, 4 hedged, 0 unsupported and removed or relabeled, 0 unreachable; 1 labeled industry practice). Most significant fix: Stripe's Confirmation of Payee is documented for the API as well as the Dashboard, and the EU support article is now quoted directly; also the Adyen lifecycle page is cited n.d. (its 'last modified' was build metad <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
