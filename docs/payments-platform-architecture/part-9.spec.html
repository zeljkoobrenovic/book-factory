<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-9 entry and the part thesis, opening and flow in journal-spec.json, the scenario ledger, consistency rulings 10, 12, 14, 17, 22 and 24 to 29, and a full reading of the four written journeys of Part IX. The page makes no external factual claim of its own: every statement about Stripe, Adyen, a network or a regulation repeats one a journey makes and cites.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part IX follows four payments in order: Mila's €120 class pass with nothing going wrong; her €49 renewal that is declined and collected three days later; the same pass as a platform payment with an €84 refund after the studio was paid; and a €120 chargeback raised by another member, Bram de Wit.\n- **Know:** Each journey is a narrative with a step table and one sequence figure, told on Adyen (Studio Noord's provider) with the Stripe record for the same step beside it, and each step links to the chapter of Parts I to VIII that owns its mechanism.\n- **Know:** The part's claim: every mechanism can work and the payment can still go wrong, because the failures occur at the hand-offs, where a promise is taken for a finished fact.\n- **Be able to:** Pick the journey that matches the payment, renewal, refund or dispute they need to trace, and read a step table row as party, record, promise and failure.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to VIII and are about to start the journeys, or who arrive with one payment, renewal, refund or dispute of their own to trace and want the journey that matches it.\n\n**Already knows:**\n\n- What an API, a webhook, a retry, a ledger entry and a reconciliation are.\n- Parts I to VIII: each mechanism of a payment in its own chapter, from authorization to payout, billing, the platform account model and operating at scale.\n- Larkfield in outline: a fictional studio-software platform that uses Stripe and Adyen, its incidents and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- What passes from one mechanism to the next on a single payment, and which later record confirms each step.\n- The four payments the journeys follow, their dates and amounts, and why they are read in an order that is not the calendar's.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four journeys' subjects in reading order and say what form each takes. *Probe:* After reading only this page: what will each of the next four chapters follow, in order, and in what form? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say what to look for while following a journey. *Probe:* Using only this page: what should a reader watch for in each row of a journey's step table, and why does the part show two providers? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What do four payments followed from start to finish show about where a payment system fails that the chapters on single mechanisms could not?\n\n> **Claim:** Four payments at Larkfield (Mila's €120 class pass, her declined €49 renewal, the €84 refund after payout and Bram de Wit's €120 chargeback) each cross mechanisms owned by several parties, and every failure the four journeys show appears at a hand-off: the point where one mechanism's answer (an approval, a decline, a payout, a payment marked complete) is taken by the next system as final. The journeys run without loss where each hand-off carries a shared reference and is followed by a later record that confirms or corrects the earlier answer; Adyen and Stripe put those later records in different places, so an integration written for one misreads the other.\n\n**Disputed by:** The view that a payment system is the sum of its mechanisms: if tokenization, authorization, the ledger, the webhook receiver, the billing job and the payout each work and each is tested, the payment works, and an end-to-end failure must be a defect inside one of them or at the provider.\n\n**So what:** A team that accepts the claim reviews its payments by walking one payment through every system in order, not by testing components, and spends first on references, pending-state sweeps and reconciliations. Five of Larkfield's Keel decisions are of this kind: one key per business event (K1), the provider's record over the webhook (K2), a ledger entry for every movement with a reconciliation of both providers run when each one's reports are ready (K3), renewals paced and retried by decline code (K5) and verification kept as state (K6). Keel adds no orchestration product (K8).\n\n**How and why:** The mechanisms run on different clocks and belong to different parties: the wallet, the provider's risk and authentication checks and the issuer answer in seconds; clearing and network settlement take days; a payout is a bank transfer; a refund can fail days after it was accepted; a chargeback can arrive about four months later. Each step can tell the next only what it knows when it finishes, which is a promise. Whether the promise was kept is reported later by another record: a webhook, a settlement report, a balance movement, a dispute event. A system that stops listening after the first success message is wrong without any component having failed. The two providers expose the later records differently, as documented in 2026: Stripe as objects with a status that can be fetched (PaymentIntent, Invoice, Dispute), Adyen as events and report lines keyed by a PSP reference, with provisional bookings such as a chargeback reversal shown as separate events.\n\n**Supporting claims**\n\n- **P9-1** — On the path with no failure, a card payment is twelve steps (checkout, tokenization, risk scoring, authentication, authorization, capture, clearing, settlement, ledger entries, split, payout, reconciliation); the first eleven each end in a promise by the party that ran them, the customer's 'Payment successful' reports the fifth, and the merchant's money is established only by the twelfth.\n- **P9-2** — A declined renewal is an open debt with a clock, not a failed payment: the decline code and the network's retry limits decide whether and when to try again, and the state of the membership in between has to be held by the billing side, which on Stripe Billing is an invoice the provider owns and on Adyen is the merchant's own scheduler.\n- **P9-3** — On a platform the split is an instruction attached to the payment, but a refund after payout is debited from a balance the payout already emptied, and the account model chosen at integration decides whose balance goes short and who stands behind it.\n- **P9-4** — A chargeback reopens a payment that every system had closed: the money and a fee are debited before the issuer rules, the merchant gets one submission against a deadline, the dispute counts toward the network's monitoring ratio whatever the outcome, and who carries the loss was decided when the payment was made.\n- **P9-5** — In all four journeys Adyen and Stripe place the confirming record at a different point and in a different form (events and report lines keyed by a reference against objects with a fetchable status; a payment retried against an invoice retried; chargeback logic on the payment against a charge type), so each journey has to be read once per provider.\n\n## Role in the part\n\nPerforms the part's opening: the €412,000 difference of year-end 2025 as the hook, the part thesis in three points, the form every journey shares, the reason each is shown on both providers, and the reading order with the reason the order is not the calendar's.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the four journey paragraphs, in the part's reading order)\n\nThe page opens on one unexplained number, widens it into the part's claim, and then narrows. The hook comes first because it is the part's evidence that a system can be wrong with no failed payment. The bridge follows because the reader must know that Parts I to VIII taught mechanisms one at a time before being told the part teaches none and reassembles them. The claim (failures sit at hand-offs; a success message is a promise) has to precede the description of the step table, because the table's columns are the claim turned into a reading device: a reader told about 'promise made' and 'what can fail here' before the claim would see four arbitrary columns. The two-provider point belongs with the table because it answers the next question the table raises, why each row is shown twice. The evidence-limits paragraph (p05) closes the chapter list rather than preceding it: placed earlier it referred to journeys and a fee the reader had not met (draft check, round 1), so it now follows the four journey paragraphs, where every journey it names is known. The roadmap gives the order and the reason it is not the calendar's; the four chapter paragraphs keep that order, which the journal spec justifies as each journey reusing what the one before set up.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At year-end 2025 every payment in Larkfield's records had the right status, yet its books said it owed its studios €412,000 more than the two providers' balances showed. The difference was found in January 2026 and took three weeks to trace to refunds made after payout, chargeback fees and a currency-conversion rounding rule. None of the three was a payment that had failed.\n\n**Bridge:** Parts I to VIII, which explained one mechanism per chapter and showed where on one payment each sits, ending with Part VIII's rule that a money path must be correct before it is available. → The same mechanisms in the order a payment meets them: four payments at Larkfield followed through every party and system, to show what passes from each step to the next and what does not.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3; paragraph p03 states the claim and p04 the two-provider half of it.): Every failure the four journeys show appears at a hand-off, where one mechanism's answer is taken by the next system as final; a success message reports a promise, the news of whether it was kept comes later in another record, and Adyen and Stripe put that later record in different places.\n\n**Roadmap** (paragraph p06):\n\n- Four journeys, read in the order of what each adds and not by the calendar, with the dispute last although its payment was made first; the chapter list names each journey and its payment. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | At year-end 2025 Larkfield's books said it owed its studios €412,000 more than its two providers' balances showed, although every payment had the right status; the three causes found in January 2026 were refunds after payout, chargeback fees and a rounding rule, and none was a failed payment. | scenario: Larkfield (fictional), the Unexplained €0.4 Million: at year-end 2025 the ledger's 'owed to studios' balance was €412,000 higher than the two providers' balances; found and traced in January 2026 over three weeks to refunds after payout, chargeback fees and a currency-conversion rounding rule. Chapter 12 owns the breakdown.; figure: Figure 1: a row of payment records all marked with a check, and beside it two stacks, 'Books' and 'Providers', whose tops differ by a gap tagged '€412,000', with three small items in the gap: a refund slip, a fee tag and a rounding symbol. |  |\n| p02 | context | Parts I to VIII explained one mechanism per chapter, ending with Part VIII's rule that a money path must be correct before it is available (an answer may be late, but the record may not be wrong); Part IX teaches no new mechanism and instead follows four payments at Studio Noord, a yoga studio that uses Larkfield, through every party and system in the order the payment meets them, to show what passes from each step to the next. | reasoning: The part's bridge and transition_in: the mechanisms of Parts I to VIII each taught in its own chapter, ending with Part VIII's rule that a money path must be correct before it is available; Part IX as four single payments followed through all of them at once. Each journey says of itself that it teaches no new mechanism. | `contrast`: The €412,000 that no failed payment explains. → Why the earlier chapters could not show it, one mechanism at a time, and what Part IX does instead. |\n| p03 | claim | The part's claim is that every failure the four journeys show appears at a hand-off, where one mechanism's answer is taken by the next system as final: the mechanisms belong to different parties on different clocks, so each step passes on a promise, and whether it was kept is reported later by another record. A card payment is final only when the dispute window closes. | reasoning: The part thesis and its how_why: approvals in seconds, clearing and settlement in days, a chargeback up to about four months later (120 days in journey-card-payment and journey-dispute); each step can tell the next only what it knows when it finishes; a system that stops listening after the first success message is wrong without any component having failed.; figure: Figure 2: four horizontal chains of boxes, labeled 'Pass', 'Renewal', 'Refund' and 'Dispute'; the boxes carry check marks and the joints between boxes are marked in orange, with one label 'Hand-off'. | `cause_effect`: Four payments followed through every system in order. → What following them shows: the failures are at the hand-offs, and why. |\n| p04 | description | Every journey has the same form (a narrative, a sequence figure and a step table, set up in the first journey, whose rows name the party, the record, the promise and the failure, with the owning chapter), is read by asking which later record confirms each row, and is told on Adyen, Studio Noord's provider, with the Stripe record beside it because the two providers report the same step through different records at different moments. | fact: The step table of the four journeys: Step \\| Party or system \\| Message or record \\| Promise made \\| What can fail here → chapter; each journey told on Adyen, Studio Noord's provider, with the Stripe record alongside.; fact: As the journeys document: Stripe exposes the later records as objects whose status can be read again (PaymentIntent, Invoice, Refund, Dispute); Adyen as events and report lines keyed by the PSP reference, with no call in the Checkout API that returns a payment. | `elaboration`: The claim that a promise is confirmed or corrected by a later record. → The form that makes it checkable row by row, and the reason every row is shown for two providers. |\n| p06 | transition | The four journeys are read in the order of what each adds, not by the calendar: the disputed payment was made first, on 2 February 2027, five weeks before Mila's class pass of 9 March 2027, and comes last because a chargeback debits a balance the reader should first see filled, paid out and refunded. | reasoning: The part's flow rationale: each journey reuses what the one before set up; the disputed payment (2 February 2027) and its chargeback (24 February) precede the pass (9 March), the refund (18 March) and the renewal (1 April), but a chargeback debits a balance the reader should first see filled, paid out and refunded. | `sequence`: The claim and the form of the journeys. → The four journeys in reading order and why that order is not chronological. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the four journeys answers one question about one payment at Larkfield, shows one kind of hand-off, and relies on the journeys before it.\n\n**Advances the thesis** (P9-1, P9-2, P9-3, P9-4, P9-5): Each paragraph introduces the journey that argues one of the part's supporting claims and names the provider difference it shows, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The four journeys in reading order (p06). → One paragraph per journey: the question in bold, the Larkfield payment it follows and the difference between Adyen and Stripe it shows.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. Journey 1 sets up the step table and the twelve forward steps on a payment where nothing fails. Journey 2 keeps the payer and removes her presence and the approval, so its steps read as departures from a path already walked. Journey 3 opens the split and payout rows that Journey 1 only named and runs money backward by choice. Journey 4 runs money backward by the issuer's choice and needs Journey 3's balances to say whose account is debited; it also carries the part's closing. Putting the dispute first, as the calendar would, would show a chargeback debiting a balance the reader has not yet seen filled.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | Journey 1 answers what happens to one €120 card payment between the tap and the studio's reconciled payout, and nothing fails in it: it is the baseline the other three depart from; of its twelve steps the first eleven end in a promise, the success message reports the fifth step's promise and only the twelfth establishes that the studio's €117.47 (the €120 less Larkfield's €2.53) arrived. | scenario: Larkfield (fictional): Mila Janssen buys a ten-class pass for €120.00 at Studio Noord at 19:42 on Tuesday 9 March 2027; the studio's €117.47 is paid out on Thursday 11 March and the payout is matched by reconciliation.; fact: As Journey 1 documents: a Stripe <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
