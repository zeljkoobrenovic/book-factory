<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four-party model (cardholder, issuer, acquirer, merchant, with the network between the two banks) and how three-party networks, bank-transfer schemes and wallets differ from it.\n- **Know:** What processor, gateway, payment service provider, payment facilitator and platform mean, and which of them is a network member and holds money.\n- **Know:** The six steps of the timeline (authorization, capture, clearing, settlement, payout, dispute window), with what moves at each: a message, a record or money.\n- **Believe:** The provider that answers the API call reports other parties' decisions; it does not make the decisive ones.\n- **Be able to:** For any step of a card payment, name the party that acts, what it promises and whether money has moved.\n- **Be able to:** Ask of any provider, in any country, which legal entity is the acquirer for the payment.\n\n**Audience:** A software engineer or architect who is new to payments and has just been asked to integrate, operate or evaluate a payment provider.\n\n**Already knows:**\n\n- APIs, webhooks, retries, queues and databases.\n- From the preface: that the instant answer is not the truth, the sixteen failure patterns, Larkfield and Mila's €120 class pass.\n- From the part introduction: that a payment is a chain of promises, and the €120 that came back three weeks after it succeeded.\n\n**Does not yet know:**\n\n- Issuer, acquirer, card network, processor, gateway, payment service provider, payment facilitator.\n- Authorization, capture, clearing, settlement, payout, dispute, interchange.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a card payment the chapter does not contain, the reader names the parties in the order they act and says which of them holds the money at a stated moment. *Probe:* A customer in Lyon pays €60 by card in a bakery's ordering app at 08:10. At 08:11, who has decided what, who holds the €60, and which parties have not yet done anything? | `custom` | cold_reader | major |\n| AC-2 | Every term the rest of the book relies on from this chapter (issuer, acquirer, network, provider, payment facilitator, authorization, capture, clearing, settlement, payout, dispute) is defined in one plain clause before it is used. | `known_before_new` | rubric | major |\n| AC-3 | Every statement about which role Stripe or Adyen plays is a dated, sourced fact or is marked as not public; the table of who holds money and risk is labeled as a generalization that contracts and local law can change. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** What has to happen, between which parties, for one card payment to be approved, collected, moved, paid out and possibly taken back?\n\n> **Claim:** One card payment takes six steps spread over days and carried out by at least five parties (the acquirer and the provider may be one company): the issuer approves, the merchant captures, the acquirer presents a clearing record through the network, the network nets what its member banks owe each other, the provider pays the merchant, and for about 120 days the cardholder can have it taken back. The provider that answers the API call controls none of the three steps that decide the outcome: it does not make the approval decision, does not run the settlement between banks and cannot stop a dispute.\n\n**Disputed by:** The view that a payment is a transaction between the merchant and its payment provider, in which the provider takes the money and the other parties are details the API rightly hides.\n\n**So what:** If the provider only relays and records other parties' promises, then its status fields are reports with a delay, and an integrator must ask of each one whose decision it reports and what is still open; the first question to put to any provider becomes which entity is the acquirer for this payment in this country.\n\n**How and why:** The annual reports Visa and Mastercard published in 2026 describe the same four-party structure and say the networks neither issue cards nor hold customers' money; they route the authorization, exchange clearing records and settle between members. A provider packages the acquirer's side of that structure, and which role it plays is a per-country fact. Stripe's acquirer disclosure (n.d., accessed November 2026) names Stripe entities as acquirer in Europe and six acquirers in the United States (five banks and Stripe's own limited-purpose bank), where Stripe acts as a payment facilitator; Adyen holds a banking license from the Dutch central bank and lists the countries and regions where it has an acquiring connection and names the acquiring entity for some markets only. Neither publishes an end-to-end description of its own role by region.\n\n**Supporting claims**\n\n- **S1** — A card payment has at least five parties, and the roles that matter (issuer, acquirer, network) are defined by membership and license, not by technology; other payment methods merge or remove some of them.\n- **S2** — The payment is six steps on separate clocks in which first a message, then a record and only then money moves, so the approval the customer sees moves nothing.\n- **S3** — The approval, the settlement between banks and the dispute each belong to a party other than the provider, which can only relay and record them, so its statuses are delayed reports and each hand-off can fail on its own.\n- **S4** — Which role a provider plays is a per-country fact: Stripe publishes its acquirer per country, Adyen publishes its licenses but no such list, and neither describes its role end to end.\n\n## Role in the part\n\nSupplies the parties, the six-step timeline and the distinction between messages and money that every later chapter places itself on. Supports P1-1 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in timeline and in-practice: the six steps in the order they happen; `comparison` in variants, provider-positions and where-they-differ; `problem_solution` in scene to in-practice: the studio owner's question is posed in the first section and answered in the seventh)\n\nEach section supplies the terms the next one uses. The scene poses four questions; the parties section names who answers them; the timeline puts those parties in order, which it could not do before they were defined; the variants section needs both the parties and the steps to say what other methods remove; the provider's positions are stated in terms of settlement and payout, so they follow the timeline; the Stripe and Adyen table fills in those positions; Mila's payment then uses everything at once, and the failures are read off the same six steps. Put the timeline before the parties and each step would name actors the reader has not met; put the company comparison before the positions and its rows (payment facilitator, acquirer of record) would be undefined; put Mila's walkthrough first and it would be a list of unexplained names.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At 19:42 on Tuesday 9 March 2027 Mila Janssen buys a ten-class pass for €120.00 in the Larkfield app and two seconds later the screen says the payment succeeded. At 19:43, where is the €120? Still in her own bank account.\n\n**Bridge:** An engineer sees a payment as a request that returned success, and stores that as the payment's status. → The success was one bank's promise; five more steps, carried out by parties the API hides, decide whether the merchant ever keeps the money.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): One card payment takes six steps spread over days and carried out by at least five parties, and the provider that answers the API call controls none of the three steps that decide the outcome: the approval, the settlement between banks and the dispute.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from a studio owner's question at Larkfield about a payment marked 'paid', and answer it with Mila's €120 followed party by party. *Kept in:* scene, in-practice.\n- Define the parties of the four-party model and the trade names layered on it, with who holds the money and the risk. *Kept in:* parties.\n- Lay out the six-step timeline and what moves at each step: a message, a record or money. *Kept in:* timeline.\n- Show how three-party networks, bank transfers and wallets depart from the model. *Kept in:* variants.\n- Describe the positions a provider can take in the chain, and what Stripe and Adyen each document about their own. *Kept in:* provider-positions, where-they-differ.\n- Show how each step fails and the rule for detecting it. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At 19:42 Mila's app says the €120 payment succeeded, and a minute later the €120 is still in her own bank account: only a message has moved. | scenario: Mila's class pass: Tuesday 9 March 2027, 19:42, a ten-class pass for €120.00 at Studio Noord, paid with a Dutch Visa debit card from her phone's wallet; Larkfield introduced as fictional. |  |\n| p02 | claim | One card payment takes six steps over days and at least five parties, and the provider that answers the API call controls none of the three steps that decide the outcome: the approval, the settlement between banks and the dispute. |  | `problem_solution`: The puzzle of a success message with no money moved. → The explanation: the answer was the issuer's promise, the first of six steps carried out by different parties. |\n| p03 | explanation | Because the provider only relays and records other parties' promises, every status it returns is a report with a delay, and the integrator has to ask of each one whose decision it reports and what is still open. | quotation: Stripe documentation, 'Payment methods', https://docs.stripe.com/payments/payment-methods.md, n.d., accessed 2026-11: \"A `succeeded` status indicates that the payment completed successfully according to the payment method's processing flow, but funds can still be refunded, disputed, returned, or reversed\". | `cause_effect`: The claim that the provider controls none of the deciding steps. → What that means for anyone who stores or acts on a provider's status. |\n| p04 | context | This chapter covers the whole of Mila's class pass at low resolution, from 19:42 on Tuesday to the studio's payout on Thursday and the dispute window after it; every later chapter enlarges one stretch of it. | scenario: Mila's class pass: approved 19:42 on Tuesday 9 March 2027, captured automatically, in the studio's payout on Thursday 11 March. | `example`: The six steps as an abstract claim. → The one payment the book follows through them, and how much of it this chapter covers. |\n| p05 | transition | The chapter goes from a scene at Larkfield to the parties, the timeline, the payment methods that bend the model, the places a provider can stand, the Stripe and Adyen comparison, Mila's payment party by party, and the ways each step fails. |  | `sequence`: The payment the chapter follows. → The order of the chapter's sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: One Word for Four Facts\n\n**Controlling idea** (`example`, id `scene`): A studio owner asks where her €120 is while Larkfield's record says 'paid', and the one word turns out to stand for four different facts that four different parties hold.\n\n**Advances the thesis** (S2, S3): Shows, before any vocabulary, a status that is true and still does not answer whether money has moved or can come back.\n\n**Transition in:** `example`: The introduction's claim that a status is a delayed report of someone else's promise. → The morning after Mila's payment, when a studio owner reads the status as money.\n\n**Order of paragraphs** (`problem_solution`): The owner's question first, then the four questions it breaks into; the reader meets the problem as a support ticket before it is named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | On Wednesday 10 March 2027 Ines Bakker sees Mila's pass marked 'paid' in the Larkfield back office, finds no €120 in Studio Noord's bank account and asks support where it is. | scenario: Ines Bakker, owner of Studio Noord; Aylin Demir, Head of Studio Support; the payment record store's five-state vocabulary (pending, authorized, paid, refunded, disputed). The ticket on 10 March is a local detail consistent with the ledger's payout date of 11 March. |  |\n| p07 | analysis | Femke de Graaf answers with four questions the word 'paid' cannot answer (who approved, has any money moved, when does the studio receive it, until when can it be taken back), each of which has a different party behind it. | reasoning: The four questions map to the issuer, the network's settlement, the provider's payout and the cardholder's dispute right.; figure: Conceptual figure: one green tick on a phone beside a chain of four promise notes, each with its own clock (placeholder 01-one-tick-four-promises). | `contrast`: Ines's reading of 'paid' as money received. → The four separate facts the word stands for. |\n\n### The Parties: Four in the Model, More in Practice\n\n**Controlling idea** (`definition`, id `parties`): The card networks define four parties with the network between the two banks, the roles that matter are defined by membership and license and not by technology, and the trade names layered on top (processor, gateway, provider, payment facilitator, platform) differ in whether they are network members and whether they hold money.\n\n**Advances the thesis** (S1): Names the at-least-five parties and says which of them holds money and which carries risk.\n\n**Transition in:** `elaboration`: The four questions, each with a different party behind it. → Who those parties are, in the card networks' own words.\n\n**Order of paragraphs** (`prerequisite_order`): The four parties first, then the network that connects them, then the acquirer defined against the network, then the trade names defined against the acquirer, then money and risk for all of them. Each definition uses only the ones before it; the money-and-risk table cannot come first because its rows are the parties.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | The four-party model has a cardholder and the bank that issued the card (the issuer) on one side, a merchant and the institution that accepts cards for it (the acquirer) on the other, and the card network between the two institutions. | quotation: Visa 10-K: Visa provides \"transaction processing services (primarily authorization, clearing and settlement) among consumers, issuing and acquiring financial institutions and sellers in a structure we call the “four-party” model\".; quotation: Mastercard 10-K: \"account holder (a person or entity who holds a card or uses another device enabled for payment), issuer (the account holder’s financial institution), merchant and acquirer (the merchant’s financial institution)\". |  |\n| p09 | explanation | The network is not a bank: it issues no cards and holds no customer money, and what it does is carry the messages between issuer and acquirer and work out what they owe each other. | quotation: Visa 10-K: \"Visa is not a financial institution. We do not issue cards, extend credit or set rates and fees for account holders of Visa card products nor do we earn revenue from or bear credit risk with respect to any of these activities.\"; quotation: Mastercard 10-K: \"We do not issue cards, extend credit, determine or receive revenue from interest rates or other fees charged to account holders by issuers\". | `elaboration`: The network as the fifth element between the two banks. → What the network is and is not. |\n| p10 | definition | An acquirer is defined by what it is allowed to do, not by its software: it is a member of the network that signs the merchant, submits its transactions and receives the settlement money, and it needs a regulator's license as well. | quotation: Visa Core Rules glossary: an Acquirer is \"A Member that signs a Merchant or Payment Facilitator, provides a Cash Disbursement to a Cardholder, or loads funds to a Prepaid Card, and directly or indirectly enters a Transaction into Interchange\".; quotation: Stripe Services Agreement, services terms, https://stripe.com/en-us/legal/ssa-services-terms, n.d., accessed 2026-11: a Payment Method Acquirer is authorized to \"sponsor or submit Transactions at the request of merchants to the Payment Method Provider for authorization and clearing\" and to \"receive and remit settlement funds for authorized and cleared Transactions\".; quotation: Adyen knowledge hub, 'Acquiring bank', https://www.adyen.com/knowledge-hub/acquiring-bank, n.d., accessed 2026-11: \"Acquirers must be licensed by local financial regulators and card schemes to relay transactions.\" | `elaboration`: The network and its members. → The member on the merchant's side, defined precisely. |\n| p11 | definition | Five trade names sit on top of the model, and the useful way to tell them apart is two questions: is it a network member, and does it hold the merchant's money. | table: Role / what it does / network member? / holds the merchant's money?, rows: acquirer, processor, gateway, payment facilitator, payment service provider, platform. Labeled as industry usage except the quoted Visa definitions.; quotation: Visa Core Rules glossary: an Acquirer Processor is \"A non-Member agent or processor that a Member has engaged\"; a Payment Facilitator is \"An entity that contracts with an Acquirer to deposit Transactions, receive settlement from, or contract with an Acquirer on behalf of a Sponsored Merchant\". | `contrast`: The acquirer as a defined, licensed role. → The commercial names that are not defined that way. |\n| p12 | analysis | Each party holds the money at a different moment and carries a different risk, and the network's guarantee covers the two institutions but stops before the merchant. | table: Party / holds the money when / carries which risk, seven rows from cardholder to platform; labeled as a generalization that contracts and local law can change.; quotation: Mastercard 10-K: \"We guarantee the settlement of many of the transactions from issuers to acquirers ... We do not, however, guarantee payments to merchants by their acquirers\".; figure: Structural figure: the four-party model with the network between the issuer and the acquirer, the provider beside the acquirer and the platform beside the merchant (placeholder 01-four-party-model). | `additional_support`: The parties and their names. → What each of them holds and risks. |\n\n### The Timeline: A Message, a Record, Then Money\n\n**Controlling idea** (`process`, id `timeline`): The payment is six steps on separate clocks, and what moves changes along the way: a message at authorization, a record at clearing, money only at settlement and payout, with the dispute window open after all of them.\n\n**Advances the thesis** (S2, S3): Lays out the six steps with the party that acts in each, and shows that the approval, the interbank settlement and the dispute belong to parties other than the provider.\n\n**Transition in:** `sequence`: The parties, and what each holds and risks. → The order in which they act and what moves at each step.\n\n**Order of paragraphs** (`chronological`): The steps in the order they happen, after one paragraph that names the three kinds of movement and one table that shows all six at once. Taking payout before settlement, or the dispute before payout, would describe money going back that has not yet arrived. The requirements table comes last because it asks what a record must hold for steps the reader has just met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | Three different things move in a card payment (a message, a record and money), in that order, and the network offers them as three separate services. | quotation: Mastercard 10-K: \"we enable the routing of a transaction to the issuer for its approval, facilitate the exchange of financial transaction information between issuer and acquirer after a successfully conducted transaction, and settle the transaction by facilitating the exchange of funds between parties via settlement banks chosen by us and our customers\". |  |\n| p14 | description | The six steps are authorization, capture, clearing, settlement, payout and the dispute window, each with its own actor, its own clock and its own promise. | table: Step / typical time after 'pay' / who acts / what moves / the promise made. Six rows. The time column is labeled as typical industry practice, not a rule.; figure: Structural figure: six stations on a line from 'Pay' to the dispute window, grouped under message, record and money (placeholder 01-six-step-timeline). | `elaboration`: Three kinds of movement. → The six steps they are spread over. |\n| p15 | explanation | Authorization is the issuer's promise and capture is the merchant's claim on it; a hold appears on the cardholder's account, and no money moves in either step. | quotation: Visa 10-K: the acquirer presents the transaction data to Visa, \"which in turn sends the transaction data to the issuer to check the account holder’s account balance or credit line for authorization\".; fact: Visa Core Rules, section 5.7.3.5, Table 5-11: a cardholder-initiated transaction in a card-absent environment has a maximum processing timeframe of 10 calendar days from a valid authorization.; quotation: Adyen documentation, 'Capture', https://docs.adyen.com/online-payments/capture.md, n.d., accessed 2026-11: \"By default, payments are captured automatically without a delay, immediately after authorization of the payment request.\" | `sequence`: The table of six steps. → The first two, which move no money. |\n| p16 | explanation | Clearing sends the final record of the transaction from the acquirer to the issuer through the network, and settlement moves money for the first time, as one net amount per member per day. | quotation: Visa Core Rules glossary: a Presentment is \"A Clearing Record that an Acquirer presents to an Issuer through Interchange\"; Settlement is \"The reporting and funds transfer of Settlement Amounts owed by one Member to another, or to Visa, as a result of Clearing\"; a Settlement Amount is \"The daily net amounts expressed in a Member’s Settlement Currency resulting from Clearing\".; quotation: Visa 10-K: \"the issuer posts the transaction to the consumer’s account and effectively pays the acquirer an amount equal to the value of the transaction, minus the interchange reimbursement fee (IRF)\". | `sequence`: The promise and the claim. → The record and the first movement of money. |\n| p17 | explanation | Payout is the provider's own step after network settlement, on a schedule the provider sets, and both providers use the word 'settlement' for it, so 'settled' names a different event at each layer. | quotation: Stripe documentation, 'Payouts', https://docs.stripe.com/payouts.md, n.d., accessed 2026-11: \"Stripe uses “T” to refer to the transaction time, which indicates the time of the original payment confirmation or capture\", whereas \"Some payment processors might start “T” from their internal settlement time, meaning when the funds land in their bank accounts.\"; quotation: Adyen documentation, 'Sales day payout', https://docs.adyen.com/account/sales-day-payout.md, n.d., accessed 2026-11: \"the funds you get do not depend on the settlement timelines of the schemes and payment methods used by your shoppers\"; Sales Day Payout Terms of Service, https://www.adyen.com/legal/sales-day-payout-terms-of-service, last update 2024-06-17: payout is initiated \"irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner\". | `sequence`: Money arriving at the acquirer. → Money leaving the provider for the merchant. |\n| p18 | explanation | The cardholder's right to dispute runs for about 120 days and so outlasts authorization, settlement and payout: the payment can be taken back after the merchant has been paid. | fact: Visa Core Rules, chapter 11 dispute time-limit tables: an issuer may initiate a dispute within \"120 calendar days from the Transaction Processing Date\" for most dispute conditions (75 for the authorization conditions).; quotation: Adyen documentation, 'Dispute timeframes', https://docs.adyen.com/risk-management/understanding-disputes/dispute-timeframes.md, n.d., accessed 2026-11: \"In general, a cardholder has a maximum of 120 calendar days from the transaction date to dispute a transaction\"; \"In some cases for Visa and Mastercard, the cardholder has a maximum of 540 calendar days\". | `contrast`: The forward steps, which end at payout. → The one step that runs backward and stays open longest. |\n| p19 | recommendation | For each step the integrator's own record should hold a different fact, learn it from a different source and tolerate a different delay, which is the author's reading of the timeline as requirements. | table: Step / what your record should hold / how you learn it / how late it can be / if the message is lost. Six rows; delays marked as assumptions; labeled as the author's judgement. | `cause_effect`: Six steps with six owners and clocks. → What that requires of the record an integrator keeps. |\n\n### When the Model Bends: Three-Party Networks, Bank Transfers and Wallets\n\n**Controlling idea** (`comparison`, id `variants`): Other payment methods change the parties, the steps or the finality: a three-party network merges issuer and acquirer, a bank-transfer scheme has no card network and its own rules on taking money back, and a wallet is either a card payment with a different credential or a network of its own.\n\n**Advances the thesis** (S1): Tests the party model against the methods that depart from it, so the reader knows which parts are general and which belong to four-party cards.\n\n**Transition in:** `contrast`: The four-party parties and the six-step timeline. → Payment methods in which some of those parties or steps are missing or merged.\n\n**Order of paragraphs** (`comparison`): Three departures from the model, ordered from the smallest change (two roles merged) to the largest (no card network), ending with wallets because Mila's own payment is one and it leads back to the card model.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | comparison | In a three-party network one company is both issuer and acquirer, so the two banks and the network between them collapse into one party. | quotation: Regulation (EU) 2015/751, recital 28, http://publications.europa.eu/resource/celex/32015R0751, published 2015-05-19 (evidence age 11 years; in force): \"‘three party payment card schemes’ (cardholder — acquiring and issuing scheme — merchant) and ‘four party payment card schemes’ (cardholder — issuing bank — acquiring bank — merchant)\"; Article 2(18): a three-party scheme that licenses other providers to issue or acquire \"is considered to be a four party payment card scheme\".; quotation: Stripe documentation, 'How disputes work', https://docs.stripe.com/disputes/how-disputes-work.md, n.d., accessed 2026-11: a card network \"might be an intermediary in front of an issuing bank as with Visa or Mastercard, or a standalone entity as with American Express\". |  |\n| p21 | comparison | A bank-transfer scheme has no card network and often no authorization-then-capture, and whether the payer can take the money back is set by the scheme: never for iDEAL, for eight weeks without a reason for SEPA Direct Debit. | quotation: Stripe documentation, 'iDEAL \\| Wero payments', https://docs.stripe.com/payments/ideal.md, n.d., accessed 2026-11: \"Customers can’t dispute iDEAL \\| Wero payments with their bank.\"; quotation: Stripe documentation, 'SEPA Direct Debit payments', https://docs.stripe.com/payments/sepa-debit.md, n.d., accessed 2026-11: customers can dispute \"without providing a reason for up to 8 weeks after the debit\"; Adyen documentation, https://docs.adyen.com/payment-methods/sepa-direct-debit.md, n.d., accessed 2026-11: \"Eight weeks to dispute a SEPA payment without providing a reason.\"; fact: Larkfield's 2026 online mix: cards 52%, SEPA Direct Debit 21%, iDEAL 14%. | `contrast`: A card network with two roles merged. → Payment methods with no card network. |\n| p22 | comparison | A wallet is one of two things: a carrier for a card credential, in which case the payment is still a four-party card payment, or an account with its own balance and its own rules. | quotation: Stripe documentation, 'Wallets', https://docs.stripe.com/payments/wallets.md, n.d., accessed 2026-11: wallets let customers pay using \"A saved payment credential (a tokenized card or bank account stored in the wallet)\" or \"A stored wallet balance (funds held in an account with the wallet provider)\".; quotation: Adyen documentation, 'Apple Pay', https://docs.adyen.com/payment-methods/apple-pay.md, n.d., accessed 2026-11: \"Apple Pay uses network tokenization\" and \"supports liability shift for American Express, Discover, JCB, Mastercard, and Visa cards\".; scenario: Mila pays from her phone's wallet with her Dutch Visa debit card; the wallet authenticates her on the device and there is no 3-D Secure challenge. | `contrast`: Methods that leave the card networks. → A method that looks different at checkout and may not leave them at all. |\n\n### Where a Provider Can Stand in the Chain\n\n**Controlling idea** (`comparison`, id `provider-positions`): A payment provider can be a gateway in front of someone else's acquirer, a payment facilitator under an acquiring bank, or the acquirer itself, the answer can differ by country for one provider, and a platform adds one more layer above any of them.\n\n**Advances the thesis** (S4): Shows that 'the provider' is not one role, which is why the acquirer of record has to be asked for per country.\n\n**Transition in:** `elaboration`: The provider, so far placed loosely beside the acquirer. → The three positions it can actually occupy and what each means for the merchant's money.\n\n**Order of paragraphs** (`large_to_small`): The three positions and their trade-offs first, then the confusion to avoid (a direct connection is not acquiring), then the layer the book's example adds, then the one question all three reduce to. The platform comes after the positions because it sits on top of whichever position the provider takes; the question comes last because it is the section's conclusion and the next section answers it for Stripe and Adyen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | comparison | There are three positions, and they differ in who is the network member, who holds the merchant's funds between settlement and payout, and how many parties stand between the merchant and the network. | table: Position (gateway only / payment facilitator under an acquiring bank / acquirer itself) by: network member, who holds funds before payout, parties between merchant and network, when it fits. Labeled as industry usage and the author's judgement. The facilitator row quotes Visa Core Rules, section 5.3.1.2, edition of 2026-10-24: the acquirer is 'liable for all acts, omissions, and other adverse conditions caused by the Payment Facilitator and its Sponsored Merchants'.; figure: Structural figure: three lanes from merchant to network showing the gateway, facilitator and acquirer positions (placeholder 01-provider-positions). |  |\n| p25 | analysis | A direct technical connection to a card network is not the same as being the acquirer of record, and Stripe's own publications show both at once for the United States. | quotation: Stripe newsroom, https://stripe.com/en-ca/newsroom/news/direct-platform, published 2020-04-23 (evidence age 6.5 years): Stripe \"now processes card transactions through direct integrations with all six major card networks in North America, Latin America, Europe and Asia Pacific\".; quotation: Stripe acquirer disclosure: \"Stripe, LLC is a Payment Facilitator of the following Payment Method Acquirers\", listing Cross River Bank, Deutsche Bank Trust Company Americas, Fifth Third Bank, Pathward N.A., PNC Bank, N.A. and Stripe MALPB. | `contrast`: Positions defined by membership. → A claim about connectivity that is easily mistaken for one about membership. |\n| p26 | explanation | A platform such as Larkfield adds a layer above the provider without becoming a party to the money: the studio is the seller, the provider holds the studio's funds, and the platform takes a fee. | fact: Larkfield never holds member funds; on both providers the studio's money sits in the provider's regulated balance until payout; Larkfield is not the merchant of record, the studio is the seller. | `additional_support`: The provider's three positions. → The platform layer on top of whichever position the provider takes. |\n| p41 | recommendation | The positions, the difference between a connection and a membership, and the platform layer reduce to one question to put to any provider before any other: which legal entity is the acquirer for these sellers, in this country. | reasoning: Each of the three positions, the direct-connection distinction and the platform layer is settled by naming the member under whose name the payment enters the network; the question is the author's judgement. | `conclusion_summary`: The three positions, the connection that is not a membership, and the platform layer. → The one question they reduce to: who the acquirer of record is. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Both companies are regulated institutions that acquire in their own name in Europe; they differ in the kind of license, in whether they publish who the acquirer is per country, and in the details of a payout clock that is the provider's own at both, and neither publishes an end-to-end account of its role by region.\n\n**Advances the thesis** (S4): Gives the documented, dated answer to 'which role does the provider play' for the two anchor companies, and marks what is not public.\n\n**Transition in:** `example`: The three positions a provider can take. → Which positions Stripe and Adyen document for themselves, and where.\n\n**Order of paragraphs** (`comparison`): The table of documented facts, then what an integrator does with it, then where the public record ends. The limits come last so the reader does not take the table for the whole picture.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | comparison | Set side by side from their own legal pages and documentation, the two companies differ in five aspects of where they stand in the chain. | table: Aspect / Stripe / Adyen / what the difference suggests. Rows: regulated form in the EEA (Stripe Technology Europe Limited, e-money institution authorized by the Central Bank of Ireland, https://stripe.com/stel/legal, published 2019-04-05, evidence age 7 years; Adyen N.V., credit institution under De Nederlandsche Bank, https://www.adyen.com/licenses/emea, n.d., accessed 2026-11); acquirer of record for an EEA card payment (Stripe disclosure names Stripe Technology Europe, Ltd.; Adyen's license page says the license includes cross-border acquiring in all EEA countries, no per-country acquirer list); role in the United States (Stripe, LLC a payment facilitator of five named banks and Stripe MALPB; Adyen N.V. San Francisco Branch licensed by the OCC and the Federal Reserve Board, https://www.adyen.com/licenses/united-states, n.d., accessed 2026-11); where own acquiring stops (Stripe publishes it per country; Adyen reports 84% of 2025 processed volume as full-stack and banking partners 'in locations where there are no own direct acquiring licenses', Annual Report 2025, signed 2026-03-05, https://investors.adyen.com/financials/2025); what the payout clock counts from (Stripe: capture, 3 business days default for the Netherlands after an initial 7 calendar days; Adyen: the sales day, typically 2 business days). |  |\n| p28 | recommendation | On Stripe an integrator can read the acquirer per country from a public page and should store it; on Adyen the same question has to be put to the account team for each market, and on both the payout day must not be read as the day the network settled. |  | `cause_effect`: The five documented differences. → What an integrator does differently on each provider because of them. |\n| p29 | analysis | The public record stops at three points: a list of network memberships by network and country, the share of volume that runs through each acquirer, and a general statement of whether payouts wait for network settlement. | reasoning: Stripe names five US partner banks and its own limited-purpose bank without shares; Adyen reports 84% full-stack volume without naming the acquirers of the rest; Adyen's Sales Day Payout terms say payout does not wait for funds, and Stripe's payout page does not say either way. An INFERENCE, NOT DOCUMENTED block gives the author's reading of why one publishes a list and the other does not. | `contrast`: What the two companies document. → What neither of them publishes. |\n\n### In Practice at Larkfield: Mila's €120, Party by Party\n\n**Controlling idea** (`example`, id `in-practice`): Followed party by party, Mila's €120 is approved by her bank at 19:42 on Tuesday, stays in her account that evening, reaches Studio Noord as €117.47 on Thursday and remains open to a dispute until early July.\n\n**Advances the thesis** (S2, S3): Applies the parties and the six steps to one payment with dates and amounts, and answers the scene's four questions.\n\n**Transition in:** `example`: The parties, the timeline and the two providers' documented roles. → All three applied to the one payment the book follows.\n\n**Order of paragraphs** (`chronological`): The cast first, then the payment in time order, then the answer to Wednesday's question, then the same payment on the other provider. The Stripe variant comes last because it changes only two cells of a table the reader has to have seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | example | Every party in the model has a name in Mila's payment, and the one that needs care is the acquirer. | table: Role / who it is in Mila's payment / what it does here. Rows: cardholder (Mila Janssen), wallet (her phone's), issuer (her Dutch bank), network (Visa), acquirer and provider (Adyen; that Adyen N.V. is the acquirer of record is the author's inference from its license page, since Adyen publishes no complete list of acquiring entities per country), merchant (Studio Noord), platform (Larkfield). |  |\n| p31 | example | In time order the €120 is promised on Tuesday evening, claimed at once, moved between the banks over the next days, paid to the studio as €117.47 on Thursday 11 March and open to a dispute until about 7 July 2027. | table: When / step / who acts / where the €120 is. Rows: Tue 9 March 19:42 authorization and automatic capture; clearing and settlement on the following days (timing an assumption, industry practice); Thu 11 March payout of €117.47 after Larkfield's fee of €2.53; 120 calendar days from 9 March ends 7 July 2027 (the author's arithmetic on Visa's rule, which counts from the transaction processing date).; fact: Regulation (EU) 2015/751, Article 3: interchange on a consumer debit card transaction is capped at 0.2% of its value, at most €0.24 on €120. | `time`: The cast. → What each of them does, in order. |\n| p32 | analysis | At noon on Wednesday the honest answer to Ines is that the issuer has promised and the studio has claimed, the banks may or may not have settled, the payout comes tomorrow, and the payment stays reversible into July, so 'paid' was true and not final. | reasoning: The four questions from the scene answered from the table: who approved (Mila's bank), has money moved (not to the studio), when does the studio receive it (Thursday), until when can it come back (about 7 July 2027). Keel decision K2 as the consequence for the payment record. | `cause_effect`: The dated walkthrough. → The answer to the question the scene asked. |\n| p33 | comparison | Had Studio Noord been on Stripe, the parties and the six steps would be the same and two cells would change: the acquirer would be the entity Stripe names for the EEA, and the payout would follow Stripe's clock. | fact: Stripe acquirer disclosure: for the European Economic Area the \"Payment Method Acquirer is Stripe Technology Europe, Ltd.\"; Stripe payouts page, country table: Netherlands, initial settlement timing 7 calendar days, default 3 business days. | `contrast`: The payment on Adyen. → The same payment on Stripe. |\n\n### When It Goes Wrong: Each Step Fails in Its Own Way\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Because each step has its own owner and clock, each fails separately, and most payment incidents are a system treating one party's report as another party's fact.\n\n**Advances the thesis** (S3): Shows the cost of reading the provider's answer as the outcome: every Larkfield incident on the payment's path sits at a hand-off between two parties.\n\n**Transition in:** `cause_effect`: A chain of six steps that worked. → What each step looks like when it does not.\n\n**Order of paragraphs** (`small_to_large`): The failures step by step with the incident each produced, then the rule that covers all of them; the rule would be an assertion without the table before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | analysis | Each of the six steps has a characteristic failure, a party that knows about it first and a chapter that treats it. | table: Step / what goes wrong / who knows first / Larkfield's case / chapter. Rows: authorization (no answer comes back: the Double Charge, 1 November 2026, 1,840 members charged twice, €71,300 refunded); capture (the approval expires before the claim); clearing and settlement (records disagree for days: the Unexplained €0.4 Million, €412,000); payout (returned by the receiving bank: the Payout That Bounced, 412 payouts, €386,000); dispute (arrives after payout: Bram de Wit's €120, 24 February 2027, €15.00 fee); the report of any step (the Silent Webhook, 14 September 2026, 9 hours, 3,200 memberships). |  |\n| p35 | recommendation | The rule that covers all six is to treat a missing or surprising answer as unknown, ask the party that owns the fact through the provider's own record, and keep looking until every payment has reached a state that party has confirmed. | reasoning: The Phantom Payment pattern (a system believes a payment succeeded or failed without the provider's confirmed record) generalizes the table; Keel K2 (the provider's record is the truth, the webhook is the doorbell; a job sweeps everything pending) is Larkfield's version of the rule. | `conclusion_summary`: Six separate failures. → The one rule of detection and recovery they share. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The parties, the timeline and the provider's position are one fact seen three ways: for every step of a payment there is a party that owns it, and the provider is the owner of only one, the payout. A status is therefore always somebody else's promise relayed, and the acquirer of record is the name of the party on whom most of those promises land first.\n\n**So what:** An integrator who accepts this stops storing one status per payment, records which promise it holds and from whom, and puts one question to every provider in every country before any other: which legal entity is the acquirer.\n\n**Callback:** The opening minute after 19:42, when the app said the payment had succeeded and the €120 was still in Mila's account. The reader can now say who had decided what at 19:43, where the money was, and that the last open promise on that payment closes in July.\n\n**Takeaway** (`course_of_action`): For every status your system stores, write down whose decision it reports and what is still open after it; for every provider and country, write down the acquirer of record.\n\n**Hand-off** to [The First Promise: Authorization](payment-authorization.html): `elaboration`: The six-step timeline and its parties, with authorization named as the first step and the only one the customer sees. → What that first step contains: the message, the issuer's decision and codes, the hold and its expiry, and the case where no answer comes back.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis (list) | Established: the four-party structure and the three network services are the networks' own description, settlement is daily and net between members, the network does not guarantee the merchant's payout, and the dispute right runs for about 120 days. |  |  |\n| p37 | synthesis (list) | Depends on context: which entity is the acquirer, when the payout arrives, and whether the payment can be disputed at all depend on the provider, the country and the payment method. |  | `contrast`: What the field agrees on. → What changes with provider, country and method. |\n| p38 | recommendation (list) | The author's synthesis: treat every provider status as a relayed promise with an owner and an expiry, and ask for the acquirer of record before comparing providers on anything else. |  | `contrast`: What is established and what depends on context. → The author's own position, labeled as such. |\n| p39 | recommendation (list) | Eight questions let the reader test a provider, a status field or a design against the chapter. |  | `cause_effect`: The take-aways. → Questions that apply them in a design review or a provider evaluation. |\n| p40 | transition | The timeline's first step, the authorization, is the only one the customer sees and the one most often mistaken for the payment; the next chapter opens it up. |  | `elaboration`: The six steps at low resolution. → The first of them in detail, in the next chapter. |\n\n## Non-goals\n\n- The authorization message, response codes, holds, validity windows in detail, reversals, customer- and merchant-initiated transactions. See [The First Promise: Authorization](payment-authorization.html).\n- Capture models, clearing files, interchange qualification, settlement cycles and funding in detail. See [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html).\n- Refund and dispute lifecycles, reason codes, deadlines and monitoring programs. See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- Interchange, scheme fees, markup and provider pricing. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- Network membership tiers, sponsor banks, local acquiring and its effect on approval rates. See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html).\n- Custody of funds, safeguarding and what each license lets a provider hold. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- The semantics of each local payment method. See [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html).\n- Platform charge models and platform liability. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- The finance-side view of the same parties and flows: reports, clearing accounts, posting. See [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](../finance-systems-architecture/payments-fundamentals.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Adyen lists the countries and regions where it has an acquiring connection but names an acquiring entity for some markets only (its license pages for Japan and Singapore) and publishes no complete list per country; the chapter labels as inference that Adyen N.V. acquires Mila's Dutch payment. A reviewer with Adyen contract documents could confirm it.\n- Whether Stripe pays out before it has received network settlement is not stated on the pages read; the chapter says so.\n- Mastercard's rules could not be read directly (HTTP 403); the 120-day window for Mastercard is reported through Adyen's documentation.\n- The end of Mila's basic dispute window (7 July 2027) is the author's arithmetic from 9 March; Visa's rule counts from the transaction processing date, which may be a day later.\n\n## Decision log\n\n- **2026-11-17** — Timeline placed before the payment-method variants, so that the variants can be described as steps and parties removed from a model the reader already has. Rejected: Variants directly after the parties (PLAN order), which would describe 'no capture' and 'no dispute window' before either step was defined.\n- **2026-11-17** — The 'designs' and 'trade-offs' of the style guide are rendered as one section on the three positions a provider can take, with one comparison table; depth on membership is left to acquiring-and-network-connectivity (consistency ruling 3). Rejected: A separate trade-offs section, which would have repeated the positions table.\n- **2026-11-17** — Economics limited to one clause on capped interchange in the walkthrough; the fee stack on Mila's €120 belongs to payment-economics. Rejected: Breaking down the €0.61 provider cost here.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, contract 01-journey-of-a-payment — Scope, owned terms, the Larkfield thread.\n  - _research/brief-card-lifecycle-and-networks.md — Part 1 (parties, messages versus money, timeline), sections 3.3, 3.4 and 4.5, key numbers, open questions.\n  - _research/brief-acquiring-methods-and-terminals.md — Sections 1.1 to 1.8 (acquirer, facilitator, Stripe's acquirer disclosure, Adyen's licenses), 2.1, 2.2 and 2.4 (method families, wallets, direct debit).\n  - _research/brief-ledgers-and-money-movement.md — Section 2.4 and 2.6: Adyen's Sales day payout and its terms.\n  - _research/scenario-ledger.md — Mila's class pass, the cast, the incidents, Keel K2, the method mix.\n  - _research/consistency-issues.md — Rulings 3, 11, 12, 14 and 17.\n- **External**\n  - https://www.sec.gov/Archives/edgar/data/1403161/000140316126000134/v-20260930.htm — Visa's description of the four-party model and of itself; re-fetched 2026-11-17.\n  - https://www.sec.gov/Archives/edgar/data/1141391/000114139126000013/ma-20251231.htm — Mastercard's four participants, three services and the limit of its settlement guarantee; re-fetched 2026-11-17.\n  - https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf — Definitions of acquirer, payment facilitator, clearing, presentment, settlement; dispute time limit; edition of 24 October 2026, re-fetched 2026-11-17.\n  - https://stripe.com/en-us/legal/acquirer-disclosure — Stripe's acquirer per country; re-fetched 2026-11-17.\n  - https://www.adyen.com/licenses/emea — Adyen's banking license and what it covers; re-fetched 2026-11-17.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 78 claims checked (72 confirmed, 3 corrected, 3 uiring entity for some markets on its license pages and publishes no complete list per country; the 'principal membership' article is dated 3 July 2026. Wording follows chapter 6, which owns the topic.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('lists the countries and regions where it has an acquiring co' -> 'lists the countries and regions where it has an acquiring co').\n- **2026-11-17** — Sweep of rulings 46-48: controlling idea of the evidence-limits paragraph aligned with the prose (no list of memberships by network and country; rulings 46j, 47j); thesis how_why says Adyen names the acquiring entity for some markets only.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after the round-1 draft check (the only revision). Spec repair: p26 split into p26 (the platform layer) and new p41 (the acquirer-of-record question, the section's conclusion), as the flow rubric had noted; flow rationale of provider-positions updated. Draft repairs, no unit moved: timeline opening carries over the parties; settlement, payout, Payment Facilitator, rulebook Interchange and full-stack glossed at first use; the scene paragraph says how Figure 1's four notes relate to the four questions; table pointers made explicit in the money-and-risk and walkthrough paragraphs; the three limits of the public record numbered; K2 stated as the consequence for the payment record; the failure table regains the spec's capture row and its 'clearing and settlement' label; four minor reader findings closed.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
