<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the part-7 entry and the part thesis, opening and flow in journal-spec.json, the scenario ledger, and a full reading of the four written chapters of Part VII. The page makes no external factual claim of its own: every statement about Stripe, Adyen, a network or a regulation repeats one a chapter of the part makes and cites.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VII argues that a platform's account model is its liability model, and answers four questions in order: who is the merchant and who carries the loss, how sellers are verified, how a payment is divided and paid out, and what accounts, cards and financing require.\n- **Believe:** A platform that never holds funds can still be the party that pays for a refund or a chargeback.\n- **Be able to:** Pick the Part VII chapter that answers the platform decision in front of them.\n\n**Audience:** Engineers and architects new to payments who have read Parts I to VI and are about to start the platform chapters, or who arrive with one platform decision in hand (an account model, a sign-up flow, a split, a card for sellers) and want the chapter that addresses it.\n\n**Already knows:**\n\n- What an API, a webhook and a ledger are.\n- Parts I to VI: refunds and chargebacks, balances at a provider, payouts, verification as a duty of a licensed provider, and the merchant of record of chapter 32.\n- Larkfield in outline: a fictional studio-software platform that uses Stripe and Adyen, and its 2027 repair program Keel.\n\n**Does not yet know:**\n\n- Connected account, liable balance account, charge type, split, capability, exposure, card issuing: each is owned by a Part VII chapter and is glossed in a clause here or only named.\n- How Stripe and Adyen differ on each question; the page states the difference in a clause per chapter and leaves the evidence to the chapter.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the part's claim and name the four chapters' subjects in reading order. *Probe:* After reading only this page: what does Part VII argue, and what will each of its four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | The page opens with Mila's €84.00 refund request of 18 March 2027 after Studio Noord's payout of 11 March, with amounts and dates as in the scenario ledger, and leaves the question of who funds it open for the chapters. | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What does a platform take on when it puts itself between a payer and a seller?\n\n> **Claim:** A platform takes on its sellers' unpaid refunds, chargebacks and negative balances, and the work of keeping those sellers verified, to the extent its account model assigns them to it; it makes that assignment when it configures accounts and payments, long before the first loss, and not holding the funds does not undo it.\n\n**Disputed by:** The view that the account model is an integration and user-experience choice (which dashboard sellers see, how sign-up looks, which API calls are made), and that liability is a contract question legal can settle afterwards, since the provider holds the license and the money.\n\n**So what:** A platform team that accepts the claim decides who bears seller losses first and derives onboarding, the split and the product plan from that; it stops reading 'we never hold the funds' as 'we never carry the loss', and it keeps its own figure for how much paid-out money can still come back.\n\n**How and why:** Card-network rules decide who the merchant is by what the cardholder sees and who gives recourse, and both providers turn that into configuration. Stripe's documentation (n.d., accessed November 2026) fixes an account's fee and loss responsibilities when it is configured as a merchant and does not let them be changed; negative transactions follow the charge type to the seller's or the platform's balance. Adyen's documentation (n.d., accessed November 2026) books everything to the platform's liable balance account unless split instructions say otherwise and debits that account when a seller's balance goes negative. The same assignment decides who collects verification data, where a refund after payout lands, and whether accounts and cards may be offered at all. Adyen documents an arrangement in which it bears seller losses only as a pilot with limited availability (Managed Risk), so on that point the comparison is between Stripe's standing per-account option and an Adyen pilot.\n\n**Supporting claims**\n\n- **P7-1** — Who the customer understands they are buying from decides who the merchant is; the account and charge configuration must follow that fact, and it fixes whose balance refunds and chargebacks debit and who stands behind a seller's negative balance.\n- **P7-2** — Seller verification is a state the provider reopens for as long as the account lives, and a platform that treats it as a sign-up form finds out through stopped payouts; who collects the data follows from who bears the losses.\n- **P7-3** — A split is provisional because sellers are paid before the refund and dispute window closes: a reversal after payout is funded by the platform whenever the payment was booked through it, so the platform's exposure is the paid-out volume that can still come back.\n- **P7-4** — Accounts, cards and financing for sellers reach only as far as a license or partner bank does, are offered at different release stages per country, and add duties to the platform; on Stripe, as documented, only a platform that already bears seller losses may offer accounts and cards.\n\n## Role in the part\n\nPerforms the part's opening: poses the refund-after-payout question, states the part thesis and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the four chapter paragraphs, in the part's reading order)\n\nThe page opens on one refund at one studio and widens it into the part's claim, then narrows: from the claim (the account model assigns the loss, at configuration time), to what else the same assignment decides, to how far the public evidence carries the comparison, to the four questions in order, to one paragraph per chapter. The claim has to precede the chapter list because each chapter paragraph refers back to the loss assignment, and a reader who has not been told there is one reads the list as four unrelated topics. The evidence paragraph precedes the list because the chapter paragraphs state what Stripe and Adyen document; placed after the list, the reader would take those statements as two complete, symmetric records, when the comparison stops where Adyen's public pages stop. The chapter paragraphs keep the part's reading order, which the journal spec justifies as a prerequisite order.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On 18 March 2027 Mila Janssen asks for €84.00 back for the seven classes she has not used on her €120 pass. Studio Noord was paid its €117.47 a week earlier, on Thursday 11 March. Mila will get her €84.00; the open question is whose balance it comes out of today, and that was decided long before she asked.\n\n**Bridge:** The two-party payments of Parts I to VI, where the business that takes the payment is the business that owes the refund, and chapter 32's merchant of record, where a provider sells in its own name. → A platform such as Larkfield, which is not the seller, never holds the money, and can still be the one that pays.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p03; bullet 3 (the same assignment decides verification, reversals after payout and the product plan) is paragraph p04.): A platform takes on its sellers' unpaid refunds, chargebacks and negative balances, and the work of keeping those sellers verified, to the extent its account model assigns them to it; it makes that assignment when it configures accounts and payments, long before the first loss, and not holding the funds does not undo it.\n\n**Roadmap** (paragraph p06):\n\n- Four chapters in the order a platform meets the questions: who is the merchant and who carries the loss; how sellers are verified and kept verified; how one payment is divided, paid out and reversed; and what it takes to offer sellers accounts, cards and financing. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | At Larkfield, the fictional studio-software platform the book follows, Mila Janssen asks on 18 March 2027 for €84.00 back on a €120.00 pass for which Studio Noord was paid €117.47 a week earlier, and the open question is whose balance funds it, which was decided long before she asked. | scenario: Larkfield (fictional): Mila's ten-class pass of €120.00 bought on Tuesday 9 March 2027; Studio Noord receives €117.47, paid out on Thursday 11 March; on 18 March she asks for €84.00 back for seven unused classes.; figure: Figure 1: a timeline with the sale, the payout two days later and the refund request a week after that, and three candidate payers (studio, platform, provider) under a question mark. |  |\n| p02 | context | In Parts I to VI the business that took the payment owed the refund, and chapter 32 let a provider sell in its own name and take over the indirect tax and the handling of fraud and disputes; Part VII takes the opposite arrangement, in which the seller stays the seller, a platform stands in between, and the liability is divided among three parties by the account model. | reasoning: The part's transition_in: contrast with Part VI's merchant of record, which takes over only the part of the seller's liability its contract names; here the liability is divided among payer-facing seller, platform and provider by the account model. Chapter 32 closes on the same sentence. | `contrast`: The open question of the hook: whose balance funds Mila's refund. → Why earlier parts never had to ask it, and the three-party arrangement in which it arises. |\n| p03 | claim | Part VII's claim is that a platform takes on its sellers' unpaid refunds, chargebacks and negative balances, and the work of keeping them verified, to the extent its account model assigns them to it, and that it makes the assignment when it configures accounts and payments, so that not holding the funds does not undo it. | reasoning: The part thesis and its how_why: the merchant is decided by what the cardholder sees; Stripe fixes an account's loss responsibility when it is configured and does not let it change; Adyen books to the platform's liable balance account unless instructions say otherwise and debits it when a seller's balance goes negative.; fact: As chapter 33 quotes: Stripe's documentation says of an account's loss and fee responsibilities 'You can't update their values later'; Adyen's says of the liable balance account 'Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks' (both n.d., accessed November 2026). | `cause_effect`: The account model that divides the liability among three parties. → The part's claim about what the platform's share is and when it is fixed. |\n| p04 | analysis | The same assignment decides three more things (who collects sellers' verification data, where a refund after payout is booked, and whether accounts and cards may be offered), so the part is one decision seen four times and the loss bearer is decided first. | reasoning: The part's closing synthesis and so_what: who stands behind a seller's negative balance decides who the provider lets collect verification data, where a refund after payout is booked and whether accounts and cards may be offered; a team that accepts the claim decides the loss bearer first and keeps its own figure for paid-out money that can still come back.; scenario: Larkfield (fictional): about €156 million of paid-out online card volume is inside the 120-day dispute window at any time; it is what can be disputed, not an expected loss.; figure: Figure 2: one central decision labeled 'Loss bearer' with four branches labeled 'Model', 'Verification', 'Split', 'Products'. | `additional_support`: The assignment of the loss made at configuration. → What else that one assignment settles, and what a team does about it. |\n| p05 | context | The part argues from what Stripe and Adyen publish, and the comparison stops in named places: Stripe documents the provider as a standing option for the loss bearer while Adyen's default is the platform and it documents bearing a seller's losses itself only as a pilot program, neither publishes a completion rate for seller sign-up, and accounts for sellers are in preview at Stripe and in development at Adyen. | fact: As the chapters establish and cite (documentation n.d., accessed November 2026): Adyen documents bearing a seller's losses only as a pilot program (Managed Risk, limited availability), and it does document a 30-day period for a negative balance and reserve accounts, so those two are no longer named as gaps (ruling 41; platform-payment-models; splits-balances-and-platform-payouts); neither company publishes a completion rate or a comparison of onboarding flows (ruling 40; platform-onboarding-and-verification); accounts for a platform's sellers are in public preview in the UK and private preview in the US, Australia and the EU at Stripe and in development at Adyen, and every documentation page is undated (embedded-finance). | `contrast`: The claim and what it decides. → The limits of the public evidence behind it. |\n| p06 | transition | The four chapters come in the order a platform meets the questions, each opening on a case at Larkfield: who is the merchant and who carries the loss, how sellers are verified and kept verified, how one payment is divided, paid out and reversed, and what it takes to offer accounts, cards and financing. | reasoning: The part's roadmap and flow rationale: the model chapter fixes the loss bearer, which on Stripe determines who collects verification data; a seller needs an active capability before a payment can be split to it; embedded finance sits on the seller balance the splits chapter defines. | `sequence`: The claim, what it decides and the limits of its evidence. → The four questions in reading order, and that each chapter opens on a Larkfield case. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the four chapters answers one question a platform meets, opens on one Larkfield case, and relies on the loss assignment the first chapter explains.\n\n**Advances the thesis** (P7-1, P7-2, P7-3, P7-4): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The four questions in order (p06). → One paragraph per chapter: the question in bold, the Larkfield case and the difference between Stripe and Adyen it documents.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. The model chapter fixes who the merchant is and who bears losses; on Stripe that decides who collects verification data, so onboarding follows it. A seller needs an active capability before a payment can be split to it, so splits follow onboarding. Embedded finance comes last because its products act on the seller balance the splits chapter defines and, on Stripe, require the loss assignment of the first chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | The models chapter answers who the merchant is, whose balance holds the money and who carries the loss: the merchant is whoever the customer understands they are buying from, and the configuration books the payment and assigns the loss, on Stripe permanently per account and on Adyen to the platform's liable balance account, as three confident and different answers inside Larkfield to Mila's €84.00 show. | scenario: Larkfield (fictional): on 18 March 2027 Aylin Demir asks 'whose money pays this?'; product says the studio, finance says Larkfield, the CTO says the provider; none had read the provider configuration.; fact: As chapter 33 documents: Stripe lets an account's loss bearer be Stripe or the platform and fixes it per account ('You can't update their values later'); Adyen's default is the platform's liable balance account, and it documents bearing a seller's losses itself only as a pilot program (Managed Risk; ruling 41). |  |\n| p08 | description | The onboarding chapter answers how a platform gets thousands of small businesses verified and keeps them verified: verification is a state the provider reopens for the life of the account, payouts usually stop first when a deadline is missed, and on Stripe who collects the data follows from who bears the losses, as Ironworks Climbing's nine days without payouts show. | scenario: Larkfield (fictional): Ironworks Climbing, one of the 230 Frozen Studios, had its payouts paused from Monday 11 May to Wednesday 20 May 2026 while every payment showed as paid.; fact: As chapter 34 documents: Stripe 'typically disables payouts' at a missed deadline; Adyen's standard deadline is 30 days for payout capabilities and 60 for receiving payments; on Stripe the platform collects requirements only when it bears seller losses and accounts have no Stripe dashboard. | `cause_effect`: Every seller is an account at a licensed provider with someone standing behind its losses. → The provider must know who each seller is and keep knowing it. |\n| p09 | description | The splits chapter answers how one payment is divided among platform, seller and provider and how each is paid: by bookings to balances inside the provider that are paid out within days, so the division is provisional and a refund or chargeback after payout debits the balance the payment was booked through, as the €317,200 of refunds after payout that Larkfield never booked shows. | scenario: Larkfield (fictional): at year-end 2025 its ledger said it owed studios €412,000 more than the providers held for them, €317,200 of it refunds made after the studio had been paid.; fact: As chapter 35 documents: Stripe derives the bookings from the charge type and Adyen takes typed split instructions with the payment; on Adyen a split naming a missing or closed balance account is booked to the platform's liable balance account without an error. | `sequence`: A verified seller with active capabilities. → Its first payment, divided, paid out and partly reversed. |\n| p10 | description | The embedded-finance chapter answers what it takes to offer sellers accounts, cards and financing: a licensed institution behind each product, two seconds to answer each card authorization, and availability that differs by product, country and release stage, with Stripe offering accounts and cards only to platforms that bear their sellers' losses, which is why Larkfield's card for Tuesday's sales waits. | scenario: Larkfield (fictional): in May 2027 the product team proposes an instant-payout card for studios; Femke de Graaf replaces the launch date with five questions, and in June 2027 Larkfield decides not to launch yet.; fact: As chapter 36 documents (November 2026): Adyen states its own banking licenses back its accounts, cards and financing, and Stripe states it is not a bank and names partner banks and lenders; both give the platform's server two seconds per authorization; accounts for sellers are in preview at Stripe and in development at Adyen. | `elaboration`: The seller balance that exists between the split and the payout. → What a platform can offer when that money is kept, spent or advanced. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read in order, the four chapters turn Mila's refund from a question of who pays today into a question of what was configured earlier, and each later chapter reuses the loss assignment the first one explains.\n\n**So what:** A reader with a platform decision in hand enters at the chapter for it, and one without the first chapter's three answers starts there.\n\n**Callback:** Mila's €84.00 refund a week after Studio Noord's payout (p01). The reader is told that by the end of the part they can say which balance funds it on each provider and why.\n\n**Takeaway** (`course_of_action`): Begin with the models chapter, which answers the refund question in general form: merchant, balance, loss.\n\n**Hand-off** to [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html): `problem_solution`: The part intro's open question: Studio Noord has been paid, Mila wants €84.00 back, and someone's balance must fund it. → The answer in general form: who the merchant is, whose balance holds the money and who stands behind that balance, stated in Stripe's and in Adyen's terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | synthesis | The four chapters let a reader enter at the platform decision in front of them, and by the end of the part the reader can say which balance funds Mila's €84.00 on each provider and why; the first chapter answers the question in general form. |  |  |\n\n## Non-goals\n\n- Teaching account models, verification, splits or embedded finance; the page summarizes and does not re-argue the chapters. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html), [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- The answer to who funds Mila's refund on each provider; the page leaves it open (AC-2) and the part's closing gives it. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html).\n- A 'Stripe and Adyen: Where They Differ' table, take-away tiers, failure-pattern callout and Questions to Ask; part intros do not carry them (style guide).\n- External factual claims of the page's own; every company, network and regulatory statement repeats a chapter of the part, which cites it.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-17** — The closing sentence 'Begin with …' sits under its own heading, 'Where to Begin', as the conclusion's one paragraph. Rejected: Ending the 'Chapters in this part' section with it: the draft checker reads a conclusion only from a heading of its own, and the finished part intros use the same heading.\n- **2026-11-17** — The page does not say whose balance funds the €84.00. Rejected: Giving the Adyen answer in the lead: AC-2 requires the question to stay open for the chapters, and chapter 33's transition_in carries it over as open.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-7: thesis, opening, closing, flow, transition_in; post entry part-7) — Intent, thesis, role, hook, bridge, roadmap and the order of chapters.\n  - _research/scenario-ledger.md — Mila's pass, payout and refund; the Frozen Studios; the Unexplained €0.4 Million; the €156 million exposure figure; the additions by chapters 33 to 35.\n  - posts/33-platform-payment-models, 34-platform-onboarding-and-verification, 35-splits-balances-and-platform-payouts, 36-embedded-finance (index.md, read in full) — What each chapter argues, its Larkfield case, its numbers and the documented Stripe and Adyen facts repeated here.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — Spec created from the journal spec and the four written chapters of Part VII.\n- **2026-11-17** — After the flow rubric: p01 now names Larkfield as the platform, p05 says 'how many sellers finish sign-up' instead of a term not yet introduced, and the flow rationale states what breaks if the evidence paragraph follows the chapter list. Notes not acted on: the roadmap paragraph (p06) is kept although the chapter list repeats its four questions, because the style guide and AC-1 ask for the reading order in the lead; p05 keeps its four limits, one per chapter; 'liable balance account' in p07 is glossed in the prose, and the card for Tuesday's sales in p10 is the chapter's own case.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass: 22 claims checked against chapters 32 to 36, their verification files and rulings 18 to 43 (18 agree, 3 corrected to match, 1 no longer in the chapters and removed). Most significant fix: the page no longer says that only Stripe documents the provider as loss bearer or that Adyen gives no period and no reserve for a negative balance (ruling 41: Managed Risk pilot, 30 days, reserve accounts). Wording inside units only; p02, p05 and p07 fields brought into line.\n- **2026-11-17** — Visual layer: 2 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
