<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Written on 2026-11-17 from the page's PLAN contract and the written chapters. Terms were harvested from the chapters (every bolded term at its definition, each chapter's “Owns” list in PLAN.md, acronyms, the sixteen failure patterns, the preface page how-payments-got-complicated) with _research/glossary-tools/harvest.py; each definition was written with the owning chapter open. Crosswalk rows were taken from the chapters' own comparison tables and text and checked with kw.py; four rows were confirmed on documentation pages fetched that day. Intent, acceptance criteria, thesis and role are copied from the journal spec; the supporting claims G1 to G5 are this page's own. One spec paragraph per unit of the page: each table section is its lead paragraph with the table as evidence, and the index is one list-form unit. The page is assembled by _research/glossary-tools/assemble.py from rows.py, crosswalk.py, head.md, xhead.md and tail.md.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The book's terms in one or two plain sentences each, grouped by part, with the chapter that owns each term, dated as of November 2026.\n- **Know:** The Stripe and Adyen vocabulary crosswalk: for each concept the book names neutrally, the word each provider's documentation uses, and a note where the two do not divide the concept the same way.\n- **Know:** The Larkfield names (people, systems named by role, incidents, Keel decisions K1 to K8) in their own table, marked fictional, and an alphabetical index.\n- **Believe:** The same word can mean different things at the two providers, and a different word can mean the same thing, so a term is translated by its definition, not by its spelling.\n- **Be able to:** Look up a term met in a chapter, read it beside the terms it is confused with, and follow the link to the chapter that owns it.\n- **Be able to:** Read a page of one provider's documentation with the other provider's vocabulary in mind, and say where no one-to-one translation exists.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader finds the definition of a contrasted term pair and the chapters that own it. *Probe:* Using only this page: what is the difference between authorization and settlement, which chapters own the two terms, and why is 'authorized' not 'paid'? | `custom` | cold_reader | major |\n| AC-2 | A reader uses the crosswalk to translate between the two providers' vocabularies and learns where there is no one-to-one match. *Probe:* Using only this page: Stripe's documentation speaks of a 'connected account'; Adyen's speaks of an 'account holder' and a 'balance account'. Are these the same thing? And what does Adyen mean by a 'modification'? | `custom` | cold_reader | major |\n| AC-3 | A reader of a late chapter finds the meaning of a Larkfield name and a Keel decision it uses. *Probe:* Using only this page: a chapter in Part VIII mentions 'the Renewal Wave' and 'K5'. What does each mean, and are they facts about a real company? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** What does each payments, banking and billing term used in the book mean, and what do Stripe and Adyen each call it?\n\n> **Claim:** Stripe and Adyen often use different words for one concept and sometimes divide a concept differently, so a reader moving between the two providers' documentation has to translate by definition, and for some terms, such as the unit that represents a seller on a platform, no one-to-one translation exists. The glossary therefore gives each term one definition in the book's own neutral wording and one owning chapter, and sets beside it, in a crosswalk, the word each provider uses and a note where the two do not match.\n\n**Disputed by:** The view that payments has one industry vocabulary that both providers follow, so that a term learned from one provider's documentation carries over to the other and a glossary only repeats what each chapter already defines.\n\n**So what:** A team that integrates both providers, as Larkfield does, defines its own neutral terms from this page and maps each provider's words onto them, instead of letting whichever provider it integrated first name its database columns and its states.\n\n**How and why:** Each provider's vocabulary follows its own object model. Stripe exposes a seller as one Account object; Adyen separates the legal entity, the account holder, the balance account and the transfer instrument. Adyen calls a capture, a cancel and a refund modifications, each a separate asynchronous request with its own reference; Stripe speaks of disputes for cards and bank debits alike where Adyen speaks of chargebacks, unpaid direct debits included. A term-by-term table makes these differences visible in one place, and the chapters cited in each row carry the dated documentation behind them.\n\n**Supporting claims**\n\n- **G1** — Each term the book uses has one definition in the book's own neutral wording, which follows its owning chapter, sits beside the terms it is confused with and links to that chapter.\n- **G2** — Stripe and Adyen often use different words for one concept, and a table per area names both words for each concept the book defines neutrally.\n- **G3** — The two providers sometimes use one word for different things and sometimes divide a concept differently, so some terms have no one-to-one translation, and the crosswalk says so in a note on the row.\n- **G4** — Larkfield's people, systems, incidents and Keel decisions are fiction, labeled as such and in agreement with the scenario ledger.\n- **G5** — A reader can find any term, alias, abbreviation or provider term by part, by crosswalk area or through the alphabetical index.\n\n## Role in the part\n\nGives the book one vocabulary: each term's meaning, its confusable neighbors, its owning chapter and its Stripe and Adyen names, so a chapter can be read out of order and either provider's documentation can be read with the other's in mind. Supports PR-3 of part `reference`.\n\n## Flow\n\n**Pattern:** `large_to_small`\n\nThe page runs from the widest vocabulary to the narrowest: the book's own terms, then the two providers' words for them, then one fictional company's names, then single words in the index. How to use the page comes first. The definitions follow in the book's own order, from the reading conventions of the preface through Parts I to X, so a reader who knows the chapter finds its section, and they come before the crosswalk because every crosswalk row pairs two provider words under a concept the definitions have already named neutrally. The crosswalk opens with how to read a row and what stands behind it, then runs from the payment itself outward: its money, its reports, its stored credentials, its risk and disputes, billing, platforms, the event and version contract, and the counter; that order follows the definitions' own order of parts, so a reader who has just left a part finds its table in the same place, and reordering the tables would break that correspondence. The fictional names come after everything real so that the two are never mixed, and the index comes last because it lists what all the tables contain. Putting the crosswalk first, as the page's centerpiece, would translate words whose neutral meaning the reader has not yet been given.\n\n## Introduction\n\n**Hook** (`direct_statement`): At Stripe a reserve is money the provider holds back from a merchant against refunds and chargebacks; at Adyen the reserve is a buffer the merchant sets for itself, and the provider's hold is called a deposit.\n\n**Bridge:** The reader has met a term in a chapter, often read out of order, or is reading one provider's documentation with the other's in mind; the toolkit's cards used terms such as idempotency key, clearing account, payout return and PCI scope without defining them. → The two providers name things differently and sometimes divide them differently, so each term needs one neutral meaning, an owning chapter and both provider words beside it.\n\n**Thesis statement** (KEY POINTS callout and paragraph p01): Stripe and Adyen often use different words for one concept and sometimes divide a concept differently, so a reader has to translate by definition; this page gives each term one neutral definition and an owning chapter and sets beside it each provider's word and a note where the two do not match.\n\n**Roadmap** (IN THIS SECTION callout, paragraph p02 and the How to Use section):\n\n- How to find a term and read a row. *Kept in:* how-to-use.\n- The terms for reading the book's claims, and the failure patterns. *Kept in:* reading.\n- The definitions of each part, each with its owning chapter. *Kept in:* money, acceptance, ledger, interface, trust, revenue, platforms, scale, journeys, bets.\n- The Stripe–Adyen vocabulary crosswalk, one table per area, with notes where the two do not match. *Kept in:* crosswalk, x-payments, x-money, x-reports, x-tokens, x-risk, x-billing, x-platforms, x-events, x-inperson.\n- Larkfield's fictional names. *Kept in:* larkfield.\n- An alphabetical index of everything. *Kept in:* index.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | “Reserve” names the provider's hold at Stripe and the merchant's own buffer at Adyen, so a reader moving between the two has to translate by definition; this page gives each term one neutral definition and an owning chapter and sets each provider's word beside it, and for some terms no one-to-one translation exists. |  |  |\n| p02 | context | The page has four parts in order (definitions by part, the Stripe–Adyen crosswalk, Larkfield's fictional names, an alphabetical index), built from the chapters' own definitions and the providers' documentation as read in November 2026, and it defines the terms the toolkit's cards use. |  | `elaboration`: What the page is for. → Its four parts, their order and the material they are built from. |\n\n## Sections\n\n### How to Use This Glossary\n\n**Controlling idea** (`explanation`, id `how-to-use`): The page can be browsed by part, translated through the crosswalk or searched through the index; its rows are short definitions with the owning chapter first, and its fictional, legal and provider entries each need a stated care.\n\n**Advances the thesis** (G1, G5): Tells the reader how to find a term, how to read a row and how far to trust each kind of entry.\n\n**Transition in:** `elaboration`: The page's four parts. → How to find a term and read a row.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | explanation | Browse by part, jump to the alphabetical index for a term, alias, abbreviation or provider word, or go to the crosswalk to translate between the two providers. |  |  |\n| p04 | explanation | The definition rows are short teaching definitions and each crosswalk row names one concept in both vocabularies; the last column gives the owning chapter first, slash rows define contrasted terms together and acronyms are expanded. |  | `elaboration`: Where to look. → What a row holds. |\n| p05 | context | Three kinds of entry need care: Larkfield is fictional, legal and standards entries summarize a rule as of November 2026 and defer to its source, and a provider's term is the word its documentation used when the chapter was written. |  | `additional_support`: What a row holds. → How far a row can be trusted. |\n\n### <a id=\"g-reading\"><\/a>Preface — Reading the Claims, and the Sixteen Failure Patterns\n\n**Controlling idea** (`definition`, id `reading`): The terms for reading the book's claims come first: the central contrast between the instant answer and the slow truth, the six kinds of statement, “Not public”, evidence age, the three tiers of take-away, and the sixteen failure patterns in four families.\n\n**Advances the thesis** (G1): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: How to use the page. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | The terms for reading the book's claims come first: the central contrast between the instant answer and the slow truth, the six kinds of statement, “Not public”, evidence age, the three tiers of take-away, and the sixteen failure patterns in four families. | table: 31 rows: The instant answer and the slow truth, the six kinds of statement, “Not public”, evidence age, the take-away tiers, the Where They Differ section and the sixteen failure patterns with their families. |  |\n\n### <a id=\"g-money\"><\/a>Part I — MONEY: How a Payment Actually Moves\n\n**Controlling idea** (`definition`, id `money`): Part I's terms name the parties to a card payment and the five events between pay and paid (authorization, capture, clearing, settlement, payout), the routes back and the fees.\n\n**Advances the thesis** (G1): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | m; use the toolkit for the cards, domain coverage for the chapter map and the bibliography for the dated sources.\n\n**Hand-off** to [Bibliography](bibliography.html): `sequence`: The glossary's definitions and crosswalk rows, each of which rests on a chapter and, through it, on a provider's documentation read on a date. → The register of every cited source by topic and by chapter, with its date, evidence type and citing pages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | transition | The definitions, the crosswalk and the index are three ways into one vocabulary; a row that disagrees with its chapter is a defect, a crosswalk row is dated, and the toolkit, domain coverage and the bibliography, the book's last page, hold the cards, the chapter map and the dated sources. |  |  |\n\n## Non-goals\n\n- Teaching any concept in depth; the linked chapter does that, with sources and the worked example.\n- Authoritative legal, tax or standards definitions; the official source wins.\n- A complete dictionary of either provider's API: only terms a chapter uses, or that translate a concept the book defines, are in the crosswalk.\n- Explaining why the two providers built differently See [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html), [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html).\n- Templates, the model-to-chapter map and the register of sources See [Toolkit: Cards and Templates for Payment Architecture Decisions](toolkit.html), [Domain Coverage: From the Planning Model to the Book's Chapters](domain-coverage.html), [Bibliography](bibliography.html).\n- Crosswalk pairs that could not be confirmed in a chapter or on a fetched documentation page (listed in _research/glossary-tools/crosswalk.py under LEFT_OUT).\n\n## Modalities\n\nArticle only.\n\n## Dec umentation the chapters cite.\n  - PLAN.md — The page's contract and each chapter's “Owns” list.\n  - _research/scenario-ledger.md and _research/consistency-issues.md — The Larkfield facts and the rulings the rows follow (12 and 29 on what can be read back, 18 and 47 on pre-financing, 23 and 44 on Stripe account types, 35, 41, 46 to 48).\n- **External**\n  - https://docs.stripe.com/disputes/how-disputes-work ; https://docs.stripe.com/api/radar/early_fraud_warnings ; https://docs.stripe.com/payment-links (n.d., fetched 2026-11-17) — Early fraud warning, inquiry and Payment Links as Stripe uses the words.\n  - https://docs.adyen.com/development-resources/webhooks/webhook-types ; https://docs.adyen.com/risk-management/disputes-api ; https://docs.adyen.com/unified-commerce/pay-by-link ; https://docs.adyen.com/adyen-glossary (n.d., fetched 2026-11-17) — NOTIFICATION_OF_FRAUD, REQUEST_FOR_INFORMATION, Pay by Link and shopper as Adyen uses the words.\n\n## Changelog\n\n- **2026-11-17** — Verification pass on the generated tables: 115 crosswalk rows checked against the cited chapters, 70 of them read on fetched provider documentation (64 confirmed, 4 corrected, 2 hedged, 0 removed); 292 definitions checked by script and 97 read (1 hedged, 1 index label disambiguated); 52 Larkfield rows agree with the ledger. Most significant fix: Stripe's `losses_collector` is the Accounts v2 name of a property called `controller.losses.payments` in Accounts v1.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes not acted on, for the author: move the events and versions table next to the payments table; bring the platforms table forward; give the row-reading rules once.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec and the written chapters.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
