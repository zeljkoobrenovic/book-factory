arkfield on Stripe \\| Larkfield on Adyen \\| What the payment service does', six rows from the scenario ledger: acquirer inventory (Stripe Technology Europe, Ltd. for NL, DE, BE; Stripe Payments UK, Ltd.; in the US one of six named acquirers, an open question put to Stripe; Adyen N.V. for NL and DE); pricing (negotiated blended 0.6% + EUR 0.15, assumption; negotiated Interchange++, EUR 0.61 on Mila's pass, assumption); state (K2: payment object; webhook plus settlement report); payout clock and reconciliation (K3: one run per provider); billing (Stripe Billing for studio plans since 2018; the booking app's renewal job on both); platform model (legacy Custom accounts, destination charges, Larkfield bears losses; platform model with platformChargebackLogic). | `example`: The general aid. → The same aid filled in for a business that runs both. |\n| p40 | example | Larkfield decides to keep both: its own subscriptions stay on Stripe because that is where its invoices, tax and meter live, no documented difference forces member payments onto one provider, and a second provider is the rehearsed switch of K8; the cost is the list of differences its payment service absorbs. | scenario: Scenario ledger: studio subscriptions (EUR 24.5 million) billed with Stripe Billing since 2018; Stripe Tax on since 2023; K8, the switch rehearsed quarterly for the 50 largest studios; no orchestration product. [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): Adyen's risk section says large merchants 'typically work with multiple payment service providers to mitigate their own single-point-of-failure risk'. New canonical fact appended to the ledger: the October 2027 decision to keep both, recorded on the provider comparison card with a date per row.; figure: Illustration placeholder 48-one-service-two-providers: one payment service with two adapters, each absorbing a different set of provider defaults. | `cause_effect`: The filled card. → The decision Larkfield takes from it. |\n| p41 | cause_effect | A comparison goes wrong when it is kept without dates: four events of 2026 alone changed cells of the map, so every row carries its date and source and is read again on a schedule. | fact: Dated changes from the sections above: Metronome completed 14 January 2026; Managed Payments in a release API version 22 April 2026; Stripe's Georgia bank in business 28 May 2026; Orb and Talon.One closed 1 July 2026. Scenario ledger K7: one planned upgrade per provider per half-year, the slot Larkfield uses to re-read its card (local detail). | `contrast`: A decision taken from the card. → How the card itself fails, and what keeps it true. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Sorted by evidence, the roughly 250 rows of the earlier parts become two differences of kind, five of default, sequence or degree, and one that is not a comparison; read by date they show two companies that started at opposite ends of the same stack and are building toward each other, which is why a comparison of them needs a date on every row.\n\n**So what:** The choice between Stripe and Adyen stops being a preference and becomes a card: per country, who holds the money and who acquires; per product, built or bought; per default, what you will live with and whether you asked for the alternative; and a list of what neither company has published, to be asked in writing.\n\n**Callback:** The two slogans of the opening: 'Stripe is for startups, Adyen is for enterprises' and 'Adyen owns the stack, Stripe rents it.' The reader can now rewrite each as a dated statement: the first as two starting points whose defaults survive in the price list and the API; the second as true for banking and hosting and false for card acquiring in Europe.\n\n**Takeaway** (`course_of_action`): Fill in the provider comparison card for each provider you use or evaluate: one row per bet, a dated fact or 'Not public' in every cell, the kind of each difference, and the question you put to the provider where the record is silent; read it again every half-year.\n\n**Hand-off** to [Other Answers: PayPal and Braintree, Checkout.com, Block](payment-contrast-cases.html): `additional_support`: The finding that most Stripe and Adyen differences are of default, sequence or degree, traceable to each company's first customers, and that only money-holding and hosting are differences of kind. → Three companies with other first customers (PayPal, Checkout.com and Block), each read for the one thing it holds that neither Stripe nor Adyen does.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis (list) | Established: Adyen is a bank and Stripe says it is not one; Adyen runs its own infrastructure and Stripe runs on AWS; Stripe's own entities acquire in Europe and much of Asia-Pacific while Adyen reports 84% of volume as full-stack; Adyen closed its two listed acquisitions on 1 July 2026 and Stripe has named at least ten since 2020. |  |  |\n| p43 | synthesis (list) | Depends on context: how much the money-holding difference matters depends on whether you hold balances or run a platform; which pricing default suits you depends on whether someone will read an itemized statement; whether the billing difference matters depends on where your invoice already lives; whether to run both depends on what an outage of one would cost. |  | `contrast`: What is settled. → What changes with the business. |\n| p44 | recommendation (list) | The author's synthesis: the two differences of kind are the ones to establish and the rest are defaults to negotiate; and both slogans describe 2011 and 2006, not November 2026. |  | `contrast`: What is established and what depends. → The author's own position, returning to the opening slogans. |\n| p45 | recommendation (list) | Eight questions let the reader take the map into a provider evaluation. |  | `cause_effect`: The author's position. → Questions that apply it. |\n| p46 | transition | The comparison traced most differences to each company's first customers; the next chapter tests that reading on three companies that started with other customers. |  | `additional_support`: The finding of this chapter. → Three further cases that test it. |\n\n## Non-goals\n\n- New facts about either company: the chapter repeats only what the owning chapters and the two cases state, with their dates and hedges. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html).\n- The mechanisms behind each row (acquiring membership, safeguarding, payment state, idempotency, versioning, billing engines, platform liability). See [Plugging Into the Networks: Acquiring, Licences and Connectivity](acquiring-and-network-connectivity.html), [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html), [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html), [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html), [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html), [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html), [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- Other providers (PayPal and Braintree, Checkout.com, Block). See [Other Answers: PayPal and Braintree, Checkout.com, Block](payment-contrast-cases.html).\n- Agent payments, stablecoins, instant payments and PSD3, and what each company is doing about them. See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n- A recommendation of one provider, a ranking, or a score; share price and valuation.\n- Fraud, authentication, tokenization and dispute handling row by row: their tables show differences of documentation and default that do not change the sorting, and they are left to their chapters. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html), [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html), [Never Touch the Card: Tokenization, Vaults and PCI Scope](tokenization-vaulting-and-pci.html), [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The journal entry's AC-2 expects 'lists acquisitions as a use of profits (2025 letter)' as a Stripe fact; no chapter of the book states it, so this chapter does not use it. The cold-reader answer for statement (3) rests on 'at least ten named since 2020'.\n- The journal entry does not name platforms in either class of its thesis; this chapter classes the platform bet as a difference of default, as its owning chapter's table reads ('as a setting ... as a pilot').\n- Adyen's annual report calls paying out only after funds are received the 'default setup' while its documentation and terms describe a pre-financed sales-day payout; chapter 47 reports both and does not reconcile them, and this chapter carries the same hedge.\n- Flow-rubric notes not acted on, for the author: move the journey paragraph (p04) before the thesis (the style guide fixes the introduction's order); merge the map's reading (p36) into the author's synthesis (kept apart, because the map section needs its own reading); hosting sits after the customer-facing defaults although it is a base-layer bet (the journal entry's AC-4 fixes the order; since the 2026-11-17 revision the introduction and the hosting section say why it comes sixth).\n- The journal entry (corrected on 17 November 2026) lists 'the acquiring entity per country at Adyen' among the things the public record cannot decide; the article states it at the owning chapters' current scope (ruling 46j): Adyen's license pages name an acquiring entity for some markets, and no complete list per country is public.\n- For the author, from the verification pass: the article is at about 6,470 words against a target of 5,800 (cap 6,500); what remains is dated evidence, the four tables and one recommendation paragraph per bet, and a further cut would remove evidence or a unit.\n\n## Decision log\n\n- **2026-11-17** — One section per bet, in the order the journal entry's AC-4 expects, each with the same four steps (documented difference, qualification with a labeled inference, what is not public, what to do). Rejected: Grouping by kind of difference (kind first, then degree): it would pair money-holding with hosting but break the promised order and assert the classification before the evidence.\n- **2026-11-17** — The API model is treated inside the first-customers bet, as a table of defaults with the owning chapter per row, as the journal entry's AC-4 lists it. Rejected: A ninth section on the API: the differences are defaults and belong with the pricing default.\n- **2026-11-17** — The one-page map follows the bets; the decision aid uses only documented cells and Larkfield as the worked example. Rejected: Opening with the map: its 'kind' column would then be unargued.; A decision tree by company size: the chapter's evidence refutes size as a criterion.\n- **2026-11-17** — No 'Stripe and Adyen: Where They Differ' section: as a Part X page the whole chapter is that comparison (coordinator's instruction). Rejected: A ninth table repeating the map.\n- **2026-11-17** — Rows on fraud, authentication, tokenization and disputes are not given their own bet; they are named as non-goals. Rejected: Covering all forty-one tables row by row: the chapter would exceed its length and bury the sorting.\n\n## Sources\n\n- **Internal**\n  - posts/01 to posts/41, section 'Stripe and Adyen: Where They Differ' — The forty-one verified comparison tables and their readings: the evidence of this chapter.\n  - posts/46-case-stripe/index.md — Stripe's dated record, the regulated layer by region, acquisitions, figures, where the evidence stops.\n  - posts/47-case-adyen/index.md — Adyen's dated record, the single-platform statements, licenses, the 2026 acquisitions, figures, where the evidence stops.\n  - _research/consistency-issues.md — Rulings 11, 12, 16, 18, 22, 27, 29, 31 to 34, 38, 39, 41 to 45.\n  - _research/scenario-ledger.md — Larkfield's two providers, acquirer inventory, pricing assumptions, platform models, Keel decisions K1 to K8.\n  - _research/brief-companies-and-bets.md — Part 3 (the bets), used only as a cross-check on the chapters' wording.\n- **External**\n  - https://stripe.com/legal/acquirer-disclosure — Acquirer named per country; re-fetched 17 November 2026.\n  - https://www.adyen.com/licenses/emea — Credit institution; UK branch; re-fetched 17 November 2026.\n  - https://docs.adyen.com/account/supported-currencies — Adyen acquiring connections; re-fetched 17 November 2026.\n  - https://investors.adyen.com/financials/2025 — Annual Report 2025: 84% full-stack, banking partners, capital expenditure (read in the PDF in the verification pass of 17 November 2026).\n\n## Changelog\n\n- **2026-11-17** — After the absence audit of the owning chapters (same day): p13 and p21 reworded to match chapters 1, 46 and 47 as they now stand (Adyen names a licensed entity for some markets and lists none per country; Stripe describes one repository without saying which products live in it). No unit added, dropped or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — After the flow rubric: p06 now introduces the rehearsed switch (K8) that p40 relies on; p22 carries the in-person record so that the decision aid's row for a business with stores rests on a documented cell; p17 names the 2026 purchases only as purchases and leaves the billing substance to the billing section.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry, the forty-one 'Where They Differ' tables, the two cases and the consistency rulings; load-bearing sources re-fetched.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Stripe has named at least ten since 2020 and lists acquisiti' -> 'Stripe has named at least ten since 2020.').\n- **2026-11-17** — Verification pass: 121 claims checked (112 confirmed, 4 corrected, 5 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the map's reading no longer says every 2025 and 2026 entry moves toward the other company's position, only the steps that changed a row (Stripe's Georgia bank, Adyen's two purchases), and it is marked as the author's reading. Rulings 46(j), 47(e), 47(j) and 47(m) carried into the payout passage and the acquiring row in the owning chapters' wording. The stale open question on 'names no acquiring entity per country' replaced. Wording changed inside p10, p13, p15, p17, p22, p25, p29, p33, p35, p36 and p39 to p41; no unit added, dropped or reordered.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen's integration dates and its acquiring entity per count' -> 'Adyen's integration dates and a complete list of its acquiri').\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after round-1 draft check: p14 split into p13b (Adyen's own acquiring bounds features) and p14 (slogan verdict and publication); the bridge and p02 now say 'eight bets and three kinds of difference', the third kind being a question inside a bet, and the map's Kind column labels say which kind; the introduction's roadmap (p05) states why the bets come in their order and that the differences of kind come first and sixth; the transitions into first customers, hosting, billing and platforms say why each comes where it does (platforms no longer 'also one of default'); the first-customers inference block moved before p25 (reasoning evidence moved to p24); the Stripe money cell of the map carries its licences' years (AC-3); p04 says Larkfield runs ahead of the evidence and introduces Mila and Studio Noord; glosses added for Platforms, full-stack, Keel, Bridge, PaymentIntent, Customer Area, Auto Rescue, chargeback (moved to first use), legacy Custom accounts and destination charges; p20 'nearly cross' becomes 'nearly swap places'. max_words raised 5% to 6825. No fact, date or source changed.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
