g about a single code base.\n- **Know:** The integrator-visible consequences the earlier parts documented: a payment a client can read again against a reference plus events; idempotency keys kept at least 24 hours against 7 to 14 days; a version set per account or header against one written in every URL; published rate limits against none published for payments; funds made available per transaction against a pre-financed sales-day payout.\n- **Believe:** The choice between the two is made bet by bet and country by country; neither 'the bank against the API' nor 'enterprises against startups' survives the dated record.\n- **Believe:** A stated reason for a difference is an inference unless the company gave it, and should be labeled so.\n- **Be able to:** For a described business, list which documented differences bear on its decision, which do not, and what it must ask each provider because the record is silent.\n- **Be able to:** Classify any claimed Stripe and Adyen difference as one of kind, one of degree or default, or one that cannot be decided from public sources, with a dated fact for each side.\n- **Be able to:** Fill in the provider comparison card for a business that runs both.\n\n**Audience:** Engineers and architects new to payments who have read the mechanism chapters of Parts I to VIII and the two cases, and who must choose between Stripe and Adyen, combine them, or explain to a colleague why a slogan about them is wrong.\n\n**Already knows:**\n\n- What an API, a webhook, an idempotency key, a region and a data center are.\n- From earlier chapters: acquirer, e-money institution, partner bank, payment facilitator, safeguarding, interchange, payout, merchant of record; each is glossed again in one clause where first used here.\n- The two records as the cases left them: Stripe built the interface first and assembled the regulated layer afterward as a non-bank; Adyen built the license and the platform first and bought adjacent software in 2026.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two businesses the chapter does not describe, the reader says which documented differences matter to each and avoids deciding by company size alone. *Probe:* Two companies ask the same question. A: thirty engineers, sells software subscriptions online in twenty countries, bills partly by usage, has no finance team that audits card costs. B: a retailer with four hundred stores in eight European countries, billing done in its ERP, a treasury team that reconciles cost by card type. Using only this chapter: for each, which documented differences between Stripe and Adyen bear on the choice, which do not, and what can neither record tell them? | `custom` | cold_reader | major |\n| AC-2 | Given a list of claimed differences, the reader classifies each as of kind, of degree or default, or undecidable, with one dated fact per company. *Probe:* Using only this chapter, classify each statement as a difference of kind that holds in November 2026, a difference of degree or default, or not decidable from the public record, and give one dated fact for each company: (1) 'Adyen is a bank and Stripe is not.' (2) 'Adyen acquires itself and Stripe uses sponsors.' (3) 'Adyen builds and Stripe buys.' (4) 'Adyen runs its own data centers and Stripe runs on a public cloud.' (5) 'Stripe chose partner banks to enter markets faster.' | `custom` | cold_reader | major |\n| AC-3 | In the comparison map, every Stripe cell and every Adyen cell is a documented fact with its year or the words 'Not public', and every reason offered for a difference is introduced as inference. | `custom` | rubric | blocker |\n| AC-4 | A reader of the introduction alone can predict the bets the chapter compares, in order, and how it sorts them. *Probe:* After reading only the introduction: which bets will this chapter compare, in what order, and into what kinds will it sort the differences? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** On which architectural bets do Stripe and Adyen demonstrably differ in November 2026, and what should a customer choosing or combining them do with each difference?\n\n> **Claim:** Two of the bets are differences of kind that both records document: who holds the money (a licensed bank against e-money institutions with partner banks) and who runs the machines (own data-center capacity against AWS). The rest (acquiring, build or buy, first customers and pricing, billing products, the API model) are differences of default, sequence or degree that narrowed in 2025 and 2026, and 'one platform against a suite' sets an engineering statement beside a packaging statement. A customer should therefore treat the two kinds differently: for a difference of kind, establish per country which entity will hold its funds and what it depends on; for a difference of degree or default, compare the default it will live with and ask for the alternative; and decide on neither company's slogan.\n\n**Disputed by:** The view that the two companies embody opposite architectures that follow from their customers, 'Stripe for startups, Adyen for enterprises', so that company size settles the choice; and the engineer's version of it, that Adyen owns the stack and Stripe rents it, so that the comparison is one row long.\n\n**So what:** The decision becomes a card with rows and dates instead of a preference. A business that runs both, as Larkfield (fictional) does, knows which differences it must absorb in its own payment service (two fee models, two payout timings, two sets of regulated entities, two webhook contracts) and which it can ignore; a business choosing one knows which questions to put to the sales team because the public record does not answer them.\n\n**How and why:** The 'Where They Differ' tables of Parts I to VIII, gathered, sort themselves by evidence. Where both companies have documented a structural fact, the difference is of kind: Adyen's banking licenses and Stripe's 'not a bank'; Adyen's data-center capital expenditure and Stripe's statement on AWS (2023; a 2024 AWS post co-written by Stripe engineers is consistent with it). Where the facts are the same in type and differ in amount, order or default, it is of degree: Stripe's own entities acquire in Europe and much of Asia-Pacific while Adyen is full-stack for 84% of volume; Stripe built Billing in 2018 and bought Metronome in 2026 while Adyen bought Orb in 2026; Stripe's default is a published blended rate with interchange-plus among its custom options, while Adyen's default is Interchange++ with volume tiers; each began with one kind of customer and now sells to the other's. Where one company has published nothing (Stripe's reasons for partner banks, its sponsor shares, its code structure; Adyen's integration dates and a complete list of its acquiring entities per country; either one's realized prices), the chapter says 'not public' and gives any reason only as labeled inference. The clearest integrator-facing differences are defaults. That they fit each company's first customers is the author's inference, and it is a statement about where the defaults came from, not about which customer should choose which company today: a self-serve, re-readable API with published limits on one side; one with methods and features enabled on request, explicit versions, longer retry windows and pre-financed payouts on the other.\n\n**Supporting claims**\n\n- **S1** — Sorted by the evidence behind them, the differences between Stripe and Adyen fall into three kinds: differences of kind, where both companies document a structural fact; differences of default, sequence or degree, where the facts are of the same type and differ in amount, order or default; and questions the public record cannot decide, where any reason offered is an inference.\n- **S2** — Two bets are differences of kind that hold in November 2026: who holds the money (one licensed bank with two branches against e-money institutions, state licenses and partner banks) and who runs the machines (own infrastructure in data centers against AWS).\n- **S3** — Acquiring, build or buy, first customers with the pricing and API defaults they left, billing and revenue products, and platform loss bearing are differences of default, sequence or degree, and each narrowed in 2025 and 2026; 'one platform against a suite' is not a like-for-like row, because it sets a statement about Adyen's operation beside a statement about Stripe's packaging.\n- **S4** — On several points one company or both have published nothing (Stripe's reasons for partner banks, volume per acquirer, Adyen's acquiring entity per country, realized prices, an independent measure of approval rates); there the chapter says 'not public' and offers reasons only as labeled inference.\n- **S5** — A customer therefore decides bet by bet and country by country: for a difference of kind it establishes which entity holds its funds and what the provider depends on; for a difference of degree or default it compares the default it will live with and asks for the alternative; a business on both providers, as Larkfield (fictional) is, knows which differences its own payment service must absorb.\n\n## Role in the part\n\nTurns the two cases and the book's 'Where They Differ' tables into one argued map, and is the page on which the journal's provisional reading of the two companies is confirmed in part and corrected in part. Supports P10-3 of part `part-10`.\n\n## Flow\n\n**Pattern:** `comparison` (also `prerequisite_order` in scene, sorting, then the bets: the decision and the sorting rule come before anything is sorted; `large_to_small` in the eight bets: from the regulated base (money, acquiring) through how products are made and packaged, to the customer-facing defaults, the machines, and the two product areas built on top)\n\nThe reader meets the decision first, then the rule for sorting evidence, because every bet section applies that rule. The bets run in the order the journal entry fixes: the regulated layer first (who holds the money, who acquires), since the slogans are about it; then how each company makes and packages products (build or buy, platform or suite); then the customers and the defaults they left in price and API; then hosting; then the two product areas, billing and platforms, which depend on the earlier bets (the license returns in platforms, build-or-buy in billing). The map comes after the bets because it summarizes cells the reader has already seen argued; put first, its 'kind' column would be assertion. The decision aid comes last because it uses only the documented cells of the map. Moving hosting next to money-holding would pair the two differences of kind but break the order the introduction promises and separate the API defaults from the customers that explain them.\n\n## Introduction\n\n**Hook** (`provocative_quotation`): Two sentences are said in most provider evaluations: 'Stripe is for startups, Adyen is for enterprises' and 'Adyen owns the stack, Stripe rents it.' Against them stand two dated lines from the companies themselves: Stripe's acquirer disclosure (accessed November 2026) says for the European Economic Area 'Payment Method Acquirer is Stripe Technology Europe, Ltd.', and Adyen's third-quarter 2026 update says its Platforms offering 'allows us to provide payments and financial products to smaller merchants, which will be a key driver of future growth'.\n\n**Bridge:** An engineer who has read forty-one 'Where They Differ' tables and two cases holds about 250 rows of difference and no way to tell which of them should decide a choice of provider. → Sorted by the evidence behind each row, the differences reduce to eight bets and three kinds of difference (of kind; of default, sequence or degree; not decidable from the public record, a kind that applies to questions inside a bet rather than to whole bets), and the kind says what a customer should do with each.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): Two bets are differences of kind that both records document: who holds the money and who runs the machines. The others are differences of default, sequence or degree that narrowed in 2025 and 2026, 'one platform against a suite' compares an engineering statement with a packaging statement, and some questions the public record cannot decide. A customer treats each kind differently and decides on neither company's slogan.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Open at Larkfield, where the chief executive asks which of the two providers to keep. *Kept in:* scene.\n- Define the three kinds of difference and the rule for reading every cell. *Kept in:* sorting.\n- Compare eight bets in a fixed order: license and money-holding; acquiring and connectivity; build or buy; one platform or a suite; first customers with the API model and pricing; hosting; billing and revenue products; platforms. For each: the documented difference, the plausible reason as labeled inference, what is not public, and what it means for a customer. *Kept in:* money, acquiring, build-or-buy, platform-or-suite, first-customers, hosting, billing, platforms.\n- Gather the eight bets into one map, sorted by kind. *Kept in:* map.\n- Turn the map into a decision aid for choosing or combining the two, worked through for Larkfield. *Kept in:* decision-aid.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Two slogans, 'Stripe for startups, Adyen for enterprises' and 'Adyen owns the stack, Stripe rents it', each meet a dated sentence from the companies' own documents that they cannot explain: Adyen's statement on smaller merchants answers the first, Stripe's European acquirer disclosure the second. | quotation: Stripe acquirer disclosure, https://stripe.com/legal/acquirer-disclosure (n.d., accessed 17 Novem efinition | Three tests sort every difference: both companies document a structural fact (kind); the facts are of the same type and differ in amount, order or default (degree); or at least one company has published nothing, which the chapter states as 'Not public', meaning not found by 17 November 2026, and never fills by inference. | reasoning: The sorting rule in the journal entry's thesis (how_why): 'Where both companies have documented a structural fact, the difference is of kind ... Where the facts are the same in type and differ in amount, order or default, it is of degree ... Where one company has published nothing ... the chapter says not public'.; figure: Illustration placeholder 48-three-kinds-of-difference: slogans entering a sorter with three trays labeled 'Kind', 'Degree' and 'Not public'. |  |\n\n### Who Holds the Money: A Bank and a Non-Bank\n\n**Controlling idea** (`comparison`, id `money`): Adyen is one licensed bank with two branches and Stripe is a non-bank that holds funds through e-money institutions, state licenses and partner banks; this is a difference of kind that both document, and it shows in where balances sit, who can pay out before funds arrive and who lends.\n\n**Advances the thesis** (S2, S4, S5): Establishes the first difference of kind and what a customer must find out per country because of it.\n\n**Transition in:** `sequence`: The sorting rule. → The first bet to which it is applied: the license and who holds the money.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The documented difference first, then what it changes, then the qualification and the labeled reason, then the action; the same order is used for every bet so the reader can compare them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | comparison | Adyen N.V. is a credit institution, a bank, with a US federal branch and a UK branch; Stripe states that it is not a bank and holds permissions funct ervice; re-fetched) pay 'irrespective of whether the funds are actually received by Adyen from the Acquirer or Scheme Owner', 'Prefinancing is capped at 30 days'; Stripe documents paying ahead only for Instant Payouts. [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): the annual report calls paying only after funds are received the 'default setup', which the case could not reconcile. [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html) row 'License behind the products': Stripe's partner banks and outside lenders; 'Adyen is the lender'. | `cause_effect`: The two regulated forms. → What the form changes that a customer can observe. |\n| p11 | counterargument | The gap is narrower than 'a bank against software': Stripe's European entities are regulated in their own right, since 28 May 2026 Stripe owns a Georgia limited-purpose acquiring bank, and its Bridge subsidiary holds a preliminary conditional approval for a trust bank; but neither charter takes deposits, so the difference of kind stands. | fact: [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html) and ruling 33; [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): Georgia Department of Banking and Finance bulletin of May 2026 (approved 30 June 2025, in business since 28 May 2026); Stripe MALPB terms (https://stripe.com/legal/stripe-malpb-acquirer-terms, last updated 28 May 2026; re-fetched): 'a Georgia Merchant Acquirer Limited Purpose Bank'; such banks 'may not solicit or accept deposits from the general public' (ICBA news item, 8 July 2025, secondary source); OCC 'preliminary conditional approval' for Bridge National Trust Bank, 12 February 2026, no final approval found.; reasoning: INFERENCE block, from [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html) and [Whose Money Is It? Licences, Safeguarding and Where Funds Sit]( re like with like. → A bet about how products are packaged, whose two sides are statements about different things.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | comparison | Adyen's phrase is a claim about operation, one place where a change takes effect, and Stripe's 'suite' is a claim about packaging, products with their own names and prices that its largest customers buy together. | quotation: [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): Annual Report 2025, 'a single platform built entirely in-house'; any improvement 'takes effect everywhere, without reintegration work'; 'the phrase is a claim about operation ... and not about the interface you integrate'. [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): 'Revenue and Finance Automation Suite, with Billing at its core' (2024 letter); 'Seventy-five percent of these global winners use Stripe for more than just payments' (March 2023); inference there: 'Suite describes how Stripe packages and sells; it says nothing about how the parts are built.' |  |\n| p20 | analysis | At the interface the two nearly swap places: Adyen's platform is integrated through several API families with their own versions, Stripe's suite through one object model, and Stripe sells products that sit over other providers' processing while Adyen argues for carrying the payment itself. | fact: [Objects, Commands and Events: How Payment APIs Are Designed](payment-api-design.html) row 'Shape of the API': Stripe 'One host, one object model, two namespaces'; Adyen 'Several API families with their own version counters and, in most cases, hosts'. [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html): Stripe Orchestration in private preview routes cards to Adyen, Braintree and Worldpay; Jon Krauss of Stripe (Stripe Sessions, April 2026): 'You're not going to have to be locked into Stripe'; Adyen product page: 'Unlike fragmented legacy architectures, Adyen brings payments onto one single platform'; Adyen's Multi pay-in in pilot; Orb 'continuing to support multi-PSP environments' ([Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html)).; reasoning: INFERENCE block, from [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html): holding the layer above the payment (checkout, billing, fraud, vault) may be worth more to Stripe than carrying every authorization; Adyen's argument rests on carrying the payment. Neither has said this. | `contrast`: The two statements. → How they look from the integrator's side. |\n| p21 | recommendation | Stripe has not said which products live in the one repository its engineers describe, and Adyen has not said what its bought products share with its platform, so the row cannot be scored and a customer tests each product pair it will use instead. | fact: [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): 'Stripe has published nothing about a single code base across its products'; [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html) row 'Language and repository': Ruby monorepo of about 50 million lines (2026); Java monorepo (2021), 'far from the only one' (2026). [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): 'Single platform is not a single process: 3,000 services'. | `cause_effect`: Two statements that cannot be set against each other. → What a customer does instead of scoring the row. |\n\n### First Customers and Today's Defaults\n\n**Controlling idea** (`comparison`, id `first-customers`): Each company documents the customer it started with and now sells to the other's; what remains of the starting point is a set of defaults in the price list and the API, and a default can be changed by asking.\n\n**Advances the thesis** (S3, S4, S5): Tests the 'startups against enterprises' slogan against the record and reduces it to defaults.\n\n**Transition in:** `cause_effect`: A row that was a statement about packaging. → The bet behind the commercial slogan, asked once packaging is settled: to whom each company sold first, and what that left in price and API.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim about customers is tested first; the two sets of defaults follow as what is left of it; the inference comes next, then what is not public and the action, as in every other bet.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | evidence | Stripe says it grew up with technology companies and still calls the long tail central, and Adyen says it was built for enterprise and reports in-person payments as a line of business, which Stripe does not; but Stripe's enterprise base has compounded since 2019 and Adyen names smaller merchants, reached through platforms, as a key driver of future growth, so company size no longer separates their customers. | quotation: [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): 'Stripe grew up with companies in the technology sector' (2022 letter, April 2023); 'enterprise user base has compounded since 2019' (March 2023); 'the long tail is much of the dog' (February 2026). [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): 'Built for enterprise, not adapted to it.' (history page, n.d., accessed November 2026; re-fetched); 'Our Platforms offering allows us to provide payments and financial products to smaller merchants, which will be a key driver of future growth' (Q3 2026 update); 312,000 active business customers behind platforms; top 10 merchants 11% of revenue.; statistic: [The Card in the Room: Terminals and Unified Commerce](in-person-payments.html) row 'Published scale': Adyen, point-of-sale volume of EUR 310.9 billion in 2025, 22% of processed volume, and 878k transacting terminals (Q3 2026); Stripe, Not public (Terminal announced 17 September 2018; no Terminal volume, reader count or in-person share found). Both sell terminals. |  |\n| p23 | comparison | The price lists keep the starting point as a default: Stripe publishes a blended rate and lists interchange-plus among its custom options, and Adyen publishes pass-through Interchange++ pricing with volume tiers and marks its figures indicative; each sells the other model. | fact: [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html) rows 'Published default price for a card payment' and 'The other model': Stripe 1.5% + EUR 0.25 on a standard EEA card (Netherlands list, https://stripe.com/en-nl/pricing, n.d., accessed November 2026; re-fetched), 'IC+ pricing' under custom pricing, markup Not public; Adyen a fixed processing fee plus a fee per payment method, Interchange++ (https://www.adyen.com/pricing, n.d.; re-fetched: 'The fees outlined above are indicative'), a fee type for 'blended rates' in the platform documentation, negotiated markup Not public. [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): 'Adyen's tiered pricing structure incentivizes our customers to bring more volume' (Q3 2026). Dispute fee: Stripe EUR 20.00 listed; Adyen amount Not public. | `additional_support`: First customers. → The first place the starting point survives: the default price. |\n| p24 | comparison | The API keeps it too, as a set of defaults the earlier parts documented: a payment a client can read again against a reference plus events, idempotency keys kept at least 24 hours against 7 to 14 days, a version set per account or header against one in every URL, published rate limits against none published for payments, methods switched on in a dashboard against on request, and funds made available per transaction against a pre-financed sales-day payout. The labeled inference that follows the table reads these defaults as fitting each company's first customers. | table: Table 'Default \\| Stripe \\| Adyen \\| Owning chapter', seven rows from [One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html) (PaymentIntent retrievable by ID; Checkout API v72 has no operation that returns an online payment by identifier), [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html) (v1 at least 24 hours, v2 30 days; 7 to 14 days), [Changing the API Without Breaking a Million Integrations: Versioning](payment-api-versioning.html) (account default, header or SDK; integer in each API's URL), [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html) (100 requests a second per account published; none published for payments, 429 documented), [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html) (retries up to three days; up to 30 days), [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html) and [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html) (dashboard, 'generally instantaneous', retries on by default; request in the Customer Area, Auto Rescue off until support enables it), [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html) (per transaction at available_on; per sales day). Re-fetched 17 November 2026: https://docs.stripe.com/api/idempotent_requests.md ('at least 24 hours'), https://docs.adyen.com/development-resources/api-idempotency.md ('7 to 14 days'), https://docs.stripe.com/rate-limits.md (100 requests per second).; reasoning: INFERENCE block: a self-serve, re-readable API with published limits fits developers who integrate without an account team; methods and features enabled on request, explicit versions, longer retry windows and an itemized price fit a customer with an account manager and a finance team. From the journal entry's thesis (how_why) and the last columns of [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html), [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html) and [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html). Neither company states it. | `additional_support`: The default price. → The second place the starting point survives: the defaults of the API and of operations. |\n| p25 | recommendation | Whatever their origin, a default can be asked about; realized prices and any independent measure of approval rates are not public, so a customer compares the default it will live with, asks for the alternative in writing, and measures acceptance itself. | fact: [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html): negotiated markup Not public at both. [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html) row 'Headline claim': 'Different metrics and cohorts; not comparable'; both converge on a server-created session ([One Object, Many Outcomes: The Payment State Machine](payment-state-machines.html) row 'Recommended entry point'). | `cause_effect`: The defaults in price and API and the inference about their origin. → What stays unpublished, and what to do. |\n\n### Who Runs the Machines: Own Infrastructure and a Public Cloud\n\n**Controlling idea** (`comparison`, id `hosting`): Adyen runs its own infrastructure in data centers and reports what it costs; Stripe runs on AWS by its own statement; this is the second difference of kind, and an integrator meets it as a region setting on one side and none on the other.\n\n**Advances the thesis** (S2, S4, S5): Establishes the second difference of kind and what it does and does not let a customer plan on.\n\n**Transition in:** `contrast`: Defaults that a customer can ask to change. → The sixth bet, the second difference of kind, placed after the defaults as their opposite, which no customer can ask to change: who runs the machines.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | comparison | Adyen manages its own infrastructure in data centers, names six regions and reports data centers as the majority of its capital expenditure; Stripe said in 2023 that it could not run without AWS and names no AWS region. | quotation: [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html) rows 'Hosting' and 'Where the data centers are'; [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): 'We manage our own infrastructure in several data centers around the world' (2021 post; evidence age 5 years); capital expenditure 'EUR 116.8 million and 5% of net revenues' in 2025, 'The majority of our CapEx is related to our data centers'; data centers 'in Europe, the United States, India, Singapore, Japan and Australia' and 'We administer and manage all our own servers' (https://www.adyen.com/infrastructure, n.d., accessed November 2026; re-fetched); no cities or operators; 'data center partners' in the annual report. [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): 'Stripe has long relied on AWS to provide the core compute infrastructure on which Stripe is built'; 'We couldn't run without AWS—and we wouldn't want to' (release of 23 January 2023, https://stripe.com/newsroom/news/amazon-and-stripe; re-fetched; evidence age almost 4 years; an October 2024 AWS post co-written by Stripe staff is consistent). |  |\n| p27 | evidence | An integrator meets the difference in three places: region is a setting in Adyen's integration and absent from Stripe's; Adyen states that payments are stored in Europe and Stripe states no storage location; and capacity is bought ahead on one side and rented on the other, with Adyen documenting a peak freeze and load-balancer failover in general terms. | fact: [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html) rows 'Regions an integrator can name', 'European data', 'Several data centers at once': five live regions for online payments (EU, US, AU, NEA, IN) against one base URL; payments 'stored in Europe and our isolated India environment'; neither promises data stays in the EU; 'active/active', load balancers 'manage the failover to the other data centers' (https://docs.adyen.com/industries/peak-season, n.d.; re-fetched), no topology or timings; for Stripe not found. [The Biggest Day: Peak Load and Capacity](payment-peak-load.html) row 'How capacity is obtained': utilization 'generally less than 30%', investment pulled forward 'to secure compute and storage availability' (2026); Stripe shards split in surges (2024); freeze around named peak days documented by Adyen only.; reasoning: INFERENCE block, from [The Biggest Day: Peak Load and Capacity](payment-peak-load.html) and [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): provisioning time on one side, purchase lead time on the other; 'single platform' read as a statement about cost. Adyen's own stated reasons for not using a public cloud are 'part historical, part legal, and part technical' (2021); Stripe gives none beyond 'we wouldn't want to'. | `cause_effect`: Who runs the machines. → Where an integrator meets it. |\n| p28 | recommendation | Neither company publishes a failover design, timings or the cities of its data centers, and their availability figures cannot rank them, so a customer records the hosting dependency of each provider, treats residency as a setting to check on Adyen and a contract question on Stripe, and rests no plan on either provider's failover. | fact: [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html) rows 'Reported figures' and 'Contractual commitment': 'Neither publishes a consistent yearly series, so the figures cannot rank the two'; Adyen 99.9% per quarter by 'commercially reasonable efforts' (terms of November 2023), none found for Stripe; 'No plan of yours can rest on either provider's failover'. [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html) and [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html) 'Where the Evidence Stops': AWS regions; cities, operators, how failover works. | `cause_effect`: A difference of kind with an unpublished design on both sides. → What a customer records, checks and does not rely on. |\n\n### Billing and Revenue Products: Built from 2018, Bought in 2026\n\n**Controlling idea** (`comparison`, id `billing`): Stripe holds the subscription, the invoice, the tax calculation and the revenue schedule in first-party products and sells a merchant-of-record product; Adyen had none of these in its documentation, bought a usage-billing company in July 2026 and says it is not a merchant of record.\n\n**Advances the thesis** (S3, S4, S5): Shows the widest product difference as one of sequence that began to narrow in 2026 and has not yet changed an integration.\n\n**Transition in:** `contrast`: A difference no customer can change. → The first of the two product areas that rest on earlier bets: billing, which rests on build or buy and changed in 2026.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | comparison | Stripe has held the subscription and its invoice since 2018 and added tax, revenue recognition and, in 2026, a merchant-of-record product; in Adyen's documentation a subscription is a processing model on a payment, with no invoice object and no first-party tax engine or revenue-recognition product found. | fact: [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html) rows 'Subscription and its status', 'Who holds the invoice'; [Whose Tax, at What Rate: Tax Calculation in the Payment Path](billing-and-payment-tax.html) (ruling 38: 'no first-party tax engine found', Adyen's terms clause 4.5, a VAT split type, form 1099-K, Orb 'connects to third-party tax providers'); [Cash Is Not Revenue: Revenue Recognition and the Hand-off to Finance](billing-revenue-recognition.html) row 'First-party recognition product' (ruling 39); [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html): Managed Payments 'in a release version of the API since 22 April 2026', 3.5% per successful transaction, Connect platforms excluded; 'Adyen doesn't act as a direct, third-party merchant of record' (article of 15 September 2026, https://www.adyen.com/knowledge-hub/merchant-of-record; re-fetched), 'we integrate with global merchant of record partners'. [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): Billing launched 5 April 2018, Tax June 2021, Revenue Recognition September 2021. |  |\n| p30 | analysis | The gap began to close on 1 July 2026, when Adyen closed its purchase of Orb, and both companies now own a usage-billing engine bought that year; but Adyen has no documentation page for a billing product, Orb still serves other payment providers, and an Adyen integrator's work is unchanged. | fact: [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html) row 'Billing company bought in 2026': Metronome completed 14 January 2026, documented as Stripe's primary usage-based billing platform; Orb closed 1 July 2026, 'incubator model', no Adyen documentation page found as of November 2026; last column 'For an Adyen integrator nothing has changed yet'. [Counting Before Charging: Usage Metering and Rating](usage-metering-and-rating.html): integration announced as coming 'soon' (29 September 2026). [Cash Is Not Revenue: Revenue Recognition and the Hand-off to Finance](billing-revenue-recognition.html) and ruling 39: Orb's documentation lists Adyen as a payment gateway.; reasoning: INFERENCE block, from [Who Is the Seller? Merchant of Record as an Operating Model](merchant-of-record.html) and [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): where each provider's billing products stop fits the customer it started with; an enterprise has its own billing system, legal entities and tax function, a small self-serve seller has none. Adyen's own stated reason for buying Orb is in [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html); neither company states the reasoning about customers. | `time`: The gap as documented. → What changed on 1 July 2026 and what did not. |\n| p31 | recommendation | When and how Orb joins Adyen's platform is not public, so the decision turns on where your invoice lives: with Stripe if you want the provider to hold it, in your own or a separate billing system on Adyen, and in one named system if you run both, because a tax or recovery product inside one provider sees only that provider's sales. | fact: [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html) integrator advice: on Adyen, 'name the system that holds the schedule, the amount and the invoice'. [Whose Tax, at What Rate: Tax Calculation in the Payment Path](billing-and-payment-tax.html) row 'Threshold monitoring', last column: 'A monitor inside one provider undercounts for a business on two'. [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html) row 'Unit being recovered': the invoice against the payment. [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): 'convergence' has no date. | `cause_effect`: A gap that is closing at an unpublished pace. → What a customer decides in the meantime. |\n\n### Platforms: Who Stands Behind the Seller\n\n**Controlling idea** (`comparison`, id `platforms`): Both companies sell a platform product with balances per seller; they differ in how a seller is modeled, in who bears a seller's losses by default and in whether that assignment can change, and the license bet returns in the financial products built on top.\n\n**Advances the thesis** (S3, S4, S5): Shows the platform bet as a difference of default, with the loss-bearing option documented on both sides.\n\n**Transition in:** `additional_support`: Billing as a difference of sequence. → The last bet, which rests on the license as billing rests on build or buy, and which like first customers is a difference of default: platforms and who bears a seller's loss.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | comparison | Stripe expresses the merchant per payment, by charge type, on one account per seller; Adyen expresses it by integration model and separates a seller into a legal entity, an account holder, a balance account and a transfer instrument, and it decides refunds and chargebacks by an instruction on each payment where Stripe decides by the kind of charge. | fact: [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html) rows 'How the merchant is expressed', 'What represents a seller', 'Where a chargeback is booked'; [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html) rows 'How a payment is divided' and 'A split that cannot be booked as sent' (a Stripe transfer fails with an error; Adyen books to the liable balance account without an error). [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html): Connect since October 2012, 'More than 18,000 platforms' (September 2026). [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html): Platforms net revenue EUR 263.8 million in 2025. |  |\n| p33 | analysis | On who bears a seller's losses the two are closer than commonly said: Stripe offers itself as loss bearer as a setting per account that cannot be changed later, and Adyen's default is the platform's own liable account, with Adyen bearing the loss under Managed Risk, a pilot with limited availability. | quotation: [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html) rows 'Who stands behind a seller's negative balance', 'Can the assignment change?', 'Recovery'; ruling 41. Stripe: losses_collector, 'You can't update their values later' (https://docs.stripe.com/connect/accounts-v2/connected-account-configuration, n.d.; re-fetched). Adyen: 'Adyen allows negative balances for up to 30 days'; Managed Risk 'is in pilot phase', Adyen will 'assume the responsibility for negative balances', written off after 180 days (https://docs.adyen.com/platforms/managed-risk, n.d., accessed November 2026; re-fetched). [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html): Stripe's reach per country depends on a partner, Adyen's on where its license extends; accounts for a platform's sellers generally available at neither.; reasoning: INFERENCE block (the author's): Stripe's setting suits a platform with no risk function of its own, which matches the software companies it started with; Adyen's default assumes a platform able to carry and manage its sellers' risk. Neither company says so. | `contrast`: How each models a seller. → Who bears the seller's loss, where the two are closer than assumed. |\n| p34 | recommendation | Adyen's platform price list and both companies' underwriting criteria are not public, so a platform decides who bears seller losses before it creates the first Stripe account, sends and stores the chargeback instruction on every Adyen payment, and asks each provider for the release stage of every financial product per country. | fact: [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html) row 'Price list for the platform product' and integrator advice; [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html) list of gaps (merchant underwriting at either company); [Beyond Payments: Accounts, Cards and Capital as Platform Features](embedded-finance.html) integrator advice; [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html): on Stripe the onboarding design waits for the liability decision. | `cause_effect`: Defaults that differ and a price that is not public. → What a platform decides first and asks. |\n\n### The Map on One Page\n\n**Controlling idea** (`synthesis`, id `map`): Gathered on one table, the eight bets show two differences of kind, five of default, sequence or degree, and one row that is not a comparison; read by date, they show two companies building toward each other from opposite ends.\n\n**Advances the thesis** (S1, S2, S3, S4): Assembles the sorted bets into the map the part thesis rests on.\n\n**Transition in:** `conclusion_summary`: Eight bets, each compared on its own. → All eight on one table, sorted by kind.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | comparison | One table holds the eight bets, each with a dated fact for Stripe, a dated fact for Adyen, its kind, and what is not public. | table: Table 'Bet \\| Stripe \\| Adyen \\| Kind \\| Not public', eight rows, every cell repeated from the sections above with its year or 'n.d.' (the Stripe money cell with the years of its licences: e-money institutions 2019 and 2017, money transmitter 2025), owners as linked there. The Kind column says 'Of kind' for the first kind and names default, sequence or degree for the second; the third kind fills the 'Not public' column; the platform-or-suite row is 'Not like for like'.; figure: Illustration placeholder 48-two-orders-of-construction: two stacks of the same five layers, Provider A built from the top down and Provider B from the bottom up, two layers marked as different in kind. |  |\n| p36 | synthesis | Read as a whole, the map supports an order of construction and not a division of territory: each company started at one end (the author's reading, as in the two cases), the steps of 2025 and 2026 that changed a row narrowed it, and the two rows that did not move are the two differences of kind. The figure that draws it is read in the text: five layers from interface to machines, Stripe as Provider A (interface launched 2011), Adyen as Provider B (founded 2006). | reasoning: From the dates in the table: Stripe's Georgia bank (in business 28 May 2026) and Bridge's preliminary approval (February 2026) move toward the regulated layer; Adyen's Orb and Talon.One (1 July 2026), Managed Risk pilot and Platforms growth move toward software and smaller merchants; no entry on either side changes who is a deposit-taking bank or who runs its own infrastructure. The part thesis: 'an order of construction, not a division of territory'. | `cause_effect`: The table. → What the rows show when read together and by date. |\n\n### Choosing or Combining: A Decision Aid\n\n**Controlling idea** (`recommendation`, id `decision-aid`): A business decides per bet and per country from the documented differences only, ignores size and incomparable figures, and, if it runs both providers, lists what its own payment service must absorb; Larkfield does this and keeps both.\n\n**Advances the thesis** (S5, S4): Turns the map into the action the thesis recommends and works it through for a business on both providers.\n\n**Transition in:** `cause_effect`: The map and its pattern. → What a customer does with it.\n\n**Order of paragraphs** (`large_to_small`): The general aid first, then what to leave out, then one business worked through, then the way the aid decays; the reader gets the rule before the example and the failure after both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | recommendation | A
