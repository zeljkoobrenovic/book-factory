<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between canceling an authorization, a reversal, a refund and a chargeback, and who starts each.\n- **Know:** The stages of a card dispute, the four families of dispute reasons, and that the merchant's evidence is submitted once against a deadline.\n- **Know:** What pre-dispute tools and network monitoring programs are, and that monitoring counts disputes whatever their outcome.\n- **Know:** How disputes differ outside cards, and how Stripe and Adyen each represent a dispute and move the money.\n- **Believe:** A paid-out payment is provisional for months, and a refund is a new payment in the other direction that can fail.\n- **Be able to:** Given a payment and its state, choose between cancel, reversal and refund and say what each costs.\n- **Be able to:** Given a dispute notification, say what the deadline is read from, what evidence must already exist, and when the money leaves and may return on each provider.\n- **Be able to:** Say how long the financial record of a payment must stay open.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a customer-service case the chapter does not contain, the reader chooses the right backward flow and names its failure mode. *Probe:* A hotel took a card approval for €300 on Monday for a stay that the guest cancels on Tuesday, before the hotel has collected anything. A second guest, already charged €300 and paid out to the hotel last month, also wants the money back. What should the hotel do in each case, and what can go wrong in the second? | `custom` | cold_reader | major |\n| AC-2 | Given a dispute that arrives after payout, the reader says who decides, what the merchant may do and what stays true even if the merchant wins. *Probe:* A language school is told that a €500 course fee paid ten weeks ago has been disputed by the student's bank. The school has proof the student attended. Who decides the outcome, how many times can the school make its case, and what cost remains even if it wins? | `custom` | cold_reader | major |\n| AC-3 | Visa rules are cited from the dated rulebook; Mastercard cycles, deadlines and thresholds are attributed to the provider that reports them and not presented as Mastercard's own text; thresholds and fees carry an 'as of' date; Adyen's dispute fee is stated as set by contract, with the one amount on its site (CAD 24.00, in Adyen Canada's fee disclosure) named. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How does money go back, who decides, and why can a payment be undone months later?\n\n> **Claim:** Money goes back by three routes that are not variations of one 'undo': a reversal, which the merchant sends, cancels the issuer's promise before any money has moved; a refund is a new transaction that the merchant starts and that can itself fail; and a dispute is started by the cardholder's issuer and ruled on by that issuer under the network's rules, with the network as arbiter at the last stage and the merchant allowed one submission of evidence. A payment can be undone months later because those rules give the issuer its own clock, up to 120 days from the transaction for most Visa dispute conditions, and that clock runs regardless of settlement and payout.\n\n**Disputed by:** The view that a refund is the original payment run in reverse, that the merchant and its provider decide what goes back, and that a payment the provider has paid out is final.\n\n**So what:** The merchant's record of a payment has to stay open in its financial effect for at least the dispute window, backward flows need their own states and ledger entries instead of a 'refunded' flag, and the evidence for a dispute has to be captured at the time of sale because the single submission comes with a deadline of days.\n\n**How and why:** Each route belongs to a different party and a different point on the timeline: before capture only a promise exists, so it can be canceled and no payment ever appears; after capture the money has moved, so sending it back is a second payment with its own funding and failure; and the dispute right belongs to the cardholder through the issuer, under Visa's four categories of conditions (rules edition of 24 October 2026), where monitoring programs count every dispute whatever its outcome. The two providers model the dispute differently (both n.d., accessed November 2026): Stripe gives it one Dispute object, debits the amount and a published fee when it is created and returns the amount only on a win; Adyen reports a series of events against the payment, in which a defended chargeback can be credited back provisionally and taken again by a second chargeback, and adds a reversal call for a payment whose capture state is unknown. Adyen's dispute fee is set by contract (the one amount on its site is CAD 24.00, in Adyen Canada's fee disclosure), and Mastercard's rules are known here only as the two providers report them.\n\n**Supporting claims**\n\n- **S1** — The three backward routes differ by who starts them and by where the payment is on its timeline: a cancel or reversal (the merchant, before capture) withdraws a promise, a refund (the merchant, after capture) is a new transaction, and a dispute (the cardholder, through the issuer, after the money has moved) is a claim the merchant did not start and does not decide.\n- **S2** — A refund is a second payment with its own funding, its own asynchronous outcome and its own failures; it is not the original payment run in reverse, and the original fees generally stay paid.\n- **S3** — A card dispute is ruled on by the issuer under the network's rules and on the issuer's clock (120 days from processing for most Visa conditions, longer where the service is delivered later); the money is taken before the claim is judged, and the merchant answers once, against a deadline of days, with evidence that must already exist.\n- **S4** — What surrounds a dispute does not follow its outcome: fraud reports and disputes count in the networks' monitoring ratios whoever wins, and outside cards the payer's right to take money back ranges from none to unconditional, by payment method.\n- **S5** — A payment's record therefore has to stay open in its financial effect for months, with backward flows held as records of their own (states, both references, ledger entries, deadlines), and what those records must hold differs by provider: Stripe gives one Dispute object with one debit and at most one return, Adyen a series of events in which a credit can be provisional.\n\n## Role in the part\n\nShows that the chain of promises has no final link: after authorization, settlement and payout the payment can still be withdrawn, which is what 'no single message makes it final' means in J1. Supports P1-4 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in three-routes, refund-second-payment, dispute-lifecycle: the routes in the order they become possible on the payment's timeline; `comparison` in outside-cards, designs, where-they-differ; `problem_solution` in scene opens the problem; designs answers it; when-it-goes-wrong shows the answer missing)\n\nThe reader meets a chargeback on a payment recorded as paid before any term is defined, so the vocabulary arrives as the answer to a question already asked. The three routes are separated first because every later section is about one of them; the refund comes before the dispute because it is the simpler mechanism and because the dispute section needs the reader to know what a refund is when the two collide. The programs and the non-card methods follow the dispute because both are defined against it. Only then can the two design decisions be stated, since their options are the states and costs the earlier sections established, and the provider comparison follows the designs because its rows are the facts the record model needs. The worked dispute comes after the comparison so that it can be read on both providers, and the failures close the body because each is a missing piece of the design. Starting with definitions would lose the engineer who thinks a refund is an undo; putting the provider table before the lifecycle would present rows the reader cannot yet read.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): On Thursday 11 March 2027 Studio Noord has the money for Mila's €120 class pass in its bank account: approved, captured, settled, paid out. Her bank can still take the €120 back until at least July, and neither the studio, Larkfield nor Adyen decides whether it does. In what sense was the payment ever finished?\n\n**Bridge:** An engineer's model of undo: a status goes from paid to refunded, by the same parties and along the same path as the payment, and a transaction that has been committed and paid out is done. → In card payments money goes back by three different routes with three different owners, and the one the merchant does not start can arrive months after payout; the chapter asks who decides each and what a system has to keep open for it.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraphs p02 and p03): Money goes back by three routes that are not one undo: the merchant cancels a promise before any money has moved (a reversal), the merchant starts a new transaction that can fail (a refund), or the cardholder's bank takes the money back under the network's rules (a dispute), which it may do for about 120 days and sometimes far longer, whatever has been settled and paid out.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from the €120 chargeback that reached Larkfield three weeks after a sale it had recorded as paid. *Kept in:* scene.\n- Tell the three routes apart: cancel or reversal, refund and dispute, by who starts each and when. *Kept in:* three-routes.\n- Show why a refund is a second payment that can wait, fail or collide with a dispute. *Kept in:* refund-second-payment.\n- Follow a card dispute through its stages: who decides, on which clock, with which reasons, and what the merchant may submit. *Kept in:* dispute-lifecycle.\n- Explain what happens before and above a dispute (fraud reports, rapid resolution, monitoring programs) and how the payer's rights differ outside cards. *Kept in:* before-and-above, outside-cards.\n- Compare the ways to record a backward flow and to answer one, and what each costs. *Kept in:* designs.\n- Set Stripe's and Adyen's documented handling of a dispute side by side, then run the €120 dispute through both. *Kept in:* where-they-differ, in-practice.\n- List the ways backward flows go wrong and how each is detected and repaired. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Studio Noord has been paid for Mila's €120 pass, and her bank can still take the money back for months without the studio, Larkfield or Adyen deciding whether it does. | scenario: Mila's class pass: bought 9 March 2027, payout 11 March 2027; 120 calendar days from 9 March is 7 July 2027.; fact: Visa dispute time limit for most conditions: '120 calendar days from the Transaction Processing Date'. |  |\n| p02 | claim | Money goes back by three routes that are not variations of one undo: a cancel or reversal withdraws the issuer's promise, a refund is a new transaction the merchant starts, and a dispute is the issuer taking the money back under the network's rules. |  | `problem_solution`: The paid-out payment that can still be undone. → The three routes by which it can be undone, and who owns each. |\n| p03 | cause_effect | Because the dispute right runs on the issuer's own clock, regardless of settlement and payout, the merchant's record of a payment has to stay open for months and the evidence for a dispute has to exist before anyone asks for it. |  | `cause_effect`: The dispute as the route the merchant does not start. → What that does to the merchant's records: an open financial effect and evidence captured at the sale. |\n| p04 | context | On the journey of Mila's class pass this chapter covers everything after the payout of 11 March 2027: the days and months in which the €120 can travel back. |  | `place`: The chapter's subject. → Its position on the recurring payment's journey. |\n| p05 | transition | The chapter starts with a €120 chargeback at Larkfield, separates the three routes back, shows why a refund is a second payment, follows a card dispute through its stages, covers what happens before and above a dispute and outside cards, compares how to record and answer backward flows, sets Stripe and Adyen side by side, works the €120 dispute through with dates, and ends with what goes wrong. |  | `sequence`: The chapter's place in the journey. → The order in which the argument is made. |\n\n## Sections\n\n### Setting the Scene at Larkfield: A €120 Payment Comes Back\n\n**Controlling idea** (`example`, id `scene`): A chargeback reached Larkfield three weeks after a sale it had recorded as paid, nobody at Larkfield had started it, and the first questions were who decided, what Larkfield may do and by when.\n\n**Advances the thesis** (S1, S3): Shows the route the merchant does not start arriving after payout, before the vocabulary is defined.\n\n**Transition in:** `example`: The introduction's claim that a paid-out payment can still be taken back. → One payment at Larkfield where that happened.\n\n**Order of paragraphs** (`chronological`): The sale, the notification, the questions it raised, then the evidence that it was not a one-off: the reader meets the problem in the order Larkfield did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | On 24 February 2027 a chargeback arrived for a €120 pass that Bram de Wit bought at Studio Noord on 2 February, which the studio had long been paid for and which Larkfield's payment record store showed as paid. | scenario: The €120 dispute: Dutch Mastercard credit card, bought 2 February 2027, disputed as 'not recognized', chargeback on 24 February 2027 with a €15.00 dispute fee (illustrative). |  |\n| p07 | context | Nobody at Larkfield had started this, so the first questions were who had decided it, whether Larkfield or the studio could answer, by when, and where the €120 and the €15 belonged in the books. | scenario: Jonas Weber (risk and compliance) owns disputes; Priya Raman (finance) owns the close; Aylin Demir (support) hears from the studio owner, Ines Bakker. Under Larkfield's terms the studio carries a lost dispute and its fee. | `cause_effect`: The chargeback on a payment recorded as paid. → The questions it forces: who decided, what may be done, by when, and how it is booked. |\n| p08 | evidence | Bram's dispute was not an exception: backward flows that had no records of their own were most of the Unexplained €0.4 Million. | statistic: Year-end 2025: €412,000 difference, of which refunds after payout €317,200 and chargeback fees €73,500 (4,900 disputes at the illustrative €15.00). | `additional_support`: One dispute and its questions. → The scale of the same gap across a year. |\n\n### Three Routes Back, Three Different Owners\n\n**Controlling idea** (`definition`, id `three-routes`): Which route applies is decided by where the payment is on its timeline and by who starts it, and the three routes have different owners.\n\n**Advances the thesis** (S1): Defines cancel or reversal, refund and dispute as three things with three owners, which is the thesis's first claim.\n\n**Transition in:** `elaboration`: The words 'refund', 'chargeback' and 'dispute', used in the scene without definition. → Their definitions, and the route that comes before both.\n\n**Order of paragraphs** (`chronological`): The routes are defined in the order they become possible on the payment's timeline: before capture, after capture, after the cardholder complains. Defining the dispute first would leave the reader without the refund it is so often confused with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | claim | The route money takes back depends on two things, how far the payment has travelled and who starts the return, and that gives three routes with three owners. | table: Route / who starts it / when it is possible / what happens to the money / who decides / what the cardholder sees: cancel or reversal, refund, dispute. |  |\n| p10 | definition | A cancel or reversal withdraws an authorization before capture, so no money moves and no payment appears on the cardholder's statement. | quotation: Visa glossary: an Authorization Reversal is 'A V.I.P. System message that cancels an Approval Response.'; fact: Stripe: cancel a payment 'before it's completed at no cost'. Adyen: 'After a payment has been captured, you can no longer cancel it.' | `sequence`: The first row of the table. → The route that exists only while the payment is still a promise. |\n| p11 | definition | A refund is a new transaction, started by the merchant after capture, that credits the cardholder with money the merchant's side has to supply. | quotation: Visa glossary: a Credit Transaction is 'A Transaction or a Faster Refund, representing a Merchant's refund or price adjustment credited to a Cardholder's account.' Adyen: 'You can only refund a payment after it has been captured.' | `contrast`: A route that withdraws a promise. → A route that sends money, because the promise has already been kept. |\n| p12 | definition | A dispute is a transaction the cardholder's issuer returns to the acquirer, the chargeback is the money taken back with it, and the merchant neither starts it nor rules on it. | quotation: Visa glossary: a Dispute is 'A Transaction that an Issuer returns to an Acquirer.' Stripe: the outcome 'is at the sole discretion of the account owner's bank'.; figure: Figure: one payment's timeline (authorization, capture, settlement, payout, day 120) with the three routes drawn back from the points where each becomes possible. | `contrast`: The two routes the merchant starts. → The route the cardholder starts through the issuer. |\n\n### A Refund Is a Second Payment, and It Can Fail\n\n**Controlling idea** (`process`, id `refund-second-payment`): A refund has its own funding, its own asynchronous outcome, its own cost and its own failures, and it can collide with a dispute on the same payment.\n\n**Advances the thesis** (S2): Takes the refund apart into funding, outcome, cost and collision, each documented by both providers, to show it is not the original payment in reverse.\n\n**Transition in:** `elaboration`: The refund, defined as a new transaction. → What being a new transaction means in practice: funding, outcome, cost and failure.\n\n**Order of paragraphs** (`grouping`): Four properties that make a refund a payment of its own are grouped first (where its money comes from, how its outcome arrives, what it costs, and how it borders on the reversal when the state of the original is unknown), and the collision with a dispute comes last because it needs the reader to know that a refund can stay pending for days. Putting the collision earlier would describe two flows in flight before the reader knows a refund can be in flight at all.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | explanation | A refund is paid from the merchant's current balance at the provider, not from the original payment, so it can wait or fail when that balance is short. | quotation: Stripe: 'Refunds use your available Stripe balance (not including pending amounts)'; if it does not cover the refund, 'Stripe holds the refund as pending for card transactions (refunds for other payment method types fail)', and after 45 days it fails with `insufficient_funds`.; fact: Adyen lists the refund failure reason 'Insufficient in-process funds on account': 'There is not enough balance on your merchant account to process the refund.' |  |\n| p14 | process | A refund's outcome arrives in two stages, the provider accepting the request and the scheme and issuer processing it, and the second can fail days after the first succeeded. | quotation: Adyen: 'The refund process is asynchronous'; a REFUND webhook with success true means 'we sent the refund request to the card scheme', but 'in rare cases the refund can be rejected by the card scheme, or reversed', which 'can happen even a few days after you submit the refund request' (REFUND_FAILED, REFUNDED_REVERSED).; fact: Stripe: a Refund object has status pending, requires_action, succeeded, failed or canceled; 'A refund can fail if the customer's bank or card issuer can't process it', and the money returns to the balance in a process that 'can take up to 30 days'.; table: What the API answers at once / what is true later / can it fail after 'success', for cancel, refund and dispute. | `sequence`: Where the refund's money comes from. → How and when the merchant learns whether it arrived. |\n| p15 | evidence | A refund does not undo the cost of the original payment: the provider's fees for the sale are not returned, and a refund can carry a fee of its own. | quotation: Stripe: 'Stripe's processing fees from the original transaction aren't returned.' Adyen's public price list has a 'Payment method refund fee' column. | `additional_support`: The two-stage outcome. → What the refund costs the merchant. |\n| p15b | evidence | The customer may wait days or weeks to see a refund after the request was accepted. | fact: Adyen: 'It can take up to 40 business days before the funds are returned to the shopper's account, depending on the payment method.' Stripe's page says a customer 'sees the refund as a credit approximately 5-10 business days later, depending upon the bank'. | `additional_support`: What the refund costs the merchant. → What it costs the customer: the wait. |\n| p16 | comparison | When a payment is very recent or its capture state is unknown, the two providers offer different tools: Stripe may process an early refund as a reversal, and Adyen has a separate reversal request that cancels or refunds according to the payment's state. | quotation: Stripe: 'Some refunds—those issued shortly after the original charge—appear in the form of a reversal instead of a refund. In the case of a reversal, the original charge drops off the customer's statement'.; quotation: Adyen: 'If you are not sure if a payment has been captured, you can use a reversal to return the funds to the shopper'; it cancels an uncaptured payment and refunds a captured one. A cancel by the merchant's own reference is possible 'up to 24 hours after authorization'. | `contrast`: The ordinary refund of a captured payment. → The case where the merchant does not know whether there is anything to refund. |\n| p17 | cause_effect | Because a refund and a dispute are started by different parties, both can be in flight for the same payment, and the customer can be reimbursed twice unless something stops one of them. | quotation: Stripe: 'You can't issue a refund outside the dispute process while the dispute is open', and a pending refund can fail with `charge_for_pending_refund_disputed`.; fact: Adyen says such disputes 'can be auto-defended if more than 90 percent of the captured transaction amount was refunded'. Visa: 'Effective for Disputes processed on or after 24 April 2027 Before initiating a Dispute, the Issuer must validate and reconcile all credits and debits processed by the same Merchant' and dispute only the net amount. | `cause_effect`: Refunds that stay pending for days. → What happens when the cardholder goes to the bank in the meantime. |\n\n### How a Card Dispute Runs: The Issuer Decides, on the Issuer's Clock\n\n**Controlling idea** (`process`, id `dispute-lifecycle`): A card dispute is ruled on by the issuer under the network's rules, within time limits that start from the transaction or the expected delivery and not from payout, and the merchant answers once against a deadline of days.\n\n**Advances the thesis** (S3): Establishes who decides, how long the right lasts, what reasons exist, which stages follow and how little the merchant may do, from the dated Visa rulebook and both providers' documentation.\n\n**Transition in:** `contrast`: The routes the merchant starts and controls. → The route it does not start, taken step by step.\n\n**Order of paragraphs** (`prerequisite_order`): Who decides comes first because every later rule is that party's; the clock next because it explains 'months later'; the reasons before the stages because the stages differ by reason family; the merchant's single answer and its evidence after the stages they belong to; friendly fraud last because it needs the reader to know that fraud is a reason and that the issuer accepts the cardholder's word.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | In a dispute the issuer rules, the network's rules say on what grounds and in what order, the network itself decides only if the case reaches arbitration, and the provider relays. | quotation: Visa glossary: Arbitration is 'A process where Visa determines financial liability between Members for Interchange Transactions that are presented and have completed the Dispute cycle.' Stripe: 'Stripe facilitates your case, but doesn't have influence over the outcome'. |  |\n| p19 | evidence | The issuer's time limit counts from the transaction, or from the date the cardholder expected the service, and can therefore run long past payout. | fact: Visa time limits: '120 calendar days from the Transaction Processing Date' (for example condition 10.4); 75 calendar days for the authorization conditions; for 13.1 Merchandise/Services Not Received also '120 calendar days from the last date that the Cardholder expected to receive the merchandise or services', 'Not to exceed 540 calendar days from the Transaction Processing Date'.; fact: Adyen documents 120 calendar days for Visa and Mastercard and 'In some cases for Visa and Mastercard ... a maximum of 540 calendar days'.; figure: Figure: a calendar strip for one payment with payout at day 2 and the dispute window still open to day 120, the paid-out amount drawn as held on a long string. | `elaboration`: The issuer as the party that rules. → How long the issuer has to start. |\n| p20 | definition | Dispute reasons fall into four families (fraud, authorization, processing errors and consumer disputes), and the family decides what evidence could answer the claim. | table: Family / Visa category and example conditions / Mastercard code as Adyen lists it / what the cardholder is saying: 10 Fraud (10.4 Other Fraud – Card-Absent Environment; 4837 No Cardholder Authorization), 11 Authorization (11.3 No Authorization/Late Presentment), 12 Processing Errors (12.6 Duplicate Processing/Paid by Other Means), 13 Consumer Disputes (13.1 Merchandise/Services Not Received, 13.2 Cancelled Recurring Transaction, 13.6 Credit Not Processed; 4853 Cardholder Dispute). | `sequence`: The time the issuer has. → The grounds on which it may act. |\n| p21 | process | After the dispute the steps depend on the family: in consumer and processing disputes the merchant's side answers with a dispute response (the representment) and the issuer must escalate, while in fraud and authorization disputes the merchant's answer is itself the pre-arbitration attempt. | fact: Visa Tables 11-2 and 11-3: categories 10 and 11 run dispute, pre-arbitration attempt by the acquirer (30 calendar days), pre-arbitration response, arbitration; categories 12 and 13 run dispute, dispute response by the acquirer, pre-arbitration by the issuer, arbitration. Adyen names the two flows Allocation and Collaboration.; fact: Adyen's rendering of Mastercard: notification of chargeback, chargeback, information supplied, chargeback reversed, pre-arbitration, second chargeback, scheme arbitration. Stripe: the inquiry ('retrieval') phase is one that 'Mastercard and Visa no longer use'.; figure: Figure: the dispute as a flow from the cardholder's complaint through issuer, network, acquirer or provider to the merchant, with the single response, the issuer's ruling, pre-arbitration and arbitration. | `sequence`: The reason families. → The stages a dispute passes through, which differ by family. |\n| p22 | evidence | The merchant's evidence is submitted once, and the deadline for it is a matter of days set by the provider inside the network's limit. | quotation: Stripe: 'You've only one opportunity to submit your response'; time to respond is 'usually 7-21 days, depending on the card network'; the Dispute object carries `evidence_details.due_by`.; fact: Adyen: response to a Visa chargeback within 18 days, or 9 days for payments processed locally in the United States and Canada from 21 July 2025; Mastercard: 'You must provide your defense documents within 40 days. There is no opportunity later in the process to provide information or to update information you provided.' | `elaboration`: The dispute response as one stage. → How many times and by when the merchant may make it. |\n| p23 | analysis | A single submission with a deadline of days means the evidence must already exist when the dispute arrives, which makes it a by-product of the sale and not of the dispute. | quotation: Visa glossary: Compelling Evidence is information provided 'in a Dispute Response or pre-Arbitration that attempts to prove that the Cardholder participated in the Transaction, received goods or services, or otherwise benefited from the Transaction'. Stripe, for Visa 10.4: 'Stripe automatically evaluates your transaction history to determine eligibility with Visa Compelling Evidence 3.0.' | `cause_effect`: One submission, days to make it. → Where the evidence has to come from. |\n| p24 | definition | Friendly fraud is a dispute by the genuine cardholder, and it arrives with the same reason code as a dispute over a stolen card. | quotation: Stripe: 'Friendly fraud—also known as \"first-party misuse\" or \"first-party fraud\"—occurs when a legitimate cardholder makes a purchase, but then disputes it at a later date. This can either be accidental, because they didn't recognize the transaction on their statement, or deliberate'. | `example`: Evidence that the cardholder took part. → The kind of dispute that evidence exists to answer. |\n\n### Before the Dispute and Above It: Fraud Reports, Rapid Resolution and Monitoring Programs\n\n**Controlling idea** (`explanation`, id `before-and-above`): Around the dispute sit two things that do not follow its outcome: signals and services that act before it exists, and network programs that count it whoever wins.\n\n**Advances the thesis** (S4): Shows that the merchant's exposure is measured in counts of fraud reports and disputes, not in disputes lost, so winning is not the measure.\n\n**Transition in:** `additional_support`: The dispute itself, from start to arbitration. → What happens before it exists and what is counted above it.\n\n**Order of paragraphs** (`chronological`): Fraud report, then pre-dispute resolution, then the monthly count: the order in which they happen to one payment. The conclusion that the count ignores outcomes comes last because it depends on knowing what is counted.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | definition | A fraud report is a message from the issuer that a cardholder reported fraud; it is not a dispute and moves no money, but it often precedes one and a refund does not erase it. | quotation: Adyen, Notification of Fraud: 'This is not a dispute, and no money is withdrawn from your account.' Stripe: early fraud warnings 'include Visa TC40 reports and Mastercard's System to Avoid Fraud Effectively (SAFE) reports'; 'about 40% of Visa and Mastercard EFWs become fraud disputes'; 'Proactively refunding a flagged payment doesn't affect the fraud warning.' |  |\n| p26 | process | Pre-dispute resolution lets a merchant set rules under which a complaint is refunded automatically before it becomes a dispute, in exchange for the amount and a fee. | quotation: Visa glossary: Rapid Dispute Resolution is 'A pre-dispute resolution service that provides the ability for Merchants and Payment Facilitators to automate the acceptance of liability for a disputed Transaction.' Adyen: 'When a dispute is rapidly resolved, it is resolved through a refund and does not become a chargeback.'; fact: Stripe: 'Stripe integrates directly with Verifi and Ethoca'; 'Resolved disputes don't count towards your dispute rate and don't incur a dispute received fee'; Netherlands price list: '€20.00 per Visa resolution', '€40.00 per Mastercard resolution'. | `sequence`: The fraud report as an early signal. → A service that acts on the cardholder's complaint before it is a dispute. |\n| p27 | definition | A dispute monitoring program is a network scheme that counts a merchant's fraud reports and disputes against its sales each month and fines or restricts those above a threshold. | quotation: Visa fact sheet (2025): 'VAMP Ratio = Count of [Fraud (TC40) + Disputes (TC15)] ÷ Count of Settled Transactions (TC05)' on card-not-present transactions; acquirer 'Above Standard if its VAMP ratio is ≥50bps and ... Excessive if ≥70bps'; Excessive Merchant at ≥220 bps with a monthly count ≥1,500, 'reduced to >=150bps in AP, Canada, EU, and U.S. regions on 1 April 2026'.; table: Program / what is counted / threshold as of November 2026 / source: Visa VAMP merchant, Visa VAMP acquirer, Mastercard Excessive Chargeback Merchant (100–299 chargebacks and 1.5–2.99%, as Stripe and Adyen report it). | `sequence`: What happens to one complaint before it is a dispute. → What the network does with all of a merchant's disputes together. |\n| p28 | analysis | The programs count a dispute when it is received and do not look at refunds or outcomes, so winning disputes does not lower the ratio; only fewer disputes and pre-dispute resolution do. | quotation: Stripe: 'Monitoring programs don't consider refunds when identifying disputes' and 'don't consider dispute outcomes'; 'The same fraudulent transaction might appear in both the TC40 and TC15 reports. Any transaction that appears in both reports will be counted twice for the VAMP count.' Visa fact sheet: the ratio 'Excludes disputes resolved through pre-dispute solutions'. | `cause_effect`: The ratio and its thresholds. → What does and does not move it. |\n\n### Outside Cards: From No Right to Take It Back to an Unconditional One\n\n**Controlling idea** (`comparison`, id `outside-cards`): The payer's right to take money back is a property of the payment method, and outside cards it runs from none to unconditional.\n\n**Advances the thesis** (S4): Shows that the card dispute is one point on a range, so a design that assumes it for every method is wrong in both directions.\n\n**Transition in:** `contrast`: The card dispute and the programs built on it. → Payment methods where the payer's right is stronger, weaker or judged by someone else.\n\n**Order of paragraphs** (`order_of_importance`): The range first, then the strongest payer right (direct debit, where Larkfield has 21% of online volume), then the methods with none or with their own judge, then the vocabulary trap that only makes sense once both ends are known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | claim | Whether and for how long a payer can take money back is set by the payment method's own rules or by law, and neither provider can change it. | table: Method / payer's right / window / can the merchant contest: card (dispute under network rules, 120 days and more, one response); SEPA Direct Debit (unconditional refund 8 weeks; unauthorized 13 months; no); iDEAL (none); PayPal and Klarna (the method's provider decides; typically up to 180 days as Stripe documents). |  |\n| p30 | evidence | A SEPA Direct Debit can be taken back without a reason for eight weeks and as unauthorized for thirteen months, and the merchant cannot contest it on either provider. | quotation: PSD2 Article 77: the payer can request the refund 'for a period of 8 weeks from the date on which the funds were debited'; Article 71: notification 'no later than 13 months after the debit date'.; quotation: Stripe: 'You can't submit evidence or counter a SEPA Direct Debit dispute through Stripe'; such disputes 'are final and can't be appealed'. Adyen: 'You cannot defend SEPA chargebacks. These will always result in the shopper receiving a refund.' | `example`: The range of payer rights. → Its strongest case, the direct debit. |\n| p31 | evidence | At the other end an iDEAL payment cannot be disputed through the payer's bank at all, and for PayPal and Klarna the judge is the method's own provider, not a card issuer. | quotation: Stripe: 'Customers can't dispute iDEAL \\| Wero payments with their bank'; for local payment methods 'The LPM provider, such as Klarna or PayPal, decides the dispute instead of a card issuer', with 'up to 180 days to file a dispute'. | `contrast`: A method where the payer's right is unconditional. → Methods where there is none, or where someone other than a bank rules. |\n| p32 | analysis | The two providers use different words for the same non-card events, so an integrator who maps both to 'dispute' will count things that are not disputes. | fact: Adyen calls a SEPA return a chargeback and lists among its causes 'There were insufficient funds in the shopper's bank account'; Stripe calls a payer's SEPA return a dispute. | `cause_effect`: Rights that differ by method. → What that does to a cross-provider data model. |\n\n### Two Design Decisions: How to Record a Backward Flow and How to Answer One\n\n**Controlling idea** (`comparison`, id `designs`): An integrator makes two decisions about backward flows: whether they are flags on the payment or records of their own, and which of four answers to give a claim, each with a different cost.\n\n**Advances the thesis** (S5): Turns the mechanism into the design consequence the thesis states: backward flows need their own states and ledger entries, and the answer to a claim is a costed choice.\n\n**Transition in:** `cause_effect`: Three routes, their owners, their clocks and the counts above them. → What a merchant's system has to hold and decide because of them.\n\n**Order of paragraphs** (`problem_solution`): The flag and what it loses, then the record model that fixes it; then the four answers and the trade-off between them, ending in the author's rule. The record model comes first because the four answers are states of those records.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison | A flag or a status on the payment cannot represent a backward flow, because a backward flow has an amount, a time, a state and an outcome of its own and there can be several per payment. | fact: Stripe: the disputed amount 'might be lower or higher than the amount of the original charge' (currency conversion, partial disputes, several recurring charges disputed as one), and 'In extremely rare cases, you might receive more than one dispute per payment.' Adyen: multiple partial refunds up to the captured amount.; scenario: Larkfield's five-state vocabulary ends in `refunded` and `disputed`; until Keel, refunds after payout and chargeback fees had no ledger entries of their own. |  |\n| p34 | recommendation | I would hold each refund and each dispute as a record of its own, linked to the payment by both providers' references, with its own states, its own deadline and a ledger entry for every movement of money. | scenario: Keel decision K3: fees, splits, refunds, disputes, payouts and returns are ledger entries; the 'to recover from studio' clearing account must return to zero.; fact: Adyen webhooks for a modification carry `originalReference` (the payment) and `pspReference` (the modification); a Stripe Dispute carries the `charge` it belongs to and its `balance_transactions`. | `problem_solution`: What a flag loses. → The record model that keeps it. |\n| p35 | comparison | A merchant can answer a customer's claim in four ways (refund before it reaches the bank, resolve it automatically before it becomes a dispute, accept the dispute, or contest it), and they differ in fee, in effort and in whether the claim counts in the monitoring ratio. | table: Answer / what it costs beyond the amount / counts in the monitoring ratio? / effort / when it is right: refund first; pre-dispute resolution (per-resolution fee; excluded from the Visa ratio); accept (dispute fee; counts); contest (dispute fee, on Stripe a countered fee returned on a win; counts whatever the outcome; one evidence package). | `sequence`: The records that hold a backward flow. → The decisions those records move through. |\n| p36 | recommendation | My rule is to decide by amount against fee, by whether the evidence already exists and by how far the account is from a monitoring threshold, and to make that decision once as policy, not case by case under a deadline. | quotation: Stripe on early fraud warnings: 'It's likely not worthwhile to refund EFWs on charges more than 35 percent higher than your dispute fee.' | `conclusion_summary`: Four answers and their costs. → The author's rule for choosing among them. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): Stripe represents a dispute as one object with one debit and at most one return, while Adyen reports a series of events in which a credit can be provisional, and the two differ in when the money leaves, where the deadline is read and what is public about the fee.\n\n**Advances the thesis** (S5): Sets the two documented models side by side, the part of the thesis that says what the integrator's records must hold on each provider.\n\n**Transition in:** `example`: The record model and the four answers, stated for any provider. → How each of the two providers supplies the facts those records need.\n\n**Order of paragraphs** (`comparison`): The table first, on the same aspects for both providers, then what an integrator does differently; the advice is unreadable without the rows it summarizes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | comparison | On seven aspects of a backward flow the two providers document different shapes, timings and prices. | table: Aspect / Stripe / Adyen / what the difference suggests: shape of a dispute (Dispute object with a status; series of webhook events against the payment plus action endpoints); when the money leaves (at creation, amount plus fee; 'a few days after you receive the NoC, or after you defend'); when it returns (only on a win; on CHARGEBACK_REVERSED, provisionally, and not immediately for Visa Allocation); where the deadline is read (`evidence_details.due_by`; published table, 18 or 9 days Visa, 40 Mastercard); dispute fee (€20.00 received, €20.00 countered, NL list; a chargeback processing fee, amount not public); unknown capture state (no separate request; reversal request, cancel by merchant reference for 24 hours); after the 'final' state (late win from lost to won; second chargeback after a reversed one).; figure: Figure: the same lost-then-won dispute as two balance lines, Provider A with one step down at the start and one step up at the end, Provider B with a step down, a provisional step up and a possible second step down. |  |\n| p38 | recommendation | On Stripe an integrator mirrors one object and must allow a lost dispute to reopen; on Adyen it must assemble the dispute from events and treat a returned amount as provisional until the last event. |  | `cause_effect`: The seven differences. → What an integrator does differently on each provider. |\n\n### In Practice at Larkfield: Bram's €120, Day by Day\n\n**Controlling idea** (`example`, id `in-practice`): Run with dates, the €120 dispute shows the money leaving before anyone has judged the claim, one answer due within weeks, an outcome that stays provisional, and a record that has to stay open into June.\n\n**Advances the thesis** (S3, S5): Applies the lifecycle and the provider differences to the ledger's dispute, with the dates and amounts that make 'months later' concrete.\n\n**Transition in:** `example`: The two providers' documented models. → One dispute run through them with Larkfield's dates and amounts.\n\n**Order of paragraphs** (`chronological`): The events in date order on Adyen, then the evidence Larkfield answers with, then the same dispute on Stripe, then how long the record and the exposure stay open. The Stripe comparison follows the Adyen run because it is told as differences from it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | process | On Adyen the dispute reaches Larkfield as a sequence of events over weeks, and the €120 and the fee leave the studio's balance before the claim has been judged. | table: Date / event / money / what Larkfield records: 2 Feb 2027 sale €120.00; 24 Feb notification of chargeback (defense period starts); chargeback booked, €120.00 and €15.00 (illustrative) debited; defense submitted once; chargeback reversed, €120.00 back provisionally; then either the issuer accepts or a second chargeback takes it again.; fact: Adyen for Platforms: by default 'Adyen withdraws the disputed funds from your platform's liable balance account'; `platformChargebackLogic` can book it to one balance account or by the split ratio. |  |\n| p40 | analysis | Larkfield can answer because the booking app already holds the evidence that Bram used the pass, and it gets exactly one submission to send it. | scenario: Bram's account shows the purchase from a logged-in session and check-ins to classes at Studio Noord with the pass after 2 February 2027 (local detail; the check-in records are Larkfield's own).; fact: Adyen, Mastercard: defense documents within 40 days of the notification; 'There is no opportunity later in the process to provide information or to update information you provided.' | `cause_effect`: The notification and the debit. → What Larkfield can do about it and how often. |\n| p41 | comparison | Had Studio Noord been on Stripe, the same dispute would be one Dispute object, the amount and a received fee would leave at creation, and nothing would come back unless the dispute was won. | fact: Stripe: 'Debits the disputed amount, plus a dispute fee, from your Stripe account'; 'These funds are held for the entire duration of the dispute'; Netherlands list fees €20.00 received and €20.00 countered, the latter returned on a win. On Connect the balance debited depends on the charge type: the connected account's for direct charges, the platform's otherwise. | `contrast`: The dispute on Adyen. → The same dispute on Stripe. |\n| p42 | analysis | The payment's financial effect stays open until at least 2 June 2027, and across Larkfield about €156 million of paid-out online card volume is inside the 120-day window at any time. | reasoning: 2 February 2027 plus 120 days is 2 June 2027. Online card volume is 52% of €910 million, about €473 million a year; 120/365 of that is about €156 million (the author's arithmetic on ledger figures; an amount that is still disputable, not an expected loss). | `conclusion_summary`: One dispute on two providers. → How long the record stays open, and what that adds up to across the platform. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Backward flows fail in the gap between a provider's first answer and the later truth: a movement nobody can tie to its payment, a deadline or a failure that arrives as a missed message, and a state treated as final that was not.\n\n**Advances the thesis** (S2, S5): Shows the cost of treating backward flows as flags or as finished, and the detection that the record model makes possible.\n\n**Transition in:** `contrast`: The dispute handled as designed. → The same flows when a link, a message or a state is missing.\n\n**Order of paragraphs** (`order_of_importance`): The overview table first, then the three failures in the order of what they cost Larkfield: the untraceable movement (an audit finding), the missed message (a dispute lost by default, a customer never refunded), the state closed too early (a ledger that is wrong again).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | claim | Each backward flow has a first answer and a later truth, and the failures happen between the two. | table: Failure / how it shows / detection / recovery: refund accepted then failed; refund and dispute on one payment; movement with no link to its payment; dispute notification missed; provisional credit treated as final; lost dispute treated as closed; unpaid direct debit counted as a dispute. |  |\n| p44 | example | A refund or a chargeback that cannot be tied to its original payment is the Orphaned Refund, and it is what Larkfield's €412,000 mostly consisted of. | statistic: Refunds after payout €317,200 and chargeback fees €73,500 of the €412,000 (year-end 2025). | `example`: The table of failures. → The one that became Larkfield's audit finding. |\n| p45 | process | A missed message turns into a dispute lost by default or a customer who never receives a refund, so open disputes and pending refunds are swept against the provider's own record instead of waiting for a webhook. | scenario: The Silent Webhook of 14 September 2026: the Stripe receiver failed for 9 hours. Keel decision K2: the webhook is the doorbell; a job sweeps everything still pending.; fact: Stripe exposes Dispute and Refund objects with status and `due_by`; Adyen reports a failed refund by REFUND_FAILED webhook and in its payment accounting report. | `sequence`: A movement that arrived and could not be placed. → A message that did not arrive at all. |\n| p46 | analysis | A favorable event is not always the last one, so a dispute record must be able to reopen after it looked closed. | quotation: Adyen, CHARGEBACK_REVERSED: 'This stage is not final and a second chargeback can be presented by the issuing bank'. Stripe: 'in rare cases the status can change from `lost` to `won`', a 'late win'. | `additional_support`: Messages that go missing. → Messages that arrive and are read as more final than they are. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The three routes, the issuer's clock, the monitoring count and the two providers' models are one fact seen from four sides: a payment's forward path ends at payout, but its financial effect does not, because the right to send money back belongs to parties and clocks the merchant does not control. What a merchant controls is whether each backward flow has a record, a deadline, evidence and a ledger entry.\n\n**So what:** A team that records backward flows as flags finds them at the year-end close; a team that records them as events with their own states can say on any day how much paid-out money is still provisional, which disputes are due this week, and which refunds have not arrived.\n\n**Callback:** The introduction's question about Mila's €120 on 11 March 2027: in what sense was the payment ever finished? The reader can now answer: it was finished as a forward payment and open as a liability until at least 7 July, and for a ten-class pass possibly longer, because the window can count from the date the service was expected.\n\n**Takeaway** (`course_of_action`): Give refunds and disputes records of their own with both references, read every deadline from the provider, capture evidence at the sale, decide the refund-resolve-accept-contest policy in advance, and keep a figure for paid-out volume still inside the dispute window. Nine questions to ask follow.\n\n**Hand-off** to [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html): `cause_effect`: The full chain in both directions: an issuer that promises and can take the money back, a network that guarantees settlement, an acquirer or provider that pays out and stands behind the merchant. → What each party charges for the promise it carries, who sets that price, and what the provider's own share leads it to build.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis (list) | Established: the three routes have different owners, the issuer rules a dispute under network rules within limits that start from the transaction, a refund is a separate transaction that can fail, and monitoring programs count disputes whatever their outcome. |  |  |\n| p48 | synthesis (list) | Depends on context: whether to refund first, resolve early, accept or contest; how long to keep a record open; and how much of the provider's dispute model to mirror. |  | `contrast`: What the field agrees on. → What changes with the situation. |\n| p49 | recommendation (list) | The author's synthesis: 'paid' is a position on a calendar and not an end state, and the exposure figure that follows from it belongs on a platform's dashboard. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labeled as such. |\n| p50 | recommendation (list) | Nine questions let the reader test how a system or a provider handles money flowing backward. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p51 | transition | With the chain complete in both directions, the next question is what each party charges for the promise it carries. |  | `cause_effect`: Issuer, network and provider, each able to send money forward or take it back. → The price of each party's promise, and what the provider's share leads it to build. |\n\n## Non-goals\n\n- The authorization reversal as a message, holds and their expiry, incremental and partial authorization. See [The First Promise: Authorization](payment-authorization.html).\n- Capture, clearing, settlement and payout mechanics. See [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html), [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- What a refund or a dispute costs in interchange, scheme fees and provider pricing. See [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- The 3-D Secure liability shift and which fraud disputes it moves to the issuer. See [Proving It Is You: 3-D Secure and Strong Customer Authentication](three-d-secure-and-sca.html).\n- Fraud scoring, card testing and how dispute labels train risk models. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- Who bears a seller's refund or lost dispute on a platform, and the mechanics of splits, transfer reversals and negative balances. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Ledger design and reconciliation jobs for backward flows. See [The Book of Record: How Payment Companies Build Ledgers](payment-ledgers.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Dispute rights and refund windows of each local payment method in detail. See [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html).\n- The full end-to-end dispute journey with every message. See [Journey 4: A Dispute, From Chargeback to Ledger](journey-dispute.html).\n- American Express, Discover, Cartes Bancaires and other networks' dispute rules beyond a mention.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Mastercard's own Chargeback Guide and Transaction Processing Rules were not readable (HTTP 403); Mastercard cycles, deadlines and Excessive Chargeback Program thresholds are reported as Stripe and Adyen render them.\n- Adyen's chargeback fee is set in the contract and non-refundable (terms, clause 8.2); the one published amount is CAD 24.00 in Adyen Canada's fee disclosure. Its refund fee amounts were not found.\n- 'Visa Claims Resolution' and its 2018 date do not appear by name in the Visa rule text; the chapter uses the rulebook's own terms and says so.\n- Ethoca alerts and Verifi's Cardholder Dispute Resolution Network could not be read from their owners' current pages; they are mentioned only through Stripe's and Adyen's documentation.\n- Adyen documents no endpoint that returns a dispute's current state on the pages read; whether one exists elsewhere was not established.\n- Whether Bram's February payment carried a 3-D Secure liability shift is not a ledger fact; the worked example assumes it did not and says so.\n\n## Decision log\n\n- **2026-11-17** — Use Visa's rulebook terms (dispute, dispute response, pre-arbitration, arbitration) as the primary vocabulary and give 'chargeback' and 'representment' as the older and still common names, because the rulebook is the only primary network source that was readable. Rejected: Organize the lifecycle around 'Visa Claims Resolution' and Mastercard's cycle names, which could not be verified in primary text.\n- **2026-11-17** — Treat designs and trade-offs as one section with two decisions (record model, answer policy), since the realistic design choices for an integrator are these two and each has a table. Rejected: Separate 'designs' and 'trade-offs' sections, which would split each decision from its comparison.\n- **2026-11-17** — Work the €120 dispute on Adyen (Studio Noord's provider in the ledger) and give the Stripe version as 'had Studio Noord been on Stripe', leaving the dispute's outcome open as two branches so the journey chapter can fix it. Rejected: Fixing a won or lost outcome here, which belongs to journey-dispute.\n- **2026-11-17** — Flow rubric (sound with notes): acted on the notes about declarations (the refund section is now declared as grouping, the provider comparison has a declared flow) and about terms (pre-arbitration and reason code are defined where first used; the last failure paragraph carries the failure instance, not the rule). Not acted on, left to the author: moving the unknown-capture-state paragraph (p16) next to the reversal definition, and merging p22 with p23 and p27 with p28; each pair holds two controlling ideas (a rule and its consequence) that the acceptance probes test separately. Rejected: Reordering after a sound verdict, which would require a new rubric run for no change in verdict class.\n- **2026-11-17** — Give platform liability one sentence and two links (consistency ruling 7). Rejected: Explaining Connect charge types and Adyen split logic here.\n\n## Sources\n\n- **Internal**\n  - _journals/payments-platform-architecture/PLAN.md — The chapter contract: question, coverage, owned terms, Larkfield thread.\n  - _journals/payments-platform-architecture/journal-spec.json — Intent, acceptance criteria, thesis, role and the neighbours' transitions, copied unchanged.\n  - _journals/payments-platform-architecture/_research/scenario-ledger.md — The €120 dispute, Mila's class pass, the Unexplained €0.4 Million and its breakdown, Keel decisions K2 and K3, volumes.\n  - _journals/payments-platform-architecture/_research/consistency-issues.md — Rulings 7, 12, 15 and 17.\n- **External**\n  - Visa Core Rules and Visa Product and Service Rules, edition of 24 October 2026, https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf — Definitions (dispute, dispute response, arbitration, authorization reversal, credit transaction, compelling evidence, rapid dispute resolution), the four categories, process tables 11-2 and 11-3, time limits, the 24 April 2027 netting rule.\n  - Visa Acquirer Monitoring Program Overview (fact sheet), Visa, 2025, https://corporate.visa.com/content/dam/VCOM/corporate/visa-perspectives/security-and-trust/documents/visa-acquirer-monitoring-program-fact-sheet-2025.pdf — The VAMP ratio, exclusions and thresholds.\n  - Stripe documentation and pricing, n.d., accessed 2026-11 (refunds, how disputes work, responding, arbitration, Dispute and Refund objects, monitoring programs, dispute prevention, SEPA Direct Debit, iDEAL, fraud types, Connect disputes, Netherlands pricing) — Stripe's refund funding and failure rules, dispute object and money movement, fees, monitoring statements, non-card dispute rules.\n  - Adyen documentation and pricing, n.d., accessed 2026-11 (refund, reversal, cancel, dispute process and flow, dispute timeframes, Visa and Mastercard chargebacks, manage disputes, Disputes API, reason codes, monitoring, SEPA Direct Debit, split chargebacks) — Adyen's modification model, dispute stages and events, deadlines, auto-defense, monitoring statements, platform chargeback logic.\n  - Directive (EU) 2015/2366 (PSD2), 25 November 2015, Articles 71, 76 and 77, http://publications.europa.eu/resource/celex/32015L2366 (evidence age: 11 years; in force) — The eight-week and thirteen-month rights for direct debits.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 89 claims checked (81 confirmed, 2 corrected, 4 hedged, 0 unsupported and removed or relabeled, 2 unreachable); the \"usually 7-21 days\" response time was attributed to Stripe's page on responding and is on its page on how disputes work, and 29 inline external links were reduced to plain text under ruling 22.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Initial outcome spec written from the PLAN contract and the cards, stripe-api, adyen-api, acquiring and platforms research briefs; every quotation re-fetched from its source on this date. Status draft.\n- **2026-11-17** — Absence audit: 3 statements of absence re-tested with a wide search (0 overturned, 1 narrowed, 2 hold; table in _research/absence-audit/04-refunds-reversals-and-disputes.md). Narrowed: Adyen's terms call the chargeback fee non-refundable and set its amount in the contract; no amount is published.\n- **2026-11-17** — Ruling 46(f) applied: Adyen's chargeback fee is contractual and 'non-refundable' (terms, clause 8.2); the one published amount is CAD 24.00 in Adyen Canada's fee disclosure. Prose, table cell and Sources note updated to match chapter 45.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen's dispute fee is stated as not public' -> 'Adyen's dispute fee is stated as set by contract, with the o').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('Adyen's dispute fee is not public, and Mastercard's' -> 'Adyen's dispute fee is set by contract (the one amount on it').\n- **2026-11-17** — Sweep of rulings 46-48: acceptance criterion 3 and thesis how_why no longer call Adyen's dispute fee 'not public': it is set by contract, with CAD 24.00 in Adyen Canada's fee disclosure (ruling 46f). Prose unchanged.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after draft check round 2 (the page's only revision). Spec repairs: p15 split into p15 (the merchant's fees are not returned) and new p15b (the customer waits), each with its own evidence; the 'paid is not final' figure moved from p36 to p19, the paragraph on the issuer's 120-day clock that it illustrates (figures renumbered: it is now Figure 2, the dispute flow Figure 3). Draft: purchase date given before 7 July in the opening; the two-stage table's dispute row and its pointer; 'defended', 'Interchange' and 'Payment Facilitators' glossed after their quotations; the Mastercard stage names 'chargeback reversed' and 'second chargeback' glossed; the pre-arbitration sentence, 'buys the count', 'my rule fails near a threshold' and 'a second dispute' reworded; three section openings pick up their declared known information. No section moved. max_words raised from 6,500 to 6,800 (4.6%) for the glosses and transitions the check asked for.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);

            if (postId) {

                sectionEl.appendChild(document.createTextNode(postId));

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');

            span.textContent = t;
