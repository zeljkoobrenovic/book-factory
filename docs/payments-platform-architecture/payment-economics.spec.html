<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What interchange, scheme fees and the acquirer's markup are, who sets each and who receives it.\n- **Know:** The legal caps: the EU Interchange Fee Regulation's 0.2% and 0.3% for consumer cards, and the US debit cap and routing rule with their status in court as of November 2026.\n- **Know:** Blended pricing and interchange-plus-plus, and which is each company's published default.\n- **Know:** What Adyen reports (net revenue, processed volume, take rate) and what Stripe does not publish.\n- **Believe:** A provider's pricing model is an architectural fact: it decides which network costs the merchant sees and what the provider has to calculate for every transaction.\n- **Believe:** Declines, late captures, refunds and disputes each have a price, paid by whoever is left holding the promise.\n- **Be able to:** Split a quoted card fee into interchange, scheme fees and markup, and say which parts are known, capped or not public.\n- **Be able to:** Compare a blended quote with a pass-through quote for a stated card mix without treating the two percentages as like for like.\n- **Be able to:** Say why a provider's reported volume, another's net revenue and a take rate cannot be ranked against each other.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a fee quote the chapter does not contain, the reader splits it into its parts and says which part the provider keeps. *Probe:* An Austrian online bookshop is offered two prices for a €50 payment with a consumer debit card: provider A charges a flat 1.4% + €0.25; provider B charges the card's interchange and the network's fees at cost, plus 0.6% + €0.10. What is the most the customer's bank can receive, what does each provider keep, and what can you not work out from the quote? | `custom` | cold_reader | major |\n| AC-2 | The reader can say who gains when a network cost falls under each pricing model. *Probe:* A card network lowers a fee it charges on every transaction. Under a flat all-in price, who gains? Under a price that passes network fees through at cost, who gains? What does that suggest about which provider has a reason to build cost-reducing features into its own systems? | `custom` | cold_reader | major |\n| AC-3 | Every price, cap, court ruling and reported figure carries its source and date; Stripe's take rate is stated as not computable from public figures and no estimate is presented as fact; the Larkfield fee stack is labeled illustrative; Stripe's and Adyen's volumes are not ranked against each other. | `custom` | rubric | blocker |\n| AC-4 | The closing of this chapter performs the part's closing: it lays the four promises and the three fees on one line, returns to the €120 dispute of the part opening, and hands off to Part II with the question of what decides the issuer's yes. | `conclusion_calls_back_to_introduction` | rubric | major |\n\n## Thesis\n\n**Question:** Where does the fee on a payment go, and how does the way a provider earns its share shape what it builds?\n\n> **Claim:** The fee on a card payment is three payments to three parties: interchange to the issuer, scheme fees to the network, and a markup to the acquirer or provider. A provider's default price either blends the three into one rate, as Stripe's published standard pricing does, or passes the first two through at cost, as Adyen's published Interchange++ pricing does, and that choice decides which network costs the merchant can see, who keeps the saving when one of them falls, and what the provider must calculate and report for every transaction. In the one case the public record documents, features follow the pricing model: Stripe offers five authorization and capture features on interchange-plus pricing.\n\n**Disputed by:** The view that pricing is a commercial term settled by procurement: the fee is what the provider charges for its service, the cheapest percentage wins, and none of it has anything to do with how the provider's systems are built.\n\n**So what:** A reader can cost a payment, including its declines, late captures, refunds and disputes, before choosing a provider, will not compare a blended rate with a pass-through markup as if they measured the same thing, and knows to ask which features and reports depend on the pricing plan before signing.\n\n**How and why:** The annual reports Visa and Mastercard published in 2026 say the networks set default interchange but do not earn it, and that the acquirer sets the merchant's price; EU Regulation 2015/751 caps consumer interchange at 0.2% for debit and 0.3% for credit and obliges acquirers to offer unblended prices. Stripe's Netherlands price list (n.d., accessed November 2026) prices a standard European Economic Area card at 1.5% + €0.25; Adyen's (same date, marked indicative) charges a fixed processing fee plus interchange and scheme fees at cost plus 0.60%, and says its pricing model tracks those costs for each transaction. Stripe's documentation labels five authorization and capture features as available on interchange-plus pricing, which ties features to the model where their network cost is passed on. Adyen reports net revenue and a take rate (16.2 basis points for the first half of 2026); Stripe publishes total volume and no revenue for the company, so its take rate cannot be computed. Scheme fee schedules, Stripe's interchange-plus markup and Adyen's negotiated markup are not public, and any reading of the pricing difference beyond these documented points is the author's inference.\n\n**Supporting claims**\n\n- **PE-1** — The fee on a card payment is three payments to three parties (interchange to the issuer, scheme fees to the network, a markup to the acquirer or provider), each set by a different party and all collected through settlement.\n- **PE-2** — The law caps only one of the three, interchange, and only for some cards: 0.2% and 0.3% for consumer cards in the EU, and a US debit cap and routing rule that a court ruling has put in doubt as of November 2026.\n- **PE-3** — A provider's default price either blends the three parts into one rate (Stripe's published standard pricing) or passes interchange and scheme fees through at cost (Adyen's published Interchange++ pricing), and that choice decides which network costs the merchant sees and who keeps the saving when one falls.\n- **PE-4** — Declines, late captures, refunds and disputes each have a price of their own, paid by whoever is left holding the promise, which is usually the merchant.\n- **PE-5** — What the two companies report cannot be ranked: Adyen publishes net revenue, processed volume and a take rate, while Stripe publishes total volume and no revenue for the company, so its take rate cannot be computed.\n- **PE-6** — The pricing model decides what the provider must calculate and report for every transaction, and in the one documented case features follow it: Stripe offers five authorization and capture features on interchange-plus pricing.\n\n## Role in the part\n\nAssigns a payment to each party and step the earlier chapters named, shows the cost of every backward and failed flow, and carries the part's closing. Supports P1-5 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to larkfield-fee-stack: the question Larkfield cannot answer about its provider cost is posed first and answered last; `comparison` in two-pricing-models and where-they-differ; `chronological` in failure-costs: the events in the order they can happen to one payment)\n\nEach section supplies what the next one needs. The three parts of the fee come before the caps, because a cap is a ceiling on one part; the caps come before the pricing models, because a blended price can only be judged once the reader knows which part inside it is bounded; the models come before the failure costs, because whether the merchant sees a penalty depends on the model; the section on what a provider must build comes straight after both, because it uses the question of who keeps a saving and the retry and capture costs; what each company reports follows, since a take rate is the provider's share added up and the reader now knows what the share is made of and which prices are not public; and the comparison table and the Larkfield split come last because every row and every amount in them was established earlier. Put the pricing models first and 'pass-through' passes on things the reader cannot name; put the Larkfield split before the caps and €0.24 is a number without a reason; put the features section before the failure costs and 'a feature that changes the network cost' has no cost to change; put the company comparison before the reporting section and its last row cites figures the reader has not met.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): When Bram de Wit's €120.00 class pass was approved on 2 February 2027, Studio Noord was credited €117.47. The other €2.53 was shared by four companies, two of which the studio has no contract with. On 24 February the €120 was taken back, and a fifth charge, €15.00, was added to the bill. Who was paid what, and for which promise?\n\n**Bridge:** An engineer sees the fee as one number on a price list or one field on a transaction record, and compares providers by that number. → The number is the sum of three payments to three parties the previous chapters introduced, and whether a provider shows the three or only the sum is a design decision with consequences for its systems and the merchant's.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p02): The fee on a card payment is three payments to three parties: interchange to the customer's bank, scheme fees to the card network and a markup to the provider. A provider either blends the three into one rate, as Stripe's published standard pricing does, or passes the first two through at cost, as Adyen's published Interchange++ pricing does, and that choice decides what the merchant can see, who keeps a saving and what the provider has to calculate for every transaction.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the question Larkfield's finance controller asks about its two providers' invoices, and return to it with the fee on Mila's €120 split to the cent. *Kept in:* scene, larkfield-fee-stack.\n- Take the fee apart into interchange, scheme fees and markup: who sets each and who receives it. *Kept in:* three-payments.\n- Say what the law caps, in the EU and the US, and what it leaves alone. *Kept in:* caps.\n- Compare the two ways a provider prices the three parts, blended and interchange-plus-plus. *Kept in:* two-pricing-models.\n- Price the declines, late captures, refunds and disputes of the earlier chapters. *Kept in:* failure-costs.\n- Show what a pricing model obliges a provider to build, and where the public record stops. *Kept in:* pricing-shapes-systems.\n- Read what Adyen and Stripe report about their own earnings, and what cannot be compared. *Kept in:* reported-numbers.\n- Set the two companies side by side. *Kept in:* where-they-differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Bram de Wit's approved €120 left Studio Noord with €117.47; the other €2.53 was Larkfield's platform fee, out of which three more companies were paid, and the chargeback three weeks later added a €15 charge instead of undoing any of it. | scenario: The €120 dispute: pass bought 2 February 2027 with a Dutch Mastercard credit card at Studio Noord (on Adyen); Larkfield's fee 1.9% + €0.25 = €2.53; chargeback 24 February with a €15.00 dispute fee (illustrative). |  |\n| p02 | claim | Beneath the platform's own fee, the fee on a card payment is three payments to three parties (interchange to the issuer, scheme fees to the network, a markup to the provider), and whether a provider blends them or passes two of them through is a design decision, not only a commercial term. |  | `problem_solution`: The question of who was paid what out of Bram's €120. → The three parts of the fee and the two ways a provider prices them. |\n| p03 | context | Mila's class pass, a different payment from Bram's for the same amount, is the one the book follows; every step of its journey has now been followed, and this chapter puts a price on each of them and on the party that carried it. | scenario: Mila's €120.00 pass of 9 March 2027: Larkfield's fee €2.53, the studio receives €117.47, illustrative provider cost €0.61. | `place`: The fee as three payments. → Where the chapter sits on the recurring payment's journey. |\n| p04 | transition | The chapter goes from Larkfield's two invoices, through the three parts of the fee, the legal caps, the two pricing models, the price of failed and backward flows, what a pricing model makes a provider build, where the public record stops and what each company reports, to the comparison of Stripe and Adyen and the fee on Mila's €120 split to the cent. |  | `sequence`: The chapter's position on the journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: Two Invoices for One Kind of Payment\n\n**Controlling idea** (`example`, id `scene`): Larkfield pays €12.6 million a year to two providers whose statements cannot be laid side by side, because one itemizes the cost of each payment and the other shows a single fee.\n\n**Advances the thesis** (PE-1, PE-3): Poses the chapter's question with the ledger's figures: what is inside the provider cost, and why one provider shows it and the other does not.\n\n**Transition in:** `example`: The claim that a fee is three payments and that providers price them in two ways. → One company that pays both kinds of price and cannot compare them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In February 2027 Larkfield's finance controller asks why €12.6 million of the €19.8 million it earned in payment fees went to its two providers, and why she cannot forecast the figure. | scenario: 2026: payments revenue €19.8M and providers' processing costs €12.6M, on €1.12 billion of volume; Priya Raman is Finance Controller, Femke de Graaf Head of Payments Engineering since January 2027. |  |\n| p06 | description | The two providers' statements have different shapes: on Adyen a payment such as the one Mila will make in March carries three cost lines that sum to €0.61, while on Stripe each payment carries one fee, so the question becomes what the three lines are and whether they are also inside the single fee. | fact: Adyen's pricing page: with Interchange++ you 'can see exactly what you’re being charged for each transaction'. Stripe's documentation defines blended pricing by contrast with IC+ as 'a flat rate for all transactions'.; scenario: The illustrative provider cost of €0.61 inside Larkfield's €2.53 fee on Mila's €120. | `cause_effect`: The controller's question about a cost she cannot forecast. → Why the two statements cannot answer it in the same way. |\n\n### Three Payments Inside One Fee: Interchange, Scheme Fees and Markup\n\n**Controlling idea** (`explanation`, id `three-payments`): What a merchant pays for a card payment is three payments to three parties, each set by a different party, and all three are collected through settlement.\n\n**Advances the thesis** (PE-1): Establishes the three parts, who sets each and who receives it, from the networks' own annual reports.\n\n**Transition in:** `elaboration`: The €0.61 whose contents Larkfield cannot see on one of its two statements. → The three parts any card fee is made of.\n\n**Order of paragraphs** (`prerequisite_order`): The whole fee and its table first, then each part in the order the money leaves the merchant's side (to the issuer, to the network, to the provider), then how all three are collected; the last paragraph needs all three definitions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | claim | The total a merchant pays, which the networks call the merchant discount rate, is the sum of three payments: interchange to the issuer, scheme fees to the network, and the acquirer's or provider's markup. | table: Table: part of the fee \\| paid to \\| set by \\| scales with \\| public? (interchange: issuer, network default or law, value and card type, default rates and caps public; scheme fees: network, network, value, message count and cross-border, schedules not public; markup: acquirer or provider, the acquirer, by contract, list prices public, negotiated ones not). |  |\n| p08 | definition | Interchange is a fee the acquirer pays the issuer on each transaction; the network sets its default level and does not earn it. | quotation: Visa: 'Generally, IRFs are paid by acquirers to issuers. We establish default IRFs that apply absent other established settlement terms.' Mastercard: 'Although we do not earn revenues from interchange, interchange rates can impact the volume of transactions we see on our payment products.' | `sequence`: The three parts named in the table. → The first and usually largest part, and who sets it. |\n| p09 | definition | Scheme fees are what the network charges issuers and acquirers for its own services; their kinds are public and their schedules are not. | quotation: Visa: 'Payments volume is the primary driver for our service revenue, and the number of processed transactions is the primary driver for our data processing revenue'; international transaction revenue is 'Earned for cross-border transaction processing and currency conversion activities'. | `contrast`: Interchange, which the network sets but does not keep. → The fees the network does keep. |\n| p10 | definition | The markup is the acquirer's or provider's own price for its service, and it alone sets the total the merchant pays. | quotation: Mastercard: 'The merchant discount rate is established by the acquirer to cover its costs of both participating in the four-party system and providing services to merchants.' | `sequence`: The two parts that leave the acquirer for the issuer and the network. → The part the acquirer or provider keeps. |\n| p11 | process | None of the three is invoiced by the party that earns it: interchange and scheme fees are taken in the network's settlement, the provider deducts or bills the total, and the exact interchange is known only once the clearing record exists. | quotation: Mastercard: 'We administer the collection and remittance of interchange fees through the settlement process.'; fact: Adyen's documentation lists 'Increased interchange fees' among the risks of capturing after an authorization has expired.; figure: Figure: one payment leaving the cardholder's bank, with three small arrows splitting off to the issuer, the network and the provider before the remainder reaches the merchant. | `time`: The three parts and their owners. → When and by whom each is actually collected. |\n\n### What the Law Caps, and What It Leaves Alone\n\n**Controlling idea** (`evidence`, id `caps`): Regulators have capped one of the three parts, interchange, and only for some cards; scheme fees, the markup and every card outside the caps are priced freely.\n\n**Advances the thesis** (PE-2): Gives the caps, their scope and their legal status with dates, so the reader knows which part of a quote is bounded by law.\n\n**Transition in:** `contrast`: Three parts, each set by a private party. → The one part that law has put a ceiling on.\n\n**Order of paragraphs** (`grouping`): The claim first, then the two jurisdictions Larkfield sells in. In the EU the cap comes first, then the cards it does not reach, shown on Stripe's public list, then the rule on how a price is presented, so that the inference about Stripe's blended prices follows the prices it is about. In the US the cap comes before the routing rule, and the status of both in court comes last because it qualifies everything before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | Only interchange is capped by law, and only for some cards, so a quote's interchange is the one part a merchant can bound without asking anyone. |  |  |\n| p13 | evidence | In the EU, Regulation 2015/751 caps interchange at 0.2% of the value for consumer debit cards and 0.3% for consumer credit cards, and exempts commercial cards and three-party schemes. | quotation: Art. 3: 'Payment service providers shall not offer or request a per transaction interchange fee of more than 0,2 % of the value of the transaction for any debit card transaction'; Art. 4: 'more than 0,3 % ... for any credit card transaction'; Art. 1(3): Chapter II does not apply to 'transactions with commercial cards' and 'transactions with payment cards issued by three party payment card schemes'. Member states may set lower domestic caps. | `example`: The claim that only interchange is capped. → The European cap and its scope. |\n| p17 | evidence | Cards outside the caps cost more and the public price lists show it: a card issued outside the European Economic Area, a commercial card or a payment that needs currency conversion each carries a higher price or a surcharge. | fact: Stripe's Netherlands list: '1.5% + €0.25 for standard European Economic Area cards', '2.8% + €0.25 for premium European Economic Area cards', '2.5% + €0.25 for UK cards', '3.15% + €0.25 for international cards', '+ 2% if currency conversion is required'.; quotation: Visa earns international transaction revenue 'for cross-border transaction processing and currency conversion activities' (quoted in the scheme-fee paragraph). | `contrast`: The consumer cards the European caps cover, and the exemptions just listed. → The cards and payments they do not. |\n| p14 | evidence | The same regulation makes an itemized price, one that is not blended into a single rate, the default an acquirer must offer, and gives the merchant a right to see the interchange on each transaction. | quotation: Art. 9: 'Each acquirer shall offer and charge its payee merchant service charges individually specified for different categories and different brands of payment cards with different interchange fee levels unless payees request the acquirer, in writing, to charge blended merchant service charges.' Art. 12: the payee is given 'the amount of any charges for the card-based payment transaction, indicating separately the merchant service charge and the amount of the interchange fee'. The paragraph glosses 'merchant service charge' as the regulation's name for the fee a merchant pays its acquirer (the merchant discount rate of the previous section).; reasoning: INFERENCE block: Stripe's blended standard pricing in the EU presumably rests on the merchant's agreement to a blended charge; Stripe does not say so on the pages read. | `additional_support`: The cap on the amount, and the prices of the cards outside it. → The rule on how the price must be presented. |\n| p15 | evidence | In the United States the cap covers debit cards of large issuers only ($0.21 plus 0.05% plus a one-cent fraud adjustment) and leaves credit cards uncapped; where it does not apply, average debit interchange is more than twice as high. | quotation: Federal Reserve: a covered issuer 'may not receive, for any electronic debit transaction, an interchange fee that exceeds $0.21 plus 0.05 percent multiplied by the value of the transaction, plus a $0.01 fraud-prevention adjustment, if eligible'.; statistic: 2024, all networks: covered transactions averaged $0.23 (0.47% of an average $48.95 ticket); exempt transactions averaged $0.51 (1.21% of $42.27). The cap applies to issuers with $10 billion or more in assets (Federal Reserve press release, 2023-10-25; evidence age 3 years). | `contrast`: The European caps, which cover debit and credit. → The American cap, which covers debit of large issuers only. |\n| p52 | evidence | A second rule in Regulation II lets a debit transaction be processed over at least two unaffiliated networks, which is what allows a provider to send it over the cheaper one. | quotation: Federal Reserve: the rule 'prohibits all issuers and networks from restricting the number of networks over which debit transactions may be processed to less than two unaffiliated networks'. | `additional_support`: The US debit cap. → The same regulation's rule on routing, which matters more to engineers. |\n| p16 | evidence | As of 17 November 2026 both the debit cap and the level of credit interchange are unsettled in the United States: an appeals court has upheld the vacating of the debit cap in a ruling that has not taken effect, and a settlement between the networks and merchants over credit interchange is approved only preliminarily. | source: Eighth Circuit, Corner Post, Inc. v. Board of Governors, decided late October 2026 (26 October per the law-firm briefing): unanimously affirmed the vacatur of the 21-cent standard; 'its decision would not become effective until issuance of the mandate' (Consumer Finance Monitor, Ballard Spahr, 2026-10-28, secondary source; ABA Banking Journal, 2026-11-03, secondary source).; quotation: Visa: 'Recent conflicting federal court decisions on the validity of Regulation II's interchange fee standard have created additional uncertainty and could result in a significantly lower interchange cap for debit transactions.' On credit: an amended settlement of 10 November 2025 received preliminary approval 'on June 9, 2026', and 'On July 15, 2026, the Injunctive Relief Class plaintiffs filed a motion for final approval'. | `time`: The US cap and routing rule as written. → Their status in court on the day this chapter was checked. |\n\n### Two Ways to Price It: Blended and Interchange-Plus-Plus\n\n**Controlling idea** (`comparison`, id `two-pricing-models`): A provider either charges one blended rate and keeps what is left after the network costs, or passes interchange and scheme fees through at cost and charges a stated markup; the choice decides what the merchant sees and who gains when a network cost falls.\n\n**Advances the thesis** (PE-3): Defines the two models, documents which is each company's published default, and reasons through who carries the variance and who keeps a saving under each.\n\n**Transition in:** `cause_effect`: Three parts, one of them capped for some cards and the other two priced freely. → The two ways a provider turns the three parts into the price it quotes.\n\n**Order of paragraphs** (`comparison`): Both definitions come before either company so that the reader judges the price lists against the models and not the other way round; the comparison table and the question of who keeps a saving need both price lists; the recommendation comes last because it depends on the trade-offs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | Blended pricing is one percentage plus a fixed amount for every payment of a kind, whatever the card behind it costs the provider, so the provider's own share is the remainder and varies from payment to payment. | reasoning: A 1.5% + €0.25 price on €120 is €2.05; with interchange of €0.24 or €0.36 inside it the remainder differs by €0.12, and the merchant sees neither figure. |  |\n| p19 | definition | Interchange-plus-plus pricing charges the interchange and the scheme fees of each payment at cost and adds a stated markup, so the provider's share is fixed and the total varies from payment to payment. | quotation: Stripe's definition of IC+: 'A pricing plan where businesses pay the variable network cost for each transaction plus the Stripe fee rather than a flat rate for all transactions.' | `contrast`: A fixed total with a variable provider share. → A fixed provider share with a variable total. |\n| p20 | evidence | Stripe's published default is blended: its Netherlands list charges 1.5% + €0.25 on a standard European card, and offers the pass-through model, which it calls IC+, only as custom pricing. | fact: Stripe NL pricing: 'No setup fees, monthly fees, or hidden fees'; '1.5% + €0.25 for standard European Economic Area cards'; the Custom column lists 'IC+ pricing', 'Volume discounts', 'Multi-product discounts', 'Country-specific rates'. | `example`: The two models in the abstract. → The model Stripe publishes as its default. |\n| p21 | evidence | Adyen's published default is interchange-plus-plus: a fixed processing fee on each transaction plus, for Visa and Mastercard, interchange and scheme fees at cost plus 0.60%, on a page that calls its prices indicative and mentions a minimum invoice. | quotation: Adyen pricing: 'For each transaction, we charge a fixed processing fee + a fee determined by the payment method'; Visa and Mastercard '$0.13 + Interchange+ + 0.60%' (the page shows the fixed fee in US dollars); 'Interchange fees are variable, our Interchange++ pricing passes these fees directly to you'; 'The fees outlined above are indicative'; 'We do have a minimum invoice depending on industry or business model'; some methods carry a fixed percentage where a card shows Interchange++.; fact: Adyen's platform documentation defines the fee type AdyenCommission as 'The transaction fee due to Adyen under blended rates'. | `contrast`: Stripe's blended default. → Adyen's pass-through default. |\n| p22 | comparison | Set side by side, the two models differ in what the merchant can see, who carries the variance in card mix, who keeps a saving, and what each party has to compute. | table: Table: question \\| blended \\| interchange-plus-plus (what the merchant sees; who carries a change in card mix; who gains when a network cost falls; who is charged a network penalty; how easy the cost is to forecast; what the provider must compute per transaction).; figure: Figure: the same payment shown as a closed box with one price tag and as an open box with three labeled parts; caption says Provider A is priced like Stripe's published default and Provider B like Adyen's. | `conclusion_summary`: The two definitions and the two published defaults. → The differences that follow from the models themselves. |\n| p23 | analysis | When a network cost falls, a blended price leaves the saving with the provider and a pass-through price hands it to the merchant, so the two models give the provider different reasons to reduce network costs. | reasoning: Under a flat price the merchant's bill does not change when interchange or a scheme fee falls, so the provider's remainder grows; under pass-through the merchant's bill falls and the provider's markup is unchanged. Labeled as reasoning from the definitions, not a documented fact about either company. | `emphasis`: The row of the table about savings. → Why that row matters more than the others. |\n| p24 | recommendation | Blended pricing suits a business that wants one predictable number and has no one to audit a fee statement; pass-through suits one with enough volume and a cheap enough card mix to gain from seeing the parts. | reasoning: Author's judgement, with the condition under which it fails: a merchant whose cards are mostly commercial or from outside the EEA can pay more under pass-through than under a blended rate without tiers. | `cause_effect`: Who carries the variance and who keeps the saving. → Which business each model fits. |\n| p53 | recommendation | Whichever model is chosen, a blended rate and a markup can be compared only after interchange and scheme fees are added to the markup, because the first is a total and the second is one of its three parts. | reasoning: From the two definitions: a blended rate is the whole fee and a markup is the provider's part of it; the comparison needs the merchant's own card mix. | `additional_support`: The choice between the two models. → The rule for comparing quotes that holds under either choice. |\n\n### What Failure Costs: Declines, Late Captures, Refunds and Disputes\n\n**Controlling idea** (`evidence`, id `failure-costs`): Each failed or backward flow of the earlier chapters has its own price, charged by the network or the provider, and it lands on whoever is left holding the promise, which is usually the merchant.\n\n**Advances the thesis** (PE-4): Attaches a documented cost to each event the previous three chapters defined, on each provider.\n\n**Transition in:** `additional_support`: The price of a payment that succeeds, under either model. → The price of the payments and steps that do not.\n\n**Order of paragraphs** (`chronological`): The events come in the order they can happen to one payment and in the order the part taught them: a declined or retried authorization, a capture after the promise expired, a refund, a dispute. The summary table closes the section, after the paragraphs that explain its terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | A payment that is declined, captured late, refunded or disputed is not free, and the pricing model decides whether the merchant sees each of those four costs as a line on a statement or never sees it. The paragraph announces the order of the four events and the summary table that closes the section. |  |  |\n| p26 | evidence | A declined attempt still costs the provider a network fee, and too many retries of a declined card bring a penalty, which both companies document by offering to block the retry. | quotation: Stripe's optimization page: 'We block payments that are unlikely to succeed before they reach the card networks, saving you unnecessary scheme fees', and 'Excessive retry prevention: Stripe blocks a payment that would have incurred network retry penalties and likely failed'. Adyen: 'Visa charges system integrity fees. These fees are related to excessive retries of failed transactions, and excessive numbers of transactions that failed due to incorrect payment details'; refusal reason 46 is 'Transaction blocked by Adyen to prevent excessive retry fees'. | `sequence`: The four events in the table. → The first: an authorization that is declined or retried. |\n| p27 | evidence | A capture sent after the issuer's promise has expired can cost more in interchange and scheme fees, and holding the promise open longer has a price too. | quotation: Adyen: capturing after an authorization has expired 'increases the risk of' 'Increased interchange fees', 'Card scheme transaction fees' and a chargeback for 'No Authorization' or 'Late Presentment'. Stripe: for extended authorizations in other merchant categories 'Stripe charges an additional 0.08% fee per transaction'. The paragraph glosses extended authorization at first use (an approval held open beyond the standard window, for up to 30 days). | `time`: A promise that was refused. → A promise that was given and then allowed to run out. |\n| p28 | evidence | A refund does not return the fee of the original payment and can carry a fee of its own. | quotation: Stripe: 'Stripe’s processing fees from the original transaction aren’t returned'; 'IC+ users might see a difference in cost between reversals and refunds because reversals usually incur lower network fees.' Adyen's price list has a 'Payment method refund fee' column next to the payment fee. | `time`: Costs before and at capture. → The cost of sending the money back. |\n| p29 | evidence | A dispute adds a fee to the amount taken back: Stripe publishes €20.00 per dispute received in the Netherlands, and Adyen charges a non-refundable chargeback fee whose amount is set in the contract (CAD 24.00 in its standard disclosure for Canada is the one published amount). | fact: Stripe NL pricing: 'Dispute received fee €20.00 for each dispute you receive. In rare cases, network fees also apply. Dispute countered fee €20.00 for each dispute you respond to manually. You get this fee back for won disputes.' Adyen docs: Adyen 'debits the payment amount and the chargeback processing fee from your account'; no amount on its public price list.; table: Table: event \\| Stripe (documented) \\| Adyen (documented) (declined or retried authorization; capture after the validity window; refund; dispute). | `contrast`: Money the merchant chose to send back. → Money the cardholder's bank takes back. |\n\n### What a Pricing Model Makes a Provider Build\n\n**Controlling idea** (`cause_effect`, id `pricing-shapes-systems`): Pass-through pricing obliges a provider to calculate and report network costs per transaction, and the one documented link between pricing and features is Stripe's: five authorization and capture features and its network-cost reporting are tied to IC+ pricing; beyond that the record stops.\n\n**Advances the thesis** (PE-6): Moves from the pricing model to what the provider's systems must do, with the documented cases first and the inference labeled.\n\n**Transition in:** `cause_effect`: Network costs that the merchant sees under one pricing model and never sees under the other, and the saving that stays with a different party under each. → What each model therefore obliges the provider's systems to compute, expose and sell.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What pass-through requires, then the two documented Stripe cases, then the author's labeled reading of them, then the limits of the record; the inference must come after the evidence it interprets and before the statement of what is not public.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | cause_effect | A provider that passes network costs through has to work out the interchange and scheme fees of each transaction and show them to the merchant, which a provider on a blended rate does not owe anyone. | quotation: Adyen: 'Interchange++ is a pricing model which accurately tracks Interchange rates and scheme fees right down to a transaction level. This means we can calculate the cost of each payment even before it is completed.'; fact: Regulation (EU) 2015/751 Art. 12: per-transaction information 'indicating separately the merchant service charge and the amount of the interchange fee', which may be aggregated with the payee's consent. |  |\n| p35 | evidence | Stripe's documentation labels five authorization and capture features as IC+ features, offered to users on IC+ pricing, with users on blended or standard pricing told to contact support. | quotation: Extended authorization: 'We offer extended authorizations to users on IC+ pricing. If you’re on blended Stripe pricing and want access to this feature, contact us'. The same 'IC+ feature' label appears on incremental authorization, multicapture, overcapture and partial authorization. | `example`: What pass-through requires in general. → The documented case of features tied to it. |\n| p36 | evidence | Stripe also prices and reports its cost-reducing features by pricing plan: the estimated network-cost savings are computed for businesses on IC+ pricing, and its optimization bundle is included in standard pricing and charged separately on custom pricing. | quotation: Optimization page: 'Optimization features can help reduce network costs for businesses on IC+ pricing'; 'Stripe uses interchange and scheme fee rules or specifications from card networks to compute costs you would have incurred without the use of optimizations.' Pricing page (Netherlands): Authorisation Boost 'Included at no additional charge for businesses on standard payments pricing'; '0.2% per successful online card transaction for accounts with custom payments pricing'. | `additional_support`: Features that add network cost, tied to IC+. → Features that remove network cost, priced and reported by plan. |\n| p37 | analysis | Read together, these cases suggest that features whose network cost varies per transaction are offered where that cost is passed on, and that under a blended rate cost reduction is the provider's own margin; this is the author's inference. | reasoning: INFERENCE, NOT DOCUMENTED block: neither company states why features are tied to pricing; the reading follows from who keeps a saving under each model. Adyen's equivalents are enabled by Support and merchant category with no pricing-plan condition on the pages read. | `conclusion_summary`: The two documented Stripe cases. → The author's labeled reading of what they have in common. |\n| p38 | context | This is where the public record on what the two providers build stops, well short of the prices themselves: how either company computes network costs internally, scheme fee schedules, Stripe's IC+ markup, Adyen's negotiated markup and its chargeback fee outside one Canadian disclosure are not public. | fact: Not found in any fetched source: Visa or Mastercard scheme fee schedules; a Stripe IC+ rate; Adyen's non-indicative markup or its chargeback fee; UK interchange after Brexit was not researched. | `contrast`: What the documentation shows and what can be inferred from it. → What it does not show at all. |\n\n### What Each Company Reports: Volume, Net Revenue and Take Rate\n\n**Controlling idea** (`analysis`, id `reported-numbers`): Adyen publishes what it keeps (net revenue) and a take rate; Stripe publishes the value its customers moved and no revenue for the company, so the two companies' figures measure different things and cannot be ranked.\n\n**Advances the thesis** (PE-5): Defines net revenue and take rate, gives each company's published figures with dates, and says what cannot be computed or compared.\n\n**Transition in:** `place`: The price of one payment and what the provider must build to charge it, including the prices the record does not show. → The sum of a provider's share over all its payments, which is the part of its earnings a company does or does not publish.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The two terms first, then the company that publishes both, then the company that publishes neither, then what follows for comparing them; the reasoning needs both sets of figures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | definition | Net revenue is what a provider keeps after passing interchange and scheme fees on, and take rate is net revenue divided by the volume processed, in basis points. | quotation: Adyen defines net revenue as 'Net non-interest revenue (\"Non-interest revenue\" less \"Costs incurred from financial institutions\" and \"Costs of goods sold\") and Net interest income'; the costs deducted are those 'that do not form part of the passthrough settlement fees'. |  |\n| p31 | evidence | Adyen reported net revenue of €1,302.9 million on €803.8 billion of processed volume for the first half of 2026 and a take rate of 16.2 basis points. | statistic: 'Net revenue was €1,302.9 million, up 19% year-on-year'; 'Processed volume was €803.8 billion, up 24% YoY' (press release, 2026-08-13). 'Take rate landed at 16.2 bps, reflecting expected volume tiering as enterprise merchants process at larger scale on our infrastructure' (H1 2026 Shareholder Letter, unaudited). | `example`: The two definitions. → The company that publishes both figures. |\n| p32 | evidence | Stripe is private and publishes total volume ($1.9 trillion for 2025) but no revenue for the company, so its take rate cannot be computed from public figures. | quotation: Stripe 2025 annual letter: 'Last year, businesses running on Stripe generated $1.9 trillion in total volume, up 34% from 2024, and equivalent to roughly 1.6% of global GDP'; 'Stripe remained robustly profitable'. The letter gives no revenue or net revenue figure for the company (its one revenue number is a run rate for the Revenue suite) and does not define total volume. | `contrast`: The listed company that reports revenue and take rate. → The private company that reports volume only. |\n| p33 | analysis | The two volumes are in different currencies, defined differently and drawn from different customers, and a take rate falls as customers get larger, so none of these figures ranks one company against the other. | statistic: Adyen 2025: processed volume 'up 21% excluding a single large-volume customer, or 8% YoY including this customer', while net revenue rose 18%. | `cause_effect`: One company's net revenue and take rate, the other's volume. → Why they cannot be set against each other. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): On the public record the two companies differ in their default price, in what they publish about failed and disputed payments, in whether features depend on the pricing plan, and in what they report about their own earnings.\n\n**Advances the thesis** (PE-3, PE-5, PE-6): Collects the documented differences of the preceding sections into one table and says what an integrator should do differently on each provider.\n\n**Transition in:** `conclusion_summary`: The documented facts about each company's pricing, fees, features and reporting, and the limits of the record. → The same facts side by side, with the author's reading in a separate column.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | Six documented differences separate the two companies, and the last column of the table is the author's inference from them. | table: Table: aspect \\| Stripe \\| Adyen \\| what the difference suggests. Rows: published default card price; the other model; refunds on the price list; dispute fee; features tied to the pricing plan; reported financials. |  |\n| p40 | recommendation | On Stripe, ask which features and reports change if you move to IC+ and what the optimization bundle then costs; on Adyen, ask for the markup, the minimum invoice and the chargeback fee in writing, and build the fee reconciliation the pass-through statement makes possible. |  | `cause_effect`: The six differences. → What an integrator does differently on each provider because of them. |\n\n### In Practice at Larkfield: The Fee Stack on Mila's €120\n\n**Controlling idea** (`example`, id `larkfield-fee-stack`): Split to the cent, Mila's €120 shows that Larkfield's two providers' prices can be compared only after the network costs are added to one and subtracted from the other, and that the answer changes with the card.\n\n**Advances the thesis** (PE-1, PE-3, PE-4): Applies the three parts and the two models to the ledger's recurring payment with labeled illustrative figures, then to Bram's disputed payment.\n\n**Transition in:** `example`: The comparison of the two companies and the advice that follows from it. → The same comparison done with Larkfield's figures on one payment.\n\n**Order of paragraphs** (`small_to_large`): One payment on one provider, the same payment on the other, then the card mix across all payments; the disputed payment comes last because it reuses the split and adds the backward cost, and because the conclusion returns to it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | context | Every figure in this section is illustrative: Larkfield is fictional, its negotiated rates are assumptions, and scheme fees are not public. | scenario: Mila's pass, 9 March 2027: €120.00 with a Dutch Visa debit card (a consumer debit card, so the 0.2% cap applies) at Studio Noord, on Adyen; Larkfield's fee €2.53; the studio receives €117.47. |  |\n| p42 | example | On Adyen the €0.61 provider cost on Mila's pass is €0.24 of interchange, €0.06 of scheme fees and €0.31 for Adyen, which leaves Larkfield €1.92. | table: Table: who is paid \\| for what \\| amount \\| basis. Mila's bank €0.24 (0.2% cap, assumed charged in full); Visa €0.06 (assumption); Adyen €0.31 (assumed negotiated processing fee €0.11 plus markup €0.20, about 0.17%); Larkfield €1.92; Studio Noord €117.47. At Adyen's indicative public price the provider cost would be about €1.13. The paragraph says why the table calls Adyen the acquirer 'by inference' (Adyen names no acquiring entity per country) and that the public fixed fee is $0.13, taken as €0.11.; figure: Figure: a €120 bar divided into €117.47 for the studio, €1.92 for the platform, €0.31 for the provider, €0.24 for the customer's bank and €0.06 for the card network. | `example`: The warning that the figures are illustrative. → The split on the provider Studio Noord uses. |\n| p43 | example | Had Studio Noord been on Stripe, Larkfield's statement would show one fee, €0.87 at its assumed negotiated blended rate or €2.05 at the public list price, with the same €0.24 and €0.06 inside it and unseen. | scenario: Assumed negotiated Stripe rate for standard EEA cards: 0.6% + €0.15 = €0.87 on €120, leaving Larkfield €1.66; public list 1.5% + €0.25 = €2.05, leaving €0.48. | `contrast`: The itemized cost on Adyen. → The single fee the same payment would carry on Stripe. |\n| p44 | analysis | Across Larkfield's card mix the like-for-like comparison is Adyen's €0.31 against what Stripe keeps after network costs, about €0.53, and it reverses for a card outside the caps. That answers the controller's second question (why the cost cannot be forecast); the first (why nearly two-thirds of fee income goes out) is said to need the same split for every method and provider, since on this one payment the provider cost is about a quarter of the fee. | reasoning: Card mix 70% debit (ledger), the rest assumed consumer credit: average interchange at the caps 0.7 × €0.24 + 0.3 × €0.36 = €0.28; Adyen cost €0.28 + €0.06 + €0.31 = €0.65; Stripe €0.87 flat, of which about €0.53 is Stripe's. For a commercial card with an assumed 1.5% interchange (€1.80), Adyen's cost becomes €2.17 while the assumed blended rate stays €0.87 unless the contract has a premium tier. | `cause_effect`: One payment priced on each provider. → The comparison across the card mix, and where it flips. |\n| p45 | example | Applied to Bram's pass, the payment from the chapter's opening that came back, the same split shows that Bram's disputed €120 cost slightly more on the way in, because a credit card's interchange cap is higher, and that the chargeback then added €120 and €15 on the way back. | scenario: Bram's pass, 2 February 2027, Dutch Mastercard credit card, Studio Noord on Adyen: interchange up to €0.36 (0.3% cap), scheme fees €0.06 (assumption), Adyen €0.31, provider cost €0.73, Larkfield €1.80, studio €117.47; on 24 February the chargeback takes €120.00 and a €15.00 dispute fee (illustrative), carried by the studio under Larkfield's terms. | `contrast`: Payments that stayed paid. → Bram's payment from the chapter's opening, which came back. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Set side by side, the payment's timeline and its fee stack are one picture: each party that makes a promise on the way forward (the issuer, the network, the acquirer or provider) takes a share of the fee for it, and each backward flow sends a new cost to whoever was left holding the promise, usually the merchant. A provider's pricing model decides how much of that picture the merchant is shown.\n\n**So what:** A reader can cost a payment before choosing a provider, including its declines, late captures, refunds and disputes, will not compare a blended rate with a pass-through markup as if they measured the same thing, and knows to ask which features and reports depend on the pricing plan.\n\n**Callback:** The introduction's question about Bram de Wit's €120: who was paid what on 2 February, and what the €15 of 24 February was. The reader can now name each party that said yes, what each was paid for saying it (the issuer its interchange, the network its scheme fee, Adyen its markup, Larkfield its platform fee), and why none of those yeses stopped the €120 and a €15 fee being taken back: the dispute right belongs to the cardholder and outlasts them all.\n\n**Takeaway** (`provocative_insight`): Part I treated the issuer's yes as given. It is not: the same payment can be approved or declined depending on how the provider reaches the networks and how it models the payment, which is the subject of Part II.\n\n**Hand-off** to [Part II — ACCEPTANCE: Getting to Yes](part-2.html): `elaboration`: The whole chain of promises and what each party is paid for carrying its promise, with the issuer's approval taken as given. → What decides whether the issuer says yes at all: how the provider reaches the networks and how it models the payment.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | synthesis | Laid on one line, the four promises of a card payment and the three parts of its fee are the same picture: each party that says yes is paid for it, and each backward flow adds a cost for whoever is left holding the promise, as Bram's €120 shows. | figure: Figure: a timeline with four markers (authorization, clearing and settlement, payout, dispute window) and, under each, the party that is paid there. |  |\n| p47 | synthesis (list) | Established: a card fee is interchange, scheme fees and markup; the networks set default interchange and do not earn it; EU law caps consumer interchange at 0.2% and 0.3% and makes unblended pricing the default offer; failed and backward flows carry their own charges. |  | `elaboration`: The one-line picture. → The parts of it the field agrees on, with their sources. |\n| p48 | synthesis (list) | Depends on context: which pricing model is cheaper turns on card mix, volume and who can audit a statement; the US debit cap depends on litigation not finished in November 2026; a take rate describes a customer base, not a quote. |  | `contrast`: What is established. → What changes with the situation. |\n| p49 | recommendation (list) | The author's synthesis: treat the pricing model as part of the architecture, and never compare a blended rate with a markup before adding the network costs back. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labeled as such. |\n| p50 | recommendation (list) | Eight questions let the reader take the chapter into a provider evaluation or a design review. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p51 | transition | Part I took the issuer's yes as given; Part II asks what decides it. |  | `elaboration`: The chain of promises and what each party earns, with the approval assumed. → The approval itself, unpacked as something a provider's connections and models can change. |\n\n## Non-goals\n\n- How interchange qualification, clearing records and net settlement work See [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html).\n- The dispute process, deadlines and monitoring programs behind the dispute fee See [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html).\n- Why issuers decline and how providers raise approval rates; least-cost debit routing as a routing technique See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html), [More Than One Provider: Routing and Orchestration](payment-routing-and-orchestration.html).\n- How fees are netted or invoiced against a balance and reconciled See [Pending, Available, Reserved: Balances and Funds Flows](balances-and-funds-flows.html), [Proving the Money: Reconciliation Inside the Provider and Out](payment-reconciliation-and-reporting.html).\n- Platform fees, splits and who funds a loss on a platform See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html), [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Pricing of payment methods other than cards (iDEAL, direct debit, wallets, buy-now-pay-later) See [A Payment Is Not a Card: Local Methods and Real-Time Rails](local-payment-methods.html).\n- The two companies' strategies and valuations See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html), [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html).\n- An estimate of Stripe's revenue or take rate\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Has the Eighth Circuit's mandate in Corner Post issued, and was rehearing or certiorari sought? The chapter states the position as of 17 November 2026.\n- What was the outcome of the final-approval hearing on the US credit interchange settlement? Not found; the chapter says 'preliminarily approved'.\n- UK interchange after Brexit and UK–EEA cross-border rates were not researched; the chapter says so.\n- Does Adyen charge its fixed processing fee on refused transactions? The pricing page says 'for each transaction' and no more.\n- Stripe's Netherlands price list does not use the words 'per successful' for online card payments (it does for Klarna, Terminal and Authorisation Boost); the US list could not be re-fetched from this location. The article therefore does not claim that a declined attempt is free on Stripe; the journal-spec thesis wording was corrected to match on 17 November 2026.\n- Do either provider's fees on the original sale come back when a dispute is lost or won? Not stated on the pages read for disputes.\n\n## Decision log\n\n- **2026-11-17** — Open with Bram de Wit's €120 from the part opening, so that this chapter's callback is also the part's closing callback. Rejected: Open with Mila's pass and bring Bram 6-11-17) — Card prices, dispute fees, IC+ as custom pricing, Authorisation Boost pricing.\n  - https://www.adyen.com/pricing (n.d., fetched 2026-11-17) — Interchange++ pricing, processing fee, indicative prices, minimum invoice.\n  - http://publications.europa.eu/resource/celex/32015R0751 (2015-05-19, fetched 2026-11-17) — Caps, scope, unblending, per-transaction information.\n  - Visa Form 10-K filed 2026-11-05; Mastercard Form 10-K filed 2026-02-11 (both fetched 2026-11-17) — Who sets interchange and the merchant's price; kinds of network revenue; status of US regulation and litigation.\n  - Adyen H1 2026 press release and Shareholder Letter (2026-08-13); H2 2025 press release (2026-02-12); Stripe 2025 annual letter (2026-02-24), all fetched 2026-11-17 — Net revenue, processed volume, take rate; total volume.\n  - docs.stripe.com: extended-authorization, incremental-authorization, multicapture, overcapture, partial-authorization, analytics/optimization, refunds; docs.adyen.com: adjust-authorisation, visa-integrity-fees, refusal-reasons (n.d., fetched 2026-11-17) — IC+ features, cost-saving reporting, refund fees, late-capture and retry costs.\n  - Federal Reserve Regulation II pages (2024-05-17, 2025-12-19); Consumer Finance Monitor 2026-10-28 and ABA Banking Journal 2026-11-03 (secondary), fetched 2026-11-17 — US debit cap, routing rule, 2024 averages, the Corner Post ruling.\n\n## Changelog\n\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the cards and companies research briefs.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — Verification pass: 72 claims checked (61 confirmed, 4 corrected, 2 hedged, 0 unsupported and removed or relabeled, 0 unreachable; 3 not checked and 2 negatives confirmed only by search, listed in _research/verification/05-payment-economics.md); the most significant fix: the article said Stripe's 2025 letter gives no revenue figure, and it now says the letter gives none for the company and quotes its one product-family run rate. thesis.how_why still says 'per successful payment', which Stripe's Dutch price list does not say for online cards; it must change together with the journal spec.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('charges 1.5% + €0.25 per successful payment on a standard Eu' -> 'prices a standard European Economic Area card at 1.5% + €0.2').\n- **2026-11-17** — Reconciliation after verification: journal-spec entry and spec body brought into line with the verified page and consistency rulings (journal entry thesis.how_why (ch5 verification row 64: one product-family run rate is published) re-synced; ch5 verification row 64; stale open question closed). No unit added, dropped, merged or reordered.\n- **2026-11-17** — Absence audit: 11 statements of absence re-tested with a wide search (0 overturned, 5 narrowed, 6 hold; table in _research/absence-audit/05-payment-economics.md). Narrowed: Stripe's pricing policy defines the blended and IC+ models and the markup without its size; Adyen's terms call the chargeback fee non-refundable; Adyen publishes a minimum invoice for Australia only.\n- **2026-11-17** — Ruling 46(f) applied: the one published Adyen chargeback fee (CAD 24.00, Adyen Canada's fee disclosure) is named in both tables and the limits paragraph.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after the round-1 draft check, repairs authorized by the coordinating editor. p15 split into p15 (US debit cap) and p52 (routing rule); p24 split into p24 (which model suits which business) and p53 (the rule for comparing quotes). In the caps section p17 (cards outside the caps, Stripe's four prices) moved from last to after p13, so that the Article 9 inference follows the prices it is about and the section ends on the US status in court. The failure-costs table moved from p25 to the end of the section (p29), after the paragraphs that explain its terms. p38 kept in place and reworded to say why it stands there; the roadmap announces it. Wording aligned with the page: p03, p06, p44, p45; evidence added to p21 (Adyen's fee type for blended rates, already in the comparison table and Sources). max_words raised from 6,500 to 6,825 (5%). Intent, thesis, role, acceptance criteria and section order unchanged.\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {

                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';

                // Bold/italic, including nested combinations: ***x***,

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {

                const fence = line.match(/^```(\w*)\s*$/);

                    };
                    i += 2;
                    const rows = [];

                if (bullet.test(line) || ordered.test(line)) {

                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list

                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
