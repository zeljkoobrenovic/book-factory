a prepaid-credit requirement needs. *Probe:* A customer has bought €50 of prepaid usage credit. Can the customer use €80 worth before anything stops them? What decides the answer? | `custom` | cold_reader | major |\n| AC-3 | Statements about Orb's architecture are presented as Orb's documentation about Orb, not as facts about Adyen's platform, and no claim is made about Metronome's internal design. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How do you bill for usage when events arrive late, twice and by the billion?\n\n> **Claim:** A usage invoice can stop changing and still be explained only if three time rules are fixed before the first invoice (how long an event is accepted, when the period's invoice closes, how a wrong event is corrected) and duplicates are removed by an identifier the producer assigns; volume then forces one design choice, to aggregate events as they arrive or to keep them raw and compute the invoice by query (raw where prices may change retroactively or an invoice must be explained from its events, aggregated where volume leaves no alternative), and the public record shows one documented example of each: Stripe's 2025 account of windowed stream aggregation and Orb's documentation of invoices computed from immutable events.\n\n**Disputed by:** The view that metering is a counter (add one per event, multiply by the price at month end) and that the engineering problem is throughput, to be solved with a faster stream processor.\n\n**So what:** The reader sets the three rules on purpose instead of inheriting a vendor's defaults, knows that a provider can accept an event and still never bill it, and keeps raw events wherever a price may be changed retroactively or an invoice may have to be explained to an auditor.\n\n**How and why:** An invoice has to stop changing while events keep arriving, so every usage system draws a line in time and needs a path for what lands after it. Stripe's meters accept events up to 35 days old, bill them only until the invoice is finalized plus a grace period (1 hour by default, at most 72), and allow cancellation for 24 hours; Orb documents a 12-hour grace period and amendments that archive events instead of overwriting them. Aggregating on arrival is cheap to query and loses the original events' context; computing from raw events keeps it and costs more per invoice. Both providers bought their usage engines in 2026 (Stripe completed Metronome on 14 January, Adyen completed Orb on 1 July). Stripe documents Metronome as pushing finished invoices into Stripe one way; Orb's design is documented by Orb about Orb; and the sources used say nothing of Metronome's internals, so the chapter does not place it on either side of the design choice.\n\n**Supporting claims**\n\n- **C1** — An invoice has to stop changing while events keep arriving, so three time rules must be fixed before the first invoice (acceptance window, billing cut-off, correction path), and an event that is accepted is not thereby billed.\n- **C2** — A duplicate can be removed only by an identifier the producer of the event assigned, and only within the period for which the receiver remembers it.\n- **C3** — Volume forces a choice between aggregating events on arrival and keeping them raw to compute the invoice by query: raw where prices may change retroactively or an invoice must be explained from its events, aggregated where volume leaves no alternative; Stripe's 2025 post and Orb's documentation are the one documented example of each.\n- **C4** — A real-time balance check and invoice-time rating are different consistency requirements with different costs, and prepaid credit that must stop usage needs the first.\n- **C5** — Both providers bought their usage engines in 2026: Stripe documents Metronome as its recommended usage product joined to Stripe by a one-way invoice push, Adyen documents no integrated product, Orb's design is documented by Orb about Orb, and the sources used do not describe Metronome's internals.\n\n## Role in the part\n\nShows the time problem in its sharpest form: the amount owed for a period is unknown until a cut-off the system itself must choose, which is where 'late' and 'twice' enter billing before any payment is attempted. Supports P6-2, P6-5 of part `part-6`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in why-counting-is-hard before stripe-meter-rules before two-designs before rating-credits-commitments: the rules, their documented values, the design choice volume adds, then pricing and balances, each using the terms of the one before; `comparison` in two-designs, acquired-engines, where-they-differ; `problem_solution` in scene and in-practice: the unexplained invoice and its repair)\n\nThe reader meets a wrong invoice at a trivial volume before any vocabulary, so the rules arrive as the answer to a felt problem and the counter view (throughput is the problem) is set aside early. The rules come before Stripe's values for them, because the documentation is only readable as three separate rules once the frame exists. The design choice for volume comes after the rules, because both designs must implement them and differ in how; rating and credits come after the designs, because the real-time balance depends on the fast path the designs introduce. The acquisitions follow the designs and credits they are the homes of, and the comparison table needs all of it. Larkfield's repair and the failures come last because they apply the rules and their limits. Moving the designs first would present metering as a throughput problem, which is the view the chapter disputes.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Studio Noord's plan includes 500 text messages. In March 2027 it sent 1,240. Its invoice from Larkfield charged for 1,324. Of the 1,240, 180 had been reported twice and 96 had been reported after the invoice closed. Three counts of one month (1,240, 1,324, and the 1,144 that arrived once and in time), and each is what some reasonable rule would have billed.\n\n**Bridge:** An engineer has built counters and knows how to make a stream processor fast; counting things looks like a solved problem. → A bill is a count that has to stop changing and be defensible to the customer, while its inputs arrive late and more than once, so the hard part is deciding in advance what to do with events on the wrong side of a line in time.\n\n**Thesis statement** (KEY POINTS callout and paragraph p02): A usage invoice can stop changing and still be explained only if three time rules are fixed before the first invoice (how long an event is accepted, when the period's invoice closes, how a wrong event is corrected) and duplicates are removed by an identifier the producer assigns. Volume then forces one design choice: aggregate events as they arrive, or keep them raw and compute the invoice by query. The public record has one documented example of each: Stripe's 2025 account of its meter pipeline and Orb's documentation.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from Larkfield's SMS invoice that nobody could explain. *Kept in:* scene.\n- Explain why counting is hard, with the terms usage event, meter and rating and the three time rules. *Kept in:* why-counting-is-hard.\n- Read the three rules and the duplicate check in Stripe's meter documentation. *Kept in:* stripe-meter-rules.\n- Compare the two designs for high volume: aggregate on arrival or compute from raw events. *Kept in:* two-designs.\n- Cover rating against versioned prices, credits, commitments and the real-time balance. *Kept in:* rating-credits-commitments.\n- Report the two acquisitions of 2026, the status of token billing, and compare the two providers. *Kept in:* acquired-engines, where-they-differ.\n- Write Larkfield's rules and go through the ways metering fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | - 6, the comparison of the providers, Larkfield's rules, and the ways metering fails. |  | `sequence`: The chapter's claim. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: An SMS Invoice Nobody Could Explain\n\n**Controlling idea** (`example`, id `scene`): Larkfield's SMS meter billed a studio for a count that neither the studio nor Larkfield could reproduce, at a volume of a few events per second, so the question is which rules were never decided and not how fast the pipeline is.\n\n**Advances the thesis** (C1, C2): Poses the question in a system where throughput is plainly not the problem, which is the position the thesis takes against the counter view.\n\n**Transition in:** `example`: The claim that rules, not speed, decide whether a usage invoice can be explained. → The company and the invoice that show it.\n\n**Order of paragraphs** (`chronological`): How the charge is set up, what happened to one invoice, then the question it raised; the question only makes sense after the two faults are on the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Larkfield charges studios for text messages above a plan allowance through a Stripe Billing meter, fed by a queue consumer, that the growth team built and the payments team took over in May 2027. | scenario: Scenario ledger: studio plans at €89, €189 and €349 per month; SMS overage €0.07 per message over the plan's allowance; 'Billed with Stripe Billing since 2018'; the billing integration has 'a meter for SMS usage' and was 'Owned by the growth team, not the payments team, until 2027'. New local facts: allowances of 500, 2,000 and 5,000 messages; Studio Noord is on the €89 plan; its subscription period is the calendar month in UTC. |  |\n| p06 | example | Ines Bakker's March invoice showed 1,324 messages where her own message log showed 1,240, and the difference was two faults that partly canceled: 180 messages counted twice and 96 not counted at all. | scenario: Larkfield (fictional): 1,240 sent; a queue consumer timed out on 17 March and re-sent 180 events without an identifier of its own; the consumer was down from 21:40 UTC on 31 March to 03:20 UTC on 1 April and reported 96 late, after the invoice was finalized at about 01:00 UTC. 1,240 + 180 − 96 = 1,324. Billed overage 824 × €0.07 = €57.68; correct 740 × €0.07 = €51.80; overcharge €12.60, undercharge €6.72, net €5.88. | `cause_effect`: A meter fed by a queue. → What one month of it produced for one studio. |\n| p07 | claim | Larkfield sends about 9 million messages a month, roughly 3.5 per second, so Femke de Graaf's question was not how to count faster but which rules about duplicates, lateness and correction had never been decided. | reasoning: Illustrative assumption: about 9 million messages a month across 6,200 studios, which is about 3.5 per second on average (9,000,000 ÷ 2,592,000 seconds); Stripe documents a limit of 1,000 meter-event calls per second per account. | `contrast`: An invoice wrong by two small faults. → The diagnosis that speed was not involved, and the question that remains. |\n\n### Why Counting Is Hard: The Invoice Must Stop, the Events Do Not\n\n**Controlling idea** (`explanation`, id `why-counting-is-hard`): Usage events arrive more than once and after the time they describe, while an invoice must at some point stop changing, so every usage system has to draw a line in time and say what happens on each side of it.\n\n**Advances the thesis** (C1, C2): Defines usage event, meter and rating, and derives the producer-assigned identifier and the three time rules from the way events are delivered.\n\n**Transition in:** `elaboration`: Femke's question: which rules were never decided. → The vocabulary and the two properties of event delivery from which the rules follow.\n\n**Order of paragraphs** (`prerequisite_order`): The event before the meter that counts it, the meter before the two ways delivery breaks the count, and both faults before the rules that answer them; each paragraph uses the term the one before defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A usage event is one record that a customer consumed something at a given time, and it needs five fields to be billable: who, what, how much, when it happened and an identifier of its own. | table: Fields of a usage event with the SMS example: customer (the studio), event name (sms_sent), value (1), timestamp (when the message was sent, not when it was reported), identifier (the message id). Stripe: a meter event includes \"the event name configured on the meter, customer ID, numerical value, and a timestamp (optional)\" and \"an identifier that you can specify in your request\" (https://docs.stripe.com/billing/subscriptions/usage-based/recording-usage-api, n.d., accessed 2026-11). |  |\n| p09 | definition | A meter is the rule that turns many usage events into one quantity for a billing period, and rating is the step that applies a price plan to that quantity to get an amount of money. | quotation: Stripe: \"Meters specify how to aggregate meter events over a billing period. Meter events represent all actions that customers take in your system (for example, API requests). Meters attach to prices and form the basis of what's billed\"; aggregation is Sum, Count or Last; after configuration \"you can't make any changes aside from the display name\" (https://docs.stripe.com/billing/subscriptions/usage-based/meters/configure, n.d., accessed 2026-11). | `elaboration`: The event as the unit. → The two steps that turn events into money. |\n| p10 | cause_effect | Events arrive twice because any producer that retries after a timeout delivers at least once, and the receiver can tell a re-send from a second real event only by an identifier the producer assigned before the first attempt. | reasoning: Two text messages to the same member in the same second are two billable events; one message reported twice is one. Their fields are identical except for an identifier created where the message was created. An identifier generated on receipt differs for every arrival and so removes nothing.; fact: Stripe: \"If you don't specify an identifier, we auto-generate one for you\" (https://docs.stripe.com/billing/subscriptions/usage-based/recording-usage-api, n.d., accessed 2026-11). | `contrast`: The clean picture: events in, quantity out. → The first way delivery breaks it: the same event more than once. |\n| p11 | cause_effect | Events arrive late because the time something happened and the time it was reported are different clocks, while the invoice for the period has to be finalized, after which it may no longer change. | reasoning: A batch job, a queue backlog, a mobile client offline or a vendor receipt can report at 03:20 what happened at 23:50. The invoice is a legal document that is frozen at finalization (owned by the next chapter). Whatever instant is chosen for freezing it, some event for the period can still arrive after it. | `additional_support`: Events that arrive twice. → The second property: events that arrive after the period they belong to, against an invoice that has to stop. |\n| p12 | claim | Three rules therefore have to be chosen before the first invoice (how long an event is accepted, when the period's invoice closes, how a wrong or late event is corrected afterwards), and the first two are different lines: an event can be accepted and never billed. | table: The three rules: acceptance window (question: how old may an event be and still be stored? if undecided: old events are silently dropped or accepted forever); billing cut-off (question: until when does an event for a period change that period's invoice? if undecided: invoices that keep changing or usage that is never charged); correction path (question: what happens to an event that was wrong, or that arrived after the cut-off? if undecided: manual edits nobody can trace). | `cause_effect`: Duplicates and lateness as permanent properties of delivery. → The three rules they force, and the gap between accepting an event and billing it. |\n\n### The Three Rules as Stripe's Meters Document Them\n\n**Controlling idea** (`evidence`, id `stripe-meter-rules`): Stripe's documentation gives each rule a number (35 days to accept, 1 to 72 hours to bill, 24 hours to cancel) and says in plain words that an accepted event may never be invoiced; its duplicate check is also bounded in time.\n\n**Advances the thesis** (C1, C2): Supplies the documented example of each rule and of the identifier, with its limits.\n\n**Transition in:** `example`: Three rules stated in the abstract. → One provider's documented values for each.\n\n**Order of paragraphs** (`grouping`): One paragraph per rule in the order the previous section named them, then the identifier, then the contract as a whole, so the reader can lay the documentation over the frame.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | evidence | Stripe accepts a meter event whose timestamp is up to 35 days in the past or 5 minutes in the future, and states that acceptance does not mean the usage will be invoiced. | quotation: \"Make sure the timestamp is within the past 35 calendar days and isn't more than 5 minutes in the future\"; \"The 35-day window determines whether Stripe accepts a meter event. It doesn't guarantee that Stripe can include the usage on an invoice ... Stripe might accept an event after finalization and include it in meter summaries without updating the finalized invoice or adding the usage to the next invoice\" (https://docs.stripe.com/billing/subscriptions/usage-based/recording-usage-api, n.d., accessed 2026-11). |  |\n| p14 | evidence | The billing cut-off is the finalization of the period's invoice, which Stripe delays by a grace period of 1 hour by default and at most 72 hours, and which does not apply to every kind of invoice. | quotation: \"All invoices have a default finalization grace period of 1 hour. During the finalization grace period, you can continue to report usage for the previous billing period\"; \"You can set a delay of up to 72 hours (3 days)\"; only subscription cycle invoices and schedule phase transition invoices include that usage; threshold invoices \"reflect only the usage accrued up to the point the invoice is created\" (https://docs.stripe.com/billing/subscriptions/usage-based/configure-grace-period, n.d., accessed 2026-11). | `sequence`: The acceptance window. → The second rule: the cut-off after which the invoice no longer takes usage. |\n| p15 | evidence | The correction path Stripe documents at the meter is narrow (cancel an event within 24 hours of sending it, or offset usage in an open period with a negative quantity), and neither changes a finalized invoice, so corrections after finalization are made with a credit note or a line on a later invoice. | quotation: \"You can only cancel events sent to Stripe within the last 24 hours. If you cancel usage that's included on a finalized invoice, we won't update the invoice or issue a corrected invoice for the canceled usage\"; \"You can also fix incorrectly recorded usage data by recording negative quantities. If the overall cycle usage is negative, Stripe reports the invoice line item usage quantity as 0\" (https://docs.stripe.com/billing/subscriptions/usage-based/meters/configure, n.d., accessed 2026-11). | `sequence`: The cut-off. → The third rule: what can be corrected, and until when. |\n| p16 | evidence | Stripe removes duplicates by the event's identifier and enforces its uniqueness for a rolling period of at least 24 hours, so even a producer-assigned identifier protects only against re-sends inside that period. | quotation: API reference, `identifier`: \"A unique identifier for the event. If not provided, one is generated. We recommend using UUID-like identifiers. Stripe enforces uniqueness within a rolling period of at least 24 hours. The enforcement of uniqueness primarily addresses issues arising from accidental retries or other problems occurring within extremely brief time intervals\" (https://docs.stripe.com/api/billing/meter-event/create, n.d., accessed 2026-11). | `additional_support`: Three time rules with documented values. → The identifier, and the time limit on it. |\n| p17 | description (table) | Taken as a contract, the meter API promises asynchronous ingestion at documented rates and reports invalid events out of band, and does not promise that a summary is current or that an accepted event is billed. | table: What it promises / what it does not: rate (1,000 calls per second per account, one concurrent call per customer per meter; 10,000 events per second on API v2 streams, 200,000 through sales) / not that a Connect platform acting for a connected account gets more than 100 operations per second; consistency (\"Stripe processes meter events asynchronously, so aggregated usage in meter event summaries and on upcoming invoices might not immediately reflect recently received meter events\") / not read-your-writes; failure (invalid events reported through `v1.billing.meter.error_report_triggered` and `v1.billing.meter.no_meter_found`, with codes such as `timestamp_too_far_in_past`) / not a synchronous rejection; configuration (a meter cannot be changed after configuration except its display name) (https://docs.stripe.com/billing/subscriptions/usage-based/recording-usage-api, n.d., accessed 2026-11). | `conclusion_summary`: The rules and the identifier one by one. → The same documentation read as one contract with its limits. |\n\n### By the Billion: Aggregate on Arrival or Compute From Raw Events\n\n**Controlling idea** (`comparison`, id `two-designs`): At high volume a metering system either aggregates events as they arrive or keeps them raw and computes the invoice by query; Stripe's 2025 post documents the first for its meters and Orb's documentation the second, and both run a fast and a slow path.\n\n**Advances the thesis** (C3): Presents the design choice, the one documented example of each side, where the two resemble each other, and the trade-off.\n\n**Transition in:** `contrast`: Rules that hold at any volume, shown at a few events per second. → What changes when the events come by the billion: where the aggregation is done.\n\n**Order of paragraphs** (`comparison`): The choice, then Stripe's account, then Orb's on the same points, then what the two share, the author's labeled reading, and the trade-off table; the table needs both accounts first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Volume forces one structural decision, where the aggregation happens: at ingestion, by updating counters or windows as events arrive, or at query time, by storing every event and computing the quantity when an invoice is needed. | reasoning: At 10,000 events per second a month holds about 26 billion events (10,000 × 2,592,000). Summing them per customer at invoice time is a large query; keeping a running total per customer is a small write per event and discards the event. |  |\n| p19 | evidence | Stripe's January 2025 engineering post describes its meter pipeline as asynchronous ingestion onto an event bus followed by stream processing with Apache Flink, run in two regions at once. | quotation: \"How we built it: Usage-based billing\", Taras Mitran and Karan Dhabalia, 2025-01-28 (https://stripe.com/blog/how-we-built-it-usage-based-billing): events go to \"an edge router, which does stateless authentication and API validation, then loads them directly onto an event bus\"; Flink chosen for \"exactly-once processing guarantees\"; \"we process the same event in two geographic regions simultaneously\"; each event is tagged with \"a standardized time stamp, generated before reaching the two Flink applications\". | `example`: The choice in the abstract. → Stripe's published account of its side of it. |\n| p20 | evidence | The same post describes two aggregation paths, a 30-second window held in memory for alerts and a five-minute window written to disk for invoicing, and treats the customer's pricing as a second stream matched against the events. | quotation: \"One is a fast path with a 30-second tumbling window, which we store in memory in real time\"; \"The second path is slower, with a five-minute window. It's where we write streaming events to disk, in a kind of transactional ledger ... This allows us to accommodate any delayed or out-of-order events\"; pricing is turned \"into a stream of changes\" matched to events \"like two sides of a zipper\"; a retroactive discount \"means opening a lookback window\" (https://stripe.com/blog/how-we-built-it-usage-based-billing, 2025-01-28). The post states a capacity of 100,000 events per second; current documentation gives 10,000 by default and 200,000 through sales. | `additional_support`: Ingestion and stream processing. → How the stream is aggregated and matched to prices, and what the post leaves out. |\n| p21 | evidence | Orb's documentation describes the other design: every event is stored unchanged, and an invoice is the result of a query over the raw events run with the current metric and price definitions. | quotation: Orb, \"Query-based billing\" (https://docs.withorb.com/architecture/query-based-billing, n.d., accessed 2026-11): \"Orb's billing engine treats billing as the output of a deterministic query, not a side effect of streaming state mutations\"; \"Every usage event is stored immutably in a columnar data store. When generating an invoice, Orb executes a fresh query over the raw event data ... The invoice is computed, not retrieved\"; on the alternative: \"once an event is processed and the counter is incremented, the original context is lost\"; \"a dependency graph and invalidation system\" recomputes only affected invoice fragments.; fact: Orb's values for the time rules: events may be reported \"up to 12 hours after the `timestamp`\" by default, and in an amendment \"Old events are marked as archived\"; \"Orb never overwrites or permanently deletes ingested usage data\" (https://docs.withorb.com/events-and-metrics/reporting-errors, n.d., accessed 2026-11). | `contrast`: Stripe's windowed aggregation. → Orb's documented alternative, in Orb's own words. |\n| p22 | evidence | Orb's documentation also describes a streaming path of running totals used only for alerts, and a pre-aggregating product for the largest volumes, so its design too gives way to aggregation at the top of the range. | quotation: Orb: \"The stream-based system maintains running totals in Redis (MemoryDB) as events arrive ... But the billing logic never touches these counters—invoices are always computed from raw events\" (https://docs.withorb.com/architecture/query-based-billing, n.d., accessed 2026-11); \"generally north of 500,000 events per second—and want Orb to pre-aggregate that data in real time rather than storing every raw event, Orb offers a service called \"hosted rollups\"\", default window 10 minutes, partial rollups every 30 seconds (https://docs.withorb.com/events-and-metrics/high-throughput-ingestion, n.d., accessed 2026-11). | `similarity`: Orb's raw events and query. → What Orb shares with the streaming design: a fast path for alerts and a rollup product for extreme volume. |\n| p23 | analysis (callout) | Read together, the two accounts differ less in machinery than in what the invoice is derived from (a durable window at Stripe, the raw events at Orb), and Stripe's post does not say whether raw events are also retained. | reasoning: Inference from the two sources above; Stripe's post does not say whether raw meter events are retained behind the five-minute path. | `conclusion_summary`: Two published designs with a fast and a slow path each. → The author's labeled reading of the difference and of what is not documented. |\n| p24 | comparison (table) | The two designs trade cost per invoice against the ability to reprice and to explain: keep raw events where a price may change retroactively or an invoice must be traced to its events, and aggregate on arrival where volume leaves no alternative. | table: Trade-off table, aggregate on arrival versus raw events and query, on: cost of producing an invoice; a late event; a retroactive price change; explaining an invoice line; a new metric over past usage; the volume at which it strains; when it is right. Rows are the author's judgement except where Orb's or Stripe's documentation is cited above. | `cause_effect`: What each design derives the invoice from. → The consequences, criterion by criterion, and the rule for choosing. |\n\n### Rating, Credits and Commitments: When the Count Meets the Price\n\n**Controlling idea** (`explanation`, id `rating-credits-commitments`): Rating adds two requirements to counting: the price that applied when the event happened, and, for prepaid credit, a decision whether the balance is checked as usage occurs or only when the invoice is computed.\n\n**Advances the thesis** (C4, C3): Defines credit balance and commitment and separates the real-time balance check from invoice-time rating, with the documented example of each.\n\n**Transition in:** `sequence`: A quantity per customer per period, however it was aggregated. → The step that turns it into money, and the balances it may be drawn from.\n\n**Order of paragraphs** (`prerequisite_order`): Versioned prices first because credits are drawn down at a rated amount; the definitions before the consistency question they raise; the cost of each answer last, so the section ends on the trade-off it exists for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | explanation | Rating needs the price plan as it stood when the usage happened, so price plans are versioned, and a price that changes in the middle of a period is where aggregated systems document their sharpest limits. | quotation: Stripe: \"Mid-cycle price changes drop grace period usage ... Stripe skips invoice recomputation during finalization, so any usage reported during the grace period doesn't appear on current or subsequent invoices\" (https://docs.stripe.com/billing/subscriptions/usage-based/configure-grace-period, n.d., accessed 2026-11). Orb lists \"Versioned pricing objects: Pricing changes are tracked over time\" among the inputs of an invoice (https://docs.withorb.com/architecture/query-based-billing, n.d., accessed 2026-11). |  |\n| p26 | definition | A credit balance is usage paid for or granted in advance and drawn down as usage is rated, and a commitment is a promise of minimum spend over a period, billed as a true-up if usage falls short. | quotation: Stripe: \"Billing credits are prepaid or promotional usage credit allocated through credit grants. They aren't the customer invoice balance ... or a cash balance, which holds bank transfer funds\"; \"You can't offer billing credits as stored value to your customers\" (https://docs.stripe.com/billing/subscriptions/usage-based/billing-credits, n.d., accessed 2026-11). Orb (early access): a postpaid commitment \"settles at the end ... if cumulative usage falls short of the commitment, Orb bills the difference as a true-up\"; a prepaid commitment invoices \"upfront for a pool of credits that usage draws down\" (https://docs.withorb.com/enterprise/commitments, n.d., accessed 2026-11). | `additional_support`: A rated amount. → The balances and promises a rated amount can be set against. |\n| p27 | comparison | Whether a customer with €50 of prepaid credit can use €80 worth depends on when the balance is read: at invoice time the answer is yes, with a real-time drawdown it is no, and Stripe's comparison of its two usage products (its basic meters and Metronome, the usage engine it bought in 2026) documents one of each kind. | quotation: Stripe, \"Compare basic usage-based billing and Metronome\": credit-based pricing is \"Supported (invoice time)\" on basic meters, with the footnote \"Credits are only reconciled at invoice time. Customers can exceed their balance during the cycle\", and \"Supported (real-time)\" on Metronome, where \"Usage reduces a customer's balance in real time\" (https://docs.stripe.com/billing/subscriptions/usage-based/compare-metronome, n.d., accessed 2026-11). Credits page: \"Credits apply to invoices only at the time of finalization\" (https://docs.stripe.com/billing/subscriptions/usage-based/billing-credits, n.d., accessed 2026-11). | `example`: A credit balance drawn down by usage. → The question of when it is drawn down, with a worked €50 case. |\n| p28 | analysis | The two answers are different consistency requirements with different costs: invoice-time rating needs only an eventual count and leaves the seller with credit risk, while a real-time balance puts a read of a nearly current total in the product's request path and still overshoots by whatever arrives inside its window. | fact: Stripe's 2025 post: the 30-second fast path \"is what we use to trigger billing alerts when someone has spent too much money or is running out of credits\"; \"P95 latency under 30 seconds for time-sensitive operations\" (https://stripe.com/blog/how-we-built-it-usage-based-billing, 2025-01-28). | `cause_effect`: Two times at which the balance can be read. → What each costs to build and what each leaves exposed. |\n\n### Two Acquisitions in 2026: Metronome at Stripe, Orb at Adyen\n\n**Controlling idea** (`evidence`, id `acquired-engines`): Both providers bought a usage-billing engine in 2026; Stripe documents Metronome as its recommended usage product connected by a one-way invoice push, Adyen documents no integrated product yet, token billing is a preview at one and an intention at the other, and the public record does not describe Metronome's internals.\n\n**Advances the thesis** (C5): Gives the dated facts about each acquisition and states where the evidence stops.\n\n**Transition in:** `elaboration`: Metronome and Orb named as the homes of real-time credits and raw-event billing. → Who owns each since 2026, and how far each is documented as part of its owner's platform.\n\n**Order of paragraphs** (`grouping`): Stripe's acquisition and its documented integration, then Adyen's on the same points, then the use case both cite with its release status, then the limit of all three accounts; token billing needs both owners named first, and the limit applies to everything before it and so comes last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | evidence | Stripe completed its acquisition of Metronome on 14 January 2026 and its documentation now calls Metronome the starting point for new usage integrations, connected to Stripe by a one-way push of finished invoices. | quotation: Stripe newsroom, 2026-01-14: \"has completed its acquisition of Metronome\" (https://stripe.com/newsroom/news/stripe-completes-metronome-acquisition). Documentation: \"Metronome is Stripe's primary usage-based billing platform and the recommended starting point for all new integrations. Basic usage-based billing, built on the Meters API, is a lower-level primitive that remains fully supported for existing integrations\" (https://docs.stripe.com/billing/subscriptions/usage-based, n.d., accessed 2026-11); \"Metronome handles metering, rating, and billing, while Stripe handles payment collection, tax calculation, and revenue recognition\" (https://docs.stripe.com/billing/subscriptions/usage-based/compare-metronome); \"This invoicing sync is one way, meaning Stripe doesn't send invoice data back to Metronome\" (https://docs.stripe.com/billing/how-metronome-works-with-stripe); Connect, Adaptive Pricing, Workflows and the Stripe Dashboard are listed as not supported with Metronome (https://docs.stripe.com/billing/subscriptions/usage-based/compare-metronome). |  |\n| p30 | evidence | Adyen announced the acquisition of Orb on 11 June 2026 for $335 million and closed it on 1 July 2026, runs it as a separate product that still serves other payment providers, and has published an intent to converge but no documentation of an integrated product. | quotation: Adyen press release, 2026-06-11: \"The total consideration for the transaction is $335 million\"; \"Orb stores the full event stream at scale, decoupling ingestion from invoicing\"; \"an incubator model, preserving Orb's operational continuity during the first phase of the acquisition and continuing to support multi-PSP environments\"; \"the strategic intent is convergence\" (https://www.adyen.com/press-and-media/jtrg4qd7j3p4rj). 2026-07-01: \"Both transactions officially closed on July 1, 2026\" (https://www.adyen.com/press-and-media/adyen-closes-talonone-and-orb-acquisitions-announces-leadership-updates). 2026-09-29: \"You'll soon see how we bring this unified Adyen and Orb experience to life across our platform\" (https://www.adyen.com/knowledge-hub/why-adyen-acquired-orb). No meter, usage or billing object was found in docs.adyen.com as of November 2026. | `similarity`: Stripe's acquisition and its documented integration. → Adyen's acquisition on the same points. |\n| p31 | evidence | Billing for AI model tokens is the use case both companies tie these purchases to, and as of November 2026 it is documented at Stripe as a public preview through Metronome and at Adyen only as the stated reason for buying Orb. | quotation: Stripe: \"Billing for LLM tokens is in public preview and available to all users with a Metronome account\"; \"Stripe syncs token prices for OpenAI, Anthropic, and Google models\"; token type \"(input, output, and cached tokens for supported models)\" (https://docs.stripe.com/billing/token-billing, n.d., accessed 2026-11). Adyen, 2026-09-29: \"AI models and modern APIs carry significant, variable compute and token costs\" (https://www.adyen.com/knowledge-hub/why-adyen-acquired-orb). Orb commitments are \"in early access\" (https://docs.withorb.com/enterprise/commitments, n.d., accessed 2026-11). | `additional_support`: Two acquired engines and how far each is documented. → The use case both owners cite, and its release status at each. |\n| p32 | claim | The evidence stops at three points: Metronome's internal design is not described in the sources used, so the chapter places it on neither side of the design choice; both companies state an intent to unify (Stripe blog post, 23 January 2026; Adyen press release, 11 June 2026) and neither gives a date or says what becomes of the separate engines; and the absence of an Adyen meter is an absence in public documentation, not a statement from Adyen. | reasoning: Sources read for this chapter: Stripe's documentation pages on Metronome describe the integration and feature tables only; Adyen's three publications state intent; Stripe's blog post of 23 January 2026 says 'we'll build a unified roadmap for one monetization platform' without a date; no docs.adyen.com page on Orb was found. | `contrast`: What each company has published, including what is still in preview. → What neither has published, and what this chapter therefore does not claim. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): On metering the documented difference is that Stripe has a meter primitive with published rules, a published pipeline design and a documented acquired engine, while Adyen's side consists of Orb's own documentation and Adyen's statements of intent.\n\n**Advances the thesis** (C5, C3): Sets the documented facts of the earlier sections side by side and reads them for an integrator.\n\n**Transition in:** `conclusion_summary`: The documented facts about meters, designs, credits and acquisitions. → The same facts in one table, with the author's reading of each difference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison (table) | Six aspects separate the two in the public record: the meter primitive, the acquired engine and its integration status, the published design, the time rules, the credit balance, and token billing. | table: Rows: own meter primitive (Stripe Billing Meters / none found in Adyen documentation); acquired engine (Metronome, completed 2026-01-14, documented one-way invoice push / Orb, closed 2026-07-01, separate and multi-provider, integration \"soon\"); published design (Stripe 2025 post: Flink, 30-second and five-minute paths / Adyen: not public; Orb's documentation: raw events and query); time rules (35 days, 1–72 hours, 24 hours / Orb's documentation: 12-hour grace period, amendments archive events); credit balance (meters invoice-time, Metronome real-time / Orb documents a credit ledger and early-access commitments); token billing (public preview through Metronome / stated use case, no documented Adyen product). All cited in the sections above. |  |\n| p34 | recommendation | An integrator on Stripe chooses between two documented usage products and sets the three rules in configuration; an integrator on Adyen chooses a usage engine as a separate system, Orb or another, and connects it to payments itself. | fact: Orb documents a default event-reporting grace period of 12 hours, configurable per account, and amendments in which \"Old events are marked as archived\" (https://docs.withorb.com/events-and-metrics/reporting-errors, n.d., accessed 2026-11). | `cause_effect`: The table. → What to do differently on each provider. |\n\n### In Practice at Larkfield: Three Rules for the SMS Meter\n\n**Controlling idea** (`example`, id `in-practice`): Larkfield repairs its SMS billing by choosing the identifier and the three rules on purpose and by keeping its own raw events, and it changes neither product nor pipeline.\n\n**Advances the thesis** (C1, C2, C3): Works the March invoice through the frame and shows a late-event policy written for a real product.\n\n**Transition in:** `example`: Rules with documented defaults on the provider Larkfield bills with. → The same rules applied to Studio Noord's March invoice.\n\n**Order of paragraphs** (`problem_solution`): The diagnosis of the invoice, then the policy that would have prevented it, then what Larkfield decided not to build; the policy answers the diagnosis line by line.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | process | Laid against the documented rules, the March invoice has two separate causes: the 180 re-sent events carried no identifier of Larkfield's own, and the 96 late events were accepted and missed a one-hour cut-off. | table: Larkfield (fictional) arithmetic: sent 1,240; duplicates +180; late −96; metered 1,324; allowance 500; billed overage 824 × €0.07 = €57.68; correct overage 740 × €0.07 = €51.80; overcharge €12.60 (180 × €0.07); undercharge €6.72 (96 × €0.07); net €5.88. |  |\n| p36 | recommendation | The policy Femke's team writes has four lines: the message id as the event identifier, a 24-hour finalization grace period for invoices with metered prices, cancellation for errors found within a day, and a credit note or a line on the next invoice for anything found after finalization. | scenario: Larkfield (fictional), May 2027: identifier = Larkfield's message id; grace period raised from 1 hour to 24 hours for invoices with a metered price (studios are charged a day later); Studio Noord receives a credit note for €12.60 and the 96 late messages are a €6.72 line on its next invoice. Uses Stripe's documented settings (grace period up to 72 hours; cancel within 24 hours). | `problem_solution`: Two causes, each a default nobody chose. → The policy that chooses them. |\n| p37 | example | Larkfield keeps every message event in its own data warehouse and compares its count per studio with the meter's summary during the grace period, which gives it the raw-event property without a new pipeline or a second billing product. | scenario: Larkfield (fictional): the data warehouse holds one row per message (message id, studio, sent-at); a job run during the 24-hour grace period compares the count per studio with the meter's summary and opens an item for any difference. At about 3.5 events per second (assumption) the meter API's documented limit is not approached, and Larkfield sells no prepaid credit, so it stays on meters; Stripe says existing meter integrations \"don't need to migrate\". | `additional_support`: A policy for late and duplicate events. → The evidence Larkfield keeps so that an invoice can be explained, and what it chose not to build. |\n\n### When It Goes Wrong: Replays, Unseen Rejections, Long Outages and Repricing\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): With the rules in place metering still fails in four ways: a replay older than the duplicate window, a rejection nobody saw, an outage longer than the cut-off, and a price change that meets late usage.\n\n**Advances the thesis** (C1, C2): Gives detection and recovery for each failure of a system that has set its rules, showing that each failure is one of the time limits being crossed.\n\n**Transition in:** `contrast`: A policy that works in the ordinary month. → The four ways it is exceeded, and what to do in each.\n\n**Order of paragraphs** (`order_of_importance`): From the failure that overcharges customers (the one they notice) to the ones that silently undercharge, ending with the one that depends on a rare combination.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | cause_effect | A batch replayed after the duplicate window has passed is counted again even though every event carries the right identifier, so replays of old data need a check on the producer's side. | fact: Stripe enforces identifier uniqueness \"within a rolling period of at least 24 hours\" (https://docs.stripe.com/api/billing/meter-event/create, n.d., accessed 2026-11); Orb guarantees \"that duplicates are never processed within the account grace period\" (https://docs.withorb.com/events-and-metrics/event-ingestion, n.d., accessed 2026-11). |  |\n| p39 | cause_effect | An invalid event is rejected after the API call has already succeeded, and the rejection arrives as an event the integration must subscribe to, so an unmonitored meter under-bills in silence. | fact: Stripe: \"Stripe asynchronously processes meter events. If we find an error, we create one of the following Events\": `v1.billing.meter.error_report_triggered`, `v1.billing.meter.no_meter_found`; codes include `meter_event_customer_not_found` and `timestamp_too_far_in_past` (https://docs.stripe.com/billing/subscriptions/usage-based/recording-usage-api, n.d., accessed 2026-11). The 2025 post: \"when processing does fail, developers don't necessarily know it right away\" (https://stripe.com/blog/how-we-built-it-usage-based-billing). | `contrast`: A failure that bills too much. → A failure that bills too little and says so only to those listening. |\n| p40 | cause_effect | An outage longer than the grace period puts usage after the cut-off, and one longer than the acceptance window gets it rejected, and in both cases the amount can be recovered only through the correction path. | fact: Stripe: usage reported beyond the grace period is included in meter summaries \"but we don't add that usage to the finalized invoice or the next invoice\" (https://docs.stripe.com/billing/subscriptions/usage-based/configure-grace-period, n.d., accessed 2026-11); timestamps older than 35 days are rejected (`timestamp_too_far_in_past`) (https://docs.stripe.com/billing/subscriptions/usage-based/recording-usage-api, n.d., accessed 2026-11). | `additional_support`: Usage lost to a rejection. → Usage lost to time: the cut-off first, then the acceptance window. |\n| p41 | cause_effect | A price changed in the middle of a period is the least visible failure, because on Stripe's meters it cancels the grace period for that subscription and late usage for the period is then not billed on any invoice. | fact: Stripe: \"If a subscription item's price changes during a billing cycle (for example, because of a mid-cycle upgrade or price update), the grace period doesn't capture late usage\" (https://docs.stripe.com/billing/subscriptions/usage-based/configure-grace-period, n.d., accessed 2026-11). | `additional_support`: Limits crossed by outages. → A limit removed by a price change. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Every mechanism in the chapter is a bounded window: the duplicate check, the acceptance of old events, the grace period before the invoice closes, the cancellation of an event, the aggregation window behind an alert. Metering is correct inside those windows by construction and outside them only by policy, so the engineering question is never whether events will fall outside but which window they fall out of and what the written rule is for that case. The choice between aggregating and keeping raw events is the same question asked about the past: how far back can the invoice still be recomputed and explained.\n\n**So what:** A team that has written its windows down can answer a customer who says \"this invoice is wrong\" from its own events, and knows in advance which usage it will never bill. A team that inherited defaults finds out both from a support ticket.\n\n**Callback:** Studio Noord's March invoice: 1,240 sent, 1,324 billed. The three counts were the same events seen through different windows: with and without a producer identifier, before and after a one-hour cut-off. No number was a bug in the meter; each was the documented result of a rule Larkfield had not chosen.\n\n**Takeaway** (`course_of_action`): Before the first usage invoice, write four lines: who assigns the event identifier and for how long the receiver remembers it; how old an event may be and still be accepted; when the period's invoice closes; and how usage found after that is charged or credited. Then keep your own raw events for as long as an invoice can be questioned.\n\n**Hand-off** to [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html): `sequence`: An amount owed for a period, whether fixed by the plan or counted from usage, and the cut-off after which it stops changing. → The step from owed to paid: the invoice as a frozen document, the attempts made against it, and the process that runs when the first attempt fails.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis (list) | Established: acceptance and billing are separate rules, duplicates are removed only by a supplied identifier inside a bounded period, and the two designs for volume each have one documented example. |  |  |\n| p43 | synthesis (list) | Depends on context: the length of the grace period, raw events versus aggregation, a real-time balance versus invoice-time rating, and Metronome or Orb versus a basic meter. |  | `contrast`: What the documentation establishes. → What changes with volume, pricing model and how much credit risk the seller accepts. |\n| p44 | recommendation (list) | The author's synthesis: metering is a set of bounded windows, correct inside them by construction and outside them only by policy, so write the policy first and keep the raw events yourself even when the provider aggregates. |  | `additional_support`: What is established and what depends. → The author's own position. |\n| p45 | recommendation (list) | Nine questions let the reader test a usage-billing design or a provider's metering product in a review. |  | `sequence`: The author's position. → Questions that apply it. |\n| p46 | transition | Once the count is closed there is an amount owed for a period, and the next chapter follows it from a finalized invoice to cash, including what happens when the first payment attempt fails. |  | `sequence`: An amount for a period that has stopped changing. → The invoice as a frozen document and its collection. |\n\n## Non-goals\n\n- Subscriptions, billing periods, anchors, proration and the billing scheduler. See [Charging Again and Again: Subscriptions and the Billing Engine](subscriptions-and-billing-engines.html).\n- Invoice finalization as a legal act, credit notes, payment attempts, retries and dunning. See [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html).\n- Tax on usage charges. See [Whose Tax, at What Rate: Tax Calculation in the Payment Path](billing-and-payment-tax.html).\n- How usage, credits and commitments affect revenue schedules and deferred revenue. See [Cash Is Not Revenue: Revenue Recognition and the Hand-off to Finance](billing-revenue-recognition.html).\n- Idempotency keys for payment requests and API rate limits in general. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html), [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html).\n- Stored value, e-money and when a prepaid balance needs a license. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Stream-processing internals (Flink checkpoints, watermarks) beyond what Stripe's post states.\n- The strategic reading of the Metronome and Orb acquisitions. See [Two Ways to Build It: The Architectural Bets Compared](stripe-and-adyen-bets-compared.html), [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Metronome's internal architecture, and whether it will be merged with Stripe Billing's meters, is not described in the sources used.\n- Whether Stripe retains raw meter events behind the five-minute durable path, and how its pipeline deduplicates, is not stated in the 2025 post.\n- As of 17 November 2026 no Adyen documentation of an integrated Orb product was found; the date and form of the announced convergence are unknown.\n- Stripe's 2025 post gives 100,000 events per second 'per business' and 'per user'; current documentation gives 10,000 per second by default and 200,000 through sales. The chapter uses the documentation for limits.\n- The research brief dates Adyen's knowledge-hub article on Orb 2026-10-19; the page fetched on 17 November 2026 shows 'September 29th, 2026' (datePublished 2026-09-29, modified 2026-10-30) and the title 'Why billing and payments belong together'. The chapter cites 29 September 2026.\n- Whether Stripe's graduated prices on a meter are the exact mechanism behind a plan allowance is not verified; the chapter describes Larkfield's allowance without naming the price configuration.\n\n## Decision log\n\n- **2026-11-17** — Flow rubric (sound with notes) acted on: token billing moved from the rating section to the acquisitions section so that Metronome and Orb are introduced as acquired before it; the Metronome clause removed from the inference paragraph of the two-designs section; the two Stripe products named where the credit comparison first cites them; the post-finalization correction path stated in the Stripe rules section; the third count added to the opening. Not acted on, left for the author: swapping the thesis paragraph and the journey paragraph of the introduction (the style guide fixes that order); an explicit ordering reason for the comparison section before the Larkfield section. Second run after the move (sound with notes): the time rules of Orb added to the Orb paragraph of the two-designs section so the comparison table only collects them; not acted on: a separate item on how each design handles duplicates (the Stripe post does not describe deduplication, so there is no evidence for one side), and merging the reading of the comparison table into the acquisitions section (the comparison section is fixed by the style guide). Rejected: Reordering the introduction against the style guide.\n- **2026-11-17** — The Larkfield example is one studio's invoice with small numbers (1,240 messages, €0.07) and an illustrative total volume of about 9 million messages a month, so that throughput is visibly not the problem. New local facts (plan allowances, Studio Noord's plan, the May 2027 policy) are appended to the scenario ledger. Rejected: A high-volume fictional example, which would support the counter view the thesis disputes.; Inventing a platform-wide overcharge total.\n- **2026-11-17** — The duplicate-check period (Stripe: at least 24 hours; Orb: the account grace period) is treated as a limit on the identifier, not as a fourth rule, to keep the journal spec's 'three time rules' intact. Rejected: Presenting four rules, which would contradict the thesis copied from the journal spec.\n- **2026-11-17** — Orb's architecture is quoted from Orb's documentation and labeled as Orb's statement about Orb throughout; Metronome is placed on neither side of the design choice (acceptance criterion AC-3). Rejected: Inferring Metronome's design from its feature list.; Describing Orb's design as Adyen's platform.\n- **2026-11-17** — Stripe's API reference for meter events was fetched in addition to the brief, because it states the uniqueness period the brief listed as an open question. Rejected: Leaving the duplicate window as 'not stated'.\n\n## Sources\n\n- **Internal**\n  - PLAN.md, chapter contract 28 — Scope, owned terms (usage event, meter, rating, credit balance, commitment), the Larkfield thread (SMS overage billing).\n  - journal-spec.json, entry usage-metering-and-rating and its neighbours — Intent, acceptance criteria, thesis, role, transition in, and the next chapter's transition.\n  - _research/brief-billing-and-revenue.md, Part 2, sections 1.9, 1.10, 7.2, Key numbers, Open questions — Verified quotations and the list of what is not public.\n  - _research/scenario-ledger.md — Studio plans, the €0.07 SMS overage, the billing integration and its owner, the cast.\n- **External**\n  - docs.stripe.com (n.d., accessed 2026-11-17): recording-usage-api, configure-grace-period, meters/configure, api/billing/meter-event/create, usage-based, compare-metronome, how-metronome-works-with-stripe, billing-credits, token-billing — Stripe's meter rules, limits, credits, Metronome's documented role and token billing status.\n  - Taras Mitran and Karan Dhabalia, \"How we built it: Usage-based billing\", Stripe blog, 2025-01-28 — Stripe's meter pipeline design.\n  - Stripe newsroom, \"Stripe completes Metronome acquisition\", 2026-01-14 — Completion date.\n  - docs.withorb.com (n.d., accessed 2026-11-17): architecture/query-based-billing, events-and-metrics/reporting-errors, event-ingestion, high-throughput-ingestion, enterprise/commitments — Orb's documented design, grace period, amendments, rollups and commitments.\n  - Adyen press releases 2026-06-11 and 2026-07-01; Adyen knowledge hub, Blake Breathitt, 2026-09-29 — Orb acquisition terms, closing date, operating model and stated intent.\n\n## Changelog\n\n- **2026-11-17** — Verification pass: 84 claims checked (79 confirmed, 3 corrected, 1 hedged, 0 unsupported and removed or relabeled, 0 unreachable; 1 not checked, owned by chapter 27); the remark that Metronome's engine “already powers some of the most ambitious AI companies” is now attributed to Patrick Collison as quoted in Stripe's release, the grace period is stated as one hour by default and at most 72 hours, and Orb's prepaid credit ledger has a source.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes).\n- **2026-11-17** — First version, written from the chapter contract, the billing research brief and the scenario ledger; intent, thesis and role copied from the journal spec.\n- **2026-11-17** — Absence audit: 'no public source says whether the engines will be merged' narrowed (Stripe blog post of 23 January 2026 states a unified roadmap for one monetization platform; Adyen states convergence as intent; neither gives a date); p32 updated. Adyen meter absence re-tested against the documentation full text, sitemap, site and web search: holds. Raw-event retention absence re-tested against Stripe's documentation: holds.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n- **2026-11-17** — Revision after draft check round 1: introduction reordered (journey paragraph p03 moved before the thesis p02, transitions on both sides fixed; Mila introduced); Orb and Metronome named at first use and in the roadmap; date of the SMS policy aligned with the ledger (May 2027; the decision log said April); scene opens from the claim and names the queue; forced connectives removed; the contract table's result stated and its configuration row restored; the 'Versioned pricing objects' sentence completed; Connect, account grace period, finalized, grace period and AI-model tokens glossed. No fact changed.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);

                const wrap = document.createElement('span');

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
