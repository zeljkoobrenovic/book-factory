<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The steps by which payment moved from cash settled on the spot to today's layered infrastructure, and the concept each step introduced: credit and the record of a debt, the check and clearing, the card and its guarantee, the card network and its four parties, authorization at a distance, the payment provider, stored credentials and recurring charges, and the platform that stands between payer and seller.\n- **Know:** For each step, both sides of it: what it made possible that could not happen before (a sale to a customer with no money until payday, to a stranger, to someone far away, to someone not present at all, by a seller too small to arrange card acceptance), and what it cost (a new party, a new delay, a new copy of a record or a new way to be cheated).\n- **Believe:** Each step was a good bargain for buyer and seller alike: it opened trade that the earlier way of paying could not carry, and its cost was accepted for that reason. No step was ever removed, so today's complexity is the sum of those bargains, not a design.\n- **Believe:** Given those layers, the failure patterns of the next page are what one should expect, not signs of careless engineering.\n- **Be able to:** Given a term from a later chapter (clearing, acquirer, authorization, chargeback, token, payment facilitator), say which step of the walk introduced it and what limit it answered.\n- **Be able to:** Given a failure pattern's name, say which layer makes it possible.\n\n**Audience:** A software engineer or architect who is new to payments and has just read the introduction: they have the claim that an API's answer is the first of several promises, and no payments vocabulary yet.\n\n**Already knows:**\n\n- APIs, webhooks, retries, databases and what a ledger-like sis\n\n**Question:** How did paying for something, which was once settled on the spot with cash, come to involve so many parties, records and delays?\n\n> **Claim:** Paying became complicated one good bargain at a time: each new way to pay (credit at the shop, the check, the card, the card network, payment at a distance, the stored card, the platform) made possible a sale that could not happen before, to the gain of buyer and seller alike, and paid for it with a promise, a party to keep it, a record of it and a delay before it is kept; no earlier step was ever taken away, so a payment today carries all of them at once.\n\n**Disputed by:** The view that payment systems are complicated because they are old, badly designed or protected by incumbents, so that a clean redesign, or a new technology, would make paying simple again.\n\n**So what:** A reader who sees each step as a bargain that both sides wanted stops looking for the one simplification that removes them, expects a failure wherever a promise and its keeping are separated, and reads the sixteen patterns of the next page as the price of what the steps made possible.\n\n**How and why:** With cash, goods and payment change hands at once and nothing is left open, but only people who are in the same place and have the money now can trade. Every later step lets more people trade (the customer who is paid next week, the stranger, the buyer far away, the subscriber who is not there, the seller too small to deal with a bank) by separating goods and payment a little further, in distance, in time or in who is involved. Each separation is bridged by a promise that someone records and someone else must later honor. A promise can be forgotten, made twice, broken or forged, and each step added its own way for that to happen; the dates and institutions on the page are a small set of sourced anchors, and the account is a simplification that follows the ideas.\n\n**Supporting claims**\n\n- **S1** — With cash, goods and money change hands at once and nothing is left open; the first step away from it, a shop selling on a promise, already has what every later system has: a sale that both sides gain from, a promise, a record of it, trust, and someone who loses if the promise is broken.\n- **S2** — Each later way of paying (the check, the card, the card network, payment at a distance, the stored card, the platform) made possible a sale that could not happen before, to the gain of buyer and seller alike, and paid for it with a promise, a party to keep it, a record of it and a delay before it is kept.\n- **S3** — Each addition brought its own way to go wrong: a new party to depend on, a new delay, a new copy of a record or a new way to be cheated.\n- **S4** — No step was ever removed, so one payment today carries all of them at once, and the failures the next page names are the price of what the steps made possible.\n\n## Role in the part\n\nExplains, before the failure patterns are named, where the parties, records and delays behind a payment came from, what each of them made possible and what it cost, and introduces in plain words the vocabulary Part I then teaches properly. Supports PF-1 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in cash to today: the steps are in the order the ideas accumulated, which is roughly the order of the dates; where a step's parts overlap in time (mail order and the internet, the provider and the standards) they are placed where the reader needs the concept; `problem_solution` in inside each step: the limit, the addition and its name, the cost, the answer to the running question)\n\nEach step uses only concepts that earlier steps introduced: the ledger before clearing, clearing and settlement before the card network reuses them, the issuer before the acquirer, authorization before the chargeback that undoes it, the provider before the token it issues, the token and the provider before the platform that is built on both. Moving the network before the check would leave 'the money follows later by clearing and settlement' unexplained; moving the platform before the stored card would describe balances held for sellers before the reader knows a provider exists. Cash and the village shop come first because they set the baseline and plant the idea of a recorded promise before any institution appears, and today's payment comes last because it is the sum the conclusion counts.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Hand a baker a coin and take the bread, and the payment is over before you reach the door. When Mila Janssen taps 'Pay' for a €120 class pass in the introduction, the screen says 'Payment successful' in two seconds and no money has moved; the studio is paid two days later, and the payment can be undone for months.\n\n**Bridge:** Everyone has paid with cash, a card and an app, and an engineer has seen that a payment API returns in a second or two. → The two acts look alike and are not: between the coin and the tap lie other ways of paying, each of which let someone buy or sell who could not before, and the page walks through them in the order they were added.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 and 2, in concrete words: the notebook, the check, the card, the wait for the money) and paragraph p02): Every new way of paying let someone buy or sell who could not before (the family before payday, the seller in another town, the shop facing a stranger, the buyer at home), and the price each time was a promise, someone to keep it, a record of it and a wait for the money; none was ever retired, so one tap in an app today rests on all of them.\n\n**Roadmap** (Paragraph p03, with the IN THIS SECTION and KEY POINTS callouts):\n\n- The walk starts with cash and with the first complication of it, a village shop that sells on a promise. *Kept in:* cash, shop-credit.\n- It continues through the check, the card and the card network. *Kept in:* check, card, card-network.\n- Then paying at a distance, the stored card and the platform. *Kept in:* distance, stored-card, platform.\n- It ends on today's payment, shown in the book's fictional case, with one question answered at every step: when is it really paid, and who is on the hook until then? *Kept in:* today.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Paying a baker with a coin is over at once, while Mila's tap in an app shows success in two seconds although no money has moved and the payment stays open for months. | scenario: A coin for a loaf (illustration); Mila's €120 class pass from the introduction (fictional; scenario ledger). |  |\n| p02 | claim | What lies between the two is a series of ways of paying, each a bargain that let someone buy or sell who could not before, paid for with a promise and a wait, and none ever retired, told here as a simplified account that follows the ideas and not the full history. |  | `cause_effect`: The coin and the tap, which look alike and are not. → The claim that explains the difference, and the declaration that the account is simplified, with few sourced dates and no motives attributed. |\n| p03 | transition | The page takes nine steps, from cash to today, tells each as a limit, an addition with its name, what it made possible for buyer and seller and what it cost, and answers one question at every step: when is it really paid, and who is on the hook until then? | figure: Figure: one coin-for-bread exchange at the bottom and a layer stacked on it for each later step, up to today's app payment. | `sequence`: The claim and the simplification. → The route, the shape of each step and the question that is asked at each. |\n\n## Sections\n\n### Cash: Paid on the Spot\n\n**Controlling idea** (`description`, id `cash`): With cash, goods and money change hands in the same moment, so no promise, record or third party is needed, and that simplicity holds only while buyer and seller are in the same place with the money in hand.\n\n**Advances the thesis** (S1): Sets the baseline in which nothing is left open, and names the three limits (presence, money in hand, carrying it) that the later steps remove.\n\n**Transition in:** `elaboration`: The roadmap's first stop: the form of paying everyone understands. → What makes cash simple, stated exactly, so that each later step can be measured against it.\n\n**Order of paragraphs** (`large_to_small`): The complete case first, then its conditions, then the answer to the running question; the conditions would mean nothing before the reader has seen what they protect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | When a customer hands a coin to a baker and takes the bread, the payment is complete in that moment: nobody has promised anything, nobody needs a record, and no one stands between them. | scenario: An illustration, labeled as one: a customer buys a loaf for a coin at a baker's counter. |  |\n| p05 | analysis | Cash lets two strangers trade without trusting each other: the seller needs to know nothing about the buyer, and the buyer leaves owing nothing. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p06 | analysis | Cash is simple only under three conditions (both people are in the same place, the buyer has the money now, and someone carries and guards it), and the steps that follow begin where one of those conditions did not hold. | reasoning: Cash can be lost, stolen or forged, and it cannot be handed over at a distance or before it has been earned (common experience, stated as such).; figure: Figure: a customer and a baker at a counter, a coin and a loaf changing hands in the same moment, with nothing else in the picture. | `contrast`: What the step made possible for both sides. → The price of it: the three conditions it depends on, which the later steps relax one at a time. |\n| p07 | analysis | At this step the answer to the page's question is: at once, and nobody is on the hook. |  | `conclusion_summary`: The cash exchange and its three conditions. → The step's answer to the running question, longer than the one before. |\n\n### The Village Shop: A Promise in a Notebook\n\n**Controlling idea** (`example`, id `shop-credit`): Even between neighbors paying was never quite simple: a shop that hands over goods before payday creates a debt, a record of it, a need for trust and a customer who might not pay.\n\n**Advances the thesis** (S1): Shows that the first separation of goods from money, with no technology at all, already needs a promise, a record and someone who carries the risk.\n\n**Transition in:** `contrast`: Cash settles everything at once, but only if the buyer has the money now. → The oldest way around that condition: goods today, money on payday.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The notebook cannot be named before the reader has seen the promise it records.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | context | A customer who is paid at the end of the month needs bread in the middle of it, so a shopkeeper who knows the family hands over the goods on a promise to pay on payday. | scenario: An illustration, labeled as one and as common practice rather than a fact about a time and place: a village shop that sells 'on the book' until payday. |  |\n| p09 | definition | The shopkeeper writes each promise in a notebook, and that list of who owes what is a ledger, the kind of record every later payment system also keeps. | example: The notebook: one line per purchase, a line when the debt is paid; the book's term for such a record is the ledger, taught in the payment-ledgers chapter. | `cause_effect`: Goods handed over on a promise. → What the promise requires: a written record, named as the ledger. |\n| p10 | analysis | The promise is a good bargain for both sides: the family eats before payday, and the shopkeeper makes a sale today and keeps a customer who might otherwise go without or go to another shop. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p11 | cause_effect | The promise costs the shopkeeper two things: the customer may never pay, and the notebook and the customer's memory may disagree, so the two accounts have to be compared, which the book calls reconciliation. | reasoning: The shopkeeper has handed over the goods and holds only a line in a book; a missed line or a line written twice changes what is owed. | `contrast`: What the step made possible for both sides. → The price of it: what they cost: the risk of non-payment and two records that can disagree. |\n| p59 | analysis | Selling on promises makes the shopkeeper manage risk: deciding who gets credit, how much, when to stop and how prices cover the debts that are never paid, which is the risk management every later way of paying also does. | reasoning: The four decisions of a shopkeeper who gives credit, stated as an illustration of common practice with no dated fact: whom to trust (the known family, not the traveler), a limit (a week of bread), a stop (no new goods while an old debt is open), and a margin in prices for losses. Linked to the chapter that owns fraud and risk.; figure: Figure: a shopkeeper hands bread to a customer with empty pockets and writes in a notebook, payday is circled on a wall calendar, and a traveler is refused credit. | `cause_effect`: The risk that a customer never pays. → What the shopkeeper does about it, and its name. |\n| p12 | analysis | At this step the answer to the page's question is: on payday, if the customer comes; until then the shopkeeper is on the hook, with a notebook as the only proof. |  | `conclusion_summary`: The debt, the notebook, its two risks and how the shopkeeper manages them. → The step's answer to the running question, longer than the one before. |\n\n### The Check: A Promise on Paper, Carried Between Banks\n\n**Controlling idea** (`explanation`, id `check`): The check let people pay beyond the circle of those who kept a notebook for them, and at a distance, by turning the promise into a written order on a bank; the price was two banks in the middle, days of waiting and a paper that could come back unpaid.\n\n**Advances the thesis** (S2, S3): First step in which institutions stand between payer and payee: introduces clearing and settlement and the delay between receiving a payment and having the money.\n\n**Transition in:** `problem_solution`: Shop credit works only where the shopkeeper knows the customer. → A promise a stranger can accept because a bank stands behind the account it is drawn on.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. Clearing and settlement are defined here because every later step reuses them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | context | A notebook works only between people who know each other and cash is risky to carry in large sums, so people who kept their money in a bank began to pay with a written order telling their bank to pay a named person: a check. | reasoning: Stated as common practice: a seller in another town has no notebook entry for the buyer, and carrying cash there is a risk. |  |\n| p14 | definition | A check is paid only after the seller's bank has collected it from the buyer's bank; banks exchange such claims in batches, which is called clearing, and pay each other the difference, which is called settlement. | source: Federal Reserve History, 'Check Payments' (28 September 2023): before the Federal Reserve, 'Banks also exchanged checks locally through institutions known as clearinghouses', and otherwise sent them 'through correspondent bank'. The Clearing House, 'Our History' (n.d., accessed November 2026): the New York banks' association 'dates back to 1853'. | `cause_effect`: A written order on the buyer's bank. → What has to happen between the two banks before the seller has money: clearing, then settlement. |\n| p15 | analysis | With a check a buyer can trade with a seller in another town without carrying cash, and the seller wins a sale that could not have been paid in coins. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p16 | cause_effect | The check added two banks and days of waiting between handing over the goods and having the money, and it could come back unpaid if the account was empty, because the paper was a claim on money and not money. | quotation: Federal Reserve History (2023) on collection through chains of correspondent banks: 'a check wound its way through a series of banks based on their correspondent relationships'.; figure: Figure: a buyer in one town hands a check to a seller in another; the paper travels between two banks while days pass on a calendar, and one check comes back unpaid. | `contrast`: What the step made possible for both sides. → The price of it: what the mechanism cost: parties in the middle, a delay, and the bounced check. |\n| p17 | analysis | At this step the answer to the page's question is: when the buyer's bank has honored the check, days later; until then the seller is on the hook, holding paper. |  | `conclusion_summary`: The two banks, the delay and the check that can bounce. → The step's answer to the running question, longer than the one before. |\n\n### The Card: Someone Else Guarantees the Shop Is Paid\n\n**Controlling idea** (`explanation`, id `card`): The payment card moved the risk of an unknown customer from the shop to a company that pays the shop and collects from the customer later, in exchange for a fee and for the shop joining that company's scheme.\n\n**Advances the thesis** (S2, S3): Introduces the guarantee by a third party, the issuer and the fee the shop pays for being paid for certain.\n\n**Transition in:** `problem_solution`: A check from a stranger may bounce, and the seller finds out days later. → A third party that promises the shop it will be paid, whatever the customer later does.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The fee comes after the guarantee because it is the price of it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | context | A shop cannot tell whether a stranger's check is good until days after the goods have left, so many shops took checks only from people they knew. | reasoning: Follows from the check step: the seller carries the risk until the buyer's bank pays (stated as common practice). |  |\n| p19 | definition | A card is a promise by a third party: a company gives its customer a card, pays the shops that accept it, and collects from the customer afterwards; the bank or company that gives out the card and stands behind it is the issuer. | source: Diners Club's history page (n.d., accessed November 2026) dates its card to 1950 and calls it 'the world's first multipurpose charge card' (the company's own description). Visa's history page (n.d., accessed November 2026): '1958 Bank of America launches BankAmericard, the first card with a \"revolving credit\" feature' (Visa's own description). | `problem_solution`: The shop's risk with strangers. → The party that takes that risk over, named as the issuer, with two sourced anchor dates. |\n| p20 | analysis | With a card the shop can sell to a stranger and still count on being paid, and the customer can buy without cash and pay later. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p21 | cause_effect | The guarantee has a price on both sides: the shop receives a little less than the price, the card company now carries the customers who do not pay, and the card works only in shops that have signed up with that company. | reasoning: Common arrangement, stated as such: the shop is paid the price less a fee; how card payments are priced is the subject of the payment-economics chapter.; figure: Figure: a customer the shop does not know shows a card; behind the customer the card company pays the shop, keeps a fee and holds a bill for the customer. | `contrast`: What the step made possible for both sides. → The price of it: what that costs: a fee, a party that must be trusted to pay, and a card that works in few places. |\n| p22 | analysis | At this step the answer to the page's question is: for the shop, when the card company pays it, and that is now certain if the shop followed the rules; the card company is on the hook for the customer until the monthly bill is paid. |  | `conclusion_summary`: The guarantee and its price. → The step's answer to the running question, longer than the one before. |\n\n### The Network: Two Banks, Shared Rules and an Answer in Seconds\n\n**Controlling idea** (`explanation`, id `card-network`): Card networks let a card from any member bank work at any member bank's shop, which needed two banks per payment, shared rules and an approval that travels as a message in seconds while the money follows days later.\n\n**Advances the thesis** (S2, S3): Introduces the acquirer, the card network, authorization and interchange, and the separation of the answer from the money on which most later failures rest.\n\n**Transition in:** `problem_solution`: A card works only in the shops its own issuer has signed up. → A system that many banks join, so the customer's bank and the shop's bank can be different banks.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The acquirer comes before authorization because the question is asked between the two banks; interchange comes after it because it is paid when the money moves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | context | A card issued by one bank was of little use in a town where that bank had signed no shops, and no single bank could sign every shop and every customer. | reasoning: Follows from the card step: acceptance is limited to one company's shops. |  |\n| p24 | definition | In a card network the customer's bank and the shop's bank are two different members of one system with shared rules; the shop's bank is the acquirer, and the network itself issues no cards and holds no accounts. | source: Visa's history page (n.d., accessed November 2026): '1976 BankAmericard becomes Visa'. Visa's Form 10-K for fiscal 2026 (5 November 2026), as quoted in journey-of-a-payment: the 'four-party' model, and 'Visa is not a financial institution. We do not issue cards, extend credit or set rates and fees'. | `problem_solution`: One bank cannot sign everyone. → The network and the second bank, the acquirer; the four-party model. |\n| p25 | definition | Because the shop knows neither the customer nor the customer's bank, it asks through the network, before handing over the goods, whether the issuer will stand behind this payment, and the issuer's answer, given in seconds, is the authorization. | source: Stripe's explainer 'ISO 8583: The message standard behind card authorisations' (updated 18 September 2026): the standard was 'Published in 1987' and 'defines the structure of messages between acquirers and card issuers during a transaction'. | `cause_effect`: Two banks that do not know each other's customers. → The question asked before the goods are handed over, and its name. |\n| p26 | explanation | The authorization moves no money: the money follows a day or more later through the clearing and settlement the check introduced, and part of the shop's fee is passed to the issuer as interchange. | source: Mastercard's Form 10-K for 2025, as quoted in journey-of-a-payment: routing for approval, then exchange of information, then exchange of funds; interchange is taught in payment-economics. | `contrast`: An answer that arrives in seconds. → What the answer is not: the money, which follows later by clearing and settlement, with the fee shared as interchange. |\n| p27 | analysis | With a network the customer has one card that works in any member's shop and the shop can take a card from any member bank, so a stranger can walk out with the goods seconds after asking. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p28 | cause_effect | The network's cost is that the answer and the money now travel separately between parties that cannot see each other: an approval can be taken for the money, an answer can be lost on the way, and the banks settle in daily totals in which one payment cannot be seen. | reasoning: A shop holds an approval and no money; a lost reply leaves the shop not knowing whether the issuer said yes; a daily net amount covers thousands of payments. | `contrast`: What the step made possible for both sides. → The price of it: three new ways to go wrong that this separation creates. |\n| p29 | analysis | At this step the answer to the page's question is: promised in seconds, moved between the banks a day or more later, and paid to the shop after that; the issuer is on the hook to the acquirer, and the acquirer to the shop. |  | `conclusion_summary`: The split between the answer and the money. → The step's answer to the running question, longer than the one before. |\n\n### Paying at a Distance: A Number Instead of a Card\n\n**Controlling idea** (`explanation`, id `distance`): Paying by mail, telephone and then the internet replaced the card in the customer's hand with a typed number, which let anyone who knew the number pay with it and brought the right to take money back, rules for card data and the payment provider.\n\n**Advances the thesis** (S2, S3): Introduces the chargeback, card data as something to protect and the payment provider, and shows why a payment can be made twice once software sends the request.\n\n**Transition in:** `problem_solution`: The network still assumes a customer at the counter holding the card. → What changes when only the card's number travels.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The section holds two limits: first that only a number travels (answered by the chargeback and the rules for card data), then that the shop is now software (answered by the provider); the first pair comes before the provider because it is part of what a provider takes on for a shop.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | A customer who orders from home cannot hand over a card, so the shop receives only the number printed on it, and the shop can no longer check that the person paying is the person the card belongs to. | reasoning: Stated as common practice for orders by mail, telephone and the internet: the number, not the card, reaches the seller. |  |\n| p34 | analysis | Paying with a number lets a shop sell to customers anywhere at any hour and lets customers buy from home, from shops they will never visit. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: Only the card's number travels to the shop. → What that made possible for the seller and for the buyer, before its price. |\n| p31 | definition | Because a number can be copied, the cardholder can tell their bank that a payment was not theirs, and the bank can take the money back from the shop weeks or months later, which is a chargeback, the forced end of what the book calls a dispute, and with no card or person checked the loss commonly stays with the shop. | fact: Visa's rules (Product and Service Rules, edition of 24 October 2026), as cited in refunds-reversals-and-disputes: 120 days from processing for most disputes. | `contrast`: What paying with a number made possible for both sides. → The price, beginning with a number that can be copied: the cardholder's remedy and its name; the time it stays open. |\n| p32 | explanation | Since the number alone can pay, everyone who stores or passes it on has to protect it, under a security standard of the card industry, and in Europe the law has the customer's bank check the payer with two independent proofs for most online payments. | source: PCI Security Standards Council, 'About us' (n.d., accessed November 2026): 'The Council was founded in 2006 by American Express, Discover, JCB International, MasterCard and Visa Inc.' Directive (EU) 2015/2366 of 25 November 2015, Article 4(30): strong customer authentication is 'based on the use of two or more elements categorised as knowledge ..., possession ... and inherence'. | `additional_support`: A number that can be copied and used. → Two protections added on top: rules for whoever touches the number, and a second check of the payer. |\n| p33 | definition | An online shop is software and has no bank counter to go to, so a new kind of company connects the shop's software to an acquirer and the networks through one programming interface: the payment provider, and with such a provider a small online shop can often start taking payments without arranging anything with a bank itself. | source: Adyen's 'About' page (n.d., accessed November 2026): 'We were founded in Amsterdam in 2006.' Stripe's annual letter for 2023 (13 March 2024): 'when Stripe launched in 2011'. Where a provider can stand in the chain is taught in journey-of-a-payment. | `problem_solution`: A shop that is software, with card data it must not mishandle. → The company that stands between the shop's software and the acquirer. |\n| p35 | cause_effect | Distance made new failures possible: stolen numbers can be tried against any checkout that sets no limit, money can be taken back long after the sale, card numbers end up in places never meant to hold them, every payment depends on one provider being reachable, and software that gets no answer sends the request again and charges twice. | reasoning: A clerk who hears nothing asks again aloud; a program that times out re-sends the request, and the issuer may approve both. A request and its answer travel apart from the money, so neither side can tell from the silence what happened.; figure: Figure: a customer at home with a laptop; only a row of digits travels through a provider to an online shop and a parcel comes back, while a second hand copies the digits. | `additional_support`: The remedy, the protections and the provider this step added. → The price of it: the failures this step opened, in the terms the next page names. |\n| p36 | analysis | At this step the answer to the page's question is: as in the network step, and then only provisionally: for about 120 days the cardholder's bank can take it back, and the shop, not the bank, usually carries a payment the cardholder denies. |  | `conclusion_summary`: The failures distance made possible. → The step's answer to the running question, longer than the one before. |\n\n### The Stored Card: Charging When the Customer Is Not There\n\n**Controlling idea** (`explanation`, id `stored-card`): Storing the card let a shop charge again without the customer present, which made subscriptions possible and made a stand-in for the card number necessary; the cost is a payment nobody is there to repair and a store of cards that belongs to one provider.\n\n**Advances the thesis** (S2, S3): Introduces the token and the recurring charge, and the absence of the payer at the moment of payment.\n\n**Transition in:** `problem_solution`: At a distance the customer still types the number for every purchase. → Keeping the card so that the next payment needs no customer at all.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The token is named only after the reader knows why a card number cannot simply be kept.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | context | A membership that is paid every month would need the customer to come back and type the card number every month, and many would forget. | reasoning: Stated as common practice for memberships and other repeated purchases. |  |\n| p38 | definition | The card is therefore kept on file, and because a stored card number is dangerous, the provider keeps the number and gives the shop a stand-in that is useless to a thief, called a token, which the shop's software charges on a schedule. | example: A token as a reference that only the provider can turn back into a card number; taught in tokenization-vaulting-and-pci, with the scheduled charge in subscriptions-and-billing-engines. | `problem_solution`: A customer who must return every month. → The stored card, held as a token, charged on a schedule. |\n| p39 | analysis | The stored card spares the customer the retyping and the remembering, and gives the seller income that returns every month, which is what makes a subscription possible. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p40 | cause_effect | A charge made in the customer's absence fails with nobody there to fix it (cards expire, accounts run empty), the stored cards exist only as one provider's tokens, and a shop that renews everyone on the same day sends a month of payments in one hour. | reasoning: A declined renewal has to be retried and the customer reminded (invoicing-collections-and-dunning); tokens issued by one provider mean nothing to another; renewals anchored to the first day of the month arrive together.; figure: Figure: the provider keeps the card in a locked box, the shop's software holds a token and presses 'charge' on the first of each month, and the customer's chair is empty. | `contrast`: What the step made possible for both sides. → The price of it: what the absence of the payer costs. |\n| p41 | analysis | At this step the answer to the page's question is: as before, but the promise is now asked for by a program on a date, and when it is refused the shop has delivered a month of service and is on the hook for collecting it. |  | `conclusion_summary`: The scheduled charge and its failures. → The step's answer to the running question, longer than the one before. |\n\n### The Platform: Someone Stands Between Payer and Seller\n\n**Controlling idea** (`explanation`, id `platform`): Platforms let thousands of small sellers take card payments without each signing with a bank, by putting a company between payer and seller that collects, holds and passes on the money, and that company takes on verifying the sellers, paying them and the question of whose money it holds.\n\n**Advances the thesis** (S2, S3): Introduces the payment facilitator, the balance and the payout, and the regulated role of holding other people's money.\n\n**Transition in:** `problem_solution`: Every shop so far has its own agreement with an acquirer or a provider. → A company that brings many small sellers in under one agreement and stands between them and their payers.\n\n**Order of paragraphs** (`problem_solution`): The limit of the earlier way of paying comes first, then what was added and its name, then what it made possible for both sides, then what the addition cost, then the answer to the running question. The facilitator is defined before balances and payouts because they are what it does with the sellers' money.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | context | A yoga teacher or a small studio sells through someone else's software and has neither the time nor the standing to sign a card-acceptance agreement of their own. | scenario: An illustration, labeled as one: a small studio that takes bookings through a software platform. |  |\n| p43 | definition | Card network rules allow one company to sign up many small sellers under a single agreement with an acquirer, and such a company is a payment facilitator. | quotation: Visa's rules (Glossary, edition of 24 October 2026), as quoted in journey-of-a-payment and platform-payment-models: a Payment Facilitator is 'An entity that contracts with an Acquirer to deposit Transactions, receive settlement from, or contract with an Acquirer on behalf of a Sponsored Merchant'. | `problem_solution`: Small sellers without agreements of their own. → The arrangement that covers them, in the network's own definition. |\n| p44 | process | Money collected for many sellers arrives together, is kept as a running amount per seller, the seller's balance, and is sent on to each seller's bank account later, and that last transfer is a payout. | example: Per-seller balances and payouts as taught in balances-and-funds-flows and payouts-and-money-movement. | `sequence`: Many sellers under one agreement. → What happens to their money: collected together, tracked per seller, paid out later. |\n| p45 | analysis | Through a platform a seller too small to deal with a bank can take card payments after filling in a form, and buyers can pay such a seller the way they pay a large shop. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p46 | cause_effect | Whoever stands in the middle must know who its sellers are and keep checking, may need a license to hold their money, and adds a transfer that can fail, so a seller can be paid late, frozen or not at all while every card payment succeeded. | source: Directive (EU) 2015/2366 (PSD2), Article 10, as cited in licences-and-safeguarding: funds a payment institution receives for others must be safeguarded. Verification as a continuing duty is taught in platform-onboarding-and-verification.; figure: Figure: several small sellers under one roof, a platform in the middle with a jar of coins per seller, and coins leaving one jar for a seller's bank on a later day. | `contrast`: What the step made possible for both sides. → The price of it: what the party in the middle takes on, and what can now go wrong for the seller. |\n| p47 | analysis | At this step the answer to the page's question is: for the payer, at the approval; for the seller, only when the payout reaches their bank account, and until then whoever holds the balance is on the hook to the seller. |  | `conclusion_summary`: What the party in the middle takes on. → The step's answer to the running question, longer than the one before. |\n\n### Today: Every Step at Once, and One More Record\n\n**Controlling idea** (`example`, id `today`): A payment today carries every earlier step at once, and the business's own software adds one more record of it, built from an answer, later notifications and reports that can each be late, missing or repeated.\n\n**Advances the thesis** (S4, S3): Shows the steps together in one present-day payment (the book's fictional case) and adds the integrator's own record, where the failure patterns are decided.\n\n**Transition in:** `conclusion_summary`: Eight steps, each of which added to the one before and removed nothing. → The present: all of them behind one call, seen from the software that makes the call.\n\n**Order of paragraphs** (`large_to_small`): The claim that nothing was removed comes first, then one payment that shows it, with its parties and promises counted, then how the software that started the payment learns the outcome, then how its own record goes wrong; the example sits next to the claim it proves, and the two paragraphs about the software's record are adjacent.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | claim | None of the earlier ways of paying was retired when the next one arrived, so a payment made in an app today rests on the debt and the ledger, clearing and settlement, the issuer's guarantee, the network, the chargeback, the token and, often, a platform. | reasoning: Each step is still in use for what it answered: strangers, distance, absence, small sellers. |  |\n| p49 | example | At Larkfield, the fictional studio-software platform this book follows, Mila's €120 class pass shows all of them together: an approval at 19:42 on Tuesday 9 March 2027, seven parties, five promises made in turn, a payout of €117.47 to the studio on Thursday 11 March and a right to dispute until about 7 July. | scenario: Scenario ledger and journey-of-a-payment: Mila Janssen, her phone's wallet, her Dutch bank (issuer), Visa, Adyen, Studio Noord, Larkfield; fee €2.53; studio receives €117.47 on Thursday 11 March 2027; dispute window to about 7 July 2027. Fictional. | `example`: The claim that every step is still present. → One present-day payment in which every step can be pointed to, with its parties and promises counted. |\n| p50 | process | The business's software learns what happened to a payment in three installments (the answer to its call, notifications sent later and reports that list what actually moved) and keeps its own record from them, for cards and for methods that are not cards. | example: The provider's answer, webhooks and settlement reports as taught in payment-state-machines, payment-webhooks-and-events and payment-reconciliation-and-reporting; other payment methods, which behave more like the check than like the card, in local-payment-methods. | `elaboration`: One payment with seven parties and five promises, started by a platform's software. → How that software learns what each party did: an answer, later notifications and reports, from which it keeps a record of its own; and that some payments are not cards. |\n| p51 | analysis | Together the steps let almost anyone buy from almost anyone, anywhere and at any hour, so a three-person studio can sell to a member it has never met and be paid two days later. | reasoning: Stated as common experience, for the buyer and for the seller in turn; no dated fact. | `cause_effect`: What this step added. → What it made possible for the buyer and for the seller. |\n| p52 | cause_effect | The software's own record is one more copy that can disagree with the others: a notification can arrive late, twice or not at all, the provider's interface changes over time, a method that is not a card does not follow the card's steps, and a business that builds this software itself may copy a far larger company's design without its reasons. | reasoning: A record marked paid at the approval is a copy of a promise; it is corrected only by the later notifications and reports.; figure: Figure: one tap on a phone at the front; behind it, in a row, the notebook, the check, the card company, the banks, the provider, the token and the platform's jar, and at the back the business's own screen with a record marked 'paid?'. | `contrast`: What the step made possible for both sides. → The price of it: how that record comes to disagree with the others, which is the shop notebook's problem again: reconciliation. |\n| p53 | analysis | At this step the answer to the page's question is: in installments: promised in seconds, moved between banks in a day or two, paid out after that and final only when the dispute window has closed, with a different party on the hook at each stage. |  | `conclusion_summary`: Today's record and how it can disagree. → The step's answer to the running question, longer than the one before. |\n\n## Conclusion: What the Steps Add Up To\n\n**Synthesis:** Read together, the steps show one movement that no single step shows: each moved the keeping of the promise further from the making of it, in distance, in time and in the number of hands, and the answer to 'when is it paid?' grew from 'now' to four installments with a different party on the hook at each.\n\n**So what:** The steps answer limits that still exist, and each bought trade that both sides wanted (strangers, distance, absence, small sellers), so no redesign or new technology removes them; a builder should expect a failure wherever a promise and its keeping are separated, and design for that gap.\n\n**Callback:** The coin handed to the baker, and Mila's tap. The reader can now count what stands behind the tap that did not stand behind the coin: seven parties, five promises and a dispute window of about 120 days.\n\n**Takeaway** (`broader_implications`): The failure patterns of the next page are the price of what these steps made possible, not signs of careless engineering: each one is a promise from one of these steps that some system recorded as the truth.\n\n**Hand-off** to [Paid Twice, Paid Never: Sixteen Ways Payment Systems Go Wrong](where-payment-systems-go-wrong.html): `cause_effect`: The layers of the previous page: each way of paying added a promise, a party, a record and a delay, and none was removed; together with the introduction's claim that a payment failure is a promise some system recorded as the truth, and its rule that Larkfield is illustration and never evidence about a provider. → What those layers make possible: sixteen recurring failure patterns, each unpacked with a typical quote, what it looks like, why it happens, what it costs, a Larkfield illustration, a remedy direction and the chapters that address it; then the chains the patterns form and how to use them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | Set side by side, the nine steps each made a kind of sale possible and each added a concept, a party or a delay and a way to go wrong, and the last column of the table is the vocabulary of the next page. | table: Nine rows (cash, shop credit, check, card, card network, paying at a distance, stored card, platform, today) with columns: Step, What it made possible, What it added, New party or delay, What can now go wrong; the last column uses the sixteen pattern names exactly where one applies and plain words where none does. |  |\n| p58 | synthesis | The few dates the walk used, set on one line of time, show how recent most of the steps are: the clearing of checks is about 170 years old, the card about 75, and the payment provider, the card-data council and the two companies this book follows about 20 or less. | table: A timeline of the page's dated anchors only, each with the step it belongs to and the source that dates it: 1853 (The Clearing House), 1950 (Diners Club's charge card), 1958 (BankAmericard), 1976 (the name Visa), 1987 (ISO 8583, per Stripe's explainer), 2006 (PCI Security Standards Council; Adyen), 2011 (Stripe), 2015 (the EU's second payment services directive). No date is added that the steps did not already give. | `additional_support`: The table of steps, which is in the order of the ideas. → The same steps placed in time by the dates the page has given. |\n| p55 | synthesis | Behind the act that began as a coin for a loaf there now stand seven parties, five promises and a dispute window of about 120 days, because every step moved the keeping of the promise further from the making of it. | scenario: Mila's class pass as told in journey-of-a-payment: seven roles in the cast table; five promises in the timeline table (issuer, merchant, acquirer, network, provider); about 120 days. | `elaboration`: The steps side by side and in time. → The count behind one present-day payment, and the single movement the steps share. |\n| p56 | refutation | The complexity is the price of all the trade these steps opened, not a mistake: each step answers a limit that still exists, so no clean redesign or new technology makes paying simple again, and a failure should be expected wherever a promise and its keeping are separated. | reasoning: Strangers, distance, absent payers and small sellers have not gone away; a new way to pay has to answer each of them or leave them to someone else. | `cause_effect`: Seven parties, five promises, 120 days. → Why the steps stay, against the view that the complexity is a design mistake, and what a builder should expect. |\n| p57 | transition | The next page names the sixteen ways these promises fail, and after this walk each of them reads as a promise from one of these steps that some system recorded as the truth. |  | `cause_effect`: Failures are to be expected where a promise and its keeping are apart. → The sixteen named patterns of the next page, as the price of these steps. |\n\n## Non-goals\n\n- A history of payments: events, founders and firsts that introduce no concept the book uses are left out.\n- Teaching any mechanism properly: each concept gets plain words, its name and a link. See [Follow the Money: What Happens Between “Pay” and “Paid”](journey-of-a-payment.html), [The First Promise: Authorization](payment-authorization.html), [The Slow Truth: Capture, Clearing and Settlement](clearing-and-settlement.html), [Money Flowing Backward: Refunds, Reversals and Disputes](refunds-reversals-and-disputes.html), [Who Earns What: Interchange, Scheme Fees and Provider Pricing](payment-economics.html).\n- The failure patterns themselves: the page uses their names in the tally and the costs, and explains none. See [Paid Twice, Paid Never: Sixteen Ways Payment Systems Go Wrong](where-payment-systems-go-wrong.html).\n- Larkfield as a company; it appears only at the last step as today's case. See [Meet Larkfield](meet-larkfield.html).\n- How Stripe and Adyen differ; the page has no 'Where They Differ' section and gives only their founding and launch years. See [Case: Stripe, the Developer Platform That Became Financial Infrastructure](case-stripe.html), [Case: Adyen, the Single Platform With a Banking Licence](case-adyen.html).\n- What is changing now (instant payments, stablecoins, agents). See [What Is Moving: Agents, Stablecoins and Instant Payments in 2026](payments-what-is-moving.html).\n- Why any company, bank or network did what it did: no motives are attributed.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Mastercard's own history pages returned HTTP 403, so the founding of the second large bank-card association is not dated on the page; if the author wants it, a readable primary source is needed.\n- Electronic authorization before 1987 (telephone approvals, the networks' first electronic systems) is not dated: no primary source was readable in this session.\n\n## Decision log\n\n- **2026-11-17** — Nine steps: cash, shop credit, check, card, card network, paying at a distance, stored card, platform, today. The charge card and the credit card are one step (one concept: a third party's guarantee); authorization belongs to the network step and the payment provider to the distance step, as the PLAN contract groups them. Rejected: A separate step for the payment provider (it adds a party but its need is the distance step's).; A separate step for chip cards and contactless payment (no concept the tally needs).; Ten or more steps, which the field-evolution skill warns reads as a history.\n- **2026-11-17** — The running question is 'When is it really paid, and who is on the hook until then?', answered in one short closing paragraph of every step that begins with the question in bold. Rejected: Answering it only in the tally table.; Folding the answer into the cost paragraph, where a skim reader would miss that it grows.\n- **2026-11-17** — Shape and length follow the field-evolution skill, not the chapter format: IN THIS SECTION and KEY POINTS callouts, no failure-pattern callout, no 'Where They Differ' section, no three-tier take-away, two illustration placeholders, 2,500 to 3,500 words. Rejected: The chapter body order of the style guide.\n- **2026-11-17** — Ten anchor dates, each from a page fetched on 17 November 2026: 1853 (The Clearing House), 1950 (Diners Club), 1958 and 1976 (Visa), 1987 (ISO 8583, via Stripe's explainer; ISO's catalogue page returned 403), 2006 (PCI SSC; Adyen), 2011 (Stripe), 2015 (PSD2), plus the Federal Reserve History essay of 2023 for how checks were collected. Rejected: Dating the Interbank Card Association (Mastercard's pages returned 403).; Dating PCI DSS version 1.0 (not stated on the council pages fetched).; Wikipedia or secondary histories for any date.\n\n## Sources\n\n- **Internal**\n  - .claude/skills/field-evolution/SKILL.md — The page's purpose, shape
