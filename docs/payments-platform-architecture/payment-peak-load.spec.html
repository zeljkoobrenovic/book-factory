<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The peak profiles of payments (the four retail days from Black Friday to Cyber Monday, a ticket sale, the first of the month for subscriptions) and the peak figures each provider has published, with what they leave undefined.\n- **Know:** The terms peak profile, load test, rate limit, load shedding, backpressure and fairness.\n- **Know:** Stripe's 2017 account of its four limiters and its documented limits (accessed November 2026), and the fact that Adyen publishes no rate limit for payments.\n- **Know:** How capacity is obtained on each side as published: split and merged shards on rented cloud capacity (Stripe, 2024); hardware bought ahead and a design rule of twenty times current load (Adyen, 2020 to 2026).\n- **Believe:** The peak that hurts a merchant is its own predictable one, and the limit it meets is the one the provider sets per customer.\n- **Believe:** A rate-limited request is a late payment, not a failed one, and must not start the process for chasing a failed payment.\n- **Be able to:** Size and pace a batch of payments against a documented or agreed limit, with backoff and a stable idempotency key.\n- **Be able to:** Tell from a peak figure what it counts and refuse to rank two providers by figures defined differently.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a planned burst of payments on a case the chapter does not contain, the reader predicts where it fails and redesigns the job. *Probe:* A ticket seller using Stripe plans to charge 200,000 customers who registered in advance, all at 10:00 when the sale opens, as fast as its workers can send requests. Using this chapter: what will happen, and how should the job be built? | `custom` | cold_reader | major |\n| AC-2 | Given two published peak figures, the reader says why they cannot be ranked. *Probe:* For the 2025 Black Friday weekend one provider reported 'more than 152,000 transactions per minute at peak' and another 'up to 199,000 transactions per minute'. Does the second have more capacity? | `custom` | cold_reader | major |\n| AC-3 | The Larkfield worked example uses the ledger's Renewal Wave figures (38% of monthly renewals in six hours, about 357,000 renewals, 7,900 delayed on 1 October 2026) and shows the job paced over 18 hours under K5. | `custom` | rubric | major |\n| AC-4 | The chapter states what Adyen documents about peak (periodic load tests with merchants, a deployment freeze around named peak days, utilization generally under 30%) and that no Adyen payment rate limit or capacity figure was found, and makes no inference about Adyen from that absence. | `custom` | rubric | blocker |\n\n## Thesis\n\n**Question:** How do payment systems, and the merchants that call them, prepare for the day everything arrives at once?\n\n> **Claim:** A merchant's own predictable peak meets the provider's per-customer limit (published by Stripe at 100 requests per second, not published by Adyen for payments) before it meets the provider's capacity, so preparing for it means spreading and pacing the load on the merchant's side, not trusting the provider's Black Friday figures.\n\n**Disputed by:** The view that peak is the provider's problem: a provider that carried a Black Friday weekend at well over 100,000 transactions per minute will absorb one merchant's renewal run, so the merchant can send it at full speed and retry whatever fails.\n\n**So what:** The reader designs a batch against the documented limit where there is one and an agreed limit where there is not, treats a rate-limit response as lateness and not as a declined payment, and accepts a longer run (Larkfield's 18 hours under K5) as the price of not sending reminders to members who did nothing wrong.\n\n**How and why:** Stripe's 2017 post describes four limiters: a per-user request rate, a per-user cap on requests in progress, and two load shedders, one of which keeps a share of the fleet for critical methods such as creating charges. Its documentation (n.d., accessed November 2026) gives the limits: 100 requests per second in live mode, 25 per endpoint unless stated otherwise, and 50 requests in progress. Adyen publishes no rate limit for its payment APIs, so there the figure has to be agreed in advance; that is the documented difference, and it is a difference in what is published, not evidence about Adyen's capacity. On capacity itself, Stripe wrote in 2024 that it splits shards in surges and tests load in production; Adyen wrote in 2020 and 2021 of designing for twenty times current load and in 2026 of buying compute and storage ahead. The published peak figures (Stripe 2023 to 2025, Adyen 2024 and 2025) leave 'transaction' undefined and cannot be ranked. Adyen's peak-season documentation describes periodic load tests with merchants and a deployment freeze around named peak days, but gives no capacity figure and no payment rate limit, and the chapter draws nothing from that absence.\n\n**Supporting claims**\n\n- **S1** — Payment peaks come in three profiles (the shared retail days, one merchant's interactive sale, one merchant's first-of-month batch), and who creates the peak and whether a customer is waiting decide who can pace it and what may be late.\n- **S2** — The peak figures Stripe (2023 to 2025) and Adyen (2024, 2025) publish are reported load in undefined units, not capacity, so they cannot be ranked and say nothing about what one customer may send.\n- **S3** — As published, Stripe rents capacity, reshapes its data tier and load tests in production (2023, 2024), and Adyen owns its hardware, designs for twenty times growth and buys ahead (2020 to 2026); neither publishes capacity, and no Adyen account of load testing, a peak freeze or payment rate limits was found.\n- **S4** — A shared API is kept fair by a bounded share per customer, so a merchant's own peak meets that share (100 requests a second at Stripe, unpublished at Adyen) before the provider's capacity, and slowness past the limit returns to the caller as backpressure: refusals, slower answers and issuer-unavailable declines.\n- **S5** — The party that creates a predictable peak prepares for it by moving and pacing its own load, treating a refusal or a timeout as lateness and not failure, and sizing its own systems for what comes back.\n\n## Role in the part\n\nMoves the peak problem from the provider's side, where the reader can do nothing, to the caller's side, where the limit is documented or negotiable and the pacing is the reader's own design. Supports P8-4 of part `part-8`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: Daniel's objection is posed in the first section and answered with Larkfield's numbers in the ninth; `comparison` in capacity (Stripe then Adyen) and where-they-differ)\n\nThe objection comes first because it is the disputed view in the reader's own words. Peak profiles follow because the rest of the chapter depends on separating the provider's shared peak from the merchant's own. The published figures are examined next, since they are the evidence the objection rests on, and the capacity behind them after that, which uses chapter 39's hosting difference. Only then does the chapter turn to the share one customer is given, which needs the reader to have accepted that capacity is not the question; backpressure and downstream limits extend that share to a system that slows. Designs come after the mechanism they respond to, the comparison after all the facts it tabulates, and Larkfield's run after the designs it chooses among. Putting the limits first would repeat chapter 21 and leave the Black Friday figures standing as an unanswered objection; putting Larkfield's run before the designs would present one choice as the only one. Figures come before capacity because the figures are what the reader has seen and capacity is what they wrongly take the figures to measure; reversing them would describe capacity before showing that no published number states it. Downstream limits come before the designs because two of the designs (pacing, and sizing one's own receivers) answer limits that only that section introduces. The comparison precedes Larkfield's run because the run's length depends on the comparison's central row, a limit published by one provider and not the other.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In the 2025 Black Friday weekend Stripe reported more than 152,000 transactions a minute at peak and Adyen up to 199,000. On 1 October 2026 Larkfield sent its renewals at about a thousand a minute, and 7,900 of them were refused.\n\n**Bridge:** An engineer sizing a batch job looks up the capacity of the system it calls, finds that the provider carried a Black Friday weekend at well over 100,000 transactions a minute, and concludes that a few hundred thousand renewals are noise. → A payment provider does not offer its capacity to a customer; it offers a share, and a merchant's own peak arrives alone against that share.\n\n**Thesis statement** (KEY POINTS bullet 1 and paragraph p02): A merchant's own predictable peak meets the provider's per-customer limit (published by Stripe at 100 requests per second, not published by Adyen for payments) before it meets the provider's capacity, so preparing for it means spreading and pacing the load on the merchant's side, not trusting the provider's Black Friday figures.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from an objection at Larkfield: the provider handled Black Friday, so why pace? *Kept in:* scene.\n- Sort payment peaks into three profiles. *Kept in:* peak-profiles.\n- Read the published peak figures for what they count. *Kept in:* peak-figures.\n- Say how each provider gets capacity and where that record stops. *Kept in:* capacity.\n- Explain the share one customer is given, fairness, backpressure and the limits downstream. *Kept in:* fairness-backpressure, downstream.\n- Compare the designs for a predictable peak and set the two providers side by side. *Kept in:* designs, where-they-differ.\n- Run Larkfield's wave over eighteen hours and list how a paced peak still fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | In the 2025 Black Friday weekend Stripe reported more than 152,000 transactions a minute at peak and Adyen up to 199,000, yet on 1 October 2026 Larkfield's renewal run, about a thousand payments a minute, had 7,900 renewals refused: the refusal came from the share one customer is given, not from the provider's capacity. | statistic: Stripe press release, 2025-12-02: 'More than 152,000 transactions per minute at peak volume'. Adyen knowledge hub, 2025-12-09: 'handling up to 199,000 transactions per minute without disruption'.; scenario: Ledger: the Renewal Wave is about 357,000 renewals in six hours (357,000 / 360 minutes = about 990 a minute); on 1 October 2026 the job hit the provider's rate limit and 7,900 renewals were delayed to the next day. |  |\n| p02 | claim | Chapter 39 left a documented hosting difference (Stripe on rented cloud capacity, Adyen on infrastructure it owns) that decides how each gets capacity, but a merchant's own predictable peak meets the per-customer limit before it meets that capacity, so preparing for it means spreading and pacing the load on the merchant's side. | fact: Stripe documentation (n.d., accessed 2026-11): 'Live mode: 100 requests per second' per account; Adyen's documentation index lists no rate-limit page for payments (chapter 21 owns both facts). | `cause_effect`: Chapter 39's hosting difference and the hook's refused run. → What follows when load arrives at once: capacity scaled on demand or bought ahead, and on both a per-customer share that a merchant reaches first; the thesis. |\n| p03 | context | This chapter is off the path of Mila's class pass and on the path of her membership: her €49.00 renewal on the 1st of each month is one of the roughly 357,000 payments in the wave, and the wave's design decides at what hour of that day her card is charged. | scenario: Ledger: Mila Janssen's €49.00 monthly membership at Studio Noord, renewed on the 1st of each month as a merchant-initiated card payment; her €120.00 pass of Tuesday 9 March 2027 at 19:42 is an interactive payment. | `place`: The chapter's claim. → Its position relative to the recurring payments. |\n| p04 | transition | The chapter goes from an objection raised at Larkfield through peak profiles, the published figures, how each provider gets capacity, fairness and backpressure, downstream limits and the designs for a predictable peak, to the comparison of the two providers, the paced wave and its failure modes. |  | `sequence`: Where the chapter sits. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: The Black Friday Objection\n\n**Controlling idea** (`example`, id `scene`): In April 2027 Larkfield's CTO objects that a provider which carried 152,000 transactions a minute cannot need eighteen hours for a thousand a minute, and the answer is that the published figure describes the provider's whole load while Larkfield is given a share.\n\n**Advances the thesis** (S2, S4): Poses the disputed view (peak is the provider's problem) in the reader's own words, with ledger numbers, before any mechanism.\n\n**Transition in:** `example`: The introduction's contrast between the published peaks and the refused run. → The objection as someone at Larkfield actually raises it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In April 2027 Daniel Osei objects to K5, the Keel decision that Larkfield paces its own renewals over eighteen hours: Stripe reported more than 152,000 transactions a minute on Black Friday, the wave is about a thousand a minute, so the provider should absorb it at full speed. | scenario: Ledger: K5 paces the renewal job over 18 hours; the wave is about 357,000 renewals (38% of the month's, €17.5 million) formerly attempted in six hours; Daniel Osei is CTO and wrote the 2017 Stripe integration. The April 2027 review meeting is a local detail. |  |\n| p06 | analysis | Femke de Graaf's answer separates two things the objection merges: what the provider carried for all its customers together, and what one customer may send, which chapter 21 gave as 100 requests a second per Stripe account and 25 per endpoint, with no published figure at Adyen; it leaves two questions the chapter answers (what the published figures count, and where a merchant's own peak fails). | reasoning: A reported peak is the sum of every customer's traffic on the provider's busiest minute; an account's limit is set so that no single customer can take a large part of it. The first says nothing about the second.; fact: docs.stripe.com/rate-limits.md (n.d., accessed 2026-11): 'Live mode: 100 requests per second'; 'Individual API endpoints (unless otherwise noted) 25 requests per second'. Adyen's documentation index lists no rate-limit page. Established in chapter 21 and cited from it. | `contrast`: Daniel's objection. → Femke's distinction between the provider's load and one customer's share, and the two questions it leaves. |\n\n### Peak Profiles: Who Creates the Peak and Who Is Waiting\n\n**Controlling idea** (`definition`, id `peak-profiles`): A peak profile describes a peak by its shape, by who creates it and by whether a customer is waiting for the answer, and those three properties decide who can pace the load and what is allowed to give way.\n\n**Advances the thesis** (S1): Defines the chapter's first owned term and sorts the three peaks of payments so that the merchant's own peak is seen as a different problem from Black Friday.\n\n**Transition in:** `elaboration`: Femke's distinction between the provider's load and one customer's share. → A vocabulary for kinds of peak: the peak profile.\n\n**Order of paragraphs** (`prerequisite_order`): The profiles are named and tabulated before the paragraph that draws the distinction between shared and own peaks, which needs all three as cases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | Payments have three recurring peak profiles: the four retail days from Black Friday to Cyber Monday, shared by every merchant; a ticket or flash sale, created by one merchant in minutes with customers waiting; and the first of the month, created by one merchant's batch with nobody waiting. | table: Rows: Black Friday to Cyber Monday; ticket or flash sale; first of the month. Columns: shape, who creates it, who is waiting, where it is felt first.; fact: Both providers report Black Friday through Cyber Monday as a four-day period (Stripe press 2023 to 2025; Adyen 2024, 2025). Stripe's rate-limit page (n.d., accessed 2026-11) names 'a flash sale' as a cause of rate limiting. Ledger: 38% of Larkfield's monthly renewals in the first six hours of the 1st. |  |\n| p08 | analysis | A shared peak is carried by the provider, and the merchant can only prepare its own systems; a merchant's own peak arrives alone, against that merchant's share, and whether anyone is waiting decides whether the load can be delayed. | reasoning: On Black Friday each merchant's traffic rises by its own factor and the provider plans for the sum; on the first of the month one merchant's traffic rises many times over while the provider's total barely moves, so the only limit in play is the per-customer one. A renewal can be charged at 14:00 instead of 02:00 with no one noticing; a ticket buyer cannot be asked to come back in the afternoon.; figure: Structural figure: three load shapes over time (a four-day plateau made of many merchants, one narrow spike, one block at the start of a month), each under the line it meets. | `cause_effect`: The three profiles and their properties. → What the properties decide: who can pace, and what may be late. |\n\n### What the Published Peak Figures Count\n\n**Controlling idea** (`analysis`, id `peak-figures`): The peak figures Stripe and Adyen publish are reported load in units neither defines, so they cannot be ranked against each other or used as a statement of capacity, and the one thing they show a merchant is how small one account's share is.\n\n**Advances the thesis** (S2): Removes the evidence the disputed view rests on: the Black Friday figures say what was carried, not what is available to one customer.\n\n**Transition in:** `example`: The shared retail peak, the only profile for which the providers publish numbers. → Those numbers and what they do and do not count.\n\n**Order of paragraphs** (`prerequisite_order`): The figures are laid out before they are criticized so that the reader can check the criticism against them; the positive reading comes last because it is only safe once the ranking has been set aside, and it uses the limit Femke named in the scene.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | evidence | Stripe has published Black Friday to Cyber Monday figures each year from 2023 to 2025 and Adyen for 2024 and 2025, each with volume and transaction counts and, in most years, a peak rate and an uptime figure. | table: Stripe 2023 (press, 2023-11-28): more than $18.6 billion, more than 300 million transactions, 93,304 transactions per minute, 27,395 requests per second, uptime greater than 99.999%. Stripe 2024 (2024-12-03): more than $31 billion, 465 million, 137,000 per minute, greater than 99.9999%. Stripe 2025 (2025-12-02): more than $40 billion, more than 578 million, more than 152,000 per minute, more than 99.9999%. Adyen 2024 (2024-12-09): $34 billion, 670 million transactions, no rate, no uptime found. Adyen 2025 (2025-12-09 and H2 2025 results, 2026-02-12): $43 billion, 837 million, up to 199,000 per minute, 99.9999% uptime. |  |\n| p10 | analysis | The figures cannot be ranked: neither company defines 'transaction' or 'uptime', neither says how in-person payments enter the rate, and all of them report the load that arrived, not the capacity that was available. | fact: None of the six documents defines 'transaction'; Adyen's 2024 article has a methodology note that fixes the period and says only 'transactions processed on the Adyen platform'. Adyen's articles separately report 'nearly 100 million in-person payments' (2024) and 'over 127M in-person payment transactions' (2025) for the weekend; Stripe's releases do not say what share of its count is in person.; reasoning: A peak of 199,000 a minute against 152,000 shows that more arrived at one provider than at the other on its busiest minute. It would show more capacity only if both had been driven to their limit, and both report that they were not. | `contrast`: The figures as published. → What they leave undefined and why they support no ranking. |\n| p11 | analysis | What the figures do support is an order of magnitude: both providers peak at a few thousand transactions a second, and Stripe's 2023 release, the only one with a request rate, puts one account's documented 100 requests a second at well under one percent of the requests it reported at peak. | statistic: Author's arithmetic: 152,000 per minute is about 2,500 a second; 199,000 is about 3,300. Stripe 2023: 27,395 requests per second at peak; the account limit documented in November 2026 is 100 requests per second, about 0.4% of that figure. The two numbers are three years apart, and the 2023 peaks of requests and of transactions need not have coincided. | `additional_support`: What the figures cannot show. → The one reading they do support: scale, and the smallness of one account's share. |\n\n### How Each Provider Gets Its Capacity\n\n**Controlling idea** (`comparison`, id `capacity`): As published, Stripe gets peak capacity by renting it and reshaping its data tier and tests the result under synthetic load in production, while Adyen buys hardware ahead, designs for a multiple of current load, and documents low utilization, periodic load tests and a code freeze around peak days; neither publishes its capacity as a figure.\n\n**Advances the thesis** (S3): Gives the provider side of capacity with dates, defines the load test, and marks where the record stops (no capacity figure at either; no Stripe statement on changes during Black Friday).\n\n**Transition in:** `contrast`: Figures that report load carried. → How the capacity behind them is obtained, which is what chapter 39's hosting difference decides.\n\n**Order of paragraphs** (`comparison`): Stripe then Adyen on the same question, then the near miss that qualifies both accounts, then the boundary of the evidence, which can only be drawn after the evidence is on the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | evidence | Stripe has described renting its compute from Amazon Web Services (2023), splitting and merging database shards as traffic rises and falls (2024), and load testing in production with synthetic traffic at twenty times its worst case (2024); a load test is the deliberate sending of artificial traffic to find the weakest part before real customers do. | quotation: Stripe newsroom, 2023-01-23: 'Stripe will expand its use of Amazon Web Services, Stripe's long-standing cloud infrastructure provider'. Stripe engineering, 2024-06-06: 'DocDB can split database shards during traffic surges and consolidate thousands of databases through bin packing when traffic is low'; in 2024 it was 'prototyping a heat management system' and 'investing in shard autoscaling'.; quotation: Rahul Patil, Stripe Sessions, 2024-04-25: 'We use massive synthetic traffic to punish our systems at 20x the worst-case scenario … We simulate this and then we repeat this in production, load testing our systems farther and farther'. Stripe engineering, 2026-08-26: balancing across Ruby backends 'gives us 15–20% more headroom before traffic bursts overwhelm the machines'. |  |\n| p13 | evidence | Adyen has described running its own hardware in its own data centers (2021), a rule of thumb of designing for twenty times growth (2020, 2021), a move toward an internal cloud because it needed dynamic scaling (2021), and, in 2026, buying compute and storage a year early. | quotation: Adyen engineering, 2021-07-28: 'We manage our own infrastructure in several data centers around the world and have bare metal available'; 'In part, because we now need dynamic scaling, we are moving towards running our system on an internal cloud.' 2021-08-23: 'The 20x scaling factor is a rule of thumb we often use internally when designing a solution or determining whether we are still satisfied with it.' 2020-10-22 (Adyen for Platforms): 'What if it becomes 10 times greater? 20 times?'; quotation: Adyen H1 2026 results, 2026-08-13: 'We are proactively pulling investment from 2027 into H2 2026 to secure compute and storage availability, and lock in pricing amid ongoing supply chain challenges. We now expect CapEx to be approximately 7% of net revenue this year.'; reasoning: Labeled inference: an owner of hardware has to plan peak capacity in purchase lead times, a renter in provisioning time; neither company says how far ahead it plans for a peak. | `contrast`: Stripe's rented and reshaped capacity. → Adyen's owned capacity, designed with a multiple and bought ahead. |\n| p14 | example | The one peak-season near miss either company has published was set off by a change, not by load: Adyen's 2025 account of a database whose CPU spiked while the team prepared for December, because adding one more partition to a table would have overloaded it. | quotation: Adyen engineering, 2025-09-17: 'I still have nightmares about incident number 2016. We were preparing for one of the most critical seasons for our merchants – December shopping – when the CPU unexpectedly spiked. We realized that automatically adding one more partition to an already partitioned table would bring one of our most critical databases to its knees'. (2016 is an incident number.) | `additional_support`: Capacity as each company obtains it. → A documented case in which capacity was not the weak point before a peak. |\n| p15 | analysis | The record stops short of a figure and is uneven: Adyen's documentation describes periodic load tests with merchants and a code freeze around named peak days, Stripe's one remark about not freezing code concerned a conference day, and neither company publishes its capacity as a figure a customer could plan with. | fact: docs.adyen.com/industries/peak-season.md (n.d., accessed 2026-11): 'We periodically load test this system with merchants who hold transactions and then release the transactions in bulk'; 'We therefore freeze our code deployment around the following peak season days' (list includes Black Friday and Cyber Monday; critical bug fixes excepted); 'The utilization rate of those resources is low, generally less than 30%'; the question 'How many transactions per second (TPS) can your system handle?' is answered without a number. Stripe Sessions 2024: 'today's Sessions, there's no code freeze', said of the conference day, not of Black Friday. | `contrast`: What each company has published about capacity. → What Adyen's documentation adds on testing and freezes, and what neither company has: a capacity figure. |\n\n### The Share You Are Given: Fairness and Backpressure\n\n**Controlling idea** (`explanation`, id `fairness-backpressure`): A shared payment API is kept fair by giving each customer a bounded share, so one merchant's peak meets that share long before the provider's capacity, and when something past the limit slows down, backpressure reaches the caller as refusals and slower answers that a waiting customer and a batch must be allowed to absorb differently.\n\n**Advances the thesis** (S4): The mechanism of the thesis: why the limit a merchant meets is per customer, how the system signals it, and what may queue.\n\n**Transition in:** `cause_effect`: Capacity that exists but is not published. → How that capacity is divided among customers, which is the part a merchant actually meets.\n\n**Order of paragraphs** (`prerequisite_order`): Fairness explains why the limit is per customer; the claim about where a peak fails needs that; backpressure extends the limit from a fixed rate to a slowing system; the table of paths needs both terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | definition | Fairness in a shared API means that no customer's traffic can take capacity another customer needs, and the per-customer rate limit is how it is enforced: Stripe's 2017 post gives every user a bucket, and its current documentation says the rates are set high enough that legitimate payment traffic should not reach them. | quotation: Stripe engineering, 2017-03-30: 'every Stripe user has a bucket, and every time they make a request we remove a token from that bucket'; 'we added the ability to briefly burst above the cap for sudden spikes in usage during real-time events (e.g. a flash sale.)' Evidence age: 9 years. Stripe documentation (n.d., accessed 2026-11): 'We try to set our rates high enough that legitimate payment traffic never exceeds the limits'. |  |\n| p17 | claim | Because the share is per customer, a merchant's own peak fails at the share and not at the provider's capacity: at Stripe the documented share is 100 requests a second per account, 25 per endpoint and 50 in progress, and at Adyen no description of payment rate limits was found, which is a difference in what is published and not evidence about Adyen's capacity or practice. | fact: docs.stripe.com/rate-limits.md (n.d., accessed 2026-11): 'Live mode: 100 requests per second'; 'Individual API endpoints (unless otherwise noted) 25 requests per second'; 'The default global concurrency limit for standard API traffic in live mode is 50 in-progress requests'. Adyen: documentation index lists no rate-limit page; HTTP 429 is documented on the response-handling page. Both established in chapter 21. | `cause_effect`: Fairness as a per-customer allowance. → Where a merchant's own peak therefore fails, at each provider. |\n| p18 | definition | Backpressure is a slow part of a system making the faster part upstream slow down, and over an HTTP API it reaches the caller as a refusal (429), a shed request (503) or slower answers; a refusal means the provider did not attempt the payment, so it is lateness and never a decline, and a cap on requests in progress turns slower answers into a lower rate. | quotation: docs.stripe.com/error-low-level.md (n.d., accessed 2026-11): 'Errors that occur before execution begins, such as invalid parameters, an invalid API key, or rate limiting, don’t cache a result.' Chapter 21 owns the point that a 429 is not a decline.; statistic: Author's arithmetic on Stripe's documented default of 50 requests in progress: at half a second per call 50 slots carry 100 requests a second; if calls slow to two seconds the same 50 slots carry 25 a second (latencies are assumptions).; figure: Structural figure: a batch queue and a checkout lane feed a pacing valve, then the provider's gate, then the card network and the issuer; signals travel back as 'refused', 'slower' and 'issuer unavailable'. | `elaboration`: The share as a rate. → What happens when the system past the limit slows: backpressure and its signals. |\n| p19 | comparison | Where the customer is waiting, a queue can absorb only seconds before a late answer becomes an abandoned or repeated payment, and where nobody is waiting, hours; so the requirement on each path is written separately, and in every row the record of the payment is the thing that may not give way. | table: Rows: interactive checkout; batch renewal; processing of provider events. Columns: who waits, how long an answer may take, what happens at the limit, what must not happen. (Latency budgets are labeled assumptions.); quotation: Adyen engineering, 2020-10-22, on an Adyen for Platforms API moved from synchronous to asynchronous processing: 'we have better control over how and when the requests are executed'. Evidence age: 6 years; about a platform API, not card authorization. | `contrast`: Backpressure as signals. → What each path may do with them: wait for seconds, or wait for hours. |\n\n### Downstream Limits: Issuers and Networks\n\n**Controlling idea** (`explanation`, id `downstream`): The provider is not the last system in the path: a card payment is answered by the cardholder's bank through the card network, their limits reach the merchant as declines, and the events of every payment sent come back to the merchant's own systems; how either provider paces traffic toward banks and networks at peak is not public.\n\n**Advances the thesis** (S4, S5): Extends backpressure past the provider in both directions and marks a second place where the evidence stops.\n\n**Transition in:** `additional_support`: Backpressure from the provider. → The systems behind the provider, and the merchant's own systems behind the answer.\n\n**Order of paragraphs** (`grouping`): Three limits past the provider's gate, ordered from the one farthest from the merchant (network and issuer) through the provider's silence about them to the merchant's own systems; the last comes last because it is the only one the merchant can size, and section 7 starts from what the merchant can do.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | explanation | When a cardholder's bank (the issuer) is slow or unreachable, Visa may answer in its place under stand-in processing, and otherwise the merchant receives a decline that both providers name as the issuer being unavailable, which Visa's rules class as retryable later. | quotation: Visa's rules (Glossary, edition of 24 October 2026): Stand-In Processing is 'The component … that provides Authorization services on behalf of an Issuer when the Issuer, its VisaNet Processor, or a Visa Scheme Processor is unavailable, when Issuer responses exceed the maximum response time, or when the Issuer has instructed Visa to process a Transaction on behalf of the Issuer.' Table 7-2 puts response code 91 in the category where a reattempt is permitted, up to 20 attempts in 30 days.; fact: Stripe decline code `issuer_not_available`: 'The card issuer couldn’t be reached, so the payment couldn’t be authorized.' Adyen refusal reason 9, 'Issuer Unavailable': 'It is not possible to contact the shopper's bank to authorize the transaction.' (documentation n.d., accessed 2026-11). |  |\n| p21 | analysis | Neither Stripe nor Adyen documents how it paces or queues traffic toward networks and issuers at a peak, whether an approval came from stand-in, or issuer response times; a merchant can only count these declines per hour of its own run. | fact: The provider documentation read for the card-lifecycle chapters (accessed 2026-11) contains no provider-side stand-in for online payments and no flag for a stand-in approval; no engineering post of either company describes pacing toward issuers. | `contrast`: What the network and the providers document about an unavailable issuer. → What they do not: pacing toward issuers, and stand-in visibility. |\n| p22 | cause_effect | Every payment a merchant sends comes back as events and state changes, so the merchant's own receivers and stores see the same peak, and after a failure they see it compressed: Adyen documents that queued webhooks are sent in a short time once a failing endpoint recovers. | quotation: Adyen documentation, webhook troubleshooting (n.d., accessed 2026-11), on a 429 returned by the merchant's server: 'This can happen after you fix a failing endpoint, as the queued webhooks are sent in a short timeframe. Ensure your server can handle the load.' | `similarity`: Limits downstream of the provider. → The limit downstream of the answer: the merchant's own systems. |\n\n### Four Ways to Meet a Predictable Peak\n\n**Controlling idea** (`comparison`, id `designs`): A merchant can meet its own predictable peak by moving it across the calendar, pacing it within the day, agreeing a higher ceiling or admitting customers at its own door, and each design names something that gives way; none of them can be tested against the provider, only against a mock and then in a watched production run.\n\n**Advances the thesis** (S5): The designs and their trade-offs, each stated as what gives way, which is the part's question.\n\n**Transition in:** `problem_solution`: A share per customer, backpressure and downstream limits. → The designs available to the party that creates the load.\n\n**Order of paragraphs** (`prerequisite_order`): The options must be on the table before they can be ordered, and testing comes last because it applies to whichever design was chosen; recommending before listing would hide the alternatives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | comparison | The four designs differ in what gives way: the billing date, the hour of the charge, lead time and a dependency on the provider's answer, or the customer's wait at the merchant's own door. | table: Rows: spread across the calendar (bill on each customer's anniversary); pace within the day (a token bucket below the limit, chapter 21); agree a higher ceiling (Stripe asks for large increases 'at least 6 weeks in advance'); admit at the door (a waiting room in front of checkout for an interactive peak). Columns: what gives way, what it costs, when it is right.; fact: Ledger: 62% of Larkfield's renewals already fall on each member's own anniversary day and 38% on the 1st. Stripe documentation (n.d., accessed 2026-11): 'If you request a large increase, contact Stripe Support at least 6 weeks in advance.' |  |\n| p24 | recommendation | For a batch nobody is waiting on, the author's order is calendar first, pacing second and a higher ceiling last, because the first two are the merchant's own to change; for an interactive peak the order reverses, since the load cannot be moved and only the ceiling and the door are left. | reasoning: Moving renewal dates removes the peak but changes what customers were promised; pacing keeps the date and costs hours nobody notices; a raised limit removes neither the burst nor the downstream limits and adds lead time. A ticket sale has a fixed start, so the merchant asks the provider ahead and meters entry to checkout so that each admitted buyer gets an answer in seconds. | `cause_effect`: The four designs and what each gives up. → Which to choose first, by profile. |\n| p25 | process | The merchant's own side of a peak can be load tested against a mock of the provider that sleeps for sampled real latencies, which is what Stripe's documentation recommends in place of a sandbox, and the provider's side can only be learned by running the first paced peak in production with people watching. | quotation: docs.stripe.com/rate-limits.md, 'Load testing' (n.d., accessed 2026-11): 'We generally discourage this practice because API limits are lower in a sandbox'; 'we recommend building integrations so that they have a configurable system for mocking out requests to the Stripe API … they should simulate latency by sleeping for a time that you determine by sampling the durations of real live mode Stripe API calls'. Adyen's peak season pages advise testing an integration well before a peak; no Adyen advice on load testing an integration was found. Adyen's batch processing page describes bulk requests by uploaded file, with no rate. | `additional_support`: The choice of design. → How the chosen design is tested: a mock for your side, a watched run for the provider's. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): In the public record the two providers differ in how they obtain capacity and in whether a per-customer limit for payments is published, publish comparable peak figures that cannot be ranked, and leave equally unpublished their capacity and their practice on changes at peak.\n\n**Advances the thesis** (S2, S3, S4): The required comparison: documented facts per aspect, 'Not public' where they stop, the reading marked as inference.\n\n**Transition in:** `conclusion_summary`: The figures, the capacity accounts, the limits and the designs. → The two providers set side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | comparison | Aspect by aspect, the documented differences are in hosting and in what is published about limits and about changes at a peak; on peak figures the two are alike, and neither gives a capacity figure. | table: Rows: published peak figures; how capacity is obtained; per-customer limit for payment requests; load testing; changes during a peak; guidance for a customer's own peak. Columns: Stripe, Adyen, what the difference suggests (inference). |  |\n| p27 | recommendation | On Stripe an integrator sizes a batch from the published page and asks six weeks ahead only when its computed rate exceeds it; on Adyen it asks for a figure in writing before the first large run; on both it plans against the limit and never against the Black Friday figure. | reasoning: The published limit can be designed against; an unpublished one must be agreed; neither provider's peak figure is a commitment to any one customer. | `cause_effect`: The table. → What an integrator does differently on each provider. |\n\n### In Practice at Larkfield: Eighteen Hours on Purpose\n\n**Controlling idea** (`example`, id `in-practice`): Under K5 Larkfield runs the wave of about 357,000 renewals over eighteen hours instead of six, and the length is set by the provider whose limit it does not know, by the members who are waiting at checkout and by what its own receivers can take, not by either provider's capacity.\n\n**Advances the thesis** (S5, S4): Works the thesis with ledger numbers: where the eighteen hours come from, who is served first, what the long run costs and how it is rehearsed.\n\n**Transition in:** `example`: The comparison and the designs. → Larkfield's wave under K5, with its numbers.\n\n**Order of paragraphs** (`problem_solution`): The incident and K5 restate the problem and its answer in ledger figures; the length, the internal order and the cost then answer the three questions Daniel's objection raises: why so long, who goes first, what is lost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | context | The wave is 38% of the month's renewals, about 357,000 payments worth €17.5 million, formerly attempted in the first six hours of the 1st at an average far below every limit; on 1 October 2026 its bursts, from 48 workers sending as fast as answers returned, crossed Stripe's limit of 25 requests a second per endpoint, 7,900 renewals were delayed a day, and K5 now paces the run over eighteen hours through one bucket per provider (10 requests a second on Stripe, 5 on Adyen). | scenario: Ledger: the Renewal Wave figures; K5; additions by chapter 21: the wave met Stripe's rate limit; about 157,000 renewals on Stripe and 200,000 on Adyen (assumption: like volume); token buckets of 10 requests a second on Stripe and 5 on Adyen for creating payments (Larkfield's settings, assumptions). |  |\n| p29 | analysis | The eighteen hours come from the Adyen side: at the 5 requests a second Larkfield allows itself there until Adyen confirms a figure, 200,000 renewals need at least 11.1 hours with no refusal, slowdown or checkout traffic ahead of them, and eighteen hours leaves about a third of the window as slack for those, while the Stripe side at its bucket of 10 could finish in 4.4 hours; the unpublished limit, not the published one, sets the length of the run. | statistic: Author's arithmetic on ledger figures: 200,000 / 5 per second = 40,000 seconds = 11.1 hours; 157,000 / 10 per second = 15,700 seconds = 4.4 hours; over 18 hours (64,800 seconds) the averages are 3.1 and 2.4 a second. Before Keel the job sent about 9 a second to Adyen without a refusal, which shows that 9 was under the limit on those days, not what the limit is. 11.1 / 18 = 62% of the window at the full Adyen rate, 38% slack. | `cause_effect`: The paced run. → Where its length comes from, by provider. |\n| p30 | process | Within the run Larkfield decides who is served first: members at checkout before anything else, then confirmations and retries of requests whose outcome is unknown, then the batch, whose order is shuffled each month so that no studio's members are always charged last, and whose rate is halved when the provider signals backpressure. | scenario: New local design under K5 (to be appended to the ledger): three lanes in the payment service with strict priority; the batch ordered by a hash of membership id and billing period; the batch bucket halved on a 429 or when the 95th-percentile call latency doubles, and restored in steps. | `elaboration`: The run's length. → Its internal order: fairness among Larkfield's own callers and its response to backpressure. |\n| p31 | analysis | The long run costs a later charge and nothing else: a member charged at 17:00 instead of 02:00 keeps access all day because the period record is open, no message is sent for a renewal not yet attempted, and the slower pace also lowers the rate of events Larkfield's own receivers must absorb, which is rehearsed against a mock before the first watched wave. | scenario: Ledger additions (chapters 27 and 29): a membership whose period record is open keeps access; a failure message is sent only for a declined attempt. Author's arithmetic with an assumed three provider events per renewal: 16.5 renewals a second in the six-hour wave is about 50 events a second, 5.5 a second over eighteen hours is about 17. | `contrast`: What the run does. → What it costs and what it protects, including Larkfield's own capacity. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): A paced peak still fails in three ways: the provider slows and requests time out, the run does not finish in its window, or everything that was held back returns at once; in each the recovery keeps the payment late and not wrong.\n\n**Advances the thesis** (S5): Detection and recovery for the peak-day failures, tied to the part's rule that late is repairable and wrong is not.\n\n**Transition in:** `contrast`: The wave as planned. → The ways it still fails.\n\n**Order of paragraphs** (`order_of_importance`): The timeout first because it is the one that produces wrong payments; the unfinished run next because it produces only late ones; the recovery burst last because it follows either.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | analysis | When the provider slows during the run, a timed-out request is an unknown outcome and not a failure, and the Double Charge of 1 November 2026 was exactly this on a peak day; the recovery is to slow the run, resend under the same key and confirm against the provider's record. | scenario: Ledger: on 1 November 2026 a provider call timed out during the first-of-month renewals, the job retried with a new idempotency key, 1,840 members were charged twice, €71,300 was refunded and 212 disputes followed. K1 derives the key from membership, billing period and attempt number. |  |\n| p33 | analysis | When the run does not finish by its deadline, the unattempted renewals are carried to the next morning in a state that says not attempted, with no message to the member, which is what 1 October 2026 lacked. | scenario: Ledger: 7,900 renewals delayed to the next day on 1 October 2026 and dunning emails sent to members who had done nothing wrong; chapter 29's addition: the old job could not tell a declined card from one not yet charged. | `additional_support`: A run that slows. → A run that does not finish. |\n| p34 | analysis | After any pause the held-back work returns together (the batch's retries, every other customer's retries at the provider, and the provider's queued events to the merchant), so retries are spread with random delay and the receivers are sized for the burst. | quotation: Stripe documentation (n.d., accessed 2026-11): 'add randomness to the backoff schedule to avoid a thundering herd effect'. Adyen documentation: queued webhooks 'are sent in a short timeframe' after an endpoint recovers. | `additional_support`: A run that slows or stops. → What happens when it resumes. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Taken together the sections show that the question 'can the provider handle it' has no answer a merchant can use: the capacity is real and unpublished, the peak figures describe someone else's traffic, and the only quantities a merchant can plan with are its own request rate, its share and the hours it is willing to let a charge be late.\n\n**So what:** The reader designs a batch against the documented limit where there is one and an agreed limit where there is not, treats a rate-limit response or a timeout as lateness, and accepts a longer run as the price of not sending reminders to members who did nothing wrong.\n\n**Callback:** Daniel Osei's objection in the scene and the 7,900 refused renewals of the hook. The answer to 'they handled Black Friday' is that Black Friday was everyone's traffic and the first of the month is yours; the 7,900 were late once and, a month later, 1,840 were wrong.\n\n**Takeaway** (`course_of_action`): For each predictable peak of your own, write down the requests per second it needs, the limit it meets first at each provider (documented or agreed in writing), what gives way when the limit or a slowdown is reached, and the state your record uses for 'not attempted yet'.\n\n**Hand-off** to [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html): `problem_solution`: The open problem: a payment system cannot be stopped for its peaks, and the peak near miss on record (Adyen's partition change before a December season) was set off by a change, not by load. → How a system that cannot stop is changed: bounded exposure, automatic withdrawal, reversible steps, and reconciliation as the test that a change is done.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | synthesis (list) | Established: published peak figures report load in undefined units; Stripe documents per-account limits and Adyen publishes none for payments; a refusal for volume is not a decline; Stripe rents and reshapes capacity and Adyen owns and buys ahead. |  |  |\n| p36 | synthesis (list) | Depends on context: whether to move, pace, raise or admit depends on whether anyone is waiting, whether a limit is published and how much of the peak is the merchant's own. |  | `contrast`: What is settled. → What changes with the situation. |\n| p37 | recommendation (list) | The author's synthesis: plan against your share and never against the provider's Black Friday figure, accept a longer run as the price of sending no wrong message, and treat every peak as finished only when the records agree. |  | `contrast`: What is established and what depends. → The author's position, returning to Daniel's objection and the 7,900 renewals. |\n| p38 | recommendation (list) | Eight questions let the reader test a provider's peak claims and their own peak plan. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p39 | transition | Pacing leaves one problem open: a payment system cannot be stopped for its peaks, and the one peak-season near miss on record, Adyen's partition change before a December season, was set off by a change and not by load, so the next chapter asks how a system that cannot stop is changed. |  | `problem_solution`: The paced peak and the near miss that capacity did not explain. → Safe change as the answer the next chapter gives. |\n\n## Non-goals\n\n- The limits themselves, Stripe's four limiters, load shedding as a design, and the token bucket. See [Keys, Sandboxes and Limits: The Developer Platform Around the API](payment-developer-platform.html).\n- Idempotency keys and what to do after a timeout. See [Exactly Once, Over a Network That Does Not Allow It: Idempotency and Retries](idempotency-and-retries.html).\n- Retry schedules for declined renewals, decline categories and dunning messages. See [Raising the Approval Rate: Retries, Tokens and Optimization](authorization-optimization.html), [From Invoice to Cash: Invoicing, Collections and Dunning](invoicing-collections-and-dunning.html).\n- Availability figures, outages and graceful degradation. See [Down Is Not an Option: Reliability and Availability](payment-reliability-and-availability.html).\n- Shards, online migrations and the data tier in detail. See [Never Lose a Cent: Data Stores and Consistency](payment-data-stores-and-consistency.html).\n- Hosting, regions and data residency. See [Where the Data Lives: Multi-Region Operation and Data Residency](payment-multi-region-and-data-residency.html).\n- Progressive rollout, change freezes as a practice and postmortems. See [Changing the Engine in Flight: Deploys, Migrations and Incidents](payment-safe-change.html).\n- Card-testing attacks, which look like a peak and are a fraud problem. See [Deciding in Milliseconds: Fraud and Risk Systems](payment-fraud-and-risk.html).\n- Webhook receivers and their delivery contract. See [The Provider Calls You: Webhooks and Events](payment-webhooks-and-events.html).\n- Retail peak preparation on the merchant's storefront side. See [Black Friday Every Year: Peak Load, Resilience and Recovery](../commerce-platform-architecture/peak-load-and-reliability.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Neither company defines 'transaction' or 'uptime' in its peak figures; whether the per-minute peaks include in-person payments is not stated.\n- Adyen's payment-request limits are not public (its load testing, peak code freeze and utilization are documented on docs.adyen.com/industries/peak-season, found in the verification pass); Stripe's practice on changes during Black Friday is not public (the 2024 remark concerned a conference day). The journal spec's AC-4 and the last sentence of the thesis how_why still say no Adyen account of load testing or a peak freeze was found: the author must correct them in journal-spec.json and here.\n- How either provider paces traffic toward networks and issuers, and whether stand-in approvals are visible to a merchant, is not documented.\n- How a Stripe Connect platform's requests on behalf of connected accounts count against its limit is not stated on the rate-limits page (carried over from chapter 21).\n- New peak figures are due in early December 2026 and will date the table.\n\n## Decision log\n\n- **2026-11-17** — The chapter is planned at 39 units and about 5,300 words by the checker's count, which includes five tables of documented figures (about 900 words) and the source list (about 550); the prose is about 4,100 words. It is kept below a typical chapter because the limits and the Renewal Wave's mechanism are owned by chapter 21 (ruling 5) and the public record on provider capacity is thin. Rejected: Re-deriving the rate arithmetic and the limiter design here.; A 2,500-word page, which could not carry the figures table, the capacity comparison and the worked example the journal entry's criteria require.\n- **2026-11-17** — The scene is a new 2027 objection by Daniel Osei that states the disputed view, not a retelling of 1 October 2026, which chapter 21 narrates. Rejected: Opening on the October morning again.\n- **2026-11-17** — The designs are framed as where the peak is put (calendar, day, ceiling, door) and each is stated as what gives way; chapter 21's react, pace and agree table is cited, not repeated. Rejected: Repeating the three-design table of chapter 21.\n- **2026-11-17** — Shopify's remarks in the 2024 Sessions talk and all non-Stripe, non-Adyen peak accounts are left out; ticket sales appear as a profile with Stripe's 'flash sale' wording as the only provider evidence. Rejected: A contrast case on ticketing queues, for which no first-party source was read.\n- **2026-11-17** — The consequence of owning versus renting hardware for peak planning is given as a labeled inference. Rejected: Stating it as fact.\n\n## Sources\n\n- **Internal**\n  - _research/brief-reliability-and-scale.md — Part 4 (peak figures, preparation), sections 2.2, 3.1, 6.3, the blunt table, open questions 14.\n  - _research/brief-adyen-payments-and-api.md — Section 7.3 (no payment rate limit; 429) and the webhook retry queue.\n  - _research/brief-card-lifecycle-and-networks.md — Section 2.6 (stand-in processing; issuer-unavailable codes) and Table 7-2.\n  - _research/scenario-ledger.md — The Renewal Wave, the first of the month, the Double Charge, K1, K5, the cast, and the additions of chapters 21, 27 and 29.\n  - _research/consistency-issues.md — Rulings 5 and 19.\n  - posts/21-developer-platform/index.md — The limits, the limiter design and the wave's rate arithmetic this chapter builds on.\n- **External**\n  - Pages fetched by the writer on 2026-11-17: docs.stripe.com/rate-limits.md, error-low-level.md, declines/codes.md; stripe.com/blog/rate-limiters; Stripe BFCM press releases 2023 to 2025; Stripe Sessions 2024 talk; stripe.dev DocDB and proxy posts; Stripe–Amazon release; Adyen BFCM articles 2024 and 2025; Adyen H2 2025 and H1 2026 releases; Adyen design-to-duty parts 1 and 2, design-for-20x, partitioning-an-environment; Adyen refusal reasons and webhook troubleshooting; Visa Core Rules and Visa Product and Service Rules of 24 October 2026. — Verification of every quotation and figure used.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — Verification pass: 51 claims checked (40 confirmed, 7 corrected, 4 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the statement that no Adyen account of load testing or of a peak change freeze exists was wrong: Adyen's peak season readiness documentation describes both, and a utilization rate under 30%. Section 3, p15, the Differ table and the take-aways were corrected; AC-4 and the thesis how_why, copied from the journal spec, still carry the old statement and need the author's correction.\n- **2026-11-17** — Length limits restated in the checker's unit (tables and source list included): target 5,300, maximum 5,700. No unit added, dropped or reordered.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on: the scene now names the per-account and per-endpoint limits with a pointer to chapter 21 and glosses K5; the Adyen rate-limit absence moved from the capacity section to the paragraph on the share; 'a refusal is not a decline' is established in the backpressure paragraph; the worked example says which limit the October run crossed and derives eighteen hours from the 11.1-hour floor; section patterns relabeled and the flow rationale extended. Not acted on: slimming the required 'Where They Differ' section and trimming the capacity section, which the journal entry's outcomes require.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry, the research briefs and chapter 21.\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('The chapter states that no Adyen description of load testing' -> 'The chapter states what Adyen documents about peak (periodic').\n- **2026-11-17** — Journal-spec entry corrected after verification; intent, thesis and role re-synced ('No Adyen account of load testing or of a peak freeze was fou' -> 'Adyen's peak-season documentation describes periodic load te').\n- **2026-11-17** — Absence audit: statements of absence re-tested with a wide search (docs.adyen.com sitemap of 2,619 pages, help.adyen.com sitemap, adyen.com, docs.stripe.com and support.stripe.com sitemaps, stripe.com newsroom and Sessions pages, web searches restricted to the providers' domains). Holds: Adyen publishes no rate limit for payment requests (error 705 'Rate limited' and HTTP 429 are documented without a figure; the batch page gives no rate); no Stripe statement on changes during Black Friday (table cell now says what was searched). Sources note widened; two connective sentences trimmed; units unchanged.\n- **2026-11-17** — Visual layer: 4 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
