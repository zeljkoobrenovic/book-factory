yout does (splits-balances-and-platform-payouts).\n- Card authorization from the merchant's and acquirer's side (payment-authorization) and which licenses let a provider hold money (licences-and-safeguarding).\n- Larkfield, its two providers, its five markets and Mila's class pass (meet-larkfield).\n\n**Does not yet know:**\n\n- Banking-as-a-service, financial account, card issuing, issuer, spending controls, embedded lending, merchant cash advance.\n- Release stages (generally available, public preview, private preview, in development) as a property of a provider product per country.\n- That a platform issuing cards answers each authorization itself within a fixed window.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a product plan the chapter does not contain, the reader lists the checks to make per provider and per country and treats the chapter's availability facts as dated. *Probe:* A platform with sellers in Germany and the United States wants to let them keep their sales in an account at the provider instead of being paid out to their bank, starting next quarter. Using only this chapter: what must it check on Stripe and on Adyen before promising that date, and what would you say about how current the chapter's own answer is? | `custom` | cold_reader | major |\n| AC-2 | The reader can say what a provider does when the platform does not answer a card authorization in time. *Probe:* Your platform issues cards to sellers and approves each purchase from its own server. That server is unreachable for ten minutes. Using only this chapter: what happens to purchases made on those cards during that time? | `custom` | cold_reader | major |\n| AC-3 | Every availability statement names its release stage and country and is dated; nothing in preview, pilot or development is described as available. | `evidence_is_explained` | rubric | blocker |\n| AC-4 | The chapter's conclusion synthesizes Part VII (one loss assignment seen in the model, verification, the split and financial products) and returns to Mila's €84.00 refund after payout before handing off to Part VIII. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n\n## Thesis\n\n**Question:** What does it take to offer accounts, cards and loans to a platform's sellers, and how far have the two providers gone?\n\n> **Claim:** It takes a licensed institution behind each product, and that license covers the product, not the platform's operating duties: the platform must answer each card authorization within two seconds and accept what the provider attaches, which is added seller verification on Adyen and bearing seller losses on Stripe. Neither provider has reached a feature switch: as of November 2026 availability differs by product, country and release stage, and accounts for a platform's sellers are in preview at Stripe and in development at Adyen.\n\n**Disputed by:** The view, encouraged by provider descriptions such as Adyen's 'within a single integration' (H1 2026 shareholder letter), that a platform already taking payments can add accounts, cards and loans as features wherever it operates, with the provider carrying the regulated part.\n\n**So what:** A platform plans these products per country and per release stage, checks whether its account model qualifies before it promises anything, and treats a card or account launch as taking on operating duties of a financial product; declining to launch, as Larkfield, the book's fictional platform, does with its instant-payout card, is a legitimate result of that assessment.\n\n**How and why:** Adyen's H1 2026 shareholder letter attributes its accounts, issuing and capital products to its own banking licenses, and its statements carry merchant funds in business accounts and loans on its own balance sheet. Stripe's documentation (n.d., accessed November 2026) says Stripe is not a bank and names partner banks for deposits, cards and loans and third-party lenders outside the United States. That is the documented difference: one licensed balance sheet extended across products, against products assembled per country from partners. On Stripe a platform for which Stripe bears seller losses cannot use Treasury or Issuing, which ties these products to the loss assignment of chapter 33; on Adyen they are enabled per balance platform with added capabilities and verification. Both give the platform about two seconds to approve a card authorization before a configured default applies. As of November 2026 both offer card issuing and financing in named countries; Stripe's current account product for platforms is in public preview in the United Kingdom and private preview in the United States, Australia and the EU (and, on one page, Canada), with a US legacy version closed to new builds, and Adyen's business accounts are documented as in development. The public record gives no date for general availability of either company's account product, so the chapter reports stages as of November 2026 and stops there.\n\n**Supporting claims**\n\n- **S1** — An account, a card and financing are three regulated acts performed on the seller balance by a licensed institution: Adyen states that its own banking licenses stand behind all three, and Stripe states that it is not a bank and names partner banks and lenders per product and country.\n- **S2** — The license covers the product and not the platform's operating duties: a platform that issues cards answers each authorization within two seconds on both providers, and a default it configured in advance decides whenever it does not answer.\n- **S3** — Each provider attaches conditions before a platform may offer these products: on Stripe the platform must bear seller losses, collect verification requirements and give sellers no Stripe-hosted dashboard; on Adyen the products are enabled per balance platform, with added seller verification and Adyen's authentication SDK for account transfers.\n- **S4** — As of November 2026 availability differs by product, country and release stage: both providers offer card issuing and financing in named countries, accounts for a platform's sellers are in preview at Stripe and in development at Adyen, and the public record gives no date for general availability.\n- **S5** — A platform therefore assesses each product per provider, per country and per release stage against its own account model and exposure, and deciding not to launch is a legitimate result of that assessment.\n\n## Role in the part\n\nTests the part's claim at its far end: the products built on the seller balance are gated by license and by the platform's loss assignment; also carries the part's closing. Supports P7-4 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the card proposal and its five questions are posed in the first section and answered in the last; `comparison` in products-and-license, availability-november-2026 and where-they-differ)\n\nThe reader meets a proposal and five questions, then gets the products and the license behind each, then the one duty that is new in kind (answering authorizations), and only then the dated availability facts, the side-by-side comparison and the decision. If availability came first, the stages and conditions would be lists about products the reader cannot yet tell apart; if the comparison came before the issuing mechanism, its row on the authorization window would compare two numbers with no meaning; and the Larkfield decision uses every earlier section, so it must come last.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At 19:42 on Tuesday 9 March 2027, €117.47 of Mila Janssen's €120.00 class pass is booked to Studio Noord's balance at the provider. Studio Noord's bank shows it on Thursday. A product manager asks why the studio cannot have a card that spends that balance on Tuesday night: the money is already there, the provider holds the license, and the provider's own description says the card comes with the same integration.\n\n**Bridge:** An engineer who has integrated a payment provider expects further products of the same provider to be further endpoints on the same credentials: enable, call, ship. → An account, a card and a loan are each a regulated product with its own licensed institution, its own country list and its own release stage, and each gives the platform new work that the provider's license does not do for it.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, and paragraph p02): Offering sellers an account, a card or financing takes a licensed institution behind each product, and that license covers the product, not the platform's operating duties. Neither Stripe nor Adyen has reached a feature switch: as of November 2026 availability differs by product, country and release stage, and accounts for a platform's sellers are in preview at Stripe and in development at Adyen.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from Larkfield's proposal for a card that spends a studio's balance before the payout. *Kept in:* scene.\n- Define the three products built on a seller balance and the license behind each. *Kept in:* products-and-license.\n- Show card issuing from the issuer's side and the two seconds the platform has to answer. *Kept in:* issuing-two-seconds.\n- Report what each provider offered in November 2026, at which release stage, and on which conditions. *Kept in:* availability-november-2026.\n- Set Stripe and Adyen side by side. *Kept in:* where-they-differ.\n- Return to Larkfield's card and why it waits. *Kept in:* in-practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A card that spends a studio's balance on the evening of the sale looks like one more product on an integration that already works, because the money is already in the balance and the provider already holds the license. | scenario: Mila's €120.00 pass on Tuesday 9 March 2027 at 19:42; €117.47 booked to Studio Noord's balance; the payout arrives Thursday 11 March. |  |\n| p02 | claim | A licensed institution stands behind each of these products, but its license covers the product and not the platform's operating duties, and in November 2026 neither provider offers the three products as a switch: availability differs by product, country and release stage. |  | `contrast`: The pitch that the card is one more product on the same integration. → The thesis: a license per product, duties that stay with the platform, and availability that is not uniform. |\n| p03 | context | On the journey of Mila's class pass this chapter sits between the split and the payout, in the two days when €117.47 is in Studio Noord's balance, and asks what changes if that money is kept, spent or advanced instead of paid out. | scenario: The seller balance between Tuesday 9 March and Thursday 11 March 2027; the refund of €84.00 requested on 18 March. | `place`: The chapter's claim. → Its position on the payment's journey: the seller balance before payout. |\n| p04 | transition | The chapter goes from Larkfield's card proposal, through the three products and their licenses and the issuer's side of a card authorization, to what was available in November 2026, the comparison of the two providers and Larkfield's decision. |  | `sequence`: Where the chapter sits on the journey. → The order of its sections. |\n\n## Sections\n\n### Setting the Scene at Larkfield: A Card for Tuesday's Sales\n\n**Controlling idea** (`example`, id `scene`): A proposal to give studios a card that spends their balance before the payout cannot be given a launch date until five questions are answered per provider and per country.\n\n**Advances the thesis** (S5): Poses the chapter's question as a product proposal and turns it into the checks the rest of the chapter supplies answers for.\n\n**Transition in:** `example`: The introduction's pitch for a card that spends the balance. → Larkfield's version of it, with its date, its sponsor and its markets.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In May 2027 Larkfield's product team proposed an instant-payout card for studios, and the chief executive asked for an autumn launch in all five markets. | scenario: Ines Bakker's question of 10 March 2027 about why Tuesday's sales were not yet in her bank account; Larkfield's five markets on two providers (Adyen for studios in the Netherlands and Germany onboarded since 2024, Stripe for the United Kingdom, the United States, Belgium and 1,140 older Dutch and German studios). |  |\n| p06 | explanation (list) | Femke de Graaf gave no date and replaced the proposal with five questions: which licensed institution issues the card and holds the balance, who answers each card authorization, in which countries and at which release stage each product is offered, whether Larkfield's account model qualifies, and what more its studios must prove. | reasoning: The five questions, each of which has a different answer per provider and per country. | `problem_solution`: The request for an autumn launch in five markets. → The five questions that must be answered first. |\n\n### Keep, Spend, Advance: Three Products and the License Behind Each\n\n**Controlling idea** (`definition`, id `products-and-license`): An account, a card and financing are three regulated acts on the seller balance, each performed by a licensed institution that differs between the two providers, and none of the licenses takes over the work the platform must do.\n\n**Advances the thesis** (S1, S2): Supplies the vocabulary (banking-as-a-service, financial account, card issuing, embedded lending), states which license each company puts behind the products, and separates the licensed act from the platform's duties.\n\n**Transition in:** `elaboration`: Femke's first question: which licensed institution issues the card and holds the balance. → The three products defined, and the license each provider states for them.\n\n**Order of paragraphs** (`prerequisite_order`): The products are defined first, then who is licensed to perform them, then what the license leaves to the platform; the third idea needs the first two.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | Banking-as-a-service means a licensed institution's accounts, cards or loans offered through another company's software, and on a platform it comes as three products that each do one thing with the seller balance: a financial account keeps it, an issued card spends it, and financing advances money against future sales and is repaid from them. | quotation: Stripe: financial accounts 'receive your settled Stripe earnings, hold funds, and support capabilities such as physical or virtual cards' (https://docs.stripe.com/treasury, n.d., accessed 2026-11). Adyen: with a business account users 'can receive payouts directly to their Adyen business account instead of paying out to a third-party bank account' (paraphrased in the article) (https://docs.adyen.com/business-accounts, n.d., accessed 2026-11).; quotation: Adyen: 'Creating a payment instrument issues a card. Each balance account can have one or more payment instruments that can deduct funds from it' (https://docs.adyen.com/issuing, n.d., accessed 2026-11). Stripe: 'An Issuing balance is a funding source attached to a connected account' (https://docs.stripe.com/issuing/how-issuing-works, n.d., accessed 2026-11).; quotation: Adyen Capital: 'Users repay daily based on a fixed percentage of their processed volume through Adyen' (https://docs.adyen.com/capital, n.d., accessed 2026-11). Stripe Capital for platforms: 'Stripe withholds a fixed percentage of each transaction until the complete balance is repaid' (https://docs.stripe.com/capital/how-capital-for-platforms-works, n.d., accessed 2026-11).; table: Rows: financial account, issued card, financing. Columns: what the seller can do; the regulated act; what the platform must now run.; figure: Placeholder 36-keep-spend-advance: a seller balance with three exits besides the payout (keep, spend, advance). |  |\n| p08 | comparison | Adyen states that its own banking licenses stand behind its accounts, cards and financing and that it is the lender, while Stripe states that it is not a bank and names a partner bank for deposits, partner banks for cards and loans, and outside lenders for financing in other countries. | quotation: Adyen H1 2026 Shareholder Letter, published 2026-08-13 (https://investors.adyen.com/financials/h1-2026-c2a1a): 'We also capture post-transaction value through our embedded financial products, enabled by our banking licenses. By offering native business accounts, card issuing, and capital within a single integration...'; its statements describe 'Accounts, in the form of merchant-related funds held in business accounts, and Capital, in the form of loans and advances'. Adyen documentation: 'present business financing offers from Adyen' (https://docs.adyen.com/platforms, n.d., accessed 2026-11).; quotation: Stripe: 'Stripe is not a bank. Checking accounts are provided exclusively by Fifth Third Bank, National Association, Member FDIC' (https://docs.stripe.com/treasury, n.d., accessed 2026-11); 'We partner with multiple trusted banks to provide an embedded finance infrastructure' (https://docs.stripe.com/issuing/how-issuing-works, n.d., accessed 2026-11); US loans from 'Celtic Bank or Lead Bank', a merchant cash advance from YouLend, loans from Fundbox in Australia and Canada, YouLend in Germany, France and the United Kingdom (https://docs.stripe.com/capital/how-capital-for-platforms-works, n.d., accessed 2026-11). | `sequence`: The three products and the regulated act in each. → Which licensed institution performs that act at each provider. |\n| p09 | claim | The license covers the regulated act and leaves the operating work with the platform: fraud controls, authentication of the seller for outgoing transfers, added verification data and being the seller's point of contact. | quotation: Stripe: 'Treasury platforms must maintain a fraud risk management process that includes proactive measures to prevent and monitor unauthorized or fraudulent activity' (https://docs.stripe.com/treasury/connect/requirements, n.d., accessed 2026-11).; quotation: Adyen Issuing: 'You will always be the point of contact for your users' (https://docs.adyen.com/issuing, n.d., accessed 2026-11); business accounts require the platform to 'Implement Adyen's Authentication SDK to comply with the PSD2 regulations for online transactions' (https://docs.adyen.com/business-accounts/get-started, n.d., accessed 2026-11). | `contrast`: The licensed institution behind each product. → What that license does not do for the platform. |\n\n### Card Issuing From the Issuer's Side: Two Seconds to Answer\n\n**Controlling idea** (`process`, id `issuing-two-seconds`): A platform that issues cards and decides on each purchase itself sits in the card authorization path with a two-second budget on both providers, and the default it configured decides every time it is slow or down.\n\n**Advances the thesis** (S2): Shows the one operating duty that is new in kind: the platform answers authorizations instead of sending them, inside a fixed window, with a default it chose beforehand.\n\n**Transition in:** `example`: The claim that operating duties stay with the platform. → The duty that changes the platform's position most: answering card authorizations.\n\n**Order of paragraphs** (`chronological`): The order of one authorization: the provider's own checks, then the platform's answer inside the window, then what happens when the answer does not come.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | process | With an issued card the roles of an authorization are reversed: the request arrives from the card network at the issuer, the provider runs its own checks and the platform's stored rules first, and only then asks the platform's server to approve or decline. | fact: Stripe: 'When a card is used to make a purchase, Stripe creates an issuing_authorization.request and sends it to your configured endpoint for your approval'; 'If your Issuing balance has insufficient funds for the incoming authorization, the authorization will be denied and your webhook endpoint won't receive the issuing_authorization.request event' (https://docs.stripe.com/issuing/controls/real-time-authorizations, n.d., accessed 2026-11). Spending controls block merchant categories or countries and set spending limits (https://docs.stripe.com/issuing/controls/spending-controls, n.d., accessed 2026-11).; fact: Adyen: internal checks include 'The available balance in your account'; then transaction rules 'automatically approves or declines payment attempts'; then, if configured, relayed authorisation: 'On each attempt, Adyen sends a webhook to your server' (https://docs.adyen.com/issuing/authorisation, n.d., accessed 2026-11).; figure: Placeholder 36-issuer-side-authorization: terminal, card network, provider as issuer with a balance check and rules, the platform's endpoint with a two-second timer, and a default switch. |  |\n| p11 | evidence | Both providers give the platform's server about two seconds, and when no answer arrives they apply a default the platform set in advance: approve or decline. | quotation: Stripe: 'If Stripe doesn't receive your approve or decline response within 2 seconds, the Authorization is automatically approved or declined based on your timeout settings, or Autopilot settings, if configured' (https://docs.stripe.com/issuing/controls/real-time-authorizations, n.d., accessed 2026-11).; quotation: Adyen: 'Your server has up to 2000 milliseconds to respond. If we do not receive a response within this timeframe, we apply your default fallback' (https://docs.adyen.com/issuing/authorisation, n.d., accessed 2026-11); the fallback is 'Default approval' or 'Default refusal', and 'If we receive an HTTP 4xx or HTTP 5xx error code, we will apply your default fallback logic' (https://docs.adyen.com/issuing/authorisation/relayed-authorisation, n.d., accessed 2026-11).; table: Requirements table. Rows: how fast; what happens with no answer; what happens on an error response; what the platform is never asked. Columns: Stripe, Adyen. | `sequence`: The point at which the provider asks the platform. → How long the platform has and what replaces its answer. |\n| p12 | recommendation | Because the default applies whenever the endpoint is slow or unreachable, the platform decides the outcome of those purchases on the day it sets the default, so I choose it per card program, give the endpoint its own availability target and keep as many decisions as possible in rules stored at the provider. | reasoning: Approve by default spends money the platform may have to cover; decline by default leaves a seller unable to pay at a till during the platform's outage. Neither is neutral.; fact: Stripe: when request_history.reason is 'webhook_error' or 'webhook_timeout', 'Stripe isn't receiving your responses' (https://docs.stripe.com/issuing/controls/real-time-authorizations, n.d., accessed 2026-11). | `cause_effect`: The window and the configured default. → What follows for the platform: the default is its own decision, made in advance. |\n\n### What Was Available in November 2026, and at Which Stage\n\n**Controlling idea** (`evidence`, id `availability-november-2026`): In November 2026 cards and financing are offered by both providers in named countries, accounts for a platform's sellers are in preview at Stripe and in development at Adyen, each provider attaches conditions, and the public record says nothing about when the account products become generally available.\n ntities in the United States, the United Kingdom and the Eurozone (https://docs.adyen.com/business-accounts, n.d., accessed 2026-11).; reasoning: The release stages in plain words: generally available (open to any eligible customer, interface stable), public preview (open on request, may change), private preview or pilot (by invitation), in development (documented, may change). |  |\n| p14 | evidence | Cards and financing were further along and still bounded by country and stage: business card issuing in the European Economic Area, the United Kingdom and the United States on both, plus Canada on Stripe, and financing in six countries through partner lenders on Stripe and in nine by invitation on Adyen. | fact: Stripe: 'Commercial issuing is available in Canada, the United States, the United Kingdom, and supported countries in the European Economic Area' (https://docs.stripe.com/issuing, n.d., accessed 2026-11); 'Use local issuing in 24 countries' (https://docs.stripe.com/issuing/global, n.d., accessed 2026-11); consumer card program '(Private preview)', stablecoin card program '(Public preview)' (https://docs.stripe.com/issuing/how-issuing-works, n.d., accessed 2026-11). Adyen: 'currently supported in the European Economic Area, the United Kingdom, and the United States' (https://docs.adyen.com/issuing, n.d., accessed 2026-11); debit cards for organizations and sole proprietorships (https://docs.adyen.com/platforms/verification-requirements, n.d., accessed 2026-11).; fact: Stripe Capital for platforms: AU, CA, DE, FR, GB, US; line of credit '(Private preview)' (https://docs.stripe.com/capital/how-capital-for-platforms-works, n.d., accessed 2026-11). Adyen Capital: Finland, France, Netherlands, Spain, Sweden, United Kingdom, Canada (excluding Saskatchewan), United States, Australia (https://docs.adyen.com/capital, n.d., accessed 2026-11); 'Available on an invite-only basis' (https://docs.adyen.com/platforms/verification-requirements, n.d., accessed 2026-11); 'Subsequent grants are currently in a pilot phase' (https://docs.adyen.com/capital/how-capital-works, n.d., accessed 2026-11).; table: Rows: business cards, financing. Columns: Stripe (countries and stage), Adyen (countries and stage). All 'as of November 2026'. | `contrast`: Accounts, which are in preview or development. → Cards and financing, which exist in named countries. |\n| p15 | evidence | Each provider attaches conditions before a platform may offer these products: Stripe requires that the platform bear its sellers' losses, collect their verification requirements and give them no Stripe-hosted dashboard, and Adyen enables the products per balance platform and asks sellers for more verification. | quotation: Stripe: where Stripe is responsible for negative balances, 'Your platform can't use Stripe Treasury or Issuing' (https://docs.stripe.com/connect/risk-management, n.d., accessed 2026-11); 'Issuing only supports connected accounts that don't use a Stripe-hosted Dashboard, and where your platform is responsible for requirements collection and loss liability' (https://docs.stripe.com/issuing/connect, n.d., accessed 2026-11); for Treasury for platforms 'The account must not use a Stripe-hosted dashboard and you must be responsible for requirements collection' (https://docs.stripe.com/treasury/connect/account-management/connected-accounts, n.d., accessed 2026-11).; fact: Adyen: business accounts must be 'enabled for your balance platform'; added data includes source of funds, tax classification and 'A live selfie photo' and photo ID for signatories; card issuing adds a VAT number or tax ID and source of funds; card capabilities have levels (ATM withdrawals up to EUR 750 per card per day at medium) (https://docs.adyen.com/business-accounts/get-started and https://docs.adyen.com/platforms/verification-requirements, n.d., accessed 2026-11). | `additional_support`: Stage and country per product. → The conditions on the platform and its sellers that apply even where the product exists. |\n| p16 | analysis | The public record stops at stages and country lists: neither company gives a date for general availability of its account product, the companies' own pages disagree in places, and every documentation page is undated, so this section is a snapshot of November 2026 to be checked again before any plan relies on it. | fact: Adyen's product page lists the United States, the United Kingdom and twenty eurozone countries for business accounts, while its verification page lists 'BE, DE, ES, FR, GB, NL and US' (https://docs.adyen.com/business-accounts and https://docs.adyen.com/platforms/verification-requirements, n.d., accessed 2026-11). Stripe's documentation lists 24 local issuing countries; its annual letter of 24 February 2026 says 'our Issuing product is available in only 22 countries some 7 years after launch' (https://stripe.com/annual-updates/2025). | `contrast`: What the documentation states. → What it does not state, and how far the stated facts can be trusted over time. |\n\n### Stripe and Adyen: Where They Differ\n\n**Controlling idea** (`comparison`, id `where-they-differ`): The two differ in who holds the license, in how they gate the products and in which countries they reach, and they are alike in the two-second authorization window and in not offering accounts for sellers as a generally available product.\n\n**Advances the thesis** (S1, S3, S4): The required comparison: one row per aspect with the documented fact for each company and the author's reading marked as inference.\n\n**Transition in:** `conclusion_summary`: The licenses, the authorization window, the stages and the conditions, each documented above. → The two providers side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | comparison | Aspect by aspect, Adyen extends its own banking licenses across the three products and Stripe assembles them per country from partner banks and lenders, while the authorization window and the unfinished state of seller accounts are the same on both. | table: Rows: license behind the products; accounts for a platform's sellers; business cards; time to answer an authorization; financing; condition on the platform. Columns: Stripe, Adyen, what the difference suggests. |  |\n| p18 | recommendation | On Stripe an integrator should check the configuration of its connected accounts and the partner behind each product in each country before anything else; on Adyen it should ask its Adyen contact what is enabled for its balance platform and which stage each product is in, because the public pages do not say when that changes. |  | `cause_effect`: The differences in the table. → What an integrator does differently on each provider. |\n\n### In Practice at Larkfield: Why the Card Waits\n\n**Controlling idea** (`example`, id `in-practice`): Answered per provider and per market, the five questions show that Larkfield could issue a card in every market but as two programs, and would raise its own exposure and take on authorization endpoints to do it, so it decides not to launch yet and names the conditions for returning to the question.\n\n**Advances the thesis** (S5): Applies the assessment to the book's platform with ledger figures and shows that 'not yet' is a reasoned outcome with conditions, not a failure to deliver.\n\n**Transition in:** `example`: The comparison of the two providers. → The same comparison applied to Larkfield's two providers and five markets.\n\n**Order of paragraphs** (`problem_solution`): The answers per market, then the failure they expose, then the decision that follows from both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | example | Market by market, Larkfield finds that its account model qualifies on both providers and a business card is possible in all five markets, but as two card programs with two issuers, two authorization endpoints and two ways of funding the card, and with no account product generally available on either. | table: Rows: Netherlands and Germany on Adyen (2,610 studios); Netherlands and Germany still on Stripe (1,140); Belgium, United Kingdom and United States on Stripe. Columns: the card as documented; what funds it; the account product.; scenario: Larkfield bears a studio's uncovered losses on both providers (ledger: 'if the studio's balance cannot cover it, the loss falls on Larkfield as the platform'). |  |\n| p20 | cause_effect | The case that decides the matter is the one the part opened with: a card lets a studio spend a sale within minutes, so a refund or chargeback that arrives later finds less in the studio's balance, and under the loss assignment of platform-payment-models the shortfall falls on Larkfield. | scenario: Mila's €84.00 refund on 18 March 2027, after Studio Noord's €117.47 was paid out on 11 March; with a card the €117.47 could be spent on the evening of 9 March. About €156 million of paid-out online card volume is inside the dispute window at any time (ledger, chapter 4's arithmetic).; quotation: Adyen: 'Funds can be deducted from this account if your users' balance accounts incur negative balances due to refunds and chargebacks' (liable balance account, https://docs.adyen.com/platforms/account-structure-resources, n.d., accessed 2026-11). Stripe, on paying out early: 'When platforms and marketplaces are liable for losses, you're liable for uncovered negative balances due to refunds or disputes on instantly paid out funds' (https://docs.stripe.com/connect/instant-payouts, n.d., accessed 2026-11). | `cause_effect`: What is possible per market. → What the card would do to Larkfield's exposure where it is possible. |\n| p21 | recommendation | Larkfield decided in June 2027 not to launch the card yet, to look first at faster payouts as the smaller answer to the studios' request, and to return to the card when four conditions hold. | scenario: The four conditions: a limit and an owner for every studio's exposure figure (the figure is defined in splits-balances-and-platform-payouts); a decision between two card programs and one on Adyen only (2,610 of 6,200 studios); an account product that is generally available in the Netherlands and Germany, or a decision to fund cards another way; an authorization endpoint with an availability target and a chosen default.; fact: Stripe Instant Payouts 'typically settle in the associated debit card or bank account within 30 minutes' (https://docs.stripe.com/connect/instant-payouts, n.d., accessed 2026-11); Adyen payouts can request an instant priority where the receiving bank supports it (payouts-and-money-movement owns both). | `problem_solution`: The exposure and the endpoint the card would add. → The decision, the smaller alternative and the conditions for revisiting. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Part VII describes one decision seen four times. Who stands behind a seller's negative balance decides who the provider lets collect verification data, where a refund after payout is booked, and whether the platform may offer accounts and cards at all. A platform that picks its account model for the look of its onboarding has picked its loss exposure, its operational workload and the limit of its product plan in the same act.\n\n**So what:** Before adding sellers, countries or financial products, a platform can state its position in one line per provider: who is the merchant, who bears negative balances, who collects requirements, where reversals after payout are booked. If it cannot, it is carrying a liability it has not measured, and a product that keeps, spends or lends seller money will enlarge it.\n\n**Callback:** The €117.47 in Studio Noord's balance on the evening of 9 March 2027 and the card that would spend it; for the part, Mila's €84.00 refund a week after the payout. The reader can now say which balance funded the €84.00 on each provider and why, and what Larkfield would need in place before letting studios spend that same balance on a card.\n\n**Takeaway** (`course_of_action`): Write down, per provider, the four answers (merchant, loss bearer, requirements collector, where reversals after payout are booked), mirror every seller's requirements and deadlines with an owner, and track exposure per seller, before launching any product that keeps or lends seller money; then assess each such product per country and per release stage, with the date of the information.\n\n**Hand-off** to [Part VIII — SCALE: Reliability, Data and Operations](part-8.html): `contrast`: The platform's account model as the last of the mechanisms, and with it every mechanism of Parts II to VII, each described for one payment at a time. → The same mechanisms under conditions no single payment shows: a failing dependency, data that outgrows one database, a law on where data sits, a month of renewals in six hours and constant change.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | synthesis (list) | Established: each product rests on a licensed institution that the provider names, a platform that relays card authorizations has two seconds before a configured default applies, and Stripe documents that only a platform bearing seller losses may offer accounts and cards. |  |  |\n| p23 | synthesis (list) | Depends on context: whether to launch depends on the country and the release stage on the day you check, on whether your account model qualifies, and on whether your exposure per seller can absorb money being spent sooner. |  | `contrast`: What is settled. → What changes with the situation. |\n| p24 | recommendation (list) | The author's synthesis: treat each embedded-finance product as a new financial product that the platform operates, plan it per country and stage with dated facts, and count a reasoned 'not yet' as a result. |  | `contrast`: What is established and what depends. → The author's own position, returning to the card that spends Tuesday's sales. |\n| p25 | synthesis | Across Part VII the model, verification, the split and the financial products are one loss assignment seen four times, and Mila's €84.00 refund after Studio Noord's payout is funded by the balance that assignment named long before she asked. | scenario: Mila's €84.00 refund on 18 March 2027 after the payout of 11 March: on Adyen it is deducted from Studio Noord's balance account, with Larkfield's liable balance account behind it; had the studio been on Stripe with the payment made through the platform, it would debit Larkfield's platform balance, with recovery from the studio left to Larkfield. | `conclusion_summary`: This chapter's take-aways. → The part's closing: four chapters as one decision, and the refund the part opened with. |\n| p26 | recommendation (list) | Eight questions let the reader test a proposal to offer sellers an account, a card or financing, in a design review or a provider evaluation. |  | `cause_effect`: The part's closing argument. → Questions that apply it. |\n| p27 | transition | Parts II to VII described each mechanism for one payment at a time; Part VIII puts the same mechanisms under failure, growth, legal limits on where data lives, peaks and constant change. |  | `contrast`: The mechanisms, one payment at a time, ending with the account model. → The conditions no single payment shows, which Part VIII covers. |\n\n## Non-goals\n\n- Which licenses allow a provider to hold funds, safeguarding, partner-bank and for-benefit-of account structures. See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n- Account models, charge types and who bears a seller's negative balance. See [One Payment, Three Parties: Platform and Marketplace Models](platform-payment-models.html).\n- Capabilities, requirements and deadlines as state, and how a platform mirrors them. See [Letting Sellers In: Onboarding and Verification on Platforms](platform-onboarding-and-verification.html).\n- Splits, refunds after payout, negative-balance recovery and payout schedules. See [Dividing the Money: Splits, Platform Balances and Seller Payouts](splits-balances-and-platform-payouts.html).\n- Instant payouts, payout rails and payout returns. See [Getting Money Out: Payouts and Money Movement](payouts-and-money-movement.html).\n- Card authorization from the acquirer's side: messages, response codes, declines. See [The First Promise: Authorization](payment-authorization.html).\n- Consumer accounts and cards, stablecoin-backed card programs, credit underwriting models and the pricing of any of these products.\n- Other banking-as-a-service providers and the failure of a middleware provider (Synapse). See [Whose Money Is It? Licences, Safeguarding and Where Funds Sit](licences-and-safeguarding.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Neither company publishes a date for general availability of its account product for platform users.\n- Adyen's business-account country list differs between two of its own pages; the chapter cites the product page and notes the other.\n- Adyen's H1 2026 Shareholder Letter (PDF) could not be opened by the writer; its quotations are taken as the research brief recorded them on 17 November 2026.\n- Who bears the credit loss on an unpaid financing grant is not stated on the pages read for either provider; the chapter says so and does not infer.\n- Stripe's full list of partner banks per product and country, and the bank behind UK and EU financial accounts, is not on any page read.\n- How soon after a sale the funds become spendable on an issued card is not stated on the pages read for either provider; the Larkfield section says so.\n\n## Decision log\n\n- **2026-11-17** — The chapter is sized as a short chapter (six sections, 27 units, about 3,600 words including five tables; the PLAN range for short chapters is 2,000 to 3,000, exceeded because both providers document cards and financing in detail), as PLAN expects, because the account products are in preview or development and the public record holds stages and country lists but no architecture. Rejected: A full-length chapter padded with product features.; Separate sections per product, which would repeat the license and availability points three times.\n- **2026-11-17** — The failure treatment sits inside the sections where the failure arises (the unanswered authorization in the issuing section; the spent balance met by a late refund in the Larkfield section; the preview that changes in the availability section) and not in a separate 'When It Goes Wrong' section, to keep the short chapter at six sections. Rejected: A seventh section restating the three failures.\n- **2026-11-17** — Larkfield's instant-payout card is a proposal of May 2027 declined in June 2027 with four conditions for revisiting, as PLAN states ('decided not to launch yet'); its Stripe studios are legacy Custom connected accounts with no Stripe dashboard, as chapter 33's ledger line fixes them, so Stripe's three conditions are met and the reasons to wait are two programs, exposure, the endpoint and the unfinished account products. Rejected: Inventing a different Stripe configuration for Larkfield than the one chapter 33 specifies.\n- **2026-11-17** — Contrast cases from the brief (Shopify Balance, Mangopay, Unit, PayPal) are left out: none is needed for the argument and the chapter is short. Rejected: A contrast-case paragraph.\n\n## Sources\n\n- **Internal**\n  - _research/brief-platforms-and-embedded-finance.md — Part 4 (license position, accounts, issuing, financing, comparison table), section 1.6 (loss liability and what follows from it), section 3.3 (instant payouts), key numbers and open questions.\n  - _research/brief-ledgers-and-money-movement.md — Stripe's statement on liability for instantly paid out funds.\n  - _research/scenario-ledger.md — Mila's class pass and refund, Larkfield's providers, markets and studio counts, the exposure figure, the cast.\n  - PLAN.md and journal-spec.json (entry embedded-finance, part-7, part-8) — The chapter contract, the copied intent, thesis and role, the part closing and the hand-off to Part VIII.\n- **External**\n  - docs.stripe.com (treasury, treasury/connect, treasury/connect/requirements, treasury/connect/account-management/connected-accounts, financial-accounts/connect, issuing, issuing/connect, issuing/global, issuing/how-issuing-works, issuing/controls/real-time-authorizations, issuing/controls/spending-controls, capital/how-capital-for-platforms-works, connect/risk-management, connect/instant-payouts), fetched by the writer on 2026-11-17 — Every Stripe fact and quotation in the chapter.\n  - docs.adyen.com (business-accounts, business-accounts/get-started, issuing, issuing/authorisation, issuing/authorisation/relayed-authorisation, capital, capital/how-capital-works, platforms, platforms/verification-requirements, platforms/account-structure-resources), fetched by the writer on 2026-11-17 — Every Adyen documentation fact and quotation in the chapter.\n\n## Changelog\n\n- **2026-11-17** — Reconciliation pass (parts 6-8): fields copied from the journal spec and unit-level controlling ideas and evidence brought into line with the verified page and the consistency rulings; no unit added, dropped, merged or reordered.\n- **2026-11-17** — Verification pass: 74 claims checked (64 confirmed, 6 corrected, 4 hedged, 0 unsupported and removed or relabeled, 0 unreachable); the quotation 'You will always be the point of contact for your users' was attributed to Adyen's business-accounts page and is on its Issuing page, Stripe's two Treasury for platforms pages were found to differ on Canada, and both providers' conflicting country lists are now stated in the text instead of resolved. All sources re-fetched on 17 November 2026.\n- **2026-11-17** — Accepted under the author's delegation of 17 November 2026: validates and passed the flow rubric (sound with notes). Notes acted on: the five questions reordered to match the section order; the loss rule in the Larkfield section tied to platform-payment-models. Notes not acted on: the comparison table restates earlier facts (required by the style guide); 'faster payouts' first appears in the decision paragraph.\n- **2026-11-17** — First version, written from the PLAN contract, the journal spec entry and the research briefs.\n- **2026-11-17** — Absence audit: the one absence (the outcome of a webhook error without Autopilot is not stated) re-tested against Stripe's real-time authorizations page and a domain-restricted web search: holds, no change to the page.\n- **2026-11-17** — Visual layer: 3 figures generated and inspected (article-illustrator).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
